<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirit Summoner</title>
    <style>
        :root {
            /* Palette: Deep Void & Arcane Gold */
            --bg-deep: #05020a;
            --bg-void: #140a26;
            
            --gold-primary: #FFD700;
            --gold-highlight: #FFF8DC;
            --gold-shadow: #B8860B;
            
            --stone-dark: #0f0f12;
            --stone-light: #1a1a20;
            
            --magic-cyan: #00f3ff;
            --magic-purple: #bd00ff;
            
            /* Typography */
            --font-display: "Cinzel", "Palatino Linotype", "Times New Roman", serif;
            --font-ui: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: #fff;
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- 1. Background & Atmosphere --- */
        
        /* Deep Space Gradient */
        .bg-gradient {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #2a1b4d 0%, #0f081a 60%, #000000 100%);
            z-index: 0;
        }

        /* Noise Texture for "Grain" */
        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.08;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, #000000 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* --- 2. Layout Hierarchy --- */
        .ui-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        /* --- 3. Header Area --- */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-top: 1rem;
        }

        /* Typography & Title */
        .game-title {
            font-family: var(--font-display);
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: transparent;
            background: linear-gradient(180deg, #FFF8DC 0%, #D4AF37 50%, #8a6e2f 100%);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0px 4px 12px rgba(0,0,0,0.8);
            filter: drop-shadow(0 0 2px rgba(255, 215, 0, 0.3));
            margin: 0;
            line-height: 1;
        }

        .game-subtitle {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        /* Currency Indicator */
        .currency-pill {
            background: rgba(10, 10, 12, 0.8);
            border: 1px solid var(--gold-shadow);
            border-radius: 50px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .currency-pill:hover {
            transform: translateY(-2px);
            border-color: var(--gold-primary);
        }

        .currency-pill::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.1), transparent);
            animation: shimmer 3s infinite;
        }

        .gold-icon {
            width: 16px; height: 16px;
            background: radial-gradient(circle at 30% 30%, #fff, #ffd700, #b8860b);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--gold-primary);
        }

        .gold-text {
            font-family: var(--font-ui);
            font-weight: 700;
            color: #fff;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        /* --- 4. Hero Area: The Summoning Circle --- */
        .hero-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .summoning-circle {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CSS Rings */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 0 15px rgba(100, 50, 200, 0.1);
            transition: all 0.5s ease;
        }

        .ring-outer {
            width: 100%; height: 100%;
            border-style: dashed;
            border-width: 2px;
            animation: spin 60s linear infinite;
        }

        .ring-middle {
            width: 80%; height: 80%;
            border-width: 1px;
            border-color: rgba(0, 243, 255, 0.2);
            border-style: dotted;
            animation: spin-rev 40s linear infinite;
        }

        .ring-inner {
            width: 60%; height: 60%;
            border-width: 4px;
            border-color: rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
            animation: pulse 4s ease-in-out infinite;
        }

        /* Geometric Decorations */
        .rune-ring {
            position: absolute;
            width: 110%; height: 110%;
            border: 1px solid transparent;
            animation: spin 100s linear infinite;
        }
        
        /* SVG overlay for intricate details */
        .circle-svg {
            position: absolute;
            width: 100%; height: 100%;
            fill: none;
            stroke: rgba(255, 215, 0, 0.4);
            stroke-width: 1;
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5));
        }

        /* Central Energy */
        .core-energy {
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse-core 4s ease-in-out infinite;
        }

        /* --- 5. Navigation Cards (Arcane Tablets) --- */
        .nav-area {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            padding-bottom: 2rem;
            perspective: 1000px;
        }

        .nav-card {
            width: 160px;
            height: 200px;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            
            /* Tablet Styling */
            background: linear-gradient(160deg, #1a1a20 0%, #0a0a0c 100%);
            border: 1px solid #333;
            border-top: 2px solid #444;
            border-bottom: 2px solid #000;
            border-radius: 8px;
            
            /* Inner bevel */
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.8),
                0 10px 20px rgba(0,0,0,0.5);
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            overflow: hidden;
        }

        /* Corner Accents */
        .nav-card::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }

        /* Hover Effect: Glow & Lift */
        .nav-card:hover {
            transform: translateY(-10px) scale(1.05);
            border-color: var(--gold-shadow);
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.9),
                0 0 15px rgba(255, 215, 0, 0.2),
                0 15px 30px rgba(0,0,0,0.6);
        }

        .nav-card:hover .card-icon {
            color: var(--gold-primary);
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.6));
            transform: scale(1.1);
        }

        .nav-card:hover .card-title {
            color: var(--gold-highlight);
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }

        /* Specific Card: Summon (Primary) */
        .nav-card.primary {
            width: 180px;
            height: 230px;
            border-color: var(--gold-shadow);
            background: linear-gradient(160deg, #2a2010 0%, #15100a 100%);
            z-index: 2;
        }

        .nav-card.primary::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(255,215,0,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .nav-card.primary:hover::after { opacity: 1; }

        /* Card Content */
        .card-icon {
            width: 48px;
            height: 48px;
            color: #888;
            transition: all 0.3s ease;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: #ccc;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        /* --- Animations --- */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-rev { 100% { transform: rotate(-360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.98); } 50% { opacity: 0.8; transform: scale(1.02); } }
        @keyframes pulse-core { 0%, 100% { transform: scale(0.9); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 0.8; } }
        @keyframes shimmer { 0% { left: -100%; } 100% { left: 100%; } }

        /* --- Responsive --- */
        @media (max-width: 850px) {
            .summoning-circle { width: 350px; height: 350px; }
            .nav-area { gap: 1rem; }
            .nav-card { width: 120px; height: 160px; }
            .nav-card.primary { width: 140px; height: 190px; }
            .card-icon { width: 36px; height: 36px; }
            .game-title { font-size: 1.8rem; }
        }

        @media (max-width: 600px) {
            .ui-container { padding: 1rem; }
            .nav-area { flex-wrap: wrap; justify-content: center; }
            .nav-card { width: 45%; height: 100px; flex-direction: row; padding: 0 1rem; }
            .nav-card.primary { width: 100%; order: -1; margin-bottom: 1rem; height: 110px; }
            .game-title { font-size: 1.5rem; }
            .summoning-circle { width: 280px; height: 280px; }
        }
    </style>
</head>
<body>

    <!-- Background Layers -->
    <div class="bg-gradient"></div>
    <div class="noise-overlay"></div>
    <div class="vignette"></div>
    
    <!-- Canvas for Particles -->
    <canvas id="particle-canvas" style="position: absolute; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none;"></canvas>

    <!-- Main UI Container -->
    <div class="ui-container">

        <!-- Top: Header & Currency -->
        <header class="header-area">
            <div class="title-block">
                <h1 class="game-title">Spirit Summoner</h1>
                <p class="game-subtitle">Awaken the Ancient Bonds</p>
            </div>
            
            <div class="currency-pill">
                <div class="gold-icon"></div>
                <span class="gold-text">12,450</span>
            </div>
        </header>

        <!-- Center: Summoning Circle (Visual Anchor) -->
        <section class="hero-area">
            <div class="summoning-circle">
                <div class="core-energy"></div>
                <div class="ring ring-outer"></div>
                <div class="ring ring-middle"></div>
                <div class="ring ring-inner"></div>
                
                <!-- Decorative SVG Ring -->
                <svg class="circle-svg rune-ring" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="48" stroke-dasharray="2 4" />
                    <path d="M50 2 L50 10 M50 90 L50 98 M2 50 L10 50 M90 50 L98 50" stroke-width="2" />
                    <path d="M20 20 L25 25 M75 75 L80 80 M80 20 L75 25 M25 75 L20 80" stroke-width="1" opacity="0.5" />
                </svg>
            </div>
        </section>

        <!-- Bottom: Navigation Cards -->
        <nav class="nav-area">
            
            <!-- Roster -->
            <div class="nav-card" onclick="handleClick(this)">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <div class="card-title">Roster</div>
            </div>

            <!-- Battle -->
            <div class="nav-card" onclick="handleClick(this)">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5"/>
                    <path d="M13 19l6-6"/>
                    <path d="M16 16l4 4"/>
                    <path d="M19 21l2-2"/>
                </svg>
                <div class="card-title">Battle</div>
            </div>

            <!-- Summon (Primary) -->
            <div class="nav-card primary" onclick="handleClick(this)">
                <svg class="card-icon" viewBox="0 0 24 24" style="color: var(--gold-primary);">
                    <path d="M12 2l-2 7h-7l5.5 4.5-2 7 5.5-4.5 5.5 4.5-2-7 5.5-4.5h-7z"/>
                </svg>
                <div class="card-title">Summon</div>
            </div>

            <!-- Grind -->
            <div class="nav-card" onclick="handleClick(this)">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2c0 0-7 5-7 12 0 3.9 3.1 7 7 7 3.9 0 7-3.1 7-7 0-7-7-12-7-12z"/>
                    <path d="M12 16a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                </svg>
                <div class="card-title">Grind</div>
            </div>

        </nav>
    </div>

    <script>
        // --- Interaction Feedback ---
        function handleClick(el) {
            el.style.transform = "scale(0.95)";
            setTimeout(() => {
                el.style.transform = "";
            }, 150);
        }

        // --- Particle System (Embers) ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : height + 10;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = -(Math.random() * 0.5 + 0.1);
                this.size = Math.random() * 2;
                this.life = Math.random() * 100;
                this.maxLife = 100 + Math.random() * 200;
                
                // Color mix
                const r = Math.random();
                if (r > 0.8) {
                    this.color = `rgba(255, 215, 0, ${Math.random() * 0.8})`; // Gold
                } else {
                    this.color = `rgba(150, 100, 255, ${Math.random() * 0.5})`; // Purple
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life++;
                
                // Sway
                this.x += Math.sin(this.life * 0.05) * 0.2;

                if (this.y < -20 || this.life > this.maxLife) {
                    this.reset();
                }
            }

            draw() {
                ctx.globalAlpha = Math.max(0, 1 - this.life / this.maxLife);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();
    </script>
</body>
</html>
