<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirit Summoning</title>
    <style>
        :root {
            /* Palette */
            --bg-deep: #030305;
            --void-purple: #1a0f2e;
            --void-blue: #0b1026;
            
            /* Refined Gold Accent */
            --gold-main: #FFD700;
            --gold-light: #FFF8DC;
            --gold-dark: #B8860B;
            --gold-glow: rgba(255, 215, 0, 0.6);
            --gold-glow-subtle: rgba(255, 215, 0, 0.2);
            
            /* Glassmorphism */
            --glass-bg: rgba(10, 10, 15, 0.35);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            
            /* Typography */
            --font-display: "Cinzel", "Trajan Pro", "Times New Roman", serif;
            --font-ui: "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: #e0e0e0;
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Background & Atmosphere --- */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* The Void Gradient & Vignette */
        .atmosphere-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Deep Nebula Effect */
            background: 
                radial-gradient(circle at 50% 40%, rgba(30, 20, 60, 0.8) 0%, rgba(10, 15, 30, 0.6) 50%, rgba(3, 3, 5, 1) 100%),
                radial-gradient(circle at 50% 40%, rgba(255, 215, 0, 0.05) 0%, transparent 40%);
            pointer-events: none;
        }

        /* Vignette for text pop */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: radial-gradient(circle, transparent 40%, #000000 100%);
            pointer-events: none;
        }

        /* --- UI Layer --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 2rem 3rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: flex-start; /* Left aligned per request */
            align-items: center;
            height: 80px;
            width: 100%;
        }

        /* Currency Gem */
        .currency-pill {
            background: linear-gradient(135deg, rgba(20, 15, 10, 0.8), rgba(40, 30, 10, 0.6));
            border: 1px solid var(--gold-dark);
            border-top: 1px solid var(--gold-light);
            border-radius: 8px;
            padding: 0.5rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            position: relative;
        }

        .currency-pill:hover {
            border-color: var(--gold-main);
            box-shadow: 0 0 20px var(--gold-glow-subtle), inset 0 1px 0 rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        /* Gem Icon Shape */
        .gold-gem-icon {
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-main), var(--gold-dark));
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            box-shadow: 0 0 5px var(--gold-main);
            position: relative;
        }
        
        .gold-gem-icon::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            background: linear-gradient(45deg, rgba(255,255,255,0.4), transparent);
        }

        .currency-amount {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--gold-light);
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }

        /* --- Main Content --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- Hero Area --- */
        .hero-area {
            text-align: center;
            margin-bottom: 4rem;
            position: relative;
            z-index: 2;
        }

        /* Title: Reduced size, Serif, High Opacity */
        .hero-title {
            font-family: var(--font-display);
            font-size: 3.5rem; /* Reduced from ~5rem */
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 0.5rem;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(255, 255, 255, 0.1);
            background: linear-gradient(to bottom, #ffffff 0%, #dcdcdc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            line-height: 1.1;
        }

        /* Subtitle: Sans-serif, Clean */
        .hero-subtitle {
            font-family: var(--font-ui);
            font-size: 0.9rem;
            color: var(--gold-main);
            text-transform: uppercase;
            letter-spacing: 0.3em;
            opacity: 0.9;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            font-weight: 400;
        }

        /* Arcane Geometry Background (SVG) */
        .arcane-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
            width: 800px;
            height: 800px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
            animation: slow-spin 120s linear infinite;
        }

        /* --- Navigation Grid --- */
        .nav-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
            z-index: 5;
            flex-wrap: wrap;
        }

        /* --- Card Design --- */
        .nav-card {
            /* Glassmorphism */
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            /* Layout */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        /* Standardize Secondary Cards */
        .nav-card.secondary {
            width: 180px;
            height: 240px;
        }

        /* Primary Card (Summon) */
        .nav-card.primary {
            width: 220px; /* Slightly wider */
            height: 280px; /* Slightly taller */
            transform: scale(1.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            background: linear-gradient(180deg, rgba(30, 25, 10, 0.4), rgba(10, 10, 15, 0.5));
            box-shadow: 0 0 25px var(--gold-glow-subtle), 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Hover States */
        .nav-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(20, 20, 30, 0.5);
        }

        .nav-card.primary:hover {
            transform: scale(1.08) translateY(-5px);
            border-color: var(--gold-main);
            box-shadow: 0 0 40px var(--gold-glow), inset 0 0 20px rgba(255, 215, 0, 0.1);
        }

        /* Card Content */
        .card-icon-wrap {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            fill: #fff;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            transition: all 0.3s;
        }

        .nav-card.primary .card-icon {
            width: 56px;
            height: 56px;
            fill: url(#gold-grad);
            filter: drop-shadow(0 0 15px var(--gold-glow));
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.25rem;
            color: #fff;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .nav-card.primary .card-title {
            font-size: 1.5rem;
            color: var(--gold-light);
            text-shadow: 0 0 10px var(--gold-glow);
        }

        .card-subtitle {
            font-family: var(--font-ui);
            font-size: 0.7rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.8;
        }
        
        .nav-card:hover .card-subtitle {
            color: #fff;
            opacity: 1;
        }

        /* --- Animations --- */
        @keyframes slow-spin { 100% { transform: translate(-50%, -60%) rotate(360deg); } }

        /* --- Responsive --- */
        @media (max-width: 1000px) {
            .nav-container { gap: 1rem; }
            .nav-card.secondary { width: 140px; height: 200px; }
            .nav-card.primary { width: 180px; height: 240px; }
            .hero-title { font-size: 2.5rem; }
        }

        @media (max-width: 600px) {
            .ui-layer { padding: 1.5rem; }
            .hero-title { font-size: 2rem; }
            .arcane-bg { width: 500px; height: 500px; }
            .nav-container { flex-direction: column; gap: 1rem; }
            .nav-card.secondary, .nav-card.primary { width: 100%; max-width: 280px; height: 80px; flex-direction: row; justify-content: flex-start; padding: 0 2rem; }
            .card-icon-wrap { margin-bottom: 0; margin-right: 1.5rem; }
            .nav-card.primary:hover { transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <!-- Background Canvas for Particles -->
    <canvas id="canvas-bg"></canvas>
    
    <!-- Atmosphere & Vignette -->
    <div class="atmosphere-layer"></div>
    <div class="vignette"></div>

    <!-- Arcane Geometry SVG Background -->
    <svg class="arcane-bg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="grad-arcane" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1" />
                <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
            </linearGradient>
        </defs>
        <!-- Geometric Rings -->
        <circle cx="50" cy="50" r="45" stroke="url(#grad-arcane)" stroke-width="0.2" stroke-dasharray="0.5 1" />
        <circle cx="50" cy="50" r="35" stroke="url(#grad-arcane)" stroke-width="0.1" />
        <circle cx="50" cy="50" r="25" stroke="url(#grad-arcane)" stroke-width="0.2" stroke-dasharray="2 2" />
        <!-- Hexagon/Star overlay -->
        <polygon points="50,5 93.3,27.5 93.3,72.5 50,95 6.7,72.5 6.7,27.5" stroke="url(#grad-arcane)" stroke-width="0.2" />
        <polygon points="50,15 85,32.5 85,67.5 50,85 15,67.5 15,32.5" stroke="url(#grad-arcane)" stroke-width="0.1" transform="rotate(30 50 50)" />
    </svg>

    <div class="ui-layer">
        <header>
            <!-- Brand Logo removed per critique -->
            
            <!-- Currency Indicator -->
            <div class="currency-pill">
                <div class="gold-gem-icon"></div>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <main class="main-content">
            
            <div class="hero-area">
                <h1 class="hero-title">Spirit Summoning</h1>
                <p class="hero-subtitle">Awaken the ancient bonds</p>
            </div>

            <nav class="nav-container">
                
                <!-- Roster -->
                <div class="nav-card secondary" onclick="interact('roster')">
                    <div class="card-icon-wrap">
                        <!-- Shield Icon (Unified Stroke) -->
                        <svg class="card-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke-linejoin="round"/>
                            <path d="M12 8v4m0 4h.01" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Manage Spirits</div>
                </div>

                <!-- Summon (Primary) -->
                <div class="nav-card primary" onclick="interact('summon')">
                    <div class="card-icon-wrap">
                        <!-- Crystal Icon -->
                        <svg class="card-icon" viewBox="0 0 24 24">
                            <defs>
                                <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#FFF8DC;stop-opacity:1" />
                                    <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
                                </linearGradient>
                            </defs>
                            <path d="M12 2L2 12l10 10 10-10L12 2z" stroke="none" />
                            <path d="M12 22V12" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
                            <path d="M2 12h20" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
                            <path d="M7 7l5 5 5-5" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
                        </svg>
                    </div>
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Call from Void</div>
                </div>

                <!-- Battle -->
                <div class="nav-card secondary" onclick="interact('battle')">
                    <div class="card-icon-wrap">
                        <!-- Sword Icon (Unified Stroke) -->
                        <svg class="card-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none">
                            <path d="M14.5 17.5L3 6V3h3l11.5 11.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M13 19l6-6" stroke-linecap="round"/>
                            <path d="M16 16l4 4" stroke-linecap="round"/>
                            <path d="M19 21l2-2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena of Souls</div>
                </div>

                <!-- Grind -->
                <div class="nav-card secondary" onclick="interact('grind')">
                    <div class="card-icon-wrap">
                        <!-- Flame/Crystal Icon (Unified Stroke) -->
                        <svg class="card-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none">
                            <path d="M12 2c0 0-7 4.5-7 12 0 3.9 3.1 7 7 7 3.9 0 7-3.1 7-7 0-7.5-7-12-7-12z" stroke-linejoin="round"/>
                            <path d="M12 16a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Daily Resources</div>
                </div>

            </nav>
        </main>
    </div>

    <script>
        // --- Canvas Particle System ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Configuration
        const particleCount = 60;
        const connectionDistance = 150;

        // Mouse tracking
        let mouse = { x: null, y: null };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 1.5 + 0.5;
                
                // Gold and Blue mix
                const isGold = Math.random() > 0.85;
                if(isGold) {
                    this.color = `rgba(255, 215, 0, ${Math.random() * 0.5 + 0.2})`;
                } else {
                    this.color = `rgba(200, 220, 255, ${Math.random() * 0.4 + 0.1})`;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off edges
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // Mouse interaction (gentle repulsion)
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 150) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (150 - distance) / 150;
                        this.vx -= forceDirectionX * force * 0.02;
                        this.vy -= forceDirectionY * force * 0.02;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw particles and connections
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        let opacity = 1 - (distance / connectionDistance);
                        ctx.strokeStyle = `rgba(150, 180, 255, ${opacity * 0.05})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(type) {
            console.log(`Interacting with: ${type}`);
            const card = event.currentTarget;
            card.style.transform = "scale(0.96)";
            setTimeout(() => {
                card.style.transform = ""; // Reset handled by CSS hover
            }, 150);
        }
    </script>
</body>
</html>
