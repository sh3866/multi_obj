<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirit Summoning</title>
    <style>
        :root {
            /* Palette - Deep Mystical Void */
            --bg-deep: #030105;
            --void-purple: #1a0b2e;
            --void-blue: #080c14;
            
            /* Gold & Magic */
            --gold-main: #FFD700;
            --gold-dim: #8a6e2f;
            --gold-light: #FFF8DC;
            --gold-glow: rgba(255, 215, 0, 0.6);
            
            /* Glassmorphism & UI */
            --glass-bg: rgba(10, 10, 15, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.08);
            
            /* Typography - System Serif for Offline Reliability */
            --font-display: "Palatino Linotype", "Palatino", "Times New Roman", serif;
            --font-ui: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: #e0e0e0;
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- 1. Background & Atmosphere --- */
        
        /* Deep Void Gradient Base */
        .atmosphere-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: 
                radial-gradient(circle at 50% 40%, #2a1b3d 0%, #0f081a 50%, #000000 100%);
            pointer-events: none;
        }

        /* CSS Noise Texture Overlay */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            opacity: 0.07;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette for depth */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            background: radial-gradient(circle, transparent 40%, #000000 100%);
            pointer-events: none;
        }

        /* --- 2. Layout & Hierarchy --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            width: 100%;
        }

        /* --- 3. Summoning Circle (Background Geometry) --- */
        .ritual-altar {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            pointer-events: none;
            z-index: 4;
            opacity: 0.5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .altar-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 20px rgba(100, 50, 200, 0.05);
        }

        /* Concentric rings with dashed/dotted styles */
        .ring-outer { 
            width: 100%; height: 100%; 
            border-style: dashed; 
            animation: spin 120s linear infinite; 
        }
        .ring-middle { 
            width: 75%; height: 75%; 
            border-width: 2px; 
            border-color: rgba(255, 215, 0, 0.05);
            animation: spin-rev 80s linear infinite; 
        }
        .ring-inner { 
            width: 50%; height: 50%; 
            border-style: dotted; 
            animation: spin 60s linear infinite; 
        }
        
        /* Central Glow behind the main card */
        .altar-core {
            width: 40%; height: 40%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.08) 0%, transparent 70%);
            filter: blur(30px);
            animation: pulse 6s ease-in-out infinite;
        }

        /* --- 4. Typography & Title --- */
        .hero-area {
            position: absolute;
            top: 6vh;
            width: 100%;
            text-align: center;
            z-index: 5;
            pointer-events: none;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: 3rem; /* Reduced size */
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            opacity: 0.85; /* Reduced opacity */
            color: #fff;
            margin-bottom: 0.5rem;
            /* Subtle Gold Gradient Fill */
            background: linear-gradient(to bottom, #ffffff 0%, #e6cfa3 100%);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .hero-subtitle {
            font-family: var(--font-ui);
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.3em;
        }

        /* --- 5. Currency Indicator (Relocated & Styled) --- */
        .currency-pill {
            position: absolute;
            top: -50px; /* Positioned above the main card */
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid var(--gold-dim);
            border-radius: 20px; /* Pill shape */
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            z-index: 20;
            transition: transform 0.3s ease;
        }

        .currency-pill:hover {
            transform: scale(1.05);
            border-color: var(--gold-main);
        }

        .gold-gem-icon {
            width: 14px;
            height: 14px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-main));
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }

        .currency-amount {
            font-family: var(--font-display);
            font-size: 0.95rem;
            color: var(--gold-light);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* --- 6. Navigation Grid & Cards --- */
        .nav-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
            z-index: 10;
            position: relative;
            margin-top: 1rem;
        }

        /* Base Card Styles */
        .nav-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
        }

        /* Secondary Cards (Roster, Battle, Grind) */
        .nav-card.secondary {
            width: 140px;
            height: 190px;
            border-radius: 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .nav-card.secondary:hover {
            transform: translateY(-8px);
            background: rgba(25, 25, 35, 0.6);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        /* Primary Card (Summon - The Artifact) */
        .nav-card.primary {
            width: 240px;
            height: 360px;
            margin: 0 0.5rem;
            border-radius: 16px; /* Elegant rounded rectangle */
            
            /* Glassmorphism + Artifact Styling */
            background: linear-gradient(160deg, rgba(20, 15, 30, 0.7), rgba(5, 5, 10, 0.85));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            
            /* Glowing Gold Border */
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 
                0 0 20px rgba(0,0,0,0.6),
                0 0 15px rgba(255, 215, 0, 0.15), /* Outer Glow */
                inset 0 0 30px rgba(0,0,0,0.8);   /* Inner Shadow for depth */
        }

        .nav-card.primary:hover {
            transform: scale(1.02);
            border-color: var(--gold-main);
            box-shadow: 
                0 0 40px rgba(0,0,0,0.7),
                0 0 25px var(--gold-glow),
                inset 0 0 20px rgba(255, 215, 0, 0.1);
        }

        /* Decorative corner accents for Primary Card */
        .nav-card.primary::before, .nav-card.primary::after {
            content: '';
            position: absolute;
            width: 20px; height: 20px;
            border: 2px solid var(--gold-dim);
            pointer-events: none;
            transition: all 0.3s;
        }
        .nav-card.primary::before { top: 8px; left: 8px; border-right: none; border-bottom: none; border-radius: 4px 0 0 0; }
        .nav-card.primary::after { bottom: 8px; right: 8px; border-left: none; border-top: none; border-radius: 0 0 4px 0; }

        .nav-card.primary:hover::before, .nav-card.primary:hover::after {
            border-color: var(--gold-light);
            width: 30px; height: 30px;
        }

        /* --- 7. Iconography & Card Content --- */
        .card-icon-wrap {
            margin-bottom: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: #d0d0d0;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: all 0.3s;
        }

        /* Primary Card Icon Specifics */
        .nav-card.primary .card-icon {
            width: 64px;
            height: 64px;
            stroke: url(#gold-grad); /* Gradient Stroke */
            stroke-width: 1.2;
            filter: drop-shadow(0 0 10px var(--gold-glow));
            animation: float 4s ease-in-out infinite;
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: #fff;
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .nav-card.primary .card-title {
            font-size: 1.6rem;
            color: var(--gold-light);
            letter-spacing: 0.1em;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .card-subtitle {
            font-family: var(--font-ui);
            font-size: 0.65rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            opacity: 0.7;
        }
        
        .nav-card:hover .card-subtitle {
            color: #fff;
            opacity: 1;
        }

        /* --- Animations --- */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-rev { 100% { transform: rotate(-360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.4; transform: scale(0.95); } 50% { opacity: 0.7; transform: scale(1.05); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .nav-container { flex-wrap: wrap; gap: 1.5rem; }
            .nav-card.primary { order: -1; margin-bottom: 1rem; }
            .ritual-altar { width: 500px; height: 500px; }
        }

        @media (max-width: 600px) {
            .ui-layer { padding: 1rem; }
            .hero-title { font-size: 2rem; }
            .nav-container { flex-direction: column; align-items: center; }
            .nav-card.secondary, .nav-card.primary { 
                width: 100%; max-width: 280px; 
                height: 80px; 
                flex-direction: row; 
                justify-content: flex-start; 
                padding: 0 1.5rem;
                border-radius: 12px;
            }
            .nav-card.primary {
                border: 1px solid var(--gold-dim);
                background: linear-gradient(90deg, rgba(30,20,10,0.8), rgba(10,5,15,0.9));
            }
            .card-icon-wrap { margin-bottom: 0; margin-right: 1.5rem; }
            .card-title { font-size: 1rem; margin-bottom: 0; }
            .card-subtitle { display: none; }
            .currency-pill { top: -40px; }
            .nav-card.primary::before, .nav-card.primary::after { display: none; } /* Simplify corners on mobile */
        }
    </style>
</head>
<body>

    <!-- Background Canvas for Particles -->
    <canvas id="canvas-bg"></canvas>
    
    <!-- Atmosphere Layers -->
    <div class="atmosphere-layer"></div>
    <div class="noise-overlay"></div>
    <div class="vignette"></div>

    <!-- 1. Ritual Altar (CSS Summoning Circle) -->
    <div class="ritual-altar">
        <div class="altar-core"></div>
        <div class="altar-ring ring-outer"></div>
        <div class="altar-ring ring-middle"></div>
        <div class="altar-ring ring-inner"></div>
    </div>

    <div class="ui-layer">
        
        <!-- 2. Title Top Center -->
        <div class="hero-area">
            <h1 class="hero-title">Spirit Summoning</h1>
            <p class="hero-subtitle">Awaken the ancient bonds</p>
        </div>

        <!-- 3. Restructured Layout -->
        <nav class="nav-container">
            
            <!-- Secondary: Roster -->
            <div class="nav-card secondary" onclick="interact('roster')">
                <div class="card-icon-wrap">
                    <!-- Stylized Shield/Book -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M4 4h16v16H4z" fill="none" stroke-opacity="0.5"/>
                        <path d="M4 4l8 4 8-4" stroke-linecap="round"/>
                        <path d="M12 8v12" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Manage Spirits</div>
            </div>

            <!-- Primary: Summon (Visual Anchor) -->
            <div class="nav-card primary" onclick="interact('summon')">
                <!-- Relocated Currency Indicator -->
                <div class="currency-pill">
                    <div class="gold-gem-icon"></div>
                    <span class="currency-amount">12,450</span>
                </div>

                <div class="card-icon-wrap">
                    <!-- Rune Crystal/Portal -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FFF8DC;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <path d="M12 2L2 12l10 10 10-10L12 2z" stroke-linejoin="round" />
                        <path d="M12 22V12" />
                        <path d="M2 12h20" />
                        <path d="M7 7l5 5 5-5" />
                    </svg>
                </div>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Call from Void</div>
            </div>

            <!-- Secondary: Battle -->
            <div class="nav-card secondary" onclick="interact('battle')">
                <div class="card-icon-wrap">
                    <!-- Stylized Sword -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M14.5 17.5L3 6V3h3l11.5 11.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M13 19l6-6" stroke-linecap="round"/>
                        <path d="M16 16l4 4" stroke-linecap="round"/>
                        <path d="M19 21l2-2" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena of Souls</div>
            </div>

            <!-- Secondary: Grind -->
            <div class="nav-card secondary" onclick="interact('grind')">
                <div class="card-icon-wrap">
                    <!-- Stylized Flame/Drop -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12 2c0 0-7 4.5-7 12 0 3.9 3.1 7 7 7 3.9 0 7-3.1 7-7 0-7.5-7-12-7-12z" stroke-linejoin="round"/>
                        <path d="M12 16a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Daily Resources</div>
            </div>

        </nav>
    </div>

    <script>
        // --- Canvas Particle System (Embers) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // Configuration
        const particleCount = 60;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : height + 10;
                this.vx = (Math.random() - 0.5) * 0.3; // Slow drift
                this.vy = -(Math.random() * 0.8 + 0.2); // Float up
                
                this.size = Math.random() * 1.5 + 0.5;
                this.life = 0;
                this.maxLife = Math.random() * 300 + 100;
                
                // Gold and Purple mix
                const type = Math.random();
                if(type > 0.85) {
                    // Gold Ember (Rare, Bright)
                    this.color = `rgba(255, 215, 0, ${Math.random() * 0.6 + 0.2})`;
                    this.glow = true;
                } else if (type > 0.6) {
                    // Purple Mist (Common)
                    this.color = `rgba(150, 100, 255, ${Math.random() * 0.3})`;
                    this.size *= 2; // Larger, softer
                    this.glow = false;
                } else {
                    // White/Grey Ash (Dust)
                    this.color = `rgba(200, 200, 200, ${Math.random() * 0.2})`;
                    this.glow = false;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life++;

                // Gentle Sine wave drift
                this.x += Math.sin(this.life * 0.02) * 0.1;

                if (this.y < -10 || this.life > this.maxLife) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                
                if (this.glow) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "rgba(255, 215, 0, 0.5)";
                } else {
                    ctx.shadowBlur = 0;
                }
                
                ctx.fill();
                ctx.shadowBlur = 0; // Reset
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', () => {
            resize();
        });
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(type) {
            const card = event.currentTarget;
            // Simple scale down effect
            card.style.transform = "scale(0.96)";
            setTimeout(() => {
                card.style.transform = ""; 
            }, 150);
        }
    </script>
</body>
</html>
