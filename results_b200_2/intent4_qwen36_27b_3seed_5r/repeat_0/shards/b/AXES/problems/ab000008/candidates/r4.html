<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --bg-dark: #050011;
            --neon-pink: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-yellow: #ffee00;
            --white: #ffffff;
            --grid-line: rgba(188, 19, 254, 0.4);
            --font-stack: 'Courier New', monospace; /* System fallback, styled to look pixelated */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--white);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: var(--font-stack);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Critical for retro feel */
            image-rendering: pixelated;
        }

        /* --- CANVAS BACKGROUND --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- MAIN UI CONTAINER --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to interactive elements */
        }

        .interactive {
            pointer-events: auto;
        }

        /* --- PIXEL TITLE --- */
        .title-container {
            position: absolute;
            top: 8vh;
            text-align: center;
            z-index: 20;
            filter: drop-shadow(0 0 10px var(--neon-pink));
        }

        .pixel-title {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: var(--white);
            /* CSS trick to make standard fonts look blocky/pixelated */
            text-shadow: 
                4px 4px 0px var(--neon-purple),
                -2px -2px 0px var(--neon-cyan);
            position: relative;
        }

        /* Glitch Animation for Title */
        .pixel-title::before,
        .pixel-title::after {
            content: "PIXEL DANCE";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
        }
        
        .pixel-title::before {
            left: 2px;
            text-shadow: -2px 0 var(--neon-pink);
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        .pixel-title::after {
            left: -2px;
            text-shadow: -2px 0 var(--neon-cyan);
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 30px, 0); transform: skew(0.5deg); }
            5% { clip: rect(70px, 9999px, 90px, 0); transform: skew(0.5deg); }
            10% { clip: rect(30px, 9999px, 10px, 0); transform: skew(0.5deg); }
            15% { clip: rect(90px, 9999px, 100px, 0); transform: skew(0.5deg); }
            20% { clip: rect(10px, 9999px, 80px, 0); transform: skew(0.5deg); }
            100% { clip: rect(10px, 9999px, 80px, 0); transform: skew(0.5deg); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(60px, 9999px, 80px, 0); transform: skew(0.5deg); }
            5% { clip: rect(10px, 9999px, 20px, 0); transform: skew(0.5deg); }
            10% { clip: rect(50px, 9999px, 60px, 0); transform: skew(0.5deg); }
            15% { clip: rect(20px, 9999px, 30px, 0); transform: skew(0.5deg); }
            20% { clip: rect(80px, 9999px, 90px, 0); transform: skew(0.5deg); }
            100% { clip: rect(80px, 9999px, 90px, 0); transform: skew(0.5deg); }
        }

        /* --- 3D HIGHWAY PREVIEW --- */
        /* This creates the distinct game mechanic preview */
        .highway-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 40vh;
            perspective: 800px;
            margin-top: 20vh; /* Push below title */
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .highway-road {
            width: 400px;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(60deg) translateY(-100px); /* Perspective tilt */
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(188, 19, 254, 0.1) 100%);
            border-left: 4px solid var(--neon-cyan);
            border-right: 4px solid var(--neon-cyan);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.2);
            /* Fade out top (horizon) */
            mask-image: linear-gradient(to bottom, transparent 0%, black 20%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%);
        }

        /* Lane Dividers */
        .lane-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 4px;
            background: repeating-linear-gradient(
                to bottom,
                var(--neon-purple) 0,
                var(--neon-purple) 20px,
                transparent 20px,
                transparent 40px
            );
            opacity: 0.6;
        }
        .lane-marker:nth-child(1) { left: 25%; }
        .lane-marker:nth-child(2) { left: 50%; }
        .lane-marker:nth-child(3) { left: 75%; }

        /* Hit Line (Judgment Zone) */
        .hit-line {
            position: absolute;
            bottom: 50px;
            left: -10px;
            right: -10px;
            height: 8px;
            background: var(--white);
            box-shadow: 0 0 20px var(--white), 0 0 40px var(--neon-cyan);
            z-index: 10;
            border-radius: 2px;
        }
        
        /* Hit Line Label */
        .hit-line::after {
            content: "HIT";
            position: absolute;
            right: -40px;
            top: -18px;
            font-size: 12px;
            color: var(--white);
            font-weight: bold;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        /* Notes */
        .note {
            position: absolute;
            width: 60px;
            height: 20px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
            box-shadow: 0 0 15px currentColor;
            /* Pixelated look for notes */
            image-rendering: pixelated;
        }

        /* Lane Colors */
        .note.lane-0 { background: var(--neon-pink); color: var(--neon-pink); left: 12.5%; }
        .note.lane-1 { background: var(--neon-cyan); color: var(--neon-cyan); left: 37.5%; }
        .note.lane-2 { background: var(--neon-yellow); color: var(--neon-yellow); left: 62.5%; }
        .note.lane-3 { background: var(--neon-purple); color: var(--neon-purple); left: 87.5%; }

        /* --- START BUTTON --- */
        .btn-container {
            position: absolute;
            bottom: 10vh;
            z-index: 30;
        }

        .btn-start {
            position: relative;
            background: rgba(0, 0, 0, 0.6);
            color: var(--neon-yellow);
            font-family: var(--font-stack);
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px;
            padding: 1.2rem 4rem;
            border: 4px solid var(--neon-yellow);
            cursor: pointer;
            overflow: hidden;
            transition: all 0.2s;
            
            /* Retro Bevel/Chromatic Look */
            box-shadow: 
                4px 4px 0px var(--neon-pink), 
                -2px -2px 0px var(--neon-cyan);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        .btn-start:hover {
            transform: translate(-2px, -2px);
            box-shadow: 
                6px 6px 0px var(--neon-pink), 
                -4px -4px 0px var(--neon-cyan);
            background: rgba(255, 238, 0, 0.1);
        }

        .btn-start:active {
            transform: translate(2px, 2px);
            box-shadow: 
                0px 0px 0px var(--neon-pink), 
                0px 0px 0px var(--neon-cyan);
        }

        /* Button Scanline overlay */
        .btn-start::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2) 100%
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* --- CRT OVERLAYS --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.3) 2px,
                rgba(0,0,0,0.3) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.6;
        }
        
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* Noise Texture */
        .noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 98;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

    </style>
</head>
<body>

    <!-- Background Renderer -->
    <canvas id="bg-canvas"></canvas>

    <!-- UI Layer -->
    <div class="ui-layer">
        
        <!-- Stylized Title -->
        <div class="title-container">
            <div class="pixel-title">PIXEL DANCE</div>
        </div>

        <!-- 3D Highway Preview -->
        <div class="highway-container">
            <div class="highway-road" id="road">
                <!-- Lane Dividers -->
                <div class="lane-marker"></div>
                <div class="lane-marker"></div>
                <div class="lane-marker"></div>
                
                <!-- Hit Line -->
                <div class="hit-line"></div>
                
                <!-- Notes will be injected here via JS -->
            </div>
        </div>

        <!-- Call to Action -->
        <div class="btn-container interactive">
            <button class="btn-start" id="startBtn">START GAME</button>
        </div>
    </div>

    <!-- CRT Effects -->
    <div class="noise"></div>
    <div class="vignette"></div>
    <div class="scanlines"></div>

    <script>
        /**
         * BACKGROUND RENDERER
         * Draws the Synthwave Sun and Grid Floor.
         */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            ctx.imageSmoothingEnabled = false;
        }
        window.addEventListener('resize', resize);
        resize();

        // Animation State
        let gridOffset = 0;
        const gridSpeed = 4; // Faster for energy
        const starCount = 150;
        const stars = [];
        
        // Initialize Stars
        for(let i=0; i<starCount; i++) {
            stars.push({
                x: Math.random() * 2000,
                y: Math.random() * 1000,
                size: Math.random() > 0.95 ? 2 : 1,
                speed: Math.random() * 3 + 1
            });
        }

        function drawBackground() {
            // 1. Clear
            ctx.fillStyle = '#050011';
            ctx.fillRect(0, 0, width, height);

            // 2. Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                star.y += star.speed;
                if(star.y > height * 0.5) star.y = 0; // Keep stars in sky
                ctx.fillRect(Math.floor(star.x % width), Math.floor(star.y), star.size, star.size);
            });

            // 3. Synthwave Sun
            const sunSize = Math.min(width, height) * 0.25;
            const sunY = height * 0.35;
            const sunX = width / 2;
            
            // Sun Gradient
            const grad = ctx.createLinearGradient(0, sunY - sunSize, 0, sunY + sunSize);
            grad.addColorStop(0, '#ffff00');
            grad.addColorStop(0.4, '#ff0055');
            grad.addColorStop(1, '#bc13fe');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunSize, 0, Math.PI * 2);
            ctx.fill();

            // Sun Glow
            ctx.shadowBlur = 50;
            ctx.shadowColor = '#ff0055';
            ctx.fill();
            ctx.shadowBlur = 0; // Reset

            // Sun Stripes (Cutouts)
            ctx.fillStyle = '#050011'; // Match bg
            const stripeCount = 10;
            for(let i=0; i<stripeCount; i++) {
                // Calculate Y position based on circle geometry roughly
                const y = sunY + (i * (sunSize/stripeCount)) - (sunSize/2);
                const h = 4 + i*2.5; // Increasing height
                if(y > sunY) {
                    // Draw stripe only if it's within the circle bounds roughly
                    ctx.fillRect(sunX - sunSize, y, sunSize*2, h);
                }
            }

            // 4. Grid Floor
            ctx.save();
            // Clip to bottom half (Horizon)
            const horizonY = height * 0.5;
            ctx.beginPath();
            ctx.rect(0, horizonY, width, height * 0.5);
            ctx.clip();

            ctx.strokeStyle = 'rgba(188, 19, 254, 0.5)';
            ctx.lineWidth = 2;
            
            // Vertical Lines (Perspective)
            const centerX = width / 2;
            // More lines for wider screens
            const lineCount = 20;
            for(let i = -lineCount; i <= lineCount; i++) {
                ctx.beginPath();
                ctx.moveTo(centerX, horizonY);
                // Fan out to bottom
                ctx.lineTo(centerX + (i * 150), height);
                ctx.stroke();
            }

            // Horizontal Lines (Moving)
            gridOffset = (gridOffset + gridSpeed) % 40;
            // Logarithmic spacing for perspective
            for(let i = 0; i < 20; i++) {
                const t = i / 20;
                const perspectiveY = horizonY + (Math.pow(t, 2) * (height - horizonY));
                
                // Offset for animation
                const animY = perspectiveY + gridOffset;

                if(animY < height) {
                    ctx.beginPath();
                    ctx.moveTo(0, animY);
                    ctx.lineTo(width, animY);
                    ctx.stroke();
                }
            }
            ctx.restore();
            
            requestAnimationFrame(drawBackground);
        }
        drawBackground();


        /**
         * HIGHWAY LOGIC
         * Spawns notes falling down the 3D road.
         */
        const road = document.getElementById('road');
        
        function spawnNote() {
            const laneIndex = Math.floor(Math.random() * 4);
            const note = document.createElement('div');
            note.classList.add('note', `lane-${laneIndex}`);
            
            // Initial position (top of road, visually far away)
            // We use CSS animation for the fall
            const duration = 1.5 + Math.random() * 0.5;
            note.style.transition = `top ${duration}s linear`;
            note.style.top = '-20px';
            
            road.appendChild(note);

            // Trigger reflow
            note.offsetHeight; 

            // Animate to bottom
            note.style.top = '100%';

            // Cleanup
            setTimeout(() => {
                if(note.parentNode) note.remove();
            }, duration * 1000);
        }

        // Rhythmic Spawning
        setInterval(() => {
            spawnNote();
            // Occasional double note
            if(Math.random() > 0.8) setTimeout(spawnNote, 100);
        }, 500);


        /**
         * INTERACTION
         */
        const startBtn = document.getElementById('startBtn');
        startBtn.addEventListener('click', () => {
            // Visual feedback
            startBtn.innerText = "LOADING...";
            startBtn.style.borderColor = "var(--white)";
            startBtn.style.color = "var(--white)";
            
            // Simulate loading
            setTimeout(() => {
                alert("GAME STARTING...");
                startBtn.innerText = "START GAME";
                startBtn.style.borderColor = "var(--neon-yellow)";
                startBtn.style.color = "var(--neon-yellow)";
            }, 800);
        });

    </script>
</body>
</html>
