<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --bg-dark: #050011;
            --bg-gradient: linear-gradient(to bottom, #050011 0%, #180022 100%);
            
            /* Synthwave Palette */
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffff00;
            --neon-purple: #bc13fe;
            --white: #ffffff;
            --black: #000000;
            
            /* Grid & UI */
            --grid-line: rgba(188, 19, 254, 0.3);
            --pixel-size: 4px; /* Base unit for pixel scaling */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* CRITICAL: Force pixelated rendering for all elements */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            background-color: var(--bg-dark);
            background-image: var(--bg-gradient);
            color: var(--white);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace; /* Fallback */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- BACKGROUND LAYERS --- */
        
        /* 1. Stars Canvas */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 2. Pixel Sun */
        .sun-container {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            z-index: 2;
            /* Pixelated Sun Shape using Clip Path */
            clip-path: polygon(
                20% 0%, 80% 0%, 
                100% 20%, 100% 80%, 
                80% 100%, 20% 100%, 
                0% 80%, 0% 20%
            );
            background: linear-gradient(to bottom, var(--neon-yellow) 0%, var(--neon-pink) 100%);
            box-shadow: 0 0 20px var(--neon-pink);
        }

        /* Sun Stripes (Pixelated) */
        .sun-stripes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0%,
                transparent 40%,
                var(--bg-dark) 40%,
                var(--bg-dark) 50%,
                transparent 50%,
                transparent 70%,
                var(--bg-dark) 70%,
                var(--bg-dark) 75%,
                transparent 75%
            );
            /* Mask to match sun shape */
            clip-path: polygon(
                20% 0%, 80% 0%, 
                100% 20%, 100% 80%, 
                80% 100%, 20% 100%, 
                0% 80%, 0% 20%
            );
        }

        /* 3. 3D Grid Floor */
        .floor-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200vw;
            height: 50vh;
            perspective: 400px;
            z-index: 3;
            overflow: hidden;
        }

        .floor-grid {
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(transparent 0%, var(--bg-dark) 100%),
                linear-gradient(90deg, var(--grid-line) 2px, transparent 2px),
                linear-gradient(0deg, var(--grid-line) 2px, transparent 2px);
            background-size: 100% 100%, 60px 60px, 60px 60px;
            transform: rotateX(60deg);
            transform-origin: bottom center;
            animation: gridScroll 1s linear infinite;
            /* Vignette to fade edges */
            mask-image: linear-gradient(to bottom, transparent 0%, black 40%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 40%);
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 0 60px; }
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            /* Tight spacing to group elements */
            gap: 2rem; 
        }

        /* 1. Title */
        .title-box {
            margin-top: -2rem; /* Pull up towards sun */
            position: relative;
        }

        h1 {
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: clamp(3rem, 8vw, 6rem);
            line-height: 1;
            text-transform: uppercase;
            color: var(--white);
            text-align: center;
            /* Hard Pixel Shadow instead of blur */
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                8px 8px 0px var(--neon-cyan);
            animation: titlePulse 2s infinite;
            letter-spacing: -2px;
        }
        
        h1 span {
            color: var(--neon-yellow);
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* 2. Highway Preview (The "Game Identity") */
        .highway-wrapper {
            position: relative;
            width: clamp(280px, 40vw, 400px);
            height: 180px;
            background: rgba(0, 0, 0, 0.4);
            border: 4px solid var(--neon-cyan);
            /* Hard pixel corners */
            box-shadow: 8px 8px 0px rgba(0,0,0,0.5); 
            overflow: hidden;
            display: flex;
        }

        .lane {
            flex: 1;
            border-right: 2px dashed rgba(255, 255, 255, 0.2);
            position: relative;
        }
        .lane:last-child { border-right: none; }

        /* The Hit Line */
        .hit-line {
            position: absolute;
            bottom: 10%;
            left: 0;
            width: 100%;
            height: 6px; /* Pixelated thickness */
            background: var(--white);
            box-shadow: 0 0 0 2px var(--black); /* Outline */
            z-index: 5;
        }

        /* Falling Notes */
        .note {
            position: absolute;
            width: 80%;
            left: 10%;
            height: 24px;
            /* No border radius - strict rectangles */
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }

        /* Lane Specific Colors */
        .lane:nth-child(1) .note { background: #ff0055; border: 2px solid white; }
        .lane:nth-child(2) .note { background: #00ffff; border: 2px solid white; }
        .lane:nth-child(3) .note { background: #00ff00; border: 2px solid white; }
        .lane:nth-child(4) .note { background: #ffff00; border: 2px solid white; }

        /* Animation for notes */
        @keyframes noteFall {
            0% { top: -24px; opacity: 0; }
            10% { opacity: 1; }
            100% { top: 110%; opacity: 1; }
        }

        /* 3. Action Button */
        .btn-start {
            background: var(--black);
            color: var(--neon-yellow);
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 1.5rem;
            text-transform: uppercase;
            padding: 1rem 3rem;
            border: 4px solid var(--neon-yellow);
            cursor: pointer;
            position: relative;
            letter-spacing: 2px;
            /* Hard shadow instead of glow */
            box-shadow: 6px 6px 0px var(--neon-pink); 
            transition: transform 0.1s, box-shadow 0.1s;
            z-index: 20;
        }

        .btn-start:hover {
            background: var(--neon-yellow);
            color: var(--black);
            box-shadow: 2px 2px 0px var(--neon-pink);
            transform: translate(4px, 4px);
        }

        .btn-start:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px var(--neon-pink);
        }

        /* --- SCANLINES OVERLAY --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.4) 50%,
                rgba(0,0,0,0.4)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.8;
        }

        /* CRT Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 99;
        }

    </style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="starfield"></canvas>
    
    <div class="sun-container">
        <div class="sun-stripes"></div>
    </div>

    <div class="floor-container">
        <div class="floor-grid"></div>
    </div>

    <!-- UI Layer -->
    <div class="ui-layer">
        
        <div class="title-box">
            <h1>PIXEL <span>DANCE</span></h1>
        </div>

        <!-- Highway Preview -->
        <div class="highway-wrapper" id="highway">
            <div class="hit-line"></div>
            <!-- Lanes -->
            <div class="lane"></div>
            <div class="lane"></div>
            <div class="lane"></div>
            <div class="lane"></div>
        </div>

        <button class="btn-start" id="startBtn">START GAME</button>
    </div>

    <!-- Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        /**
         * 1. Starfield Logic
         * Renders square stars to maintain the pixel aesthetic.
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        
        // Disable smoothing for crisp pixels
        ctx.imageSmoothingEnabled = false;

        let width, height;
        let stars = [];
        const starCount = 80;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                // If initial, scatter vertically. If reset, start at top.
                this.y = initial ? Math.random() * height : -20;
                
                // Varying speeds for depth
                this.speed = Math.random() * 3 + 0.5; 
                
                // Pixelated size (1px or 2px)
                this.size = Math.random() > 0.8 ? 2 : 1;
                
                // Colors: mostly white, some cyan/pink
                const rand = Math.random();
                if (rand > 0.9) this.color = '#ff00ff';
                else if (rand > 0.8) this.color = '#00ffff';
                else this.color = '#ffffff';
            }

            update() {
                this.y += this.speed;
                if (this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                // Draw a perfect square
                ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        resize();
        initStars();
        animateStars();


        /**
         * 2. Highway Note Spawner
         * Creates DOM elements for notes to keep them crisp and styled via CSS.
         */
        const highway = document.getElementById('highway');
        const lanes = highway.querySelectorAll('.lane');

        function spawnNote() {
            // Pick a random lane
            const laneIndex = Math.floor(Math.random() * lanes.length);
            const lane = lanes[laneIndex];

            // Create Note Element
            const note = document.createElement('div');
            note.classList.add('note');
            
            // Randomize animation duration slightly for rhythm feel
            const duration = (Math.random() * 0.5 + 1.0).toFixed(2); // 1s to 1.5s
            note.style.animation = `noteFall ${duration}s linear forwards`;

            lane.appendChild(note);

            // Cleanup after animation
            setTimeout(() => {
                if (note.parentNode) {
                    note.remove();
                }
            }, duration * 1000);
        }

        // Spawn notes at irregular intervals to simulate rhythm
        function gameLoop() {
            spawnNote();
            // Random interval between 200ms and 600ms
            const nextSpawn = Math.random() * 400 + 200;
            setTimeout(gameLoop, nextSpawn);
        }

        // Start the note loop
        gameLoop();


        /**
         * 3. Glitch Effect on Title
         * Simple JS to trigger CSS glitch or offset on hover
         */
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');

        btn.addEventListener('mouseenter', () => {
            // Glitch effect via text-shadow offset
            const offsetX = (Math.random() * 10 - 5).toFixed(0);
            const offsetY = (Math.random() * 10 - 5).toFixed(0);
            title.style.textShadow = `
                ${offsetX}px ${offsetY}px 0px var(--neon-pink),
                ${offsetX * -1}px ${offsetY * -1}px 0px var(--neon-cyan)
            `;
            title.style.transform = 'skewX(10deg)';
        });

        btn.addEventListener('mouseleave', () => {
            title.style.textShadow = '4px 4px 0px var(--neon-pink), 8px 8px 0px var(--neon-cyan)';
            title.style.transform = 'skewX(0deg)';
        });

    </script>
</body>
</html>
