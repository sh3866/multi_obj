<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - REMIX</title>
    <style>
        :root {
            --bg-color: #0a0014;
            --grid-color: #ff0055;
            --grid-dim: rgba(255, 0, 85, 0.15);
            --lane-1: #ff0055; /* Pink */
            --lane-2: #00f3ff; /* Cyan */
            --lane-3: #ffee00; /* Yellow */
            --lane-4: #bc13fe; /* Purple */
            --sun-top: #ffeb3b;
            --sun-bot: #ff0055;
            --ui-border: #ffffff;
            --font-pixel: 'Courier New', Courier, monospace; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--ui-border);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: var(--font-pixel);
            /* Enforce pixelated rendering for crisp edges */
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        /* --- LAYOUT STACK --- */
        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* --- CANVAS BACKGROUND --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- TITLE SECTION --- */
        .title-area {
            position: relative;
            z-index: 10;
            margin-top: 6vh;
            text-align: center;
            width: 100%;
        }

        .pixel-title {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            line-height: 1;
            /* Hard pixel shadow instead of soft blur */
            text-shadow: 
                4px 4px 0px var(--lane-4), 
                -2px -2px 0px var(--lane-2);
            position: relative;
            display: inline-block;
        }

        /* Retro Glitch Effect using pure CSS clip-paths */
        .pixel-title::before,
        .pixel-title::after {
            content: "PIXEL DANCE";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            opacity: 0.8;
        }

        .pixel-title::before {
            color: var(--lane-1);
            z-index: -1;
            transform: translate(-4px, 0);
            clip-path: inset(0 0 60% 0);
            animation: glitch-1 2.5s infinite steps(2) alternate-reverse;
        }

        .pixel-title::after {
            color: var(--lane-2);
            z-index: -1;
            transform: translate(4px, 0);
            clip-path: inset(40% 0 0 0);
            animation: glitch-2 3s infinite steps(2) alternate-reverse;
        }

        @keyframes glitch-1 {
            0% { clip-path: inset(20% 0 60% 0); transform: translate(-4px, 0); }
            20% { clip-path: inset(10% 0 70% 0); transform: translate(4px, 0); }
            40% { clip-path: inset(50% 0 20% 0); transform: translate(-4px, 0); }
            60% { clip-path: inset(30% 0 40% 0); transform: translate(4px, 0); }
            80% { clip-path: inset(10% 0 80% 0); transform: translate(-2px, 0); }
            100% { clip-path: inset(40% 0 30% 0); transform: translate(2px, 0); }
        }

        @keyframes glitch-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(4px, 0); }
            20% { clip-path: inset(80% 0 5% 0); transform: translate(-4px, 0); }
            40% { clip-path: inset(40% 0 40% 0); transform: translate(4px, 0); }
            60% { clip-path: inset(5% 0 80% 0); transform: translate(-4px, 0); }
            80% { clip-path: inset(60% 0 20% 0); transform: translate(2px, 0); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(-2px, 0); }
        }

        /* --- GAMEPLAY PREVIEW (HIGHWAY) --- */
        .highway-container {
            position: relative;
            z-index: 10;
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            perspective: 600px; /* Strong perspective */
            margin-top: 2vh;
            overflow: hidden;
        }

        /* The 3D Plane */
        .highway-plane {
            width: 100%;
            max-width: 600px;
            height: 100%;
            transform-style: preserve-3d;
            transform: rotateX(60deg) translateY(-50px) scale(1.1);
            position: relative;
            /* Fade out the top of the plane */
            mask-image: linear-gradient(to bottom, transparent 0%, black 30%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%);
        }

        /* The Road Surface */
        .road-surface {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 0, 20, 0.85);
            border-left: 4px solid var(--lane-2);
            border-right: 4px solid var(--lane-2);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.3);
            display: flex;
        }

        /* Distinct Lanes */
        .lane {
            flex: 1;
            height: 100%;
            position: relative;
            border-right: 2px dashed rgba(255,255,255,0.2);
        }
        .lane:last-child { border-right: none; }
        
        /* Lane Floor Highlights */
        .lane:nth-child(1) { background: linear-gradient(to bottom, transparent 60%, rgba(255,0,85,0.1)); }
        .lane:nth-child(2) { background: linear-gradient(to bottom, transparent 60%, rgba(0,243,255,0.1)); }
        .lane:nth-child(3) { background: linear-gradient(to bottom, transparent 60%, rgba(255,238,0,0.1)); }
        .lane:nth-child(4) { background: linear-gradient(to bottom, transparent 60%, rgba(188,19,254,0.1)); }

        /* Hit Line */
        .hit-zone {
            position: absolute;
            bottom: 15%; /* Closer to player */
            left: -10px;
            right: -10px;
            height: 12px;
            background: var(--ui-border);
            box-shadow: 0 0 15px #fff, 0 0 30px var(--lane-2);
            z-index: 20;
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
        }

        /* Notes */
        .note {
            position: absolute;
            width: 80%;
            left: 10%;
            height: 24px;
            border-radius: 4px;
            box-shadow: 0 0 10px currentColor;
            opacity: 0.9;
            /* Pixelated look */
            image-rendering: pixelated;
        }
        /* Note shapes */
        .note::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            background: rgba(255,255,255,0.4);
            clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%);
        }

        /* --- START BUTTON --- */
        .cta-container {
            position: absolute;
            bottom: 5vh;
            z-index: 30;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .btn-start {
            background: #000;
            color: var(--lane-3);
            font-family: var(--font-pixel);
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 1rem 3rem;
            border: 4px solid var(--lane-3);
            cursor: pointer;
            position: relative;
            transition: transform 0.1s;
            box-shadow: 
                0 0 0 4px #000, /* Outer spacing */
                6px 6px 0px var(--lane-1); /* Hard shadow */
        }

        .btn-start:hover {
            transform: translate(-2px, -2px);
            box-shadow: 
                0 0 0 4px #000,
                8px 8px 0px var(--lane-1);
            background: #111;
            text-shadow: 0 0 8px var(--lane-3);
        }

        .btn-start:active {
            transform: translate(4px, 4px);
            box-shadow: 
                0 0 0 4px #000,
                0px 0px 0px var(--lane-1);
        }

        /* --- CRT OVERLAYS --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.2) 2px,
                rgba(0,0,0,0.2) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.6;
        }
        
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 99;
        }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- Background Renderer -->
        <canvas id="bg-canvas"></canvas>

        <!-- 1. Title (Top) -->
        <div class="title-area">
            <div class="pixel-title">PIXEL DANCE</div>
        </div>

        <!-- 2. Gameplay Preview (Center) -->
        <div class="highway-container">
            <div class="highway-plane">
                <div class="road-surface">
                    <!-- 4 Distinct Lanes -->
                    <div class="lane" id="lane-0"></div>
                    <div class="lane" id="lane-1"></div>
                    <div class="lane" id="lane-2"></div>
                    <div class="lane" id="lane-3"></div>
                </div>
                <!-- Hit Line -->
                <div class="hit-zone"></div>
                <!-- Notes injected here -->
            </div>
        </div>

        <!-- 3. Start Button (Bottom) -->
        <div class="cta-container">
            <button class="btn-start" id="startBtn">START GAME</button>
        </div>
    </div>

    <!-- CRT Effects -->
    <div class="vignette"></div>
    <div class="scanlines"></div>

    <script>
        /**
         * BACKGROUND RENDERER
         * Draws the Synthwave Sun and Grid Floor.
         */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            ctx.imageSmoothingEnabled = false;
        }
        window.addEventListener('resize', resize);
        resize();

        // Animation State
        let gridOffset = 0;
        const gridSpeed = 6; // Speed
        const starCount = 100;
        const stars = [];
        
        // Initialize Stars
        for(let i=0; i<starCount; i++) {
            stars.push({
                x: Math.random() * 2000,
                y: Math.random() * 1000,
                size: Math.random() > 0.9 ? 3 : 1, // Pixel sized stars
                speed: Math.random() * 2 + 0.5
            });
        }

        function drawBackground() {
            // 1. Clear
            ctx.fillStyle = '#0a0014';
            ctx.fillRect(0, 0, width, height);

            // 2. Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                star.y += star.speed;
                if(star.y > height * 0.45) star.y = 0; 
                // Draw pixel stars (integer coords)
                ctx.fillRect(Math.floor(star.x % width), Math.floor(star.y), star.size, star.size);
            });

            // 3. Synthwave Sun
            const sunSize = Math.min(width, height) * 0.3;
            const sunY = height * 0.45;
            const sunX = width / 2;
            
            // Sun Gradient
            const grad = ctx.createLinearGradient(0, sunY - sunSize, 0, sunY + sunSize);
            grad.addColorStop(0, '#ffeb3b'); // Yellow
            grad.addColorStop(0.5, '#ff0055'); // Pink
            grad.addColorStop(1, '#bc13fe'); // Purple

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunSize, 0, Math.PI * 2);
            ctx.fill();

            // Sun Stripes (Cutouts) - Pixelated approach
            ctx.fillStyle = '#0a0014'; // Match bg
            const stripeCount = 8;
            for(let i=0; i<stripeCount; i++) {
                // Calculate Y from center downwards
                const y = sunY + (i * (sunSize/stripeCount)) - (sunSize/2);
                // Stripe thickness increases with distance from center (perspective illusion)
                const h = 4 + (i * 4); 
                
                if(y > sunY - sunSize && y < sunY + sunSize) {
                    // Draw a wide rect to ensure it cuts through the circle
                    ctx.fillRect(sunX - sunSize, y, sunSize*2, h);
                }
            }

            // 4. Grid Floor
            ctx.save();
            const horizonY = height * 0.45;
            
            // Clip to bottom half
            ctx.beginPath();
            ctx.rect(0, horizonY, width, height * 0.55);
            ctx.clip();

            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 2;
            
            // Vertical Lines (Perspective)
            const centerX = width / 2;
            const lineCount = 15;
            for(let i = -lineCount; i <= lineCount; i++) {
                ctx.beginPath();
                ctx.moveTo(centerX, horizonY);
                ctx.lineTo(centerX + (i * 200), height); // Fan out
                ctx.stroke();
            }

            // Horizontal Lines (Moving)
            gridOffset = (gridOffset + gridSpeed) % 50;
            
            for(let i = 0; i < 15; i++) {
                // Perspective spacing (logarithmic feel)
                const t = i / 15;
                const perspectiveY = horizonY + (Math.pow(t, 2.5) * (height - horizonY));
                
                // Offset for animation
                const animY = perspectiveY + gridOffset;

                if(animY < height) {
                    ctx.beginPath();
                    ctx.moveTo(0, Math.floor(animY));
                    ctx.lineTo(width, Math.floor(animY));
                    ctx.stroke();
                }
            }
            ctx.restore();
            
            requestAnimationFrame(drawBackground);
        }
        drawBackground();


        /**
         * HIGHWAY LOGIC
         * Spawns notes falling down the 3D road.
         */
        const lanes = [
            document.getElementById('lane-0'),
            document.getElementById('lane-1'),
            document.getElementById('lane-2'),
            document.getElementById('lane-3')
        ];

        const colors = ['#ff0055', '#00f3ff', '#ffee00', '#bc13fe'];

        function spawnNote() {
            const laneIndex = Math.floor(Math.random() * 4);
            const note = document.createElement('div');
            
            // Styling
            note.classList.add('note');
            note.style.backgroundColor = colors[laneIndex];
            note.style.color = colors[laneIndex]; // For shadow
            
            // Animation via CSS transition
            // We set a specific duration based on random beat timing
            const duration = 1.2 + Math.random() * 0.8;
            
            note.style.transition = `top ${duration}s linear`;
            note.style.top = '-30px'; // Start above visible area
            
            lanes[laneIndex].appendChild(note);

            // Trigger reflow
            note.offsetHeight; 

            // Animate to bottom
            note.style.top = '110%';

            // Cleanup
            setTimeout(() => {
                if(note.parentNode) note.remove();
            }, duration * 1000);
        }

        // Rhythmic Spawning
        // Base beat every 500ms
        setInterval(() => {
            spawnNote();
            // 15% chance of double note for complexity
            if(Math.random() > 0.85) setTimeout(spawnNote, 150);
        }, 500);


        /**
         * INTERACTION
         */
        const startBtn = document.getElementById('startBtn');
        startBtn.addEventListener('click', () => {
            startBtn.innerText = "LOADING...";
            startBtn.style.borderColor = "#fff";
            startBtn.style.color = "#fff";
            startBtn.style.boxShadow = "0 0 20px #fff";
            
            // Simulate game load
            setTimeout(() => {
                alert("GAME STARTING...");
                startBtn.innerText = "START GAME";
                startBtn.style.borderColor = "var(--lane-3)";
                startBtn.style.color = "var(--lane-3)";
                startBtn.style.boxShadow = "6px 6px 0px var(--lane-1)";
            }, 800);
        });

    </script>
</body>
</html>
