<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --bg-dark: #050011;
            --bg-deep: #000000;
            
            /* Synthwave Palette */
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffff00;
            --neon-purple: #bc13fe;
            --neon-orange: #ff8800;
            --white: #ffffff;
            
            /* UI Colors */
            --lane-bg: rgba(10, 0, 20, 0.85);
            --grid-line: rgba(188, 19, 254, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            image-rendering: pixelated; /* CRITICAL for retro look */
        }

        body {
            background-color: var(--bg-dark);
            color: var(--white);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px; /* For 3D elements */
        }

        /* --- BACKGROUND LAYERS --- */

        /* 1. Starfield Canvas */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 2. The Synthwave Sun */
        .sun-container {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 240px;
            z-index: 2;
            /* Pixelated Octagon */
            clip-path: polygon(
                10% 0%, 90% 0%, 
                100% 10%, 100% 90%, 
                90% 100%, 10% 100%, 
                0% 90%, 0% 10%
            );
            background: linear-gradient(to bottom, var(--neon-yellow) 0%, var(--neon-orange) 40%, var(--neon-pink) 100%);
            box-shadow: 0 0 40px var(--neon-pink);
        }

        /* Sun Stripes (Retro Cutouts) */
        .sun-stripes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0%,
                transparent 15%,
                var(--bg-dark) 15%,
                var(--bg-dark) 20%,
                transparent 20%,
                transparent 30%,
                var(--bg-dark) 30%,
                var(--bg-dark) 35%,
                transparent 35%,
                transparent 50%,
                var(--bg-dark) 50%,
                var(--bg-dark) 58%,
                transparent 58%,
                transparent 75%,
                var(--bg-dark) 75%,
                var(--bg-dark) 82%,
                transparent 82%
            );
            clip-path: polygon(
                10% 0%, 90% 0%, 
                100% 10%, 100% 90%, 
                90% 100%, 10% 100%, 
                0% 90%, 0% 10%
            );
            /* Ensure stripes are behind the title but part of the sun visual */
            z-index: 1; 
        }

        /* 3. Infinite Grid Floor */
        .floor-container {
            position: absolute;
            bottom: -20%; /* Extend below view */
            left: 50%;
            transform: translateX(-50%);
            width: 200vw;
            height: 60vh;
            perspective: 400px;
            z-index: 3;
            overflow: hidden;
        }

        .floor-grid {
            width: 100%;
            height: 100%;
            /* Horizontal and Vertical Grid Lines */
            background: 
                linear-gradient(transparent 0%, var(--bg-dark) 90%), /* Fade top */
                linear-gradient(90deg, var(--grid-line) 2px, transparent 2px),
                linear-gradient(0deg, var(--grid-line) 2px, transparent 2px);
            background-size: 100% 100%, 80px 80px, 40px 40px;
            transform: rotateX(75deg);
            transform-origin: top center;
            animation: gridScroll 0.8s linear infinite;
            /* Vignette mask */
            mask-image: linear-gradient(to bottom, transparent 0%, black 30%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%);
        }

        @keyframes gridScroll {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 0 40px; }
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            /* Hierarchy Spacing */
            gap: 3rem; 
        }

        /* 1. Title */
        .title-box {
            position: relative;
            /* Push up slightly to overlap sun horizon */
            margin-top: -3rem; 
            text-align: center;
        }

        h1 {
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: clamp(4rem, 10vw, 8rem);
            line-height: 0.85;
            text-transform: uppercase;
            color: var(--white);
            /* The Glitch Shadow */
            text-shadow: 
                4px 4px 0px var(--neon-pink),
                -2px -2px 0px var(--neon-cyan);
            animation: titleFloat 4s ease-in-out infinite;
            letter-spacing: -4px;
            position: relative;
        }
        
        /* Subtitle */
        h1 span {
            display: block;
            font-size: 0.4em;
            color: var(--neon-yellow);
            letter-spacing: 10px;
            margin-top: 10px;
            text-shadow: 2px 2px 0px var(--neon-purple);
            font-family: sans-serif; /* Contrast font */
            font-weight: 800;
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 2. Highway Preview (Perspective 3D) */
        .highway-wrapper {
            position: relative;
            width: 320px;
            height: 240px;
            /* Semi-transparent container */
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.8));
            border-top: 4px solid var(--neon-cyan);
            border-bottom: 4px solid var(--neon-cyan);
            box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            /* Tilt slightly for dynamic angle */
            transform: rotateX(10deg) skewX(-5deg);
            backdrop-filter: blur(2px);
        }

        .lane {
            flex: 1;
            border-right: 2px solid rgba(255, 255, 255, 0.3);
            position: relative;
            background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,255,255,0.05));
        }
        .lane:last-child { border-right: none; }
        .lane:first-child { border-left: 2px solid rgba(255, 255, 255, 0.3); }

        /* The Hit Line */
        .hit-line {
            position: absolute;
            bottom: 20px; /* Fixed position */
            left: 0;
            width: 100%;
            height: 6px;
            background: var(--white);
            box-shadow: 0 0 10px var(--white);
            z-index: 5;
        }

        /* Falling Notes */
        .note {
            position: absolute;
            width: 80%;
            left: 10%;
            height: 24px;
            /* Pixelated Note Style */
            border: 2px solid var(--white);
            box-shadow: 0 0 8px currentColor;
        }

        /* Lane Colors */
        .lane:nth-child(1) .note { background: var(--neon-pink); color: var(--neon-pink); }
        .lane:nth-child(2) .note { background: var(--neon-cyan); color: var(--neon-cyan); }
        .lane:nth-child(3) .note { background: var(--neon-yellow); color: var(--neon-yellow); border-color: var(--neon-yellow); }
        .lane:nth-child(4) .note { background: var(--neon-purple); color: var(--neon-purple); }

        /* Animation for notes */
        @keyframes noteFall {
            0% { top: -30px; opacity: 0; transform: scale(0.8); }
            10% { opacity: 1; transform: scale(1); }
            100% { top: 120%; opacity: 1; }
        }

        /* 3. Action Button */
        .btn-start {
            background: transparent;
            color: var(--neon-yellow);
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 1.5rem;
            text-transform: uppercase;
            padding: 1rem 3rem;
            border: 4px solid var(--neon-yellow);
            cursor: pointer;
            position: relative;
            letter-spacing: 4px;
            /* Multi-layered glow */
            box-shadow: 0 0 10px var(--neon-yellow), inset 0 0 10px var(--neon-yellow);
            transition: all 0.2s ease;
            z-index: 20;
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        .btn-start:hover {
            background: var(--neon-yellow);
            color: var(--bg-dark);
            box-shadow: 0 0 30px var(--neon-yellow), inset 0 0 20px var(--neon-yellow);
            transform: scale(1.05);
            text-shadow: none;
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        /* --- OVERLAYS --- */
        
        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.5) 2px,
                rgba(0,0,0,0.5) 4px
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.6;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 99;
        }
        
        /* Glitch Overlay Effect (Random flicker) */
        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 255, 0.1);
            mix-blend-mode: overlay;
            opacity: 0;
            pointer-events: none;
            z-index: 98;
            animation: glitchFlash 8s infinite;
        }

        @keyframes glitchFlash {
            0%, 94%, 100% { opacity: 0; }
            95% { opacity: 1; transform: translateX(5px); }
            96% { opacity: 0; }
            97% { opacity: 1; transform: translateX(-5px); }
            98% { opacity: 0; }
        }

    </style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="starfield"></canvas>
    
    <div class="sun-container">
        <div class="sun-stripes"></div>
    </div>

    <div class="floor-container">
        <div class="floor-grid"></div>
    </div>

    <!-- UI Layer -->
    <div class="ui-layer">
        
        <div class="title-box">
            <h1>PIXEL<br>DANCE</h1>
        </div>

        <!-- Highway Preview -->
        <div class="highway-wrapper" id="highway">
            <div class="hit-line"></div>
            <!-- 4 Lanes -->
            <div class="lane"></div>
            <div class="lane"></div>
            <div class="lane"></div>
            <div class="lane"></div>
        </div>

        <button class="btn-start" id="startBtn">START GAME</button>
    </div>

    <!-- Overlays -->
    <div class="glitch-overlay"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        /**
         * 1. Starfield Logic
         * Renders square stars to maintain the pixel aesthetic.
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        
        // Disable smoothing for crisp pixels
        ctx.imageSmoothingEnabled = false;

        let width, height;
        let stars = [];
        const starCount = 120;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                // If initial, scatter vertically. If reset, start at top.
                this.y = initial ? Math.random() * height : -20;
                
                // Varying speeds for depth
                this.speed = Math.random() * 4 + 1; 
                
                // Pixelated size (1px or 2px)
                this.size = Math.random() > 0.7 ? 2 : 1;
                
                // Colors: mostly white, some cyan/pink
                const rand = Math.random();
                if (rand > 0.95) this.color = '#ff00ff';
                else if (rand > 0.9) this.color = '#00ffff';
                else this.color = '#ffffff';
            }

            update() {
                this.y += this.speed;
                if (this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                // Draw a perfect square
                ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        resize();
        initStars();
        animateStars();


        /**
         * 2. Highway Note Spawner
         * Creates DOM elements for notes to keep them crisp and styled via CSS.
         * We spawn notes in "beats" to look more rhythmic.
         */
        const highway = document.getElementById('highway');
        const lanes = highway.querySelectorAll('.lane');

        function spawnNote() {
            // Pick a random lane
            const laneIndex = Math.floor(Math.random() * lanes.length);
            const lane = lanes[laneIndex];

            // Create Note Element
            const note = document.createElement('div');
            note.classList.add('note');
            
            // Rhythmic animation duration (fast)
            const duration = 1.5; // Fixed speed for consistency
            note.style.animation = `noteFall ${duration}s linear forwards`;

            lane.appendChild(note);

            // Cleanup after animation
            setTimeout(() => {
                if (note.parentNode) {
                    note.remove();
                }
            }, duration * 1000);
        }

        // Spawning Logic
        function rhythmLoop() {
            // Spawn 1 or 2 notes occasionally for density
            spawnNote();
            if(Math.random() > 0.7) {
                setTimeout(spawnNote, 100); 
            }

            // Random interval to simulate music BPM variance
            const nextSpawn = Math.random() * 300 + 150; 
            setTimeout(rhythmLoop, nextSpawn);
        }

        // Initial burst
        for(let i=0; i<4; i++) {
            setTimeout(spawnNote, i * 200);
        }
        rhythmLoop();


        /**
         * 3. Title Glitch Effect
         * Randomly offsets the text shadow and skew to create a "digital" feel
         */
        const title = document.querySelector('h1');
        
        setInterval(() => {
            const r = Math.random();
            if (r > 0.95) {
                // Trigger glitch
                const x = (Math.random() * 10 - 5).toFixed(0);
                const y = (Math.random() * 10 - 5).toFixed(0);
                title.style.textShadow = `
                    ${x}px ${y}px 0px var(--neon-pink),
                    ${x*-2}px ${y*-2}px 0px var(--neon-cyan)
                `;
                title.style.transform = `skewX(${Math.random()*10-5}deg)`;
                
                setTimeout(() => {
                    title.style.textShadow = '4px 4px 0px var(--neon-pink), -2px -2px 0px var(--neon-cyan)';
                    title.style.transform = 'skewX(0deg)';
                }, 100);
            }
        }, 100);

    </script>
</body>
</html>
