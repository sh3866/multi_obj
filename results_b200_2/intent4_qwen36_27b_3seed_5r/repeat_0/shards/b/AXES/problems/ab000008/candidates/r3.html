<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --bg-dark: #0a001a;
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffff00;
            --neon-purple: #bc13fe;
            --white: #ffffff;
            --grid-color: rgba(255, 0, 255, 0.3);
            --pixel-size: 4px; /* Base unit for pixel art feel */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--white);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: monospace; /* Fallback */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Force pixelated rendering for scaled elements */
            image-rendering: pixelated; 
        }

        /* --- BACKGROUND --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- UI CONTAINER --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            /* Z-Pattern Layout */
        }

        /* --- PIXEL TITLE --- */
        .title-container {
            position: relative;
            margin-bottom: 2rem;
            /* Dynamic floating */
            animation: float 3s ease-in-out infinite;
        }

        /* 
           Constructing a pixel font using box-shadows to avoid external dependencies.
           Base pixel size 6px. 
        */
        .pixel-text {
            font-family: monospace;
            font-size: 14px; /* Base font size, actual size comes from shadow scale */
            color: transparent;
            width: 1em;
            height: 1em;
            display: block;
            text-transform: uppercase;
            
            /* The actual pixel map for "PIXEL" */
            /* P */
            --p-p1: 0 0, 6px 0, 12px 0, 18px 0;
            --p-p2: 6px 6px, 12px 6px, 18px 6px;
            --p-p3: 6px 12px, 12px 12px, 18px 12px;
            --p-p4: 6px 18px, 12px 18px, 18px 18px;
            --p-p5: 0 24px, 6px 24px, 12px 24px, 18px 24px, 24px 24px;
            --p-p6: 0 30px, 24px 30px;
            --p-p7: 0 36px, 24px 36px;
            --p-p8: 0 42px, 24px 42px;
            --p-p9: 0 48px, 6px 48px, 12px 48px, 18px 48px;
            
            /* I */
            --i-p1: 0 0, 6px 0, 12px 0;
            --i-p2: 6px 6px;
            --i-p3: 6px 12px;
            --i-p4: 6px 18px;
            --i-p5: 6px 24px;
            --i-p6: 6px 30px;
            --i-p7: 6px 36px;
            --i-p8: 6px 42px;
            --i-p9: 0 48px, 6px 48px, 12px 48px;

            /* X */
            --x-p1: 0 0, 18px 0;
            --x-p2: 6px 6px, 12px 6px;
            --x-p3: 12px 12px, 18px 12px;
            --x-p4: 18px 18px;
            --x-p5: 0 24px, 6px 24px, 12px 24px, 18px 24px;
            --x-p6: 0 30px, 18px 30px;
            --x-p7: 6px 36px, 12px 36px;
            --x-p8: 12px 42px, 18px 42px;
            --x-p9: 18px 48px;

            /* E */
            --e-p1: 0 0, 6px 0, 12px 0, 18px 0;
            --e-p2: 0 6px;
            --e-p3: 0 12px;
            --e-p4: 0 18px, 6px 18px, 12px 18px;
            --e-p5: 0 24px, 6px 24px, 12px 24px, 18px 24px;
            --e-p6: 0 30px;
            --e-p7: 0 36px;
            --e-p8: 0 42px;
            --e-p9: 0 48px, 6px 48px, 12px 48px, 18px 48px;

            /* L */
            --l-p1: 0 0;
            --l-p2: 0 6px;
            --l-p3: 0 12px;
            --l-p4: 0 18px;
            --l-p5: 0 24px;
            --l-p6: 0 30px;
            --l-p7: 0 36px;
            --l-p8: 0 42px;
            --l-p9: 0 48px, 6px 48px, 12px 48px, 18px 48px;

            /* Shadow Construction for "PIXEL" */
            /* P (x=0) */
            --shadow-p: var(--p-p1), var(--p-p2), var(--p-p3), var(--p-p4), var(--p-p5), var(--p-p6), var(--p-p7), var(--p-p8), var(--p-p9);
            /* I (x=30) */
            --shadow-i: var(--i-p1) translate(30px), var(--i-p2) translate(30px), var(--i-p3) translate(30px), var(--i-p4) translate(30px), var(--i-p5) translate(30px), var(--i-p6) translate(30px), var(--i-p7) translate(30px), var(--i-p8) translate(30px), var(--i-p9) translate(30px);
            /* X (x=60) */
            --shadow-x: var(--x-p1) translate(60px), var(--x-p2) translate(60px), var(--x-p3) translate(60px), var(--x-p4) translate(60px), var(--x-p5) translate(60px), var(--x-p6) translate(60px), var(--x-p7) translate(60px), var(--x-p8) translate(60px), var(--x-p9) translate(60px);
            /* E (x=90) */
            --shadow-e: var(--e-p1) translate(90px), var(--e-p2) translate(90px), var(--e-p3) translate(90px), var(--e-p4) translate(90px), var(--e-p5) translate(90px), var(--e-p6) translate(90px), var(--e-p7) translate(90px), var(--e-p8) translate(90px), var(--e-p9) translate(90px);
            /* L (x=120) */
            --shadow-l: var(--l-p1) translate(120px), var(--l-p2) translate(120px), var(--l-p3) translate(120px), var(--l-p4) translate(120px), var(--l-p5) translate(120px), var(--l-p6) translate(120px), var(--l-p7) translate(120px), var(--l-p8) translate(120px), var(--l-p9) translate(120px);

            text-shadow: 
                var(--shadow-p),
                var(--shadow-i),
                var(--shadow-x),
                var(--shadow-e),
                var(--shadow-l);
                
            /* Dithered Gradient via background trick on a pseudo element behind */
            transform-origin: center;
        }
        
        /* "DANCE" Row (Simplified for brevity, using CSS clip-paths for shape) */
        .pixel-text-sub {
            font-size: 14px;
            color: transparent;
            display: block;
            margin-top: 10px;
            width: 160px;
            height: 48px;
            background: var(--neon-cyan);
            /* Dither pattern */
            background-image: linear-gradient(45deg, rgba(0,0,0,0.2) 25%, transparent 25%, transparent 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2) 75%, transparent 75%, transparent);
            background-size: 12px 12px;
            /* Clip path to spell DANCE roughly */
            clip-path: polygon(
                0% 0%, 40% 0%, 60% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 40%, 20% 40%, 20% 20%, 40% 20%, 40% 40%, 60% 40%, 60% 20%, 80% 20%, 80% 40%, 100% 40%, 100% 20%, 80% 20%, 80% 0%, 60% 0%, 60% 20%, 40% 20%, 40% 0%, 20% 0%, 20% 20%, 0% 20%
            );
            transform: scale(1.5);
            margin-left: 10px;
        }

        /* --- HIGHWAY PREVIEW --- */
        /* Using CSS 3D Transforms for strict perspective */
        .highway-scene {
            width: 300px;
            height: 180px;
            position: relative;
            perspective: 400px;
            margin-bottom: 3rem;
            /* Mask to fade the bottom */
            mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
        }

        .highway-road {
            width: 100%;
            height: 100%;
            position: absolute;
            transform: rotateX(45deg);
            transform-origin: top center;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(188, 19, 254, 0.2) 100%);
            display: flex;
            justify-content: space-between;
            border-top: 4px solid var(--neon-cyan);
            /* Pixelated border */
            box-shadow: 0 0 0 4px var(--neon-cyan); 
            overflow: hidden;
        }

        .lane {
            width: 25%;
            height: 100%;
            border-left: 2px dashed rgba(255,255,255,0.2);
            position: relative;
        }
        .lane:first-child { border-left: none; }
        .lane:last-child { border-right: 2px dashed rgba(255,255,255,0.2); }

        /* Hit Line */
        .hit-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--white);
            box-shadow: 0 0 15px var(--white), 0 0 30px var(--white);
            z-index: 5;
        }

        /* Notes */
        .note {
            position: absolute;
            width: 80%;
            left: 10%;
            height: 16px;
            /* Pixelated shape */
            clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%);
            box-shadow: 0 0 10px currentColor;
            animation: fall 1.5s linear infinite;
        }
        
        /* Lane Colors */
        .lane:nth-child(1) .note { background: var(--neon-pink); color: var(--neon-pink); }
        .lane:nth-child(2) .note { background: var(--neon-cyan); color: var(--neon-cyan); }
        .lane:nth-child(3) .note { background: var(--neon-yellow); color: var(--neon-yellow); }
        .lane:nth-child(4) .note { background: var(--neon-purple); color: var(--neon-purple); }

        @keyframes fall {
            0% { top: -20px; opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; transform: scale(1); }
            100% { top: 100%; opacity: 1; }
        }

        /* --- START BUTTON --- */
        /* Arcade style chunky button */
        .btn-start {
            position: relative;
            background: var(--bg-dark);
            color: var(--neon-yellow);
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            padding: 1rem 3rem;
            border: none;
            cursor: pointer;
            
            /* Chunky 3D Look */
            box-shadow: 
                inset 4px 4px 0px var(--white), 
                inset -4px -4px 0px rgba(0,0,0,0.5),
                0 0 0 4px var(--neon-yellow),
                0 0 20px var(--neon-yellow);
            
            transition: transform 0.1s, box-shadow 0.1s;
            z-index: 20;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 
                inset 4px 4px 0px var(--white), 
                inset -4px -4px 0px rgba(0,0,0,0.5),
                0 0 0 4px var(--neon-yellow),
                0 0 40px var(--neon-yellow);
        }

        .btn-start:active {
            transform: scale(0.95);
            box-shadow: 
                inset 4px 4px 0px rgba(0,0,0,0.5), 
                inset -4px -4px 0px var(--white),
                0 0 0 4px var(--neon-yellow);
        }

        /* --- OVERLAYS --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 2px, rgba(0,0,0,0.4) 2px, rgba(0,0,0,0.4) 4px);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.7;
        }
        
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.9) 100%);
            pointer-events: none;
            z-index: 99;
        }

        /* --- ANIMATIONS --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        /* Glitch Animation */
        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .glitch-active {
            animation: glitch-anim 0.2s infinite;
            color: var(--neon-cyan); /* Flash color */
        }

    </style>
</head>
<body>

    <!-- Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Main UI -->
    <div class="ui-layer">
        
        <!-- Title -->
        <div class="title-container" id="titleGroup">
            <!-- Pixel Art Text constructed via CSS Shadows -->
            <div class="pixel-text" id="pixelTitle"></div>
            <!-- Subtitle -->
            <div class="pixel-text-sub"></div>
        </div>

        <!-- Highway Preview -->
        <div class="highway-scene">
            <div class="highway-road">
                <div class="lane" id="lane-0"></div>
                <div class="lane" id="lane-1"></div>
                <div class="lane" id="lane-2"></div>
                <div class="lane" id="lane-3"></div>
                <div class="hit-line"></div>
            </div>
        </div>

        <!-- CTA -->
        <button class="btn-start" id="startBtn">START GAME</button>
    </div>

    <!-- Effects -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        /**
         * BACKGROUND RENDERER
         * Draws the synthwave sun and grid floor directly to canvas for performance
         * and strict pixel control.
         */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            // Low res for pixel look, scaled up by CSS
            canvas.width = width;
            canvas.height = height;
            // Disable smoothing for crisp pixels
            ctx.imageSmoothingEnabled = false;
        }
        window.addEventListener('resize', resize);
        resize();

        // Animation State
        let gridOffset = 0;
        const gridSpeed = 2;
        const starCount = 100;
        const stars = [];
        for(let i=0; i<starCount; i++) {
            stars.push({
                x: Math.random() * 2000,
                y: Math.random() * 1000,
                size: Math.random() > 0.9 ? 3 : 1,
                speed: Math.random() * 2 + 0.5
            });
        }

        function drawBackground() {
            // 1. Clear
            ctx.fillStyle = '#0a001a';
            ctx.fillRect(0, 0, width, height);

            // 2. Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                star.y += star.speed;
                if(star.y > height) star.y = 0;
                ctx.fillRect(Math.floor(star.x % width), Math.floor(star.y), star.size, star.size);
            });

            // 3. Synthwave Sun
            const sunSize = Math.min(width, height) * 0.25;
            const sunY = height * 0.4;
            const sunX = width / 2;
            
            // Sun Gradient
            const grad = ctx.createLinearGradient(0, sunY - sunSize, 0, sunY + sunSize);
            grad.addColorStop(0, '#ffff00');
            grad.addColorStop(0.5, '#ff00ff');
            grad.addColorStop(1, '#bc13fe');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunSize, 0, Math.PI * 2);
            ctx.fill();

            // Sun Stripes (Cutouts)
            ctx.fillStyle = '#0a001a'; // Match bg
            const stripeCount = 8;
            for(let i=0; i<stripeCount; i++) {
                const y = sunY + (i * (sunSize/stripeCount));
                const h = 4 + i*2; // Increasing height
                // Only draw if below center
                if(y > sunY) {
                    ctx.fillRect(sunX - sunSize, y, sunSize*2, h);
                }
            }

            // 4. Grid Floor
            ctx.save();
            // Clip to bottom half
            ctx.beginPath();
            ctx.rect(0, height * 0.5, width, height * 0.5);
            ctx.clip();

            // Grid lines
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.4)';
            ctx.lineWidth = 2;
            
            // Horizon
            const horizonY = height * 0.5;
            
            // Vertical Lines (Perspective)
            const centerX = width / 2;
            for(let i = -10; i <= 10; i++) {
                ctx.beginPath();
                // Start at horizon center
                ctx.moveTo(centerX, horizonY);
                // End at bottom spread out
                ctx.moveTo(centerX + (i * 100), height);
                ctx.stroke();
            }

            // Horizontal Lines (Moving)
            gridOffset = (gridOffset + gridSpeed) % 40;
            for(let i = 0; i < height * 0.5; i+=20) {
                // Logarithmic spacing for perspective feel
                const perspectiveY = horizonY + Math.pow(i/10, 2) + gridOffset;
                if(perspectiveY < height) {
                    ctx.beginPath();
                    ctx.moveTo(0, perspectiveY);
                    ctx.lineTo(width, perspectiveY);
                    ctx.stroke();
                }
            }
            ctx.restore();
            
            requestAnimationFrame(drawBackground);
        }
        drawBackground();


        /**
         * HIGHWAY NOTES
         * Spawns DOM elements to keep them crisp and styled.
         */
        const lanes = document.querySelectorAll('.lane');
        
        function spawnNote() {
            const laneIndex = Math.floor(Math.random() * lanes.length);
            const lane = lanes[laneIndex];
            
            // Limit notes per lane to prevent clutter
            if(lane.children.length > 3) return;

            const note = document.createElement('div');
            note.classList.add('note');
            
            // Randomize animation duration slightly for variety
            const duration = 1.2 + Math.random() * 0.5;
            note.style.animationDuration = `${duration}s`;
            
            lane.appendChild(note);

            setTimeout(() => {
                if(note.parentNode) note.remove();
            }, duration * 1000);
        }

        // Rhythmic Spawning
        setInterval(() => {
            spawnNote();
            // Double tap chance
            if(Math.random() > 0.7) setTimeout(spawnNote, 150);
        }, 400);


        /**
         * GLITCH EFFECT
         * Randomly disrupts the title
         */
        const titleGroup = document.getElementById('titleGroup');
        
        setInterval(() => {
            if(Math.random() > 0.9) {
                titleGroup.classList.add('glitch-active');
                // Randomize shadow colors for glitch
                const pText = document.querySelector('.pixel-text');
                const originalShadow = pText.style.textShadow;
                
                // Flash effect
                pText.style.filter = `hue-rotate(${Math.random()*90}deg)`;
                
                setTimeout(() => {
                    titleGroup.classList.remove('glitch-active');
                    pText.style.filter = 'none';
                }, 150);
            }
        }, 2000);

    </script>
</body>
</html>
