<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --bg-dark: #050011;
            --grid-color: rgba(255, 0, 255, 0.2);
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffeb3b;
            --neon-purple: #bc13fe;
            --hit-line: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Courier New', Courier, monospace; /* Fallback pixel-ish font */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- BACKGROUND SCENE --- */
        .scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 60%;
            background: radial-gradient(transparent 0%, var(--bg-dark) 100%);
            z-index: 1;
        }

        /* CSS Sun */
        .sun {
            position: absolute;
            bottom: 35%; /* Horizon line */
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            background: linear-gradient(to top, var(--neon-yellow), var(--neon-pink));
            border-radius: 50%;
            box-shadow: 0 0 40px var(--neon-pink);
            z-index: 2;
            /* Retro Sun Stripes Mask */
            -webkit-mask-image: linear-gradient(
                to bottom,
                black 0%, black 50%,
                transparent 50%, transparent 55%,
                black 55%, black 65%,
                transparent 65%, transparent 70%,
                black 70%, black 82%,
                transparent 82%, transparent 86%,
                black 86%, black 100%
            );
            mask-image: linear-gradient(
                to bottom,
                black 0%, black 50%,
                transparent 50%, transparent 55%,
                black 55%, black 65%,
                transparent 65%, transparent 70%,
                black 70%, black 82%,
                transparent 82%, transparent 86%,
                black 86%, black 100%
            );
        }

        /* The Grid Floor (Perspective) */
        .floor {
            position: absolute;
            bottom: 0;
            left: -50%;
            width: 200%;
            height: 40%; /* Horizon height */
            background: 
                linear-gradient(transparent 0%, var(--bg-dark) 100%), /* Fade to black at bottom */
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px),
                linear-gradient(0deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            transform: perspective(400px) rotateX(60deg);
            transform-origin: bottom center;
            z-index: 3;
            animation: gridMove 2s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 0 40px; }
        }

        /* --- MAIN CONTENT --- */
        .content-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            padding-bottom: 5vh;
            width: 100%;
        }

        /* --- GAME TITLE --- */
        .title-container {
            position: absolute;
            top: 15%;
            text-align: center;
            width: 100%;
        }

        h1 {
            font-size: 5rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 0.2em;
            color: white;
            text-shadow: 
                4px 4px 0px var(--neon-purple),
                -2px -2px 0px var(--neon-cyan);
            margin: 0;
            animation: titleFloat 3s ease-in-out infinite;
        }

        h1 span {
            color: var(--neon-yellow);
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- HIGHWAY PREVIEW --- */
        .highway-wrapper {
            position: relative;
            width: 400px;
            height: 250px;
            margin-bottom: 2rem;
            perspective: 800px;
        }

        .highway {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
            transform: rotateX(40deg);
            transform-origin: top center;
            display: flex;
            position: relative;
            overflow: hidden;
            border-bottom: none; /* Open bottom */
        }

        /* Lanes */
        .lane {
            flex: 1;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        .lane:last-child { border-right: none; }

        /* Hit Line */
        .hit-line {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--hit-line);
            box-shadow: 0 0 10px white, 0 0 20px var(--neon-pink);
            z-index: 5;
        }

        /* Falling Notes (Animated) */
        .note {
            position: absolute;
            width: 80%;
            left: 10%;
            height: 20px;
            border-radius: 2px;
            box-shadow: 0 0 10px currentColor;
            animation: fall linear infinite;
        }

        /* Colors for lanes */
        .lane:nth-child(1) .note { background: #ff0055; color: #ff0055; animation-duration: 1.2s; animation-delay: 0.1s; }
        .lane:nth-child(2) .note { background: #00ffff; color: #00ffff; animation-duration: 1.5s; animation-delay: 0.4s; }
        .lane:nth-child(3) .note { background: #00ff00; color: #00ff00; animation-duration: 1.1s; animation-delay: 0.7s; }
        .lane:nth-child(4) .note { background: #ffff00; color: #ffff00; animation-duration: 1.4s; animation-delay: 0.2s; }

        @keyframes fall {
            0% { top: -20px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* --- BUTTONS --- */
        .btn-start {
            background: transparent;
            color: var(--neon-yellow);
            font-family: inherit;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 1rem 3rem;
            border: 4px solid var(--neon-yellow);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            box-shadow: 0 0 10px var(--neon-yellow), inset 0 0 10px var(--neon-yellow);
            letter-spacing: 0.1em;
            text-shadow: 0 0 5px var(--neon-yellow);
            z-index: 20;
        }

        .btn-start:hover {
            background: var(--neon-yellow);
            color: black;
            box-shadow: 0 0 30px var(--neon-yellow), inset 0 0 20px var(--neon-yellow);
            transform: scale(1.05);
            text-shadow: none;
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        /* Scanline overlay for CRT effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.6;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .highway-wrapper { width: 90%; }
            .sun { width: 200px; height: 200px; }
        }
    </style>
</head>
<body>

    <!-- CRT Scanlines Overlay -->
    <div class="scanlines"></div>

    <!-- Background Scene -->
    <div class="scene-container">
        <canvas id="starfield"></canvas>
        <div class="stars"></div>
        <div class="sun"></div>
        <div class="floor"></div>
    </div>

    <!-- Foreground Content -->
    <div class="content-layer">
        
        <div class="title-container">
            <h1>PIXEL <span>DANCE</span></h1>
        </div>

        <!-- Visual Representation of Gameplay -->
        <div class="highway-wrapper">
            <div class="highway">
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                <div class="lane"><div class="note"></div></div>
                <div class="hit-line"></div>
            </div>
        </div>

        <button class="btn-start" id="startBtn">START GAME</button>
    </div>

    <script>
        /**
         * Starfield Logic
         * Renders retro moving stars on the canvas behind the sun.
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const starCount = 100;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Star {
            constructor() {
                this.reset();
                // Randomize y initially so they don't all start at top
                this.y = Math.random() * height; 
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -10;
                this.z = Math.random() * 2 + 0.5; // Depth/Speed
                this.size = Math.random() * 2;
                this.color = Math.random() > 0.8 ? '#ff00ff' : '#ffffff'; // Occasional pink star
            }

            update() {
                this.y += this.z * 0.5; // Move down
                if (this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.random() * 0.5 + 0.5; // Twinkle
                ctx.fillRect(this.x, this.y, this.size, this.size); // Square stars for pixel look
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        // Initialize
        resize();
        initStars();
        animate();

        /**
         * Button Interaction
         * Adds a glitch effect to the title when hovering the start button.
         */
        const btn = document.getElementById('startBtn');
        const title = document.querySelector('h1');

        btn.addEventListener('mouseenter', () => {
            title.style.textShadow = `
                ${Math.random()*10 - 5}px ${Math.random()*10 - 5}px 0px var(--neon-pink),
                ${Math.random()*10 - 5}px ${Math.random()*10 - 5}px 0px var(--neon-cyan)
            `;
            title.style.transform = 'skewX(10deg)';
        });

        btn.addEventListener('mouseleave', () => {
            title.style.textShadow = '4px 4px 0px var(--neon-purple), -2px -2px 0px var(--neon-cyan)';
            title.style.transform = 'skewX(0deg)';
        });
    </script>
</body>
</html>
