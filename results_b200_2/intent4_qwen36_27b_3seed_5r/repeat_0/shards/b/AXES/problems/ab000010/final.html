<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sphere Life // Volumetric</title>
    <style>
        :root {
            --bg-deep: #050508;
            --bg-panel: rgba(10, 10, 14, 0.75);
            --border-panel: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.2);
            
            --text-primary: #ffffff;
            --text-secondary: #8b9bb4;
            --text-muted: #4b5563;
            
            /* Palette - Cyberpunk/Deep Space */
            --color-accent: #00f2ff; /* Cyan */
            --color-accent-dim: rgba(0, 242, 255, 0.15);
            --color-ui-glow: rgba(0, 242, 255, 0.2);
            
            /* Cell Lifecycle Colors (HSL Hues) */
            --hue-born: 180;   /* Cyan */
            --hue-mature: 250; /* Indigo */
            --hue-elder: 310;  /* Magenta */
            
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "SF Mono", "Menlo", "Monaco", "Consolas", "Courier New", monospace;
            --ease-out: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* Background Atmosphere */
        .atmosphere {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 50%, rgba(20, 30, 60, 0.3) 0%, transparent 60%),
                radial-gradient(circle at 0% 0%, rgba(0,0,0,0.8) 0%, transparent 40%);
            z-index: 0;
            pointer-events: none;
        }

        /* Layout */
        .viewport {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 1;
        }

        canvas {
            display: block;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        /* Sidebar Panel */
        .panel {
            width: 380px;
            height: 100%;
            background: var(--bg-panel);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid var(--border-panel);
            display: flex;
            flex-direction: column;
            padding: 32px;
            gap: 40px;
            z-index: 10;
            overflow-y: auto;
            box-shadow: -10px 0 40px rgba(0,0,0,0.3);
        }

        /* Header - Reduced Weight */
        .header {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-bottom: 1px solid var(--border-panel);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text-secondary); /* Dimmed */
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0.8;
        }
        
        .indicator {
            display: none; /* Removed bright dot */
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
            font-family: var(--font-mono);
            font-weight: 400;
        }

        /* Stats - Scientific Instrument Style */
        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-panel);
            border-radius: 4px; /* Sharper corners */
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        
        /* Subtle corner accent */
        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 12px;
            height: 1px;
            background: var(--color-accent);
            opacity: 0.5;
        }

        .stat-val {
            font-family: var(--font-mono);
            font-size: 24px;
            font-weight: 500; /* Reduced weight */
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Controls */
        .control-section {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .label-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .label-val {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--color-accent);
            opacity: 0.9;
        }

        /* Custom Range Slider - Unified Gradient */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
            position: relative;
            z-index: 2;
        }

        input[type=range]:focus {
            outline: none;
        }

        /* Track - Unified Gradient (Cyan to Purple) */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--color-accent), #6d28d9);
            opacity: 0.4;
        }
        input[type=range]:hover::-webkit-slider-runnable-track {
            opacity: 0.7;
        }

        /* Thumb - Glowing */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            margin-top: -6px;
            box-shadow: 0 0 10px var(--color-accent);
            border: 2px solid var(--bg-deep);
            position: relative;
            z-index: 3;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Buttons - Standardized System */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .btn-group-full {
            grid-template-columns: 1fr;
        }

        button {
            background: transparent;
            border: 1px solid var(--border-panel);
            color: var(--text-secondary);
            padding: 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s var(--ease-out);
            font-family: var(--font-mono);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:hover {
            background: rgba(255,255,255,0.05);
            border-color: var(--border-highlight);
            color: var(--text-primary);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Primary Action - Filled, Distinct Color */
        #toggleBtn {
            background: var(--color-accent-dim);
            border-color: rgba(0, 242, 255, 0.3);
            color: var(--color-accent);
        }
        #toggleBtn:hover {
            background: rgba(0, 242, 255, 0.25);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
            color: #fff;
        }
        #toggleBtn.paused {
            background: transparent;
            border-color: var(--border-panel);
            color: var(--text-secondary);
        }

        /* Danger Action - Subtle */
        #clearBtn {
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            padding: 10px;
        }
        #clearBtn:hover {
            color: #ff5c5c;
            background: rgba(255, 92, 92, 0.05);
        }

        /* Legend - Improved Legibility */
        .legend {
            margin-top: auto;
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 4px;
            border: 1px solid var(--border-panel);
        }
        .legend-title {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 12px;
            letter-spacing: 0.1em;
            font-weight: 700;
        }
        .gradient-bar {
            height: 6px;
            width: 100%;
            border-radius: 2px;
            /* Unified Gradient */
            background: linear-gradient(90deg, #00f2ff, #4f46e5, #d946ef);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.1);
        }
        .legend-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 11px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 800px) {
            body {
                flex-direction: column-reverse;
            }
            .panel {
                width: 100%;
                height: auto;
                max-height: 45vh;
                border-left: none;
                border-top: 1px solid var(--border-panel);
                padding: 24px;
                gap: 24px;
            }
            .viewport {
                min-height: 55vh;
            }
        }
    </style>
</head>
<body>

    <div class="atmosphere"></div>

    <div class="viewport" id="canvasContainer">
        <canvas id="lifeCanvas"></canvas>
    </div>

    <div class="panel">
        <div class="header">
            <h1>Sphere Life</h1>
            <p class="subtitle">Conway's Game of Life on a 3D manifold. <br>Drag to rotate.</p>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <span class="stat-val" id="genCount">0</span>
                <span class="stat-label">Generations</span>
            </div>
            <div class="stat-card">
                <span class="stat-val" id="popCount">0</span>
                <span class="stat-label">Population</span>
            </div>
        </div>

        <div class="control-section">
            <div class="control-group">
                <div class="label-row">
                    <span class="label-text">Simulation Speed</span>
                    <span class="label-val" id="speedVal">50%</span>
                </div>
                <input type="range" id="speedSlider" min="0" max="100" value="50">
            </div>
            
            <div class="control-group">
                <div class="label-row">
                    <span class="label-text">Grid Density</span>
                    <span class="label-val" id="densityVal">128</span>
                </div>
                <input type="range" id="densitySlider" min="32" max="160" value="100">
            </div>
        </div>

        <div class="control-section">
            <div class="label-row" style="margin-bottom: 12px;">
                <span class="label-text">Actions</span>
            </div>
            <div class="btn-group">
                <button id="toggleBtn">Pause</button>
                <button id="resetBtn">Randomize</button>
            </div>
            <div class="btn-group btn-group-full">
                <button id="clearBtn">Clear All</button>
            </div>
        </div>

        <div class="legend">
            <div class="legend-title">Cell Lifecycle (Age)</div>
            <div class="gradient-bar"></div>
            <div class="legend-labels">
                <span>Born</span>
                <span>Mature</span>
                <span>Elder</span>
            </div>
        </div>
    </div>

    <script>
        /**
         * Configuration & State
         */
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let centerX, centerY;
        let radius;

        const CONFIG = {
            sphereRadius: 280,
            gridResolution: 100, 
            speed: 5, 
            evolutionRate: 0.08, // Slightly faster aging
            cellSizeScale: 0.045
        };

        let isRunning = true;
        let frameCount = 0;
        let generation = 0;
        let population = 0;
        
        let grid = [];
        let nextGrid = [];
        let cellAge = []; 
        
        let cols, rows;

        // Interaction State
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let rotationX = 0.5; 
        let rotationY = 0;
        let targetRotationX = 0.5;
        let targetRotationY = 0;

        /**
         * Initialization
         */
        function init() {
            resize();
            createGrid();
            randomizeGrid();
            window.addEventListener('resize', resize);
            
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', handleMouseMove);
            
            canvas.addEventListener('touchstart', (e) => {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, {passive: false});
            window.addEventListener('touchend', () => isDragging = false);
            window.addEventListener('touchmove', (e) => {
                if(isDragging) {
                    const dx = e.touches[0].clientX - lastMouseX;
                    const dy = e.touches[0].clientY - lastMouseY;
                    targetRotationY += dx * 0.005;
                    targetRotationX += dy * 0.005;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});

            // UI Bindings
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                // Map 0-100 to 20-0 delay
                CONFIG.speed = Math.max(1, 21 - Math.floor(val / 5)); 
                document.getElementById('speedVal').innerText = val + '%';
            });
            
            document.getElementById('densitySlider').addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                CONFIG.gridResolution = val;
                document.getElementById('densityVal').innerText = val;
                createGrid();
                randomizeGrid();
            });

            const toggleBtn = document.getElementById('toggleBtn');
            toggleBtn.addEventListener('click', () => {
                isRunning = !isRunning;
                toggleBtn.innerText = isRunning ? "Pause" : "Resume";
                if (!isRunning) toggleBtn.classList.add('paused');
                else toggleBtn.classList.remove('paused');
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                randomizeGrid();
                generation = 0;
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                grid = grid.map(row => row.fill(0));
                cellAge = cellAge.map(row => row.fill(0));
                generation = 0;
                population = 0;
                updateStats();
            });

            loop();
        }

        function resize() {
            const container = document.getElementById('canvasContainer');
            width = container.clientWidth;
            height = container.clientHeight;
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            centerX = width / 2;
            centerY = height / 2;
            radius = Math.min(width, height) * 0.32;
            CONFIG.sphereRadius = radius;
        }

        function createGrid() {
            rows = CONFIG.gridResolution;
            cols = CONFIG.gridResolution * 2; 
            
            grid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            nextGrid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellAge = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
        }

        function randomizeGrid() {
            population = 0;
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    grid[y][x] = Math.random() > 0.6 ? 1 : 0; 
                    cellAge[y][x] = Math.random() * 150; // Random initial ages
                    if (grid[y][x]) population++;
                }
            }
            updateStats();
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        function updateStats() {
            document.getElementById('genCount').innerText = generation;
            document.getElementById('popCount').innerText = population;
        }

        /**
         * Simulation Logic
         */
        function update() {
            population = 0;
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const neighbors = countNeighbors(x, y);
                    const state = grid[y][x];
                    
                    if (state === 0 && neighbors === 3) {
                        nextGrid[y][x] = 1;
                        cellAge[y][x] = 0; // Reset age on birth
                    } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[y][x] = 0;
                    } else {
                        nextGrid[y][x] = state;
                        if (state === 1) cellAge[y][x] += CONFIG.evolutionRate;
                    }

                    if (nextGrid[y][x] === 1) population++;
                }
            }

            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            updateStats();
        }

        function countNeighbors(x, y) {
            let sum = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    sum += grid[row][col];
                }
            }
            return sum;
        }

        /**
         * Rendering
         */
        function draw() {
            // Clear with deep background color
            ctx.fillStyle = '#050508'; 
            ctx.fillRect(0, 0, width, height);

            if (!isDragging) {
                targetRotationY += 0.0015; // Auto rotate slowly
            }
            // Smooth rotation interpolation
            rotationX += (targetRotationX - rotationX) * 0.08;
            rotationY += (targetRotationY - rotationY) * 0.08;

            // 1. Draw Sphere "Atmosphere" / Volume Hint (Subtle)
            // This helps separate the sphere from the background
            const atmosGrad = ctx.createRadialGradient(centerX, centerY, radius * 0.8, centerX, centerY, radius * 1.1);
            atmosGrad.addColorStop(0, 'rgba(255, 255, 255, 0)'); 
            atmosGrad.addColorStop(0.8, 'rgba(255, 255, 255, 0.01)'); 
            atmosGrad.addColorStop(1, 'rgba(0, 0, 0, 0.2)'); 
            
            ctx.fillStyle = atmosGrad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 1.1, 0, Math.PI * 2);
            ctx.fill();

            // 2. Draw Cells
            // Use 'lighter' for the glow effect
            ctx.globalCompositeOperation = 'lighter';
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (grid[y][x] === 1) {
                        drawCell(x, y);
                    }
                }
            }
            
            // Reset composite operation
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawCell(col, row) {
            const u = col / cols;
            const v = row / rows;

            const theta = u * 2 * Math.PI;
            const phi = (v * Math.PI) - (Math.PI / 2);

            // 3D Coordinates on Sphere
            let px = radius * Math.cos(phi) * Math.cos(theta);
            let py = radius * Math.sin(phi);
            let pz = radius * Math.cos(phi) * Math.sin(theta);

            // Rotation Y
            let x1 = px * Math.cos(rotationY) - pz * Math.sin(rotationY);
            let z1 = px * Math.sin(rotationY) + pz * Math.cos(rotationY);
            // Rotation X
            let y2 = py * Math.cos(rotationX) - z1 * Math.sin(rotationX);
            let z2 = py * Math.sin(rotationX) + z1 * Math.cos(rotationX);

            // Perspective Projection
            const fov = 800;
            const scale = fov / (fov + z2);
            
            if (scale < 0) return; // Behind camera

            const screenX = centerX + x1 * scale;
            const screenY = centerY + y2 * scale;

            // Dynamic Cell Size
            const cellSize = (radius * CONFIG.cellSizeScale) * scale; 

            // --- MULTICOLOR MAPPING ---
            // Cycle length ~150 frames
            // 0: Born (Cyan 180)
            // 50: Mature (Indigo 250)
            // 100: Elder (Magenta 310)
            const age = cellAge[row][col];
            
            // Map age to Hue
            // 0 -> 180
            // 150 -> 310 (wrapping)
            const hue = (180 + (age * 0.8)) % 360;
            
            // Lighting & Depth
            // z2 ranges from -radius (front) to radius (back)
            // Normalize to 0..1 where 0 is front
            const depthFactor = (z2 + radius) / (2 * radius); 
            
            // Alpha drops off for cells in the back (Atmospheric Perspective)
            // Front cells: 0.9 alpha, Back cells: 0.0 alpha
            const alpha = Math.max(0, 0.9 - Math.pow(depthFactor, 1.5));
            
            // Brightness increases towards front to simulate lighting
            // Darker in back, bright in front
            // Base lightness 40%, up to 70% at front
            const lightness = 40 + (1 - depthFactor) * 30; 

            // Draw Glowing Dot
            ctx.fillStyle = `hsla(${hue}, 85%, ${lightness}%, ${alpha})`;
            
            // Using arc for a softer, organic "digital nebula" look
            ctx.beginPath();
            ctx.arc(screenX, screenY, Math.max(0.5, cellSize * 0.6), 0, Math.PI * 2);
            ctx.fill();
        }

        function loop() {
            if (isRunning) {
                // Update simulation at controlled speed
                if (frameCount % CONFIG.speed === 0) {
                    update();
                }
            }
            draw();
            frameCount++;
            requestAnimationFrame(loop);
        }

        init();

    </script>
</body>
</html>
