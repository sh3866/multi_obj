<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spherical Game of Life</title>
    <style>
        :root {
            --bg-color: #09090b;
            --panel-bg: rgba(20, 20, 23, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ececf1;
            --text-secondary: #71717a;
            --accent: #2563eb;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ambient Background Noise/Gradient */
        .ambient-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 50%, rgba(17, 24, 39, 0.4) 0%, rgba(9, 9, 11, 1) 70%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            z-index: 0;
            pointer-events: none;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 320px;
            width: 100%;
            height: 100%;
        }

        /* Canvas Area */
        .canvas-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            display: block;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        /* Control Panel */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--panel-border);
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            height: 100%;
            overflow-y: auto;
            z-index: 10;
        }

        /* Typography */
        h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Stats (Moved to Top) */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--panel-border);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-val {
            font-size: 16px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        /* Controls */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .label-text {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .label-val {
            font-size: 11px;
            color: var(--text-secondary);
            font-family: monospace;
        }

        /* Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: var(--text-primary);
            margin-top: -5px;
            border: 2px solid #000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        /* Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--panel-border);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: var(--font-stack);
        }

        button:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Specific Button Styles */
        #toggleBtn {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border-color: transparent;
            font-weight: 600;
        }
        #toggleBtn:hover {
            background: #fff;
        }
        #toggleBtn.paused {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--panel-border);
        }

        #clearBtn {
            width: 100%;
            margin-top: 8px;
            color: var(--text-secondary);
            border-color: transparent;
        }
        #clearBtn:hover {
            color: #f87171; /* Subtle red warning on hover only */
            background: rgba(248, 113, 113, 0.1);
        }

        /* Responsive */
        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .panel {
                height: auto;
                max-height: 40vh;
                border-left: none;
                border-top: 1px solid var(--panel-border);
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <div class="container">
        <div class="canvas-wrapper" id="canvasContainer">
            <canvas id="lifeCanvas"></canvas>
        </div>

        <div class="panel">
            <div>
                <h1>Sphere Life</h1>
                <p class="subtitle">Cellular automaton on a 3D manifold. Drag to rotate.</p>
            </div>

            <!-- Stats moved to top for hierarchy -->
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-val" id="genCount">0</span>
                    <span class="stat-label">Generations</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" id="popCount">0</span>
                    <span class="stat-label">Population</span>
                </div>
            </div>

            <div class="control-group">
                <div>
                    <div class="label-row">
                        <span class="label-text">Simulation Speed</span>
                        <span class="label-val" id="speedVal">60%</span>
                    </div>
                    <input type="range" id="speedSlider" min="0" max="20" value="10">
                </div>
                
                <div>
                    <div class="label-row">
                        <span class="label-text">Cell Density</span>
                        <span class="label-val" id="densityVal">High</span>
                    </div>
                    <input type="range" id="densitySlider" min="10" max="50" value="24">
                </div>
            </div>

            <div class="control-group">
                <div class="label-row" style="margin-bottom: 12px;">
                    <span class="label-text">Actions</span>
                </div>
                <div class="btn-group">
                    <button id="toggleBtn">Pause</button>
                    <button id="resetBtn">Randomize</button>
                </div>
                <button id="clearBtn">Clear All</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Configuration & State
         */
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let centerX, centerY;
        let radius;

        const CONFIG = {
            sphereRadius: 280,
            gridResolution: 24, // Starts higher for density
            speed: 10, 
            evolutionRate: 0.05 // Faster color cycling
        };

        let isRunning = true;
        let frameCount = 0;
        let generation = 0;
        let population = 0;
        
        let grid = [];
        let nextGrid = [];
        let cellAge = []; // Stores age for color mapping
        let cols, rows;

        // Interaction State
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let rotationX = 0.5; 
        let rotationY = 0;
        let targetRotationX = 0.5;
        let targetRotationY = 0;

        /**
         * Initialization
         */
        function init() {
            resize();
            createGrid();
            randomizeGrid();
            window.addEventListener('resize', resize);
            
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', handleMouseMove);
            
            canvas.addEventListener('touchstart', (e) => {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, {passive: false});
            window.addEventListener('touchend', () => isDragging = false);
            window.addEventListener('touchmove', (e) => {
                if(isDragging) {
                    const dx = e.touches[0].clientX - lastMouseX;
                    const dy = e.touches[0].clientY - lastMouseY;
                    targetRotationY += dx * 0.005;
                    targetRotationX += dy * 0.005;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});

            // UI Bindings
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                CONFIG.speed = 21 - e.target.value;
                document.getElementById('speedVal').innerText = Math.round((e.target.value/20)*100) + '%';
            });
            
            document.getElementById('densitySlider').addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                CONFIG.gridResolution = val;
                let label = "High";
                if (val < 18) label = "Very High";
                else if (val > 35) label = "Low";
                document.getElementById('densityVal').innerText = label;
                createGrid();
                randomizeGrid();
            });

            const toggleBtn = document.getElementById('toggleBtn');
            toggleBtn.addEventListener('click', () => {
                isRunning = !isRunning;
                toggleBtn.innerText = isRunning ? "Pause" : "Resume";
                if (!isRunning) toggleBtn.classList.add('paused');
                else toggleBtn.classList.remove('paused');
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                randomizeGrid();
                generation = 0;
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                grid = grid.map(row => row.fill(0));
                cellAge = cellAge.map(row => row.fill(0));
                generation = 0;
                population = 0;
                updateStats();
            });

            loop();
        }

        function resize() {
            const container = document.getElementById('canvasContainer');
            width = container.clientWidth;
            height = container.clientHeight;
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            centerX = width / 2;
            centerY = height / 2;
            radius = Math.min(width, height) * 0.35;
            CONFIG.sphereRadius = radius;
        }

        function createGrid() {
            rows = CONFIG.gridResolution;
            cols = CONFIG.gridResolution * 2; 
            
            grid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            nextGrid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellAge = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
        }

        function randomizeGrid() {
            population = 0;
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    grid[y][x] = Math.random() > 0.6 ? 1 : 0; // Slightly sparser start
                    cellAge[y][x] = Math.random() * 10; 
                    if (grid[y][x]) population++;
                }
            }
            updateStats();
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        function updateStats() {
            document.getElementById('genCount').innerText = generation;
            document.getElementById('popCount').innerText = population;
        }

        /**
         * Simulation Logic
         */
        function update() {
            population = 0;
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const neighbors = countNeighbors(x, y);
                    const state = grid[y][x];
                    
                    if (state === 0 && neighbors === 3) {
                        nextGrid[y][x] = 1;
                        cellAge[y][x] = 0; // Reset age on birth
                    } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[y][x] = 0;
                    } else {
                        nextGrid[y][x] = state;
                        if (state === 1) cellAge[y][x] += CONFIG.evolutionRate;
                    }

                    if (nextGrid[y][x] === 1) population++;
                }
            }

            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            updateStats();
        }

        function countNeighbors(x, y) {
            let sum = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    sum += grid[row][col];
                }
            }
            return sum;
        }

        /**
         * Rendering
         */
        function draw() {
            ctx.fillStyle = '#09090b'; // Match CSS bg
            ctx.fillRect(0, 0, width, height);

            if (!isDragging) {
                targetRotationY += 0.002; 
            }
            rotationX += (targetRotationX - rotationX) * 0.1;
            rotationY += (targetRotationY - rotationY) * 0.1;

            // Draw Sphere "Volume" (Subtle Atmosphere)
            // Using a radial gradient to give the sphere a glassy/contained feel
            const atmosGrad = ctx.createRadialGradient(centerX, centerY, radius * 0.85, centerX, centerY, radius * 1.05);
            atmosGrad.addColorStop(0, 'rgba(255, 255, 255, 0.02)');
            atmosGrad.addColorStop(0.9, 'rgba(100, 116, 139, 0.05)');
            atmosGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = atmosGrad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 1.05, 0, Math.PI * 2);
            ctx.fill();

            // Draw Grid Cells
            // We draw all cells, but use alpha/z-depth to fade back ones
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (grid[y][x] === 1) {
                        drawCell(x, y);
                    }
                }
            }
        }

        function drawCell(col, row) {
            const u = col / cols;
            const v = row / rows;

            const theta = u * 2 * Math.PI;
            const phi = (v * Math.PI) - (Math.PI / 2);

            // 3D Coordinates
            let px = radius * Math.cos(phi) * Math.cos(theta);
            let py = radius * Math.sin(phi);
            let pz = radius * Math.cos(phi) * Math.sin(theta);

            // Rotation Y
            let x1 = px * Math.cos(rotationY) - pz * Math.sin(rotationY);
            let z1 = px * Math.sin(rotationY) + pz * Math.cos(rotationY);
            // Rotation X
            let y2 = py * Math.cos(rotationX) - z1 * Math.sin(rotationX);
            let z2 = py * Math.sin(rotationX) + z1 * Math.cos(rotationX);

            // Perspective
            const fov = 800;
            const scale = fov / (fov + z2);
            
            if (scale < 0) return; // Behind camera

            const screenX = centerX + x1 * scale;
            const screenY = centerY + y2 * scale;

            // Cell Geometry: Small Squares (Hexagonal-ish feel with gaps)
            // Base size relative to sphere curvature
            const cellSize = (radius * 0.045) * scale; 

            // Color System: "Cyberpunk / Deep Ocean"
            // Base Hue 240 (Blue) -> 320 (Magenta) -> 160 (Cyan) based on age
            const age = cellAge[row][col];
            const hue = (240 + (age * 30)) % 360;
            
            // Lighting: Front (low z2) is bright, Back (high z2) is dark
            // z2 ranges roughly from -radius to radius
            const depthFactor = (z2 + radius) / (2 * radius); // 0 (front) to 1 (back)
            
            // Invert depth for alpha: Front = 1, Back = 0.1
            const alpha = 1.0 - (depthFactor * 0.9);
            
            // Brightness logic
            const lightness = 60 - (depthFactor * 30); // 60% bright at front, 30% at back

            // Draw Rect (Crisp Geometry)
            ctx.fillStyle = `hsla(${hue}, 80%, ${lightness}%, ${alpha})`;
            
            // Add a subtle stroke for separation
            ctx.strokeStyle = `hsla(${hue}, 90%, ${lightness + 10}%, ${alpha})`;
            ctx.lineWidth = 1;

            ctx.beginPath();
            // Use a slight gap to make them look like individual tiles
            const gap = 1;
            ctx.rect(screenX - cellSize/2 + gap, screenY - cellSize/2 + gap, cellSize - gap*2, cellSize - gap*2);
            ctx.fill();
            
            // Optional: Only stroke front cells to save perf and reduce noise
            if (depthFactor < 0.3) {
                ctx.stroke();
            }
        }

        function loop() {
            if (isRunning) {
                if (frameCount % Math.max(1, Math.floor(CONFIG.speed)) === 0) {
                    update();
                }
            }
            draw();
            frameCount++;
            requestAnimationFrame(loop);
        }

        init();

    </script>
</body>
</html>
