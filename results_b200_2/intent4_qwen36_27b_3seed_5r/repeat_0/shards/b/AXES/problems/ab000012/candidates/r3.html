<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereal Summoning</title>
    <style>
        :root {
            --bg-deep: #05020a;
            --bg-radial: radial-gradient(circle at 50% 30%, #2a1b4d 0%, #0f081c 50%, #030106 100%);
            --gold: #f2c94c;
            --gold-dark: #b8860b;
            --gold-glow: rgba(242, 201, 76, 0.6);
            --purple: #8b5cf6;
            --purple-glow: rgba(139, 92, 246, 0.5);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --glass-surface: rgba(10, 8, 20, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-display: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            --font-ui: "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-deep);
            background-image: var(--bg-radial);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Texture & Atmosphere --- */
        #canvas-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJub2lzZSI+PGZlVHVyYnVsZW5jZSB0eXBlPSJmcmFjdGFsTm9pc2UiIGJhc2VGcmVxdWVuY3k9IjAuNjUiIG51bU9jdGF2ZXM9IjMiIHN0aXRjaFRpbGVzPSJzdGl0Y2giLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjbm9pc2UpIiBvcGFjaXR5PSIwLjA1Ii8+PC9zdmc+');
            opacity: 0.4;
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: overlay;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 30%, #000000 120%);
            pointer-events: none;
            z-index: 2;
        }

        /* --- UI Container --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 1.5rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            position: relative;
        }

        .brand {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: #fff;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .brand::before {
            content: '';
            display: block;
            width: 6px; height: 24px;
            background: linear-gradient(to bottom, var(--gold), transparent);
        }

        .currency-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, rgba(20, 20, 30, 0.8) 0%, rgba(40, 30, 10, 0.9) 100%);
            border: 1px solid rgba(242, 201, 76, 0.3);
            border-right: 4px solid var(--gold);
            border-radius: 4px;
            padding: 6px 16px 6px 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            transform: skewX(-10deg);
        }

        .currency-pill:hover {
            border-color: var(--gold);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .currency-pill > * {
            transform: skewX(10deg); /* Un-skew content */
        }

        .gold-icon {
            width: 28px;
            height: 28px;
            fill: var(--gold);
            filter: drop-shadow(0 0 2px var(--gold));
        }

        .currency-amount {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        /* --- Hero Area (Atmospheric Anchor) --- */
        .hero-section {
            flex: 0 0 auto;
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 1rem;
        }

        /* The Central Arcane Circle */
        .arcane-anchor {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            pointer-events: none;
            z-index: -1;
            opacity: 0.8;
        }

        .arcane-ring {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(139, 92, 246, 0.2);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.05);
            animation: spin 60s linear infinite;
        }

        .arcane-ring::before {
            content: '';
            position: absolute;
            top: 15%; left: 15%; right: 15%; bottom: 15%;
            border: 1px dashed rgba(139, 92, 246, 0.4);
            border-radius: 50%;
            animation: spin-reverse 40s linear infinite;
        }

        .arcane-ring::after {
            content: '';
            position: absolute;
            top: 30%; left: 30%; right: 30%; bottom: 30%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(15px);
            animation: pulse-glow 4s ease-in-out infinite;
        }

        h1.game-title {
            font-family: var(--font-display);
            font-size: 3.2rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #fff;
            text-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
            margin-bottom: 0.5rem;
            position: relative;
        }

        .subtitle {
            font-family: var(--font-display);
            font-size: 0.9rem;
            color: var(--gold);
            letter-spacing: 0.4em;
            text-transform: uppercase;
            opacity: 0.9;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 2px;
            border: 1px solid rgba(242, 201, 76, 0.2);
        }

        /* --- Navigation Grid --- */
        .nav-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 2rem;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr; /* Wider left column for Summon */
            grid-template-rows: 1fr 1fr;
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
            height: 100%;
            max-height: 550px;
        }

        /* --- Card Shared Styles --- */
        .nav-card {
            position: relative;
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* Structural Corner Accents (Unified) */
        .nav-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 1px solid transparent;
            border-top: 2px solid rgba(255,255,255,0.1);
            border-bottom: 2px solid rgba(255,255,255,0.1);
            pointer-events: none;
            transition: border-color 0.3s;
        }
        .nav-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 1px solid transparent;
            border-left: 2px solid rgba(255,255,255,0.1);
            border-right: 2px solid rgba(255,255,255,0.1);
            pointer-events: none;
            transition: border-color 0.3s;
        }

        .nav-card:hover {
            transform: translateY(-5px);
            background: rgba(20, 15, 35, 0.8);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .nav-card:hover::before, .nav-card:hover::after {
            border-color: rgba(255,255,255,0.3);
        }

        .card-icon-wrap {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .card-icon {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #fff;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
            transition: all 0.3s ease;
        }

        .card-text {
            text-align: center;
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            color: #fff;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .card-subtitle {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* --- PRIMARY CARD (Summon) --- */
        .card-summon {
            grid-column: 1 / 2;
            grid-row: 1 / 3;
            background: linear-gradient(180deg, rgba(30, 20, 50, 0.8) 0%, rgba(10, 5, 20, 0.9) 100%);
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.15);
            position: relative;
        }

        /* Specific inner glow for Summon */
        .card-summon::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .card-summon:hover {
            border-color: var(--purple);
            box-shadow: 0 0 70px rgba(139, 92, 246, 0.3);
        }

        .card-summon .card-icon-wrap {
            width: 140px;
            height: 140px;
            position: relative;
            margin-bottom: 1.5rem;
        }

        /* Pulsing Aura */
        .card-summon .card-icon-wrap::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 120px; height: 120px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
            animation: pulse-glow 3s infinite;
        }

        .card-summon .card-icon {
            stroke: var(--purple);
            stroke-width: 1.2;
            filter: drop-shadow(0 0 10px var(--purple));
            z-index: 1;
        }

        .card-summon .card-title {
            font-size: 3.5rem;
            background: linear-gradient(to bottom, #fff, #d8b4fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .card-summon .card-subtitle {
            color: var(--purple);
            font-size: 1.1rem;
            letter-spacing: 0.3em;
            opacity: 0.9;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
        }

        /* --- SECONDARY CARDS --- */
        .secondary-group {
            grid-column: 2 / 3;
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: 100%;
        }

        .secondary-group .nav-card {
            flex: 1;
        }

        /* Distinct Themes (Unified Line Art, Distinct Colors) */
        .card-roster:hover { border-color: #4facfe; box-shadow: 0 0 25px rgba(79, 172, 254, 0.2); }
        .card-roster:hover .card-icon { stroke: #4facfe; filter: drop-shadow(0 0 8px #4facfe); }

        .card-battle:hover { border-color: #ff4b4b; box-shadow: 0 0 25px rgba(255, 75, 75, 0.2); }
        .card-battle:hover .card-icon { stroke: #ff4b4b; filter: drop-shadow(0 0 8px #ff4b4b); }

        .card-grind:hover { border-color: var(--gold); box-shadow: 0 0 25px rgba(242, 201, 76, 0.2); }
        .card-grind:hover .card-icon { stroke: var(--gold); filter: drop-shadow(0 0 8px var(--gold)); }

        /* --- Animations --- */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes pulse-glow { 0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .nav-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto;
                max-height: none;
                gap: 1rem;
            }
            .card-summon {
                grid-column: 1 / -1;
                grid-row: 1;
                min-height: 250px;
            }
            .secondary-group {
                grid-column: 1 / -1;
                grid-row: 2;
                flex-direction: row;
            }
            .secondary-group .nav-card {
                height: 160px;
            }
            h1.game-title { font-size: 2.5rem; }
            .arcane-anchor { width: 200px; height: 200px; top: 30%; }
        }
    </style>
</head>
<body>

    <!-- Background Canvas -->
    <canvas id="canvas-bg"></canvas>
    <div class="noise-overlay"></div>
    <div class="vignette"></div>

    <div class="ui-layer">
        <header>
            <div class="brand">Aetheria</div>
            <div class="currency-pill">
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z" />
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <section class="hero-section">
            <div class="arcane-anchor">
                <div class="arcane-ring"></div>
            </div>
            <h1 class="game-title">Spirit Summoning</h1>
            <p class="subtitle">Ritual of Awakening</p>
        </section>

        <div class="nav-container">
            <nav class="nav-grid">
                
                <!-- PRIMARY ACTION: Summon -->
                <div class="nav-card card-summon" onclick="interact('summon')">
                    <div class="card-icon-wrap">
                        <!-- Thematic Icon: Eye / Third Eye -->
                        <svg class="card-icon" viewBox="0 0 24 24">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                            <circle cx="12" cy="12" r="3" />
                            <path d="M12 2v2m0 14v2m-9-9h2m14 0h2" opacity="0.6"/>
                        </svg>
                    </div>
                    <div class="card-text">
                        <div class="card-title">Summon</div>
                        <div class="card-subtitle">Invoke the Ancient</div>
                    </div>
                </div>

                <!-- SECONDARY ACTIONS -->
                <div class="secondary-group">
                    
                    <!-- Roster -->
                    <div class="nav-card card-roster" onclick="interact('roster')">
                        <div class="card-icon-wrap">
                            <!-- Thematic Icon: Spirit Tome -->
                            <svg class="card-icon" viewBox="0 0 24 24">
                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                                <circle cx="12" cy="12" r="2" opacity="0.5"/>
                            </svg>
                        </div>
                        <div class="card-text">
                            <div class="card-title">Roster</div>
                            <div class="card-subtitle">Bound Spirits</div>
                        </div>
                    </div>

                    <!-- Battle -->
                    <div class="nav-card card-battle" onclick="interact('battle')">
                        <div class="card-icon-wrap">
                            <!-- Thematic Icon: Rune Blade -->
                            <svg class="card-icon" viewBox="0 0 24 24">
                                <path d="M14.5 17.5L3 6V3h3l11.5 11.5-3 3z" />
                                <path d="M13 19l6-6" />
                                <path d="M16 16l4 4" />
                                <path d="M19 21l2-2" />
                            </svg>
                        </div>
                        <div class="card-text">
                            <div class="card-title">Battle</div>
                            <div class="card-subtitle">Spirit Arena</div>
                        </div>
                    </div>

                    <!-- Grind -->
                    <div class="nav-card card-grind" onclick="interact('grind')">
                        <div class="card-icon-wrap">
                            <!-- Thematic Icon: Alchemical Flask -->
                            <svg class="card-icon" viewBox="0 0 24 24">
                                <path d="M10 2v7.31l-4.24 8.47A2 2 0 0 0 7.56 20h8.88a2 2 0 0 0 1.8-2.22L14 9.31V2" />
                                <path d="M8.5 2h7" />
                                <path d="M8.5 14h7" />
                            </svg>
                        </div>
                        <div class="card-text">
                            <div class="card-title">Grind</div>
                            <div class="card-subtitle">Resource Forge</div>
                        </div>
                    </div>

                </div>
            </nav>
        </div>
    </div>

    <script>
        // --- Canvas Particle System (Ethereal Spirits) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 100;
                this.size = Math.random() * 2 + 0.5;
                this.speed = Math.random() * 0.4 + 0.1;
                this.opacity = Math.random() * 0.5;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.02 + 0.01;
                
                // 10% chance for a "Spirit" (gold) particle
                this.isGold = Math.random() > 0.9;
            }

            update() {
                this.y -= this.speed;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 0.3;

                if (this.y < -20) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                
                if (this.isGold) {
                    ctx.fillStyle = `rgba(242, 201, 76, ${this.opacity})`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "rgba(242, 201, 76, 0.5)";
                } else {
                    // Ethereal Purple/White
                    ctx.fillStyle = `rgba(200, 180, 255, ${this.opacity})`;
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = "rgba(139, 92, 246, 0.3)";
                }
                
                ctx.fill();
                ctx.shadowBlur = 0; // Reset
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(type) {
            const card = event.currentTarget;
            // Simple ripple visual feedback
            card.style.transform = "scale(0.98)";
            card.style.filter = "brightness(1.2)";
            setTimeout(() => {
                card.style.transform = "";
                card.style.filter = "";
            }, 150);
        }
    </script>
</body>
</html>
