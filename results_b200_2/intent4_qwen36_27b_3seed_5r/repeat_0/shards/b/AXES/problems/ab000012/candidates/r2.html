<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereal Summoning</title>
    <style>
        :root {
            --bg-deep: #05020a;
            --bg-radial: radial-gradient(circle at 50% 40%, #1e103a 0%, #090514 60%, #020105 100%);
            --gold: #ffd700;
            --gold-dim: #b8860b;
            --purple-glow: #bd93f9;
            --purple-deep: #6c429c;
            --glass-bg: rgba(20, 15, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            --font-display: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            --font-ui: "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-deep);
            background-image: var(--bg-radial);
            color: #fff;
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Atmosphere & Texture --- */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 40%, #000000 120%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- UI Layer --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 2rem 3rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .brand {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: rgba(255,255,255,0.6);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border-left: 2px solid var(--gold-dim);
            padding-left: 12px;
        }

        /* Currency Pill - Polished */
        .currency-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(90deg, rgba(0,0,0,0.6) 0%, rgba(40,30,10,0.8) 100%);
            border: 1px solid rgba(184, 134, 11, 0.4);
            border-radius: 50px;
            padding: 8px 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .currency-pill:hover {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .gold-icon {
            width: 20px;
            height: 20px;
            fill: var(--gold);
            filter: drop-shadow(0 0 5px var(--gold));
        }

        .currency-amount {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: #fff;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* --- Hero Section --- */
        .hero-section {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        /* Central Ritual Circle (Atmospheric) */
        .ritual-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            pointer-events: none;
            z-index: -1;
            opacity: 0.6;
            animation: breathe 8s ease-in-out infinite;
        }

        .ritual-ring {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(189, 147, 249, 0.15);
            box-shadow: 0 0 30px rgba(108, 66, 156, 0.1);
        }

        .ritual-ring::before {
            content: '';
            position: absolute;
            top: 10%; left: 10%; right: 10%; bottom: 10%;
            border: 1px dashed rgba(189, 147, 249, 0.2);
            border-radius: 50%;
            animation: spin 60s linear infinite;
        }

        .ritual-ring::after {
            content: '';
            position: absolute;
            top: 25%; left: 25%; right: 25%; bottom: 25%;
            background: radial-gradient(circle, rgba(189, 147, 249, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(10px);
        }

        h1.game-title {
            font-family: var(--font-display);
            font-size: 3.5rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #fff;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(189, 147, 249, 0.4);
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--gold);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* --- Navigation Grid (Rebalanced) --- */
        .nav-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr; /* 60/40 Split */
            grid-template-rows: 1fr 1fr;
            gap: 1.5rem;
            width: 100%;
            max-width: 1000px;
            height: 100%;
            max-height: 500px;
        }

        /* --- Unified Card Base --- */
        .nav-card {
            position: relative;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 4px; /* Sharper, more architectural */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* Corner Accents (Runes) */
        .nav-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 20px; height: 20px;
            border-top: 2px solid rgba(255,255,255,0.3);
            border-left: 2px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease;
        }
        .nav-card::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 20px; height: 20px;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            border-right: 2px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease;
        }

        .nav-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(30, 25, 50, 0.7);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        
        .nav-card:hover::before, .nav-card:hover::after {
            width: 100%; height: 100%;
            opacity: 0.1;
            border-color: #fff;
        }

        /* Iconography - Unified Glowing Line Art */
        .card-icon-wrap {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .card-icon {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #fff;
            stroke-width: 1.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 3px rgba(255,255,255,0.4));
            transition: all 0.3s ease;
        }

        .nav-card:hover .card-icon {
            stroke: #fff;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
            transform: scale(1.05);
        }

        .card-text {
            text-align: left; /* Unified Alignment */
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            color: #fff;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        /* --- PRIMARY CARD (Summon) --- */
        .card-summon {
            grid-column: 1 / 2;
            grid-row: 1 / 3;
            background: linear-gradient(180deg, rgba(40, 20, 60, 0.7) 0%, rgba(15, 5, 30, 0.8) 100%);
            border: 1px solid rgba(189, 147, 249, 0.3);
            box-shadow: 0 0 40px rgba(108, 66, 156, 0.15);
            padding: 3rem;
            justify-content: center; /* Center content vertically */
            align-items: center; /* Center content horizontally */
            text-align: center;
        }

        .card-summon:hover {
            border-color: var(--purple-glow);
            box-shadow: 0 0 60px rgba(108, 66, 156, 0.4);
        }

        /* Summon Specifics: Centralized Icon */
        .card-summon .card-icon-wrap {
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
            position: relative;
        }

        /* Glowing Aura behind Summon Icon */
        .card-summon .card-icon-wrap::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100px; height: 100px;
            background: radial-gradient(circle, rgba(189, 147, 249, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(15px);
            animation: pulse 4s infinite;
        }

        .card-summon .card-icon {
            stroke: var(--purple-glow);
            stroke-width: 1;
            filter: drop-shadow(0 0 10px var(--purple-glow));
        }

        .card-summon .card-title {
            font-size: 3rem;
            background: linear-gradient(to bottom, #fff, #d8b4fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .card-summon .card-subtitle {
            color: var(--purple-glow);
            font-size: 1rem;
            letter-spacing: 0.25em;
            opacity: 1;
        }

        /* --- SECONDARY CARDS --- */
        .secondary-group {
            grid-column: 2 / 3;
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: 100%;
        }

        .secondary-group .nav-card {
            flex: 1;
        }

        /* Distinct Themes via Hover */
        .card-roster:hover {
            border-color: #4facfe;
            box-shadow: 0 0 25px rgba(79, 172, 254, 0.2);
        }
        .card-roster .card-icon { stroke: #4facfe; filter: drop-shadow(0 0 5px #4facfe); }

        .card-battle:hover {
            border-color: #ff4b4b;
            box-shadow: 0 0 25px rgba(255, 75, 75, 0.2);
        }
        .card-battle .card-icon { stroke: #ff4b4b; filter: drop-shadow(0 0 5px #ff4b4b); }

        .card-grind:hover {
            border-color: var(--gold);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
        }
        .card-grind .card-icon { stroke: var(--gold); filter: drop-shadow(0 0 5px var(--gold)); }

        /* --- Footer --- */
        footer {
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 0.7rem;
            padding-top: 1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* --- Animations --- */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } }
        @keyframes breathe { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; } 50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.7; } }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .nav-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto;
                max-height: none;
                gap: 1rem;
            }
            .card-summon {
                grid-column: 1 / -1;
                grid-row: 1;
                min-height: 250px;
            }
            .secondary-group {
                grid-column: 1 / -1;
                grid-row: 2;
                flex-direction: row;
            }
            .secondary-group .nav-card {
                height: 150px;
            }
            h1.game-title { font-size: 2.5rem; }
            .ritual-container { width: 250px; height: 250px; }
        }
    </style>
</head>
<body>

    <!-- Background Canvas -->
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="ui-layer">
        <header>
            <div class="brand">Aetheria</div>
            <div class="currency-pill">
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z" />
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <section class="hero-section">
            <div class="ritual-container">
                <div class="ritual-ring"></div>
            </div>
            <h1 class="game-title">Spirit Summoning</h1>
            <p class="subtitle">Awaken the Ancient Bonds</p>
        </section>

        <div class="nav-container">
            <nav class="nav-grid">
                
                <!-- PRIMARY ACTION: Summon -->
                <div class="nav-card card-summon" onclick="interact('summon')">
                    <div class="card-icon-wrap">
                        <!-- Unified Line Art: Eye/Spiral -->
                        <svg class="card-icon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="9" />
                            <circle cx="12" cy="12" r="3" />
                            <path d="M12 3v2m0 14v2m-9-9h2m14 0h2" opacity="0.5"/>
                        </svg>
                    </div>
                    <div class="card-text">
                        <div class="card-title">Summon</div>
                        <div class="card-subtitle">Ritual of Awakening</div>
                    </div>
                </div>

                <!-- SECONDARY ACTIONS -->
                <div class="secondary-group">
                    
                    <!-- Roster -->
                    <div class="nav-card card-roster" onclick="interact('roster')">
                        <div class="card-icon-wrap">
                            <!-- Unified Line Art: Shield -->
                            <svg class="card-icon" viewBox="0 0 24 24">
                                <path d="M12 2L3 7v5c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/>
                                <path d="M9 12l2 2 4-4" />
                            </svg>
                        </div>
                        <div class="card-text">
                            <div class="card-title">Roster</div>
                            <div class="card-subtitle">Bound Spirits</div>
                        </div>
                    </div>

                    <!-- Battle -->
                    <div class="nav-card card-battle" onclick="interact('battle')">
                        <div class="card-icon-wrap">
                            <!-- Unified Line Art: Crossed Swords -->
                            <svg class="card-icon" viewBox="0 0 24 24">
                                <path d="M14.5 17.5L3 6V3h3l11.5 11.5-3 3zm-5-5L6 7l-1 1 3.5 3.5-1 1zm10-10l-3 3L6.5 16l3 3 10-10-3-3z" />
                            </svg>
                        </div>
                        <div class="card-text">
                            <div class="card-title">Battle</div>
                            <div class="card-subtitle">Spirit Arena</div>
                        </div>
                    </div>

                    <!-- Grind -->
                    <div class="nav-card card-grind" onclick="interact('grind')">
                        <div class="card-icon-wrap">
                            <!-- Unified Line Art: Pickaxe -->
                            <svg class="card-icon" viewBox="0 0 24 24">
                                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
                            </svg>
                        </div>
                        <div class="card-text">
                            <div class="card-title">Grind</div>
                            <div class="card-subtitle">Resource Forge</div>
                        </div>
                    </div>

                </div>
            </nav>
        </div>

        <footer>
            Aetheria &copy; 2023 &bull; Offline Mode
        </footer>
    </div>

    <script>
        // --- Canvas Particle System (Ethereal Spirits) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
                // Randomize start position
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 100;
                this.size = Math.random() * 2 + 0.5;
                this.speed = Math.random() * 0.5 + 0.1;
                this.opacity = Math.random() * 0.5;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.02 + 0.01;
                
                // 15% chance for a "Spirit" (gold) particle
                this.isGold = Math.random() > 0.85;
            }

            update() {
                this.y -= this.speed;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 0.5;

                if (this.y < -20) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                
                if (this.isGold) {
                    ctx.fillStyle = `rgba(255, 215, 0, ${this.opacity})`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "rgba(255, 215, 0, 0.5)";
                } else {
                    // Ethereal Purple/White
                    ctx.fillStyle = `rgba(200, 180, 255, ${this.opacity})`;
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = "rgba(189, 147, 249, 0.3)";
                }
                
                ctx.fill();
                ctx.shadowBlur = 0; // Reset
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(type) {
            const card = event.currentTarget;
            // Simple ripple visual feedback
            card.style.transform = "scale(0.98)";
            card.style.filter = "brightness(1.2)";
            setTimeout(() => {
                card.style.transform = "";
                card.style.filter = "";
            }, 150);
        }
    </script>
</body>
</html>
