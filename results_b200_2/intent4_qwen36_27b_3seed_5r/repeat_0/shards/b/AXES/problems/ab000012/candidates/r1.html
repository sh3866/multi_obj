<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            --bg-deep: #050508;
            --bg-gradient: radial-gradient(circle at 50% 30%, #1a1a2e 0%, #050508 80%);
            --accent-gold: #ffd700;
            --accent-gold-dim: #8a6e00;
            --accent-purple: #9d4edd;
            --accent-mist: rgba(255, 255, 255, 0.05);
            --text-main: #e0e0e0;
            --text-muted: #888899;
            --font-display: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            --font-ui: "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
            --glass-border: rgba(255, 255, 255, 0.08);
            --card-glow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Background & Atmosphere --- */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .fog-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 50% 40%, rgba(100, 50, 150, 0.15) 0%, transparent 60%),
                linear-gradient(to bottom, transparent 70%, var(--bg-deep) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* --- UI Container --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .brand-area {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-family: var(--font-display);
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .currency-pill {
            background: linear-gradient(90deg, rgba(20, 20, 20, 0.8), rgba(40, 40, 40, 0.8));
            border: 1px solid var(--accent-gold-dim);
            border-left: 3px solid var(--accent-gold);
            border-radius: 4px;
            padding: 0.4rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            transform: skewX(-10deg);
        }

        .currency-pill:hover {
            border-color: var(--accent-gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .currency-pill > * {
            transform: skewX(10deg); /* Counter skew content */
        }

        .gold-icon {
            width: 18px;
            height: 18px;
            fill: var(--accent-gold);
            filter: drop-shadow(0 0 4px var(--accent-gold));
        }

        .currency-amount {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--accent-gold);
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* --- Hero Section --- */
        .hero-section {
            text-align: center;
            margin-top: 2vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* The Ritual Circle behind text */
        .ritual-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: spin-slow 60s linear infinite;
            box-shadow: 0 0 50px rgba(100, 50, 150, 0.1);
        }
        .ritual-circle::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            right: 10%;
            bottom: 10%;
            border: 1px dashed rgba(255, 215, 0, 0.1);
            border-radius: 50%;
            animation: spin-reverse 40s linear infinite;
        }

        h1.game-title {
            font-family: var(--font-display);
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #fff;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.5),
                0 0 30px rgba(157, 78, 221, 0.6);
            margin-bottom: 0.5rem;
            font-weight: normal;
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.85rem;
            color: var(--accent-gold);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.8;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* --- Navigation Grid (Asymmetric) --- */
        .nav-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-top: 3rem;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 1.5rem;
            width: 100%;
            max-width: 900px;
            height: 100%;
            max-height: 450px;
        }

        /* --- Card Design (Glass & Runes) --- */
        .nav-card {
            position: relative;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Corner Decorations */
        .nav-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 16px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .nav-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        .card-content {
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }

        .card-icon-wrap {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: auto; /* Pushes text down */
        }

        .card-icon {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.3));
            transition: all 0.3s ease;
        }

        .nav-card:hover .card-icon {
            stroke: #fff;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
        }

        .card-text {
            text-align: right;
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: #fff;
            letter-spacing: 0.05em;
        }

        .card-subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 0.2rem;
        }

        /* --- PRIMARY CARD (Summon) --- */
        .card-summon {
            grid-column: 1 / 2;
            grid-row: 1 / 3; /* Spans full height */
            background: linear-gradient(180deg, rgba(30, 10, 50, 0.6) 0%, rgba(10, 5, 20, 0.8) 100%);
            border: 1px solid rgba(157, 78, 221, 0.3);
            box-shadow: 0 0 30px rgba(157, 78, 221, 0.1);
            padding: 2.5rem;
        }

        .card-summon:hover {
            border-color: var(--accent-purple);
            box-shadow: 0 0 50px rgba(157, 78, 221, 0.3);
            background: linear-gradient(180deg, rgba(40, 15, 70, 0.7) 0%, rgba(15, 5, 30, 0.9) 100%);
        }

        .card-summon .card-icon {
            stroke: var(--accent-purple);
            width: 80px;
            height: 80px;
            margin-bottom: 2rem;
        }

        .card-summon:hover .card-icon {
            stroke: #d8b4fe;
            filter: drop-shadow(0 0 15px var(--accent-purple));
        }

        .card-summon .card-title {
            font-size: 2.5rem;
            text-align: left;
            background: linear-gradient(to right, #fff, #d8b4fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-summon .card-subtitle {
            color: var(--accent-purple);
            font-size: 0.9rem;
            text-align: left;
            letter-spacing: 0.2em;
        }

        /* Summon Card Background Art */
        .summon-bg-art {
            position: absolute;
            bottom: -20px;
            right: -20px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(157, 78, 221, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
            z-index: 0;
            transition: all 0.5s ease;
        }
        .card-summon:hover .summon-bg-art {
            transform: scale(1.2);
            opacity: 1.5;
        }

        /* --- SECONDARY CARDS --- */
        .secondary-group {
            grid-column: 2 / 3;
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: 100%;
        }

        .secondary-group .nav-card {
            flex: 1;
        }

        /* Specific Themes for Secondary Cards */
        .card-roster:hover {
            border-color: #4facfe;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.2);
        }
        .card-roster .card-icon { stroke: #4facfe; }

        .card-battle:hover {
            border-color: #ff4b4b;
            box-shadow: 0 0 20px rgba(255, 75, 75, 0.2);
        }
        .card-battle .card-icon { stroke: #ff4b4b; }

        .card-grind:hover {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .card-grind .card-icon { stroke: #ffd700; }


        /* --- Footer --- */
        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding-top: 1rem;
            opacity: 0.6;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* --- Animations --- */
        @keyframes spin-slow { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .nav-grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                max-height: none;
            }
            .card-summon {
                grid-column: 1;
                grid-row: auto;
                height: 200px;
            }
            .secondary-group {
                grid-column: 1;
                grid-row: auto;
                flex-direction: row; /* Stack horizontally on mobile if space permits, or keep col */
                flex-wrap: wrap;
            }
            .secondary-group .nav-card {
                flex: 1 1 45%; /* Two per row */
                height: 150px;
            }
            h1.game-title { font-size: 2.5rem; }
            .ritual-circle { width: 200px; height: 200px; }
        }
    </style>
</head>
<body>

    <!-- Background Canvas for Atmosphere -->
    <canvas id="canvas-bg"></canvas>
    <div class="fog-layer"></div>

    <div class="ui-layer">
        <header>
            <!-- Decoration on left -->
            <div class="brand-area">
                <span class="brand-name">Aetheria</span>
            </div>

            <!-- Currency -->
            <div class="currency-pill">
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z" />
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <section class="hero-section">
            <div class="ritual-circle"></div>
            <h1 class="game-title">Spirit Summoning</h1>
            <p class="subtitle">Awaken the Ancient Bonds</p>
        </section>

        <div class="nav-container">
            <nav class="nav-grid">
                
                <!-- PRIMARY ACTION: Summon -->
                <div class="nav-card card-summon" onclick="interact('summon')">
                    <div class="summon-bg-art"></div>
                    <div class="card-content">
                        <div class="card-icon-wrap">
                            <!-- Rune / Eye Icon -->
                            <svg class="card-icon" viewBox="0 0 24 24">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                                <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>
                                <path d="M12 6v2m0 8v2m-6-6h2m8 0h2" opacity="0.5"/>
                            </svg>
                        </div>
                        <div class="card-text">
                            <div class="card-title">Summon</div>
                            <div class="card-subtitle">Ritual of Awakening</div>
                        </div>
                    </div>
                </div>

                <!-- SECONDARY ACTIONS -->
                <div class="secondary-group">
                    
                    <!-- Roster -->
                    <div class="nav-card card-roster" onclick="interact('roster')">
                        <div class="card-content">
                            <div class="card-icon-wrap">
                                <!-- Shield/Profile Icon -->
                                <svg class="card-icon" viewBox="0 0 24 24">
                                    <path d="M12 2L3 7v5c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm0 2.18l7 3.89v4.43c0 4.56-3.07 8.81-7 10.03-3.93-1.22-7-5.47-7-10.03V8.07l7-3.89z"/>
                                    <path d="M12 7a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-4 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>
                                </svg>
                            </div>
                            <div class="card-text">
                                <div class="card-title">Roster</div>
                                <div class="card-subtitle">Bound Spirits</div>
                            </div>
                        </div>
                    </div>

                    <!-- Battle -->
                    <div class="nav-card card-battle" onclick="interact('battle')">
                        <div class="card-content">
                            <div class="card-icon-wrap">
                                <!-- Crossed Swords Icon -->
                                <svg class="card-icon" viewBox="0 0 24 24">
                                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5-3 3zm-5-5L6 7l-1 1 3.5 3.5-1 1zm10-10l-3 3L6.5 16l3 3 10-10-3-3z"/>
                                </svg>
                            </div>
                            <div class="card-text">
                                <div class="card-title">Battle</div>
                                <div class="card-subtitle">Spirit Arena</div>
                            </div>
                        </div>
                    </div>

                    <!-- Grind -->
                    <div class="nav-card card-grind" onclick="interact('grind')">
                        <div class="card-content">
                            <div class="card-icon-wrap">
                                <!-- Pickaxe/Hammer Icon -->
                                <svg class="card-icon" viewBox="0 0 24 24">
                                    <path d="M17.66 7.43L12 18l-5.66-10.57 2.46-2.46L12 9l3.2-3.97 2.46 2.4z"/>
                                    <path d="M6 21l6-6 6 6H6z"/>
                                    <path d="M19 3l-6 6-6-6 6-6 6 6z" opacity="0.5"/>
                                </svg>
                            </div>
                            <div class="card-text">
                                <div class="card-title">Grind</div>
                                <div class="card-subtitle">Resource Forge</div>
                            </div>
                        </div>
                    </div>

                </div>
            </nav>
        </div>

        <footer>
            Aetheria &copy; 2023 &bull; Offline Mode
        </footer>
    </div>

    <script>
        // --- Canvas Particle System (Ethereal Spirits) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
                // Randomize start position to fill screen immediately
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 100;
                this.size = Math.random() * 2 + 0.5;
                this.speed = Math.random() * 0.5 + 0.1;
                this.opacity = Math.random() * 0.5;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.02 + 0.01;
                
                // 10% chance for a "Spirit" (gold) particle, 90% mist (white/blue)
                this.isGold = Math.random() > 0.9;
            }

            update() {
                this.y -= this.speed;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 0.5;

                // Reset if off screen
                if (this.y < -20) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                
                if (this.isGold) {
                    ctx.fillStyle = `rgba(255, 215, 0, ${this.opacity})`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "rgba(255, 215, 0, 0.5)";
                } else {
                    ctx.fillStyle = `rgba(200, 200, 255, ${this.opacity})`;
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = "rgba(200, 200, 255, 0.2)";
                }
                
                ctx.fill();
                ctx.shadowBlur = 0; // Reset
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(type) {
            const card = event.currentTarget;
            // Simple ripple visual feedback
            card.style.transform = "scale(0.98)";
            card.style.filter = "brightness(1.2)";
            setTimeout(() => {
                card.style.transform = "";
                card.style.filter = "";
            }, 150);
        }
    </script>
</body>
</html>
