<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - Spirit Summoning</title>
    <style>
        :root {
            /* Palette - Mystical & Deep */
            --bg-deep: #05020a;
            --bg-gradient: radial-gradient(ellipse at 50% 30%, #1a103c 0%, #090514 60%, #000000 100%);
            
            --gold: #f2c94c;
            --gold-dim: #9e8232;
            --gold-glow: rgba(242, 201, 76, 0.5);
            
            --purple: #b54eff;
            --purple-light: #e0aaff;
            --purple-dim: #3c096c;
            --purple-glow: rgba(181, 78, 255, 0.4);
            
            --text-main: #f8f9fa;
            --text-muted: #d1d5db;
            --text-dim: #9ca3af;
            
            /* Typography */
            --font-display: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            --font-ui: "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-deep);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Atmosphere & FX --- */
        #canvas-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Noise Texture for "Grit" */
        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.07'/%3E%3C/svg%3E");
            opacity: 0.4;
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: overlay;
        }

        /* Vignette for depth */
        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 30%, #000000 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* --- UI Layout --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 1.5rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .brand {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        /* Decorative line next to logo */
        .brand::before {
            content: '';
            display: block;
            width: 30px; height: 1px;
            background: linear-gradient(to right, transparent, var(--text-muted));
        }

        /* Currency Pill */
        .currency-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(242, 201, 76, 0.2);
            border-radius: 4px; /* Slightly squared for tech/mystic blend */
            padding: 8px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            position: relative;
        }
        
        /* Gold accent on currency */
        .currency-pill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.5;
        }

        .gold-icon {
            width: 20px;
            height: 20px;
            fill: var(--gold);
            filter: drop-shadow(0 0 4px var(--gold-glow));
        }

        .currency-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .currency-label {
            font-size: 0.65rem;
            color: var(--gold-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 3px;
        }

        .currency-amount {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--gold);
            font-weight: 700;
            text-shadow: 0 0 10px var(--gold-glow);
        }

        /* --- Hero Section (Atmospheric Anchor) --- */
        .hero-section {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        /* The Summoning Circle - Visual Anchor */
        .summoning-circle {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 250px;
            opacity: 0.7;
            pointer-events: none;
            z-index: -1;
            filter: blur(1px);
        }

        /* Rotating Rings */
        .circle-outer {
            position: absolute;
            top: 10%; left: 0; width: 100%; height: 80%;
            border: 1px solid rgba(181, 78, 255, 0.2);
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(181, 78, 255, 0.1);
            animation: pulse-ring 6s ease-in-out infinite;
        }

        .circle-inner {
            position: absolute;
            top: 20%; left: 15%; width: 70%; height: 60%;
            border: 2px dashed rgba(224, 170, 255, 0.3);
            border-radius: 50%;
            animation: spin 30s linear infinite;
        }
        
        /* Runes on the circle */
        .circle-inner::before {
            content: '᚛ ᚜ ᚐ ᚑ ᚒ ᚓ ᚔ ᚕ ᚖ ᚗ ᚘ ᚙ ᚚ ᚛ ᚜';
            position: absolute;
            top: -15px; left: 50%;
            transform: translateX(-50%);
            color: rgba(224, 170, 255, 0.4);
            font-family: var(--font-display);
            font-size: 10px;
            letter-spacing: 5px;
            white-space: nowrap;
        }

        .circle-core {
            position: absolute;
            top: 35%; left: 35%; width: 30%; height: 30%;
            background: radial-gradient(circle, rgba(181, 78, 255, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
            animation: breathe 4s ease-in-out infinite;
        }

        h1.game-title {
            font-family: var(--font-display);
            font-size: 3.5rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #fff;
            text-shadow: 0 0 30px rgba(181, 78, 255, 0.5), 0 0 10px rgba(181, 78, 255, 0.3);
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 2;
            background: linear-gradient(to bottom, #fff, #d1d5db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-family: var(--font-display); /* Changed to Serif as requested */
            font-size: 0.85rem;
            color: var(--purple-light); /* Increased contrast */
            letter-spacing: 0.4em;
            text-transform: uppercase;
            background: linear-gradient(to right, transparent, rgba(0,0,0,0.8), transparent);
            padding: 6px 30px;
            position: relative;
            z-index: 2;
            border-top: 1px solid rgba(181, 78, 255, 0.2);
            border-bottom: 1px solid rgba(181, 78, 255, 0.2);
            text-shadow: 0 0 8px rgba(181, 78, 255, 0.4);
        }

        /* --- Navigation Grid --- */
        .nav-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr; /* Balanced split */
            grid-template-rows: 1fr 1fr;
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
            height: 100%;
            max-height: 550px;
        }

        /* --- Card Component (Unified Grammar) --- */
        .nav-card {
            position: relative;
            background: linear-gradient(180deg, rgba(25, 20, 45, 0.7) 0%, rgba(10, 8, 20, 0.9) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.05);
        }

        /* Card Texture - Subtle crosshatch/parchment feel */
        .nav-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
        }

        /* Corner Accents - Consistent Runic Brackets */
        .corner {
            position: absolute;
            width: 16px; height: 16px;
            border: 1px solid rgba(255,255,255,0.4);
            transition: all 0.3s;
        }
        .tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
        .bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
        .br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

        /* Hover State */
        .nav-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
        }

        .nav-card:hover .corner {
            border-color: #fff;
            width: 20px; height: 20px; /* Expand corners slightly */
        }

        /* Iconography - Unified 2px Stroke */
        .card-icon-wrap {
            width: 64px;
            height: 64px;
            margin-bottom: 1.5rem;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-icon {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 1.5; /* Unified Stroke */
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s ease;
        }

        /* Text Hierarchy */
        .card-title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            color: #fff;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .card-subtitle {
            font-family: var(--font-display); /* Unified Font */
            font-size: 0.75rem;
            color: var(--text-muted); /* Higher contrast */
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 600;
        }

        /* --- Primary Card (Summon) --- */
        .card-summon {
            grid-column: 1 / 2;
            grid-row: 1 / 3;
            border-color: rgba(181, 78, 255, 0.4);
            background: linear-gradient(160deg, rgba(40, 20, 70, 0.8) 0%, rgba(15, 10, 30, 0.95) 100%);
            box-shadow: 0 0 50px rgba(181, 78, 255, 0.15);
            justify-content: center;
        }

        .card-summon:hover {
            border-color: var(--purple);
            box-shadow: 0 0 80px rgba(181, 78, 255, 0.3);
        }

        .card-summon:hover .card-icon {
            stroke: var(--purple-light);
            filter: drop-shadow(0 0 10px var(--purple));
        }

        .card-summon:hover .corner {
            border-color: var(--purple-light);
        }

        .card-summon .card-icon-wrap {
            width: 100px;
            height: 100px;
            margin-bottom: 2rem;
        }
        
        /* Summon specific glow effect */
        .card-summon .card-icon-wrap::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80px; height: 80px;
            background: radial-gradient(circle, rgba(181, 78, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(15px);
            animation: pulse-glow 3s infinite;
        }

        .card-summon .card-title {
            font-size: 2.8rem;
            color: var(--purple-light);
            text-shadow: 0 0 20px rgba(181, 78, 255, 0.5);
            letter-spacing: 0.1em;
        }
        
        .card-summon .card-subtitle {
            color: var(--text-muted);
            border-top: 1px solid rgba(181, 78, 255, 0.3);
            padding-top: 1rem;
        }

        /* --- Secondary Cards --- */
        .secondary-group {
            grid-column: 2 / 3;
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: 100%;
        }

        .secondary-group .nav-card {
            flex: 1;
            flex-direction: row;
            justify-content: flex-start;
            padding: 0 3rem;
            align-items: center;
        }

        .secondary-group .card-icon-wrap {
            width: 56px;
            height: 56px;
            margin-bottom: 0;
            margin-right: 2rem;
        }

        .secondary-group .card-text {
            text-align: left;
        }
        
        .secondary-group .card-title {
            font-size: 1.4rem;
            margin-bottom: 0.25rem;
        }

        /* Secondary Hover States (Color Coded) */
        
        /* Roster: Silver/Blue */
        .card-roster:hover {
            border-color: #4facfe;
            box-shadow: 0 0 30px rgba(79, 172, 254, 0.2);
        }
        .card-roster:hover .card-icon { stroke: #4facfe; filter: drop-shadow(0 0 8px #4facfe); }
        .card-roster:hover .corner { border-color: #4facfe; }
        .card-roster:hover .card-title { color: #4facfe; }

        /* Battle: Crimson/Red */
        .card-battle:hover {
            border-color: #ff4b4b;
            box-shadow: 0 0 30px rgba(255, 75, 75, 0.2);
        }
        .card-battle:hover .card-icon { stroke: #ff4b4b; filter: drop-shadow(0 0 8px #ff4b4b); }
        .card-battle:hover .corner { border-color: #ff4b4b; }
        .card-battle:hover .card-title { color: #ff4b4b; }

        /* Grind: Gold/Amber */
        .card-grind:hover {
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(242, 201, 76, 0.2);
        }
        .card-grind:hover .card-icon { stroke: var(--gold); filter: drop-shadow(0 0 8px var(--gold)); }
        .card-grind:hover .corner { border-color: var(--gold); }
        .card-grind:hover .card-title { color: var(--gold); }

        /* --- Animations --- */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse-glow { 0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } }
        @keyframes pulse-ring { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.01); } }
        @keyframes breathe { 0%, 100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .nav-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto;
                max-height: none;
                gap: 1rem;
            }
            .card-summon {
                grid-column: 1 / -1;
                grid-row: 1;
                min-height: 220px;
                flex-direction: row;
                justify-content: flex-start;
                padding: 0 2.5rem;
            }
            .card-summon .card-icon-wrap {
                margin-right: 2rem;
                margin-bottom: 0;
                width: 80px; height: 80px;
            }
            .card-summon .card-text { text-align: left; }
            .card-summon .card-subtitle { border-top: none; padding-top: 0; }
            
            .secondary-group {
                grid-column: 1 / -1;
                grid-row: 2;
                flex-direction: row;
            }
            .secondary-group .nav-card {
                height: 160px;
            }
            
            h1.game-title { font-size: 2.5rem; }
            .summoning-circle { width: 350px; height: 200px; top: -40px; }
        }

        @media (max-width: 600px) {
            .ui-layer { padding: 1rem; }
            .secondary-group { flex-direction: column; }
            .secondary-group .nav-card { height: auto; min-height: 100px; }
            h1.game-title { font-size: 2rem; }
            .hero-section { height: 140px; }
        }
    </style>
</head>
<body>

    <!-- Background Canvas for Particles -->
    <canvas id="canvas-bg"></canvas>
    <div class="noise-overlay"></div>
    <div class="vignette"></div>

    <div class="ui-layer">
        <header>
            <div class="brand">Aetheria</div>
            <div class="currency-pill">
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z" />
                </svg>
                <div class="currency-text">
                    <span class="currency-label">Gold</span>
                    <span class="currency-amount">12,450</span>
                </div>
            </div>
        </header>

        <section class="hero-section">
            <!-- Atmospheric Element: The Summoning Circle -->
            <div class="summoning-circle">
                <div class="circle-outer"></div>
                <div class="circle-inner"></div>
                <div class="circle-core"></div>
            </div>
            
            <h1 class="game-title">Spirit Summoning</h1>
            <p class="subtitle">Ritual of Awakening</p>
        </section>

        <div class="nav-container">
            <nav class="nav-grid">
                
                <!-- PRIMARY ACTION: Summon -->
                <div class="nav-card card-summon" onclick="interact('summon')">
                    <div class="corner tl"></div><div class="corner tr"></div>
                    <div class="corner bl"></div><div class="corner br"></div>
                    
                    <div class="card-icon-wrap">
                        <!-- Icon: The Third Eye / Portal (Redesigned) -->
                        <svg class="card-icon" viewBox="0 0 24 24">
                            <!-- Eye Shape -->
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                            <!-- Iris -->
                            <circle cx="12" cy="12" r="3" />
                            <!-- Rays -->
                            <path d="M12 2v2m0 14v2m-9-9h2m14 0h2" opacity="0.6"/>
                        </svg>
                    </div>
                    <div class="card-text">
                        <div class="card-title">Summon</div>
                        <div class="card-subtitle">Invoke the Ancient</div>
                    </div>
                </div>

                <!-- SECONDARY ACTIONS -->
                <div class="secondary-group">
                    
                    <!-- Roster -->
                    <div class="nav-card card-roster" onclick="interact('roster')">
                        <div class="corner tl"></div><div class="corner tr"></div>
                        <div class="corner bl"></div><div class="corner br"></div>
                        
                        <div class="card-icon-wrap">
                            <!-- Icon: Spirit Tome (Redesigned to Line Art) -->
                            <svg class="card-icon" viewBox="0 0 24 24">
                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                                <path d="M8 7h8m-8 4h5" opacity="0.6"/>
                            </svg>
                        </div>
                        <div class="card-text">
                            <div class="card-title">Roster</div>
                            <div class="card-subtitle">Bound Spirits</div>
                        </div>
                    </div>

                    <!-- Battle -->
                    <div class="nav-card card-battle" onclick="interact('battle')">
                        <div class="corner tl"></div><div class="corner tr"></div>
                        <div class="corner bl"></div><div class="corner br"></div>
                        
                        <div class="card-icon-wrap">
                            <!-- Icon: Rune Blade (Redesigned to Line Art) -->
                            <svg class="card-icon" viewBox="0 0 24 24">
                                <path d="M14.5 17.5L3 6V3h3l11.5 11.5-3 3z" />
                                <path d="M13 19l6-6" />
                                <path d="M16 16l4 4" />
                                <path d="M19 21l2-2" />
                            </svg>
                        </div>
                        <div class="card-text">
                            <div class="card-title">Battle</div>
                            <div class="card-subtitle">Spirit Arena</div>
                        </div>
                    </div>

                    <!-- Grind -->
                    <div class="nav-card card-grind" onclick="interact('grind')">
                        <div class="corner tl"></div><div class="corner tr"></div>
                        <div class="corner bl"></div><div class="corner br"></div>
                        
                        <div class="card-icon-wrap">
                            <!-- Icon: Crucible (Redesigned to Line Art) -->
                            <svg class="card-icon" viewBox="0 0 24 24">
                                <path d="M10 2v7.31l-4.24 8.47A2 2 0 0 0 7.56 20h8.88a2 2 0 0 0 1.8-2.22L14 9.31V2" />
                                <path d="M8.5 2h7" />
                                <path d="M8.5 14h7" />
                                <circle cx="12" cy="16" r="1.5" opacity="0.6"/>
                            </svg>
                        </div>
                        <div class="card-text">
                            <div class="card-title">Grind</div>
                            <div class="card-subtitle">Resource Forge</div>
                        </div>
                    </div>

                </div>
            </nav>
        </div>
    </div>

    <script>
        // --- Canvas Particle System (Ethereal Spirits) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 50;
                this.size = Math.random() * 2 + 0.5;
                this.speed = Math.random() * 0.5 + 0.1;
                this.opacity = Math.random() * 0.4;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.02 + 0.01;
                
                // 15% chance for a "Gold" particle
                this.isGold = Math.random() > 0.85;
            }

            update() {
                this.y -= this.speed;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 0.3;

                if (this.y < -20) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                
                if (this.isGold) {
                    ctx.fillStyle = `rgba(242, 201, 76, ${this.opacity})`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "rgba(242, 201, 76, 0.5)";
                } else {
                    // Ethereal Purple/White
                    ctx.fillStyle = `rgba(224, 170, 255, ${this.opacity})`;
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = "rgba(181, 78, 255, 0.3)";
                }
                
                ctx.fill();
                ctx.shadowBlur = 0; // Reset
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 70; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(type) {
            const card = event.currentTarget;
            // Simple visual feedback
            card.style.transform = "scale(0.98)";
            card.style.filter = "brightness(1.2)";
            setTimeout(() => {
                card.style.transform = "";
                card.style.filter = "";
            }, 150);
        }
    </script>
</body>
</html>
