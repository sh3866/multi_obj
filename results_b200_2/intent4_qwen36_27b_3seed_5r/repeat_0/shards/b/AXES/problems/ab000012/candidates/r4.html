<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirit Summoning - Hub</title>
    <style>
        :root {
            /* Palette */
            --bg-deep: #05020a;
            --bg-gradient: radial-gradient(circle at 50% 20%, #1a103c 0%, #090514 60%, #000000 100%);
            
            --gold: #f2c94c;
            --gold-dim: #8a6e2f;
            --gold-glow: rgba(242, 201, 76, 0.6);
            
            --purple: #9d4edd;
            --purple-light: #e0aaff;
            --purple-dim: #3c096c;
            --purple-glow: rgba(157, 78, 221, 0.5);
            
            --text-main: #f8f9fa;
            --text-muted: #adb5bd;
            
            /* Typography */
            --font-display: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            --font-ui: "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-deep);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Atmosphere & FX --- */
        #canvas-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJub2lzZSI+PGZlVHVyYnVsZW5jZSB0eXBlPSJmcmFjdGFsTm9pc2UiIGJhc2VGcmVxdWVuY3k9IjAuNjUiIG51bU9jdGF2ZXM9IjMiIHN0aXRjaFRpbGVzPSJzdGl0Y2giLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjbm9pc2UpIiBvcGFjaXR5PSIwLjA1Ii8+PC9zdmc+');
            opacity: 0.3;
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: overlay;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 40%, #000000 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* --- UI Layout --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 1.5rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .brand {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .brand::before {
            content: '';
            display: block;
            width: 20px; height: 1px;
            background: linear-gradient(to right, transparent, var(--text-muted));
        }

        .currency-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(242, 201, 76, 0.3);
            border-radius: 100px;
            padding: 6px 16px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            backdrop-filter: blur(4px);
        }

        .gold-icon {
            width: 18px;
            height: 18px;
            fill: var(--gold);
            filter: drop-shadow(0 0 4px var(--gold));
        }

        .currency-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .currency-label {
            font-size: 0.6rem;
            color: var(--gold-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 2px;
        }

        .currency-amount {
            font-family: var(--font-display);
            font-size: 1rem;
            color: var(--gold);
            font-weight: 600;
        }

        /* --- Hero Section (Atmospheric Anchor) --- */
        .hero-section {
            text-align: center;
            margin-bottom: 1.5rem;
            position: relative;
            height: 140px; /* Fixed height to control layout */
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        /* The Summoning Circle (Visual Anchor) */
        .summoning-circle {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 200px;
            opacity: 0.6;
            pointer-events: none;
            z-index: -1;
        }

        .circle-outer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(157, 78, 221, 0.1);
            animation: pulse-ring 4s ease-in-out infinite;
        }

        .circle-inner {
            position: absolute;
            top: 20%; left: 20%; width: 60%; height: 60%;
            border: 1px dashed rgba(224, 170, 255, 0.3);
            border-radius: 50%;
            animation: spin 20s linear infinite;
        }

        .circle-core {
            position: absolute;
            top: 35%; left: 35%; width: 30%; height: 30%;
            background: radial-gradient(circle, rgba(157, 78, 221, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(10px);
        }

        h1.game-title {
            font-family: var(--font-display);
            font-size: 2.5rem; /* Reduced from 3.2rem per critique */
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #fff;
            text-shadow: 0 0 20px rgba(157, 78, 221, 0.4);
            margin-bottom: 0.2rem;
            position: relative;
            z-index: 2;
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            background: linear-gradient(to right, transparent, rgba(0,0,0,0.6), transparent);
            padding: 4px 20px;
            position: relative;
            z-index: 2;
        }

        /* --- Navigation Grid --- */
        .nav-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr; /* Balanced split */
            grid-template-rows: 1fr 1fr;
            gap: 1.5rem;
            width: 100%;
            max-width: 1000px;
            height: 100%;
            max-height: 500px;
        }

        /* --- Card Component (Unified) --- */
        .nav-card {
            position: relative;
            background: linear-gradient(180deg, rgba(20, 15, 35, 0.6) 0%, rgba(10, 5, 20, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px; /* Sharper corners for mystical feel */
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Card Texture Overlay */
        .nav-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255, 255, 255, 0.01) 10px,
                rgba(255, 255, 255, 0.01) 11px
            );
            pointer-events: none;
        }

        /* Corner Accents (Etched Metal look) */
        .corner {
            position: absolute;
            width: 10px; height: 10px;
            border: 1px solid rgba(255,255,255,0.3);
            transition: border-color 0.3s;
        }
        .tl { top: 6px; left: 6px; border-right: none; border-bottom: none; }
        .tr { top: 6px; right: 6px; border-left: none; border-bottom: none; }
        .bl { bottom: 6px; left: 6px; border-right: none; border-top: none; }
        .br { bottom: 6px; right: 6px; border-left: none; border-top: none; }

        .nav-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .nav-card:hover .corner {
            border-color: #fff;
        }

        /* Iconography */
        .card-icon-wrap {
            width: 56px;
            height: 56px;
            margin-bottom: 1rem;
            position: relative;
        }

        .card-icon {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s ease;
        }

        /* Text Hierarchy */
        .card-title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            color: #fff;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-family: var(--font-ui);
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        /* --- Primary Card (Summon) --- */
        .card-summon {
            grid-column: 1 / 2;
            grid-row: 1 / 3;
            border-color: rgba(157, 78, 221, 0.3);
            background: linear-gradient(180deg, rgba(30, 20, 50, 0.7) 0%, rgba(15, 10, 30, 0.9) 100%);
            box-shadow: 0 0 40px rgba(157, 78, 221, 0.1);
        }

        .card-summon:hover {
            border-color: var(--purple);
            box-shadow: 0 0 60px rgba(157, 78, 221, 0.25);
        }

        .card-summon:hover .card-icon {
            stroke: var(--purple-light);
            filter: drop-shadow(0 0 8px var(--purple));
        }

        .card-summon:hover .corner {
            border-color: var(--purple-light);
        }

        .card-summon .card-icon-wrap {
            width: 80px;
            height: 80px;
            margin-bottom: 1.5rem;
        }
        
        /* Summon specific glow */
        .card-summon .card-icon-wrap::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60px; height: 60px;
            background: radial-gradient(circle, rgba(157, 78, 221, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(15px);
            animation: pulse-glow 3s infinite;
        }

        .card-summon .card-title {
            font-size: 2.2rem;
            color: var(--purple-light);
            text-shadow: 0 0 15px rgba(157, 78, 221, 0.4);
        }
        
        .card-summon .card-subtitle {
            color: var(--purple);
        }

        /* --- Secondary Cards --- */
        .secondary-group {
            grid-column: 2 / 3;
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: 100%;
        }

        .secondary-group .nav-card {
            flex: 1;
            flex-direction: row;
            justify-content: flex-start;
            padding: 0 2.5rem;
        }

        .secondary-group .card-icon-wrap {
            width: 48px;
            height: 48px;
            margin-bottom: 0;
            margin-right: 1.5rem;
        }

        .secondary-group .card-text {
            text-align: left;
        }

        /* Secondary Hover States (Color Coded) */
        
        /* Roster: Blue/Silver */
        .card-roster:hover {
            border-color: #4facfe;
            box-shadow: 0 0 30px rgba(79, 172, 254, 0.2);
        }
        .card-roster:hover .card-icon { stroke: #4facfe; filter: drop-shadow(0 0 6px #4facfe); }
        .card-roster:hover .corner { border-color: #4facfe; }

        /* Battle: Red/Crimson */
        .card-battle:hover {
            border-color: #ff4b4b;
            box-shadow: 0 0 30px rgba(255, 75, 75, 0.2);
        }
        .card-battle:hover .card-icon { stroke: #ff4b4b; filter: drop-shadow(0 0 6px #ff4b4b); }
        .card-battle:hover .corner { border-color: #ff4b4b; }

        /* Grind: Gold/Amber */
        .card-grind:hover {
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(242, 201, 76, 0.2);
        }
        .card-grind:hover .card-icon { stroke: var(--gold); filter: drop-shadow(0 0 6px var(--gold)); }
        .card-grind:hover .corner { border-color: var(--gold); }

        /* --- Animations --- */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse-glow { 0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } }
        @keyframes pulse-ring { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.02); } }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .nav-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto;
                max-height: none;
                gap: 1rem;
            }
            .card-summon {
                grid-column: 1 / -1;
                grid-row: 1;
                min-height: 200px;
                flex-direction: row;
                justify-content: flex-start;
                padding: 0 2rem;
            }
            .card-summon .card-icon-wrap {
                margin-right: 1.5rem;
                margin-bottom: 0;
                width: 60px; height: 60px;
            }
            .card-summon .card-text { text-align: left; }
            
            .secondary-group {
                grid-column: 1 / -1;
                grid-row: 2;
                flex-direction: row;
            }
            .secondary-group .nav-card {
                height: 140px;
            }
            
            h1.game-title { font-size: 2rem; }
            .summoning-circle { width: 300px; height: 150px; top: -30px; }
        }

        @media (max-width: 600px) {
            .secondary-group { flex-direction: column; }
            .secondary-group .nav-card { height: auto; }
            h1.game-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <!-- Background Canvas for Particles -->
    <canvas id="canvas-bg"></canvas>
    <div class="noise-overlay"></div>
    <div class="vignette"></div>

    <div class="ui-layer">
        <header>
            <div class="brand">Aetheria</div>
            <div class="currency-pill">
                <svg class="gold-icon" viewBox="0 0 24 24">
                    <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z" />
                </svg>
                <div class="currency-text">
                    <span class="currency-label">Gold</span>
                    <span class="currency-amount">12,450</span>
                </div>
            </div>
        </header>

        <section class="hero-section">
            <!-- Atmospheric Element: The Summoning Circle -->
            <div class="summoning-circle">
                <div class="circle-outer"></div>
                <div class="circle-inner"></div>
                <div class="circle-core"></div>
            </div>
            
            <h1 class="game-title">Spirit Summoning</h1>
            <p class="subtitle">Ritual of Awakening</p>
        </section>

        <div class="nav-container">
            <nav class="nav-grid">
                
                <!-- PRIMARY ACTION: Summon -->
                <div class="nav-card card-summon" onclick="interact('summon')">
                    <div class="corner tl"></div><div class="corner tr"></div>
                    <div class="corner bl"></div><div class="corner br"></div>
                    
                    <div class="card-icon-wrap">
                        <!-- Icon: The Third Eye / Portal -->
                        <svg class="card-icon" viewBox="0 0 24 24">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                            <circle cx="12" cy="12" r="3" />
                            <path d="M12 2v2m0 14v2m-9-9h2m14 0h2" opacity="0.6"/>
                        </svg>
                    </div>
                    <div class="card-text">
                        <div class="card-title">Summon</div>
                        <div class="card-subtitle">Invoke the Ancient</div>
                    </div>
                </div>

                <!-- SECONDARY ACTIONS -->
                <div class="secondary-group">
                    
                    <!-- Roster -->
                    <div class="nav-card card-roster" onclick="interact('roster')">
                        <div class="corner tl"></div><div class="corner tr"></div>
                        <div class="corner bl"></div><div class="corner br"></div>
                        
                        <div class="card-icon-wrap">
                            <!-- Icon: Spirit Tome (Book) -->
                            <svg class="card-icon" viewBox="0 0 24 24">
                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                                <path d="M8 7h8m-8 4h5" opacity="0.6"/>
                            </svg>
                        </div>
                        <div class="card-text">
                            <div class="card-title">Roster</div>
                            <div class="card-subtitle">Bound Spirits</div>
                        </div>
                    </div>

                    <!-- Battle -->
                    <div class="nav-card card-battle" onclick="interact('battle')">
                        <div class="corner tl"></div><div class="corner tr"></div>
                        <div class="corner bl"></div><div class="corner br"></div>
                        
                        <div class="card-icon-wrap">
                            <!-- Icon: Rune Blade -->
                            <svg class="card-icon" viewBox="0 0 24 24">
                                <path d="M14.5 17.5L3 6V3h3l11.5 11.5-3 3z" />
                                <path d="M13 19l6-6" />
                                <path d="M16 16l4 4" />
                                <path d="M19 21l2-2" />
                            </svg>
                        </div>
                        <div class="card-text">
                            <div class="card-title">Battle</div>
                            <div class="card-subtitle">Spirit Arena</div>
                        </div>
                    </div>

                    <!-- Grind -->
                    <div class="nav-card card-grind" onclick="interact('grind')">
                        <div class="corner tl"></div><div class="corner tr"></div>
                        <div class="corner bl"></div><div class="corner br"></div>
                        
                        <div class="card-icon-wrap">
                            <!-- Icon: Crucible (Alchemical Flask) -->
                            <svg class="card-icon" viewBox="0 0 24 24">
                                <path d="M10 2v7.31l-4.24 8.47A2 2 0 0 0 7.56 20h8.88a2 2 0 0 0 1.8-2.22L14 9.31V2" />

                                <path d="M8.5 14h7" />
                                <circle cx="12" cy="16" r="1.5" opacity="0.6"/>

                        <div class="card-text">

                            <div class="card-subtitle">Resource Forge</div>

                </div>
            </nav>
        </div>
    </div>

    <script>
        // --- Canvas Particle System (Ethereal Spirits) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 50;
                this.size = Math.random() * 2 + 0.5;
                this.speed = Math.random() * 0.5 + 0.1;
                this.opacity = Math.random() * 0.4;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.02 + 0.01;
                
                // 15% chance for a "Gold" particle
                this.isGold = Math.random() > 0.85;
            }

            update() {
                this.y -= this.speed;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 0.3;

                if (this.y < -20) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                
                if (this.isGold) {
                    ctx.fillStyle = `rgba(242, 201, 76, ${this.opacity})`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "rgba(242, 201, 76, 0.5)";
                } else {
                    // Ethereal Purple/White
                    ctx.fillStyle = `rgba(224, 170, 255, ${this.opacity})`;
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = "rgba(157, 78, 221, 0.3)";
                }
                
                ctx.fill();
                ctx.shadowBlur = 0; // Reset
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 70; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();

        // --- Interaction Feedback ---
        function interact(type) {
            const card = event.currentTarget;
            // Simple visual feedback
            card.style.transform = "scale(0.98)";
            card.style.filter = "brightness(1.2)";
            setTimeout(() => {
                card.style.transform = "";
                card.style.filter = "";
            }, 150);
        }
    </script>
</body>
