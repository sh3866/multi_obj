<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aether Catch</title>
<style>
  :root {
    --bg-deep: #02040a;
    --bg-surface: #0f172a;
    --accent-cyan: #22d3ee;
    --accent-magenta: #e879f9;
    --accent-gold: #fbbf24;
    --text-main: #f8fafc;
    --text-muted: #64748b;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
  
  body {
    background-color: #000;
    color: var(--text-main);
    font-family: var(--font-ui);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- MAIN CONTAINER --- */
  #app-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    max-height: 900px;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 120%, #1e1b4b 0%, #09090b 50%, #000000 100%);
    box-shadow: 0 0 0 1px #333, 0 20px 50px rgba(0,0,0,0.9);
  }

  @media (min-width: 500px) {
    #app-container {
      height: 92vh;
      border-radius: 48px;
      border: 12px solid #1e293b;
      box-shadow: 0 0 0 2px #0f172a, 0 30px 60px rgba(0,0,0,0.8);
    }
  }

  /* --- ATMOSPHERE --- */
  .nebula {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    background: 
      radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(232, 121, 249, 0.1) 0%, transparent 40%);
    pointer-events: none;
  }

  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.6) 100%);
    z-index: 2;
    pointer-events: none;
  }

  /* --- HUD --- */
  .hud-bar {
    position: absolute;
    top: 0; left: 0; width: 100%;
    padding: 24px 20px;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
  }

  .title-block {
    display: flex;
    flex-direction: column;
  }

  .title-main {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #fff 30%, var(--accent-cyan) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(34, 211, 238, 0.3);
    margin-bottom: 4px;
    line-height: 1;
  }

  .title-sub {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-cyan);
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.8;
  }

  .count-badge {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 100px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }

  .count-icon {
    width: 16px; height: 16px;
    fill: var(--accent-gold);
    filter: drop-shadow(0 0 5px var(--accent-gold));
  }

  .count-num {
    font-size: 18px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #fff;
  }

  /* --- CANVAS --- */
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
  }

  /* --- UI OVERLAYS --- */
  .instruction-pill {
    position: absolute;
    bottom: 110px; /* Above button */
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(4px);
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    pointer-events: none;
    z-index: 25;
    opacity: 0.8;
    animation: float 3s ease-in-out infinite;
    white-space: nowrap;
  }

  @keyframes float {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -5px); }
  }

  /* --- CONTROLS --- */
  .controls-area {
    position: absolute;
    bottom: 0; left: 0; width: 100%;
    height: 120px;
    z-index: 30;
    display: flex;
    justify-content: center;
    align-items: center;
    padding-bottom: 32px;
  }

  .collection-btn {
    pointer-events: auto;
    background: rgba(30, 41, 59, 0.8);
    backdrop-filter: blur(10px);
    color: #fff;
    height: 52px;
    width: 220px;
    border-radius: 26px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    text-transform: uppercase;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
  }

  .collection-btn:active {
    transform: scale(0.96);
    background: rgba(30, 41, 59, 0.9);
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }

  /* Button Glow Effect */
  .collection-btn::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: translateX(-100%);
    transition: 0.6s;
  }
  .collection-btn:hover::after {
    transform: translateX(100%);
  }

  .btn-icon {
    width: 18px; height: 18px;
    fill: var(--accent-magenta);
    filter: drop-shadow(0 0 6px var(--accent-magenta));
  }

</style>
</head>
<body>

<div id="app-container">
  <!-- Background Elements -->
  <div class="nebula"></div>
  <div class="vignette"></div>

  <!-- HUD -->
  <div class="hud-bar">
    <div class="title-block">
      <div class="title-main">AETHER</div>
      <div class="title-sub">Collection</div>
    </div>
    <div class="count-badge">
      <svg class="count-icon" viewBox="0 0 24 24">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
      <span class="count-num" id="score">0</span>
    </div>
  </div>

  <!-- Main Game Area -->
  <canvas id="gameCanvas"></canvas>

  <!-- Instructions -->
  <div class="instruction-pill">DRAG NET TO CATCH</div>

  <!-- Controls -->
  <div class="controls-area">
    <button class="collection-btn" id="collectionBtn">
      <svg class="btn-icon" viewBox="0 0 24 24">
        <path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4z"/>
      </svg>
      Collection
    </button>
  </div>
</div>

<script>
/**
 * AETHER CATCH - Revised
 * Visual overhaul:
 * - Deep atmosphere with depth
 * - Distinct creature silhouettes (Jelly, Wisp, Star)
 * - Visible Net Player Cursor
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const collectionBtn = document.getElementById('collectionBtn');

// State
let width, height;
let score = 0;
let mouseX = -100;
let mouseY = -100;
let isMouseDown = false;
let lastTime = 0;

// Configuration
const COLORS = [
  { h: 190, s: 90, l: 65 }, // Cyan
  { h: 270, s: 85, l: 70 }, // Violet
  { h: 330, s: 80, l: 65 }, // Pink
  { h: 45, s: 95, l: 65 }   // Gold
];

// --- UTILS ---
const random = (min, max) => Math.random() * (max - min) + min;
const hsl = (h, s, l, a = 1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;

// --- CLASSES ---

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.life = 1.0;
    this.decay = random(0.015, 0.04);
    
    const angle = random(0, Math.PI * 2);
    const speed = random(1, 4);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    
    this.size = random(2, 5);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    this.size *= 0.95;
  }

  draw(ctx) {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = hsl(this.color.h, this.color.s, this.color.l);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Creature {
  constructor() {
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.type = Math.floor(Math.random() * 3); // 0: Jelly, 1: Wisp, 2: Star
    this.reset();
  }

  reset() {
    // Spawn logic (edges)
    const side = Math.floor(Math.random() * 4);
    const buffer = 60;
    if (side === 0) { this.x = random(0, width); this.y = -buffer; }
    else if (side === 1) { this.x = width + buffer; this.y = random(0, height); }
    else if (side === 2) { this.x = random(0, width); this.y = height + buffer; }
    else { this.x = -buffer; this.y = random(0, height); }
    
    this.radius = random(15, 25);
    this.baseRadius = this.radius;
    
    // Movement
    const targetX = random(width * 0.2, width * 0.8);
    const targetY = random(height * 0.2, height * 0.7);
    const angle = Math.atan2(targetY - this.y, targetX - this.x);
    
    this.speed = random(0.4, 1.2);
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;
    
    this.wobbleOffset = random(0, 100);
    this.wobbleSpeed = random(0.03, 0.06);
    this.wobbleAmp = random(0.5, 1.5);
  }

  update(time) {
    this.x += this.vx + Math.sin(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;
    this.y += this.vy + Math.cos(time * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;

    // Breathing effect
    this.radius = this.baseRadius + Math.sin(time * 0.004) * 2;

    // Reset if off screen
    if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) {
      this.reset();
    }
  }

  draw(ctx) {
    const c = this.color;
    
    // Glow Aura
    ctx.shadowBlur = 20;
    ctx.shadowColor = hsl(c.h, c.s, c.l, 0.5);

    if (this.type === 0) {
        // JELLYFISH
        ctx.fillStyle = hsl(c.h, c.s, c.l, 0.9);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, Math.PI, 0); // Dome
        ctx.bezierCurveTo(this.x + this.radius, this.y + this.radius, this.x - this.radius, this.y + this.radius, this.x - this.radius, this.y);
        ctx.fill();
        
        // Inner Core
        ctx.fillStyle = `rgba(255,255,255,0.6)`;
        ctx.beginPath();
        ctx.arc(this.x, this.y + 2, this.radius * 0.3, 0, Math.PI * 2);
        ctx.fill();

        // Tentacles
        ctx.strokeStyle = hsl(c.h, c.s, c.l, 0.6);
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        for(let i = -2; i <= 2; i++) {
            let tx = this.x + (i * (this.radius/2.5));
            let ty = this.y + this.radius * 0.6;
            ctx.moveTo(tx, ty);
            ctx.quadraticCurveTo(tx + Math.sin(this.wobbleOffset + i)*8, ty + 20, tx, ty + 40);
        }
        ctx.stroke();

    } else if (this.type === 1) {
        // WISP (Diamond)
        ctx.fillStyle = hsl(c.h, c.s, c.l);
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - this.radius);
        ctx.lineTo(this.x + this.radius * 0.7, this.y);
        ctx.lineTo(this.x, this.y + this.radius);
        ctx.lineTo(this.x - this.radius * 0.7, this.y);
        ctx.fill();
        
        // Wings
        ctx.fillStyle = hsl(c.h, c.s, c.l, 0.4);
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - this.radius, this.y - this.radius * 0.5);
        ctx.lineTo(this.x, this.y + this.radius * 0.2);
        ctx.lineTo(this.x + this.radius, this.y - this.radius * 0.5);
        ctx.fill();

    } else {
        // STAR / BUG
        ctx.fillStyle = hsl(c.h, c.s, c.l);
        ctx.beginPath();
        for(let i=0; i<5; i++) {
            const angle = (i * 4 * Math.PI) / 5 - Math.PI/2;
            const x = this.x + Math.cos(angle) * this.radius;
            const y = this.y + Math.sin(angle) * this.radius;
            if (i===0) ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }
        ctx.fill();
        
        // Center Eye
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 0.4, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 0.15, 0, Math.PI*2);
        ctx.fill();
    }

    ctx.shadowBlur = 0; // Reset
  }
}

class Net {
  constructor() {
    this.x = width / 2;
    this.y = height - 150;
    this.targetX = this.x;
    this.targetY = this.y;
    this.radius = 40;
    this.angle = 0;
    this.meshAngle = 0;
  }

  update() {
    // Smooth follow
    this.x += (this.targetX - this.x) * 0.15;
    this.y += (this.targetY - this.y) * 0.15;
    
    // Rotation
    this.angle += 0.01;
    this.meshAngle += 0.05;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Handle
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 50);
    ctx.stroke();

    // Net Opening (Ring)
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(34, 211, 238, 0.6)';
    
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Web Pattern
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.lineWidth = 1;
    
    // Crosshairs
    ctx.beginPath();
    ctx.moveTo(-this.radius, 0); ctx.lineTo(this.radius, 0);
    ctx.moveTo(0, -this.radius); ctx.lineTo(0, this.radius);
    ctx.stroke();

    // Rotating dashed ring
    ctx.rotate(this.meshAngle);
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
    ctx.stroke();
    
    // Center dot
    ctx.fillStyle = var_accent_cyan();
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

// Helper for inline var access
function var_accent_cyan() { return '#22d3ee'; }

// --- MAIN LOOP ---

let creatures = [];
let particles = [];
let net;

function init() {
  resize();
  net = new Net();
  // Start with some creatures
  for(let i=0; i<5; i++) {
      const c = new Creature();
      // Force them on screen initially
      c.x = random(50, width-50);
      c.y = random(50, height-150);
      creatures.push(c);
  }
  
  // Event Listeners
  window.addEventListener('resize', resize);
  
  const container = document.getElementById('app-container');
  
  const updatePos = (x, y) => {
    const rect = canvas.getBoundingClientRect();
    net.targetX = x - rect.left;
    net.targetY = y - rect.top;
    mouseX = net.targetX;
    mouseY = net.targetY;
  };

  container.addEventListener('mousemove', e => updatePos(e.clientX, e.clientY));
  container.addEventListener('touchmove', e => {
    e.preventDefault(); // Prevent scroll
    updatePos(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: false});
  
  container.addEventListener('touchstart', e => {
    updatePos(e.touches[0].clientX, e.touches[0].clientY);
    isMouseDown = true;
    checkCatch();
  }, {passive: false});
  
  container.addEventListener('mousedown', () => {
    isMouseDown = true;
    checkCatch();
  });
  
  container.addEventListener('mouseup', () => isMouseDown = false);
  container.addEventListener('touchend', () => isMouseDown = false);
  
  collectionBtn.addEventListener('click', () => {
    // Button visual feedback
    collectionBtn.style.transform = 'scale(0.95)';
    setTimeout(() => collectionBtn.style.transform = 'scale(1)', 100);
  });

  requestAnimationFrame(loop);
}

function resize() {
  const container = document.getElementById('app-container');
  width = container.clientWidth;
  height = container.clientHeight;
  
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
}

function checkCatch() {
  let caught = false;
  // Filter creatures that are within distance
  creatures = creatures.filter(c => {
    const dx = c.x - net.x;
    const dy = c.y - net.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist < net.radius + c.radius) {
      // Caught!
      createExplosion(c.x, c.y, c.color);
      score++;
      scoreEl.innerText = score;
      caught = true;
      return false; // Remove creature
    }
    return true; // Keep creature
  });

  // Replenish creatures if we caught one
  if (caught) {
    setTimeout(() => {
      if (creatures.length < 6) creatures.push(new Creature());
    }, 800);
  }
}

function createExplosion(x, y, color) {
  for(let i=0; i<20; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function loop(time) {
  // Clear
  ctx.clearRect(0, 0, width, height);

  // Update Net
  net.update();
  net.draw(ctx);

  // Update Creatures
  creatures.forEach(c => {
    c.update(time);
    c.draw(ctx);
  });

  // Update Particles
  particles.forEach((p, index) => {
    p.update();
    p.draw(ctx);
    if (p.life <= 0) particles.splice(index, 1);
  });

  requestAnimationFrame(loop);
}

// Start
init();

</script>
</body>
</html>
