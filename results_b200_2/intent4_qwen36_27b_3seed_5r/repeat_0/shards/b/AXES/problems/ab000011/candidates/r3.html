<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON & FLUX</title>
<style>
    :root {
        --bg-color: #050608;
        --panel-bg: #0f1115;
        --grid-line: #1a1d24;
        --accent-cyan: #00f0ff;
        --accent-cyan-dim: #004d52;
        --accent-amber: #ffaa00;
        --accent-amber-dim: #5c4200;
        --accent-danger: #ff3333;
        --text-main: #c9d1d9;
        --text-dim: #565c66;
        --font-display: "Impact", "Arial Black", sans-serif;
        --font-tech: "Courier New", Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        /* Heavy Industrial Atmosphere */
        background-image: 
            radial-gradient(circle at 50% 40%, #161b22 0%, #050608 70%),
            repeating-linear-gradient(90deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 40px),
            repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 40px);
    }

    /* --- LAYOUT --- */
    .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 850px;
        padding: 20px;
        position: relative;
        z-index: 1;
    }

    /* --- HEADER & HUD (Re-organized Hierarchy) --- */
    .interface-header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 12px;
        padding: 0 8px;
        /* Removed heavy bottom border, relying on spacing and contrast */
    }

    h1 {
        /* Reduced size to de-emphasize title vs board */
        font-family: var(--font-display);
        font-size: 1.8rem; 
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #8b949e; /* Dimmed */
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        /* Stencil effect */
        -webkit-text-stroke: 0.5px rgba(255,255,255,0.1);
    }

    h1 span {
        color: var(--accent-cyan);
        font-family: var(--font-tech);
        font-size: 1.2rem;
        opacity: 0.8;
        margin-left: 5px;
        vertical-align: middle;
    }

    /* HUD moved to Top-Right with clearer hierarchy */
    .hud {
        display: flex;
        gap: 24px;
        background: rgba(0,0,0,0.3);
        padding: 8px 16px;
        border: 1px solid #30363d;
        border-radius: 2px;
    }

    .hud-item {
        display: flex;
        flex-direction: row; /* Horizontal layout for compactness */
        align-items: baseline;
        gap: 8px;
    }

    .hud-label {
        font-family: var(--font-tech);
        font-size: 0.7rem;
        color: var(--text-dim);
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    .hud-value {
        font-family: var(--font-display);
        font-size: 1.4rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
    }

    /* --- THE BOARD (Enhanced Framing) --- */
    .board-frame {
        position: relative;
        padding: 16px; /* Increased padding */
        background: #0d1117;
        border: 1px solid #21262d;
        box-shadow: 
            0 30px 60px -12px rgba(0,0,0,0.9),
            inset 0 0 40px rgba(0,0,0,0.8);
    }

    /* Strict geometric corner brackets */
    .board-frame::before {
        content: '';
        position: absolute;
        top: 0; left: 0;
        width: 24px; height: 24px;
        border-top: 2px solid var(--accent-cyan);
        border-left: 2px solid var(--accent-cyan);
        box-shadow: -2px -2px 8px rgba(0, 240, 255, 0.2);
    }
    .board-frame::after {
        content: '';
        position: absolute;
        bottom: 0; right: 0;
        width: 24px; height: 24px;
        border-bottom: 2px solid var(--accent-cyan);
        border-right: 2px solid var(--accent-cyan);
        box-shadow: 2px 2px 8px rgba(0, 240, 255, 0.2);
    }
    
    /* Additional corners for symmetry */
    .corner-tr {
        position: absolute; top: 0; right: 0;
        width: 24px; height: 24px;
        border-top: 2px solid var(--accent-cyan);
        border-right: 2px solid var(--accent-cyan);
        box-shadow: 2px -2px 8px rgba(0, 240, 255, 0.2);
    }
    .corner-bl {
        position: absolute; bottom: 0; left: 0;
        width: 24px; height: 24px;
        border-bottom: 2px solid var(--accent-cyan);
        border-left: 2px solid var(--accent-cyan);
        box-shadow: -2px 2px 8px rgba(0, 240, 255, 0.2);
    }

    #grid-canvas {
        display: block;
        background-color: #050608; /* Darker floor */
        width: 100%; 
        height: auto;
        border: 1px solid #1c2029;
    }

    /* --- CONTROLS LEGEND (Integrated & Simplified) --- */
    .controls {
        margin-top: 20px;
        display: flex;
        gap: 16px;
        width: 100%;
        justify-content: center;
    }

    .control-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 4px;
    }

    .key-badge {
        background: #21262d;
        color: var(--text-main);
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.7rem;
        font-family: var(--font-tech);
        font-weight: bold;
        box-shadow: 0 2px 0 #000;
        border: 1px solid #30363d;
    }

    .control-text {
        font-size: 0.8rem;
        color: var(--text-dim);
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    /* --- FOOTER --- */
    footer {
        margin-top: 16px;
        font-family: var(--font-tech);
        font-size: 0.6rem;
        color: #30363d;
        letter-spacing: 0.2em;
        text-transform: uppercase;
    }

</style>
</head>
<body>

<div class="game-container">
    <!-- Header & HUD -->
    <div class="interface-header">
        <h1>Iron <span>&</span> Flux</h1>
        <div class="hud">
            <div class="hud-item">
                <span class="hud-label">Sector</span>
                <span class="hud-value">04</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Cycles</span>
                <span class="hud-value" id="move-counter">12</span>
            </div>
        </div>
    </div>

    <!-- Game Board -->
    <div class="board-frame">
        <!-- Extra corners for strict geometry -->
        <div class="corner-tr"></div>
        <div class="corner-bl"></div>
        <canvas id="grid-canvas"></canvas>
    </div>

    <!-- Controls Legend -->
    <div class="controls">
        <div class="control-card">
            <span class="key-badge">ARROWS</span>
            <span class="control-text">Move / Push</span>
        </div>
        
        <div class="control-card">
            <span class="key-badge">SPACE</span>
            <span class="control-text">Toggle Lever</span>
        </div>
    </div>

    <footer>System Status: Online // Core Temp: Stable</footer>
</div>

<script>
/**
 * IRON & FLUX - VISUAL ENGINE v2
 * Focus: Heavy Industry, High Voltage, Depth, and Materiality.
 */

const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');

// Configuration
const TILE_SIZE = 80;
const GRID_ROWS = 6;
const GRID_COLS = 8;

// Palette - Darker, Richer, Higher Contrast
const COLORS = {
    floor: '#0a0c10',
    gridLine: '#161b22',
    wallTop: '#2d333b',
    wallSide: '#161b22',
    wallShadow: '#0d1117',
    playerGlow: '#00f0ff',
    playerCore: '#ffffff',
    // Rusty Industrial Yellow
    crateBase: '#d49a28',
    crateDark: '#5e400a',
    crateHighlight: '#f2c744',
    leverOff: '#ff3333',
    leverOn: '#00f0ff',
    doorClosed: '#1f2328',
    doorOpen: '#00f0ff',
    doorFrame: '#30363d'
};

// Game State
let gameState = {
    player: { x: 1, y: 2 },
    crates: [
        { x: 3, y: 2 }, 
        { x: 5, y: 3 }
    ],
    lever: { x: 4, y: 1, active: false },
    door: { x: 6, y: 4, open: false },
    target: { x: 2, y: 4 }, 
    walls: [
        {x:2, y:0}, {x:2, y:1}, {x:2, y:2}, 
        {x:4, y:3}, {x:4, y:4}, {x:4, y:5},
        {x:6, y:2}, {x:6, y:3}, {x:0, y:4}, {x:0, y:5}
    ]
};

// Initialize Canvas
function init() {
    const width = GRID_COLS * TILE_SIZE;
    const height = GRID_ROWS * TILE_SIZE;
    
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx.scale(dpr, dpr);

    draw();
}

// --- DRAWING HELPERS ---

// 1. DRAW GRID & FLOOR (Industrial Grating)
function drawGrid() {
    ctx.fillStyle = COLORS.floor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Grid Lines
    ctx.strokeStyle = COLORS.gridLine;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x <= GRID_COLS; x++) {
        ctx.moveTo(x * TILE_SIZE, 0);
        ctx.lineTo(x * TILE_SIZE, GRID_ROWS * TILE_SIZE);
    }
    for (let y = 0; y <= GRID_ROWS; y++) {
        ctx.moveTo(0, y * TILE_SIZE);
        ctx.lineTo(GRID_COLS * TILE_SIZE, y * TILE_SIZE);
    }
    ctx.stroke();

    // Floor Texture (Industrial Dimples)
    ctx.fillStyle = '#101318';
    for(let y=0; y<GRID_ROWS; y++) {
        for(let x=0; x<GRID_COLS; x++) {
            // Offset pattern
            const cx = x * TILE_SIZE + TILE_SIZE/2;
            const cy = y * TILE_SIZE + TILE_SIZE/2;
            
            // Center dimple
            ctx.beginPath();
            ctx.arc(cx, cy, 2, 0, Math.PI*2);
            ctx.fill();
            
            // Corner fasteners
            const off = 10;
            ctx.beginPath(); ctx.arc(x * TILE_SIZE + off, y * TILE_SIZE + off, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x * TILE_SIZE + TILE_SIZE - off, y * TILE_SIZE + off, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x * TILE_SIZE + off, y * TILE_SIZE + TILE_SIZE - off, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x * TILE_SIZE + TILE_SIZE - off, y * TILE_SIZE + TILE_SIZE - off, 1.5, 0, Math.PI*2); ctx.fill();
        }
    }
}

// 2. DRAW TARGET (The Goal) - More visible
function drawTarget() {
    const t = gameState.target;
    const cx = t.x * TILE_SIZE + TILE_SIZE/2;
    const cy = t.y * TILE_SIZE + TILE_SIZE/2;
    
    ctx.save();
    ctx.strokeStyle = '#2d333b';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.arc(cx, cy, 24, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner crosshair
    ctx.setLineDash([]);
    ctx.strokeStyle = '#484f58';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 10, cy); ctx.lineTo(cx + 10, cy);
    ctx.moveTo(cx, cy - 10); ctx.lineTo(cx, cy + 10);
    ctx.stroke();
    ctx.restore();
}

// 3. DRAW DOOR (Exit) - Distinct Mechanism
function drawDoor() {
    const d = gameState.door;
    const px = d.x * TILE_SIZE;
    const py = d.y * TILE_SIZE;
    
    // Heavy Frame
    ctx.fillStyle = COLORS.doorFrame;
    ctx.fillRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);
    
    // Inner Recess
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(px + 10, py + 10, TILE_SIZE - 20, TILE_SIZE - 20);

    if (!gameState.door.open) {
        // Closed Door (Reinforced Metal)
        ctx.fillStyle = COLORS.doorClosed;
        ctx.fillRect(px + 14, py + 14, TILE_SIZE - 28, TILE_SIZE - 28);
        
        // Lock Mechanism (X pattern)
        ctx.strokeStyle = '#484f58';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px + 24, py + 24); ctx.lineTo(px + TILE_SIZE - 24, py + TILE_SIZE - 24);
        ctx.moveTo(px + TILE_SIZE - 24, py + 24); ctx.lineTo(px + 24, py + TILE_SIZE - 24);
        ctx.stroke();
        
        // Warning Light
        ctx.fillStyle = COLORS.leverOff;
        ctx.shadowColor = COLORS.leverOff;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(px + TILE_SIZE/2, py + TILE_SIZE/2, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    } else {
        // Open Door (Flux Field)
        ctx.fillStyle = 'rgba(0, 240, 255, 0.1)';
        ctx.fillRect(px + 14, py + 14, TILE_SIZE - 28, TILE_SIZE - 28);
        
        // Energy Beams
        ctx.shadowColor = COLORS.doorOpen;
        ctx.shadowBlur = 15;
        ctx.fillStyle = COLORS.doorOpen;
        
        for(let i=0; i<3; i++) {
            const yOff = (i * 12) + 22;
            ctx.fillRect(px + 18, py + yOff, TILE_SIZE - 36, 4);
        }
        ctx.shadowBlur = 0;
    }
}

// 4. DRAW WALLS (Tactile Blocks)
function drawWalls() {
    gameState.walls.forEach(w => {
        const px = w.x * TILE_SIZE;
        const py = w.y * TILE_SIZE;
        
        // Main Block
        ctx.fillStyle = COLORS.wallTop;
        ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        
        // Texture (Hazard Stripes)
        ctx.save();
        ctx.beginPath();
        ctx.rect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        ctx.clip();
        
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(px - 20, py + 20); ctx.lineTo(px + 100, py + 120);
        ctx.moveTo(px - 20, py + 50); ctx.lineTo(px + 100, py + 150);
        ctx.moveTo(px - 20, py + 80); ctx.lineTo(px + 100, py + 180);
        ctx.stroke();
        ctx.restore();

        // 3D Depth (Sides)
        ctx.fillStyle = COLORS.wallSide;
        // Right side
        ctx.fillRect(px + TILE_SIZE - 6, py + 2, 4, TILE_SIZE - 4);
        // Bottom side
        ctx.fillRect(px + 2, py + TILE_SIZE - 6, TILE_SIZE - 4, 4);
        
        // Top Highlight
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px + 2, py + TILE_SIZE - 2);
        ctx.lineTo(px + TILE_SIZE - 2, py + 2);
        ctx.stroke();
    });
}

// 5. DRAW LEVER (Mechanical Switch) - Distinct Icon
function drawLever() {
    const l = gameState.lever;
    const cx = l.x * TILE_SIZE + TILE_SIZE/2;
    const cy = l.y * TILE_SIZE + TILE_SIZE/2;
    
    // Base Plate
    ctx.fillStyle = '#0d1117';
    ctx.beginPath();
    ctx.arc(cx, cy, 22, 0, Math.PI*2);
    ctx.fill();
    
    // Plate Rim (Riveted)
    ctx.strokeStyle = '#30363d';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    const isActive = l.active;
    const color = isActive ? COLORS.leverOn : COLORS.leverOff;
    
    // Switch Handle (The T)
    ctx.fillStyle = '#e6edf3';
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    
    // Base of stick
    ctx.fillRect(cx - 2, cy - 10, 4, 20);
    // Top bar of T
    ctx.fillRect(cx - 8, cy - 14, 16, 6);
    
    // Status Indicator Light on plate
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy + 12, 3, 0, Math.PI*2);
    ctx.fill();
    
    ctx.shadowBlur = 0;
}

// 6. DRAW CRATES (Heavy Industrial Cargo)
function drawCrates() {
    gameState.crates.forEach(c => {
        const px = c.x * TILE_SIZE;
        const py = c.y * TILE_SIZE;
        const pad = 6;
        const size = TILE_SIZE - pad*2;
        
        // Deep Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.beginPath();
        ctx.roundRect(px + pad + 8, py + pad + 12, size, size, 4);
        ctx.fill();

        // Crate Body (Metallic Gradient)
        const grad = ctx.createLinearGradient(px, py, px + TILE_SIZE, py + TILE_SIZE);
        grad.addColorStop(0, COLORS.crateHighlight);
        grad.addColorStop(0.4, COLORS.crateBase);
        grad.addColorStop(1, COLORS.crateDark);
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(px + pad, py + pad, size, size, 4);
        ctx.fill();

        // Inner Bevel
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Rivets (Rough)
        ctx.fillStyle = '#3a2600';
        const rivetSize = 3;
        ctx.beginPath(); ctx.arc(px + pad + 8, py + pad + 8, rivetSize, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(px + TILE_SIZE - pad - 8, py + pad + 8, rivetSize, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(px + pad + 8, py + TILE_SIZE - pad - 8, rivetSize, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(px + TILE_SIZE - pad - 8, py + TILE_SIZE - pad - 8, rivetSize, 0, Math.PI*2); ctx.fill();

        // Hazard Symbol (Warning Triangle)
        ctx.strokeStyle = '#3a2600';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(px + TILE_SIZE/2, py + 16);
        ctx.lineTo(px + TILE_SIZE - 16, py + TILE_SIZE - 16);
        ctx.lineTo(px + 16, py + TILE_SIZE - 16);
        ctx.closePath();
        ctx.stroke();
        
        // Exclamation
        ctx.fillStyle = '#3a2600';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('!', px + TILE_SIZE/2, py + TILE_SIZE/2 + 4);
    });
}

// 7. DRAW PLAYER (The "Flux" Core)
function drawPlayer() {
    const p = gameState.player;
    const cx = p.x * TILE_SIZE + TILE_SIZE/2;
    const cy = p.y * TILE_SIZE + TILE_SIZE/2;

    // Ambient Glow (The "Flux")
    ctx.save();
    ctx.shadowBlur = 30;
    ctx.shadowColor = COLORS.playerGlow;
    
    // Outer Ring
    ctx.fillStyle = COLORS.playerGlow;
    ctx.beginPath();
    ctx.arc(cx, cy, 16, 0, Math.PI*2);
    ctx.fill();
    
    // Inner Core
    ctx.shadowBlur = 0; 
    ctx.fillStyle = COLORS.playerCore;
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, Math.PI*2);
    ctx.fill();
    
    ctx.restore();
}

// --- MAIN RENDER LOOP ---
function draw() {
    drawGrid();
    drawTarget();
    drawDoor();
    drawWalls();
    drawLever();
    drawCrates();
    drawPlayer();
}

// --- INTERACTION LOGIC ---

function movePlayer(dx, dy) {
    const newX = gameState.player.x + dx;
    const newY = gameState.player.y + dy;

    // Bounds Check
    if (newX < 0 || newX >= GRID_COLS || newY < 0 || newY >= GRID_ROWS) return;

    // Wall Collision
    if (gameState.walls.some(w => w.x === newX && w.y === newY)) return;

    // Crate Collision (Push Logic)
    const crateIdx = gameState.crates.findIndex(c => c.x === newX && c.y === newY);
    if (crateIdx !== -1) {
        const newCrateX = newX + dx;
        const newCrateY = newY + dy;
        
        const blocked = 
            (newCrateX < 0 || newCrateX >= GRID_COLS || newCrateY < 0 || newCrateY >= GRID_ROWS) ||
            gameState.walls.some(w => w.x === newCrateX && w.y === newCrateY) ||
            gameState.crates.some(c => c.x === newCrateX && c.y === newCrateY);
            
        if (gameState.door.x === newCrateX && gameState.door.y === newCrateY && !gameState.door.open) return;

        if (!blocked) {
            gameState.crates[crateIdx].x = newCrateX;
            gameState.crates[crateIdx].y = newCrateY;
            gameState.player.x = newX;
            gameState.player.y = newY;
            updateHUD();
            draw();
        }
    } else {
        // Empty Space Movement
        if (gameState.door.x === newX && gameState.door.y === newY && !gameState.door.open) return;

        gameState.player.x = newX;
        gameState.player.y = newY;
        updateHUD();
        draw();
    }
}

function pullLever() {
    const p = gameState.player;
    const l = gameState.lever;
    const dist = Math.abs(p.x - l.x) + Math.abs(p.y - l.y);
    if (dist === 1) {
        l.active = !l.active;
        gameState.door.open = l.active;
        draw();
    }
}

function updateHUD() {
    const movesEl = document.getElementById('move-counter');
    let current = parseInt(movesEl.innerText);
    movesEl.innerText = (current + 1).toString().padStart(2, '0');
}

// Input Listeners
window.addEventListener('keydown', (e) => {
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight", " "].indexOf(e.code) > -1) {
        e.preventDefault();
    }

    switch(e.key) {
        case 'ArrowUp': movePlayer(0, -1); break;
        case 'ArrowDown': movePlayer(0, 1); break;
        case 'ArrowLeft': movePlayer(-1, 0); break;
        case 'ArrowRight': movePlayer(1, 0); break;
        case ' ': pullLever(); break;
    }
});

// Run
init();

</script>
</body>
</html>
