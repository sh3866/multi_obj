<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON & FLUX</title>
<style>
    :root {
        --bg-color: #090a0f;
        --panel-bg: #12141a;
        --grid-line: #1c2029;
        --accent-cyan: #00f0ff;
        --accent-cyan-dim: #005f63;
        --accent-amber: #ffaa00;
        --accent-amber-dim: #664400;
        --accent-danger: #ff2a2a;
        --text-main: #e6edf3;
        --text-dim: #8b949e;
        --font-display: "Impact", "Arial Black", sans-serif;
        --font-tech: "Courier New", Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        /* Industrial Texture Background */
        background-image: 
            radial-gradient(circle at 50% 50%, #161b22 0%, #090a0f 80%),
            repeating-linear-gradient(0deg, transparent, transparent 2px, #000 3px, #000 4px);
    }

    /* --- LAYOUT --- */
    .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 900px;
        padding: 20px;
        position: relative;
        z-index: 1;
    }

    /* --- HEADER & HUD --- */
    /* Unified Header Structure */
    .interface-header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 16px;
        padding: 0 4px;
        border-bottom: 2px solid #21262d;
        position: relative;
    }

    .interface-header::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 150px;
        height: 2px;
        background: var(--accent-cyan);
        box-shadow: 0 0 10px var(--accent-cyan);
    }

    h1 {
        font-family: var(--font-display);
        font-size: 2.2rem;
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #fff;
        text-shadow: 0 4px 0 rgba(0,0,0,0.5);
    }

    h1 span {
        color: var(--accent-cyan);
        font-weight: 400;
        font-family: var(--font-tech);
        font-size: 1.5rem;
        vertical-align: middle;
    }

    .hud {
        display: flex;
        gap: 40px;
    }

    .hud-item {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }

    .hud-label {
        font-family: var(--font-tech);
        font-size: 0.7rem;
        color: var(--text-dim);
        letter-spacing: 0.15em;
        margin-bottom: 2px;
    }

    .hud-value {
        font-family: var(--font-tech);
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-main);
        text-shadow: 0 0 8px rgba(255,255,255,0.15);
    }

    /* --- THE BOARD --- */
    .board-frame {
        position: relative;
        padding: 12px;
        background: #161b22;
        border: 1px solid #30363d;
        box-shadow: 
            0 20px 50px -10px rgba(0,0,0,0.8),
            inset 0 0 30px rgba(0,0,0,0.5);
        /* Industrial Clip Path */
        clip-path: polygon(
            0 0, 
            100% 0, 
            100% calc(100% - 24px), 
            calc(100% - 24px) 100%, 
            0 100%
        );
    }

    /* Corner Accents */
    .board-frame::before {
        content: '';
        position: absolute;
        top: 0; left: 0;
        width: 20px; height: 20px;
        border-top: 3px solid var(--accent-cyan);
        border-left: 3px solid var(--accent-cyan);
        z-index: 2;
    }
    .board-frame::after {
        content: '';
        position: absolute;
        bottom: 0; right: 0;
        width: 20px; height: 20px;
        border-bottom: 3px solid var(--accent-cyan);
        border-right: 3px solid var(--accent-cyan);
        z-index: 2;
    }

    #grid-canvas {
        display: block;
        background-color: #0d1117;
        /* Ensure canvas fits frame */
        width: 100%; 
        height: auto;
    }

    /* --- CONTROLS LEGEND --- */
    .controls {
        margin-top: 24px;
        display: flex;
        gap: 20px;
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
    }

    .control-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 4px;
        backdrop-filter: blur(4px);
    }

    .control-icon {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        background: #0d1117;
        border: 1px solid #30363d;
    }

    .control-icon svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
    }

    .control-text {
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .control-action {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    .key-badge {
        display: inline-block;
        background: #21262d;
        color: var(--text-dim);
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 0.65rem;
        font-family: var(--font-tech);
        font-weight: bold;
        margin-top: 2px;
        border-bottom: 2px solid #000;
    }

    /* Color helpers for legend icons */
    .c-flux { color: var(--accent-cyan); }
    .c-iron { color: var(--accent-amber); }
    .c-lever { color: var(--text-main); }

    /* --- FOOTER --- */
    footer {
        margin-top: 10px;
        font-family: var(--font-tech);
        font-size: 0.65rem;
        color: #30363d;
        letter-spacing: 0.1em;
        text-transform: uppercase;
    }

</style>
</head>
<body>

<div class="game-container">
    <!-- Header & HUD Combined -->
    <div class="interface-header">
        <h1>Iron <span>&</span> Flux</h1>
        <div class="hud">
            <div class="hud-item">
                <span class="hud-label">SECTOR</span>
                <span class="hud-value">04</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">CYCLES</span>
                <span class="hud-value" id="move-counter">12</span>
            </div>
        </div>
    </div>

    <!-- Game Board -->
    <div class="board-frame">
        <canvas id="grid-canvas"></canvas>
    </div>

    <!-- Controls Legend -->
    <div class="controls">
        <div class="control-card">
            <div class="control-icon c-flux">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /></svg>
            </div>
            <div class="control-text">
                <span class="control-action">Move</span>
                <span class="key-badge">ARROWS</span>
            </div>
        </div>
        
        <div class="control-card">
            <div class="control-icon c-iron">
                <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" /></svg>
            </div>
            <div class="control-text">
                <span class="control-action">Push</span>
                <span class="key-badge">WALK INTO</span>
            </div>
        </div>

        <div class="control-card">
            <div class="control-icon c-lever">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <circle cx="12" cy="16" r="4" fill="currentColor" stroke="none"/>
                    <line x1="12" y1="16" x2="12" y2="4" />
                </svg>
            </div>
            <div class="control-text">
                <span class="control-action">Pull Lever</span>
                <span class="key-badge">SPACE</span>
            </div>
        </div>
    </div>

    <footer>System Status: Online // Core Temp: Stable</footer>
</div>

<script>
/**
 * IRON & FLUX - VISUAL ENGINE
 * Focus: Materiality, Lighting, and Depth.
 */

const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');

// Configuration
const TILE_SIZE = 80;
const GRID_ROWS = 6;
const GRID_COLS = 8;

// Palette - Industrial Sci-Fi
const COLORS = {
    floor: '#0d1117',
    gridLine: '#1c2029',
    wallTop: '#30363d',
    wallSide: '#21262d',
    wallHighlight: '#484f58',
    playerGlow: '#00f0ff',
    playerCore: '#ffffff',
    crateBase: '#d29922',
    crateDark: '#7a5200',
    crateHighlight: '#ffcc00',
    leverOff: '#ff2a2a',
    leverOn: '#00f0ff',
    doorClosed: '#1c2029',
    doorOpen: '#00f0ff',
    doorFrame: '#30363d'
};

// Game State
let gameState = {
    player: { x: 1, y: 2 },
    crates: [
        { x: 3, y: 2 }, 
        { x: 5, y: 3 }
    ],
    lever: { x: 4, y: 1, active: false },
    door: { x: 6, y: 4, open: false },
    target: { x: 2, y: 4 }, // Visual marker
    walls: [
        {x:2, y:0}, {x:2, y:1}, {x:2, y:2}, 
        {x:4, y:3}, {x:4, y:4}, {x:4, y:5},
        {x:6, y:2}, {x:6, y:3}, {x:0, y:4}, {x:0, y:5}
    ]
};

// Initialize Canvas
function init() {
    const width = GRID_COLS * TILE_SIZE;
    const height = GRID_ROWS * TILE_SIZE;
    
    // Handle High DPI (Retina)
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx.scale(dpr, dpr);

    draw();
}

// --- DRAWING HELPERS ---

// 1. DRAW GRID & FLOOR
function drawGrid() {
    // Base background
    ctx.fillStyle = COLORS.floor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Grid Lines (Subtle, industrial precision)
    ctx.strokeStyle = COLORS.gridLine;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= GRID_COLS; x++) {
        ctx.moveTo(x * TILE_SIZE, 0);
        ctx.lineTo(x * TILE_SIZE, GRID_ROWS * TILE_SIZE);
    }
    for (let y = 0; y <= GRID_ROWS; y++) {
        ctx.moveTo(0, y * TILE_SIZE);
        ctx.lineTo(GRID_COLS * TILE_SIZE, y * TILE_SIZE);
    }
    ctx.stroke();

    // Floor Texture (Rivets/Dots)
    ctx.fillStyle = '#21262d';
    for(let y=0; y<GRID_ROWS; y++) {
        for(let x=0; x<GRID_COLS; x++) {
            // Don't draw dots on walls
            if(!gameState.walls.some(w => w.x === x && w.y === y)) {
                // Center rivet
                ctx.beginPath();
                ctx.arc(x * TILE_SIZE + TILE_SIZE/2, y * TILE_SIZE + TILE_SIZE/2, 1.5, 0, Math.PI*2);
                ctx.fill();
                
                // Corner rivets
                const offset = 8;
                ctx.beginPath(); ctx.arc(x * TILE_SIZE + offset, y * TILE_SIZE + offset, 1, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x * TILE_SIZE + TILE_SIZE - offset, y * TILE_SIZE + offset, 1, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x * TILE_SIZE + offset, y * TILE_SIZE + TILE_SIZE - offset, 1, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x * TILE_SIZE + TILE_SIZE - offset, y * TILE_SIZE + TILE_SIZE - offset, 1, 0, Math.PI*2); ctx.fill();
            }
        }
    }
}

// 2. DRAW TARGET (The Goal)
function drawTarget() {
    const t = gameState.target;
    const cx = t.x * TILE_SIZE + TILE_SIZE/2;
    const cy = t.y * TILE_SIZE + TILE_SIZE/2;
    
    ctx.save();
    ctx.strokeStyle = '#30363d';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(cx, cy, 22, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner crosshair
    ctx.setLineDash([]);
    ctx.strokeStyle = '#484f58';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - 8, cy); ctx.lineTo(cx + 8, cy);
    ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy + 8);
    ctx.stroke();
    ctx.restore();
}

// 3. DRAW DOOR (Exit)
function drawDoor() {
    const d = gameState.door;
    const px = d.x * TILE_SIZE;
    const py = d.y * TILE_SIZE;
    
    // Frame
    ctx.strokeStyle = COLORS.doorFrame;
    ctx.lineWidth = 4;
    ctx.strokeRect(px + 10, py + 10, TILE_SIZE - 20, TILE_SIZE - 20);

    if (!gameState.door.open) {
        // Closed Door (Heavy Metal Block)
        ctx.fillStyle = COLORS.doorClosed;
        ctx.fillRect(px + 12, py + 12, TILE_SIZE - 24, TILE_SIZE - 24);
        
        // Lock Mechanism
        ctx.fillStyle = '#484f58';
        ctx.beginPath();
        ctx.arc(px + TILE_SIZE/2, py + TILE_SIZE/2 - 4, 6, 0, Math.PI*2);
        ctx.fill();
        ctx.fillRect(px + TILE_SIZE/2 - 4, py + TILE_SIZE/2 + 2, 8, 12);
        
        // Glowing Red indicator
        ctx.fillStyle = COLORS.leverOff;
        ctx.shadowColor = COLORS.leverOff;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(px + TILE_SIZE/2, py + TILE_SIZE/2 - 4, 2, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    } else {
        // Open Door (Energy Field)
        ctx.fillStyle = 'rgba(0, 240, 255, 0.15)';
        ctx.fillRect(px + 12, py + 12, TILE_SIZE - 24, TILE_SIZE - 24);
        
        // Scanlines
        ctx.fillStyle = 'rgba(0, 240, 255, 0.5)';
        for(let i=0; i<4; i++) {
            ctx.fillRect(px + 14, py + 14 + (i*16), TILE_SIZE - 28, 2);
        }
        
        // Glow effect
        ctx.shadowColor = COLORS.doorOpen;
        ctx.shadowBlur = 15;
        ctx.strokeStyle = COLORS.doorOpen;
        ctx.lineWidth = 2;
        ctx.strokeRect(px + 14, py + 14, TILE_SIZE - 28, TILE_SIZE - 28);
        ctx.shadowBlur = 0;
    }
}

// 4. DRAW WALLS (Solid, Tactile)
function drawWalls() {
    gameState.walls.forEach(w => {
        const px = w.x * TILE_SIZE;
        const py = w.y * TILE_SIZE;
        
        // Wall Top
        ctx.fillStyle = COLORS.wallTop;
        ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        
        // Wall Texture (Panel lines - subtle)
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(px + 10, py + 10); ctx.lineTo(px + TILE_SIZE - 10, py + TILE_SIZE - 10);
        ctx.moveTo(px + TILE_SIZE - 10, py + 10); ctx.lineTo(px + 10, py + TILE_SIZE - 10);
        ctx.stroke();

        // Wall Bevel (Bottom & Right for depth)
        ctx.fillStyle = COLORS.wallSide;
        // Bottom strip
        ctx.fillRect(px + 2, py + TILE_SIZE - 6, TILE_SIZE - 4, 4);
        // Right strip
        ctx.fillRect(px + TILE_SIZE - 6, py + 2, 4, TILE_SIZE - 4);
        
        // Top Highlight (Light source from top-left)
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.beginPath();
        ctx.moveTo(px + 2, py + TILE_SIZE - 2);
        ctx.lineTo(px + TILE_SIZE - 2, py + 2);
        ctx.lineTo(px + TILE_SIZE - 6, py + 2);
        ctx.lineTo(px + 2, py + TILE_SIZE - 6);
        ctx.fill();
    });
}

// 5. DRAW LEVER (Mechanical Switch)
function drawLever() {
    const l = gameState.lever;
    const cx = l.x * TILE_SIZE + TILE_SIZE/2;
    const cy = l.y * TILE_SIZE + TILE_SIZE/2;
    
    // Base Plate
    ctx.fillStyle = '#0d1117';
    ctx.beginPath();
    ctx.arc(cx, cy, 20, 0, Math.PI*2);
    ctx.fill();
    
    // Plate Rim
    ctx.strokeStyle = '#30363d';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Status Light
    const isActive = l.active;
    const color = isActive ? COLORS.leverOn : COLORS.leverOff;
    
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    ctx.fillStyle = color;
    
    // The Switch Handle
    // Draw a toggle switch shape
    const switchH = isActive ? -8 : 8;
    
    // The Stick
    ctx.fillStyle = '#e6edf3';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx, cy + switchH);
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#e6edf3';
    ctx.stroke();
    
    // Knob
    ctx.beginPath();
    ctx.arc(cx, cy + switchH, 5, 0, Math.PI*2);
    ctx.fill();
    
    // Reset Shadow
    ctx.shadowBlur = 0;
}

// 6. DRAW CRATES (Heavy Industrial Cargo)
function drawCrates() {
    gameState.crates.forEach(c => {
        const px = c.x * TILE_SIZE;
        const py = c.y * TILE_SIZE;
        const pad = 8;
        const size = TILE_SIZE - pad*2;
        
        // Shadow (Drop shadow to show height)
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.roundRect(px + pad + 6, py + pad + 10, size, size, 4);
        ctx.fill();

        // Crate Body (Gradient for cylinder/rounded feel)
        const grad = ctx.createLinearGradient(px, py, px + TILE_SIZE, py + TILE_SIZE);
        grad.addColorStop(0, COLORS.crateHighlight);
        grad.addColorStop(0.5, COLORS.crateBase);
        grad.addColorStop(1, COLORS.crateDark);
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(px + pad, py + pad, size, size, 4);
        ctx.fill();

        // Crate Details (Rivets)
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        const rivetSize = 3;
        // Top Left
        ctx.beginPath(); ctx.arc(px + pad + 8, py + pad + 8, rivetSize, 0, Math.PI*2); ctx.fill();
        // Top Right
        ctx.beginPath(); ctx.arc(px + TILE_SIZE - pad - 8, py + pad + 8, rivetSize, 0, Math.PI*2); ctx.fill();
        // Bottom Left
        ctx.beginPath(); ctx.arc(px + pad + 8, py + TILE_SIZE - pad - 8, rivetSize, 0, Math.PI*2); ctx.fill();
        // Bottom Right
        ctx.beginPath(); ctx.arc(px + TILE_SIZE - pad - 8, py + TILE_SIZE - pad - 8, rivetSize, 0, Math.PI*2); ctx.fill();

        // Center Hazard Symbol (Triangle)
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px + TILE_SIZE/2, py + 18);
        ctx.lineTo(px + TILE_SIZE - 18, py + TILE_SIZE - 18);
        ctx.lineTo(px + 18, py + TILE_SIZE - 18);
        ctx.closePath();
        ctx.stroke();
        
        // Inner Triangle
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.moveTo(px + TILE_SIZE/2, py + 24);
        ctx.lineTo(px + TILE_SIZE - 24, py + TILE_SIZE - 24);
        ctx.lineTo(px + 24, py + TILE_SIZE - 24);
        ctx.closePath();
        ctx.fill();
    });
}

// 7. DRAW PLAYER (The "Flux" Core)
function drawPlayer() {
    const p = gameState.player;
    const cx = p.x * TILE_SIZE + TILE_SIZE/2;
    const cy = p.y * TILE_SIZE + TILE_SIZE/2;

    // Ambient Glow (The "Flux")
    ctx.save();
    ctx.shadowBlur = 25;
    ctx.shadowColor = COLORS.playerGlow;
    
    // Outer Ring
    ctx.fillStyle = COLORS.playerGlow;
    ctx.beginPath();
    ctx.arc(cx, cy, 18, 0, Math.PI*2);
    ctx.fill();
    
    // Inner Core (Bright White)
    ctx.shadowBlur = 0; // Reset for sharp core
    ctx.fillStyle = COLORS.playerCore;
    ctx.beginPath();
    ctx.arc(cx, cy, 9, 0, Math.PI*2);
    ctx.fill();
    
    // Eye/Direction indicator (subtle)
    ctx.fillStyle = '#005f63';
    ctx.beginPath();
    ctx.arc(cx + 5, cy - 3, 3, 0, Math.PI*2);
    ctx.fill();
    
    ctx.restore();
}

// --- MAIN RENDER LOOP ---
function draw() {
    drawGrid();
    drawTarget();
    drawDoor();
    drawWalls();
    drawLever();
    drawCrates();
    drawPlayer();
}

// --- INTERACTION LOGIC ---

function movePlayer(dx, dy) {
    const newX = gameState.player.x + dx;
    const newY = gameState.player.y + dy;

    // Bounds Check
    if (newX < 0 || newX >= GRID_COLS || newY < 0 || newY >= GRID_ROWS) return;

    // Wall Collision
    if (gameState.walls.some(w => w.x === newX && w.y === newY)) return;

    // Crate Collision (Push Logic)
    const crateIdx = gameState.crates.findIndex(c => c.x === newX && c.y === newY);
    if (crateIdx !== -1) {
        const newCrateX = newX + dx;
        const newCrateY = newY + dy;
        
        // Check if crate can move (not into wall, another crate, or bounds)
        const blocked = 
            (newCrateX < 0 || newCrateX >= GRID_COLS || newCrateY < 0 || newCrateY >= GRID_ROWS) ||
            gameState.walls.some(w => w.x === newCrateX && w.y === newCrateY) ||
            gameState.crates.some(c => c.x === newCrateX && c.y === newCrateY);
            
        // Also block if pushing into closed door
        if (gameState.door.x === newCrateX && gameState.door.y === newCrateY && !gameState.door.open) return;

        if (!blocked) {
            gameState.crates[crateIdx].x = newCrateX;
            gameState.crates[crateIdx].y = newCrateY;
            gameState.player.x = newX;
            gameState.player.y = newY;
            
            // Update Moves Count (Visual only)
            updateHUD();
            draw();
        }
    } else {
        // Empty Space Movement
        // Check if entering closed door
        if (gameState.door.x === newX && gameState.door.y === newY && !gameState.door.open) return;

        gameState.player.x = newX;
        gameState.player.y = newY;
        
        updateHUD();
        draw();
    }
}

function pullLever() {
    const p = gameState.player;
    const l = gameState.lever;
    
    // Adjacency Check (Manhattan distance = 1)
    const dist = Math.abs(p.x - l.x) + Math.abs(p.y - l.y);
    if (dist === 1) {
        l.active = !l.active;
        gameState.door.open = l.active;
        draw();
    }
}

function updateHUD() {
    const movesEl = document.getElementById('move-counter');
    let current = parseInt(movesEl.innerText);
    movesEl.innerText = (current + 1).toString().padStart(2, '0');
}

// Input Listeners
window.addEventListener('keydown', (e) => {
    // Prevent default scrolling for arrow keys
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight", " "].indexOf(e.code) > -1) {
        e.preventDefault();
    }

    switch(e.key) {
        case 'ArrowUp': movePlayer(0, -1); break;
        case 'ArrowDown': movePlayer(0, 1); break;
        case 'ArrowLeft': movePlayer(-1, 0); break;
        case 'ArrowRight': movePlayer(1, 0); break;
        case ' ': pullLever(); break;
    }
});

// Run
init();

</script>
</body>
</html>
