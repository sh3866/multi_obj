<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON & FLUX</title>
<style>
    :root {
        --bg-dark: #0b0c10;
        --bg-panel: #15171e;
        --accent-cyan: #00f3ff;
        --accent-magenta: #ff0055;
        --accent-amber: #ffb700;
        --text-main: #e6edf3;
        --text-dim: #6e7681;
        --grid-line: #21262d;
        --shadow-deep: 0 20px 50px -12px rgba(0,0,0,0.9);
        --glow-cyan: 0 0 20px rgba(0, 243, 255, 0.4);
        --glow-amber: 0 0 15px rgba(255, 183, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        /* Industrial texture overlay */
        background-image: 
            linear-gradient(rgba(11, 12, 16, 0.95), rgba(11, 12, 16, 0.95)),
            repeating-linear-gradient(0deg, transparent, transparent 2px, #000 2px, #000 4px);
    }

    /* --- LAYOUT --- */
    .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2.5rem;
        width: 100%;
        max-width: 1000px;
        padding: 20px;
        position: relative;
        z-index: 1;
    }

    /* --- HEADER & HUD --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        width: 100%;
        border-bottom: 1px solid var(--grid-line);
        padding-bottom: 1rem;
        position: relative;
    }

    /* Decorative header line */
    header::after {
        content: ''; position: absolute; bottom: -1px; left: 0; width: 120px; height: 1px;
        background: var(--accent-cyan);
        box-shadow: var(--glow-cyan);
    }

    h1 {
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        position: relative;
    }
    
    h1 span { color: var(--accent-cyan); }

    .hud {
        display: flex;
        gap: 3rem;
        font-family: 'Courier New', Courier, monospace; /* Industrial monospace */
        font-size: 0.85rem;
        color: var(--text-dim);
        letter-spacing: 0.1em;
        text-transform: uppercase;
    }

    .hud-item {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 1;
    }

    .hud-item span {
        color: var(--text-main);
        font-weight: 700;
        font-size: 1.5rem;
        margin-top: 4px;
        text-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    /* --- THE BOARD --- */
    .board-wrapper {
        position: relative;
        padding: 12px;
        background: #0f1115;
        border: 1px solid #30363d;
        border-radius: 6px;
        box-shadow: var(--shadow-deep);
        /* Tech corners */
        clip-path: polygon(
            0 0, 
            100% 0, 
            100% calc(100% - 20px), 
            calc(100% - 20px) 100%, 
            0 100%
        );
    }
    
    /* Decorative corner bracket */
    .board-wrapper::before {
        content: ''; position: absolute; top: -1px; left: -1px; 
        width: 20px; height: 20px;
        border-top: 2px solid var(--accent-cyan);
        border-left: 2px solid var(--accent-cyan);
        box-shadow: var(--glow-cyan);
    }

    #grid-canvas {
        display: block;
        cursor: default;
        border-radius: 2px;
    }

    /* --- CONTROLS LEGEND --- */
    .controls {
        display: flex;
        gap: 1.5rem;
        width: 100%;
        justify-content: center;
        opacity: 0.8; /* Reduced visual weight */
        transition: opacity 0.3s;
    }

    .controls:hover { opacity: 1; }

    .control-group {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 16px;
        border-radius: 4px;
        background: rgba(255,255,255,0.02);
        border: 1px solid transparent;
    }

    .icon-box {
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-dim);
    }
    
    /* Specific colors for icons */
    .icon-player { color: var(--accent-cyan); }
    .icon-crate { color: var(--accent-amber); }
    .icon-lever { color: var(--accent-magenta); }

    .key-badge {
        background: #21262d;
        color: var(--text-main);
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.7rem;
        font-family: 'Courier New', monospace;
        font-weight: bold;
        border: 1px solid #30363d;
        box-shadow: 0 2px 0 #0d1014; /* 3D effect */
    }

    .label {
        font-size: 0.75rem;
        color: var(--text-dim);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-weight: 600;
    }

    /* --- FOOTER --- */
    footer {
        position: absolute;
        bottom: 20px;
        font-size: 0.7rem;
        color: #30363d;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-family: 'Courier New', monospace;
    }

</style>
</head>
<body>

<div class="game-container">
    <header>
        <h1>Iron <span>&</span> Flux</h1>
        <div class="hud">
            <div class="hud-item">Level<span>04</span></div>
            <div class="hud-item">Moves<span>12</span></div>
        </div>
    </header>

    <div class="board-wrapper">
        <canvas id="grid-canvas"></canvas>
    </div>

    <div class="controls">
        <div class="control-group">
            <div class="icon-box icon-player">
                <!-- Player Icon -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="12" r="10" />
                </svg>
            </div>
            <span class="label">Move <span class="key-badge">ARROWS</span></span>
        </div>
        <div class="control-group">
            <div class="icon-box icon-crate">
                <!-- Crate Icon -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                </svg>
            </div>
            <span class="label">Push <span class="key-badge">WALK</span></span>
        </div>
        <div class="control-group">
            <div class="icon-box icon-lever">
                <!-- Lever Icon -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <circle cx="12" cy="18" r="4" fill="currentColor"/>
                    <line x1="12" y1="18" x2="12" y2="6" />
                </svg>
            </div>
            <span class="label">Pull <span class="key-badge">SPACE</span></span>
        </div>
    </div>

    <footer>System Status: Online</footer>
</div>

<script>
/**
 * IRON & FLUX - VISUAL ENGINE
 * Focus: Materiality, Lighting, and Depth.
 */

const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');

// Configuration
const TILE_SIZE = 80;
const GRID_ROWS = 6;
const GRID_COLS = 8;

// Palette - Refined for "Industrial Cyberpunk"
const COLORS = {
    floor: '#161b22',
    floorGrid: '#21262d',
    wallTop: '#2a303c',
    wallSide: '#161b22',
    wallHighlight: '#484f58',
    playerGlow: '#00f3ff',
    playerCore: '#e6edf3',
    crateBase: '#d29922',
    crateDark: '#9e6a03',
    crateHighlight: '#e3b341',
    leverOff: '#ff0055',
    leverOn: '#00f3ff',
    target: '#30363d',
    doorClosed: '#0d1117',
    doorOpen: '#00f3ff'
};

// Game State
let gameState = {
    player: { x: 1, y: 2 },
    crates: [
        { x: 3, y: 2 }, 
        { x: 5, y: 3 }
    ],
    lever: { x: 4, y: 1, active: false },
    door: { x: 6, y: 4, open: false },
    target: { x: 2, y: 4 }, // Target zone for puzzle logic
    walls: [
        {x:2, y:0}, {x:2, y:1}, {x:2, y:2}, 
        {x:4, y:3}, {x:4, y:4}, {x:4, y:5},
        {x:6, y:2}, {x:6, y:3}, {x:0, y:4}, {x:0, y:5}
    ]
};

// Initialize Canvas
function init() {
    const width = GRID_COLS * TILE_SIZE;
    const height = GRID_ROWS * TILE_SIZE;
    
    // Handle High DPI (Retina)
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx.scale(dpr, dpr);

    draw();
}

// --- DRAWING HELPERS ---

function drawRect(x, y, color, radius = 0) {
    ctx.fillStyle = color;
    if (radius > 0) {
        ctx.beginPath();
        ctx.roundRect(x, y, TILE_SIZE - 4, TILE_SIZE - 4, radius);
        ctx.fill();
    } else {
        ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
    }
}

// 1. DRAW GRID & FLOOR
function drawGrid() {
    // Base background
    ctx.fillStyle = COLORS.floor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Grid Lines (Subtle)
    ctx.strokeStyle = COLORS.floorGrid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= GRID_COLS; x++) {
        ctx.moveTo(x * TILE_SIZE, 0);
        ctx.lineTo(x * TILE_SIZE, GRID_ROWS * TILE_SIZE);
    }
    for (let y = 0; y <= GRID_ROWS; y++) {
        ctx.moveTo(0, y * TILE_SIZE);
        ctx.lineTo(GRID_COLS * TILE_SIZE, y * TILE_SIZE);
    }
    ctx.stroke();

    // Floor Texture (Dots)
    ctx.fillStyle = '#21262d';
    for(let y=0; y<GRID_ROWS; y++) {
        for(let x=0; x<GRID_COLS; x++) {
            // Don't draw dots on walls/objects, just a general texture
            // Simple check to skip wall coordinates for cleanliness
            if(!gameState.walls.some(w => w.x === x && w.y === y)) {
                ctx.beginPath();
                ctx.arc(x * TILE_SIZE + TILE_SIZE/2, y * TILE_SIZE + TILE_SIZE/2, 1.5, 0, Math.PI*2);
                ctx.fill();
            }
        }
    }
}

// 2. DRAW TARGET (The Goal)
function drawTarget() {
    const t = gameState.target;
    const cx = t.x * TILE_SIZE + TILE_SIZE/2;
    const cy = t.y * TILE_SIZE + TILE_SIZE/2;
    
    ctx.save();
    ctx.strokeStyle = '#30363d';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.arc(cx, cy, 20, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner crosshair
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(cx - 5, cy); ctx.lineTo(cx + 5, cy);
    ctx.moveTo(cx, cy - 5); ctx.lineTo(cx, cy + 5);
    ctx.stroke();
    ctx.restore();
}

// 3. DRAW DOOR (Exit)
function drawDoor() {
    const d = gameState.door;
    const px = d.x * TILE_SIZE;
    const py = d.y * TILE_SIZE;
    
    // Frame
    ctx.strokeStyle = gameState.door.open ? COLORS.doorOpen : '#30363d';
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 12, py + 12, TILE_SIZE - 24, TILE_SIZE - 24);

    if (!gameState.door.open) {
        // Closed Door (Solid block)
        ctx.fillStyle = COLORS.doorClosed;
        ctx.fillRect(px + 14, py + 14, TILE_SIZE - 28, TILE_SIZE - 28);
        
        // Lock Mechanism
        ctx.fillStyle = '#484f58';
        ctx.beginPath();
        ctx.arc(px + TILE_SIZE/2, py + TILE_SIZE/2 - 2, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillRect(px + TILE_SIZE/2 - 4, py + TILE_SIZE/2 + 2, 8, 10);
        
        // Glowing Red indicator
        ctx.fillStyle = COLORS.leverOff;
        ctx.shadowColor = COLORS.leverOff;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(px + TILE_SIZE/2, py + TILE_SIZE/2 - 2, 2, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    } else {
        // Open Door (Energy field)
        ctx.fillStyle = 'rgba(0, 243, 255, 0.1)';
        ctx.fillRect(px + 14, py + 14, TILE_SIZE - 28, TILE_SIZE - 28);
        
        // Scanlines
        ctx.fillStyle = 'rgba(0, 243, 255, 0.3)';
        for(let i=0; i<4; i++) {
            ctx.fillRect(px + 14, py + 14 + (i*15), TILE_SIZE - 28, 2);
        }
    }
}

// 4. DRAW WALLS (Isometric-ish Bevels)
function drawWalls() {
    gameState.walls.forEach(w => {
        const px = w.x * TILE_SIZE;
        const py = w.y * TILE_SIZE;
        
        // Wall Top
        ctx.fillStyle = COLORS.wallTop;
        ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        
        // Wall Texture (Panel lines)
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(px + 10, py + 10); ctx.lineTo(px + TILE_SIZE - 10, py + TILE_SIZE - 10);
        ctx.moveTo(px + TILE_SIZE - 10, py + 10); ctx.lineTo(px + 10, py + TILE_SIZE - 10);
        ctx.stroke();

        // Wall Bevel (Bottom & Right for depth)
        ctx.fillStyle = COLORS.wallSide;
        // Bottom strip
        ctx.fillRect(px + 2, py + TILE_SIZE - 8, TILE_SIZE - 4, 6);
        // Right strip
        ctx.fillRect(px + TILE_SIZE - 8, py + 2, 6, TILE_SIZE - 4);
        
        // Top Highlight (Light source from top-left)
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.beginPath();
        ctx.moveTo(px + 2, py + TILE_SIZE - 2);
        ctx.lineTo(px + TILE_SIZE - 2, py + 2);
        ctx.lineTo(px + TILE_SIZE - 6, py + 2);
        ctx.lineTo(px + 2, py + TILE_SIZE - 6);
        ctx.fill();
    });
}

// 5. DRAW LEVER (Mechanical Switch)
function drawLever() {
    const l = gameState.lever;
    const cx = l.x * TILE_SIZE + TILE_SIZE/2;
    const cy = l.y * TILE_SIZE + TILE_SIZE/2;
    
    // Base Plate
    ctx.fillStyle = '#0d1117';
    ctx.beginPath();
    ctx.arc(cx, cy, 16, 0, Math.PI*2);
    ctx.fill();
    
    // Status Light
    const isActive = l.active;
    const color = isActive ? COLORS.leverOn : COLORS.leverOff;
    
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = color;
    
    // The Switch Handle
    ctx.beginPath();
    // Draw a toggle switch shape
    const switchH = isActive ? -6 : 6;
    ctx.rect(cx - 6, cy - 6, 12, 12); // Base
    
    // The Stick
    ctx.fillStyle = '#e6edf3';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx, cy + switchH);
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#e6edf3';
    ctx.stroke();
    
    // Knob
    ctx.beginPath();
    ctx.arc(cx, cy + switchH, 4, 0, Math.PI*2);
    ctx.fill();
    
    ctx.shadowBlur = 0;
}

// 6. DRAW CRATES (Heavy Industrial Cargo)
function drawCrates() {
    gameState.crates.forEach(c => {
        const px = c.x * TILE_SIZE;
        const py = c.y * TILE_SIZE;
        const pad = 6;
        const size = TILE_SIZE - pad*2;
        
        // Shadow (Drop shadow to show height)
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.roundRect(px + pad + 4, py + pad + 8, size, size, 4);
        ctx.fill();

        // Crate Body (Gradient for cylinder/rounded feel)
        const grad = ctx.createLinearGradient(px, py, px + TILE_SIZE, py + TILE_SIZE);
        grad.addColorStop(0, COLORS.crateHighlight);
        grad.addColorStop(0.5, COLORS.crateBase);
        grad.addColorStop(1, COLORS.crateDark);
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(px + pad, py + pad, size, size, 4);
        ctx.fill();

        // Crate Details (Rivets)
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        const rivetSize = 2;
        // Top Left
        ctx.beginPath(); ctx.arc(px + pad + 6, py + pad + 6, rivetSize, 0, Math.PI*2); ctx.fill();
        // Top Right
        ctx.beginPath(); ctx.arc(px + TILE_SIZE - pad - 6, py + pad + 6, rivetSize, 0, Math.PI*2); ctx.fill();
        // Bottom Left
        ctx.beginPath(); ctx.arc(px + pad + 6, py + TILE_SIZE - pad - 6, rivetSize, 0, Math.PI*2); ctx.fill();
        // Bottom Right
        ctx.beginPath(); ctx.arc(px + TILE_SIZE - pad - 6, py + TILE_SIZE - pad - 6, rivetSize, 0, Math.PI*2); ctx.fill();

        // Center Hazard Symbol (Triangle)
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px + TILE_SIZE/2, py + 16);
        ctx.lineTo(px + TILE_SIZE - 16, py + TILE_SIZE - 16);
        ctx.lineTo(px + 16, py + TILE_SIZE - 16);
        ctx.closePath();
        ctx.stroke();
    });
}

// 7. DRAW PLAYER (The "Flux" Core)
function drawPlayer() {
    const p = gameState.player;
    const cx = p.x * TILE_SIZE + TILE_SIZE/2;
    const cy = p.y * TILE_SIZE + TILE_SIZE/2;

    // Ambient Glow (The "Flux")
    ctx.save();
    ctx.shadowBlur = 25;
    ctx.shadowColor = COLORS.playerGlow;
    
    // Outer Ring
    ctx.fillStyle = COLORS.playerGlow;
    ctx.beginPath();
    ctx.arc(cx, cy, 16, 0, Math.PI*2);
    ctx.fill();
    
    // Inner Core (Bright White)
    ctx.shadowBlur = 0; // Reset for sharp core
    ctx.fillStyle = COLORS.playerCore;
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, Math.PI*2);
    ctx.fill();
    
    // Eye/Direction indicator (subtle)
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(cx + 4, cy - 2, 2, 0, Math.PI*2);
    ctx.fill();
    
    ctx.restore();
}

// --- MAIN RENDER LOOP ---
function draw() {
    drawGrid();
    drawTarget();
    drawDoor();
    drawWalls();
    drawLever();
    drawCrates();
    drawPlayer();
}

// --- INTERACTION LOGIC ---

function movePlayer(dx, dy) {
    const newX = gameState.player.x + dx;
    const newY = gameState.player.y + dy;

    // Bounds Check
    if (newX < 0 || newX >= GRID_COLS || newY < 0 || newY >= GRID_ROWS) return;

    // Wall Collision
    if (gameState.walls.some(w => w.x === newX && w.y === newY)) return;

    // Crate Collision (Push Logic)
    const crateIdx = gameState.crates.findIndex(c => c.x === newX && c.y === newY);
    if (crateIdx !== -1) {
        const newCrateX = newX + dx;
        const newCrateY = newY + dy;
        
        // Check if crate can move (not into wall, another crate, or bounds)
        const blocked = 
            (newCrateX < 0 || newCrateX >= GRID_COLS || newCrateY < 0 || newCrateY >= GRID_ROWS) ||
            gameState.walls.some(w => w.x === newCrateX && w.y === newCrateY) ||
            gameState.crates.some(c => c.x === newCrateX && c.y === newCrateY);
            
        // Also block if pushing into closed door
        if (gameState.door.x === newCrateX && gameState.door.y === newCrateY && !gameState.door.open) return;

        if (!blocked) {
            gameState.crates[crateIdx].x = newCrateX;
            gameState.crates[crateIdx].y = newCrateY;
            gameState.player.x = newX;
            gameState.player.y = newY;
            
            // Update Moves Count (Visual only)
            updateHUD();
            draw();
        }
    } else {
        // Empty Space Movement
        // Check if entering closed door
        if (gameState.door.x === newX && gameState.door.y === newY && !gameState.door.open) return;

        gameState.player.x = newX;
        gameState.player.y = newY;
        
        updateHUD();
        draw();
    }
}

function pullLever() {
    const p = gameState.player;
    const l = gameState.lever;
    
    // Adjacency Check (Manhattan distance = 1)
    const dist = Math.abs(p.x - l.x) + Math.abs(p.y - l.y);
    if (dist === 1) {
        l.active = !l.active;
        gameState.door.open = l.active;
        draw();
    }
}

function updateHUD() {
    // Simple visual feedback logic for demo
    const movesEl = document.querySelector('.hud-item:nth-child(2) span');
    let current = parseInt(movesEl.innerText);
    movesEl.innerText = (current + 1).toString().padStart(2, '0');
}

// Input Listeners
window.addEventListener('keydown', (e) => {
    // Prevent default scrolling for arrow keys
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight", " "].indexOf(e.code) > -1) {
        e.preventDefault();
    }

    switch(e.key) {
        case 'ArrowUp': movePlayer(0, -1); break;
        case 'ArrowDown': movePlayer(0, 1); break;
        case 'ArrowLeft': movePlayer(-1, 0); break;
        case 'ArrowRight': movePlayer(1, 0); break;
        case ' ': pullLever(); break;
    }
});

// Run
init();

</script>
</body>
</html>
