<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON & FLUX</title>
<style>
    :root {
        --bg-color: #0b0c10;
        --panel-bg: #12141a;
        --accent-cyan: #66fcf1;
        --accent-cyan-dim: #2c3e50;
        --accent-amber: #ffbd2e;
        --accent-amber-dark: #8a5a00;
        --accent-danger: #ff4b5c;
        --text-main: #c5c6c7;
        --text-dim: #45a29e;
        --font-display: "Arial Black", "Helvetica Neue", sans-serif;
        --font-tech: "Courier New", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        /* Industrial Texture Background */
        background-image: 
            radial-gradient(circle at 50% 30%, #1f2833 0%, #0b0c10 80%),
            repeating-linear-gradient(0deg, rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 1px, transparent 1px, transparent 4px);
    }

    /* --- LAYOUT --- */
    .game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 900px;
        padding: 20px;
        position: relative;
        z-index: 1;
    }

    /* --- HEADER & HUD --- */
    .interface-header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 20px;
        padding: 0 10px;
        border-bottom: 1px solid rgba(102, 252, 241, 0.1);
        padding-bottom: 10px;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 2.2rem; 
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-main);
        text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        position: relative;
    }

    h1 span {
        color: var(--accent-cyan);
        text-shadow: 0 0 15px rgba(102, 252, 241, 0.4);
    }

    /* HUD: Moves prioritized */
    .hud {
        display: flex;
        gap: 30px;
        background: linear-gradient(90deg, rgba(18,20,26,0) 0%, rgba(18,20,26,0.8) 100%);
        padding: 8px 24px;
        border-right: 4px solid var(--accent-cyan);
    }

    .hud-item {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: center;
    }

    .hud-label {
        font-family: var(--font-tech);
        font-size: 0.65rem;
        color: var(--text-dim);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 2px;
    }

    .hud-value {
        font-family: var(--font-display);
        font-size: 1.8rem;
        color: var(--text-main);
        letter-spacing: 0.02em;
        line-height: 1;
    }

    .hud-value.moves {
        color: var(--accent-cyan);
        font-size: 2.2rem;
        text-shadow: 0 0 10px rgba(102, 252, 241, 0.3);
    }

    /* --- THE BOARD --- */
    .board-frame {
        position: relative;
        padding: 8px;
        background: #000;
        border: 1px solid #1f2833;
        box-shadow: 
            0 20px 50px -10px rgba(0,0,0,0.8),
            inset 0 0 20px rgba(0,0,0,0.9);
        border-radius: 4px;
    }

    /* Corner Accents */
    .corner {
        position: absolute;
        width: 16px; height: 16px;
        border: 2px solid var(--accent-cyan);
        transition: all 0.3s ease;
        opacity: 0.6;
    }
    .tl { top: -1px; left: -1px; border-bottom: none; border-right: none; }
    .tr { top: -1px; right: -1px; border-bottom: none; border-left: none; }
    .bl { bottom: -1px; left: -1px; border-top: none; border-right: none; }
    .br { bottom: -1px; right: -1px; border-top: none; border-left: none; }

    #grid-canvas {
        display: block;
        background-color: #0e1116;
        width: 100%; 
        height: auto;
        border: 1px solid #1f2833;
    }

    /* --- CONTROLS LEGEND --- */
    .controls-wrapper {
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }

    .connector {
        width: 2px;
        height: 16px;
        background: linear-gradient(to bottom, var(--accent-cyan), transparent);
        opacity: 0.5;
    }

    .controls {
        display: flex;
        gap: 24px;
        background: rgba(255,255,255,0.03);
        padding: 12px 24px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.05);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .control-group {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .key-cluster {
        display: flex;
        gap: 4px;
    }

    .key-badge {
        background: #1f2833;
        color: var(--accent-cyan);
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        font-size: 0.8rem;
        font-family: var(--font-tech);
        font-weight: bold;
        box-shadow: 0 4px 0 #0b0c10, 0 5px 5px rgba(0,0,0,0.3);
        border: 1px solid rgba(102, 252, 241, 0.2);
    }

    .key-badge.wide {
        width: auto;
        padding: 0 12px;
    }

    .control-text {
        font-size: 0.85rem;
        color: var(--text-main);
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        opacity: 0.9;
    }
    
    .control-sub {
        font-size: 0.7rem;
        color: var(--text-dim);
        display: block;
        margin-top: 2px;
        font-weight: 400;
    }

    /* --- FOOTER --- */
    footer {
        margin-top: 20px;
        font-family: var(--font-tech);
        font-size: 0.7rem;
        color: var(--text-dim);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        opacity: 0.7;
        text-align: center;
    }
    
    footer span {
        color: var(--accent-cyan);
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
        .interface-header { flex-direction: column; align-items: flex-start; gap: 10px; }
        .hud { align-self: flex-end; border-right: none; border-top: 2px solid var(--accent-cyan); padding: 4px 0; }
        h1 { font-size: 1.8rem; }
        .controls { flex-direction: column; gap: 12px; }
    }
</style>
</head>
<body>

<div class="game-container">
    <!-- Header & HUD -->
    <div class="interface-header">
        <h1>Iron <span>&</span> Flux</h1>
        <div class="hud">
            <div class="hud-item">
                <span class="hud-label">Sector</span>
                <span class="hud-value">04</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Cycles</span>
                <span class="hud-value moves" id="move-counter">12</span>
            </div>
        </div>
    </div>

    <!-- Game Board -->
    <div class="board-frame">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <canvas id="grid-canvas"></canvas>
    </div>

    <!-- Controls Legend -->
    <div class="controls-wrapper">
        <div class="connector"></div>
        <div class="controls">
            <div class="control-group">
                <div class="key-cluster">
                    <div class="key-badge">↑</div>
                    <div class="key-badge">↓</div>
                    <div class="key-badge">←</div>
                    <div class="key-badge">→</div>
                </div>
                <div>
                    <span class="control-text">Move / Push</span>
                    <span class="control-sub">Navigate the grid</span>
                </div>
            </div>
            
            <div class="control-group">
                <div class="key-badge wide">SPACE</div>
                <div>
                    <span class="control-text">Toggle Lever</span>
                    <span class="control-sub">Unlock mechanism</span>
                </div>
            </div>
        </div>
    </div>

    <footer>System Status: <span>ONLINE</span> // Core Temp: Stable // Grid: <span>LOCKED</span></footer>
</div>

<script>
/**
 * IRON & FLUX - VISUAL ENGINE v3
 * Focus: Heavy Industry, High Voltage, Depth, Materiality.
 * Addresses all critiques: Door, Lever, Contrast, Hierarchy.
 */

const canvas = document.getElementById('grid-canvas');
const ctx = canvas.getContext('2d');

// Configuration
const TILE_SIZE = 80;
const GRID_ROWS = 6;
const GRID_COLS = 8;

// Palette - Deep Industrial
const COLORS = {
    floor: '#0b0c10',
    gridLine: '#1f2833',
    wallTop: '#45a29e', // Subtle teal tint for walls
    wallSide: '#0b0c10',
    wallShadow: '#000000',
    playerGlow: '#66fcf1',
    playerCore: '#ffffff',
    // Rusty Industrial Yellow
    crateBase: '#ffbd2e',
    crateDark: '#8a5a00',
    crateHighlight: '#ffe066',
    leverOff: '#ff4b5c',
    leverOn: '#66fcf1',
    doorClosed: '#1f2833',
    doorFrame: '#000000',
    target: '#45a29e'
};

// Game State
let gameState = {
    player: { x: 1, y: 2 },
    crates: [
        { x: 3, y: 2 }, 
        { x: 5, y: 3 }
    ],
    lever: { x: 4, y: 1, active: false },
    door: { x: 6, y: 4, open: false },
    target: { x: 2, y: 4 }, 
    walls: [
        {x:2, y:0}, {x:2, y:1}, {x:2, y:2}, 
        {x:4, y:3}, {x:4, y:4}, {x:4, y:5},
        {x:6, y:2}, {x:6, y:3}, {x:0, y:4}, {x:0, y:5}
    ]
};

// Initialize Canvas
function init() {
    const width = GRID_COLS * TILE_SIZE;
    const height = GRID_ROWS * TILE_SIZE;
    
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx.scale(dpr, dpr);

    draw();
}

// --- DRAWING HELPERS ---

// 1. DRAW GRID & FLOOR (Industrial Grating)
function drawGrid() {
    ctx.fillStyle = COLORS.floor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Grid Lines (Stronger)
    ctx.strokeStyle = COLORS.gridLine;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x <= GRID_COLS; x++) {
        ctx.moveTo(x * TILE_SIZE, 0);
        ctx.lineTo(x * TILE_SIZE, GRID_ROWS * TILE_SIZE);
    }
    for (let y = 0; y <= GRID_ROWS; y++) {
        ctx.moveTo(0, y * TILE_SIZE);
        ctx.lineTo(GRID_COLS * TILE_SIZE, y * TILE_SIZE);
    }
    ctx.stroke();

    // Floor Texture (Industrial Dimples)
    ctx.fillStyle = '#161b22';
    for(let y=0; y<GRID_ROWS; y++) {
        for(let x=0; x<GRID_COLS; x++) {
            const cx = x * TILE_SIZE + TILE_SIZE/2;
            const cy = y * TILE_SIZE + TILE_SIZE/2;
            
            // Center rivet
            ctx.beginPath();
            ctx.arc(cx, cy, 2, 0, Math.PI*2);
            ctx.fill();
            
            // Corner fasteners
            const off = 8;
            ctx.beginPath(); ctx.arc(x * TILE_SIZE + off, y * TILE_SIZE + off, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x * TILE_SIZE + TILE_SIZE - off, y * TILE_SIZE + off, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x * TILE_SIZE + off, y * TILE_SIZE + TILE_SIZE - off, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x * TILE_SIZE + TILE_SIZE - off, y * TILE_SIZE + TILE_SIZE - off, 1.5, 0, Math.PI*2); ctx.fill();
        }
    }
}

// 2. DRAW TARGET (The Goal) - High Visibility
function drawTarget() {
    const t = gameState.target;
    const cx = t.x * TILE_SIZE + TILE_SIZE/2;
    const cy = t.y * TILE_SIZE + TILE_SIZE/2;
    
    ctx.save();
    // Dashed Circle
    ctx.strokeStyle = COLORS.target;
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.arc(cx, cy, 26, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner X
    ctx.setLineDash([]);
    ctx.strokeStyle = COLORS.target;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 12, cy - 12); ctx.lineTo(cx + 12, cy + 12);
    ctx.moveTo(cx + 12, cy - 12); ctx.lineTo(cx - 12, cy + 12);
    ctx.stroke();
    ctx.restore();
}

// 3. DRAW DOOR (Exit) - Distinct Mechanism
function drawDoor() {
    const d = gameState.door;
    const px = d.x * TILE_SIZE;
    const py = d.y * TILE_SIZE;
    
    // Heavy Frame
    ctx.fillStyle = COLORS.doorFrame;
    ctx.fillRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);
    
    // Inner Recess
    ctx.fillStyle = '#000';
    ctx.fillRect(px + 8, py + 8, TILE_SIZE - 16, TILE_SIZE - 16);

    if (!gameState.door.open) {
        // Closed Door (Reinforced Metal)
        ctx.fillStyle = COLORS.doorClosed;
        ctx.fillRect(px + 12, py + 12, TILE_SIZE - 24, TILE_SIZE - 24);
        
        // Lock Mechanism (X pattern)
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(px + 20, py + 20); ctx.lineTo(px + TILE_SIZE - 20, py + TILE_SIZE - 20);
        ctx.moveTo(px + TILE_SIZE - 20, py + 20); ctx.lineTo(px + 20, py + TILE_SIZE - 20);
        ctx.stroke();
        
        // Warning Light (Red)
        ctx.fillStyle = COLORS.leverOff;
        ctx.shadowColor = COLORS.leverOff;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(px + TILE_SIZE/2, py + TILE_SIZE/2, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    } else {
        // Open Door (Flux Field)
        ctx.fillStyle = 'rgba(102, 252, 241, 0.15)';
        ctx.fillRect(px + 12, py + 12, TILE_SIZE - 24, TILE_SIZE - 24);
        
        // Energy Beams
        ctx.shadowColor = COLORS.playerGlow;
        ctx.shadowBlur = 15;
        ctx.fillStyle = COLORS.playerGlow;
        
        for(let i=0; i<3; i++) {
            const yOff = (i * 14) + 24;
            ctx.fillRect(px + 16, py + yOff, TILE_SIZE - 32, 4);
        }
        ctx.shadowBlur = 0;
    }
}

// 4. DRAW WALLS (Tactile Blocks)
function drawWalls() {
    gameState.walls.forEach(w => {
        const px = w.x * TILE_SIZE;
        const py = w.y * TILE_SIZE;
        
        // Main Block
        ctx.fillStyle = '#1f2833';
        ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        
        // Texture (Hazard Stripes)
        ctx.save();
        ctx.beginPath();
        ctx.rect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        ctx.clip();
        
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(px - 20, py + 20); ctx.lineTo(px + 100, py + 120);
        ctx.moveTo(px - 20, py + 50); ctx.lineTo(px + 100, py + 150);
        ctx.moveTo(px - 20, py + 80); ctx.lineTo(px + 100, py + 180);
        ctx.stroke();
        ctx.restore();

        // 3D Depth (Sides)
        ctx.fillStyle = COLORS.wallSide;
        // Right side
        ctx.fillRect(px + TILE_SIZE - 6, py + 2, 4, TILE_SIZE - 4);
        // Bottom side
        ctx.fillRect(px + 2, py + TILE_SIZE - 6, TILE_SIZE - 4, 4);
        
        // Top Highlight
        ctx.strokeStyle = 'rgba(69, 162, 158, 0.2)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px + 2, py + TILE_SIZE - 2);
        ctx.lineTo(px + TILE_SIZE - 2, py + 2);
        ctx.stroke();
    });
}

// 5. DRAW LEVER (Mechanical Switch) - Distinct Icon
function drawLever() {
    const l = gameState.lever;
    const cx = l.x * TILE_SIZE + TILE_SIZE/2;
    const cy = l.y * TILE_SIZE + TILE_SIZE/2;
    
    // Base Plate
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(cx, cy, 24, 0, Math.PI*2);
    ctx.fill();
    
    // Plate Rim (Riveted)
    ctx.strokeStyle = '#1f2833';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    const isActive = l.active;
    const color = isActive ? COLORS.leverOn : COLORS.leverOff;
    
    // Switch Handle (The T)
    ctx.fillStyle = '#c5c6c7';
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    
    // Base of stick
    ctx.fillRect(cx - 3, cy - 12, 6, 24);
    // Top bar of T
    ctx.fillRect(cx - 10, cy - 16, 20, 8);
    
    // Status Indicator Light on plate
    ctx.fillStyle = color;
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.arc(cx, cy + 14, 4, 0, Math.PI*2);
    ctx.fill();
    
    ctx.shadowBlur = 0;
}

// 6. DRAW CRATES (Heavy Industrial Cargo)
function drawCrates() {
    gameState.crates.forEach(c => {
        const px = c.x * TILE_SIZE;
        const py = c.y * TILE_SIZE;
        const pad = 6;
        const size = TILE_SIZE - pad*2;
        
        // Deep Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.beginPath();
        ctx.roundRect(px + pad + 8, py + pad + 12, size, size, 4);
        ctx.fill();

        // Crate Body (Metallic Gradient)
        const grad = ctx.createLinearGradient(px, py, px + TILE_SIZE, py + TILE_SIZE);
        grad.addColorStop(0, COLORS.crateHighlight);
        grad.addColorStop(0.4, COLORS.crateBase);
        grad.addColorStop(1, COLORS.crateDark);
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(px + pad, py + pad, size, size, 4);
        ctx.fill();

        // Inner Bevel
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Rivets
        ctx.fillStyle = '#3a2600';
        const rivetSize = 3;
        ctx.beginPath(); ctx.arc(px + pad + 8, py + pad + 8, rivetSize, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(px + TILE_SIZE - pad - 8, py + pad + 8, rivetSize, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(px + pad + 8, py + TILE_SIZE - pad - 8, rivetSize, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(px + TILE_SIZE - pad - 8, py + TILE_SIZE - pad - 8, rivetSize, 0, Math.PI*2); ctx.fill();

        // Hazard Symbol (Warning Triangle)
        ctx.strokeStyle = '#3a2600';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(px + TILE_SIZE/2, py + 16);
        ctx.lineTo(px + TILE_SIZE - 16, py + TILE_SIZE - 16);
        ctx.lineTo(px + 16, py + TILE_SIZE - 16);
        ctx.closePath();
        ctx.stroke();
        
        // Exclamation
        ctx.fillStyle = '#3a2600';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('!', px + TILE_SIZE/2, py + TILE_SIZE/2 + 4);
    });
}

// 7. DRAW PLAYER (The "Flux" Core)
function drawPlayer() {
    const p = gameState.player;
    const cx = p.x * TILE_SIZE + TILE_SIZE/2;
    const cy = p.y * TILE_SIZE + TILE_SIZE/2;

    // Ambient Glow (The "Flux")
    ctx.save();
    ctx.shadowBlur = 40;
    ctx.shadowColor = COLORS.playerGlow;
    
    // Outer Ring
    ctx.fillStyle = COLORS.playerGlow;
    ctx.beginPath();
    ctx.arc(cx, cy, 18, 0, Math.PI*2);
    ctx.fill();
    
    // Inner Core
    ctx.shadowBlur = 0; 
    ctx.fillStyle = COLORS.playerCore;
    ctx.beginPath();
    ctx.arc(cx, cy, 10, 0, Math.PI*2);
    ctx.fill();
    
    ctx.restore();
}

// --- MAIN RENDER LOOP ---
function draw() {
    drawGrid();
    drawTarget();
    drawDoor();
    drawWalls();
    drawLever();
    drawCrates();
    drawPlayer();
}

// --- INTERACTION LOGIC ---

function movePlayer(dx, dy) {
    const newX = gameState.player.x + dx;
    const newY = gameState.player.y + dy;

    // Bounds Check
    if (newX < 0 || newX >= GRID_COLS || newY < 0 || newY >= GRID_ROWS) return;

    // Wall Collision
    if (gameState.walls.some(w => w.x === newX && w.y === newY)) return;

    // Crate Collision (Push Logic)
    const crateIdx = gameState.crates.findIndex(c => c.x === newX && c.y === newY);
    if (crateIdx !== -1) {
        const newCrateX = newX + dx;
        const newCrateY = newY + dy;
        
        const blocked = 
            (newCrateX < 0 || newCrateX >= GRID_COLS || newCrateY < 0 || newCrateY >= GRID_ROWS) ||
            gameState.walls.some(w => w.x === newCrateX && w.y === newCrateY) ||
            gameState.crates.some(c => c.x === newCrateX && c.y === newCrateY);
            
        if (gameState.door.x === newCrateX && gameState.door.y === newCrateY && !gameState.door.open) return;

        if (!blocked) {
            gameState.crates[crateIdx].x = newCrateX;
            gameState.crates[crateIdx].y = newCrateY;
            gameState.player.x = newX;
            gameState.player.y = newY;
            updateHUD();
            draw();
        }
    } else {
        // Empty Space Movement
        if (gameState.door.x === newX && gameState.door.y === newY && !gameState.door.open) return;

        gameState.player.x = newX;
        gameState.player.y = newY;
        updateHUD();
        draw();
    }
}

function pullLever() {
    const p = gameState.player;
    const l = gameState.lever;
    const dist = Math.abs(p.x - l.x) + Math.abs(p.y - l.y);
    if (dist === 1) {
        l.active = !l.active;
        gameState.door.open = l.active;
        draw();
    }
}

function updateHUD() {
    const movesEl = document.getElementById('move-counter');
    let current = parseInt(movesEl.innerText);
    movesEl.innerText = (current + 1).toString().padStart(2, '0');
}

// Input Listeners
window.addEventListener('keydown', (e) => {
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight", " "].indexOf(e.code) > -1) {
        e.preventDefault();
    }

    switch(e.key) {
        case 'ArrowUp': movePlayer(0, -1); break;
        case 'ArrowDown': movePlayer(0, 1); break;
        case 'ArrowLeft': movePlayer(-1, 0); break;
        case 'ArrowRight': movePlayer(1, 0); break;
        case ' ': pullLever(); break;
    }
});

// Run
init();

</script>
</body>
</html>
