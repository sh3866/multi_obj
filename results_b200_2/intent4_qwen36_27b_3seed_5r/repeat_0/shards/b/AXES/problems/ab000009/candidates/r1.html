<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Interface</title>
<style>
  :root {
    /* Palette: Midnight Slate & Soft Gold */
    --bg-app: #0f1115;
    --bg-panel: #181b21;
    --bg-board: #2d3340; /* Dark square base */
    
    --board-light: #cdd5e0; /* Crisp off-white/light slate */
    --board-dark: #6b7c93;  /* Muted slate blue */
    
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    
    --accent: #d4af37;
    --accent-glow: rgba(212, 175, 55, 0.2);
    
    --highlight-move: rgba(212, 175, 55, 0.45);
    --highlight-last: rgba(212, 175, 55, 0.15);
    
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Roboto Mono", "Courier New", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

  body {
    background-color: var(--bg-app);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    user-select: none;
  }

  /* Layout Container */
  .app-container {
    display: flex;
    gap: 32px;
    height: 92vh;
    width: 92vw;
    max-width: 1200px;
    align-items: stretch;
  }

  /* --- Board Section --- */
  .board-area {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 20px;
    background: var(--bg-panel);
    border-radius: 12px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.05);
  }

  /* Coordinate Labels */
  .coords {
    position: absolute;
    display: flex;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    pointer-events: none;
    z-index: 10;
  }
  
  .coords-files {
    bottom: 5px;
    left: 20px; /* padding matches board-area */
    right: 20px;
    justify-content: space-around;
    text-transform: uppercase;
  }
  
  .coords-ranks {
    top: 20px;
    bottom: 20px;
    left: 5px;
    flex-direction: column;
    justify-content: space-around;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: min(80vh, 700px); /* Responsive square */
    height: min(80vh, 700px);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.5);
  }

  .square {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Board Colors */
  .square.light { background-color: var(--board-light); }
  .square.dark { background-color: var(--board-dark); }
  
  /* Highlights */
  .square.last-move { background-color: var(--highlight-last) !important; }
  .square.selected { background-color: var(--highlight-move) !important; }

  /* Pieces */
  .piece {
    width: 85%;
    height: 85%;
    cursor: pointer;
    transition: transform 0.2s ease;
    /* No drop shadows, pure vector contrast */
    z-index: 2;
  }
  
  .piece:hover {
    transform: scale(1.05);
  }
  
  .piece svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.25)); /* Very subtle depth */
  }

  /* --- Side Panel --- */
  .sidebar {
    flex: 1;
    background: var(--bg-panel);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    overflow: hidden;
  }

  /* Header */
  .panel-header {
    padding: 24px 30px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.02);
  }

  .game-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 12px;
    font-weight: 600;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .turn-indicator {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--board-light);
    box-shadow: 0 0 0 2px var(--bg-panel), 0 0 0 4px var(--board-light);
    transition: background 0.3s, box-shadow 0.3s;
  }
  
  .turn-indicator.black-turn {
    background: #111;
    box-shadow: 0 0 0 2px var(--bg-panel), 0 0 0 4px #111;
  }

  .status-text {
    font-size: 18px;
    font-weight: 500;
    color: var(--text-main);
    letter-spacing: 0.5px;
  }

  /* Move History Table */
  .move-history-container {
    flex: 1;
    padding: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: #1e2229; /* Slightly lighter than panel bg */
    margin: 20px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .move-table-header {
    display: grid;
    grid-template-columns: 40px 1fr 1fr;
    padding: 10px 15px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .move-list {
    flex: 1;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 5px 0;
  }

  .move-row {
    display: grid;
    grid-template-columns: 40px 1fr 1fr;
    padding: 8px 15px;
    border-bottom: 1px solid rgba(255,255,255,0.02);
    color: var(--text-main);
  }

  .move-row:nth-child(even) {
    background-color: rgba(255,255,255,0.01);
  }

  .move-num {
    color: var(--text-muted);
    font-size: 12px;
    opacity: 0.7;
  }

  .move-ply {
    cursor: default;
    padding: 2px 6px;
    border-radius: 4px;
  }
  
  .move-ply:hover {
    background-color: rgba(255,255,255,0.1);
    color: #fff;
  }

  .move-ply.active {
    color: var(--accent);
  }

  /* Controls */
  .controls-area {
    padding: 24px 30px;
    background: rgba(255,255,255,0.02);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }

  button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-muted);
    padding: 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--font-stack);
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s ease;
  }

  button:hover {
    background: rgba(255,255,255,0.05);
    color: var(--text-main);
    border-color: rgba(255,255,255,0.3);
  }

  button.primary {
    background: rgba(212, 175, 55, 0.1);
    border-color: rgba(212, 175, 55, 0.4);
    color: var(--accent);
  }

  button.primary:hover {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    box-shadow: 0 4px 12px var(--accent-glow);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }

  /* Mobile Responsive */
  @media (max-width: 900px) {
    .app-container { flex-direction: column; height: auto; overflow-y: auto; padding: 20px 0; }
    .board-area { width: 100%; }
    .board { width: 100%; height: 100%; aspect-ratio: 1/1; }
    .sidebar { width: 100%; min-height: 400px; }
    .coords { display: none; } /* Hide coords on small screens to save space */
  }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- Board Section -->
  <div class="board-area">
    <div class="coords coords-ranks" id="rank-labels"></div>
    <div class="board" id="board"></div>
    <div class="coords coords-files" id="file-labels"></div>
  </div>

  <!-- Side Panel -->
  <div class="sidebar">
    
    <div class="panel-header">
      <div class="game-title">Grandmaster Engine</div>
      <div class="status-row">
        <div class="turn-indicator" id="turn-dot"></div>
        <span class="status-text" id="status-text">White to move</span>
      </div>
    </div>

    <!-- Structured Move History -->
    <div class="move-history-container">
      <div class="move-table-header">
        <span>#</span>
        <span>White</span>
        <span>Black</span>
      </div>
      <div class="move-list" id="move-list">
        <!-- Moves injected via JS -->
      </div>
    </div>

    <div class="controls-area">
      <button class="primary" style="width: 100%; margin-bottom: 5px;">Analyze Position</button>
      <div class="btn-row">
        <button onclick="resetGame()">New Game</button>
        <button onclick="alert('Flip feature disabled in demo')">Flip Board</button>
      </div>
    </div>

  </div>
</div>

  // NOTE: Array index 0 is row 8 (Black pieces), Array index 7 is row 1 (White pieces)

    ['br', 'bn', 'bb', 'bq', 'bk', 'bb', 'bn', 'br'], // Row 8
    ['bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp'], // Row 7
    ['', '', '', '', '', '', '', ''],
    ['', '', '', '', '', '', '', ''],
    ['', '', '', '', '', '', '', ''],
    ['', '', '', '', '', '', '', ''],
    ['wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp'], // Row 2
    ['wr', 'wn', 'wb', 'wq', 'wk', 'wb', 'wn', 'wr']  // Row 1
  ];

  let turn = 'w'; // 'w' or 'b'
  let moveCount = 1;
  let selectedSquare = null; // {r, c}
  
  const moveList = document.getElementById('move-list');
  const statusText = document.getElementById('status-text');
  const turnDot = document.getElementById('turn-dot');

  // --- Initialization ---
  function initBoard() {
    const boardEl = document.getElementById('board');
    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    
    // Render Board Grid
    boardEl.innerHTML = '';
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const square = document.createElement('div');
        // Checkers pattern: (r+c)%2==0 is light
        square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
        square.dataset.r = r;
        square.dataset.c = c;
        
        // Highlight if selected
        if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
          square.classList.add('selected');
        }

        const pieceCode = boardState[r][c];
        if (pieceCode) {
          const color = pieceCode[0];
          const type = pieceCode[1];
          const pieceEl = document.createElement('div');
          pieceEl.className = `piece ${color === 'w' ? 'white' : 'black'}`;
          pieceEl.innerHTML = pieces[color][type];
          
          // Click Interaction
          pieceEl.onclick = (e) => {
            e.stopPropagation();
            handlePieceClick(r, c, color, type);
          };
          
          square.appendChild(pieceEl);
        }
        
        // Click empty square (to deselect or move)
        square.onclick = () => {
          if(selectedSquare) {
             // Logic to move piece to empty square would go here
             // For this demo, clicking empty square deselects
             selectedSquare = null;
             initBoard();
          }
        };
        
        boardEl.appendChild(square);
      }
    }

    // Render Coordinates
    const fileLabels = document.getElementById('file-labels');
    const rankLabels = document.getElementById('rank-labels');
    fileLabels.innerHTML = '';
    rankLabels.innerHTML = '';
    
    files.forEach(f => {
      const span = document.createElement('span');
      span.innerText = f;
      fileLabels.appendChild(span);
    });
    for(let i=8; i>0; i--) {
      const span = document.createElement('span');
      span.innerText = i;
      rankLabels.appendChild(span);
    }
  }

  // --- Logic ---
  function handlePieceClick(r, c, color, type) {
    // If clicking own piece, select it
    if (color === turn) {
      selectedSquare = {r, c};
      initBoard(); // Re-render to show highlight
      return;
    }

    // If clicking opponent piece and we have a selection, simulate capture
    if (selectedSquare) {
      executeMove(selectedSquare.r, selectedSquare.c, r, c);
    }
  }

  function executeMove(fromR, fromC, toR, toC) {
    const pieceCode = boardState[fromR][fromC];
    const targetCode = boardState[toR][toC];
    
    // Update State
    boardState[toR][toC] = pieceCode;
    boardState[fromR][fromC] = '';
    
    // Generate notation (Simplified)
    const pieceName = (pieceCode[1] === 'p') ? '' : pieceCode[1].toUpperCase();
    const capture = targetCode ? 'x' : '';
    const notation = `${pieceName}${capture}${String.fromCharCode(97+toC)}${8-toR}`;
    
    addMoveToHistory(notation);
    
    // Switch Turn
    turn = turn === 'w' ? 'b' : 'w';
    selectedSquare = null;
    updateStatus();
    initBoard(); // Re-render
  }

  function addMoveToHistory(notation) {
    if (turn === 'b') {
      // White just moved
      const row = document.createElement('div');
      row.className = 'move-row';
      row.innerHTML = `
        <div class="move-num">${moveCount}.</div>
        <div class="move-ply active">${notation}</div>
        <div class="move-ply" id="last-black"></div>
      `;
      moveList.appendChild(row);
    } else {
      // Black just moved
      const lastRow = moveList.lastElementChild;
      if (lastRow) {
        const whitePly = lastRow.querySelector('.move-ply.active');
        if(whitePly) whitePly.classList.remove('active');
        
        const blackPly = lastRow.querySelector('#last-black');
        blackPly.innerText = notation;
        blackPly.classList.add('active');
        moveCount++;
      }
    }
    moveList.scrollTop = moveList.scrollHeight;
  }

  function updateStatus() {
    statusText.innerText = turn === 'w' ? "White to move" : "Black to move";
    if (turn === 'b') {
      turnDot.classList.add('black-turn');
    } else {
      turnDot.classList.remove('black-turn');
    }
  }

  function resetGame() {
    // Reload to reset state cleanly for this demo
    location.reload();
  }

  // Start
  initBoard();

</script>
