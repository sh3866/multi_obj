<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grandmaster Chess Interface</title>
<style>
  :root {
    /* Palette: "Midnight Onyx" - Premium Dark Mode */
    --bg-app: #0f1115; 
    --bg-panel: #161b22;
    --bg-panel-border: #30363d;
    
    /* Board Colors: High Contrast Slate & Cream */
    --board-light: #e2e8f0; 
    --board-dark: #475569;
    
    /* Highlights */
    --highlight-selected: rgba(59, 130, 246, 0.5); /* Blue tint */
    --highlight-last: rgba(255, 255, 255, 0.15);
    
    /* Text */
    --text-main: #c9d1d9;
    --text-muted: #8b949e;
    --text-bright: #ffffff;
    
    /* Accents */
    --accent: #58a6ff;
    
    /* Fonts */
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Roboto Mono", "Courier New", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

  body {
    background-color: var(--bg-app);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    user-select: none;
    background-image: radial-gradient(circle at 50% 0%, #1f2430 0%, var(--bg-app) 60%);
  }

  /* Layout Container */
  .app-container {
    display: flex;
    gap: 24px; /* Tighter gap */
    height: 92vh;
    width: 94vw;
    max-width: 1400px;
    align-items: stretch;
  }

  /* --- Board Section --- */
  .board-area {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 16px;
    background: var(--bg-panel);
    border-radius: 12px;
    /* Premium shadow */
    box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.7);
    border: 1px solid var(--bg-panel-border);
  }

  /* Coordinate Labels - High Contrast */
  .coords {
    position: absolute;
    display: flex;
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 700;
    color: var(--text-bright); /* Increased contrast */
    pointer-events: none;
    z-index: 5;
    letter-spacing: 1px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  
  .coords-files {
    bottom: 4px;
    left: 16px;
    right: 16px;
    justify-content: space-around;
    text-transform: uppercase;
  }
  
  .coords-ranks {
    top: 16px;
    bottom: 16px;
    left: 4px;
    flex-direction: column;
    justify-content: space-around;
    text-align: center;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: min(80vh, 760px);
    height: min(80vh, 760px);
    /* Distinct border */
    border: 4px solid var(--bg-panel-border);
    border-radius: 4px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
  }

  .square {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Board Colors */
  .square.light { background-color: var(--board-light); }
  .square.dark { background-color: var(--board-dark); }
  
  /* Highlights */
  .square.last-move { background-color: var(--highlight-last) !important; }
  .square.selected { background-color: var(--highlight-selected) !important; }

  /* Pieces - High Fidelity */
  .piece {
    width: 88%;
    height: 88%;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 2;
    /* Drop shadow for depth */
    filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.4));
  }
  
  .piece:hover {
    transform: scale(1.1) translateY(-4px);
  }
  
  .piece svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* --- Side Panel --- */
  .sidebar {
    flex: 1;
    background: var(--bg-panel);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--bg-panel-border);
    box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    min-width: 360px;
  }

  /* Header - Subtle Label */
  .panel-header {
    padding: 24px 28px;
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid var(--bg-panel-border);
  }

  .game-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 16px;
    font-weight: 600;
    opacity: 0.7;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Active Turn Indicator - High Contrast */
  .turn-indicator {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--board-light);
    border: 2px solid var(--text-bright);
    box-shadow: 0 0 12px rgba(255,255,255,0.4);
    transition: all 0.3s ease;
  }
  
  .turn-indicator.black-turn {
    background: #111;
    border-color: var(--text-muted);
    box-shadow: 0 0 12px rgba(0,0,0,0.6);
  }

  .status-text {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-bright);
    letter-spacing: -0.3px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  /* Move History - Structured Table */
  .move-history-container {
    flex: 1;
    margin: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-panel);
  }

  .move-table-header {
    display: grid;
    grid-template-columns: 40px 1fr 1fr;
    padding: 16px 24px;
    background: rgba(0,0,0,0.2);
    border-bottom: 1px solid var(--bg-panel-border);
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .move-list {
    flex: 1;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 15px;
    padding: 0;
  }

  /* Empty State */
  .empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-muted);
    font-size: 13px;
    font-style: italic;
    opacity: 0.8;
    letter-spacing: 0.5px;
  }

  .move-row {
    display: grid;
    grid-template-columns: 40px 1fr 1fr;
    padding: 10px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    color: var(--text-main);
    transition: background 0.1s;
  }

  .move-row:nth-child(even) {
    background-color: rgba(255,255,255,0.01);
  }
  
  /* Active move highlighting */
  .move-row.active-move {
    background-color: rgba(59, 130, 246, 0.15);
    border-left: 3px solid var(--accent);
    padding-left: 21px; /* Compensate for border */
  }

  .move-num {
    color: var(--text-muted);
    font-size: 13px;
    opacity: 0.6;
    font-family: var(--font-ui);
  }

  .move-ply {
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
  }
  
  .move-ply:hover {
    color: var(--text-bright);
    background: rgba(255,255,255,0.05);
  }

  .move-ply.active {
    color: var(--accent);
    font-weight: 700;
    text-shadow: 0 0 10px rgba(88, 166, 255, 0.3);
  }

  /* Controls - Deprioritized */
  .controls-area {
    padding: 20px 28px;
    background: rgba(0,0,0,0.1);
    border-top: 1px solid var(--bg-panel-border);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  button {
    background: rgba(255,255,255,0.05);
    border: 1px solid transparent;
    color: var(--text-muted);
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  button:hover {
    background: rgba(255,255,255,0.1);
    color: var(--text-bright);
  }
  
  button:active {
    transform: translateY(1px);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #58a6ff; }

  /* Mobile Responsive */
  @media (max-width: 1000px) {
    .app-container { flex-direction: column; height: auto; overflow-y: auto; padding: 20px 0; }
    .board-area { width: 100%; max-width: 600px; }
    .board { width: 100%; height: 100%; aspect-ratio: 1/1; }
    .sidebar { width: 100%; max-width: 600px; min-height: auto; }
    .move-history-container { min-height: 250px; }
  }
</style>
</head>

<div class="app-container">

        <span>White</span>

      </div>
      <div class="move-list" id="move-list">

    </div>

  </div>
</div>

      for (let c = 0; c < 8; c++) {
        const square = document.createElement('div');
        // Checkers pattern: (r+c)%2==0 is light
        square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
        square.dataset.r = r;
        square.dataset.c = c;
        
        // Highlight if selected
        if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
          square.classList.add('selected');
        }

        const pieceCode = boardState[r][c];
        if (pieceCode) {
          const color = pieceCode[0];
          const type = pieceCode[1];
          const pieceEl = document.createElement('div');
          pieceEl.className = `piece ${color === 'w' ? 'white' : 'black'}`;
          pieceEl.innerHTML = pieces[color][type];
          
          // Click Interaction
          pieceEl.onclick = (e) => {
            e.stopPropagation();
            handlePieceClick(r, c, color, type);
          };
          
          square.appendChild(pieceEl);
        }
        
        // Click empty square (to deselect or move)
        square.onclick = () => {
          if(selectedSquare) {
             // Logic to move piece to empty square would go here
             // For this demo, clicking empty square deselects
             selectedSquare = null;
             initBoard();
          }
        };
        
        boardEl.appendChild(square);
      }
    }

    // Render Coordinates
    const fileLabels = document.getElementById('file-labels');
    const rankLabels = document.getElementById('rank-labels');
    fileLabels.innerHTML = '';
    rankLabels.innerHTML = '';
    
    files.forEach(f => {
      const span = document.createElement('span');
      span.innerText = f;
      fileLabels.appendChild(span);
    });
    for(let i=8; i>0; i--) {
      const span = document.createElement('span');
      span.innerText = i;
      rankLabels.appendChild(span);
    }
  }

  function renderHistory() {
    moveList.innerHTML = '';
    mockHistory.forEach(move => {
      const row = document.createElement('div');
      row.className = 'move-row';
      row.innerHTML = `
        <div class="move-num">${move.num}.</div>
        <div class="move-ply">${move.w}</div>
        <div class="move-ply">${move.b}</div>
      `;
      moveList.appendChild(row);
    });
  }

  // --- Logic ---
  function handlePieceClick(r, c, color, type) {
    // If clicking own piece, select it
    if (color === turn) {
      selectedSquare = {r, c};
      initBoard(); // Re-render to show highlight
      return;
    }

    // If clicking opponent piece and we have a selection, simulate capture
    if (selectedSquare) {
      executeMove(selectedSquare.r, selectedSquare.c, r, c);
    }
  }

  function executeMove(fromR, fromC, toR, toC) {
    const pieceCode = boardState[fromR][fromC];
    const targetCode = boardState[toR][toC];
    
    // Update State
    boardState[toR][toC] = pieceCode;
    boardState[fromR][fromC] = '';
    
    // Generate notation (Simplified)
    const pieceName = (pieceCode[1] === 'p') ? '' : pieceCode[1].toUpperCase();
    const capture = targetCode ? 'x' : '';
    const notation = `${pieceName}${capture}${String.fromCharCode(97+toC)}${8-toR}`;
    
    addMoveToHistory(notation);
    
    // Switch Turn
    turn = turn === 'w' ? 'b' : 'w';
    selectedSquare = null;
    updateStatus();
    initBoard(); // Re-render
  }

  function addMoveToHistory(notation) {
    // Remove empty state if it exists (though we use mock data now)
    const emptyState = document.getElementById('empty-state');
    if (emptyState) emptyState.style.display = 'none';

    // Add to mock history array for this demo
    mockHistory.push({
      num: moveCount,
      w: (turn === 'b') ? notation : '',
      b: (turn === 'w') ? notation : ''
    });
    
    // Re-render history list
    renderHistory();
    
    // Scroll to bottom
    moveList.scrollTop = moveList.scrollHeight;
    
    // Highlight last move
    const lastRow = moveList.lastElementChild;
    if(lastRow) {
      lastRow.classList.add('active-move');
      const ply = (turn === 'b') ? lastRow.querySelector('.move-ply:last-child') : lastRow.querySelector('.move-ply:first-child');
      if(ply) ply.classList.add('active');
    }
    
    if(turn === 'w') moveCount++;
  }

  function updateStatus() {
    statusText.innerText = turn === 'w' ? "White to move" : "Black to move";
    if (turn === 'b') {
      turnDot.classList.add('black-turn');
    } else {
      turnDot.classList.remove('black-turn');
    }
  }

  function resetGame() {
    // Reload to reset state cleanly for this demo
    location.reload();
  }

  // Start
  initBoard();
  renderHistory(); // Render mock history

</script>
