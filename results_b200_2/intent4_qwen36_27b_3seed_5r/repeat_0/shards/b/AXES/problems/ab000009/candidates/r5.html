<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grandmaster Chess Interface</title>
<style>
  :root {
    /* Palette: "Tactile Luxury" - Warm Cream & Deep Charcoal */
    --bg-app: #121212;
    --bg-panel: #1e1e1e;
    --bg-panel-border: #333333;
    
    /* Board Colors: High Contrast Monochrome/Warm */
    --board-light: #eeeed2; 
    --board-dark: #769656; /* Classic Green */
    
    /* Highlights */
    --highlight-selected: rgba(255, 255, 0, 0.4); 
    --highlight-last: rgba(255, 255, 50, 0.2);
    --highlight-move: rgba(0, 0, 0, 0.1);
    
    /* Text */
    --text-main: #e0e0e0;
    --text-muted: #888888;
    --text-bright: #ffffff;
    
    /* Accents */
    --accent: #f0c040; /* Muted Gold */
    
    /* Fonts */
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Roboto Mono", "Courier New", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

  body {
    background-color: var(--bg-app);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    user-select: none;
    /* Subtle texture for background */
    background-image: radial-gradient(circle at 50% 50%, #222 0%, #111 100%);
  }

  /* Layout Container */
  .app-container {
    display: flex;
    gap: 32px; /* Better spacing */
    height: 90vh;
    width: 92vw;
    max-width: 1300px;
    align-items: stretch;
  }

  /* --- Board Section --- */
  .board-area {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 24px; /* Increased padding for coordinates */
    background: var(--bg-panel);
    border-radius: 8px;
    /* Refined shadow for depth */
    box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.8);
    border: 1px solid var(--bg-panel-border);
  }

  /* Coordinate Labels - Aligned & Clean */
  .coords {
    position: absolute;
    display: flex;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    pointer-events: none;
    z-index: 5;
    opacity: 0.8;
  }
  
  .coords-files {
    bottom: 8px;
    left: 24px;
    right: 24px;
    justify-content: space-around;
    text-transform: uppercase;
  }
  
  .coords-ranks {
    top: 24px;
    bottom: 24px;
    left: 8px;
    flex-direction: column;
    justify-content: space-around;
    text-align: center;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: min(80vh, 700px);
    height: min(80vh, 700px);
    /* Frame border */
    border: 6px solid #2a2a2a;
    border-radius: 4px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
  }

  .square {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Board Colors - Refined */
  .square.light { background-color: var(--board-light); }
  .square.dark { background-color: var(--board-dark); }
  
  /* Highlights */
  .square.last-move { background-color: var(--highlight-last) !important; }
  .square.selected { background-color: var(--highlight-selected) !important; }
  
  /* Move indicator dot */
  .move-dot {
    width: 25%;
    height: 25%;
    background-color: rgba(0,0,0,0.2);
    border-radius: 50%;
    pointer-events: none;
  }
  .square.dark .move-dot { background-color: rgba(0,0,0,0.3); }

  /* Pieces - Unified SVG Style, No heavy drop shadows */
  .piece {
    width: 90%;
    height: 90%;
    cursor: pointer;
    transition: transform 0.15s ease;
    z-index: 2;
    /* Removed heavy drop shadow for cleaner look */
  }
  
  .piece:hover {
    transform: translateY(-4px);
  }
  
  .piece svg {
    width: 100%;
    height: 100%;
    display: block;
    /* Filter to ensure SVGs render crisply */
    shape-rendering: geometricPrecision;
  }

  /* --- Side Panel --- */
  .sidebar {
    flex: 1;
    background: var(--bg-panel);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--bg-panel-border);
    box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.6);
    overflow: hidden;
    min-width: 340px;
  }

  /* Header - Clear Hierarchy */
  .panel-header {
    padding: 28px 32px;
    background: linear-gradient(to bottom, #252525, #1e1e1e);
    border-bottom: 1px solid var(--bg-panel-border);
  }

  .game-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 20px;
    font-weight: 700;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  /* Active Turn Indicator - High Contrast */
  .turn-indicator {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid #333;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.1);
    transition: all 0.3s ease;
  }
  
  .turn-indicator.black-turn {
    background: #111;
    border-color: #555;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.5);
  }

  .status-text {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-bright);
    letter-spacing: -0.5px;
  }

  /* Move History - Clean Table */
  .move-history-container {
    flex: 1;
    margin: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-panel);
  }

  .move-table-header {
    display: grid;
    grid-template-columns: 50px 1fr 1fr;
    padding: 16px 32px;
    background: rgba(0,0,0,0.2);
    border-bottom: 1px solid var(--bg-panel-border);
    border-top: 1px solid var(--bg-panel-border);
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .move-list {
    flex: 1;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 16px;
    padding: 0;
  }

  .move-row {
    display: grid;
    grid-template-columns: 50px 1fr 1fr;
    padding: 12px 32px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    color: var(--text-main);
    transition: background 0.1s;
  }

  .move-row:nth-child(even) {
    background-color: rgba(255,255,255,0.02);
  }
  
  /* Active move highlighting */
  .move-row.active-move {
    background-color: rgba(240, 192, 64, 0.1); /* Gold tint */
  }

  .move-num {
    color: var(--text-muted);
    font-size: 14px;
    opacity: 0.7;
    font-family: var(--font-ui);
    padding-top: 2px;
  }

  .move-ply {
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 500;
  }
  
  .move-ply:hover {
    color: var(--text-bright);
    background: rgba(255,255,255,0.08);
  }

  .move-ply.active {
    color: var(--accent);
    font-weight: 700;
    background: rgba(240, 192, 64, 0.15);
  }

  /* Controls - Distinct Actions */
  .controls-area {
    padding: 24px 32px;
    background: rgba(0,0,0,0.1);
    border-top: 1px solid var(--bg-panel-border);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  button {
    background: #2a2a2a;
    border: 1px solid #444;
    color: var(--text-main);
    padding: 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s ease;
    text-transform: none;
    letter-spacing: 0.2px;
  }

  button:hover {
    background: #333;
    color: var(--text-bright);
    border-color: #666;
  }
  
  button.primary {
    background: var(--accent);
    color: #111;
    border-color: var(--accent);
  }
  
  button.primary:hover {
    background: #ffd666;
    border-color: #ffd666;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #666; }

  /* Mobile Responsive */
  @media (max-width: 1000px) {
    .app-container { flex-direction: column; height: auto; overflow-y: auto; padding: 20px 0; }
    .board-area { width: 100%; max-width: 600px; }
    .board { width: 100%; height: 100%; aspect-ratio: 1/1; }
    .sidebar { width: 100%; max-width: 600px; min-height: auto; }
    .move-history-container { min-height: 300px; }
  }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- Board Section -->

  </div>

        <div class="turn-indicator" id="turn-dot"></div>
        <span class="status-text" id="status-text">White to move</span>
      </div>
    </div>

    <!-- Structured Move History Table -->
    <div class="move-history-container">
      <div class="move-table-header">
        <span>#</span>
        <span>White</span>
        <span>Black</span>
      </div>
      <div class="move-list" id="move-list">
        <!-- Starts Empty per critique -->
      </div>
    </div>

    <div class="controls-area">
      <!-- Distinct Primary Action -->
      <div class="btn-row">
        <button class="primary" onclick="resetGame()">New Game</button>
        <button onclick="flipBoard()">Flip Board</button>
      </div>
    </div>

  </div>
</div>

    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

      for (let c = 0; c < 8; c++) {
        let visualC = isFlipped ? 7 - c : c;
        
        const square = document.createElement('div');
        // Checkers pattern: (r+c)%2==0 is light
        square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
        square.dataset.r = r;
        square.dataset.c = c;
        
        // Highlight if selected
        if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
          square.classList.add('selected');
        }

        // Highlight last move
        if (moveHistory.length > 0) {
          const lastMove = moveHistory[moveHistory.length - 1];
          if ((lastMove.fromR === r && lastMove.fromC === c) || 
              (lastMove.toR === r && lastMove.toC === c)) {
            square.classList.add('last-move');
          }
        }

        const pieceCode = boardState[r][c];
        if (pieceCode) {
          const color = pieceCode[0];
          const type = pieceCode[1];
          const pieceEl = document.createElement('div');
          pieceEl.className = `piece ${color === 'w' ? 'white' : 'black'}`;
          pieceEl.innerHTML = pieces[color][type];
          
          // Click Interaction
          pieceEl.onclick = (e) => {
            e.stopPropagation();
            handlePieceClick(r, c, color, type);
          };
          
          square.appendChild(pieceEl);
        }
        
        // Click empty square
        square.onclick = () => {
          if(selectedSquare) {
             // Attempt move
             executeMove(selectedSquare.r, selectedSquare.c, r, c);
          }
        };
        
        boardEl.appendChild(square);
      }
    }

    // Render Coordinates
    const fileLabels = document.getElementById('file-labels');
    const rankLabels = document.getElementById('rank-labels');
    fileLabels.innerHTML = '';
    rankLabels.innerHTML = '';
    
    const displayFiles = isFlipped ? [...files].reverse() : files;
    displayFiles.forEach(f => {
      const span = document.createElement('span');
      span.innerText = f;
      fileLabels.appendChild(span);
    });
    
    const displayRanks = isFlipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
    displayRanks.forEach(i => {
      const span = document.createElement('span');
      span.innerText = i;
      rankLabels.appendChild(span);
    });
  }

  function renderHistory() {
    moveList.innerHTML = '';
    if (moveHistory.length === 0) return;

    moveHistory.forEach((move, index) => {
      // Move history is stored flat: [move1w, move1b, move2w...]
      // We need to group them into rows
      if (index % 2 !== 0) return; // Skip black moves as they are part of the row

      const wMove = moveHistory[index];
      const bMove = moveHistory[index + 1];
      const moveNum = Math.floor(index / 2) + 1;

      const row = document.createElement('div');
      row.className = 'move-row';
      
      // Check if this is the last active move
      const isLast = (index === moveHistory.length - 1 || index + 1 === moveHistory.length - 1);
      if (isLast) row.classList.add('active-move');

      row.innerHTML = `
        <div class="move-num">${moveNum}.</div>
        <div class="move-ply ${index === moveHistory.length - 1 ? 'active' : ''}">${wMove ? wMove.notation : ''}</div>
        <div class="move-ply ${index + 1 === moveHistory.length - 1 ? 'active' : ''}">${bMove ? bMove.notation : ''}</div>
      `;
      moveList.appendChild(row);
    });
    
    // Scroll to bottom
    moveList.scrollTop = moveList.scrollHeight;
  }

  // --- Logic ---
  function handlePieceClick(r, c, color, type) {
    // If clicking own piece, select it
    if (color === turn) {
      selectedSquare = {r, c};
      initBoard(); // Re-render to show highlight
      return;
    }

    // If clicking opponent piece and we have a selection, simulate capture
    if (selectedSquare) {
      executeMove(selectedSquare.r, selectedSquare.c, r, c);
    }
  }

  function executeMove(fromR, fromC, toR, toC) {
    const pieceCode = boardState[fromR][fromC];
    const targetCode = boardState[toR][toC];
    
    // Update State
    boardState[toR][toC] = pieceCode;
    boardState[fromR][fromC] = '';
    
    // Generate notation (Simplified)
    const pieceName = (pieceCode[1] === 'p') ? '' : pieceCode[1].toUpperCase();
    const capture = targetCode ? 'x' : '';
    const notation = `${pieceName}${capture}${String.fromCharCode(97+toC)}${8-toR}`;
    
    addMoveToHistory(notation, fromR, fromC, toR, toC);
    
    // Switch Turn
    turn = turn === 'w' ? 'b' : 'w';
    selectedSquare = null;
    updateStatus();
    initBoard(); // Re-render
    renderHistory(); // Re-render history
  }

  function addMoveToHistory(notation, fromR, fromC, toR, toC) {
    moveHistory.push({
      notation: notation,
      fromR, fromC, toR, toC
    });
  }

  function updateStatus() {
    statusText.innerText = turn === 'w' ? "White to move" : "Black to move";
    if (turn === 'b') {
      turnDot.classList.add('black-turn');
    } else {
      turnDot.classList.remove('black-turn');
    }
  }

  function resetGame() {
    location.reload();
  }
  
  function flipBoard() {
    isFlipped = !isFlipped;
    initBoard();
  }

  // Start
  initBoard();
  updateStatus();

</script>
</body>
</html>
