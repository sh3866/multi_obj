<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spherical Game of Life</title>
    <style>
        :root {
            --bg-color: #050507;
            --panel-bg: rgba(20, 20, 25, 0.6);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.4);
            --text-primary: #ffffff;
            --text-secondary: #8b9bb4;
            --font-stack: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-stack);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Background Ambient Glow */
        .ambient-glow {
            position: absolute;
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle at center, rgba(0, 50, 80, 0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 340px;
            width: 100%;
            height: 100%;
        }

        /* Canvas Area */
        .canvas-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            display: block;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        /* Control Panel */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid var(--panel-border);
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            height: 100%;
            overflow-y: auto;
            box-shadow: -10px 0 40px rgba(0,0,0,0.3);
        }

        /* Typography */
        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #b4b4b4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            font-weight: 400;
        }

        /* Controls */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        /* Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-primary);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-stack);
        }

        button:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }

        button.primary {
            background: var(--accent);
            color: #000;
            border: none;
            font-weight: 700;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        button.primary:hover {
            background: #33f5ff;
            transform: translateY(-1px);
            box-shadow: 0 0 25px var(--accent-glow);
        }

        /* Stats */
        .stats {
            margin-top: auto;
            padding-top: 24px;
            border-top: 1px solid var(--panel-border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-val {
            font-size: 20px;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .panel {
                height: auto;
                max-height: 40vh;
                border-left: none;
                border-top: 1px solid var(--panel-border);
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="container">
        <div class="canvas-wrapper" id="canvasContainer">
            <canvas id="lifeCanvas"></canvas>
        </div>

        <div class="panel">
            <div>
                <h1>Sphere Life</h1>
                <p class="subtitle">A cellular automaton simulation projected onto a 3D spherical manifold. Drag to rotate.</p>
            </div>

            <div class="control-group">
                <div class="label-row">
                    <span>Simulation Speed</span>
                    <span id="speedVal">60%</span>
                </div>
                <input type="range" id="speedSlider" min="0" max="20" value="10">
                
                <div class="label-row" style="margin-top: 12px;">
                    <span>Cell Density</span>
                    <span id="densityVal">High</span>
                </div>
                <input type="range" id="densitySlider" min="10" max="40" value="20">
            </div>

            <div class="control-group">
                <div class="label-row">
                    <span>Actions</span>
                </div>
                <div class="btn-group">
                    <button class="primary" id="toggleBtn">Pause</button>
                    <button id="resetBtn">Randomize</button>
                </div>
                <button id="clearBtn" style="width: 100%; margin-top: 12px; color: #ff6b6b; border-color: rgba(255,107,107,0.2);">Clear All</button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-val" id="genCount">0</span>
                    <span class="stat-label">Generations</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" id="popCount">0</span>
                    <span class="stat-label">Population</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Configuration & State
         */
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on base
        
        let width, height;
        let centerX, centerY;
        let radius;

        // Simulation Parameters
        const CONFIG = {
            sphereRadius: 250,
            gridResolution: 20, // Higher = more cells, lower performance
            speed: 10, // frames per step (lower is faster)
            baseHue: 180,
            evolutionRate: 0.02
        };

        // State
        let isRunning = true;
        let frameCount = 0;
        let generation = 0;
        let population = 0;
        
        // Grid Data
        let grid = [];
        let nextGrid = [];
        let cellColors = []; // Store hue offsets for each cell
        let cols, rows;

        // Interaction State
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let rotationX = 0.5; // Initial tilt
        let rotationY = 0;
        let targetRotationX = 0.5;
        let targetRotationY = 0;
        let autoRotateY = 0;

        /**
         * Initialization
         */
        function init() {
            resize();
            createGrid();
            randomizeGrid();
            window.addEventListener('resize', resize);
            
            // Mouse Interaction
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mousemove', handleMouseMove);
            
            // Touch Interaction
            canvas.addEventListener('touchstart', (e) => {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, {passive: false});
            window.addEventListener('touchend', () => isDragging = false);
            window.addEventListener('touchmove', (e) => {
                if(isDragging) {
                    const dx = e.touches[0].clientX - lastMouseX;
                    const dy = e.touches[0].clientY - lastMouseY;
                    targetRotationY += dx * 0.005;
                    targetRotationX += dy * 0.005;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            }, {passive: false});

            // UI Bindings
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                CONFIG.speed = 21 - e.target.value; // Invert so right is faster
                document.getElementById('speedVal').innerText = Math.round((e.target.value/20)*100) + '%';
            });
            
            document.getElementById('densitySlider').addEventListener('input', (e) => {
                const val = e.target.value;
                CONFIG.gridResolution = parseInt(val);
                document.getElementById('densityVal').innerText = val < 20 ? "High" : (val < 35 ? "Med" : "Low");
                createGrid();
                randomizeGrid();
            });

            document.getElementById('toggleBtn').addEventListener('click', () => {
                isRunning = !isRunning;
                document.getElementById('toggleBtn').innerText = isRunning ? "Pause" : "Resume";
                document.getElementById('toggleBtn').classList.toggle('primary');
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                randomizeGrid();
                generation = 0;
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                grid = grid.map(row => row.fill(0));
                cellColors = cellColors.map(row => row.fill(0));
                generation = 0;
            });

            loop();
        }

        function resize() {
            const container = document.getElementById('canvasContainer');
            width = container.clientWidth;
            height = container.clientHeight;
            
            // HiDPI scaling
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            // CSS size
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            centerX = width / 2;
            centerY = height / 2;
            radius = Math.min(width, height) * 0.35;
            CONFIG.sphereRadius = radius;
        }

        function createGrid() {
            // Create a spherical grid (Latitude/Longitude)
            // We map this to a 2D array where cols = longitude, rows = latitude
            rows = CONFIG.gridResolution;
            cols = CONFIG.gridResolution * 2; // Sphere is roughly 2:1 aspect ratio in UV map
            
            grid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            nextGrid = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
            cellColors = new Array(rows).fill(0).map(() => new Array(cols).fill(0));
        }

        function randomizeGrid() {
            population = 0;
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    // Random initialization
                    grid[y][x] = Math.random() > 0.5 ? 1 : 0;
                    // Initial random hue shift
                    cellColors[y][x] = Math.random() * 60 - 30; 
                    if (grid[y][x]) population++;
                }
            }
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            
            targetRotationY += dx * 0.005;
            targetRotationX += dy * 0.005;
            
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }

        /**
         * Simulation Logic
         */
        function update() {
            population = 0;
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const neighbors = countNeighbors(x, y);
                    const state = grid[y][x];
                    
                    // Standard Conway Rules
                    if (state === 0 && neighbors === 3) {
                        nextGrid[y][x] = 1;
                        // Newborn gets a hot color
                        cellColors[y][x] = 0; 
                    } else if (state === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[y][x] = 0;
                    } else {
                        nextGrid[y][x] = state;
                        // Living cells age (hue shift)
                        if (state === 1) cellColors[y][x] += CONFIG.evolutionRate;
                    }

                    if (nextGrid[y][x] === 1) population++;
                }
            }

            // Swap grids
            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            
            // Update Stats
            document.getElementById('genCount').innerText = generation;
            document.getElementById('popCount').innerText = population;
        }

        function countNeighbors(x, y) {
            let sum = 0;
            // Handle wrapping (toroidal)
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    
                    let col = (x + i + cols) % cols;
                    let row = (y + j + rows) % rows;
                    
                    sum += grid[row][col];
                }
            }
            return sum;
        }

        /**
         * Rendering
         */
        function draw() {
            // Clear background
            ctx.fillStyle = '#050507';
            ctx.fillRect(0, 0, width, height);

            // Smooth rotation
            if (!isDragging) {
                targetRotationY += 0.002; // Auto spin
            }
            rotationX += (targetRotationX - rotationX) * 0.1;
            rotationY += (targetRotationY - rotationY) * 0.1;

            // Draw Sphere Base (Subtle glow/outline)
            const gradient = ctx.createRadialGradient(centerX, centerY, radius * 0.8, centerX, centerY, radius * 1.1);
            gradient.addColorStop(0, 'rgba(0, 242, 255, 0.05)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 1.2, 0, Math.PI * 2);
            ctx.fill();

            // Draw Grid Cells
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (grid[y][x] === 1) {
                        drawCell(x, y);
                    }
                }
            }
        }

        function drawCell(col, row) {
            // Map grid coordinates to Sphere Surface
            // u (0..1) -> Longitude (-PI to PI)
            // v (0..1) -> Latitude (-PI/2 to PI/2)
            
            const u = col / cols;
            const v = row / rows;

            const theta = u * 2 * Math.PI;
            const phi = (v * Math.PI) - (Math.PI / 2);

            // 3D Coordinates on Sphere (Radius R)
            let px = radius * Math.cos(phi) * Math.cos(theta);
            let py = radius * Math.sin(phi);
            let pz = radius * Math.cos(phi) * Math.sin(theta);

            // Apply Rotation (Y axis then X axis)
            // Rotate Y
            let x1 = px * Math.cos(rotationY) - pz * Math.sin(rotationY);
            let z1 = px * Math.sin(rotationY) + pz * Math.cos(rotationY);
            // Rotate X
            let y2 = py * Math.cos(rotationX) - z1 * Math.sin(rotationX);
            let z2 = py * Math.sin(rotationX) + z1 * Math.cos(rotationX);

            // Perspective Projection
            const fov = 800;
            const scale = fov / (fov + z2);
            
            // Don't draw if behind the sphere
            if (scale < 0) return;

            const screenX = centerX + x1 * scale;
            const screenY = centerY + y2 * scale;

            // Calculate size based on perspective and grid density
            // The cell size needs to cover the gap between projected points
            // Simplified: fixed size scaled by perspective
            const cellSize = (radius * 0.05) * scale; 

            // Color Logic
            // Base cyan/blue, shift based on age (cellColors)
            const hue = (CONFIG.baseHue + cellColors[row][col] * 10) % 360;
            // Brightness based on Z-depth (front is brighter)
            const brightness = 0.5 + (0.5 * ((-z2 + radius) / (2 * radius)));
            const lightness = 50 + (brightness * 20);
            const alpha = Math.min(1, brightness * 1.5); // Fade out back cells

            ctx.fillStyle = `hsla(${hue}, 100%, ${lightness}%, ${alpha})`;
            
            // Add glow to front cells
            if (z2 < -radius * 0.5) {
                ctx.shadowBlur = 10 * scale;
                ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.8)`;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.beginPath();
            // Draw circle
            ctx.arc(screenX, screenY, cellSize, 0, Math.PI * 2);
            ctx.fill();
            
            // Reset shadow
            ctx.shadowBlur = 0;
        }

        function loop() {
            if (isRunning) {
                // Run simulation steps based on speed slider
                // If speed is 20 (slow), we update every 20 frames
                // If speed is 1 (fast), we update every frame
                if (frameCount % Math.max(1, Math.floor(CONFIG.speed)) === 0) {
                    update();
                }
            }
            
            draw();
            frameCount++;
            requestAnimationFrame(loop);
        }

        // Start
        init();

    </script>
</body>
</html>
