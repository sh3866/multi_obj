<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --c-bg: #050011;
            --c-grid: #ff00ff;
            --c-grid-dim: #4a004a;
            --c-primary: #ff00ff; /* Magenta */
            --c-secondary: #00ffff; /* Cyan */
            --c-accent: #ffff00; /* Yellow */
            --c-hit: #ffffff;
            --c-void: #000000;
            
            /* Typography */
            --font-pixel: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--c-bg);
            color: white;
            font-family: var(--font-pixel);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Hardware acceleration for smoother canvas */
            perspective: 1000px;
        }

        /* --- BACKGROUND CANVAS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- CRT OVERLAY --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        /* --- MAIN STAGE --- */
        /* This container centers the content and handles the perspective tilt */
        .main-stage {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        /* --- TITLE --- */
        .title-container {
            position: relative;
            text-align: center;
            margin-bottom: 2rem;
            z-index: 20;
            /* Floating effect */
            animation: float 4s ease-in-out infinite;
        }

        h1 {
            font-size: 5.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -4px;
            color: white;
            line-height: 0.9;
            /* Sharp retro shadow */
            text-shadow: 
                4px 4px 0px var(--c-primary),
                8px 8px 0px var(--c-secondary);
        }

        h1 .sub {
            display: block;
            font-size: 1.5rem;
            letter-spacing: 12px;
            color: var(--c-accent);
            margin-top: 10px;
            text-shadow: 0 0 10px var(--c-accent);
        }

        /* --- HIGHWAY CONTAINER --- */
        /* This acts as the "Game Preview" window */
        .highway-wrapper {
            position: relative;
            width: 400px;
            height: 250px;
            perspective: 600px;
            margin-bottom: 3rem;
            transform-style: preserve-3d;
        }

        /* The actual game board, rotated in 3D space */
        .highway-board {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            /* Glassy border */
            border: 2px solid var(--c-secondary);
            box-shadow: 
                0 0 15px var(--c-secondary),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
            /* The 3D tilt */
            transform: rotateX(45deg) rotateZ(0deg);
            transform-origin: center bottom;
            overflow: hidden;
            display: flex;
        }

        /* --- LANES --- */
        .lane {
            flex: 1;
            border-right: 1px solid rgba(0, 255, 255, 0.2);
            position: relative;
            background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,255,255,0.05));
        }
        .lane:last-child { border-right: none; }

        /* --- HIT LINE --- */
        /* Placed at the bottom of the board */
        .hit-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--c-hit);
            box-shadow: 0 0 8px 2px var(--c-hit);
            z-index: 10;
        }

        /* --- NOTES --- */
        .note {
            position: absolute;
            width: 80%;
            height: 24px;
            left: 10%;
            /* Pixelated edges */
            border: 2px solid white; 
            box-shadow: 0 0 5px currentColor;
            /* Start off-screen top */
            top: -30px; 
        }

        /* --- CONTROLS --- */
        .controls {
            display: flex;
            gap: 2rem;
            z-index: 20;
        }

        .btn {
            background: transparent;
            border: none;
            font-family: var(--font-pixel);
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s;
            /* Equal dimensions */
            width: 200px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* START BUTTON - High Contrast Yellow */
        .btn-start {
            color: var(--c-void);
            background: var(--c-accent);
            border: 2px solid var(--c-accent);
            box-shadow: 4px 4px 0px var(--c-primary);
        }

        .btn-start:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--c-primary);
            background: #fff;
        }

        .btn-start:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--c-primary);
        }

        /* OPTIONS BUTTON - Outlined Cyan */
        .btn-options {
            color: var(--c-secondary);
            border: 2px solid var(--c-secondary);
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 4px 4px 0px var(--c-primary);
        }

        .btn-options:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--c-primary);
            background: rgba(0, 255, 255, 0.3);
        }
        
        .btn-options:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--c-primary);
        }

        /* --- ANIMATIONS --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .highway-wrapper { width: 300px; height: 200px; }
            .btn { width: 140px; font-size: 1.2rem; height: 50px; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div class="scanlines"></div>

    <div class="main-stage">
        <div class="title-container">
            <h1>PIXEL<br>DANCE</h1>
            <span class="sub">RHYTHM EDITION</span>
        </div>

        <div class="highway-wrapper">
            <div class="highway-board" id="highway">
                <div class="lane" id="l1"></div>
                <div class="lane" id="l2"></div>
                <div class="lane" id="l3"></div>
                <div class="lane" id="l4"></div>
                <div class="hit-line"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-start" onclick="startGame()">START GAME</button>
            <button class="btn btn-options">OPTIONS</button>
        </div>
    </div>

    <script>
        /**
         * VISUAL ENGINE
         * 1. Draws Synthwave Sun/Grid Background
         * 2. Manages falling notes in the CSS 3D Highway
         */

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // State
        let time = 0;

        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Colors
        const COL_BG_TOP = '#050011';
        const COL_SUN_TOP = '#ff00ff';
        const COL_SUN_BOT = '#ffff00';
        const COL_GRID = '#ff00ff';

        function drawBackground() {
            // Clear
            ctx.fillStyle = COL_BG_TOP;
            ctx.fillRect(0, 0, width, height);

            // Gradient Sky
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, COL_BG_TOP);
            grad.addColorStop(0.5, '#1a0033');
            grad.addColorStop(1, '#330055');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Draw Sun
            const cx = width / 2;
            const cy = height * 0.35;
            const r = Math.min(width, height) * 0.2;

            const sunGrad = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
            sunGrad.addColorStop(0, COL_SUN_TOP);
            sunGrad.addColorStop(1, COL_SUN_BOT);

            ctx.save();
            ctx.translate(cx, cy);
            
            // Glow
            ctx.shadowBlur = 50;
            ctx.shadowColor = COL_SUN_TOP;
            
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = sunGrad;
            ctx.fill();
            
            // Cutout stripes (The classic Synthwave look)
            ctx.globalCompositeOperation = 'destination-out';
            // Move stripes down slowly
            const offset = (time * 0.5) % (r * 2);
            for(let i=0; i<15; i++) {
                let y = (i * (r/5)) - r + offset;
                // Variable height for stripes
                let h = (i * 1.5) + 2; 
                ctx.fillRect(-r, y + r*0.3, r*2, h);
            }
            ctx.restore();

            // Draw Stars
            ctx.fillStyle = 'white';
            ctx.shadowBlur = 0;
            for(let i=0; i<60; i++) {
                const sx = (Math.sin(i * 123.45) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 67.89) * 0.5 + 0.5) * (height * 0.5); // Keep stars in top half
                const size = (i % 3 === 0) ? 2 : 1;
                const alpha = Math.abs(Math.sin(time * 0.02 + i));
                ctx.globalAlpha = alpha;
                ctx.fillRect(sx, sy, size, size);
            }
            ctx.globalAlpha = 1.0;

            // Draw Perspective Grid
            const horizonY = height * 0.5;
            const vanishX = width / 2;
            
            // Grid movement speed
            const gridSpeed = (time * 3) % 40; 

            ctx.strokeStyle = COL_GRID;
            ctx.lineWidth = 2;
            // Glow for grid lines
            ctx.shadowBlur = 15;
            ctx.shadowColor = COL_GRID;
            
            ctx.beginPath();

            // Vertical lines (Perspective)
            for (let i = -12; i <= 12; i++) {
                // Fan out from center
                let x1 = vanishX + (i * 10); 
                let x2 = vanishX + (i * width * 0.25); 
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
            }

            // Horizontal lines (Moving towards camera)
            // Using simple perspective projection math
            for (let i = 0; i < 25; i++) {
                let z = i * 20 - gridSpeed; 
                if (z <= 0) continue;
                
                // Perspective projection: y = horizon + (scale / z)
                // We invert the math to move lines towards camera
                // y = horizon + (height * factor / (z + constant))
                
                // This formula creates non-linear spacing closer at horizon, wider at bottom
                let y = horizonY + (height * 0.6) * (1 - (10 / (z * 0.5 + 10)));
                
                if (y > horizonY && y < height) {
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                }
            }
            ctx.stroke();
        }

        // --- NOTE SPAWNER LOGIC ---
        const lanes = [
            document.getElementById('l1'),
            document.getElementById('l2'),
            document.getElementById('l3'),
            document.getElementById('l4')
        ];
        const colors = ['#ff00ff', '#00ffff', '#ffff00', '#ff00ff'];

        function spawnNote() {
            const laneIdx = Math.floor(Math.random() * 4);
            const lane = lanes[laneIdx];
            
            const note = document.createElement('div');
            note.className = 'note';
            note.style.backgroundColor = colors[laneIdx];
            note.style.color = colors[laneIdx];
            
            // Add to lane
            lane.appendChild(note);

            // Animation via JS for more control than CSS class toggling
            let topPos = -30;
            const speed = 6 + Math.random() * 2; // Random speed

            function animateNote() {
                topPos += speed;
                note.style.top = topPos + 'px';

                // Check bounds (height of highway-board is roughly 250px)
                if (topPos > 250) {
                    note.remove();
                } else {
                    requestAnimationFrame(animateNote);
                }
            }
            requestAnimationFrame(animateNote);
        }

        // --- MAIN LOOP ---
        function loop() {
            time++;
            drawBackground();
            
            // Random note spawning based on beat simulation
            // Spawns slightly more frequently
            if (Math.random() < 0.06) {
                spawnNote();
            }

            requestAnimationFrame(loop);
        }

        function startGame() {
            // Simple transition effect
            document.querySelector('.main-stage').style.transform = 'scale(1.1)';
            document.querySelector('.main-stage').style.opacity = '0';
            document.querySelector('.main-stage').style.transition = 'all 0.5s ease-in';
            setTimeout(() => {
                alert("GAME STARTING...");
                // Reset for demo purposes
                document.querySelector('.main-stage').style.transform = 'scale(1)';
                document.querySelector('.main-stage').style.opacity = '1';
            }, 500);
        }

        // Start
        loop();

    </script>
</body>
</html>
