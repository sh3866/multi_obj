<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        :root {
            --color-sky-top: #4A90E2;
            --color-sky-bot: #87CEEB;
            --color-snow: #E3F2FD;
            --color-snow-shadow: #90CAF9;
            --color-snow-highlight: #FFFFFF;
            --color-panel-bg: #1A237E; /* Deep Icy Navy */
            --color-panel-border: #64B5F6;
            --color-btn: #FFEB3B;
            --color-btn-shadow: #FBC02D;
            --font-pixel: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: var(--font-pixel);
        }

        /* Container for the game world */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* The Canvas World - Scaled for pixel look */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* Crucial for retro look */
            image-rendering: crisp-edges;
        }

        /* UI Layer - Floating Panel */
        .ui-panel {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 340px;
            padding: 24px;
            background-color: var(--color-panel-bg);
            border: 4px solid var(--color-panel-border);
            box-shadow: 
                0 0 0 4px #0D47A1, /* Outer thick border */
                8px 8px 0px rgba(0,0,0,0.4); /* Drop shadow */
            text-align: center;
            z-index: 10;
            color: #fff;
            animation: floatIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
        }

        /* Title Styling */
        h1 {
            margin: 0 0 16px 0;
            font-size: 3rem;
            line-height: 1;
            color: #fff;
            text-transform: uppercase;
            /* Pixel art style text shadow */
            text-shadow: 
                4px 4px 0 #0D47A1, 
                -2px -2px 0 #64B5F6;
            letter-spacing: -1px;
        }

        /* Instructions */
        .instructions {
            font-size: 0.85rem;
            line-height: 1.6;
            color: #90CAF9;
            margin-bottom: 24px;
            text-shadow: 1px 1px 0 #000;
        }

        .instructions kbd {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            padding: 2px 6px;
            color: #fff;
            font-family: inherit;
            font-weight: bold;
        }

        /* Start Button */
        .start-btn {
            background: var(--color-btn);
            color: #000;
            border: none;
            width: 100%;
            padding: 16px 0;
            font-size: 1.2rem;
            font-family: var(--font-pixel);
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            box-shadow: 
                inset -4px -4px 0px var(--color-btn-shadow),
                inset 4px 4px 0px #FFF176,
                4px 4px 0px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                inset -4px -4px 0px var(--color-btn-shadow),
                inset 4px 4px 0px #FFF176,
                6px 6px 0px rgba(0,0,0,0.5);
        }

        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 
                inset -4px -4px 0px var(--color-btn-shadow),
                inset 4px 4px 0px #FFF176,
                2px 2px 0px rgba(0,0,0,0.5);
        }

        /* CRT Overlay Effects */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
            opacity: 0.6;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 19;
        }

        @keyframes floatIn {
            from { transform: translateX(-50%) translateY(20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        /* Blinking cursor for effect */
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas for Procedural Graphics -->
        <canvas id="world"></canvas>
        
        <!-- UI Overlay -->
        <div class="ui-panel">
            <h1>SkiFree</h1>
            <div class="instructions">
                Use <kbd>←</kbd> <kbd>→</kbd> to steer.<br>
                Avoid trees. Survive the Yeti.
            </div>
            <button class="start-btn" id="startBtn">Start Game</button>
        </div>

        <!-- Post-processing effects -->
        <div class="vignette"></div>
        <div class="scanlines"></div>
    </div>

<script>
    /**
     * VISUAL ENGINE
     * Procedural Pixel Art Generator
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    // Internal Resolution (Low Res for Pixel Look)
    const GAME_WIDTH = 320;
    const GAME_HEIGHT = 240;

    // State
    let width, height;
    let frame = 0;
    let trees = [];
    let snowParticles = [];
    
    // Colors
    const C_SKY_TOP = '#4A90E2';
    const C_SKY_BOT = '#87CEEB';
    const C_SNOW = '#E3F2FD';
    const C_SNOW_DARK = '#90CAF9'; // Shadow blue
    const C_TREE_DARK = '#1B5E20';
    const C_TREE_LIGHT = '#2E7D32';
    const C_MOUNTAIN = '#78909C';

    // --- Drawing Functions (The Pixel Artist) ---

    function drawPixelSkier(x, y, scale, moving) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        // Palette
        const cSkin = '#FFCC80';
        const cHat = '#D32F2F';
        const cJacket = '#D32F2F';
        const cPants = '#1A237E';
        const cSkis = '#FBC02D';
        const cPoles = '#555555';
        const cShadow = 'rgba(0,0,0,0.2)';

        // Animation vars
        const bob = moving ? Math.sin(frame * 0.3) * 1 : 0;
        const lean = moving ? Math.sin(frame * 0.1) * 0.05 : 0;

        ctx.translate(0, bob);
        ctx.rotate(lean);

        // Shadow
        ctx.fillStyle = cShadow;
        ctx.fillRect(-8, 16, 16, 4);

        // Skis (Behind legs)
        ctx.fillStyle = cSkis;
        ctx.fillRect(-6, 12, 2, 10); // Left
        ctx.fillRect(4, 12, 2, 10);  // Right

        // Poles
        ctx.fillStyle = cPoles;
        ctx.fillRect(-7, 6, 1, 12);
        ctx.fillRect(6, 6, 1, 12);

        // Legs
        ctx.fillStyle = cPants;
        ctx.fillRect(-4, 8, 3, 5);
        ctx.fillRect(1, 8, 3, 5);

        // Body
        ctx.fillStyle = cJacket;
        ctx.fillRect(-4, 0, 8, 9);
        
        // Zipper detail
        ctx.fillStyle = '#B71C1C';
        ctx.fillRect(-1, 0, 2, 9);

        // Head
        ctx.fillStyle = cSkin;
        ctx.fillRect(-3, -4, 6, 5);
        
        // Goggles
        ctx.fillStyle = '#000';
        ctx.fillRect(-3, -2, 6, 2);
        ctx.fillStyle = '#FFF'; // Reflection
        ctx.fillRect(-1, -2, 2, 1);

        // Hat
        ctx.fillStyle = cHat;
        ctx.fillRect(-3, -5, 6, 2);

        ctx.restore();
    }

    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        const p = 1; // pixel unit

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(-6, 20, 12, 4);

        // Trunk
        ctx.fillStyle = '#4E342E';
        ctx.fillRect(-1, 14, 2, 6);

        // Leaves - Layered Triangles
        ctx.fillStyle = C_TREE_DARK;
        
        // Bottom Layer
        ctx.beginPath();
        ctx.moveTo(0, 2);
        ctx.lineTo(7, 14);
        ctx.lineTo(-7, 14);
        ctx.fill();

        // Middle Layer
        ctx.fillStyle = C_TREE_LIGHT; // Lighter for depth
        ctx.beginPath();
        ctx.moveTo(0, -2);
        ctx.lineTo(5, 8);
        ctx.lineTo(-5, 8);
        ctx.fill();

        // Top Layer
        ctx.fillStyle = C_TREE_DARK;
        ctx.beginPath();
        ctx.moveTo(0, -6);
        ctx.lineTo(3, 2);
        ctx.lineTo(-3, 2);
        ctx.fill();

        // Snow on branches
        ctx.fillStyle = '#FFF';
        ctx.fillRect(-3, 2, 6, 1);
        ctx.fillRect(-1, -2, 2, 1);

        ctx.restore();
    }

    function drawSnowflake(x, y, size) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.fillRect(Math.floor(x), Math.floor(y), size, size);
    }

    // --- World Generation ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        // Set internal resolution
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        
        // CSS handles the scaling up, pixelated property ensures crispness
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        
        // Generate Trees in a perspective grid
        // We want a "slope" effect. 
        // Y goes from top (horizon) to bottom (player).
        
        const horizonY = 60;
        const groundY = GAME_HEIGHT;
        
        // Create rows
        for(let i = 0; i < 15; i++) {
            // Exponential spacing for perspective
            let y = horizonY + Math.pow(i / 15, 1.5) * (groundY - horizonY);
            
            // Scale based on Y position (closer = bigger)
            let scale = 0.4 + (i / 15) * 1.5;
            
            // Random trees in this row
            // More trees in distance, fewer up close
            let density = Math.max(1, Math.floor(6 - i/2));
            
            for(let j=0; j<density; j++) {
                let x = Math.random() * GAME_WIDTH;
                trees.push({x, y, scale});
            }
        }
        
        // Sort by Y so far trees draw first
        trees.sort((a, b) => a.y - b.y);

        // Snow Particles
        snowParticles = [];
        for(let i=0; i<60; i++) {
            snowParticles.push({
                x: Math.random() * GAME_WIDTH,
                y: Math.random() * GAME_HEIGHT,
                speed: Math.random() * 1.5 + 0.5,
                size: Math.random() > 0.8 ? 2 : 1
            });
        }
    }

    function drawBackground() {
        // Sky
        let grad = ctx.createLinearGradient(0, 0, 0, 100);
        grad.addColorStop(0, C_SKY_TOP);
        grad.addColorStop(1, C_SKY_BOT);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // Mountains (Silhouettes)
        ctx.fillStyle = C_MOUNTAIN;
        ctx.beginPath();
        ctx.moveTo(0, 100);
        ctx.lineTo(60, 60);
        ctx.lineTo(120, 90);
        ctx.lineTo(180, 50);
        ctx.lineTo(240, 80);
        ctx.lineTo(320, 60);
        ctx.lineTo(320, 100);
        ctx.lineTo(0, 100);
        ctx.fill();
        
        // Snow caps on mountains
        ctx.fillStyle = '#CFD8DC';
        ctx.beginPath();
        ctx.moveTo(60, 60);
        ctx.lineTo(45, 75);
        ctx.lineTo(75, 75);
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(180, 50);
        ctx.lineTo(165, 65);
        ctx.lineTo(195, 65);
        ctx.fill();

        // Snow Ground
        ctx.fillStyle = C_SNOW;
        ctx.fillRect(0, 100, GAME_WIDTH, GAME_HEIGHT - 100);
        
        // Slope texture (random dots)
        ctx.fillStyle = C_SNOW_DARK;
        for(let i=0; i<100; i++) {
            let rx = Math.random() * GAME_WIDTH;
            let ry = 100 + Math.random() * (GAME_HEIGHT - 100);
            ctx.fillRect(rx, ry, 1, 1);
        }
    }

    function animate() {
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        drawBackground();

        // Draw Trees
        trees.forEach(tree => {
            // Parallax effect: Trees move slightly opposite to skier logic (simulated)
            // Here we just make them static for the title screen, or drift slightly
            drawTree(tree.x, tree.y, tree.scale);
        });

        // Draw Skier
        // Positioned at bottom center-ish
        const skierX = GAME_WIDTH / 2;
        const skierY = GAME_HEIGHT - 40;
        drawPixelSkier(skierX, skierY, 2, true); // Scale 2x, moving=true for bob

        // Draw Snow Particles (Foreground)
        snowParticles.forEach(p => {
            p.y += p.speed;
            p.x -= 0.5; // Wind
            if (p.y > GAME_HEIGHT) p.y = 0;
            if (p.x < 0) p.x = GAME_WIDTH;
            drawSnowflake(p.x, p.y, p.size);
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);
    
    // Button Interaction
    const btn = document.getElementById('startBtn');
    btn.addEventListener('click', function() {
        // Visual feedback only
        this.innerText = "LOADING...";
        this.style.transform = "translateY(2px)";
        this.style.boxShadow = "inset -4px -4px 0px var(--color-btn-shadow), inset 4px 4px 0px #FFF176, 2px 2px 0px rgba(0,0,0,0.5)";
        
        setTimeout(() => {
            alert("Game Start! (Demo Mode)");
            this.innerText = "START GAME";
            this.style.transform = "translateY(0)";
            this.style.boxShadow = "inset -4px -4px 0px var(--color-btn-shadow), inset 4px 4px 0px #FFF176, 4px 4px 0px rgba(0,0,0,0.5)";
        }, 400);
    });

    // Init
    resize();
    animate();

</script>
</body>
</html>
