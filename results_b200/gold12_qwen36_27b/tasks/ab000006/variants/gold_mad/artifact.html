<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        :root {
            --bg-sky: #74B9FF;
            --snow-base: #FFFFFF;
            --snow-shadow: #DFE6E9;
            --tree-dark: #006266;
            --tree-light: #00A896;
            --ui-bg: #001833; /* Icy Navy */
            --ui-border: #74B9FF;
            --ui-text: #FFFFFF;
            --ui-accent: #00CEC9;
            --font-pixel: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: var(--font-pixel);
        }

        /* CRT & Vignette Effects */
        .overlay-effects {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            background: 
                /* Scanlines */
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                /* Vignette */
                radial-gradient(circle, transparent 50%, rgba(0,0,0,0.8) 100%);
            background-size: 100% 4px, 100% 100%;
        }

        /* Main Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* Essential for retro look */
        }

        /* HUD / UI Layer */
        .ui-layer {
            position: absolute;
            /* Positioned on the "snowbank" area - bottom right */
            bottom: 40px; 
            right: 40px;
            width: 320px;
            background: var(--ui-bg);
            border: 4px solid var(--ui-border);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.5);
            padding: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transform: skewX(-2deg); /* Slight dynamic tilt */
        }

        /* Title */
        h1 {
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            color: var(--ui-text);
            text-shadow: 3px 3px 0px var(--ui-accent);
            line-height: 1;
            letter-spacing: -1px;
        }

        /* Instructions */
        .instructions {
            color: #B2BEC3;
            font-size: 0.85rem;
            line-height: 1.4;
            border-left: 4px solid var(--ui-accent);
            padding-left: 10px;
        }

        .instructions kbd {
            background: #000;
            border: 2px solid #555;
            color: #fff;
            padding: 1px 4px;
            font-size: 0.8em;
        }

        /* Start Button */
        .start-btn {
            background: var(--ui-accent);
            color: var(--ui-bg);
            border: none;
            padding: 12px 0;
            font-size: 1.2rem;
            font-family: var(--font-pixel);
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .start-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(0,0,0,0.3);
            background: #fff;
        }

        .start-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }

        /* Blinking Cursor Effect */
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        /* Mobile Adjustment */
        @media (max-width: 600px) {
            .ui-layer {
                width: 90%;
                right: 50%;
                transform: translateX(50%) skewX(0deg);
                bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="world"></canvas>
        <div class="overlay-effects"></div>

        <!-- HUD / UI -->
        <div class="ui-layer">
            <h1>SkiFree</h1>
            <div class="instructions">
                Use <kbd>←</kbd> <kbd>→</kbd> to steer.<br>
                Avoid trees. Survive the Yeti.
            </div>
            <button class="start-btn" id="startBtn">Start Run<span class="blink">_</span></button>
        </div>
    </div>

<script>
    /**
     * VISUAL ENGINE
     * Procedural generation of the SkiFree title screen.
     * Focus: Composition (Corridor), Palette (Icy/Retro), and Pixel Craft.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimize

    // State
    let width, height;
    let frame = 0;
    let trees = [];
    let snowParticles = [];

    // Palette
    const C_SKY = '#74B9FF';
    const C_SNOW = '#FFFFFF';
    const C_SNOW_DARK = '#DFE6E9'; // Shadow
    const C_TREE_DARK = '#006266';
    const C_TREE_LIGHT = '#00A896';
    const C_SKIN = '#FFEAA7';
    const C_HAT = '#D63031';
    const C_JACKET = '#D63031';
    const C_PANTS = '#0984E3';
    const C_SKIS = '#FDCB6E';
    
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        // Set internal resolution
        canvas.width = width;
        canvas.height = height;
        
        // Disable smoothing for crisp pixels
        ctx.imageSmoothingEnabled = false;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        snowParticles = [];

        // 1. GENERATE THE CORRIDOR
        // We want a clear path down the center-left, with trees clustering on the edges.
        const rows = 25;
        const centerX = width * 0.35; // Corridor center is slightly left
        
        for(let i = 0; i < rows; i++) {
            // Z-depth (0 is far, 1 is near)
            let depth = i / rows;
            let y = height * 0.2 + (height * 0.8 * depth); // Start from 20% down screen
            
            // Perspective scaling
            let scale = 0.2 + (depth * 1.8); 
            
            // Corridor Logic:
            // Define a "safe zone" width that widens as it gets closer (perspective)
            let safeZoneWidth = (width * 0.3) * (scale - 0.1); 
            
            // Generate trees for this row
            let numTrees = Math.floor(Math.random() * 4) + 2;
            
            for(let j = 0; j < numTrees; j++) {
                let x;
                let safe = false;
                
                // Try to place tree. If it's in the safe zone, push it out.
                // 3 attempts to find a spot
                for(let k=0; k<3; k++) {
                    x = Math.random() * width;
                    let dist = Math.abs(x - centerX);
                    if (dist > safeZoneWidth) {
                        safe = true;
                        break;
                    }
                }
                
                // If we can't find a safe spot (rare), force it far away
                if (!safe) {
                    x = (Math.random() > 0.5) ? centerX - safeZoneWidth - 50 : centerX + safeZoneWidth + 50;
                }

                trees.push({x, y, scale, z: depth});
            }
        }

        // Sort by Y (Painter's Algorithm)
        trees.sort((a, b) => a.y - b.y);

        // 2. SNOW PARTICLES
        for(let i=0; i<80; i++) {
            snowParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speed: Math.random() * 2 + 0.5,
                size: Math.random() * 2 + 1
            });
        }
    }

    // --- DRAWING FUNCTIONS ---

    function drawPixelSkier(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Animation
        const bob = Math.sin(frame * 0.15) * 3 * scale;
        const lean = Math.sin(frame * 0.1) * 0.1;
        
        ctx.translate(0, bob);
        ctx.rotate(lean);
        
        const p = scale * 4; // Pixel unit size

        // Skis
        ctx.fillStyle = C_SKIS;
        ctx.fillRect(-4*p, 10*p, p, 14*p); 
        ctx.fillRect(3*p, 10*p, p, 14*p);  

        // Legs
        ctx.fillStyle = C_PANTS;
        ctx.fillRect(-3*p, 8*p, 2*p, 4*p);
        ctx.fillRect(2*p, 8*p, 2*p, 4*p);

        // Body
        ctx.fillStyle = C_JACKET;
        ctx.fillRect(-3*p, 2*p, 6*p, 7*p);

        // Head
        ctx.fillStyle = C_SKIN;
        ctx.fillRect(-2*p, -2*p, 4*p, 4*p);
        
        // Hat
        ctx.fillStyle = C_HAT;
        ctx.fillRect(-2*p, -4*p, 4*p, 2*p);

        // Poles
        ctx.fillStyle = '#555';
        ctx.fillRect(-5*p, 4*p, p, 16*p);
        ctx.fillRect(4*p, 4*p, p, 16*p);

        ctx.restore();
    }

    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        const p = scale * 5;

        // Shadow
        ctx.fillStyle = C_SNOW_DARK;
        ctx.beginPath();
        ctx.ellipse(0, 20*p, 6*p, 2*p, 0, 0, Math.PI*2);
        ctx.fill();

        // Trunk
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(-p, 14*p, 2*p, 6*p);

        // Leaves (Stepped Pyramid)
        ctx.fillStyle = C_TREE_DARK;
        
        // Bottom Layer
        ctx.fillRect(-7*p, 8*p, 14*p, 4*p);
        ctx.fillRect(-6*p, 6*p, 12*p, 2*p);
        
        // Mid Layer
        ctx.fillRect(-5*p, 4*p, 10*p, 4*p);
        
        // Top Layer
        ctx.fillRect(-3*p, 0, 6*p, 4*p);

        // Highlights (Pixel Art Detail)
        ctx.fillStyle = C_TREE_LIGHT;
        // Random-ish highlight placement based on position to make them unique
        ctx.fillRect(-5*p, 8*p, 2*p, 2*p); 
        ctx.fillRect(-3*p, 4*p, 2*p, 2*p);

        ctx.restore();
    }

    function drawBackground() {
        // Sky
        ctx.fillStyle = C_SKY;
        ctx.fillRect(0, 0, width, height);

        // Snowy Slope (Trapezoid perspective)
        ctx.fillStyle = C_SNOW;
        ctx.beginPath();
        ctx.moveTo(0, height); // Bottom Left
        ctx.lineTo(width, height); // Bottom Right
        // Vanishing point area
        ctx.lineTo(width * 0.65, height * 0.1); // Top Right Horizon
        ctx.lineTo(width * 0.35, height * 0.1); // Top Left Horizon
        ctx.fill();

        // Shading the slope (Right side shadow for depth)
        ctx.fillStyle = C_SNOW_DARK;
        ctx.beginPath();
        ctx.moveTo(width * 0.65, height * 0.1);
        ctx.lineTo(width, height * 0.1); // Invisible horizon line
        ctx.lineTo(width, height);
        ctx.lineTo(width * 0.7, height);
        ctx.fill();
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        drawBackground();

        // Draw Trees
        trees.forEach(tree => {
            drawTree(tree.x, tree.y, tree.scale);
        });

        // Draw Skier
        // Positioned in the corridor, slightly lower than center
        const skierX = width * 0.35;
        const skierY = height * 0.75;
        // Scale skier to be prominent but not huge
        drawPixelSkier(skierX, skierY, 1.2);

        // Draw Snow Particles
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        snowParticles.forEach(p => {
            p.y += p.speed;
            p.x -= 0.5; // Wind
            if (p.y > height) p.y = 0;
            if (p.x < 0) p.x = width;
            
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);
    
    document.getElementById('startBtn').addEventListener('click', function() {
        // Simple interaction feedback
        const originalText = this.innerHTML;
        this.innerHTML = "GO!";
        this.style.transform = "translate(2px, 2px)";
        this.style.boxShadow = "2px 2px 0px rgba(0,0,0,0.3)";
        
        setTimeout(() => {
            alert("Game Start! (This is a visual demo)");
            this.innerHTML = originalText;
            this.style.transform = "";
            this.style.boxShadow = "";
        }, 200);
    });

    // Init
    resize();
    animate();

</script>
</body>
</html>
