<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette: Deep Void, Teal Magic, Gold Luxury */
        --bg-deep: #050507;
        --bg-panel: #0c0c12;
        
        --gold-primary: #d4af37;
        --gold-bright: #f9e689;
        --gold-dim: #8a6e18;
        
        --teal-primary: #00f0d4;
        --teal-dim: #008f7a;
        
        --text-main: #f0f0f5;
        --text-muted: #6b7280;
        
        --font-heading: 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* --- Canvas Background --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    /* Heavy Vignette to focus center */
    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, transparent 0%, var(--bg-deep) 65%);
        z-index: 1;
        pointer-events: none;
    }

    /* --- Layout Container --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 1.5rem;
        justify-content: space-between;
    }

    /* --- Header --- */
    header {
        display: flex;
        justify-content: flex-end; /* Align right */
        align-items: center;
        padding-top: 1rem;
    }

    .currency-pill {
        background: rgba(15, 15, 20, 0.8);
        border: 1px solid var(--gold-dim);
        border-radius: 4px; /* Square, sharp */
        padding: 0.6rem 1.2rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 0 15px rgba(0,0,0,0.8);
        backdrop-filter: blur(4px);
        position: relative;
        overflow: hidden;
    }

    /* Subtle gold sheen on pill */
    .currency-pill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
        transform: translateX(-100%);
        animation: sheen 4s infinite;
    }

    .coin-icon {
        width: 20px;
        height: 20px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 2px var(--gold-dim));
    }

    .currency-amount {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-bright);
        letter-spacing: 0.05em;
    }

    /* --- Hero / Centerpiece --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        margin-bottom: 2rem;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 4rem;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.4em;
        margin-bottom: 0.5rem;
        background: linear-gradient(to bottom, var(--gold-bright), var(--gold-primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 4px 12px rgba(0,0,0,0.8);
        position: relative;
        z-index: 2;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.8rem;
        color: var(--teal-primary);
        letter-spacing: 0.4em;
        text-transform: uppercase;
        margin-bottom: 2.5rem;
        opacity: 0.8;
        text-shadow: 0 0 10px var(--teal-dim);
    }

    /* --- The Seal (Complex SVG) --- */
    .seal-container {
        position: relative;
        width: 260px;
        height: 260px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 1rem;
    }

    /* The glow behind the seal */
    .seal-glow {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 240, 212, 0.15) 0%, transparent 70%);
        animation: breathe 6s ease-in-out infinite;
        z-index: 0;
    }

    .seal-svg {
        width: 100%;
        height: 100%;
        z-index: 1;
        /* Subtle rotation */
        animation: spin 60s linear infinite;
    }

    .seal-reverse-svg {
        position: absolute;
        width: 80%;
        height: 80%;
        top: 10%;
        left: 10%;
        z-index: 2;
        animation: spin-reverse 40s linear infinite;
    }

    /* --- Menu Grid --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        padding: 0 1rem;
    }

    .menu-card {
        background: linear-gradient(180deg, rgba(20, 20, 28, 0.9) 0%, rgba(10, 10, 14, 0.95) 100%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        /* Slight taper for sigil look */
        clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
        
        padding: 2rem 0.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
    }

    /* Inner decorative border */
    .menu-card::before {
        content: '';
        position: absolute;
        top: 5px; left: 5px; right: 5px; bottom: 5px;
        border: 1px solid rgba(212, 175, 55, 0.1);
        clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
        pointer-events: none;
    }

    .menu-card:hover {
        transform: translateY(-5px);
        background: linear-gradient(180deg, rgba(30, 30, 40, 0.95) 0%, rgba(15, 15, 20, 1) 100%);
        border-color: var(--gold-dim);
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .menu-card:hover::before {
        border-color: rgba(212, 175, 55, 0.4);
    }

    .menu-card:active {
        transform: translateY(-2px) scale(0.98);
    }

    .card-icon {
        width: 40px;
        height: 40px;
        fill: none;
        stroke: var(--text-muted);
        stroke-width: 1.5;
        transition: all 0.3s;
    }

    .menu-card:hover .card-icon {
        stroke: var(--gold-primary);
        filter: drop-shadow(0 0 6px var(--gold-dim));
    }

    .card-label {
        font-family: var(--font-heading);
        font-size: 1rem;
        color: var(--text-main);
        letter-spacing: 0.1em;
        font-weight: 600;
        text-transform: uppercase;
        transition: color 0.3s;
    }

    .menu-card:hover .card-label {
        color: var(--gold-bright);
        text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
    }

    /* Special Active/Summon State */
    .menu-card.summon {
        border-color: rgba(212, 175, 55, 0.3);
        background: linear-gradient(180deg, rgba(40, 30, 10, 0.4) 0%, rgba(10, 10, 14, 0.95) 100%);
    }
    
    .menu-card.summon .card-icon {
        stroke: var(--gold-primary);
    }

    /* --- Animations --- */
    @keyframes breathe {
        0%, 100% { opacity: 0.5; transform: scale(0.95); }
        50% { opacity: 0.8; transform: scale(1.05); }
    }

    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }

    @keyframes sheen {
        0% { transform: translateX(-100%); }
        20% { transform: translateX(100%); }
        100% { transform: translateX(100%); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 2.5rem; }
        .menu-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
        .seal-container { width: 200px; height: 200px; }
        .app-container { padding: 1rem; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/>
                    <path d="M12 7v10M9 10h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <div class="seal-container">
                <div class="seal-glow"></div>
                
                <!-- Outer Rotating Ring (Teal) -->
                <svg class="seal-svg" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#00f0d4;stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:#008f7a;stop-opacity:0.2" />
                        </linearGradient>
                    </defs>
                    <!-- Thin Geometric Rings -->
                    <circle cx="100" cy="100" r="90" stroke="url(#tealGrad)" stroke-width="1" fill="none" stroke-dasharray="2 4" />
                    <circle cx="100" cy="100" r="85" stroke="rgba(0, 240, 212, 0.3)" stroke-width="0.5" fill="none" />
                    <!-- Cardinal Points -->
                    <path d="M100 10 L100 190 M10 100 L190 100" stroke="rgba(0, 240, 212, 0.1)" stroke-width="1" />
                    <path d="M36 36 L164 164 M36 164 L164 36" stroke="rgba(0, 240, 212, 0.1)" stroke-width="1" />
                </svg>

                <!-- Inner Complex Seal (Gold/Teal Hybrid) -->
                <svg class="seal-reverse-svg" viewBox="0 0 200 200">
                    <!-- Central Diamond/Star -->
                    <path d="M100 20 L180 100 L100 180 L20 100 Z" fill="none" stroke="var(--gold-primary)" stroke-width="1.5" opacity="0.6" />
                    <path d="M100 40 L160 100 L100 160 L40 100 Z" fill="none" stroke="var(--teal-primary)" stroke-width="1" opacity="0.4" />
                    
                    <!-- Magic Runes/Circles -->
                    <circle cx="100" cy="100" r="30" stroke="var(--gold-primary)" stroke-width="1" stroke-dasharray="4 2" fill="none" opacity="0.8" />
                    <circle cx="100" cy="100" r="20" fill="var(--teal-primary)" opacity="0.1" />
                    
                    <!-- Connecting Geometry -->
                    <path d="M100 20 L100 40 M100 160 L100 180 M20 100 L40 100 M160 100 L180 100" stroke="var(--gold-bright)" stroke-width="2" />
                </svg>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon (Main CTA) -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <!-- Sigil: Triangle/Flame -->
                <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 22h20L12 2z" />
                    <path d="M12 10l-4 8h8l-4-8z" />
                </svg>
                <span class="card-label">Summon</span>
            </div>

            <!-- Roster -->
            <div class="menu-card" onclick="interact('Roster')">
                <!-- Sigil: Shield/Structure -->
                <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    <path d="M12 8v4" />
                    <path d="M12 16h.01" />
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card" onclick="interact('Battle')">
                <!-- Sigil: Crossed Swords/Conflict -->
                <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                    <path d="M13 19l6-6" />
                    <path d="M16 16l4 4" />
                    <path d="M19 21l2-2" />
                    <path d="M10 13l-6 6" />
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card" onclick="interact('Grind')">
                <!-- Sigil: Gear/Process -->
                <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
                <span class="card-label">Grind</span>
            </div>
        </nav>
    </div>

<script>
    // --- Canvas Particle System ---
    // Focused: Particles concentrate around the center seal, falling upwards like embers/spirits.
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    const centerX = () => width / 2;
    const centerY = () => height / 2;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            // Spawn mostly near the center (the seal)
            // Random angle around the center
            const angle = Math.random() * Math.PI * 2;
            // Distance from center (bias towards inner area)
            const dist = Math.random() * (Math.min(width, height) * 0.35); 
            
            this.x = centerX() + Math.cos(angle) * dist;
            this.y = centerY() + Math.sin(angle) * dist;
            
            // Move slightly outwards and upwards
            this.vx = Math.cos(angle) * (Math.random() * 0.5);
            this.vy = -(Math.random() * 1.5 + 0.2); 
            
            this.size = Math.random() * 1.5;
            this.alpha = 0; // Fade in
            this.life = 0;
            this.maxLife = Math.random() * 100 + 100;
            
            // Mostly teal, occasional gold
            this.isGold = Math.random() > 0.9; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life++;

            // Fade in
            if (this.life < 20) {
                this.alpha = (this.life / 20) * 0.6;
            } 
            // Fade out
            else if (this.life > this.maxLife - 20) {
                this.alpha = ((this.maxLife - this.life) / 20) * 0.6;
            }

            if (this.life >= this.maxLife) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            
            if (this.isGold) {
                ctx.fillStyle = `rgba(212, 175, 55, ${this.alpha})`;
                ctx.shadowColor = 'rgba(212, 175, 55, 0.5)';
            } else {
                ctx.fillStyle = `rgba(0, 240, 212, ${this.alpha})`;
                ctx.shadowColor = 'rgba(0, 240, 212, 0.5)';
            }
            
            ctx.shadowBlur = 5;
            ctx.fill();
            ctx.shadowBlur = 0; // Reset
        }
    }

    function initParticles() {
        particles = [];
        // Reduced count for performance and cleaner look
        const count = 60; 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        // Simple visual feedback
        const btn = event.currentTarget;
        
        // Add a temporary class or style for click effect
        const originalBorder = btn.style.borderColor;
        btn.style.borderColor = 'var(--gold-bright)';
        btn.style.transform = 'scale(0.96)';
        
        setTimeout(() => {
            btn.style.borderColor = '';
            btn.style.transform = '';
        }, 150);
        
        console.log(`Action: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
