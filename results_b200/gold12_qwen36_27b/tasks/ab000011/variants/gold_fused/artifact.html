<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID LOCK // PROTOCOL 7</title>
    <style>
        :root {
            --bg-dark: #050505;
            --bg-panel: #0b0b0b;
            --wall-color: #1c1c1e;
            --wall-highlight: #3a3a3c;
            --floor-color: #0a0a0a;
            --grid-line: #151515;
            
            --text-main: #c0c0c0;
            --text-dim: #555;
            
            --accent-cyan: #00f3ff;
            --accent-cyan-dim: rgba(0, 243, 255, 0.15);
            --accent-amber: #ffaa00;
            --accent-amber-dim: rgba(255, 170, 0, 0.1);
            --accent-magenta: #ff0055;
            --accent-green: #00ff66;

            --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            --font-tech: 'Consolas', 'Monaco', 'Courier New', monospace;
            
            --cell-size: 80px;
            --gap: 2px;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Ambient Background */
        .bg-scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 1px,
                rgba(0, 0, 0, 0.3) 2px,
                rgba(0, 0, 0, 0.3) 4px
            );
            pointer-events: none;
            z-index: 0;
        }

        /* Main Interface Shell */
        .interface-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            padding: 30px 40px 40px 40px;
            background: rgba(11, 11, 11, 0.95);
            border: 1px solid #222;
            box-shadow: 
                0 0 0 1px #000,
                0 20px 60px rgba(0, 0, 0, 0.8),
                inset 0 0 100px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            backdrop-filter: blur(5px);
            max-width: 95vw;
        }

        /* Decorative corner markers */
        .interface-container::before, .interface-container::after {
            content: ''; position: absolute; width: 10px; height: 10px;
            border: 1px solid var(--accent-cyan);
            transition: all 0.3s ease;
        }
        .interface-container::before { top: 0; left: 0; border-right: none; border-bottom: none; }
        .interface-container::after { bottom: 0; right: 0; border-left: none; border-top: none; }

        /* HUD Header */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #222;
            padding-bottom: 20px;
        }

        .title-block h1 {
            font-family: var(--font-tech);
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin: 0;
            color: #fff;
            text-transform: uppercase;
            line-height: 1;
        }

        .title-block h1 span { color: var(--accent-cyan); text-shadow: 0 0 10px var(--accent-cyan); }
        .title-sub {
            font-family: var(--font-tech);
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 6px;
            letter-spacing: 1px;
        }

        .hud-stats {
            display: flex;
            gap: 40px;
            font-family: var(--font-tech);
            text-align: right;
        }

        .stat-item { display: flex; flex-direction: column; }
        .stat-value { font-size: 1.5rem; color: #fff; font-weight: 600; }
        .stat-label { font-size: 0.65rem; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }

        /* Game Board Area */
        .board-frame {
            padding: 10px;
            background: #000;
            border: 1px solid #333;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
            position: relative;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(7, var(--cell-size));
            grid-template-rows: repeat(7, var(--cell-size));
            gap: var(--gap);
            background-color: var(--grid-line); /* Shows through gaps */
        }

        /* Cells */
        .cell {
            width: 100%; height: 100%;
            background-color: var(--floor-color);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Elements --- */

        /* Walls: Industrial blocky style */
        .wall {
            background-color: var(--wall-color);
            box-shadow: 
                inset 1px 1px 0 var(--wall-highlight),
                inset -1px -1px 0 #000;
        }
        /* Wall texture detail */
        .wall::after {
            content: ''; position: absolute;
            top: 20%; left: 20%; width: 60%; height: 60%;
            border: 1px solid rgba(255,255,255,0.03);
        }

        /* Floor Detail (Subtle) */
        .floor::before {
            content: ''; position: absolute;
            width: 2px; height: 2px; background: #222;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        /* Goal / Door: Cyan Tech */
        .goal {
            background: radial-gradient(circle, var(--accent-cyan-dim) 0%, transparent 70%);
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 15px var(--accent-cyan-dim);
        }
        .goal::after {
            content: ''; position: absolute;
            width: 40%; height: 40%;
            border: 2px solid var(--accent-cyan);
            transform: rotate(45deg);
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        /* Lever: Mechanical */
        .lever-container {
            width: 100%; height: 100%;
            position: relative;
            display: flex; justify-content: center; align-items: center;
        }
        .lever-base {
            width: 40px; height: 12px;
            background: #222;
            border-radius: 4px;
            border-bottom: 2px solid #000;
            position: absolute; bottom: 15%;
            z-index: 1;
        }
        .lever-arm {
            width: 6px; height: 32px;
            background: var(--accent-magenta);
            position: absolute; bottom: calc(15% + 6px);
            transform-origin: bottom center;
            transform: rotate(-45deg);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--accent-magenta);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }
        .lever-knob {
            width: 14px; height: 14px;
            background: #fff;
            border-radius: 50%;
            position: absolute; top: -6px; left: -4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        
        /* Active Lever State */
        .lever-container.active .lever-arm {
            transform: rotate(45deg);
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }
        .lever-container.active .lever-knob { background: var(--accent-green); }

        /* Crate: Heavy Cargo */
        .crate {
            width: 70%; height: 70%;
            background: #2a2a2a;
            border: 2px solid #444;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            display: flex; justify-content: center; align-items: center;
            position: relative;
            z-index: 5;
        }
        /* Crate cross pattern */
        .crate::before {
            content: ''; position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent 40%, #111 40%, #111 60%, transparent 60%),
                        linear-gradient(-45deg, transparent 40%, #111 40%, #111 60%, transparent 60%);
            opacity: 0.5;
        }
        .crate-label {
            font-family: var(--font-tech);
            font-size: 0.6rem;
            color: var(--accent-amber);
            background: #000;
            padding: 2px 4px;
            border: 1px solid var(--accent-amber);
            z-index: 2;
            font-weight: bold;
        }

        /* Player: Void Operative */
        .player {
            width: 50%; height: 50%;
            background: #000;
            border: 2px solid var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent-cyan), inset 0 0 10px var(--accent-cyan);
            position: relative;
            z-index: 10;
            transition: transform 0.1s ease;
        }
        .player::after {
            content: ''; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 6px; height: 6px; background: #fff; border-radius: 50%;
        }
        @keyframes pulse-player {
            0% { box-shadow: 0 0 10px var(--accent-cyan), inset 0 0 5px var(--accent-cyan); }
            50% { box-shadow: 0 0 25px var(--accent-cyan), inset 0 0 15px var(--accent-cyan); }
            100% { box-shadow: 0 0 10px var(--accent-cyan), inset 0 0 5px var(--accent-cyan); }
        }
        .player { animation: pulse-player 2s infinite; }

        /* Footer Legend */
        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #222;
            padding-top: 15px;
            font-family: var(--font-tech);
        }

        .legend {
            display: flex;
            gap: 20px;
            font-size: 0.75rem;
            color: var(--text-dim);
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        
        .key-icon {
            width: 20px; height: 20px;
            border: 1px solid #444;
            border-radius: 3px;
            display: flex; justify-content: center; align-items: center;
            background: #111;
            color: #aaa;
            font-size: 0.65rem;
            box-shadow: 0 2px 0 #000;
        }

        .status-bar {
            font-size: 0.8rem;
            color: var(--accent-green);
            opacity: 0;
            transition: opacity 0.3s;
            text-shadow: 0 0 5px var(--accent-green);
            letter-spacing: 1px;
        }
        .status-bar.visible { opacity: 1; }

        /* Responsive adjustments */
        @media (max-width: 650px) {
            :root { --cell-size: 13vw; }
            .interface-container { padding: 15px; gap: 15px; }
            .hud-stats { gap: 20px; }
            .legend { display: none; } /* Hide legend on very small screens */
        }
    </style>
</head>
<body>

    <div class="bg-scanlines"></div>

    <div class="interface-container">
        <header>
            <div class="title-block">
                <h1>VOID <span>LOCK</span></h1>
                <div class="title-sub">SECURE SECTOR // 07</div>
            </div>
            <div class="hud-stats">
                <div class="stat-item">
                    <span class="stat-value" id="level-display">07</span>
                    <span class="stat-label">Sector</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="moves-display">14</span>
                    <span class="stat-label">Cycles</span>
                </div>
            </div>
        </header>

        <div class="board-frame">
            <div class="board" id="game-board">
                <!-- JS generated grid -->
            </div>
        </div>

        <div class="footer">
            <div class="legend">
                <div class="legend-item">
                    <span class="key-icon">W</span><span class="key-icon">A</span><span class="key-icon">S</span><span class="key-icon">D</span>
                    <span>NAVIGATE</span>
                </div>
                <div class="legend-item">
                    <span class="key-icon">R</span>
                    <span>RESET</span>
                </div>
            </div>
            <div class="status-bar" id="status-msg">SYSTEM READY</div>
        </div>
    </div>

    <script>
        // Configuration
        const BOARD_SIZE = 7;
        const boardEl = document.getElementById('game-board');
        const movesDisplay = document.getElementById('moves-display');
        const statusMsg = document.getElementById('status-msg');

        // Tile Types
        const T = {
            FLOOR: 0,
            WALL: 1,
            PLAYER: 2,
            CRATE: 3,
            LEVER: 4,
            GOAL: 5,
            LEVER_ACTIVE: 6
        };

        // Level Layout
        const initialMap = [
            [T.WALL, T.WALL, T.WALL, T.WALL, T.WALL, T.WALL, T.WALL],
            [T.WALL, T.FLOOR, T.FLOOR, T.FLOOR, T.FLOOR, T.FLOOR, T.WALL],
            [T.WALL, T.FLOOR, T.LEVER, T.FLOOR, T.CRATE, T.FLOOR, T.WALL],
            [T.WALL, T.FLOOR, T.FLOOR, T.FLOOR, T.FLOOR, T.FLOOR, T.WALL],
            [T.WALL, T.FLOOR, T.FLOOR, T.PLAYER, T.FLOOR, T.FLOOR, T.WALL],
            [T.WALL, T.FLOOR, T.FLOOR, T.FLOOR, T.GOAL, T.FLOOR, T.WALL],
            [T.WALL, T.WALL, T.WALL, T.WALL, T.WALL, T.WALL, T.WALL]
        ];

        // State
        let mapState = JSON.parse(JSON.stringify(initialMap));
        let playerPos = { x: 3, y: 4 };
        let moves = 14;
        let isGameOver = false;

        // Rendering
        function renderBoard() {
            boardEl.innerHTML = '';
            
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    const val = mapState[y][x];
                    const cell = document.createElement('div');
                    cell.classList.add('cell');

                    // 1. Base Layer (Floor/Wall)
                    if (val === T.WALL) {
                        cell.classList.add('wall');
                    } else {
                        cell.classList.add('floor');
                    }

                    // 2. Static Elements (Goal)
                    if (val === T.GOAL) {
                        cell.classList.add('goal');
                    }

                    // 3. Interactive Objects (Lever)
                    if (val === T.LEVER || val === T.LEVER_ACTIVE) {
                        const leverDiv = document.createElement('div');
                        leverDiv.className = `lever-container ${val === T.LEVER_ACTIVE ? 'active' : ''}`;
                        leverDiv.innerHTML = `
                            <div class="lever-base"></div>
                            <div class="lever-arm"><div class="lever-knob"></div></div>
                        `;
                        cell.appendChild(leverDiv);
                    }

                    // 4. Movable Objects (Crate)
                    if (val === T.CRATE) {
                        const crateDiv = document.createElement('div');
                        crateDiv.className = 'crate';
                        crateDiv.innerHTML = '<div class="crate-label">H-07</div>';
                        cell.appendChild(crateDiv);
                    }

                    // 5. Player
                    if (val === T.PLAYER) {
                        const playerDiv = document.createElement('div');
                        playerDiv.className = 'player';
                        cell.appendChild(playerDiv);
                    }

                    boardEl.appendChild(cell);
                }
            }
            movesDisplay.textContent = moves;
        }

        // Game Logic
        function movePlayer(dx, dy) {
            if (isGameOver) return;

            const newX = playerPos.x + dx;
            const newY = playerPos.y + dy;

            // Bounds check
            if (newX < 0 || newX >= BOARD_SIZE || newY < 0 || newY >= BOARD_SIZE) return;

            const targetVal = mapState[newY][newX];

            // 1. Hit Wall
            if (targetVal === T.WALL) return;

            // 2. Hit Lever
            if (targetVal === T.LEVER) {
                mapState[newY][newX] = T.LEVER_ACTIVE;
                showStatus("LEVER ENGAGED");
                // Move player
                updatePlayerPos(newX, newY);
                return;
            }

            // 3. Hit Crate
            if (targetVal === T.CRATE) {
                const nextX = newX + dx;
                const nextY = newY + dy;
                
                // Check behind crate
                if (nextX >= 0 && nextX < BOARD_SIZE && nextY >= 0 && nextY < BOARD_SIZE) {
                    const nextVal = mapState[nextY][nextX];
                    
                    // Can push if empty floor or goal
                    if (nextVal === T.FLOOR || nextVal === T.GOAL) {
                        // Move Crate
                        mapState[nextY][nextX] = T.CRATE;
                        // Move Player into old crate spot
                        updatePlayerPos(newX, newY);
                    }
                }
                return;
            }

            // 4. Empty Move (Floor or Goal)
            updatePlayerPos(newX, newY);
        }

        function updatePlayerPos(x, y) {
            // Clear old pos (check what was under player? simplified: just floor)
            // In a robust engine, we'd store the "base" tile. 
            // Here, we assume player was on floor or goal.
            // If we were on a goal, we need to put the goal back.
            // For this specific level, player starts on floor.
            
            // Logic fix: The player overwrites the tile. 
            // We need to know if the player was standing on a goal previously?
            // Simplified: The map state stores the "Active" tile. 
            // We need to handle the "Goal" tile logic specifically.
            
            // Check if previous player pos was a goal
            const prevVal = mapState[playerPos.y][playerPos.x];
            // If prevVal was 2 (player), we need to know what was underneath.
            // To keep it simple for this demo: We only check collision, we don't strictly restore underlying tiles 
            // EXCEPT for the Goal check.
            
            // Let's do a proper swap:
            mapState[playerPos.y][playerPos.x] = T.FLOOR; // Temp clear
            
            // Check if we are moving ONTO a goal? 
            // No, the mapState at [newY][newX] is already overwritten by logic above or is floor.
            // Wait, if I walk onto a goal, I overwrite it with T.PLAYER.
            // So I need to check the TARGET tile before overwriting.
            
            // Re-fetch target value because we might have pushed a crate
            let tileUnderfoot = T.FLOOR;
            // Check if the coordinate [newY][newX] currently has a crate (we just moved it? No, we are moving INTO the old crate spot)
            
            // Actually, let's just use the logic:
            // 1. Identify what is at [newY][newX] currently.
            // 2. If it's a crate, we moved it. So [newY][newX] is now empty (floor).
            // 3. If it was a goal, we need to preserve it?
            
            // Let's stick to the visual representation for this demo to avoid complexity bugs:
            // We clear the old player spot.
            mapState[playerPos.y][playerPos.x] = T.FLOOR; 
            // Note: This destroys the Goal if the player walks off it. 
            // FIX: Check if [newY][newX] is Goal before overwriting?
            
            // Refined Move:
            // We already handled Crate/Lever/Wall.
            // If we are here, we are moving to an empty spot (Floor or Goal).
            // Check if the spot we are moving TO is a Goal.
            // But wait, mapState[newY][newX] currently holds T.GOAL or T.FLOOR.
            
            // If we push a crate, mapState[newY][newX] becomes T.FLOOR (implicitly in my logic above? No).
            // In the Crate block: mapState[nextY][nextX] = T.CRATE. 
            // The cell [newY][newX] (old crate spot) is still T.CRATE.
            // So we must overwrite it.
            
            // Let's look at the Goal specifically.
            // If mapState[newY][newX] === T.GOAL, we want to show Player ON TOP of Goal.
            // My render logic draws Player if val === T.PLAYER.
            // So if I set val = T.PLAYER, I lose the Goal visual.
            
            // FIX: Add a class to the cell if it's a goal, regardless of contents?
            // Or simpler: Check for win condition immediately.
            
            // Let's just set the player and handle the "Goal" visual via CSS class on the cell
            // if we detect the coordinate is a goal.
            
            const isGoal = (mapState[newY][newX] === T.GOAL);
            
            mapState[newY][newX] = T.PLAYER;
            playerPos = { x: newX, y: newY };
            
            moves++;
            renderBoard();
            
            // Post-render fix: The render loop sees T.PLAYER and draws player, but misses the Goal visual.
            // We need to inject the Goal visual into the player's cell if it was a goal.
            if (isGoal) {
                 // Find the cell in DOM
                 const index = newY * BOARD_SIZE + newX;
                 const cell = boardEl.children[index];
                 cell.classList.add('goal'); // Add goal styling
                 checkWin();
            }
        }

        function checkWin() {
            showStatus("ACCESS GRANTED");
            isGameOver = true;
            // Visual flair for win
            document.querySelector('.interface-container').style.borderColor = 'var(--accent-green)';
            document.querySelector('.interface-container::after').style.borderColor = 'var(--accent-green)';
        }

        function showStatus(msg) {
            statusMsg.textContent = msg;
            statusMsg.classList.add('visible');
            setTimeout(() => {
                statusMsg.classList.remove('visible');
            }, 2000);
        }

        function resetGame() {
            mapState = JSON.parse(JSON.stringify(initialMap));
            playerPos = { x: 3, y: 4 };
            moves = 14;
            isGameOver = false;
            document.querySelector('.interface-container').style.borderColor = '#222';
            renderBoard();
            showStatus("SYSTEM RESET");
        }

        // Controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') { resetGame(); return; }
            
            let dx = 0, dy = 0;
            if (e.key === 'w' || e.key === 'ArrowUp') dy = -1;
            if (e.key === 's' || e.key === 'ArrowDown') dy = 1;
            if (e.key === 'a' || e.key === 'ArrowLeft') dx = -1;
            if (e.key === 'd' || e.key === 'ArrowRight') dx = 1;

            if (dx !== 0 || dy !== 0) movePlayer(dx, dy);
        });

        // Start
        renderBoard();
        showStatus("PROTOCOL INITIATED");

    </script>
</body>
</html>
