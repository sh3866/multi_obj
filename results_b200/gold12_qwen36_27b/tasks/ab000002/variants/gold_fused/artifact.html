<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archon's Ascension</title>
<style>
    :root {
        /* Palette: Void / Amber / Slate */
        --bg-dark: #05070a;
        --bg-panel: rgba(13, 17, 26, 0.95);
        --border-color: rgba(100, 116, 139, 0.2);
        --accent-primary: #fbbf24; /* Gold */
        --accent-glow: rgba(251, 191, 36, 0.5);
        --accent-secondary: #d97706;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --text-dim: #475569;
        
        /* Node Colors */
        --node-bg: #0f172a;
        --node-border: #334155;
        --node-unlocked: #fbbf24;
        --node-available: #f8fafc;
        --node-locked: #1e293b;
        
        /* Typography */
        --font-display: 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-dark);
        /* Subtle noise texture via SVG data URI */
        background-image: 
            radial-gradient(circle at 50% 30%, #1e293b 0%, transparent 60%),
            url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Header --- */
    header {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 10;
        background: linear-gradient(to bottom, var(--bg-dark), transparent);
    }

    .title-container {
        text-align: center;
        position: relative;
        padding-bottom: 5px;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 1.8rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        font-weight: 600;
    }

    .subtitle {
        font-size: 0.75rem;
        color: var(--accent-primary);
        letter-spacing: 0.25em;
        margin-top: 2px;
        text-transform: uppercase;
        opacity: 0.8;
    }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
    }

    /* --- Sidebar --- */
    aside {
        width: 300px;
        background: var(--bg-panel);
        border-right: 1px solid var(--border-color);
        padding: 30px 25px;
        display: flex;
        flex-direction: column;
        gap: 25px;
        backdrop-filter: blur(12px);
        z-index: 20;
        box-shadow: 5px 0 30px rgba(0,0,0,0.6);
    }

    .stat-block {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .level-display {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 5px;
    }

    .level-num {
        font-family: var(--font-display);
        font-size: 3.5rem;
        line-height: 1;
        color: var(--text-main);
        font-weight: 700;
    }

    .level-label {
        font-size: 1rem;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        font-weight: 600;
    }

    .xp-container {
        margin-top: 8px;
    }

    .xp-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-bottom: 6px;
        font-weight: 600;
        letter-spacing: 0.05em;
    }

    .xp-bar-bg {
        height: 6px;
        background: #1e293b;
        border-radius: 3px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
    }

    .xp-bar-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 8px var(--accent-glow);
        position: relative;
    }
    
    .xp-bar-fill::after {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        width: 100%;
        transform: translateX(-100%);
        animation: shimmer 2.5s infinite;
    }

    .points-display {
        background: rgba(0,0,0,0.4);
        padding: 15px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        text-align: center;
        position: relative;
        overflow: hidden;
    }
    
    /* Decorative corner for points box */
    .points-display::before {
        content: '';
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 2px;
        background: var(--accent-primary);
        box-shadow: 0 0 10px var(--accent-glow);
    }

    .points-val {
        font-size: 2.2rem;
        font-family: var(--font-display);
        color: var(--accent-primary);
        display: block;
        text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
    }

    .points-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-muted);
        margin-top: 2px;
    }

    .character-details {
        margin-top: auto;
        border-top: 1px solid var(--border-color);
        padding-top: 20px;
    }
    
    .char-name {
        font-size: 1.2rem;
        font-family: var(--font-display);
        margin-bottom: 4px;
        color: var(--text-main);
    }
    
    .char-class {
        color: var(--accent-primary);
        font-size: 0.8rem;
        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 0.85rem;
    }
    .stat-row span:first-child { color: var(--text-muted); }
    .stat-row span:last-child { font-weight: bold; color: var(--text-main); font-family: var(--font-display); }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, rgba(30, 41, 59, 0.2) 0%, transparent 70%);
    }

    .tree-container:active { cursor: grabbing; }

    /* The "World" container that moves */
    .tree-world {
        position: absolute;
        /* Centered via JS initially */
        transform-origin: center center;
        will-change: transform;
    }

    /* SVG Connections */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: visible;
    }

    .connection-line {
        stroke: var(--text-dim);
        stroke-width: 2;
        fill: none;
        transition: stroke 0.4s ease, filter 0.4s ease;
        stroke-linecap: round;
    }

    .connection-line.active {
        stroke: var(--accent-primary);
        stroke-width: 2.5;
        filter: drop-shadow(0 0 4px var(--accent-glow));
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        width: 56px;
        height: 56px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .node:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }

    .node-shape {
        width: 100%;
        height: 100%;
        background: var(--node-bg);
        border: 2px solid var(--node-border);
        border-radius: 50%; /* Circular nodes */
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* Inner decorative ring */
    .node-shape::after {
        content: '';
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.05);
        pointer-events: none;
    }

    .node-icon {
        width: 24px;
        height: 24px;
        fill: var(--text-dim);
        transition: all 0.3s ease;
    }

    /* --- Node States --- */
    
    /* Unlocked: Glowing Gold */
    .node.unlocked .node-shape {
        border-color: var(--accent-primary);
        background: radial-gradient(circle at 30% 30%, #451a03, #0f172a);
        box-shadow: 0 0 15px var(--accent-glow), inset 0 0 10px rgba(251, 191, 36, 0.2);
    }

    .node.unlocked .node-icon {
        fill: var(--accent-primary);
        filter: drop-shadow(0 0 2px var(--accent-primary));
    }
    
    /* Available: Bright White/Grey (Parent Unlocked) */
    .node.available .node-shape {
        border-color: var(--text-main);
        background: #1e293b;
    }
    
    .node.available:hover .node-shape {
        border-color: #fff;
        box-shadow: 0 0 12px rgba(255,255,255,0.3);
    }
    
    .node.available .node-icon {
        fill: var(--text-main);
    }

    /* Locked: Dim */
    .node.locked .node-shape {
        border-color: var(--node-locked);
        opacity: 0.6;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(15, 23, 42, 0.98);
        border: 1px solid var(--text-dim);
        padding: 16px;
        width: 260px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 15px 30px rgba(0,0,0,0.9);
        backdrop-filter: blur(8px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip.unlocked {
        border-color: var(--accent-primary);
        box-shadow: 0 0 15px rgba(251, 191, 36, 0.1);
    }

    .tooltip h3 {
        color: var(--text-main);
        font-family: var(--font-display);
        margin-bottom: 4px;
        font-size: 1.1rem;
        letter-spacing: 0.02em;
    }
    
    .tooltip.unlocked h3 {
        color: var(--accent-primary);
    }

    .tooltip .type {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 12px;
        letter-spacing: 0.1em;
        font-weight: 700;
    }

    .tooltip p {
        font-size: 0.85rem;
        line-height: 1.5;
        color: #cbd5e1;
        font-weight: 300;
    }

    .tooltip .req {
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px solid rgba(255,255,255,0.1);
        font-size: 0.7rem;
        color: #ef4444;
        display: flex;
        align-items: center;
        gap: 5px;
    }
    
    .tooltip .req::before {
        content: '🔒';
        font-size: 0.7rem;
    }

    .tooltip.locked .req { display: flex; }
    .tooltip.locked { border-color: var(--border-color); }
    .tooltip:not(.locked) .req { display: none; }

    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

</style>
</head>
<body>

    <header>
        <div class="title-container">
            <h1>Archon's Ascension</h1>
            <div class="subtitle">Class: Void Walker</div>
        </div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="stat-block">
                <div class="level-display">
                    <span class="level-num">42</span>
                    <span class="level-label">Level</span>
                </div>
                <div class="xp-container">
                    <div class="xp-labels">
                        <span>XP Progress</span>
                        <span>12,450 / 20,000</span>
                    </div>
                    <div class="xp-bar-bg">
                        <div class="xp-bar-fill"></div>
                    </div>
                </div>
            </div>

            <div class="points-display">
                <span class="points-val">3</span>
                <span class="points-label">Skill Points Available</span>
            </div>

            <div class="character-details">
                <h2 class="char-name">Kaelen Thorne</h2>
                <div class="char-class">Duelist / Arcanist</div>
                <div class="stat-row"><span>Strength</span><span>14</span></div>
                <div class="stat-row"><span>Dexterity</span><span>28</span></div>
                <div class="stat-row"><span>Intelligence</span><span>35</span></div>
                <div class="stat-row"><span>Vitality</span><span>12</span></div>
            </div>
        </aside>

        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <!-- SVG Lines injected by JS -->
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected by JS -->
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data: Compact, Centered, Visible Tree ---
    // Layout strategy: Center Root (400, 150). 
    // 3 Branches fan out to ~Y=600.
    // Total Width ~800, Height ~700.
    
    const skills = [
        // Root
        { id: 'root', x: 400, y: 100, name: "Archon's Spark", type: "Core", desc: "The origin of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Tier 1
        { id: 'str1', x: 200, y: 250, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4 and weapon weight.", unlocked: true, req: 'root' },
        { id: 'int1', x: 400, y: 250, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", unlocked: true, req: 'root' },
        { id: 'dex1', x: 600, y: 250, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: false, req: 'root' },
        
        // Tier 2
        { id: 'str2', x: 100, y: 400, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: false, req: 'str1' },
        { id: 'str3', x: 300, y: 400, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back. +10% Armor.", unlocked: false, req: 'str1' },
        
        { id: 'int2', x: 350, y: 400, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: true, req: 'int1' },
        { id: 'int3', x: 450, y: 400, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        
        { id: 'dex2', x: 500, y: 400, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: false, req: 'dex1' },
        { id: 'dex3', x: 700, y: 400, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex1' },

        // Tier 3 (Endings)
        { id: 'hybrid', x: 400, y: 550, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows. Requires Dex & Int.", unlocked: false, req: 'dex2' },
        { id: 'hybrid2', x: 200, y: 550, name: "Blood Pact", type: "Ultimate", desc: "Heal for 5% of damage dealt.", unlocked: false, req: 'str3' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z", // Star
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z", // Lightning
        core: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z", // Globe/Core
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z" // Eye/Orb
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        // Set world dimensions based on data spread
        // X range approx 0 to 800, Y range 0 to 700
        world.style.width = '800px';
        world.style.height = '700px';

        // Center the world initially
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Center offsets
        const startX = (cw / 2) - (800 / 2);
        const startY = (ch / 2) - (700 / 2);
        
        // Initial Transform
        updateTransform(startX, startY, 1);

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            // Determine state class
            let stateClass = 'locked';
            if (skill.unlocked) stateClass = 'unlocked';
            else {
                const parent = skills.find(s => s.id === skill.req);
                if (parent && parent.unlocked) stateClass = 'available';
            }

            node.className = `node ${stateClass}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Determine Icon
            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.type === 'Core') iconPath = icons.core;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        // Draw Lines
        drawConnections();
    }

    function drawConnections() {
        svg.innerHTML = ''; // Clear
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        // Reset classes
        tooltip.classList.remove('locked', 'unlocked');

        if (skill.unlocked) {
            tooltip.classList.add('unlocked');
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
        }

        tooltip.classList.add('visible');
        positionTooltip(e.clientX, e.clientY);
    }

    function positionTooltip(x, y) {
        // Prevent off-screen
        const ttW = 260;
        const ttH = 150; // Approx
        const winW = window.innerWidth;
        const winH = window.innerHeight;

        let left = x + 20;
        let top = y - 20;

        if (left + ttW > winW) left = x - ttW - 20;
        if (top + ttH > winH) top = y - ttH;
        if (top < 0) top = 10;

        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        // Logic: If locked/available and has points, unlock it.
        // For demo, we just toggle if available.
        if (skill.unlocked) return; // Already unlocked

        const parent = skills.find(s => s.id === skill.req);
        if (parent && parent.unlocked) {
            skill.unlocked = true;
            updateVisuals();
        }
    }

    function updateVisuals() {
        // Update Nodes
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            el.classList.remove('unlocked', 'available', 'locked');
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) el.classList.add('available');
                else el.classList.add('locked');
            }
        });

        drawConnections();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0;
    let panY = 0;
    let scale = 1;

    function updateTransform(x, y, s) {
        panX = x;
        panY = y;
        scale = s;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        
        // Update tooltip pos if visible
        if (tooltip.classList.contains('visible')) {
            positionTooltip(e.clientX, e.clientY);
        }
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        // Zoom towards mouse pointer
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    // Handle window resize to keep centered if needed, 
    // though simple pan/zoom logic handles it mostly.
    window.addEventListener('resize', () => {
        // Optional: re-center logic here if desired
    });

    init();

</script>
