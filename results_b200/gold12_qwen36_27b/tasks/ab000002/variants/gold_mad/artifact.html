<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherial Ascent</title>
<style>
    :root {
        --bg-dark: #05070a;
        --bg-panel: rgba(8, 12, 18, 0.9);
        --border-dim: rgba(56, 70, 90, 0.2);
        --border-bright: rgba(100, 116, 139, 0.4);
        
        /* Palette: Amber (Power) & Blue (Arcane) */
        --accent-gold: #fbbf24;
        --accent-gold-dim: #b45309;
        --accent-blue: #38bdf8;
        --accent-blue-dim: #0369a1;
        
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        
        --node-size: 52px;
        --node-size-lg: 64px;
        
        --font-display: 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-dark);
        /* Subtle vignette and noise texture via CSS */
        background-image: 
            radial-gradient(circle at center, #11161f 0%, #05070a 100%);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Header --- */
    header {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 20;
        background: linear-gradient(to bottom, rgba(5,7,10,1) 0%, rgba(5,7,10,0) 100%);
    }

    .title-wrapper {
        text-align: center;
        position: relative;
        padding-bottom: 10px;
    }

    /* Decorative lines flanking title */
    .title-wrapper::before, .title-wrapper::after {
        content: '';
        position: absolute;
        bottom: 0;
        width: 60px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        opacity: 0.6;
    }
    .title-wrapper::before { left: 10%; }
    .title-wrapper::after { right: 10%; }

    h1 {
        font-family: var(--font-display);
        font-size: 1.8rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-main);
        margin: 0;
        text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .subtitle {
        font-size: 0.7rem;
        color: var(--accent-blue);
        letter-spacing: 0.4em;
        margin-top: 4px;
        text-transform: uppercase;
        opacity: 0.8;
    }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
    }

    /* --- Sidebar --- */
    aside {
        width: 300px;
        background: var(--bg-panel);
        border-right: 1px solid var(--border-dim);
        padding: 40px 30px;
        display: flex;
        flex-direction: column;
        gap: 40px;
        z-index: 10;
        box-shadow: 10px 0 40px rgba(0,0,0,0.6);
        backdrop-filter: blur(5px);
    }

    .stat-block {
        display: flex;
        flex-direction: column;
        gap: 12px;
        border-bottom: 1px solid var(--border-dim);
        padding-bottom: 25px;
    }
    
    .stat-block:last-child { border-bottom: none; margin-top: auto; }

    .level-display {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        margin-bottom: 10px;
    }

    .level-num {
        font-family: var(--font-display);
        font-size: 3.5rem;
        line-height: 0.8;
        color: var(--text-main);
        background: linear-gradient(to bottom, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .level-label {
        font-size: 0.9rem;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        margin-bottom: 8px;
    }

    /* XP Bar */
    .xp-container {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .xp-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--text-muted);
        font-family: var(--font-display);
    }

    .xp-bar-bg {
        height: 4px;
        background: #1e293b;
        border-radius: 2px;
        overflow: hidden;
        position: relative;
    }

    .xp-bar-fill {
        height: 100%;
        width: 65%;
        background: var(--accent-blue);
        box-shadow: 0 0 8px var(--accent-blue);
        position: relative;
    }
    
    /* Skill Points */
    .points-display {
        background: rgba(251, 191, 36, 0.05);
        border: 1px solid rgba(251, 191, 36, 0.2);
        padding: 20px;
        border-radius: 2px;
        text-align: center;
        position: relative;
    }
    
    /* Corner accents for points box */
    .points-display::before {
        content: ''; position: absolute; top: -1px; left: -1px; width: 8px; height: 8px;
        border-top: 2px solid var(--accent-gold); border-left: 2px solid var(--accent-gold);
    }
    .points-display::after {
        content: ''; position: absolute; bottom: -1px; right: -1px; width: 8px; height: 8px;
        border-bottom: 2px solid var(--accent-gold); border-right: 2px solid var(--accent-gold);
    }

    .points-val {
        font-size: 2.8rem;
        font-family: var(--font-display);
        color: var(--accent-gold);
        display: block;
        line-height: 1;
        text-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
    }

    .points-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-muted);
        margin-top: 5px;
        display: block;
    }

    /* Character Details */
    .char-name {
        font-size: 1.2rem;
        font-family: var(--font-display);
        color: var(--text-main);
        margin-bottom: 4px;
    }
    
    .char-class {
        color: var(--accent-blue);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 15px;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        font-size: 0.85rem;
        font-family: var(--font-display);
    }
    .stat-row span:first-child { color: var(--text-muted); }
    .stat-row span:last-child { color: var(--text-main); font-weight: bold; }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        /* Subtle grid background */
        background-image: 
            linear-gradient(var(--border-dim) 1px, transparent 1px),
            linear-gradient(90deg, var(--border-dim) 1px, transparent 1px);
        background-size: 40px 40px;
        background-position: center center;
    }

    .tree-container:active { cursor: grabbing; }

    /* The world that moves */
    .tree-world {
        position: absolute;
        top: 50%;
        left: 50%;
        /* Dimensions set in JS based on data, but CSS defaults help */
        width: 800px; 
        height: 800px;
        transform-origin: center center;
        will-change: transform;
    }

    /* SVG Connections */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    .connection-line {
        stroke: var(--border-dim);
        stroke-width: 2;
        fill: none;
        transition: stroke 0.5s ease, filter 0.5s ease;
    }

    .connection-line.active {
        stroke: var(--accent-gold);
        stroke-width: 2;
        filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.4));
    }
    
    .connection-line.arcane {
        stroke: var(--accent-blue-dim);
    }
    .connection-line.arcane.active {
        stroke: var(--accent-blue);
        filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4));
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transform: translate(-50%, -50%);
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Sizing classes */
    .node[data-tier="1"] { width: var(--node-size-lg); height: var(--node-size-lg); }
    .node[data-tier="2"] { width: var(--node-size); height: var(--node-size); }
    .node[data-tier="3"] { width: 40px; height: 40px; }
    .node[data-tier="4"] { width: 32px; height: 32px; }

    .node-shape {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        border: 1px solid var(--border-bright);
        box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        transition: all 0.3s ease;
    }

    /* Decorative rings */
    .node-shape::before {
        content: '';
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 1px solid transparent;
        transition: all 0.3s ease;
    }
    
    .node-shape::after {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.05);
    }

    .node-icon {
        width: 40%;
        height: 40%;
        fill: var(--text-muted);
        opacity: 0.4;
        transition: all 0.3s ease;
    }

    /* --- States --- */
    
    /* UNLOCKED (Active) */
    .node.unlocked .node-shape {
        border-color: var(--accent-gold);
        background: radial-gradient(circle at 30% 30%, #451a03, #0f172a);
        box-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
    }
    
    .node.unlocked .node-shape::before {
        border-color: rgba(251, 191, 36, 0.2);
    }

    .node.unlocked .node-icon {
        fill: var(--accent-gold);
        opacity: 1;
        filter: drop-shadow(0 0 2px rgba(251, 191, 36, 0.8));
    }

    /* AVAILABLE (Hoverable) */
    .node.available .node-shape {
        border-color: #cbd5e1;
    }
    
    .node.available:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }

    .node.available:hover .node-shape {
        border-color: var(--text-main);
        background: #1e293b;
        box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }
    
    .node.available:hover .node-icon {
        opacity: 0.8;
        fill: var(--text-main);
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid var(--border-bright);
        border-left: 3px solid var(--accent-gold);
        padding: 15px 20px;
        width: 260px;
        border-radius: 0 4px 4px 0;
        pointer-events: none;
        opacity: 0;
        transform: translateX(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        backdrop-filter: blur(8px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateX(0);
    }

    .tooltip h3 {
        color: var(--text-main);
        font-family: var(--font-display);
        margin-bottom: 4px;
        font-size: 1.1rem;
        letter-spacing: 0.05em;
    }

    .tooltip .type {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--accent-blue);
        margin-bottom: 10px;
        letter-spacing: 0.1em;
        font-weight: bold;
    }

    .tooltip p {
        font-size: 0.8rem;
        line-height: 1.5;
        color: #cbd5e1;
    }

    .tooltip .req {
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px solid rgba(255,255,255,0.1);
        font-size: 0.7rem;
        color: #ef4444;
        display: none;
        font-family: var(--font-display);
    }

    .tooltip.locked {
        border-left-color: var(--text-muted);
    }
    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-muted); }

    /* Animations */
    @keyframes pulse-ring {
        0% { transform: scale(0.9); opacity: 0.5; }
        50% { transform: scale(1.1); opacity: 0.2; }
        100% { transform: scale(0.9); opacity: 0.5; }
    }

    .node.unlocked .node-shape::after {
        animation: pulse-ring 3s infinite ease-in-out;
        border-color: rgba(251, 191, 36, 0.4);
    }

</style>
</head>
<body>

    <header>
        <div class="title-wrapper">
            <h1>Aetherial Ascent</h1>
            <div class="subtitle">Ascension Protocol: Omega</div>
        </div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="stat-block">
                <div class="level-display">
                    <span class="level-num">42</span>
                    <span class="level-label">Level</span>
                </div>
                <div class="xp-container">
                    <div class="xp-labels">
                        <span>Experience</span>
                        <span>12,450 / 20,000</span>
                    </div>
                    <div class="xp-bar-bg">
                        <div class="xp-bar-fill"></div>
                    </div>
                </div>
            </div>

            <div class="points-display">
                <span class="points-val">3</span>
                <span class="points-label">Skill Points</span>
            </div>

            <div class="stat-block">
                <h2 class="char-name">Kaelen Thorne</h2>
                <div class="char-class">Void Walker</div>
                <div class="stat-row"><span>Strength</span><span>14</span></div>
                <div class="stat-row"><span>Dexterity</span><span>28</span></div>
                <div class="stat-row"><span>Intelligence</span><span>35</span></div>
                <div class="stat-row"><span>Vitality</span><span>12</span></div>
            </div>
        </aside>

        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <!-- SVG Lines injected by JS -->
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected by JS -->
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data Structure: Constellation Layout ---
    // X: 0-1000 (Center 500), Y: 0-1000 (Root at 900, Top at 50)
    const skills = [
        // Root
        { id: 'root', x: 500, y: 900, tier: 1, name: "Archon's Spark", type: "Origin", desc: "The genesis of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Tier 1 Branches
        { id: 'str1', x: 250, y: 700, tier: 2, name: "Titan's Grip", type: "Physical", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'dex1', x: 500, y: 700, tier: 2, name: "Swift Foot", type: "Agility", desc: "Increases Movement Speed by 5%.", unlocked: true, req: 'root' },
        { id: 'int1', x: 750, y: 700, tier: 2, name: "Arcane Mind", type: "Magic", desc: "Increases Mana Regeneration by 10%.", unlocked: false, req: 'root' },
        
        // Tier 2 Expansion
        { id: 'str2', x: 100, y: 500, tier: 3, name: "Heavy Strike", type: "Physical", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str3', x: 300, y: 500, tier: 3, name: "Unstoppable", type: "Physical", desc: "Cannot be knocked back.", unlocked: false, req: 'str1' },
        
        { id: 'dex2', x: 350, y: 500, tier: 3, name: "Evasion", type: "Agility", desc: "10% chance to dodge attacks.", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 650, y: 500, tier: 3, name: "Backstab", type: "Agility", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex1' },
        
        { id: 'int2', x: 600, y: 500, tier: 3, name: "Fireball", type: "Magic", desc: "Launch a projectile of fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 900, y: 500, tier: 3, name: "Frost Nova", type: "Magic", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        
        // Tier 3 Convergence (Ultimate)
        { id: 'hybrid', x: 500, y: 300, tier: 4, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows.", unlocked: false, req: 'dex3' },
        { id: 'hybrid2', x: 200, y: 300, tier: 4, name: "Blood Pact", type: "Ultimate", desc: "Heal for 5% of damage dealt.", unlocked: false, req: 'str2' },
        { id: 'hybrid3', x: 800, y: 300, tier: 4, name: "Nova Blast", type: "Ultimate", desc: "Explode dealing massive magic damage.", unlocked: false, req: 'int3' },

        // Apex
        { id: 'apex', x: 500, y: 100, tier: 1, name: "Ascension", type: "Transcendence", desc: "You have reached the peak of power.", unlocked: false, req: 'hybrid' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        origin: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z", // Star
        physical: "M12 2L3 14h9l-1 8 10-12h-9l1-8z", // Lightning
        agility: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z", // Bolt
        magic: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z", // Circle
        ultimate: "M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z", // Shield
        transcendence: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" // Big Star
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        // Determine bounds to center the tree
        const xs = skills.map(s => s.x);
        const ys = skills.map(s => s.y);
        const minX = Math.min(...xs);
        const maxX = Math.max(...xs);
        const minY = Math.min(...ys);
        const maxY = Math.max(...ys);
        
        const treeWidth = maxX - minX + 100;
        const treeHeight = maxY - minY + 100;
        
        world.style.width = `${treeWidth}px`;
        world.style.height = `${treeHeight}px`;

        // Center the world initially
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Initial center transform
        world.style.transform = `translate(${cw/2 - treeWidth/2}px, ${ch/2 - treeHeight/2}px)`;

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;
            node.dataset.tier = skill.tier;

            // Determine Icon based on type
            let iconPath = icons.agility;
            if(skill.type === 'Origin') iconPath = icons.origin;
            if(skill.type === 'Physical') iconPath = icons.physical;
            if(skill.type === 'Magic') iconPath = icons.magic;
            if(skill.type === 'Ultimate' || skill.type === 'Transcendence') iconPath = icons.transcendence;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        // Draw Lines
        drawConnections();
    }

    function drawConnections() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    // Determine line style based on node type
                    if (skill.unlocked) {
                        line.classList.add('active');
                        if(skill.type === 'Magic' || skill.type === 'Transcendence') line.classList.add('arcane');
                    } else if (skill.type === 'Magic') {
                         line.classList.add('arcane');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        
        // Positioning logic to keep tooltip on screen
        let x = e.clientX + 20;
        let y = e.clientY - 20;
        
        if (x + 280 > window.innerWidth) x = e.clientX - 290;
        if (y + 150 > window.innerHeight) y = window.innerHeight - 160;

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        // Simple interaction logic
        if (!skill.unlocked) {
            const parent = skills.find(s => s.id === skill.req);
            if (parent && parent.unlocked) {
                // Simulate unlocking
                skill.unlocked = true;
                
                // Visual feedback
                const node = document.querySelector(`.node[data-id="${id}"]`);
                node.classList.add('unlocked');
                
                // Update lines
                drawConnections();
                
                // Update availability of children
                updateAvailability();
            }
        }
    }

    function updateAvailability() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            if (!s.unlocked) {
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) {
                    el.classList.add('available');
                } else {
                    el.classList.remove('available');
                }
            }
        });
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = container.clientWidth/2 - parseFloat(world.style.width)/2;
    let panY = container.clientHeight/2 - parseFloat(world.style.height)/2;
    let scale = 1;

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        // Zoom towards mouse pointer
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    // Run
    init();
    updateAvailability();

</script>
</body>
</html>
