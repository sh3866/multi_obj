<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #020203;
        --bg-radial: radial-gradient(circle at 50% 40%, #1a1525 0%, #050508 60%, #000000 100%);
        
        --gold-primary: #d4af37;
        --gold-bright: #ffe680;
        --gold-dim: #5e4b20;
        --gold-shadow: rgba(212, 175, 55, 0.4);
        
        --cyan-primary: #4fd1c5;
        --cyan-glow: rgba(79, 209, 197, 0.8);
        --cyan-dark: #234e52;
        
        --stone-dark: #1a1a20;
        --stone-light: #2a2a35;
        --stone-texture: #111115;
        
        --text-main: #e2e2e8;
        --text-muted: #888899;
        
        --font-display: "Cinzel", "Palatino Linotype", "Book Antiqua", Palatino, serif;
        --font-body: "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background: var(--bg-deep);
        background-image: var(--bg-radial);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* --- Background Layers --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
    }

    /* Noise Texture */
    .noise-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.07;
        z-index: 2;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Vignette */
    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, transparent 50%, #000 100%);
        z-index: 3;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1200px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 0;
        justify-content: space-between;
    }

    /* --- Header: Integrated Currency --- */
    header {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 1.5rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 20;
    }

    .logo-small {
        font-family: var(--font-display);
        color: var(--gold-primary);
        font-size: 1.2rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-shadow: 0 0 10px var(--gold-shadow);
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .logo-small svg {
        width: 24px;
        height: 24px;
        fill: var(--gold-primary);
    }

    .currency-container {
        background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(10,10,15,0.8) 50%, rgba(0,0,0,0) 100%);
        padding: 0.5rem 2rem;
        display: flex;
        align-items: center;
        gap: 15px;
        border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        position: relative;
    }

    /* Decorative corners for currency */
    .currency-container::before, .currency-container::after {
        content: '';
        position: absolute;
        bottom: -1px;
        width: 10px;
        height: 10px;
        border: 1px solid var(--gold-dim);
        transition: all 0.3s ease;
    }
    .currency-container::before { left: 0; border-right: none; border-top: none; }
    .currency-container::after { right: 0; border-left: none; border-top: none; }

    .currency-pill {
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        transition: transform 0.2s;
    }
    
    .currency-pill:hover {
        transform: scale(1.02);
    }

    .coin-icon {
        width: 36px;
        height: 36px;
        filter: drop-shadow(0 0 8px var(--gold-dim));
        animation: pulse-gold 3s infinite ease-in-out;
    }

    .currency-amount {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.5rem;
        color: var(--gold-bright);
        text-shadow: 0 2px 4px rgba(0,0,0,1);
        letter-spacing: 0.05em;
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        margin-top: -2rem; /* Pull up slightly to balance header */
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 5.5rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        margin-bottom: 0.2rem;
        background: linear-gradient(to bottom, #ffffff 20%, var(--gold-primary) 80%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
        position: relative;
        z-index: 12;
        line-height: 0.9;
        margin-top: 2rem;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 1.1rem;
        color: var(--cyan-primary);
        letter-spacing: 0.8em;
        text-transform: uppercase;
        margin-bottom: 1rem;
        opacity: 0.9;
        text-shadow: 0 0 15px var(--cyan-glow);
        z-index: 12;
        font-weight: 300;
    }

    /* --- The Vortex Hero (Revised) --- */
    .vortex-container {
        position: relative;
        width: 360px;
        height: 360px;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1200px;
        margin-bottom: 2rem;
        /* Inner glow container */
        box-shadow: 0 0 100px rgba(79, 209, 197, 0.1);
        border-radius: 50%;
    }

    /* The Spirit Silhouette */
    .spirit-entity {
        width: 100px;
        height: 160px;
        background: radial-gradient(ellipse at center, rgba(255,255,255,0.9) 0%, rgba(79, 209, 197, 0.4) 40%, transparent 70%);
        filter: blur(20px);
        border-radius: 50%;
        opacity: 0.7;
        animation: breathe 5s ease-in-out infinite;
        position: absolute;
        z-index: 5;
        top: 50px;
    }
    
    .spirit-core {
        width: 4px;
        height: 4px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 40px 15px var(--cyan-primary), 0 0 80px 30px var(--cyan-dark);
        position: absolute;
        z-index: 6;
        top: 100px;
        animation: pulse-core 2s infinite alternate;
    }

    /* Procedural Rune Circle */
    .rune-svg {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 6;
        animation: spin-slow 80s linear infinite;
        filter: drop-shadow(0 0 10px var(--gold-dim));
    }
    
    .rune-inner-svg {
        width: 85%;
        height: 85%;
        position: absolute;
        top: 7.5%;
        left: 7.5%;
        z-index: 7;
        animation: spin-reverse 50s linear infinite;
        filter: drop-shadow(0 0 5px var(--cyan-primary));
    }

    /* --- Menu Grid (Revised Artifact Cards) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 1000px;
        margin: 0 auto 3rem auto;
        padding: 0 2rem;
        position: relative;
        z-index: 20;
    }

    /* Artifact Button Base */
    .menu-card {
        position: relative;
        height: 160px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        transform-style: preserve-3d;
    }

    /* The Stone/Metal Panel Shape */
    .card-face {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #2c2c36 0%, #15151a 100%);
        /* Chiseled Shape */
        clip-path: polygon(
            10% 0, 90% 0, 
            100% 10%, 100% 90%, 
            90% 100%, 10% 100%, 
            0 90%, 0 10%
        );
        border: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 0 20px #000;
        transition: all 0.4s ease;
    }

    /* Metallic Border Overlay */
    .card-face::after {
        content: '';
        position: absolute;
        inset: 4px;
        border: 1px solid rgba(255,255,255,0.1);
        clip-path: inherit;
        pointer-events: none;
    }

    /* Hover State for Standard Cards */
    .menu-card:hover .card-face {
        transform: translateY(-5px);
        background: linear-gradient(180deg, #353542 0%, #1a1a22 100%);
        border-color: rgba(255,255,255,0.2);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.05);
    }

    /* Card Icons */
    .card-icon {
        width: 48px;
        height: 48px;
        fill: var(--text-muted);
        transition: all 0.3s ease;
        position: relative;
        z-index: 2;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }

    .menu-card:hover .card-icon {
        fill: var(--text-main);
        transform: scale(1.1);
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4));
    }

    .card-label {
        font-family: var(--font-display);
        font-size: 1rem;
        color: var(--text-main);
        letter-spacing: 0.2em;
        font-weight: 600;
        text-transform: uppercase;
        position: relative;
        z-index: 2;
        text-shadow: 0 2px 2px #000;
    }

    /* --- Summon Card (Special Artifact) --- */
    .menu-card.summon .card-face {
        background: linear-gradient(135deg, #3d3210 0%, #1a1505 100%);
        border: 1px solid var(--gold-dim);
        box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 15px rgba(212, 175, 55, 0.1);
    }
    
    .menu-card.summon .card-face::after {
        border-color: var(--gold-dim);
    }

    /* Runic decorations for Summon */
    .summon-rune {
        position: absolute;
        width: 100%; height: 100%;
        top: 0; left: 0;
        clip-path: inherit;
        pointer-events: none;
        opacity: 0.3;
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 10 L20 20 M80 10 L70 20 M10 90 L20 80 M80 90 L70 80' stroke='%23d4af37' stroke-width='1' fill='none'/%3E%3C/svg%3E");
    }

    .menu-card.summon .card-icon {
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 8px var(--gold-dim));
    }
    
    .menu-card.summon:hover .card-face {
        background: linear-gradient(135deg, #4d4218 0%, #241e0a 100%);
        box-shadow: 0 0 40px var(--gold-shadow), inset 0 0 20px rgba(212, 175, 55, 0.2);
        border-color: var(--gold-bright);
    }
    
    .menu-card.summon:hover .card-icon {
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 15px var(--gold-primary));
        animation: float-icon 2s infinite ease-in-out;
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.7rem;
        opacity: 0.5;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-top: auto;
        padding-bottom: 1.5rem;
        z-index: 10;
    }

    /* --- Animations --- */
    @keyframes breathe {
        0%, 100% { transform: scale(1) translateY(0); opacity: 0.6; }
        50% { transform: scale(1.15) translateY(-15px); opacity: 0.9; }
    }

    @keyframes pulse-core {
        0% { box-shadow: 0 0 30px 10px var(--cyan-primary); opacity: 0.8; }
        100% { box-shadow: 0 0 50px 20px var(--cyan-primary); opacity: 1; }
    }

    @keyframes pulse-gold {
        0%, 100% { filter: drop-shadow(0 0 5px var(--gold-dim)); }
        50% { filter: drop-shadow(0 0 12px var(--gold-primary)); }
    }

    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }
    
    @keyframes float-icon {
        0%, 100% { transform: translateY(0) scale(1.1); }
        50% { transform: translateY(-5px) scale(1.1); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 3.5rem; }
        .game-subtitle { font-size: 0.9rem; letter-spacing: 0.4em; }
        .menu-grid { grid-template-columns: 1fr 1fr; gap: 1rem; padding: 0 1rem; }
        .menu-card { height: 140px; }
        .vortex-container { width: 280px; height: 280px; }
        .currency-container { padding: 0.5rem 1rem; }
        .logo-small { display: none; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="noise-overlay"></div>
    <div class="vignette"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="logo-small">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 4l6 14H6l6-14z"/></svg>
                <span>Aetherbound</span>
            </div>
            
            <div class="currency-container">
                <div class="currency-pill">
                    <!-- Custom Gold Coin Icon -->
                    <svg class="coin-icon" viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#fff5cc;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#8a762e;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="45" fill="url(#goldGrad)" stroke="#3e300b" stroke-width="2"/>
                        <circle cx="50" cy="50" r="38" fill="none" stroke="#3e300b" stroke-width="2" stroke-dasharray="5 5"/>
                        <path d="M50 25 L50 75 M35 40 L65 40 M35 60 L65 60" stroke="#5e4b20" stroke-width="5" stroke-linecap="round"/>
                    </svg>
                    <span class="currency-amount">12,450</span>
                </div>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <div class="vortex-container">
                <!-- The Spirit Silhouette -->
                <div class="spirit-entity"></div>
                <div class="spirit-core"></div>
                
                <!-- Outer Rune Circle (More detailed) -->
                <svg class="rune-svg" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="runeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:var(--gold-dim);stop-opacity:0.5" />
                            <stop offset="50%" style="stop-color:var(--gold-primary);stop-opacity:1" />
                            <stop offset="100%" style="stop-color:var(--gold-dim);stop-opacity:0.5" />
                        </linearGradient>
                    </defs>
                    
                    <!-- Outer Ring -->
                    <circle cx="100" cy="100" r="95" stroke="url(#runeGrad)" stroke-width="1.5" fill="none" stroke-dasharray="1 8"/>
                    <circle cx="100" cy="100" r="90" stroke="var(--gold-dim)" stroke-width="0.5" fill="none" opacity="0.5"/>
                    
                    <!-- Decorative Nodes -->
                    <g fill="var(--gold-bright)">
                        <circle cx="100" cy="5" r="3" />
                        <circle cx="100" cy="195" r="3" />
                        <circle cx="5" cy="100" r="3" />
                        <circle cx="195" cy="100" r="3" />
                    </g>
                </svg>

                <!-- Inner Rune Circle -->
                <svg class="rune-inner-svg" viewBox="0 0 200 200">
                     <circle cx="100" cy="100" r="80" stroke="var(--cyan-primary)" stroke-width="2" fill="none" stroke-dasharray="15 25 5 25" opacity="0.6"/>
                     
                     <!-- Rune Symbols -->
                    <g stroke="var(--cyan-bright)" stroke-width="2" fill="none" opacity="0.8">
                        <!-- North -->
                        <path d="M100 15 L100 35 M90 25 L110 25" stroke="var(--cyan-primary)"/>
                        <!-- South -->
                        <path d="M100 185 L100 165 M90 175 L110 175" stroke="var(--cyan-primary)"/>
                        <!-- East -->
                        <path d="M185 100 L165 100 M175 90 L175 110" stroke="var(--cyan-primary)"/>
                        <!-- West -->
                        <path d="M15 100 L35 100 M25 90 L25 110" stroke="var(--cyan-primary)"/>
                        
                        <!-- Hexagon Connectors -->
                        <path d="M100 20 L169 60 L169 140 L100 180 L31 140 L31 60 Z" stroke="var(--cyan-primary)" stroke-width="1" fill="none" opacity="0.3"/>
                    </g>
                </svg>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <div class="card-face">
                    <div class="summon-rune"></div>
                    <!-- Icon: Crystal/Orb -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12 2L4 14l8 8 8-8-8-12z" fill="currentColor"/>
                        <path d="M12 2v20" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
                        <path d="M4 14l8-4 8 4" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                        <circle cx="12" cy="12" r="2" fill="#fff"/>
                    </svg>
                    <span class="card-label">Summon</span>
                </div>
            </div>

            <!-- Roster -->
            <div class="menu-card" onclick="interact('Roster')">
                <div class="card-face">
                    <!-- Icon: Crest/Scroll -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M16 3H8a2 2 0 00-2 2v14a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2z" fill="none" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M12 7v10M8 11h8M8 15h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span class="card-label">Roster</span>
                </div>
            </div>

            <!-- Battle -->
            <div class="menu-card" onclick="interact('Battle')">
                <div class="card-face">
                    <!-- Icon: Crossed Swords -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M14.5 13.5L3 22l4-1 6.5-7.5z" fill="currentColor"/>
                        <path d="M19 15l-4-4-2 2 4 4 2-2z" fill="currentColor" opacity="0.7"/>
                        <path d="M10 10l7-7 2 2-7 7-2-2z" fill="currentColor"/>
                    </svg>
                    <span class="card-label">Battle</span>
                </div>
            </div>

            <!-- Grind -->
            <div class="menu-card" onclick="interact('Grind')">
                <div class="card-face">
                    <!-- Icon: Anvil/Forge -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M2 20h20v2H2v-2zm2-4h16l-2-8H6l-2 8zm4-8h8l-1-4h-6l-1 4z" fill="currentColor"/>
                        <circle cx="12" cy="12" r="2" fill="rgba(255,100,50,0.8)"/>
                    </svg>
                    <span class="card-label">Grind</span>
                </div>
            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline Mode
        </footer>
    </div>

<script>
    // --- Enhanced Background Particle System (Embers & Aether) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    
    // Configuration
    const config = {
        particleCount: 80,
        speed: 0.3
    };

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        initParticles();
    }

    class Particle {
        constructor() {
            this.reset();
            this.y = Math.random() * height;
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 50;
            this.vx = (Math.random() - 0.5) * config.speed;
            this.vy = -(Math.random() * config.speed + 0.1); 
            this.size = Math.random() * 2 + 0.5;
            this.life = 0;
            this.maxLife = Math.random() * 400 + 100;
            
            // Mix of Gold and Cyan
            const isGold = Math.random() > 0.7;
            this.color = isGold ? {r: 212, g: 175, b: 55} : {r: 79, g: 209, b: 197};
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life++;

            // Sine wave drift
            this.x += Math.sin(this.life * 0.01) * 0.3;

            if (this.life >= this.maxLife || this.y < -20) {
                this.reset();
            }
        }

        draw() {
            const opacity = Math.sin((this.life / this.maxLife) * Math.PI);
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${opacity * 0.8})`;
            ctx.shadowBlur = 10;
            ctx.shadowColor = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.8)`;
            ctx.fill();
            ctx.shadowBlur = 0; 
        }
    }

    function initParticles() {
        particles = [];
        // Density based on screen size
        const count = Math.floor((width * height) / 12000);
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', resize);

    function interact(action) {
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.98)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    animate();

</script>
