<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #050508;
        --bg-gradient: radial-gradient(circle at 50% 30%, #1a1525 0%, #050508 100%);
        
        /* Colors */
        --gold-primary: #d4af37;
        --gold-bright: #fff5cc;
        --gold-dim: #5e4b20;
        --gold-shadow: rgba(212, 175, 55, 0.2);
        
        --cyan-primary: #4fd1c5;
        --cyan-glow: rgba(79, 209, 197, 0.6);
        
        --text-main: #e2e2e8;
        --text-muted: #888899;
        
        /* Typography */
        --font-display: "Cinzel", "Palatino Linotype", "Book Antiqua", Palatino, serif;
        --font-body: "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background: var(--bg-deep);
        background-image: var(--bg-gradient);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* --- Background Layers --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        opacity: 0.6; /* Dimmed to let content pop */
    }

    /* Noise Texture Overlay */
    .noise-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.05;
        z-index: 2;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Atmospheric Fog */
    .fog-layer {
        position: absolute;
        width: 200%;
        height: 200%;
        top: -50%;
        left: -50%;
        background: radial-gradient(circle at center, transparent 0%, var(--bg-deep) 70%);
        z-index: 3;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1100px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem;
        justify-content: space-between;
    }

    /* --- Top Navigation --- */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding-top: 1rem;
    }

    .currency-pill {
        background: linear-gradient(90deg, rgba(20,20,25,0.9), rgba(10,10,15,0.95));
        border: 1px solid var(--gold-dim);
        border-left: 3px solid var(--gold-primary);
        border-radius: 0 8px 8px 0;
        padding: 0.6rem 1.5rem 0.6rem 1rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        position: relative;
        transition: transform 0.2s;
    }
    
    .currency-pill:hover {
        transform: translateX(-2px);
    }

    /* Gold coin styling */
    .coin-icon {
        width: 32px;
        height: 32px;
        filter: drop-shadow(0 0 5px var(--gold-dim));
    }

    .currency-amount {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.4rem;
        color: var(--gold-bright);
        text-shadow: 0 2px 4px rgba(0,0,0,1);
        letter-spacing: 0.05em;
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        margin-bottom: 2rem;
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 5rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 0.2rem;
        background: linear-gradient(to bottom, #ffffff 20%, var(--gold-primary) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3));
        position: relative;
        z-index: 12;
        line-height: 1;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 1.2rem;
        color: var(--cyan-primary);
        letter-spacing: 0.6em;
        text-transform: uppercase;
        margin-bottom: 3rem;
        opacity: 0.9;
        text-shadow: 0 0 15px var(--cyan-glow);
        z-index: 12;
        font-weight: 300;
    }

    /* --- The Vortex Hero --- */
    .vortex-container {
        position: relative;
        width: 320px;
        height: 320px;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
        margin-bottom: 2rem;
    }

    /* The Spirit Silhouette (CSS Shape) */
    .spirit-entity {
        width: 80px;
        height: 140px;
        background: linear-gradient(to bottom, #fff, var(--cyan-primary));
        filter: blur(15px);
        border-radius: 50% 50% 40% 40%;
        opacity: 0.5;
        animation: breathe 4s ease-in-out infinite;
        position: absolute;
        z-index: 5;
        top: 40px;
    }
    
    .spirit-core {
        width: 10px;
        height: 10px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 30px 10px var(--cyan-primary);
        position: absolute;
        z-index: 6;
        top: 90px;
        opacity: 0.8;
    }

    /* Procedural Rune Circle */
    .rune-svg {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 6;
        animation: spin-slow 60s linear infinite;
    }
    
    .rune-inner-svg {
        width: 80%;
        height: 80%;
        position: absolute;
        top: 10%;
        left: 10%;
        z-index: 7;
        animation: spin-reverse 40s linear infinite;
    }

    /* --- Menu Grid --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2rem;
        width: 100%;
        margin-bottom: 2rem;
        position: relative;
        z-index: 20;
    }

    /* Redesigned Cards: Stone/Parchment */
    .menu-card {
        position: relative;
        /* Complex shape for tablet look */
        clip-path: polygon(
            15% 0, 85% 0, 
            100% 15%, 100% 85%, 
            85% 100%, 15% 100%, 
            0 85%, 0 15%
        );
        background: linear-gradient(180deg, #2a2a35 0%, #15151c 100%);
        padding: 2.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        border: 1px solid rgba(255,255,255,0.05);
    }
    
    /* Inner decorative border */
    .menu-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.2) 100%);
        clip-path: inherit;
        z-index: 1;
        pointer-events: none;
    }

    .menu-card:hover {
        transform: translateY(-10px);
        background: linear-gradient(180deg, #353545 0%, #1a1a24 100%);
        box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    /* Card Icons */
    .card-icon {
        width: 50px;
        height: 50px;
        fill: var(--text-muted);
        transition: all 0.3s ease;
        position: relative;
        z-index: 2;
    }

    .menu-card:hover .card-icon {
        fill: var(--text-main);
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
        transform: scale(1.1);
    }

    .card-label {
        font-family: var(--font-display);
        font-size: 1.1rem;
        color: var(--text-main);
        letter-spacing: 0.15em;
        font-weight: 600;
        text-transform: uppercase;
        position: relative;
        z-index: 2;
    }

    /* Special Summon Card */
    .menu-card.summon {
        background: linear-gradient(180deg, #3d3210 0%, #1a1505 100%);
        border: 1px solid var(--gold-dim);
        box-shadow: 0 0 15px var(--gold-shadow);
    }
    
    .menu-card.summon .card-icon {
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 5px var(--gold-dim));
    }
    
    .menu-card.summon:hover {
        background: linear-gradient(180deg, #4d4218 0%, #241e0a 100%);
        box-shadow: 0 0 30px var(--gold-shadow);
        border-color: var(--gold-primary);
    }
    
    .menu-card.summon:hover .card-icon {
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 10px var(--gold-primary));
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.7rem;
        opacity: 0.4;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-top: auto;
        padding-bottom: 1rem;
    }

    /* --- Animations --- */
    @keyframes breathe {
        0%, 100% { transform: scale(1) translateY(0); opacity: 0.5; }
        50% { transform: scale(1.1) translateY(-10px); opacity: 0.8; }
    }

    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 3rem; }
        .game-subtitle { font-size: 0.9rem; letter-spacing: 0.3em; }
        .menu-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
        .vortex-container { width: 250px; height: 250px; }
        .app-container { padding: 1rem; }
        .currency-pill { padding: 0.4rem 1rem; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="noise-overlay"></div>
    <div class="fog-layer"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <!-- Custom Gold Coin Icon -->
                <svg class="coin-icon" viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#fff5cc;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#8a762e;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <circle cx="50" cy="50" r="45" fill="url(#goldGrad)" stroke="#5e4b20" stroke-width="3"/>
                    <circle cx="50" cy="50" r="38" fill="none" stroke="#5e4b20" stroke-width="1" stroke-dasharray="4 2"/>
                    <path d="M50 25 L50 75 M35 40 L65 40 M35 60 L65 60" stroke="#5e4b20" stroke-width="4" stroke-linecap="round"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <div class="vortex-container">
                <!-- The Spirit Silhouette -->
                <div class="spirit-entity"></div>
                <div class="spirit-core"></div>
                
                <!-- Outer Rune Circle -->
                <svg class="rune-svg" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="runeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:var(--gold-dim);stop-opacity:0.2" />
                            <stop offset="50%" style="stop-color:var(--gold-primary);stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:var(--gold-dim);stop-opacity:0.2" />
                        </linearGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    
                    <!-- Outer Ring -->
                    <circle cx="100" cy="100" r="95" stroke="url(#runeGrad)" stroke-width="1" fill="none" stroke-dasharray="2 6" filter="url(#glow)"/>
                    
                    <!-- Decorative Nodes -->
                    <g fill="var(--gold-primary)" opacity="0.8">
                        <circle cx="100" cy="5" r="2" />
                        <circle cx="100" cy="195" r="2" />
                        <circle cx="5" cy="100" r="2" />
                        <circle cx="195" cy="100" r="2" />
                    </g>
                </svg>

                <!-- Inner Rune Circle -->
                <svg class="rune-inner-svg" viewBox="0 0 200 200">
                     <circle cx="100" cy="100" r="85" stroke="var(--cyan-primary)" stroke-width="1" fill="none" stroke-dasharray="10 20 5 20" opacity="0.4" filter="url(#glow)"/>
                     
                     <!-- Rune Symbols (Geometric approximation) -->
                    <g stroke="var(--cyan-primary)" stroke-width="1.5" fill="none" opacity="0.6">
                        <!-- North Rune -->
                        <path d="M100 20 L100 40 M90 30 L110 30" />
                        <!-- South Rune -->
                        <path d="M100 180 L100 160 M90 170 L110 170" />
                        <!-- East Rune -->
                        <path d="M180 100 L160 100 M170 90 L170 110" />
                        <!-- West Rune -->
                        <path d="M20 100 L40 100 M30 90 L30 110" />
                        
                        <!-- Hexagon Connectors -->
                        <path d="M100 15 L173 57.5 L173 142.5 L100 185 L27 142.5 L27 57.5 Z" stroke="var(--gold-dim)" stroke-width="0.5" fill="none" opacity="0.3"/>
                    </g>
                </svg>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <!-- Icon: Crystal/Orb -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L4 14l8 8 8-8-8-12z" fill="currentColor"/>
                    <path d="M12 2v20" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
                    <path d="M4 14l8-4 8 4" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                    <circle cx="12" cy="12" r="2" fill="#fff" filter="url(#glow)"/>
                </svg>
                <span class="card-label">Summon</span>
            </div>

            <!-- Roster -->
            <div class="menu-card" onclick="interact('Roster')">
                <!-- Icon: Crest/Scroll -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 3H8a2 2 0 00-2 2v14a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2z" fill="none" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M12 7v10M8 11h8M8 15h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M12 3v18" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.5"/>
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card" onclick="interact('Battle')">
                <!-- Icon: Crossed Swords -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.5 13.5L3 22l4-1 6.5-7.5z" fill="currentColor"/>
                    <path d="M19 15l-4-4-2 2 4 4 2-2z" fill="currentColor" opacity="0.7"/>
                    <path d="M10 10l7-7 2 2-7 7-2-2z" fill="currentColor"/>
                    <path d="M2 22l4-4" stroke="currentColor" stroke-width="1"/>
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card" onclick="interact('Grind')">
                <!-- Icon: Anvil/Forge -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M2 20h20v2H2v-2zm2-4h16l-2-8H6l-2 8zm4-8h8l-1-4h-6l-1 4z" fill="currentColor"/>
                    <path d="M12 4v4" stroke="rgba(0,0,0,0.3)" stroke-width="2"/>
                    <circle cx="12" cy="12" r="2" fill="rgba(255,100,50,0.8)"/>
                </svg>
                <span class="card-label">Grind</span>
            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline Mode
        </footer>
    </div>

<script>
    // --- Enhanced Background Particle System ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    
    // Configuration for "swirling aether" look
    const config = {
        particleCount: 100,
        connectionDistance: 120,
        speed: 0.2
    };

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        initParticles();
    }

    class Particle {
        constructor() {
            this.reset();
            this.y = Math.random() * height;
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 20;
            this.vx = (Math.random() - 0.5) * config.speed;
            this.vy = -(Math.random() * config.speed + 0.1); 
            this.size = Math.random() * 1.5;
            this.life = 0;
            this.maxLife = Math.random() * 300 + 100;
            // Mix of Gold and Cyan
            const isGold = Math.random() > 0.6;
            this.color = isGold ? {r: 212, g: 175, b: 55} : {r: 79, g: 209, b: 197};
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life++;

            // Sine wave drift for "swirling" effect
            this.x += Math.sin(this.life * 0.01) * 0.2;

            if (this.life >= this.maxLife || this.y < -10) {
                this.reset();
            }
        }

        draw() {
            const opacity = Math.sin((this.life / this.maxLife) * Math.PI);
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${opacity * 0.8})`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.5)`;
            ctx.fill();
            ctx.shadowBlur = 0; 
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 15000);
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        // Draw connections
        ctx.lineWidth = 0.5;
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
            
            // Only check a subset of particles for connections to save performance
            if (i % 2 === 0) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distSq = dx*dx + dy*dy;
                    const limitSq = config.connectionDistance * config.connectionDistance;

                    if (distSq < limitSq) {
                        const dist = Math.sqrt(distSq);
                        const opacity = 1 - (dist / config.connectionDistance);
                        
                        ctx.strokeStyle = `rgba(212, 175, 55, ${opacity * 0.1})`;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', resize);

    function interact(action) {
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.96)';
        
        // Add a temporary glow effect
        const originalBorder = btn.style.borderColor;
        btn.style.borderColor = 'var(--gold-bright)';
        
        setTimeout(() => {
            btn.style.transform = '';
            btn.style.borderColor = originalBorder;
        }, 150);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    animate();

</script>
</body>
</html>
