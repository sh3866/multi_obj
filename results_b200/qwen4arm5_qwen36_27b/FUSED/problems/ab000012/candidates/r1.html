<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #0a0a12;
        --bg-gradient: radial-gradient(circle at 50% 30%, #1a1525 0%, #050508 100%);
        --gold-primary: #cfb53b;
        --gold-bright: #ffe066;
        --gold-dim: #8a762e;
        --accent-cyan: #4fd1c5;
        --text-main: #f0f0f5;
        --text-muted: #888899;
        
        /* Fonts */
        --font-display: "Cinzel Decorative", "Palatino Linotype", "Book Antiqua", Palatino, serif;
        --font-body: "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background: var(--bg-deep);
        background-image: var(--bg-gradient);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* --- Background Layers --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    /* Noise Texture Overlay */
    .noise-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.07;
        z-index: 2;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Vignette */
    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, transparent 40%, #000000 120%);
        z-index: 3;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem;
    }

    /* --- Top Navigation --- */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding-bottom: 1.5rem;
        position: relative;
    }

    /* Decorative line connecting header to background */
    header::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 10%;
        right: 10%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 224, 102, 0.2), transparent);
    }

    .currency-pill {
        background: rgba(20, 20, 25, 0.7);
        border: 1px solid var(--gold-dim);
        border-right: 4px solid var(--gold-dim);
        border-radius: 4px 0 0 4px;
        padding: 0.5rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        backdrop-filter: blur(4px);
        position: relative;
    }

    /* Gold coin styling */
    .coin-icon {
        width: 28px;
        height: 28px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 4px var(--gold-dim));
    }

    .currency-amount {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.3rem;
        color: var(--gold-bright);
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        padding-bottom: 2rem;
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 4rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.5rem;
        background: linear-gradient(to bottom, #ffffff 0%, var(--gold-primary) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));
        position: relative;
        z-index: 12;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 1.1rem;
        color: var(--accent-cyan);
        letter-spacing: 0.4em;
        text-transform: uppercase;
        margin-bottom: 2rem;
        opacity: 0.9;
        text-shadow: 0 0 10px rgba(79, 209, 197, 0.4);
        z-index: 12;
    }

    /* The Summoning Circle (CSS/SVG Hybrid) */
    .rune-circle-container {
        position: relative;
        width: 280px;
        height: 280px;
        margin-bottom: 2rem;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
    }

    /* The Spirit Silhouette (CSS Shape) */
    .spirit-entity {
        width: 100px;
        height: 160px;
        background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(79, 209, 197, 0.4));
        filter: blur(20px);
        border-radius: 50% 50% 40% 40%;
        opacity: 0.6;
        animation: breathe 4s ease-in-out infinite;
        position: absolute;
        z-index: 5;
        top: 20px;
    }

    .rune-svg {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 6;
        animation: spin-slow 40s linear infinite;
    }

    /* --- Menu Grid --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        margin-bottom: 2rem;
        position: relative;
        z-index: 20;
    }

    /* Redesigned Cards: Ornate & Textured */
    .menu-card {
        position: relative;
        background: linear-gradient(180deg, rgba(30,30,40,0.8) 0%, rgba(10,10,15,0.9) 100%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        /* Distinct Shape: Top corners pointed */
        clip-path: polygon(
            10% 0, 90% 0, 
            100% 10%, 100% 90%, 
            90% 100%, 10% 100%, 
            0 90%, 0 10%
        );
        padding: 2rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        overflow: hidden;
    }

    /* Inner Gold Border Illusion */
    .menu-card::after {
        content: '';
        position: absolute;
        inset: 4px;
        border: 1px solid rgba(207, 181, 59, 0.1);
        clip-path: inherit;
        pointer-events: none;
        transition: border-color 0.3s;
    }

    .menu-card:hover {
        transform: translateY(-5px) scale(1.02);
        background: linear-gradient(180deg, rgba(40,40,55,0.9) 0%, rgba(15,15,25,0.95) 100%);
        border-color: rgba(207, 181, 59, 0.3);
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    .menu-card:hover::after {
        border-color: rgba(207, 181, 59, 0.6);
    }

    /* Card Icons */
    .card-icon {
        width: 44px;
        height: 44px;
        fill: var(--text-muted);
        transition: all 0.3s ease;
        position: relative;
    }

    .menu-card:hover .card-icon {
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 10px rgba(207, 181, 59, 0.4));
        transform: scale(1.1);
    }

    .card-label {
        font-family: var(--font-display);
        font-size: 1rem;
        color: var(--text-main);
        letter-spacing: 0.1em;
        font-weight: 600;
        text-transform: uppercase;
    }

    /* Special Summon Card */
    .menu-card.summon {
        background: linear-gradient(180deg, rgba(60, 50, 20, 0.4) 0%, rgba(20, 15, 5, 0.9) 100%);
        border: 1px solid var(--gold-dim);
    }
    
    .menu-card.summon .card-icon {
        fill: var(--gold-primary);
    }
    
    .menu-card.summon:hover {
        box-shadow: 0 0 30px rgba(207, 181, 59, 0.15);
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.75rem;
        opacity: 0.5;
        letter-spacing: 0.1em;
        text-transform: uppercase;
    }

    /* --- Animations --- */
    @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.05); opacity: 0.8; }
    }

    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 2.8rem; }
        .menu-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
        .rune-circle-container { width: 220px; height: 220px; }
        .app-container { padding: 1rem; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="noise-overlay"></div>
    <div class="vignette"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                    <path d="M11 7h2v2h-2zm0 4h2v6h-2z"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <div class="rune-circle-container">
                <!-- The Spirit Silhouette -->
                <div class="spirit-entity"></div>
                
                <!-- Procedural Rune Circle -->
                <svg class="rune-svg" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="runeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:var(--gold-dim);stop-opacity:0.2" />
                            <stop offset="50%" style="stop-color:var(--gold-primary);stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:var(--gold-dim);stop-opacity:0.2" />
                        </linearGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    
                    <!-- Outer Ring -->
                    <circle cx="100" cy="100" r="90" stroke="url(#runeGrad)" stroke-width="1" fill="none" stroke-dasharray="4 8" filter="url(#glow)"/>
                    
                    <!-- Inner Ring (Counter-rotating via JS or separate class) -->
                    <circle cx="100" cy="100" r="80" stroke="var(--accent-cyan)" stroke-width="0.5" fill="none" opacity="0.4">
                        <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="60s" repeatCount="indefinite" />
                    </circle>

                    <!-- Rune Symbols (Geometric approximation) -->
                    <g stroke="var(--gold-primary)" stroke-width="1.5" fill="none" opacity="0.8">
                        <!-- North -->
                        <path d="M100 10 L100 25 M95 18 L105 18" />
                        <!-- South -->
                        <path d="M100 190 L100 175 M95 182 L105 182" />
                        <!-- East -->
                        <path d="M190 100 L175 100 M182 95 L182 105" />
                        <!-- West -->
                        <path d="M10 100 L25 100 M18 95 L18 105" />
                        
                        <!-- Diagonal Arcs -->
                        <path d="M40 40 Q100 100 160 160" stroke="var(--gold-dim)" stroke-width="0.5" fill="none" opacity="0.5"/>
                        <path d="M160 40 Q100 100 40 160" stroke="var(--gold-dim)" stroke-width="0.5" fill="none" opacity="0.5"/>
                    </g>
                </svg>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <!-- Bespoke Icon: Crystal/Orb -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L2 12l3 3 7-7 7 7 3-3-10-10z" fill="currentColor" opacity="0.5"/>
                    <path d="M12 6L6 12l6 6 6-6-6-6z" fill="currentColor"/>
                    <circle cx="12" cy="12" r="2" fill="#fff"/>
                </svg>
                <span class="card-label">Summon</span>
            </div>

            <!-- Roster -->
            <div class="menu-card" onclick="interact('Roster')">
                <!-- Bespoke Icon: Scroll/Book -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M4 4h12v16H4z" fill="none" stroke="currentColor" stroke-width="2"/>
                    <path d="M16 4h4v16h-4z" fill="none" stroke="currentColor" stroke-width="2"/>
                    <path d="M16 8h4M16 12h4M16 16h4" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card" onclick="interact('Battle')">
                <!-- Bespoke Icon: Crossed Swords/Shield -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.5 13.5L3 22l4-1 6.5-7.5z" fill="currentColor"/>
                    <path d="M19 15l-4-4-2 2 4 4 2-2z" fill="currentColor" opacity="0.7"/>
                    <path d="M10 10l7-7 2 2-7 7-2-2z" fill="currentColor"/>
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card" onclick="interact('Grind')">
                <!-- Bespoke Icon: Anvil/Forge -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M2 20h20v2H2v-2zm2-4h16l-2-8H6l-2 8zm4-8h8l-1-4h-6l-1 4z" fill="currentColor"/>
                </svg>
                <span class="card-label">Grind</span>
            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline Mode
        </footer>
    </div>

<script>
    // --- Enhanced Background Particle System ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    
    // Configuration for "swirling aether" look
    const config = {
        particleCount: 80,
        connectionDistance: 150,
        speed: 0.3
    };

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        // Re-init particles on resize to fill screen
        initParticles();
    }

    class Particle {
        constructor() {
            this.reset();
            // Randomize initial position so they don't all start at bottom
            this.y = Math.random() * height;
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + 10;
            this.vx = (Math.random() - 0.5) * config.speed;
            this.vy = -(Math.random() * config.speed + 0.2); 
            this.size = Math.random() * 2;
            this.life = 0;
            this.maxLife = Math.random() * 200 + 100;
            // Mix of Gold and Cyan
            const isGold = Math.random() > 0.7;
            this.color = isGold ? {r: 207, g: 181, b: 59} : {r: 79, g: 209, b: 197};
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life++;

            // Sine wave drift for "swirling" effect
            this.x += Math.sin(this.life * 0.02) * 0.3;

            if (this.life >= this.maxLife || this.y < -10) {
                this.reset();
            }
        }

        draw() {
            const opacity = 1 - (this.life / this.maxLife);
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${opacity * 0.6})`;
            ctx.shadowBlur = 10;
            ctx.shadowColor = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.5)`;
            ctx.fill();
            ctx.shadowBlur = 0; // Reset for performance
        }
    }

    function initParticles() {
        particles = [];
        // Adjust count based on screen area
        const count = Math.floor((width * height) / 12000);
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        // Draw connections (The "Aether Web")
        ctx.lineWidth = 0.5;
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
            
            // Only check a subset of particles for connections to save performance
            if (i % 2 === 0) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    // Fast distance check without sqrt
                    const distSq = dx*dx + dy*dy;
                    const limitSq = config.connectionDistance * config.connectionDistance;

                    if (distSq < limitSq) {
                        const dist = Math.sqrt(distSq);
                        const opacity = 1 - (dist / config.connectionDistance);
                        
                        // Determine line color based on particle colors (simplified to gold)
                        ctx.strokeStyle = `rgba(207, 181, 59, ${opacity * 0.15})`;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', resize);

    function interact(action) {
        // Visual feedback for buttons
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.96)';
        
        // Add a temporary glow effect
        const originalBorder = btn.style.borderColor;
        btn.style.borderColor = 'var(--gold-bright)';
        
        setTimeout(() => {
            btn.style.transform = '';
            btn.style.borderColor = originalBorder;
        }, 150);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    animate();

</script>
</body>
</html>
