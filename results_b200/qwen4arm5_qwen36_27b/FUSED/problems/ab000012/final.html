<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #030305;
        --bg-mid: #0a0a12;
        
        --gold-primary: #d4af37;
        --gold-bright: #ffe680;
        --gold-dim: #6e5618;
        --gold-glow: rgba(212, 175, 55, 0.6);
        
        --cyan-primary: #22d3ee;
        --cyan-glow: rgba(34, 211, 238, 0.6);
        --cyan-dark: #0891b2;
        
        --stone-dark: #121216;
        --stone-light: #252530;
        
        --text-main: #e2e2e8;
        --text-muted: #888899;
        
        --font-display: "Cinzel", "Palatino Linotype", "Book Antiqua", Palatino, serif;
        --font-body: "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* --- Background Layers --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
    }

    .noise-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.05;
        z-index: 2;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, transparent 20%, #000 120%);
        z-index: 3;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1400px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 0;
        justify-content: space-between;
    }

    /* --- Header --- */
    header {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 2rem 3rem;
        display: flex;
        justify-content: flex-end; /* Currency aligned right */
        align-items: flex-start;
        z-index: 20;
    }

    .currency-pill {
        display: flex;
        align-items: center;
        gap: 12px;
        background: linear-gradient(90deg, rgba(10, 10, 15, 0.8), rgba(10, 10, 15, 0.4));
        border: 1px solid rgba(212, 175, 55, 0.4);
        border-left: 4px solid var(--gold-primary);
        padding: 0.6rem 1.8rem;
        clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%, 0 20%);
        box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        backdrop-filter: blur(5px);
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .currency-pill:hover {
        border-color: var(--gold-bright);
        box-shadow: 0 0 20px var(--gold-glow);
    }

    .coin-icon {
        width: 28px;
        height: 28px;
        filter: drop-shadow(0 0 5px var(--gold-dim));
    }

    .currency-amount {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.3rem;
        color: var(--gold-bright);
        text-shadow: 0 2px 4px rgba(0,0,0,1);
        letter-spacing: 0.05em;
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        margin-top: -3rem; /* Pull content up slightly */
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 5rem; 
        text-transform: uppercase;
        letter-spacing: 0.2em;
        margin-bottom: 0.2rem;
        background: linear-gradient(to bottom, #ffffff 20%, var(--gold-primary) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.2));
        position: relative;
        z-index: 12;
        line-height: 0.9;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.9rem;
        color: var(--cyan-primary);
        letter-spacing: 0.8em;
        text-transform: uppercase;
        margin-bottom: 2.5rem;
        opacity: 0.8;
        text-shadow: 0 0 15px var(--cyan-glow);
        z-index: 12;
        font-weight: 300;
    }

    /* --- The Summoning Circle (Vibrant & Complex) --- */
    .vortex-container {
        position: relative;
        width: 460px;
        height: 460px;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1200px;
        margin-bottom: 2rem; /* Reduced to tighten layout */
        transform-style: preserve-3d;
    }

    /* Spirit Silhouette */
    .spirit-entity {
        width: 140px;
        height: 200px;
        background: radial-gradient(ellipse at center, rgba(255,255,255,0.9) 0%, rgba(34, 211, 238, 0.5) 30%, transparent 70%);
        filter: blur(20px);
        border-radius: 50%;
        opacity: 0.7;
        animation: breathe 5s ease-in-out infinite;
        position: absolute;
        z-index: 5;
        top: 50px;
        mix-blend-mode: screen;
    }
    
    .spirit-core {
        width: 10px;
        height: 10px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 40px 15px var(--cyan-primary), 0 0 80px 30px var(--cyan-dark);
        position: absolute;
        z-index: 6;
        top: 100px;
        animation: pulse-core 2.5s infinite alternate;
    }

    /* Procedural Rune Circles */
    .rune-svg {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 6;
        animation: spin-slow 80s linear infinite;
        filter: drop-shadow(0 0 20px var(--cyan-glow));
        opacity: 0.9;
    }
    
    .rune-inner-svg {
        width: 75%;
        height: 75%;
        position: absolute;
        top: 12.5%;
        left: 12.5%;
        z-index: 7;
        animation: spin-reverse 50s linear infinite;
        filter: drop-shadow(0 0 15px var(--cyan-glow));
    }
    
    .rune-outer-svg {
        width: 110%;
        height: 110%;
        position: absolute;
        top: -5%;
        left: -5%;
        z-index: 4;
        animation: spin-reverse 120s linear infinite;
        opacity: 0.4;
    }

    /* --- Menu Grid (Tightened & Thematic) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2rem;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto 5rem auto; /* Bottom margin */
        padding: 0 2rem;
        position: relative;
        z-index: 20;
    }

    /* Artifact Button Base */
    .menu-card {
        position: relative;
        height: 200px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* The Rune Stone Shape */
    .card-face {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #1e1e26 0%, #0e0e12 100%);
        /* Hexagonal-ish Shape */
        clip-path: polygon(
            15% 0, 85% 0, 
            100% 25%, 100% 75%, 
            85% 100%, 15% 100%, 
            0 75%, 0 25%
        );
        border: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 
            inset 0 0 30px rgba(0,0,0,0.9),
            0 10px 20px rgba(0,0,0,0.5);
        transition: all 0.4s ease;
    }

    /* Texture Overlay */
    .card-face::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='6' height='6' viewBox='0 0 6 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 3h1v1H1V3zm2-2h1v1H3V1z' fill='%23ffffff' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
        opacity: 0.5;
        clip-path: inherit;
    }

    /* Metallic Border Overlay */
    .card-face::after {
        content: '';
        position: absolute;
        inset: 4px;
        border: 1px solid rgba(255,255,255,0.08);
        clip-path: inherit;
        pointer-events: none;
        transition: border-color 0.4s ease;
    }

    /* Hover State */
    .menu-card:hover .card-face {
        transform: translateY(-10px) scale(1.02);
        background: linear-gradient(180deg, #2a2a36 0%, #14141c 100%);
        box-shadow: 
            inset 0 0 20px rgba(255,255,255,0.05),
            0 20px 40px rgba(0,0,0,0.7);
    }
    
    .menu-card:hover .card-face::after {
        border-color: rgba(255,255,255,0.3);
    }

    /* Card Icons - Thematic */
    .card-icon {
        width: 64px;
        height: 64px;
        fill: var(--text-muted);
        transition: all 0.4s ease;
        position: relative;
        z-index: 2;
        filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8));
    }

    .menu-card:hover .card-icon {
        fill: var(--text-main);
        transform: scale(1.1);
        filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.2));
    }

    .card-label {
        font-family: var(--font-display);
        font-size: 1.1rem;
        color: var(--text-main);
        letter-spacing: 0.3em;
        font-weight: 600;
        text-transform: uppercase;
        position: relative;
        z-index: 2;
        text-shadow: 0 2px 4px #000;
        transition: color 0.3s ease;
    }

    /* --- Summon Card (Primary Action) --- */
    .menu-card.summon .card-face {
        background: linear-gradient(135deg, #3d3210 0%, #1a1505 100%);
        border: 1px solid var(--gold-dim);
        box-shadow: 0 0 25px rgba(0,0,0,0.8), inset 0 0 25px rgba(212, 175, 55, 0.1);
    }
    
    .menu-card.summon .card-face::after {
        border-color: var(--gold-dim);
    }

    .menu-card.summon .card-icon {
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 15px var(--gold-dim));
    }
    
    .menu-card.summon:hover .card-face {
        background: linear-gradient(135deg, #4d4218 0%, #241e0a 100%);
        box-shadow: 0 0 50px var(--gold-shadow), inset 0 0 40px rgba(212, 175, 55, 0.2);
        border-color: var(--gold-bright);
    }
    
    .menu-card.summon:hover .card-icon {
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 25px var(--gold-primary));
        animation: float-icon 3s infinite ease-in-out;
    }
    
    .menu-card.summon:hover .card-label {
        color: var(--gold-bright);
        text-shadow: 0 0 10px var(--gold-dim);
    }

    /* --- Animations --- */
    @keyframes breathe {
        0%, 100% { transform: scale(1) translateY(0); opacity: 0.6; }
        50% { transform: scale(1.15) translateY(-15px); opacity: 0.9; }
    }

    @keyframes pulse-core {
        0% { box-shadow: 0 0 40px 15px var(--cyan-primary); opacity: 0.8; transform: scale(1); }
        100% { box-shadow: 0 0 80px 30px var(--cyan-primary); opacity: 1; transform: scale(1.2); }
    }

    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }
    
    @keyframes float-icon {
        0%, 100% { transform: translateY(0) scale(1.1); }
        50% { transform: translateY(-10px) scale(1.1); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 3.5rem; letter-spacing: 0.1em; }
        .game-subtitle { font-size: 0.7rem; letter-spacing: 0.4em; }
        .menu-grid { grid-template-columns: 1fr 1fr; gap: 1.5rem; padding: 0 1.5rem; margin-bottom: 3rem; }
        .menu-card { height: 160px; }
        .vortex-container { width: 320px; height: 320px; margin-bottom: 1rem; }
        .currency-pill { padding: 0.4rem 1rem; }
        .card-icon { width: 48px; height: 48px; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="noise-overlay"></div>
    <div class="vignette"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <!-- Custom Gold Coin Icon -->
                <svg class="coin-icon" viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#fff5cc;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#8a762e;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <circle cx="50" cy="50" r="45" fill="url(#goldGrad)" stroke="#3e300b" stroke-width="2"/>
                    <circle cx="50" cy="50" r="38" fill="none" stroke="#3e300b" stroke-width="2" stroke-dasharray="5 5"/>
                    <path d="M50 25 L50 75 M35 40 L65 40 M35 60 L65 60" stroke="#5e4b20" stroke-width="5" stroke-linecap="round"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <div class="vortex-container">
                <!-- The Spirit Silhouette -->
                <div class="spirit-entity"></div>
                <div class="spirit-core"></div>
                
                <!-- Outer Ring -->
                <svg class="rune-outer-svg" viewBox="0 0 200 200">
                     <circle cx="100" cy="100" r="90" stroke="var(--cyan-dark)" stroke-width="0.5" fill="none" stroke-dasharray="2 4"/>
                </svg>

                <!-- Middle Rune Circle -->
                <svg class="rune-svg" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="runeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:var(--cyan-dark);stop-opacity:0.5" />
                            <stop offset="50%" style="stop-color:var(--cyan-primary);stop-opacity:1" />
                            <stop offset="100%" style="stop-color:var(--cyan-dark);stop-opacity:0.5" />
                        </linearGradient>
                    </defs>
                    
                    <circle cx="100" cy="100" r="95" stroke="url(#runeGrad)" stroke-width="1.5" fill="none" stroke-dasharray="1 8"/>
                    <circle cx="100" cy="100" r="90" stroke="var(--cyan-dark)" stroke-width="1" fill="none" opacity="0.8"/>
                    
                    <g fill="var(--cyan-primary)">
                        <circle cx="100" cy="5" r="2" />
                        <circle cx="100" cy="195" r="2" />
                        <circle cx="5" cy="100" r="2" />
                        <circle cx="195" cy="100" r="2" />
                    </g>
                </svg>

                <!-- Inner Rune Circle -->
                <svg class="rune-inner-svg" viewBox="0 0 200 200">
                     <circle cx="100" cy="100" r="70" stroke="var(--cyan-primary)" stroke-width="1" fill="none" stroke-dasharray="15 25 5 25" opacity="0.8"/>
                     
                     <!-- Rune Symbols -->
                    <g stroke="var(--cyan-primary)" stroke-width="2" fill="none" opacity="0.9">
                        <!-- North -->
                        <path d="M100 30 L100 50 M90 40 L110 40" />
                        <!-- South -->
                        <path d="M100 170 L100 150 M90 160 L110 160" />
                        <!-- East -->
                        <path d="M170 100 L150 100 M160 90 L160 110" />
                        <!-- West -->
                        <path d="M30 100 L50 100 M40 90 L40 110" />
                        
                        <!-- Hexagon Connectors -->
                        <path d="M100 30 L160 65 L160 135 L100 170 L40 135 L40 65 Z" stroke="var(--cyan-primary)" stroke-width="1" fill="none" opacity="0.4"/>
                    </g>
                </svg>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <div class="card-face">
                    <!-- Icon: Spirit Vessel -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12 2L2 14l10 8 10-8L12 2z" fill="currentColor"/>
                        <path d="M12 22V14" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
                        <path d="M2 14l10-4 10 4" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                        <path d="M12 14l-5-2" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
                        <path d="M12 14l5-2" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
                    </svg>
                    <span class="card-label">Summon</span>
                </div>
            </div>

            <!-- Roster -->
            <div class="menu-card" onclick="interact('Roster')">
                <div class="card-face">
                    <!-- Icon: Grimoire -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M18 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V4a2 2 0 00-2-2zM6 4h12v16H6V4zm2 2v2h8V6H8zm0 4v2h8v-2H8zm0 4v2h8v-2H8z" fill="currentColor"/>
                    </svg>
                    <span class="card-label">Roster</span>
                </div>
            </div>

            <!-- Battle -->
            <div class="menu-card" onclick="interact('Battle')">
                <div class="card-face">
                    <!-- Icon: Crossed Swords -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M14.5 13.5L3 22l4-1 6.5-7.5z" fill="currentColor"/>
                        <path d="M19 15l-4-4-2 2 4 4 2-2z" fill="currentColor" opacity="0.8"/>
                        <path d="M10 10l7-7 2 2-7 7-2-2z" fill="currentColor"/>
                        <circle cx="19" cy="5" r="2" fill="currentColor"/>
                    </svg>
                    <span class="card-label">Battle</span>
                </div>
            </div>

            <!-- Grind -->
            <div class="menu-card" onclick="interact('Grind')">
                <div class="card-face">
                    <!-- Icon: Anvil -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M2 20h20v2H2v-2zm2-4h16l-2-8H6l-2 8zm4-8h8l-1-4h-6l-1 4z" fill="currentColor"/>
                        <path d="M12 8v4" stroke="rgba(255,100,50,0.8)" stroke-width="2"/>
                        <circle cx="12" cy="12" r="2" fill="rgba(255,100,50,0.9)"/>
                    </svg>
                    <span class="card-label">Grind</span>
                </div>
            </div>
        </nav>
    </div>

<script>
    // --- Enhanced Background Particle System ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    
    // Configuration
    const config = {
        speed: 0.3
    };

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        initParticles();
    }

    class Particle {
        constructor() {
            this.reset();
            this.y = Math.random() * height;
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 50;
            this.vx = (Math.random() - 0.5) * config.speed;
            this.vy = -(Math.random() * config.speed + 0.1); 
            this.size = Math.random() * 2 + 0.5;
            this.life = 0;
            this.maxLife = Math.random() * 400 + 100;
            
            // Mix of Gold and Cyan
            const isGold = Math.random() > 0.7;
            this.color = isGold ? {r: 212, g: 175, b: 55} : {r: 34, g: 211, b: 238};
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life++;

            // Sine wave drift
            this.x += Math.sin(this.life * 0.01) * 0.3;

            if (this.life >= this.maxLife || this.y < -20) {
                this.reset();
            }
        }

        draw() {
            const opacity = Math.sin((this.life / this.maxLife) * Math.PI);
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${opacity * 0.8})`;
            ctx.shadowBlur = 10;
            ctx.shadowColor = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.8)`;
            ctx.fill();
            ctx.shadowBlur = 0; 
        }
    }

    function initParticles() {
        particles = [];
        // Density based on screen size
        const count = Math.floor((width * height) / 18000);
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', resize);

    function interact(action) {
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.98)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    animate();

</script>
</body>
</html>
