<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* --- Palette: Refined Slate & Cream --- */
            --bg-app: #0f1115;       /* Deep charcoal background */
            --bg-panel: #181b21;     /* Slightly lighter panel */
            --bg-panel-border: #2a2f38;
            
            --text-primary: #e8eaed;
            --text-secondary: #9aa0ab;
            --text-muted: #5c6470;

            /* Board Colors: High Contrast Classic */
            --board-light: #ebecd0;  /* Warm cream */
            --board-dark: #5b7c58;   /* Deep organic green */
            
            /* Highlights */
            --highlight-move: rgba(255, 255, 255, 0.25);
            --highlight-hint: rgba(91, 124, 88, 0.5);
            --highlight-last: rgba(255, 215, 80, 0.25);
            --highlight-selected: rgba(255, 255, 255, 0.35);

            /* Dimensions */
            --board-size: 720px;
            --square-size: calc(var(--board-size) / 8);
            --coord-gutter: 28px;
            
            /* Typography */
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "SF Mono", "Roboto Mono", "Fira Code", Consolas, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Layout --- */
        .app-container {
            display: flex;
            gap: 40px;
            align-items: stretch;
            /* Adjust height to fit board + gutters */
            height: calc(var(--board-size) + var(--coord-gutter) * 2 + 50px);
            width: 1100px;
        }

        /* --- Board Section --- */
        .board-wrapper {
            position: relative;
            width: calc(var(--board-size) + var(--coord-gutter) * 2);
            height: calc(var(--board-size) + var(--coord-gutter) * 2);
            background: var(--bg-panel);
            padding: var(--coord-gutter);
            border-radius: 12px;
            /* Deep shadow for physical depth */
            box-shadow: 
                0 20px 50px -10px rgba(0,0,0,0.7), 
                0 0 0 1px rgba(255,255,255,0.05);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Coordinate Gutters */
        .gutter {
            position: absolute;
            display: flex;
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 13px;
            color: var(--text-secondary);
            z-index: 5;
            user-select: none;
        }

        .gutter-rank {
            left: 0;
            top: var(--coord-gutter);
            height: var(--board-size);
            flex-direction: column;
            justify-content: space-around;
            width: var(--coord-gutter);
            text-align: right;
            padding-right: 8px;
        }

        .gutter-file {
            bottom: 0;
            left: var(--coord-gutter);
            width: var(--board-size);
            flex-direction: row;
            justify-content: space-around;
            height: var(--coord-gutter);
            padding-top: 6px;
        }

        .gutter span {
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            text-transform: uppercase;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: var(--board-size);
            height: var(--board-size);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border: 4px solid #232730;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        /* Board Palette */
        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        
        /* Selection & Hints */
        .square.selected {
            background-color: var(--highlight-selected) !important;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.4);
            z-index: 2;
        }
        
        .square.possible-move::after {
            content: '';
            width: 24%;
            height: 24%;
            background: var(--highlight-hint);
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
            transition: transform 0.2s;
        }
        .square.possible-move:hover::after {
            transform: scale(1.2);
            background: rgba(91, 124, 88, 0.8);
        }

        .square.capture-move {
            box-shadow: inset 0 0 0 4px rgba(255, 100, 100, 0.5);
            background: radial-gradient(transparent 55%, rgba(255, 80, 80, 0.4) 56%) !important;
        }

        /* --- Piece Assets: Refined SVGs --- */
        .piece {
            width: 85%;
            height: 85%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            cursor: grab;
            z-index: 10;
            /* Subtle drop shadow for 3D feel */
            filter: drop-shadow(1px 2px 2px rgba(0, 0, 0, 0.4));
            transition: transform 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .piece:active { cursor: grabbing; transform: scale(1.1); }
        .square:hover .piece { transform: scale(1.05); }

        /* --- Sidebar Section --- */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 320px;
        }

        .unified-card {
            background: var(--bg-panel);
            border: 1px solid var(--bg-panel-border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        /* Header */
        .game-header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--bg-panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #1f232b 0%, var(--bg-panel) 100%);
        }

        .status-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Turn Indicator: Integrated Design */
        .turn-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        .turn-indicator.white { 
            background-color: #fff; 
            box-shadow: 0 0 0 2px var(--bg-panel), 0 0 10px rgba(255,255,255,0.3); 
        }
        .turn-indicator.black { 
            background-color: #1a1c21; 
            border: 1px solid #444;
            box-shadow: 0 0 0 2px var(--bg-panel), 0 0 10px rgba(0,0,0,0.5); 
        }

        .status-text {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }
        
        .timer {
            font-family: var(--font-mono);
            font-size: 1.4rem;
            color: var(--text-primary);
            background: rgba(0,0,0,0.25);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.03);
            letter-spacing: 0.05em;
            font-variant-numeric: tabular-nums;
        }

        /* History Panel */
        .history-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-panel);
            position: relative;
        }

        .history-header {
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }

        .history-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 1rem;
            width: 100%;
            padding: 16px 32px 32px;
        }

        /* Custom Scrollbar */
        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: #3a414d; border-radius: 10px; }
        .history-list::-webkit-scrollbar-thumb:hover { background: #4a5260; }

        .move-row {
            display: grid;
            grid-template-columns: 36px 1fr 1fr;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background 0.1s;
        }
        .move-row:hover { background: rgba(255,255,255,0.02); }
        
        .move-num {
            color: var(--text-muted);
            font-size: 0.9em;
            opacity: 0.7;
        }
        .move-cell {
            color: var(--text-primary);
            font-weight: 500;
            padding-left: 8px;
            cursor: pointer;
        }
        .move-cell:hover { color: #fff; text-decoration: underline; }

        /* Empty State */
        .history-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-secondary);
            opacity: 0.5;
            pointer-events: none;
            width: 80%;
            transition: opacity 0.3s;
        }
        .history-placeholder svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
        }
        .history-placeholder p {
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Controls Footer */
        .controls-footer {
            padding: 20px 32px;
            border-top: 1px solid var(--bg-panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.15);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--bg-panel-border);
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 50px; /* Pill shape */
            font-family: var(--font-ui);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: #252b36;
            border-color: #4a5260;
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        .btn-primary {
            background-color: var(--board-dark);
            color: #fff;
            border-color: var(--board-dark);
        }
        .btn-primary:hover {
            background-color: #6b8e68;
            border-color: #6b8e68;
            box-shadow: 0 4px 12px rgba(91, 124, 88, 0.3);
        }

        .icon { width: 16px; height: 16px; fill: currentColor; }

        /* Responsive */
        @media (max-width: 1100px) {
            .app-container {
                flex-direction: column;
                align-items: center;
                height: auto;
                padding: 40px 20px;
                width: 100%;
            }
            body { height: auto; overflow-y: auto; }
            .board-wrapper { width: 100%; max-width: 500px; height: auto; aspect-ratio: 1/1; }
            :root { --board-size: 100%; --square-size: 12.5%; }
            .sidebar { width: 100%; max-width: 500px; height: 450px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Left: Board -->
    <div class="board-wrapper">
        <!-- Gutters -->
        <div class="gutter gutter-rank" id="gutterRank"></div>
        <div class="gutter gutter-file" id="gutterFile"></div>

        <div class="board" id="chessboard">
            <!-- Generated by JS -->
        </div>
    </div>

    <!-- Right: Sidebar -->
    <div class="sidebar">
        <div class="unified-card">
            
            <!-- Header / Status -->
            <div class="game-header">
                <div class="status-group">
                    <div class="turn-indicator white" id="turnDot"></div>
                    <span class="status-text" id="statusText">White to Move</span>
                </div>
                <div class="timer">10:00</div>
            </div>

            <!-- Move History -->
            <div class="history-container">
                <div class="history-header">
                    <div class="history-title">Move History</div>
                </div>
                
                <!-- Empty State -->
                <div id="historyPlaceholder" class="history-placeholder">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                        <path d="M2 2l7.586 7.586"></path>
                        <circle cx="11" cy="11" r="2"></circle>
                    </svg>
                    <p>Waiting for first move...</p>
                </div>

                <div class="history-list" id="moveHistory">
                    <!-- Moves injected here -->
                </div>
            </div>

            <!-- Controls -->
            <div class="controls-footer">
                <button class="btn" onclick="resetGame()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                    Reset
                </button>
                <div class="btn-group">
                    <!-- Added placeholder for layout balance -->
                    <button class="btn" style="visibility:hidden">Flip</button>
                    <button class="btn btn-primary" onclick="resetGame()">
                        New Game
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

        bR: `<svg viewBox="0 0 45 45" xmlns="http://www.w3.org/2000/svg"><g fill="#1a1a1a" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5"/><path d="M34 14l-3 3H14l-3-3"/><path d="M31 17v12.5H14V17"/><path d="M31 29.5l1.5 2.5h-20l1.5-2.5"/><path d="M11 14h23" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="miter"/></g></svg>`,
        bQ: `<svg viewBox="0 0 45 45" xmlns="http://www.w3.org/2000/svg"><g fill="#1a1a1a" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM24.5 7.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM41 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM10.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM38.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5-3-15-3 15-5.5-13.5V25l-7-11 2 12zM9 26c0 2 1.5 2 2.5 4 1 2.5 1 4.5 1 4.5h20s0-2 1-4.5c1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z"/><path d="M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0"/></g></svg>`,
        bK: `<svg viewBox="0 0 45 45" xmlns="http://www.w3.org/2000/svg"><g fill="#1a1a1a" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22.5 11.63V6M20 8h5"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-5 2-8 2s-4-2-8-2-4 1-8-2-4-3-8-2c-3 6 6 10.5 6 10.5v7z"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/></g></svg>`,
    };

    // --- State ---
    const initialBoard = [
        ['bR', 'bN', 'bB', 'bQ', 'bK', 'bB', 'bN', 'bR'],
        ['bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP'],
        ['wR', 'wN', 'wB', 'wQ', 'wK', 'wB', 'wN', 'wR']
    ];

    let board = JSON.parse(JSON.stringify(initialBoard));
    let turn = 'w'; // 'w' or 'b'
    let selectedSquare = null;

    // --- Rendering ---
    const boardEl = document.getElementById('chessboard');
    const gutterRank = document.getElementById('gutterRank');
    const gutterFile = document.getElementById('gutterFile');
    const moveHistoryEl = document.getElementById('moveHistory');
    const statusText = document.getElementById('statusText');
    const turnDot = document.getElementById('turnDot');
    const placeholder = document.getElementById('historyPlaceholder');

    function initGutters() {
        gutterRank.innerHTML = '';
        gutterFile.innerHTML = '';
        for(let i=1; i<=8; i++) {
            const span = document.createElement('span');
            span.innerText = i;
            gutterRank.appendChild(span);
        }
        for(let i=0; i<8; i++) {
            const span = document.createElement('span');
            span.innerText = String.fromCharCode(97 + i);
            gutterFile.appendChild(span);
        }
    }

    function renderBoard() {
        boardEl.innerHTML = '';
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.dataset.row = r;
                square.dataset.col = c;
                square.onclick = () => handleSquareClick(r, c);

                // Piece
                const pieceCode = board[r][c];
                if (pieceCode) {
                    const piece = document.createElement('div');
                    piece.className = 'piece';
                    piece.innerHTML = SVG_PIECES[pieceCode];
                    square.appendChild(piece);
                }

                // Selection highlight
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    square.classList.add('selected');
                }

                boardEl.appendChild(square);
            }
        }
    }

    function updateStatus() {
        const player = turn === 'w' ? 'White' : 'Black';
        statusText.innerText = `${player} to Move`;
        turnDot.className = `turn-indicator ${turn === 'w' ? 'white' : 'black'}`;
    }

    // --- Interaction ---
    function handleSquareClick(r, c) {
        const piece = board[r][c];
        const isOwnPiece = piece && piece.startsWith(turn);

        if (isOwnPiece) {
            // Select piece
            selectedSquare = { r, c };
            renderBoard();
            // Note: In a real app, we would render hints here
        } else if (selectedSquare) {
            // Move piece (Visual only for this demo)
            movePiece(selectedSquare.r, selectedSquare.c, r, c);
        }
    }

    function movePiece(fromR, fromC, toR, toC) {
        const piece = board[fromR][fromC];
        
        // Update board state
        board[toR][toC] = piece;
        board[fromR][fromC] = '';
        
        // Add fake move to history
        addMoveToHistory(piece, fromR, fromC, toR, toC);

        // Switch turn
        turn = turn === 'w' ? 'b' : 'w';
        selectedSquare = null;
        
        renderBoard();
        updateStatus();
    }

    function addMoveToHistory(piece, fromR, fromC, toR, toC) {
        const files = 'abcdefgh';
        const ranks = '87654321';
        
        // Simple notation generation
        const pieceSymbol = (piece[1] === 'P') ? '' : piece[1].toUpperCase();
        const notation = pieceSymbol + files[toC] + ranks[toR];

        // Determine if we need a new row (White moves) or append to row (Black moves)
        // Note: turn has already switched in movePiece, so if turn is 'b', White just moved.
        
        if (turn === 'b') { 
            // White just moved -> Create new row
            const rowCount = moveHistoryEl.children.length;
            const moveNumLabel = rowCount + 1;

            const row = document.createElement('div');
            row.className = 'move-row';
            row.innerHTML = `
                <div class="move-num">${moveNumLabel}.</div>
                <div class="move-cell">${notation}</div>
                <div class="move-cell"></div>
            `;
            moveHistoryEl.appendChild(row);
        } else { 
            // Black just moved -> Update last row
            const lastRow = moveHistoryEl.lastElementChild;
            if (lastRow) {
                const blackCell = lastRow.querySelector('.move-cell:nth-child(3)');
                blackCell.innerText = notation;
            }
        }
        
        // Auto scroll
        moveHistoryEl.scrollTop = moveHistoryEl.scrollHeight;

        // Hide placeholder if it exists
        if (placeholder) placeholder.style.display = 'none';
    }

    function resetGame() {
        board = JSON.parse(JSON.stringify(initialBoard));
        turn = 'w';
        selectedSquare = null;
        moveHistoryEl.innerHTML = '';
        if (placeholder) placeholder.style.display = 'block';
        renderBoard();
        updateStatus();
    }

    // --- Init ---
    initGutters();
    renderBoard();
    updateStatus();

</script>
