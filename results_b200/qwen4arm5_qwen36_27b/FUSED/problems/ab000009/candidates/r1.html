<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refined Chess Interface</title>
    <style>
        :root {
            /* Palette - Sophisticated & High Contrast */
            --bg-app: #121212;
            --bg-panel: #1e1e1e;
            --bg-panel-border: #2a2a2a;
            
            --text-primary: #f0f0f0;
            --text-secondary: #888888;
            
            /* Board Palette - Charcoal & Off-White */
            --board-light: #e8e8e8; 
            --board-dark: #343a40;   /* Deep Charcoal */
            --board-highlight: rgba(255, 255, 255, 0.25);
            --board-move-dot: rgba(0, 0, 0, 0.2);
            
            --accent: #e8e8e8; /* Muted white for buttons */
            --accent-text: #121212;
            
            /* Dimensions */
            --board-size: 640px;
            --square-size: calc(var(--board-size) / 8);
            
            /* Typography */
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "SF Mono", "Roboto Mono", "Fira Code", monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Layout Container */
        .app-container {
            display: flex;
            gap: 32px;
            align-items: stretch;
            /* Ensure board drives height */
            height: calc(var(--board-size) + 120px); 
        }

        /* --- Board Section --- */
        .board-wrapper {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            background: var(--bg-panel);
            padding: 12px;
            border-radius: 6px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            border-radius: 2px;
            overflow: hidden; /* Keeps coordinates clean */
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        
        /* Selection & Hints */
        .square.selected {
            background-color: rgba(255, 255, 255, 0.35) !important;
        }
        
        .square.possible-move::after {
            content: '';
            width: 25%;
            height: 25%;
            background: var(--board-move-dot);
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
        }
        .square.capture-move {
            background: radial-gradient(transparent 65%, rgba(0,0,0,0.15) 66%) !important;
        }

        /* Coordinates - Refined */
        .coord {
            position: absolute;
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 13px;
            pointer-events: none;
            opacity: 0.8;
            line-height: 1;
        }
        /* Rank (Numbers) top-left */
        .coord.rank { 
            top: 4px; 
            left: 5px; 
        }
        /* File (Letters) bottom-right */
        .coord.file { 
            bottom: 3px; 
            right: 5px; 
        }
        /* Invert colors based on square color for legibility */
        .square.light .coord { color: var(--board-dark); }
        .square.dark .coord { color: var(--board-light); opacity: 0.5; }

        /* Pieces - Vector SVGs */
        .piece {
            width: 85%;
            height: 85%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            cursor: grab;
            z-index: 2;
            /* Remove outlines, add soft depth */
            filter: drop-shadow(0px 4px 3px rgba(0, 0, 0, 0.3));
            transition: transform 0.15s cubic-bezier(0.4, 0.0, 0.2, 1);
        }
        .piece:active { cursor: grabbing; transform: scale(1.1); }
        .square:hover .piece { transform: scale(1.05); }

        /* --- Sidebar Section --- */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0; /* Merged card logic */
            min-width: 340px;
        }

        /* Unified Card */
        .unified-card {
            background: var(--bg-panel);
            border: 1px solid var(--bg-panel-border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Header: Turn & Status */
        .game-header {
            padding: 24px;
            border-bottom: 1px solid var(--bg-panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
        }

        .status-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .turn-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            box-shadow: inset 0 0 0 2px rgba(0,0,0,0.1);
            transition: background-color 0.3s ease;
        }
        .turn-indicator.white { background-color: #f0f0f0; border: 1px solid #ccc; }
        .turn-indicator.black { background-color: #222; border: 1px solid #555; }

        .status-text {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }
        
        .timer {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            color: var(--text-secondary);
            letter-spacing: -0.05em;
        }

        /* Move History - Data Style */
        .history-container {
            flex: 1;
            padding: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .history-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 700;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            font-family: var(--font-mono); /* Monospace for data alignment */
            font-size: 0.95rem;
            border-collapse: collapse;
            width: 100%;
        }
        
        /* Custom Scrollbar */
        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .move-row {
            display: grid;
            grid-template-columns: 30px 1fr 1fr;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .move-row:last-child { border-bottom: none; }
        
        .move-num {
            color: var(--text-secondary);
            opacity: 0.6;
            font-size: 0.85em;
        }
        .move-cell {
            padding: 0 8px;
            color: var(--text-primary);
        }
        .move-cell:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
            cursor: default;
            border-radius: 2px;
        }

        /* Controls Footer */
        .controls-footer {
            padding: 20px 24px;
            border-top: 1px solid var(--bg-panel-border);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            background: rgba(0,0,0,0.1);
        }

        .btn {
            background: transparent;
            border: 1px solid var(--bg-panel-border);
            color: var(--text-secondary);
            padding: 10px 16px;
            border-radius: 6px;
            font-family: var(--font-ui);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: #2a2a2a;
            border-color: #444;
            color: var(--text-primary);
        }

        /* "New Game" Button - Muted Accent */
        .btn-new-game {
            background-color: var(--board-light);
            color: var(--board-dark);
            border-color: var(--board-light);
            font-weight: 600;
        }
        .btn-new-game:hover {
            background-color: #fff;
            border-color: #fff;
            color: #000;
        }

        /* SVG Icons */
        .icon { width: 18px; height: 18px; fill: currentColor; }

        /* Responsive */
        @media (max-width: 1050px) {
            .app-container {
                flex-direction: column;
                align-items: center;
                height: auto;
                padding: 20px;
            }
            body { height: auto; overflow-y: auto; }
            .board-wrapper { width: 100%; max-width: 500px; height: auto; aspect-ratio: 1/1; }
            :root { --board-size: 100%; --square-size: 12.5%; }
            .sidebar { width: 100%; max-width: 500px; height: 400px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Left: Board -->
    <div class="board-wrapper">
        <div class="board" id="chessboard">
            <!-- Generated by JS -->
        </div>
    </div>

    <!-- Right: Sidebar -->
    <div class="sidebar">
        <!-- Unified Panel -->
        <div class="unified-card">
            
            <!-- Header / Status -->
            <div class="game-header">
                <div class="status-group">
                    <div class="turn-indicator white" id="turnDot"></div>
                    <span class="status-text" id="statusText">White to Move</span>
                </div>
                <div class="timer">10:00</div>
            </div>

            <!-- Move History -->
            <div class="history-container">
                <div class="history-title">Move History</div>
                <div class="history-list" id="moveHistory">
                    <!-- Moves injected here -->
                </div>
            </div>

            <!-- Controls -->
            <div class="controls-footer">
                <button class="btn" onclick="resetGame()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                    Reset
                </button>
                <button class="btn btn-new-game">
                    New Game
                </button>
            </div>

        </div>
    </div>
</div>

        boardEl.innerHTML = '';
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.dataset.row = r;
                square.dataset.col = c;
                square.onclick = () => handleSquareClick(r, c);

                // Coordinates
                // Ranks (1-8) on the left column (c=0)
                if (c === 0) {
                    const rank = document.createElement('span');
                    rank.className = 'coord rank';
                    rank.innerText = 8 - r;
                    square.appendChild(rank);
                }
                // Files (a-h) on the bottom row (r=7)
                if (r === 7) {
                    const file = document.createElement('span');
                    file.className = 'coord file';
                    file.innerText = String.fromCharCode(97 + c);
                    square.appendChild(file);
                }

                // Piece
                const pieceCode = board[r][c];
                if (pieceCode) {
                    const piece = document.createElement('div');
                    piece.className = 'piece';
                    piece.innerHTML = SVG_PIECES[pieceCode];
                    square.appendChild(piece);
                }

                // Selection highlight
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    square.classList.add('selected');
                }

                boardEl.appendChild(square);
            }
        }
    }

    function updateStatus() {
        const player = turn === 'w' ? 'White' : 'Black';
        statusText.innerText = `${player} to Move`;
        turnDot.className = `turn-indicator ${turn === 'w' ? 'white' : 'black'}`;
    }

    // --- Interaction ---
    function handleSquareClick(r, c) {
        const piece = board[r][c];
        const isOwnPiece = piece && piece.startsWith(turn);

        if (isOwnPiece) {
            // Select piece
            selectedSquare = { r, c };
            renderBoard();
        } else if (selectedSquare) {
            // Move piece (Visual only for this demo)
            movePiece(selectedSquare.r, selectedSquare.c, r, c);
        }
    }

    function movePiece(fromR, fromC, toR, toC) {
        const piece = board[fromR][fromC];
        
        // Update board state
        board[toR][toC] = piece;
        board[fromR][fromC] = '';
        
        // Add fake move to history
        addMoveToHistory(piece, fromR, fromC, toR, toC);

        // Switch turn
        turn = turn === 'w' ? 'b' : 'w';
        selectedSquare = null;
        
        renderBoard();
        updateStatus();
    }

    function addMoveToHistory(piece, fromR, fromC, toR, toC) {
        const files = 'abcdefgh';
        const ranks = '87654321';
        
        // Simple notation generation
        const pieceSymbol = (piece[1] === 'P') ? '' : piece[1].toUpperCase();
        const notation = pieceSymbol + files[toC] + ranks[toR];

        // Determine if we need a new row (White moves) or append to row (Black moves)
        // Note: turn has already switched in movePiece, so if turn is 'b', White just moved.
        
        if (turn === 'b') { 
            // White just moved -> Create new row
            const moveNum = Math.ceil((moveHistoryEl.children.length + 1) / 1) + (moveHistoryEl.children.length % 2 === 0 ? 0 : 0); // Simplified count logic
            // Actually simpler: Count existing rows.
            const rowCount = moveHistoryEl.children.length;
            const moveNumLabel = rowCount + 1;

            const row = document.createElement('div');
            row.className = 'move-row';
            row.innerHTML = `
                <div class="move-num">${moveNumLabel}.</div>
                <div class="move-cell">${notation}</div>
                <div class="move-cell"></div>
            `;
            moveHistoryEl.appendChild(row);
        } else { 
            // Black just moved -> Update last row
            const lastRow = moveHistoryEl.lastElementChild;
            if (lastRow) {
                const blackCell = lastRow.querySelector('.move-cell:nth-child(3)');
                blackCell.innerText = notation;
            }
        }
        
        // Auto scroll
        moveHistoryEl.scrollTop = moveHistoryEl.scrollHeight;
    }

    function resetGame() {
        board = JSON.parse(JSON.stringify(initialBoard));
        turn = 'w';
        selectedSquare = null;
        moveHistoryEl.innerHTML = '';
        renderBoard();
        updateStatus();
    }

    // --- Init ---
    renderBoard();
    updateStatus();

</script>
</body>
</html>
