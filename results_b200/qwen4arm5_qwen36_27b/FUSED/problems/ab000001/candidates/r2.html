<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub N Pup</title>
    <style>
        :root {
            /* --- Palette: Storybook Garden --- */
            --bg-paper: #F7F4E9;
            --ink-dark: #2C1E1A;
            --ink-soft: #5D4037;
            
            --wood-dark: #4E342E;
            --wood-light: #795548;
            --wood-highlight: #8D6E63;
            
            --tile-stone: #EFEBE9;
            --tile-stone-shadow: #D7CCC8;
            --tile-border: #BCAAA4;
            
            /* Paths: Deep Ink vs Active Gold */
            --path-inactive: #4E342E;
            --path-active: #FBC02D;
            --path-glow: rgba(251, 192, 45, 0.6);
            
            --accent-red: #D84315;
            --accent-green: #558B2F;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            /* Subtle Paper Texture */
            background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            font-family: 'Georgia', serif;
            color: var(--ink-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Vignette for atmosphere */
        body::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, transparent 50%, rgba(44, 30, 26, 0.15) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* --- Typography --- */
        header {
            text-align: center;
            margin-bottom: 1.5rem;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-family: 'Georgia', serif;
            font-size: 3rem;
            margin: 0;
            color: var(--wood-dark);
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8), 2px 2px 0px rgba(0,0,0,0.1);
            letter-spacing: -0.02em;
            line-height: 1;
        }
        
        h1 span {
            font-style: italic;
            font-weight: normal;
            color: var(--accent-red);
        }

        /* Signpost Level Indicator */
        .level-sign {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 0.8rem;
            background: #FFF8E1;
            border: 2px solid var(--ink-dark);
            border-radius: 4px;
            padding: 4px 12px;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            transform: rotate(-2deg);
            position: relative;
        }
        
        .level-sign::before, .level-sign::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--ink-dark);
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
        }
        .level-sign::before { left: -9px; }
        .level-sign::after { right: -9px; }

        .level-text {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--ink-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- The Game Board --- */
        .board-frame {
            position: relative;
            width: min(90vw, 560px);
            height: min(90vw, 560px);
            background: var(--wood-dark);
            padding: 12px;
            border-radius: 8px;
            /* Wood texture effect via gradients */
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0px, transparent 2px, transparent 6px, rgba(0,0,0,0.05) 10px);
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.6),
                0 10px 30px rgba(0,0,0,0.3),
                0 5px 0 var(--wood-light);
            z-index: 10;
        }

        /* Inner frame detail */
        .board-frame::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            pointer-events: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100%;
            height: 100%;
            gap: 4px;
            background: var(--wood-dark);
        }

        .tile {
            background-color: var(--tile-stone);
            position: relative;
            cursor: pointer;
            border-radius: 3px;
            /* Stone texture */
            background-image: radial-gradient(circle at 10% 10%, rgba(0,0,0,0.02) 1px, transparent 1px);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4), inset 0 -2px 0 rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .tile:hover {
            z-index: 2;
            transform: scale(1.02);
        }

        /* SVG Paths Styling */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .tile path {
            fill: none;
            stroke: var(--path-inactive);
            stroke-width: 12; /* Thicker paths */
            stroke-linecap: round;
            stroke-linejoin: round;
            /* Inner shadow for carved look */
            filter: drop-shadow(0px 1px 0px rgba(255,255,255,0.3)); 
            transition: stroke 0.3s ease, filter 0.3s ease;
        }

        /* Active Path State: Glowing Gold */
        .tile.active path {
            stroke: var(--path-active);
            filter: drop-shadow(0 0 6px var(--path-glow));
        }

        /* --- Tokens --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
            /* Match the frame padding/gap logic implicitly by using % positioning on the grid area */
        }

        /* 1. The Cub: Small Character */
        .cub-token {
            position: absolute;
            width: 28%; /* Significantly smaller */
            height: 28%;
            background: #E67E22;
            border: 1px solid #A04000;
            border-radius: 4px;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 0 #A04000, 0 6px 8px rgba(0,0,0,0.4);
            transition: top 0.4s cubic-bezier(0.25, 1, 0.5, 1), left 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Wood grain for cub */
        .cub-token::before {
            content: '';
            position: absolute;
            top:0; left:0; right:0; bottom:0;
            background: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,0.1) 3px);
            border-radius: 4px;
        }

        .cub-face {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }
        
        .cub-face::before { /* Eyes */
            content: '';
            position: absolute;
            top: 45%; left: 22%;
            width: 12%; height: 12%;
            background: #3E2723;
            border-radius: 50%;
            box-shadow: 32px 0 0 #3E2723; /* Right eye offset relative to left eye */
        }
        .cub-face::after { /* Mouth */
            content: '';
            position: absolute;
            top: 65%; left: 42%;
            width: 16%; height: 8%;
            border-bottom: 2px solid #3E2723;
            border-radius: 0 0 10px 10px;
        }

        /* 2. The Star: Small Marker */
        .star-marker {
            position: absolute;
            width: 30%;
            height: 30%;
            transform: translate(-50%, -50%);
            color: var(--path-active);
            filter: drop-shadow(0 2px 0 #F57F17);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) rotate(-5deg); }
            50% { transform: translate(-50%, -55%) rotate(5deg); }
        }

        /* --- Footer Controls: Bespoke UI --- */
        footer {
            margin-top: 2rem;
            display: flex;
            gap: 1.5rem;
            width: min(90vw, 560px);
            justify-content: space-between;
            z-index: 10;
        }

        button {
            flex: 1;
            font-family: 'Georgia', serif;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 12px 0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #FFF;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            transition: transform 0.1s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }

        /* Wooden Plank Style Buttons */
        .btn-reset {
            background: linear-gradient(to bottom, #8D6E63 0%, #5D4037 100%);
            border-bottom: 4px solid #3E2723;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }
        
        .btn-run {
            background: linear-gradient(to bottom, #E64A19 0%, #BF360C 100%);
            border-bottom: 4px solid #870000;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }

        button:active {
            transform: translateY(3px);
            border-bottom-width: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(247, 244, 233, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
            backdrop-filter: blur(4px);
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-size: 4rem;
            color: var(--accent-red);
            margin: 0;
            transform: rotate(-3deg);
            text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }
        .overlay p {
            font-size: 1.5rem;
            color: var(--ink-soft);
            font-style: italic;
            margin-bottom: 2rem;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .board-frame { width: 94vw; height: 94vw; padding: 8px; }
            footer { width: 94vw; }
            button { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub <span>n</span> Pup</h1>
        <div class="level-sign">
            <span class="level-text">Chapter 1: The Garden</span>
        </div>
    </header>

    <div class="board-frame">
        <!-- The Grid -->
        <div class="grid" id="grid"></div>
        
        <!-- Tokens Layer -->
        <div class="token-layer">
            <div class="cub-token" id="cub">
                <div class="cub-face"></div>
            </div>
            <div class="star-marker" id="star">
                <!-- Star SVG -->
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z" />
                </svg>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run Path</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()" style="width: auto; padding: 12px 30px;">Play Again</button>
    </div>

    <script>
        // --- Game Logic & Drawing ---

        const GRID_SIZE = 6;
        
        // Tile Types (SVG Paths)
        // Coordinates: 0,0 is top-left. 100,100 is bottom-right. Center is 50,50.
        // Using slightly thicker visual paths
        const TILE_TYPES = {
            LINE: { paths: ['M50 0 V100'] }, 
            LINE_H: { paths: ['M0 50 H100'] }, 
            CORNER_TR: { paths: ['M50 0 V50 H100'] },
            CORNER_BR: { paths: ['M100 50 V100 H50'] },
            CORNER_BL: { paths: ['M0 50 V100 H50'] },
            CORNER_TL: { paths: ['M50 0 V50 H0'] },
            T_UP: { paths: ['M0 50 H100 M50 50 V100'] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'] },
            CROSS: { paths: ['M50 0 V100 M0 50 H100'] }
        };

        // Visual layout map for the demo level
        const PUZZLE_MAP = [
            ['CORNER_TL', 'LINE', 'CORNER_TR', 'LINE', 'CORNER_TL', 'LINE'],
            ['LINE', 'CORNER_BR', 'LINE', 'CORNER_TL', 'LINE', 'LINE'],
            ['LINE', 'LINE', 'CORNER_BL', 'CORNER_BR', 'CORNER_BL', 'CORNER_BR'],
            ['LINE', 'CORNER_TL', 'LINE', 'LINE', 'CORNER_BL', 'LINE'],
            ['CORNER_TR', 'LINE', 'CORNER_BL', 'CORNER_BR', 'LINE', 'LINE'],
            ['LINE', 'LINE', 'LINE', 'LINE', 'LINE', 'LINE']
        ];

        function createSVG(paths) {
            let svgContent = paths.map(p => `<path d="${p}" />`).join('');
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svgContent}</svg>`;
        }

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 5}; // Star location
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const typeKey = PUZZLE_MAP[y][x];
                        const typeData = TILE_TYPES[typeKey];
                        
                        const div = document.createElement('div');
                        div.className = 'tile';
                        div.innerHTML = createSVG(typeData.paths);
                        
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            updateTokenPosition(x, y) {
                // Calculate center of the cell in percentages
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                // Remove active state from all tiles
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.updateTokenPosition(0, 0);
            }

            async run() {
                // Hardcoded path to Star at [5,5] based on the visual map
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:5, y:5} 
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    
                    // Highlight tile
                    const tile = this.cells[step.y][step.x];
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateTokenPosition(step.x, step.y);
                    
                    // Wait
                    await new Promise(r => setTimeout(r, 400));
                }

                // Win!
                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 200);
            }
        }

        const game = new Game();

    </script>
</body>
</html>
