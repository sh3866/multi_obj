<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Palette: Storybook & Wood --- */
            --bg-color: #F7F3E8; /* Warm paper */
            --text-color: #4A3B32;
            
            /* Wood Aesthetics */
            --wood-frame: #5D4037;
            --wood-frame-light: #795548;
            --wood-frame-dark: #3E2723;
            
            /* Tile Aesthetics */
            --tile-bg: #FDFBF7;
            --tile-shadow: #D7CCC8;
            --tile-border: #EFEBE9;
            
            /* Path Aesthetics */
            --path-color: #8D6E63;
            --path-active: #FBC02D; /* Gold/Yellow */
            --path-active-glow: rgba(251, 192, 45, 0.4);
            
            /* Token Colors */
            --cub-color: #FF7043;
            --cub-shadow: #D84315;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            /* Subtle paper texture noise */
            background-image: radial-gradient(#d7ccc8 1px, transparent 0);
            background-size: 20px 20px;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 1.5rem;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            line-height: 1;
            letter-spacing: -0.02em;
            color: var(--wood-frame-dark);
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
            font-weight: normal;
        }

        /* Clean typographic treatment for 'n' */
        h1 span {
            font-style: italic;
            font-weight: bold;
            color: #D84315;
            font-size: 0.9em;
            margin: 0 0.1em;
        }

        .chapter-badge {
            display: inline-block;
            margin-top: 0.8rem;
            background: #FFF;
            border: 1px solid #D7CCC8;
            padding: 4px 12px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--wood-frame-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 2px 0 #EFEBE9;
        }

        /* --- Game Board Container --- */
        .board-wrapper {
            position: relative;
            width: min(92vw, 560px);
            height: min(92vw, 560px);
            z-index: 10;
        }

        /* The Wooden Frame */
        .board-frame {
            width: 100%;
            height: 100%;
            background: var(--wood-frame);
            border-radius: 12px;
            padding: 14px; /* The frame thickness */
            box-shadow: 
                inset 0 2px 5px rgba(255,255,255,0.2),
                inset 0 -2px 5px rgba(0,0,0,0.4),
                0 15px 30px rgba(0,0,0,0.2),
                0 5px 0 var(--wood-frame-dark);
            position: relative;
        }

        /* Wood grain detail using gradient */
        .board-frame::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 12px;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(0,0,0,0.05) 10px,
                rgba(0,0,0,0.05) 20px
            );
            pointer-events: none;
        }

        /* The Grid Area */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100%;
            height: 100%;
            gap: 8px; /* Gap between tiles */
            background: var(--wood-frame-dark); /* Gap color (shadow) */
            border-radius: 4px;
            padding: 2px;
            position: relative;
        }

        /* --- The Tiles --- */
        .tile {
            background-color: var(--tile-bg);
            position: relative;
            cursor: pointer;
            border-radius: 3px;
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,1),
                inset 0 -2px 0 rgba(0,0,0,0.1),
                0 2px 0 rgba(0,0,0,0.1); /* Physical thickness */
            transition: transform 0.1s;
            overflow: hidden;
        }

        .tile:hover {
            transform: translateY(-1px);
        }

        /* --- Path Graphics (SVG) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .tile path {
            fill: none;
            stroke: var(--path-color);
            stroke-width: 22; /* Much thicker */
            stroke-linecap: square; /* Sharper corners for blocky look */
            stroke-linejoin: miter;
        }

        /* Active Path */
        .tile.active path {
            stroke: var(--path-active);
            filter: drop-shadow(0 0 4px var(--path-active-glow));
            transition: stroke 0.3s ease;
        }

        /* --- Tokens Layer --- */
        /* This sits exactly on top of the grid area, inside the frame padding */
        .token-layer {
            position: absolute;
            top: 16px; /* Matches frame padding */
            left: 16px;
            right: 16px;
            bottom: 16px;
            pointer-events: none;
            z-index: 20;
        }

        /* 1. The Cub Token */
        .cub-token {
            position: absolute;
            width: 80%; /* Critique: Scaled down to 80% */
            height: 80%;
            transform: translate(-50%, -50%);
            transition: top 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0px 3px 0px rgba(0,0,0,0.2));
        }
        
        /* 2. The Star Token */
        .star-marker {
            position: absolute;
            width: 60%; /* Scaled down */
            height: 60%;
            transform: translate(-50%, -50%);
            color: #FFD54F;
            filter: drop-shadow(0px 2px 0px #F57F17);
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.9; }
        }

        /* --- Footer Controls --- */
        footer {
            margin-top: 2rem;
            display: flex;
            gap: 1.5rem;
            width: min(92vw, 560px);
            z-index: 10;
        }

        button {
            flex: 1;
            font-family: 'Georgia', serif;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 12px 0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #FFF;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s, filter 0.1s;
            position: relative;
        }

        /* Flatter, cleaner button design with subtle border */
        .btn-reset {
            background-color: #8D6E63;
            box-shadow: 0 4px 0 #5D4037; /* Solid block shadow */
        }

        .btn-run {
            background-color: #FF7043;
            box-shadow: 0 4px 0 #D84315; /* Solid block shadow */
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(247, 243, 232, 0.9);
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-size: 4rem;
            color: var(--cub-color);
            margin: 0;
            text-shadow: 2px 2px 0 #FFF;
        }
        .overlay p {
            font-size: 1.5rem;
            color: var(--text-color);
            margin-bottom: 2rem;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .board-wrapper { width: 96vw; height: 96vw; }
            footer { width: 96vw; }
            button { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub <span>n</span> Pup</h1>
        <div class="chapter-badge">
            Chapter 1: The Garden
        </div>
    </header>

    <div class="board-wrapper">
        <div class="board-frame">
            <!-- The Grid -->
            <div class="grid" id="grid"></div>
            
            <!-- Tokens Layer -->
            <div class="token-layer">
                <!-- The Cub -->
                <div class="cub-token" id="cub">
                    <!-- Simplified, friendly geometric cub -->
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <!-- Ears -->
                        <path fill="#D84315" d="M20 30 Q15 10 35 20 Z" />
                        <path fill="#D84315" d="M80 30 Q85 10 65 20 Z" />
                        <!-- Body -->
                        <rect fill="var(--cub-color)" x="20" y="30" width="60" height="60" rx="12" />
                        <!-- Snout -->
                        <rect fill="#FFF3E0" x="30" y="45" width="40" height="25" rx="10" />
                        <!-- Eyes -->
                        <circle fill="#3E2723" cx="35" cy="40" r="3.5" />
                        <circle fill="#3E2723" cx="65" cy="40" r="3.5" />
                        <!-- Nose -->
                        <ellipse fill="#3E2723" cx="50" cy="52" rx="5" ry="3" />
                        <!-- Mouth -->
                        <path fill="none" stroke="#3E2723" stroke-width="2" d="M50 55 Q45 60 40 55 M50 55 Q55 60 60 55" />
                    </svg>
                </div>
                <!-- The Star -->
                <div class="star-marker" id="star">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z" />
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run Path</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()" style="width: 160px; box-shadow: 0 4px 0 #D84315;">Play Again</button>
    </div>

    <script>
        // --- Game Logic ---

        const GRID_SIZE = 6;
        
        // Tile Types (SVG Paths)
        // Coordinates are 0-100. Center is 50,50.
        // Stroke width is handled in CSS, but paths must align.
        const TILE_TYPES = {
            LINE: { paths: ['M50 0 V100'] }, 
            LINE_H: { paths: ['M0 50 H100'] }, 
            CORNER_TR: { paths: ['M50 0 V50 H100'] },
            CORNER_BR: { paths: ['M100 50 V100 H50'] },
            CORNER_BL: { paths: ['M0 50 V100 H50'] },
            CORNER_TL: { paths: ['M50 0 V50 H0'] },
            T_UP: { paths: ['M0 50 H100 M50 50 V100'] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'] },
            CROSS: { paths: ['M50 0 V100 M0 50 H100'] }
        };

        // Visual layout map for the demo level
        const PUZZLE_MAP = [
            ['CORNER_TL', 'LINE', 'CORNER_TR', 'LINE', 'CORNER_TL', 'LINE'],
            ['LINE', 'CORNER_BR', 'LINE', 'CORNER_TL', 'LINE', 'LINE'],
            ['LINE', 'LINE', 'CORNER_BL', 'CORNER_BR', 'CORNER_BL', 'CORNER_BR'],
            ['LINE', 'CORNER_TL', 'LINE', 'LINE', 'CORNER_BL', 'LINE'],
            ['CORNER_TR', 'LINE', 'CORNER_BL', 'CORNER_BR', 'LINE', 'LINE'],
            ['LINE', 'LINE', 'LINE', 'LINE', 'LINE', 'LINE']
        ];

        function createSVG(paths) {
            let svgContent = paths.map(p => `<path d="${p}" />`).join('');
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svgContent}</svg>`;
        }

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 5}; // Star location
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const typeKey = PUZZLE_MAP[y][x];
                        const typeData = TILE_TYPES[typeKey];
                        
                        const div = document.createElement('div');
                        div.className = 'tile';
                        div.innerHTML = createSVG(typeData.paths);
                        
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            updateTokenPosition(x, y) {
                // Calculate center of the cell in percentages relative to the grid area
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                // Remove active state from all tiles
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.updateTokenPosition(0, 0);
            }

            async run() {
                // Hardcoded path to Star at [5,5] based on the visual map
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:5, y:5} 
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    
                    // Highlight tile
                    const tile = this.cells[step.y][step.x];
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateTokenPosition(step.x, step.y);
                    
                    // Wait
                    await new Promise(r => setTimeout(r, 400));
                }

                // Win!
                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 200);
            }
        }

        const game = new Game();

    </script>
</body>
</html>
