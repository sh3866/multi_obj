<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Palette: Storybook Garden --- */
            --bg-paper: #F2EBE0;
            --ink-dark: #3E2723;
            --ink-light: #5D4037;
            
            --wood-base: #6D4C41;
            --wood-top: #8D6E63;
            --wood-shadow: #3E2723;
            
            --tile-stone: #EFEBE9;
            --tile-shadow: #D7CCC8;
            
            --path-dirt: #8D6E63;
            --path-active: #FFCA28;
            --path-glow: rgba(255, 202, 40, 0.5);

            --accent-green: #558B2F;
            --accent-red: #D84315;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            /* Paper Texture */
            background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
            font-family: 'Georgia', serif;
            color: var(--ink-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 1.5rem;
            z-index: 10;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Georgia', serif;
            font-size: 3.5rem;
            margin: 0;
            color: var(--ink-dark);
            line-height: 1;
            letter-spacing: -0.02em;
            /* Hand-drawn feel via subtle transform */
            transform: rotate(-1deg);
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
        }

        /* The orange 'n' lockup */
        h1 span {
            font-family: 'Brush Script MT', 'Segoe Script', cursive;
            color: var(--accent-red);
            font-size: 0.8em;
            margin: 0 0.1em;
            display: inline-block;
            transform: rotate(10deg) translateY(0.1em);
        }

        /* Integrated Chapter Badge */
        .chapter-badge {
            margin-top: 0.5rem;
            background: #FFF8E1;
            border: 2px solid var(--ink-dark);
            padding: 4px 16px;
            border-radius: 20px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
            transform: rotate(1deg);
            position: relative;
        }

        .chapter-badge span {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--ink-light);
        }

        /* --- The Game Board --- */
        .board-wrapper {
            position: relative;
            width: min(90vw, 540px);
            height: min(90vw, 540px);
            z-index: 10;
        }

        .board-frame {
            width: 100%;
            height: 100%;
            background: var(--wood-base);
            padding: 12px;
            border-radius: 12px;
            /* Wood texture gradient */
            background: repeating-linear-gradient(90deg, var(--wood-base), var(--wood-base) 10px, #5D4037 12px);
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.5),
                0 15px 35px rgba(0,0,0,0.2),
                0 5px 0 var(--wood-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100%;
            height: 100%;
            gap: 6px; /* Slightly wider gap for "garden bed" look */
            background: var(--wood-shadow);
            border-radius: 4px;
            padding: 4px;
        }

        .tile {
            background-color: var(--tile-stone);
            position: relative;
            cursor: pointer;
            border-radius: 4px;
            /* Soft Stone Texture */
            background-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.05) 100%);
            box-shadow: 
                inset 0 2px 0 rgba(255,255,255,0.7),
                inset 0 -2px 0 rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.3s;
        }

        .tile:hover {
            transform: translateY(-2px);
            background-color: #F5F5F5;
        }

        /* --- Paths (Ribbons/Dirt Tracks) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .tile path {
            fill: none;
            stroke: var(--path-dirt);
            stroke-width: 14;
            stroke-linecap: round;
            stroke-linejoin: round;
            /* Texture on the path itself */
            filter: drop-shadow(0px 1px 1px rgba(255,255,255,0.3)) drop-shadow(0px 1px 0px rgba(0,0,0,0.1));
            transition: stroke 0.4s ease, filter 0.4s ease;
        }

        /* Active Path State */
        .tile.active path {
            stroke: var(--path-active);
            filter: drop-shadow(0 0 4px var(--path-glow));
        }

        /* --- Tokens (Inside Grid) --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
            /* Match padding of grid container */
            padding: 16px; /* 12px frame + 4px grid padding */
        }
        
        /* We need to calculate positions based on the grid area, not the full frame */
        .grid-area-relative {
            position: absolute;
            top: 16px; left: 16px; right: 16px; bottom: 16px;
            width: calc(100% - 32px);
            height: calc(100% - 32px);
        }

        /* 1. The Cub: Illustrated Character */
        .cub-token {
            position: absolute;
            width: 60%; /* Occupy good chunk of cell */
            height: 60%;
            transform: translate(-50%, -50%);
            transition: top 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0px 4px 2px rgba(0,0,0,0.3));
        }

        /* Cub SVG Styles */
        .cub-body { fill: #E67E22; stroke: #D35400; stroke-width: 1.5; }
        .cub-snout { fill: #FAD7A1; stroke: #D35400; stroke-width: 1; }
        .cub-eye { fill: #3E2723; }
        .cub-nose { fill: #3E2723; }
        .cub-ear { fill: #D35400; }

        /* 2. The Star: Glowing Marker */
        .star-marker {
            position: absolute;
            width: 50%;
            height: 50%;
            transform: translate(-50%, -50%);
            color: var(--path-active);
            filter: drop-shadow(0 2px 0 #F57F17) drop-shadow(0 0 8px var(--path-glow));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -55%) scale(1.1); }
        }

        /* --- Footer Controls: Wooden Signs --- */
        footer {
            margin-top: 2rem;
            display: flex;
            gap: 1.5rem;
            width: min(90vw, 540px);
            justify-content: space-between;
            z-index: 10;
        }

        button {
            flex: 1;
            font-family: 'Georgia', serif;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 14px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #FFF;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            transition: transform 0.1s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
            
            /* Wood Sign Look */
            background: linear-gradient(to bottom, var(--wood-top) 0%, var(--wood-base) 100%);
            border-bottom: 6px solid var(--wood-shadow);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        /* Screws */
        button::before, button::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 6px; height: 6px;
            background: #3E2723;
            border-radius: 50%;
            transform: translateY(-50%);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }
        button::before { left: 10px; }
        button::after { right: 10px; }

        .btn-reset {
            background: linear-gradient(to bottom, #A1887F 0%, #795548 100%);
            border-bottom-color: #4E342E;
        }

        .btn-run {
            background: linear-gradient(to bottom, #FF7043 0%, #D84315 100%);
            border-bottom-color: #870000;
        }

        button:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(242, 235, 224, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-family: 'Georgia', serif;
            font-size: 4.5rem;
            color: var(--accent-red);
            margin: 0;
            transform: rotate(-5deg);
            text-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }
        .overlay p {
            font-size: 1.5rem;
            color: var(--ink-soft);
            font-style: italic;
            margin-bottom: 2.5rem;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .board-wrapper { width: 94vw; height: 94vw; }
            footer { width: 94vw; }
            button { font-size: 1rem; padding: 12px 0; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub <span>n</span> Pup</h1>
        <div class="chapter-badge">
            <span>Chapter 1: The Garden</span>
        </div>
    </header>

    <div class="board-wrapper">
        <div class="board-frame">
            <!-- The Grid -->
            <div class="grid" id="grid"></div>
        </div>
        
        <!-- Tokens Layer (Absolute over grid area) -->
        <div class="token-layer">
            <div class="grid-area-relative">
                <!-- The Cub -->
                <div class="cub-token" id="cub">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <!-- Ears -->
                        <path class="cub-ear" d="M20 30 Q15 10 35 20 Z" />
                        <path class="cub-ear" d="M80 30 Q85 10 65 20 Z" />
                        <!-- Body -->
                        <rect class="cub-body" x="20" y="30" width="60" height="60" rx="10" />
                        <!-- Snout -->
                        <rect class="cub-snout" x="35" y="45" width="30" height="20" rx="5" />
                        <!-- Eyes -->
                        <circle class="cub-eye" cx="35" cy="40" r="3" />
                        <circle class="cub-eye" cx="65" cy="40" r="3" />
                        <!-- Nose -->
                        <circle class="cub-nose" cx="50" cy="50" r="4" />
                    </svg>
                </div>
                <!-- The Star -->
                <div class="star-marker" id="star">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z" />
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run Path</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()" style="width: auto; padding: 12px 30px;">Play Again</button>
    </div>

    <script>
        // --- Game Logic & Drawing ---

        const GRID_SIZE = 6;
        
        // Tile Types (SVG Paths)
        // Using slightly thicker visual paths
        const TILE_TYPES = {
            LINE: { paths: ['M50 0 V100'] }, 
            LINE_H: { paths: ['M0 50 H100'] }, 
            CORNER_TR: { paths: ['M50 0 V50 H100'] },
            CORNER_BR: { paths: ['M100 50 V100 H50'] },
            CORNER_BL: { paths: ['M0 50 V100 H50'] },
            CORNER_TL: { paths: ['M50 0 V50 H0'] },
            T_UP: { paths: ['M0 50 H100 M50 50 V100'] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'] },
            CROSS: { paths: ['M50 0 V100 M0 50 H100'] }
        };

        // Visual layout map for the demo level
        const PUZZLE_MAP = [
            ['CORNER_TL', 'LINE', 'CORNER_TR', 'LINE', 'CORNER_TL', 'LINE'],
            ['LINE', 'CORNER_BR', 'LINE', 'CORNER_TL', 'LINE', 'LINE'],
            ['LINE', 'LINE', 'CORNER_BL', 'CORNER_BR', 'CORNER_BL', 'CORNER_BR'],
            ['LINE', 'CORNER_TL', 'LINE', 'LINE', 'CORNER_BL', 'LINE'],
            ['CORNER_TR', 'LINE', 'CORNER_BL', 'CORNER_BR', 'LINE', 'LINE'],
            ['LINE', 'LINE', 'LINE', 'LINE', 'LINE', 'LINE']
        ];

        function createSVG(paths) {
            let svgContent = paths.map(p => `<path d="${p}" />`).join('');
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svgContent}</svg>`;
        }

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 5}; // Star location
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const typeKey = PUZZLE_MAP[y][x];
                        const typeData = TILE_TYPES[typeKey];
                        
                        const div = document.createElement('div');
                        div.className = 'tile';
                        div.innerHTML = createSVG(typeData.paths);
                        
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            updateTokenPosition(x, y) {
                // Calculate center of the cell in percentages relative to the grid area
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                // Remove active state from all tiles
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.updateTokenPosition(0, 0);
            }

            async run() {
                // Hardcoded path to Star at [5,5] based on the visual map
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:5, y:5} 
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    
                    // Highlight tile
                    const tile = this.cells[step.y][step.x];
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateTokenPosition(step.x, step.y);
                    
                    // Wait
                    await new Promise(r => setTimeout(r, 400));
                }

                // Win!
                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 200);
            }
        }

        const game = new Game();

    </script>
</body>
</html>
