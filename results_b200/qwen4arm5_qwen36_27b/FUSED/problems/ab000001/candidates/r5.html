<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Palette: Soft Storybook --- */
            --bg-color: #F4F1EA;
            --text-main: #5D4037;
            --text-light: #8D6E63;
            
            /* Board & Frame */
            --frame-color: #8D6E63;
            --frame-shadow: #5D4037;
            --frame-highlight: #A1887F;
            --board-bg: #EFEBE9; /* The "wood" between tiles */
            
            /* Tiles */
            --tile-color: #FFFBF0; /* Creamy paper */
            --tile-shadow: #D7CCC8;
            --tile-border: #EFEBE9;
            
            /* Paths */
            --path-inactive: #D7CCC8;
            --path-active: #FFB74D; /* Warm Orange */
            --path-glow: rgba(255, 183, 77, 0.5);
            
            /* Tokens */
            --cub-primary: #FF7043;
            --cub-dark: #D84315;
            --star-color: #FDD835;
            --star-stroke: #FBC02D;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            /* Subtle paper texture */
            background-image: radial-gradient(var(--tile-shadow) 1px, transparent 0);
            background-size: 24px 24px;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 1.5rem;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: 3.2rem;
            margin: 0;
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--text-main);
            font-weight: bold;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
        }

        /* Decorative 'n' */
        h1 span {
            font-family: 'Brush Script MT', 'Snell Roundhand', cursive;
            font-size: 1.4em;
            color: var(--cub-primary);
            margin: 0 0.1em;
            vertical-align: middle;
            transform: rotate(-5deg);
            display: inline-block;
        }

        .chapter-badge {
            display: inline-block;
            margin-top: 0.8rem;
            background: #FFF;
            border: 2px solid var(--text-light);
            padding: 4px 16px;
            border-radius: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.05);
        }

        /* --- Game Board Container --- */
        .board-wrapper {
            position: relative;
            width: min(90vw, 540px);
            height: min(90vw, 540px);
            z-index: 10;
        }

        /* The Frame */
        .board-frame {
            width: 100%;
            height: 100%;
            background: var(--frame-color);
            border-radius: 16px;
            padding: 12px; /* Frame thickness */
            box-shadow: 
                inset 0 2px 0 var(--frame-highlight),
                inset 0 -4px 0 var(--frame-shadow),
                0 10px 0 var(--frame-shadow),
                0 20px 40px rgba(0,0,0,0.15);
            position: relative;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        /* Wood grain effect via SVG pattern in background */
        .board-frame::after {
            content: "";
            position: absolute;
            top:0; left:0; right:0; bottom:0;
            border-radius: 16px;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* The Grid Area */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100%;
            height: 100%;
            gap: 6px; /* The "grout" between tiles */
            background: var(--board-bg); /* Visible through gaps */
            border-radius: 8px;
            padding: 4px;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        /* --- The Tiles --- */
        .tile {
            background-color: var(--tile-color);
            position: relative;
            cursor: pointer;
            border-radius: 4px;
            /* Soft inset look */
            box-shadow: 
                inset 0 1px 3px rgba(0,0,0,0.05),
                0 1px 0 #FFF; 
            transition: transform 0.2s, background-color 0.2s;
            overflow: hidden;
        }

        .tile:hover {
            transform: translateY(-2px);
            z-index: 2;
        }

        /* --- Path Graphics (SVG) --- */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .tile path {
            fill: none;
            stroke: var(--path-inactive);
            stroke-width: 18;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s ease, filter 0.3s ease;
        }

        /* Active Path State */
        .tile.active path {
            stroke: var(--path-active);
            filter: drop-shadow(0 0 6px var(--path-glow));
        }
        
        /* --- Tokens Layer --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 20;
            /* Matches grid padding roughly to keep tokens centered in tiles */
            padding: 4px; 
        }

        /* 1. The Cub Token */
        .cub-token {
            position: absolute;
            width: 75%; /* Scaled nicely within cell */
            height: 75%;
            transform: translate(-50%, -50%);
            /* Bouncy transition */
            transition: top 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0px 4px 2px rgba(0,0,0,0.2));
        }
        
        /* 2. The Star Token */
        .star-marker {
            position: absolute;
            width: 60%;
            height: 60%;
            transform: translate(-50%, -50%);
            color: var(--star-color);
            filter: drop-shadow(0px 2px 0px var(--star-stroke));
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-4px); }
        }

        /* --- Footer Controls --- */
        footer {
            margin-top: 2.5rem;
            display: flex;
            gap: 1.5rem;
            width: min(90vw, 540px);
            z-index: 10;
        }

        button {
            flex: 1;
            font-family: 'Georgia', serif;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 14px 0;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: #FFF;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s, box-shadow 0.1s;
            position: relative;
            outline: none;
        }

        /* Reset Button */
        .btn-reset {
            background-color: var(--frame-color);
            box-shadow: 0 5px 0 var(--frame-shadow);
        }

        /* Run Button (Primary) */
        .btn-run {
            background-color: var(--cub-primary);
            box-shadow: 0 5px 0 var(--cub-dark);
        }

        button:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(244, 241, 234, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-size: 4.5rem;
            color: var(--cub-primary);
            margin: 0;
            text-shadow: 3px 3px 0 #FFF, 6px 6px 0 rgba(0,0,0,0.05);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .overlay p {
            font-size: 1.4rem;
            color: var(--text-main);
            margin: 1rem 0 2.5rem 0;
            font-weight: bold;
        }
        
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Responsive adjustments */
        @media (max-width: 500px) {
            h1 { font-size: 2.5rem; }
            .board-wrapper { width: 94vw; height: 94vw; }
            footer { width: 94vw; gap: 1rem; }
            button { font-size: 1rem; padding: 12px 0; }
            .tile path { stroke-width: 22; } /* Thicker paths on mobile */
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub <span>n</span> Pup</h1>
        <div class="chapter-badge">
            Chapter 1: The Garden
        </div>
    </header>

    <div class="board-wrapper">
        <div class="board-frame">
            <!-- The Grid -->
            <div class="grid" id="grid"></div>
            
            <!-- Tokens Layer -->
            <div class="token-layer">
                <!-- The Cub -->
                <div class="cub-token" id="cub">
                    <!-- SVG Cub: Friendly, chunky vector -->
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <!-- Ears -->
                        <path fill="#D84315" d="M25 35 Q15 10 40 20 Z" />
                        <path fill="#D84315" d="M75 35 Q85 10 60 20 Z" />
                        <!-- Head/Body -->
                        <rect fill="var(--cub-primary)" x="20" y="25" width="60" height="60" rx="15" />
                        <!-- Snout -->
                        <ellipse fill="#FFF3E0" cx="50" cy="55" rx="18" ry="14" />
                        <!-- Eyes -->
                        <circle fill="#3E2723" cx="38" cy="42" r="4" />
                        <circle fill="#3E2723" cx="62" cy="42" r="4" />
                        <!-- Eye Shine -->
                        <circle fill="#FFF" cx="39.5" cy="40.5" r="1.5" />
                        <circle fill="#FFF" cx="63.5" cy="40.5" r="1.5" />
                        <!-- Nose -->
                        <ellipse fill="#3E2723" cx="50" cy="52" rx="6" ry="4" />
                        <!-- Mouth -->
                        <path fill="none" stroke="#3E2723" stroke-width="2" stroke-linecap="round" d="M50 56 Q45 62 40 56 M50 56 Q55 62 60 56" />
                    </svg>
                </div>
                
                <!-- The Star -->
                <div class="star-marker" id="star">
                    <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run Path</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()" style="width: 180px; box-shadow: 0 5px 0 #D84315;">Play Again</button>
    </div>

    <script>
        // --- Game Logic ---

        const GRID_SIZE = 6;
        
        // Tile Types (SVG Paths)
        // Coordinates are 0-100. Center is 50,50.
        const TILE_TYPES = {
            LINE: { paths: ['M50 0 V100'] }, 
            LINE_H: { paths: ['M0 50 H100'] }, 
            CORNER_TR: { paths: ['M50 0 V50 H100'] },
            CORNER_BR: { paths: ['M100 50 V100 H50'] },
            CORNER_BL: { paths: ['M0 50 V100 H50'] },
            CORNER_TL: { paths: ['M50 0 V50 H0'] },
            T_UP: { paths: ['M0 50 H100 M50 50 V100'] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'] },
            CROSS: { paths: ['M50 0 V100 M0 50 H100'] }
        };

        // Visual layout map for the demo level
        // Designed to be a winding path from Top-Left to Bottom-Right
        const PUZZLE_MAP = [
            ['CORNER_TL', 'LINE', 'CORNER_TR', 'LINE', 'CORNER_TL', 'LINE'],
            ['LINE', 'CORNER_BR', 'LINE', 'CORNER_TL', 'LINE', 'LINE'],
            ['LINE', 'LINE', 'CORNER_BL', 'CORNER_BR', 'CORNER_BL', 'CORNER_BR'],
            ['LINE', 'CORNER_TL', 'LINE', 'LINE', 'CORNER_BL', 'LINE'],
            ['CORNER_TR', 'LINE', 'CORNER_BL', 'CORNER_BR', 'LINE', 'LINE'],
            ['LINE', 'LINE', 'LINE', 'LINE', 'LINE', 'LINE']
        ];

        function createSVG(paths) {
            let svgContent = paths.map(p => `<path d="${p}" />`).join('');
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svgContent}</svg>`;
        }

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 5}; // Star location
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const typeKey = PUZZLE_MAP[y][x];
                        const typeData = TILE_TYPES[typeKey];
                        
                        const div = document.createElement('div');
                        div.className = 'tile';
                        div.innerHTML = createSVG(typeData.paths);
                        
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            updateTokenPosition(x, y) {
                // Calculate center of the cell in percentages relative to the grid area
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                // Remove active state from all tiles
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.updateTokenPosition(0, 0);
            }

            async run() {
                // Hardcoded path to Star at [5,5] based on the visual map
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:5, y:5} 
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    
                    // Highlight tile
                    const tile = this.cells[step.y][step.x];
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateTokenPosition(step.x, step.y);
                    
                    // Wait
                    await new Promise(r => setTimeout(r, 350));
                }

                // Win!
                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 300);
            }
        }

        const game = new Game();

    </script>
</body>
</html>
