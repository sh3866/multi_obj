<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Color Palette: Storybook Warmth --- */
            --bg-paper: #FDFBF7;
            --ink-dark: #3E2723;
            --ink-soft: #795548;
            --wood-frame: #5D4037;
            --wood-frame-light: #8D6E63;
            --tile-base: #EFEBE9;
            --tile-shadow: #D7CCC8;
            
            --path-inactive: #BCAAA4;
            --path-active: #D84315; /* Burnt Orange */
            --path-glow: rgba(216, 67, 21, 0.4);
            
            --accent-gold: #FBC02D;
            --accent-gold-shadow: #F57F17;
            
            --btn-primary: #E64A19;
            --btn-primary-shadow: #BF360C;
            --btn-secondary: #8D6E63;
            --btn-secondary-shadow: #5D4037;
            
            /* --- Dimensions --- */
            --board-size: min(85vw, 520px);
            --gap: 6px;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            /* Paper Texture */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
            font-family: 'Georgia', 'Times New Roman', serif;
            color: var(--ink-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Typography --- */
        header {
            text-align: center;
            margin-bottom: 1rem;
            position: relative;
        }

        h1 {
            font-family: 'Georgia', serif;
            font-size: 3.5rem;
            margin: 0;
            color: var(--wood-frame);
            /* Hand-drawn/Warm feel */
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            letter-spacing: -0.02em;
            line-height: 1;
        }

        .level-stamp {
            display: inline-block;
            margin-top: 0.5rem;
            font-family: 'Courier New', Courier, monospace; /* Typewriter style for contrast */
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--ink-soft);
            background: rgba(255,255,255,0.6);
            border: 2px solid var(--ink-soft);
            border-radius: 4px; /* Slight rounding but mostly boxy */
            padding: 4px 16px;
            transform: rotate(-2deg);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.05);
            opacity: 0.8;
            text-transform: uppercase;
        }

        /* --- The Game Board --- */
        .board-frame {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            /* Elegant double border frame */
            border: 8px solid var(--wood-frame);
            border-radius: 12px;
            background: var(--wood-frame); /* Gap color */
            padding: 8px;
            box-shadow: 
                0 15px 35px rgba(62, 39, 35, 0.15),
                inset 0 0 0 2px var(--wood-frame-light);
        }

        /* Inner decorative line */
        .board-frame::before {
            content: '';
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 6px;
            pointer-events: none;
            z-index: 5;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100%;
            height: 100%;
            gap: var(--gap);
        }

        .tile {
            background-color: var(--tile-base);
            position: relative;
            cursor: pointer;
            /* Soft shadow for depth */
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.05);
            border-radius: 4px;
            overflow: visible; /* Allow path glow to spill slightly */
        }

        /* SVG Paths Styling */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .tile path {
            fill: none;
            stroke: var(--path-inactive);
            stroke-width: 10;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s ease, filter 0.3s ease;
        }

        /* Active Path State */
        .tile.active path {
            stroke: var(--path-active);
            filter: drop-shadow(0 0 4px var(--path-glow));
        }

        /* --- Tokens --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            padding: 8px; /* Match frame padding */
        }

        /* 1. The Cub: Wooden Block Character */
        .cub-token {
            position: absolute;
            width: 45%;
            height: 45%;
            background: #E67E22;
            /* Wood texture gradient */
            background-image: linear-gradient(135deg, #F39C12 0%, #D35400 100%);
            border-radius: 6px;
            transform: translate(-50%, -50%);
            /* Physical depth */
            box-shadow: 
                0 6px 0 #A04000, 
                0 8px 10px rgba(0,0,0,0.3),
                inset 2px 2px 0 rgba(255,255,255,0.3);
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Cub Face */
        .cub-face {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .cub-face::before { /* Eyes */
            content: '';
            position: absolute;
            top: 35%; left: 20%;
            width: 15%; height: 15%;
            background: #3E2723;
            border-radius: 50%;
            box-shadow: 35px 0 0 #3E2723; /* Right eye */
        }
        .cub-face::after { /* Mouth */
            content: '';
            position: absolute;
            top: 60%; left: 40%;
            width: 20%; height: 10%;
            border-bottom: 3px solid #3E2723;
            border-radius: 0 0 10px 10px;
        }

        /* 2. The Star: Hand-drawn/Foil style */
        .star-marker {
            position: absolute;
            width: 40%;
            height: 40%;
            transform: translate(-50%, -50%);
            color: var(--accent-gold);
            filter: drop-shadow(0 3px 0 var(--accent-gold-shadow));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) rotate(-5deg); }
            50% { transform: translate(-50%, -55%) rotate(5deg); }
        }

        /* --- Footer Controls --- */
        footer {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            width: var(--board-size); /* Match board width */
            justify-content: space-between;
        }

        button {
            flex: 1;
            font-family: 'Georgia', serif;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 14px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
            position: relative;
            top: 0;
        }

        button:active {
            top: 4px;
            box-shadow: none !important;
        }

        .btn-reset {
            background: var(--btn-secondary);
            box-shadow: 0 5px 0 var(--btn-secondary-shadow), 0 8px 10px rgba(0,0,0,0.1);
        }
        .btn-reset:hover {
            background: #A1887F;
        }

        .btn-run {
            background: var(--btn-primary);
            box-shadow: 0 5px 0 var(--btn-primary-shadow), 0 8px 10px rgba(0,0,0,0.1);
        }
        .btn-run:hover {
            background: #FF7043;
        }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(253, 251, 247, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-size: 4rem;
            color: var(--btn-primary);
            margin: 0;
            transform: rotate(-5deg);
            text-shadow: 3px 3px 0 rgba(0,0,0,0.1);
        }
        .overlay p {
            font-size: 1.5rem;
            color: var(--ink-soft);
            font-style: italic;
        }

        /* Responsive */
        @media (max-width: 600px) {
            :root { --board-size: 92vw; }
            h1 { font-size: 2.8rem; }
            .cub-token { width: 40%; height: 40%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="level-stamp">Level 1: The Garden</div>
    </header>

    <div class="board-frame">
        <!-- The Grid -->
        <div class="grid" id="grid"></div>
        
        <!-- Tokens Layer -->
        <div class="token-layer">
            <div class="cub-token" id="cub">
                <div class="cub-face"></div>
            </div>
            <div class="star-marker" id="star">
                <!-- Custom SVG Star for texture -->
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
                </svg>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run Path</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()" style="width: auto; padding: 12px 30px; margin-top: 20px;">Play Again</button>
    </div>

    <script>
        // --- Game Logic & Drawing ---

        const GRID_SIZE = 6;
        
        // Tile Types (SVG Paths)
        // Coordinates: 0,0 is top-left. 100,100 is bottom-right. Center is 50,50.
        const TILE_TYPES = {
            LINE: { paths: ['M50 0 V100'] }, 
            LINE_H: { paths: ['M0 50 H100'] }, 
            CORNER_TR: { paths: ['M50 0 V50 H100'] },
            CORNER_BR: { paths: ['M100 50 V100 H50'] },
            CORNER_BL: { paths: ['M0 50 V100 H50'] },
            CORNER_TL: { paths: ['M50 0 V50 H0'] },
            T_UP: { paths: ['M0 50 H100 M50 50 V100'] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'] },
            CROSS: { paths: ['M50 0 V100 M0 50 H100'] }
        };

        // Visual layout map for the demo level
        // Keys correspond to TILE_TYPES above
        const PUZZLE_MAP = [
            ['CORNER_TL', 'LINE', 'CORNER_TR', 'LINE', 'CORNER_TL', 'LINE'],
            ['LINE', 'CORNER_BR', 'LINE', 'CORNER_TL', 'LINE', 'LINE'],
            ['LINE', 'LINE', 'CORNER_BL', 'CORNER_BR', 'CORNER_BL', 'CORNER_BR'],
            ['LINE', 'CORNER_TL', 'LINE', 'LINE', 'CORNER_BL', 'LINE'],
            ['CORNER_TR', 'LINE', 'CORNER_BL', 'CORNER_BR', 'LINE', 'LINE'],
            ['LINE', 'LINE', 'LINE', 'LINE', 'LINE', 'LINE']
        ];

        function createSVG(paths) {
            let svgContent = paths.map(p => `<path d="${p}" />`).join('');
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svgContent}</svg>`;
        }

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 5}; // Star location
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const typeKey = PUZZLE_MAP[y][x];
                        const typeData = TILE_TYPES[typeKey];
                        
                        const div = document.createElement('div');
                        div.className = 'tile';
                        div.innerHTML = createSVG(typeData.paths);
                        
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            updateTokenPosition(x, y) {
                // Calculate center of the cell in percentages
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                // Remove active state from all tiles
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.updateTokenPosition(0, 0);
            }

            async run() {
                // Hardcoded path to Star at [5,5] based on the visual map
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:5, y:5} 
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    
                    // Highlight tile
                    const tile = this.cells[step.y][step.x];
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateTokenPosition(step.x, step.y);
                    
                    // Wait
                    await new Promise(r => setTimeout(r, 400));
                }

                // Win!
                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 200);
            }
        }

        const game = new Game();

    </script>
</body>
</html>
