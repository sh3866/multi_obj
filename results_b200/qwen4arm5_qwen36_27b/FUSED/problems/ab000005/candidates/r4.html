<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restoring Warmth | Premium Cleaning</title>
    <style>
        :root {
            --text-dark: #1A1410;
            --text-light: #F5E6D3;
            --accent: #8B5A2B;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --font-serif: "Playfair Display", "Georgia", "Times New Roman", serif;
            --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2C241B; /* Fallback color */
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        /* Full Scene Container */
        .scene-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Background SVG Layer */
        .background-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* The Overlay Content Layer */
        .overlay-content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            pointer-events: none; /* Let clicks pass through empty areas */
        }

        /* The Text Card */
        .text-card {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 80px;
            margin-left: 10%; /* Offset from left */
            max-width: 600px;
            
            /* Glassmorphism */
            background: rgba(26, 20, 16, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .brand {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-light);
            opacity: 0.8;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .brand-dot {
            width: 8px;
            height: 8px;
            background-color: #D4AF37; /* Gold accent */
            border-radius: 50%;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 64px;
            line-height: 1.1;
            color: var(--text-light);
            margin: 0 0 24px 0;
            font-weight: 400;
            letter-spacing: -0.02em;
        }

        h1 em {
            font-style: italic;
            color: #E8DCC4;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: rgba(245, 230, 211, 0.8);
            margin-bottom: 40px;
            font-weight: 300;
            max-width: 400px;
        }

        .cta-button {
            background-color: var(--text-light);
            color: var(--text-dark);
            border: none;
            padding: 18px 40px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: fit-content;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .cta-button:hover {
            background-color: #D4AF37;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
        }

        /* Responsive adjustments */
        @media (max-width: 900px) {
            .overlay-content {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            .text-card {
                margin: 0 20px 40px 20px;
                padding: 40px;
                order: 2; /* Push text below visual on mobile */
            }
            h1 { font-size: 42px; }
        }

    </style>
</head>
<body>

<div class="scene-wrapper">
    <!-- Background Visuals -->
    <svg class="background-svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMidYMid slice">
        <defs>
            <!-- 1. Advanced Wood Texture -->
            <filter id="woodNoise" x="0%" y="0%" width="100%" height="100%">
                <!-- Grain -->
                <feTurbulence type="fractalNoise" baseFrequency="0.01 0.15" numOctaves="3" result="grain"/>
                <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.8 0 0 0  0 0.6 0 0 0  0 0 0 0.2 0" in="grain" result="coloredGrain"/>
                
                <!-- Knots -->
                <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="knots"/>
                <feDisplacementMap in="SourceGraphic" in2="knots" scale="20" xChannelSelector="R" yChannelSelector="G" result="warped"/>
                
                <feBlend in="warped" in2="coloredGrain" mode="multiply"/>
            </filter>

            <!-- 2. Blur Filters -->
            <filter id="blurSmall" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4"/>
            </filter>
            <filter id="blurLarge" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="15"/>
            </filter>

            <!-- 3. Wood Gradient (Warm tones) -->
            <linearGradient id="woodBase" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#6B4423" />
                <stop offset="20%" style="stop-color:#8B5A2B" />
                <stop offset="80%" style="stop-color:#754822" />
                <stop offset="100%" style="stop-color:#523319" />
            </linearGradient>

            <!-- 4. Plank Pattern -->
            <pattern id="planks" width="200" height="1200" patternUnits="userSpaceOnUse">
                <rect width="200" height="1200" fill="url(#woodBase)" />
                <!-- Plank Gap (Darker) -->
                <rect x="196" y="0" width="4" height="1200" fill="#2E1F12" opacity="0.9"/>
                <!-- Highlight edge -->
                <rect x="194" y="0" width="2" height="1200" fill="#A06B38" opacity="0.3"/>
            </pattern>

            <!-- 5. Coffee Spill Gradient -->
            <radialGradient id="coffeeGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" style="stop-color:#3E2723;stop-opacity:0.9" />
                <stop offset="70%" style="stop-color:#4E342E;stop-opacity:0.8" />
                <stop offset="100%" style="stop-color:#5D4037;stop-opacity:0.0" />
            </radialGradient>

            <!-- 6. Water Puddle Gradient -->
            <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" style="stop-color:#64B5F6;stop-opacity:0.4" />
                <stop offset="60%" style="stop-color:#42A5F5;stop-opacity:0.2" />
                <stop offset="100%" style="stop-color:#2196F3;stop-opacity:0.0" />
            </radialGradient>

            <!-- 7. Wet Floor Sheen -->
            <linearGradient id="wetSheen" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0" />
                <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
                <stop offset="60%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
                <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
            </linearGradient>
        </defs>

        <!-- LAYER 1: The Floor -->
        <g id="floor">
            <!-- Pattern Base -->
            <rect width="100%" height="100%" fill="url(#planks)" />
            <!-- Texture Overlay -->
            <rect width="100%" height="100%" fill="none" filter="url(#woodNoise)" opacity="0.8" pointer-events="none" />
            <!-- Global Vignette for depth -->
            <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
                <stop offset="40%" style="stop-color:#000;stop-opacity:0" />
                <stop offset="100%" style="stop-color:#1A1410;stop-opacity:0.8" />
            </radialGradient>
            <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none" />
        </g>

        <!-- LAYER 2: The Narrative (Spills & Cleaning) -->
        <g id="narrative">
            
            <!-- A. The Coffee Spill (Viscous, Dark) -->
            <!-- Positioned bottom right, slightly off-center to balance the text card -->
            <g transform="translate(850, 600)">
                <!-- Wet Darkening on Wood -->
                <path d="M-50,-50 C50,-80 150,-20 120,60 C90,140 -20,180 -80,100 C-120,40 -100,0 -50,-50 Z" 
                      fill="#2E1F12" opacity="0.6" filter="url(#blurSmall)"/>
                
                <!-- The Liquid -->
                <path d="M-40,-40 C40,-70 140,-10 110,50 C80,130 -10,170 -70,90 C-110,30 -90,-5 -40,-40 Z" 
                      fill="url(#coffeeGrad)" />
                
                <!-- Specular Highlights (Wetness) -->
                <ellipse cx="20" cy="10" rx="30" ry="10" fill="#FFF" opacity="0.15" transform="rotate(-15 20 10)" />
                <ellipse cx="60" cy="40" rx="10" ry="5" fill="#FFF" opacity="0.1" transform="rotate(10 60 40)" />
            </g>

            <!-- B. The Water Puddle (Transparent, Blue) -->
            <g transform="translate(600, 450)">
                <!-- Refraction/Darkening -->
                <circle cx="0" cy="0" r="100" fill="#000" opacity="0.2" filter="url(#blurSmall)"/>
                
                <!-- The Water -->
                <path d="M-80,-20 C-50,-80 40,-60 80,-10 C120,40 60,90 -10,80 C-80,70 -110,40 -80,-20 Z" 
                      fill="url(#waterGrad)" />
                
                <!-- Water Edge Highlight -->
                <path d="M-70,-15 C-40,-70 30,-50 70,-5" fill="none" stroke="#90CAF9" stroke-width="1.5" opacity="0.6" />
                
                <!-- Bubbles -->
                <circle cx="20" cy="-30" r="3" fill="#FFF" opacity="0.6" />
                <circle cx="40" cy="-10" r="5" fill="#FFF" opacity="0.5" />
                <circle cx="-10" cy="20" r="2" fill="#FFF" opacity="0.7" />
            </g>

            <!-- C. The Cleaned Path (Wet Wood) -->
            <!-- Sweeping from top left (behind text) towards the mop -->
            <g id="clean-path">
                <!-- Base Wet Darkening -->
                <path d="M-100,100 Q300,500 600,800 L700,700 Q400,400 0,0 Z" 
                      fill="#3E2B1F" opacity="0.4" filter="url(#blurLarge)" />
                
                <!-- The Sheen (Reflection) -->
                <path d="M-100,100 Q300,500 600,800 L700,700 Q400,400 0,0 Z" 
                      fill="url(#wetSheen)" opacity="0.6" />
                
                <!-- Specular streak -->
                <path d="M100,200 Q350,550 550,750" stroke="#FFF" stroke-width="40" opacity="0.1" filter="url(#blurSmall)" />
            </g>
        </g>

        <!-- LAYER 3: The Mop (Centered Action) -->
        <g id="mop" transform="translate(650, 650) rotate(-45)">
            
            <!-- Shadow -->
            <ellipse cx="20" cy="20" rx="80" ry="40" fill="#000" opacity="0.5" filter="url(#blurSmall)" />

            <!-- Handle -->
            <!-- Long, elegant, disappears off top -->
            <rect x="-12" y="-1000" width="24" height="1200" fill="#1A1410" />
            <!-- Handle Highlight -->
            <rect x="-8" y="-1000" width="4" height="1200" fill="#FFF" opacity="0.1" />

            <!-- Metal Joint -->
            <g transform="translate(0, 180)">
                <rect x="-15" y="-20" width="30" height="40" rx="4" fill="#555" />
                <rect x="-20" y="10" width="40" height="15" rx="2" fill="#333" />
            </g>

            <!-- Mop Head (Flat Microfiber) -->
            <g transform="translate(0, 220)">
                <!-- Pad Base -->
                <rect x="-70" y="0" width="140" height="180" rx="10" fill="#E0E0E0" />
                
                <!-- Microfiber Texture (Vertical Stripes) -->
                <g opacity="0.4">
                    <path d="M-60,0 L-60,180 M-40,0 L-40,180 M-20,0 L-20,180 M0,0 L0,180 M20,0 L20,180 M40,0 L40,180 M60,0 L60,180" 
                          stroke="#999" stroke-width="2" />
                </g>
                
                <!-- Wetness on Pad (Bottom half) -->
                <rect x="-70" y="80" width="140" height="100" rx="10" fill="#333" opacity="0.2" />
                
                <!-- Soap residue -->
                <path d="M-50,40 Q-20,60 0,40 T40,60" fill="none" stroke="#FFF" stroke-width="2" opacity="0.8" filter="url(#blurSmall)" />
            </g>
        </g>

        <!-- LAYER 4: Lighting -->
        <g id="lighting" pointer-events="none">
            <!-- Top Left Light (Simulating window) -->
            <ellipse cx="200" cy="100" rx="600" ry="600" fill="#FFF" opacity="0.05" filter="url(#blurLarge)" />
        </g>
    </svg>

    <!-- Foreground Text Overlay -->
    <div class="overlay-content">
        <div class="text-card">
            <div class="brand">
                <div class="brand-dot"></div>
                Spotless Co.
            </div>
            
            <h1>Restoring the <br><em>warmth</em> of home.</h1>
            
            <p>We don't just clean surfaces; we reveal the texture and soul of your living space. A meticulous, eco-friendly deep clean that honors your home.</p>
            
            <button class="cta-button">Schedule Service</button>
        </div>
    </div>
</div>

</body>
</html>
