<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        /* 
           SYSTEM FONT STACK FOR PIXEL ART
           Using 'Courier New' and 'Lucida Console' for that chunky, offline-safe monospace look.
        */
        :root {
            --c-sky-top: #406090;
            --c-sky-bot: #88A0C0;
            --c-snow: #FFFFFF;
            --c-snow-shadow: #B0C0D0;
            --c-text: #FFFFFF;
            --c-text-shadow: #000000;
            --c-accent: #E03030; /* Retro Red */
            --c-accent-dark: #800000;
            --c-wood: #8B5A2B;
            --c-wood-light: #A06A3B;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: "Courier New", "Lucida Console", "Lucida Sans Typewriter", monospace;
        }

        /* Canvas World - Force Pixelated Scaling */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* UI Container */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none; /* Let clicks pass through to canvas where needed */
        }

        /* 4. Unify Typography & 5. Refine Title */
        h1 {
            margin-top: 8vh;
            margin-bottom: 0;
            font-weight: 900;
            font-size: 5rem;
            text-transform: uppercase;
            color: var(--c-snow);
            text-align: center;
            letter-spacing: -4px;
            line-height: 1;
            /* Strong 3D Shadow */
            text-shadow: 
                4px 4px 0px var(--c-text-shadow),
                8px 8px 0px rgba(0,0,0,0.2);
            z-index: 20;
            animation: titleBob 3s ease-in-out infinite;
            pointer-events: auto;
        }

        /* 1. Diegetic Instructions: Wooden Signpost */
        .signpost-container {
            position: relative;
            margin-top: 20px;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
        }

        .sign-board {
            background-color: var(--c-wood);
            border: 4px solid #000;
            padding: 12px 24px;
            position: relative;
            /* Pixel corners effect */
            box-shadow: 
                inset 4px 4px 0px var(--c-wood-light),
                inset -4px -4px 0px #3e2723,
                6px 6px 0px rgba(0,0,0,0.4);
            transform: rotate(-2deg);
        }

        /* Nails on the board */
        .sign-board::before, .sign-board::after {
            content: '';
            position: absolute;
            top: 8px;
            width: 6px;
            height: 6px;
            background: #333;
            border: 1px solid #fff;
            box-shadow: 1px 1px 0 #000;
        }
        .sign-board::before { left: 8px; }
        .sign-board::after { right: 8px; }

        .sign-text {
            color: #FFF;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 0 #000;
            line-height: 1.5;
        }

        .sign-post {
            width: 16px;
            height: 60px;
            background: var(--c-wood);
            border: 2px solid #000;
            border-top: none;
            margin-top: -4px; /* Connect to board */
            box-shadow: inset 2px 0 0 var(--c-wood-light);
        }

        /* 2. Redesign Start Button: Pixel Perfect */
        .start-btn-container {
            margin-top: 20px;
            pointer-events: auto;
            cursor: pointer;
            z-index: 30;
        }

        .pixel-btn {
            background-color: var(--c-accent);
            color: #FFF;
            font-family: inherit;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 12px 40px;
            border: none;
            /* Pixelated Bevel Border */
            box-shadow: 
                inset 4px 4px 0px var(--c-wood-light), /* Top-Left Highlight */
                inset -4px -4px 0px var(--c-accent-dark), /* Bottom-Right Shadow */
                4px 4px 0px rgba(0,0,0,0.5); /* Drop Shadow */
            border: 4px solid #000;
            text-shadow: 2px 2px 0 #000;
            text-transform: uppercase;
            position: relative;
            transition: transform 0.1s;
            animation: pulse 2s infinite;
        }

        .pixel-btn:hover {
            transform: scale(1.05);
            background-color: #FF4040;
        }

        .pixel-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 
                inset 4px 4px 0px var(--c-accent-dark),
                inset -4px -4px 0px var(--c-wood-light),
                0px 0px 0px rgba(0,0,0,0.5);
        }

        /* CRT Scanlines & Vignette */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
        }

        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.1) 2px,
                rgba(0,0,0,0.1) 4px
            );
            background-size: 100% 4px;
        }

        .vignette {
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.5) 100%);
        }

        /* Animations */
        @keyframes titleBob {
            0%, 100% { transform: translateY(0px) rotate(-1deg); }
            50% { transform: translateY(-5px) rotate(1deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; margin-top: 5vh; }
            .sign-text { font-size: 0.9rem; }
            .pixel-btn { font-size: 1.2rem; padding: 10px 30px; }
        }
    </style>
</head>
<body>

    <!-- Canvas Background -->
    <canvas id="world"></canvas>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <!-- Title -->
        <h1>SkiFree</h1>
        
        <!-- 1. Diegetic Signpost -->
        <div class="signpost-container">
            <div class="sign-board">
                <div class="sign-text">
                    AVOID TREES<br>
                    ESCAPE THE YETI<br>
                    <span style="font-size: 0.8em; color: #FFD700;">[ ← → ] TO STEER</span>
                </div>
            </div>
            <div class="sign-post"></div>
        </div>

        <!-- 2. Pixel Perfect Start Button -->
        <div class="start-btn-container" id="startBtn">
            <button class="pixel-btn">START RUN</button>
        </div>
    </div>

    <!-- Visual Effects Overlay -->
    <div class="overlay vignette"></div>
    <div class="overlay scanlines"></div>

<script>
    /**
     * VISUAL ENGINE
     * Renders a retro, pixel-art world using Canvas 2D.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false });

    // Configuration: Low resolution for authentic pixel look
    const GAME_WIDTH = 320;  
    const GAME_HEIGHT = 240; 
    
    // State
    let trees = [];
    let particles = [];
    let frame = 0;
    
    // Colors - Refined Palette
    const COLORS = {
        skyTop: '#406090',
        skyBot: '#88A0C0',
        snow: '#FFFFFF',
        snowShadow: '#DCEEFB',
        treeDark: '#004000',
        treeLight: '#006000',
        trunk: '#4a3c31',
        skin: '#ffccaa',
        jacket: '#d00000',
        pants: '#003366',
        skis: '#e6b800',
        pole: '#333333'
    };

    function resize() {
        // Internal resolution stays low
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        
        // CSS handles the stretching to full screen with pixelation
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        particles = [];

        // Generate Trees
        // 4. Clean up composition - fewer trees in foreground, clear center lane.
        for (let z = 0; z < 50; z++) {
            // Horizon (0) to Bottom (50)
            const p = z / 50; 
            
            if (z < 5) continue;

            const centerX = GAME_WIDTH / 2;
            // Spread gets wider as we get closer to camera
            const spread = 40 + (z * 8); 
            
            const count = (z > 30) ? 2 : 1;

            for(let i=0; i<count; i++) {
                let x = centerX + (Math.random() * spread * 2 - spread);
                
                // Clear Center Lane (The "Start" path)
                const centerClearance = 50; 
                if (Math.abs(x - centerX) < centerClearance) {
                    x = (x > centerX) ? x + centerClearance : x - centerClearance;
                }

                trees.push({
                    x: x,
                    z: z,
                    variant: Math.random()
                });
            }
        }

        // Sort trees: Far to Near (Painter's Algorithm)
        trees.sort((a, b) => a.z - b.z);

        // Snow Particles
        for(let i=0; i<80; i++) {
            particles.push({
                x: Math.random() * GAME_WIDTH,
                y: Math.random() * GAME_HEIGHT,
                speed: Math.random() * 2 + 0.5,
                size: Math.random() > 0.8 ? 2 : 1
            });
        }
    }

    // --- Drawing Helpers ---

    function drawPixelRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
    }

    function drawMountain() {
        // Draw pixelated mountains
        const yBase = GAME_HEIGHT * 0.35;
        
        // 5. Refine Background: Darker Mountains for depth
        ctx.fillStyle = '#507090'; 
        ctx.beginPath();
        ctx.moveTo(0, yBase);
        ctx.lineTo(40, yBase - 30);
        ctx.lineTo(80, yBase - 10);
        ctx.lineTo(120, yBase - 55);
        ctx.lineTo(160, yBase - 20);
        ctx.lineTo(200, yBase - 60);
        ctx.lineTo(250, yBase - 25);
        ctx.lineTo(320, yBase - 45);
        ctx.lineTo(320, yBase);
        ctx.lineTo(0, yBase);
        ctx.fill();

        // Snow Caps
        ctx.fillStyle = '#E0E0E0';
        ctx.fillRect(35, yBase - 25, 10, 3);
        ctx.fillRect(115, yBase - 50, 10, 3);
        ctx.fillRect(195, yBase - 55, 10, 3);
        ctx.fillRect(295, yBase - 40, 10, 3);
    }

    function drawTreeSprite(x, y, scale) {
        const p = Math.max(1, Math.floor(scale * 4)); 
        
        // Shadow (Grounding)
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(x - p*4, y - p, p*8, p*2);

        // Trunk
        drawPixelRect(x - p/2, y - p*3, p, p*3, COLORS.trunk);

        // Leaves - Tier 1 (Bottom)
        ctx.fillStyle = COLORS.treeDark;
        ctx.beginPath();
        ctx.moveTo(x - p*6, y - p*2);
        ctx.lineTo(x + p*6, y - p*2);
        ctx.lineTo(x, y - p*8);
        ctx.fill();
        
        // Leaves - Tier 2 (Mid)
        ctx.beginPath();
        ctx.moveTo(x - p*5, y - p*6);
        ctx.lineTo(x + p*5, y - p*6);
        ctx.lineTo(x, y - p*11);
        ctx.fill();

        // Leaves - Tier 3 (Top)
        ctx.beginPath();
        ctx.moveTo(x - p*3, y - p*10);
        ctx.lineTo(x + p*3, y - p*10);
        ctx.lineTo(x, y - p*14);
        ctx.fill();
        
        // Snow accumulation
        ctx.fillStyle = '#FFF';
        ctx.fillRect(x - p*2, y - p*8, p*3, p/2);
        ctx.fillRect(x - p, y - p*12, p*2, p/2);
    }

    function drawSkier(x, y) {
        const p = 2; // Fixed pixel size for character
        
        // 3. Highlight the Skier: Distinct Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(x, y + 18, 12, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Animation: Bobbing and Leaning
        const bob = Math.sin(frame * 0.2) * 2;
        
        ctx.save();
        ctx.translate(x, y + bob);

        // Skis (Yellow) - Slightly wider
        ctx.fillStyle = COLORS.skis;
        ctx.fillRect(-12, 14, 5, 6); // Left
        ctx.fillRect(7, 14, 5, 6);  // Right

        // Legs (Blue)
        ctx.fillStyle = COLORS.pants;
        ctx.fillRect(-8, 12, 5, 4);
        ctx.fillRect(3, 12, 5, 4);

        // Body (Red Jacket)
        ctx.fillStyle = COLORS.jacket;
        ctx.fillRect(-7, 6, 14, 6);
        
        // Arms/Poles
        ctx.fillStyle = '#555';
        // Left Pole
        ctx.fillRect(-14, 8, 2, 12);
        // Right Pole
        ctx.fillRect(12, 8, 2, 12);

        // Head (Skin)
        ctx.fillStyle = COLORS.skin;
        ctx.fillRect(-4, 2, 8, 4);
        
        // Hat (Red)
        ctx.fillStyle = COLORS.jacket;
        ctx.fillRect(-4, 0, 8, 2);

        ctx.restore();
    }

    function drawSnow() {
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        particles.forEach(p => {
            p.y += p.speed;
            p.x -= 1.0; // Wind blowing left
            if (p.y > GAME_HEIGHT) p.y = 0;
            if (p.x < 0) p.x = GAME_WIDTH;
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        });
    }

    // --- Main Loop ---

    function animate() {
        // Clear
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 1. Sky Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT * 0.4);
        grad.addColorStop(0, COLORS.skyTop);
        grad.addColorStop(1, COLORS.skyBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 2. Mountains
        drawMountain();

        // 3. Ground (Slope)
        const horizonY = GAME_HEIGHT * 0.35;
        
        // 5. Refine Background: Subtle texture on snow
        ctx.fillStyle = COLORS.snow;
        ctx.fillRect(0, horizonY, GAME_WIDTH, GAME_HEIGHT - horizonY);
        
        // Ground Texture (Perspective Lines) - Darker for depth
        ctx.fillStyle = COLORS.snowShadow;
        for(let i=0; i<25; i++) {
            let y = horizonY + (i * i * 0.6); 
            if(y < GAME_HEIGHT) {
                // Vary line thickness for texture
                ctx.fillRect(0, y, GAME_WIDTH, (i%2===0)?1:2);
            }
        }

        // 4. Trees
        trees.forEach(tree => {
            const scale = (tree.z / 50) * 1.8 + 0.2;
            
            // Perspective Y mapping
            const y = horizonY + (tree.z / 50) * (GAME_HEIGHT - horizonY);
            
            // Camera Sway (Simulates turning)
            const cameraOffset = Math.sin(frame * 0.05) * 15;
            const x = tree.x + cameraOffset;

            // Cull off-screen
            if (y > GAME_HEIGHT + 50 || y < horizonY) return;

            drawTreeSprite(x, y, scale);
        });

        // 3. Highlight the Skier: Positioned centrally
        const skierY = GAME_HEIGHT * 0.50; 
        const skierX = (GAME_WIDTH / 2) + Math.sin(frame * 0.1) * 20;
        
        drawSkier(skierX, skierY);

        // 5. Particles (Snow)
        drawSnow();

        frame++;
        requestAnimationFrame(animate);
    }

    // Init
    window.addEventListener('resize', resize);
    
    // Start Button Logic
    document.getElementById('startBtn').addEventListener('click', (e) => {
        const btn = e.target;
        const ui = document.querySelector('.ui-layer');
        
        // Visual Feedback
        btn.textContent = "GO!";
        btn.style.backgroundColor = "#FFF";
        btn.style.color = "#000";
        
        // Simulate start sequence
        setTimeout(() => {
            ui.style.transition = "transform 0.5s ease-in, opacity 0.5s";
            ui.style.transform = "translateY(-100%)"; // Slide UI up
            ui.style.opacity = "0";
            
            // Reset for demo purposes (loop the demo)
            setTimeout(() => {
                 ui.style.transition = "none";
                 ui.style.transform = "translateY(0)";
                 ui.style.opacity = "1";
                 
                 setTimeout(() => {
                     ui.style.transition = "transform 0.5s ease-out, opacity 0.5s";
                     btn.textContent = "START RUN";
                     btn.style.backgroundColor = ""; // Reset to CSS default
                     btn.style.color = "";
                 }, 100);
            }, 4000);
        }, 500);
    });

    // Boot
    resize();
    animate();

</script>
</body>
</html>
