<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        /* 
           SYSTEM FONT STACK FOR PIXEL ART
           Using 'Courier New' and 'Lucida Console' for that chunky, offline-safe monospace look.
        */
        :root {
            --c-sky-top: #5c94ec;
            --c-sky-bot: #a5d6f5;
            --c-snow: #ffffff;
            --c-text: #ffffff;
            --c-text-shadow: #004d00;
            --c-accent: #ffcc00;
            --c-accent-glow: #ffcc0080;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: "Courier New", "Lucida Console", "Lucida Sans Typewriter", monospace;
        }

        /* Canvas World - Force Pixelated Scaling */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* UI Container - Absolute Positioning */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Align to top */
            pointer-events: none; /* Let clicks pass through */
        }

        /* 5. Polish the Title: Stronger Shadow, Retro Pop */
        h1 {
            margin-top: 10vh; /* Push title up */
            margin-bottom: 10px;
            font-weight: 900;
            font-size: 6rem;
            text-transform: uppercase;
            color: var(--c-snow);
            text-align: center;
            letter-spacing: -5px;
            line-height: 0.8;
            /* Chunky 3D Shadow */
            text-shadow: 
                6px 6px 0px var(--c-text-shadow),
                12px 12px 0px rgba(0,0,0,0.3);
            z-index: 20;
            animation: titleBob 3s ease-in-out infinite;
        }

        /* 3. Refine Typography: High Contrast, Readable HUD */
        .instructions {
            margin-top: 10px;
            margin-bottom: 0;
            color: var(--c-text);
            font-size: 1.5rem; /* Larger */
            font-weight: bold;
            text-align: center;
            line-height: 1.4;
            text-shadow: 
                2px 2px 0 #000, 
                -2px -2px 0 #000, 
                2px -2px 0 #000,
                -2px 2px 0 #000;
            background: rgba(0, 0, 0, 0.4); /* Subtle backing for readability */
            padding: 10px 20px;
            border-radius: 4px;
            border: 2px solid rgba(255,255,255,0.2);
            pointer-events: auto;
            max-width: 80%;
        }

        .instructions .key-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 8px;
        }

        .instructions kbd {
            background: #fff;
            color: #000;
            padding: 4px 10px;
            font-size: 1.2em;
            border: 2px solid #000;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
            border-radius: 2px;
            font-weight: 900;
        }

        /* 1. Replace 'START GAME': Arcade Prompt Style */
        .start-prompt-container {
            position: absolute;
            bottom: 15%; /* Keep it out of the skier's way */
            width: 100%;
            text-align: center;
            pointer-events: auto;
            cursor: pointer;
        }

        .start-text {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--c-accent);
            text-shadow: 3px 3px 0 #000;
            animation: blink 1s steps(2, start) infinite;
            letter-spacing: 4px;
            padding: 10px 30px;
            background: rgba(0,0,0,0.6);
            display: inline-block;
            border: 2px solid var(--c-accent);
        }

        .start-text:hover {
            background: var(--c-accent);
            color: #000;
            animation: none; /* Stop blinking on hover */
            box-shadow: 0 0 20px var(--c-accent-glow);
        }

        /* CRT Scanlines & Vignette */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
        }

        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.15) 2px,
                rgba(0,0,0,0.15) 4px
            );
            background-size: 100% 4px;
        }

        .vignette {
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
        }

        /* Animations */
        @keyframes titleBob {
            0%, 100% { transform: translateY(0px) rotate(-1deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; margin-top: 5vh; }
            .instructions { font-size: 1rem; padding: 8px; }
            .start-text { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Canvas Background -->
    <canvas id="world"></canvas>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <!-- Title at top -->
        <h1>SkiFree</h1>
        
        <!-- Instructions immediately below title -->
        <div class="instructions">
            Avoid trees. Escape the Yeti.
            <div class="key-row">
                <kbd>←</kbd> <span>STEER</span> <kbd>→</kbd>
            </div>
        </div>

        <!-- 1. New Start Button Logic: Diegetic Arcade Prompt -->
        <div class="start-prompt-container" id="startBtn">
            <div class="start-text">PRESS START</div>
        </div>
    </div>

    <!-- Visual Effects Overlay -->
    <div class="overlay vignette"></div>
    <div class="overlay scanlines"></div>

<script>
    /**
     * VISUAL ENGINE
     * Renders a retro, pixel-art world using Canvas 2D.
     * Designed to look like a low-res game scaled up.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false });

    // Configuration: Low resolution for authentic pixel look
    const GAME_WIDTH = 320;  
    const GAME_HEIGHT = 240; 
    
    // State
    let trees = [];
    let particles = [];
    let frame = 0;
    
    // Colors
    const COLORS = {
        skyTop: '#5c94ec',
        skyBot: '#a5d6f5',
        snow: '#FFFFFF',
        snowShadow: '#DCEEFB',
        treeDark: '#005200',
        treeLight: '#006400',
        trunk: '#4a3c31',
        skin: '#ffccaa',
        jacket: '#d00000',
        pants: '#003366',
        skis: '#e6b800',
        pole: '#333333'
    };

    function resize() {
        // Internal resolution stays low
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        
        // CSS handles the stretching to full screen with pixelation
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        particles = [];

        // Generate Trees
        // CRITIQUE IMPLEMENTATION: 
        // 4. Clean up composition - fewer trees in foreground, clear center lane.
        for (let z = 0; z < 50; z++) {
            // Horizon (0) to Bottom (50)
            const p = z / 50; 
            
            // CRITIQUE: Reduce density
            // Only add trees occasionally, skipping the very horizon
            if (z < 5) continue;

            const centerX = GAME_WIDTH / 2;
            // Spread gets wider as we get closer to camera
            const spread = 40 + (z * 8); 
            
            // Determine how many trees at this depth slice (1 or 2 usually)
            const count = (z > 30) ? 2 : 1;

            for(let i=0; i<count; i++) {
                let x = centerX + (Math.random() * spread * 2 - spread);
                
                // CRITIQUE: Clear Center Lane (The "Start" path)
                // Ensure trees don't block the skier or the "Start" button area
                const centerClearance = 60; 
                if (Math.abs(x - centerX) < centerClearance) {
                    // Push tree to the side
                    x = (x > centerX) ? x + centerClearance : x - centerClearance;
                }

                trees.push({
                    x: x,
                    z: z,
                    variant: Math.random()
                });
            }
        }

        // Sort trees: Far to Near (Painter's Algorithm)
        trees.sort((a, b) => a.z - b.z);

        // Snow Particles
        for(let i=0; i<60; i++) {
            particles.push({
                x: Math.random() * GAME_WIDTH,
                y: Math.random() * GAME_HEIGHT,
                speed: Math.random() * 1.5 + 0.5,
                size: Math.random() > 0.8 ? 2 : 1
            });
        }
    }

    // --- Drawing Helpers ---

    function drawPixelRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
    }

    function drawMountain() {
        // Draw pixelated mountains
        const yBase = GAME_HEIGHT * 0.35;
        
        // Distant Mountain Range
        ctx.fillStyle = '#7EB5D6'; 
        ctx.beginPath();
        ctx.moveTo(0, yBase);
        ctx.lineTo(40, yBase - 25);
        ctx.lineTo(80, yBase - 5);
        ctx.lineTo(120, yBase - 45);
        ctx.lineTo(160, yBase - 15);
        ctx.lineTo(200, yBase - 55);
        ctx.lineTo(250, yBase - 20);
        ctx.lineTo(320, yBase - 40);
        ctx.lineTo(320, yBase);
        ctx.lineTo(0, yBase);
        ctx.fill();

        // Snow Caps
        ctx.fillStyle = '#FFFFFF';
        // Simple pixel blocks for caps
        ctx.fillRect(30, yBase - 20, 20, 4);
        ctx.fillRect(110, yBase - 40, 20, 4);
        ctx.fillRect(190, yBase - 50, 20, 4);
        ctx.fillRect(290, yBase - 35, 20, 4);
    }

    function drawTreeSprite(x, y, scale) {
        // Scale pixel unit based on depth
        const p = Math.max(1, Math.floor(scale * 4)); 
        
        // Trunk
        drawPixelRect(x - p/2, y - p*3, p, p*3, COLORS.trunk);

        // Leaves - Tier 1 (Bottom)
        ctx.fillStyle = COLORS.treeDark;
        ctx.beginPath();
        ctx.moveTo(x - p*6, y - p*2);
        ctx.lineTo(x + p*6, y - p*2);
        ctx.lineTo(x, y - p*8);
        ctx.fill();
        
        // Leaves - Tier 2 (Mid)
        ctx.beginPath();
        ctx.moveTo(x - p*5, y - p*6);
        ctx.lineTo(x + p*5, y - p*6);
        ctx.lineTo(x, y - p*11);
        ctx.fill();

        // Leaves - Tier 3 (Top)
        ctx.beginPath();
        ctx.moveTo(x - p*3, y - p*10);
        ctx.lineTo(x + p*3, y - p*10);
        ctx.lineTo(x, y - p*14);
        ctx.fill();
        
        // Snow accumulation
        ctx.fillStyle = '#FFF';
        ctx.fillRect(x - p*2, y - p*8, p*3, p/2);
        ctx.fillRect(x - p, y - p*12, p*2, p/2);
    }

    function drawSkier(x, y) {
        const p = 2; // Fixed pixel size for character
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(x - 7, y + 16, 14, 4);

        // Animation: Bobbing and Leaning
        const bob = Math.sin(frame * 0.2) * 2;
        
        ctx.save();
        ctx.translate(x, y + bob);

        // Skis (Yellow)
        ctx.fillStyle = COLORS.skis;
        ctx.fillRect(-10, 14, 4, 6); // Left
        ctx.fillRect(6, 14, 4, 6);  // Right

        // Legs (Blue)
        ctx.fillStyle = COLORS.pants;
        ctx.fillRect(-7, 12, 4, 4);
        ctx.fillRect(3, 12, 4, 4);

        // Body (Red Jacket)
        ctx.fillStyle = COLORS.jacket;
        ctx.fillRect(-6, 6, 12, 6);
        
        // Arms/Poles
        ctx.fillStyle = '#555';
        // Left Pole
        ctx.fillRect(-12, 8, 2, 12);
        // Right Pole
        ctx.fillRect(10, 8, 2, 12);

        // Head (Skin)
        ctx.fillStyle = COLORS.skin;
        ctx.fillRect(-4, 2, 8, 4);
        
        // Hat (Red)
        ctx.fillStyle = COLORS.jacket;
        ctx.fillRect(-4, 0, 8, 2);

        ctx.restore();
    }

    function drawSnow() {
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        particles.forEach(p => {
            p.y += p.speed;
            p.x -= 0.8; // Wind blowing left
            if (p.y > GAME_HEIGHT) p.y = 0;
            if (p.x < 0) p.x = GAME_WIDTH;
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        });
    }

    // --- Main Loop ---

    function animate() {
        // Clear
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 1. Sky Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT * 0.4);
        grad.addColorStop(0, COLORS.skyTop);
        grad.addColorStop(1, COLORS.skyBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 2. Mountains
        drawMountain();

        // 3. Ground (Slope)
        const horizonY = GAME_HEIGHT * 0.35;
        ctx.fillStyle = COLORS.snow;
        ctx.fillRect(0, horizonY, GAME_WIDTH, GAME_HEIGHT - horizonY);
        
        // Ground Texture (Perspective Lines)
        ctx.fillStyle = COLORS.snowShadow;
        for(let i=0; i<25; i++) {
            // Quadratic curve for perspective depth
            let y = horizonY + (i * i * 0.6); 
            if(y < GAME_HEIGHT) {
                ctx.fillRect(0, y, GAME_WIDTH, 1);
            }
        }

        // 4. Trees
        trees.forEach(tree => {
            const scale = (tree.z / 50) * 1.8 + 0.2;
            
            // Perspective Y mapping
            const y = horizonY + (tree.z / 50) * (GAME_HEIGHT - horizonY);
            
            // Camera Sway (Simulates turning)
            const cameraOffset = Math.sin(frame * 0.05) * 15;
            const x = tree.x + cameraOffset;

            // Cull off-screen
            if (y > GAME_HEIGHT + 50 || y < horizonY) return;

            drawTreeSprite(x, y, scale);
        });

        // 2. Reveal the Skier: Positioned in the clear middle lane
        // y = 0.55 puts them below the title/instructions but clearly visible above the start button
        const skierY = GAME_HEIGHT * 0.55; 
        const skierX = (GAME_WIDTH / 2) + Math.sin(frame * 0.1) * 20;
        
        drawSkier(skierX, skierY);

        // 5. Particles (Snow)
        drawSnow();

        frame++;
        requestAnimationFrame(animate);
    }

    // Init
    window.addEventListener('resize', resize);
    
    // Start Button Logic
    document.getElementById('startBtn').addEventListener('click', (e) => {
        const btnText = document.querySelector('.start-text');
        const ui = document.querySelector('.ui-layer');
        
        // Visual Feedback
        btnText.textContent = "STARTING...";
        btnText.style.animation = "none";
        btnText.style.opacity = "1";
        btnText.style.background = COLORS.jacket; // Red
        btnText.style.color = "#fff";
        
        // Simulate start sequence
        setTimeout(() => {
            ui.style.transition = "transform 0.5s ease-in, opacity 0.5s";
            ui.style.transform = "translateY(-100%)"; // Slide UI up
            ui.style.opacity = "0";
            
            // Reset for demo purposes (loop the demo)
            setTimeout(() => {
                 ui.style.transition = "none";
                 ui.style.transform = "translateY(0)";
                 ui.style.opacity = "1";
                 
                 setTimeout(() => {
                     ui.style.transition = "transform 0.5s ease-out, opacity 0.5s";
                     btnText.textContent = "PRESS START";
                     btnText.style.background = "rgba(0,0,0,0.6)";
                     btnText.style.color = "var(--c-accent)";
                     btnText.style.animation = "blink 1s steps(2, start) infinite";
                 }, 100);
            }, 4000);
        }, 800);
    });

    // Boot
    resize();
    animate();

</script>
</body>
</html>
