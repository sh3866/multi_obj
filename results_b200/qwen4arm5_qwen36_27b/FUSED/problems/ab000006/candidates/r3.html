<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        /* 
           SYSTEM FONT STACK FOR PIXEL ART
           We use a monospace stack that mimics pixel fonts.
           'Courier New' and 'Lucida Console' are the most reliable offline pixel-like fonts.
        */
        :root {
            --c-sky-top: #4B8BE0;
            --c-sky-bot: #87CEEB;
            --c-snow: #FFFFFF;
            --c-ui-bg: rgba(20, 30, 50, 0.85);
            --c-ui-border: #FFFFFF;
            --c-text: #FFFFFF;
            --c-accent: #FFD700; /* Gold/Yellow for arcade feel */
            --c-accent-dark: #B8860B;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            /* The Pixel Font Stack */
            font-family: "Courier New", "Lucida Console", "Lucida Sans Typewriter", monospace;
        }

        /* Canvas World - Force Pixelated Scaling */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* UI Container - Centered, Floating */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Let clicks pass through to canvas */
        }

        /* Title Styling - Chunky Pixel Font */
        h1 {
            margin: 0 0 10px 0;
            font-weight: 900;
            font-size: 5rem;
            text-transform: uppercase;
            color: var(--c-snow);
            text-align: center;
            letter-spacing: -3px;
            line-height: 1;
            /* Pure CSS Pixel 3D Effect */
            text-shadow: 
                4px 4px 0px #004d00,
                8px 8px 0px rgba(0,0,0,0.4);
            animation: titleFloat 4s ease-in-out infinite;
            z-index: 20;
        }

        /* Instructions - Integrated into the scene (Floating Text) */
        .instructions {
            /* No background box - just text with heavy shadow for readability */
            color: var(--c-text);
            font-size: 1.2rem;
            text-align: center;
            line-height: 1.8;
            margin-bottom: 40px;
            text-shadow: 
                2px 2px 0 #000, 
                -2px -2px 0 #000, 
                2px -2px 0 #000,
                -2px 2px 0 #000;
            pointer-events: auto;
            max-width: 600px;
            padding: 0 20px;
        }

        .instructions kbd {
            background: var(--c-snow);
            color: #000;
            padding: 2px 8px;
            font-weight: bold;
            font-size: 1em;
            margin: 0 4px;
            border: 2px solid #000;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
            text-shadow: none;
            display: inline-block;
            vertical-align: middle;
        }

        /* Start Button - Retro Arcade Prompt Style */
        .start-btn {
            pointer-events: auto;
            background: #000;
            color: var(--c-accent);
            border: 4px solid var(--c-accent);
            padding: 15px 60px;
            font-family: inherit;
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            outline: none;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            transition: all 0.2s;
            z-index: 20;
        }

        .start-btn:hover {
            background: var(--c-accent);
            color: #000;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
            transform: scale(1.05);
        }

        .start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* CRT Scanlines & Vignette */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
        }

        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.2) 2px,
                rgba(0,0,0,0.2) 4px
            );
            background-size: 100% 4px;
            animation: scrollScan 10s linear infinite;
        }

        .vignette {
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
        }

        /* Animations */
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes scrollScan {
            from { background-position: 0 0; }
            to { background-position: 0 4px; }
        }

        /* Responsive Text */
        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .instructions { font-size: 0.9rem; margin-bottom: 20px; }
            .start-btn { font-size: 1.5rem; padding: 12px 40px; }
        }
    </style>
</head>
<body>

    <!-- Canvas Background -->
    <canvas id="world"></canvas>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <h1>SkiFree</h1>
        
        <div class="instructions">
            Use <kbd>←</kbd> <kbd>→</kbd> to steer.<br>
            Avoid trees. Watch out for the Yeti.
        </div>

        <button class="start-btn" id="startBtn">START GAME</button>
    </div>

    <!-- Visual Effects Overlay -->
    <div class="overlay vignette"></div>
    <div class="overlay scanlines"></div>

<script>
    /**
     * VISUAL ENGINE
     * Renders a retro, pixel-art world using Canvas 2D.
     * Designed to look like a low-res game scaled up.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false });

    // Configuration: Low resolution for authentic pixel look
    const GAME_WIDTH = 320;  
    const GAME_HEIGHT = 240; 
    
    // State
    let trees = [];
    let particles = [];
    let frame = 0;
    
    // Colors
    const COLORS = {
        skyTop: '#4B8BE0',
        skyBot: '#87CEEB',
        snow: '#FFFFFF',
        snowShadow: '#E0F0FF',
        treeDark: '#004d00',
        treeLight: '#006400',
        treeLighter: '#008000',
        trunk: '#5D4037',
        skin: '#FFCCAA',
        jacket: '#E63946',
        pants: '#1D3557',
        skis: '#E9C46A',
        pole: '#555555'
    };

    function resize() {
        // Internal resolution stays low
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        
        // CSS handles the stretching to full screen with pixelation
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        particles = [];

        // Generate Trees (Pseudo-3D Grid)
        // CRITIQUE IMPLEMENTATION: Clear the Center Lane
        for (let z = 0; z < 60; z++) {
            // Horizon to bottom
            const p = z / 60; 
            
            // Density increases with distance
            const count = Math.floor(Math.random() * 2) + (z < 10 ? 1 : 2);
            
            for(let i=0; i<count; i++) {
                const centerX = GAME_WIDTH / 2 + Math.sin(z * 0.1) * 40;
                const spread = 20 + (z * 18); // Wider spread near bottom
                
                // CRITIQUE IMPLEMENTATION: Clear Center Lane
                // If z is small (far away), force x to be far from center (160)
                let x = 0;
                const center = GAME_WIDTH / 2;
                const clearZone = 50 - (z * 1.5); // Clear zone shrinks as we get closer to camera
                
                if (z < 40) {
                    // Generate X
                    x = centerX + (Math.random() * spread * 2 - spread);
                    
                    // If X is too close to center, push it out
                    if (Math.abs(x - center) < clearZone) {
                        x = (x > center) ? x + clearZone : x - clearZone;
                    }
                } else {
                    // Close to camera, random placement is fine
                    x = centerX + (Math.random() * spread * 2 - spread);
                }

                // Only add trees below the horizon
                if (z > 5) {
                    trees.push({
                        x: x,
                        z: z,
                        variant: Math.floor(Math.random() * 3) 
                    });
                }
            }
        }

        // Sort trees: Far to Near
        trees.sort((a, b) => a.z - b.z);

        // Snow Particles
        for(let i=0; i<80; i++) {
            particles.push({
                x: Math.random() * GAME_WIDTH,
                y: Math.random() * GAME_HEIGHT,
                speed: Math.random() * 0.8 + 0.3,
                size: Math.random() > 0.8 ? 2 : 1
            });
        }
    }

    // --- Drawing Helpers ---

    function drawPixelRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
    }

    function drawMountain() {
        // Draw pixelated mountains with hard edges
        const yBase = GAME_HEIGHT * 0.35;
        
        // Distant Mountain Range (Light Blue)
        ctx.fillStyle = '#7EB5D6'; 
        ctx.beginPath();
        ctx.moveTo(0, yBase);
        // Jagged peaks
        ctx.lineTo(30, yBase - 30);
        ctx.lineTo(60, yBase - 10);
        ctx.lineTo(100, yBase - 50);
        ctx.lineTo(140, yBase - 20);
        ctx.lineTo(180, yBase - 60);
        ctx.lineTo(220, yBase - 25);
        ctx.lineTo(260, yBase - 45);
        ctx.lineTo(300, yBase - 15);
        ctx.lineTo(320, yBase - 30);
        ctx.lineTo(320, yBase);
        ctx.lineTo(0, yBase);
        ctx.fill();

        // Snow Caps (White pixels on peaks)
        ctx.fillStyle = '#FFFFFF';
        // Peak 1
        ctx.fillRect(25, yBase - 25, 10, 3);
        // Peak 2
        ctx.fillRect(90, yBase - 45, 20, 3);
        // Peak 3
        ctx.fillRect(170, yBase - 55, 20, 3);
        // Peak 4
        ctx.fillRect(250, yBase - 40, 20, 3);
    }

    function drawTreeSprite(x, y, scale) {
        // Scale pixel unit based on depth
        const p = Math.max(1, Math.floor(scale * 3)); 
        
        // Trunk
        drawPixelRect(x - p/2, y - p*4, p, p*4, COLORS.trunk);

        // Leaves - Tier 1 (Bottom)
        ctx.fillStyle = COLORS.treeDark;
        ctx.beginPath();
        ctx.moveTo(x - p*5, y - p*2);
        ctx.lineTo(x + p*5, y - p*2);
        ctx.lineTo(x, y - p*7);
        ctx.fill();
        
        // Leaves Highlight
        ctx.fillStyle = COLORS.treeLighter;
        ctx.fillRect(x - p, y - p*4, p, p);

        // Leaves - Tier 2 (Mid)
        ctx.fillStyle = COLORS.treeDark;
        ctx.beginPath();
        ctx.moveTo(x - p*4, y - p*6);
        ctx.lineTo(x + p*4, y - p*6);
        ctx.lineTo(x, y - p*10);
        ctx.fill();

        // Leaves - Tier 3 (Top)
        ctx.fillStyle = COLORS.treeDark;
        ctx.beginPath();
        ctx.moveTo(x - p*3, y - p*9);
        ctx.lineTo(x + p*3, y - p*9);
        ctx.lineTo(x, y - p*13);
        ctx.fill();
        
        // Snow accumulation on branches
        ctx.fillStyle = '#FFF';
        ctx.fillRect(x - p*1.5, y - p*6, p*2, p/2);
        ctx.fillRect(x - p, y - p*10, p*2, p/2);
    }

    function drawSkier(x, y) {
        const p = 2; // Fixed pixel size for character
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(x - 6, y + 14, 12, 4);

        // Animation: Bobbing and Leaning
        const bob = Math.sin(frame * 0.2) * 2;
        const lean = Math.sin(frame * 0.1) * 1; 

        ctx.save();
        ctx.translate(x, y + bob);

        // Skis (Yellow)
        ctx.fillStyle = COLORS.skis;
        ctx.fillRect(-9, 12, 3, 8); // Left
        ctx.fillRect(6, 12, 3, 8);  // Right

        // Legs (Blue)
        ctx.fillStyle = COLORS.pants;
        ctx.fillRect(-6, 10, 3, 4);
        ctx.fillRect(3, 10, 3, 4);

        // Body (Red Jacket)
        ctx.fillStyle = COLORS.jacket;
        ctx.fillRect(-5, 4, 10, 6);
        
        // Arms/Poles
        ctx.fillStyle = '#555';
        // Left Pole
        ctx.fillRect(-10, 6, 2, 10);
        // Right Pole
        ctx.fillRect(8, 6, 2, 10);

        // Head (Skin)
        ctx.fillStyle = COLORS.skin;
        ctx.fillRect(-3, 0, 6, 4);
        
        // Hat (Red)
        ctx.fillStyle = COLORS.jacket;
        ctx.fillRect(-3, -2, 6, 2);

        ctx.restore();
    }

    function drawSnow() {
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        particles.forEach(p => {
            p.y += p.speed;
            p.x -= 0.5; // Wind blowing left
            if (p.y > GAME_HEIGHT) p.y = 0;
            if (p.x < 0) p.x = GAME_WIDTH;
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        });
    }

    // --- Main Loop ---

    function animate() {
        // Clear
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 1. Sky Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT * 0.4);
        grad.addColorStop(0, COLORS.skyTop);
        grad.addColorStop(1, COLORS.skyBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 2. Mountains
        drawMountain();

        // 3. Ground (Slope)
        const horizonY = GAME_HEIGHT * 0.35;
        ctx.fillStyle = COLORS.snow;
        ctx.fillRect(0, horizonY, GAME_WIDTH, GAME_HEIGHT - horizonY);
        
        // Ground Texture (Horizontal lines for speed illusion)
        ctx.fillStyle = COLORS.snowShadow;
        for(let i=0; i<20; i++) {
            let y = horizonY + (i * i * 0.8); 
            if(y < GAME_HEIGHT) {
                ctx.fillRect(0, y, GAME_WIDTH, 1);
            }
        }

        // 4. Trees (Depth Sorting)
        trees.forEach(tree => {
            const scale = (tree.z / 60) * 1.5 + 0.3;
            
            // Perspective Y mapping
            const y = horizonY + (tree.z / 60) * (GAME_HEIGHT - horizonY);
            
            // Camera Sway (Simulates turning)
            const cameraOffset = Math.sin(frame * 0.05) * 10;
            const x = tree.x + cameraOffset;

            // Cull off-screen
            if (y > GAME_HEIGHT + 50 || y < horizonY) return;

            drawTreeSprite(x, y, scale);
        });

        // 5. Skier (CRITIQUE: Repositioned to Top Center)
        // Previously: y = GAME_HEIGHT - 80 (bottom)
        // Now: y = GAME_HEIGHT * 0.55 (Just below title, facing down)
        // The Title is roughly at 30% height. Skier at 55% creates a clear vertical flow.
        const skierY = GAME_HEIGHT * 0.55; 
        const skierX = (GAME_WIDTH / 2) + Math.sin(frame * 0.1) * 30;
        
        drawSkier(skierX, skierY);

        // 6. Particles (Snow)
        drawSnow();

        frame++;
        requestAnimationFrame(animate);
    }

    // Init
    window.addEventListener('resize', resize);
    
    // Start Button Logic
    document.getElementById('startBtn').addEventListener('click', (e) => {
        const btn = e.target;
        const ui = document.querySelector('.ui-layer');
        
        // Visual Feedback
        btn.textContent = "LOADING...";
        
        // Simulate start sequence
        setTimeout(() => {
            ui.style.transition = "opacity 0.5s";
            ui.style.opacity = "0";
            
            // Reset for demo purposes
            setTimeout(() => {
                 ui.style.opacity = "1";
                 btn.textContent = "START GAME";
            }, 3000);
        }, 500);
    });

    // Boot
    resize();
    animate();

</script>
</body>
</html>
