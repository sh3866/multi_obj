<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        /* 
           SYSTEM FONT STACK FOR PIXEL ART
           We use a monospace stack that mimics pixel fonts.
           'Courier New' and 'Lucida Console' are the most reliable offline pixel-like fonts.
        */
        :root {
            --c-sky-top: #5D95E8;
            --c-sky-bot: #A8D5F2;
            --c-snow: #FFFFFF;
            --c-snow-shadow: #B0D4F1;
            --c-pine-dark: #004d00;
            --c-pine-light: #006400;
            --c-pine-lighter: #008000;
            --c-skin: #FFCCAA;
            --c-jacket: #E63946;
            --c-pants: #1D3557;
            --c-skis: #E9C46A;
            --c-wood: #8B5A2B;
            --c-wood-light: #A06B35;
            --c-wood-dark: #5C3A1B;
            --c-btn-shadow: #4A2A10;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            /* The Pixel Font Stack */
            font-family: "Courier New", "Lucida Console", "Lucida Sans Typewriter", monospace;
        }

        /* Canvas World - Force Pixelated Scaling */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* UI Container - Centered, Floating */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Let clicks pass through to canvas if needed, though mostly UI */
        }

        /* Title Styling - Chunky Pixel Font */
        h1 {
            margin: 0 0 20px 0;
            font-weight: 900;
            font-size: 4.5rem;
            text-transform: uppercase;
            color: var(--c-snow);
            text-align: center;
            letter-spacing: -2px;
            /* Pure CSS Pixel 3D Effect */
            text-shadow: 
                4px 4px 0px var(--c-pine-dark),
                6px 6px 0px rgba(0,0,0,0.3);
            animation: titleBounce 3s ease-in-out infinite;
        }

        /* Instructions - Integrated into the scene */
        .instructions {
            /* Semi-transparent dark box to ensure readability on snow */
            background: rgba(0, 20, 40, 0.85);
            border: 4px solid #fff;
            padding: 12px 24px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 30px;
            /* Pixelated Corners via box-shadow hack */
            box-shadow: 
                -4px 0 0 0 #fff,
                4px 0 0 0 #fff,
                0 -4px 0 0 #fff,
                0 4px 0 0 #fff,
                0 0 0 8px rgba(0,0,0,0.5);
            pointer-events: auto;
        }

        .instructions kbd {
            background: #E63946;
            color: #fff;
            padding: 2px 6px;
            font-weight: bold;
            font-size: 0.9em;
            margin: 0 2px;
            border: 2px solid #fff;
            box-shadow: 2px 2px 0 #000;
        }

        /* Start Button - Retro Wooden Sign */
        .start-btn {
            pointer-events: auto;
            background: var(--c-wood);
            color: #fff;
            border: 4px solid #fff;
            padding: 15px 50px;
            font-family: inherit;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            top: 0;
            outline: none;
            
            /* Complex box-shadow to simulate wood texture and 3D depth */
            box-shadow: 
                inset 4px 4px 0 var(--c-wood-light),
                inset -4px -4px 0 var(--c-wood-dark),
                0 8px 0 var(--c-btn-shadow);
            
            transition: transform 0.1s, box-shadow 0.1s;
        }

        /* Nails on the sign */
        .start-btn::before, .start-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 8px;
            height: 8px;
            background: #ccc;
            border: 2px solid #000;
            border-radius: 50%;
            transform: translateY(-50%);
            box-shadow: 1px 1px 0 rgba(0,0,0,0.5);
        }
        .start-btn::before { left: 15px; }
        .start-btn::after { right: 15px; }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                inset 4px 4px 0 var(--c-wood-light),
                inset -4px -4px 0 var(--c-wood-dark),
                0 10px 0 var(--c-btn-shadow);
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 
                inset 4px 4px 0 var(--c-wood-dark),
                inset -4px -4px 0 var(--c-wood-light),
                0 4px 0 var(--c-btn-shadow);
        }

        /* CRT Scanlines & Vignette */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.15) 2px,
                rgba(0,0,0,0.15) 4px
            );
            background-size: 100% 4px;
            /* Subtle scanline movement */
            animation: scrollScan 10s linear infinite;
        }

        .vignette {
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.7) 100%);
        }

        /* Animations */
        @keyframes titleBounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        @keyframes scrollScan {
            from { background-position: 0 0; }
            to { background-position: 0 4px; }
        }

        /* Responsive Text */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .instructions { font-size: 0.8rem; padding: 8px 16px; width: 90%; }
            .start-btn { font-size: 1.2rem; padding: 12px 30px; }
        }
    </style>
</head>
<body>

    <!-- Canvas Background -->
    <canvas id="world"></canvas>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <h1>SkiFree</h1>
        
        <div class="instructions">
            Use <kbd>←</kbd> <kbd>→</kbd> to steer.<br>
            Avoid trees. Watch out for the Yeti.
        </div>

        <button class="start-btn" id="startBtn">START GAME</button>
    </div>

    <!-- Visual Effects Overlay -->
    <div class="overlay vignette"></div>
    <div class="overlay scanlines"></div>

<script>
    /**
     * VISUAL ENGINE
     * Renders a retro, pixel-art world using Canvas 2D.
     * Designed to look like a low-res game scaled up.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false });

    // Configuration: Low resolution for authentic pixel look
    const GAME_WIDTH = 320;  
    const GAME_HEIGHT = 240; 
    
    // State
    let trees = [];
    let particles = [];
    let frame = 0;
    
    // Colors
    const COLORS = {
        skyTop: '#5D95E8',
        skyBot: '#A8D5F2',
        snow: '#FFFFFF',
        snowShadow: '#D6EAF8',
        treeDark: '#004d00',
        treeLight: '#006400',
        treeLighter: '#008000',
        trunk: '#5D4037',
        skin: '#FFCCAA',
        jacket: '#E63946',
        pants: '#1D3557',
        skis: '#E9C46A',
        pole: '#555555'
    };

    function resize() {
        // Internal resolution stays low
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        
        // CSS handles the stretching to full screen with pixelation
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        particles = [];

        // Generate Trees (Pseudo-3D Grid)
        for (let z = 0; z < 50; z++) {
            // Horizon to bottom
            const p = z / 50; 
            
            // Density increases with distance to fill the screen
            const count = Math.floor(Math.random() * 2) + (z < 10 ? 1 : 2);
            
            for(let i=0; i<count; i++) {
                const centerX = GAME_WIDTH / 2 + Math.sin(z * 0.1) * 40;
                const spread = 20 + (z * 15); // Wider spread near bottom
                
                const x = centerX + (Math.random() * spread * 2 - spread);
                
                // Only add trees below the horizon
                if (z > 5) {
                    trees.push({
                        x: x,
                        z: z,
                        variant: Math.floor(Math.random() * 3) 
                    });
                }
            }
        }

        // Sort trees: Far to Near
        trees.sort((a, b) => a.z - b.z);

        // Snow Particles
        for(let i=0; i<60; i++) {
            particles.push({
                x: Math.random() * GAME_WIDTH,
                y: Math.random() * GAME_HEIGHT,
                speed: Math.random() * 0.5 + 0.2,
                size: Math.random() > 0.8 ? 2 : 1
            });
        }
    }

    // --- Drawing Helpers ---

    function drawPixelRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
    }

    function drawMountain() {
        // Draw pixelated mountains with hard edges
        const yBase = GAME_HEIGHT * 0.35;
        
        // Distant Mountain Range (Light Blue)
        ctx.fillStyle = '#85C1E9'; 
        ctx.beginPath();
        ctx.moveTo(0, yBase);
        // Jagged peaks
        ctx.lineTo(30, yBase - 30);
        ctx.lineTo(60, yBase - 10);
        ctx.lineTo(100, yBase - 50);
        ctx.lineTo(140, yBase - 20);
        ctx.lineTo(180, yBase - 60);
        ctx.lineTo(220, yBase - 25);
        ctx.lineTo(260, yBase - 45);
        ctx.lineTo(300, yBase - 15);
        ctx.lineTo(320, yBase - 30);
        ctx.lineTo(320, yBase);
        ctx.lineTo(0, yBase);
        ctx.fill();

        // Snow Caps (White pixels on peaks)
        ctx.fillStyle = '#FFFFFF';
        // Peak 1
        ctx.fillRect(25, yBase - 25, 10, 3);
        // Peak 2
        ctx.fillRect(90, yBase - 45, 20, 3);
        // Peak 3
        ctx.fillRect(170, yBase - 55, 20, 3);
        // Peak 4
        ctx.fillRect(250, yBase - 40, 20, 3);
    }

    function drawTreeSprite(x, y, scale) {
        // Scale pixel unit based on depth
        const p = Math.max(1, Math.floor(scale * 3)); 
        
        // Trunk
        drawPixelRect(x - p/2, y - p*4, p, p*4, COLORS.trunk);

        // Leaves - Tier 1 (Bottom)
        ctx.fillStyle = COLORS.treeDark;
        ctx.beginPath();
        ctx.moveTo(x - p*5, y - p*2);
        ctx.lineTo(x + p*5, y - p*2);
        ctx.lineTo(x, y - p*7);
        ctx.fill();
        
        // Leaves Highlight
        ctx.fillStyle = COLORS.treeLighter;
        ctx.fillRect(x - p, y - p*4, p, p);

        // Leaves - Tier 2 (Mid)
        ctx.fillStyle = COLORS.treeDark;
        ctx.beginPath();
        ctx.moveTo(x - p*4, y - p*6);
        ctx.lineTo(x + p*4, y - p*6);
        ctx.lineTo(x, y - p*10);
        ctx.fill();

        // Leaves - Tier 3 (Top)
        ctx.fillStyle = COLORS.treeDark;
        ctx.beginPath();
        ctx.moveTo(x - p*3, y - p*9);
        ctx.lineTo(x + p*3, y - p*9);
        ctx.lineTo(x, y - p*13);
        ctx.fill();
        
        // Snow accumulation on branches
        ctx.fillStyle = '#FFF';
        ctx.fillRect(x - p*1.5, y - p*6, p*2, p/2);
        ctx.fillRect(x - p, y - p*10, p*2, p/2);
    }

    function drawSkier(x, y) {
        const p = 2; // Fixed pixel size for character
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(x - 6, y + 14, 12, 4);

        // Animation: Bobbing and Leaning
        const bob = Math.sin(frame * 0.2) * 2;
        const lean = Math.sin(frame * 0.1) * 1; 

        ctx.save();
        ctx.translate(x, y + bob);

        // Skis (Yellow)
        ctx.fillStyle = COLORS.skis;
        ctx.fillRect(-9, 12, 3, 8); // Left
        ctx.fillRect(6, 12, 3, 8);  // Right

        // Legs (Blue)
        ctx.fillStyle = COLORS.pants;
        ctx.fillRect(-6, 10, 3, 4);
        ctx.fillRect(3, 10, 3, 4);

        // Body (Red Jacket)
        ctx.fillStyle = COLORS.jacket;
        ctx.fillRect(-5, 4, 10, 6);
        
        // Arms/Poles
        ctx.fillStyle = '#555';
        // Left Pole
        ctx.fillRect(-10, 6, 2, 10);
        // Right Pole
        ctx.fillRect(8, 6, 2, 10);

        // Head (Skin)
        ctx.fillStyle = COLORS.skin;
        ctx.fillRect(-3, 0, 6, 4);
        
        // Hat (Red)
        ctx.fillStyle = COLORS.jacket;
        ctx.fillRect(-3, -2, 6, 2);

        ctx.restore();
    }

    function drawSnow() {
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        particles.forEach(p => {
            p.y += p.speed;
            p.x -= 0.5; // Wind blowing left
            if (p.y > GAME_HEIGHT) p.y = 0;
            if (p.x < 0) p.x = GAME_WIDTH;
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        });
    }

    // --- Main Loop ---

    function animate() {
        // Clear
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 1. Sky Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT * 0.4);
        grad.addColorStop(0, COLORS.skyTop);
        grad.addColorStop(1, COLORS.skyBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 2. Mountains
        drawMountain();

        // 3. Ground (Slope)
        const horizonY = GAME_HEIGHT * 0.35;
        ctx.fillStyle = COLORS.snow;
        ctx.fillRect(0, horizonY, GAME_WIDTH, GAME_HEIGHT - horizonY);
        
        // Ground Texture (Horizontal lines for speed illusion)
        ctx.fillStyle = COLORS.snowShadow;
        for(let i=0; i<20; i++) {
            let y = horizonY + (i * i * 0.8); 
            if(y < GAME_HEIGHT) {
                ctx.fillRect(0, y, GAME_WIDTH, 1);
            }
        }

        // 4. Trees (Depth Sorting)
        trees.forEach(tree => {
            const scale = (tree.z / 50) * 1.5 + 0.3;
            
            // Perspective Y mapping
            const y = horizonY + (tree.z / 50) * (GAME_HEIGHT - horizonY);
            
            // Camera Sway (Simulates turning)
            const cameraOffset = Math.sin(frame * 0.05) * 10;
            const x = tree.x + cameraOffset;

            // Cull off-screen
            if (y > GAME_HEIGHT + 50 || y < horizonY) return;

            drawTreeSprite(x, y, scale);
        });

        // 5. Skier (Repositioned per critique: Higher up, closer to center)
        // Previously: y = GAME_HEIGHT - 80 (bottom)
        // Now: y = GAME_HEIGHT * 0.75 (upper middle)
        const skierY = GAME_HEIGHT * 0.75; 
        const skierX = (GAME_WIDTH / 2) + Math.sin(frame * 0.1) * 30;
        
        drawSkier(skierX, skierY);

        // 6. Particles (Snow)
        drawSnow();

        frame++;
        requestAnimationFrame(animate);
    }

    // Init
    window.addEventListener('resize', resize);
    
    // Start Button Logic
    document.getElementById('startBtn').addEventListener('click', (e) => {
        const btn = e.target;
        const ui = document.querySelector('.ui-layer');
        
        // Visual Feedback
        btn.textContent = "LOADING...";
        
        // Simulate start sequence
        setTimeout(() => {
            ui.style.transition = "opacity 0.5s";
            ui.style.opacity = "0";
            
            // Reset for demo purposes
            setTimeout(() => {
                 ui.style.opacity = "1";
                 btn.textContent = "START GAME";
            }, 3000);
        }, 500);
    });

    // Boot
    resize();
    animate();

</script>
</body>
</html>
