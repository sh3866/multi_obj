<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        :root {
            --c-sky-top: #4A90E2;
            --c-sky-bot: #87CEEB;
            --c-snow: #FFFFFF;
            --c-snow-shadow: #B0D4F1;
            --c-pine-dark: #004d00;
            --c-pine-light: #006400;
            --c-pine-lighter: #008000;
            --c-skin: #FFCCAA;
            --c-jacket: #E63946;
            --c-pants: #1D3557;
            --c-skis: #E9C46A;
            --c-ui-bg: rgba(0, 15, 30, 0.6);
            --c-ui-border: #4A90E2;
            --c-ui-text: #FFFFFF;
            --c-btn-bg: #E63946;
            --c-btn-shadow: #8A1C23;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            /* System stack for best pixel approximation */
            font-family: "Courier New", Courier, monospace;
        }

        /* Canvas World */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* UI Container - Floating, not blocking */
        .ui-layer {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            pointer-events: none; /* Let clicks pass through empty space */
        }

        /* Title Styling */
        h1 {
            margin: 0;
            font-family: "Courier New", Courier, monospace;
            font-weight: 900;
            font-size: 5rem;
            text-transform: uppercase;
            color: var(--c-snow);
            text-align: center;
            /* Retro 3D Text Effect */
            text-shadow: 
                4px 4px 0px var(--c-pine-dark), 
                -2px -2px 0px var(--c-pine-dark),
                2px -2px 0px var(--c-pine-dark),
                -2px 2px 0px var(--c-pine-dark);
            letter-spacing: 4px;
            animation: float 3s ease-in-out infinite;
        }

        /* Instructions */
        .instructions {
            background: var(--c-ui-bg);
            border: 2px solid var(--c-ui-border);
            padding: 10px 20px;
            color: var(--c-ui-text);
            font-size: 1rem;
            text-align: center;
            line-height: 1.5;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            border-radius: 2px;
            pointer-events: auto;
        }

        .instructions kbd {
            background: #333;
            border: 1px solid #777;
            border-bottom: 3px solid #111;
            padding: 2px 6px;
            color: #fff;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9em;
            margin: 0 2px;
        }

        /* Start Button - Pixel Art Style */
        .start-btn {
            pointer-events: auto;
            background: var(--c-btn-bg);
            color: #fff;
            border: 4px solid #fff;
            padding: 15px 40px;
            font-family: inherit;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            /* Pixelated Shadow */
            box-shadow: 
                0 4px 0 #fff, 
                0 8px 0 var(--c-btn-shadow), 
                0 12px 0 var(--c-btn-shadow),
                0 16px 0 rgba(0,0,0,0.4);
            transition: transform 0.1s;
            position: relative;
            top: 0;
            outline: none;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0 #fff, 
                0 10px 0 var(--c-btn-shadow), 
                0 14px 0 var(--c-btn-shadow),
                0 18px 0 rgba(0,0,0,0.4);
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 
                0 0px 0 #fff, 
                0 4px 0 var(--c-btn-shadow), 
                0 8px 0 var(--c-btn-shadow),
                0 12px 0 rgba(0,0,0,0.4);
        }

        /* CRT Scanlines & Vignette */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            animation: scrollScan 10s linear infinite;
        }

        .vignette {
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes scrollScan {
            from { background-position: 0 0; }
            to { background-position: 0 4px; }
        }

        /* Responsive Text */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .instructions { font-size: 0.8rem; padding: 8px 12px; }
            .start-btn { font-size: 1.2rem; padding: 12px 30px; }
        }
    </style>
</head>
<body>

    <!-- Canvas Background -->
    <canvas id="world"></canvas>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <h1>SkiFree</h1>
        <div class="instructions">
            Use <kbd>←</kbd> <kbd>→</kbd> to steer.<br>
            Avoid trees. Watch out for the Yeti.
        </div>
        <button class="start-btn" id="startBtn">Start Game</button>
    </div>

    <!-- Visual Effects Overlay -->
    <div class="overlay vignette"></div>
    <div class="overlay scanlines"></div>

<script>
    /**
     * VISUAL ENGINE
     * Renders a retro, pixel-art world using Canvas 2D.
     * Designed to look like a low-res game scaled up.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimize

    // Configuration
    const GAME_WIDTH = 320;  // Low-res internal width
    const GAME_HEIGHT = 240; // Low-res internal height
    let scale = 1;
    
    // State
    let trees = [];
    let particles = [];
    let frame = 0;
    
    // Colors (CSS vars access is tricky in canvas, using hex directly)
    const COLORS = {
        skyTop: '#4A90E2',
        skyBot: '#87CEEB',
        snow: '#FFFFFF',
        snowShadow: '#B0D4F1',
        treeDark: '#004d00',
        treeLight: '#006400',
        treeLighter: '#008000',
        trunk: '#5D4037',
        skin: '#FFCCAA',
        jacket: '#E63946',
        pants: '#1D3557',
        skis: '#E9C46A',
        pole: '#555555'
    };

    function resize() {
        // Calculate scale to fit screen while maintaining aspect ratio
        const winW = window.innerWidth;
        const winH = window.innerHeight;
        
        // We want the canvas to cover the screen, but pixelated.
        // Set the internal resolution
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        
        // CSS handles the stretching, but we set the style width/height to 100%
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        particles = [];

        // Generate Trees
        // Create a pseudo-3D grid of trees
        for (let z = 0; z < 40; z++) {
            // Perspective projection factors
            const p = z / 40; // 0 (far) to 1 (near)
            
            // Randomly place trees in this depth slice
            // More trees further back creates density illusion
            const count = Math.floor(Math.random() * 2) + 1;
            
            for(let i=0; i<count; i++) {
                // X position with some randomness, but clamped to create a "road" feel
                // The road curves slightly
                const centerX = GAME_WIDTH / 2 + Math.sin(z * 0.1) * 40;
                const spread = 20 + (z * 10); // Wider spread as we get closer
                
                const x = centerX + (Math.random() * spread * 2 - spread);
                
                // Only add trees that are roughly on the "slope" area
                if (z > 5) {
                    trees.push({
                        x: x,
                        z: z,
                        variant: Math.floor(Math.random() * 3) // Tree variation
                    });
                }
            }
        }

        // Sort trees: Far (low z) to Near (high z)
        trees.sort((a, b) => a.z - b.z);

        // Snow Particles
        for(let i=0; i<50; i++) {
            particles.push({
                x: Math.random() * GAME_WIDTH,
                y: Math.random() * GAME_HEIGHT,
                speed: Math.random() * 0.5 + 0.2,
                size: Math.random() > 0.8 ? 2 : 1
            });
        }
    }

    // --- Drawing Helpers ---

    function drawPixelRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
    }

    function drawMountain() {
        // Draw pixelated mountains in the background
        const yBase = GAME_HEIGHT * 0.35;
        ctx.fillStyle = '#A9CCE3'; // Distant mountains
        
        ctx.beginPath();
        ctx.moveTo(0, yBase);
        // Jagged line
        ctx.lineTo(40, yBase - 40);
        ctx.lineTo(80, yBase - 10);
        ctx.lineTo(120, yBase - 60);
        ctx.lineTo(160, yBase - 20);
        ctx.lineTo(200, yBase - 50);
        ctx.lineTo(240, yBase - 15);
        ctx.lineTo(280, yBase - 45);
        ctx.lineTo(320, yBase - 25);
        ctx.lineTo(320, yBase);
        ctx.lineTo(0, yBase);
        ctx.fill();

        // Snow caps
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.moveTo(30, yBase - 32); ctx.lineTo(40, yBase - 40); ctx.lineTo(50, yBase - 32);
        ctx.moveTo(110, yBase - 52); ctx.lineTo(120, yBase - 60); ctx.lineTo(130, yBase - 52);
        ctx.moveTo(190, yBase - 42); ctx.lineTo(200, yBase - 50); ctx.lineTo(210, yBase - 42);
        ctx.moveTo(270, yBase - 37); ctx.lineTo(280, yBase - 45); ctx.lineTo(290, yBase - 37);
        ctx.fill();
    }

    function drawTreeSprite(x, y, scale) {
        const p = Math.max(1, Math.floor(scale * 2)); // Pixel unit
        
        // Trunk
        drawPixelRect(x - p/2, y - p*4, p, p*4, COLORS.trunk);

        // Leaves (3 tiers)
        // Bottom Tier
        ctx.fillStyle = COLORS.treeDark;
        ctx.beginPath();
        ctx.moveTo(x - p*4, y - p*2);
        ctx.lineTo(x + p*4, y - p*2);
        ctx.lineTo(x, y - p*6);
        ctx.fill();
        
        // Highlight Bottom
        ctx.fillStyle = COLORS.treeLighter;
        ctx.fillRect(x - p, y - p*3, p, p);

        // Mid Tier
        ctx.fillStyle = COLORS.treeDark;
        ctx.beginPath();
        ctx.moveTo(x - p*3, y - p*5);
        ctx.lineTo(x + p*3, y - p*5);
        ctx.lineTo(x, y - p*9);
        ctx.fill();

        // Top Tier
        ctx.fillStyle = COLORS.treeDark;
        ctx.beginPath();
        ctx.moveTo(x - p*2, y - p*8);
        ctx.lineTo(x + p*2, y - p*8);
        ctx.lineTo(x, y - p*11);
        ctx.fill();
        
        // Snow on tree (white pixels)
        ctx.fillStyle = '#FFF';
        ctx.fillRect(x - p, y - p*5, p, p);
        ctx.fillRect(x - p*1.5, y - p*8, p, p);
    }

    function drawSkier(x, y) {
        const p = 2; // Skier is fixed size roughly
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(x - 6, y + 12, 12, 4);

        // Bobbing
        const bob = Math.sin(frame * 0.3) * 2;
        const lean = Math.sin(frame * 0.15) * 2; // Left/Right sway

        ctx.save();
        ctx.translate(x, y + bob);
        // ctx.rotate(lean * 0.1); // Slight rotation

        // Skis (Yellow)
        ctx.fillStyle = COLORS.skis;
        ctx.fillRect(-8, 10, 2, 8); // Left
        ctx.fillRect(6, 10, 2, 8);  // Right

        // Legs (Blue)
        ctx.fillStyle = COLORS.pants;
        ctx.fillRect(-5, 8, 3, 4);
        ctx.fillRect(2, 8, 3, 4);

        // Body (Red)
        ctx.fillStyle = COLORS.jacket;
        ctx.fillRect(-4, 2, 8, 6);
        
        // Arms/Poles
        ctx.fillStyle = COLORS.pole;
        ctx.fillRect(-8, 4, 2, 8); // Left pole
        ctx.fillRect(6, 4, 2, 8);  // Right pole

        // Head (Skin)
        ctx.fillStyle = COLORS.skin;
        ctx.fillRect(-2, -2, 4, 4);
        
        // Hat (Red)
        ctx.fillStyle = COLORS.jacket;
        ctx.fillRect(-2, -4, 4, 2);

        ctx.restore();
    }

    function drawSnow() {
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        particles.forEach(p => {
            p.y += p.speed;
            p.x -= 0.5; // Wind
            if (p.y > GAME_HEIGHT) p.y = 0;
            if (p.x < 0) p.x = GAME_WIDTH;
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        });
    }

    // --- Main Loop ---

    function animate() {
        // Clear
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 1. Sky
        const grad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT * 0.5);
        grad.addColorStop(0, COLORS.skyTop);
        grad.addColorStop(1, COLORS.skyBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // 2. Mountains
        drawMountain();

        // 3. Ground (Slope)
        // Draw a large white area starting from horizon
        const horizonY = GAME_HEIGHT * 0.35;
        ctx.fillStyle = COLORS.snow;
        ctx.fillRect(0, horizonY, GAME_WIDTH, GAME_HEIGHT - horizonY);
        
        // Ground Shadows (Subtle texture)
        ctx.fillStyle = COLORS.snowShadow;
        for(let i=0; i<20; i++) {
            // Horizontal lines to simulate distance/texture
            let y = horizonY + (i * i * 0.5); 
            if(y < GAME_HEIGHT) {
                ctx.fillRect(0, y, GAME_WIDTH, 1);
            }
        }

        // 4. Trees (Depth Sorting)
        // We draw them based on their Z index
        trees.forEach(tree => {
            // Perspective Math
            // Simple linear projection for this retro style
            // z=0 is far, z=40 is near
            
            // Scale factor based on Z
            const scale = (tree.z / 40) * 1.5 + 0.2;
            
            // Y position: Linear mapping from horizon to bottom
            const y = horizonY + (tree.z / 40) * (GAME_HEIGHT - horizonY);
            
            // X position: Needs perspective compression towards center
            // But for a top-down/skiing view, X is usually linear or slightly compressed
            // Let's keep X linear but maybe shift slightly based on camera curve
            const centerX = GAME_WIDTH / 2 + Math.sin(frame * 0.05) * 2; // Camera sway
            const x = tree.x; // Keep x raw for now, it was generated with perspective in mind

            // Cull off-screen
            if (y > GAME_HEIGHT + 50 || y < horizonY) return;

            drawTreeSprite(x, y, scale);
        });

        // 5. Skier
        // Positioned in the lower middle, moving slightly
        const skierX = (GAME_WIDTH / 2) + Math.sin(frame * 0.1) * 30;
        const skierY = GAME_HEIGHT - 80;
        drawSkier(skierX, skierY);

        // 6. Particles (Snow)
        drawSnow();

        frame++;
        requestAnimationFrame(animate);
    }

    // Init
    window.addEventListener('resize', resize);
    
    // Start Button Logic
    document.getElementById('startBtn').addEventListener('click', (e) => {
        // Simple visual feedback
        const btn = e.target;
        btn.textContent = "LOADING...";
        btn.style.backgroundColor = "#fff";
        btn.style.color = "#000";
        
        // Simulate loading
        setTimeout(() => {
            // In a real game, this would switch scenes
            // For this demo, we just fade the UI out to show the world
            document.querySelector('.ui-layer').style.transition = "opacity 0.5s";
            document.querySelector('.ui-layer').style.opacity = "0";
            
            // Reset button after a bit (for demo purposes)
            setTimeout(() => {
                 document.querySelector('.ui-layer').style.opacity = "1";
                 btn.textContent = "START GAME";
                 btn.style.backgroundColor = "";
                 btn.style.color = "";
            }, 2000);
        }, 800);
    });

    // Boot
    resize();
    animate();

</script>
</body>
</html>
