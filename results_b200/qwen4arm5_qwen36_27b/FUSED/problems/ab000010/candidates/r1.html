<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway Sphere</title>
<style>
  :root {
    --bg-dark: #050508;
    --bg-light: #0f101a;
    --panel-bg: rgba(12, 12, 18, 0.75);
    --panel-border: rgba(255, 255, 255, 0.08);
    --accent-cyan: #00f0ff;
    --accent-pink: #ff0055;
    --text-main: #ffffff;
    --text-muted: #8b9bb4;
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-dark);
    /* Subtle radial gradient to give depth */
    background-image: radial-gradient(circle at 60% 40%, #1a2035 0%, var(--bg-dark) 65%);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
  }

  /* Canvas Container */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Overlay */
  #ui-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 2rem;
  }

  /* Header - Top Left */
  .header {
    pointer-events: auto;
    margin-bottom: 1.5rem;
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 0.25rem;
    text-transform: uppercase;
    background: linear-gradient(135deg, #fff 0%, var(--accent-cyan) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
  }

  .subtitle {
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* Control Panel - Bottom Left Anchor */
  .panel {
    pointer-events: auto;
    width: 320px;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    margin-top: auto; /* Push to bottom */
    margin-bottom: 0;
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  .panel-label {
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding-bottom: 0.5rem;
    margin-bottom: 0.25rem;
  }

  /* Stats */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-variant-numeric: tabular-nums;
  }
  .stat-label { color: var(--text-muted); font-size: 0.85rem; }
  .stat-value {
    font-size: 1.1rem;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 0 8px rgba(255,255,255,0.3);
  }

  /* Sliders */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    outline: none;
    border: 1px solid rgba(255,255,255,0.05);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    border: 2px solid var(--accent-cyan);
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.1);
  }

  /* Buttons - Unified Design */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  
  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-main);
    padding: 0.85rem;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    position: relative;
    overflow: hidden;
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.4);
    box-shadow: 0 0 15px rgba(255,255,255,0.05);
  }
  
  button:active { transform: translateY(1px); }

  /* Primary Button (Filled Accent) */
  button.primary {
    background: var(--accent-cyan);
    color: #000;
    border-color: var(--accent-cyan);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
  }
  button.primary:hover {
    background: #fff;
    border-color: #fff;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
  }
  
  /* Secondary Button (Ghost/Outline) */
  button.secondary {
    border-color: rgba(255,255,255,0.3);
    color: var(--text-main);
  }
  button.secondary:hover {
    background: rgba(255,255,255,0.1);
    border-color: var(--accent-pink);
    color: var(--accent-pink);
    box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 1.5rem;
    right: 2rem;
    font-size: 0.65rem;
    color: var(--text-muted);
    opacity: 0.4;
    text-align: right;
    letter-spacing: 0.05em;
  }

</style>
</head>
<body>

  <!-- Canvas for the Sphere -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Header -->
    <div class="header">
      <h1>Conway Sphere</h1>
      <div class="subtitle">Algorithmic Life Simulation</div>
    </div>

    <!-- Control Panel -->
    <div class="panel">
      <div class="panel-section">
        <div class="panel-label">System Status</div>
        <div class="stat-row">
          <span class="stat-label">Generation</span>
          <span class="stat-value" id="gen-count">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Population</span>
          <span class="stat-value" id="pop-count">0</span>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-label">Simulation Speed</div>
        <input type="range" id="speed-slider" min="1" max="60" value="15">
      </div>

      <div class="panel-section">
        <div class="panel-label">Controls</div>
        <div class="btn-group">
          <button id="btn-pause" class="primary">Pause</button>
          <button id="btn-reset" class="secondary">Randomize</button>
        </div>
        <button id="btn-step" class="secondary">Step Once</button>
      </div>
    </div>

    <div class="footer">
      DRAG TO ROTATE &bull; SCROLL TO ZOOM
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life - Visual Revision
 * 
 * Changes:
 * 1. Improved coloring: Age-based gradient (Hot Pink -> Cyan).
 * 2. Bloom effect: Using canvas shadowBlur for a neon glow.
 * 3. Volumetric rendering: Z-sorting and opacity falloff for depth.
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 4500, // Increased density for better look
  sphereRadius: 280,
  cellSize: 3.5,   // Smaller cells
  rotationSpeed: 0.0015,
  colors: {
    young: { h: 340, s: 100, l: 60 }, // Hot Pink
    old:   { h: 180, s: 100, l: 60 }  // Cyan
  }
};

// --- State ---
let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 15,
  lastFrameTime: 0,
  rotation: { x: 0.2, y: 0 }, // Slight tilt initially
  zoom: 1.2,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  dist: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return Math.sqrt(dx*dx + dy*dy + dz*dz);
  }
};

// Fibonacci Lattice Sphere Generation
function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y); 
    const theta = goldenAngle * i;
    
    const x = Math.cos(theta) * radiusAtY;
    const z = Math.sin(theta) * radiusAtY;
    
    points.push({
      x: x * radius,
      y: y * radius,
      z: z * radius,
      idx: i
    });
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Neighbor search optimization:
  // Instead of O(N^2) every frame, we do it once here.
  // For 4500 points, pure O(N^2) is ~20M ops. A bit heavy for init, but acceptable one-time cost.
  // Or use a distance threshold based on average spacing.
  
  const avgDist = (2 * Math.PI * CONFIG.sphereRadius) / Math.sqrt(CONFIG.cellCount);
  const threshold = avgDist * 1.25; // Slightly larger radius to catch neighbors
  
  state.cells = points.map((p, i) => {
    const neighbors = [];
    // Brute force neighbor finding (Optimized loop)
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      // Fast distance check (squared) to avoid sqrt in loop
      const dx = p.x - points[j].x;
      const dy = p.y - points[j].y;
      const dz = p.z - points[j].z;
      const distSq = dx*dx + dy*dy + dz*dz;
      
      if (distSq < threshold * threshold) { 
        neighbors.push(j);
      }
    }
    
    // Sort neighbors to keep rendering deterministic if needed (not strictly required here)
    // neighbors.sort();

    return {
      pos: p,
      idx: i,
      neighbors: neighbors,
      alive: Math.random() > 0.6, // 40% density
      bornGen: 0, 
      age: 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  // Standard Conway Rules
  // Note: We create a new array for next states to avoid race conditions
  const nextStates = state.cells.map(cell => {
    // Count live neighbors
    let liveNeighbors = 0;
    for (let k = 0; k < cell.neighbors.length; k++) {
      if (state.cells[cell.neighbors[k]].alive) liveNeighbors++;
    }
    
    let nextAlive = false;
    let isBorn = false;

    if (cell.alive) {
      if (liveNeighbors === 2 || liveNeighbors === 3) nextAlive = true;
    } else {
      if (liveNeighbors === 3) {
        nextAlive = true;
        isBorn = true;
      }
    }
    
    return {
      alive: nextAlive,
      bornGen: isBorn ? state.generation : cell.bornGen,
      age: nextAlive ? (cell.alive ? cell.age + 1 : 0) : 0
    };
  });

  state.cells.forEach((cell, i) => {
    cell.alive = nextStates[i].alive;
    cell.bornGen = nextStates[i].bornGen;
    cell.age = nextStates[i].age;
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 800 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // Clear background with a slight trail for motion blur effect
  // We use the CSS background color for the main clear, but a low opacity rect for trails
  // However, to keep the background gradient sharp, we clear fully and draw the "glow" manually
  ctx.fillStyle = 'rgba(5, 5, 8, 0.25)'; // 0.25 opacity creates trails
  ctx.fillRect(0, 0, width, height);

  // Calculate projected positions
  const projectedCells = state.cells.map(cell => {
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    return { cell, proj };
  });
  
  // Sort by Z (Painter's algorithm) - draw back to front
  // For additive blending (glow), order matters less, but for "volumetric" look, back-to-front is better
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // Setup additive blending for the "Bloom" look
  ctx.globalCompositeOperation = 'lighter';

  projectedCells.forEach(({ cell, proj }) => {
    // Optimization: Don't draw if behind sphere center too much (backface culling approximation)
    // But for a wireframe/glow look, seeing through is cool.
    // We will dim them based on Z though.
    
    if (!cell.alive) {
      // Draw dead cells as very faint dots to show the sphere structure
      const size = CONFIG.cellSize * proj.scale * 0.5;
      // Opacity based on depth: front is brighter
      const depthAlpha = Math.max(0, (proj.z + CONFIG.sphereRadius) / (2 * CONFIG.sphereRadius));
      const alpha = 0.1 * depthAlpha;
      
      if (alpha > 0.01) {
        ctx.fillStyle = `rgba(60, 80, 120, ${alpha})`;
        ctx.beginPath();
        ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
        ctx.fill();
      }
      return;
    }

    // --- Alive Cell Rendering ---
    
    // 1. Calculate Color based on Age (Hot Pink -> Cyan)
    // Map age 0 -> 200 to 0 -> 1
    const maxAge = 200;
    const ageRatio = Math.min(cell.age, maxAge) / maxAge;
    
    // Interpolate HSL
    const h = CONFIG.colors.young.h + (CONFIG.colors.old.h - CONFIG.colors.young.h) * ageRatio;
    const s = CONFIG.colors.young.s;
    const l = CONFIG.colors.young.l;
    
    // 2. Calculate Depth Opacity (Fog)
    // Cells at back (positive Z) should be dimmer
    const depthFactor = Math.max(0.1, 1 - (proj.z / (CONFIG.sphereRadius * 1.5)));
    
    // 3. Draw
    const size = CONFIG.cellSize * proj.scale;
    
    // Bloom/Glow Effect
    // Only apply heavy shadow to cells facing somewhat forward for performance
    if (depthFactor > 0.4) {
      ctx.shadowBlur = 12 * proj.scale;
      ctx.shadowColor = `hsla(${h}, ${s}%, ${l}%, ${depthFactor})`;
    } else {
      ctx.shadowBlur = 0;
    }

    ctx.fillStyle = `hsla(${h}, ${s}%, ${l}%, ${depthFactor})`;
    
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
  });

  // Reset context
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0;

  // Draw Atmosphere / Outer Glow
  // This gives the sphere a physical boundary
  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;
  
  // Outer rim light
  const grad = ctx.createRadialGradient(cx, cy, r * 0.95, cx, cy, r * 1.15);
  grad.addColorStop(0, 'rgba(0, 240, 255, 0)');
  grad.addColorStop(0.7, 'rgba(0, 240, 255, 0.08)'); // Cyan tint
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.2, 0, Math.PI * 2);
  ctx.fill();
  
  // Inner subtle shadow for 3D volume
  const innerGrad = ctx.createRadialGradient(cx, cy - r*0.3, r*0.2, cx, cy, r);
  innerGrad.addColorStop(0, 'rgba(255,255,255,0.02)');
  innerGrad.addColorStop(1, 'rgba(0,0,0,0.1)');
  
  ctx.fillStyle = innerGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    // Auto rotation
    state.rotation.y += CONFIG.rotationSpeed;
    
    // Throttle game logic updates
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation;
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop;
}

document.getElementById('btn-pause').addEventListener('click', (e) => {
  state.isRunning = !state.isRunning;
  e.target.innerText = state.isRunning ? "Pause" : "Resume";
  e.target.classList.toggle('primary');
  e.target.classList.toggle('secondary');
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  const btn = document.getElementById('btn-pause');
  btn.innerText = "Resume";
  btn.classList.remove('primary');
  btn.classList.add('secondary');
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
});

// Mouse Drag Rotation
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(3, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
