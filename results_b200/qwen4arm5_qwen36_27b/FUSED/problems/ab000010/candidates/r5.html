<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway's Sphere | Volumetric Life</title>
<style>
  :root {
    --bg-deep: #020204;
    --bg-gradient: radial-gradient(circle at 40% 40%, #0a0b10 0%, #000000 100%);
    --glass-bg: rgba(15, 15, 20, 0.65);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-highlight: rgba(255, 255, 255, 0.25);
    
    --accent-cyan: #00f0ff;
    --accent-pink: #ff0055;
    --accent-purple: #bd00ff;
    
    --text-main: #ffffff;
    --text-muted: #8892b0;
    
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Fira Code", "Roboto Mono", "Courier New", Courier, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }

  body {
    background-color: var(--bg-deep);
    background-image: var(--bg-gradient);
    color: var(--text-main);
    font-family: var(--font-display);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  /* Canvas Container - Shifted Left */
  #canvas-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Overlay Layer */
  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3rem;
  }

  /* Header - Impactful Typography */
  .header {
    pointer-events: auto;
    position: absolute;
    top: 4rem;
    left: 4rem;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  h1 {
    font-size: 3.5rem;
    font-weight: 900;
    letter-spacing: -0.05em;
    line-height: 0.9;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 10px 40px rgba(0,0,0,0.8);
    margin: 0;
  }
  
  h1 .accent {
    background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-pink) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: block;
  }

  .subtitle {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--text-muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: rgba(0,0,0,0.4);
    padding: 4px 8px;
    border-radius: 4px;
    width: fit-content;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.05);
  }

  /* Control Panel - Redesigned Glassmorphism */
  .panel-wrapper {
    pointer-events: auto;
    position: absolute;
    top: 50%;
    right: 4rem;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .panel {
    width: 300px;
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
    gap: 2rem;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .panel:hover {
    transform: translateY(-2px);
    box-shadow: 0 30px 70px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.2);
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .panel-label {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--accent-cyan);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  
  .panel-label::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--accent-cyan);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-cyan);
  }

  /* Stats */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    background: rgba(0,0,0,0.2);
    padding: 1rem;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .stat-label { 
    font-size: 0.65rem; 
    color: var(--text-muted); 
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .stat-value {
    font-family: var(--font-mono);
    font-size: 1.5rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    letter-spacing: -0.02em;
  }

  /* Sliders */
  .slider-container {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
    transition: background 0.2s;
  }
  input[type=range]:hover {
    background: rgba(255,255,255,0.15);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    border: none;
    box-shadow: 0 0 10px rgba(0,0,0,0.5), 0 0 0 2px var(--accent-cyan);
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.1);
  }

  /* Buttons - Pill Shapes */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  
  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-main);
    padding: 0.8rem 1.5rem;
    border-radius: 99px; /* Pill shape */
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.4);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  }
  
  button:active { transform: translateY(0); }

  button.primary {
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 240, 255, 0.05));
    border: 1px solid rgba(0, 240, 255, 0.4);
    color: var(--accent-cyan);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
  }
  button.primary:hover {
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(0, 240, 255, 0.1));
    border-color: var(--accent-cyan);
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
    color: #fff;
  }

  button.secondary {
    color: var(--text-muted);
  }
  button.secondary:hover {
    color: #fff;
    border-color: rgba(255,255,255,0.6);
  }

  /* Footer - High Contrast */
  .footer {
    position: absolute;
    bottom: 3rem;
    left: 4rem;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: #fff;
    opacity: 0.8;
    letter-spacing: 0.05em;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .footer span {
    display: inline-block;
    padding: 4px 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.1);
  }

</style>
</head>
<body>

  <!-- Canvas -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Header -->
    <div class="header">
      <h1>Conway's <span class="accent">Sphere</span></h1>
      <div class="subtitle">Volumetric Simulation // Gen <span id="header-gen">0</span></div>
    </div>

    <!-- Control Panel -->
    <div class="panel-wrapper">
      <div class="panel">
        
        <!-- Stats -->
        <div class="panel-section">
          <div class="panel-label">Live Telemetry</div>
          <div class="stat-grid">
            <div class="stat-item">
              <span class="stat-label">Generation</span>
              <span class="stat-value" id="gen-count">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Population</span>
              <span class="stat-value" id="pop-count">0</span>
            </div>
          </div>
        </div>

        <!-- Speed Control -->
        <div class="panel-section">
          <div class="panel-label">Simulation Pace</div>
          <div class="slider-container">
            <input type="range" id="speed-slider" min="1" max="60" value="30">
          </div>
        </div>

        <!-- Actions -->
        <div class="panel-section">
          <div class="panel-label">System Control</div>
          <div class="btn-group">
            <button id="btn-pause" class="primary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>
              Pause
            </button>
            <button id="btn-reset" class="secondary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              Reset
            </button>
          </div>
          <button id="btn-step" class="secondary" style="width: 100%; margin-top: 0.75rem;">
             Step Frame
          </button>
        </div>

      </div>
    </div>

    <div class="footer">
      <span>DRAG</span> ROTATE
      <span>SCROLL</span> ZOOM
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life
 * 
 * Visual Upgrades:
 * - Volumetric Lighting: Light source at top-right.
 * - Neon Palette: Cyan (Young) -> Purple (Mid) -> Pink/Orange (Old).
 * - Depth of Field: Back cells are smaller and darker.
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 3000,
  sphereRadius: 280,
  cellSize: 3.5,
  rotationSpeed: 0.0008,
  lightPos: { x: 0.5, y: -0.5, z: 1.0 } // Light source direction
};

// --- State ---
let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 30,
  lastFrameTime: 0,
  rotation: { x: 0.3, y: 0.4 },
  zoom: 1.0,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  distSq: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return dx*dx + dy*dy + dz*dz;
  },
  normalize: (v) => {
    const len = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z);
    return { x: v.x/len, y: v.y/len, z: v.z/len };
  },
  dot: (v1, v2) => v1.x*v2.x + v1.y*v2.y + v1.z*v2.z
};

// Fibonacci Lattice Sphere Generation
function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y); 
    const theta = goldenAngle * i;
    
    const x = Math.cos(theta) * radiusAtY;
    const z = Math.sin(theta) * radiusAtY;
    
    points.push({
      x: x * radius,
      y: y * radius,
      z: z * radius,
      // Normalized normal vector for lighting
      nx: x, ny: y, nz: z
    });
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Neighbor search threshold
  const avgDist = (2 * Math.PI * CONFIG.sphereRadius) / Math.sqrt(CONFIG.cellCount);
  const threshold = avgDist * 1.35; 
  
  state.cells = points.map((p, i) => {
    const neighbors = [];
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      if (Vec3.distSq(p, points[j]) < threshold * threshold) { 
        neighbors.push(j);
      }
    }

    return {
      pos: p,
      idx: i,
      neighbors: neighbors,
      alive: Math.random() > 0.60, 
      bornGen: 0, 
      age: 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  const nextStates = state.cells.map(cell => {
    let liveNeighbors = 0;
    for (let k = 0; k < cell.neighbors.length; k++) {
      if (state.cells[cell.neighbors[k]].alive) liveNeighbors++;
    }
    
    let nextAlive = false;
    let isBorn = false;

    if (cell.alive) {
      if (liveNeighbors === 2 || liveNeighbors === 3) nextAlive = true;
    } else {
      if (liveNeighbors === 3) {
        nextAlive = true;
        isBorn = true;
      }
    }
    
    return {
      alive: nextAlive,
      bornGen: isBorn ? state.generation : cell.bornGen,
      age: nextAlive ? (cell.alive ? cell.age + 1 : 0) : 0
    };
  });

  state.cells.forEach((cell, i) => {
    cell.alive = nextStates[i].alive;
    cell.bornGen = nextStates[i].bornGen;
    cell.age = nextStates[i].age;
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 1000 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal,
    // Calculate rotated normal for lighting
    // (Simplified: applying same rotation matrix to normal)
    nx: p.nx * Math.cos(rotY) - p.nz * Math.sin(rotY),
    ny: p.ny * Math.cos(rotX) + (p.nz * Math.cos(rotY) + p.nx * Math.sin(rotY)) * Math.sin(rotX),
    nz: (p.nz * Math.cos(rotY) + p.nx * Math.sin(rotY)) * Math.cos(rotX) - p.ny * Math.sin(rotX)
  };
}

function draw() {
  // Clear background
  ctx.fillStyle = '#020204'; 
  ctx.fillRect(0, 0, width, height);

  // Calculate projected positions
  const projectedCells = state.cells.map(cell => {
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    return { cell, proj };
  });
  
  // Sort by Z (Painter's algorithm) - Back to Front
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // --- Render Pass ---
  
  // Additive blending for neon glow
  ctx.globalCompositeOperation = 'lighter';

  projectedCells.forEach(({ cell, proj }) => {
    if (!cell.alive) return;

    // --- Lighting Calculation (Lambertian) ---
    // Normal vector is proj.nx, proj.ny, proj.nz
    // Light is coming from top-right-front
    const lightDir = { x: 0.4, y: -0.6, z: 0.8 }; // Normalized roughly
    // Dot product
    let brightness = Vec3.dot({x: proj.nx, y: proj.ny, z: proj.nz}, lightDir);
    // Clamp and add ambient
    brightness = Math.max(0.1, Math.min(1.0, brightness * 0.8 + 0.2));

    // --- Color Logic (Vibrant Heatmap) ---
    // 0 (Young) -> 100 (Mid) -> 300+ (Old)
    const maxAge = 300;
    const ageRatio = Math.min(cell.age, maxAge) / maxAge;
    
    // Hue interpolation: Cyan (190) -> Purple (280) -> Pink/Orange (340->10)
    let h;
    if (ageRatio < 0.4) {
      // Cyan to Purple
      h = 190 + (ageRatio / 0.4) * 90; 
    } else {
      // Purple to Pink/Orange
      h = 280 + ((ageRatio - 0.4) / 0.6) * 80;
    }
    
    // Saturation and Lightness affected by depth and lighting
    const s = 100;
    const l = 50 + (brightness * 20); // Brighter where light hits

    // --- Depth Logic ---
    // Z ranges from -Radius (front) to +Radius (back)
    // Normalize to 0..1 (1 is front)
    const depthFactor = Math.max(0.2, 1 - (proj.z / (CONFIG.sphereRadius * 1.5)));
    
    // Size based on perspective and depth fade
    const size = CONFIG.cellSize * proj.scale * (0.6 + (depthFactor * 0.4));

    // --- Render ---
    // Only glow if it's bright and close
    if (brightness > 0.5 && depthFactor > 0.7) {
      ctx.shadowBlur = 12 * proj.scale * brightness;
      ctx.shadowColor = `hsla(${h}, ${s}%, ${l}%, 0.8)`;
    } else {
      ctx.shadowBlur = 0;
    }

    // Final alpha combines depth fade and lighting
    const alpha = depthFactor * brightness;
    
    ctx.fillStyle = `hsla(${h}, ${s}%, ${l}%, ${alpha})`;
    
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
  });

  // Reset context
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0;

  // --- Atmosphere / Outer Glow ---
  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;
  
  // Subtle core glow
  const gradCore = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  gradCore.addColorStop(0, 'rgba(10, 20, 30, 0)');
  gradCore.addColorStop(0.8, 'rgba(0, 0, 0, 0)');
  gradCore.addColorStop(0.95, 'rgba(0, 240, 255, 0.05)'); // Rim color
  gradCore.addColorStop(1, 'rgba(0, 0, 0, 0)');
  
  ctx.fillStyle = gradCore;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.1, 0, Math.PI * 2);
  ctx.fill();
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    // Auto rotation
    state.rotation.y += CONFIG.rotationSpeed;
    
    // Throttle game logic updates
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  const genStr = state.generation;
  document.getElementById('gen-count').innerText = genStr;
  document.getElementById('header-gen').innerText = genStr;
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop;
}

document.getElementById('btn-pause').addEventListener('click', (e) => {
  state.isRunning = !state.isRunning;
  const btn = e.currentTarget;
  if(state.isRunning) {
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg> Pause`;
    btn.classList.remove('secondary');
    btn.classList.add('primary');
  } else {
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Resume`;
    btn.classList.remove('primary');
    btn.classList.add('secondary');
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  const btn = document.getElementById('btn-pause');
  btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Resume`;
  btn.classList.remove('primary');
  btn.classList.add('secondary');
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
});

// Mouse Drag Rotation
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(3, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
