<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway's Sphere | Algorithmic Life</title>
<style>
  :root {
    --bg-deep: #050508;
    --panel-bg: rgba(10, 12, 16, 0.4);
    --panel-border: rgba(255, 255, 255, 0.08);
    --accent-primary: #00f0ff;
    --accent-secondary: #ff00ff;
    --text-main: #ffffff;
    --text-muted: #8892b0;
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Fira Code", "Roboto Mono", "Courier New", Courier, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-display);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    /* Radial gradient to focus center */
    background: radial-gradient(circle at 50% 50%, #0f101a 0%, #000000 100%);
  }

  /* Canvas Container */
  #canvas-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Overlay Layer */
  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3rem;
  }

  /* Header (Top Left) */
  .header {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    align-self: flex-start;
  }

  h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 30px rgba(0,0,0,0.8);
  }
  
  h1 span {
    background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 0.25rem;
  }

  /* Control Panel (Sidebar Right) */
  .panel-wrapper {
    pointer-events: auto;
    position: absolute;
    top: 50%;
    right: 3rem;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  /* Glassmorphism Panel */
  .panel {
    width: 280px;
    background: var(--panel-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--panel-border);
    border-right: 1px solid rgba(255,255,255,0.15); /* Subtle highlight */
    border-radius: 20px;
    padding: 1.5rem;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    gap: 2rem;
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
  }

  .panel:hover {
    transform: translateY(-2px);
    box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.15);
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .panel-label {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--accent-primary);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    opacity: 0.8;
  }
  .panel-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--accent-primary), transparent);
    opacity: 0.4;
  }

  /* Stats */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .stat-label { 
    font-size: 0.7rem; 
    color: var(--text-muted); 
    font-weight: 500;
    letter-spacing: 0.05em;
  }
  .stat-value {
    font-family: var(--font-mono);
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    letter-spacing: -0.02em;
  }

  /* Sliders */
  .slider-container {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    border: 2px solid var(--accent-primary);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  /* Buttons */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  
  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-main);
    padding: 0.8rem 1rem;
    border-radius: 8px;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-align: center;
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.3);
    transform: translateY(-1px);
  }
  
  button:active { transform: translateY(1px); }

  button.primary {
    background: rgba(0, 240, 255, 0.1);
    border: 1px solid rgba(0, 240, 255, 0.3);
    color: var(--accent-primary);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.05);
  }
  button.primary:hover {
    background: rgba(0, 240, 255, 0.2);
    border-color: var(--accent-primary);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 2rem;
    left: 3rem;
    font-family: var(--font-mono);
    font-size: 0.6rem;
    color: var(--text-muted);
    opacity: 0.5;
    letter-spacing: 0.1em;
    pointer-events: none;
  }

</style>
</head>
<body>

  <!-- Canvas -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Header (Left) -->
    <div class="header">
      <h1>Conway's <span>Sphere</span></h1>
      <div class="subtitle">Algorithmic Life Simulation</div>
    </div>

    <!-- Control Panel (Right Sidebar) -->
    <div class="panel-wrapper">
      <div class="panel">
        
        <!-- Stats -->
        <div class="panel-section">
          <div class="panel-label">Telemetry</div>
          <div class="stat-grid">
            <div class="stat-item">
              <span class="stat-label">Generation</span>
              <span class="stat-value" id="gen-count">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Population</span>
              <span class="stat-value" id="pop-count">0</span>
            </div>
          </div>
        </div>

        <!-- Speed Control -->
        <div class="panel-section">
          <div class="panel-label">Simulation Speed</div>
          <div class="slider-container">
            <input type="range" id="speed-slider" min="1" max="60" value="30">
          </div>
        </div>

        <!-- Actions -->
        <div class="panel-section">
          <div class="panel-label">System Control</div>
          <div class="btn-group">
            <button id="btn-pause" class="primary">Pause</button>
            <button id="btn-reset" class="secondary">Randomize</button>
          </div>
          <button id="btn-step" class="secondary" style="width: 100%; margin-top: 0.75rem;">Step Frame</button>
        </div>

      </div>
    </div>

    <div class="footer">
      DRAG TO ROTATE &bull; SCROLL TO ZOOM
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life
 * 
 * Visuals:
 * - Heatmap Palette: Cyan (Young) -> Magenta (Mid) -> Orange/Yellow (Old)
 * - Depth: Z-sorting + Atmospheric Occlusion (Back cells smaller/dimmer)
 * - Form: Core glow + Rim light
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 4000,
  sphereRadius: 300,
  cellSize: 2.5,
  rotationSpeed: 0.001,
  // Heatmap Palette
  colors: {
    young: { h: 190, s: 90, l: 50 }, // Cyan/Blue
    mid:   { h: 280, s: 80, l: 55 }, // Magenta
    old:   { h: 30,  s: 90, l: 55 }  // Orange/Yellow
  }
};

// --- State ---
let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 30,
  lastFrameTime: 0,
  rotation: { x: 0.3, y: 0.4 },
  zoom: 1.0,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  distSq: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return dx*dx + dy*dy + dz*dz;
  }
};

// Fibonacci Lattice Sphere Generation
function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y); 
    const theta = goldenAngle * i;
    
    const x = Math.cos(theta) * radiusAtY;
    const z = Math.sin(theta) * radiusAtY;
    
    points.push({
      x: x * radius,
      y: y * radius,
      z: z * radius,
      idx: i
    });
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Neighbor search
  // Calculate neighbor radius based on surface area distribution
  const avgDist = (2 * Math.PI * CONFIG.sphereRadius) / Math.sqrt(CONFIG.cellCount);
  const threshold = avgDist * 1.3; 
  
  state.cells = points.map((p, i) => {
    const neighbors = [];
    // Optimization: Iterate through points.
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      // Simple distance check (squared to avoid sqrt)
      if (Vec3.distSq(p, points[j]) < threshold * threshold) { 
        neighbors.push(j);
      }
    }

    return {
      pos: p,
      idx: i,
      neighbors: neighbors,
      alive: Math.random() > 0.65, // 35% density for interesting start
      bornGen: 0, 
      age: 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  const nextStates = state.cells.map(cell => {
    let liveNeighbors = 0;
    // Count live neighbors
    for (let k = 0; k < cell.neighbors.length; k++) {
      if (state.cells[cell.neighbors[k]].alive) liveNeighbors++;
    }
    
    let nextAlive = false;
    let isBorn = false;

    if (cell.alive) {
      if (liveNeighbors === 2 || liveNeighbors === 3) nextAlive = true;
    } else {
      if (liveNeighbors === 3) {
        nextAlive = true;
        isBorn = true;
      }
    }
    
    return {
      alive: nextAlive,
      bornGen: isBorn ? state.generation : cell.bornGen,
      age: nextAlive ? (cell.alive ? cell.age + 1 : 0) : 0
    };
  });

  state.cells.forEach((cell, i) => {
    cell.alive = nextStates[i].alive;
    cell.bornGen = nextStates[i].bornGen;
    cell.age = nextStates[i].age;
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 900 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // Clear background with trail effect
  // Trail effect gives a subtle motion blur to the whole sphere
  ctx.fillStyle = 'rgba(5, 5, 8, 0.4)'; 
  ctx.fillRect(0, 0, width, height);

  // Calculate projected positions
  const projectedCells = state.cells.map(cell => {
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    return { cell, proj };
  });
  
  // Sort by Z (Painter's algorithm) - Back to Front
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // --- Render Pass ---
  
  // Setup additive blending for the "Bloom" look
  ctx.globalCompositeOperation = 'lighter';

  projectedCells.forEach(({ cell, proj }) => {
    if (!cell.alive) return;

    // --- Color Logic (Multicolor Heatmap) ---
    // Map age 0 -> 500 to gradient
    const maxAge = 500;
    const ageRatio = Math.min(cell.age, maxAge) / maxAge;
    
    let h, s, l;
    
    if (ageRatio < 0.5) {
      // Cyan to Magenta
      const t = ageRatio * 2;
      h = CONFIG.colors.young.h + (CONFIG.colors.mid.h - CONFIG.colors.young.h) * t;
    } else {
      // Magenta to Yellow/Orange
      const t = (ageRatio - 0.5) * 2;
      h = CONFIG.colors.mid.h + (CONFIG.colors.old.h - CONFIG.colors.mid.h) * t;
    }
    s = 90;
    l = 55;

    // --- Depth Logic ---
    // Z ranges roughly from -Radius (front) to +Radius (back)
    // We want front to be 1.0 opacity/size, back to be 0.1
    
    // Normalize Z to 0..1 range roughly (0 is back, 1 is front)
    // Note: zFinal is positive when behind the center plane
    const depthFactor = Math.max(0.1, 1 - (proj.z / (CONFIG.sphereRadius * 1.2)));
    
    // --- Size Logic ---
    // Cells on the back are smaller due to perspective + custom depth scaling
    const size = CONFIG.cellSize * proj.scale * (0.5 + (depthFactor * 0.5));

    // --- Render ---
    // Stronger glow for front cells
    if (depthFactor > 0.6) {
      ctx.shadowBlur = 10 * proj.scale * depthFactor;
      ctx.shadowColor = `hsla(${h}, ${s}%, ${l}%, 0.6)`;
    } else {
      ctx.shadowBlur = 0;
    }

    ctx.fillStyle = `hsla(${h}, ${s}%, ${l}%, ${depthFactor})`;
    
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
  });

  // Reset context
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0;

  // --- Atmosphere / Outer Glow (Rim Light) ---
  // Adds the "Sphere Form" requested
  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;
  
  // Inner Core Glow (subtle)
  const gradCore = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 0.8);
  gradCore.addColorStop(0, 'rgba(0, 240, 255, 0.02)');
  gradCore.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = gradCore;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.8, 0, Math.PI * 2);
  ctx.fill();

  // Rim light gradient
  const gradRim = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r * 1.15);
  gradRim.addColorStop(0, 'rgba(0, 240, 255, 0)'); 
  gradRim.addColorStop(0.4, 'rgba(0, 240, 255, 0.04)'); // Subtle cyan rim
  gradRim.addColorStop(1, 'rgba(0, 0, 0, 0)');
  
  ctx.fillStyle = gradRim;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.2, 0, Math.PI * 2);
  ctx.fill();
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    // Auto rotation
    state.rotation.y += CONFIG.rotationSpeed;
    
    // Throttle game logic updates
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation;
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop;
}

document.getElementById('btn-pause').addEventListener('click', (e) => {
  state.isRunning = !state.isRunning;
  e.target.innerText = state.isRunning ? "Pause" : "Resume";
  // Toggle visual style
  if(state.isRunning) {
    e.target.classList.remove('secondary');
    e.target.classList.add('primary');
  } else {
    e.target.classList.remove('primary');
    e.target.classList.add('secondary');
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  const btn = document.getElementById('btn-pause');
  btn.innerText = "Resume";
  btn.classList.remove('primary');
  btn.classList.add('secondary');
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
});

// Mouse Drag Rotation
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(3, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
