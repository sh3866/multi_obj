<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archon's Ascension</title>
<style>
    :root {
        /* Palette: Deep Void & Molten Gold */
        --bg-deep: #05070a;
        --bg-panel: #0f1219;
        --bg-panel-border: #1e2533;
        
        --gold-primary: #fbbf24;
        --gold-secondary: #b45309;
        --gold-dim: #451a03;
        --gold-glow: rgba(251, 191, 36, 0.6);
        --gold-glow-intense: rgba(251, 191, 36, 0.9);
        
        --text-main: #f1f5f9;
        --text-muted: #64748b;
        --text-dark: #0f172a;
        
        --node-bg: #111827;
        --node-border: #334155;
        
        --font-header: 'Trebuchet MS', 'Segoe UI', sans-serif;
        --font-body: 'Segoe UI', 'Roboto', sans-serif;
        --font-mono: 'Consolas', 'Monaco', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Texture Overlay (Global Noise) --- */
    body::after {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 999;
        opacity: 0.4;
    }

    /* --- Header --- */
    header {
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        background: linear-gradient(180deg, rgba(15, 18, 25, 0.95) 0%, rgba(15, 18, 25, 0.6) 100%);
        border-bottom: 1px solid var(--bg-panel-border);
        z-index: 50;
        backdrop-filter: blur(5px);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .brand-icon {
        width: 28px;
        height: 28px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 8px var(--gold-glow));
        animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
    }

    h1 {
        font-family: var(--font-header);
        font-size: 1.3rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        background: linear-gradient(to bottom, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .header-controls {
        display: flex;
        gap: 15px;
    }

    .status-pill {
        background: rgba(0,0,0,0.3);
        padding: 4px 12px;
        border-radius: 2px;
        border: 1px solid var(--bg-panel-border);
        font-size: 0.65rem;
        font-family: var(--font-mono);
        color: var(--gold-primary);
        letter-spacing: 0.1em;
    }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
    }

    /* --- Sidebar --- */
    aside {
        width: 340px;
        background: var(--bg-panel);
        border-right: 1px solid var(--bg-panel-border);
        display: flex;
        flex-direction: column;
        z-index: 40;
        box-shadow: 10px 0 40px rgba(0,0,0,0.5);
        position: relative;
    }

    /* Unified Panel Styling */
    .panel-section {
        padding: 25px;
        border-bottom: 1px solid var(--bg-panel-border);
        position: relative;
        background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, transparent 100%);
    }
    
    .panel-section:last-child { border-bottom: none; }

    .section-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.15em;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .section-label::after {
        content: '';
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, var(--bg-panel-border), transparent);
    }

    /* Profile */
    .char-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
    }

    .avatar-frame {
        width: 64px;
        height: 64px;
        background: #020408;
        border: 2px solid var(--gold-secondary);
        padding: 2px;
        box-shadow: 0 0 15px rgba(251, 191, 36, 0.1);
    }

    .avatar-inner {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1e293b, #0f172a);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .avatar-inner svg {
        width: 32px;
        height: 32px;
        fill: var(--text-muted);
    }

    .char-info h2 {
        font-family: var(--font-header);
        font-size: 1.2rem;
        color: var(--text-main);
        margin-bottom: 4px;
    }

    .char-class {
        color: var(--gold-primary);
        font-size: 0.75rem;
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    /* Level & XP */
    .level-display {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 8px;
    }

    .level-val {
        font-family: var(--font-header);
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1;
        text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    .level-label {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-family: var(--font-mono);
    }

    .xp-container {
        margin-top: 10px;
    }

    .xp-track {
        height: 6px;
        background: #020408;
        border: 1px solid var(--bg-panel-border);
        position: relative;
        overflow: hidden;
    }

    .xp-fill {
        height: 100%;
        width: 68%;
        background: linear-gradient(90deg, var(--gold-secondary), var(--gold-primary));
        box-shadow: 0 0 10px var(--gold-glow);
        position: relative;
    }

    .xp-fill::after {
        content: '';
        position: absolute;
        right: 0; top: 0; bottom: 0;
        width: 20px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4));
        animation: pulse-bar 2s infinite;
    }

    @keyframes pulse-bar {
        0% { opacity: 0.5; }
        50% { opacity: 1; }
        100% { opacity: 0.5; }
    }

    .xp-text {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-top: 5px;
        font-family: var(--font-mono);
    }

    /* Skill Points */
    .sp-display {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(251, 191, 36, 0.05);
        border: 1px solid rgba(251, 191, 36, 0.15);
        padding: 12px 15px;
        margin-top: 15px;
    }

    .sp-val {
        font-family: var(--font-header);
        font-size: 1.5rem;
        color: var(--gold-primary);
        text-shadow: 0 0 10px var(--gold-glow);
    }

    /* Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .stat-item {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--bg-panel-border);
        padding: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.2s;
    }

    .stat-item:hover {
        background: rgba(255,255,255,0.05);
        border-color: var(--text-muted);
    }

    .stat-name {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
    }

    .stat-val {
        font-family: var(--font-mono);
        font-size: 0.9rem;
        color: var(--text-main);
    }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at 50% 30%, #111827 0%, #020617 60%, #000000 100%);
    }

    .tree-container:active { cursor: grabbing; }

    /* Subtle Grid */
    .tree-container::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: 
            radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 30px 30px;
        pointer-events: none;
        z-index: 0;
    }

    .tree-world {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1800px;
        height: 1200px;
        transform-origin: center center;
        transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    svg.connections {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: visible;
    }

    /* --- Connections --- */
    .connection-line {
        stroke: #1e293b;
        stroke-width: 4;
        fill: none;
        stroke-linecap: round;
        transition: stroke 0.5s, filter 0.5s, stroke-dashoffset 1s;
    }

    .connection-line.active {
        stroke: var(--gold-primary);
        filter: drop-shadow(0 0 5px var(--gold-glow));
    }

    .connection-line.available {
        stroke: #334155;
        stroke-dasharray: 10, 5;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        width: 90px;
        height: 90px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .node:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }

    /* Hexagon Shape */
    .node-shape {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Main Hex Body */
    .node-shape::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--node-bg);
        clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
        transition: background 0.3s;
        border: 1px solid rgba(255,255,255,0.1); /* Fallback */
    }

    /* Inner Border/Bevel */
    .node-shape::after {
        content: '';
        position: absolute;
        inset: 4px;
        background: transparent;
        border: 2px solid var(--node-border);
        clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    .node-icon {
        width: 36px;
        height: 36px;
        fill: var(--text-muted);
        opacity: 0.5;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        transition: all 0.3s;
        z-index: 2;
    }

    /* --- States --- */

    /* Unlocked */
    .node.unlocked .node-shape::before {
        background: radial-gradient(circle at 30% 30%, #f59e0b, var(--gold-dim));
    }
    
    .node.unlocked .node-shape::after {
        border-color: rgba(255, 255, 255, 0.6);
        box-shadow: inset 0 0 10px var(--gold-glow);
    }

    .node.unlocked .node-icon {
        fill: #fff;
        opacity: 1;
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.8));
    }

    /* Available */
    .node.available .node-shape::before {
        background: #1e293b;
    }
    
    .node.available .node-shape::after {
        border-color: #64748b;
    }

    .node.available .node-icon {
        opacity: 0.9;
        fill: #e2e8f0;
    }

    .node.available:hover .node-shape::after {
        border-color: var(--text-main);
        box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }

    /* Locked */
    .node.locked {
        opacity: 0.4;
        filter: grayscale(0.8);
        cursor: not-allowed;
    }
    
    .node.locked:hover { transform: translate(-50%, -50%) scale(1); }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid var(--bg-panel-border);
        padding: 0;
        width: 300px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(5px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.8);
        border-left: 3px solid var(--text-muted);
        backdrop-filter: blur(8px);
        overflow: hidden;
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip-header {
        padding: 15px;
        background: linear-gradient(90deg, rgba(255,255,255,0.05), transparent);
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .tooltip h3 {
        color: var(--text-main);
        font-family: var(--font-header);
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 0;
    }

    .tooltip .type-badge {
        font-size: 0.6rem;
        text-transform: uppercase;
        padding: 2px 6px;
        background: var(--bg-panel-border);
        color: var(--text-muted);
        border-radius: 2px;
        font-weight: 700;
        margin-left: 8px;
        vertical-align: middle;
    }

    .tooltip-body {
        padding: 15px;
    }

    .tooltip p {
        font-size: 0.85rem;
        line-height: 1.5;
        color: #94a3b8;
        margin-bottom: 12px;
    }

    .tooltip .stat-bonus {
        color: #4ade80;
        font-size: 0.8rem;
        font-weight: 600;
        display: block;
        font-family: var(--font-mono);
        margin-top: 5px;
        text-shadow: 0 0 5px rgba(74, 222, 128, 0.2);
    }

    .tooltip .req {
        font-size: 0.75rem;
        color: #ef4444;
        display: none;
        margin-top: 5px;
        font-style: italic;
    }
    
    .tooltip.locked {
        border-left-color: #ef4444;
    }
    .tooltip.locked .req { display: block; }
    
    /* Button style for 'Unlock' hint */
    .unlock-hint {
        display: block;
        text-align: right;
        font-size: 0.7rem;
        color: var(--gold-primary);
        margin-top: 10px;
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

</style>
</head>
<body>

    <header>
        <div class="brand">
            <svg class="brand-icon" viewBox="0 0 24 24">
                <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z" />
            </svg>
            <h1>Archon's Ascension</h1>
        </div>
        <div class="header-controls">
            <div class="status-pill">SYSTEM: ONLINE</div>
            <div class="status-pill">PVP: ENABLED</div>
        </div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="panel-section">
                <div class="char-header">
                    <div class="avatar-frame">
                        <div class="avatar-inner">
                            <!-- Placeholder Avatar Icon -->
                            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        </div>
                    </div>
                    <div class="char-info">
                        <h2>Kaelen Thorne</h2>
                        <div class="char-class">Duelist / Arcanist</div>
                    </div>
                </div>

                <div class="level-display">
                    <span class="level-label">LVL</span>
                    <span class="level-val">42</span>
                </div>

                <div class="xp-container">
                    <div class="xp-track">
                        <div class="xp-fill"></div>
                    </div>
                    <div class="xp-text">
                        <span>EXP</span>
                        <span>68,450 / 100,000</span>
                    </div>
                </div>

                <div class="sp-display">
                    <span class="section-label" style="margin:0;">Skill Points</span>
                    <span class="sp-val">3</span>
                </div>
            </div>

            <div class="panel-section">
                <div class="section-label">Attributes</div>
                <div class="stats-grid">
                    <div class="stat-item"><span class="stat-name">Str</span><span class="stat-val">14</span></div>
                    <div class="stat-item"><span class="stat-name">Dex</span><span class="stat-val">28</span></div>
                    <div class="stat-item"><span class="stat-name">Int</span><span class="stat-val">35</span></div>
                    <div class="stat-item"><span class="stat-name">Vital</span><span class="stat-val">12</span></div>
                    <div class="stat-item"><span class="stat-name">Luck</span><span class="stat-val">8</span></div>
                    <div class="stat-item"><span class="stat-name">Will</span><span class="stat-val">19</span></div>
                </div>
            </div>
        </aside>

        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <svg class="connections" id="svgConnections"></svg>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <div class="tooltip-header">
            <h3 id="tt-title">Skill Name</h3>
            <span class="type-badge" id="tt-type">Passive</span>
        </div>
        <div class="tooltip-body">
            <p id="tt-desc">Description of the skill goes here.</p>
            <span class="stat-bonus" id="tt-bonus"></span>
            <div class="req" id="tt-req">Requires: [Previous Skill]</div>
            <span class="unlock-hint" id="tt-action">Click to Unlock</span>
        </div>
    </div>

<script>
    // --- Data Structure ---
    const skills = [
        // Root
        { id: 'root', x: 900, y: 200, name: "Archon's Spark", type: "Origin", desc: "The genesis of your power. Unlocks the skill tree.", bonus: "+5% Total Damage", unlocked: true, req: null },
        
        // Tier 1
        { id: 'str1', x: 550, y: 400, name: "Titan's Grip", type: "Passive", desc: "Grip weapons with crushing force.", bonus: "+4 Strength", unlocked: true, req: 'root' },
        { id: 'dex1', x: 1250, y: 400, name: "Swift Foot", type: "Passive", desc: "Movement is fluid and precise.", bonus: "+5% Move Speed", unlocked: true, req: 'root' },
        { id: 'int1', x: 900, y: 450, name: "Arcane Mind", type: "Passive", desc: "Channel the void energies.", bonus: "+10% Mana Regen", unlocked: false, req: 'root' },

        // Tier 2
        { id: 'str2', x: 300, y: 650, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", bonus: "Cooldown: 10s", unlocked: true, req: 'str1' },
        { id: 'dex2', x: 1500, y: 650, name: "Evasion", type: "Passive", desc: "Dodge incoming attacks effortlessly.", bonus: "10% Dodge Chance", unlocked: true, req: 'dex1' },
        { id: 'int2', x: 700, y: 700, name: "Fireball", type: "Active", desc: "Launch a projectile of condensed fire.", bonus: "Cost: 50 Mana", unlocked: false, req: 'int1' },
        { id: 'int3', x: 1100, y: 700, name: "Frost Nova", type: "Active", desc: "Freeze enemies in a radius.", bonus: "Stun: 1.5s", unlocked: false, req: 'int1' },

        // Tier 3
        { id: 'str3', x: 150, y: 900, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", bonus: "Knockback Immunity", unlocked: false, req: 'str2' },
        { id: 'dex3', x: 1650, y: 900, name: "Backstab", type: "Active", desc: "Deals massive damage from behind.", bonus: "3x Damage (Back)", unlocked: false, req: 'dex2' },
        { id: 'hybrid', x: 900, y: 950, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows instantly.", bonus: "Cooldown: 45s", unlocked: false, req: 'int3' }
    ];

    // --- Icons ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z",
        origin: "M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"
    };

    // --- DOM ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttBonus = document.getElementById('tt-bonus');
    const ttReq = document.getElementById('tt-req');
    const ttAction = document.getElementById('tt-action');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Initial Center
        window.panX = cw/2 - 900;
        window.panY = ch/2 - 600;
        
        world.style.transform = `translate(${window.panX}px, ${window.panY}px) scale(1)`;
        
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.type === 'Origin') iconPath = icons.origin;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', (e) => {
                e.stopPropagation(); // Prevent panning
                toggleSkill(skill.id);
            });

            world.appendChild(node);
        });

        drawLines();
    }

    function drawLines() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    } else if (parent.unlocked) {
                        line.classList.add('available');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        ttBonus.textContent = skill.bonus || '';
        
        const canUnlock = !skill.unlocked && checkPrereq(skill);

        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
            ttBonus.style.display = 'block';
            ttAction.style.display = 'none';
        } else {
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            
            if (canUnlock) {
                tooltip.classList.remove('locked');
                ttReq.style.color = 'var(--text-muted)';
                ttReq.style.display = 'block';
                ttBonus.style.display = 'block';
                ttAction.style.display = 'block';
            } else {
                tooltip.classList.add('locked');
                ttReq.style.color = '#ef4444';
                ttReq.style.display = 'block';
                ttBonus.style.display = 'none';
                ttAction.style.display = 'none';
            }
        }

        tooltip.classList.add('visible');
        positionTooltip(e.clientX, e.clientY);
    }

    function positionTooltip(x, y) {
        const ttWidth = 300;
        const ttHeight = 200;
        
        let finalX = x + 20;
        let finalY = y - 20;

        if (finalX + ttWidth > window.innerWidth) finalX = x - ttWidth - 20;
        if (finalY + ttHeight > window.innerHeight) finalY = window.innerHeight - ttHeight - 20;

        tooltip.style.left = `${finalX}px`;
        tooltip.style.top = `${finalY}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function checkPrereq(skill) {
        if (!skill.req) return true;
        const parent = skills.find(s => s.id === skill.req);
        return parent && parent.unlocked;
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        if (skill.unlocked) return;
        if (!checkPrereq(skill)) return;

        // Mock Unlock
        skill.unlocked = true;
        updateVisuals();
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            el.classList.remove('unlocked', 'available', 'locked');
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else if (checkPrereq(s)) {
                el.classList.add('available');
            } else {
                el.classList.add('locked');
            }
        });
        drawLines();
    }

    // --- Pan & Zoom ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let scale = 1;

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - window.panX;
        startY = e.clientY - window.panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        window.panX = e.clientX - startX;
        window.panY = e.clientY - startY;
        world.style.transform = `translate(${window.panX}px, ${window.panY}px) scale(${scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        window.panX -= mouseX * scaleChange;
        window.panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${window.panX}px, ${window.panY}px) scale(${scale})`;
    });

    init();
</script>
</body>
</html>
