<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archon's Ascension</title>
<style>
    :root {
        /* Palette: Void & Molten Gold */
        --bg-deep: #020408;
        --bg-panel: #0f1219;
        --bg-panel-border: #1e2533;
        
        --gold-primary: #fbbf24;
        --gold-secondary: #d97706;
        --gold-dim: #451a03; /* Darker gold/brown for inactive */
        --gold-glow: rgba(251, 191, 36, 0.5);
        
        --text-main: #e2e8f0;
        --text-muted: #64748b;
        
        --node-inactive: #1e293b;
        --node-inactive-border: #334155;
        
        /* Typography: System Fonts only, styled for authority */
        --font-header: 'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', sans-serif;
        --font-body: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        --font-mono: 'Consolas', 'Monaco', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Header --- */
    header {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        background: linear-gradient(180deg, #0f1219 0%, rgba(15, 18, 25, 0.8) 100%);
        border-bottom: 1px solid var(--bg-panel-border);
        z-index: 50;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .brand-icon {
        width: 24px;
        height: 24px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 5px var(--gold-glow));
    }

    h1 {
        font-family: var(--font-header);
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .header-controls {
        display: flex;
        gap: 20px;
        align-items: center;
    }

    .status-pill {
        background: rgba(255,255,255,0.05);
        padding: 6px 16px;
        border-radius: 20px;
        border: 1px solid var(--bg-panel-border);
        font-size: 0.75rem;
        font-family: var(--font-mono);
        color: var(--text-muted);
    }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
    }

    /* --- Sidebar --- */
    aside {
        width: 320px;
        background: var(--bg-panel);
        border-right: 1px solid var(--bg-panel-border);
        display: flex;
        flex-direction: column;
        z-index: 40;
        box-shadow: 5px 0 30px rgba(0,0,0,0.3);
        overflow-y: auto;
    }

    /* Scrollbar styling */
    aside::-webkit-scrollbar { width: 4px; }
    aside::-webkit-scrollbar-track { background: transparent; }
    aside::-webkit-scrollbar-thumb { background: var(--bg-panel-border); }

    /* Character Profile Card */
    .profile-section {
        padding: 30px 25px;
        border-bottom: 1px solid var(--bg-panel-border);
        position: relative;
    }

    /* Decorative corner accent */
    .profile-section::after {
        content: '';
        position: absolute;
        bottom: 0; right: 0;
        width: 20px; height: 20px;
        background: linear-gradient(135deg, transparent 50%, var(--bg-panel-border) 50%);
    }

    .char-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 15px;
    }

    .char-name {
        font-family: var(--font-header);
        font-size: 1.5rem;
        color: var(--text-main);
        line-height: 1;
        margin-bottom: 4px;
    }

    .char-class {
        color: var(--gold-primary);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-weight: 600;
    }

    /* Level & Points Cluster */
    .level-cluster {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 15px;
    }

    .level-badge {
        width: 50px;
        height: 50px;
        background: linear-gradient(135deg, var(--gold-dim), #000);
        border: 2px solid var(--gold-secondary);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .level-num {
        font-family: var(--font-header);
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--gold-primary);
    }

    .level-info {
        flex: 1;
    }

    .level-label {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        margin-bottom: 4px;
        display: flex;
        justify-content: space-between;
    }

    .xp-bar-track {
        width: 100%;
        height: 8px;
        background: #05070a;
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
        position: relative;
    }

    .xp-bar-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--gold-secondary), var(--gold-primary));
        box-shadow: 0 0 10px var(--gold-glow);
        position: relative;
    }
    
    /* Skill Points Card */
    .points-card {
        background: rgba(251, 191, 36, 0.03);
        border: 1px solid rgba(251, 191, 36, 0.15);
        border-radius: 6px;
        padding: 12px 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
        transition: all 0.2s;
        cursor: default;
    }
    
    .points-card:hover {
        background: rgba(251, 191, 36, 0.06);
        border-color: rgba(251, 191, 36, 0.3);
    }

    .pts-label {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .pts-val {
        font-family: var(--font-header);
        font-size: 1.2rem;
        color: var(--gold-primary);
        font-weight: bold;
        text-shadow: 0 0 8px rgba(251, 191, 36, 0.3);
    }

    /* Stats Grid */
    .stats-section {
        padding: 25px;
        flex: 1;
    }

    .section-title {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .section-title::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--bg-panel-border);
    }

    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .stat-card {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--bg-panel-border);
        padding: 12px;
        border-radius: 4px;
        position: relative;
        overflow: hidden;
        transition: border-color 0.2s;
    }

    .stat-card:hover {
        border-color: var(--text-muted);
    }

    /* Subtle background icon for stats */
    .stat-card::before {
        content: '';
        position: absolute;
        top: -10px; right: -10px;
        width: 40px; height: 40px;
        background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
        border-radius: 50%;
    }

    .stat-name {
        font-size: 0.6rem;
        color: var(--text-muted);
        text-transform: uppercase;
        display: block;
        margin-bottom: 4px;
    }

    .stat-val {
        font-size: 1.1rem;
        font-family: var(--font-header);
        color: var(--text-main);
        font-weight: 600;
    }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, #111827 0%, #020617 100%);
    }

    .tree-container:active { cursor: grabbing; }

    /* Grid pattern */
    .tree-container::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
    }

    .tree-world {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1600px;
        height: 1400px;
        /* Centered initially */
        transform-origin: center center;
        transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: visible;
    }

    /* Lines */
    .connection-line {
        stroke: #1e293b;
        stroke-width: 4;
        fill: none;
        stroke-linecap: round;
        transition: stroke 0.5s ease, filter 0.5s ease;
    }

    .connection-line.active {
        stroke: var(--gold-primary);
        filter: drop-shadow(0 0 8px var(--gold-glow));
        stroke-width: 4;
    }

    .connection-line.available {
        stroke: #334155;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        width: 80px;
        height: 80px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .node-shape {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    /* Hexagon Shape */
    .node-shape::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--node-inactive);
        clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
        transition: background 0.3s ease;
    }

    /* Inner border effect */
    .node-shape::after {
        content: '';
        position: absolute;
        inset: 3px;
        background: transparent;
        border: 2px solid var(--node-inactive-border);
        clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .node-icon {
        width: 32px;
        height: 32px;
        fill: var(--text-muted);
        opacity: 0.3;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        transition: all 0.3s ease;
        z-index: 2;
    }

    /* --- Unlocked State --- */
    .node.unlocked .node-shape::before {
        background: radial-gradient(circle at 30% 30%, #f59e0b, var(--gold-dim));
    }
    
    .node.unlocked .node-shape::after {
        border-color: rgba(255, 255, 255, 0.8);
        box-shadow: 0 0 15px var(--gold-glow);
    }

    .node.unlocked .node-icon {
        fill: #fff;
        opacity: 1;
        filter: drop-shadow(0 0 4px rgba(255,255,255,0.9));
    }

    /* --- Available State --- */
    .node.available .node-shape::before {
        background: #232f42;
    }
    
    .node.available .node-shape::after {
        border-color: #94a3b8;
    }

    .node.available .node-icon {
        opacity: 0.8;
        fill: #e2e8f0;
    }

    .node.available:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }
    
    .node.available:hover .node-shape::after {
        box-shadow: 0 0 10px rgba(148, 163, 184, 0.4);
    }

    /* --- Locked State --- */
    .node.locked {
        opacity: 0.4;
        cursor: not-allowed;
    }
    
    .node.locked .node-shape::before {
        background: #0f172a;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(15, 23, 42, 0.98);
        border: 1px solid var(--bg-panel-border);
        padding: 20px;
        width: 320px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(12px);
        border-left: 3px solid var(--gold-primary);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding-bottom: 12px;
    }

    .tooltip h3 {
        color: var(--text-main);
        font-family: var(--font-header);
        font-size: 1.1rem;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .tooltip .type-badge {
        font-size: 0.6rem;
        text-transform: uppercase;
        padding: 3px 8px;
        background: rgba(251, 191, 36, 0.1);
        color: var(--gold-primary);
        border-radius: 2px;
        letter-spacing: 0.1em;
        font-weight: 700;
    }

    .tooltip p {
        font-size: 0.85rem;
        line-height: 1.5;
        color: #94a3b8;
        margin-bottom: 15px;
    }

    .tooltip .stat-bonus {
        color: #4ade80;
        font-size: 0.8rem;
        font-weight: 600;
        margin-top: 5px;
        display: block;
        font-family: var(--font-mono);
    }

    .tooltip .req {
        font-size: 0.75rem;
        color: #ef4444;
        display: none;
        margin-top: 8px;
        font-style: italic;
    }
    
    .tooltip.locked {
        border-left-color: var(--text-muted);
    }
    .tooltip.locked h3 { color: var(--text-muted); }
    .tooltip.locked .req { display: block; }

</style>
</head>
<body>

    <header>
        <div class="brand">
            <svg class="brand-icon" viewBox="0 0 24 24">
                <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z" />
            </svg>
            <h1>Archon's Ascension</h1>
        </div>
        <div class="header-controls">
            <div class="status-pill">SERVER: STABLE</div>
            <div class="status-pill">PVP: ENABLED</div>
        </div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="profile-section">
                <div class="char-header">
                    <div>
                        <div class="char-name">Kaelen Thorne</div>
                        <div class="char-class">Duelist / Arcanist</div>
                    </div>
                    <!-- Mini Avatar Placeholder -->
                    <div style="width:40px; height:40px; background:#1e293b; border-radius:4px; border:1px solid #334155;"></div>
                </div>

                <div class="level-cluster">
                    <div class="level-badge">
                        <span class="level-num">42</span>
                    </div>
                    <div class="level-info">
                        <div class="level-label">
                            <span>Experience</span>
                            <span>65%</span>
                        </div>
                        <div class="xp-bar-track">
                            <div class="xp-bar-fill"></div>
                        </div>
                    </div>
                </div>

                <div class="points-card">
                    <span class="pts-label">Skill Points</span>
                    <span class="pts-val">3</span>
                </div>
            </div>

            <div class="stats-section">
                <div class="section-title">Core Attributes</div>
                <div class="stats-grid">
                    <div class="stat-card"><span class="stat-name">Strength</span><span class="stat-val">14</span></div>
                    <div class="stat-card"><span class="stat-name">Dexterity</span><span class="stat-val">28</span></div>
                    <div class="stat-card"><span class="stat-name">Intelligence</span><span class="stat-val">35</span></div>
                    <div class="stat-card"><span class="stat-name">Vitality</span><span class="stat-val">12</span></div>
                    <div class="stat-card"><span class="stat-name">Luck</span><span class="stat-val">8</span></div>
                    <div class="stat-card"><span class="stat-name">Willpower</span><span class="stat-val">19</span></div>
                </div>
            </div>
        </aside>

        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <svg class="connections" id="svgConnections"></svg>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <div class="tooltip-header">
            <h3 id="tt-title">Skill Name</h3>
            <span class="type-badge" id="tt-type">Passive</span>
        </div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <span class="stat-bonus" id="tt-bonus"></span>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data ---
    // Layout: Centered around 800, 700
    const skills = [
        { id: 'root', x: 800, y: 150, name: "Archon's Spark", type: "Origin", desc: "The genesis of your power. Increases all damage by 5%.", bonus: "+5% Total Damage", unlocked: true, req: null },
        
        // Strength Branch (Left)
        { id: 'str1', x: 550, y: 350, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", bonus: "+4 Strength", unlocked: true, req: 'root' },
        { id: 'str2', x: 350, y: 550, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", bonus: "Cooldown: 10s", unlocked: true, req: 'str1' },
        { id: 'str3', x: 150, y: 750, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back by enemies.", bonus: "Immunity to Knockback", unlocked: false, req: 'str2' },
        { id: 'str4', x: 300, y: 950, name: "Blood Pact", type: "Passive", desc: "Heal for 5% of damage dealt.", bonus: "+5% Lifesteal", unlocked: false, req: 'str3' },
        
        // Agility Branch (Right)
        { id: 'dex1', x: 1050, y: 350, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", bonus: "+5% Move Speed", unlocked: true, req: 'root' },
        { id: 'dex2', x: 1250, y: 550, name: "Evasion", type: "Passive", desc: "Chance to dodge incoming attacks.", bonus: "10% Dodge Chance", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 1450, y: 750, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", bonus: "3x Damage (Back)", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1200, y: 950, name: "Dual Wield", type: "Passive", desc: "Unlock ability to hold two weapons.", bonus: "Allows 2 Weapons", unlocked: false, req: 'dex2' },

        // Magic Branch (Center/Bottom)
        { id: 'int1', x: 800, y: 550, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", bonus: "+10% Mana Regen", unlocked: false, req: 'root' },
        { id: 'int2', x: 600, y: 750, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", bonus: "Cost: 50 Mana", unlocked: false, req: 'int1' },
        { id: 'int3', x: 1000, y: 750, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", bonus: "Stun: 1.5s", unlocked: false, req: 'int1' },
        
        // Ultimate (Bottom Center)
        { id: 'hybrid', x: 800, y: 1100, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows instantly.", bonus: "Cooldown: 45s", unlocked: false, req: 'int3' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z", // Star
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z", // Bolt
        ultimate: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z", // Magic Orb
        origin: "M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z" // Layers
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttBonus = document.getElementById('tt-bonus');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        // Center the world initially
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const ww = 1600;
        const wh = 1400;
        
        // Initial center
        const initialX = cw/2 - ww/2;
        const initialY = ch/2 - wh/2;
        world.style.transform = `translate(${initialX}px, ${initialY}px)`;
        
        // Update global pan variables for zoom logic
        window.panX = initialX;
        window.panY = initialY;

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Determine Icon
            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.type === 'Origin') iconPath = icons.origin;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawLines();
    }

    function drawLines() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    } else if (parent.unlocked) {
                        line.classList.add('available');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        ttBonus.textContent = skill.bonus || '';
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
            ttBonus.style.display = 'block';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
            ttBonus.style.display = 'none';
        }

        tooltip.classList.add('visible');
        
        // Positioning logic to keep tooltip on screen
        const x = e.clientX;
        const y = e.clientY;
        const ttWidth = 320;
        const ttHeight = 150;
        
        let finalX = x + 20;
        let finalY = y - 20;

        if (finalX + ttWidth > window.innerWidth) {
            finalX = x - ttWidth - 20;
        }
        if (finalY + ttHeight > window.innerHeight) {
            finalY = window.innerHeight - ttHeight - 20;
        }

        tooltip.style.left = `${finalX}px`;
        tooltip.style.top = `${finalY}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        if (skill.unlocked) return; // Already unlocked

        // Simple logic: check if parent is unlocked
        if (skill.req) {
            const parent = skills.find(s => s.id === skill.req);
            if (!parent || !parent.unlocked) return;
        }

        // Mock unlocking
        skill.unlocked = true;
        updateVisuals();
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            
            // Reset classes
            el.classList.remove('unlocked', 'available', 'locked');
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                // Check availability
                if (!s.req) {
                    el.classList.add('available'); // Root is always available
                } else {
                    const parent = skills.find(sk => sk.id === s.req);
                    if (parent && parent.unlocked) {
                        el.classList.add('available');
                    } else {
                        el.classList.add('locked');
                    }
                }
            }
        });
        
        drawLines();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0;
    let panY = 0;
    let scale = 1;

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        // Zoom towards mouse pointer
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    // Handle Resize
    window.addEventListener('resize', () => {
        // Re-center if needed, or just let it be
    });

    init();

</script>
</body>
</html>
