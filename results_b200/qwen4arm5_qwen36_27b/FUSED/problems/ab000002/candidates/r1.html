<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archon's Ascension</title>
<style>
    :root {
        /* Palette: Deep Void & Molten Gold */
        --bg-deep: #05070a;
        --bg-panel: rgba(12, 15, 22, 0.85);
        --bg-panel-border: rgba(255, 255, 255, 0.08);
        
        --gold-primary: #fbbf24;
        --gold-dim: #78350f;
        --gold-glow: rgba(251, 191, 36, 0.6);
        
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --text-dark: #0f172a;
        
        --node-bg: #1e293b;
        --node-stroke: #334155;
        
        --font-display: 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        /* Complex Background: Gradient + Subtle Noise Texture */
        background-image: 
            radial-gradient(circle at 50% 30%, #111827 0%, var(--bg-deep) 70%),
            url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Header --- */
    header {
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 20;
        background: linear-gradient(180deg, rgba(5,7,10,0.9) 0%, transparent 100%);
    }

    .title-wrapper {
        text-align: center;
        position: relative;
        padding-bottom: 15px;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 2.2rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 4px 12px rgba(0,0,0,0.8);
        background: linear-gradient(to bottom, #fff, #cbd5e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .subtitle {
        font-size: 0.75rem;
        color: var(--gold-primary);
        letter-spacing: 0.4em;
        margin-top: 5px;
        text-transform: uppercase;
        text-shadow: 0 0 10px var(--gold-glow);
    }

    /* Decorative lines */
    .title-wrapper::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
    }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
    }

    /* --- Sidebar --- */
    aside {
        width: 300px;
        background: var(--bg-panel);
        border-right: 1px solid var(--bg-panel-border);
        backdrop-filter: blur(12px);
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 35px;
        z-index: 10;
        box-shadow: 10px 0 40px rgba(0,0,0,0.6);
    }

    /* Character Card */
    .char-card {
        display: flex;
        flex-direction: column;
        gap: 5px;
        border-bottom: 1px solid var(--bg-panel-border);
        padding-bottom: 20px;
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.4rem;
        color: var(--text-main);
    }

    .char-class {
        color: var(--gold-primary);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    /* Level & XP */
    .level-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .level-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
    }

    .level-big {
        font-family: var(--font-display);
        font-size: 3.5rem;
        line-height: 0.8;
        color: var(--text-main);
        font-weight: bold;
    }

    .level-label {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 5px;
    }

    .xp-bar-track {
        width: 100%;
        height: 6px;
        background: #0f172a;
        border-radius: 3px;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
    }

    .xp-bar-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--gold-dim), var(--gold-primary));
        box-shadow: 0 0 10px var(--gold-glow);
        position: relative;
    }

    /* Animated Shimmer on XP bar */
    .xp-bar-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        transform: translateX(-100%);
        animation: shimmer 3s infinite;
    }

    /* Skill Points */
    .points-card {
        background: rgba(251, 191, 36, 0.05);
        border: 1px solid rgba(251, 191, 36, 0.2);
        border-radius: 8px;
        padding: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: transform 0.2s;
    }
    
    .points-card:hover {
        background: rgba(251, 191, 36, 0.08);
        transform: translateY(-2px);
    }

    .pts-icon {
        width: 24px;
        height: 24px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 5px var(--gold-glow));
    }

    .pts-info {
        text-align: right;
    }

    .pts-val {
        font-size: 1.5rem;
        font-family: var(--font-display);
        color: var(--gold-primary);
        display: block;
        line-height: 1;
    }

    .pts-label {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    /* Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .stat-item {
        background: rgba(0,0,0,0.2);
        padding: 8px 12px;
        border-radius: 4px;
        border: 1px solid transparent;
        transition: border-color 0.2s;
    }

    .stat-item:hover {
        border-color: var(--bg-panel-border);
    }

    .stat-name {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        display: block;
        margin-bottom: 2px;
    }

    .stat-val {
        font-size: 1.1rem;
        font-family: var(--font-display);
        color: var(--text-main);
    }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
    }

    .tree-container:active { cursor: grabbing; }

    /* Grid pattern for the background of the tree area */
    .tree-container::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        opacity: 0.5;
        pointer-events: none;
        z-index: 0;
    }

    .tree-world {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1400px;
        height: 1200px;
        transform-origin: center center;
        transition: transform 0.1s ease-out; /* Smoother pan */
    }

    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: visible;
    }

    /* Lines */
    .connection-line {
        stroke: #334155;
        stroke-width: 2;
        fill: none;
        transition: stroke 0.5s ease, filter 0.5s ease;
    }

    .connection-line.active {
        stroke: var(--gold-primary);
        stroke-width: 3;
        filter: drop-shadow(0 0 6px var(--gold-glow));
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        width: 70px;
        height: 70px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .node-shape {
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 30% 30%, #334155, #0f172a);
        border: 2px solid var(--node-stroke);
        border-radius: 50%; /* Hexagon via clip-path or circle */
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        transition: all 0.3s ease;
    }

    /* Hexagon Shape using clip-path for a more "RPG" feel */
    .node-shape {
        clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    }
    
    /* Outer glow ring for active nodes */
    .node-shape::before {
        content: '';
        position: absolute;
        inset: -2px;
        background: var(--node-stroke);
        clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
        z-index: -1;
        transition: background 0.3s;
    }

    .node-icon {
        width: 28px;
        height: 28px;
        fill: var(--text-muted);
        opacity: 0.4;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        transition: all 0.3s ease;
    }

    /* Unlocked State */
    .node.unlocked .node-shape {
        background: radial-gradient(circle at 30% 30%, #f59e0b, #78350f);
        border-color: #fff;
        box-shadow: 0 0 20px var(--gold-glow);
    }
    
    .node.unlocked .node-shape::before {
        background: var(--gold-primary);
    }

    .node.unlocked .node-icon {
        fill: #fff;
        opacity: 1;
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.8));
    }

    /* Available State (Parent unlocked, self locked) */
    .node.available .node-shape {
        background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
        border-color: #94a3b8;
    }
    
    .node.available .node-icon {
        opacity: 0.7;
        fill: #e2e8f0;
    }

    .node.available:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }

    .node.available:hover .node-shape {
        box-shadow: 0 0 15px rgba(148, 163, 184, 0.4);
        border-color: #fff;
    }

    /* Locked State */
    .node.locked {
        opacity: 0.6;
        cursor: not-allowed;
    }
    
    .node.locked:hover {
        transform: none;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid var(--gold-primary);
        padding: 20px;
        width: 300px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        backdrop-filter: blur(8px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 10px;
    }

    .tooltip h3 {
        color: var(--gold-primary);
        font-family: var(--font-display);
        font-size: 1.2rem;
        margin: 0;
        text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
    }

    .tooltip .type-badge {
        font-size: 0.6rem;
        text-transform: uppercase;
        padding: 2px 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        color: var(--text-muted);
        letter-spacing: 0.1em;
    }

    .tooltip p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #cbd5e1;
        margin-bottom: 15px;
    }

    .tooltip .req {
        font-size: 0.75rem;
        color: #ef4444;
        display: none;
        margin-top: 5px;
        font-style: italic;
    }
    
    .tooltip .stat-bonus {
        color: #4ade80;
        font-size: 0.8rem;
        font-weight: bold;
        margin-top: 5px;
        display: block;
    }

    .tooltip.locked h3 { color: var(--text-muted); text-shadow: none; }
    .tooltip.locked { border-color: var(--node-stroke); }
    .tooltip.locked .req { display: block; }

    @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

</style>
</head>
<body>

    <header>
        <div class="title-wrapper">
            <h1>Archon's Ascension</h1>
            <div class="subtitle">Void Walker</div>
        </div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="char-card">
                <h2 class="char-name">Kaelen Thorne</h2>
                <div class="char-class">Duelist / Arcanist</div>
            </div>

            <div class="level-section">
                <div class="level-row">
                    <div>
                        <div class="level-label">Level</div>
                        <div class="level-big">42</div>
                    </div>
                </div>
                <div class="xp-bar-track">
                    <div class="xp-bar-fill"></div>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:0.7rem; color:var(--text-muted); margin-top:5px;">
                    <span>XP Progress</span>
                    <span>12,450 / 20,000</span>
                </div>
            </div>

            <div class="points-card">
                <svg class="pts-icon" viewBox="0 0 24 24">
                    <path d="M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z" />
                </svg>
                <div class="pts-info">
                    <span class="pts-val">3</span>
                    <span class="pts-label">Points Available</span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-item"><span class="stat-name">Strength</span><span class="stat-val">14</span></div>
                <div class="stat-item"><span class="stat-name">Dexterity</span><span class="stat-val">28</span></div>
                <div class="stat-item"><span class="stat-name">Intelligence</span><span class="stat-val">35</span></div>
                <div class="stat-item"><span class="stat-name">Vitality</span><span class="stat-val">12</span></div>
            </div>
        </aside>

        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <svg class="connections" id="svgConnections"></svg>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <div class="tooltip-header">
            <h3 id="tt-title">Skill Name</h3>
            <span class="type-badge" id="tt-type">Passive</span>
        </div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <span class="stat-bonus" id="tt-bonus"></span>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data ---
    const skills = [
        { id: 'root', x: 700, y: 100, name: "Archon's Spark", type: "Origin", desc: "The genesis of your power. Increases all damage by 5%.", bonus: "+5% Total Damage", unlocked: true, req: null },
        
        // Strength Branch (Left)
        { id: 'str1', x: 500, y: 250, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", bonus: "+4 Strength", unlocked: true, req: 'root' },
        { id: 'str2', x: 350, y: 400, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", bonus: "Cooldown: 10s", unlocked: true, req: 'str1' },
        { id: 'str3', x: 200, y: 550, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back by enemies.", bonus: "Immunity to Knockback", unlocked: false, req: 'str2' },
        
        // Agility Branch (Right)
        { id: 'dex1', x: 900, y: 250, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", bonus: "+5% Move Speed", unlocked: true, req: 'root' },
        { id: 'dex2', x: 1050, y: 400, name: "Evasion", type: "Passive", desc: "Chance to dodge incoming attacks.", bonus: "10% Dodge Chance", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 1200, y: 550, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", bonus: "3x Damage (Back)", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1000, y: 550, name: "Dual Wield", type: "Passive", desc: "Unlock ability to hold two weapons.", bonus: "Allows 2 Weapons", unlocked: false, req: 'dex2' },

        // Magic Branch (Center/Bottom)
        { id: 'int1', x: 700, y: 350, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", bonus: "+10% Mana Regen", unlocked: false, req: 'root' },
        { id: 'int2', x: 550, y: 500, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", bonus: "Cost: 50 Mana", unlocked: false, req: 'int1' },
        { id: 'int3', x: 850, y: 500, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", bonus: "Stun: 1.5s", unlocked: false, req: 'int1' },
        
        // Ultimate (Bottom Center)
        { id: 'hybrid', x: 700, y: 700, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows instantly.", bonus: "Cooldown: 45s", unlocked: false, req: 'dex3' },
        { id: 'hybrid2', x: 400, y: 700, name: "Blood Pact", type: "Passive", desc: "Heal for 5% of damage dealt.", bonus: "+5% Lifesteal", unlocked: false, req: 'str3' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z", // Star
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z", // Bolt
        ultimate: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z", // Magic Orb
        origin: "M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z" // Layers
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttBonus = document.getElementById('tt-bonus');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        // Center the world initially
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const ww = 1400;
        const wh = 1200;
        
        // Initial center
        world.style.transform = `translate(${cw/2 - ww/2}px, ${ch/2 - wh/2}px)`;

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Determine Icon
            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.type === 'Origin') iconPath = icons.origin;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawLines();
    }

    function drawLines() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        ttBonus.textContent = skill.bonus || '';
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
            ttBonus.style.display = 'block';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
            ttBonus.style.display = 'none';
        }

        tooltip.classList.add('visible');
        
        // Positioning logic to keep tooltip on screen
        const x = e.clientX;
        const y = e.clientY;
        const ttWidth = 300;
        const ttHeight = 150;
        
        let finalX = x + 20;
        let finalY = y - 20;

        if (finalX + ttWidth > window.innerWidth) {
            finalX = x - ttWidth - 20;
        }
        if (finalY + ttHeight > window.innerHeight) {
            finalY = window.innerHeight - ttHeight - 20;
        }

        tooltip.style.left = `${finalX}px`;
        tooltip.style.top = `${finalY}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        if (skill.unlocked) return; // Already unlocked

        // Simple logic: check if parent is unlocked
        if (skill.req) {
            const parent = skills.find(s => s.id === skill.req);
            if (!parent || !parent.unlocked) return;
        }

        // Mock unlocking
        skill.unlocked = true;
        updateVisuals();
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            
            // Reset classes
            el.classList.remove('unlocked', 'available', 'locked');
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                // Check availability
                if (!s.req) {
                    el.classList.add('available'); // Root is always available
                } else {
                    const parent = skills.find(sk => sk.id === s.req);
                    if (parent && parent.unlocked) {
                        el.classList.add('available');
                    } else {
                        el.classList.add('locked');
                    }
                }
            }
        });
        
        drawLines();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = container.clientWidth/2 - 700;
    let panY = container.clientHeight/2 - 600;
    let scale = 1;

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        // Zoom towards mouse pointer
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    init();

</script>
</body>
</html>
