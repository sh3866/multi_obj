<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archon's Ascension</title>
<style>
    :root {
        /* Palette: Void & Molten Gold */
        --bg-deep: #020408;
        --bg-panel: #0a0f18;
        --bg-panel-glass: rgba(10, 15, 24, 0.85);
        --border-dim: #1e293b;
        --border-light: #334155;
        
        --gold-primary: #fbbf24;
        --gold-secondary: #d97706;
        --gold-glow: rgba(251, 191, 36, 0.5);
        --gold-glow-intense: rgba(251, 191, 36, 0.9);
        
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-dark: #0f172a;
        
        --node-size: 70px;
        
        /* Typography */
        --font-header: 'Cinzel', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
        --font-body: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --font-mono: 'Consolas', 'Monaco', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Texture Overlay --- */
    body::after {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 999;
    }

    /* --- Layout Structure --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
    }

    /* --- Sidebar: Collapsed & Grouped --- */
    aside {
        width: 320px; /* Narrower */
        background: linear-gradient(180deg, #0f172a 0%, #020408 100%);
        border-right: 1px solid var(--border-dim);
        display: flex;
        flex-direction: column;
        z-index: 50;
        box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        position: relative;
        transition: width 0.3s ease;
    }

    /* Header inside Sidebar */
    .sidebar-header {
        padding: 20px;
        border-bottom: 1px solid var(--border-dim);
        background: rgba(0,0,0,0.2);
    }

    .brand-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 15px;
    }

    .brand-icon {
        width: 28px;
        height: 28px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 5px var(--gold-glow));
    }

    h1 {
        font-family: var(--font-header);
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background: linear-gradient(180deg, #fff 0%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    /* Zone 1: Identity & Progression */
    .zone-identity {
        padding: 25px 20px;
        border-bottom: 1px solid var(--border-dim);
        background: radial-gradient(circle at top right, rgba(251, 191, 36, 0.05), transparent 40%);
    }

    .profile-row {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
    }

    .avatar-wrapper {
        width: 64px;
        height: 64px;
        position: relative;
        flex-shrink: 0;
    }

    .avatar-frame {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid var(--gold-secondary);
        padding: 3px;
        background: #000;
        box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
    }

    .avatar-inner {
        width: 100%;
        height: 100%;
        background: #0f172a;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--gold-primary);
    }

    .char-info h2 {
        font-family: var(--font-header);
        font-size: 1.2rem;
        margin-bottom: 4px;
        color: var(--text-main);
    }

    .char-class {
        font-size: 0.75rem;
        color: var(--gold-primary);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-family: var(--font-mono);
    }

    /* Level & XP Compact */
    .progression-block {
        margin-top: 10px;
    }

    .level-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
    }

    .level-badge {
        font-family: var(--font-header);
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1;
    }
    
    .level-label {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
    }

    .xp-track {
        height: 6px;
        background: #1e293b;
        border-radius: 3px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
    }

    .xp-fill {
        height: 100%;
        width: 68%;
        background: linear-gradient(90deg, var(--gold-secondary), var(--gold-primary));
        box-shadow: 0 0 10px var(--gold-glow);
    }

    .xp-text {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-align: right;
        margin-top: 4px;
        font-family: var(--font-mono);
    }

    /* Skill Points: Balanced */
    .sp-container {
        margin-top: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(255,255,255,0.03);
        padding: 12px;
        border-radius: 6px;
        border: 1px solid var(--border-dim);
    }

    .sp-label {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .sp-val {
        font-family: var(--font-header);
        font-size: 1.8rem;
        color: var(--gold-primary);
        line-height: 1;
        text-shadow: 0 0 10px var(--gold-glow);
    }

    /* Zone 2: Attributes (Elevated) */
    .zone-attributes {
        padding: 25px 20px;
        flex: 1;
        overflow-y: auto;
    }

    .section-title {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border-dim);
        padding-bottom: 8px;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr); /* 2 Columns */
        gap: 15px;
    }

    .stat-card {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(15, 23, 42, 0.5);
        padding: 12px;
        border-radius: 8px;
        border: 1px solid transparent;
        transition: all 0.2s;
        cursor: default;
    }

    .stat-card:hover {
        background: rgba(30, 41, 59, 0.8);
        border-color: var(--border-dim);
        transform: translateY(-2px);
    }

    .stat-icon-wrapper {
        width: 40px;
        height: 40px;
        background: #020408;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border-dim);
        box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .stat-icon {
        width: 20px;
        height: 20px;
        fill: var(--text-muted);
        transition: fill 0.2s;
    }

    .stat-card:hover .stat-icon {
        fill: var(--gold-primary);
    }

    .stat-info {
        display: flex;
        flex-direction: column;
    }

    .stat-name {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.05em;
        margin-bottom: 2px;
    }

    .stat-val {
        font-family: var(--font-header);
        font-size: 1.1rem;
        color: var(--text-main);
        font-weight: 700;
    }

    /* --- Tree Area (Expanded) --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(ellipse at center, #161b28 0%, #05070a 60%, #000000 100%);
    }
    
    .tree-container:active { cursor: grabbing; }

    /* Texture: Faint Grid */
    .tree-container::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: 
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none;
        z-index: 0;
        mask-image: radial-gradient(circle, black 20%, transparent 70%);
    }

    .tree-world {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 2400px;
        height: 1600px;
        transform-origin: center center;
        transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    svg.connections {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: visible;
    }

    /* Connections */
    .connection-line {
        stroke: #1e293b;
        stroke-width: 4;
        fill: none;
        stroke-linecap: round;
        transition: stroke 0.5s, filter 0.5s;
    }

    .connection-line.active {
        stroke: var(--gold-primary);
        filter: drop-shadow(0 0 5px var(--gold-glow));
        stroke-width: 4;
    }

    .connection-line.available {
        stroke: #475569;
        stroke-dasharray: 8, 8;
        animation: dash-flow 15s linear infinite;
    }
    
    @keyframes dash-flow {
        to { stroke-dashoffset: -1000; }
    }

    /* Nodes: Refined Hexagons */
    .node {
        position: absolute;
        width: var(--node-size);
        height: calc(var(--node-size) * 1.15);
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .node:hover {
        transform: translate(-50%, -50%) scale(1.2);
        z-index: 10;
    }

    .node-shape {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Hexagon Clip Path */
    .node-shape::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--bg-panel);
        clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
        transition: background 0.3s, box-shadow 0.3s;
        box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    }

    /* Inner Bevel */
    .node-shape::after {
        content: '';
        position: absolute;
        inset: 2px;
        border: 2px solid var(--border-dim);
        clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
        transition: border-color 0.3s, box-shadow 0.3s;
        pointer-events: none;
    }

    .node-icon {
        width: 32px;
        height: 32px;
        fill: var(--text-muted);
        opacity: 0.5;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        transition: all 0.3s;
        z-index: 2;
    }

    /* States */
    .node.unlocked .node-shape::before {
        background: radial-gradient(circle at 30% 30%, #fcd34d, #b45309);
    }
    
    .node.unlocked .node-shape::after {
        border-color: #fff;
        box-shadow: 0 0 15px var(--gold-glow-intense), inset 0 0 5px var(--gold-glow);
    }

    .node.unlocked .node-icon {
        fill: #fff;
        opacity: 1;
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.8));
    }

    .node.available .node-shape::before {
        background: #1e293b;
    }
    
    .node.available .node-shape::after {
        border-color: #94a3b8;
    }

    .node.available .node-icon {
        opacity: 0.9;
        fill: #e2e8f0;
    }

    .node.available:hover .node-shape::after {
        border-color: var(--gold-primary);
        box-shadow: 0 0 10px var(--gold-glow);
    }
    
    .node.locked {
        opacity: 0.4;
        filter: grayscale(1);
        cursor: not-allowed;
    }
    
    .node.locked:hover { transform: translate(-50%, -50%) scale(1); }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid var(--border-light);
        padding: 0;
        width: 300px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(5px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8);
        border-left: 3px solid var(--text-muted);
        backdrop-filter: blur(8px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip-header {
        padding: 15px;
        background: linear-gradient(90deg, rgba(255,255,255,0.05), transparent);
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .tooltip h3 {
        color: var(--text-main);
        font-family: var(--font-header);
        font-size: 1.1rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 0;
    }

    .tooltip .type-badge {
        font-size: 0.6rem;
        text-transform: uppercase;
        padding: 3px 6px;
        background: var(--border-dim);
        color: var(--text-muted);
        border-radius: 2px;
        font-weight: 700;
    }

    .tooltip-body {
        padding: 15px;
    }

    .tooltip p {
        font-size: 0.85rem;
        line-height: 1.5;
        color: #cbd5e1;
        margin-bottom: 12px;
    }

    .tooltip .stat-bonus {
        color: #4ade80;
        font-size: 0.8rem;
        font-weight: 600;
        display: block;
        font-family: var(--font-mono);
        background: rgba(74, 222, 128, 0.1);
        padding: 6px 8px;
        border-radius: 4px;
        border: 1px solid rgba(74, 222, 128, 0.2);
    }

    .tooltip .req {
        font-size: 0.8rem;
        color: #ef4444;
        display: none;
        margin-top: 8px;
        background: rgba(239, 68, 68, 0.1);
        padding: 6px 8px;
        border-radius: 4px;
        border: 1px solid rgba(239, 68, 68, 0.2);
    }
    
    .tooltip.locked { border-left-color: #ef4444; }
    .tooltip.locked .req { display: block; }

    .unlock-hint {
        display: block;
        text-align: right;
        font-size: 0.7rem;
        color: var(--gold-primary);
        margin-top: 10px;
        font-family: var(--font-mono);
        text-transform: uppercase;
        border-top: 1px solid rgba(255,255,255,0.1);
        padding-top: 8px;
    }

</style>
</head>

            <span class="stat-bonus" id="tt-bonus"></span>
            <div class="req" id="tt-req">Requires: [Previous Skill]</div>
            <span class="unlock-hint" id="tt-action">Click to Unlock</span>
        </div>
    </div>

<script>
    // --- Data Structure ---
    const skills = [
        // Origin
        { id: 'root', x: 1200, y: 200, name: "Archon's Spark", type: "Origin", desc: "The genesis of your power. Unlocks the skill tree.", bonus: "+5% Total Damage", unlocked: true, req: null },
        
        // Tier 1 - The Trinity
        { id: 'str1', x: 700, y: 450, name: "Titan's Grip", type: "Passive", desc: "Grip weapons with crushing force.", bonus: "+4 Strength", unlocked: true, req: 'root' },
        { id: 'dex1', x: 1700, y: 450, name: "Swift Foot", type: "Passive", desc: "Movement is fluid and precise.", bonus: "+5% Move Speed", unlocked: true, req: 'root' },
        { id: 'int1', x: 1200, y: 550, name: "Arcane Mind", type: "Passive", desc: "Channel the void energies.", bonus: "+10% Mana Regen", unlocked: true, req: 'root' },

        // Tier 2 - Branching Out
        { id: 'str2', x: 450, y: 750, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", bonus: "Cooldown: 10s", unlocked: true, req: 'str1' },
        { id: 'str1b', x: 950, y: 700, name: "Iron Skin", type: "Passive", desc: "Callous your skin to resist physical blows.", bonus: "+15% Phys Resist", unlocked: true, req: 'str1' },
        
        { id: 'dex2', x: 1950, y: 750, name: "Evasion", type: "Passive", desc: "Dodge incoming attacks effortlessly.", bonus: "10% Dodge Chance", unlocked: true, req: 'dex1' },
        { id: 'dex1b', x: 1450, y: 700, name: "Critical Focus", type: "Passive", desc: "Heightened senses allow for precision strikes.", bonus: "+8% Crit Chance", unlocked: true, req: 'dex1' },

        { id: 'int2', x: 950, y: 950, name: "Fireball", type: "Active", desc: "Launch a projectile of condensed fire.", bonus: "Cost: 50 Mana", unlocked: false, req: 'int1' },
        { id: 'int3', x: 1450, y: 950, name: "Frost Nova", type: "Active", desc: "Freeze enemies in a radius.", bonus: "Stun: 1.5s", unlocked: false, req: 'int1' },

        // Tier 3 - Deep Specialization
        { id: 'str3', x: 250, y: 1050, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back by any force.", bonus: "Knockback Immunity", unlocked: false, req: 'str2' },
        { id: 'str2b', x: 650, y: 1050, name: "Berserker Rage", type: "Active", desc: "Enter a bloodlust state.", bonus: "+20% DMG, -20% DEF", unlocked: false, req: 'str2' },
        
        { id: 'dex3', x: 2150, y: 1050, name: "Backstab", type: "Active", desc: "Deals massive damage from behind.", bonus: "3x Damage (Back)", unlocked: false, req: 'dex2' },
        { id: 'dex2b', x: 1750, y: 1050, name: "Blinding Speed", type: "Passive", desc: "You move faster than the eye can see.", bonus: "+15% Attack Speed", unlocked: false, req: 'dex2' },

        { id: 'int4', x: 1100, y: 1250, name: "Meteor Swarm", type: "Ultimate", desc: "Call down meteors from the sky.", bonus: "Cost: 200 Mana", unlocked: false, req: 'int2' },
        { id: 'int5', x: 1300, y: 1250, name: "Ice Age", type: "Ultimate", desc: "Freeze the entire battlefield.", bonus: "Stun: 5s", unlocked: false, req: 'int3' },

        // Tier 4 - Convergence
        { id: 'hybrid', x: 1200, y: 1500, name: "Void Walker", type: "Legendary", desc: "Teleport through shadows instantly.", bonus: "Cooldown: 45s", unlocked: false, req: 'int4' }
    ];

    // --- Icons ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z",
        origin: "M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z",
        legendary: "M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"
    };

    // --- DOM ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttBonus = document.getElementById('tt-bonus');
    const ttReq = document.getElementById('tt-req');
    const ttAction = document.getElementById('tt-action');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Initial Center
        window.panX = cw/2 - 1200;
        window.panY = ch/2 - 700;
        
        world.style.transform = `translate(${window.panX}px, ${window.panY}px) scale(1)`;
        
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.type === 'Origin') iconPath = icons.origin;
            if(skill.type === 'Legendary') iconPath = icons.legendary;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleSkill(skill.id);
            });

            world.appendChild(node);
        });

        drawLines();
    }

    function drawLines() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    } else if (parent.unlocked) {
                        line.classList.add('available');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        ttBonus.textContent = skill.bonus || '';
        
        const canUnlock = !skill.unlocked && checkPrereq(skill);

        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
            ttBonus.style.display = 'block';
            ttAction.style.display = 'none';
        } else {
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            
            if (canUnlock) {
                tooltip.classList.remove('locked');
                ttReq.style.color = 'var(--text-muted)';
                ttReq.style.display = 'block';
                ttBonus.style.display = 'block';
                ttAction.style.display = 'block';
            } else {
                tooltip.classList.add('locked');
                ttReq.style.color = '#ef4444';
                ttReq.style.display = 'block';
                ttBonus.style.display = 'none';
                ttAction.style.display = 'none';
            }
        }

        tooltip.classList.add('visible');
        positionTooltip(e.clientX, e.clientY);
    }

    function positionTooltip(x, y) {
        const ttWidth = 300;
        const ttHeight = 250;
        
        let finalX = x + 20;
        let finalY = y - 20;

        if (finalX + ttWidth > window.innerWidth) finalX = x - ttWidth - 20;
        if (finalY + ttHeight > window.innerHeight) finalY = window.innerHeight - ttHeight - 20;

        tooltip.style.left = `${finalX}px`;
        tooltip.style.top = `${finalY}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function checkPrereq(skill) {
        if (!skill.req) return true;
        const parent = skills.find(s => s.id === skill.req);
        return parent && parent.unlocked;
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        if (skill.unlocked) return;
        if (!checkPrereq(skill)) return;

        skill.unlocked = true;
        updateVisuals();
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            el.classList.remove('unlocked', 'available', 'locked');
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else if (checkPrereq(s)) {
                el.classList.add('available');
            } else {
                el.classList.add('locked');
            }
        });
        drawLines();
    }

    // --- Pan & Zoom ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let scale = 1;

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - window.panX;
        startY = e.clientY - window.panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        window.panX = e.clientX - startX;
        window.panY = e.clientY - startY;
        world.style.transform = `translate(${window.panX}px, ${window.panY}px) scale(${scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        window.panX -= mouseX * scaleChange;
        window.panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${window.panX}px, ${window.panY}px) scale(${scale})`;
    });

    init();
</script>
</body>
</html>
