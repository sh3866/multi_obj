<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE // NEON RHYTHM EDITION</title>
    <style>
        :root {
            --c-bg-deep: #050014;
            --c-bg-mid: #120024;
            --c-purple: #d300ff;
            --c-pink: #ff0055;
            --c-cyan: #00f3ff;
            --c-yellow: #ffee00;
            --c-white: #ffffff;
            
            --font-main: 'Courier New', Courier, monospace;
            
            --glow-text-cyan: 0 0 10px rgba(0, 243, 255, 0.8), 0 0 20px rgba(0, 243, 255, 0.4);
            --glow-text-pink: 0 0 10px rgba(255, 0, 85, 0.8), 0 0 20px rgba(255, 0, 85, 0.4);
            
            --lane-1: var(--c-cyan);
            --lane-2: var(--c-purple);
            --lane-3: var(--c-pink);
            --lane-4: var(--c-yellow);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--c-bg-deep);
            color: var(--c-white);
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            /* Reset flex to absolute for precise layering */
            display: block; 
        }

        /* --- LAYERS --- */
        
        /* 1. Background Canvas */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 2. The Highway (Bottom Half) */
        .highway-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65vh; /* Occupy bottom half */
            z-index: 10;
            perspective: 600px;
            overflow: hidden;
            /* Mask to blend top smoothly */
            mask-image: linear-gradient(to top, black 20%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 20%, transparent 100%);
        }

        /* The 3D Plane */
        .highway-plane {
            position: absolute;
            top: -50%; /* Pull back to create depth */
            left: 50%;
            width: 200vw;
            height: 200vh;
            transform: translate(-50%, -20%) rotateX(65deg);
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
        }

        /* The Grid Floor */
        .grid-floor {
            position: absolute;
            width: 100%;
            height: 100%;
            /* Synthwave Grid */
            background-image: 
                linear-gradient(rgba(211, 0, 255, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(211, 0, 255, 0.3) 1px, transparent 1px);
            background-size: 80px 80px;
            background-position: center center;
            /* Infinite scroll effect */
            animation: gridMove 2s linear infinite;
            /* Fade out at the horizon */
            mask-image: linear-gradient(to top, black 0%, transparent 80%);
            -webkit-mask-image: linear-gradient(to top, black 0%, transparent 80%);
        }

        /* The 4 Lanes */
        .lanes-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            z-index: 12;
        }

        .lanes {
            display: flex;
            width: 400px; /* Fixed width for perspective */
            height: 100%;
            border-left: 2px solid rgba(255,255,255,0.1);
            border-right: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .lane {
            flex: 1;
            position: relative;
            border-right: 1px solid rgba(255,255,255,0.1);
            /* Lane specific gradients */
        }
        .lane:nth-child(1) { background: linear-gradient(to bottom, transparent 0%, rgba(0, 243, 255, 0.1) 100%); }
        .lane:nth-child(2) { background: linear-gradient(to bottom, transparent 0%, rgba(211, 0, 255, 0.1) 100%); }
        .lane:nth-child(3) { background: linear-gradient(to bottom, transparent 0%, rgba(255, 0, 85, 0.1) 100%); }
        .lane:nth-child(4) { background: linear-gradient(to bottom, transparent 0%, rgba(255, 238, 0, 0.1) 100%); border-right: none;}

        /* The Hit Line */
        .hit-line {
            position: absolute;
            bottom: 8%; /* Distance from bottom */
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 4px;
            background: var(--c-white);
            box-shadow: 0 0 15px var(--c-white), 0 0 30px var(--c-cyan);
            z-index: 20;
            /* Match perspective slightly? No, keep it 2D UI overlay for readability */
        }
        
        /* Hit Markers */
        .hit-marker {
            position: absolute;
            top: -10px;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.5);
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .hm-1 { left: 0; border-color: var(--c-cyan); box-shadow: 0 0 10px var(--c-cyan); }
        .hm-2 { left: 25%; border-color: var(--c-purple); box-shadow: 0 0 10px var(--c-purple); }
        .hm-3 { left: 50%; border-color: var(--c-pink); box-shadow: 0 0 10px var(--c-pink); }
        .hm-4 { left: 75%; border-color: var(--c-yellow); box-shadow: 0 0 10px var(--c-yellow); }

        /* 3. UI Layer (Top Half) */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Push content up to avoid sun overlap */
            padding-top: 5vh; 
        }

        /* Typography */
        .title-container {
            position: relative;
            text-align: center;
            margin-bottom: 10px;
            /* Breathing room */
            margin-top: 5vh;
        }

        .edition-tag {
            display: block;
            font-size: 0.9rem;
            letter-spacing: 8px;
            color: var(--c-yellow);
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 5px var(--c-yellow);
            opacity: 0.9;
        }

        h1 {
            font-size: 6rem;
            line-height: 0.85;
            text-transform: uppercase;
            font-weight: 900;
            /* Pixelated rendering */
            text-rendering: crisp-edges;
            position: relative;
            color: var(--c-white);
            /* Strong retro shadow */
            text-shadow: 5px 5px 0px var(--c-purple);
            /* Glitch animation */
            animation: glitch-skew 3s infinite linear alternate-reverse;
        }

        /* Glitch layers */
        h1::before, h1::after {
            content: "PIXEL\nDANCE";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            white-space: pre;
            opacity: 0.8;
        }
        h1::before {
            color: var(--c-cyan);
            z-index: -1;
            transform: translate(-3px, 0);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }
        h1::after {
            color: var(--c-pink);
            z-index: -2;
            transform: translate(3px, 0);
            clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        /* Buttons */
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            /* Position buttons lower, giving title room */
            margin-top: 40px;
            pointer-events: auto;
        }

        .btn {
            position: relative;
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: var(--font-main);
            text-transform: uppercase;
            transition: all 0.2s;
        }

        /* Pixel Art Button Shape (Cassette/Bracket style) */
        .btn-shape {
            display: block;
            padding: 15px 40px;
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--c-white);
            background: rgba(0,0,0,0.6);
            border: 4px solid var(--c-white);
            /* Pixel corners */
            clip-path: polygon(
                15px 0, 100% 0, 
                100% calc(100% - 15px), calc(100% - 15px) 100%, 
                0 100%, 0 15px
            );
            box-shadow: 0 0 15px var(--c-white);
            text-shadow: 2px 2px 0 #000;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        /* Start Button Specifics */
        .btn-start .btn-shape {
            border-color: var(--c-pink);
            color: var(--c-pink);
            background: rgba(255, 0, 85, 0.1);
            box-shadow: 0 0 20px var(--c-pink), inset 0 0 10px var(--c-pink);
        }
        
        .btn-start:hover .btn-shape {
            background: var(--c-pink);
            color: var(--c-white);
            box-shadow: 0 0 40px var(--c-pink);
            transform: scale(1.05);
        }

        /* Options Button Specifics */
        .btn-opt .btn-shape {
            border-color: var(--c-cyan);
            color: var(--c-cyan);
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 10px var(--c-cyan);
            font-size: 1.4rem;
            padding: 10px 30px;
        }

        .btn-opt:hover .btn-shape {
            background: var(--c-cyan);
            color: var(--c-bg-deep);
            box-shadow: 0 0 30px var(--c-cyan);
            transform: scale(1.05);
        }

        /* 4. CRT Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.2) 2px,
                rgba(0,0,0,0.2) 4px
            );
            background-size: 100% 4px;
        }
        
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 49;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.8) 100%);
        }

        /* Falling Notes */
        .note {
            position: absolute;
            width: 60px; /* Fits in lane */
            height: 20px;
            background-color: currentColor;
            border: 2px solid white;
            box-shadow: 0 0 10px currentColor;
            z-index: 15;
            /* Pixelated look */
            image-rendering: pixelated;
            /* Start way up top */
            top: -100px; 
            opacity: 0;
            animation: noteDrop 1.5s linear forwards;
        }
        .note::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.3);
            clip-path: polygon(0 0, 50% 0, 50% 50%, 0 50%);
        }

        /* Animations */
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 80px; }
        }

        @keyframes noteDrop {
            0% { top: -10%; opacity: 0; transform: scale(0.5); }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 110%; opacity: 0; transform: scale(1.2); }
        }

        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            20% { transform: skew(-2deg); }
            40% { transform: skew(2deg); }
            60% { transform: skew(0deg); }
            80% { transform: skew(5deg); }
            100% { transform: skew(0deg); }
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            40% { clip-path: inset(40% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(10% 0 70% 0); }
            100% { clip-path: inset(30% 0 20% 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); }
            20% { clip-path: inset(30% 0 10% 0); }
            40% { clip-path: inset(80% 0 5% 0); }
            60% { clip-path: inset(10% 0 80% 0); }
            80% { clip-path: inset(50% 0 30% 0); }
            100% { clip-path: inset(5% 0 40% 0); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 4rem; }
            .lanes { width: 300px; }
            .hit-line { width: 300px; }
            .btn-shape { padding: 12px 30px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- 1. Background Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- 2. Highway (The Perspective View) -->
    <div class="highway-container">
        <div class="highway-plane">
            <!-- The Grid Floor -->
            <div class="grid-floor"></div>
            
            <!-- The 4 Lanes -->
            <div class="lanes-wrapper">
                <div class="lanes">
                    <div class="lane"></div>
                    <div class="lane"></div>
                    <div class="lane"></div>
                    <div class="lane"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. Hit Line (Static Overlay) -->
    <div class="hit-line">
        <div class="hit-marker hm-1"></div>
        <div class="hit-marker hm-2"></div>
        <div class="hit-marker hm-3"></div>
        <div class="hit-marker hm-4"></div>
    </div>

    <!-- 4. UI Layer -->
    <div class="ui-layer">
        <div class="title-container">
            <span class="edition-tag">Neon Rhythm Edition</span>
            <h1>PIXEL<br>DANCE</h1>
        </div>

        <div class="menu-buttons">
            <button class="btn btn-start" id="btn-start">
                <span class="btn-shape">START GAME</span>
            </button>
            <button class="btn btn-opt" id="btn-opt">
                <span class="btn-shape">OPTIONS</span>
            </button>
        </div>
    </div>

    <!-- 5. Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        /**
         * ENGINE: Canvas Background & Note Logic
         */

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- BACKGROUND RENDERER ---
        function drawBackground(time) {
            // Clear
            ctx.clearRect(0, 0, width, height);

            // 1. Sky Gradient (Deep Purple to Black)
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#050014');
            grad.addColorStop(0.5, '#1a0033');
            grad.addColorStop(1, '#4a0066'); // Horizon glow
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. The Sun (Retro Striped)
            const sunY = height * 0.35; // Positioned high enough not to block title
            const sunR = Math.min(width, height) * 0.25;

            // Sun Glow
            ctx.shadowBlur = 50;
            ctx.shadowColor = '#ff0055';
            
            // Sun Gradient
            const sunGrad = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
            sunGrad.addColorStop(0, '#ffcc00');
            sunGrad.addColorStop(1, '#ff0055');

            ctx.beginPath();
            ctx.arc(width/2, sunY, sunR, 0, Math.PI * 2);
            ctx.fillStyle = sunGrad;
            ctx.fill();

            // Sun Stripes (The "Blinds")
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#1a0033'; // Matches sky to "cut" the sun
            // Draw horizontal rects over the bottom half of the sun
            for(let i = 0; i < 10; i++) {
                const y = sunY + (i * (sunR/5));
                const h = 4 + (i * 1.5); // Stripes get wider at bottom
                // Only draw if inside sun roughly
                if (y < sunY + sunR) {
                    ctx.fillRect(width/2 - sunR, y, sunR*2, h);
                }
            }

            // 3. Stars (Pixelated)
            ctx.fillStyle = '#ffffff';
            for(let i=0; i<100; i++) {
                // Deterministic pseudo-random
                const x = (Math.sin(i * 132.1) * 0.5 + 0.5) * width;
                const y = (Math.cos(i * 453.2) * 0.5 + 0.5) * (height * 0.6);
                const size = (Math.sin(time * 0.002 + i) + 1) / 2; // Twinkle
                
                if (size > 0.5) {
                    ctx.globalAlpha = size;
                    ctx.fillRect(Math.floor(x), Math.floor(y), 2, 2);
                }
            }
            ctx.globalAlpha = 1;
        }

        // --- NOTE SPAWNER ---
        const lanes = document.querySelectorAll('.lane');
        const noteColors = ['var(--c-cyan)', 'var(--c-purple)', 'var(--c-pink)', 'var(--c-yellow)'];
        
        // Helper to get computed color value
        function getComputedColor(varName) {
            return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
        }

        function spawnNote() {
            const note = document.createElement('div');
            note.className = 'note';
            
            // Random Lane
            const laneIndex = Math.floor(Math.random() * 4);
            const laneEl = lanes[laneIndex];
            
            // Position logic:
            // We need to append to the lane wrapper so it inherits the perspective transform
            // But the animation needs to look like it's falling "down" the screen.
            // Since the lane is rotated, we append to the lane, and animate Top.
            
            laneEl.appendChild(note);
            
            // Color
            const colorVal = getComputedColor('--lane-' + (laneIndex + 1));
            note.style.color = colorVal;
            
            // Random horizontal jitter for "pixel" feel
            const jitter = (Math.random() - 0.5) * 20;
            note.style.left = `calc(50% + ${jitter}px - 30px)`; // 30 is half width

            // Random duration
            const duration = 1.2 + Math.random() * 0.5;
            note.style.animationDuration = `${duration}s`;

            // Cleanup
            setTimeout(() => {
                if(note.parentNode) note.parentNode.removeChild(note);
            }, duration * 1000);
        }

        // --- MAIN LOOP ---
        let startTime = Date.now();
        
        function loop() {
            drawBackground(Date.now() - startTime);
            requestAnimationFrame(loop);
        }
        loop();

        // Spawner Loop
        function scheduleNote() {
            spawnNote();
            // Rhythm: Random interval between 200ms and 600ms
            setTimeout(scheduleNote, 200 + Math.random() * 400);
        }
        // Start spawner after a brief delay
        setTimeout(scheduleNote, 500);

        // --- INTERACTION ---
        const btnStart = document.getElementById('btn-start');
        const btnOpt = document.getElementById('btn-opt');

        btnStart.addEventListener('click', () => {
            btnStart.querySelector('.btn-shape').innerText = "LOADING...";
            btnStart.style.pointerEvents = 'none';
            
            // Flash effect
            document.body.style.backgroundColor = "#fff";
            setTimeout(() => {
                document.body.style.backgroundColor = ""; // revert to CSS
                alert("INITIATING SEQUENCE...");
                btnStart.querySelector('.btn-shape').innerText = "START GAME";
                btnStart.style.pointerEvents = 'auto';
            }, 100);
        });

        btnOpt.addEventListener('click', () => {
            alert("OPTIONS:\n\nSENSITIVITY: 80%\nSCROLL SPEED: FAST\nMUSIC VOLUME: 100%");
        });

    </script>
</body>
</html>
