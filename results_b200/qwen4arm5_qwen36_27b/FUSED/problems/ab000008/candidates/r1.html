<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --c-bg-dark: #050011;
            --c-bg-light: #1a0033;
            --c-pink: #ff00ff;
            --c-cyan: #00ffff;
            --c-yellow: #ffff00;
            --c-white: #ffffff;
            --c-sun-top: #ff00aa;
            --c-sun-bot: #ffcc00;
            --font-stack: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--c-bg-dark);
            color: var(--c-white);
            font-family: var(--font-stack);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- BACKGROUND CANVAS (Sun, Sky, Grid) --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- SCANLINES & VIGNETTE --- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            background: 
                /* Scanlines */
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                /* Vignette */
                radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.8) 100%);
            background-size: 100% 4px, 100% 100%;
        }

        /* --- MAIN UI CONTAINER --- */
        .ui-layer {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Let clicks pass through to buttons */
        }

        /* --- HERO HIGHWAY (Visual Anchor) --- */
        .highway-wrapper {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 60vh; /* Takes up bottom 60% */
            perspective: 800px;
            z-index: 2;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .highway {
            position: relative;
            width: 400px;
            height: 100%;
            background: linear-gradient(to top, #000 0%, rgba(20,0,40,0.8) 40%, transparent 100%);
            transform: rotateX(55deg);
            transform-origin: 50% 100%;
            border-left: 2px solid var(--c-pink);
            border-right: 2px solid var(--c-pink);
            box-shadow: 0 0 50px rgba(255, 0, 255, 0.2);
            display: flex;
        }

        /* The 4 Lanes */
        .lane {
            flex: 1;
            border-right: 1px solid rgba(0, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        .lane:first-child { border-left: 1px solid rgba(0, 255, 255, 0.3); }

        /* Moving Grid Lines inside Lanes */
        .lane::after {
            content: '';
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 200%;
            background-image: linear-gradient(to bottom, transparent 50%, rgba(0, 255, 255, 0.5) 50%);
            background-size: 100% 100px;
            animation: gridScroll 1s linear infinite;
        }

        /* Hit Line (The Target) */
        .hit-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: var(--c-white);
            box-shadow: 0 0 20px 5px var(--c-cyan);
            z-index: 10;
        }

        /* Notes (Falling) */
        .note {
            position: absolute;
            width: 80%;
            height: 30px;
            left: 10%;
            background: var(--c-yellow);
            border: 2px solid white;
            box-shadow: 0 0 15px var(--c-yellow);
            top: -50px;
            z-index: 5;
        }

        /* --- TITLE SECTION --- */
        .title-container {
            margin-top: 10vh; /* Push down slightly below sun */
            text-align: center;
            z-index: 20;
            position: relative;
            pointer-events: auto;
        }

        h1 {
            font-family: var(--font-stack);
            font-size: 6rem;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 0.85;
            letter-spacing: -4px;
            color: white;
            /* Chromatic Aberration - Refined */
            text-shadow: 
                4px 0px 0px rgba(255, 0, 255, 0.6),
                -4px 0px 0px rgba(0, 255, 255, 0.6),
                0 0 30px rgba(255, 255, 255, 0.5);
            /* Pixelated edges */
            transform: skewX(-5deg);
        }

        h1 span {
            display: block;
            font-size: 1.5rem;
            letter-spacing: 12px;
            color: var(--c-cyan);
            margin-top: 15px;
            text-shadow: 0 0 10px var(--c-cyan);
            transform: skewX(-5deg);
        }

        /* --- CONTROLS --- */
        .controls {
            margin-top: 40px;
            display: flex;
            gap: 30px;
            pointer-events: auto;
            z-index: 20;
        }

        .btn {
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid var(--c-white);
            color: var(--c-white);
            padding: 15px 40px;
            font-family: var(--font-stack);
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.15s ease;
            box-shadow: 5px 5px 0px var(--c-pink);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px var(--c-cyan);
            background: var(--c-white);
            color: var(--c-bg-dark);
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--c-pink);
        }

        .btn-start {
            border-color: var(--c-pink);
            color: var(--c-pink);
            box-shadow: 5px 5px 0px var(--c-white);
        }

        .btn-start:hover {
            background: var(--c-pink);
            color: var(--c-white);
            box-shadow: 7px 7px 0px var(--c-cyan);
        }

        /* --- ANIMATIONS --- */
        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }

        @keyframes noteFall {
            0% { top: -50px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            h1 { font-size: 4rem; }
            .highway { width: 100%; }
            .controls { flex-direction: column; width: 200px; }
            .btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- 1. Background Rendering (Canvas) -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- 2. CRT Scanline & Vignette Overlay -->
    <div class="overlay"></div>

    <!-- 3. Hero Highway (The Visual Anchor) -->
    <div class="highway-wrapper">
        <div class="highway" id="highway">
            <div class="lane" id="lane-0"></div>
            <div class="lane" id="lane-1"></div>
            <div class="lane" id="lane-2"></div>
            <div class="lane" id="lane-3"></div>
            <div class="hit-line"></div>
        </div>
    </div>

    <!-- 4. UI Layer -->
    <div class="ui-layer">
        <div class="title-container">
            <h1>PIXEL<br>DANCE<span>RHYTHM EDITION</span></h1>
        </div>

        <div class="controls">
            <button class="btn btn-start" onclick="startGame()">START GAME</button>
            <button class="btn" onclick="alert('Settings not implemented in demo')">OPTIONS</button>
        </div>
    </div>

    <script>
        /**
         * ENGINE
         * 1. Draws the Synthwave Sun, Sky, and Stars on Canvas
         * 2. Manages the DOM-based falling notes on the highway
         */

        // --- CONFIGURATION ---
        const CONFIG = {
            colors: {
                bgTop: '#050011',
                bgBot: '#2a004a',
                sunTop: '#ff00aa',
                sunBot: '#ffcc00',
                grid: '#ff00ff'
            },
            noteColors: ['#ff00ff', '#00ffff', '#ffff00', '#ff00ff'] // Matches lanes
        };

        // --- CANVAS RENDERER ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawSun(cx, cy, r) {
            // Create gradient
            const grad = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
            grad.addColorStop(0, CONFIG.colors.sunTop);
            grad.addColorStop(1, CONFIG.colors.sunBot);

            ctx.save();
            ctx.translate(cx, cy);
            
            // Glow
            ctx.shadowBlur = 50;
            ctx.shadowColor = CONFIG.colors.sunTop;

            // Draw Sun Circle
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            // Draw Stripes (The "Synthwave" cutouts)
            ctx.globalCompositeOperation = 'destination-out';
            ctx.shadowBlur = 0; // No glow for cutouts
            
            // Calculate stripe height based on position to create perspective
            const totalStripes = 12;
            for (let i = 0; i < totalStripes; i++) {
                // Exponential spacing for stripes to match perspective
                const yOffset = (i / totalStripes) * r;
                // Only draw stripes on the bottom half
                if (yOffset > 0) {
                    const h = 2 + (i * i * 0.15); // Get thicker at bottom
                    ctx.fillRect(-r, yOffset, r * 2, h);
                }
            }
            ctx.restore();
        }

        function drawStars() {
            ctx.fillStyle = 'white';
            ctx.globalAlpha = 1;
            // Simple pseudo-random stars
            for (let i = 0; i < 100; i++) {
                const x = (Math.sin(i * 132.1) * 0.5 + 0.5) * width;
                const y = (Math.cos(i * 453.2) * 0.5 + 0.5) * (height * 0.6); // Keep stars in upper 60%
                
                // Twinkle effect
                const twinkle = Math.abs(Math.sin(time * 0.05 + i));
                if (twinkle > 0.8) {
                    ctx.globalAlpha = twinkle;
                    ctx.fillRect(x, y, 2, 2);
                }
            }
            ctx.globalAlpha = 1;
        }

        function loop() {
            time++;
            ctx.clearRect(0, 0, width, height);

            // 1. Draw Sky Gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
            skyGrad.addColorStop(0, CONFIG.colors.bgTop);
            skyGrad.addColorStop(0.5, CONFIG.colors.bgBot);
            skyGrad.addColorStop(1, '#000000'); // Fade to black at bottom for highway integration
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, height);

            // 2. Draw Stars
            drawStars();

            // 3. Draw Sun
            // Position: Center X, slightly above middle Y
            drawSun(width / 2, height * 0.35, Math.min(width, height) * 0.25);

            requestAnimationFrame(loop);
        }

        // --- DOM NOTE SPAWNER ---
        const lanes = [
            document.getElementById('lane-0'),
            document.getElementById('lane-1'),
            document.getElementById('lane-2'),
            document.getElementById('lane-3')
        ];

        function spawnNote() {
            // Pick a random lane
            const laneIdx = Math.floor(Math.random() * lanes.length);
            const lane = lanes[laneIdx];

            const note = document.createElement('div');
            note.className = 'note';
            
            // Style
            const color = CONFIG.noteColors[laneIdx];
            note.style.backgroundColor = color;
            note.style.boxShadow = `0 0 15px ${color}`;
            note.style.borderColor = 'white';

            // Animation setup
            // Randomize duration slightly for variety (0.8s to 1.2s)
            const duration = 0.8 + Math.random() * 0.4;
            note.style.animation = `noteFall ${duration}s linear forwards`;

            lane.appendChild(note);

            // Cleanup after animation
            setTimeout(() => {
                if (note.parentNode) note.parentNode.removeChild(note);
            }, duration * 1000);
        }

        // --- GAME LOGIC ---
        function startGame() {
            // Visual feedback only for this demo
            const btn = document.querySelector('.btn-start');
            btn.innerHTML = "LOADING...";
            btn.style.backgroundColor = "var(--c-cyan)";
            
            setTimeout(() => {
                alert("Game Started! (Demo Ends Here)");
                btn.innerHTML = "START GAME";
                btn.style.backgroundColor = "";
            }, 500);
        }

        // Start loops
        loop();
        
        // Spawn notes periodically
        setInterval(() => {
            // Spawn 1 to 3 notes at a time randomly
            if(Math.random() > 0.3) spawnNote();
        }, 400); // Fast rhythm

    </script>
</body>
</html>
