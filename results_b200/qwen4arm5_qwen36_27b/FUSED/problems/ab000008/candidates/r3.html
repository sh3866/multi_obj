<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE // NEON RHYTHM</title>
    <style>
        :root {
            --c-bg-deep: #050014;
            --c-purple: #9d00ff;
            --c-pink: #ff0055;
            --c-cyan: #00f3ff;
            --c-yellow: #ffee00;
            --c-white: #ffffff;
            
            --font-pixel: 'Courier New', Courier, monospace;
            
            --glow-text: 0 0 10px rgba(255,255,255,0.8), 0 0 20px var(--c-cyan);
            --glow-box: 0 0 15px var(--c-pink), 0 0 30px var(--c-purple);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--c-bg-deep);
            color: var(--c-white);
            font-family: var(--font-pixel);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- VISUAL LAYERS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* CRT / Retro Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.2) 2px,
                rgba(0,0,0,0.2) 4px
            );
            background-size: 100% 4px;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 49;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 50%, rgba(5,0,20,0.8) 90%, #000 100%);
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
        }

        /* --- HIGHWAY (3D Perspective) --- */
        .highway-container {
            position: absolute;
            bottom: -20%; /* Push down to create depth */
            left: 0;
            width: 100%;
            height: 70vh;
            z-index: 10;
            perspective: 800px;
            overflow: hidden;
        }

        .highway-plane {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 200%; /* Make it wide so it fills screen when rotated */
            height: 100%;
            transform: translateX(-50%) rotateX(60deg);
            transform-style: preserve-3d;
            background: linear-gradient(to top, var(--c-bg-deep) 0%, rgba(157, 0, 255, 0.1) 100%);
            display: flex;
            justify-content: center;
        }

        /* The Grid */
        .grid-floor {
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--c-purple) 2px, transparent 2px),
                linear-gradient(90deg, var(--c-purple) 2px, transparent 2px);
            background-size: 100px 100px;
            background-position: center bottom;
            /* Fade out at horizon */
            mask-image: linear-gradient(to top, black 0%, transparent 80%);
            -webkit-mask-image: linear-gradient(to top, black 0%, transparent 80%);
            animation: gridScroll 1s linear infinite;
            opacity: 0.6;
            box-shadow: 0 0 50px var(--c-purple);
        }

        /* Lanes (Static vertical lines to give structure) */
        .lanes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            gap: 20px; /* Lane spacing */
            transform: skewX(0deg); /* Keep vertical straight */
            opacity: 0.8;
            z-index: 11;
            pointer-events: none;
        }

        .lane {
            width: 100px;
            height: 100%;
            border-left: 1px solid rgba(0, 243, 255, 0.3);
            border-right: 1px solid rgba(0, 243, 255, 0.3);
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 243, 255, 0.05) 100%);
        }

        /* The Hit Line (Where notes are hit) */
        .hit-zone {
            position: absolute;
            bottom: 15%; /* Positioned in "player" space */
            left: 50%;
            transform: translateX(-50%);
            width: 460px; /* 4 lanes * ~110px */
            height: 10px;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hit-bar {
            width: 100%;
            height: 4px;
            background: var(--c-white);
            box-shadow: 0 0 10px var(--c-white), 0 0 20px var(--c-cyan);
            border-radius: 2px;
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: relative;
            z-index: 30;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Let clicks pass through to buttons */
        }

        /* Title */
        .title-wrapper {
            margin-bottom: 80px;
            text-align: center;
            position: relative;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        h1 {
            font-size: 5rem;
            font-weight: 900;
            line-height: 0.85;
            text-transform: uppercase;
            color: var(--c-white);
            position: relative;
            /* Pixel Font Fallback styling */
            letter-spacing: -2px;
        }

        /* Title Glitch/Chromatic Effect */
        h1 .layer {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        h1 .l-base {
            color: var(--c-white);
            z-index: 2;
            text-shadow: 4px 4px 0px var(--c-purple);
        }

        h1 .l-cyan {
            color: var(--c-cyan);
            z-index: 1;
            transform: translate(-3px, -3px);
            opacity: 0.7;
        }

        h1 .l-pink {
            color: var(--c-pink);
            z-index: 1;
            transform: translate(3px, 3px);
            opacity: 0.7;
        }

        .subtitle {
            display: block;
            margin-top: 15px;
            font-size: 1.2rem;
            letter-spacing: 12px;
            color: var(--c-yellow);
            text-shadow: 0 0 10px var(--c-yellow);
            transform: skewX(-15deg);
            animation: flicker 4s infinite;
        }

        /* Menu Buttons */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto;
            width: 100%;
            align-items: center;
        }

        .btn {
            background: rgba(0,0,0,0.6);
            border: 2px solid var(--c-white);
            color: var(--c-white);
            padding: 15px 60px;
            font-family: var(--font-pixel);
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            /* Pixel Art Shape via clip-path */
            clip-path: polygon(
                15px 0, 100% 0, 
                100% calc(100% - 15px), calc(100% - 15px) 100%, 
                0 100%, 0 15px
            );
            min-width: 280px;
            text-align: center;
        }

        .btn-primary {
            background: var(--c-pink);
            border-color: var(--c-pink);
            color: var(--c-white);
            box-shadow: 0 0 20px var(--c-pink);
        }

        .btn:hover {
            transform: scale(1.05);
            background: var(--c-white);
            color: var(--c-bg-deep);
            box-shadow: 0 0 25px var(--c-white);
        }

        .btn-primary:hover {
            background: var(--c-cyan);
            border-color: var(--c-cyan);
            box-shadow: 0 0 30px var(--c-cyan);
        }

        /* --- ANIMATED NOTES (DOM) --- */
        .note {
            position: absolute;
            width: 80px; /* Fits inside lane */
            height: 20px;
            z-index: 15;
            border: 2px solid var(--c-white);
            box-shadow: 0 0 10px currentColor;
            /* Start off screen top */
            top: -50px; 
            /* Animation set in JS */
        }
        
        .note-inner {
            width: 100%;
            height: 100%;
            background: currentColor;
            opacity: 0.8;
        }

        /* --- ANIMATIONS --- */
        @keyframes gridScroll {
            0% { background-position: center 0; }
            100% { background-position: center 100px; }
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.4; }
        }

        @keyframes noteFall {
            0% { top: -5%; transform: scale(0.5); opacity: 0; }
            10% { opacity: 1; }
            100% { top: 110%; transform: scale(1.5); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .lanes { gap: 5px; }
            .lane { width: 60px; }
            .hit-zone { width: 280px; }
            .note { width: 50px; }
        }
    </style>
</head>
<body>

    <!-- 1. Canvas Background (Sun, Stars) -->
    <canvas id="bg-canvas"></canvas>

    <!-- 2. The 3D Highway -->
    <div class="highway-container">
        <div class="highway-plane">
            <div class="grid-floor"></div>
            <!-- Visual Lanes -->
            <div class="lanes">
                <div class="lane"></div>
                <div class="lane"></div>
                <div class="lane"></div>
                <div class="lane"></div>
            </div>
        </div>
    </div>

    <!-- 3. Hit Line (Foreground Anchor) -->
    <div class="hit-zone">
        <div class="hit-bar"></div>
    </div>

    <!-- 4. UI Layer -->
    <div class="ui-layer">
        
        <div class="title-wrapper">
            <h1>
                <span class="layer l-cyan">PIXEL<br>DANCE</span>
                <span class="layer l-pink">PIXEL<br>DANCE</span>
                <span class="layer l-base">PIXEL<br>DANCE</span>
            </h1>
            <span class="subtitle">NEON RHYTHM EDITION</span>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="btn-start">START GAME</button>
            <button class="btn" id="btn-opt">OPTIONS</button>
        </div>

    </div>

    <!-- 5. Overlays -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <script>
        /**
         * ENGINE: Visuals & Interaction
         */

        // --- 1. CANVAS BACKGROUND (Sun & Stars) ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let time = 0;

        const CONFIG = {
            sunColorTop: '#ff0055',
            sunColorBot: '#ffcc00',
            starCount: 100
        };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawBackground() {
            time += 0.02;
            ctx.clearRect(0, 0, width, height);

            // 1. Sky Gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
            skyGrad.addColorStop(0, '#050014');
            skyGrad.addColorStop(0.5, '#1a0033');
            skyGrad.addColorStop(1, '#4a0066');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, height);

            // 2. Stars
            ctx.fillStyle = '#ffffff';
            for(let i=0; i<CONFIG.starCount; i++) {
                // Pseudo-random deterministic positions based on index
                const x = (Math.sin(i * 132.1) * 0.5 + 0.5) * width;
                const y = (Math.cos(i * 453.2) * 0.5 + 0.5) * (height * 0.5);
                
                // Twinkle
                const size = (Math.sin(time * 2 + i) + 1) / 2; 
                ctx.globalAlpha = 0.5 + size * 0.5;
                ctx.fillRect(x, y, size + 1, size + 1);
            }
            ctx.globalAlpha = 1;

            // 3. Synthwave Sun
            const sunY = height * 0.35;
            const sunR = Math.min(width, height) * 0.2;
            
            // Sun Glow
            ctx.shadowBlur = 50;
            ctx.shadowColor = CONFIG.sunColorTop;
            
            // Sun Gradient
            const sunGrad = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
            sunGrad.addColorStop(0, CONFIG.sunColorTop);
            sunGrad.addColorStop(1, CONFIG.sunColorBot);

            ctx.beginPath();
            ctx.arc(width/2, sunY, sunR, 0, Math.PI*2);
            ctx.fillStyle = sunGrad;
            ctx.fill();

            // Sun Stripes (The "Blinds" effect)
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#1a0033'; // Match horizon sky color
            ctx.beginPath();
            // Draw sun circle again as clip path? No, just draw rects over it
            // We use destination-out to cut holes, or just draw rects matching sky color
            // Drawing rects matching sky color is safer for compositing
            for(let i=1; i<10; i++) {
                // Exponential spacing
                const yStart = sunY + (i * 8) + (i*i); 
                const h = 2 + i;
                if(yStart < sunY + sunR) {
                    ctx.fillRect(width/2 - sunR, yStart, sunR*2, h);
                }
            }
        }

        // --- 2. NOTE SPAWNER (The "Preview") ---
        const laneElements = document.querySelectorAll('.lane');
        const hitZone = document.querySelector('.hit-zone');
        
        // Colors for notes
        const noteColors = ['#00f3ff', '#ff0055', '#ffee00', '#9d00ff'];

        function spawnNote() {
            const note = document.createElement('div');
            note.className = 'note';
            
            // Inner glow
            const inner = document.createElement('div');
            inner.className = 'note-inner';
            note.appendChild(inner);

            // Pick a random lane (0-3)
            const laneIndex = Math.floor(Math.random() * 4);
            const laneRect = laneElements[laneIndex].getBoundingClientRect();
            
            // Position note to match the lane exactly
            // We position relative to body, using calculated left/width
            note.style.left = laneRect.left + 'px';
            note.style.width = laneRect.width + 'px';
            
            // Color
            const color = noteColors[laneIndex];
            note.style.color = color; // Sets currentColor for border/shadow
            inner.style.backgroundColor = color;

            // Animation Duration
            const duration = 2.0 + Math.random(); // seconds
            note.style.animation = `noteFall ${duration}s linear forwards`;

            document.body.appendChild(note);

            // Cleanup
            setTimeout(() => {
                if(note.parentNode) note.parentNode.removeChild(note);
            }, duration * 1000);
        }

        // --- 3. LOOP & INTERACTION ---
        
        // Animation Loop
        function loop() {
            drawBackground();
            requestAnimationFrame(loop);
        }
        loop();

        // Note Spawning Loop (Rhythm simulation)
        // Spawn a note every 400-800ms
        setInterval(() => {
            if(Math.random() > 0.2) spawnNote();
        }, 400);


        // Button Logic
        document.getElementById('btn-start').addEventListener('click', function() {
            const btn = this;
            btn.innerText = "LOADING...";
            btn.style.backgroundColor = "#00f3ff";
            btn.style.color = "#000";
            
            // Simulate loading
            setTimeout(() => {
                alert("ENTERING THE GRID...");
                btn.innerText = "START GAME";
                btn.style.backgroundColor = "";
                btn.style.color = "";
            }, 800);
        });

        document.getElementById('btn-opt').addEventListener('click', function() {
            alert("OPTIONS MENU:\n- SENSITIVITY: 80%\n- SCROLL SPEED: FAST\n- THEME: NEON");
        });

    </script>
</body>
</html>
