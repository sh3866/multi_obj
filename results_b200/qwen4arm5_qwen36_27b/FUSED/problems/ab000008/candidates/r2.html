<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            /* Palette - High Contrast Synthwave */
            --c-bg-deep: #08001a;
            --c-purple: #7000ff;
            --c-pink: #ff007f;
            --c-cyan: #00f0ff;
            --c-yellow: #ffe600;
            --c-white: #ffffff;
            --c-dark: #120024;
            
            /* UI Constants */
            --ui-border: 2px solid var(--c-white);
            --ui-shadow: 4px 4px 0px var(--c-pink);
            --ui-shadow-hover: 6px 6px 0px var(--c-cyan);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none; /* Crisp edges for pixel feel */
        }

        body {
            background-color: var(--c-bg-deep);
            color: var(--c-white);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px; /* For 3D elements */
        }

        /* --- LAYERS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .vignette-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
        }

        /* --- UI CONTAINER --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Flex layout to stack Title and Controls */
        }

        /* --- HIGHWAY (3D Perspective) --- */
        .highway-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65vh;
            z-index: 2;
            perspective: 600px;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .highway-plane {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(100,0,200,0.3) 40%, transparent 100%);
            transform: rotateX(60deg);
            transform-origin: 50% 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            mask-image: linear-gradient(to top, black 20%, transparent 90%);
            -webkit-mask-image: linear-gradient(to top, black 20%, transparent 90%);
        }

        .highway-grid {
            width: 100%;
            max-width: 800px;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 127, 0.3) 1px, transparent 1px);
            background-size: 100px 100px;
            background-position: center center;
            animation: gridMove 1s linear infinite;
            transform: skewX(0deg); /* Keep grid straight */
            border-left: 2px solid var(--c-pink);
            border-right: 2px solid var(--c-pink);
            box-shadow: 0 0 40px var(--c-purple);
        }

        /* Hit Line */
        .hit-line-container {
            position: absolute;
            bottom: 10%; /* Position relative to screen, not highway plane */
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 4px;
            background: var(--c-white);
            box-shadow: 0 0 15px var(--c-white), 0 0 30px var(--c-cyan);
            z-index: 15;
            opacity: 0.8;
        }

        /* --- TITLE GRAPHICS --- */
        .title-wrapper {
            margin-bottom: 60px;
            text-align: center;
            position: relative;
            transform: translateZ(50px);
        }

        h1 {
            font-size: 5rem;
            font-weight: 900;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: var(--c-white);
            position: relative;
            transform: skewX(-10deg);
            /* Pixelated look via text-shadow */
            text-shadow: 
                4px 4px 0px var(--c-purple),
                -2px -2px 0px var(--c-cyan);
        }

        h1 .outline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: transparent;
            -webkit-text-stroke: 2px var(--c-pink);
            z-index: -1;
            transform: translate(6px, 6px);
        }

        .subtitle {
            display: block;
            font-size: 1.2rem;
            letter-spacing: 8px;
            color: var(--c-yellow);
            margin-top: 10px;
            text-shadow: 0 0 10px var(--c-yellow);
            transform: skewX(-10deg);
            animation: pulseText 2s infinite ease-in-out;
        }

        /* --- CONTROLS --- */
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            transform: translateZ(20px);
        }

        .btn {
            position: relative;
            background: var(--c-bg-deep);
            border: 2px solid var(--c-white);
            color: var(--c-white);
            padding: 15px 35px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: var(--ui-shadow);
            /* Pixel Art Shape */
            clip-path: polygon(
                10px 0, 100% 0, 
                100% calc(100% - 10px), calc(100% - 10px) 100%, 
                0 100%, 0 10px
            );
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--ui-shadow-hover);
            background: var(--c-white);
            color: var(--c-bg-deep);
            border-color: var(--c-bg-deep);
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--c-pink);
        }

        .btn-primary {
            background: var(--c-pink);
            border-color: var(--c-white);
            color: var(--c-white);
        }
        
        .btn-primary:hover {
            background: var(--c-white);
            color: var(--c-pink);
        }

        /* --- ANIMATED NOTES (DOM) --- */
        .note {
            position: absolute;
            width: 60px;
            height: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--c-yellow);
            border: 2px solid var(--c-white);
            box-shadow: 0 0 10px var(--c-yellow);
            z-index: 14;
        }

        /* --- ANIMATIONS --- */
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 1; text-shadow: 0 0 10px var(--c-yellow); }
            50% { opacity: 0.7; text-shadow: 0 0 2px var(--c-yellow); }
        }

        @keyframes noteDrop {
            0% { top: -100px; opacity: 0; }
            10% { opacity: 1; }
            100% { top: 120vh; opacity: 0; }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .controls { flex-direction: column; width: 200px; }
            .btn { width: 100%; text-align: center; }
            .highway-grid { background-size: 50px 50px; }
        }
    </style>
</head>
<body>

    <!-- 1. Background (Canvas) -->
    <canvas id="bg-canvas"></canvas>

    <!-- 2. Retro Overlays -->
    <div class="scanlines"></div>
    <div class="vignette-overlay"></div>

    <!-- 3. The 3D Highway Background -->
    <div class="highway-container">
        <div class="highway-plane">
            <div class="highway-grid"></div>
        </div>
    </div>

    <!-- 4. The Hit Line (Foreground Anchor) -->
    <div class="hit-line-container" id="hit-line"></div>

    <!-- 5. UI Layer -->
    <div class="ui-layer">
        
        <div class="title-wrapper">
            <h1>
                PIXEL<br>DANCE
                <div class="outline">PIXEL<br>DANCE</div>
            </h1>
            <span class="subtitle">NEON RHYTHM EDITION</span>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="startGame()">START GAME</button>
            <button class="btn" onclick="alert('Options menu placeholder')">OPTIONS</button>
        </div>

    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Handles the background rendering (Sun, Stars, Grid) and foreground Note animation.
         */

        const CONFIG = {
            colors: {
                skyTop: '#08001a',
                skyBot: '#2a004a',
                sunTop: '#ff007f',
                sunBot: '#ffcc00',
                grid: '#7000ff'
            },
            lanes: [150, 250, 350, 450] // Visual offsets for notes (centered)
        };

        // --- CANVAS BACKGROUND ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawSun(cx, cy, r) {
            const grad = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
            grad.addColorStop(0, CONFIG.colors.sunTop);
            grad.addColorStop(1, CONFIG.colors.sunBot);

            ctx.save();
            ctx.translate(cx, cy);
            
            // Sun Glow
            ctx.shadowBlur = 60;
            ctx.shadowColor = CONFIG.colors.sunTop;

            // Main Circle
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            // Synthwave Stripes (Masking)
            ctx.globalCompositeOperation = 'destination-out';
            ctx.shadowBlur = 0;
            
            const totalStripes = 15;
            for (let i = 0; i < totalStripes; i++) {
                // Exponential spacing for perspective
                const yOffset = (i / totalStripes) * r;
                if (yOffset > 0) {
                    const h = 3 + (i * i * 0.2); // Thicker at bottom
                    ctx.fillRect(-r, yOffset, r * 2, h);
                }
            }
            ctx.restore();
        }

        function drawStars() {
            ctx.fillStyle = '#fff';
            // Deterministic random stars
            for (let i = 0; i < 80; i++) {
                const x = (Math.sin(i * 132.1) * 0.5 + 0.5) * width;
                const y = (Math.cos(i * 453.2) * 0.5 + 0.5) * (height * 0.5); // Top half only
                
                // Twinkle
                const alpha = 0.5 + 0.5 * Math.sin(time * 0.05 + i);
                ctx.globalAlpha = alpha;
                ctx.fillRect(x, y, 2, 2);
            }
            ctx.globalAlpha = 1;
        }

        function loop() {
            time++;
            ctx.clearRect(0, 0, width, height);

            // 1. Sky Gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
            skyGrad.addColorStop(0, CONFIG.colors.skyTop);
            skyGrad.addColorStop(1, CONFIG.colors.skyBot);
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, height);

            // 2. Stars
            drawStars();

            // 3. Sun
            // Center X, positioned so it peeks over the "horizon"
            drawSun(width / 2, height * 0.35, Math.min(width, height) * 0.25);

            requestAnimationFrame(loop);
        }

        // --- FOREGROUND NOTES ---
        // We spawn notes that fall towards the hit line
        const hitLine = document.getElementById('hit-line');
        
        function spawnNote() {
            const note = document.createElement('div');
            note.className = 'note';
            
            // Randomize Lane (Visual position)
            // We center the notes roughly within the visual highway width
            const laneOffsets = [-150, -50, 50, 150]; 
            const randomLane = laneOffsets[Math.floor(Math.random() * laneOffsets.length)];
            
            note.style.left = `calc(50% + ${randomLane}px)`;
            
            // Randomize Color
            const colors = ['#ff007f', '#00f0ff', '#ffe600', '#7000ff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            note.style.backgroundColor = color;
            note.style.boxShadow = `0 0 15px ${color}`;

            // Animation
            const duration = 1.5 + Math.random(); // 1.5s to 2.5s fall
            note.style.animation = `noteDrop ${duration}s linear forwards`;

            document.body.appendChild(note);

            // Cleanup
            setTimeout(() => {
                if (note.parentNode) note.parentNode.removeChild(note);
            }, duration * 1000);
        }

        // Rhythm simulation
        setInterval(() => {
            if(Math.random() > 0.3) spawnNote();
        }, 300);

        // --- INTERACTION ---
        function startGame() {
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerText;
            
            btn.innerText = "LOADING...";
            btn.style.background = "var(--c-cyan)";
            btn.style.color = "var(--c-bg-deep)";
            
            // Flash effect
            document.body.style.filter = "brightness(1.5)";
            setTimeout(() => {
                document.body.style.filter = "brightness(1)";
                alert("GAME STARTED (Demo)");
                btn.innerText = originalText;
                btn.style.background = "";
                btn.style.color = "";
            }, 600);
        }

        // Init
        loop();

    </script>
</body>
</html>
