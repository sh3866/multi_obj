<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina: Capture & Collection</title>
<style>
  :root {
    --bg-deep: #02040a;
    --bg-mid: #0a1020;
    --accent-cyan: #00f2ff;
    --accent-magenta: #ff0099;
    --accent-lime: #ccff00;
    --accent-purple: #bd00ff;
    --glass-surface: rgba(10, 14, 23, 0.4);
    --glass-border: rgba(255, 255, 255, 0.15);
    --glass-highlight: rgba(255, 255, 255, 0.1);
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Atmosphere & Background --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Layered Depth Background */
  .bg-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Deep Space Gradient */
  .fog-layer {
    background: 
      radial-gradient(circle at 50% 120%, rgba(20, 30, 60, 0.8) 0%, transparent 60%),
      radial-gradient(circle at 20% 20%, rgba(189, 0, 255, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 30%, rgba(0, 242, 255, 0.08) 0%, transparent 40%),
      linear-gradient(180deg, var(--bg-deep) 0%, #050814 100%);
  }

  /* Distant Terrain Silhouettes (Canvas) */
  #bgCanvas {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* Game Canvas */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
    cursor: none;
  }

  /* Vignette Overlay */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.6) 100%);
    z-index: 4;
    pointer-events: none;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 20;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1.5rem;
  }

  /* Header - Redesigned for subtlety */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
    padding-top: 0.5rem;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 1.8rem; /* Scaled down significantly */
    margin: 0;
    line-height: 1;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
  }

  .subtitle {
    font-size: 0.65rem;
    font-weight: 600;
    color: var(--accent-cyan);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 0.2rem;
    opacity: 0.8;
  }

  /* HUD Panel - Integrated Glassmorphism */
  .hud-panel {
    background: var(--glass-surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-left: 3px solid var(--accent-cyan); /* Diegetic accent */
    padding: 0.5rem 1.2rem;
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    transition: transform 0.3s ease;
  }

  .stat-icon {
    width: 20px; height: 20px;
    fill: var(--accent-lime);
    filter: drop-shadow(0 0 4px var(--accent-lime));
  }

  .stat-group {
    display: flex;
    flex-direction: column;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 1.4rem;
    color: white;
    line-height: 1;
    letter-spacing: 0.05em;
  }

  .stat-label {
    font-size: 0.6rem;
    font-weight: 700;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* Footer / Actions */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    padding-bottom: 1rem;
  }

  .btn-main {
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(8px);
    border: 1px solid var(--glass-border);
    color: rgba(255, 255, 255, 0.8);
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 0.85rem;
    padding: 0.8rem 2.5rem;
    border-radius: 4px; /* Squarer, tech feel */
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }

  .btn-main::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: 0.5s;
  }

  .btn-main:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: var(--accent-cyan);
    color: white;
    box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
    transform: translateY(-2px);
  }
  
  .btn-main:hover::before {
    left: 100%;
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    border: 1px solid var(--accent-lime);
    color: var(--accent-lime);
    padding: 0.8rem 2rem;
    border-radius: 2px;
    font-family: var(--font-ui);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 30;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(204, 255, 0, 0.1);
    font-weight: 700;
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  @media (max-width: 600px) {
    h1 { font-size: 1.4rem; }
    .ui-layer { padding: 1rem; }
    .btn-main { padding: 0.7rem 1.5rem; font-size: 0.75rem; }
    .hud-panel { padding: 0.4rem 0.8rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Background Layers -->
  <div class="bg-layer fog-layer"></div>
  <canvas id="bgCanvas"></canvas> <!-- Terrain -->
  <div class="vignette"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Lumina</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-panel">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" />
        </svg>
        <div class="stat-group">
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Specimens</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  
  const bgCanvas = document.getElementById('bgCanvas');
  const bgCtx = bgCanvas.getContext('2d');

  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let frameCount = 0;

  // Configuration
  const COLORS = ['#00f2ff', '#ff0099', '#ccff00', '#bd00ff'];
  const CREATURE_COUNT = 8;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
    drawTerrain();
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault(); 
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Visuals: Terrain ---
  function drawTerrain() {
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    
    // Layer 1: Distant Mountains
    bgCtx.fillStyle = '#080c16';
    bgCtx.beginPath();
    bgCtx.moveTo(0, bgCanvas.height);
    for(let i=0; i<=bgCanvas.width; i+=50) {
      bgCtx.lineTo(i, bgCanvas.height - 100 - Math.sin(i * 0.005) * 50 - Math.random() * 20);
    }
    bgCtx.lineTo(bgCanvas.width, bgCanvas.height);
    bgCtx.fill();

    // Layer 2: Closer Hills
    bgCtx.fillStyle = '#04060a';
    bgCtx.beginPath();
    bgCtx.moveTo(0, bgCanvas.height);
    for(let i=0; i<=bgCanvas.width; i+=30) {
      bgCtx.lineTo(i, bgCanvas.height - 50 - Math.sin(i * 0.01 + 2) * 40 - Math.random() * 10);
    }
    bgCtx.lineTo(bgCanvas.width, bgCanvas.height);
    bgCtx.fill();
  }

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 4 + 2;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.95;
      this.vy *= 0.95;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset();
      // Initial random placement
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    }

    reset() {
      this.x = Math.random() < 0.5 ? -50 : width + 50;
      this.y = Math.random() * (height - 200) + 50; // Keep away from very bottom terrain
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.baseRadius = Math.random() * 15 + 18;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = Math.random() * Math.PI * 2;
      this.spinSpeed = (Math.random() - 0.5) * 0.02;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.03 + 0.01;
      this.isCaught = false;
      this.tentacles = [];
      
      // Generate tentacle data
      for(let i=0; i<5; i++) {
        this.tentacles.push({
          angleOffset: (Math.PI * 2 / 5) * i,
          length: Math.random() * 15 + 10,
          phase: Math.random() * Math.PI * 2
        });
      }
      
      this.history = [];
      this.maxHistory = 12;
    }

    update() {
      if (this.isCaught) return;

      this.x += this.vx;
      this.y += this.vy;
      this.wobble += this.wobbleSpeed;
      
      // Organic floating drift
      this.x += Math.sin(this.wobble) * 0.3;
      this.y += Math.cos(this.wobble * 0.8) * 0.2;

      this.angle += this.spinSpeed;

      // Bounce off walls
      if (this.x < 0 || this.x > width) this.vx *= -1;
      if (this.y < 0 || this.y > height - 100) this.vy *= -1; // Bounce off terrain approx

      // Avoid Mouse (Net)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 200) {
        // Flee behavior
        const force = (200 - dist) / 200;
        this.vx += (dx / dist) * force * 1.2;
        this.vy += (dy / dist) * force * 1.2;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 4) {
        this.vx = (this.vx / speed) * 4;
        this.vy = (this.vy / speed) * 4;
      }

      // Update Trail
      this.history.push({x: this.x, y: this.y});
      if (this.history.length > this.maxHistory) this.history.shift();
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      
      // 1. Draw Trail (Ghostly afterimage)
      ctx.save();
      ctx.rotate(-this.angle); // Undo rotation for trail
      for (let i = 0; i < this.history.length - 1; i++) {
        const point = this.history[i];
        // Relative to current pos
        const rx = point.x - this.x;
        const ry = point.y - this.y;
        const progress = i / this.history.length;
        const size = this.baseRadius * 0.5 * progress;
        
        ctx.globalAlpha = progress * 0.2;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(rx, ry, size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // 2. Draw Tentacles
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.globalAlpha = 0.7;
      
      this.tentacles.forEach(t => {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        const tLen = t.length + Math.sin(this.wobble * 2 + t.phase) * 5;
        const tAngle = t.angleOffset + Math.sin(this.wobble + t.phase) * 0.2;
        const endX = Math.cos(tAngle) * tLen;
        const endY = Math.sin(tAngle) * tLen;
        const cpX = Math.cos(tAngle + 0.5) * (tLen * 0.6);
        const cpY = Math.sin(tAngle + 0.5) * (tLen * 0.6);
        
        ctx.quadraticCurveTo(cpX, cpY, endX, endY);
        ctx.stroke();
      });
      ctx.globalAlpha = 1.0;

      // 3. Draw Main Body (Jellyfish/Spirit shape)
      ctx.shadowBlur = 20;
      ctx.shadowColor = this.color;
      
      // Outer Glow/Shape
      const grad = ctx.createRadialGradient(0, 0, this.baseRadius * 0.2, 0, 0, this.baseRadius);
      grad.addColorStop(0, '#fff');
      grad.addColorStop(0.4, this.color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      // Draw a bell shape
      ctx.moveTo(0, this.baseRadius * 0.5);
      ctx.bezierCurveTo(this.baseRadius, this.baseRadius * 0.5, this.baseRadius, -this.baseRadius * 0.5, 0, -this.baseRadius);
      ctx.bezierCurveTo(-this.baseRadius, -this.baseRadius * 0.5, -this.baseRadius, this.baseRadius * 0.5, 0, this.baseRadius * 0.5);
      ctx.fill();

      // Inner Core
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.arc(0, -this.baseRadius * 0.2, this.baseRadius * 0.25, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Player Character (The "Collector") ---
  function drawPlayer() {
    // Calculate position based on mouse, but anchored to bottom-ish area or just follow mouse?
    // Brief says "anchored near the bottom or center". 
    // Let's make the player a silhouette at the bottom that aims a beam at the mouse.
    
    const playerX = width / 2;
    const playerY = height - 60; // Anchored near bottom
    
    ctx.save();
    ctx.translate(playerX, playerY);
    
    // 1. Draw Silhouette (Simple Hooded Figure)
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(0, -40, 15, 0, Math.PI * 2); // Head
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-25, 0);
    ctx.quadraticCurveTo(0, -60, 25, 0); // Shoulders/Body
    ctx.lineTo(25, 20);
    ctx.lineTo(-25, 20);
    ctx.fill();

    // 2. Draw Arm & Net Pole pointing to mouse
    const dx = mouse.x - playerX;
    const dy = mouse.y - playerY;
    const angle = Math.atan2(dy, dx);
    const dist = Math.sqrt(dx*dx + dy*dy);

    ctx.rotate(angle);
    
    // Pole
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(10, -10);
    ctx.lineTo(150, -10); // Pole length
    ctx.stroke();

    // Net Handle (at mouse location)
    ctx.translate(150, -10);
    ctx.rotate(-angle); // Unrotate to draw net relative to world, or keep relative?
    // Let's keep relative to pole for simplicity, but make it face "out"
    
    // Actually, let's draw the Net at the Mouse Position directly, and just draw a line connecting player to net.
    // This is cleaner.
    ctx.restore();
    
    // Re-draw connection line
    ctx.save();
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 10]);
    ctx.beginPath();
    ctx.moveTo(playerX, playerY - 20);
    ctx.lineTo(mouse.x, mouse.y);
    ctx.stroke();
    ctx.restore();

    // Draw Net at Mouse
    drawNet(mouse.x, mouse.y);
  }

  function drawNet(x, y) {
    ctx.save();
    ctx.translate(x, y);
    
    // Pulse animation
    const pulse = Math.sin(frameCount * 0.1) * 3;
    const baseRadius = 60;
    
    // Net Mesh (Concentric circles)
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, baseRadius, 0, Math.PI * 2);
    ctx.stroke();
    
    // Cross lines for mesh effect
    for(let i=1; i<4; i++) {
      ctx.beginPath();
      ctx.arc(0, 0, baseRadius * (i/4), 0, Math.PI * 2);
      ctx.stroke();
    }
    
    // Outer Glow Ring
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f2ff';
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(0, 242, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, baseRadius + pulse, 0, Math.PI * 2);
    ctx.stroke();

    // Sucking effect (Concentric rings when held)
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.beginPath();
      ctx.arc(0, 0, baseRadius + 25 + pulse, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 70; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<30; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1200);

    // Respawn logic
    setTimeout(() => {
      creature.reset();
    }, 2500);
  }

  function resetGame() {
    init();
  }

  function loop() {
    frameCount++;
    
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player (Character + Net)
    drawPlayer();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
