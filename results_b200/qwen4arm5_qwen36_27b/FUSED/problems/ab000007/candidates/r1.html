<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina: Capture & Collection</title>
<style>
  :root {
    --bg-deep: #030408;
    --bg-mid: #0a0e17;
    --accent-cyan: #00f2ff;
    --accent-magenta: #ff0099;
    --accent-lime: #ccff00;
    --accent-purple: #bd00ff;
    --glass-surface: rgba(10, 14, 23, 0.65);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-highlight: rgba(255, 255, 255, 0.08);
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Atmosphere & Background --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Volumetric Fog */
  .fog-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    background: 
      radial-gradient(circle at 20% 30%, rgba(189, 0, 255, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0, 242, 255, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(10, 14, 23, 1) 0%, var(--bg-deep) 100%);
  }

  /* Canvas Layer */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none; /* We draw our own cursor */
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2.5rem;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 3.5rem;
    margin: 0;
    line-height: 1;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: white;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.3), 0 0 40px rgba(0, 242, 255, 0.2);
  }

  .subtitle {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent-cyan);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    margin-top: 0.25rem;
    text-shadow: 0 0 10px rgba(0, 242, 255, 0.4);
  }

  /* HUD Panel */
  .hud-panel {
    background: var(--glass-surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight);
    padding: 0.6rem 1.8rem;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    transition: transform 0.2s;
  }

  .stat-icon {
    width: 28px; height: 28px;
    fill: var(--accent-lime);
    filter: drop-shadow(0 0 8px var(--accent-lime));
  }

  .stat-group {
    display: flex;
    flex-direction: column;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 1.8rem;
    color: white;
    line-height: 1;
    letter-spacing: 0.05em;
  }

  .stat-label {
    font-size: 0.7rem;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* Footer / Actions */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    margin-bottom: 1rem;
  }

  .btn-main {
    background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.02) 100%);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    color: white;
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 1rem;
    padding: 1rem 3.5rem;
    border-radius: 50px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .btn-main:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.4);
    box-shadow: 0 0 25px rgba(0, 242, 255, 0.3), inset 0 0 20px rgba(255,255,255,0.05);
    color: var(--accent-cyan);
  }

  .btn-main:active {
    transform: translateY(1px);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0, 0, 0, 0.85);
    border: 1px solid var(--accent-lime);
    color: var(--accent-lime);
    padding: 1rem 2.5rem;
    border-radius: 4px;
    font-family: var(--font-display);
    font-size: 1.2rem;
    letter-spacing: 0.15em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 40px rgba(204, 255, 0, 0.15);
    text-shadow: 0 0 10px var(--accent-lime);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    h1 { font-size: 2.2rem; }
    .ui-layer { padding: 1.5rem; }
    .btn-main { padding: 0.9rem 2rem; font-size: 0.9rem; width: 100%; }
    .hud-panel { padding: 0.5rem 1.2rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="fog-layer"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Lumina</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-panel">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" />
        </svg>
        <div class="stat-group">
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Specimens</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Pure Canvas implementation for smooth 60fps rendering.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let frameCount = 0;

  // Configuration
  const COLORS = ['#00f2ff', '#ff0099', '#ccff00', '#bd00ff'];
  const CREATURE_COUNT = 6;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault(); 
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 4 + 2;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.96; // Friction
      this.vy *= 0.96;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset();
      // Initial random placement
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    }

    reset() {
      // Spawn at edges
      this.x = Math.random() < 0.5 ? -50 : width + 50;
      this.y = Math.random() * height;
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.radius = Math.random() * 15 + 18;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = Math.random() * Math.PI * 2;
      this.spinSpeed = (Math.random() - 0.5) * 0.05;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.03 + 0.01;
      this.isCaught = false;
      
      // Trail history
      this.history = [];
      this.maxHistory = 10;
    }

    update() {
      if (this.isCaught) return;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.wobble += this.wobbleSpeed;
      
      // Gentle floating drift
      this.x += Math.sin(this.wobble) * 0.3;
      this.y += Math.cos(this.wobble * 0.8) * 0.2;

      // Rotation
      this.angle += this.spinSpeed;

      // Bounce off walls gently
      if (this.x < 0 || this.x > width) this.vx *= -1;
      if (this.y < 0 || this.y > height) this.vy *= -1;

      // Avoid Mouse (Net)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 180) {
        // Flee behavior
        const force = (180 - dist) / 180;
        this.vx += (dx / dist) * force * 0.8;
        this.vy += (dy / dist) * force * 0.8;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 5) {
        this.vx = (this.vx / speed) * 5;
        this.vy = (this.vy / speed) * 5;
      }

      // Update Trail
      this.history.push({x: this.x, y: this.y});
      if (this.history.length > this.maxHistory) this.history.shift();
    }

    draw(ctx) {
      if (this.isCaught) return;

      // 1. Draw Trail
      ctx.save();
      for (let i = 0; i < this.history.length - 1; i++) {
        const point = this.history[i];
        const progress = i / this.history.length;
        const size = this.radius * 0.6 * progress;
        
        ctx.globalAlpha = progress * 0.4;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(point.x, point.y, size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // 2. Draw Creature
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      
      // Glow
      ctx.shadowBlur = 25;
      ctx.shadowColor = this.color;
      
      // Shape: Stylized Shard / Geometric Star
      ctx.fillStyle = this.color;
      ctx.beginPath();
      
      const r = this.radius;
      const points = 4;
      for (let i = 0; i < points * 2; i++) {
        const currentR = (i % 2 === 0) ? r : r * 0.4;
        const theta = (i * Math.PI) / points;
        ctx.lineTo(Math.cos(theta) * currentR, Math.sin(theta) * currentR);
      }
      ctx.closePath();
      ctx.fill();

      // Inner Core (White/Hot)
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 70; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<25; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1200);

    // Respawn logic
    setTimeout(() => {
      creature.reset();
    }, 2500);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Pulse animation
    const pulse = Math.sin(frameCount * 0.1) * 5;
    const baseRadius = 60;
    
    // Outer Ring
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f2ff';
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(0, 242, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, baseRadius + pulse, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner Reticle (Dashed)
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, baseRadius * 0.6, 0, Math.PI * 2);
    ctx.stroke();

    // Crosshair
    ctx.beginPath();
    ctx.moveTo(-15, 0); ctx.lineTo(-5, 0);
    ctx.moveTo(15, 0); ctx.lineTo(5, 0);
    ctx.moveTo(0, -15); ctx.lineTo(0, -5);
    ctx.moveTo(0, 15); ctx.lineTo(0, 5);
    ctx.stroke();

    // Sucking effect (Concentric rings when held)
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.beginPath();
      ctx.arc(0, 0, baseRadius + 20 + pulse, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    frameCount++;
    
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Draw Background Particles (Atmosphere)
    // Simple static stars/dust
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for(let i=0; i<30; i++) {
      // Use pseudo-random based on frame to keep them static-ish or slow moving
      // For simplicity in this snippet, we won't maintain a separate array for stars
      // but the fog layer in CSS handles the bulk of atmosphere.
    }

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
