<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Walker | Skill Matrix</title>
<style>
    :root {
        /* Palette: Deep Space & Neon */
        --bg-deep: #05050a;
        --bg-panel: rgba(10, 11, 25, 0.65);
        --bg-panel-border: rgba(100, 116, 139, 0.15);
        
        --accent-primary: #8b5cf6; /* Electric Violet */
        --accent-glow: rgba(139, 92, 246, 0.5);
        --accent-secondary: #06b6d4; /* Cyan for structure/connections */
        --accent-highlight: #fbbf24; /* Amber for Available/Points */
        
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-dim: #475569;
        
        /* Typography */
        --font-display: "Didot", "Times New Roman", "Georgia", serif;
        --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
    }

    /* Background Texture (Nebula/Noise) */
    body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: 
            radial-gradient(circle at 70% 30%, #1e1b4b 0%, #05050a 65%),
            radial-gradient(circle at 10% 90%, #172554 0%, transparent 40%);
        z-index: -2;
    }
    
    body::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: -1;
    }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        width: 100%;
        height: 100%;
    }

    /* --- Sidebar (Frosted Glass & Rhythm) --- */
    aside {
        width: 320px;
        height: 100%;
        background: var(--bg-panel);
        border-right: 1px solid var(--bg-panel-border);
        display: flex;
        flex-direction: column;
        padding: 40px 24px;
        z-index: 10;
        position: relative;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
    }

    /* Top Header Area */
    .profile-header {
        margin-bottom: 40px;
        border-bottom: 1px solid var(--bg-panel-border);
        padding-bottom: 24px;
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 2.5rem;
        font-weight: 400;
        color: var(--text-main);
        letter-spacing: -0.02em;
        margin-bottom: 12px;
        line-height: 1;
        text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    .char-class {
        font-family: var(--font-body);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--accent-primary);
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* Stats Container - 24px Vertical Rhythm */
    .stats-container {
        display: flex;
        flex-direction: column;
        gap: 32px; 
    }

    /* Level & XP Section */
    .level-section {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .level-display {
        display: flex;
        align-items: baseline;
        gap: 12px; /* Tight grouping */
    }

    .level-number {
        font-family: var(--font-display);
        font-size: 4rem;
        line-height: 0.8;
        color: var(--text-main);
        font-weight: 300;
    }

    .level-label {
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-muted);
        font-weight: 600;
    }

    .xp-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .xp-bar-track {
        width: 100%;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        overflow: hidden;
    }

    .xp-bar-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        box-shadow: 0 0 10px var(--accent-glow);
    }
    
    .xp-text {
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 500;
        text-align: right;
    }

    /* Skill Points Indicator (Moved to Sidebar) */
    .sp-indicator {
        background: rgba(251, 191, 36, 0.1); /* Amber tint */
        border: 1px solid rgba(251, 191, 36, 0.3);
        border-radius: 8px;
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }

    .sp-label {
        color: var(--accent-highlight);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .sp-value {
        font-family: var(--font-display);
        font-size: 1.75rem;
        color: var(--accent-highlight);
        font-weight: 700;
        text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
    }

    /* Base Stats Grid */
    .base-stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    .stat-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 12px;
        background: rgba(255,255,255,0.02);
        border-radius: 6px;
        border: 1px solid transparent;
        transition: all 0.2s;
    }
    
    .stat-item:hover {
        background: rgba(255,255,255,0.04);
        border-color: var(--bg-panel-border);
    }

    .stat-name {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    
    .stat-icon {
        width: 12px;
        height: 12px;
        fill: var(--text-muted);
    }

    .stat-val {
        font-family: var(--font-display);
        font-size: 1.25rem;
        color: var(--text-main);
        font-weight: 400;
    }

    /* --- Tree Area --- */
    .tree-viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, rgba(30, 20, 60, 0.2) 0%, rgba(3, 3, 5, 0) 60%);
    }

    .tree-viewport:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform-origin: 0 0;
    }

    /* SVG Connections */
    svg.connections {
        position: absolute;
        top: -2000px;
        left: -2000px;
        width: 5000px;
        height: 5000px;
        overflow: visible;
        pointer-events: none;
        z-index: 1;
    }

    .connection-line {
        stroke: rgba(255, 255, 255, 0.08);
        stroke-width: 2;
        fill: none;
        transition: stroke 0.5s ease, filter 0.5s ease;
    }

    .connection-line.active {
        stroke: var(--accent-secondary); /* Cyan for structure */
        stroke-width: 3;
        filter: drop-shadow(0 0 5px rgba(6, 182, 212, 0.4));
    }
    
    .connection-line.potential {
        stroke: rgba(139, 92, 246, 0.3); /* Faint Purple */
        stroke-dasharray: 6, 4;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        width: 72px;
        height: 72px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .node:hover {
        transform: translate(-50%, -50%) scale(1.1);
        z-index: 10;
    }

    .node-shape {
        width: 100%;
        height: 100%;
        background: #0f101a;
        border: 1px solid rgba(255,255,255,0.15);
        /* Hexagon */
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    /* Inner glow effect */
    .node-shape::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        opacity: 0;
        transition: opacity 0.3s;
    }

    .node-icon {
        width: 28px;
        height: 28px;
        fill: var(--text-dim);
        opacity: 0.6;
        z-index: 2;
        transition: all 0.3s ease;
    }

    /* State: Unlocked (Active) */
    .node.unlocked .node-shape {
        border-color: var(--accent-primary);
        background: rgba(139, 92, 246, 0.15);
        box-shadow: 0 0 20px var(--accent-glow);
    }
    
    .node.unlocked .node-shape::before {
        opacity: 1;
    }

    .node.unlocked .node-icon {
        fill: var(--text-main);
        filter: drop-shadow(0 0 4px var(--accent-primary));
        opacity: 1;
    }

    /* State: Available (Hoverable) - Uses Amber Highlight */
    .node.available .node-shape {
        border-color: var(--accent-highlight);
        background: rgba(251, 191, 36, 0.05);
        animation: pulse-amber 3s infinite;
    }

    .node.available .node-icon {
        fill: var(--accent-highlight);
        opacity: 0.9;
    }

    @keyframes pulse-amber {
        0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4); }
        70% { box-shadow: 0 0 0 10px rgba(251, 191, 36, 0); }
        100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
    }

    /* State: Locked */
    .node.locked .node-shape {
        background: rgba(0,0,0,0.6);
        border-color: rgba(255,255,255,0.05);
    }
    
    .node.locked .node-icon {
        fill: #1e293b;
        opacity: 0.3;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(8, 9, 15, 0.95);
        border: 1px solid var(--bg-panel-border);
        padding: 20px;
        width: 280px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        border-left: 2px solid var(--accent-primary);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        color: var(--text-main);
        font-family: var(--font-display);
        font-size: 1.5rem;
        margin-bottom: 4px;
        font-weight: 400;
    }

    .tooltip .type {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--accent-secondary);
        margin-bottom: 12px;
        letter-spacing: 0.15em;
        font-weight: 700;
    }

    .tooltip p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #cbd5e1;
        font-weight: 300;
    }

    .tooltip .req {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(255,255,255,0.05);
        font-size: 0.75rem;
        color: var(--accent-highlight);
        display: none;
        font-family: var(--font-body);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-muted); }
    .tooltip.locked { border-color: var(--text-dim); border-left-color: var(--text-dim); }

    /* Responsive */
    @media (max-width: 900px) {
        aside { width: 260px; padding: 24px 16px; }
        .char-name { font-size: 2rem; }
        .level-number { font-size: 3rem; }
    }
</style>
</head>
<body>

    <div class="main-layout">
        <!-- Sidebar -->
        <aside>
            <div class="profile-header">
                <h2 class="char-name">Aetheris</h2>
                <div class="char-class">Void Walker</div>
            </div>

            <div class="stats-container">
                
                <!-- Skill Points (Integrated & Re-anchored) -->
                <div class="sp-indicator">
                    <span class="sp-label">
                        <!-- Star Icon -->
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z"/></svg>
                        Available Points
                    </span>
                    <span class="sp-value" id="spValue">3</span>
                </div>

                <!-- Level & XP -->
                <div class="level-section">
                    <div class="level-display">
                        <span class="level-number">42</span>
                        <span class="level-label">Level</span>
                    </div>
                    <div class="xp-container">
                        <div class="xp-bar-track">
                            <div class="xp-bar-fill"></div>
                        </div>
                        <div class="xp-text">12,450 / 20,000 XP</div>
                    </div>
                </div>

                <!-- Base Stats -->
                <div class="base-stats-grid">
                    <div class="stat-item">
                        <span class="stat-name">
                            <svg class="stat-icon" viewBox="0 0 24 24"><path d="M16 7h-2v2h2V7zm4 0h-2v2h2V7zm-4 4h-2v2h2v-2zm4 0h-2v2h2v-2zM6 12c0 3.31 2.69 6 6 6s6-2.69 6-6v-1H6v1zm12-2v-2h-2v2h2zm-4 0v-2h-2v2h2zm-4 0V7h-2v3H8V7H6v3H4v2h14v-2h-2z"/></svg>
                            STR
                        </span>
                        <span class="stat-val">14</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-name">
                            <svg class="stat-icon" viewBox="0 0 24 24"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 2 7.71v6.58l2.59-2.59L21 22l-1.43-1.43z"/></svg>
                            DEX
                        </span>
                        <span class="stat-val">28</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-name">
                            <svg class="stat-icon" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                            INT
                        </span>
                        <span class="stat-val">35</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-name">
                            <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            VIT
                        </span>
                        <span class="stat-val">12</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Skill Tree Area -->
        <div class="tree-viewport" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <!-- SVG Lines injected by JS -->
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected by JS -->
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data Configuration ---
    // Constructing a dense, interconnected grid to fill the canvas
    // Center is 1000, 1000. Nodes spread outward.
    const skills = [
        // Root
        { id: 'root', x: 1000, y: 1000, name: "Void Spark", type: "Origin", desc: "The origin of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Tier 1 (The Core)
        { id: 'str1', x: 850, y: 850, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'dex1', x: 1150, y: 850, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: true, req: 'root' },
        { id: 'int1', x: 1000, y: 800, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regen by 10%.", unlocked: true, req: 'root' },

        // Tier 2 (Branching)
        { id: 'str2', x: 700, y: 700, name: "Heavy Strike", type: "Active", desc: "Slam weapon dealing AoE damage.", unlocked: false, req: 'str1' },
        { id: 'dex2', x: 1300, y: 700, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: false, req: 'dex1' },
        { id: 'int2', x: 850, y: 600, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 1150, y: 600, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },

        // Tier 3 (Deepening)
        { id: 'str3', x: 550, y: 550, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        { id: 'dex3', x: 1450, y: 550, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'int4', x: 700, y: 450, name: "Meteor", type: "Ultimate", desc: "Call down a meteor shower.", unlocked: false, req: 'int2' },
        { id: 'int5', x: 1300, y: 450, name: "Ice Shards", type: "Active", desc: "Rapid fire ice shards.", unlocked: false, req: 'int3' },

        // Tier 4 (Filling the bottom void)
        { id: 'str4', x: 400, y: 400, name: "Berserker", type: "Active", desc: "Increase damage, decrease defense.", unlocked: false, req: 'str3' },
        { id: 'dex4', x: 1600, y: 400, name: "Shadow Step", type: "Active", desc: "Teleport behind enemy.", unlocked: false, req: 'dex3' },
        { id: 'hybrid1', x: 1000, y: 350, name: "Void Walk", type: "Ultimate", desc: "Teleport through shadows indefinitely.", unlocked: false, req: 'int4' }, // Connects top branches
        
        // Cross-links to make it a Matrix
        { id: 'cross1', x: 850, y: 500, name: "Resilience", type: "Passive", desc: "Reduce incoming damage by 10%.", unlocked: false, req: 'str2' }, // Connects Str to Int area
        { id: 'cross2', x: 1150, y: 500, name: "Agility", type: "Passive", desc: "Increase attack speed.", unlocked: false, req: 'dex2' }, // Connects Dex to Int area

        // Bottom Expansion (Filling the 'Dead Void')
        { id: 'bot1', x: 600, y: 1200, name: "Earthshaker", type: "Active", desc: "Stun all nearby enemies.", unlocked: false, req: 'str4' },
        { id: 'bot2', x: 1400, y: 1200, name: "Night Stalker", type: "Passive", desc: "Invisibility in shadows.", unlocked: false, req: 'dex4' },
        { id: 'bot3', x: 1000, y: 1400, name: "Singularity", type: "Ultimate", desc: "Create a black hole.", unlocked: false, req: 'hybrid1' },
        
        // Connecting the bottom
        { id: 'bot_mid', x: 1000, y: 1100, name: "Gravity Well", type: "Active", desc: "Pull enemies closer.", unlocked: false, req: 'bot1' },
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z", 
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z", 
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z",
        origin: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');
    const spValueDisplay = document.getElementById('spValue');
    
    let availablePoints = 3;

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Center on the root node (1000, 1000)
        updateTransform(cw/2 - 1000, ch/2 - 1000, 1);

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            const isAvailable = checkAvailable(skill);
            
            node.className = `node ${skill.unlocked ? 'unlocked' : (isAvailable ? 'available' : 'locked')}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.type === 'Origin') iconPath = icons.origin;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('mousemove', (e) => positionTooltip(e.clientX, e.clientY));
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawConnections();
    }

    // --- Logic ---
    function checkAvailable(skill) {
        if (skill.unlocked) return false;
        if (!skill.req) return true;
        const parent = skills.find(s => s.id === skill.req);
        return parent && parent.unlocked;
    }

    function drawConnections() {
        svg.innerHTML = ''; 
        
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    } else if (checkAvailable(skill)) {
                        line.classList.add('potential');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
            ttType.style.color = 'var(--accent-primary)';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
            ttType.style.color = 'var(--text-dim)';
        }

        tooltip.classList.add('visible');
        positionTooltip(e.clientX, e.clientY);
    }

    function positionTooltip(x, y) {
        const rect = tooltip.getBoundingClientRect();
        const winW = window.innerWidth;
        const winH = window.innerHeight;
        
        let finalX = x + 20;
        let finalY = y - 20;

        if (finalX + rect.width > winW - 20) finalX = x - rect.width - 20;
        if (finalY + rect.height > winH - 20) finalY = y - rect.height - 20;
        if (finalY < 20) finalY = 20;

        tooltip.style.left = `${finalX}px`;
        tooltip.style.top = `${finalY}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        if (!skill.unlocked && checkAvailable(skill) && availablePoints > 0) {
            skill.unlocked = true;
            availablePoints--;
            spValueDisplay.textContent = availablePoints;
            refreshVisuals();
        }
    }

    function refreshVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            el.classList.remove('unlocked', 'available', 'locked');
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else if (checkAvailable(s)) {
                el.classList.add('available');
            } else {
                el.classList.add('locked');
            }
        });
        drawConnections();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX, panY, scale = 1;

    function updateTransform(tx, ty, s) {
        panX = tx;
        panY = ty;
        scale = s;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2.5);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    init();

</script>
</body>
