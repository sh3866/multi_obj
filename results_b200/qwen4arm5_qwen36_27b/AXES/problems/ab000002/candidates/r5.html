<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascendant | Skill Matrix</title>
<style>
    :root {
        /* Palette: Obsidian & Neon */
        --bg-deep: #05070a;
        --bg-panel: rgba(12, 14, 22, 0.85);
        --bg-panel-border: rgba(60, 70, 100, 0.2);
        
        --accent-primary: #6366f1; /* Indigo */
        --accent-glow: rgba(99, 102, 241, 0.4);
        --accent-secondary: #22d3ee; /* Cyan */
        --accent-highlight: #f59e0b; /* Amber */
        
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --text-dim: #475569;

        /* Typography: System Sans for Cohesion */
        --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        
        /* Spacing Scale (Base 8px) */
        --space-xs: 8px;
        --space-sm: 16px;
        --space-md: 24px;
        --space-lg: 32px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        overflow: hidden;
        display: flex;
    }

    /* Background Texture: Subtle Grain & Vignette */
    body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #05070a 70%);
        opacity: 0.6;
        z-index: -2;
    }
    
    body::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.07'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: -1;
    }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        width: 100%;
        height: 100%;
    }

    /* --- Sidebar --- */
    aside {
        width: 300px;
        height: 100%;
        background: var(--bg-panel);
        border-right: 1px solid var(--bg-panel-border);
        display: flex;
        flex-direction: column;
        padding: var(--space-md);
        z-index: 10;
        position: relative;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    /* Header */
    .profile-header {
        margin-bottom: var(--space-lg);
        padding-bottom: var(--space-md);
        border-bottom: 1px solid var(--bg-panel-border);
    }

    .char-name {
        font-size: 1.75rem; /* Reduced size */
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: -0.02em;
        margin-bottom: var(--space-xs);
        line-height: 1.1;
    }

    .char-class {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--accent-primary);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    /* Stats Container - Strict Rhythm */
    .stats-container {
        display: flex;
        flex-direction: column;
        gap: var(--space-lg); /* 32px consistent gap */
    }

    /* Level & XP Section */
    .level-section {
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
    }

    .level-display {
        display: flex;
        align-items: baseline;
        gap: var(--space-sm);
    }

    .level-number {
        font-size: 3rem; /* Reduced from 4rem */
        line-height: 0.8;
        color: var(--text-main);
        font-weight: 800;
    }

    .level-label {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        font-weight: 600;
    }

    .xp-container {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .xp-bar-track {
        width: 100%;
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 3px;
        overflow: hidden;
    }

    .xp-bar-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        box-shadow: 0 0 8px var(--accent-glow);
    }
    
    .xp-text {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 500;
        text-align: right;
    }

    /* Skill Points Indicator (Softened) */
    .sp-indicator {
        background: rgba(245, 158, 11, 0.05); /* Very subtle amber bg */
        border: 1px solid rgba(245, 158, 11, 0.2);
        border-radius: var(--space-sm);
        padding: var(--space-sm);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .sp-label {
        color: var(--accent-highlight);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .sp-value {
        font-size: 1.5rem;
        color: var(--accent-highlight);
        font-weight: 700;
    }

    /* Base Stats Grid - Hexagonal Cards */
    .base-stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-sm);
    }

    .stat-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px 0; /* Increased padding */
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.05);
        /* Hexagon shape for stat cards to match nodes */
        clip-path: polygon(15% 0%, 100% 0%, 100% 85%, 85% 100%, 0% 100%, 0% 15%);
        transition: all 0.2s;
        position: relative;
    }
    
    .stat-item:hover {
        background: rgba(255,255,255,0.04);
        border-color: var(--accent-primary);
    }

    .stat-name {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
    }
    
    .stat-val {
        font-size: 1.25rem;
        color: var(--text-main);
        font-weight: 700;
    }

    /* --- Tree Area --- */
    .tree-viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        /* Center gradient */
        background: radial-gradient(circle at center, rgba(30, 41, 59, 0.15) 0%, rgba(5, 7, 10, 0) 60%);
    }

    .tree-viewport:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform-origin: 0 0;
    }

    /* SVG Connections */
    svg.connections {
        position: absolute;
        top: -2000px;
        left: -2000px;
        width: 5000px;
        height: 5000px;
        overflow: visible;
        pointer-events: none;
        z-index: 1;
    }

    /* Lines with Glow Filter */
    .connection-line {
        stroke: rgba(255, 255, 255, 0.05);
        stroke-width: 4;
        fill: none;
        stroke-linecap: round;
        transition: stroke 0.5s ease, filter 0.5s ease;
    }

    .connection-line.active {
        stroke: var(--accent-secondary);
        filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.6));
    }
    
    .connection-line.potential {
        stroke: rgba(99, 102, 241, 0.4);
        stroke-dasharray: 8, 4;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        width: 72px;
        height: 72px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .node:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }

    /* Hexagon Shape */
    .node-shape {
        width: 100%;
        height: 100%;
        background: #0f101a;
        border: 2px solid rgba(255,255,255,0.15); /* Thicker border */
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    .node-icon {
        width: 28px;
        height: 28px;
        fill: var(--text-dim);
        opacity: 0.6;
        z-index: 2;
        transition: all 0.3s ease;
    }

    /* State: Unlocked */
    .node.unlocked .node-shape {
        border-color: var(--accent-primary);
        background: rgba(99, 102, 241, 0.2);
        box-shadow: 0 0 20px var(--accent-glow);
    }
    
    .node.unlocked .node-icon {
        fill: #fff;
        filter: drop-shadow(0 0 4px var(--accent-primary));
        opacity: 1;
    }

    /* State: Available (Enhanced Contrast) */
    .node.available .node-shape {
        border: 3px solid var(--accent-highlight); /* Thicker border */
        background: rgba(245, 158, 11, 0.1);
        box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
        animation: pulse-amber 2s infinite;
    }

    .node.available .node-icon {
        fill: var(--accent-highlight);
        opacity: 1;
    }

    @keyframes pulse-amber {
        0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
        70% { box-shadow: 0 0 0 12px rgba(245, 158, 11, 0); }
        100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }

    /* State: Locked */
    .node.locked .node-shape {
        background: rgba(0,0,0,0.4);
        border-color: rgba(255,255,255,0.05);
    }
    
    .node.locked .node-icon {
        fill: #1e293b;
        opacity: 0.3;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(10, 12, 18, 0.95);
        border: 1px solid var(--bg-panel-border);
        padding: 20px;
        width: 260px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        backdrop-filter: blur(12px);
        border-left: 3px solid var(--accent-primary);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        color: var(--text-main);
        font-size: 1.25rem;
        margin-bottom: 4px;
        font-weight: 700;
    }

    .tooltip .type {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--accent-secondary);
        margin-bottom: 10px;
        letter-spacing: 0.1em;
        font-weight: 700;
    }

    .tooltip p {
        font-size: 0.85rem;
        line-height: 1.5;
        color: #cbd5e1;
        font-weight: 400;
    }

    .tooltip .req {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(255,255,255,0.1);
        font-size: 0.7rem;
        color: var(--accent-highlight);
        display: none;
        text-transform: uppercase;
        font-weight: 600;
    }

    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-muted); }
    .tooltip.locked { border-left-color: var(--text-dim); }

    /* Responsive */
    @media (max-width: 900px) {
        aside { width: 260px; padding: var(--space-sm); }
        .char-name { font-size: 1.5rem; }
        .level-number { font-size: 2.5rem; }
    }
</style>
</head>
<body>

    <div class="main-layout">
        <!-- Sidebar -->
        <aside>
            <div class="profile-header">
                <h2 class="char-name">Aetheris</h2>
                <div class="char-class">Void Walker</div>
            </div>

            <div class="stats-container">
                
                <!-- Skill Points (Softened, Integrated) -->
                <div class="sp-indicator">
                    <span class="sp-label">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z"/></svg>
                        Points
                    </span>

                <!-- Level & XP -->
                <div class="level-section">
                    <div class="level-display">

                        <span class="level-label">Level</span>
                    </div>
                    <div class="xp-container">
                        <div class="xp-bar-track">
                            <div class="xp-bar-fill"></div>
                        </div>
                        <div class="xp-text">12,450 / 20,000 XP</div>
                    </div>
                </div>

                <!-- Base Stats Grid (Hexagonal Cards) -->
                <div class="base-stats-grid">
                    <div class="stat-item">
                        <span class="stat-name">STR</span>
                        <span class="stat-val">14</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-name">DEX</span>
                        <span class="stat-val">28</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-name">INT</span>
                        <span class="stat-val">35</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-name">VIT</span>
                        <span class="stat-val">12</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Skill Tree Area -->
        <div class="tree-viewport" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <!-- SVG Lines injected by JS -->
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected by JS -->
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data Configuration ---
    // Strict Hexagonal Grid Logic
    // Center: 1000, 1000
    // Radius (Distance between nodes): 140px
    // Angles: 0, 60, 120, 180, 240, 300 degrees
    const skills = [
        // Root
        { id: 'root', x: 1000, y: 1000, name: "Void Spark", type: "Origin", desc: "The origin of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Tier 1 (Ring 1)
        { id: 'str1', x: 1000, y: 860, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' }, // Up
        { id: 'dex1', x: 1121.2, y: 930, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: true, req: 'root' }, // Up-Right
        { id: 'int1', x: 1121.2, y: 1070, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regen by 10%.", unlocked: true, req: 'root' }, // Down-Right
        { id: 'vit1', x: 1000, y: 1140, name: "Iron Skin", type: "Passive", desc: "Increases Max HP by 10%.", unlocked: true, req: 'root' }, // Down
        { id: 'agi1', x: 878.8, y: 1070, name: "Nimble", type: "Passive", desc: "Increases Dodge chance.", unlocked: true, req: 'root' }, // Down-Left
        { id: 'mag1', x: 878.8, y: 930, name: "Mana Flow", type: "Passive", desc: "Reduces skill cooldowns.", unlocked: true, req: 'root' }, // Up-Left

        // Tier 2 (Ring 2 - Branching out)
        { id: 'str2', x: 1000, y: 720, name: "Heavy Strike", type: "Active", desc: "Slam weapon dealing AoE damage.", unlocked: false, req: 'str1' },
        { id: 'dex2', x: 1242.4, y: 860, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: false, req: 'dex1' },
        { id: 'int2', x: 1242.4, y: 1140, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: false, req: 'int1' },
        { id: 'vit2', x: 1000, y: 1280, name: "Regeneration", type: "Passive", desc: "Heal 2% HP per second.", unlocked: false, req: 'vit1' },
        { id: 'agi2', x: 757.6, y: 1140, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'agi1' },
        { id: 'mag2', x: 757.6, y: 860, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'mag1' },

        // Tier 3 (Deepening)
        { id: 'str3', x: 1000, y: 580, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        { id: 'dex3', x: 1363.6, y: 790, name: "Shadow Step", type: "Active", desc: "Teleport behind enemy.", unlocked: false, req: 'dex2' },
        { id: 'int3', x: 1242.4, y: 1280, name: "Meteor", type: "Ultimate", desc: "Call down a meteor shower.", unlocked: false, req: 'int2' },
        { id: 'vit3', x: 1121.2, y: 1350, name: "Berserker", type: "Active", desc: "Increase damage, decrease defense.", unlocked: false, req: 'vit2' },
        { id: 'agi3', x: 636.4, y: 1210, name: "Night Stalker", type: "Passive", desc: "Invisibility in shadows.", unlocked: false, req: 'agi2' },
        { id: 'mag3', x: 636.4, y: 790, name: "Ice Shards", type: "Active", desc: "Rapid fire ice shards.", unlocked: false, req: 'mag2' },

        // Cross-links for matrix feel
        { id: 'cross1', x: 878.8, y: 1210, name: "Resilience", type: "Passive", desc: "Reduce incoming damage by 10%.", unlocked: false, req: 'vit2' },
        { id: 'cross2', x: 1121.2, y: 790, name: "Agility", type: "Passive", desc: "Increase attack speed.", unlocked: false, req: 'str2' },
        
        // Top Center Ultimate
        { id: 'ult_top', x: 1000, y: 440, name: "Singularity", type: "Ultimate", desc: "Create a black hole.", unlocked: false, req: 'str3' },
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z", 
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z", 
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z",
        origin: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');
    const spValueDisplay = document.getElementById('spValue');
    
    let availablePoints = 3;

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Center on the root node (1000, 1000)
        updateTransform(cw/2 - 1000, ch/2 - 1000, 1);

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            const isAvailable = checkAvailable(skill);
            
            node.className = `node ${skill.unlocked ? 'unlocked' : (isAvailable ? 'available' : 'locked')}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.type === 'Origin') iconPath = icons.origin;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('mousemove', (e) => positionTooltip(e.clientX, e.clientY));
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawConnections();
    }

    // --- Logic ---
    function checkAvailable(skill) {
        if (skill.unlocked) return false;
        if (!skill.req) return true;
        const parent = skills.find(s => s.id === skill.req);
        return parent && parent.unlocked;
    }

    function drawConnections() {
        svg.innerHTML = ''; 
        
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    } else if (checkAvailable(skill)) {
                        line.classList.add('potential');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
            ttType.style.color = 'var(--accent-primary)';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
            ttType.style.color = 'var(--text-dim)';
        }

        tooltip.classList.add('visible');
        positionTooltip(e.clientX, e.clientY);
    }

    function positionTooltip(x, y) {
        const rect = tooltip.getBoundingClientRect();
        const winW = window.innerWidth;
        const winH = window.innerHeight;
        
        let finalX = x + 20;
        let finalY = y - 20;

        if (finalX + rect.width > winW - 20) finalX = x - rect.width - 20;
        if (finalY + rect.height > winH - 20) finalY = y - rect.height - 20;
        if (finalY < 20) finalY = 20;

        tooltip.style.left = `${finalX}px`;
        tooltip.style.top = `${finalY}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        if (!skill.unlocked && checkAvailable(skill) && availablePoints > 0) {
            skill.unlocked = true;
            availablePoints--;
            spValueDisplay.textContent = availablePoints;
            refreshVisuals();
        }
    }

    function refreshVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            el.classList.remove('unlocked', 'available', 'locked');
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else if (checkAvailable(s)) {
                el.classList.add('available');
            } else {
                el.classList.add('locked');
            }
        });
        drawConnections();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX, panY, scale = 1;

    function updateTransform(tx, ty, s) {
        panX = tx;
        panY = ty;
        scale = s;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2.5);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    init();

</script>
</body>
</html>
