<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Walker Skill Matrix</title>
<style>
    :root {
        /* Void Theme Palette */
        --bg-deep: #050508;
        --bg-panel: rgba(15, 15, 25, 0.85);
        --bg-panel-border: rgba(100, 116, 139, 0.2);
        
        /* Accents */
        --accent-cyan: #00f3ff;
        --accent-violet: #7c3aed;
        --accent-glow-cyan: rgba(0, 243, 255, 0.5);
        --accent-glow-violet: rgba(124, 58, 237, 0.6);
        
        /* Text */
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-dim: #64748b;
        
        /* Typography */
        --font-display: 'Times New Roman', 'Didot', 'Georgia', serif;
        --font-body: 'Inter', 'Segoe UI', 'Roboto', sans-serif;
        --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        /* Subtle noise texture overlay */
        background-image: 
            radial-gradient(circle at 50% 50%, #16162e 0%, #050508 80%),
            url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        height: 100%;
        position: relative;
    }

    /* --- Sidebar (25% Width) --- */
    aside {
        width: 25%;
        min-width: 320px;
        background: linear-gradient(180deg, rgba(10, 10, 20, 0.95) 0%, rgba(20, 20, 40, 0.9) 100%);
        border-right: 1px solid var(--bg-panel-border);
        padding: 40px;
        display: flex;
        flex-direction: column;
        z-index: 10;
        position: relative;
        box-shadow: 10px 0 30px rgba(0,0,0,0.5);
    }

    /* Sidebar Content Grouping */
    .profile-header {
        margin-bottom: 40px;
        border-bottom: 1px solid var(--bg-panel-border);
        padding-bottom: 20px;
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 2rem;
        font-weight: 400;
        color: var(--text-main);
        letter-spacing: 0.05em;
        margin-bottom: 5px;
    }

    .char-class {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--accent-cyan);
        text-shadow: 0 0 8px var(--accent-glow-cyan);
        margin-bottom: 25px;
    }

    /* Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 25px;
    }

    /* Level & XP Block */
    .stat-block {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .level-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
    }

    .level-num {
        font-family: var(--font-mono);
        font-size: 3rem;
        line-height: 1;
        color: var(--text-main);
    }

    .level-label {
        font-size: 0.9rem;
        text-transform: uppercase;
        color: var(--text-muted);
        font-weight: 600;
    }

    .xp-container {
        margin-top: 5px;
    }

    .xp-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        color: var(--text-dim);
        margin-bottom: 6px;
        font-family: var(--font-mono);
    }

    .xp-bar-bg {
        height: 6px;
        background: rgba(255,255,255,0.05);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
    }

    .xp-bar-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--accent-violet), var(--accent-cyan));
        box-shadow: 0 0 15px var(--accent-glow-cyan);
        position: relative;
    }

    /* Skill Points Block */
    .points-block {
        background: rgba(0, 243, 255, 0.03);
        border: 1px solid rgba(0, 243, 255, 0.1);
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 4px;
    }

    .points-label {
        font-size: 0.9rem;
        color: var(--text-muted);
        font-weight: 500;
    }

    .points-val {
        font-family: var(--font-mono);
        font-size: 2rem;
        color: var(--accent-cyan);
        text-shadow: 0 0 10px var(--accent-glow-cyan);
    }

    /* Base Stats List */
    .base-stats {
        margin-top: 20px;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 0.9rem;
        border-bottom: 1px solid rgba(255,255,255,0.03);
        padding-bottom: 4px;
    }
    
    .stat-row span:first-child { 
        color: var(--text-muted); 
        font-weight: 500;
    }
    
    .stat-row span:last-child { 
        font-family: var(--font-mono);
        color: var(--text-main); 
    }

    /* --- Tree Area (75% Width) --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, rgba(20, 20, 40, 0.4) 0%, rgba(5, 5, 8, 0) 70%);
    }

    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* Center the coordinate system */
        transform-origin: 0 0;
    }

    /* SVG Connections */
    svg.connections {
        position: absolute;
        top: -500px;
        left: -500px;
        width: 2000px;
        height: 2000px;
        overflow: visible;
        pointer-events: none;
        z-index: 1;
    }

    .connection-line {
        stroke: rgba(100, 116, 139, 0.2);
        stroke-width: 2;
        fill: none;
        transition: stroke 0.5s ease, filter 0.5s ease;
    }

    .connection-line.active {
        stroke: var(--accent-cyan);
        stroke-width: 3;
        filter: drop-shadow(0 0 4px var(--accent-glow-cyan));
    }

    .connection-line.potential {
        stroke: rgba(100, 116, 139, 0.4);
        stroke-dasharray: 5, 5;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        width: 64px;
        height: 64px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .node-shape {
        width: 100%;
        height: 100%;
        background: rgba(10, 10, 15, 0.9);
        border: 1px solid var(--text-dim);
        border-radius: 50%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* Outer Ring for aesthetics */
    .node-shape::before {
        content: '';
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.05);
        transition: all 0.3s ease;
    }

    .node-icon {
        width: 28px;
        height: 28px;
        fill: var(--text-dim);
        opacity: 0.7;
        transition: all 0.3s ease;
    }

    /* State: Unlocked (Active) */
    .node.unlocked .node-shape {
        border-color: var(--accent-cyan);
        background: radial-gradient(circle at 30% 30%, rgba(0, 243, 255, 0.15), rgba(10, 10, 15, 1));
        box-shadow: 0 0 20px var(--accent-glow-cyan), inset 0 0 10px var(--accent-glow-cyan);
    }
    
    .node.unlocked .node-shape::before {
        border-color: rgba(0, 243, 255, 0.3);
    }

    .node.unlocked .node-icon {
        fill: var(--text-main);
        filter: drop-shadow(0 0 5px var(--accent-cyan));
        opacity: 1;
    }

    /* State: Available (Hoverable) */
    .node.available {
        cursor: pointer;
    }
    
    .node.available .node-shape {
        border-color: var(--text-muted);
        background: rgba(30, 41, 59, 0.8);
    }

    .node.available:hover .node-shape {
        transform: scale(1.15);
        border-color: var(--accent-cyan);
        box-shadow: 0 0 15px var(--accent-glow-cyan);
    }
    
    .node.available:hover .node-icon {
        fill: var(--accent-cyan);
    }

    /* State: Locked */
    .node.locked .node-shape {
        border-color: #334155;
        background: #0f172a;
    }
    
    .node.locked .node-icon {
        fill: #334155;
        opacity: 0.4;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(5, 5, 10, 0.95);
        border: 1px solid var(--accent-cyan);
        padding: 20px;
        width: 300px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        backdrop-filter: blur(8px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        color: var(--text-main);
        font-family: var(--font-display);
        font-size: 1.4rem;
        margin-bottom: 4px;
        letter-spacing: 0.02em;
    }

    .tooltip .type {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--accent-cyan);
        margin-bottom: 12px;
        letter-spacing: 0.1em;
        font-weight: 600;
    }

    .tooltip p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #cbd5e1;
        font-weight: 300;
    }

    .tooltip .req {
        margin-top: 15px;
        padding-top: 10px;
        border-top: 1px solid rgba(255,255,255,0.1);
        font-size: 0.75rem;
        color: #ef4444;
        display: none;
        font-family: var(--font-mono);
    }

    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-dim); }
    .tooltip.locked { border-color: var(--text-dim); }

    /* --- Responsive Adjustments --- */
    @media (max-width: 1024px) {
        aside { width: 320px; }
    }
</style>
</head>
<body>

    <div class="main-layout">
        <!-- Sidebar -->
        <aside>
            <div class="profile-header">
                <h2 class="char-name">Kaelen Thorne</h2>
                <div class="char-class">Void Walker</div>
            </div>

            <div class="stats-grid">
                <!-- Level & XP -->
                <div class="stat-block">
                    <div class="level-row">
                        <span class="level-num">42</span>
                        <span class="level-label">Level</span>
                    </div>
                    <div class="xp-container">
                        <div class="xp-labels">
                            <span>XP PROGRESS</span>
                            <span>12,450 / 20,000</span>
                        </div>
                        <div class="xp-bar-bg">
                            <div class="xp-bar-fill"></div>
                        </div>
                    </div>
                </div>

                <!-- Skill Points -->
                <div class="points-block">
                    <span class="points-label">AVAILABLE POINTS</span>
                    <span class="points-val">3</span>
                </div>

                <!-- Base Stats -->
                <div class="base-stats">
                    <div class="stat-row"><span>Strength</span><span>14</span></div>
                    <div class="stat-row"><span>Dexterity</span><span>28</span></div>
                    <div class="stat-row"><span>Intelligence</span><span>35</span></div>
                    <div class="stat-row"><span>Vitality</span><span>12</span></div>
                </div>
            </div>
        </aside>

        <!-- Skill Tree Area -->
        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <!-- SVG Lines injected by JS -->
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected by JS -->
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data Configuration ---
    // Coordinates are centered around 500,500 in the SVG space
    const skills = [
        { id: 'root', x: 500, y: 500, name: "Void Spark", type: "Passive", desc: "The origin of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Branch 1: Strength
        { id: 'str1', x: 350, y: 400, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'str2', x: 200, y: 350, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str3', x: 150, y: 500, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        { id: 'str4', x: 200, y: 650, name: "Seismic Slam", type: "Active", desc: "Stun enemies in a large radius.", unlocked: false, req: 'str3' },

        // Branch 2: Agility
        { id: 'dex1', x: 650, y: 400, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: true, req: 'root' },
        { id: 'dex2', x: 800, y: 350, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 850, y: 500, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 800, y: 650, name: "Shadow Step", type: "Active", desc: "Teleport short distance.", unlocked: false, req: 'dex3' },

        // Branch 3: Intellect (Center)
        { id: 'int1', x: 500, y: 250, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", unlocked: false, req: 'root' },
        { id: 'int2', x: 400, y: 150, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 600, y: 150, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        
        // Ultimate
        { id: 'ult', x: 500, y: 750, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows indefinitely for 5s.", unlocked: false, req: 'dex4' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z", // Star
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z", // Bolt
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z" // Eye/Circle
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        // Center the world initially
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Initial center transform
        updateTransform(cw/2, ch/2, 1);

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            const isAvailable = checkAvailable(skill);
            
            node.className = `node ${skill.unlocked ? 'unlocked' : (isAvailable ? 'available' : 'locked')}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Determine Icon
            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawConnections();
    }

    // --- Logic ---
    function checkAvailable(skill) {
        if (skill.unlocked) return false;
        if (!skill.req) return true;
        const parent = skills.find(s => s.id === skill.req);
        return parent && parent.unlocked;
    }

    function drawConnections() {
        svg.innerHTML = ''; // Clear lines
        
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    } else if (checkAvailable(skill)) {
                        line.classList.add('potential');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `REQUIRES: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        positionTooltip(e.clientX, e.clientY);
    }

    function positionTooltip(x, y) {
        // Keep tooltip within viewport
        const rect = tooltip.getBoundingClientRect();
        const winW = window.innerWidth;
        const winH = window.innerHeight;
        
        let finalX = x + 20;
        let finalY = y - 20;

        if (finalX + rect.width > winW - 20) finalX = x - rect.width - 20;
        if (finalY + rect.height > winH - 20) finalY = y - rect.height - 20;
        if (finalY < 20) finalY = 20;

        tooltip.style.left = `${finalX}px`;
        tooltip.style.top = `${finalY}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        // Logic: If unlocked, do nothing (or reset). If available, unlock.
        if (!skill.unlocked && checkAvailable(skill)) {
            skill.unlocked = true;
            refreshVisuals();
        }
    }

    function refreshVisuals() {
        // Update Nodes
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            el.classList.remove('unlocked', 'available', 'locked');
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else if (checkAvailable(s)) {
                el.classList.add('available');
            } else {
                el.classList.add('locked');
            }
        });
        drawConnections();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    
    // Initial State
    let panX = container.clientWidth/2 - 500; // Offset to center 500,500
    let panY = container.clientHeight/2 - 500;
    let scale = 1;

    function updateTransform(tx, ty, s) {
        panX = tx;
        panY = ty;
        scale = s;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2.5);
        
        // Zoom towards mouse pointer
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    // Handle Resize
    window.addEventListener('resize', () => {
        // Optional: re-center logic if needed, currently keeps offset
    });

    init();

</script>
</body>
</html>
