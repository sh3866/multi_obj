<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Walker | Skill Matrix</title>
<style>
    :root {
        /* Identity Palette: Deep Void & Ethereal Violet */
        --bg-deep: #030305;
        --bg-panel: rgba(10, 12, 20, 0.65);
        --bg-panel-border: rgba(100, 100, 140, 0.15);
        
        --accent-primary: #8b5cf6; /* Violet */
        --accent-glow: rgba(139, 92, 246, 0.5);
        --accent-bright: #d8b4fe;
        
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-dim: #475569;
        
        /* Typography */
        --font-header: "Times New Roman", "Didot", "Georgia", serif;
        --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
    }

    /* Background Texture (Starfield/Noise) */
    body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: 
            radial-gradient(circle at 50% 50%, #110a1f 0%, #030305 100%);
        z-index: -2;
    }
    
    body::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        opacity: 0.4;
        pointer-events: none;
        z-index: -1;
    }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        width: 100%;
        height: 100%;
    }

    /* --- Sidebar --- */
    aside {
        width: 360px; /* Fixed width for stability */
        height: 100%;
        background: linear-gradient(180deg, rgba(15, 15, 25, 0.95) 0%, rgba(5, 5, 10, 0.9) 100%);
        border-right: 1px solid var(--bg-panel-border);
        display: flex;
        flex-direction: column;
        padding: 48px 40px;
        z-index: 10;
        position: relative;
        backdrop-filter: blur(10px);
    }

    /* Top Header Area (Identity) */
    .profile-header {
        margin-bottom: 64px; /* 8pt grid spacing */
        position: relative;
    }

    .char-name {
        font-family: var(--font-header);
        font-size: 2.2rem;
        font-weight: 400;
        color: var(--text-main);
        letter-spacing: 0.02em;
        margin-bottom: 8px;
        line-height: 1.1;
    }

    .char-class {
        font-family: var(--font-body);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        color: var(--accent-primary);
        font-weight: 600;
        text-shadow: 0 0 12px var(--accent-glow);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .char-class::before {
        content: '';
        display: block;
        width: 8px;
        height: 1px;
        background: var(--accent-primary);
        box-shadow: 0 0 5px var(--accent-primary);
    }

    /* Stats Container - Unifying Hierarchy */
    .stats-container {
        display: flex;
        flex-direction: column;
        gap: 48px; /* Consistent rhythm */
    }

    /* Level & XP Section */
    .level-section {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .level-display {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
    }

    .level-number {
        font-family: var(--font-header);
        font-size: 4rem;
        line-height: 0.8;
        color: var(--text-main);
        background: linear-gradient(180deg, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .level-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-muted);
    }

    .xp-bar-track {
        width: 100%;
        height: 4px;
        background: rgba(255,255,255,0.08);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
    }

    .xp-bar-fill {
        height: 100%;
        width: 65%;
        background: var(--accent-primary);
        box-shadow: 0 0 10px var(--accent-glow);
        position: relative;
    }
    
    .xp-bar-fill::after {
        content: '';
        position: absolute;
        right: 0;
        top: -2px;
        bottom: -2px;
        width: 2px;
        background: #fff;
        box-shadow: 0 0 8px #fff;
    }

    .xp-text {
        font-size: 0.75rem;
        color: var(--text-dim);
        text-align: right;
        margin-top: 4px;
    }

    /* Skill Points - Integrated into top flow */
    .points-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(139, 92, 246, 0.08);
        border: 1px solid rgba(139, 92, 246, 0.2);
        padding: 20px 24px;
        border-radius: 4px;
        position: relative;
        overflow: hidden;
    }
    
    .points-container::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 4px; height: 100%;
        background: var(--accent-primary);
    }

    .points-label {
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 500;
    }

    .points-value {
        font-family: var(--font-header);
        font-size: 2rem;
        color: var(--accent-bright);
        text-shadow: 0 0 10px var(--accent-glow);
    }

    /* Base Stats Grid */
    .base-stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
    }

    .stat-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .stat-name {
        font-size: 0.75rem;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .stat-val {
        font-size: 1.25rem;
        color: var(--text-main);
        font-weight: 300;
    }

    /* --- Tree Area --- */
    .tree-viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, rgba(30, 20, 50, 0.1) 0%, rgba(3, 3, 5, 0) 70%);
    }

    .tree-viewport:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform-origin: 0 0;
    }

    /* SVG Connections */
    svg.connections {
        position: absolute;
        top: -1000px;
        left: -1000px;
        width: 3000px;
        height: 3000px;
        overflow: visible;
        pointer-events: none;
        z-index: 1;
    }

    .connection-line {
        stroke: rgba(255, 255, 255, 0.05);
        stroke-width: 2;
        fill: none;
        transition: stroke 0.5s ease, filter 0.5s ease, stroke-dashoffset 1s ease;
    }

    .connection-line.active {
        stroke: var(--accent-primary);
        stroke-width: 2;
        filter: drop-shadow(0 0 6px var(--accent-glow));
    }
    
    .connection-line.potential {
        stroke: rgba(255, 255, 255, 0.15);
        stroke-dasharray: 4, 4;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        width: 72px;
        height: 72px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .node-shape {
        width: 100%;
        height: 100%;
        background: rgba(5, 5, 8, 0.8);
        border: 1px solid rgba(255,255,255,0.1);
        /* Hexagon Clip Path */
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    /* Inner Glow/Border Effect via pseudo element */
    .node-shape::after {
        content: '';
        position: absolute;
        inset: 2px;
        background: #050508;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        z-index: -1;
        transition: background 0.3s ease;
    }

    .node-icon {
        width: 24px;
        height: 24px;
        fill: var(--text-dim);
        opacity: 0.6;
        z-index: 2;
        transition: all 0.3s ease;
    }

    /* State: Unlocked */
    .node.unlocked .node-shape {
        border-color: var(--accent-primary);
        background: rgba(139, 92, 246, 0.15);
        box-shadow: 0 0 25px var(--accent-glow);
    }
    
    .node.unlocked .node-shape::after {
        background: rgba(139, 92, 246, 0.05);
    }

    .node.unlocked .node-icon {
        fill: var(--text-main);
        filter: drop-shadow(0 0 4px var(--accent-primary));
        opacity: 1;
    }

    /* State: Available */
    .node.available .node-shape {
        border-color: rgba(255,255,255,0.3);
    }

    .node.available:hover .node-shape {
        transform: scale(1.1);
        border-color: var(--accent-bright);
        box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }
    
    .node.available:hover .node-icon {
        fill: var(--text-main);
        transform: scale(1.1);
    }

    /* State: Locked */
    .node.locked .node-shape {
        background: rgba(0,0,0,0.3);
        border-color: rgba(255,255,255,0.02);
    }
    
    .node.locked .node-icon {
        fill: #1e293b;
        opacity: 0.3;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(8, 8, 12, 0.95);
        border: 1px solid rgba(139, 92, 246, 0.3);
        padding: 24px;
        width: 280px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        border-left: 2px solid var(--accent-primary);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        color: var(--text-main);
        font-family: var(--font-header);
        font-size: 1.5rem;
        margin-bottom: 6px;
        font-weight: 400;
    }

    .tooltip .type {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--accent-primary);
        margin-bottom: 16px;
        letter-spacing: 0.15em;
        font-weight: 700;
    }

    .tooltip p {
        font-size: 0.9rem;
        line-height: 1.6;
        color: #cbd5e1;
        font-weight: 300;
    }

    .tooltip .req {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid rgba(255,255,255,0.05);
        font-size: 0.7rem;
        color: #ef4444;
        display: none;
        font-family: var(--font-body);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-dim); }
    .tooltip.locked { border-color: var(--text-dim); border-left-color: #334155; }

    /* Responsive */
    @media (max-width: 900px) {
        aside { width: 300px; padding: 32px; }
        .char-name { font-size: 1.8rem; }
    }
</style>
</head>
<body>

    <div class="main-layout">
        <!-- Sidebar -->
        <aside>
            <div class="profile-header">
                <h2 class="char-name">Kaelen Thorne</h2>
                <div class="char-class">Void Walker</div>
            </div>

            <div class="stats-container">
                <!-- Skill Points (Moved Up) -->
                <div class="points-container">
                    <span class="points-label">Available Points</span>
                    <span class="points-value">3</span>
                </div>

                <!-- Level & XP -->
                <div class="level-section">
                    <div class="level-display">
                        <span class="level-number">42</span>
                        <span class="level-label">Level</span>
                    </div>
                    <div class="xp-bar-track">
                        <div class="xp-bar-fill"></div>
                    </div>
                    <div class="xp-text">12,450 / 20,000 XP</div>
                </div>

                <!-- Base Stats (Grid Layout) -->
                <div class="base-stats-grid">
                    <div class="stat-item">
                        <span class="stat-name">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99z"/></svg>
                            Strength
                        </span>
                        <span class="stat-val">14</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-name">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                            Dexterity
                        </span>
                        <span class="stat-val">28</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-name">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>
                            Intelligence
                        </span>
                        <span class="stat-val">35</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-name">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            Vitality
                        </span>
                        <span class="stat-val">12</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Skill Tree Area -->
        <div class="tree-viewport" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <!-- SVG Lines injected by JS -->
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected by JS -->
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data Configuration ---
    // Expanded layout to fill screen better (Coordinates centered around 1000,1000)
    const skills = [
        // Root
        { id: 'root', x: 1000, y: 1000, name: "Void Spark", type: "Passive", desc: "The origin of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Branch 1: Strength (Left)
        { id: 'str1', x: 750, y: 800, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'str2', x: 500, y: 650, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str3', x: 300, y: 800, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        { id: 'str4', x: 150, y: 1000, name: "Seismic Slam", type: "Active", desc: "Stun enemies in a large radius.", unlocked: false, req: 'str3' },

        // Branch 2: Agility (Right)
        { id: 'dex1', x: 1250, y: 800, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: true, req: 'root' },
        { id: 'dex2', x: 1500, y: 650, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 1700, y: 800, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1850, y: 1000, name: "Shadow Step", type: "Active", desc: "Teleport short distance.", unlocked: false, req: 'dex3' },

        // Branch 3: Intellect (Top Center)
        { id: 'int1', x: 1000, y: 750, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", unlocked: false, req: 'root' },
        { id: 'int2', x: 800, y: 500, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 1200, y: 500, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        
        // Ultimate (Bottom Center)
        { id: 'ult', x: 1000, y: 1300, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows indefinitely for 5s.", unlocked: false, req: 'int1' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z", 
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z", 
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Center on the root node (1000, 1000)
        updateTransform(cw/2 - 1000, ch/2 - 1000, 1);

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            const isAvailable = checkAvailable(skill);
            
            node.className = `node ${skill.unlocked ? 'unlocked' : (isAvailable ? 'available' : 'locked')}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawConnections();
    }

    // --- Logic ---
    function checkAvailable(skill) {
        if (skill.unlocked) return false;
        if (!skill.req) return true;
        const parent = skills.find(s => s.id === skill.req);
        return parent && parent.unlocked;
    }

    function drawConnections() {
        svg.innerHTML = ''; 
        
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    } else if (checkAvailable(skill)) {
                        line.classList.add('potential');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        positionTooltip(e.clientX, e.clientY);
    }

    function positionTooltip(x, y) {
        const rect = tooltip.getBoundingClientRect();
        const winW = window.innerWidth;
        const winH = window.innerHeight;
        
        let finalX = x + 20;
        let finalY = y - 20;

        if (finalX + rect.width > winW - 20) finalX = x - rect.width - 20;
        if (finalY + rect.height > winH - 20) finalY = y - rect.height - 20;
        if (finalY < 20) finalY = 20;

        tooltip.style.left = `${finalX}px`;
        tooltip.style.top = `${finalY}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        if (!skill.unlocked && checkAvailable(skill)) {
            skill.unlocked = true;
            refreshVisuals();
        }
    }

    function refreshVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            el.classList.remove('unlocked', 'available', 'locked');
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else if (checkAvailable(s)) {
                el.classList.add('available');
            } else {
                el.classList.add('locked');
            }
        });
        drawConnections();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX, panY, scale = 1;

    function updateTransform(tx, ty, s) {
        panX = tx;
        panY = ty;
        scale = s;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2.5);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    init();

</script>
</body>
</html>
