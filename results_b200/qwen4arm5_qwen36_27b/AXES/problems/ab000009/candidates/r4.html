<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* 
               Palette: Classic Luxury 
               Deep Emerald Green & Warm Ivory for the board.
               Dark Slate/Charcoal for the UI to contrast.
               Muted Gold for accents.
            */
            --bg-body: #0f1115;
            --bg-panel: #181b21;
            --bg-panel-card: #22262e;
            
            --text-main: #f0f2f5;
            --text-muted: #9ca3af;
            
            --board-light: #e8ebef; /* Warm Ivory */
            --board-dark: #457b5d;  /* Deep Emerald */
            
            --accent-gold: #c29d59;
            --accent-gold-hover: #d4b370;
            
            --highlight-selected: rgba(255, 255, 255, 0.4);
            --highlight-move: rgba(255, 255, 255, 0.25);
            
            /* Typography: System Sans-Serif Stack */
            --font-ui: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Main Container */
        .app-container {
            display: flex;
            background: var(--bg-panel);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 25px 60px -12px rgba(0,0,0,0.6);
            padding: 48px;
            gap: 48px;
            max-width: 1150px;
            width: 100%;
            max-height: 95vh;
        }

        /* --- Board Section --- */
        .board-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .board-wrapper {
            position: relative;
            width: 640px;
            height: 640px;
            /* Increased padding for coordinate breathing room */
            padding: 24px; 
            background: #15171a; 
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            user-select: none;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            background: var(--board-light);
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            position: relative;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Palette Implementation */
        .square.dark { background-color: var(--board-dark); }
        
        /* Highlights */
        .square.selected { background-color: var(--highlight-selected) !important; }
        .square.last-move { background-color: var(--highlight-move) !important; }

        /* External Coordinate Labels */
        .coord-label {
            position: absolute;
            font-family: var(--font-ui);
            font-size: 12px;
            font-weight: 700;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            z-index: 10;
        }
        
        /* Rank Labels (1-8) on Left */
        .coord-rank {
            top: 0;
            left: 0;
            width: 24px; /* Matches wrapper padding */
            height: 12.5%;
            color: var(--text-muted);
            opacity: 0.6;
        }
        
        /* File Labels (a-h) on Bottom */
        .coord-file {
            bottom: 0;
            width: 12.5%;
            height: 24px; /* Matches wrapper padding */
            color: var(--text-muted);
            opacity: 0.6;
        }

        /* Pieces: SVG Integration */
        .piece {
            width: 85%;
            height: 85%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            cursor: grab;
            transition: transform 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            z-index: 2;
            /* Subtle drop shadow to lift piece from board */
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
        }
        .piece:active { cursor: grabbing; transform: scale(1.1); }

        /* --- Side Panel --- */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 340px;
            height: 640px; /* Matches board height exactly */
            justify-content: space-between; /* Distribute space */
        }

        /* Top: Status Card (Cohesive Header) */
        .status-card {
            background: var(--bg-panel-card);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.03);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center; /* Vertically center aligned */
        }

        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .turn-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--text-muted);
            box-shadow: 0 0 0 2px var(--bg-panel-card);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .turn-dot.white { background-color: #f0f2f5; }
        .turn-dot.black { background-color: #222; border: 1px solid #555; }

        .status-text {
            font-family: var(--font-ui);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }
        
        .status-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .timer {
            font-family: var(--font-ui);
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--text-main);
            background: rgba(0,0,0,0.25);
            padding: 8px 16px;
            border-radius: 6px;
            letter-spacing: 0.05em;
            font-variant-numeric: tabular-nums;
        }

        /* Action Buttons Row (Inside Header Card) */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            flex: 1;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 8px;
            font-family: var(--font-ui);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255,255,255,0.06);
            color: var(--text-main);
            border-color: rgba(255,255,255,0.1);
        }

        /* Primary Action (Gold Accent) */
        .btn-primary {
            background: var(--accent-gold);
            color: #1a1c1e;
            border: 1px solid var(--accent-gold);
        }
        .btn-primary:hover {
            background: var(--accent-gold-hover);
            border-color: var(--accent-gold-hover);
            color: #000;
        }

        /* Middle: Move History */
        .history-container {
            flex: 1; /* Fill remaining space */
            margin-top: 24px; /* 24px Gap from Header */
            background: var(--bg-panel-card);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.03);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .history-title {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            font-family: var(--font-ui);
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-main);
        }
        
        /* Scrollbar styling */
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        .move-row {
            display: flex;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .move-row:last-child { border-bottom: none; }
        
        .move-num {
            width: 30px;
            color: #555;
            font-size: 0.85em;
            font-weight: 500;
        }
        .move-white, .move-black {
            flex: 1;
            padding: 0 8px;
            cursor: pointer;
            transition: color 0.2s;
            color: var(--text-muted);
        }
        .move-white:hover, .move-black:hover { color: var(--text-main); }
        .move-white:last-child { color: var(--text-main); } /* Highlight latest move */

        /* SVG Icons */
        .icon { width: 16px; height: 16px; fill: currentColor; }

        /* Responsive */
        @media (max-width: 1050px) {
            .app-container {
                flex-direction: column;
                align-items: center;
                padding: 20px;
                overflow-y: auto;
                max-height: none;
            }
            body { overflow-y: auto; height: auto; }
            .board-wrapper { 
                width: 100%; 
                max-width: 480px; 
                height: auto; 
                aspect-ratio: 1/1; 
                margin-bottom: 30px;
                padding: 16px;
            }
            .sidebar { width: 100%; max-width: 480px; height: auto; min-height: 400px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Left: Board Section -->
    <div class="board-area">
        <div class="board-wrapper">
            <!-- Coordinate Labels (Generated by JS) -->
            <div id="coord-ranks"></div>
            <div id="coord-files"></div>
            
            <div class="board" id="chessboard">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <!-- Right: Sidebar -->
    <div class="sidebar">
        
        <!-- Top: Status & Controls Card -->
        <div class="status-card">
            <div class="status-header">
                <div>
                    <div class="turn-indicator">
                        <div class="turn-dot white" id="turnDot"></div>
                        <span class="status-text" id="statusText">White to Move</span>
                    </div>
                    <div class="status-sub">Standard • 10+0</div>
                </div>
                <div class="timer">10:00</div>
            </div>
            
            <!-- Controls moved here -->
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="resetGame()">New Game</button>
                <button class="btn" onclick="resetGame()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    Reset
                </button>
            </div>
        </div>

        <!-- Middle: Move History -->
        <div class="history-container">
            <div class="history-title">Move History</div>
            <div class="history-list" id="moveHistory">
                <!-- Moves injected here -->
            </div>
        </div>

    </div>
</div>

<script>
    // --- Data & Config ---
    
    // SVG Data URIs - Redesigned for "Premium Staunton" look
    // White: Cream/White with subtle shading/shadows via CSS filters.
    // Black: Dark Charcoal/Brown with subtle lighter stroke.
    // Using a more detailed SVG path set for better visual fidelity.

    // Helper to create SVG string with specific colors
    const createSVG = (path, fill, stroke, strokeW = 1.5) => `
        <svg viewBox="0 0 45 45" xmlns="http://www.w3.org/2000/svg">
            <g fill="${fill}" stroke="${stroke}" stroke-width="${strokeW}" stroke-linecap="round" stroke-linejoin="round">
                ${path}
            </g>
        </svg>
    `;

    const SVG_PIECES = {
        // White Pieces (Cream/White)
        wP: createSVG(`<path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="#fff" stroke="#333" stroke-width="1.5"/>`),
        wN: createSVG(`<path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/><path d="M24 18c.38 2.32-4.68 1.97-5 0 3.45-3.18 3.86-6.8 1-10-2.83 3.2-2.34 6.56-1 10"/><path d="M9.5 25.5A4.5 4.5 0 1 1 5 21a4.5 4.5 0 0 1 4.5 4.5z"/><path d="M15 15.5c-1.61 2.59-2.75 5.61-2.75 8.5" fill="none"/><path d="M35 18c1.25 2.16.5 6.25-2.5 9.5" fill="none"/>`),
        wB: createSVG(`<path d="M9 36c3.39-.97 9.11-1.45 13.5-1.45 4.39 0 10.11.48 13.5 1.45V32H9v4zm6.5-5.5c1.61 1.61 5.11 2.5 10 2.5 4.89 0 8.39-.89 10-2.5-1.61-1.61-5.11-2.5-10-2.5-4.89 0-8.39.89-10 2.5z"/><path d="M15 29c-1.61 1.61-2.5 3.5-2.5 6h20c0-2.5-.89-4.39-2.5-6-1.61-1.61-5.11-2.5-10-2.5-4.89 0-8.39.89-10 2.5z"/><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/>`),
        wR: createSVG(`<path d="M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5"/><path d="M34 14l-3 3H14l-3-3"/><path d="M31 17v12.5H14V17"/><path d="M31 29.5l1.5 2.5h-20l1.5-2.5"/><path d="M11 14h23" fill="none" stroke-linejoin="miter"/>`),
        wQ: createSVG(`<path d="M8 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM24.5 7.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM41 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM10.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM38.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5-3-15-3 15-5.5-13.5V25l-7-11 2 12zM9 26c0 2 1.5 2 2.5 4 1 2.5 1 4.5 1 4.5h20s0-2 1-4.5c1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z"/><path d="M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0"/>`),
        wK: createSVG(`<path d="M22.5 11.63V6M20 8h5"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-5 2-8 2s-4-2-8-2-4 1-8-2-4-3-8-2c-3 6 6 10.5 6 10.5v7z"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/>`),

        // Black Pieces (Charcoal)
        bP: createSVG(`<path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="#2a2a2a" stroke="#ccc" stroke-width="1.5"/>`),
        bN: createSVG(`<path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/><path d="M24 18c.38 2.32-4.68 1.97-5 0 3.45-3.18 3.86-6.8 1-10-2.83 3.2-2.34 6.56-1 10"/><path d="M9.5 25.5A4.5 4.5 0 1 1 5 21a4.5 4.5 0 0 1 4.5 4.5z"/><path d="M15 15.5c-1.61 2.59-2.75 5.61-2.75 8.5" fill="none"/><path d="M35 18c1.25 2.16.5 6.25-2.5 9.5" fill="none"/>`, '#2a2a2a', '#ccc'),
        bB: createSVG(`<path d="M9 36c3.39-.97 9.11-1.45 13.5-1.45 4.39 0 10.11.48 13.5 1.45V32H9v4zm6.5-5.5c1.61 1.61 5.11 2.5 10 2.5 4.89 0 8.39-.89 10-2.5-1.61-1.61-5.11-2.5-10-2.5-4.89 0-8.39.89-10 2.5z"/><path d="M15 29c-1.61 1.61-2.5 3.5-2.5 6h20c0-2.5-.89-4.39-2.5-6-1.61-1.61-5.11-2.5-10-2.5-4.89 0-8.39.89-10 2.5z"/><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z"/>`, '#2a2a2a', '#ccc'),
        bR: createSVG(`<path d="M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5"/><path d="M34 14l-3 3H14l-3-3"/><path d="M31 17v12.5H14V17"/><path d="M31 29.5l1.5 2.5h-20l1.5-2.5"/><path d="M11 14h23" fill="none" stroke-linejoin="miter"/>`, '#2a2a2a', '#ccc'),
        bQ: createSVG(`<path d="M8 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM24.5 7.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM41 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM10.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM38.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5-3-15-3 15-5.5-13.5V25l-7-11 2 12zM9 26c0 2 1.5 2 2.5 4 1 2.5 1 4.5 1 4.5h20s0-2 1-4.5c1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z"/><path d="M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0"/>`, '#2a2a2a', '#ccc'),
        bK: createSVG(`<path d="M22.5 11.63V6M20 8h5"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-5 2-8 2s-4-2-8-2-4 1-8-2-4-3-8-2c-3 6 6 10.5 6 10.5v7z"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/>`, '#2a2a2a', '#ccc'),
    };

    // --- State ---
    const initialBoard = [
        ['bR', 'bN', 'bB', 'bQ', 'bK', 'bB', 'bN', 'bR'],
        ['bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP'],
        ['wR', 'wN', 'wB', 'wQ', 'wK', 'wB', 'wN', 'wR']
    ];

    let board = JSON.parse(JSON.stringify(initialBoard));
    let turn = 'w'; // 'w' or 'b'
    let selectedSquare = null;
    let lastMove = null; // {from: {r,c}, to: {r,c}}

    // --- Rendering ---
    const boardEl = document.getElementById('chessboard');
    const moveHistoryEl = document.getElementById('moveHistory');
    const statusText = document.getElementById('statusText');
    const turnDot = document.getElementById('turnDot');
    const coordRanksEl = document.getElementById('coord-ranks');
    const coordFilesEl = document.getElementById('coord-files');

    function renderBoard() {
        boardEl.innerHTML = '';
        
        // Generate external coordinates
        coordRanksEl.innerHTML = '';
        coordFilesEl.innerHTML = '';
        for (let i = 0; i < 8; i++) {
            // Ranks (1-8) on left
            const rank = document.createElement('div');
            rank.className = 'coord-label coord-rank';
            rank.innerText = 8 - i;
            rank.style.top = (i * 12.5) + '%';
            coordRanksEl.appendChild(rank);

            // Files (a-h) on bottom
            const file = document.createElement('div');
            file.className = 'coord-label coord-file';
            file.innerText = String.fromCharCode(97 + i);
            file.style.left = (i * 12.5) + '%';
            coordFilesEl.appendChild(file);
        }

        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.dataset.row = r;
                square.dataset.col = c;
                square.onclick = () => handleSquareClick(r, c);

                // Highlight Last Move
                if (lastMove) {
                    if ((lastMove.from.r === r && lastMove.from.c === c) || 
                        (lastMove.to.r === r && lastMove.to.c === c)) {
                        square.classList.add('last-move');
                    }
                }

                // Piece
                const pieceCode = board[r][c];
                if (pieceCode) {
                    const piece = document.createElement('div');
                    piece.className = 'piece';
                    piece.innerHTML = SVG_PIECES[pieceCode];
                    square.appendChild(piece);
                }

                // Selection highlight
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    square.classList.add('selected');
                }

                boardEl.appendChild(square);
            }
        }
    }

    function updateStatus() {
        const player = turn === 'w' ? 'White' : 'Black';
        statusText.innerText = `${player} to Move`;
        turnDot.className = `turn-dot ${turn === 'w' ? 'white' : 'black'}`;
    }

    // --- Interaction ---
    function handleSquareClick(r, c) {
        const piece = board[r][c];
        const isOwnPiece = piece && piece.startsWith(turn);

        if (isOwnPiece) {
            // Select piece
            selectedSquare = { r, c };
            renderBoard();
        } else if (selectedSquare) {
            // Move piece (Visual only for this demo)
            movePiece(selectedSquare.r, selectedSquare.c, r, c);
        } else {
            // Clicked empty square with no selection
            selectedSquare = null;
            renderBoard();
        }
    }

    function movePiece(fromR, fromC, toR, toC) {
        const piece = board[fromR][fromC];
        
        // Update board state
        board[toR][toC] = piece;
        board[fromR][fromC] = '';
        
        lastMove = { from: {r: fromR, c: fromC}, to: {r: toR, c: toC} };

        // Add fake move to history
        addMoveToHistory(piece, fromR, fromC, toR, toC);

        // Switch turn
        turn = turn === 'w' ? 'b' : 'w';
        selectedSquare = null;
        
        renderBoard();
        updateStatus();
    }

    function addMoveToHistory(piece, fromR, fromC, toR, toC) {
        const files = 'abcdefgh';
        const ranks = '87654321';
        
        // Simple notation logic
        const pieceChar = piece[1] === 'P' ? '' : piece[1].toUpperCase();
        const notation = pieceChar + files[toC] + ranks[toR];

        const moveNum = Math.ceil((moveHistoryEl.children.length + 1) / 2);
        
        // If it's white's move (turn variable is currently 'w' before switch)
        if (turn === 'w') { 
            const row = document.createElement('div');
            row.className = 'move-row';
            row.innerHTML = `
                <div class="move-num">${moveNum}.</div>
                <div class="move-white">${notation}</div>
                <div class="move-black"></div>
            `;
            moveHistoryEl.appendChild(row);
        } else { // Black just moved
            const lastRow = moveHistoryEl.lastElementChild;
            if (lastRow) {
                lastRow.querySelector('.move-black').innerText = notation;
            }
        }
        
        // Auto scroll
        moveHistoryEl.scrollTop = moveHistoryEl.scrollHeight;
    }

    function resetGame() {
        board = JSON.parse(JSON.stringify(initialBoard));
        turn = 'w';
        selectedSquare = null;
        lastMove = null;
        moveHistoryEl.innerHTML = '';
        renderBoard();
        updateStatus();
    }

    // --- Init ---
    renderBoard();
    updateStatus();

</script>
</body>
</html>
