<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AETHER: Bioluminescent Collection</title>
<style>
  :root {
    /* Spacing Grid */
    --grid: 8px;
    --margin-top: calc(var(--grid) * 5); /* 40px */
    --margin-bottom: calc(var(--grid) * 8); /* 64px */
    
    /* Palette */
    --bg-deep: #05010a;
    --bg-surface: #0f0518;
    --primary: #ff00ff; /* Magenta */
    --primary-glow: rgba(255, 0, 255, 0.6);
    --secondary: #00f0ff; /* Cyan */
    --secondary-glow: rgba(0, 240, 255, 0.5);
    --text-main: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.6);
    
    /* UI Materials */
    --glass-bg: rgba(20, 10, 30, 0.4);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-blur: 20px;
    
    /* Typography */
    --font-rounded: 'Nunito', 'Quicksand', 'Varela Round', 'Segoe UI', system-ui, sans-serif;
    --font-display: 'Arial Black', 'Impact', 'Segoe UI Black', sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-rounded);
    overflow: hidden;
  }

  /* --- Scene Composition --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  /* 1. Depth & Atmosphere */
  .bg-gradient {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #05010a 100%);
    z-index: 0;
  }

  .ambient-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    animation: drift 20s infinite alternate ease-in-out;
    z-index: 1;
  }
  
  .orb-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--primary); }
  .orb-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: #4a00e0; animation-delay: -5s; }

  @keyframes drift {
    0% { transform: translate(0, 0); }
    100% { transform: translate(30px, 50px); }
  }

  /* Canvas Layer */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none; /* Hide default cursor */
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none; /* Let clicks pass through to canvas */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: var(--margin-top) calc(var(--grid) * 5) var(--margin-bottom);
  }

  /* --- Header: Structural Grid & Typography --- */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end; /* Align bottom of title with bottom of HUD */
    width: 100%;
    height: 80px;
    pointer-events: none;
  }

  .brand {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 2.5rem;
    margin: 0;
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: white;
    text-shadow: 0 0 30px rgba(255, 0, 255, 0.4);
    font-weight: 900;
    text-transform: uppercase;
  }

  .subtitle {
    font-family: var(--font-rounded);
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--secondary);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 6px;
    opacity: 0.9;
  }

  /* --- HUD: Membrane/Glass UI --- */
  .hud-container {
    pointer-events: auto;
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 8px 24px 8px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    border-top: 1px solid rgba(255, 255, 255, 0.15);
  }

  .hud-icon {
    width: 32px; height: 32px;
    fill: var(--secondary);
    filter: drop-shadow(0 0 5px var(--secondary-glow));
  }

  .hud-stats {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .hud-value {
    font-family: var(--font-display);
    font-size: 1.8rem;
    line-height: 1;
    color: #fff;
  }

  .hud-label {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* --- Footer: Anchored --- */
  .footer {
    display: flex;
    justify-content: center;
    width: 100%;
    pointer-events: none;
  }

  /* Button: Tangible & Polished */
  .btn-cta {
    pointer-events: auto;
    background: linear-gradient(135deg, rgba(255, 0, 255, 0.1), rgba(20, 10, 30, 0.6));
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 0, 255, 0.3);
    border-bottom: 2px solid var(--primary);
    
    color: white;
    font-family: var(--font-display);
    font-size: 1rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 16px 48px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 0 20px rgba(255, 0, 255, 0.15);
    position: relative;
    overflow: hidden;
  }

  .btn-cta::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
    border-radius: 8px 8px 0 0;
  }

  .btn-cta:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, rgba(255, 0, 255, 0.25), rgba(40, 20, 60, 0.8));
    box-shadow: 0 0 30px rgba(255, 0, 255, 0.4);
    border-color: var(--primary);
  }

  .btn-cta:active {
    transform: translateY(1px);
    box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
  }

  /* Notification */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid var(--secondary);
    color: var(--secondary);
    padding: 12px 32px;
    border-radius: 4px;
    font-family: var(--font-rounded);
    font-weight: 800;
    font-size: 1.2rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
    backdrop-filter: blur(4px);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile Adjustments */
  @media (max-width: 600px) {
    :root { --margin-top: 24px; --margin-bottom: 32px; }
    h1 { font-size: 1.8rem; }
    .hud-container { padding: 6px 16px 6px 12px; gap: 12px; }
    .hud-value { font-size: 1.4rem; }
    .btn-cta { padding: 12px 32px; font-size: 0.9rem; width: 100%; max-width: 300px; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Background Layers -->
  <div class="bg-gradient"></div>
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <h1>Aether</h1>
        <div class="subtitle">Bioluminescence Project</div>
      </div>
      
      <div class="hud-container">
        <svg class="hud-icon" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
        <div class="hud-stats">
          <div class="hud-value" id="scoreDisplay">0</div>
          <div class="hud-label">Specimens</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Sequence Captured</div>

    <!-- Footer -->
    <footer class="footer">
      <button class="btn-cta" onclick="resetGame()">Initialize Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Focus: Organic movement, bioluminescent rendering, depth of field.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let time = 0;

  // Configuration
  const COLORS = [
    { main: '#00f0ff', name: 'Cyan' }, 
    { main: '#ff00ff', name: 'Magenta' }, 
    { main: '#bd00ff', name: 'Violet' }, 
    { main: '#ff4da6', name: 'Pink' }
  ];

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    // Re-init creatures on resize to keep them on screen
    init();
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.015 + 0.01;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.92; 
      this.vy *= 0.92;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor(isForeground = false) {
      this.isForeground = isForeground;
      this.reset();
      
      // Tentacles configuration
      this.tentacles = [];
      const tentCount = isForeground ? 6 : 3;
      for(let i=0; i<tentCount; i++) {
        this.tentacles.push({
          offset: Math.random() * Math.PI * 2,
          length: Math.random() * 40 + 20,
          width: isForeground ? 3 : 1.5,
          phase: Math.random() * Math.PI
        });
      }
    }

    reset() {
      // Cluster Logic: Spawn towards center for "Living Scene" feel
      const cx = width / 2;
      const cy = height / 2;
      const spread = Math.min(width, height) * 0.35;
      
      this.x = cx + (Math.random() - 0.5) * spread * 2;
      this.y = cy + (Math.random() - 0.5) * spread * 2;

      this.vx = (Math.random() - 0.5) * (this.isForeground ? 0.8 : 0.3);
      this.vy = (Math.random() - 0.5) * (this.isForeground ? 0.8 : 0.3);
      
      // Size hierarchy
      this.radius = this.isForeground ? (Math.random() * 15 + 30) : (Math.random() * 10 + 12);
      
      const colorObj = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.color = colorObj.main;
      
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.02 + 0.01;
      this.isCaught = false;
      
      // Depth of Field Blur (simulated via context in draw)
      this.blur = this.isForeground ? 0 : 4;
    }

    update() {
      if (this.isCaught) return;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.wobble += this.wobbleSpeed;
      
      // Organic drift (sine waves)
      this.x += Math.sin(this.wobble) * 0.2;
      this.y += Math.cos(this.wobble * 0.8) * 0.2;

      // Soft bounce boundaries (keep on screen mostly)
      const margin = 50;
      if (this.x < -margin) this.vx += 0.05;
      if (this.x > width + margin) this.vx -= 0.05;
      if (this.y < -margin) this.vy += 0.05;
      if (this.y > height + margin) this.vy -= 0.05;

      // Flee behavior (Soft)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      const fleeRadius = this.isForeground ? 250 : 150;
      
      if (dist < fleeRadius) {
        const force = (fleeRadius - dist) / fleeRadius;
        // Foreground is skittish, background is lazy
        const speedMult = this.isForeground ? 0.8 : 0.1; 
        this.vx += (dx / dist) * force * speedMult;
        this.vy += (dy / dist) * force * speedMult;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      const maxSpeed = this.isForeground ? 3.0 : 1.0;
      if (speed > maxSpeed) {
        this.vx = (this.vx / speed) * maxSpeed;
        this.vy = (this.vy / speed) * maxSpeed;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // DOF Blur
      if (this.blur > 0) ctx.filter = `blur(${this.blur}px)`;

      // Pulse effect
      const pulse = 1 + Math.sin(time * 0.03 + this.wobble) * 0.05;
      ctx.scale(pulse, pulse);

      // Glow Aura
      ctx.shadowBlur = this.isForeground ? 40 : 15;
      ctx.shadowColor = this.color;
      
      // Draw Tentacles
      ctx.strokeStyle = this.color;
      ctx.lineCap = 'round';
      
      this.tentacles.forEach(t => {
        ctx.lineWidth = t.width;
        ctx.beginPath();
        ctx.moveTo(0, this.radius * 0.5);
        const wave = Math.sin(time * 0.05 + t.offset) * 10;
        // Quadratic curve for organic sway
        ctx.quadraticCurveTo(wave, this.radius + t.length * 0.5, wave * 1.5, this.radius + t.length);
        ctx.stroke();
      });

      // Draw Main Body (Jellyfish dome)
      ctx.fillStyle = this.color;
      ctx.shadowBlur = this.isForeground ? 30 : 10;
      ctx.beginPath();
      // Top dome
      ctx.arc(0, 0, this.radius, Math.PI, 0); 
      // Wavy bottom
      ctx.bezierCurveTo(
        this.radius * 0.5, this.radius * 0.8, 
        -this.radius * 0.5, this.radius * 0.8, 
        -this.radius, 0
      );
      ctx.fill();

      // Inner Core (Bioluminescent center)
      if (this.isForeground) {
        ctx.globalAlpha = 0.8;
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, -this.radius * 0.1, this.radius * 0.3, 0, Math.PI * 2);
        ctx.fill();

        // Details/Sparkles
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.arc(this.radius * 0.3, -this.radius * 0.4, 2, 0, Math.PI * 2);
        ctx.arc(-this.radius * 0.3, -this.radius * 0.2, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    particles = [];
    
    // Create Cluster
    // 4 Background
    for(let i=0; i<4; i++) creatures.push(new Creature(false));
    
    // 3 Foreground (Player focus)
    for(let i=0; i<3; i++) {
        const fg = new Creature(true);
        // Ensure at least one is near the center initially for visual balance
        if(i===0) {
            fg.x = width * 0.4;
            fg.y = height * 0.5;
        }
        creatures.push(fg);
    }
    
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 80; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<25; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1500);

    // Respawn Logic
    setTimeout(() => {
      creature.reset();
    }, 2500);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    // Draw the player's anchor/net
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Outer Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f0ff';
    
    // Net Circle (Dynamic size based on click)
    const r = isMouseDown ? 60 : 50;
    
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(0, 240, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner reticle rings
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.7, 0, Math.PI * 2);
    ctx.stroke();
    
    // Rotating dashes
    ctx.rotate(time * 0.01);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r + 10, 0, Math.PI * 0.5);
    ctx.stroke();
    ctx.rotate(Math.PI);
    ctx.stroke();

    // Center Dot
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    // Suction Effect (if clicking)
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.beginPath();
      ctx.arc(0, 0, r + 20, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    time++;
    
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Sort by size (fake z-index) so smaller (background) draw first
    creatures.sort((a, b) => a.radius - b.radius);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
