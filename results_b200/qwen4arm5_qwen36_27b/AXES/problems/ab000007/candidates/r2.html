<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LUMINA</title>
<style>
  :root {
    --bg-deep: #03010a;
    --bg-mid: #120b29;
    --accent-cyan: #00f0ff;
    --accent-magenta: #ff00ff;
    --accent-purple: #8a2be2;
    --glass-panel: rgba(10, 10, 20, 0.65);
    --glass-border: rgba(255, 255, 255, 0.15);
    --font-display: 'Impact', 'Arial Black', 'Helvetica Neue', sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Background Atmosphere --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  .atmosphere-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: 
      radial-gradient(circle at 50% 50%, rgba(30, 10, 60, 0.8) 0%, transparent 70%),
      radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.05) 0%, transparent 30%),
      radial-gradient(circle at 90% 80%, rgba(189, 0, 255, 0.08) 0%, transparent 30%),
      linear-gradient(to bottom, var(--bg-deep), var(--bg-mid));
    z-index: 0;
  }

  /* Noise texture for grain */
  .fog-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.07"/%3E%3C/svg%3E');
    opacity: 0.6;
    mix-blend-mode: overlay;
    z-index: 1;
    pointer-events: none;
  }

  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.9) 100%);
    z-index: 2;
    pointer-events: none;
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 3;
    cursor: none; 
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3rem;
  }

  /* Header & HUD Unified */
  .header-container {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    pointer-events: auto;
    width: 100%;
    gap: 2rem;
  }

  .brand {
    display: flex;
    flex-direction: column;
    /* Align top with HUD roughly */
    margin-top: 0.2rem; 
  }

  h1 {
    font-family: var(--font-display);
    font-size: 3.5rem;
    margin: 0;
    line-height: 0.9;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: white;
    text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
    background: linear-gradient(to bottom, #fff, #d0d0d0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent-cyan);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 0.5rem;
    opacity: 0.9;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
  }

  /* HUD Panel */
  .hud-panel {
    background: var(--glass-panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-top: 2px solid var(--accent-cyan); /* Tech accent */
    padding: 0.6rem 2rem;
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 1.2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    min-width: 160px;
    justify-content: center;
  }

  /* Replaced Star with a geometric hexagon */
  .stat-icon {
    width: 18px; height: 18px;
    fill: var(--accent-cyan);
    filter: drop-shadow(0 0 5px var(--accent-cyan));
  }

  .stat-content {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2rem;
    line-height: 1;
    color: white;
    letter-spacing: 0.05em;
  }

  .stat-label {
    font-size: 0.7rem;
    font-weight: 700;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* Footer / Actions */
  .footer {
    display: flex;
    justify-content: center; /* Centered */
    align-items: center;
    pointer-events: auto;
    margin-bottom: 2rem; /* Increased bottom margin */
    width: 100%;
  }

  .btn-main {
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--accent-magenta);
    color: white;
    font-family: var(--font-display);
    font-size: 1.1rem;
    letter-spacing: 0.1em;
    padding: 1rem 3rem;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(255, 0, 255, 0.15), inset 0 0 0 1px rgba(255,255,255,0.1);
  }

  /* Glowing border effect */
  .btn-main::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    box-shadow: inset 0 0 20px var(--accent-magenta);
    opacity: 0;
    transition: 0.3s;
  }

  .btn-main:hover {
    background: rgba(255, 0, 255, 0.15);
    box-shadow: 0 0 30px rgba(255, 0, 255, 0.4), inset 0 0 10px var(--accent-magenta);
    transform: translateY(-3px);
    border-color: #fff;
    text-shadow: 0 0 8px white;
  }

  .btn-main:hover::before {
    opacity: 0.5;
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(5, 5, 10, 0.85);
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    padding: 1rem 2.5rem;
    border-radius: 2px;
    font-family: var(--font-display);
    font-size: 1.2rem;
    letter-spacing: 0.15em;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
    backdrop-filter: blur(5px);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.05);
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    h1 { font-size: 2.5rem; }
    .ui-layer { padding: 1.5rem; }
    .hud-panel { padding: 0.5rem 1rem; min-width: 120px; }
    .stat-value { font-size: 1.5rem; }
    .btn-main { padding: 0.8rem 2rem; font-size: 1rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="atmosphere-bg"></div>
  <div class="fog-layer"></div>
  <div class="vignette"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header-container">
      <div class="brand">
        <h1>Lumina</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-panel">
        <!-- Hexagon Icon replacing Star -->
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" />
        </svg>
        <div class="stat-content">
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">CAPTURED</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Enhanced for organic visuals and atmospheric depth.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let time = 0;

  // Configuration
  const COLORS = [
    { main: '#00f0ff', name: 'Cyan' }, 
    { main: '#ff0055', name: 'Rose' }, 
    { main: '#ccff00', name: 'Lime' }, 
    { main: '#bd00ff', name: 'Violet' }
  ];
  const CREATURE_COUNT = 6;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.025 + 0.01;
      this.size = Math.random() * 4 + 2;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.92; 
      this.vy *= 0.92;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset();
      // Initial random spread to avoid edge clustering
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.tentacles = [];
      for(let i=0; i<6; i++) {
        this.tentacles.push({
          offset: Math.random() * Math.PI * 2,
          length: Math.random() * 30 + 15,
          width: Math.random() * 2.5 + 1.5
        });
      }
    }

    reset() {
      // Spawn logic
      const side = Math.floor(Math.random() * 4);
      if (side === 0) { this.x = Math.random() * width; this.y = -100; }
      else if (side === 1) { this.x = width + 100; this.y = Math.random() * height; }
      else if (side === 2) { this.x = Math.random() * width; this.y = height + 100; }
      else { this.x = -100; this.y = Math.random() * height; }

      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.radius = Math.random() * 15 + 18; // Slightly larger
      
      const colorObj = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.color = colorObj.main;
      
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.02 + 0.01;
      this.isCaught = false;
    }

    update() {
      if (this.isCaught) return;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.wobble += this.wobbleSpeed;
      
      // Organic drift
      this.x += Math.sin(this.wobble) * 0.4;
      this.y += Math.cos(this.wobble * 0.8) * 0.4;

      // Bounce gently off walls
      if (this.x < -50 || this.x > width + 50) this.vx *= -1;
      if (this.y < -50 || this.y > height + 50) this.vy *= -1;

      // Avoid Mouse (Net)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 180) {
        const force = (180 - dist) / 180;
        this.vx += (dx / dist) * force * 1.2;
        this.vy += (dy / dist) * force * 1.2;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 4.0) {
        this.vx = (this.vx / speed) * 4.0;
        this.vy = (this.vy / speed) * 4.0;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Pulse effect
      const pulse = 1 + Math.sin(time * 0.05) * 0.05;
      
      // Glow Aura
      ctx.shadowBlur = 30;
      ctx.shadowColor = this.color;
      
      // Draw Tentacles
      ctx.strokeStyle = this.color;
      ctx.lineCap = 'round';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.7;
      
      this.tentacles.forEach(t => {
        ctx.beginPath();
        ctx.moveTo(0, this.radius * 0.6);
        const wave = Math.sin(time * 0.08 + t.offset) * 12;
        ctx.quadraticCurveTo(wave, this.radius + t.length * 0.5, wave * 1.2, this.radius + t.length);
        ctx.stroke();
      });

      // Draw Main Body (Jellyfish dome)
      ctx.fillStyle = this.color;
      ctx.globalAlpha = 0.85;
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * pulse, Math.PI, 0); // Top dome
      
      // Wavy bottom
      ctx.bezierCurveTo(
        this.radius * 0.6, this.radius * 0.9, 
        -this.radius * 0.6, this.radius * 0.9, 
        -this.radius, 0
      );
      ctx.fill();

      // Inner Core (Bioluminescent center)
      ctx.globalAlpha = 1.0;
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, -this.radius * 0.1, this.radius * 0.35, 0, Math.PI * 2);
      ctx.fill();

      // Sparkle details
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.arc(this.radius * 0.4, -this.radius * 0.5, 2, 0, Math.PI * 2);
      ctx.arc(-this.radius * 0.4, -this.radius * 0.3, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 80; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<25; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1200);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 2000);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    // Draw the player's anchor/net
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Outer Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f0ff';
    
    // Net Circle
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(0, 240, 255, 0.8)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, 65, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner reticle rings
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, 50, 0, Math.PI * 2);
    ctx.stroke();
    
    // Rotating dashes
    ctx.rotate(time * 0.02);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.7)';
    ctx.beginPath();
    ctx.arc(0, 0, 80, 0, Math.PI * 0.4);
    ctx.stroke();
    ctx.rotate(Math.PI);
    ctx.stroke();

    // Center Dot
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();

    // Suction Effect (if clicking)
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.beginPath();
      ctx.arc(0, 0, 100, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    time++;
    
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
