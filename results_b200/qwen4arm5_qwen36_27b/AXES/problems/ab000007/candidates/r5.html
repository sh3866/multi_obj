<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AETHER: Bioluminescent Collection</title>
<style>
  :root {
    /* Palette: Deep Space / Bioluminescence */
    --bg-deep: #02040a;
    --bg-mid: #0a1128;
    --accent-primary: #00f0ff; /* Cyan */
    --accent-secondary: #ff00ff; /* Magenta */
    --accent-glow: rgba(0, 240, 255, 0.6);
    --text-main: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.7);
    
    /* UI Materials */
    --glass-panel: rgba(4, 10, 22, 0.65);
    --glass-border: rgba(0, 240, 255, 0.2);
    --glass-highlight: rgba(255, 255, 255, 0.1);
    
    /* Typography */
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-ui: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
    --font-mono: 'Courier New', monospace;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Scene Composition --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  /* 1. Atmospheric Background */
  .bg-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    background: 
      radial-gradient(circle at 50% 120%, #1a0b2e 0%, transparent 60%),
      radial-gradient(circle at 20% 20%, #001f3f 0%, transparent 50%),
      linear-gradient(to bottom, #02040a, #050b14);
  }

  /* Subtle noise texture for depth */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.04;
    z-index: 1;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Canvas Layer */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none;
  }

  /* UI Layer */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 48px 64px 80px; /* 80px bottom margin per critique */
  }

  /* --- Header: Snapped Baseline --- */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end; /* Snaps Title bottom to HUD bottom */
    width: 100%;
    height: 72px; /* Fixed height for alignment */
  }

  .brand {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding-bottom: 2px; /* Optical alignment tweak */
  }

  h1 {
    font-family: var(--font-display);
    font-size: 3.5rem;
    margin: 0;
    line-height: 1;
    letter-spacing: 0.02em;
    color: #fff;
    text-transform: uppercase;
    /* Bloom Effect */
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.5), 0 0 30px rgba(0, 240, 255, 0.2);
    font-weight: 900;
  }

  .subtitle {
    font-family: var(--font-ui);
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent-primary);
    letter-spacing: 0.2em; /* Reduced from extreme, but distinct */
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.9;
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
  }

  /* --- HUD: Scanner Readout Style --- */
  .hud-container {
    pointer-events: auto;
    background: linear-gradient(90deg, rgba(0, 240, 255, 0.05) 0%, rgba(4, 10, 22, 0.8) 100%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-left: 3px solid var(--accent-primary);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    border-right: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 0 12px 12px 0;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    min-width: 180px;
  }

  /* Decorative tech lines */
  .hud-container::after {
    content: '';
    position: absolute;
    right: 20px; top: 50%;
    transform: translateY(-50%);
    width: 20px; height: 1px;
    background: var(--accent-primary);
    box-shadow: 0 0 5px var(--accent-primary);
    opacity: 0.5;
  }

  .hud-icon {
    width: 24px; height: 24px;
    fill: none;
    stroke: var(--accent-primary);
    stroke-width: 2;
    filter: drop-shadow(0 0 4px var(--accent-glow));
  }

  .hud-stats {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .hud-value {
    font-family: var(--font-mono); /* Scanner look */
    font-size: 1.6rem;
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    font-weight: 700;
  }

  .hud-label {
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--accent-primary);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 4px;
    opacity: 0.8;
  }

  /* --- Footer: Button --- */
  .footer {
    display: flex;
    justify-content: center;
    width: 100%;
    pointer-events: none;
  }

  /* Button: Premium Glassmorphism */
  .btn-cta {
    pointer-events: auto;
    background: rgba(0, 240, 255, 0.08);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(0, 240, 255, 0.4);
    border-top: 1px solid rgba(255, 255, 255, 0.3);
    border-bottom: 1px solid rgba(0, 0, 0, 0.2);
    
    color: #fff;
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 18px 56px;
    border-radius: 4px; /* Sharper corners for tech feel */
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 
      inset 0 0 20px rgba(0, 240, 255, 0.05),
      0 10px 30px rgba(0, 0, 0, 0.5);
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
  }

  /* Button Glow Sweep */
  .btn-cta::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: 0.5s;
  }

  .btn-cta:hover {
    transform: translateY(-2px);
    background: rgba(0, 240, 255, 0.15);
    border-color: var(--accent-primary);
    box-shadow: 
      inset 0 0 20px rgba(0, 240, 255, 0.2),
      0 0 20px rgba(0, 240, 255, 0.3);
  }
  
  .btn-cta:hover::before {
    left: 100%;
  }

  .btn-cta:active {
    transform: translateY(1px);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
  }

  /* Notification */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(2, 4, 10, 0.85);
    border: 1px solid var(--accent-primary);
    color: var(--accent-primary);
    padding: 16px 40px;
    border-radius: 2px;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
    backdrop-filter: blur(8px);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile Adjustments */
  @media (max-width: 768px) {
    .ui-layer { padding: 24px 24px 64px; }
    h1 { font-size: 2.2rem; }
    .hud-container { padding: 8px 16px; min-width: 140px; }
    .hud-value { font-size: 1.4rem; }
    .btn-cta { padding: 14px 32px; width: 100%; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Background Layers -->
  <div class="bg-layer"></div>
  <div class="noise-overlay"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <h1>Aether</h1>
        <div class="subtitle">Field Collection</div>
      </div>
      
      <div class="hud-container">
        <svg class="hud-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" stroke-dasharray="4 2" />
          <circle cx="12" cy="12" r="3" />
          <line x1="12" y1="2" x2="12" y2="6" />
          <line x1="12" y1="18" x2="12" y2="22" />
          <line x1="2" y1="12" x2="6" y2="12" />
          <line x1="18" y1="12" x2="22" y2="12" />
        </svg>
        <div class="hud-stats">
          <div class="hud-value" id="scoreDisplay">00</div>
          <div class="hud-label">Specimens</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Sequence Captured</div>

    <!-- Footer -->
    <footer class="footer">
      <button class="btn-cta" onclick="resetGame()">Initialize Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Focus: High-performance canvas rendering, organic movement, bioluminescence.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let time = 0;

  // Configuration
  const COLORS = [
    { main: '#00f0ff', name: 'Cyan' }, 
    { main: '#ff00ff', name: 'Magenta' }, 
    { main: '#bd00ff', name: 'Violet' }, 
    { main: '#00ff9d', name: 'Emerald' }
  ];

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    // Re-init creatures on resize to keep them on screen
    init();
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault(); // Prevent scrolling
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.9; 
      this.vy *= 0.9;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor(isForeground = false) {
      this.isForeground = isForeground;
      this.reset();
      
      // Tentacles configuration
      this.tentacles = [];
      const tentCount = isForeground ? 8 : 4;
      for(let i=0; i<tentCount; i++) {
        this.tentacles.push({
          offset: Math.random() * Math.PI * 2,
          length: Math.random() * 50 + 30,
          width: isForeground ? 3 : 1.5,
          phase: Math.random() * Math.PI
        });
      }
    }

    reset() {
      // Cluster Logic: Spawn towards center for "Living Scene" feel
      const cx = width / 2;
      const cy = height / 2;
      const spread = Math.min(width, height) * 0.35;
      
      this.x = cx + (Math.random() - 0.5) * spread * 2;
      this.y = cy + (Math.random() - 0.5) * spread * 2;

      this.vx = (Math.random() - 0.5) * (this.isForeground ? 0.8 : 0.3);
      this.vy = (Math.random() - 0.5) * (this.isForeground ? 0.8 : 0.3);
      
      // Size hierarchy
      this.radius = this.isForeground ? (Math.random() * 15 + 35) : (Math.random() * 10 + 15);
      
      const colorObj = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.color = colorObj.main;
      
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.02 + 0.01;
      this.isCaught = false;
      
      // Depth of Field Blur (simulated via context in draw)
      this.blur = this.isForeground ? 0 : 5;
    }

    update() {
      if (this.isCaught) return;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.wobble += this.wobbleSpeed;
      
      // Organic drift (sine waves)
      this.x += Math.sin(this.wobble) * 0.3;
      this.y += Math.cos(this.wobble * 0.8) * 0.3;

      // Soft bounce boundaries (keep on screen mostly)
      const margin = 100;
      if (this.x < -margin) this.vx += 0.05;
      if (this.x > width + margin) this.vx -= 0.05;
      if (this.y < -margin) this.vy += 0.05;
      if (this.y > height + margin) this.vy -= 0.05;

      // Flee behavior (Soft)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      const fleeRadius = this.isForeground ? 200 : 100;
      
      if (dist < fleeRadius) {
        const force = (fleeRadius - dist) / fleeRadius;
        // Foreground is skittish, background is lazy
        const speedMult = this.isForeground ? 0.6 : 0.05; 
        this.vx += (dx / dist) * force * speedMult;
        this.vy += (dy / dist) * force * speedMult;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      const maxSpeed = this.isForeground ? 2.5 : 0.8;
      if (speed > maxSpeed) {
        this.vx = (this.vx / speed) * maxSpeed;
        this.vy = (this.vy / speed) * maxSpeed;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // DOF Blur
      if (this.blur > 0) ctx.filter = `blur(${this.blur}px)`;

      // Pulse effect
      const pulse = 1 + Math.sin(time * 0.03 + this.wobble) * 0.05;
      ctx.scale(pulse, pulse);

      // Glow Aura
      ctx.shadowBlur = this.isForeground ? 40 : 20;
      ctx.shadowColor = this.color;
      
      // Draw Tentacles
      ctx.strokeStyle = this.color;
      ctx.lineCap = 'round';
      
      this.tentacles.forEach(t => {
        ctx.lineWidth = t.width;
        ctx.beginPath();
        ctx.moveTo(0, this.radius * 0.5);
        const wave = Math.sin(time * 0.05 + t.offset) * 15;
        // Quadratic curve for organic sway
        ctx.quadraticCurveTo(wave, this.radius + t.length * 0.5, wave * 1.5, this.radius + t.length);
        ctx.stroke();
      });

      // Draw Main Body (Jellyfish dome)
      ctx.fillStyle = this.color;
      ctx.shadowBlur = this.isForeground ? 30 : 15;
      ctx.beginPath();
      // Top dome
      ctx.arc(0, 0, this.radius, Math.PI, 0); 
      // Wavy bottom
      ctx.bezierCurveTo(
        this.radius * 0.5, this.radius * 0.8, 
        -this.radius * 0.5, this.radius * 0.8, 
        -this.radius, 0
      );
      ctx.fill();

      // Inner Core (Bioluminescent center)
      if (this.isForeground) {
        ctx.globalAlpha = 0.9;
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, -this.radius * 0.1, this.radius * 0.3, 0, Math.PI * 2);
        ctx.fill();

        // Details/Sparkles
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.arc(this.radius * 0.3, -this.radius * 0.4, 2, 0, Math.PI * 2);
        ctx.arc(-this.radius * 0.3, -this.radius * 0.2, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    particles = [];
    
    // Create Cluster
    // 5 Background
    for(let i=0; i<5; i++) creatures.push(new Creature(false));
    
    // 4 Foreground (Player focus)
    for(let i=0; i<4; i++) {
        const fg = new Creature(true);
        // Ensure at least one is near the center initially for visual balance
        if(i===0) {
            fg.x = width * 0.4;
            fg.y = height * 0.5;
        }
        creatures.push(fg);
    }
    
    score = 0;
    scoreEl.innerText = "00";
  }

  function checkCatch() {
    const catchRadius = 80; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score < 10 ? `0${score}` : score;
    
    // Visual FX
    for(let i=0; i<30; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1500);

    // Respawn Logic
    setTimeout(() => {
      creature.reset();
    }, 2000);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    // Draw the player's anchor/net
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Outer Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f0ff';
    
    // Net Circle (Dynamic size based on click)
    const r = isMouseDown ? 70 : 55;
    
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(0, 240, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner reticle rings
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.6, 0, Math.PI * 2);
    ctx.stroke();
    
    // Rotating dashes
    ctx.rotate(time * 0.01);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r + 15, 0, Math.PI * 0.5);
    ctx.stroke();
    ctx.rotate(Math.PI);
    ctx.stroke();

    // Center Dot
    ctx.fillStyle = '#00f0ff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    // Suction Effect (if clicking)
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.beginPath();
      ctx.arc(0, 0, r + 30, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    time++;
    
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Sort by size (fake z-index) so smaller (background) draw first
    creatures.sort((a, b) => a.radius - b.radius);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
