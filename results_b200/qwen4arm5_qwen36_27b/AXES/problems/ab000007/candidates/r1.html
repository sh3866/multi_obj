<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LUMINA</title>
<style>
  :root {
    --bg-deep: #050508;
    --bg-atmosphere: #0f111a;
    --accent-cyan: #00f0ff;
    --accent-violet: #bd00ff;
    --accent-lime: #ccff00;
    --glass-surface: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.1);
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Background Atmosphere --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  .atmosphere-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: 
      radial-gradient(circle at 20% 30%, rgba(189, 0, 255, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
      linear-gradient(to bottom, #050508, #0a0b12);
    z-index: 0;
  }

  .fog-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.05"/%3E%3C/svg%3E');
    opacity: 0.4;
    mix-blend-mode: overlay;
    z-index: 1;
    pointer-events: none;
  }

  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
    z-index: 2;
    pointer-events: none;
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 3;
    cursor: none; 
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Header & HUD Unified */
  .header-container {
    display: flex;
    align-items: flex-start; /* Top align */
    justify-content: space-between;
    pointer-events: auto;
    width: 100%;
  }

  .brand {
    display: flex;
    flex-direction: column;
    padding-top: 0.1rem;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 3rem;
    margin: 0;
    line-height: 1;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: white;
    text-shadow: 0 0 20px rgba(255,255,255,0.2);
  }

  .subtitle {
    font-size: 0.75rem;
    color: var(--accent-cyan);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 0.5rem;
    opacity: 0.8;
  }

  /* HUD Panel */
  .hud-panel {
    background: var(--glass-surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    padding: 0.5rem 1.5rem;
    border-radius: 8px;
    display: flex;
    align-items: baseline; /* Align star and number */
    gap: 1rem;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }

  .stat-icon {
    width: 20px; height: 20px;
    fill: var(--accent-lime);
    filter: drop-shadow(0 0 4px var(--accent-lime));
  }

  .stat-content {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2.5rem; /* Increased size */
    line-height: 1;
    color: white;
  }

  .stat-label {
    font-size: 0.7rem;
    font-weight: 600;
    color: rgba(255,255,255,0.7); /* Crisp light grey */
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Footer / Actions */
  .footer {
    display: flex;
    justify-content: flex-end; /* Move to right */
    align-items: flex-end;
    pointer-events: auto;
    margin-top: auto;
  }

  .btn-main {
    background: rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--accent-violet);
    color: white;
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 0.9rem;
    padding: 1rem 2rem;
    border-radius: 4px; /* Less round, more tech */
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.15em; /* Tighter spacing */
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 15px rgba(189, 0, 255, 0.1);
  }

  .btn-main::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(45deg, transparent, rgba(189, 0, 255, 0.2), transparent);
    opacity: 0;
    transition: 0.3s;
  }

  .btn-main:hover {
    background: rgba(189, 0, 255, 0.1);
    box-shadow: 0 0 25px rgba(189, 0, 255, 0.3), inset 0 0 10px rgba(189, 0, 255, 0.1);
    transform: translateY(-2px);
    border-color: #d68aff;
  }

  .btn-main:hover::after {
    opacity: 1;
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(10, 10, 15, 0.85);
    border: 1px solid var(--accent-lime);
    color: var(--accent-lime);
    padding: 1rem 2.5rem;
    border-radius: 2px;
    font-family: var(--font-ui);
    font-weight: 600;
    letter-spacing: 0.15em;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 40px rgba(204, 255, 0, 0.15);
    backdrop-filter: blur(4px);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    h1 { font-size: 2rem; }
    .ui-layer { padding: 1rem; }
    .hud-panel { padding: 0.5rem 1rem; }
    .stat-value { font-size: 2rem; }
    .btn-main { padding: 0.8rem 1.5rem; font-size: 0.8rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="atmosphere-bg"></div>
  <div class="fog-layer"></div>
  <div class="vignette"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header-container">
      <div class="brand">
        <h1>Lumina</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-panel">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" />
        </svg>
        <div class="stat-content">
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">CAPTURED</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Enhanced for organic visuals and atmospheric depth.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let time = 0;

  // Configuration
  const COLORS = ['#00f0ff', '#ff0055', '#ccff00', '#bd00ff'];
  const CREATURE_COUNT = 6;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.015;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.95; // Friction
      this.vy *= 0.95;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset();
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.tentacles = [];
      for(let i=0; i<5; i++) {
        this.tentacles.push({
          offset: Math.random() * Math.PI * 2,
          length: Math.random() * 20 + 10,
          width: Math.random() * 2 + 1
        });
      }
    }

    reset() {
      // Spawn at edges
      const side = Math.floor(Math.random() * 4);
      if (side === 0) { this.x = Math.random() * width; this.y = -100; } // Top
      else if (side === 1) { this.x = width + 100; this.y = Math.random() * height; } // Right
      else if (side === 2) { this.x = Math.random() * width; this.y = height + 100; } // Bottom
      else { this.x = -100; this.y = Math.random() * height; } // Left

      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.radius = Math.random() * 15 + 12;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.03 + 0.01;
      this.isCaught = false;
    }

    update() {
      if (this.isCaught) return;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.wobble += this.wobbleSpeed;
      
      // Organic drift
      this.x += Math.sin(this.wobble) * 0.3;
      this.y += Math.cos(this.wobble * 0.8) * 0.3;

      // Bounce gently off walls
      if (this.x < -50 || this.x > width + 50) this.vx *= -1;
      if (this.y < -50 || this.y > height + 50) this.vy *= -1;

      // Avoid Mouse (Net) - Stronger repulsion
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 200) {
        const force = (200 - dist) / 200;
        this.vx += (dx / dist) * force * 0.8;
        this.vy += (dy / dist) * force * 0.8;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 3.5) {
        this.vx = (this.vx / speed) * 3.5;
        this.vy = (this.vy / speed) * 3.5;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Determine pulse effect
      const pulse = 1 + Math.sin(time * 0.05) * 0.1;

      // Glow Aura
      ctx.shadowBlur = 25;
      ctx.shadowColor = this.color;
      
      // Draw Tentacles (Bottom of jellyfish)
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      
      this.tentacles.forEach(t => {
        ctx.beginPath();
        ctx.moveTo(0, this.radius * 0.5);
        const wave = Math.sin(time * 0.1 + t.offset) * 10;
        ctx.quadraticCurveTo(wave, this.radius + t.length * 0.5, wave * 1.5, this.radius + t.length);
        ctx.stroke();
      });

      // Draw Main Body (Jellyfish dome)
      ctx.fillStyle = this.color;
      ctx.globalAlpha = 0.8; // Translucent body
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * pulse, Math.PI, 0); // Top dome
      // Wavy bottom
      ctx.bezierCurveTo(
        this.radius * 0.5, this.radius * 0.8, 
        -this.radius * 0.5, this.radius * 0.8, 
        -this.radius, 0
      );
      ctx.fill();

      // Inner Core (Bioluminescent center)
      ctx.globalAlpha = 1.0;
      ctx.shadowBlur = 5;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, -this.radius * 0.2, this.radius * 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Sparkle details
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(this.radius * 0.3, -this.radius * 0.4, 1, 0, Math.PI * 2);
      ctx.arc(-this.radius * 0.3, -this.radius * 0.2, 1.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 70; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<20; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1200);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 2500);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    // Draw the player's anchor/net
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Outer Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#00f0ff';
    
    // Net Circle
    ctx.strokeStyle = isMouseDown ? '#fff' : '#00f0ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 60, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner reticle rings
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, 45, 0, Math.PI * 2);
    ctx.stroke();
    
    // Rotating dashes
    ctx.rotate(time * 0.02);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
    ctx.beginPath();
    ctx.arc(0, 0, 75, 0, Math.PI * 0.5);
    ctx.stroke();
    ctx.rotate(Math.PI);
    ctx.stroke();

    // Center Dot
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    // Suction Effect (if clicking)
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.beginPath();
      ctx.arc(0, 0, 85, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    time++;
    
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
