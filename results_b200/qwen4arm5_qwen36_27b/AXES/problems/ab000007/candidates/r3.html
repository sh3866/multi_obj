<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LUMINA</title>
<style>
  :root {
    --safe-area: 64px;
    --grid-unit: 8px;
    
    /* Palette */
    --bg-deep: #05020a;
    --bg-accent: #1a0b2e;
    --accent-cyan: #00f0ff;
    --accent-magenta: #ff00ff;
    --accent-glass: rgba(255, 255, 255, 0.08);
    --accent-glass-border: rgba(255, 255, 255, 0.2);
    --text-glow: 0 0 20px rgba(0, 240, 255, 0.5);
    
    /* Typography */
    --font-display: 'Segoe UI Black', 'Arial Black', 'Impact', sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Scene Layers --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  /* Deep Background Gradient */
  .atmosphere-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: 
      radial-gradient(circle at 80% 20%, rgba(255, 0, 255, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 20% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 40%),
      linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-accent) 100%);
    z-index: 0;
  }

  /* Texture & Noise */
  .fog-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.4'/%3E%3C/svg%3E");
    opacity: 0.15;
    mix-blend-mode: overlay;
    z-index: 1;
    pointer-events: none;
  }

  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
    z-index: 2;
    pointer-events: none;
  }

  /* --- Canvas --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 3;
    cursor: none;
  }

  /* --- UI Layer (Strict Grid) --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: var(--safe-area);
  }

  /* Header: Aligned Baseline */
  .header-container {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    width: 100%;
    pointer-events: auto;
    height: 80px; /* Fixed height container for baseline alignment */
  }

  .brand {
    display: flex;
    flex-direction: column;
    justify-content: flex-end; /* Pushes text down to align with HUD bottom */
    height: 100%;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 3rem; /* Reduced size to subordinate to playfield */
    margin: 0;
    line-height: 1;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: white;
    /* Soft Cyan/White Glow */
    text-shadow: 0 0 25px rgba(0, 240, 255, 0.6), 0 0 10px rgba(255, 255, 255, 0.4);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }

  .subtitle {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--accent-cyan);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.8;
  }

  /* HUD: Glassmorphism */
  .hud-panel {
    background: var(--accent-glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--accent-glass-border);
    /* Glowing Top Border */
    border-top: 2px solid var(--accent-cyan);
    
    /* Increased Padding */
    padding: 12px 32px; 
    border-radius: 8px;
    
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    
    /* Vertical alignment to match Title bottom */
    align-self: flex-end; 
  }

  .stat-icon {
    width: 24px; height: 24px;
    fill: var(--accent-cyan);
    filter: drop-shadow(0 0 8px var(--accent-cyan));
  }

  .stat-content {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2.5rem;
    line-height: 1;
    color: white;
    letter-spacing: 0.05em;
  }

  .stat-label {
    font-size: 0.7rem;
    font-weight: 700;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* Footer: Anchored */
  .footer {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    pointer-events: auto;
    margin-bottom: 16px; /* 64px margin + button height considerations */
  }

  /* Button: Holographic/Glass */
  .btn-main {
    background: rgba(10, 10, 20, 0.4);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-top: 1px solid rgba(255, 255, 255, 0.3);
    border-bottom: 2px solid var(--accent-magenta); /* Magenta anchor */
    
    color: white;
    font-family: var(--font-display);
    font-size: 1.1rem;
    letter-spacing: 0.15em;
    padding: 16px 48px;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(255, 0, 255, 0.15);
  }

  /* Button Glow Effect */
  .btn-main::after {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: 0.5s;
  }

  .btn-main:hover {
    background: rgba(255, 0, 255, 0.15);
    box-shadow: 0 0 40px rgba(255, 0, 255, 0.3), inset 0 0 20px rgba(255, 0, 255, 0.1);
    transform: translateY(-2px);
    border-color: var(--accent-magenta);
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
  }

  .btn-main:hover::after {
    left: 100%;
  }

  /* Notification */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(5, 5, 10, 0.9);
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    padding: 16px 40px;
    border-radius: 2px;
    font-family: var(--font-display);
    font-size: 1.4rem;
    letter-spacing: 0.2em;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 50px rgba(0, 240, 255, 0.3);
    backdrop-filter: blur(4px);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.05);
  }

  /* Mobile */
  @media (max-width: 600px) {
    :root { --safe-area: 24px; }
    h1 { font-size: 2rem; }
    .hud-panel { padding: 8px 16px; }
    .stat-value { font-size: 1.8rem; }
    .btn-main { padding: 12px 32px; font-size: 0.9rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="atmosphere-bg"></div>
  <div class="fog-layer"></div>
  <div class="vignette"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header-container">
      <div class="brand">
        <h1>Lumina</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-panel">
        <!-- Stylized Hexagon Icon -->
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="none" />
        </svg>
        <div class="stat-content">
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">CAPTURED</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Revised for visual depth, organic movement, and atmospheric lighting.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let time = 0;

  // Configuration
  const COLORS = [
    { main: '#00f0ff', name: 'Cyan' }, 
    { main: '#ff00ff', name: 'Magenta' }, 
    { main: '#ff2a2a', name: 'Crimson' }, 
    { main: '#bd00ff', name: 'Violet' }
  ];
  const CREATURE_COUNT = 7;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.015;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.9; 
      this.vy *= 0.9;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor(isForeground = false) {
      this.isForeground = isForeground;
      this.reset();
      // Spread initial positions
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      
      // Tentacles
      this.tentacles = [];
      const tentCount = isForeground ? 8 : 4;
      for(let i=0; i<tentCount; i++) {
        this.tentacles.push({
          offset: Math.random() * Math.PI * 2,
          length: Math.random() * 40 + 20,
          width: isForeground ? 2.5 : 1.5,
          phase: Math.random() * Math.PI
        });
      }
    }

    reset() {
      // Spawn logic - keep away from UI edges slightly
      const margin = 100;
      const side = Math.floor(Math.random() * 4);
      if (side === 0) { this.x = Math.random() * width; this.y = -margin; }
      else if (side === 1) { this.x = width + margin; this.y = Math.random() * height; }
      else if (side === 2) { this.x = Math.random() * width; this.y = height + margin; }
      else { this.x = -margin; this.y = Math.random() * height; }

      this.vx = (Math.random() - 0.5) * (this.isForeground ? 1.5 : 0.5);
      this.vy = (Math.random() - 0.5) * (this.isForeground ? 1.5 : 0.5);
      
      // Foreground creatures are larger and faster
      this.radius = this.isForeground ? (Math.random() * 15 + 25) : (Math.random() * 10 + 10);
      
      const colorObj = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.color = colorObj.main;
      
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.02 + 0.01;
      this.isCaught = false;
    }

    update() {
      if (this.isCaught) return;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.wobble += this.wobbleSpeed;
      
      // Organic drift
      this.x += Math.sin(this.wobble) * 0.3;
      this.y += Math.cos(this.wobble * 0.8) * 0.3;

      // Bounce gently off walls
      if (this.x < -100 || this.x > width + 100) this.vx *= -1;
      if (this.y < -100 || this.y > height + 100) this.vy *= -1;

      // Avoid Mouse (Net)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      // Easier to catch background, harder to catch foreground
      const fleeRadius = this.isForeground ? 200 : 150;
      
      if (dist < fleeRadius) {
        const force = (fleeRadius - dist) / fleeRadius;
        this.vx += (dx / dist) * force * (this.isForeground ? 1.5 : 0.5);
        this.vy += (dy / dist) * force * (this.isForeground ? 1.5 : 0.5);
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      const maxSpeed = this.isForeground ? 5.0 : 2.5;
      if (speed > maxSpeed) {
        this.vx = (this.vx / speed) * maxSpeed;
        this.vy = (this.vy / speed) * maxSpeed;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Depth scaling
      const scale = this.isForeground ? 1.0 : 0.6;
      const alpha = this.isForeground ? 1.0 : 0.5;
      
      ctx.scale(scale, scale);
      ctx.globalAlpha = alpha;

      // Pulse effect
      const pulse = 1 + Math.sin(time * 0.05) * 0.05;
      
      // Glow Aura - stronger for foreground
      ctx.shadowBlur = this.isForeground ? 40 : 15;
      ctx.shadowColor = this.color;
      
      // Draw Tentacles
      ctx.strokeStyle = this.color;
      ctx.lineCap = 'round';
      ctx.lineWidth = 2;
      
      this.tentacles.forEach(t => {
        ctx.beginPath();
        ctx.moveTo(0, this.radius * 0.6);
        const wave = Math.sin(time * 0.08 + t.offset) * 15;
        ctx.quadraticCurveTo(wave, this.radius + t.length * 0.5, wave * 1.2, this.radius + t.length);
        ctx.stroke();
      });

      // Draw Main Body (Jellyfish dome)
      ctx.fillStyle = this.color;
      ctx.shadowBlur = this.isForeground ? 25 : 10;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * pulse, Math.PI, 0); // Top dome
      
      // Wavy bottom
      ctx.bezierCurveTo(
        this.radius * 0.6, this.radius * 0.9, 
        -this.radius * 0.6, this.radius * 0.9, 
        -this.radius, 0
      );
      ctx.fill();

      // Inner Core (Bioluminescent center) - Only for foreground
      if (this.isForeground) {
        ctx.globalAlpha = 0.9;
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, -this.radius * 0.1, this.radius * 0.35, 0, Math.PI * 2);
        ctx.fill();

        // Sparkle details
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.arc(this.radius * 0.4, -this.radius * 0.5, 2, 0, Math.PI * 2);
        ctx.arc(-this.radius * 0.4, -this.radius * 0.3, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    // 5 Background, 2 Foreground (one large anchor in bottom left area ideally, but random for now)
    for(let i=0; i<5; i++) creatures.push(new Creature(false));
    for(let i=0; i<2; i++) {
        const fg = new Creature(true);
        // Force one large creature to lower left quadrant for composition
        if(i===0) {
            fg.x = width * 0.2;
            fg.y = height * 0.7;
        }
        creatures.push(fg);
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 90; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<30; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1200);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 2000);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    // Draw the player's anchor/net
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Outer Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#00f0ff';
    
    // Net Circle
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(0, 240, 255, 0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 70, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner reticle rings
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, 55, 0, Math.PI * 2);
    ctx.stroke();
    
    // Rotating dashes
    ctx.rotate(time * 0.02);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.8)';
    ctx.beginPath();
    ctx.arc(0, 0, 85, 0, Math.PI * 0.5);
    ctx.stroke();
    ctx.rotate(Math.PI);
    ctx.stroke();

    // Center Dot
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();

    // Suction Effect (if clicking)
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.beginPath();
      ctx.arc(0, 0, 110, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    time++;
    
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Sort by size (fake z-index) so smaller (background) draw first
    creatures.sort((a, b) => a.radius - b.radius);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
