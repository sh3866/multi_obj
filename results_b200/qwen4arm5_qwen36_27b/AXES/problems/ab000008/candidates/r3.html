<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - NEON EDITION</title>
    <style>
        :root {
            /* Palette: Deep Space, Muted Magenta, Electric Yellow, Neon Cyan */
            --c-bg-top: #05000a;
            --c-bg-bot: #1a0022;
            --c-grid-main: rgba(255, 0, 255, 0.3); /* Muted Magenta */
            --c-grid-accent: rgba(0, 255, 255, 0.6); /* Cyan */
            --c-yellow: #ffea00;
            --c-pink: #ff00ff;
            --c-white: #ffffff;
            --c-dark: #080010;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: var(--c-bg-top);
            color: var(--c-white);
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 800px; /* Deep perspective for 3D floor */
        }

        /* --- BACKGROUND CANVAS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- CRT OVERLAY --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.2) 2px,
                rgba(0,0,0,0.2) 4px
            );
            z-index: 10;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
        }

        /* --- MAIN CONTAINER --- */
        .main-stage {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- TITLE --- */
        .title-container {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
            position: relative;
            transform: translateZ(0);
        }

        h1 {
            font-size: 6rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -4px;
            line-height: 0.9;
            color: var(--c-yellow); /* Electric Yellow for Title */
            position: relative;
            
            /* Retro Bevel & Shadow */
            text-shadow: 
                4px 4px 0px var(--c-bg-bot),
                8px 8px 0px #000;
            
            /* Subtle float animation */
            animation: floatTitle 4s ease-in-out infinite;
        }

        /* Glitch Effect on Title */
        h1::before, h1::after {
            content: "PIXEL DANCE";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        h1::before {
            color: var(--c-pink);
            z-index: -1;
            transform: translate(-3px, -3px);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            animation: glitch 3s infinite linear alternate-reverse;
        }

        h1::after {
            color: var(--c-grid-accent);
            z-index: -2;
            transform: translate(3px, 3px);
            clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
            animation: glitch 2s infinite linear alternate-reverse;
        }

        .subtitle-wrapper {
            margin-top: 25px;
            display: inline-block;
            position: relative;
            perspective: 500px;
        }

        .subtitle {
            display: block;
            font-size: 1.2rem;
            letter-spacing: 10px;
            color: var(--c-white);
            font-weight: bold;
            text-transform: uppercase;
            padding: 8px 24px;
            position: relative;
            z-index: 2;
            
            /* Neon Glow Text */
            text-shadow: 0 0 5px var(--c-white), 0 0 10px var(--c-grid-accent);
        }

        /* Arcade Button Style Subtitle Box */
        .subtitle-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(20deg);
            width: 120%;
            height: 140%;
            background: linear-gradient(180deg, #222, #000);
            border-top: 2px solid rgba(255,255,255,0.4);
            border-bottom: 2px solid rgba(0,0,0,0.8);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 1;
        }

        /* --- HIGHWAY (GAME PREVIEW) --- */
        /* This creates the 3D floor perspective */
        .highway-wrapper {
            position: relative;
            width: 100%;
            height: 300px;
            transform-style: preserve-3d;
            /* The floor tilts back */
            transform: rotateX(60deg); 
            margin-bottom: 60px; /* Space for buttons */
            display: flex;
            justify-content: center;
        }

        .highway {
            width: 400px;
            height: 100%;
            position: relative;
            background: rgba(0,0,0,0.4);
            /* Perspective fade at the top */
            mask-image: linear-gradient(to bottom, transparent 0%, black 40%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 40%);
            
            /* Grid Lines */
            background-image: 
                linear-gradient(90deg, var(--c-grid-main) 1px, transparent 1px),
                linear-gradient(0deg, var(--c-grid-main) 1px, transparent 1px);
            background-size: 25% 100px; /* 4 Lanes */
            background-position: 0 0;
            
            /* Animation for movement */
            animation: gridScroll 0.5s linear infinite;
            
            /* Glow borders */
            border-left: 2px solid var(--c-grid-accent);
            border-right: 2px solid var(--c-grid-accent);
            box-shadow: 0 0 30px var(--c-grid-main), inset 0 0 50px rgba(0,0,0,0.8);
        }

        /* The Hit Line - The "Entry Point" */
        .hit-line {
            position: absolute;
            bottom: 0;
            left: -5px;
            right: -5px;
            height: 6px;
            background: var(--c-white);
            box-shadow: 
                0 0 10px var(--c-white),
                0 0 20px var(--c-pink),
                0 10px 20px rgba(0,0,0,0.8);
            z-index: 5;
        }

        /* --- UI CONTROLS --- */
        .controls {
            display: flex;
            gap: 30px;
            position: relative;
            z-index: 20;
            transform: translateY(-30px); /* Lift slightly off the bottom */
        }

        .btn {
            font-family: "Courier New", monospace;
            font-size: 1.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 16px 40px;
            border: none;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            outline: none;
            
            /* Arcade Button Bevel */
            background: #222;
            color: #888;
            border-top: 4px solid #444;
            border-left: 4px solid #444;
            border-right: 4px solid #000;
            border-bottom: 4px solid #000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .btn:active {
            border-top: 4px solid #000;
            border-left: 4px solid #000;
            border-right: 4px solid #444;
            border-bottom: 4px solid #444;
            transform: translateY(4px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* START Button - Highlighted */
        .btn-start {
            background: var(--c-pink);
            color: var(--c-white);
            border-top: 4px solid #ff80ff;
            border-left: 4px solid #ff80ff;
            border-right: 4px solid #990099;
            border-bottom: 4px solid #990099;
            box-shadow: 
                0 0 15px var(--c-pink),
                0 10px 20px rgba(0,0,0,0.5);
        }

        .btn-start:hover {
            background: #ff40ff;
            box-shadow: 
                0 0 25px var(--c-pink),
                0 10px 20px rgba(0,0,0,0.5);
            transform: translateY(-2px);
        }

        /* --- ANIMATIONS --- */
        @keyframes floatTitle {
            0%, 100% { transform: translateY(0) skewX(0deg); }
            50% { transform: translateY(-8px) skewX(1deg); }
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .highway { width: 300px; }
            .controls { flex-direction: column; gap: 15px; transform: translateY(-10px); }
            .btn { width: 100%; max-width: 300px; }
        }
    </style>
</head>
<body>

    <!-- Background rendering -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- CRT Scanline Overlay -->
    <div class="scanlines"></div>

    <div class="main-stage">
        <!-- HERO BLOCK -->
        <div class="title-container">
            <h1>PIXEL<br>DANCE</h1>
            <div class="subtitle-wrapper">
                <span class="subtitle">NEON EDITION</span>
                <div class="subtitle-box"></div>
            </div>
        </div>

        <!-- The 3D Highway (Floor) -->
        <div class="highway-wrapper">
            <div class="highway" id="highway">
                <!-- Falling notes will be injected here via JS -->
                <div class="hit-line"></div>
            </div>
        </div>

        <!-- UI CONTROLS -->
        <div class="controls">
            <button class="btn btn-start" onclick="startGame()">START GAME</button>
            <button class="btn" onclick="alert('Settings')">OPTIONS</button>
        </div>
    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Renders the Synthwave background (Sun, Stars, Horizon)
         */

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // State
        let time = 0;

        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawBackground() {
            // 1. Sky Gradient (Deep Purple to Dark Magenta)
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#05000a');
            grad.addColorStop(0.5, '#1a0022');
            grad.addColorStop(1, '#2a0033');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. The Sun (Aligned with vanishing point)
            const cx = width / 2;
            const cy = height * 0.38; // Horizon line
            const r = Math.min(width, height) * 0.2;

            const sunGrad = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
            sunGrad.addColorStop(0, '#ffea00'); // Yellow top
            sunGrad.addColorStop(0.6, '#ff8000'); // Orange mid
            sunGrad.addColorStop(1, '#ff00ff'); // Magenta bottom

            ctx.save();
            ctx.translate(cx, cy);
            
            // Sun Glow
            ctx.shadowBlur = 50;
            ctx.shadowColor = '#ff00ff';
            
            // Draw Sun base
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = sunGrad;
            ctx.fill();
            
            // Cutout stripes (The Synthwave look)
            ctx.globalCompositeOperation = 'destination-out';
            ctx.shadowBlur = 0;
            
            // Dynamic stripes (move slightly)
            const stripeOffset = (time * 0.5) % 10;
            for(let i=0; i<10; i++) {
                let y = (i * r / 5) - r + 10 + stripeOffset;
                // Taper width based on distance from center to simulate curvature
                let h = (i * 3) + 2; 
                ctx.fillRect(-r, y, r*2, h);
            }
            ctx.restore();

            // 3. Stars
            ctx.fillStyle = 'white';
            for(let i=0; i<100; i++) {
                const sx = (Math.sin(i * 123.45) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 67.89) * 0.5 + 0.5) * (height * 0.45);
                const size = (i % 3 === 0) ? 2 : 1;
                
                // Twinkle effect
                const twinkle = Math.abs(Math.sin(time * 0.05 + i));
                ctx.globalAlpha = 0.2 + (twinkle * 0.8);
                ctx.fillRect(sx, sy, size, size);
            }
            ctx.globalAlpha = 1.0;

            // 4. Horizon Line (Faint)
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, cy);
            ctx.lineTo(width, cy);
            ctx.stroke();
        }

        // --- NOTE SPAWNER LOGIC ---
        // We spawn notes in the CSS 3D highway container
        const highway = document.getElementById('highway');
        const hexColors = ['#ff0055', '#00ffff', '#00ff55', '#ffea00']; // Pink, Cyan, Green, Yellow

        function spawnNote() {
            // Random lane (0 to 3)
            const laneIdx = Math.floor(Math.random() * 4);
            
            const note = document.createElement('div');
            note.style.position = 'absolute';
            note.style.width = '20%'; // Fits in 4 lanes (25% each)
            note.style.height = '30px';
            note.style.left = (laneIdx * 25 + 2) + '%'; // 2% padding
            note.style.backgroundColor = hexColors[laneIdx];
            note.style.border = '2px solid white';
            note.style.boxShadow = `0 0 10px ${hexColors[laneIdx]}`;
            note.style.zIndex = '2';
            
            // Start position (Top of the 3D plane)
            note.style.top = '-50px'; 
            
            // Animation using Web Animations API for smooth performance
            const duration = 1500 + Math.random() * 500;
            
            // Add to DOM
            highway.appendChild(note);

            // Trigger reflow
            note.offsetHeight; 

            const animation = note.animate([
                { top: '-50px', opacity: 0 },
                { top: '0%', opacity: 1, offset: 0.1 },
                { top: '100%', opacity: 1 }
            ], {
                duration: duration,
                easing: 'linear'
            });

            animation.onfinish = () => {
                note.remove();
            };
        }

        // Main Loop
        function loop() {
            time++;
            drawBackground();
            
            // Randomly spawn notes
            if (Math.random() < 0.12) {
                spawnNote();
            }

            requestAnimationFrame(loop);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            btn.innerText = "LOADING...";
            // Visual feedback
            document.body.style.cursor = "wait";
            setTimeout(() => {
                alert("INITIALIZING RHYTHM ENGINE...");
                btn.innerText = "START GAME";
                document.body.style.cursor = "default";
            }, 500);
        }

        // Start
        loop();

    </script>
</body>
</html>
