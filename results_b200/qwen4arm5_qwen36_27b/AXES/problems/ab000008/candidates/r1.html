<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --c-bg-top: #0a001a;
            --c-bg-bot: #2a004a;
            --c-sun-top: #ff00ff;
            --c-sun-bot: #ffcc00;
            --c-grid: #00ffff; /* Cyan Grid per critique */
            --c-grid-glow: rgba(0, 255, 255, 0.6);
            --c-text-shadow: #ff00ff;
            --c-btn-bg: rgba(0, 0, 0, 0.6);
            
            /* Lane Colors */
            --lane-1: #ff0055;
            --lane-2: #00ffff;
            --lane-3: #00ff55;
            --lane-4: #ffff00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none; /* Keep fonts pixelated */
        }

        body {
            background-color: var(--c-bg-top);
            color: white;
            font-family: "Courier New", Courier, monospace; /* System fallback */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* --- BACKGROUND CANVAS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- CRT OVERLAY --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.3) 2px,
                rgba(0,0,0,0.3) 4px
            );
            z-index: 10;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
        }

        /* --- MAIN CONTAINER --- */
        .main-stage {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            padding-bottom: 80px; /* Ensure bottom padding */
        }

        /* --- TITLE --- */
        .title-container {
            text-align: center;
            transform: translateZ(60px);
            margin-bottom: 20px; /* Tighter gap */
            position: relative;
        }

        h1 {
            font-size: 4.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -4px;
            line-height: 0.85;
            color: #fff;
            /* Retro Shadow Stack */
            text-shadow: 
                4px 4px 0px var(--c-text-shadow),
                8px 8px 0px rgba(0,0,0,0.5),
                0 0 20px var(--c-sun-top);
            animation: floatTitle 4s ease-in-out infinite;
        }

        .subtitle {
            display: block;
            margin-top: 10px;
            font-size: 1.2rem;
            letter-spacing: 6px;
            color: var(--c-grid);
            text-shadow: 0 0 10px var(--c-grid);
            font-weight: bold;
            /* Simulating chunky pixel font with borders */
            -webkit-text-stroke: 1px var(--c-grid);
        }

        /* --- HIGHWAY (GAME PREVIEW) --- */
        .highway-container {
            position: relative;
            width: 280px;
            height: 180px;
            /* The 3D Viewport */
            transform: rotateX(55deg) rotateZ(-10deg);
            transform-style: preserve-3d;
            margin-bottom: 20px; /* Tighter gap */
            background: rgba(0,0,0,0.2);
            /* Enhanced Glow */
            box-shadow: 
                0 0 20px var(--c-grid-glow),
                inset 0 0 30px rgba(0,0,0,0.8);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        /* The glowing floor of the highway */
        .highway-floor {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, #000 0%, rgba(0, 255, 255, 0.1) 100%);
            z-index: 0;
        }

        .lane {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 25%;
            /* Lane borders with glow */
            border-left: 1px solid rgba(255,255,255,0.15);
            border-right: 1px solid rgba(255,255,255,0.15);
            overflow: hidden;
        }
        
        /* Specific Lane Tints */
        .lane:nth-child(1) { left: 0%; }
        .lane:nth-child(2) { left: 25%; }
        .lane:nth-child(3) { left: 50%; }
        .lane:nth-child(4) { left: 75%; }

        /* Moving Grid Lines on Highway */
        .grid-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--c-grid), transparent);
            box-shadow: 0 0 5px var(--c-grid);
            opacity: 0.6;
            animation: gridMove 0.8s linear infinite;
        }

        /* Falling Notes */
        .note {
            position: absolute;
            width: 70%;
            height: 16px;
            left: 15%;
            border-radius: 2px;
            z-index: 2;
            /* Pixelated look for notes */
            box-shadow: 0 0 8px currentColor, inset 0 0 2px white;
        }

        /* Hit Line */
        .hit-zone {
            position: absolute;
            bottom: 10px;
            width: 100%;
            height: 4px;
            background: white;
            box-shadow: 0 0 15px 2px white;
            z-index: 3;
            opacity: 0.8;
        }

        /* --- UI CONTROLS --- */
        .controls {
            display: flex;
            gap: 30px; /* Increased horizontal gap */
            transform: translateZ(30px);
            margin-top: 10px;
        }

        .btn {
            background: var(--c-btn-bg); /* Semi-transparent dark background */
            border: 2px solid rgba(255,255,255,0.8);
            color: #ffffff; /* White text for readability */
            padding: 12px 30px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            box-shadow: 4px 4px 0px var(--c-grid); /* Cyan shadow */
            backdrop-filter: blur(4px);
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--c-text-shadow); /* Magenta shadow on hover */
            background: rgba(255, 255, 255, 0.15);
            border-color: #fff;
            text-shadow: 0 0 8px white;
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--c-grid);
        }

        /* Start Button Specifics */
        .btn-start {
            border-color: var(--c-text-shadow);
            color: #ffff00; /* Bright Yellow text per critique */
            box-shadow: 4px 4px 0px var(--c-text-shadow);
        }
        
        .btn-start:hover {
            background: var(--c-text-shadow);
            color: white;
            border-color: white;
            box-shadow: 0 0 25px var(--c-text-shadow);
        }

        /* --- ANIMATIONS --- */
        @keyframes floatTitle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }

        @keyframes gridMove {
            0% { top: -50px; }
            100% { top: 100%; }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .highway-container { width: 240px; height: 160px; }
            .controls { gap: 15px; }
            .btn { padding: 10px 20px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <!-- Background rendering -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- CRT Scanline Overlay -->
    <div class="scanlines"></div>

    <div class="main-stage">
        <!-- HERO BLOCK: Title + Highway -->
        <div class="title-container">
            <h1>PIXEL<br>DANCE</h1>
            <span class="subtitle">NEON EDITION</span>
        </div>

        <!-- The 3D Highway Preview -->
        <div class="highway-container" id="highway">
            <div class="highway-floor"></div>
            <div class="lane" id="l1"><div class="grid-line" style="animation-delay: 0s"></div></div>
            <div class="lane" id="l2"><div class="grid-line" style="animation-delay: 0.2s"></div></div>
            <div class="lane" id="l3"><div class="grid-line" style="animation-delay: 0.4s"></div></div>
            <div class="lane" id="l4"><div class="grid-line" style="animation-delay: 0.6s"></div></div>
            <div class="hit-zone"></div>
        </div>

        <!-- UI CONTROLS -->
        <div class="controls">
            <button class="btn btn-start" onclick="alert('Game Starting...')">START GAME</button>
            <button class="btn">OPTIONS</button>
        </div>
    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Renders the Synthwave background and handles note spawning
         */

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // State
        let time = 0;

        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawBackground() {
            // 1. Sky Gradient (Deep Purple to Dark Blue)
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#050011');
            grad.addColorStop(0.5, '#1a0033');
            grad.addColorStop(1, '#2a004a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. The Sun
            const cx = width / 2;
            const cy = height * 0.35;
            const r = Math.min(width, height) * 0.18;

            const sunGrad = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
            sunGrad.addColorStop(0, '#ff00ff'); // Magenta top
            sunGrad.addColorStop(1, '#ffcc00'); // Yellow bottom

            ctx.save();
            ctx.translate(cx, cy);
            
            // Sun Glow
            ctx.shadowBlur = 50;
            ctx.shadowColor = '#ff00ff';
            
            // Draw Sun base
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = sunGrad;
            ctx.fill();
            
            // Cutout stripes (The Synthwave look)
            ctx.globalCompositeOperation = 'destination-out';
            ctx.shadowBlur = 0; // No shadow for cutouts
            
            // Dynamic stripes
            for(let i=0; i<12; i++) {
                let y = (i * r / 6) - r + 10;
                // Make stripes thicker towards bottom
                let h = (i * 2.5) + 2; 
                ctx.fillRect(-r, y, r*2, h);
            }
            ctx.restore();

            // 3. Stars
            ctx.fillStyle = 'white';
            ctx.globalAlpha = 0.6;
            for(let i=0; i<60; i++) {
                const sx = (Math.sin(i * 123.45) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 67.89) * 0.5 + 0.5) * (height * 0.4);
                const size = (i % 3 === 0) ? 2 : 1;
                // Twinkle effect
                const twinkle = Math.abs(Math.sin(time * 0.05 + i));
                ctx.globalAlpha = 0.3 + (twinkle * 0.7);
                ctx.fillRect(sx, sy, size, size);
            }
            ctx.globalAlpha = 1.0;

            // 4. The Grid (Cyan)
            const horizonY = height * 0.45;
            const vanishX = width / 2;
            const gridSpeed = (time * 3) % 60; 

            ctx.strokeStyle = '#00ffff'; // Cyan
            ctx.lineWidth = 1.5;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ffff';
            ctx.globalAlpha = 0.4; // Slightly transparent grid
            
            ctx.beginPath();

            // Vertical lines (Perspective)
            // Create a fan effect
            const numVLines = 15;
            for (let i = -numVLines; i <= numVLines; i++) {
                let x1 = vanishX + (i * 10); 
                let x2 = vanishX + (i * width * 0.25); 
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
            }

            // Horizontal lines (Moving towards camera)
            // Use perspective projection logic
            const numHLines = 20;
            for (let i = 0; i < numHLines; i++) {
                // Calculate Z position based on time
                let z = (i * 40) - gridSpeed; 
                if (z <= 10) continue; // Don't draw behind camera
                
                // Perspective math: y = horizon + (scale / z)
                // We want lines to bunch up at horizon and spread at bottom
                let scale = 400; 
                let y = horizonY + (scale / (z * 0.02));

                // Optimization: Only draw if on screen
                if (y > horizonY && y < height) {
                    // Fade out lines at the horizon
                    let opacity = Math.min(1, (y - horizonY) / 100);
                    ctx.globalAlpha = opacity * 0.5;
                    
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                }
            }
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }

        // --- NOTE SPAWNER LOGIC ---
        const lanes = [
            document.getElementById('l1'),
            document.getElementById('l2'),
            document.getElementById('l3'),
            document.getElementById('l4')
        ];
        // Colors matching CSS variables
        const colors = ['var(--lane-1)', 'var(--lane-2)', 'var(--lane-3)', 'var(--lane-4)'];
        // Hex equivalents for JS canvas logic if needed, but here we use CSS vars via style
        const hexColors = ['#ff0055', '#00ffff', '#00ff55', '#ffff00'];

        function spawnNote() {
            const laneIdx = Math.floor(Math.random() * 4);
            const lane = lanes[laneIdx];
            
            const note = document.createElement('div');
            note.className = 'note';
            note.style.backgroundColor = hexColors[laneIdx];
            note.style.color = hexColors[laneIdx]; // for box-shadow currentColor
            note.style.top = '-20px';
            
            // Randomize speed slightly for organic feel
            const duration = 0.8 + Math.random() * 0.4;
            note.style.transition = `top ${duration}s linear`;
            
            lane.appendChild(note);

            // Trigger animation
            requestAnimationFrame(() => {
                note.style.top = '100%';
            });

            // Cleanup
            setTimeout(() => {
                if(note.parentNode) note.remove();
            }, duration * 1000 + 100);
        }

        // Main Loop
        function loop() {
            time++;
            drawBackground();
            
            // Random note spawning logic
            // Spawn more frequently to fill the visual space
            if (Math.random() < 0.08) {
                spawnNote();
            }

            requestAnimationFrame(loop);
        }

        // Start
        loop();

    </script>
</body>
</html>
