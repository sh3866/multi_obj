<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - NEON EDITION</title>
    <style>
        :root {
            /* Palette: Deep Space, Neon Cyan, Electric Purple, Hot Pink, Sun Yellow */
            --c-bg-top: #050014;
            --c-bg-bot: #2a0033;
            --c-grid: #ff00ff;
            --c-grid-dark: #440044;
            --c-cyan: #00ffff;
            --c-purple: #bd00ff;
            --c-yellow: #ffea00;
            --c-white: #ffffff;
            
            --font-main: "Courier New", Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: var(--c-bg-top);
            color: var(--c-white);
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 800px; /* Essential for the 3D Highway */
        }

        /* --- BACKGROUND CANVAS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- CRT OVERLAY --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.15) 2px,
                rgba(0,0,0,0.15) 4px
            );
            z-index: 100;
            pointer-events: none;
            box-shadow: inset 0 0 120px rgba(0,0,0,0.9);
        }

        /* --- MAIN STAGE --- */
        .main-stage {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- TITLE & UI (Top Center) --- */
        .ui-layer {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Title Treatment: Chromatic Aberration */
        h1 {
            font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 0.85;
            color: var(--c-white);
            position: relative;
            margin-bottom: 10px;
            /* Pixelated text rendering */
            text-shadow: 4px 4px 0px #000; 
        }

        /* Glitch/Croma layers */
        h1::before, h1::after {
            content: "PIXEL DANCE";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        h1::before {
            color: var(--c-cyan);
            z-index: -1;
            transform: translate(-4px, -2px);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            mix-blend-mode: screen;
        }

        h1::after {
            color: var(--c-purple);
            z-index: -2;
            transform: translate(4px, 2px);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            mix-blend-mode: screen;
        }

        /* Subtitle */
        .subtitle {
            font-family: var(--font-main);
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            letter-spacing: 8px;
            color: var(--c-cyan);
            text-transform: uppercase;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        /* --- BUTTONS --- */
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .btn {
            position: relative;
            font-family: var(--font-main);
            font-size: 1.2rem;
            font-weight: 900;
            text-transform: uppercase;
            padding: 12px 32px;
            background: #000;
            color: var(--c-white);
            border: none;
            cursor: pointer;
            outline: none;
            transition: transform 0.1s, box-shadow 0.1s;
            
            /* Pixel Corners via Clip Path */
            clip-path: polygon(
                0px 0px, 
                100% 0px, 
                100% calc(100% - 10px), 
                calc(100% - 10px) 100%, 
                10px 100%, 
                0px calc(100% - 10px)
            );
        }

        /* START Button Styling */
        .btn-start {
            color: var(--c-cyan);
            /* Simulating border with box-shadow on clipped shape is tricky, using inset border hack */
            background: 
                linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0)),
                linear-gradient(#000, #000);
            background-origin: border-box;
            box-shadow: 
                0 0 0 4px #000, 
                0 0 0 8px var(--c-cyan),
                0 0 20px var(--c-cyan);
            text-shadow: 0 0 5px var(--c-cyan);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 0 0 4px #000, 
                0 0 0 8px var(--c-cyan),
                0 0 30px var(--c-cyan);
            background-color: rgba(0, 255, 255, 0.1);
        }

        .btn-start:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 4px #000, 0 0 0 8px var(--c-cyan);
        }

        /* OPTIONS Button Styling */
        .btn-opt {
            color: var(--c-purple);
            box-shadow: 
                0 0 0 4px #000, 
                0 0 0 8px var(--c-purple),
                0 0 15px var(--c-purple);
            text-shadow: 0 0 5px var(--c-purple);
        }

        .btn-opt:hover {
            transform: translateY(-2px);
            background-color: rgba(189, 0, 255, 0.1);
            box-shadow: 
                0 0 0 4px #000, 
                0 0 0 8px var(--c-purple),
                0 0 25px var(--c-purple);
        }

        /* --- 3D HIGHWAY --- */
        /* This container establishes the 3D world space */
        .highway-container {
            position: absolute;
            bottom: -20%; /* Push down so vanishing point aligns with sun */
            width: 100%;
            height: 60%;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 5;
        }

        .highway {
            width: 500px; /* Width at bottom */
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            /* The Tilt */
            transform: rotateX(65deg) scale(1.5);
            transform-origin: 50% 0%; /* Pivot at the horizon */
            
            /* Base Floor */
            background-color: #0a001a;
            overflow: hidden;
            
            /* Create the Grid using gradients */
            background-image: 
                /* Vertical Lanes */
                linear-gradient(90deg, 
                    transparent 0%, 
                    transparent 23%, 
                    var(--c-grid) 24%, 
                    var(--c-grid) 25%, 
                    transparent 26%, 
                    transparent 48%, 
                    var(--c-grid) 49%, 
                    var(--c-grid) 50%, 
                    transparent 51%, 
                    transparent 73%, 
                    var(--c-grid) 74%, 
                    var(--c-grid) 75%, 
                    transparent 76%, 
                    transparent 100%),
                /* Horizontal Perspective Lines */
                repeating-linear-gradient(
                    0deg, 
                    transparent 0%, 
                    transparent 48%, 
                    var(--c-grid) 49%, 
                    var(--c-grid) 50%, 
                    transparent 51%
                );
            
            background-size: 100% 100%, 100% 100px; /* Vertical grid size */
            
            /* Animation */
            animation: gridMove 1s linear infinite;
            
            /* Fade out at the top (horizon) */
            mask-image: linear-gradient(to top, black 20%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 20%, transparent 100%);
            
            /* Side Borders (Neon Glow) */
            border-left: 4px solid var(--c-purple);
            border-right: 4px solid var(--c-purple);
            box-shadow: 
                0 0 50px var(--c-purple), 
                inset 0 0 100px rgba(0,0,0,0.8);
        }

        /* Hit Line (The bottom bar) */
        .hit-line {
            position: absolute;
            bottom: 0;
            left: -10px;
            right: -10px;
            height: 10px;
            background: var(--c-cyan);
            box-shadow: 
                0 0 15px var(--c-cyan),
                0 0 30px var(--c-cyan);
            z-index: 10;
        }

        /* --- NOTES --- */
        .note {
            position: absolute;
            width: 22%; /* Fits inside lane */
            height: 20px;
            background: var(--c-cyan);
            border: 2px solid #fff;
            box-shadow: 0 0 10px var(--c-cyan);
            top: -50px;
            opacity: 0.9;
        }

        /* --- ANIMATIONS --- */
        @keyframes gridMove {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 0 0, 0 100px; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .highway { width: 320px; }
            .controls { flex-direction: column; }
            .btn { width: 200px; }
        }
    </style>
</head>
<body>

    <!-- Background Rendering (Sun, Stars) -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- CRT Overlay -->
    <div class="scanlines"></div>

    <div class="main-stage">
        
        <!-- UI LAYER -->
        <div class="ui-layer">
            <h1>PIXEL<br>DANCE</h1>
            <div class="subtitle">NEON EDITION</div>
            
            <div class="controls">
                <button class="btn btn-start" onclick="startGame()">START GAME</button>
                <button class="btn btn-opt" onclick="alert('Options Menu Placeholder')">OPTIONS</button>
            </div>
        </div>

        <!-- HIGHWAY LAYER -->
        <div class="highway-container">
            <div class="highway" id="highway">
                <div class="hit-line"></div>
                <!-- Notes injected via JS -->
            </div>
        </div>

    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Handles the background sun and stars.
         */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawBackground() {
            // 1. Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#050014');
            grad.addColorStop(0.4, '#1a0022');
            grad.addColorStop(1, '#2a0033');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. The Geometric Sun
            // Position: Horizon line (approx 38% down screen)
            const cx = width / 2;
            const cy = height * 0.38; 
            const r = Math.min(width, height) * 0.22;

            // Sun Gradient
            const sunGrad = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
            sunGrad.addColorStop(0, '#ffea00');
            sunGrad.addColorStop(0.5, '#ff8000');
            sunGrad.addColorStop(1, '#ff00ff');

            ctx.save();
            ctx.translate(cx, cy);

            // Glow
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#ff00ff';

            // Draw Base Sun
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = sunGrad;
            ctx.fill();

            // Draw Pixelated Stripes (Cutouts)
            // Using destination-out to "cut" holes in the sun
            ctx.globalCompositeOperation = 'destination-out';
            ctx.shadowBlur = 0; // No shadow for the cutouts

            const stripeCount = 12;
            const stripeGap = r * 2 / stripeCount;
            
            // Animate stripes scrolling down
            const scrollY = (time * 0.5) % stripeGap;

            for(let i = 0; i < stripeCount; i++) {
                // Calculate Y position relative to center
                let y = (i * stripeGap) - r + scrollY;
                
                // Taper height of stripes as they go up (perspective simulation)
                let h = 2 + (i * 2); 
                
                // Draw the cutout rect
                ctx.fillStyle = '#000'; // Color doesn't matter, it's an alpha cut
                ctx.fillRect(-r, y, r * 2, h);
            }

            ctx.restore();

            // 3. Stars
            ctx.fillStyle = '#ffffff';
            // Simple seeded random for stars to avoid flickering
            for(let i=0; i<150; i++) {
                const sx = (Math.sin(i * 123.45) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 67.89) * 0.5 + 0.5) * (height * 0.5);
                
                // Twinkle
                const twinkle = Math.abs(Math.sin(time * 0.05 + i));
                ctx.globalAlpha = 0.3 + (twinkle * 0.7);
                
                // Pixel stars (square)
                const size = (i % 5 === 0) ? 3 : 1;
                ctx.fillRect(sx, sy, size, size);
            }
            ctx.globalAlpha = 1.0;

            // 4. Horizon Line (Atmospheric glow)
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff00ff';
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, cy);
            ctx.lineTo(width, cy);
            ctx.stroke();
        }

        /**
         * GAME LOGIC
         * Spawns notes on the 3D highway
         */
        const highway = document.getElementById('highway');
        
        // High contrast Cyan/Blue notes
        const noteColors = ['#00ffff', '#00ccff', '#0099ff'];

        function spawnNote() {
            // Random Lane (0-3)
            const laneIdx = Math.floor(Math.random() * 4);
            
            const note = document.createElement('div');
            note.classList.add('note');
            
            // Position in lane
            // Lanes are 25% wide. Center of lane: 12.5%, 37.5%, 62.5%, 87.5%
            // Note width is approx 22%.
            const leftPos = (laneIdx * 25) + 1.5; 
            note.style.left = leftPos + '%';
            
            // Random color from palette
            const color = noteColors[Math.floor(Math.random() * noteColors.length)];
            note.style.backgroundColor = color;
            note.style.boxShadow = `0 0 10px ${color}`;

            highway.appendChild(note);

            // Animation
            const duration = 1500 + Math.random() * 1000;
            
            const animation = note.animate([
                { top: '-50px', opacity: 0 },
                { top: '0%', opacity: 1, offset: 0.1 },
                { top: '100%', opacity: 1 }
            ], {
                duration: duration,
                easing: 'linear'
            });

            animation.onfinish = () => {
                note.remove();
            };
        }

        // Main Loop
        function loop() {
            time++;
            drawBackground();
            
            // Spawn notes randomly
            if (Math.random() < 0.08) { // Slightly less frequent for menu screen
                spawnNote();
            }

            requestAnimationFrame(loop);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            const originalText = btn.innerText;
            btn.innerText = "LOADING...";
            
            // Simple visual transition
            document.body.style.cursor = "wait";
            
            setTimeout(() => {
                alert("INITIALIZING RHYTHM ENGINE...\n(This is a design prototype)");
                btn.innerText = originalText;
                document.body.style.cursor = "default";
            }, 600);
        }

        // Init
        loop();

    </script>
</body>
</html>
