<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - REVISED</title>
    <style>
        :root {
            /* Palette: Retro Synthwave / Pixel Identity */
            --c-bg-top: #0a001a;
            --c-bg-bot: #2d0036;
            --c-grid: #d900ff;
            --c-grid-dim: #4a0066;
            --c-cyan: #00f0ff;
            --c-magenta: #ff0055;
            --c-yellow: #ffcc00;
            --c-white: #ffffff;
            
            /* Pixel Font Fallback Stack */
            --font-pixel: "Courier New", "Lucida Console", monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: var(--c-bg-top);
            color: var(--c-white);
            font-family: var(--font-pixel);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- BACKGROUND CANVAS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            image-rendering: pixelated; /* Essential for pixel art look */
        }

        /* --- CRT / PIXEL OVERLAY --- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
            /* Vignette + Scanlines */
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        /* --- MAIN STAGE --- */
        .main-stage {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Changed to flex-start for better spacing control */
        }

        /* --- UI LAYER --- */
        .ui-layer {
            margin-top: 8vh; /* Push down slightly to avoid top edge */
            width: 100%;
            text-align: center;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Allow grid to show behind */
            background: transparent; 
        }

        /* Title Treatment: Crisp Pixel Style */
        h1 {
            font-size: clamp(3.5rem, 10vw, 8rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -4px;
            line-height: 0.9;
            color: var(--c-white);
            position: relative;
            margin-bottom: 20px; /* Tighter spacing */
            
            /* Hard Pixel Shadow */
            text-shadow: 
                4px 4px 0px var(--c-grid),
                8px 8px 0px rgba(0,0,0,0.5);
            
            /* Tighter Chromatic Aberration */
        }

        h1::before, h1::after {
            content: "PIXEL DANCE";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            opacity: 0.8;
        }

        h1::before {
            color: var(--c-cyan);
            z-index: -1;
            transform: translate(-2px, -1px); /* Tighter offset */
        }

        h1::after {
            color: var(--c-magenta);
            z-index: -2;
            transform: translate(2px, 1px); /* Tighter offset */
        }

        /* Subtitle: Pixel Font */
        .subtitle {
            font-family: var(--font-pixel);
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            letter-spacing: 4px;
            color: var(--c-yellow);
            text-transform: uppercase;
            margin-bottom: 50px; /* Increased spacing per critique */
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 20px;
            border: 2px solid var(--c-yellow);
            box-shadow: 0 0 15px var(--c-yellow);
            text-shadow: 0 0 5px var(--c-yellow);
            /* Pixel corners via clip-path */
            clip-path: polygon(
                10px 0, 100% 0, 
                100% calc(100% - 10px), calc(100% - 10px) 100%, 
                0 100%, 0 10px
            );
        }

        /* --- BUTTONS --- */
        .controls {
            display: flex;
            gap: 32px; /* Increased gap per critique */
            margin-top: 20px;
        }

        .btn {
            position: relative;
            font-family: var(--font-pixel);
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 16px 40px;
            color: #fff;
            border: none;
            cursor: pointer;
            outline: none;
            transition: transform 0.1s, box-shadow 0.1s;
            
            /* Pixel Border Shape */
            clip-path: polygon(
                0px 0px, 
                100% 0px, 
                100% calc(100% - 12px), 
                calc(100% - 12px) 100%, 
                12px 100%, 
                0px calc(100% - 12px)
            );
            background: #05000a; /* Dark fill */
        }

        /* START Button: Cyan Neon */
        .btn-start {
            color: var(--c-cyan);
            /* Simulated Neon Border using multiple box-shadows */
            box-shadow: 
                0 0 0 2px #000, /* Inner black border */
                0 0 0 6px var(--c-cyan), /* Cyan frame */
                0 0 20px var(--c-cyan); /* Glow */
            text-shadow: 0 0 8px var(--c-cyan);
        }

        .btn-start:hover {
            transform: translateY(-4px);
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 
                0 0 0 2px #000, 
                0 0 0 6px var(--c-cyan),
                0 0 40px var(--c-cyan);
        }

        /* OPTIONS Button: Magenta Neon */
        .btn-opt {
            color: var(--c-magenta);
            box-shadow: 
                0 0 0 2px #000,
                0 0 0 6px var(--c-magenta),
                0 0 20px var(--c-magenta);
            text-shadow: 0 0 8px var(--c-magenta);
        }

        .btn-opt:hover {
            transform: translateY(-4px);
            background: rgba(255, 0, 85, 0.1);
            box-shadow: 
                0 0 0 2px #000, 
                0 0 0 6px var(--c-magenta),
                0 0 40px var(--c-magenta);
        }

        /* --- 3D HIGHWAY --- */
        .highway-container {
            position: absolute;
            top: 0; /* Reset positioning */
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            pointer-events: none; /* Let clicks pass through to UI */
        }

        .highway {
            width: 600px;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            /* Aggressive Tilt for Synthwave feel */
            transform: rotateX(70deg) translateY(-10%); 
            transform-origin: 50% 0%;
            
            background-color: #050014;
            overflow: hidden;
            
            /* Pixelated Grid Lines */
            background-image: 
                /* Vertical Lanes (Thicker, solid) */
                linear-gradient(90deg, 
                    transparent 0%, 
                    transparent 23%, 
                    var(--c-grid) 24%, 
                    var(--c-grid) 26%, 
                    transparent 27%, 
                    transparent 48%, 
                    var(--c-grid) 49%, 
                    var(--c-grid) 51%, 
                    transparent 52%, 
                    transparent 73%, 
                    var(--c-grid) 74%, 
                    var(--c-grid) 76%, 
                    transparent 77%, 
                    transparent 100%),
                /* Horizontal Lines (Animated) */
                repeating-linear-gradient(
                    0deg, 
                    transparent 0%, 
                    transparent 48%, 
                    var(--c-grid) 49%, 
                    var(--c-grid) 50%, 
                    transparent 51%
                );
            
            background-size: 100% 100%, 100% 120px;
            
            animation: gridMove 1.2s linear infinite;
            
            /* Fade out at horizon */
            mask-image: linear-gradient(to top, black 40%, transparent 90%);
            -webkit-mask-image: linear-gradient(to top, black 40%, transparent 90%);
            
            /* Side Borders */
            border-left: 4px solid var(--c-grid);
            border-right: 4px solid var(--c-grid);
            box-shadow: 
                0 0 60px var(--c-grid), 
                inset 0 0 150px rgba(0,0,0,0.9);
        }

        /* Hit Line: Subdued */
        .hit-line {
            position: absolute;
            bottom: 0;
            left: -5%;
            right: -5%;
            height: 4px; /* Thinner */
            background: var(--c-cyan);
            opacity: 0.6; /* Subdued */
            box-shadow: 0 0 10px var(--c-cyan);
            z-index: 10;
        }

        /* --- NOTES --- */
        .note {
            position: absolute;
            width: 20%;
            height: 24px;
            border: 2px solid #fff;
            top: -50px;
            opacity: 0.9;
            /* Pixelated rendering for notes */
            image-rendering: pixelated; 
        }
        
        /* Distinct Lane Colors */
        .note.lane-0 { background: var(--c-cyan); box-shadow: 0 0 10px var(--c-cyan); }
        .note.lane-1 { background: var(--c-yellow); box-shadow: 0 0 10px var(--c-yellow); }
        .note.lane-2 { background: var(--c-yellow); box-shadow: 0 0 10px var(--c-yellow); }
        .note.lane-3 { background: var(--c-magenta); box-shadow: 0 0 10px var(--c-magenta); }

        @keyframes gridMove {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 0 0, 0 120px; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .highway { width: 320px; }
            .controls { flex-direction: column; gap: 20px; }
            .btn { width: 100%; max-width: 280px; }
        }
    </style>
</head>
<body>

    <!-- Background Rendering (Pixel Art Canvas) -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- CRT Overlay -->
    <div class="overlay"></div>

    <div class="main-stage">
        
        <!-- UI LAYER -->
        <div class="ui-layer">
            <h1>PIXEL<br>DANCE</h1>
            <div class="subtitle">NEON EDITION</div>
            
            <div class="controls">
                <button class="btn btn-start" onclick="startGame()">START GAME</button>
                <button class="btn btn-opt" onclick="alert('Options Menu Placeholder')">OPTIONS</button>
            </div>
        </div>

        <!-- HIGHWAY LAYER (Behind UI) -->
        <div class="highway-container">
            <div class="highway" id="highway">
                <div class="hit-line"></div>
                <!-- Notes injected via JS -->
            </div>
        </div>

    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Renders a pixel-art background with a geometric dancer silhouette.
         */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let time = 0;

        // Pixel Scale for the art
        const PIXEL_SIZE = 4; 

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            ctx.imageSmoothingEnabled = false; // Keep pixels sharp
        }
        window.addEventListener('resize', resize);
        resize();

        function drawBackground() {
            // 1. Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#050014');
            grad.addColorStop(0.5, '#1a0022');
            grad.addColorStop(1, '#2d0036');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. Pixel Stars
            ctx.fillStyle = '#ffffff';
            for(let i=0; i<100; i++) {
                // Deterministic pseudo-random positions
                const sx = (Math.sin(i * 123.45) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 67.89) * 0.5 + 0.5) * (height * 0.6); // Top 60% only
                
                const twinkle = Math.abs(Math.sin(time * 0.05 + i));
                ctx.globalAlpha = 0.4 + (twinkle * 0.6);
                
                // Draw square pixel stars
                const size = (i % 7 === 0) ? PIXEL_SIZE * 2 : PIXEL_SIZE;
                ctx.fillRect(Math.floor(sx/PIXEL_SIZE)*PIXEL_SIZE, Math.floor(sy/PIXEL_SIZE)*PIXEL_SIZE, size, size);
            }
            ctx.globalAlpha = 1.0;

            // 3. The Motif: Geometric Dancer Silhouette
            // Position: Horizon line (approx 45% down screen to allow grid flow)
            const cx = width / 2;
            const cy = height * 0.45; 
            const r = Math.min(width, height) * 0.18;

            ctx.save();
            ctx.translate(cx, cy);

            // Outer Glow
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ff0055';

            // Draw "Sun" Base (Teal/Orange Gradient)
            // Using a pixelated circle approach
            const sunGrad = ctx.createLinearGradient(0, -r, 0, r);
            sunGrad.addColorStop(0, '#00f0ff'); // Teal top
            sunGrad.addColorStop(0.6, '#ffcc00'); // Yellow mid
            sunGrad.addColorStop(1, '#ff0055'); // Magenta bot

            // Draw base circle
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = sunGrad;
            ctx.fill();

            // Draw Pixelated Cutout Stripes (The "Dancer" abstract shape)
            // We draw dark rectangles over the sun to create the silhouette
            ctx.globalCompositeOperation = 'source-over'; // Draw on top
            ctx.fillStyle = '#1a0022'; // Match mid-sky color to "cut"
            ctx.shadowBlur = 0;

            const stripeCount = 16;
            const totalH = r * 2.2;
            const gap = totalH / stripeCount;
            const scrollY = (time * 1.5) % (gap * 2);

            for(let i = 0; i < stripeCount; i++) {
                let y = (i * gap * 2) - r + scrollY;
                // Perspective taper: wider at bottom
                let h = 4 + (i * 2.5); 
                
                // Draw stripe
                ctx.fillRect(-r, y, r * 2, h);
            }

            // Overlay a Dancer Silhouette (Geometric)
            // Simple shape: Head, Body, Arms up, Legs split
            ctx.fillStyle = '#1a0022'; // Dark cutout
            const scale = r / 100;
            
            // Head
            ctx.fillRect(-10*scale, -80*scale, 20*scale, 20*scale);
            // Body
            ctx.fillRect(-15*scale, -60*scale, 30*scale, 60*scale);
            // Arms (Dancing pose)
            ctx.fillRect(-60*scale, -100*scale, 15*scale, 50*scale);
            ctx.fillRect(45*scale, -100*scale, 15*scale, 50*scale);
            // Legs
            ctx.fillRect(-40*scale, 0, 20*scale, 60*scale);
            ctx.fillRect(20*scale, 0, 20*scale, 60*scale);

            ctx.restore();

            // 4. Horizon Line
            ctx.fillStyle = '#d900ff';
            ctx.fillRect(0, cy, width, PIXEL_SIZE);
        }

        /**
         * GAME LOGIC
         * Spawns notes on the 3D highway
         */
        const highway = document.getElementById('highway');
        
        function spawnNote() {
            const laneIdx = Math.floor(Math.random() * 4);
            
            const note = document.createElement('div');
            note.classList.add('note');
            note.classList.add(`lane-${laneIdx}`);
            
            // Position logic
            const leftPos = (laneIdx * 25) + 2; // 2% padding
            note.style.left = leftPos + '%';
            
            highway.appendChild(note);

            // Animation
            const duration = 1200 + Math.random() * 800;
            
            const animation = note.animate([
                { top: '-50px', opacity: 0 },
                { top: '0%', opacity: 1, offset: 0.1 },
                { top: '100%', opacity: 1 }
            ], {
                duration: duration,
                easing: 'linear'
            });

            animation.onfinish = () => {
                note.remove();
            };
        }

        // Main Loop
        function loop() {
            time++;
            drawBackground();
            
            // Spawn notes
            if (Math.random() < 0.05) { 
                spawnNote();
            }

            requestAnimationFrame(loop);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            btn.innerText = "LOADING...";
            document.body.style.cursor = "wait";
            
            // Fake loading effect
            setTimeout(() => {
                alert("INITIALIZING RHYTHM ENGINE...\n(This is a design prototype)");
                btn.innerText = "START GAME";
                document.body.style.cursor = "default";
            }, 800);
        }

        // Init
        loop();

    </script>
</body>
</html>
