<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway Sphere</title>
<style>
  :root {
    --bg-color: #030305;
    --sidebar-width: 320px;
    --sidebar-bg: rgba(10, 10, 12, 0.65);
    --sidebar-border: rgba(255, 255, 255, 0.08);
    --accent-cyan: #06b6d4;
    --accent-magenta: #d946ef;
    --accent-amber: #f59e0b;
    --text-main: #e2e8f0;
    --text-muted: #64748b;
    --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "Roboto Mono", "JetBrains Mono", "Fira Code", "Courier New", monospace;
    --rhythm: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
  }

  /* --- Sidebar (Glassmorphic) --- */
  #sidebar {
    width: var(--sidebar-width);
    height: 100%;
    background: var(--sidebar-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-right: 1px solid var(--sidebar-border);
    z-index: 10;
    display: flex;
    flex-direction: column;
    padding: var(--rhythm);
    padding-top: 40px;
    padding-bottom: var(--rhythm);
    box-shadow: 5px 0 30px rgba(0,0,0,0.5);
  }

  /* Typography */
  h1 {
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 32px;
    color: #fff;
    border-bottom: 1px solid var(--sidebar-border);
    padding-bottom: 16px;
    position: relative;
  }
  
  h1::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta));
  }

  .section-label {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
    display: block;
  }

  /* Vertical Rhythm Spacing */
  .panel-section {
    margin-bottom: var(--rhythm);
  }

  /* Stats */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    padding-bottom: 4px;
  }
  
  .stat-name {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: var(--font-ui);
  }

  .stat-value {
    font-size: 1.25rem;
    font-weight: 500;
    font-family: var(--font-mono);
    color: #fff;
    letter-spacing: -0.02em;
  }

  /* Sliders */
  .slider-container {
    margin-top: 8px;
  }
  
  .slider-value {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--accent-cyan);
    float: right;
    margin-top: 4px;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    border: 2px solid var(--accent-cyan);
    box-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
    transition: transform 0.1s ease;
    margin-top: -6px; /* align center */
  }
  
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  /* Buttons */
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  button {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  button:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.3);
    box-shadow: 0 0 20px rgba(255,255,255,0.05);
    color: #fff;
  }

  button:active {
    transform: scale(0.98);
    background: rgba(255,255,255,0.1);
  }

  button.primary {
    border-color: rgba(6, 182, 212, 0.3);
    color: var(--accent-cyan);
  }
  button.primary:hover {
    background: rgba(6, 182, 212, 0.1);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
  }

  /* Footer */
  .footer {
    margin-top: auto;
    font-size: 0.65rem;
    color: var(--text-muted);
    opacity: 0.7;
    line-height: 1.6;
    font-family: var(--font-mono);
    border-top: 1px solid var(--sidebar-border);
    padding-top: 16px;
  }

  /* --- Canvas Container --- */
  #canvas-container {
    flex-grow: 1;
    position: relative;
    background: radial-gradient(circle at 50% 50%, #0a0a10 0%, #000000 100%);
    cursor: grab;
    overflow: hidden;
  }
  #canvas-container:active { cursor: grabbing; }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <h1>Conway Sphere</h1>

    <div class="panel-section">
      <span class="section-label">Simulation Data</span>
      <div class="stat-row">
        <span class="stat-name">Generation</span>
        <span class="stat-value" id="gen-count">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-name">Population</span>
        <span class="stat-value" id="pop-count">0</span>
      </div>
    </div>

    <div class="panel-section">
      <span class="section-label">Evolution Speed</span>
      <div class="slider-container">
        <input type="range" id="speed-slider" min="1" max="60" value="24">
        <span class="slider-value" id="speed-val">24 FPS</span>
      </div>
    </div>

    <div class="panel-section">
      <span class="section-label">Controls</span>
      <div class="btn-group">
        <button id="btn-pause" class="primary">Pause Simulation</button>
        <button id="btn-step">Step Forward</button>
        <button id="btn-reset">Randomize Grid</button>
      </div>
    </div>

    <div class="footer">
      DRAG TO ROTATE<br>SCROLL TO ZOOM
    </div>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

<script>
/**
 * Visual Design Implementation:
 * 1. Dynamic Multi-hue Color Map: Cyan (Young) -> Magenta (Mid) -> Amber (Old).
 * 2. Z-Attenuation: Cells closer to camera are larger/brighter.
 * 3. Wireframe: Subtle background grid to reinforce volume.
 * 4. Performance: Optimized neighbor calculation and rendering.
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 5000, 
  sphereRadius: 240,
  cellSizeBase: 2.5,
  rotationSpeed: 0.002,
  wireframeOpacity: 0.08,
  colors: {
    dead: 'rgba(255, 255, 255, 0.05)',
    // Gradient Logic: 
    // 0-20 Age: Cyan (180)
    // 20-50 Age: Magenta (290)
    // 50+ Age: Amber (30)
  }
};

// --- State ---
let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 24, 
  lastFrameTime: 0,
  rotation: { x: 0.6, y: 0.2 }, // Initial tilt
  zoom: 1.1,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width, height;

function resize() {
  const container = document.getElementById('canvas-container');
  width = container.clientWidth;
  height = container.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

// --- Game Logic ---

function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y);
    const theta = goldenAngle * i;
    
    points.push({
      x: Math.cos(theta) * radiusAtY * radius,
      y: y * radius,
      z: Math.sin(theta) * radiusAtY * radius
    });
  }
  return points;
}

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Optimization: Spatial hashing or grid would be better for N>5000, 
  // but for a single file demo, brute force is acceptable if optimized.
  const threshold = (2 * Math.PI * CONFIG.sphereRadius) / Math.sqrt(CONFIG.cellCount) * 1.15; 
  const thresholdSq = threshold * threshold;

  state.cells = points.map((p, i) => {
    const neighbors = [];
    // Only check neighbors to avoid O(N^2) every frame? 
    // We calculate neighbors ONCE at init.
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      const dx = p.x - points[j].x;
      const dy = p.y - points[j].y;
      const dz = p.z - points[j].z;
      if (dx*dx + dy*dy + dz*dz < thresholdSq) {
        neighbors.push(j);
      }
    }
    
    return {
      pos: p,
      neighbors: neighbors,
      alive: Math.random() > 0.65, // 35% density
      age: Math.random() > 0.65 ? Math.floor(Math.random() * 50) : 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  const nextCells = state.cells.map(cell => {
    const neighborCount = cell.neighbors.reduce((acc, idx) => acc + (state.cells[idx].alive ? 1 : 0), 0);
    
    if (cell.alive) {
      if (neighborCount < 2 || neighborCount > 3) return { alive: false, age: 0 };
      return { alive: true, age: cell.age + 1 };
    } else {
      if (neighborCount === 3) return { alive: true, age: 1 };
      return { alive: false, age: 0 };
    }
  });

  // Apply state
  state.cells.forEach((cell, i) => {
    cell.alive = nextCells[i].alive;
    cell.age = nextCells[i].age;
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 800;
  // Clamp z to avoid division by zero or flipping
  const scale = (fov / (fov + zFinal)) * zoom;
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // Clear
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#030305';
  ctx.fillRect(0, 0, width, height);

  // Prepare projected cells
  const projectedCells = state.cells.map(cell => {
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    return { cell, proj };
  });
  
  // Sort by Z (Painter's Algorithm) - Back to Front
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // 1. Draw Wireframe / Dead Grid
  // Draw all cells as faint dots to form the sphere shape
  ctx.beginPath();
  projectedCells.forEach(({ cell, proj }) => {
    // Only draw if roughly facing camera or just draw all for "solid" feel
    // We draw all but very small
    const size = Math.max(0.5, CONFIG.cellSizeBase * 0.6 * proj.scale);
    ctx.moveTo(proj.x + size, proj.y);
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
  });
  ctx.fillStyle = `rgba(255, 255, 255, ${CONFIG.wireframeOpacity})`;
  ctx.fill();

  // 2. Draw "Alive" cells (Glow Effect)
  ctx.globalCompositeOperation = 'lighter'; // Additive blending for neon look
  
  projectedCells.forEach(({ cell, proj }) => {
    if (cell.alive) {
      // Color Map: Cyan (180) -> Magenta (300) -> Amber (40)
      // Use a sine wave or linear interpolation based on age
      let hue;
      if (cell.age < 25) {
        // Cyan to Magenta
        hue = 180 + (cell.age / 25) * 120; 
      } else {
        // Magenta to Amber (wrap around 360)
        // Magenta is ~300. Amber is ~40 (or 400).
        const progress = (cell.age - 25) / 50; // 0 to 1
        hue = 300 + progress * 100; // 300 to 400
      }
      
      // Z-Attenuation for Brightness and Size
      // proj.z is roughly -Radius to +Radius. 
      // Normalize to 0..1 where 1 is closest.
      const depthNorm = (proj.z + CONFIG.sphereRadius) / (CONFIG.sphereRadius * 2);
      const alpha = 0.3 + (depthNorm * 0.7); // 0.3 to 1.0
      
      const size = CONFIG.cellSizeBase * proj.scale * (1 + (cell.age % 5) * 0.1);
      
      // Create a soft glow
      // Using shadowBlur for performance on large number of objects can be tricky, 
      // but for 5000 small dots it's usually okay on modern GPUs.
      ctx.shadowBlur = 8 * proj.scale;
      ctx.shadowColor = `hsla(${hue}, 100%, 50%, 0.6)`;
      ctx.fillStyle = `hsla(${hue}, 100%, 70%, ${alpha})`;
      
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = 'source-over';
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    state.rotation.y += CONFIG.rotationSpeed;
    
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation;
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop;
}

const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', () => {
  state.isRunning = !state.isRunning;
  btnPause.innerText = state.isRunning ? "Pause Simulation" : "Resume Simulation";
  btnPause.classList.toggle('primary');
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  btnPause.innerText = "Resume Simulation";
  btnPause.classList.remove('primary');
  stepGame();
  draw();
});

const speedSlider = document.getElementById('speed-slider');
const speedVal = document.getElementById('speed-val');
speedSlider.addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
  speedVal.innerText = state.speed + " FPS";
});

// Mouse Interaction
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(3, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
