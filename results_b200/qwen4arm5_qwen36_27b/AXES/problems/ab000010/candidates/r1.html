<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway Sphere</title>
<style>
  :root {
    --bg-color: #050508;
    --sidebar-width: 280px;
    --sidebar-bg: rgba(12, 12, 16, 0.6);
    --sidebar-border: rgba(255, 255, 255, 0.08);
    --accent-primary: #d946ef; /* Fuchsia */
    --accent-secondary: #3b82f6; /* Blue */
    --text-main: #ffffff;
    --text-muted: #94a3b8;
    --font-stack: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --rhythm: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
  }

  /* --- Sidebar (Glassmorphic) --- */
  #sidebar {
    width: var(--sidebar-width);
    height: 100%;
    background: var(--sidebar-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--sidebar-border);
    z-index: 10;
    display: flex;
    flex-direction: column;
    padding: var(--rhythm);
    padding-top: 48px; /* 48px top margin for title */
    padding-bottom: 48px; /* 48px bottom margin */
  }

  /* Typography */
  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    margin-bottom: 48px; /* Space between title and first section */
    background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .section-label {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 12px;
  }

  /* Vertical Rhythm Spacing */
  .panel-section {
    margin-bottom: var(--rhythm);
  }

  /* Stats */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  
  .stat-name {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    color: var(--text-main);
    text-shadow: 0 0 15px rgba(255,255,255,0.2);
  }

  /* Sliders */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
    margin-top: 8px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--text-main);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  /* Buttons */
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--sidebar-border);
    color: var(--text-main);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-align: center;
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.2);
    box-shadow: 0 0 15px rgba(255,255,255,0.05);
  }

  button:active {
    transform: scale(0.98);
  }

  /* Footer */
  .footer {
    margin-top: auto;
    font-size: 0.7rem;
    color: var(--text-muted);
    opacity: 0.6;
    line-height: 1.4;
  }

  /* --- Canvas Container --- */
  #canvas-container {
    flex-grow: 1;
    position: relative;
    background: radial-gradient(circle at 50% 50%, #11111a 0%, #050508 80%);
    cursor: grab;
    overflow: hidden;
  }
  #canvas-container:active { cursor: grabbing; }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

</style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <h1>Conway Sphere</h1>

    <div class="panel-section">
      <div class="section-label">Simulation Stats</div>
      <div class="stat-row">
        <span class="stat-name">Generation</span>
        <span class="stat-value" id="gen-count">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-name">Population</span>
        <span class="stat-value" id="pop-count">0</span>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-label">Evolution Speed</div>
      <input type="range" id="speed-slider" min="1" max="60" value="20">
    </div>

    <div class="panel-section">
      <div class="section-label">Controls</div>
      <div class="btn-group">
        <button id="btn-pause">Pause Simulation</button>
        <button id="btn-step">Step Forward</button>
        <button id="btn-reset">Randomize Grid</button>
      </div>
    </div>

    <div class="footer">
      DRAG TO ROTATE<br>SCROLL TO ZOOM
    </div>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

<script>
/**
 * Visual Design Implementation:
 * 1. Split layout with glassmorphic sidebar.
 * 2. Bloom effect via Canvas `globalCompositeOperation = 'lighter'` and shadow manipulation.
 * 3. Multi-hue palette: Alive cells cycle through Neon Purple, Pink, and Cyan based on age.
 * 4. Uniform distribution via Fibonacci Lattice.
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 4500, // Higher density for better 3D feel
  sphereRadius: 250,
  cellSize: 3.5,   // Base size
  rotationSpeed: 0.0015,
  colors: {
    dead: 'rgba(30, 40, 60, 0.15)',
    // Alive colors are calculated dynamically
  }
};

// --- State ---
let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 20, 
  lastFrameTime: 0,
  rotation: { x: 0.5, y: 0 }, // Initial tilt
  zoom: 1.2,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

let width, height;

function resize() {
  const container = document.getElementById('canvas-container');
  width = container.clientWidth;
  height = container.clientHeight;
  // Handle High DPI
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  dist: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return Math.sqrt(dx*dx + dy*dy + dz*dz);
  }
};

// --- Game Logic ---

function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y);
    const theta = goldenAngle * i;
    
    points.push({
      x: Math.cos(theta) * radiusAtY * radius,
      y: y * radius,
      z: Math.sin(theta) * radiusAtY * radius,
      idx: i
    });
  }
  return points;
}

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Calculate neighbors
  // Threshold for neighbor detection based on density
  const threshold = (2 * Math.PI * CONFIG.sphereRadius) / Math.sqrt(CONFIG.cellCount) * 1.1; 

  state.cells = points.map((p, i) => {
    const neighbors = [];
    // Optimization: Only check a subset or use spatial partition if N is huge. 
    // For 4500, N^2 is ~20M, acceptable for init once.
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      // Simple distance check
      const dx = p.x - points[j].x;
      const dy = p.y - points[j].y;
      const dz = p.z - points[j].z;
      if (dx*dx + dy*dy + dz*dz < threshold * threshold) {
        neighbors.push(j);
      }
    }
    
    return {
      pos: p,
      neighbors: neighbors,
      alive: Math.random() > 0.6, // 40% density
      age: 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  // Parallel update logic
  const nextCells = state.cells.map(cell => {
    const neighborCount = cell.neighbors.reduce((acc, idx) => acc + (state.cells[idx].alive ? 1 : 0), 0);
    
    if (cell.alive) {
      if (neighborCount < 2 || neighborCount > 3) return { alive: false, age: 0 };
      return { alive: true, age: cell.age + 1 };
    } else {
      if (neighborCount === 3) return { alive: true, age: 1 };
      return { alive: false, age: 0 };
    }
  });

  // Apply
  state.cells.forEach((cell, i) => {
    cell.alive = nextCells[i].alive;
    cell.age = nextCells[i].age;
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 600;
  const scale = (fov / (fov + zFinal)) * zoom;
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // Clear screen with slight trail for motion blur feel
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, width, height);

  // Prepare projected cells
  const projectedCells = state.cells.map(cell => {
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    return { cell, proj };
  });
  
  // Sort by Z (Painter's Algorithm)
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // 1. Draw "Dead" grid (Subtle background structure)
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = CONFIG.colors.dead;
  
  projectedCells.forEach(({ cell, proj }) => {
    if (!cell.alive) {
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, Math.max(1, CONFIG.cellSize * 0.5 * proj.scale), 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // 2. Draw "Alive" cells (Bloom Effect)
  // Use 'lighter' for additive color mixing (glow)
  ctx.globalCompositeOperation = 'lighter';
  
  projectedCells.forEach(({ cell, proj }) => {
    if (cell.alive) {
      // Color Logic:
      // Base Hue: 280 (Purple)
      // Shift: Based on age. Young cells = Pink/Cyan, Old cells = Deep Purple.
      // We use a sine wave for pulsing color effect.
      const hue = (280 + (cell.age * 5)) % 360;
      
      // Size pulsing
      const size = CONFIG.cellSize * proj.scale * (1 + Math.sin(cell.age * 0.2) * 0.2);
      
      // Gradient for each cell (simulates volumetric light)
      // Instead of creating gradients per frame (slow), we use radial gradients sparingly or just shadowBlur
      // ShadowBlur is expensive, so we use a simple radial gradient logic via fillStyle if possible, 
      // but standard canvas requires creating the object. 
      // Optimization: Use a large shadowBlur on the context.
      
      ctx.shadowBlur = 15 * proj.scale;
      ctx.shadowColor = `hsla(${hue}, 100%, 60%, 0.8)`;
      
      ctx.fillStyle = `hsla(${hue}, 100%, 80%, 0.9)`; // Core color
      
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  
  // Reset context
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = 'source-over';
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    // Auto rotation
    state.rotation.y += CONFIG.rotationSpeed;
    
    // Game Logic update
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation;
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop;
}

// Controls
const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', () => {
  state.isRunning = !state.isRunning;
  btnPause.innerText = state.isRunning ? "Pause Simulation" : "Resume Simulation";
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  btnPause.innerText = "Resume Simulation";
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
});

// Mouse Interaction
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(3, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
