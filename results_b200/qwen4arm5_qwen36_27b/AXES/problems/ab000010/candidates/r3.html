<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway Sphere: Evolution</title>
<style>
  :root {
    /* Palette */
    --bg-dark: #050508;
    --bg-gradient: radial-gradient(circle at 50% 50%, #131320 0%, #050508 100%);
    
    /* UI Colors */
    --glass-bg: rgba(20, 20, 25, 0.4);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.03);
    --accent-primary: #00f0ff; /* Cyan */
    --accent-secondary: #ff00ff; /* Magenta */
    --text-main: #ffffff;
    --text-muted: #8b9bb4;

    /* Typography */
    --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Menlo", "Monaco", "Consolas", "Courier New", monospace;
    --font-display: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; /* Fallback for geometric sans */

    /* Spacing */
    --sidebar-width: 340px;
    --gap-sm: 8px;
    --gap-md: 16px;
    --gap-lg: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; outline: none; user-select: none; }

  body {
    background: var(--bg-dark);
    background-image: var(--bg-gradient);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
  }

  /* --- Sidebar (Glassmorphism) --- */
  #sidebar {
    width: var(--sidebar-width);
    height: 100%;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--glass-border);
    z-index: 10;
    display: flex;
    flex-direction: column;
    padding: var(--gap-lg);
    box-shadow: 10px 0 40px rgba(0,0,0,0.6);
  }

  /* Typography & Headers */
  h1 {
    font-family: var(--font-display);
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: var(--gap-lg);
    color: #fff;
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  h1::before {
    content: '';
    display: block;
    width: 8px;
    height: 8px;
    background: var(--accent-primary);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent-primary);
  }

  .section-label {
    font-family: var(--font-display);
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: var(--gap-sm);
    display: block;
  }

  /* Vertical Rhythm Spacing */
  .panel-section {
    margin-bottom: var(--gap-lg);
  }

  /* Sliders */
  .slider-container {
    margin-top: var(--gap-sm);
  }
  
  .slider-label-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: var(--gap-sm);
  }

  .slider-value {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--accent-primary);
    text-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    border: 2px solid var(--accent-primary);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    transition: transform 0.15s ease;
    margin-top: -5px;
  }
  
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.3);
  }

  /* Buttons (Ghost Style) */
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: var(--gap-md);
  }

  button {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-main);
    padding: 14px 16px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 600;
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.25s ease;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.5);
    box-shadow: 0 0 20px rgba(255,255,255,0.1);
    color: #fff;
    transform: translateY(-1px);
  }

  button:active {
    transform: translateY(1px);
    background: rgba(255,255,255,0.15);
  }

  button.primary {
    border-color: rgba(0, 240, 255, 0.4);
    color: var(--accent-primary);
    background: rgba(0, 240, 255, 0.05);
  }
  
  button.primary:hover {
    background: rgba(0, 240, 255, 0.15);
    border-color: var(--accent-primary);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
  }

  /* --- Canvas Container --- */
  #canvas-container {
    flex-grow: 1;
    position: relative;
    /* Starfield background handled in JS or CSS radial gradient */
    cursor: grab;
    overflow: hidden;
  }
  #canvas-container:active { cursor: grabbing; }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* --- Floating Overlay (Stats) --- */
  #stats-overlay {
    position: absolute;
    top: 24px;
    right: 24px;
    background: rgba(10, 10, 15, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    padding: 16px 20px;
    min-width: 180px;
    pointer-events: none; /* Let clicks pass through */
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    z-index: 5;
  }

  .overlay-stat {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 6px;
  }
  .overlay-stat:last-child { margin-bottom: 0; }

  .overlay-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
  }

  .overlay-value {
    font-family: var(--font-mono);
    font-size: 1.1rem;
    color: #fff;
    font-weight: 500;
    text-shadow: 0 0 8px rgba(255,255,255,0.2);
  }

  /* --- Interaction Hint --- */
  #interaction-hint {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    pointer-events: none;
    display: flex;
    gap: 20px;
    opacity: 0.8;
    transition: opacity 0.5s;
  }
  
  .hint-icon {
    display: inline-block;
    width: 4px;
    height: 4px;
    background: currentColor;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }

</style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <h1>Conway Sphere</h1>

    <div class="panel-section">
      <span class="section-label">Evolution Speed</span>
      <div class="slider-container">
        <div class="slider-label-row">
          <span style="font-size: 0.8rem; color: #fff;">Frame Rate</span>
          <span class="slider-value" id="speed-val">24 FPS</span>
        </div>
        <input type="range" id="speed-slider" min="1" max="60" value="24">
      </div>
    </div>

    <div class="panel-section">
      <span class="section-label">Controls</span>
      <div class="btn-group">
        <button id="btn-pause" class="primary">Pause Simulation</button>
        <button id="btn-step">Step Forward</button>
        <button id="btn-reset">Randomize Grid</button>
      </div>
    </div>
    
    <!-- Visual filler to balance layout if needed, or just clean space -->
    <div style="margin-top: auto; border-top: 1px solid var(--glass-border); padding-top: 16px;">
      <div style="font-size: 0.65rem; color: var(--text-muted); line-height: 1.5;">
        SYSTEM STATUS: ONLINE<br>
        RENDERER: WEBGL/2D HYBRID
      </div>
    </div>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
    
    <!-- Floating Stats Overlay -->
    <div id="stats-overlay">
      <div class="overlay-stat">
        <span class="overlay-label">Generation</span>
        <span class="overlay-value" id="gen-count">0</span>
      </div>
      <div class="overlay-stat">
        <span class="overlay-label">Population</span>
        <span class="overlay-value" id="pop-count">0</span>
      </div>
    </div>

    <!-- Interaction Hint -->
    <div id="interaction-hint">
      <span><span class="hint-icon"></span>Drag to Rotate</span>
      <span><span class="hint-icon"></span>Scroll to Zoom</span>
    </div>
  </div>

<script>
/**
 * Design Implementation:
 * 1. Multi-hue Palette: Indigo -> Blue -> Magenta -> Yellow based on cell age.
 * 2. Bloom/Glow: Additive blending + shadow blur on active cells.
 * 3. Background: Subtle stars + Radial gradient.
 * 4. Layout: Stats moved to overlay.
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 4500, // Slightly reduced for performance with glow
  sphereRadius: 220,
  cellSizeBase: 2.2,
  rotationSpeed: 0.0015,
  colors: {
    // HSL Hue mapping
    hueStart: 240, // Indigo
    hueEnd: 45,    // Yellow
  }
};

// --- State ---
let state = {
  cells: [],
  stars: [],
  generation: 0,
  isRunning: true,
  speed: 24, 
  lastFrameTime: 0,
  rotation: { x: 0.6, y: 0.2 }, 
  zoom: 1.2,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width, height;

function resize() {
  const container = document.getElementById('canvas-container');
  width = container.clientWidth;
  height = container.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
  
  // Re-init stars on resize
  initStars();
}

function initStars() {
  state.stars = [];
  for(let i=0; i<200; i++) {
    state.stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 1.5,
      alpha: Math.random() * 0.5 + 0.1
    });
  }
}

window.addEventListener('resize', resize);
resize();

// --- Game Logic ---

function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y);
    const theta = goldenAngle * i;
    
    points.push({
      x: Math.cos(theta) * radiusAtY * radius,
      y: y * radius,
      z: Math.sin(theta) * radiusAtY * radius
    });
  }
  return points;
}

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  const threshold = (2 * Math.PI * CONFIG.sphereRadius) / Math.sqrt(CONFIG.cellCount) * 1.15; 
  const thresholdSq = threshold * threshold;

  state.cells = points.map((p, i) => {
    const neighbors = [];
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      const dx = p.x - points[j].x;
      const dy = p.y - points[j].y;
      const dz = p.z - points[j].z;
      if (dx*dx + dy*dy + dz*dz < thresholdSq) {
        neighbors.push(j);
      }
    }
    
    return {
      pos: p,
      neighbors: neighbors,
      alive: Math.random() > 0.6, // 40% density
      age: Math.random() > 0.6 ? Math.floor(Math.random() * 50) : 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  const nextCells = state.cells.map(cell => {
    const neighborCount = cell.neighbors.reduce((acc, idx) => acc + (state.cells[idx].alive ? 1 : 0), 0);
    
    if (cell.alive) {
      if (neighborCount < 2 || neighborCount > 3) return { alive: false, age: 0 };
      return { alive: true, age: cell.age + 1 };
    } else {
      if (neighborCount === 3) return { alive: true, age: 1 };
      return { alive: false, age: 0 };
    }
  });

  state.cells.forEach((cell, i) => {
    cell.alive = nextCells[i].alive;
    cell.age = nextCells[i].age;
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 800;
  const scale = (fov / (fov + zFinal)) * zoom;
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // Clear with slight transparency for trails? No, keep it clean per design.
  // Redraw background gradient manually or just clearRect if bg is set in CSS?
  // Canvas needs to clear.
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, width, height);

  // Draw Stars
  state.stars.forEach(star => {
    ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI*2);
    ctx.fill();
  });

  // Prepare projected cells
  const projectedCells = state.cells.map(cell => {
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    return { cell, proj };
  });
  
  // Sort by Z (Painter's Algorithm)
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // 1. Draw Dead Cells (Wireframe/Base Sphere)
  // Using a faint dark blue/grey to hint at the shape
  ctx.beginPath();
  projectedCells.forEach(({ cell, proj }) => {
    const size = Math.max(0.5, CONFIG.cellSizeBase * 0.4 * proj.scale);
    ctx.moveTo(proj.x + size, proj.y);
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
  });
  ctx.fillStyle = 'rgba(40, 50, 70, 0.3)';
  ctx.fill();

  // 2. Draw Alive Cells (Glow)
  ctx.globalCompositeOperation = 'lighter'; // Additive blending
  
  projectedCells.forEach(({ cell, proj }) => {
    if (cell.alive) {
      // Color Logic: Age -> Hue
      // 0-25: Indigo(240) -> Blue(200)
      // 25-50: Blue(200) -> Magenta(300) -> Yellow(45)
      
      let hue;
      if (cell.age < 25) {
        // 240 down to 200
        hue = 240 - (cell.age / 25) * 40;
      } else {
        // 200 to 45 (passing through magenta 300? No, standard wheel 200->300->45)
        // Actually, let's do: 240 (Indigo) -> 180 (Cyan) -> 300 (Magenta) -> 60 (Yellow)
        // Let's stick to the brief: Indigo -> Electric Blue -> Neon Magenta -> Hot Yellow
        // 260 -> 210 -> 300 -> 50
        
        const progress = (cell.age - 25) / 50; // 0 to 1
        // Start at 210 (Electric Blue)
        // End at 50 (Hot Yellow)
        // We need to cross 360/0.
        // 210 -> 300 (Magenta) -> 50.
        hue = 210 + (progress * (50 + (360-300) + (300-210)));
        if (hue > 360) hue -= 360;
      }
      
      // Z-Attenuation
      const depthNorm = (proj.z + CONFIG.sphereRadius) / (CONFIG.sphereRadius * 2);
      const alpha = 0.4 + (depthNorm * 0.6); // Closer = Brighter
      
      const size = CONFIG.cellSizeBase * proj.scale;
      
      // Glow
      ctx.shadowBlur = 12 * proj.scale;
      ctx.shadowColor = `hsla(${hue}, 100%, 60%, 0.5)`;
      ctx.fillStyle = `hsla(${hue}, 100%, 75%, ${alpha})`;
      
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = 'source-over';
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    state.rotation.y += CONFIG.rotationSpeed;
    
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation;
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop;
}

const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', () => {
  state.isRunning = !state.isRunning;
  btnPause.innerText = state.isRunning ? "Pause Simulation" : "Resume Simulation";
  btnPause.classList.toggle('primary');
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  btnPause.innerText = "Resume Simulation";
  btnPause.classList.remove('primary');
  stepGame();
  draw();
});

const speedSlider = document.getElementById('speed-slider');
const speedVal = document.getElementById('speed-val');
speedSlider.addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
  speedVal.innerText = state.speed + " FPS";
});

// Mouse Interaction
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(3, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
