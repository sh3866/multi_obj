<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway Sphere: Evolution</title>
<style>
  :root {
    /* Palette - Neon & Dark */
    --bg-dark: #030305;
    --bg-gradient: radial-gradient(circle at 50% 50%, #1a1a24 0%, #050508 100%);
    
    /* UI Colors */
    --glass-bg: rgba(10, 10, 14, 0.6);
    --glass-border: rgba(255, 255, 255, 0.08);
    --text-main: #ffffff;
    --text-muted: #8b9bb4;
    --accent-primary: #00f0ff; /* Cyan */
    --accent-secondary: #ff00ff; /* Magenta */
    --accent-tertiary: #ffaa00; /* Orange */

    /* Typography */
    --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Menlo", "Monaco", "Consolas", "Courier New", monospace;

    /* Spacing - 8pt Grid */
    --sidebar-width: 320px;
    --gap-xs: 8px;
    --gap-sm: 16px;
    --gap-md: 24px; /* Major section gap */
    --gap-lg: 48px; /* Footer gap */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; outline: none; user-select: none; }

  body {
    background: var(--bg-dark);
    background-image: var(--bg-gradient);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
  }

  /* --- Sidebar --- */
  #sidebar {
    width: var(--sidebar-width);
    height: 100%;
    background: var(--glass-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-right: 1px solid var(--glass-border);
    z-index: 10;
    display: flex;
    flex-direction: column;
    padding: var(--gap-md);
    box-shadow: 10px 0 50px rgba(0,0,0,0.5);
  }

  /* Typography */
  h1 {
    font-size: 1rem; /* Demoted size */
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: var(--gap-md);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  h1::before {
    content: '';
    display: block;
    width: 6px;
    height: 6px;
    background: var(--accent-primary);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-primary);
  }

  .section-label {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: var(--gap-xs);
    display: block;
  }

  .panel-section {
    margin-bottom: var(--gap-md);
  }

  /* Sliders */
  .slider-container {
    width: 100%;
  }
  
  .slider-label-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: var(--gap-xs);
  }

  .slider-value {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--accent-primary);
    font-weight: 600;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    border: 2px solid var(--accent-primary);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    transition: transform 0.15s ease;
    margin-top: -6px; /* Center on track */
  }
  
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  /* Buttons */
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: var(--gap-xs); /* Tighter gap */
    width: 100%;
  }

  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 0.8rem;
    font-weight: 700; /* Increased weight */
    font-family: var(--font-ui);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.3);
    transform: translateY(-1px);
  }

  button.primary {
    border-color: rgba(0, 240, 255, 0.3);
    color: var(--accent-primary);
    background: rgba(0, 240, 255, 0.05);
  }
  
  button.primary:hover {
    background: rgba(0, 240, 255, 0.15);
    border-color: var(--accent-primary);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
  }

  /* Stats Card (Moved to Sidebar) */
  .stats-card {
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--glass-border);
    border-radius: 4px;
    padding: 16px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .stat-row:last-child { margin-bottom: 0; }

  .stat-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    font-weight: 600;
  }

  .stat-value {
    font-family: var(--font-mono);
    font-size: 1rem;
    color: #fff;
    font-weight: 500;
  }

  /* Footer / Hints */
  #sidebar-footer {
    margin-top: auto;
    padding-top: var(--gap-lg); /* Deliberate 48px gap */
    border-top: 1px solid rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .footer-hint {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: rgba(255,255,255,0.6); /* Boosted contrast */
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .hint-icon {
    width: 4px;
    height: 4px;
    background: var(--accent-primary);
    border-radius: 50%;
    box-shadow: 0 0 4px var(--accent-primary);
  }

  /* --- Canvas Container --- */
  #canvas-container {
    flex-grow: 1;
    position: relative;
    cursor: grab;
    overflow: hidden;
    background: radial-gradient(circle at center, #111118 0%, #000000 100%);
  }
  #canvas-container:active { cursor: grabbing; }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

</style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <h1>Conway Sphere</h1>

    <!-- Controls Section -->
    <div class="panel-section">
      <span class="section-label">Controls</span>
      <div class="btn-group">
        <button id="btn-pause" class="primary">Pause Simulation</button>
        <button id="btn-step">Step Forward</button>
        <button id="btn-reset">Randomize Grid</button>
      </div>
    </div>

    <!-- Settings Section -->
    <div class="panel-section">
      <span class="section-label">Parameters</span>
      <div class="slider-container">
        <div class="slider-label-row">
          <span style="font-size: 0.8rem; color: #ccc;">Evolution Speed</span>
          <span class="slider-value" id="speed-val">24 FPS</span>
        </div>
        <input type="range" id="speed-slider" min="1" max="60" value="24">
      </div>
    </div>

    <!-- Stats Section (Moved here from overlay) -->
    <div class="panel-section">
      <span class="section-label">System Stats</span>
      <div class="stats-card">
        <div class="stat-row">
          <span class="stat-label">Generation</span>
          <span class="stat-value" id="gen-count">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Population</span>
          <span class="stat-value" id="pop-count">0</span>
        </div>
      </div>
    </div>

    <!-- Footer / Hints -->
    <div id="sidebar-footer">
      <div class="footer-hint">
        <span class="hint-icon"></span> Drag to Rotate
      </div>
      <div class="footer-hint">
        <span class="hint-icon"></span> Scroll to Zoom
      </div>
      <div style="margin-top: 8px; font-size: 0.6rem; color: rgba(255,255,255,0.3); font-family: var(--font-mono);">
        RENDER: CANVAS 2D<br>
        MODE: VOLUMETRIC
      </div>
    </div>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

<script>
/**
 * Design Implementation:
 * 1. Palette: Cyan (New) -> Magenta (Old) -> Orange (Dead)
 * 2. Volumetric: Z-depth scaling + Additive blending (lighter)
 * 3. Layout: Clean sidebar hierarchy, stats integrated.
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 5000, 
  sphereRadius: 250,
  cellSizeBase: 2.5,
  rotationSpeed: 0.001,
  colors: {
    // Age-based gradient: Cyan -> Magenta -> Orange
    cyan: [0, 240, 255],    // 0-20 generations
    magenta: [255, 0, 255], // 20-40 generations
    orange: [255, 150, 0]   // 40+ generations
  }
};

// --- State ---
let state = {
  cells: [],
  stars: [],
  generation: 0,
  isRunning: true,
  speed: 24, 
  lastFrameTime: 0,
  rotation: { x: 0.6, y: 0.2 }, 
  zoom: 1.2,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width, height;

function resize() {
  const container = document.getElementById('canvas-container');
  width = container.clientWidth;
  height = container.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
  initStars();
}

function initStars() {
  state.stars = [];
  for(let i=0; i<150; i++) {
    state.stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 1.5,
      alpha: Math.random() * 0.4 + 0.1
    });
  }
}

window.addEventListener('resize', resize);
resize();

// --- Game Logic ---

function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y);
    const theta = goldenAngle * i;
    
    points.push({
      x: Math.cos(theta) * radiusAtY * radius,
      y: y * radius,
      z: Math.sin(theta) * radiusAtY * radius
    });
  }
  return points;
}

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Determine neighbor threshold based on density
  const threshold = (2 * Math.PI * CONFIG.sphereRadius) / Math.sqrt(CONFIG.cellCount) * 1.2; 
  const thresholdSq = threshold * threshold;

  state.cells = points.map((p, i) => {
    const neighbors = [];
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      const dx = p.x - points[j].x;
      const dy = p.y - points[j].y;
      const dz = p.z - points[j].z;
      if (dx*dx + dy*dy + dz*dz < thresholdSq) {
        neighbors.push(j);
      }
    }
    
    return {
      pos: p,
      neighbors: neighbors,
      alive: Math.random() > 0.65, // 35% density
      age: Math.random() > 0.65 ? Math.floor(Math.random() * 50) : 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  const nextCells = state.cells.map(cell => {
    const neighborCount = cell.neighbors.reduce((acc, idx) => acc + (state.cells[idx].alive ? 1 : 0), 0);
    
    if (cell.alive) {
      if (neighborCount < 2 || neighborCount > 3) return { alive: false, age: 0 };
      return { alive: true, age: cell.age + 1 };
    } else {
      if (neighborCount === 3) return { alive: true, age: 1 };
      return { alive: false, age: 0 };
    }
  });

  state.cells.forEach((cell, i) => {
    cell.alive = nextCells[i].alive;
    cell.age = nextCells[i].age;
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 900;
  const scale = (fov / (fov + zFinal)) * zoom;
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

// Color interpolation helper
function lerpColor(c1, c2, t) {
  return [
    c1[0] + (c2[0] - c1[0]) * t,
    c1[1] + (c2[1] - c1[1]) * t,
    c1[2] + (c2[2] - c1[2]) * t
  ];
}

function draw() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, width, height);

  // Stars
  state.stars.forEach(star => {
    ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI*2);
    ctx.fill();
  });

  // Prepare projected cells
  const projectedCells = state.cells.map(cell => {
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    return { cell, proj };
  });
  
  // Sort by Z (Painter's Algorithm)
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // 1. Draw Dead Cells (Wireframe)
  // Subtle dark grey/blue
  ctx.fillStyle = 'rgba(30, 40, 60, 0.4)';
  projectedCells.forEach(({ cell, proj }) => {
    // Scale size by depth
    const size = Math.max(0.5, CONFIG.cellSizeBase * 0.3 * proj.scale);
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
  });

  // 2. Draw Alive Cells (Glow)
  ctx.globalCompositeOperation = 'lighter'; // Additive blending for neon look
  
  projectedCells.forEach(({ cell, proj }) => {
    if (cell.alive) {
      // Color Logic: Age -> Gradient
      // 0-20: Cyan -> Magenta
      // 20-40: Magenta -> Orange
      let color;
      if (cell.age < 20) {
        color = lerpColor(CONFIG.colors.cyan, CONFIG.colors.magenta, cell.age / 20);
      } else {
        color = lerpColor(CONFIG.colors.magenta, CONFIG.colors.orange, Math.min(1, (cell.age - 20) / 20));
      }
      
      const r = Math.floor(color[0]);
      const g = Math.floor(color[1]);
      const b = Math.floor(color[2]);
      
      // Z-Attenuation for glow intensity
      const depthNorm = (proj.z + CONFIG.sphereRadius) / (CONFIG.sphereRadius * 2);
      const alpha = 0.5 + (depthNorm * 0.5); // Closer = Brighter
      
      const size = CONFIG.cellSizeBase * proj.scale;
      
      // Bloom effect
      ctx.shadowBlur = 15 * proj.scale;
      ctx.shadowColor = `rgba(${r}, ${g}, ${b}, 0.6)`;
      ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
      
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = 'source-over';
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    state.rotation.y += CONFIG.rotationSpeed;
    
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation;
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop;
}

const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', () => {
  state.isRunning = !state.isRunning;
  btnPause.innerText = state.isRunning ? "Pause Simulation" : "Resume Simulation";
  btnPause.classList.toggle('primary');
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  btnPause.innerText = "Resume Simulation";
  btnPause.classList.remove('primary');
  stepGame();
  draw();
});

const speedSlider = document.getElementById('speed-slider');
const speedVal = document.getElementById('speed-val');
speedSlider.addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
  speedVal.innerText = state.speed + " FPS";
});

// Mouse Interaction
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(3, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
