<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette - Revised: Deep Indigo, Teal, Rich Gold */
        --bg-deep: #05060a;
        --bg-dark: #0b0c14;
        
        /* Golds - Metallic & Rich */
        --gold-dark: #8a6e2f;
        --gold-mid: #d4af37;
        --gold-light: #ffe680;
        --gold-glow: rgba(212, 175, 55, 0.3);
        
        /* Mystical Accents - Teal/Indigo replacing Cyan */
        --teal-mystic: #4fd1c5;
        --teal-deep: #2c7a7b;
        --teal-glow: rgba(79, 209, 197, 0.4);
        
        /* UI Surfaces - Stone/Rune feel */
        --stone-dark: #1a1c23;
        --stone-light: #2d303b;
        --border-glow: rgba(255, 255, 255, 0.1);
        
        /* Typography */
        --font-brand: 'Palatino Linotype', 'Book Antiqua', Palatino, 'Times New Roman', serif;
        --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: #E5E5E5;
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* --- Background Layers --- */
    
    /* 1. Base Gradient - Deeper Indigo */
    .bg-gradient {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 30%, #161b30 0%, #05060a 80%);
        z-index: 0;
    }

    /* 2. Vignette/Fog */
    .bg-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 30%, var(--bg-deep) 90%);
        z-index: 2;
        pointer-events: none;
    }

    /* 3. Noise Texture */
    .bg-noise {
        position: absolute;
        inset: 0;
        z-index: 3;
        opacity: 0.04;
        pointer-events: none;
        filter: contrast(120%) brightness(100%);
    }

    /* 4. Particles Canvas */
    #canvas-bg {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 900px;
        height: 100%;
        display: flex;
        flex-direction: column;
        /* 1. Layout: Pull content up, pad bottom */
        padding: 2rem 2rem 4rem 2rem; 
        justify-content: flex-start; /* Top alignment flow */
    }

    /* --- Header --- */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        height: 40px;
        margin-bottom: 1rem;
    }

    .currency-pill {
        background: rgba(10, 10, 15, 0.6);
        border: 1px solid var(--gold-dark);
        border-radius: 20px; /* Pill shape */
        padding: 0.4rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        backdrop-filter: blur(4px);
    }

    .coin-icon {
        width: 20px;
        height: 20px;
        fill: url(#gold-grad-icon);
        filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5));
    }

    .currency-amount {
        font-family: var(--font-brand);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-light);
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        letter-spacing: 0.5px;
    }

    /* --- Hero Section --- */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        text-align: center;
        position: relative;
        width: 100%;
        flex-grow: 0; /* Don't stretch, let content dictate size */
        margin-bottom: 3rem; /* Space before nav */
    }

    /* Typography Hierarchy */
    .game-title {
        font-family: var(--font-brand);
        font-size: 3.5rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.5rem;
        /* 3. Visual Polish: Metallic Gradient */
        background: linear-gradient(to bottom, var(--gold-light) 0%, var(--gold-mid) 50%, var(--gold-dark) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
        position: relative;
        z-index: 20;
    }

    /* 4. Typography: Elegant serif, no underscore */
    .game-subtitle {
        font-family: var(--font-brand);
        font-size: 1.2rem; 
        /* 3. Color: Mystical Teal */
        color: var(--teal-mystic);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-bottom: 2rem;
        opacity: 0.9;
        text-shadow: 0 0 10px var(--teal-glow);
        font-weight: 400;
        font-style: italic;
    }

    /* --- The Summoning Circle (Integrated) --- */
    .vortex-wrapper {
        position: relative;
        width: 300px;
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 1rem;
    }

    /* Vortex Rings - Thematic */
    .vortex-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid transparent;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .ring-outer {
        width: 100%;
        height: 100%;
        border-top: 2px solid var(--teal-mystic);
        border-bottom: 2px solid var(--teal-mystic);
        border-left: 1px solid rgba(79, 209, 197, 0.3);
        border-right: 1px solid rgba(79, 209, 197, 0.3);
        animation: spin-slow 20s linear infinite;
        box-shadow: 0 0 15px var(--teal-glow);
    }

    .ring-middle {
        width: 80%;
        height: 80%;
        border: 1px dashed var(--gold-mid);
        animation: spin-reverse 30s linear infinite;
        opacity: 0.7;
    }

    .ring-inner {
        width: 50%;
        height: 50%;
        border: 1px solid rgba(79, 209, 197, 0.2);
        background: radial-gradient(circle, rgba(79, 209, 197, 0.05) 0%, transparent 70%);
    }

    /* Central Core Glow */
    .vortex-core {
        position: absolute;
        width: 20%;
        height: 20%;
        border-radius: 50%;
        background: radial-gradient(circle, var(--teal-mystic) 0%, transparent 70%);
        box-shadow: 0 0 30px var(--teal-mystic);
        animation: pulse 4s ease-in-out infinite;
        z-index: 1;
    }

    /* --- Navigation Container --- */
    .nav-container {
        position: relative;
        z-index: 20;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2.5rem;
    }

    /* 5. CTA Clarity: Summon Button */
    .btn-summon-wrapper {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 30;
        width: 160px;
        height: 160px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
    }

    .btn-summon {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        /* Stone texture */
        background: radial-gradient(circle at 30% 30%, #3a3c47, #1a1c23);
        border: 3px solid var(--gold-mid);
        box-shadow: 
            0 0 20px var(--gold-glow), 
            inset 0 0 25px rgba(0,0,0,0.9),
            0 10px 20px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
    }

    .btn-summon:hover {
        transform: scale(1.08);
        border-color: var(--gold-light);
        box-shadow: 0 0 40px var(--gold-glow), inset 0 0 15px rgba(212, 175, 55, 0.3);
    }

    .btn-summon:active {
        transform: scale(0.95);
    }

    .summon-icon {
        width: 36px;
        height: 36px;
        fill: var(--gold-light);
        margin-bottom: 6px;
        filter: drop-shadow(0 0 6px var(--gold-mid));
    }

    .summon-text {
        font-family: var(--font-brand);
        font-size: 1rem; /* Increased size */
        font-weight: 700;
        color: var(--gold-light);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* 2. Navigation Redesign: Curved Row */
    .secondary-nav {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1.5rem;
        width: 100%;
        /* Create the curve using transform on items */
        transform: translateY(20px); 
    }

    .nav-item-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.3s ease;
    }

    /* Curve logic: Middle lower, sides higher */
    .nav-item-wrapper:nth-child(2) { transform: translateY(0px); }
    .nav-item-wrapper:nth-child(1) { transform: translateY(-15px); }
    .nav-item-wrapper:nth-child(3) { transform: translateY(-15px); }

    /* 3. Visual Polish: Rune Tiles / Stone Tablets */
    .nav-card {
        width: 70px;
        height: 70px;
        /* Trapezoid/Pill shape approximation */
        border-radius: 12px 12px 25px 25px; 
        background: linear-gradient(180deg, var(--stone-light) 0%, var(--stone-dark) 100%);
        
        /* Ornate Borders */
        border: 2px solid var(--gold-dark);
        border-top: 4px solid var(--gold-mid);
        border-bottom: 1px solid var(--gold-dark);
        
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        box-shadow: 0 8px 15px rgba(0,0,0,0.6);
    }

    /* Hover State */
    .nav-card:hover {
        background: linear-gradient(180deg, #3a3c47 0%, #252833 100%);
        border-color: var(--teal-mystic);
        border-top-color: var(--teal-mystic);
        box-shadow: 0 0 20px var(--teal-glow);
    }

    /* 4. Iconography: High Fidelity SVGs */
    .nav-icon {
        width: 28px;
        height: 28px;
        fill: var(--teal-mystic);
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        transition: all 0.3s ease;
    }

    .nav-card:hover .nav-icon {
        fill: #fff;
        filter: drop-shadow(0 0 8px var(--teal-mystic));
    }

    .nav-label {
        margin-top: 12px;
        font-family: var(--font-brand);
        font-weight: 600;
        font-size: 0.85rem;
        color: #A0A0A0;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        transition: color 0.3s ease;
    }

    .nav-item-wrapper:hover .nav-label {
        color: var(--teal-mystic);
    }

    /* Footer */
    footer {
        text-align: center;
        color: var(--gold-dark);
        font-size: 0.75rem;
        opacity: 0.6;
        letter-spacing: 0.1em;
        margin-top: auto; /* Push to bottom of container */
        padding-bottom: 1rem;
        font-family: var(--font-ui);
    }

    /* --- Animations --- */
    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 20px var(--teal-mystic); }
        50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 45px var(--teal-mystic); }
    }

    /* --- Responsive --- */
    @media (max-width: 600px) {
        .app-container { padding: 1.5rem 1rem 3rem 1rem; }
        .game-title { font-size: 2.2rem; }
        .game-subtitle { font-size: 0.9rem; }
        
        .vortex-wrapper { width: 240px; height: 240px; }
        .btn-summon { width: 90px; height: 90px; }
        .btn-summon-wrapper { width: 120px; height: 120px; }
        .summon-text { font-size: 0.8rem; }

        .secondary-nav { gap: 1rem; }
        .nav-card { width: 60px; height: 60px; }
        .nav-icon { width: 24px; height: 24px; }
        .nav-label { font-size: 0.75rem; }
        
        /* Less curve on mobile */
        .nav-item-wrapper:nth-child(1), 
        .nav-item-wrapper:nth-child(3) { transform: translateY(-5px); }
    }
</style>
</head>
<body>

    <!-- Background Composition -->
    <div class="bg-gradient"></div>
    <div class="bg-vignette"></div>
    <!-- Inline SVG Noise Pattern -->
    <svg class="bg-noise" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <filter id="noiseFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/>
        </filter>
        <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
    </svg>
    <canvas id="canvas-bg"></canvas>

    <!-- SVG Definitions -->
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <linearGradient id="gold-grad-icon" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#fff8dc;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#8a6e2f;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="rgba(0,0,0,0.2)" stroke-width="1" fill="url(#gold-grad-icon)"/>
                    <path d="M12 7v10M8 11h8" stroke="rgba(138, 110, 47, 0.5)" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero Section (Typography + Vortex) -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <!-- 4. Typography: No underscore, elegant serif -->
            <p class="game-subtitle">Spirit Summoning</p>

            <!-- The Vortex Visual -->
            <div class="vortex-wrapper">
                <div class="vortex-ring ring-outer"></div>
                <div class="vortex-ring ring-middle"></div>
                <div class="vortex-ring ring-inner"></div>
                <div class="vortex-core"></div>

                <!-- Primary Action Embedded -->
                <div class="btn-summon-wrapper" onclick="interact('Summon')">
                    <div class="btn-summon">
                        <!-- 4. Iconography: Ritual Altar -->
                        <svg class="summon-icon" viewBox="0 0 24 24">
                            <path d="M12,2 L15,8 L21,9 L17,14 L18,20 L12,17 L6,20 L7,14 L3,9 L9,8 Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
                            <circle cx="12" cy="12" r="3" fill="currentColor"/>
                        </svg>
                        <span class="summon-text">Summon</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Secondary Navigation Block -->
        <nav class="nav-container">
            <div class="secondary-nav">
                
                <!-- Roster -->
                <div class="nav-item-wrapper" onclick="interact('Roster')">
                    <div class="nav-card">
                        <!-- 4. Iconography: Tome -->
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V6H6.5A2.5 2.5 0 0 0 4 8.5v11z"/>
                            <path d="M6.5 15H18v-1H6.5v1zm0-3H18v-1H6.5v1z" opacity="0.7"/>
                        </svg>
                    </div>
                    <span class="nav-label">Roster</span>
                </div>

                <!-- Battle -->
                <div class="nav-item-wrapper" onclick="interact('Battle')">
                    <div class="nav-card">
                        <!-- 4. Iconography: Stylized Weapon -->
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M14.5 17.5L3 6V3h3l11.5 11.5-3 3zM19 5l-2 2 3 3 2-2-3-3zM6.5 14.5l3 3L3 21l6-6-2.5-1.5z"/>
                        </svg>
                    </div>
                    <span class="nav-label">Battle</span>
                </div>

                <!-- Grind -->
                <div class="nav-item-wrapper" onclick="interact('Grind')">
                    <div class="nav-card">
                        <!-- 4. Iconography: Resource Node -->
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <span class="nav-label">Grind</span>
                </div>

            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline
        </footer>
    </div>

<script>
    // --- Background Particle System (Embers) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
            this.y = Math.random() * height;
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 20;
            this.vx = (Math.random() - 0.5) * 0.15;
            this.vy = -(Math.random() * 0.3 + 0.1);
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.5 + 0.1;
            // 3. Color: Mix of Gold and Teal
            this.color = Math.random() > 0.6 ? '212, 175, 55' : '79, 209, 197'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.x += Math.sin(this.y * 0.01) * 0.2; // Gentle float

            if (this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // Density calculation
        const count = Math.floor((width * height) / 15000);
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        // Simple visual feedback
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
    }

    // Initialize
    resize();
    initParticles();
    animate();
</script>
</body>
</html>
