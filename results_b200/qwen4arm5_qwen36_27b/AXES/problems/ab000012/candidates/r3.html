<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette - Adjusted for better contrast and mood */
        --bg-deep: #050508;
        --bg-dark: #0a0a10;
        
        /* Golds */
        --gold-dark: #4a3c0e;
        --gold-mid: #d4af37;
        --gold-light: #fffacd;
        --gold-glow: rgba(212, 175, 55, 0.4);
        
        /* Mystical Accents */
        --cyan-vibrant: #00f0ff;
        --cyan-dim: #005f66;
        --teal-glow: rgba(0, 240, 255, 0.5);
        
        /* UI Surfaces */
        --glass-panel: rgba(12, 12, 18, 0.7);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-highlight: rgba(255, 255, 255, 0.15);
        
        /* Typography */
        --font-brand: 'Cinzel', 'Times New Roman', serif; /* Fallback to Serif */
        --font-ui: 'Montserrat', 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif; /* Fallback to Sans */
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: #E5E5E5;
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* --- Background Layers --- */
    
    /* 1. Base Gradient */
    .bg-gradient {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 40%, #15192b 0%, #050508 70%);
        z-index: 0;
    }

    /* 2. Vignette/Fog */
    .bg-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 40%, var(--bg-deep) 100%);
        z-index: 2;
        pointer-events: none;
    }

    /* 3. Noise Texture */
    .bg-noise {
        position: absolute;
        inset: 0;
        z-index: 3;
        opacity: 0.05;
        pointer-events: none;
        filter: contrast(150%) brightness(100%);
    }

    /* 4. Particles Canvas */
    #canvas-bg {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: flex;
        flex-direction: column;
        /* Tighter vertical rhythm */
        padding: 2rem 2rem 1rem 2rem;
        justify-content: space-between;
    }

    /* --- Header --- */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        height: 50px;
        /* Margin fix for top-right edge */
        margin-top: 1rem; 
        margin-right: 1rem;
    }

    .currency-pill {
        background: rgba(10, 10, 15, 0.8);
        border: 1px solid var(--gold-mid);
        border-top: 1px solid var(--gold-light);
        border-bottom: 1px solid var(--gold-dark);
        border-radius: 2px;
        padding: 0.3rem 1.2rem;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        position: relative;
        overflow: hidden;
    }

    .coin-icon {
        width: 18px;
        height: 18px;
        fill: url(#gold-grad-icon);
        filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
    }

    .currency-amount {
        font-family: var(--font-ui);
        font-weight: 700;
        font-size: 1rem;
        color: var(--gold-light);
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        letter-spacing: 0.5px;
    }

    /* --- Hero Section --- */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        text-align: center;
        flex: 1;
        /* Pull content up */
        padding-top: 2vh;
        position: relative;
    }

    /* Typography Hierarchy */
    .game-title {
        font-family: var(--font-brand);
        font-size: 2.5rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 0.2rem;
        background: linear-gradient(to bottom, var(--gold-light) 0%, var(--gold-mid) 60%, var(--gold-dark) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 0 rgba(0,0,0,0.8));
    }

    /* Increased weight/size for subtitle */
    .game-subtitle {
        font-family: var(--font-brand);
        font-size: 1rem; 
        color: var(--cyan-vibrant);
        letter-spacing: 0.4em;
        text-transform: uppercase;
        margin-bottom: 1.5rem;
        opacity: 0.9;
        text-shadow: 0 0 15px var(--teal-glow);
        font-weight: 700;
    }

    /* --- The Summoning Vortex (Integrated) --- */
    .vortex-wrapper {
        position: relative;
        width: 320px;
        height: 320px;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Slight overlap with menu area */
        margin-top: -1rem; 
    }

    /* Vortex Rings */
    .vortex-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid transparent;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .ring-outer {
        width: 100%;
        height: 100%;
        border-top: 2px solid var(--cyan-vibrant);
        border-bottom: 2px solid var(--cyan-vibrant);
        border-left: 1px solid rgba(0, 240, 255, 0.3);
        border-right: 1px solid rgba(0, 240, 255, 0.3);
        animation: spin-slow 15s linear infinite;
        box-shadow: 0 0 20px var(--teal-glow);
    }

    .ring-middle {
        width: 70%;
        height: 70%;
        border: 1px dashed var(--gold-mid);
        animation: spin-reverse 25s linear infinite;
        opacity: 0.6;
    }

    .ring-inner {
        width: 40%;
        height: 40%;
        border: 1px solid rgba(0, 240, 255, 0.2);
        background: radial-gradient(circle, rgba(0, 240, 255, 0.1) 0%, transparent 70%);
    }

    /* Central Core Glow */
    .vortex-core {
        position: absolute;
        width: 30%;
        height: 30%;
        border-radius: 50%;
        background: radial-gradient(circle, var(--cyan-vibrant) 0%, #000 80%);
        box-shadow: 0 0 40px var(--cyan-vibrant);
        animation: pulse 4s ease-in-out infinite;
        z-index: 1;
    }

    /* --- Navigation Container (Unified) --- */
    .nav-container {
        position: relative;
        z-index: 20;
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    /* Primary Action: Summon (Embedded) */
    .btn-summon-wrapper {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 30;
        width: 140px;
        height: 140px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
    }

    .btn-summon {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #2a2a35, #0a0a10);
        border: 2px solid var(--gold-mid);
        box-shadow: 
            0 0 15px var(--gold-glow), 
            inset 0 0 20px rgba(0,0,0,0.8);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .btn-summon:hover {
        transform: scale(1.05);
        border-color: var(--gold-light);
        box-shadow: 0 0 30px var(--gold-glow), inset 0 0 15px rgba(212, 175, 55, 0.2);
    }

    .btn-summon:active {
        transform: scale(0.95);
    }

    .summon-icon {
        width: 32px;
        height: 32px;
        fill: var(--gold-light);
        margin-bottom: 4px;
        filter: drop-shadow(0 0 5px var(--gold-mid));
    }

    .summon-text {
        font-family: var(--font-brand);
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--gold-light);
        letter-spacing: 0.1em;
        text-transform: uppercase;
    }

    /* Secondary Navigation Block */
    .secondary-nav {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin-top: 1rem; /* Space between vortex and cards */
    }

    /* Secondary Buttons */
    .nav-card {
        background: linear-gradient(160deg, rgba(20, 20, 30, 0.8) 0%, rgba(10, 10, 15, 0.9) 100%);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        
        /* Refinement: Teal borders */
        border: 1px solid rgba(0, 240, 255, 0.2);
        border-bottom: 1px solid rgba(0, 240, 255, 0.05);
        border-radius: 4px;
        
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
    }

    /* Hover State */
    .nav-card:hover {
        transform: translateY(-4px);
        background: linear-gradient(160deg, rgba(30, 30, 45, 0.9) 0%, rgba(15, 15, 25, 0.95) 100%);
        border-color: var(--cyan-vibrant);
        box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 15px var(--teal-glow);
    }

    /* Iconography: Vibrant Cyan */
    .nav-icon {
        width: 32px;
        height: 32px;
        fill: var(--cyan-vibrant);
        filter: drop-shadow(0 0 2px rgba(0, 240, 255, 0.5));
        transition: all 0.3s ease;
    }

    .nav-card:hover .nav-icon {
        fill: #fff;
        filter: drop-shadow(0 0 8px var(--cyan-vibrant));
    }

    /* Typography: Sans-serif, crisp white */
    .nav-label {
        font-family: var(--font-ui);
        font-weight: 600;
        font-size: 0.9rem;
        color: #E5E5E5;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .nav-card:hover .nav-label {
        color: #fff;
        text-shadow: 0 0 5px var(--cyan-vibrant);
    }

    /* Footer */
    footer {
        text-align: center;
        color: var(--gold-dark);
        font-size: 0.7rem;
        opacity: 0.5;
        letter-spacing: 0.1em;
        margin-top: 1rem;
        font-family: var(--font-ui);
    }

    /* --- Animations --- */
    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 20px var(--cyan-vibrant); }
        50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 40px var(--cyan-vibrant); }
    }

    /* --- Responsive --- */
    @media (max-width: 600px) {
        .app-container { padding: 1.5rem 1rem; }
        .game-title { font-size: 1.8rem; }
        .game-subtitle { font-size: 0.8rem; }
        .vortex-wrapper { width: 260px; height: 260px; margin-top: -2rem; }
        .btn-summon { width: 80px; height: 80px; }
        .btn-summon-wrapper { width: 110px; height: 110px; }
        
        .secondary-nav { grid-template-columns: 1fr; gap: 0.8rem; }
        .nav-card { flex-direction: row; padding: 1rem; justify-content: flex-start; gap: 1rem; }
        .nav-icon { width: 24px; height: 24px; }
    }
</style>
</head>
<body>

    <!-- Background Composition -->
    <div class="bg-gradient"></div>
    <div class="bg-vignette"></div>
    <!-- Inline SVG Noise Pattern -->
    <svg class="bg-noise" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <filter id="noiseFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
        </filter>
        <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
    </svg>
    <canvas id="canvas-bg"></canvas>

    <!-- SVG Definitions -->
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <linearGradient id="gold-grad-icon" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#fff8dc;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1" fill="url(#gold-grad-icon)"/>
                    <path d="M12 7v10M8 11h8" stroke="rgba(0,0,0,0.3)" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero Section (Typography + Vortex) -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <!-- The Vortex Visual -->
            <div class="vortex-wrapper">
                <div class="vortex-ring ring-outer"></div>
                <div class="vortex-ring ring-middle"></div>
                <div class="vortex-ring ring-inner"></div>
                <div class="vortex-core"></div>

                <!-- Primary Action Embedded -->
                <div class="btn-summon-wrapper" onclick="interact('Summon')">
                    <div class="btn-summon">
                        <svg class="summon-icon" viewBox="0 0 24 24">
                            <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                        </svg>
                        <span class="summon-text">Summon</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Secondary Navigation Block -->
        <nav class="nav-container">
            <div class="secondary-nav">
                
                <!-- Roster -->
                <div class="nav-card" onclick="interact('Roster')">
                    <svg class="nav-icon" viewBox="0 0 24 24">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V6H6.5A2.5 2.5 0 0 0 4 8.5v11z"/>
                        <path d="M6.5 15H18v-1H6.5v1zm0-3H18v-1H6.5v1z" opacity="0.7"/>
                    </svg>
                    <span class="nav-label">Roster</span>
                </div>

                <!-- Battle -->
                <div class="nav-card" onclick="interact('Battle')">
                    <svg class="nav-icon" viewBox="0 0 24 24">
                        <path d="M14.5 17.5L3 6V3h3l11.5 11.5-3 3zM19 5l-2 2 3 3 2-2-3-3zM6.5 14.5l3 3L3 21l6-6-2.5-1.5z"/>
                    </svg>
                    <span class="nav-label">Battle</span>
                </div>

                <!-- Grind -->
                <div class="nav-card" onclick="interact('Grind')">
                    <svg class="nav-icon" viewBox="0 0 24 24">
                        <path d="M19 13h-2v4h-2v-4h-2v-2h2V7h2v4h2v2zm-6-8H7v2H5v2H3v2h2v2H3v2h2v2h6v-2h2v-2h2v-2h2v-2h-2V7h-2V5h-2z"/>
                    </svg>
                    <span class="nav-label">Grind</span>
                </div>
            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline
        </footer>
    </div>

<script>
    // --- Background Particle System (Embers) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
            this.y = Math.random() * height;
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 20;
            this.vx = (Math.random() - 0.5) * 0.2;
            this.vy = -(Math.random() * 0.4 + 0.1);
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.5 + 0.1;
            // Mix of Gold and Cyan
            this.color = Math.random() > 0.7 ? '212, 175, 55' : '0, 240, 255'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.x += Math.sin(this.y * 0.01) * 0.2; // Gentle float

            if (this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // Density calculation
        const count = Math.floor((width * height) / 12000);
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        // Simple visual feedback
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
    }

    // Initialize
    resize();
    initParticles();
    animate();
</script>
</body>
</html>
