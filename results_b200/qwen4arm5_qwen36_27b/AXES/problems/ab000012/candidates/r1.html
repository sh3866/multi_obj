<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette */
        --bg-deep: #050508;
        --bg-gradient: radial-gradient(circle at 50% 30%, #161824 0%, #050508 70%);
        
        /* Golds */
        --gold-primary: #d4af37;
        --gold-highlight: #fcf6ba;
        --gold-shadow: #8a6e18;
        --gold-dim: #4a3c0e;
        
        /* Mists */
        --mist-teal: #4fd1c5;
        --mist-silver: #e2e8f0;
        
        /* UI Surfaces */
        --stone-bg: rgba(20, 22, 28, 0.7);
        --stone-border: rgba(255, 255, 255, 0.08);
        
        /* Typography */
        --font-heading: 'Cinzel', 'Times New Roman', 'Georgia', serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background: var(--bg-deep);
        background-image: var(--bg-gradient);
        color: var(--mist-silver);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* --- Background Canvas --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem 2rem 3.5rem 2rem; /* Increased bottom padding */
    }

    /* --- Header --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
    }

    /* Currency Pill - Integrated into top nav */
    .currency-pill {
        background: linear-gradient(135deg, rgba(40, 40, 50, 0.85), rgba(15, 15, 20, 0.95));
        border: 1px solid var(--gold-shadow);
        border-right: 1px solid var(--gold-dim);
        border-bottom: 1px solid var(--gold-dim);
        border-radius: 4px; /* More squared, artifact-like */
        padding: 0.4rem 1.2rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
        position: relative;
    }

    /* Decorative corner on currency */
    .currency-pill::after {
        content: '';
        position: absolute;
        top: 2px; right: 2px;
        width: 4px; height: 4px;
        background: var(--gold-primary);
        box-shadow: 0 0 5px var(--gold-primary);
    }

    .coin-icon {
        width: 22px;
        height: 22px;
        fill: url(#gold-grad-icon);
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .currency-amount {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.1rem;
        background: linear-gradient(to bottom, var(--gold-highlight), var(--gold-primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 0.5px;
    }

    /* --- Hero Section (Unified Vertical Flow) --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start; /* Align to top */
        text-align: center;
        padding-top: 2vh;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 3.5rem;
        text-transform: uppercase;
        letter-spacing: 0.15em; /* Reduced slightly for readability */
        margin-bottom: 0.2rem;
        
        /* Rich Multi-stop Gold Gradient */
        background: linear-gradient(to bottom, var(--gold-highlight) 0%, var(--gold-primary) 40%, var(--gold-shadow) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        
        /* Warm Outer Glow */
        filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.25));
        position: relative;
    }

    .game-subtitle {
        font-family: var(--font-heading);
        font-size: 0.9rem;
        color: var(--mist-teal);
        letter-spacing: 0.2em; /* Reduced from 0.5em */
        text-transform: uppercase;
        margin-bottom: 3rem; /* Space before Orb */
        opacity: 0.9;
        text-shadow: 0 0 10px rgba(79, 209, 197, 0.3);
    }

    /* --- The Ritual Circle (Replaces Flat Orb) --- */
    .orb-container {
        position: relative;
        width: 240px;
        height: 240px;
        margin-bottom: 4rem; /* Space before Menu */
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Outer Ring */
    .orb-ring-outer {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 1px solid rgba(79, 209, 197, 0.3);
        box-shadow: 0 0 20px rgba(79, 209, 197, 0.1);
        animation: spin-slow 40s linear infinite;
    }

    /* Inner Ring */
    .orb-ring-inner {
        position: absolute;
        width: 80%;
        height: 80%;
        border-radius: 50%;
        border: 2px solid rgba(212, 175, 55, 0.2);
        border-top-color: var(--gold-primary);
        border-bottom-color: var(--gold-primary);
        animation: spin-reverse 20s linear infinite;
    }

    /* The Core */
    .orb-core {
        position: absolute;
        width: 40%;
        height: 40%;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, var(--mist-teal), #000);
        box-shadow: 0 0 30px var(--mist-teal), inset 0 0 20px rgba(255,255,255,0.5);
        animation: pulse 4s ease-in-out infinite;
    }

    /* Runes Container */
    .rune-container {
        position: absolute;
        width: 100%;
        height: 100%;
        animation: spin-slow 60s linear infinite reverse;
        opacity: 0.6;
    }

    /* Connecting Fog/Runes between Title and Orb */
    .rune-fog {
        position: absolute;
        top: -40px;
        width: 100%;
        height: 80px;
        background: linear-gradient(to bottom, transparent, rgba(79, 209, 197, 0.1), transparent);
        pointer-events: none;
        z-index: -1;
    }

    /* --- Menu Layout (Hierarchy) --- */
    .menu-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
    }

    /* Primary Action: Summon */
    .menu-primary {
        width: 100%;
        max-width: 320px;
        height: 100px;
        position: relative;
        cursor: pointer;
        perspective: 1000px;
    }

    .card-summon {
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, rgba(40, 40, 50, 0.9), rgba(20, 20, 28, 0.95));
        border: 1px solid var(--gold-primary);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.15), inset 0 0 20px rgba(0,0,0,0.8);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        transform-style: preserve-3d;
    }

    /* Summon Card Texture */
    .card-summon::before {
        content: '';
        position: absolute;
        inset: 4px;
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 4px;
        pointer-events: none;
    }

    .menu-primary:hover .card-summon {
        transform: translateY(-5px) scale(1.02);
        box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 25px rgba(212, 175, 55, 0.3);
        border-color: var(--gold-highlight);
    }

    .summon-icon {
        width: 48px;
        height: 48px;
        fill: var(--gold-highlight);
        filter: drop-shadow(0 0 10px var(--gold-primary));
        margin-bottom: 8px;
    }

    .summon-label {
        font-family: var(--font-heading);
        font-size: 1.5rem;
        color: var(--gold-highlight);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 700;
    }

    /* Secondary Actions Grid */
    .menu-secondary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 600px;
    }

    .menu-card {
        background: linear-gradient(180deg, #1e1e26, #15151a);
        border: 1px solid var(--stone-border);
        border-bottom: 1px solid rgba(255,255,255,0.05);
        border-radius: 6px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        /* Charcoal gradient / Inner glow for depth */
        box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }

    .menu-card:hover {
        transform: translateY(-3px);
        background: linear-gradient(180deg, #252530, #1a1a22);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset 0 0 15px rgba(255,255,255,0.05);
    }

    .menu-card:active {
        transform: translateY(0);
    }

    .card-icon {
        width: 32px;
        height: 32px;
        fill: var(--mist-silver);
        opacity: 0.7;
        transition: all 0.3s;
    }

    .menu-card:hover .card-icon {
        fill: var(--mist-teal);
        opacity: 1;
        filter: drop-shadow(0 0 5px var(--mist-teal));
    }

    .card-label {
        font-family: var(--font-heading);
        font-size: 0.95rem;
        color: var(--mist-silver);
        letter-spacing: 0.05em;
        font-weight: 600;
        opacity: 0.8;
    }

    .menu-card:hover .card-label {
        opacity: 1;
        color: #fff;
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.75rem;
        opacity: 0.5;
        padding-top: 1rem;
        letter-spacing: 0.05em;
    }

    /* --- Animations --- */
    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 40px var(--mist-teal); }
    }

    /* --- Responsive --- */
    @media (max-width: 600px) {
        .game-title { font-size: 2.5rem; }
        .menu-secondary { grid-template-columns: 1fr; max-width: 300px; }
        .menu-primary { max-width: 280px; }
        .orb-container { width: 180px; height: 180px; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>

    <!-- SVG Definitions -->
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <linearGradient id="gold-grad-icon" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#fcf6ba;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div style="font-family: var(--font-heading); color: var(--gold-shadow); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.6;">Aetherbound</div>
            
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="url(#gold-grad-icon)"/>
                    <circle cx="12" cy="12" r="6" stroke="rgba(0,0,0,0.3)" stroke-width="1" fill="none"/>
                    <path d="M12 8v8M9 11h6" stroke="rgba(0,0,0,0.4)" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <!-- The Ritual Circle -->
            <div class="orb-container">
                <div class="rune-fog"></div>
                
                <!-- Outer Ring with Runes -->
                <svg class="rune-container" viewBox="0 0 100 100">
                    <!-- Rune Dots -->
                    <circle cx="50" cy="5" r="1.5" fill="var(--mist-teal)" />
                    <circle cx="50" cy="95" r="1.5" fill="var(--mist-teal)" />
                    <circle cx="5" cy="50" r="1.5" fill="var(--mist-teal)" />
                    <circle cx="95" cy="50" r="1.5" fill="var(--mist-teal)" />
                    <!-- Rune Lines (Geometric) -->
                    <path d="M50 10 L90 30 L90 70 L50 90 L10 70 L10 30 Z" stroke="rgba(79, 209, 197, 0.2)" stroke-width="0.5" fill="none"/>
                </svg>
                
                <div class="orb-ring-outer"></div>
                <div class="orb-ring-inner"></div>
                <div class="orb-core"></div>
            </div>
        </section>

        <!-- Menu -->
        <nav class="menu-container">
            
            <!-- Primary Action -->
            <div class="menu-primary" onclick="interact('Summon')">
                <div class="card-summon">
                    <svg class="summon-icon" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                    </svg>
                    <span class="summon-label">Summon</span>
                </div>
            </div>

            <!-- Secondary Actions -->
            <div class="menu-secondary">
                
                <!-- Roster -->
                <div class="menu-card" onclick="interact('Roster')">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <!-- Tome Icon -->
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V6H6.5A2.5 2.5 0 0 0 4 8.5v11zM6.5 15H18v-1H6.5v1zm0-3H18v-1H6.5v1z"/>
                    </svg>
                    <span class="card-label">Roster</span>
                </div>

                <!-- Battle -->
                <div class="menu-card" onclick="interact('Battle')">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <!-- Sword Icon -->
                        <path d="M3 21l4.5-4.5L19 10l-2-2-11.5 5.5L3 21zm13.5-12l2-2 2 2-2 2-2-2z"/>
                    </svg>
                    <span class="card-label">Battle</span>
                </div>

                <!-- Grind -->
                <div class="menu-card" onclick="interact('Grind')">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <!-- Anvil/Hammer Icon -->
                        <path d="M19 13h-2v4h-2v-4h-2v-2h2V7h2v4h2v2zm-6-8H7v2H5v2H3v2h2v2H3v2h2v2h2v2h6v-2h2v-2h2v-2h2v-2h-2V7h-2V5h-2z"/>
                    </svg>
                    <span class="card-label">Grind</span>
                </div>
            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline Mode
        </footer>
    </div>

<script>
    // --- Background Particle System (Embers) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
            // Start at random y to fill screen initially
            this.y = Math.random() * height;
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 20;
            this.vx = (Math.random() - 0.5) * 0.2; // Drift sideways
            this.vy = -(Math.random() * 0.5 + 0.1); // Rise slowly
            this.size = Math.random() * 2;
            this.alpha = Math.random() * 0.5 + 0.2;
            // Colors: Gold or Teal
            this.color = Math.random() > 0.7 ? '212, 175, 55' : '79, 209, 197'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            // Sine wave drift
            this.x += Math.sin(this.y * 0.01) * 0.2;

            if (this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 12000); // Density
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        // Visual feedback
        const btn = event.currentTarget;
        // Simple scale effect
        const originalTransform = btn.style.transform;
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
            btn.style.transform = originalTransform;
        }, 150);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
