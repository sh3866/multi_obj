<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette */
        --bg-deep: #050508;
        --bg-dark: #0a0a10;
        
        /* Golds */
        --gold-dark: #5c4810;
        --gold-mid: #b8860b;
        --gold-light: #ffd700;
        --gold-pale: #fff8dc;
        
        /* Mystical Accents */
        --teal-glow: #4fd1c5;
        --teal-dim: #234e52;
        --mist-white: rgba(255, 255, 255, 0.8);
        
        /* UI Surfaces */
        --glass-dark: rgba(18, 18, 24, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
        
        /* Typography */
        --font-brand: 'Cinzel', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--mist-white);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* --- Background Layers --- */
    
    /* 1. Base Gradient */
    .bg-gradient {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 30%, #1a1c29 0%, #050508 80%);
        z-index: 0;
    }

    /* 2. Magical Array / Fog */
    .bg-arrays {
        position: absolute;
        inset: 0;
        z-index: 1;
        background-image: 
            linear-gradient(rgba(79, 209, 197, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(79, 209, 197, 0.03) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        opacity: 0.5;
        pointer-events: none;
    }

    /* 3. Noise Texture */
    .bg-noise {
        position: absolute;
        inset: 0;
        z-index: 2;
        opacity: 0.07;
        pointer-events: none;
        filter: contrast(150%) brightness(100%);
    }

    /* 4. Particles Canvas */
    #canvas-bg {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1100px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 1.5rem 2rem 2rem 2rem;
    }

    /* --- Header --- */
    header {
        display: flex;
        justify-content: flex-end; /* Align right */
        align-items: center;
        height: 60px;
        margin-bottom: 1rem;
    }

    .currency-pill {
        background: linear-gradient(135deg, rgba(30, 30, 40, 0.8), rgba(10, 10, 15, 0.9));
        border: 1px solid var(--gold-mid);
        border-top: 1px solid var(--gold-light);
        border-bottom: 1px solid var(--gold-dark);
        border-radius: 4px;
        padding: 0.4rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        position: relative;
        overflow: hidden;
    }

    /* Metallic sheen on currency */
    .currency-pill::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 1px;
        background: rgba(255,255,255,0.3);
    }

    .coin-icon {
        width: 20px;
        height: 20px;
        fill: url(#gold-grad-icon);
        filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
    }

    .currency-amount {
        font-family: var(--font-ui);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-pale);
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        letter-spacing: 0.5px;
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        text-align: center;
        padding-top: 5vh;
    }

    /* 1. Typography: Reduced size, metallic gradient, inner shadow */
    .game-title {
        font-family: var(--font-brand);
        font-size: 3rem; /* Reduced from 3.5rem */
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.5rem;
        
        /* Complex Metallic Gradient */
        background: linear-gradient(to bottom, var(--gold-pale) 0%, var(--gold-light) 20%, var(--gold-mid) 50%, var(--gold-dark) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        
        /* Inner Shadow simulation via drop-shadow (inverted) + text-shadow */
        filter: drop-shadow(0 1px 0 rgba(0,0,0,0.8));
        text-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
    }

    .game-subtitle {
        font-family: var(--font-brand);
        font-size: 0.8rem;
        color: var(--teal-glow);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin-bottom: 2rem;
        opacity: 0.8;
        text-shadow: 0 0 10px rgba(79, 209, 197, 0.4);
    }

    /* --- The Ritual Circle (Hero Orb) --- */
    .orb-container {
        position: relative;
        width: 200px;
        height: 200px;
        margin-bottom: 1.5rem; /* Tightened spacing */
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Swirling details */
    .orb-ring-outer {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 1px solid rgba(79, 209, 197, 0.2);
        border-top: 1px solid rgba(79, 209, 197, 0.6);
        border-bottom: 1px solid rgba(79, 209, 197, 0.6);
        box-shadow: 0 0 15px rgba(79, 209, 197, 0.1);
        animation: spin-slow 12s linear infinite;
    }

    .orb-ring-inner {
        position: absolute;
        width: 75%;
        height: 75%;
        border-radius: 50%;
        border: 1px dashed rgba(212, 175, 55, 0.3);
        animation: spin-reverse 20s linear infinite;
    }

    .orb-core {
        position: absolute;
        width: 35%;
        height: 35%;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, var(--teal-glow), #000);
        box-shadow: 0 0 25px var(--teal-glow), inset 0 0 15px rgba(255,255,255,0.6);
        animation: pulse 4s ease-in-out infinite;
    }

    /* --- Menu Layout --- */
    .menu-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        padding-bottom: 2rem;
    }

    /* Primary Action: Summon */
    .menu-primary {
        width: 100%;
        max-width: 300px;
        height: 90px;
        position: relative;
        cursor: pointer;
        perspective: 1000px;
        margin-bottom: 1rem;
    }

    .card-summon {
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, rgba(40, 40, 50, 0.95), rgba(15, 15, 20, 0.98));
        /* Refined Border */
        border: 1px solid var(--gold-mid);
        border-top: 1px solid var(--gold-light);
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* Refined Glow */
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.1), inset 0 0 30px rgba(0,0,0,0.8);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        transform-style: preserve-3d;
    }

    /* Inner etched frame */
    .card-summon::after {
        content: '';
        position: absolute;
        inset: 6px;
        border: 1px solid rgba(212, 175, 55, 0.2);
        border-radius: 2px;
        pointer-events: none;
    }

    .menu-primary:hover .card-summon {
        transform: translateY(-4px) scale(1.01);
        box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 25px rgba(212, 175, 55, 0.2);
        border-color: var(--gold-light);
    }

    .summon-icon {
        width: 32px;
        height: 32px;
        fill: var(--gold-pale);
        filter: drop-shadow(0 0 5px var(--gold-mid));
        margin-bottom: 6px;
    }

    .summon-label {
        font-family: var(--font-brand);
        font-size: 1.4rem;
        color: var(--gold-pale);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 700;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Secondary Actions Grid */
    .menu-secondary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 650px;
    }

    /* 2. Secondary Button Overhaul: Translucent, dark-gradient, thin borders */
    .menu-card {
        background: linear-gradient(160deg, rgba(30, 30, 40, 0.6) 0%, rgba(10, 10, 15, 0.8) 100%);
        /* Glass effect */
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        
        /* Borders */
        border: 1px solid rgba(79, 209, 197, 0.15); /* Teal tint */
        border-bottom: 1px solid rgba(79, 209, 197, 0.05);
        border-radius: 4px;
        
        padding: 1.2rem 0.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }

    /* Hover State: Glow & Color shift */
    .menu-card:hover {
        transform: translateY(-3px);
        background: linear-gradient(160deg, rgba(40, 40, 55, 0.7) 0%, rgba(15, 15, 25, 0.9) 100%);
        border-color: rgba(79, 209, 197, 0.5);
        box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 0 10px rgba(79, 209, 197, 0.1);
    }

    .menu-card:active {
        transform: translateY(0);
    }

    /* 3. Custom Icons: Stylized, tinted */
    .card-icon {
        width: 28px;
        height: 28px;
        /* Gold/Teal tint instead of white */
        fill: var(--teal-glow); 
        opacity: 0.6;
        transition: all 0.3s;
    }

    .menu-card:hover .card-icon {
        opacity: 1;
        fill: var(--gold-light);
        filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.4));
    }

    /* 1. Typography: Sans-serif for secondary labels */
    .card-label {
        font-family: var(--font-ui); /* Switched to UI font */
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--mist-white);
        opacity: 0.7;
        text-transform: uppercase;
    }

    .menu-card:hover .card-label {
        opacity: 1;
        color: var(--teal-glow);
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--gold-dark);
        font-size: 0.7rem;
        opacity: 0.6;
        letter-spacing: 0.1em;
        margin-top: auto;
    }

    /* --- Animations --- */
    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 35px var(--teal-glow); }
    }

    /* --- Responsive --- */
    @media (max-width: 600px) {
        .game-title { font-size: 2.2rem; }
        .menu-secondary { grid-template-columns: 1fr; max-width: 280px; gap: 1rem; }
        .menu-primary { max-width: 280px; }
        .orb-container { width: 160px; height: 160px; margin-bottom: 1rem; }
    }
</style>
</head>
<body>

    <!-- Background Composition -->
    <div class="bg-gradient"></div>
    <div class="bg-arrays"></div>
    <!-- Inline SVG Noise Pattern for Texture -->
    <svg class="bg-noise" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <filter id="noiseFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
        </filter>
        <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
    </svg>
    <canvas id="canvas-bg"></canvas>

    <!-- SVG Definitions -->
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <linearGradient id="gold-grad-icon" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#fff8dc;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <div class="app-container">
        <!-- Header (No Logo, just Currency) -->
        <header>
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1" fill="url(#gold-grad-icon)"/>
                    <path d="M12 8v8M9 11h6" stroke="rgba(0,0,0,0.4)" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <!-- Title reduced, styled as header -->
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <!-- The Ritual Circle -->
            <div class="orb-container">
                <div class="orb-ring-outer"></div>
                <div class="orb-ring-inner"></div>
                <div class="orb-core"></div>
            </div>
        </section>

        <!-- Menu -->
        <nav class="menu-container">
            
            <!-- Primary Action: Summon -->
            <div class="menu-primary" onclick="interact('Summon')">
                <div class="card-summon">
                    <svg class="summon-icon" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                    </svg>
                    <span class="summon-label">Summon</span>
                </div>
            </div>

            <!-- Secondary Actions -->
            <div class="menu-secondary">
                
                <!-- Roster -->
                <div class="menu-card" onclick="interact('Roster')">
                    <!-- Stylized Tome Icon -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V6H6.5A2.5 2.5 0 0 0 4 8.5v11z"/>
                        <path d="M6.5 15H18v-1H6.5v1zm0-3H18v-1H6.5v1z" opacity="0.7"/>
                    </svg>
                    <span class="card-label">Roster</span>
                </div>

                <!-- Battle -->
                <div class="menu-card" onclick="interact('Battle')">
                    <!-- Stylized Crossed Swords/Runes -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M14.5 17.5L3 6V3h3l11.5 11.5-3 3zM19 5l-2 2 3 3 2-2-3-3zM6.5 14.5l3 3L3 21l6-6-2.5-1.5z"/>
                    </svg>
                    <span class="card-label">Battle</span>
                </div>

                <!-- Grind -->
                <div class="menu-card" onclick="interact('Grind')">
                    <!-- Stylized Anvil/Forge -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M19 13h-2v4h-2v-4h-2v-2h2V7h2v4h2v2zm-6-8H7v2H5v2H3v2h2v2H3v2h2v2h6v-2h2v-2h2v-2h2v-2h-2V7h-2V5h-2z"/>
                    </svg>
                    <span class="card-label">Grind</span>
                </div>
            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline
        </footer>
    </div>

<script>
    // --- Background Particle System (Embers) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
            this.y = Math.random() * height;
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 20;
            this.vx = (Math.random() - 0.5) * 0.1;
            this.vy = -(Math.random() * 0.3 + 0.05);
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.4 + 0.1;
            // Mix of Gold and Teal
            this.color = Math.random() > 0.6 ? '212, 175, 55' : '79, 209, 197'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.x += Math.sin(this.y * 0.01) * 0.1; // Gentle float

            if (this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 15000);
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
            btn.style.transform = ''; // Reset to CSS hover state or default
        }, 150);
    }

    // Initialize
    resize();
    initParticles();
    animate();
</script>
</body>
</html>
