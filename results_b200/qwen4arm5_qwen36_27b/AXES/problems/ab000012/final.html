<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette - Revised: Deep Void, Ethereal Blue-Green, Metallic Gold */
        --bg-deep: #040508;
        --bg-dark: #0a0b12;
        
        /* Golds - Multi-stop Metallic */
        --gold-dark: #705518;
        --gold-mid: #c5a028;
        --gold-light: #f4e28e;
        --gold-shine: #fff5cc;
        
        /* Mystical Accents - Deep Blue-Green (Teal) */
        --teal-deep: #0f3d3e;
        --teal-core: #38b2ac;
        --teal-glow: rgba(56, 178, 172, 0.5);
        --teal-bright: #81e6d9;
        
        /* UI Surfaces - Rune Stone */
        --stone-base: #1e212b;
        --stone-highlight: #2d3240;
        --stone-border: #4a5063;
        
        /* Typography */
        --font-brand: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
        --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: #E5E5E5;
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* --- Background Layers --- */
    .bg-gradient {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 40%, #111625 0%, var(--bg-deep) 75%);
        z-index: 0;
    }

    /* Noise Texture */
    .bg-noise {
        position: absolute;
        inset: 0;
        z-index: 1;
        opacity: 0.06;
        pointer-events: none;
        filter: contrast(150%) brightness(100%);
        mix-blend-mode: overlay;
    }

    /* Fog Layer */
    .bg-fog {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, transparent 0%, var(--bg-deep) 85%);
        z-index: 2;
        pointer-events: none;
    }

    #canvas-bg {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem 2rem 1rem 2rem; /* Top padding reduced slightly, bottom tight */
    }

    /* --- Header (Top 15%) --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end; /* Align baselines */
        width: 100%;
        margin-bottom: 1rem;
        position: relative;
    }

    .title-group {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
    }

    .game-title {
        font-family: var(--font-brand);
        font-size: 2.8rem; /* Slightly smaller */
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        line-height: 1;
        margin-bottom: 0.2rem;
        /* Metallic Gradient Text */
        background: linear-gradient(to bottom, var(--gold-shine) 0%, var(--gold-mid) 40%, var(--gold-dark) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        position: relative;
    }

    .game-subtitle {
        font-family: var(--font-ui);
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--teal-core);
        letter-spacing: 0.3em; /* Tighter tracking */
        text-transform: uppercase;
        text-shadow: 0 0 10px var(--teal-glow);
        opacity: 0.9;
    }

    /* Currency Pill */
    .currency-pill {
        background: linear-gradient(90deg, rgba(10, 10, 15, 0.9), rgba(20, 20, 30, 0.8));
        border: 1px solid var(--gold-mid);
        border-radius: 4px 12px 12px 4px; /* Asymmetrical shape */
        padding: 0.5rem 1.2rem;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        position: relative;
    }
    
    /* Decorative accent on pill */
    .currency-pill::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0; width: 4px;
        background: var(--gold-mid);
        border-radius: 4px 0 0 4px;
    }

    .coin-icon {
        width: 22px;
        height: 22px;
        fill: url(#gold-grad-icon);
        filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
    }

    .currency-amount {
        font-family: var(--font-ui);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-light);
        letter-spacing: 0.05em;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    /* --- Central Stack (Hero + Nav) --- */
    .main-stack {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem; /* Tighter gap between altar and cards */
        width: 100%;
        position: relative;
    }

    /* --- The Ritual Altar (Summon) --- */
    .altar-container {
        position: relative;
        width: 340px;
        height: 340px;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Center anchor */
        margin-top: -20px; 
    }

    /* Geometry Rings */
    .altar-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid transparent;
    }

    .ring-outer {
        width: 100%;
        height: 100%;
        border-top: 2px solid var(--teal-core);
        border-bottom: 2px solid var(--teal-core);
        border-left: 1px solid rgba(56, 178, 172, 0.3);
        border-right: 1px solid rgba(56, 178, 172, 0.3);
        box-shadow: 0 0 25px rgba(56, 178, 172, 0.15);
        animation: spin-slow 40s linear infinite;
    }

    .ring-middle {
        width: 85%;
        height: 85%;
        border: 1px dashed var(--gold-mid);
        animation: spin-reverse 60s linear infinite;
        opacity: 0.6;
    }

    .ring-inner {
        width: 60%;
        height: 60%;
        border: 1px solid rgba(56, 178, 172, 0.2);
        background: radial-gradient(circle, rgba(15, 61, 62, 0.3) 0%, transparent 70%);
    }

    /* The Portal Core */
    .altar-core {
        position: absolute;
        width: 45%;
        height: 45%;
        border-radius: 50%;
        background: radial-gradient(circle, var(--teal-core) 0%, var(--teal-deep) 40%, transparent 70%);
        box-shadow: 0 0 40px var(--teal-glow);
        animation: pulse 4s ease-in-out infinite;
        z-index: 1;
    }

    /* Summon Button - The Anchor */
    .btn-summon-wrapper {
        position: absolute;
        z-index: 20;
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .btn-summon-wrapper:hover {
        transform: scale(1.05);
    }
    
    .btn-summon-wrapper:active {
        transform: scale(0.95);
    }

    .btn-summon {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        /* Stone Texture */
        background: radial-gradient(circle at 30% 30%, #3a3c47, #1a1c23);
        border: 4px solid var(--gold-mid);
        box-shadow: 
            0 0 0 6px rgba(0,0,0,0.6), /* Outer separation */
            0 0 30px rgba(212, 175, 55, 0.2),
            inset 0 0 30px rgba(0,0,0,0.8);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* Geometric accents on button */
    .btn-summon::before {
        content: '';
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 1px solid var(--gold-dark);
        opacity: 0.5;
        pointer-events: none;
    }

    .summon-icon {
        width: 42px;
        height: 42px;
        fill: var(--gold-light);
        margin-bottom: 8px;
        filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.6));
    }

    .summon-text {
        font-family: var(--font-ui);
        font-size: 1.1rem;
        font-weight: 800; /* Increased Weight */
        color: var(--gold-shine);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    /* --- Navigation Cards (Rune Stones) --- */
    .secondary-nav {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 1.2rem; /* Tighter horizontal spacing */
        width: 100%;
        padding: 0 1rem;
    }

    .nav-item-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        transition: transform 0.3s ease;
    }

    /* Organic Tilt */
    .nav-item-wrapper:nth-child(1) { transform: rotate(-3deg); }
    .nav-item-wrapper:nth-child(2) { transform: translateY(-10px) rotate(0deg); }
    .nav-item-wrapper:nth-child(3) { transform: rotate(3deg); }

    .nav-item-wrapper:hover {
        transform: translateY(-15px) scale(1.05);
        z-index: 15;
    }

    /* Rune Stone Card Design */
    .nav-card {
        width: 90px; /* Larger size */
        height: 110px;
        /* Irregular shape */
        border-radius: 12px 12px 30px 30px; 
        background: linear-gradient(180deg, var(--stone-highlight) 0%, var(--stone-base) 100%);
        
        /* Complex Borders */
        border: 2px solid var(--gold-dark);
        border-top: 4px solid var(--gold-mid);
        border-bottom: 1px solid var(--gold-dark);
        
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        box-shadow: 
            0 10px 20px rgba(0,0,0,0.6),
            inset 0 0 15px rgba(0,0,0,0.5);
        transition: all 0.3s ease;
    }

    /* Texture Overlay on Card */
    .nav-card::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        pointer-events: none;
        mix-blend-mode: overlay;
    }

    /* Hover State */
    .nav-item-wrapper:hover .nav-card {
        border-color: var(--teal-core);
        border-top-color: var(--teal-bright);
        box-shadow: 0 0 25px var(--teal-glow), inset 0 0 10px rgba(56, 178, 172, 0.2);
        background: linear-gradient(180deg, #252833 0%, #15171e 100%);
    }

    .nav-icon {
        width: 36px;
        height: 36px;
        fill: var(--teal-core);
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        transition: all 0.3s ease;
        z-index: 2;
    }

    .nav-item-wrapper:hover .nav-icon {
        fill: var(--teal-bright);
        filter: drop-shadow(0 0 10px var(--teal-glow));
        transform: scale(1.1);
    }

    .nav-label {
        margin-top: 14px;
        font-family: var(--font-ui);
        font-weight: 700;
        font-size: 0.9rem;
        color: #A0A0A0;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        transition: color 0.3s ease;
    }

    .nav-item-wrapper:hover .nav-label {
        color: var(--teal-bright);
        text-shadow: 0 0 8px var(--teal-glow);
    }

    /* Footer */
    footer {
        text-align: center;
        color: var(--gold-dark);
        font-size: 0.7rem;
        opacity: 0.5;
        letter-spacing: 0.1em;
        margin-top: 2rem; /* Margin from stack */
        font-family: var(--font-ui);
        text-transform: uppercase;
    }

    /* --- Animations --- */
    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 30px var(--teal-glow); }
        50% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 60px var(--teal-glow); }
    }

    /* --- Responsive --- */
    @media (max-width: 600px) {
        .app-container { padding: 1rem; }
        .game-title { font-size: 2rem; }
        .game-subtitle { font-size: 0.7rem; }
        
        .altar-container { width: 280px; height: 280px; margin-top: 0; }
        .btn-summon { width: 110px; height: 110px; }
        .summon-icon { width: 32px; height: 32px; }
        
        .secondary-nav { gap: 0.5rem; }
        .nav-card { width: 75px; height: 90px; }
        .nav-icon { width: 30px; height: 30px; }
        .nav-label { font-size: 0.8rem; }
        
        /* Less tilt on mobile */
        .nav-item-wrapper:nth-child(1) { transform: rotate(-1deg); }
        .nav-item-wrapper:nth-child(3) { transform: rotate(1deg); }
    }
</style>
</head>
<body>

    <!-- Background Composition -->
    <div class="bg-gradient"></div>
    <div class="bg-fog"></div>
    <!-- Inline SVG Noise Pattern -->
    <svg class="bg-noise" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <filter id="noiseFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
        </filter>
        <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
    </svg>
    <canvas id="canvas-bg"></canvas>

    <!-- SVG Definitions -->
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <linearGradient id="gold-grad-icon" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#fff8dc;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#8a6e2f;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="title-group">
                <h1 class="game-title">Aetherbound</h1>
                <p class="game-subtitle">Spirit Summoning</p>
            </div>
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="rgba(0,0,0,0.2)" stroke-width="1" fill="url(#gold-grad-icon)"/>
                    <path d="M12 7v10M8 11h8" stroke="rgba(138, 110, 47, 0.5)" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Central Stack -->
        <div class="main-stack">
            
            <!-- The Ritual Altar -->
            <div class="altar-container">
                <div class="altar-ring ring-outer"></div>
                <div class="altar-ring ring-middle"></div>
                <div class="altar-ring ring-inner"></div>
                <div class="altar-core"></div>

                <!-- Primary Action -->
                <div class="btn-summon-wrapper" onclick="interact('Summon')">
                    <div class="btn-summon">
                        <svg class="summon-icon" viewBox="0 0 24 24">
                            <path d="M12,2 L15,8 L21,9 L17,14 L18,20 L12,17 L6,20 L7,14 L3,9 L9,8 Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
                            <circle cx="12" cy="12" r="3" fill="currentColor"/>
                        </svg>
                        <span class="summon-text">Summon</span>
                    </div>
                </div>
            </div>

            <!-- Secondary Navigation (Rune Stones) -->
            <nav class="secondary-nav">
                
                <!-- Roster -->
                <div class="nav-item-wrapper" onclick="interact('Roster')">
                    <div class="nav-card">
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V6H6.5A2.5 2.5 0 0 0 4 8.5v11z"/>
                            <path d="M6.5 15H18v-1H6.5v1zm0-3H18v-1H6.5v1z" opacity="0.7"/>
                        </svg>
                    </div>
                    <span class="nav-label">Roster</span>
                </div>

                <!-- Battle -->
                <div class="nav-item-wrapper" onclick="interact('Battle')">
                    <div class="nav-card">
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M14.5 17.5L3 6V3h3l11.5 11.5-3 3zM19 5l-2 2 3 3 2-2-3-3zM6.5 14.5l3 3L3 21l6-6-2.5-1.5z"/>
                        </svg>
                    </div>
                    <span class="nav-label">Battle</span>
                </div>

                <!-- Grind -->
                <div class="nav-item-wrapper" onclick="interact('Grind')">
                    <div class="nav-card">
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <span class="nav-label">Grind</span>
                </div>

            </nav>
        </div>

        <footer>
            Aetherbound v1.0.4 &bull; Offline
        </footer>
    </div>

<script>
    // --- Background Particle System (Embers) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
            this.y = Math.random() * height;
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 20;
            this.vx = (Math.random() - 0.5) * 0.15;
            this.vy = -(Math.random() * 0.3 + 0.1);
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.5 + 0.1;
            // Mix of Gold and Teal
            this.color = Math.random() > 0.6 ? '212, 175, 55' : '56, 178, 172'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.x += Math.sin(this.y * 0.01) * 0.2; // Gentle float

            if (this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 15000);
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        // Simple scale feedback handled by CSS active, but we can add JS logic here
        console.log(action);
    }

    // Initialize
    resize();
    initParticles();
    animate();
</script>
</body>
</html>
