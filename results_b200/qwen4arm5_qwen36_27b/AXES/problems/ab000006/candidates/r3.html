<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkiFree</title>
    <style>
        :root {
            /* Palette - Game Boy / DOS Hybrid */
            --c-sky-top: #4772b8;
            --c-sky-bot: #a6cbe6;
            --c-snow-base: #eef4fa;
            --c-snow-shadow: #c2d1e0;
            --c-mnt-back: #3e5c8f;
            --c-mnt-front: #2d4570;
            --c-tree-dark: #006600;
            --c-tree-mid: #009900;
            --c-tree-light: #33cc33;
            --c-tree-highlight: #66ff66;
            --c-skier-red: #d32f2f;
            --c-skier-skin: #ffcc80;
            --c-skier-blue: #1a237e;
            --c-skier-yellow: #ffc107;
            --c-ui-border: #ffffff;
            --c-ui-shadow: #000000;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--c-sky-top);
            /* System font stack for pixel look */
            font-family: "Courier New", "Lucida Console", monospace;
        }

        /* 
           CORE VISUAL STRATEGY:
           Low-res canvas scaled up.
        */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        /* UI Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            pointer-events: none;
        }

        /* Typography: Pixel Style */
        .pixel-text {
            font-family: "Courier New", monospace;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: -1px;
        }

        /* Title Container */
        .title-container {
            margin-top: 8vh;
            text-align: center;
            position: relative;
            z-index: 12;
            pointer-events: none;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 6rem);
            color: #fff;
            margin: 0;
            /* Hard Pixel Drop Shadow only */
            text-shadow: 
                4px 4px 0px var(--c-ui-shadow);
            line-height: 1;
        }

        /* Instructions Line */
        .instructions {
            font-size: clamp(0.7rem, 2vw, 1rem);
            color: #fff;
            margin-top: 8px;
            text-shadow: 2px 2px 0px #000;
            background: var(--c-ui-shadow);
            padding: 4px 8px;
            display: inline-block;
            letter-spacing: 1px;
            border: 2px solid #fff;
            opacity: 0.9;
        }

        /* Bottom Controls Area */
        .controls-container {
            position: absolute;
            bottom: 12vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
            z-index: 12;
        }

        /* DOS-Style Prompt Button */
        .dos-prompt {
            display: inline-flex;
            align-items: center;
            background: transparent;
            cursor: pointer;
            font-family: "Courier New", monospace;
            font-weight: 900;
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: #fff;
            text-transform: uppercase;
            padding: 10px 20px;
            border: none;
            outline: none;
            transition: transform 0.1s;
        }

        .dos-prompt:hover {
            transform: scale(1.05);
        }
        
        .dos-prompt:active {
            transform: scale(0.95);
        }

        /* The Prompt Text */
        .prompt-text {
            position: relative;
            padding: 0 10px;
            text-shadow: 2px 2px 0px #000;
        }

        /* The Blinking Cursor Block */
        .cursor-block {
            display: inline-block;
            width: 1.2em;
            height: 1.2em;
            background-color: var(--c-skier-red);
            margin-left: 8px;
            border: 2px solid #fff;
            animation: blink 1s steps(2, start) infinite;
            box-shadow: 2px 2px 0px #000;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* CRT Scanlines (Subtle) */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 20;
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.6) 100%);
            z-index: 15;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <!-- Canvas World -->
    <canvas id="world"></canvas>
    
    <!-- UI Layer -->
    <div class="ui-layer">
        
        <div class="title-container">
            <h1>SkiFree</h1>
            <div class="instructions pixel-text">USE ARROW KEYS TO STEER</div>
        </div>

        <div class="controls-container">
            <button class="dos-prompt" id="startBtn">
                <span class="prompt-text pixel-text">START GAME</span>
                <span class="cursor-block"></span>
            </button>
        </div>
    </div>

    <!-- Post-processing -->
    <div class="vignette"></div>
    <div class="crt-overlay"></div>

<script>
    /**
     * VISUAL ENGINE
     * Procedural retro graphics generation
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false });

    // Configuration
    // 320x240 is the standard resolution for this aesthetic
    const TARGET_WIDTH = 320;
    const TARGET_HEIGHT = 240;
    
    // State
    let frame = 0;
    let trees = [];
    let snowParticles = [];
    
    // Colors
    const PALETTE = {
        skyTop: '#4772b8',
        skyBot: '#a6cbe6',
        mntBack: '#3e5c8f',
        mntFront: '#2d4570',
        snowBase: '#eef4fa',
        snowShadow: '#c2d1e0',
        treeDark: '#006600',
        treeMid: '#009900',
        treeLight: '#33cc33',
        treeHighlight: '#66ff66',
        skierSkin: '#ffcc80',
        skierHat: '#d32f2f',
        skierJacket: '#d32f2f',
        skierPants: '#1a237e',
        skierSkis: '#ffc107',
        skierPoles: '#555555'
    };

    function resize() {
        canvas.width = TARGET_WIDTH;
        canvas.height = TARGET_HEIGHT;
        initWorld();
    }

    function initWorld() {
        trees = [];
        const rows = 14; 
        const horizonY = 80; 
        const groundH = TARGET_HEIGHT - horizonY;

        // Generate Trees
        for(let i=0; i<rows; i++) {
            let depth = i / rows; // 0 (far) to 1 (near)
            let y = horizonY + (depth * groundH);
            let scale = 0.4 + (depth * 1.2);
            
            // CRITIQUE: Thin out left side, balance right, center clear
            // We use a weighted random approach
            let numTrees = Math.floor(Math.random() * 2) + 1; // Fewer trees per row
            
            for(let j=0; j<numTrees; j++) {
                let x = Math.random() * TARGET_WIDTH;
                
                // Strict Corridor: 130 to 190 is empty
                if (x > 130 && x < 190) {
                    // Force to sides
                    x = Math.random() > 0.5 ? (Math.random() * 120) : (200 + (Math.random() * 100));
                }
                
                // CRITIQUE: Thin out left side specifically
                if (x < 80 && Math.random() > 0.4) {
                    x = x + 100; // Shift to right
                }

                trees.push({
                    x: x, 
                    y: y + (Math.random() * 10), 
                    scale: scale,
                    z: depth
                });
            }
        }
        
        // Sort by depth
        trees.sort((a, b) => a.z - b.z);

        // Snow Particles
        snowParticles = [];
        for(let i=0; i<40; i++) {
            snowParticles.push({
                x: Math.random() * TARGET_WIDTH,
                y: Math.random() * TARGET_HEIGHT,
                speed: Math.random() * 0.4 + 0.2,
                size: Math.random() > 0.8 ? 2 : 1,
                offset: Math.random() * 100
            });
        }
    }

    // --- Drawing Helpers ---

    function drawRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
    }

    function drawPixelSkier(x, y) {
        ctx.save();
        ctx.translate(x, y);
        
        // Animation
        const bob = Math.sin(frame * 0.1) * 2; 
        ctx.translate(0, bob);

        const p = 2; // Pixel unit

        // Shadow (Flat)
        drawRect(-5*p, 14*p, 10*p, 2*p, 'rgba(0,0,0,0.2)');

        // Skis
        drawRect(-3*p, 12*p, 1*p, 14*p, PALETTE.skierSkis); 
        drawRect(2*p, 12*p, 1*p, 14*p, PALETTE.skierSkis);  

        // Poles
        drawRect(-6*p, 4*p, 1*p, 16*p, PALETTE.skierPoles);
        drawRect(5*p, 4*p, 1*p, 16*p, PALETTE.skierPoles);

        // Legs
        drawRect(-2*p, 8*p, 2*p, 5*p, PALETTE.skierPants);
        drawRect(1*p, 8*p, 2*p, 5*p, PALETTE.skierPants);

        // Body
        drawRect(-2*p, 1*p, 4*p, 8*p, PALETTE.skierJacket);
        
        // Arms
        drawRect(-4*p, 1*p, 2*p, 5*p, PALETTE.skierJacket);
        drawRect(2*p, 1*p, 2*p, 5*p, PALETTE.skierJacket);

        // Head
        drawRect(-2*p, -3*p, 4*p, 4*p, PALETTE.skierSkin);
        
        // Hat
        drawRect(-2*p, -4*p, 4*p, 1*p, PALETTE.skierHat);
        drawRect(-1*p, -5*p, 2*p, 1*p, PALETTE.skierHat);

        ctx.restore();
    }

    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        const p = 3 * scale; 

        // Shadow (Flat Polygon)
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.moveTo(-6*p, 0);
        ctx.lineTo(6*p, 0);
        ctx.lineTo(3*p, 2*p);
        ctx.lineTo(-3*p, 2*p);
        ctx.fill();

        // Trunk
        drawRect(-1*p, -3*p, 2*p, 3*p, '#5d4037');

        // Leaves - Layered Rectangles (No curves)
        drawRect(-5*p, -7*p, 10*p, 4*p, PALETTE.treeDark);
        drawRect(-3*p, -10*p, 6*p, 4*p, PALETTE.treeMid);
        drawRect(-1*p, -13*p, 2*p, 4*p, PALETTE.treeLight);

        // Highlights
        drawRect(-2*p, -6*p, 1*p, 2*p, PALETTE.treeHighlight); 
        drawRect(-1*p, -9*p, 1*p, 2*p, PALETTE.treeHighlight);

        ctx.restore();
    }

    function drawMountain(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + w/2, y - h); 
        ctx.lineTo(x + w, y);
        ctx.fill();

        // Snow Cap
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(x + w/2, y - h); 
        ctx.lineTo(x + w/2 - (w*0.15), y - h + (h*0.25)); 
        ctx.lineTo(x + w/2 + (w*0.15), y - h + (h*0.25)); 
        ctx.fill();
    }

    function drawBackground() {
        // 1. Sky (Flat bands)
        const bands = 20;
        const bandH = TARGET_HEIGHT / bands;
        for(let i=0; i<bands; i++) {
            let c = (i < 5) ? PALETTE.skyTop : (i < 10) ? '#6a96c9' : (i < 15) ? '#8ab3d6' : PALETTE.skyBot;
            ctx.fillStyle = c;
            ctx.fillRect(0, i * bandH, TARGET_WIDTH, bandH);
        }

        // 2. Mountains (Static)
        drawMountain(-50, 90, 200, 60, PALETTE.mntBack);
        drawMountain(100, 100, 250, 80, PALETTE.mntFront);
        drawMountain(250, 90, 180, 50, PALETTE.mntBack);

        // 3. Snow Slope (Flat Color)
        ctx.fillStyle = PALETTE.snowBase;
        ctx.fillRect(0, 90, TARGET_WIDTH, TARGET_HEIGHT - 90);

        // 4. Slope Texture (Vertical streaks)
        ctx.fillStyle = PALETTE.snowShadow;
        // Draw fewer, more defined streaks
        for(let i=0; i<TARGET_WIDTH; i+=8) {
            if (Math.random() > 0.6) {
                let h = Math.random() * (TARGET_HEIGHT - 90);
                ctx.fillRect(i, 90, 2, h);
            }
        }
    }

    function animate() {
        ctx.clearRect(0, 0, TARGET_WIDTH, TARGET_HEIGHT);

        drawBackground();

        // Draw Trees
        trees.forEach(tree => {
            drawTree(tree.x, tree.y, tree.scale);
        });

        // Draw Skier
        // Centered perfectly in the corridor
        const skierX = TARGET_WIDTH / 2;
        const skierY = 160; 
        drawPixelSkier(skierX, skierY);

        // Draw Snow Particles
        ctx.fillStyle = '#fff';
        snowParticles.forEach(p => {
            p.y += p.speed;
            p.x -= 0.5; 
            
            if (p.y > TARGET_HEIGHT) p.y = 0;
            if (p.x < 0) p.x = TARGET_WIDTH;
            
            ctx.globalAlpha = 0.8;
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        });
        ctx.globalAlpha = 1.0;

        frame++;
        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);
    
    document.getElementById('startBtn').addEventListener('click', function() {
        this.style.cursor = "wait";
        const promptText = this.querySelector('.prompt-text');
        const originalText = promptText.innerText;
        promptText.innerText = "LOADING...";
        
        setTimeout(() => {
            alert("Game Start! (Demo Mode)");
            promptText.innerText = originalText;
            this.style.cursor = "pointer";
        }, 600);
    });

    // Init
    resize();
    animate();

</script>
</body>
</html>
