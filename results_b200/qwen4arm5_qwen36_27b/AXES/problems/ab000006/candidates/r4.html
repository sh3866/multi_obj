<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkiFree - Retro Edition</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --ui-shadow: #2c1e16; /* Warm dark shadow */
            --btn-red: #d32f2f;
            --btn-red-dark: #9a0007;
            --btn-red-light: #ff5252;
            --text-white: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: none; /* Critical for crisp text */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "Courier New", "Lucida Console", monospace;
        }

        /* 
           CONTAINER: Maintains aspect ratio and centering 
        */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 
           CANVAS: The pixel art world
           Rendered at 320x240, scaled up via CSS with pixelated interpolation
        */
        canvas {
            image-rendering: pixelated; /* Standardized pixel scaling */
            image-rendering: crisp-edges;
            box-shadow: 0 0 0 10px var(--bg-color); /* Letterbox effect */
            max-width: 100%;
            max-height: 100%;
            z-index: 1;
        }

        /* 
           UI LAYER: Strict vertical hierarchy
        */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through empty areas */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 
           TYPOGRAPHY: Pixelated via text-shadow trick 
           (Simulates bitmap font without external files)
        */
        .pixel-font {
            font-family: "Courier New", monospace;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            /* The "Pixel" effect: Hard shadows, no blur */
            text-shadow: 
                -1px -1px 0 #000, 
                1px -1px 0 #000, 
                -1px 1px 0 #000, 
                1px 1px 0 #000,
                2px 2px 0 #000; /* Extra depth */
            position: relative;
        }

        /* TITLE: Top of screen */
        .title-container {
            margin-top: 10vh; /* Top section */
            text-align: center;
            pointer-events: auto;
            z-index: 20;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            color: var(--text-white);
            margin: 0;
            line-height: 1;
            /* Double shadow for depth */
            text-shadow: 
                4px 4px 0 #000,
                0 0 10px rgba(255,255,255,0.3);
        }

        /* INSTRUCTIONS: Just above the snow line (Mid-High) */
        .instructions-container {
            margin-top: 4vh;
            background: #000;
            padding: 4px 8px;
            border: 2px solid #fff;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
            pointer-events: auto;
            z-index: 20;
        }

        .instructions-text {
            color: #fff;
            font-size: clamp(0.6rem, 1.5vw, 0.9rem);
            margin: 0;
            text-shadow: none; /* Already on black bg */
            letter-spacing: 1px;
        }

        /* START BUTTON: Bottom, High Contrast, Pixel Art Style */
        .controls-container {
            position: absolute;
            bottom: 15vh;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: auto;
            z-index: 30;
        }

        .pixel-btn {
            background-color: var(--btn-red);
            border: none;
            outline: none;
            cursor: pointer;
            position: relative;
            padding: 12px 32px;
            font-family: "Courier New", monospace;
            font-weight: 900;
            font-size: clamp(1rem, 2vw, 1.5rem);
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            
            /* Pixel Art Bevel Effect using borders */
            border-top: 4px solid var(--btn-red-light);
            border-left: 4px solid var(--btn-red-light);
            border-right: 4px solid var(--btn-red-dark);
            border-bottom: 4px solid var(--btn-red-dark);
            box-shadow: 4px 4px 0 #000;
            
            transition: transform 0.05s;
            image-rendering: pixelated;
        }

        .pixel-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 #000;
            border-top: 4px solid var(--btn-red-dark);
            border-left: 4px solid var(--btn-red-dark);
            border-right: 4px solid var(--btn-red-light);
            border-bottom: 4px solid var(--btn-red-light);
        }

        .pixel-btn:hover {
            filter: brightness(1.1);
        }

        /* CRT Scanlines Overlay */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 50;
            opacity: 0.6;
        }
        
        /* Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.7) 100%);
            z-index: 45;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- The Retro World -->
        <canvas id="world"></canvas>
        
        <!-- UI Overlay -->
        <div class="ui-layer">
            
            <!-- 1. Title (Top) -->
            <div class="title-container">
                <h1 class="pixel-font">SkiFree</h1>
            </div>

            <!-- 2. Instructions (Mid-High, anchored to snow line) -->
            <div class="instructions-container">
                <p class="instructions-text pixel-font">USE ARROWS TO STEER &bull; AVOID TREES</p>
            </div>

            <!-- 3. Start Button (Bottom) -->
            <div class="controls-container">
                <button class="pixel-btn" id="startBtn">
                    START GAME
                </button>
            </div>

        </div>

        <!-- Post Processing -->
        <div class="vignette"></div>
        <div class="scanlines"></div>
    </div>

<script>
    /**
     * RENDER ENGINE
     * Strict 320x240 resolution, pixel-perfect drawing
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false });

    // Retro Resolution
    const WIDTH = 320;
    const HEIGHT = 240;

    // State
    let frame = 0;
    let trees = [];
    let snow = [];
    let skierBob = 0;

    // Palette (DOS / EGA Inspired)
    const C = {
        skyTop: '#4772b8',
        skyBot: '#a6cbe6',
        mntBack: '#3e5c8f',
        mntFront: '#2d4570',
        snow: '#eef4fa',
        snowShadow: '#c2d1e0',
        treeDark: '#006600',
        treeMid: '#009900',
        treeLight: '#33cc33',
        treeHighlight: '#66ff66',
        skierRed: '#d32f2f',
        skierBlue: '#1a237e',
        skierSkin: '#ffcc80',
        skierYellow: '#ffc107',
        skierPole: '#555555'
    };

    function init() {
        canvas.width = WIDTH;
        canvas.height = HEIGHT;
        
        // Generate World
        trees = [];
        // Create a "Corridor" in the middle (x: 120-200)
        // We place trees in rows to simulate depth
        const rows = 12;
        const horizon = 80;
        const groundHeight = HEIGHT - horizon;

        for(let i=0; i<rows; i++) {
            let depth = i / rows;
            let y = horizon + (depth * groundHeight) + (Math.random() * 10);
            let scale = 0.4 + (depth * 1.5); // Scale based on depth
            
            // Add 1-2 trees per row, avoiding center
            let count = Math.random() > 0.5 ? 2 : 1;
            for(let t=0; t<count; t++) {
                let x = Math.random() * WIDTH;
                // Force away from center
                if (x > 110 && x < 210) {
                    x = (x < 160) ? (Math.random() * 100) : (220 + Math.random() * 100);
                }
                
                trees.push({
                    x: x,
                    y: y,
                    scale: scale,
                    z: depth
                });
            }
        }
        
        // Sort by Z (painters algorithm)
        trees.sort((a,b) => a.z - b.z);

        // Snow particles
        snow = [];
        for(let i=0; i<50; i++) {
            snow.push({
                x: Math.random() * WIDTH,
                y: Math.random() * HEIGHT,
                speed: Math.random() * 0.5 + 0.2,
                size: Math.random() > 0.8 ? 2 : 1
            });
        }
    }

    // --- Drawing Primitives ---

    // Hard pixel rectangle
    function rect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
    }

    // The Skier (Procedural Pixel Art)
    function drawSkier(x, y) {
        ctx.save();
        ctx.translate(x, y);
        
        // Animation: Bobbing
        skierBob = Math.sin(frame * 0.15) * 2;
        ctx.translate(0, skierBob);

        const s = 2; // Pixel scale

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(-10*s, 24*s, 20*s, 3*s);

        // Skis (Yellow)
        rect(-6*s, 20*s, 2*s, 14*s, C.skierYellow);
        rect(4*s, 20*s, 2*s, 14*s, C.skierYellow);

        // Poles
        rect(-10*s, 5*s, 1*s, 20*s, C.skierPole);
        rect(9*s, 5*s, 1*s, 20*s, C.skierPole);

        // Legs (Blue)
        rect(-4*s, 14*s, 3*s, 8*s, C.skierBlue);
        rect(1*s, 14*s, 3*s, 8*s, C.skierBlue);

        // Body/Jacket (Red)
        rect(-4*s, 4*s, 8*s, 10*s, C.skierRed);
        
        // Arms
        rect(-7*s, 4*s, 3*s, 6*s, C.skierRed);
        rect(4*s, 4*s, 3*s, 6*s, C.skierRed);

        // Head (Skin)
        rect(-3*s, 0*s, 6*s, 4*s, C.skierSkin);

        // Hat (Red)
        rect(-3*s, -1*s, 6*s, 2*s, C.skierRed);

        ctx.restore();
    }

    // Procedural Tree
    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        const s = 3 * scale; // Base pixel size

        // Shadow (Flat, hard edge)
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.moveTo(-8*s, 0);
        ctx.lineTo(8*s, 0);
        ctx.lineTo(4*s, 2*s);
        ctx.lineTo(-4*s, 2*s);
        ctx.fill();

        // Trunk
        rect(-1*s, -3*s, 2*s, 3*s, '#5d4037');

        // Leaves (Triangle-ish rects)
        // Bottom
        rect(-6*s, -7*s, 12*s, 5*s, C.treeDark);
        // Mid
        rect(-4*s, -11*s, 8*s, 5*s, C.treeMid);
        // Top
        rect(-2*s, -15*s, 4*s, 5*s, C.treeLight);

        // Highlights (The "Pixel Art" shine)
        rect(-2*s, -6*s, 1*s, 2*s, C.treeHighlight);
        rect(-1*s, -10*s, 1*s, 2*s, C.treeHighlight);

        ctx.restore();
    }

    // Background
    function drawBackground() {
        // 1. Sky (Banded gradient)
        const bands = 10;
        const bandH = HEIGHT / bands;
        for(let i=0; i<bands; i++) {
            // Interpolate color manually or just step
            let t = i / bands;
            // Simple step logic for retro feel
            let color = (t < 0.4) ? C.skyTop : (t < 0.7) ? '#6a96c9' : C.skyBot;
            ctx.fillStyle = color;
            ctx.fillRect(0, i * bandH, WIDTH, bandH + 1); // +1 to prevent subpixel gaps
        }

        // 2. Mountains (Static, jagged)
        ctx.fillStyle = C.mntBack;
        ctx.beginPath();
        ctx.moveTo(0, 90);
        ctx.lineTo(80, 30);
        ctx.lineTo(160, 80);
        ctx.lineTo(240, 20);
        ctx.lineTo(320, 90);
        ctx.lineTo(320, 100);
        ctx.lineTo(0, 100);
        ctx.fill();

        ctx.fillStyle = C.mntFront;
        ctx.beginPath();
        ctx.moveTo(0, 100);
        ctx.lineTo(50, 60);
        ctx.lineTo(120, 90);
        ctx.lineTo(200, 50);
        ctx.lineTo(320, 100);
        ctx.fill();

        // 3. Snow Slope
        ctx.fillStyle = C.snow;
        ctx.fillRect(0, 85, WIDTH, HEIGHT - 85);

        // 4. Slope Texture (Vertical streaks for speed illusion)
        ctx.fillStyle = C.snowShadow;
        for(let i=0; i<WIDTH; i+=6) {
            if (Math.random() > 0.7) {
                let h = Math.random() * (HEIGHT - 85);
                ctx.fillRect(i, 85, 2, h);
            }
        }
    }

    // --- Main Loop ---

    function animate() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);

        drawBackground();

        // Draw Trees
        trees.forEach(t => drawTree(t.x, t.y, t.scale));

        // Draw Skier (Centered)
        drawSkier(WIDTH / 2, 160);

        // Draw Snow Particles (Foreground)
        ctx.fillStyle = '#fff';
        snow.forEach(p => {
            p.y += p.speed;
            p.x -= 0.2; // Wind
            if(p.y > HEIGHT) p.y = 0;
            if(p.x < 0) p.x = WIDTH;
            
            ctx.globalAlpha = 0.7;
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        });
        ctx.globalAlpha = 1.0;

        frame++;
        requestAnimationFrame(animate);
    }

    // Init
    window.addEventListener('resize', init);
    init();
    animate();

    // Button Interaction
    const btn = document.getElementById('startBtn');
    btn.addEventListener('click', () => {
        // Visual feedback
        btn.innerHTML = "LOADING...";
        btn.style.backgroundColor = "#555"; // Grey out
        btn.style.borderColor = "#333";
        
        setTimeout(() => {
            alert("GAME START! (This is a demo screen)");
            btn.innerHTML = "START GAME";
            btn.style.backgroundColor = ""; // Reset
            btn.style.borderColor = "";
        }, 500);
    });

</script>
</body>
</html>
