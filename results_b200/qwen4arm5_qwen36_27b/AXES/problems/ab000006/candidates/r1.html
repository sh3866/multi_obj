<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        :root {
            --pixel-font: 'Courier New', Courier, monospace;
            --color-sky-top: #5C94FC;
            --color-sky-bot: #A6D9FF;
            --color-snow: #FFFFFF;
            --color-snow-dark: #E0F0FF;
            --color-ui-accent: #FF5555;
            --color-text-shadow: #222;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--color-sky-top);
            font-family: var(--pixel-font);
        }

        /* The Canvas World - Background Layer */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: pixelated; /* Crucial for retro look */
        }

        /* UI Layer - Floating directly over scene */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas if needed, though we have a button */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Gradient Overlay for Text Legibility */
        .gradient-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        /* Typography & Layout */
        .title-container {
            margin-top: 8vh; /* Overlapping peak */
            text-align: center;
            pointer-events: auto;
            position: relative;
            z-index: 12;
        }

        h1 {
            margin: 0;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            /* Retro Bevel Effect using text-shadow */
            text-shadow: 
                4px 4px 0px #333,
                -1px -1px 0 #333,  
                1px -1px 0 #333,
                -1px 1px 0 #333,
                1px 1px 0 #333;
            letter-spacing: -2px;
            transform: scale(1.1, 0.9); /* Slight squash for retro logo feel */
        }

        .subtitle {
            font-size: 1.2rem;
            color: #fff;
            text-shadow: 2px 2px 0px #000;
            margin-top: 10px;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Bottom Controls Area */
        .controls-container {
            position: absolute;
            bottom: 5vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            pointer-events: auto;
            z-index: 12;
        }

        /* Pixel Art Instructions */
        .instructions {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            text-transform: uppercase;
        }

        .key-cap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: #ccc;
            border: 2px solid #fff;
            border-bottom: 4px solid #555;
            border-right: 4px solid #555;
            color: #000;
            font-size: 14px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
        }

        /* Retro Button */
        .start-btn {
            background-color: var(--color-ui-accent);
            color: #fff;
            border: none;
            padding: 12px 0;
            width: 240px;
            font-family: var(--pixel-font);
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            /* Pixelated Border Trick */
            box-shadow: 
                inset -4px -4px 0px rgba(0,0,0,0.3),
                inset 4px 4px 0px rgba(255,255,255,0.4),
                4px 4px 0px #000;
            transition: transform 0.1s;
            margin-bottom: 20px;
        }

        .start-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 
                inset -4px -4px 0px rgba(0,0,0,0.3),
                inset 4px 4px 0px rgba(255,255,255,0.4),
                6px 6px 0px #000;
        }

        .start-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 
                inset -4px -4px 0px rgba(0,0,0,0.3),
                inset 4px 4px 0px rgba(255,255,255,0.4),
                2px 2px 0px #000;
        }

        /* CRT Scanlines */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.6;
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.5) 100%);
            z-index: 15;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <!-- Canvas World -->
    <canvas id="world"></canvas>
    
    <!-- UI Layer -->
    <div class="ui-layer">
        <div class="gradient-overlay"></div>
        
        <div class="title-container">
            <h1>SkiFree</h1>
            <div class="subtitle">The Ultimate Winter Challenge</div>
        </div>

        <div class="controls-container">
            <div class="instructions">
                <div class="key-cap">←</div>
                <div class="key-cap">→</div>
                <span>Steer</span>
            </div>
            <button class="start-btn" id="startBtn">Start Game</button>
        </div>
    </div>

    <!-- Post-processing -->
    <div class="vignette"></div>
    <div class="crt-overlay"></div>

<script>
    /**
     * VISUAL ENGINE
     * Procedural retro graphics generation
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on base

    // State
    let width, height;
    let frame = 0;
    let trees = [];
    let snowParticles = [];
    
    // Palette
    const C_SKY_TOP = '#5C94FC';
    const C_SKY_BOT = '#A6D9FF';
    const C_MNT_BACK = '#6C8EBF';
    const C_MNT_FRONT = '#4B69B8';
    const C_SNOW = '#FFFFFF';
    const C_SNOW_DARK = '#D0E4FF';
    const C_TREE_DARK = '#005000';
    const C_TREE_LIGHT = '#008000';
    const C_TREE_SHADOW = 'rgba(0,0,0,0.2)';

    // Pixel Scale Reference
    const PIXEL_SIZE = 4; 

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        // Keep resolution 1:1 for crisp lines, rely on drawing rects
        canvas.width = width;
        canvas.height = height;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        const rows = 15; // Depth rows
        const spacingX = 120;
        
        // Generate Trees with Perspective
        for(let i=0; i<rows; i++) {
            let rowIdx = i;
            // Perspective Logic:
            // 0 is far (horizon), 14 is near (bottom)
            let depth = rowIdx / rows; 
            let y = (height * 0.4) + (depth * (height * 0.55)); // Spread from horizon to bottom
            
            // Scale gets bigger as we get closer
            let scale = 0.5 + (depth * 1.5); 
            
            // Add trees across width
            // Randomize X but keep some structure
            let numTrees = Math.floor(Math.random() * 4) + 2;
            for(let j=0; j<numTrees; j++) {
                let x = Math.random() * width;
                trees.push({
                    x: x, 
                    y: y + (Math.random() * 20), // slight jitter
                    scale: scale,
                    z: depth // for sorting
                });
            }
        }
        
        // Sort: Draw far trees first (lowest Z)
        trees.sort((a, b) => a.z - b.z);

        // Snow Particles
        snowParticles = [];
        for(let i=0; i<150; i++) {
            snowParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speed: Math.random() * 3 + 1,
                size: Math.random() > 0.9 ? 3 : 1, // Occasional big flake
                offset: Math.random() * 100
            });
        }
    }

    // --- Drawing Functions ---

    function drawPixelSkier(x, y) {
        ctx.save();
        ctx.translate(x, y);
        
        // Animation
        const bob = Math.sin(frame * 0.2) * 4; // Big bob
        const lean = Math.sin(frame * 0.1) * 0.1; // Lean
        
        ctx.translate(0, bob);
        ctx.rotate(lean);

        const p = PIXEL_SIZE; // 1 unit = 4px

        // Colors
        const skin = '#FFCC80';
        const hat = '#D32F2F';
        const jacket = '#D32F2F';
        const pants = '#1A237E';
        const skis = '#FFC107';
        const poles = '#555';

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(-8*p, 16*p, 16*p, 4*p);

        // Skis
        ctx.fillStyle = skis;
        ctx.fillRect(-6*p, 14*p, 2*p, 16*p); // Left
        ctx.fillRect(4*p, 14*p, 2*p, 16*p);  // Right

        // Poles
        ctx.fillStyle = poles;
        ctx.fillRect(-8*p, 4*p, 1*p, 18*p);
        ctx.fillRect(7*p, 4*p, 1*p, 18*p);

        // Legs
        ctx.fillStyle = pants;
        ctx.fillRect(-4*p, 10*p, 3*p, 6*p);
        ctx.fillRect(1*p, 10*p, 3*p, 6*p);

        // Body
        ctx.fillStyle = jacket;
        ctx.fillRect(-3*p, 2*p, 6*p, 9*p);
        
        // Arms
        ctx.fillRect(-5*p, 2*p, 2*p, 6*p);
        ctx.fillRect(3*p, 2*p, 2*p, 6*p);

        // Head
        ctx.fillStyle = skin;
        ctx.fillRect(-2*p, -3*p, 4*p, 4*p);
        
        // Hat
        ctx.fillStyle = hat;
        ctx.fillRect(-2*p, -5*p, 4*p, 2*p); // Brim
        ctx.fillRect(-1*p, -6*p, 2*p, 1*p); // Top

        ctx.restore();
    }

    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        const p = PIXEL_SIZE * scale; // Scale pixel size
        
        // Shadow (Grounding)
        ctx.fillStyle = C_TREE_SHADOW;
        ctx.beginPath();
        ctx.ellipse(0, 0, 10*p, 2*p, 0, 0, Math.PI * 2);
        ctx.fill();

        // Trunk
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(-1*p, -4*p, 2*p, 4*p);

        // Leaves - Layered Triangles
        // Bottom Layer
        ctx.fillStyle = C_TREE_DARK;
        ctx.fillRect(-6*p, -8*p, 12*p, 4*p);
        
        // Mid Layer
        ctx.fillRect(-4*p, -12*p, 8*p, 4*p);
        
        // Top Layer
        ctx.fillRect(-2*p, -16*p, 4*p, 4*p);

        // Highlights (Procedural texture)
        ctx.fillStyle = C_TREE_LIGHT;
        ctx.fillRect(-3*p, -8*p, 1*p, 2*p); // highlight on bottom
        ctx.fillRect(-1*p, -12*p, 1*p, 2*p); // highlight on mid

        ctx.restore();
    }

    function drawMountain(x, y, width, height, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + width/2, y - height); // Peak
        ctx.lineTo(x + width, y);
        ctx.fill();

        // Snow Cap
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(x + width/2, y - height); // Peak
        ctx.lineTo(x + width/2 - width*0.1, y - height + height*0.2); // Left slope cap
        ctx.lineTo(x + width/2 + width*0.1, y - height + height*0.2); // Right slope cap
        ctx.fill();
    }

    function drawBackground() {
        // Sky
        let grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, C_SKY_TOP);
        grad.addColorStop(1, C_SKY_BOT);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Distant Mountains (Parallax-ish static)
        drawMountain(-width*0.2, height*0.45, width*0.6, height*0.3, C_MNT_BACK);
        drawMountain(width*0.3, height*0.5, width*0.8, height*0.4, C_MNT_FRONT);
        
        // Main Snow Slope
        // The ground starts below the mountains
        ctx.fillStyle = C_SNOW;
        ctx.fillRect(0, height * 0.4, width, height * 0.6);

        // Slope texture (shadows)
        ctx.fillStyle = C_SNOW_DARK;
        // Draw horizontal "windrows"
        for(let i=0; i<height*0.6; i+=20) {
             let y = (height*0.4) + i;
             ctx.globalAlpha = 0.3;
             ctx.fillRect(0, y, width, 2);
        }
        ctx.globalAlpha = 1.0;
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        drawBackground();

        // Draw Trees (Back to Front)
        trees.forEach(tree => {
            // Simple parallax for trees based on mouse? No, just static for start screen.
            // But maybe sway slightly?
            drawTree(tree.x, tree.y, tree.scale);
        });

        // Draw Skier
        // Positioned bottom center, focal point
        const skierX = width / 2;
        const skierY = height - 140; // Above the button area
        drawPixelSkier(skierX, skierY);

        // Draw Snow Particles
        ctx.fillStyle = '#fff';
        snowParticles.forEach(p => {
            // Move
            p.y += p.speed;
            p.x -= 1; // Wind
            
            // Wrap
            if (p.y > height) p.y = 0;
            if (p.x < 0) p.x = width;
            
            // Draw
            ctx.globalAlpha = Math.random() * 0.5 + 0.5; // Twinkle
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        ctx.globalAlpha = 1.0;

        frame++;
        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);
    
    document.getElementById('startBtn').addEventListener('click', function() {
        // Visual feedback only
        this.innerText = "LOADING...";
        this.style.transform = "translate(2px, 2px)";
        this.style.boxShadow = "2px 2px 0px #000";
        
        setTimeout(() => {
            alert("Game Start! (Demo Mode)");
            this.innerText = "START GAME";
            this.style.transform = "";
            this.style.boxShadow = "";
        }, 600);
    });

    // Init
    resize();
    animate();

</script>
</body>
</html>
