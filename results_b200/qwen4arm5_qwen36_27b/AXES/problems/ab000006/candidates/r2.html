<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkiFree - Retro Edition</title>
    <style>
        :root {
            /* Palette */
            --c-sky-top: #4772b8;
            --c-sky-bot: #a6cbe6;
            --c-snow-base: #eef4fa;
            --c-snow-dark: #dce6f0;
            --c-snow-shadow: #c2d1e0;
            --c-mnt-back: #3e5c8f;
            --c-mnt-front: #2d4570;
            --c-tree-dark: #006600;
            --c-tree-mid: #009900;
            --c-tree-light: #33cc33;
            --c-tree-highlight: #66ff66;
            --c-text-stroke: #1a1a1a;
            --c-ui-bg: #222;
            --c-ui-border: #fff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--c-sky-top);
            /* Fallback font stack mimicking pixel art */
            font-family: "Courier New", "Lucida Console", monospace; 
        }

        /* 
           CORE VISUAL STRATEGY:
           We use a low-resolution canvas scaled up with CSS to enforce 
           a genuine pixel-art aesthetic without blurring.
        */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* The magic sauce for crisp pixels */
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        /* UI Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Pass clicks through */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* Typography: Pixel Style */
        .pixel-text {
            font-family: "Courier New", monospace; /* Strict monospace */
            text-transform: uppercase;
            font-weight: 900;
            line-height: 1;
        }

        /* Title Container */
        .title-container {
            margin-top: 6vh;
            text-align: center;
            position: relative;
            z-index: 12;
            pointer-events: none;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 8rem);
            color: #fff;
            margin: 0;
            /* Hard Pixel Drop Shadow */
            text-shadow: 
                6px 6px 0px var(--c-text-stroke),
                -2px -2px 0px var(--c-text-stroke),
                2px -2px 0px var(--c-text-stroke),
                -2px 2px 0px var(--c-text-stroke),
                2px 2px 0px var(--c-text-stroke);
            letter-spacing: -4px;
            transform: skewX(-5deg); /* Dynamic retro feel */
        }

        .subtitle {
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            color: #fff;
            margin-top: 10px;
            text-shadow: 2px 2px 0px #000;
            background: rgba(0,0,0,0.6);
            padding: 4px 8px;
            display: inline-block;
            letter-spacing: 1px;
        }

        /* HUD Container for Instructions */
        .hud-container {
            position: absolute;
            bottom: 15vh; /* Positioned above button, below skier */
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 11;
        }

        .hud-box {
            background: rgba(0, 0, 0, 0.7);
            border: 4px solid #fff;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            /* Pixelated corners via box-shadow trick */
            box-shadow: 
                4px 4px 0px #000, 
                -4px -4px 0px #000, 
                4px -4px 0px #000, 
                -4px 4px 0px #000;
        }

        .hud-text {
            color: #fff;
            font-size: 1.2rem;
            text-shadow: 1px 1px 0 #000;
        }

        /* Retro Arrow Keys */
        .arrow-keys {
            display: flex;
            gap: 4px;
        }
        .arrow-key {
            width: 24px;
            height: 24px;
            background: #fff;
            position: relative;
            box-shadow: inset 2px 2px 0 #ccc, inset -2px -2px 0 #888;
        }
        .arrow-key::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 6px solid transparent;
        }
        .arrow-left::after { border-right: 8px solid #000; left: 40%; }
        .arrow-right::after { border-left: 8px solid #000; left: 60%; }


        /* Bottom Controls Area */
        .controls-container {
            position: absolute;
            bottom: 5vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
            z-index: 12;
        }

        /* START BUTTON: Pixel Perfect Rectangle */
        .start-btn {
            background-color: #d32f2f;
            color: #fff;
            border: none;
            padding: 16px 32px;
            font-family: "Courier New", monospace;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            
            /* The Pixel Border Technique */
            border: 4px solid #fff;
            box-shadow: 
                inset -4px -4px 0px rgba(0,0,0,0.4),
                inset 4px 4px 0px rgba(255,255,255,0.4),
                6px 6px 0px #000; /* Hard shadow */
            
            transition: transform 0.05s;
        }

        .start-btn:hover {
            background-color: #e53935;
            transform: translate(-2px, -2px);
            box-shadow: 
                inset -4px -4px 0px rgba(0,0,0,0.4),
                inset 4px 4px 0px rgba(255,255,255,0.4),
                8px 8px 0px #000;
        }

        .start-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 
                inset -4px -4px 0px rgba(0,0,0,0.4),
                inset 4px 4px 0px rgba(255,255,255,0.4),
                2px 2px 0px #000;
        }

        /* CRT Scanlines (Subtle) */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Horizontal lines only, no color noise to keep it clean */
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.05),
                rgba(0, 0, 0, 0.05) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 20;
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.4) 100%);
            z-index: 15;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <!-- Canvas World -->
    <canvas id="world"></canvas>
    
    <!-- UI Layer -->
    <div class="ui-layer">
        
        <div class="title-container">
            <h1>SkiFree</h1>
            <div class="subtitle">Retro Edition</div>
        </div>

        <!-- Instructions HUD -->
        <div class="hud-container">
            <div class="hud-box">
                <div class="arrow-keys">
                    <div class="arrow-key arrow-left"></div>
                    <div class="arrow-key arrow-right"></div>
                </div>
                <span class="hud-text pixel-text">STEER</span>
            </div>
        </div>

        <div class="controls-container">
            <button class="start-btn pixel-text" id="startBtn">START GAME</button>
        </div>
    </div>

    <!-- Post-processing -->
    <div class="vignette"></div>
    <div class="crt-overlay"></div>

<script>
    /**
     * VISUAL ENGINE
     * Procedural retro graphics generation
     * 
     * Key Design Decisions based on Critique:
     * 1. Low-res internal resolution scaled up (pixelated).
     * 2. Rasterized everything (no smooth curves).
     * 3. Center corridor cleared for skier visibility.
     * 4. Vibrant 4-tone trees.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false });

    // Configuration
    // We render at a lower resolution (e.g., 320x240 or similar aspect) and scale up
    // This guarantees the "chunky" pixel look without relying on font smoothing.
    const TARGET_WIDTH = 320;
    const TARGET_HEIGHT = 240;
    
    // State
    let frame = 0;
    let trees = [];
    let snowParticles = [];
    
    // Colors (Mapped from CSS vars for JS access)
    const PALETTE = {
        skyTop: '#4772b8',
        skyBot: '#a6cbe6',
        mntBack: '#3e5c8f',
        mntFront: '#2d4570',
        snowBase: '#eef4fa',
        snowDark: '#dce6f0',
        treeDark: '#006600',
        treeMid: '#009900',
        treeLight: '#33cc33',
        treeHighlight: '#66ff66',
        skierSkin: '#ffcc80',
        skierHat: '#d32f2f',
        skierJacket: '#d32f2f',
        skierPants: '#1a237e',
        skierSkis: '#ffc107',
        skierPoles: '#555555'
    };

    function resize() {
        // Set internal resolution
        canvas.width = TARGET_WIDTH;
        canvas.height = TARGET_HEIGHT;
        
        // CSS handles the scaling to window size via width:100% height:100% + image-rendering:pixelated
        initWorld();
    }

    function initWorld() {
        trees = [];
        const rows = 12; 
        const horizonY = 80; // Where mountains meet snow
        const groundH = TARGET_HEIGHT - horizonY;

        // Generate Trees
        // Logic: Avoid center column (x: 130 to 190) to create the "Corridor"
        for(let i=0; i<rows; i++) {
            let depth = i / rows; // 0 (far) to 1 (near)
            // Perspective Y position
            let y = horizonY + (depth * groundH);
            
            // Scale based on depth
            let scale = 0.4 + (depth * 1.2);
            
            // Generate trees for this row
            // More trees further back? Or just random scatter.
            let numTrees = Math.floor(Math.random() * 3) + 1;
            
            for(let j=0; j<numTrees; j++) {
                let x = Math.random() * TARGET_WIDTH;
                
                // CRITIQUE FIX: Clear center column
                if (x > 120 && x < 200) {
                    // Push tree to left or right side
                    x = Math.random() > 0.5 ? Math.random() * 110 : 210 + (Math.random() * 100);
                }

                trees.push({
                    x: x, 
                    y: y + (Math.random() * 15), // Jitter
                    scale: scale,
                    z: depth
                });
            }
        }
        
        // Sort by depth (painter's algorithm)
        trees.sort((a, b) => a.z - b.z);

        // Snow Particles
        snowParticles = [];
        for(let i=0; i<60; i++) {
            snowParticles.push({
                x: Math.random() * TARGET_WIDTH,
                y: Math.random() * TARGET_HEIGHT,
                speed: Math.random() * 0.5 + 0.2,
                size: Math.random() > 0.8 ? 2 : 1,
                offset: Math.random() * 100
            });
        }
    }

    // --- Drawing Helpers ---

    // Helper to draw a blocky pixel rect
    function drawRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
    }

    function drawPixelSkier(x, y) {
        ctx.save();
        ctx.translate(x, y);
        
        // Animation
        const bob = Math.sin(frame * 0.15) * 2; 
        ctx.translate(0, bob);

        const p = 2; // 1 pixel unit for skier = 2 canvas pixels

        // Shadow (Hard edge)
        drawRect(-6*p, 14*p, 12*p, 2*p, 'rgba(0,0,0,0.2)');

        // Skis
        drawRect(-4*p, 12*p, 1*p, 14*p, PALETTE.skierSkis); // Left
        drawRect(3*p, 12*p, 1*p, 14*p, PALETTE.skierSkis);  // Right

        // Poles
        drawRect(-6*p, 4*p, 1*p, 16*p, PALETTE.skierPoles);
        drawRect(5*p, 4*p, 1*p, 16*p, PALETTE.skierPoles);

        // Legs
        drawRect(-3*p, 8*p, 2*p, 5*p, PALETTE.skierPants);
        drawRect(1*p, 8*p, 2*p, 5*p, PALETTE.skierPants);

        // Body
        drawRect(-2*p, 1*p, 4*p, 8*p, PALETTE.skierJacket);
        
        // Arms
        drawRect(-4*p, 1*p, 2*p, 5*p, PALETTE.skierJacket);
        drawRect(2*p, 1*p, 2*p, 5*p, PALETTE.skierJacket);

        // Head
        drawRect(-2*p, -3*p, 4*p, 4*p, PALETTE.skierSkin);
        
        // Hat
        drawRect(-2*p, -4*p, 4*p, 1*p, PALETTE.skierHat); // Brim
        drawRect(-1*p, -5*p, 2*p, 1*p, PALETTE.skierHat); // Top

        ctx.restore();
    }

    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Base pixel size for tree
        const p = 3 * scale; 

        // Shadow (Hard Edge Polygon)
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.moveTo(-8*p, 0);
        ctx.lineTo(8*p, 0);
        ctx.lineTo(4*p, 2*p);
        ctx.lineTo(-4*p, 2*p);
        ctx.fill();

        // Trunk
        drawRect(-1*p, -3*p, 2*p, 3*p, '#5d4037');

        // Leaves - Layered Rectangles (No curves)
        // Layer 1 (Bottom)
        drawRect(-6*p, -7*p, 12*p, 4*p, PALETTE.treeDark);
        // Layer 2 (Mid)
        drawRect(-4*p, -10*p, 8*p, 4*p, PALETTE.treeMid);
        // Layer 3 (Top)
        drawRect(-2*p, -13*p, 4*p, 4*p, PALETTE.treeLight);

        // Highlights (The "Vibrant" fix)
        drawRect(-2*p, -6*p, 1*p, 2*p, PALETTE.treeHighlight); 
        drawRect(-1*p, -9*p, 1*p, 2*p, PALETTE.treeHighlight);
        drawRect(0, -12*p, 1*p, 2*p, PALETTE.treeHighlight);

        ctx.restore();
    }

    function drawMountain(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + w/2, y - h); // Peak
        ctx.lineTo(x + w, y);
        ctx.fill();

        // Snow Cap (Pixelated Triangle)
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(x + w/2, y - h); 
        ctx.lineTo(x + w/2 - (w*0.15), y - h + (h*0.25)); 
        ctx.lineTo(x + w/2 + (w*0.15), y - h + (h*0.25)); 
        ctx.fill();
    }

    function drawBackground() {
        // 1. Sky (Blocky Gradient)
        // Instead of smooth gradient, we draw horizontal bands
        const bands = 20;
        const bandH = TARGET_HEIGHT / bands;
        for(let i=0; i<bands; i++) {
            // Interpolate color roughly
            const t = i / bands;
            // Simple color mix logic or just use the two colors
            // For true retro feel, let's just use the top color for top half, bot for bottom half? 
            // Or a few bands. Let's do 4 bands.
            let c = (i < 5) ? PALETTE.skyTop : (i < 10) ? '#6a96c9' : (i < 15) ? '#8ab3d6' : PALETTE.skyBot;
            ctx.fillStyle = c;
            ctx.fillRect(0, i * bandH, TARGET_WIDTH, bandH);
        }

        // 2. Mountains
        // Draw some static pixelated mountains
        drawMountain(-50, 90, 200, 60, PALETTE.mntBack);
        drawMountain(100, 100, 250, 80, PALETTE.mntFront);
        drawMountain(250, 90, 180, 50, PALETTE.mntBack);

        // 3. Snow Slope
        ctx.fillStyle = PALETTE.snowBase;
        ctx.fillRect(0, 90, TARGET_WIDTH, TARGET_HEIGHT - 90);

        // 4. Slope Texture (Vertical streaks instead of horizontal scanlines)
        ctx.fillStyle = PALETTE.snowDark;
        for(let i=0; i<TARGET_WIDTH; i+=4) {
            if (Math.random() > 0.7) {
                let h = Math.random() * (TARGET_HEIGHT - 90);
                ctx.fillRect(i, 90, 1, h);
            }
        }
    }

    function animate() {
        // Clear
        ctx.clearRect(0, 0, TARGET_WIDTH, TARGET_HEIGHT);

        drawBackground();

        // Draw Trees
        trees.forEach(tree => {
            drawTree(tree.x, tree.y, tree.scale);
        });

        // Draw Skier
        // Position: Center, visually anchored
        const skierX = TARGET_WIDTH / 2;
        const skierY = 160; // Fixed position on screen
        drawPixelSkier(skierX, skierY);

        // Draw Snow Particles
        ctx.fillStyle = '#fff';
        snowParticles.forEach(p => {
            p.y += p.speed;
            p.x -= 0.5; // Wind
            
            if (p.y > TARGET_HEIGHT) p.y = 0;
            if (p.x < 0) p.x = TARGET_WIDTH;
            
            ctx.globalAlpha = 0.8;
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        });
        ctx.globalAlpha = 1.0;

        frame++;
        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);
    
    document.getElementById('startBtn').addEventListener('click', function() {
        this.innerText = "LOADING...";
        // Simple animation feedback
        setTimeout(() => {
            alert("Game Start! (Demo Mode)");
            this.innerText = "START GAME";
        }, 500);
    });

    // Init
    resize();
    animate();

</script>
</body>
</html>
