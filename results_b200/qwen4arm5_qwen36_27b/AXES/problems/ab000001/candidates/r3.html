<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm Storybook / Wood & Crayon */
            --bg-color: #F2EFE9;
            --text-color: #4A3B32;
            --board-bg: #E6D5B8;
            --tile-color: #FFFDF7;
            --tile-border: #D7CCC8;
            --path-color: #E65100; /* Crayon Orange */
            --path-active: #D84315;
            --shadow-color: rgba(74, 59, 50, 0.25);
            
            /* Dimensions */
            --board-size: min(90vw, 560px);
            --gap-size: 4px;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            /* Subtle paper grain texture */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            font-family: 'Georgia', 'Times New Roman', serif;
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Layout Wrapper --- */
        .layout-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 32px; /* Consistent vertical spacing */
        }

        /* --- Header: Demoted, Playful --- */
        header {
            text-align: center;
            position: relative;
            width: var(--board-size);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0 4px;
        }

        h1 {
            font-family: 'Georgia', serif;
            font-weight: 900;
            font-size: 2.2rem;
            line-height: 1;
            margin: 0;
            letter-spacing: -1px;
            /* Playful rotation */
            transform: rotate(-2deg);
            color: var(--text-color);
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
        }

        .level-badge {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            font-size: 1rem;
            background: #FFF;
            padding: 4px 10px;
            border-radius: 12px;
            border: 2px solid var(--text-color);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
            transform: rotate(1deg);
        }

        /* --- The Board: Central Hero --- */
        .game-container {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            background: var(--board-bg);
            border-radius: 16px;
            padding: 12px;
            /* Soft, deep shadow */
            box-shadow: 
                0 10px 25px var(--shadow-color),
                inset 0 0 0 2px rgba(255,255,255,0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100%;
            height: 100%;
            gap: var(--gap-size);
            background: transparent;
        }

        .tile {
            background-color: var(--tile-color);
            position: relative;
            border-radius: 6px;
            /* Paper texture on tile */
            background-image: radial-gradient(#D7CCC8 1px, transparent 1px);
            background-size: 8px 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
            transition: background-color 0.3s;
        }

        /* Paths: Crayon Style */
        .tile svg {
            width: 100%;
            height: 100%;
            stroke: var(--path-color);
            stroke-width: 14;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            filter: url(#crayon); /* SVG Filter for rough edges */
            opacity: 0.8;
            transition: stroke 0.3s ease, opacity 0.3s;
        }

        .tile.active svg {
            stroke: var(--path-active);
            opacity: 1;
            filter: url(#crayon) drop-shadow(0 0 2px rgba(230, 81, 0, 0.4));
        }

        /* --- Tokens: Character & Goal --- */
        .token-layer {
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            pointer-events: none;
            z-index: 10;
        }

        /* Hand-drawn/Wooden Cub Token */
        .cub-token {
            position: absolute;
            width: 70%;
            height: 70%;
            /* Organic shape */
            border-radius: 45% 45% 40% 40% / 50% 50% 45% 45%;
            background: #8D6E63; /* Wood tone */
            transform: translate(-50%, -50%) rotate(-5deg);
            /* Diffuse warm shadow */
            box-shadow: 
                inset 2px 2px 5px rgba(255,255,255,0.4),
                inset -2px -2px 5px rgba(0,0,0,0.2),
                0 4px 8px rgba(141, 110, 99, 0.5); 
            transition: top 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.2);
        }

        /* Cub Face */
        .cub-face {
            width: 60%;
            height: 60%;
            opacity: 0.9;
        }

        /* Star Marker */
        .star-marker {
            position: absolute;
            width: 60%;
            height: 60%;
            transform: translate(-50%, -50%);
            color: #FFCA28; /* Gold */
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.15));
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) rotate(-5deg); }
            50% { transform: translate(-50%, -55%) rotate(5deg); }
        }

        /* --- Footer: Anchored Container --- */
        footer {
            width: var(--board-size);
            display: flex;
            gap: 20px; 
        }

        button {
            flex: 1;
            font-family: 'Nunito', 'Segoe UI', sans-serif; /* Clean sans-serif */
            font-weight: 800;
            font-size: 1.1rem;
            padding: 16px 0;
            border: none;
            border-radius: 16px; /* High border radius */
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none !important;
        }

        /* Reset: Distinct Outline Style */
        .btn-reset {
            background: transparent;
            color: var(--text-color);
            border: 3px solid #D7CCC8;
            box-shadow: 0 4px 0 #D7CCC8;
        }
        .btn-reset:hover {
            background: rgba(0,0,0,0.03);
            border-color: #BCAAA4;
            box-shadow: 0 4px 0 #BCAAA4;
        }

        /* Run: Tactile Wooden Block Style */
        .btn-run {
            background: #D84315;
            color: #FFF;
            border: 3px solid #BF360C;
            box-shadow: 0 6px 0 #BF360C;
            text-shadow: 0 1px 1px rgba(0,0,0,0.2);
        }
        .btn-run:hover {
            background: #E64A19;
            border-color: #D84315;
            box-shadow: 0 6px 0 #D84315;
        }

        /* --- SVG Filters --- */
        /* Hidden SVG for Crayon Effect */
        .svg-defs { position: absolute; width: 0; height: 0; }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(242, 239, 233, 0.9);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-family: 'Georgia', serif;
            font-size: 4rem;
            color: var(--path-active);
            margin: 0;
            transform: rotate(-3deg);
        }
        .overlay p {
            font-family: 'Nunito', sans-serif;
            font-size: 1.5rem;
            color: var(--text-color);
            margin-bottom: 2rem;
        }
        
        /* Responsive */
        @media (max-width: 600px) {
            :root { --board-size: 92vw; }
            h1 { font-size: 1.8rem; }
            footer { gap: 12px; }
            button { font-size: 0.9rem; padding: 14px 0; }
        }
    </style>
</head>
<body>

    <!-- SVG Definitions for Filters -->
    <svg class="svg-defs">
        <defs>
            <filter id="crayon" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <div class="layout-wrapper">
        <header>
            <h1>Cub n Pup</h1>
            <div class="level-badge">Level 1</div>
        </header>

        <div class="game-container">
            <!-- The Grid -->
            <div class="grid" id="grid"></div>
            
            <!-- Tokens Layer -->
            <div class="token-layer">
                <!-- Hand-drawn Cub Token -->
                <div class="cub-token" id="cub">
                    <svg class="cub-face" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round">
                        <circle cx="7" cy="9" r="1.5" fill="#FFF" stroke="none"/>
                        <circle cx="17" cy="9" r="1.5" fill="#FFF" stroke="none"/>
                        <path d="M8 16 Q12 19 16 16" stroke="#FFF" stroke-width="2.5" fill="none"/>
                        <path d="M6 6 L8 8 M18 6 L16 8" stroke="#FFF" stroke-width="1.5"/>
                    </svg>
                </div>
                
                <!-- Star Marker -->
                <div class="star-marker" id="star">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2 L15 9 L22 9 L16 14 L18 21 L12 17 L6 21 L8 14 L2 9 L9 9 Z" />
                    </svg>
                </div>
            </div>
        </div>

        <footer>
            <button class="btn-reset" onclick="game.reset()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                Reset
            </button>
            <button class="btn-run" onclick="game.run()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                Run Path
            </button>
        </footer>
    </div>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" style="width: auto; padding: 12px 32px;" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        // --- Game Logic & Drawing ---

        const GRID_SIZE = 6;
        
        // Tile Types (SVG Paths) - Coordinates based on 100x100 box
        const TILE_TYPES = {
            EMPTY: { paths: [] },
            LINE: { paths: ['M50 0 V100'], con: [1,0,1,0] }, 
            LINE_H: { paths: ['M0 50 H100'], con: [0,1,0,1] }, 
            CORNER_TR: { paths: ['M50 0 V50 H100'], con: [1,1,0,0] },
            CORNER_BR: { paths: ['M100 50 V100 H50'], con: [0,1,1,0] },
            CORNER_BL: { paths: ['M0 50 V100 H50'], con: [0,0,1,1] },
            CORNER_TL: { paths: ['M50 0 V50 H0'], con: [1,0,0,1] },
            T_DOWN: { paths: ['M50 0 V100 M0 50 H100'], con: [1,1,1,1] },
            T_UP: { paths: ['M0 50 H100 M50 50 V100'], con: [0,1,1,1] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,0,1,1] },
            T_LEFT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,1,1,0] }
        };

        // Visual Layout Map
        const PUZZLE_MAP = [
            ['C_TL', 'L', 'C_TR', 'L', 'C_TL', 'L'],
            ['L', 'C_BR', 'L', 'C_TL', 'L', 'L'],
            ['L', 'L', 'C_BL', 'C_BR', 'C_BL', 'C_BR'],
            ['L', 'C_TL', 'L', 'L', 'C_BL', 'L'],
            ['C_TR', 'L', 'C_BL', 'C_BR', 'L', 'L'],
            ['L', 'L', 'L', 'L', 'L', 'L']
        ];

        function createSVG(paths) {
            if(paths.length === 0) return '';
            let svgContent = paths.map(p => `<path d="${p}" />`).join('');
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svgContent}</svg>`;
        }

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 4}; 
                this.cubPos = {x: 0, y: 0};
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const tileType = this.getTileType(x, y);
                        const div = document.createElement('div');
                        div.className = 'tile';
                        div.innerHTML = createSVG(tileType.paths);
                        
                        div.dataset.x = x;
                        div.dataset.y = y;
                        div.dataset.con = JSON.stringify(tileType.con);
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            getTileType(x, y) {
                const layout = PUZZLE_MAP;
                const key = layout[y][x];
                
                const map = {
                    'L': TILE_TYPES.LINE,
                    'C_TL': TILE_TYPES.CORNER_TL,
                    'C_TR': TILE_TYPES.CORNER_TR,
                    'C_BL': TILE_TYPES.CORNER_BL,
                    'C_BR': TILE_TYPES.CORNER_BR,
                    'C': TILE_TYPES.CORNER_TL 
                };
                
                return map[key] || TILE_TYPES.EMPTY;
            }

            updateTokenPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.cubPos = {x: 0, y: 0};
                this.updateTokenPosition(0, 0);
            }

            async run() {
                // Path definition
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:4, y:4}, {x:4, y:3}, 
                    {x:5, y:3}, {x:5, y:4} 
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    const tile = this.cells[step.y][step.x];
                    
                    // Activate tile style
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateTokenPosition(step.x, step.y);
                    
                    // Slight rotation for "waddle" effect
                    this.cubEl.style.transform = `translate(-50%, -50%) rotate(${i%2===0 ? '-5deg' : '5deg'})`;

                    await new Promise(r => setTimeout(r, 350));
                }

                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 300);
            }
        }

        const game = new Game();

    </script>
</body>
</html>
