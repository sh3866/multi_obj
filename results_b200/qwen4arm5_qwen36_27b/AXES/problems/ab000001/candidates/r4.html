<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm Storybook */
            --bg-color: #F4F1EB; /* Warm paper */
            --bg-texture: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            
            --text-main: #4A3B32;
            --text-light: #8D7B74;
            
            --board-bg: #E6D5B8; /* Wood board */
            --board-shadow: rgba(74, 59, 50, 0.3);
            
            --tile-bg: #FFFDF7;
            --tile-border: #E0D5C5;
            
            --path-inactive: #D7CCC8;
            --path-active: #E65100; /* Terracotta */
            
            --btn-primary: #D84315;
            --btn-primary-shadow: #BF360C;
            --btn-secondary: #FFF;
            --btn-secondary-border: #D7CCC8;
            
            --spacing-unit: 8px;
            --board-size: min(90vw, 540px);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: var(--bg-texture);
            font-family: 'Nunito', 'Fredoka One', 'Segoe UI', 'Arial Rounded MT Bold', sans-serif;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        /* --- Layout & Typography --- */
        .layout-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            gap: calc(var(--spacing-unit) * 2); /* 16px */
            padding: calc(var(--spacing-unit) * 2);
        }

        header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: calc(var(--spacing-unit) * 0.5);
        }

        h1 {
            font-family: 'Fredoka One', 'Nunito', sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1;
            margin: 0;
            color: var(--text-main);
            letter-spacing: -1px;
            transform: rotate(-2deg);
            text-shadow: 2px 2px 0px rgba(255,255,255,0.6);
        }

        .level-badge {
            font-size: 0.9rem;
            font-weight: 700;
            background: #FFF;
            color: var(--path-active);
            padding: 4px 16px;
            border-radius: 20px;
            border: 2px solid var(--path-active);
            box-shadow: 0 4px 0 rgba(216, 67, 21, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- The Board --- */
        .game-container {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            background: var(--board-bg);
            border-radius: 24px;
            padding: 16px;
            box-shadow: 
                0 15px 35px var(--board-shadow),
                inset 0 2px 0 rgba(255,255,255,0.4),
                inset 0 -2px 0 rgba(0,0,0,0.1);
            /* Wood grain texture */
            background-image: 
                repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 8px),
                linear-gradient(to bottom, #E6D5B8, #DBCBA8);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100%;
            height: 100%;
            gap: 6px;
        }

        .tile {
            background-color: var(--tile-bg);
            position: relative;
            border-radius: 8px;
            /* Subtle paper texture */
            background-image: radial-gradient(#D7CCC8 1px, transparent 1px);
            background-size: 4px 4px;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        /* Paths: Thick, Ink/Wood Style */
        .tile svg {
            width: 100%;
            height: 100%;
            stroke: var(--path-inactive);
            stroke-width: 18;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            filter: url(#ink);
            transition: stroke 0.3s ease, opacity 0.3s;
            opacity: 0.5;
        }

        .tile.active svg {
            stroke: var(--path-active);
            opacity: 1;
            filter: url(#ink) drop-shadow(0 2px 2px rgba(230, 81, 0, 0.3));
        }

        /* --- Tokens --- */
        .token-layer {
            position: absolute;
            top: 16px; left: 16px; right: 16px; bottom: 16px;
            pointer-events: none;
            z-index: 10;
        }

        /* Cub Token: Terracotta/Wood Block */
        .cub-token {
            position: absolute;
            width: 65%; /* Scaled down to fit cell */
            height: 65%;
            border-radius: 25% 25% 20% 20% / 30% 30% 20% 20%;
            background: radial-gradient(circle at 30% 30%, #D84315, #8D2400);
            transform: translate(-50%, -50%) rotate(-5deg);
            box-shadow: 
                inset 3px 3px 8px rgba(255,255,255,0.3),
                inset -3px -3px 8px rgba(0,0,0,0.2),
                0 6px 10px rgba(0,0,0,0.3); 
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.1);
        }

        /* Cub Face Details */
        .cub-face {
            width: 70%;
            height: 70%;
            opacity: 0.95;
        }

        /* Star Marker: Glowing Gold */
        .star-marker {
            position: absolute;
            width: 60%;
            height: 60%;
            transform: translate(-50%, -50%);
            color: #FFCA28;
            filter: drop-shadow(0 0 8px rgba(255, 202, 40, 0.8));
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -60%) scale(1.1); }
        }

        /* --- Footer --- */
        footer {
            width: var(--board-size);
            display: flex;
            gap: 16px; /* 8px grid rhythm */
        }

        button {
            flex: 1;
            font-family: inherit;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 16px 0;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none !important;
        }

        /* Reset: Secondary */
        .btn-reset {
            background: var(--btn-secondary);
            color: var(--text-light);
            border: 2px solid var(--btn-secondary-border);
            box-shadow: 0 4px 0 var(--btn-secondary-border);
        }
        .btn-reset:hover {
            background: #FAFAFA;
            color: var(--text-main);
        }

        /* Run: Primary */
        .btn-run {
            background: var(--btn-primary);
            color: #FFF;
            border: 2px solid var(--btn-primary-shadow);
            box-shadow: 0 6px 0 var(--btn-primary-shadow);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .btn-run:hover {
            background: #E64A19;
            transform: translateY(-1px);
            box-shadow: 0 7px 0 var(--btn-primary-shadow);
        }
        .btn-run:active {
            transform: translateY(4px);
        }

        /* --- SVG Filters --- */
        .svg-defs { position: absolute; width: 0; height: 0; }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(244, 241, 235, 0.95);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-family: 'Fredoka One', sans-serif;
            font-size: 4.5rem;
            color: var(--path-active);
            margin: 0;
            transform: rotate(-3deg);
            text-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }
        .overlay p {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 2.5rem;
            margin-top: 0.5rem;
        }
        
        /* Responsive */
        @media (max-width: 600px) {
            :root { --board-size: 92vw; }
            h1 { font-size: 2.2rem; }
            .game-container { padding: 10px; }
            footer { gap: 12px; }
            button { font-size: 0.9rem; padding: 14px 0; }
        }
    </style>
</head>
<body>

    <!-- SVG Definitions for Filters -->
    <svg class="svg-defs">
        <defs>
            <!-- Ink/Wood Grain Filter for Paths -->
            <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <div class="layout-wrapper">
        <header>
            <h1>Cub n Pup</h1>
            <div class="level-badge">Level 1</div>
        </header>

        <div class="game-container">
            <!-- The Grid -->
            <div class="grid" id="grid"></div>
            
            <!-- Tokens Layer -->
            <div class="token-layer">
                <!-- Hand-drawn Cub Token -->
                <div class="cub-token" id="cub">
                    <svg class="cub-face" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round">
                        <!-- Eyes -->
                        <circle cx="7" cy="9" r="2" fill="#FFF" stroke="none"/>
                        <circle cx="17" cy="9" r="2" fill="#FFF" stroke="none"/>
                        <!-- Mouth -->
                        <path d="M8 15 Q12 19 16 15" stroke="#FFF" stroke-width="2.5" fill="none"/>
                        <!-- Eyebrows -->
                        <path d="M5 6 L9 7 M19 6 L15 7" stroke="#FFF" stroke-width="2"/>
                    </svg>
                </div>
                
                <!-- Star Marker -->
                <div class="star-marker" id="star">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2 L15 9 L22 9 L16 14 L18 21 L12 17 L6 21 L8 14 L2 9 L9 9 Z" />
                    </svg>
                </div>
            </div>
        </div>

        <footer>
            <button class="btn-reset" onclick="game.reset()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                Reset
            </button>
            <button class="btn-run" onclick="game.run()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                Run Path
            </button>
        </footer>
    </div>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" style="width: auto; padding: 16px 40px;" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        // --- Game Logic & Drawing ---

        const GRID_SIZE = 6;
        
        // Tile Types (SVG Paths) - Coordinates based on 100x100 box
        const TILE_TYPES = {
            EMPTY: { paths: [] },
            LINE: { paths: ['M50 0 V100'], con: [1,0,1,0] }, 
            LINE_H: { paths: ['M0 50 H100'], con: [0,1,0,1] }, 
            CORNER_TR: { paths: ['M50 0 V50 H100'], con: [1,1,0,0] },
            CORNER_BR: { paths: ['M100 50 V100 H50'], con: [0,1,1,0] },
            CORNER_BL: { paths: ['M0 50 V100 H50'], con: [0,0,1,1] },
            CORNER_TL: { paths: ['M50 0 V50 H0'], con: [1,0,0,1] },
            T_DOWN: { paths: ['M50 0 V100 M0 50 H100'], con: [1,1,1,1] },
            T_UP: { paths: ['M0 50 H100 M50 50 V100'], con: [0,1,1,1] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,0,1,1] },
            T_LEFT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,1,1,0] }
        };

        // Visual Layout Map
        const PUZZLE_MAP = [
            ['C_TL', 'L', 'C_TR', 'L', 'C_TL', 'L'],
            ['L', 'C_BR', 'L', 'C_TL', 'L', 'L'],
            ['L', 'L', 'C_BL', 'C_BR', 'C_BL', 'C_BR'],
            ['L', 'C_TL', 'L', 'L', 'C_BL', 'L'],
            ['C_TR', 'L', 'C_BL', 'C_BR', 'L', 'L'],
            ['L', 'L', 'L', 'L', 'L', 'L']
        ];

        function createSVG(paths) {
            if(paths.length === 0) return '';
            let svgContent = paths.map(p => `<path d="${p}" />`).join('');
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svgContent}</svg>`;
        }

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 4}; 
                this.cubPos = {x: 0, y: 0};
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const tileType = this.getTileType(x, y);
                        const div = document.createElement('div');
                        div.className = 'tile';
                        div.innerHTML = createSVG(tileType.paths);
                        
                        div.dataset.x = x;
                        div.dataset.y = y;
                        div.dataset.con = JSON.stringify(tileType.con);
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            getTileType(x, y) {
                const layout = PUZZLE_MAP;
                const key = layout[y][x];
                
                const map = {
                    'L': TILE_TYPES.LINE,
                    'C_TL': TILE_TYPES.CORNER_TL,
                    'C_TR': TILE_TYPES.CORNER_TR,
                    'C_BL': TILE_TYPES.CORNER_BL,
                    'C_BR': TILE_TYPES.CORNER_BR,
                    'C': TILE_TYPES.CORNER_TL 
                };
                
                return map[key] || TILE_TYPES.EMPTY;
            }

            updateTokenPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.cubPos = {x: 0, y: 0};
                this.updateTokenPosition(0, 0);
                this.cubEl.style.transform = `translate(-50%, -50%) rotate(-5deg)`;
            }

            async run() {
                // Path definition
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:4, y:4}, {x:4, y:3}, 
                    {x:5, y:3}, {x:5, y:4} 
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    const tile = this.cells[step.y][step.x];
                    
                    // Activate tile style
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateTokenPosition(step.x, step.y);
                    
                    // Slight rotation for "waddle" effect
                    this.cubEl.style.transform = `translate(-50%, -50%) rotate(${i%2===0 ? '-5deg' : '5deg'})`;

                    await new Promise(r => setTimeout(r, 350));
                }

                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 300);
            }
        }

        const game = new Game();

    </script>
</body>
</html>
