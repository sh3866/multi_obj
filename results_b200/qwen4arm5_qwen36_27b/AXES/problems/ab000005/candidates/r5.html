<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless Co. | Premium Cleaning</title>
    <style>
        :root {
            /* Palette: Warm, Textured, Premium */
            --bg-floor: #EBE5CE;
            --text-charcoal: #2C2A25;
            --text-secondary: #5D5950;
            --cta-terracotta: #C05636;
            --cta-shadow: rgba(192, 86, 54, 0.35);
            --spill-amber: #E8A928;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-floor);
            /* System Font Stack: Serif for headers, Geometric Sans for body */
            font-family: "Inter", "Segoe UI", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Main Container */
        .scene-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG Background Layer */
        .floor-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* UI Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Align left */
            padding: 0 80px;
            box-sizing: border-box;
        }

        .brand-block {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            max-width: 480px;
            /* Alignment: Vertically positioned to align with spill top */
            margin-top: 120px; 
        }

        /* Typography Styles */
        .brand-mark {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-charcoal);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px; /* Increased spacing */
            opacity: 0.9;
        }

        .brand-mark::after {
            content: '';
            display: block;
            width: 40px;
            height: 2px;
            background-color: var(--cta-terracotta);
            opacity: 0.8;
        }

        h1 {
            /* Refined Serif */
            font-family: "Playfair Display", "Georgia", "Times New Roman", serif;
            font-size: clamp(48px, 6vw, 80px);
            line-height: 1.05;
            color: var(--text-charcoal);
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        p {
            /* Geometric Sans */
            font-family: "Inter", "Segoe UI", sans-serif;
            font-size: 17px;
            line-height: 1.6; /* Increased for readability */
            font-weight: 400;
            color: var(--text-secondary);
            margin: 28px 0 32px 0; /* Tighter grouping with button */
            max-width: 380px;
        }

        /* CTA Button */
        .cta-button {
            pointer-events: auto;
            background-color: var(--cta-terracotta);
            color: #FFFFFF;
            border: none;
            padding: 18px 48px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 4px; /* Slightly sharper corners for elegance */
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 25px var(--cta-shadow);
            display: inline-block;
            text-decoration: none;
            text-align: center;
            /* Grouped with text */
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px var(--cta-shadow);
            background-color: #A84A2E;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .ui-layer {
                padding: 30px;
                align-items: flex-end;
                padding-bottom: 80px;
            }
            .brand-block {
                margin-top: 0;
            }
            h1 {
                font-size: 42px;
            }
        }
    </style>
</head>
<body>

<div class="scene-container">
    
    <!-- VISUAL SCENE: The Floor, Spill, and Mop -->
    <svg class="floor-scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
        <defs>
            <!-- 1. Texture: Wood Grain / Warm Stone -->
            <filter id="woodTexture" x="0" y="0" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="0.01 0.15" numOctaves="3" result="noise" />
                <feColorMatrix type="matrix" values="0 0 0 0 0.92, 0 0 0 0 0.88, 0 0 0 0 0.80, 0 0 0 0.05 0" in="noise" result="coloredNoise" />
                <feComposite operator="in" in="coloredNoise" in2="SourceGraphic" result="texture" />
                <feBlend mode="multiply" in="texture" in2="SourceGraphic" />
            </filter>

            <!-- 2. Liquid Gradient: Viscous Amber -->
            <radialGradient id="liquidGrad" cx="50%" cy="50%" r="50%" fx="65%" fy="65%">
                <stop offset="0%" style="stop-color:#F9D976;stop-opacity:0.9" /> 
                <stop offset="50%" style="stop-color:#E8A928;stop-opacity:0.85" /> 
                <stop offset="100%" style="stop-color:#B3771B;stop-opacity:0.75" /> 
            </radialGradient>

            <!-- 3. Filters: Shadows and Wetness -->
            <filter id="wetBlur" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur" />
                <feOffset dx="0" dy="10" />
            </filter>

            <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur" />
                <feOffset dx="-5" dy="15" result="offsetBlur" />
                <feComponentTransfer>
                    <feFuncA type="linear" slope="0.2" />
                </feComponentTransfer>
                <feMerge> 
                    <feMergeNode />
                    <feMergeNode in="SourceGraphic" /> 
                </feMerge>
            </filter>
            
            <!-- Mop Head Gradient for volume -->
            <linearGradient id="mopHeadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#4A453E;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#6B645A;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#3D3832;stop-opacity:1" />
            </linearGradient>
        </defs>

        <!-- 1. The Floor (Warm, Textured) -->
        <g>
            <!-- Base Color -->
            <rect width="100%" height="100%" fill="#EBE5CE" />
            <!-- Wood Grain Texture Overlay -->
            <rect width="100%" height="100%" filter="url(#woodTexture)" pointer-events="none" opacity="0.6"/>
        </g>

        <!-- 2. The Spill (Realistic Liquid) -->
        <!-- Positioned to balance text on left, Y-center approx 400 -->
        <g transform="translate(720, 420)">
            
            <!-- Wet Floor Reflection (Underneath) -->
            <path 
                d="M-80,-30 C-20,-120 100,-140 180,-60 C250,-10 220,110 130,130 C40,150 -110,130 -140,70 C-170,0 -140,-10 -80,-30 Z" 
                fill="#D4AF37" opacity="0.3" filter="url(#wetBlur)" transform="scale(1.05, 0.8)" />

            <!-- Main Liquid Body (Irregular organic shape) -->
            <path 
                d="M-80,-30 C-20,-120 100,-140 180,-60 C250,-10 220,110 130,130 C40,150 -110,130 -140,70 C-170,0 -140,-10 -80,-30 Z" 
                fill="url(#liquidGrad)" />
            
            <!-- Liquid Highlights (Refraction/Sheen) -->
            <path d="M-40,-70 Q 20,-100 80,-60" stroke="#FFF" stroke-width="8" fill="none" opacity="0.3" stroke-linecap="round" filter="blur(3px)"/>
            <ellipse cx="100" cy="20" rx="40" ry="15" fill="#FFF" opacity="0.15" transform="rotate(-20 100 20)" filter="blur(4px)"/>
            
            <!-- Splatters (Droplets) -->
            <g fill="#E8A928" opacity="0.8">
                <circle cx="210" cy="30" r="14" />
                <circle cx="240" cy="60" r="8" />
                <circle cx="190" cy="80" r="5" />
                <circle cx="-160" cy="50" r="12" />
                <circle cx="-180" cy="30" r="6" />
                <circle cx="120" cy="-100" r="9" />
            </g>
        </g>

        <!-- 3. The Mop (Detailed, Interacting) -->
        <!-- Angled to point towards the text, head pushing the spill -->
        <g transform="translate(800, 480) rotate(-15)" filter="url(#dropShadow)">
            
            <!-- Handle (Wood/Metal mix) -->
            <line x1="20" y1="100" x2="-300" y2="-650" stroke="#3D3832" stroke-width="12" stroke-linecap="round" />
            <!-- Handle Highlight -->
            <line x1="18" y1="100" x2="-300" y2="-650" stroke="#5D5950" stroke-width="4" stroke-linecap="round" />
            
            <!-- Joint (Metal connector) -->
            <circle cx="20" cy="100" r="14" fill="#2C2A25" />
            <circle cx="20" cy="100" r="6" fill="#1A1916" />

            <!-- Mop Head (Wet Microfiber Strands) -->
            <!-- Positioned to overlap the spill slightly -->
            <g transform="translate(20, 100)">
                
                <!-- Base Shadow -->
                <ellipse cx="0" cy="80" rx="60" ry="15" fill="rgba(0,0,0,0.2)" filter="blur(6px)"/>
                
                <!-- Wet Fibers (Clumped, heavy look) -->
                <!-- Darker base for wetness -->
                <g stroke="#4A453E" stroke-linecap="round" fill="none">
                    <!-- Left Cluster -->
                    <path d="M-15,0 Q-40,60 -35,110" stroke-width="14" />
                    <path d="M-30,-5 Q-60,30 -40,90" stroke-width="10" />
                    <path d="M-45,5 Q-70,50 -45,80" stroke-width="8" />
                    
                    <!-- Right Cluster -->
                    <path d="M15,0 Q40,60 35,110" stroke-width="14" />
                    <path d="M30,-5 Q60,30 40,90" stroke-width="10" />
                    <path d="M45,5 Q70,50 45,80" stroke-width="8" />
                    
                    <!-- Center Cluster -->
                    <path d="M-5,-5 Q-10,60 -5,120" stroke-width="16" />
                    <path d="M5,-5 Q10,60 5,120" stroke-width="16" />
                    <path d="M0,-10 Q0,70 0,130" stroke-width="16" />
                </g>

                <!-- Yellow Staining (Interaction with spill) -->
                <!-- Simulates the mop absorbing the liquid -->
                <path d="M-30,50 Q0,70 30,50" stroke="#E8A928" stroke-width="12" fill="none" opacity="0.7" stroke-linecap="round" filter="blur(2px)"/>
                <path d="M-20,80 Q0,100 20,80" stroke="#E8A928" stroke-width="10" fill="none" opacity="0.6" stroke-linecap="round" filter="blur(2px)"/>
                
                <!-- Highlights on wet fibers -->
                <path d="M-5,10 Q-10,60 -5,100" stroke="#7D766D" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
                <path d="M5,10 Q10,60 5,100" stroke="#7D766D" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
            </g>
        </g>

        <!-- Vignette for depth -->
        <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none"/>
        
        <!-- Define Vignette here to be used -->
        <defs>
            <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
                <stop offset="60%" style="stop-color:rgba(0,0,0,0)" />
                <stop offset="100%" style="stop-color:rgba(45, 40, 35, 0.15)" />
            </radialGradient>
        </defs>
    </svg>

    <!-- UI LAYER: Floating Typography -->
    <div class="ui-layer">
        <div class="brand-block">
            <div>
                <div class="brand-mark">Spotless Co.</div>
                <h1>Clarity in<br>every corner.</h1>
                <p>Experience the difference of a deep clean. We restore the natural warmth of your home with eco-friendly solutions and meticulous care.</p>
                <a href="#" class="cta-button">Book a Clean</a>
            </div>
        </div>
    </div>

</div>

</body>
</html>
