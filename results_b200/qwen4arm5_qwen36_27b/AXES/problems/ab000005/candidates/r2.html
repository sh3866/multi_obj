<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless - Premium Cleaning Service</title>
    <style>
        :root {
            /* Palette: Warm, Earthy, Refined */
            --bg-wood-dark: #3E2723;
            --bg-wood-light: #5D4037;
            --text-charcoal: #2C2420;
            --text-muted: #5D544F;
            --accent-gold: #D4AF37;
            --accent-gold-dark: #B8962E;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.4);
            
            /* Typography */
            --font-serif: "Playfair Display", "Didot", "Georgia", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-wood-dark); /* Fallback */
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        /* Main Container: Full Screen Immersive */
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Background: The Wood Floor Scene */
        .scene-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            /* Perspective for the floor to give depth */
            transform-origin: center center;
        }

        /* Left Panel: Frosted Glass Card */
        .info-card {
            position: absolute;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            width: 420px;
            padding: 50px;
            
            /* Glassmorphism */
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.15),
                inset 0 0 0 1px rgba(255,255,255,0.2);
            
            z-index: 10;
            display: flex;
            flex-direction: column;
            animation: fadeIn 1s ease-out;
        }

        /* Typography & Layout */
        .brand {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            background: var(--accent-gold);
            border-radius: 50%;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 48px;
            line-height: 1.1;
            color: var(--text-charcoal);
            margin: 0 0 20px 0;
            font-weight: 700;
        }

        p {
            font-size: 16px;
            line-height: 1.6; /* Airy */
            color: var(--text-muted);
            margin: 0 0 32px 0; /* Reduced gap per critique */
            font-weight: 400;
        }

        /* Unified Action Zone */
        .action-zone {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 24px;
            margin-top: 10px;
        }

        .stats-container {
            display: flex;
            gap: 24px;
            flex: 1;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center; /* Center sub-labels */
            text-align: center;
        }

        .stat-item h3 {
            font-family: var(--font-serif);
            font-size: 28px; /* Reduced visual weight */
            margin: 0;
            color: var(--text-charcoal);
        }

        .stat-item span {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-top: 4px;
        }

        .cta-button {
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-dark));
            color: #fff; /* White text for contrast on gold */
            border: none;
            padding: 16px 32px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
            white-space: nowrap;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(212, 175, 55, 0.5);
            filter: brightness(1.1);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(-50%); }
        }

        @keyframes mopSway {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(1deg); }
            100% { transform: rotate(0deg); }
        }

        .mop-assembly {
            transform-origin: 150px 100px;
            animation: mopSway 6s infinite ease-in-out;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .info-card {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                width: auto;
                margin: 20px;
                border-radius: 16px;
            }
            .container {
                height: auto;
                overflow-y: auto;
                display: flex;
                flex-direction: column-reverse;
            }
            .scene-background {
                height: 50vh;
            }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- VISUAL SCENE: Full Background SVG -->
    <div class="scene-background">
        <svg width="100%" height="100%" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1200 800">
            <defs>
                <!-- Wood Texture Filter -->
                <filter id="woodGrain" x="0" y="0" width="100%" height="100%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.05" numOctaves="3" result="noise" />
                    <feColorMatrix type="matrix" values="
                        0.2 0 0 0 0.2
                        0.1 0 0 0 0.1
                        0.05 0 0 0 0.05
                        0 0 0 0.15 0" in="noise" result="coloredNoise" />
                    <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply" />
                </filter>

                <!-- Liquid Gradient (Viscous, Golden) -->
                <radialGradient id="liquidGrad" cx="50%" cy="50%" r="50%" fx="60%" fy="60%">
                    <stop offset="0%" style="stop-color:#FFF9C4;stop-opacity:0.9" /> 
                    <stop offset="40%" style="stop-color:#D4AF37;stop-opacity:0.95" /> 
                    <stop offset="80%" style="stop-color:#8B6508;stop-opacity:0.9" /> 
                    <stop offset="100%" style="stop-color:#5D4037;stop-opacity:0.8" /> 
                </radialGradient>

                <!-- Mop Fiber Gradient -->
                <linearGradient id="fiberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#CFD8DC;stop-opacity:1" />
                </linearGradient>

                <!-- Wet Floor Reflection Blur -->
                <filter id="wetBlur" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur" />
                    <feOffset dx="0" dy="10" />
                </filter>
            </defs>

            <!-- 1. The Floor (Perspective Planks) -->
            <g filter="url(#woodGrain)">
                <!-- Base Wood Color -->
                <rect width="100%" height="100%" fill="#5D4037" />
                
                <!-- Planks (Simulated Perspective) -->
                <!-- Center point of vanishing lines roughly 600, 200 -->
                <path d="M0,100 L1200,100" stroke="#3E2723" stroke-width="3" fill="none" opacity="0.5"/>
                <path d="M0,250 L1200,250" stroke="#3E2723" stroke-width="3" fill="none" opacity="0.5"/>
                <path d="M0,450 L1200,450" stroke="#3E2723" stroke-width="3" fill="none" opacity="0.5"/>
                <path d="M0,700 L1200,700" stroke="#3E2723" stroke-width="3" fill="none" opacity="0.5"/>
                
                <!-- Vertical Seams (Slightly skewed for perspective) -->
                <path d="M200,0 L250,800" stroke="#3E2723" stroke-width="2" fill="none" opacity="0.3"/>
                <path d="M400,0 L450,800" stroke="#3E2723" stroke-width="2" fill="none" opacity="0.3"/>
                <path d="M600,0 L650,800" stroke="#3E2723" stroke-width="2" fill="none" opacity="0.3"/>
                <path d="M800,0 L850,800" stroke="#3E2723" stroke-width="2" fill="none" opacity="0.3"/>
                <path d="M1000,0 L1050,800" stroke="#3E2723" stroke-width="2" fill="none" opacity="0.3"/>
            </g>

            <!-- 2. The Spill (Center Right Visual Anchor) -->
            <g transform="translate(850, 600)">
                <!-- Reflection on floor (Blurred duplicate) -->
                <path d="M-50,-20 C-20,-80 80,-100 120,-40 C180,0 160,80 100,100 C40,120 -80,100 -100,40 C-120,-20 -80,-20 -50,-20 Z" 
                      fill="#D4AF37" opacity="0.4" filter="url(#wetBlur)" transform="scale(1.05, 0.8)" />

                <!-- Main Liquid Body -->
                <path d="M-50,-20 C-20,-80 80,-100 120,-40 C180,0 160,80 100,100 C40,120 -80,100 -100,40 C-120,-20 -80,-20 -50,-20 Z" 
                      fill="url(#liquidGrad)" />
                
                <!-- Liquid Highlights (Gloss) -->
                <ellipse cx="40" cy="-20" rx="40" ry="15" fill="#FFF" opacity="0.2" transform="rotate(-20 40 -20)" filter="blur(2px)"/>
                <path d="M20,-40 Q50,-50 80,-20" stroke="#FFF" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>

                <!-- Splatters -->
                <circle cx="140" cy="20" r="8" fill="#D4AF37" opacity="0.8" />
                <circle cx="160" cy="40" r="4" fill="#D4AF37" opacity="0.6" />
                <circle cx="-120" cy="20" r="6" fill="#8B6508" opacity="0.7" />
            </g>

            <!-- 3. The Mop (Active engagement) -->
            <g class="mop-assembly">
                <!-- Handle (Wood/Metal) -->
                <line x1="600" y1="500" x2="300" y2="-100" stroke="#8D6E63" stroke-width="12" stroke-linecap="round" />
                <line x1="600" y1="500" x2="300" y2="-100" stroke="#5D4037" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
                
                <!-- Joint -->
                <circle cx="600" cy="500" r="15" fill="#3E2723" />
                <circle cx="600" cy="500" r="8" fill="#111" />

                <!-- Mop Head (Wet, heavy fibers) -->
                <!-- Positioned to overlap the spill slightly -->
                <g transform="translate(600, 550) rotate(-10)">
                    <!-- Shadow -->
                    <ellipse cx="0" cy="50" rx="70" ry="20" fill="rgba(0,0,0,0.3)" filter="blur(5px)"/>
                    
                    <!-- Wet Fibers (Cluster) -->
                    <path d="M-40,-20 Q-50,40 -20,80" stroke="url(#fiberGrad)" stroke-width="14" fill="none" stroke-linecap="round"/>
                    <path d="M-20,-30 Q-30,50 -10,90" stroke="url(#fiberGrad)" stroke-width="14" fill="none" stroke-linecap="round"/>
                    <path d="M0,-35 Q-10,60 0,100" stroke="url(#fiberGrad)" stroke-width="14" fill="none" stroke-linecap="round"/>
                    <path d="M20,-30 Q30,50 10,90" stroke="url(#fiberGrad)" stroke-width="14" fill="none" stroke-linecap="round"/>
                    <path d="M40,-20 Q50,40 20,80" stroke="url(#fiberGrad)" stroke-width="14" fill="none" stroke-linecap="round"/>
                    
                    <!-- Wetness on Mop (Darker patches) -->
                    <path d="M-20,40 Q0,50 20,40" stroke="#8B6508" stroke-width="10" fill="none" opacity="0.4" stroke-linecap="round"/>
                    <circle cx="0" cy="60" r="15" fill="#D4AF37" opacity="0.5" filter="blur(3px)"/>
                </g>
            </g>

            <!-- Vignette for focus -->
            <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
                <stop offset="60%" style="stop-color:rgba(0,0,0,0)" />
                <stop offset="100%" style="stop-color:rgba(20,10,5,0.6)" />
            </radialGradient>
            <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none"/>
        </svg>
    </div>

    <!-- UI LAYER: Frosted Card -->
    <div class="info-card">
        <div class="brand">Spotless Co.</div>
        
        <h1>Clarity in<br>every corner.</h1>
        
        <p>Experience the difference of a deep clean. We restore the natural warmth of your home with eco-friendly solutions and meticulous care.</p>
        
        <!-- Unified Action Zone -->
        <div class="action-zone">
            <div class="stats-container">
                <div class="stat-item">
                    <h3>99%</h3>
                    <span>Efficiency</span>
                </div>
                <div class="stat-item">
                    <h3>100%</h3>
                    <span>Eco-Friendly</span>
                </div>
            </div>

            <button class="cta-button">Book a Clean</button>
        </div>
    </div>

</div>

</body>
</html>
