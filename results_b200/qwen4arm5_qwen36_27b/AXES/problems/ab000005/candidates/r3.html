<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless Co. | Premium Cleaning</title>
    <style>
        :root {
            /* Palette: Warm, Light, Premium */
            --floor-light: #E6D0B3;
            --floor-mid: #D4B895;
            --floor-dark: #C2A37F;
            --wood-grain: #A68A68;
            
            --text-primary: #4A3B32; /* Warm dark brown/grey */
            --text-secondary: #7D6E63;
            
            --brand-color: #5D4037;
            --accent-gold: #D4AF37;
            --accent-gold-hover: #B8962E;
            --accent-gold-shadow: rgba(184, 150, 46, 0.4);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--floor-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Main Container */
        .scene-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG Background Layer */
        .floor-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            /* Subtle zoom effect on load */
            animation: breathe 20s infinite alternate ease-in-out;
        }

        /* UI Layer: Floating Typography (No Card) */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to background if needed */
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 60px;
            box-sizing: border-box;
        }

        .brand-block {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            max-width: 400px;
            padding-top: 40px;
            padding-bottom: 40px;
        }

        /* Typography Styles */
        .brand-mark {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--brand-color);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .brand-mark::after {
            content: '';
            display: block;
            width: 40px;
            height: 2px;
            background-color: var(--brand-color);
            opacity: 0.5;
        }

        h1 {
            font-size: clamp(40px, 5vw, 64px);
            line-height: 1.1;
            color: var(--text-primary);
            margin: 0 0 24px 0;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin: 0 0 40px 0;
            max-width: 320px;
        }

        /* CTA Button */
        .cta-button {
            pointer-events: auto;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-hover));
            color: #2A1E16; /* Dark text for contrast */
            border: none;
            padding: 18px 40px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 25px var(--accent-gold-shadow);
            display: inline-block;
            text-decoration: none;
            text-align: center;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px var(--accent-gold-shadow);
            filter: brightness(1.1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .ui-layer {
                padding: 30px;
                justify-content: flex-start;
            }
            .brand-block {
                padding-top: 0;
            }
            .cta-button {
                width: 100%;
            }
        }

        /* Subtle Animations */
        @keyframes breathe {
            from { transform: scale(1); }
            to { transform: scale(1.02); }
        }
        
        @keyframes liquidPulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.02); opacity: 0.95; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        .liquid-group {
            transform-origin: center;
            animation: liquidPulse 6s infinite ease-in-out;
        }

    </style>
</head>
<body>

<div class="scene-container">
    
    <!-- VISUAL SCENE: The Floor, Spill, and Mop -->
    <svg class="floor-scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
        <defs>
            <!-- Wood Texture Filter (Lighter, Warmer) -->
            <filter id="woodTexture" x="0" y="0" width="100%" height="100%">
                <!-- Base Grain -->
                <feTurbulence type="fractalNoise" baseFrequency="0.005 0.02" numOctaves="3" result="noise" />
                <feColorMatrix type="matrix" values="
                    0.2 0 0 0 0.8
                    0.1 0 0 0 0.7
                    0.05 0 0 0 0.5
                    0 0 0 0.2 0" in="noise" result="coloredNoise" />
                <feComposite operator="in" in="coloredNoise" in2="SourceGraphic" result="texture" />
                <feBlend mode="multiply" in="texture" in2="SourceGraphic" />
            </filter>

            <!-- Vignette Gradient -->
            <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
                <stop offset="40%" style="stop-color:rgba(255,255,255,0)" />
                <stop offset="100%" style="stop-color:rgba(60,40,20,0.15)" />
            </radialGradient>

            <!-- Liquid Gradient (Viscous, Golden) -->
            <radialGradient id="liquidGrad" cx="50%" cy="50%" r="50%" fx="60%" fy="60%">
                <stop offset="0%" style="stop-color:#FFF9C4;stop-opacity:0.95" /> 
                <stop offset="30%" style="stop-color:#F4C430;stop-opacity:0.9" /> 
                <stop offset="70%" style="stop-color:#D4AF37;stop-opacity:0.85" /> 
                <stop offset="100%" style="stop-color:#8B6508;stop-opacity:0.7" /> 
            </radialGradient>

            <!-- Wet Floor Reflection Blur -->
            <filter id="wetBlur" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
                <feOffset dx="0" dy="5" />
            </filter>

            <!-- Mop Fiber Gradient (Textured) -->
            <linearGradient id="fiberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#F5F5F5;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#E0E0E0;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#BDBDBD;stop-opacity:1" />
            </linearGradient>
        </defs>

        <!-- 1. The Floor (Warm Amber/Tan) -->
        <g filter="url(#woodTexture)">
            <!-- Base Color -->
            <rect width="100%" height="100%" fill="#E6D0B3" />
            
            <!-- Perspective Planks -->
            <!-- Vanishing point approx 600, 100 -->
            <g stroke="#C2A37F" stroke-width="3" fill="none" opacity="0.6">
                <!-- Horizontal Seams -->
                <path d="M0,200 L1200,200" />
                <path d="M0,350 L1200,350" />
                <path d="M0,550 L1200,550" />
                <path d="M0,800 L1200,800" />
                
                <!-- Vertical Seams (Skewed) -->
                <path d="M-100,0 L100,800" stroke="#B09070" stroke-width="4" opacity="0.4"/>
                <path d="M300,0 L400,800" stroke="#B09070" stroke-width="4" opacity="0.4"/>
                <path d="M700,0 L850,800" stroke="#B09070" stroke-width="4" opacity="0.4"/>
                <path d="M1100,0 L1300,800" stroke="#B09070" stroke-width="4" opacity="0.4"/>
            </g>
        </g>

        <!-- 2. The Spill (Center Visual Anchor) -->
        <!-- Positioned centrally, slightly right -->
        <g transform="translate(650, 500)">
            <!-- Reflection on floor (Blurred duplicate) -->
            <path class="liquid-group" 
                  d="M-60,-30 C-20,-100 90,-120 140,-50 C200,0 180,90 110,110 C40,130 -90,110 -110,50 C-130,-10 -100,-30 -60,-30 Z" 
                  fill="#D4AF37" opacity="0.3" filter="url(#wetBlur)" transform="scale(1.05, 0.8)" />

            <!-- Main Liquid Body -->
            <path class="liquid-group"
                  d="M-60,-30 C-20,-100 90,-120 140,-50 C200,0 180,90 110,110 C40,130 -90,110 -110,50 C-130,-10 -100,-30 -60,-30 Z" 
                  fill="url(#liquidGrad)" />
            
            <!-- Liquid Highlights (Gloss) -->
            <ellipse cx="30" cy="-30" rx="50" ry="18" fill="#FFF" opacity="0.3" transform="rotate(-25 30 -30)" filter="blur(3px)"/>
            <path d="M10,-50 Q40,-60 70,-30" stroke="#FFF" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round"/>

            <!-- Splatters -->
            <circle cx="160" cy="30" r="10" fill="#D4AF37" opacity="0.8" />
            <circle cx="180" cy="50" r="5" fill="#D4AF37" opacity="0.6" />
            <circle cx="-140" cy="30" r="8" fill="#8B6508" opacity="0.7" />
        </g>

        <!-- 3. The Mop (Active engagement, overlapping spill) -->
        <!-- Positioned to actively clean the spill -->
        <g transform="translate(580, 450) rotate(15)">
            <!-- Handle (Wood/Metal) -->
            <line x1="0" y1="0" x2="-250" y2="-700" stroke="#8D6E63" stroke-width="14" stroke-linecap="round" />
            <!-- Handle Shadow/Detail -->
            <line x1="0" y1="0" x2="-250" y2="-700" stroke="#5D4037" stroke-width="4" stroke-linecap="round" opacity="0.3" transform="translate(3,0)"/>
            
            <!-- Joint -->
            <circle cx="0" cy="0" r="18" fill="#3E2723" />
            <circle cx="0" cy="0" r="10" fill="#111" />

            <!-- Mop Head (Wet, heavy fibers) -->
            <!-- Overlapping the spill coordinates -->
            <g transform="translate(0, 20)">
                <!-- Shadow -->
                <ellipse cx="10" cy="60" rx="80" ry="25" fill="rgba(0,0,0,0.2)" filter="blur(6px)"/>
                
                <!-- Wet Fibers (Cluster - Clumped look) -->
                <g stroke="url(#fiberGrad)" stroke-linecap="round" fill="none">
                    <!-- Outer fibers -->
                    <path d="M-30,-20 Q-60,40 -40,90" stroke-width="12" />
                    <path d="M-50,-10 Q-70,30 -50,80" stroke-width="10" />
                    <path d="M30,-20 Q60,40 40,90" stroke-width="12" />
                    <path d="M50,-10 Q70,30 50,80" stroke-width="10" />
                    
                    <!-- Inner fibers -->
                    <path d="M-10,-30 Q-20,50 -10,100" stroke-width="14" />
                    <path d="M10,-30 Q20,50 10,100" stroke-width="14" />
                    <path d="M0,-35 Q0,60 0,110" stroke-width="14" />
                </g>
                
                <!-- Wetness on Mop (Darker patches where it touches spill) -->
                <path d="M-30,40 Q0,60 30,40" stroke="#D4AF37" stroke-width="12" fill="none" opacity="0.5" stroke-linecap="round" filter="blur(2px)"/>
                <circle cx="0" cy="70" r="20" fill="#D4AF37" opacity="0.4" filter="blur(4px)"/>
            </g>
        </g>

        <!-- Vignette for depth -->
        <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none"/>
    </svg>

    <!-- UI LAYER: Floating Typography -->
    <div class="ui-layer">
        <div class="brand-block">
            <div>
                <div class="brand-mark">Spotless Co.</div>
                <h1>Clarity in<br>every corner.</h1>
                <p>Experience the difference of a deep clean. We restore the natural warmth of your home with eco-friendly solutions and meticulous care.</p>
                <a href="#" class="cta-button">Book a Clean</a>
            </div>
            
            <!-- Optional bottom stats could go here, but keeping it minimal per critique -->
        </div>
    </div>

</div>

</body>
</html>
