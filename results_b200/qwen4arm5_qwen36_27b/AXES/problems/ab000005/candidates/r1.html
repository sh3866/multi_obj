<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless - Premium Cleaning Service</title>
    <style>
        :root {
            --bg-color: #F4F1EA;
            --text-main: #1A1A1A;
            --text-muted: #4A4A4A;
            --accent-gold: #E3C100;
            --accent-gold-hover: #CFA600;
            --font-serif: "Playfair Display", "Didot", "Georgia", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        /* Layout Container */
        .container {
            display: grid;
            grid-template-columns: 400px 1fr;
            width: 100%;
            height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
            box-shadow: 0 0 80px rgba(0,0,0,0.05);
        }

        /* Left Panel: UI & Typography */
        .sidebar {
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-right: 1px solid rgba(0,0,0,0.05);
            z-index: 10;
            position: relative;
        }

        .brand {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 80px; /* Increased spacing */
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 10px;
            height: 10px;
            background: var(--accent-gold);
            border-radius: 50%;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 56px;
            line-height: 1.05;
            color: var(--text-main);
            margin: 0 0 24px 0; /* Tighter gap to body */
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 17px;
            line-height: 1.65;
            color: var(--text-muted); /* Darker for contrast */
            margin: 0 0 60px 0;
            max-width: 340px;
        }

        .stats {
            display: flex;
            gap: 50px;
            margin-bottom: 60px; /* Space before CTA */
            padding: 30px 0; /* Vertical breathing room */
            border-top: 1px solid rgba(0,0,0,0.05);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .stat-item h3 {
            font-family: var(--font-serif);
            font-size: 36px;
            margin: 0;
            color: var(--text-main);
        }

        .stat-item span {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            display: block;
            margin-top: 8px;
        }

        .cta-button {
            background-color: var(--accent-gold); /* Accent color */
            color: var(--text-main); /* Dark text */
            border: none;
            padding: 20px 40px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: fit-content;
            box-shadow: 0 4px 15px rgba(227, 193, 0, 0.3);
        }

        .cta-button:hover {
            background-color: var(--accent-gold-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(227, 193, 0, 0.4);
        }

        /* Right Panel: The Scene */
        .scene-container {
            position: relative;
            background-color: var(--bg-color);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        /* Animation Keyframes */
        @keyframes sway {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(1.5deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-50px) scale(1.2); opacity: 0; }
        }

        .mop-group {
            transform-origin: 450px 150px;
            animation: sway 6s infinite ease-in-out;
        }

        .bubble {
            animation: floatUp 4s infinite ease-in;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
            .sidebar { padding: 40px; }
            h1 { font-size: 42px; }
            .scene-container { height: 50vh; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="brand">Spotless Co.</div>
        
        <h1>Clarity in<br>every corner.</h1>
        
        <p>Experience the difference of a deep clean. We restore the natural warmth of your home with eco-friendly solutions and meticulous care.</p>
        
        <div class="stats">
            <div class="stat-item">
                <h3>99%</h3>
                <span>Efficiency</span>
            </div>
            <div class="stat-item">
                <h3>100%</h3>
                <span>Eco-Friendly</span>
            </div>
        </div>

        <button class="cta-button">Book a Clean</button>
    </div>

    <!-- Right Visual Scene -->
    <div class="scene-container">
        <!-- Main SVG Graphic -->
        <svg viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- 1. Floor Texture: Wood Grain Filter -->
                <filter id="woodTexture">
                    <!-- Noise -->
                    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.15" numOctaves="3" result="noise" />
                    <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.9 0 0 0  0 0.8 0 0 0  0 0 0 0.15 0" in="noise" result="coloredNoise" />
                    <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply" />
                </filter>

                <!-- 2. Liquid Realism: Gradient & Filters -->
                <radialGradient id="spillageGrad" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
                    <stop offset="0%" style="stop-color:#FFF2A8;stop-opacity:0.95" /> <!-- Pale yellow highlight -->
                    <stop offset="40%" style="stop-color:#E3C100;stop-opacity:0.9" /> <!-- Amber -->
                    <stop offset="80%" style="stop-color:#B8860B;stop-opacity:0.85" /> <!-- Darker edge -->
                    <stop offset="100%" style="stop-color:#8B6508;stop-opacity:0.6" /> <!-- Rim -->
                </radialGradient>

                <!-- 3. Mop Detailing: Fiber Gradient -->
                <linearGradient id="mopFiberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                    <stop offset="40%" style="stop-color:#E0E0E0;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#999999;stop-opacity:1" />
                </linearGradient>

                <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#555;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#333;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
                </linearGradient>

                <!-- Shadows -->
                <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
                    <feOffset dx="10" dy="15" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.25"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>
            </defs>

            <!-- Background: Base Color -->
            <rect width="100%" height="100%" fill="#E6E2D3" />
            
            <!-- Background: Wood Planks (Simulated with lines + texture filter) -->
            <g stroke="#D6D2C3" stroke-width="2" opacity="0.6">
                <line x1="0" y1="200" x2="800" y2="200" />
                <line x1="0" y1="400" x2="800" y2="400" />
                <line x1="0" y1="600" x2="800" y2="600" />
                <line x1="0" y1="800" x2="800" y2="800" />
            </g>
            <!-- Apply Texture Filter to everything above -->
            <rect width="100%" height="100%" fill="transparent" filter="url(#woodTexture)" style="mix-blend-mode: multiply;" />

            <!-- 1. Composition: Spill in Lower-Right Quadrant -->
            <g transform="translate(550, 550)" filter="url(#dropShadow)">
                <!-- Main Puddle (Organic Shape) -->
                <path d="M-40,-20 C-10,-60 60,-80 100,-40 C150,0 140,70 80,90 C20,110 -50,90 -70,40 C-90,-10 -70,-10 -40,-20 Z" 
                      fill="url(#spillageGrad)" />
                
                <!-- Specular Highlights (Wetness) -->
                <ellipse cx="40" cy="-10" rx="30" ry="12" fill="#FFF" opacity="0.3" transform="rotate(-15 40 -10)" filter="blur(2px)"/>
                <circle cx="20" cy="-20" r="3" fill="#FFF" opacity="0.6" />

                <!-- Splatter Drops -->
                <circle cx="120" cy="-30" r="6" fill="#E3C100" opacity="0.8" />
                <circle cx="135" cy="-15" r="3" fill="#E3C100" opacity="0.8" />
                <circle cx="-80" cy="60" r="5" fill="#B8860B" opacity="0.6" />
            </g>

            <!-- 1. Composition: Mop engaging with spill -->
            <g class="mop-group" filter="url(#dropShadow)">
                <!-- Handle -->
                <line x1="450" y1="150" x2="250" y2="-100" stroke="url(#handleGrad)" stroke-width="10" stroke-linecap="round" />
                
                <!-- Connection Joint -->
                <path d="M440,150 L460,150 L455,170 L445,170 Z" fill="#333" />
                <circle cx="450" cy="170" r="6" fill="#111" />

                <!-- 3. Mop Detailing: Fiber Volume -->
                <!-- Base Shadow -->
                <ellipse cx="450" cy="580" rx="60" ry="15" fill="rgba(0,0,0,0.2)" filter="blur(4px)"/>

                <!-- The Head (Cluster of fibers) -->
                <g transform="translate(450, 550)">
                    <!-- Back Layer (Darker) -->
                    <path d="M-40,-10 Q-50,40 -30,80" stroke="#888" stroke-width="8" fill="none" stroke-linecap="round" />
                    <path d="M40,-10 Q50,40 30,80" stroke="#888" stroke-width="8" fill="none" stroke-linecap="round" />
                    
                    <!-- Mid Layer -->
                    <path d="M-20,-15 Q-30,30 -10,90" stroke="#AAA" stroke-width="10" fill="none" stroke-linecap="round" />
                    <path d="M20,-15 Q30,30 10,90" stroke="#AAA" stroke-width="10" fill="none" stroke-linecap="round" />
                    <path d="M0,-20 Q-10,40 0,100" stroke="#CCC" stroke-width="12" fill="none" stroke-linecap="round" />
                    
                    <!-- Front Layer (Lightest/Highlight) -->
                    <path d="M-10,-10 Q-5,50 5,95" stroke="#FFF" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
                    <path d="M10,-10 Q15,50 15,95" stroke="#FFF" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
                </g>
            </g>

            <!-- 4. Organic Soap Suds -->
            <g fill="none" stroke="#FFF" stroke-width="1.5" opacity="0.7">
                <!-- Cluster near mop head -->
                <circle cx="400" cy="580" r="10" class="bubble" style="animation-delay: 0.2s;" />
                <circle cx="420" cy="600" r="6" class="bubble" style="animation-delay: 1.2s;" />
                <circle cx="490" cy="570" r="14" class="bubble" style="animation-delay: 0.8s;" />
                <circle cx="480" cy="590" r="8" class="bubble" style="animation-delay: 2.1s;" />
                
                <!-- Highlights on bubbles -->
                <circle cx="400" cy="580" r="2" fill="#FFF" class="bubble" style="animation-delay: 0.2s;" stroke="none"/>
                <circle cx="490" cy="570" r="3" fill="#FFF" class="bubble" style="animation-delay: 0.8s;" stroke="none"/>
            </g>

            <!-- Lighting Overlay (Warmth) -->
            <circle cx="700" cy="100" r="200" fill="#FFF" opacity="0.15" filter="blur(60px)" style="mix-blend-mode: overlay;" />
        </svg>
    </div>
</div>

</body>
</html>
