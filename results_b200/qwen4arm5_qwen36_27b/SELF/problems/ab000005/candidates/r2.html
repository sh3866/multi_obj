<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless — Premium Cleaning</title>
    <style>
        :root {
            --bg-cream: #F7F3ED;
            --text-primary: #1C1917;
            --text-secondary: #78716C;
            --text-tertiary: #A8A29E;
            --accent: #B45309;
            --accent-light: #D97706;
            --warm-gold: #F59E0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--bg-cream);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .layout {
            display: grid;
            grid-template-columns: 480px 1fr;
            width: 100%; height: 100vh;
        }

        .panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px 72px;
            background: linear-gradient(175deg, #FDFBF9 0%, #F5F0E8 100%);
            position: relative;
            z-index: 10;
        }

        .panel::after {
            content: '';
            position: absolute;
            right: 0; top: 10%; bottom: 10%;
            width: 1px;
            background: linear-gradient(to bottom, transparent, #D6CFC4 30%, #D6CFC4 70%, transparent);
        }

        .brand {
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 56px;
        }

        .brand-icon {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--accent);
            position: relative;
            box-shadow: 0 2px 12px rgba(180, 83, 9, 0.3);
        }

        .brand-icon::after {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.5);
        }

        .brand-name {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            color: var(--accent);
        }

        h1 {
            font-size: 62px;
            line-height: 1.02;
            color: var(--text-primary);
            font-weight: 800;
            letter-spacing: -2.5px;
            margin-bottom: 28px;
        }

        h1 .accent-word {
            font-style: italic;
            font-weight: 300;
            color: var(--accent);
            font-family: Georgia, "Times New Roman", serif;
        }

        .subtitle {
            font-size: 18px;
            line-height: 1.75;
            color: var(--text-secondary);
            max-width: 380px;
            margin-bottom: 56px;
            font-weight: 400;
        }

        .metrics {
            display: flex; gap: 64px;
            margin-bottom: auto;
            padding-top: 16px;
        }

        .metric-value {
            font-size: 42px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 8px;
        }

        .metric-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        .cta {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--text-primary);
            color: #fff;
            border: none;
            padding: 22px 48px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            width: fit-content;
            margin-top: 64px;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .cta::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(180, 83, 9, 0.35);
        }

        .cta:hover::before { opacity: 1; }

        .cta span { position: relative; z-index: 1; }

        .cta-arrow {
            position: relative; z-index: 1;
            transition: transform 0.3s ease;
        }

        .cta:hover .cta-arrow { transform: translateX(4px); }

        .scene {
            position: relative;
            overflow: hidden;
            background: #E8DDD0;
        }

        svg { width: 100%; height: 100%; display: block; }

        @keyframes sway {
            0%, 100% { transform: rotate(0deg); }
            30% { transform: rotate(0.3deg); }
            70% { transform: rotate(-0.2deg); }
        }

        @keyframes drip {
            0% { transform: translateY(0) scale(1); opacity: 0.7; }
            80% { opacity: 0.5; }
            100% { transform: translateY(18px) scale(0.3); opacity: 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); opacity: 0.4; }
            50% { transform: translateY(-6px); opacity: 0.7; }
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.15; }
            50% { opacity: 0.35; }
        }

        .mop-assembly {
            transform-origin: 720px 60px;
            animation: sway 8s infinite ease-in-out;
        }

        .drip-1 { animation: drip 3s infinite ease-in; }
        .drip-2 { animation: drip 3s infinite ease-in 1s; }
        .drip-3 { animation: drip 3s infinite ease-in 2s; }

        .float-1 { animation: float 5s infinite ease-in-out; }
        .float-2 { animation: float 5s infinite ease-in-out 1.5s; }
        .float-3 { animation: float 5s infinite ease-in-out 3s; }

        .shimmer-layer { animation: shimmer 4s infinite ease-in-out; }
    </style>
</head>
<body>
<div class="layout">
    <div class="panel">
        <div class="brand">
            <div class="brand-icon"></div>
            <span class="brand-name">Spotless Co.</span>
        </div>
        <h1>Clarity in<br>every <span class="accent-word">corner.</span></h1>
        <p class="subtitle">Experience the difference of a deep clean. We restore the natural warmth of your home with eco-friendly solutions and meticulous care.</p>
        <div class="metrics">
            <div>
                <div class="metric-value">99%</div>
                <div class="metric-label">Efficiency</div>
            </div>
            <div>
                <div class="metric-value">100%</div>
                <div class="metric-label">Eco-Friendly</div>
            </div>
        </div>
        <button class="cta">
            <span>Book a Clean</span>
            <svg class="cta-arrow" width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M4 9h10M10 5l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

    <div class="scene">
        <svg viewBox="0 0 1100 800" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Wood plank base with variation -->
                <linearGradient id="plankBase1" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#D4C4A8"/>
                    <stop offset="100%" stop-color="#C8B898"/>
                </linearGradient>
                <linearGradient id="plankBase2" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#DCCBBF"/>
                    <stop offset="100%" stop-color="#CEBCA4"/>
                </linearGradient>
                <linearGradient id="plankBase3" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#D0BFA4"/>
                    <stop offset="100%" stop-color="#C4AD8E"/>
                </linearGradient>

                <!-- Wood grain texture pattern -->
                <pattern id="grain1" x="0" y="0" width="1100" height="80" patternUnits="userSpaceOnUse">
                    <rect width="1100" height="80" fill="url(#plankBase1)"/>
                    <path d="M0,15 Q100,13 200,17 Q350,12 500,16 Q650,14 800,18 Q950,13 1100,15" fill="none" stroke="#C0A880" stroke-width="0.6" opacity="0.4"/>
                    <path d="M0,30 Q80,28 180,32 Q320,27 480,31 Q620,29 780,33 Q920,28 1100,30" fill="none" stroke="#C0A880" stroke-width="0.5" opacity="0.3"/>
                    <path d="M0,50 Q120,48 250,52 Q400,47 550,51 Q700,49 850,53 Q980,48 1100,50" fill="none" stroke="#C0A880" stroke-width="0.5" opacity="0.35"/>
                    <path d="M0,65 Q90,63 220,67 Q380,62 520,66 Q680,64 820,68 Q960,63 1100,65" fill="none" stroke="#C0A880" stroke-width="0.4" opacity="0.25"/>
                    <!-- Knot -->
                    <ellipse cx="750" cy="40" rx="12" ry="8" fill="none" stroke="#B89870" stroke-width="0.8" opacity="0.3"/>
                    <ellipse cx="750" cy="40" rx="6" ry="4" fill="none" stroke="#B89870" stroke-width="0.5" opacity="0.25"/>
                </pattern>

                <pattern id="grain2" x="0" y="0" width="1100" height="80" patternUnits="userSpaceOnUse">
                    <rect width="1100" height="80" fill="url(#plankBase2)"/>
                    <path d="M0,20 Q150,18 300,22 Q500,17 700,21 Q900,19 1100,20" fill="none" stroke="#C8B898" stroke-width="0.6" opacity="0.35"/>
                    <path d="M0,45 Q100,43 250,47 Q420,42 600,46 Q780,43 950,47 1100,45" fill="none" stroke="#C8B898" stroke-width="0.5" opacity="0.3"/>
                    <path d="M0,60 Q200,58 380,62 Q550,57 750,61 Q920,58 1100,60" fill="none" stroke="#C8B898" stroke-width="0.4" opacity="0.2"/>
                    <ellipse cx="300" cy="25" rx="8" ry="5" fill="none" stroke="#C0A080" stroke-width="0.6" opacity="0.2"/>
                </pattern>

                <pattern id="grain3" x="0" y="0" width="1100" height="80" patternUnits="userSpaceOnUse">
                    <rect width="1100" height="80" fill="url(#plankBase3)"/>
                    <path d="M0,10 Q180,12 350,8 Q550,13 750,9 Q900,12 1100,10" fill="none" stroke="#B8A080" stroke-width="0.5" opacity="0.35"/>
                    <path d="M0,35 Q120,33 280,37 Q450,32 650,36 Q820,33 1000,37 1100,35" fill="none" stroke="#B8A080" stroke-width="0.5" opacity="0.3"/>
                    <path d="M0,55 Q160,53 320,57 Q500,52 700,56 Q880,53 1100,55" fill="none" stroke="#B8A080" stroke-width="0.4" opacity="0.25"/>
                    <ellipse cx="520" cy="55" rx="10" ry="6" fill="none" stroke="#B09070" stroke-width="0.7" opacity="0.25"/>
                    <ellipse cx="520" cy="55" rx="5" ry="3" fill="none" stroke="#B09070" stroke-width="0.4" opacity="0.2"/>
                </pattern>

                <!-- Spill gradients - coffee/tea spill -->
                <radialGradient id="spillMain" cx="0.4" cy="0.45" r="0.6">
                    <stop offset="0%" stop-color="#8B5E3C" stop-opacity="0.9"/>
                    <stop offset="30%" stop-color="#7A4F30" stop-opacity="0.85"/>
                    <stop offset="60%" stop-color="#6B4028" stop-opacity="0.75"/>
                    <stop offset="100%" stop-color="#5A3020" stop-opacity="0.4"/>
                </radialGradient>

                <radialGradient id="spillHighlight" cx="0.3" cy="0.3" r="0.5">
                    <stop offset="0%" stop-color="#C4956A" stop-opacity="0.5"/>
                    <stop offset="100%" stop-color="#C4956A" stop-opacity="0"/>
                </radialGradient>

                <radialGradient id="spillEdge" cx="0.5" cy="0.5" r="0.5">
                    <stop offset="70%" stop-color="#5A3020" stop-opacity="0"/>
                    <stop offset="100%" stop-color="#5A3020" stop-opacity="0.25"/>
                </radialGradient>

                <radialGradient id="spillShadow" cx="0.4" cy="0.4" r="0.6">
                    <stop offset="0%" stop-color="#3D1F10" stop-opacity="0.3"/>
                    <stop offset="100%" stop-color="#3D1F10" stop-opacity="0"/>
                </radialGradient>

                <!-- Wet floor sheen -->
                <radialGradient id="wetSheen" cx="0.5" cy="0.5" r="0.5">
                    <stop offset="0%" stop-color="#F0E8D8" stop-opacity="0.2"/>
                    <stop offset="100%" stop-color="#F0E8D8" stop-opacity="0"/>
                </radialGradient>

                <!-- Mop handle -->
                <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#2D2D2D"/>
                    <stop offset="25%" stop-color="#4A4A4A"/>
                    <stop offset="50%" stop-color="#3D3D3D"/>
                    <stop offset="100%" stop-color="#252525"/>
                </linearGradient>

                <!-- Metal parts -->
                <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#A0A0A0"/>
                    <stop offset="40%" stop-color="#888"/>
                    <stop offset="100%" stop-color="#6A6A6A"/>
                </linearGradient>

                <linearGradient id="metalPlate" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#999"/>
                    <stop offset="100%" stop-color="#707070"/>
                </linearGradient>

                <!-- Mop strands -->
                <linearGradient id="strandWet" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#7EB8D4"/>
                    <stop offset="50%" stop-color="#5EA0C0"/>
                    <stop offset="100%" stop-color="#4A88A8"/>
                </linearGradient>

                <linearGradient id="strandLight" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#96C8E0"/>
                    <stop offset="100%" stop-color="#6EB0CC"/>
                </linearGradient>

                <!-- Light effects -->
                <radialGradient id="warmLight" cx="0.7" cy="0.1" r="0.8">
                    <stop offset="0%" stop-color="#FFF8E8" stop-opacity="0.25"/>
                    <stop offset="50%" stop-color="#FFF0D0" stop-opacity="0.08"/>
                    <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
                </radialGradient>

                <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
                    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
                    <stop offset="100%" stop-color="#000" stop-opacity="0.08"/>
                </radialGradient>

                <!-- Shadow filters -->
                <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="180%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
                    <feOffset dx="6" dy="12"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.2"/>
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <filter id="softBlur">
                    <feGaussianBlur stdDeviation="3"/>
                </filter>

                <filter id="heavyBlur">
                    <feGaussianBlur stdDeviation="8"/>
                </filter>

                <filter id="spillShadowFilter" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
                    <feOffset dx="4" dy="8"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.35"/>
                    </feComponentTransfer>
                </filter>

                <filter id="wetReflection">
                    <feGaussianBlur stdDeviation="1.5"/>
                </filter>

                <!-- Clip path -->
                <clipPath id="sceneClip">
                    <rect x="0" y="0" width="1100" height="800"/>
                </clipPath>
            </defs>

            <!-- ===== FLOOR ===== -->
            <g clip-path="url(#sceneClip)">
                <!-- Plank rows -->
                <rect x="0" y="0" width="1100" height="80" fill="url(#grain1)"/>
                <line x1="0" y1="80" x2="1100" y2="80" stroke="#B8A080" stroke-width="1.2" opacity="0.5"/>

                <rect x="0" y="80" width="1100" height="80" fill="url(#grain2)"/>
                <line x1="0" y1="160" x2="1100" y2="160" stroke="#B8A080" stroke-width="1.2" opacity="0.5"/>

                <rect x="0" y="160" width="1100" height="80" fill="url(#grain3)"/>
                <line x1="0" y1="240" x2="1100" y2="240" stroke="#B8A080" stroke-width="1.2" opacity="0.5"/>

                <rect x="0" y="240" width="1100" height="80" fill="url(#grain1)"/>
                <line x1="0" y1="320" x2="1100" y2="320" stroke="#B8A080" stroke-width="1.2" opacity="0.5"/>

                <rect x="0" y="320" width="1100" height="80" fill="url(#grain2)"/>
                <line x1="0" y1="400" x2="1100" y2="400" stroke="#B8A080" stroke-width="1.2" opacity="0.5"/>

                <rect x="0" y="400" width="1100" height="80" fill="url(#grain3)"/>
                <line x1="0" y1="480" x2="1100" y2="480" stroke="#B8A080" stroke-width="1.2" opacity="0.5"/>

                <rect x="0" y="480" width="1100" height="80" fill="url(#grain1)"/>
                <line x1="0" y1="560" x2="1100" y2="560" stroke="#B8A080" stroke-width="1.2" opacity="0.5"/>

                <rect x="0" y="560" width="1100" height="80" fill="url(#grain2)"/>
                <line x1="0" y1="640" x2="1100" y2="640" stroke="#B8A080" stroke-width="1.2" opacity="0.5"/>

                <rect x="0" y="640" width="1100" height="80" fill="url(#grain3)"/>
                <line x1="0" y1="720" x2="1100" y2="720" stroke="#B8A080" stroke-width="1.2" opacity="0.5"/>

                <rect x="0" y="720" width="1100" height="80" fill="url(#grain1)"/>

                <!-- Vertical plank joints (staggered) -->
                <g stroke="#B09878" stroke-width="0.8" opacity="0.35">
                    <line x1="280" y1="0" x2="280" y2="80"/>
                    <line x1="620" y1="80" x2="620" y2="160"/>
                    <line x1="450" y1="160" x2="450" y2="240"/>
                    <line x1="800" y1="240" x2="800" y2="320"/>
                    <line x1="180" y1="320" x2="180" y2="400"/>
                    <line x1="550" y1="400" x2="550" y2="480"/>
                    <line x1="900" y1="480" x2="900" y2="560"/>
                    <line x1="350" y1="560" x2="350" y2="640"/>
                    <line x1="720" y1="640" x2="720" y2="720"/>
                    <line x1="480" y1="720" x2="480" y2="800"/>
                </g>

                <!-- Warm light overlay -->
                <rect width="1100" height="800" fill="url(#warmLight)"/>
            </g>

            <!-- ===== SPILLED MESS ===== -->
            <g transform="translate(580, 520)">
                <!-- Shadow -->
                <path d="M-5,-15 C-55,-28 -120,-12 -145,18 C-165,48 -150,88 -105,105 C-60,122 15,118 65,98 C115,78 135,38 115,-2 C95,-42 45,-52 0,-38 C-28,-48 -48,-32 -5,-15 Z"
                      fill="url(#spillShadow)" filter="url(#spillShadowFilter)" transform="translate(6, 10)"/>

                <!-- Main spill body - organic irregular shape -->
                <path d="M-5,-15 C-55,-28 -120,-12 -145,18 C-165,48 -150,88 -105,105 C-60,122 15,118 65,98 C115,78 135,38 115,-2 C95,-42 45,-52 0,-38 C-28,-48 -48,-32 -5,-15 Z"
                      fill="url(#spillMain)"/>

                <!-- Inner darker core -->
                <path d="M0,-10 C-40,-20 -90,-8 -108,14 C-125,36 -115,68 -82,82 C-48,95 5,92 42,78 C78,64 92,34 78,2 C65,-28 32,-35 0,-26 C-18,-32 -32,-22 0,-10 Z"
                      fill="url(#spillEdge)"/>

                <!-- Specular highlight -->
                <ellipse cx="-25" cy="-8" rx="45" ry="16" fill="url(#spillHighlight)" transform="rotate(-12 -25 -8)"/>

                <!-- Secondary highlight -->
                <ellipse cx="25" cy="35" rx="18" ry="7" fill="#C4956A" opacity="0.15" transform="rotate(-8 25 35)"/>

                <!-- Wet edge ring -->
                <path d="M-5,-15 C-55,-28 -120,-12 -145,18 C-165,48 -150,88 -105,105 C-60,122 15,118 65,98 C115,78 135,38 115,-2 C95,-42 45,-52 0,-38 C-28,-48 -48,-32 -5,-15 Z"
                      fill="none" stroke="#4A2515" stroke-width="1.5" opacity="0.3"/>

                <!-- Splatter drops -->
                <g>
                    <circle cx="-160" cy="5" r="3.5" fill="#7A4F30" opacity="0.7"/>
                    <circle cx="-175" cy="15" r="2" fill="#7A4F30" opacity="0.6"/>
                    <circle cx="-168" cy="-10" r="2.5" fill="#7A4F30" opacity="0.55"/>
                    <circle cx="125" cy="50" r="3" fill="#7A4F30" opacity="0.65"/>
                    <circle cx="135" cy="42" r="1.8" fill="#7A4F30" opacity="0.5"/>
                    <circle cx="140" cy="58" r="2.2" fill="#7A4F30" opacity="0.55"/>
                    <circle cx="-155" cy="60" r="2" fill="#7A4F30" opacity="0.5"/>
                    <circle cx="-140" cy="75" r="1.5" fill="#7A4F30" opacity="0.4"/>
                    <circle cx="100" cy="-25" r="2" fill="#7A4F30" opacity="0.5"/>
                    <circle cx="110" cy="-32" r="1.5" fill="#7A4F30" opacity="0.4"/>
                    <circle cx="-100" cy="-35" r="1.8" fill="#7A4F30" opacity="0.45"/>
                    <circle cx="150" cy="20" r="1.5" fill="#7A4F30" opacity="0.4"/>
                </g>

                <!-- Tiny droplets -->
                <g fill="#7A4F30" opacity="0.3">
                    <circle cx="-130" cy="80" r="1"/>
                    <circle cx="-120" cy="90" r="0.8"/>
                    <circle cx="80" cy="100" r="1"/>
                    <circle cx="90" cy="95" r="0.7"/>
                    <circle cx="-170" cy="30" r="0.8"/>
                    <circle cx="145" cy="35" r="0.9"/>
                </g>
            </g>

            <!-- Wet area around spill -->
            <ellipse cx="580" cy="520" rx="200" ry="140" fill="url(#wetSheen)" filter="url(#wetReflection)"/>

            <!-- ===== CLEANED SWIPE TRAIL ===== -->
            <g opacity="0.18">
                <path d="M380,380 Q420,400 460,420 Q500,440 540,460 Q580,480 620,500 Q560,490 520,470 Q480,450 440,430 Q400,410 380,390 Z"
                      fill="#F0E8D8"/>
            </g>

            <!-- ===== THE MOP ===== -->
            <g class="mop-assembly" filter="url(#dropShadow)">
                <!-- Handle -->
                <line x1="720" y1="60" x2="480" y2="380" stroke="url(#handleGrad)" stroke-width="16" stroke-linecap="round"/>
                <!-- Handle specular -->
                <line x1="717" y1="62" x2="477" y2="378" stroke="#5A5A5A" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
                <!-- Handle edge shadow -->
                <line x1="723" y1="58" x2="483" y2="378" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

                <!-- Top cap -->
                <ellipse cx="720" cy="56" rx="12" ry="7" fill="#333"/>
                <ellipse cx="720" cy="54" rx="9" ry="5" fill="#444" opacity="0.6"/>

                <!-- Metal connector -->
                <g transform="translate(470, 390)">
                    <rect x="-22" y="-14" width="44" height="28" rx="5" fill="url(#metalGrad)"/>
                    <rect x="-20" y="-12" width="40" height="10" rx="4" fill="#AAA" opacity="0.25"/>
                    <circle cx="0" cy="0" r="6" fill="#555"/>
                    <circle cx="0" cy="0" r="4" fill="#444"/>
                    <!-- Wing nuts -->
                    <rect x="-28" y="-5" width="8" height="10" rx="3" fill="#777"/>
