<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotless — Premium Cleaning</title>
<style>
  :root {
    --bg: #1A1612;
    --surface: #2A2420;
    --text: #F5F0E8;
    --text-muted: #A89E92;
    --accent: #D4883A;
    --accent-glow: #E8A858;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body, html {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    position: relative;
    width: 100%; height: 100vh;
    overflow: hidden;
  }

  .scene-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .scene-bg svg {
    width: 100%; height: 100%;
    display: block;
  }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    pointer-events: none;
  }

  .content {
    pointer-events: auto;
    max-width: 520px;
    padding: 72px 64px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }

  .content::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(26,22,18,0.95) 0%, rgba(26,22,18,0.7) 60%, transparent 100%);
    z-index: -1;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 64px;
  }

  .brand-mark {
    width: 36px; height: 36px;
    position: relative;
  }

  .brand-name {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    font-size: 56px;
    line-height: 1.05;
    color: var(--text);
    font-weight: 700;
    letter-spacing: -2px;
    margin-bottom: 24px;
  }

  h1 em {
    font-style: italic;
    font-weight: 300;
    color: var(--accent-glow);
    font-family: Georgia, "Times New Roman", serif;
  }

  .subtitle {
    font-size: 16px;
    line-height: 1.8;
    color: var(--text-muted);
    max-width: 360px;
    margin-bottom: 48px;
    font-weight: 400;
  }

  .stats {
    display: flex;
    gap: 48px;
    margin-bottom: 56px;
    padding-top: 8px;
  }

  .stat-value {
    font-size: 38px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -1.5px;
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    opacity: 0.7;
  }

  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: var(--accent);
    color: #1A1612;
    border: none;
    padding: 20px 44px;
    font-size: 14px;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    width: fit-content;
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;
  }

  .cta-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 48px rgba(212,136,58,0.35);
    background: var(--accent-glow);
  }

  .cta-btn .arrow {
    transition: transform 0.3s ease;
  }

  .cta-btn:hover .arrow {
    transform: translateX(4px);
  }

  .tagline {
    position: absolute;
    bottom: 72px;
    right: 64px;
    z-index: 3;
    pointer-events: none;
    text-align: right;
  }

  .tagline-text {
    font-size: 13px;
    color: rgba(245,240,232,0.4);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
  }

  @keyframes floatBubble {
    0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
    25% { transform: translateY(-12px) translateX(3px); opacity: 0.5; }
    50% { transform: translateY(-6px) translateX(-2px); opacity: 0.35; }
    75% { transform: translateY(-18px) translateX(1px); opacity: 0.45; }
  }

  @keyframes gentleSway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(0.4deg); }
  }

  @keyframes shimmer {
    0%, 100% { opacity: 0.03; }
    50% { opacity: 0.08; }
  }

  .bubble-1 { animation: floatBubble 6s infinite ease-in-out; }
  .bubble-2 { animation: floatBubble 7s infinite ease-in-out 1s; }
  .bubble-3 { animation: floatBubble 5s infinite ease-in-out 2s; }
  .bubble-4 { animation: floatBubble 8s infinite ease-in-out 0.5s; }
  .bubble-5 { animation: floatBubble 6.5s infinite ease-in-out 3s; }

  .mop-sway {
    transform-origin: 620px 80px;
    animation: gentleSway 10s infinite ease-in-out;
  }

  .light-shimmer {
    animation: shimmer 5s infinite ease-in-out;
  }
</style>
</head>
<body>
<div class="page">
  <div class="scene-bg">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- Floor base colors - warm hardwood -->
        <linearGradient id="floorBase" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8B7355"/>
          <stop offset="100%" stop-color="#6B5540"/>
        </linearGradient>

        <!-- Plank variations -->
        <linearGradient id="plankA" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9A8468"/>
          <stop offset="100%" stop-color="#8A7458"/>
        </linearGradient>
        <linearGradient id="plankB" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#A08A6E"/>
          <stop offset="100%" stop-color="#907A5E"/>
        </linearGradient>
        <linearGradient id="plankC" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8E785C"/>
          <stop offset="100%" stop-color="#7E684C"/>
        </linearGradient>

        <!-- Perspective floor gradient -->
        <linearGradient id="floorPerspective" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#C8B898"/>
          <stop offset="30%" stop-color="#A89878"/>
          <stop offset="100%" stop-color="#6B5540"/>
        </linearGradient>

        <!-- Wood grain patterns -->
        <pattern id="woodGrainA" x="0" y="0" width="1600" height="120" patternUnits="userSpaceOnUse">
          <rect width="1600" height="120" fill="url(#plankA)"/>
          <path d="M0,20 Q200,18 400,22 Q600,17 800,21 Q1000,19 1200,23 Q1400,18 1600,20" fill="none" stroke="#7A6448" stroke-width="0.8" opacity="0.3"/>
          <path d="M0,45 Q180,43 380,47 Q580,42 780,46 Q980,43 1180,47 Q1380,42 1600,45" fill="none" stroke="#7A6448" stroke-width="0.6" opacity="0.25"/>
          <path d="M0,70 Q220,68 420,72 Q620,67 820,71 Q1020,69 1220,73 Q1420,68 1600,70" fill="none" stroke="#7A6448" stroke-width="0.7" opacity="0.2"/>
          <path d="M0,95 Q160,93 360,97 Q560,92 760,96 Q960,93 1160,97 Q1360,92 1600,95" fill="none" stroke="#7A6448" stroke-width="0.5" opacity="0.15"/>
          <ellipse cx="900" cy="55" rx="18" ry="10" fill="none" stroke="#6A5438" stroke-width="0.8" opacity="0.2"/>
          <ellipse cx="900" cy="55" rx="9" ry="5" fill="none" stroke="#6A5438" stroke-width="0.5" opacity="0.15"/>
        </pattern>

        <pattern id="woodGrainB" x="0" y="0" width="1600" height="120" patternUnits="userSpaceOnUse">
          <rect width="1600" height="120" fill="url(#plankB)"/>
          <path d="M0,15 Q250,17 450,13 Q650,18 850,14 Q1050,17 1250,13 Q1450,16 1600,15" fill="none" stroke="#8A7458" stroke-width="0.7" opacity="0.28"/>
          <path d="M0,40 Q200,38 400,42 Q600,37 800,41 Q1000,38 1200,42 Q1400,37 1600,40" fill="none" stroke="#8A7458" stroke-width="0.5" opacity="0.22"/>
          <path d="M0,65 Q180,67 380,63 Q580,68 780,64 Q980,67 1180,63 Q1380,66 1600,65" fill="none" stroke="#8A7458" stroke-width="0.6" opacity="0.18"/>
          <path d="M0,90 Q230,88 430,92 Q630,87 830,91 Q1030,88 1230,92 Q1430,87 1600,90" fill="none" stroke="#8A7458" stroke-width="0.5" opacity="0.14"/>
          <ellipse cx="500" cy="35" rx="14" ry="8" fill="none" stroke="#7A6448" stroke-width="0.7" opacity="0.18"/>
        </pattern>

        <pattern id="woodGrainC" x="0" y="0" width="1600" height="120" patternUnits="userSpaceOnUse">
          <rect width="1600" height="120" fill="url(#plankC)"/>
          <path d="M0,25 Q190,23 390,27 Q590,22 790,26 Q990,23 1190,27 Q1390,22 1600,25" fill="none" stroke="#6E5840" stroke-width="0.7" opacity="0.3"/>
          <path d="M0,50 Q210,48 410,52 Q610,47 810,51 Q1010,48 1210,52 Q1410,47 1600,50" fill="none" stroke="#6E5840" stroke-width="0.6" opacity="0.24"/>
          <path d="M0,75 Q170,77 370,73 Q570,78 770,74 Q970,77 1170,73 Q1370,76 1600,75" fill="none" stroke="#6E5840" stroke-width="0.5" opacity="0.19"/>
          <path d="M0,100 Q240,98 440,102 Q640,97 840,101 Q1040,98 1240,102 Q1440,97 1600,100" fill="none" stroke="#6E5840" stroke-width="0.5" opacity="0.13"/>
          <ellipse cx="1100" cy="70" rx="16" ry="9" fill="none" stroke="#5E4830" stroke-width="0.8" opacity="0.2"/>
          <ellipse cx="1100" cy="70" rx="8" ry="4" fill="none" stroke="#5E4830" stroke-width="0.5" opacity="0.15"/>
        </pattern>

        <!-- Spill gradients -->
        <radialGradient id="spillBody" cx="0.45" cy="0.4" r="0.6">
          <stop offset="0%" stop-color="#5C3A1E" stop-opacity="0.95"/>
          <stop offset="25%" stop-color="#4A2E14" stop-opacity="0.9"/>
          <stop offset="55%" stop-color="#3D2410" stop-opacity="0.8"/>
          <stop offset="80%" stop-color="#321E0C" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#2A1808" stop-opacity="0.15"/>
        </radialGradient>

        <radialGradient id="spillHighlight" cx="0.3" cy="0.35" r="0.45">
          <stop offset="0%" stop-color="#A07850" stop-opacity="0.4"/>
          <stop offset="50%" stop-color="#8A6840" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#8A6840" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="spillWetEdge" cx="0.5" cy="0.5" r="0.5">
          <stop offset="60%" stop-color="#2A1808" stop-opacity="0"/>
          <stop offset="85%" stop-color="#2A1808" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#2A1808" stop-opacity="0.25"/>
        </radialGradient>

        <!-- Wet floor reflection -->
        <radialGradient id="wetReflection" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0%" stop-color="#F0E8D8" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#F0E8D8" stop-opacity="0"/>
        </radialGradient>

        <!-- Window light -->
        <linearGradient id="windowLight" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFF8E8" stop-opacity="0.2"/>
          <stop offset="40%" stop-color="#FFF0D0" stop-opacity="0.06"/>
          <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="lightBeam" x1="1" y1="0" x2="0.3" y2="1">
          <stop offset="0%" stop-color="#FFF8E8" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#FFF8E8" stop-opacity="0"/>
        </linearGradient>

        <!-- Mop handle -->
        <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#1A1A1A"/>
          <stop offset="30%" stop-color="#3A3A3A"/>
          <stop offset="50%" stop-color="#2E2E2E"/>
          <stop offset="100%" stop-color="#151515"/>
        </linearGradient>

        <!-- Metal connector -->
        <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#B8B8B8"/>
          <stop offset="30%" stop-color="#989898"/>
          <stop offset="70%" stop-color="#808080"/>
          <stop offset="100%" stop-color="#686868"/>
        </linearGradient>

        <linearGradient id="metalPlate" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#A8A8A8"/>
          <stop offset="100%" stop-color="#787878"/>
        </linearGradient>

        <!-- Mop strands -->
        <linearGradient id="strandWet" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6BAAD4"/>
          <stop offset="40%" stop-color="#5A98C4"/>
          <stop offset="100%" stop-color="#4A88B4"/>
        </linearGradient>

        <linearGradient id="strandDry" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8AC0E0"/>
          <stop offset="100%" stop-color="#6AA8C8"/>
        </linearGradient>

        <!-- Cleaned path highlight -->
        <linearGradient id="cleanPath" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#F0E8D8" stop-opacity="0"/>
          <stop offset="30%" stop-color="#F0E8D8" stop-opacity="0.08"/>
          <stop offset="70%" stop-color="#F0E8D8" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#F0E8D8" stop-opacity="0"/>
        </linearGradient>

        <!-- Vignette -->
        <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
          <stop offset="50%" stop-color="#000" stop-opacity="0"/>
          <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
        </radialGradient>

        <!-- Shadow filters -->
        <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="25"/>
          <feOffset dx="8" dy="15"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.25"/>
          </feComponentTransfer>
          <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <filter id="spillShadow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
          <feOffset dx="5" dy="8"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.3"/>
          </feComponentTransfer>
        </filter>

        <filter id="strandBlur">
          <feGaussianBlur stdDeviation="0.5"/>
        </filter>

        <filter id="wetGlow">
          <feGaussianBlur stdDeviation="2"/>
        </filter>

        <!-- Clip -->
        <clipPath id="sceneClip">
          <rect x="0" y="0" width="1600" height="900"/>
        </clipPath>
      </defs>

      <g clip-path="url(#sceneClip)">
        <!-- ===== PERSPECTIVE FLOOR ===== -->
        <!-- Base floor -->
        <rect width="1600" height="900" fill="url(#floorBase)"/>

        <!-- Floor planks with perspective (horizontal rows getting narrower toward top) -->
        <!-- Row 1 - closest -->
        <rect x="0" y="780" width="1600" height="120" fill="url(#woodGrainA)"/>
        <line x1="0" y1="780" x2="1600" y2="780" stroke="#5A4430" stroke-width="1.5" opacity="0.4"/>

        <!-- Row 2 -->
        <rect x="0" y="660" width="1600" height="120" fill="url(#woodGrainB)"/>
        <line x1="0" y1="660" x2="1600" y2="660" stroke="#5A4430" stroke-width="1.2" opacity="0.35"/>

        <!-- Row 3 -->
        <rect x="0" y="540" width="1600" height="120" fill="url(#woodGrainC)"/>
        <line x1="0" y1="540" x2="1600" y2="540" stroke="#5A4430" stroke-width="1" opacity="0.3"/>

        <!-- Row 4 -->
        <rect x="0" y="420" width="1600" height="120" fill="url(#woodGrainA)"/>
        <line x1="0" y1="420" x2="1600" y2="420" stroke="#5A4430" stroke-width="0.8" opacity="0.25"/>

        <!-- Row 5 -->
        <rect x="0" y="300" width="1600" height="120" fill="url(#woodGrainB)"/>
        <line x1="0" y1="300" x2="1600" y2="300" stroke="#5A4430" stroke-width="0.7" opacity="0.2"/>

        <!-- Row 6 -->
        <rect x="0" y="180" width="1600" height="120" fill="url(#woodGrainC)"/>
        <line x1="0" y1="180" x2="1600" y2="180" stroke="#5A4430" stroke-width="0.6" opacity="0.18"/>

        <!-- Row 7 -->
        <rect x="0" y="60" width="1600" height="120" fill="url(#woodGrainA)"/>
        <line x1="0" y1="60" x2="1600" y2="60" stroke="#5A4430" stroke-width="0.5" opacity="0.15"/>

        <!-- Row 8 - farthest -->
        <rect x="0" y="0" width="1600" height="60" fill="url(#woodGrainB)"/>

        <!-- Vertical plank seams (staggered) -->
        <g stroke="#5A4430" opacity="0.2">
          <line x1="320" y1="780" x2="320" y2="900" stroke-width="1"/>
          <line x1="720" y1="780" x2="720" y2="900" stroke-width="1"/>
          <line x1="1120" y1="780" x2="1120" y2="900" stroke-width="1"/>

          <line x1="480" y1="660" x2="480" y2="780" stroke-width="0.8"/>
          <line x1="880" y1="660" x2="880" y2="780" stroke-width="0.8"/>
          <line x1="1280" y1="660" x2="1280" y2="780" stroke-width="0.8"/>

          <line x1="200" y1="540" x2="200" y2="660" stroke-width="0.7"/>
          <line x1="600" y1="540" x2="600" y2="660" stroke-width="0.7"/>
          <line x1="1000" y1="540" x2="1000" y2="660" stroke-width="0.7"/>
          <line x1="1400" y1="540" x2="1400" y2="660" stroke-width="0.7"/>

          <line x1="400" y1="420" x2="400" y2="540" stroke-width="0.6"/>
          <line x1="800" y1="420" x2="800" y2="540" stroke-width="0.6"/>
          <line x1="1200" y1="420" x2="1200" y2="540" stroke-width="0.6"/>

          <line x1="550" y1="300" x2="550" y2="420" stroke-width="0.5"/>
          <line x1="950" y1="300" x2="950" y2="420" stroke-width="0.5"/>
          <line x1="1350" y1="300" x2="1350" y2="420" stroke-width="0.5"/>

          <line x1="300" y1="180" x2="300" y2="300" stroke-width="0.4"/>
          <line x1="700" y1="180" x2="700" y2="300" stroke-width="0.4"/>
          <line x1="1100" y1="180" x2="1100" y2="300" stroke-width="0.4"/>

          <line x1="450" y1="60" x2="450" y2="180" stroke-width="0.3"/>
          <line x1="850" y1="60" x2="850" y2="180" stroke-width="0.3"/>
          <line x1="1250" y1="60" x2="1250" y2="180" stroke-width="0.3"/>
        </g>

        <!-- ===== CLEANED PATH (where mop has passed) ===== -->
        <g>
          <!-- Cleaned area - brighter, more reflective -->
          <path d="M350,620 Q400,580 450,540 Q500,500 540,460 Q580,420 620,380 Q660,340 700,300 Q680,310 640,350 Q600,390 560,430 Q520,470 480,510 Q440,550 400,590 Q370,610 350,620 Z"
                fill="url(#cleanPath)"/>
          <!-- Cleaned path wet sheen -->
          <path d="M360,610 Q410,575 460,535 Q510,495 550,455 Q590,415 630,375 Q670,335 700,300 Q685,308 650,345 Q610,385 570,425 Q530,465 490,505 Q450,545 410,585 Q380,605 360,610 Z"
                fill="#F0E8D8" opacity="0.04"/>
        </g>

        <!-- ===== SPILLED MESS ===== -->
        <g transform="translate(820, 620)">
          <!-- Spill shadow -->
          <path d="M0,-30 C-60,-50 -140,-25 -175,20 C-205,65 -190,120 -140,150 C-90,180 20,175 80,155 C140,135 170,80 155,20 C140,-40 80,-65 0,-50 C-30,-60 -50,-45 0,-30 Z"
                fill="#2A1808" opacity="0.25" filter="url(#spillShadow)" transform="translate(8, 12)"/>

          <!-- Main spill body -->
          <path d="M0,-30 C-60,-50 -140,-25 -175,20 C-205,65 -190,120 -140,150 C-90,180 20,175 80,155 C140,135 170,80 155,20 C140,-40 80,-65 0,-50 C-30,-60 -50,-45 0,-30 Z"
                fill="url(#spillBody)"/>

          <!-- Wet edge ring -->
          <path d="M0,-30 C-60,-50 -140,-25 -175,20 C-205,65 -190,120 -140,150 C-90,180 20,175 80,155 C140,135 170,80 155,20 C140,-40 80,-65 0,-50 C-30,-60 -50,-45 0,-30 Z"
                fill="none" stroke="#1A0E04" stroke-width="2" opacity="0.3"/>

          <!-- Inner dark core -->
          <path d="M5,-20 C-45,-35 -110,-15 -138,15 C-162,45 -150,90 -110,112 C-70,134 12,130 55,115 C98,100 122,55 110,10 C98,-35 55,-50 5,-40 C-18,-48 -30,-38 5,-20 Z"
                fill="url(#spillWetEdge)"/>

          <!-- Specular highlight -->
          <ellipse cx="-30" cy="-10" rx="50" ry="18" fill="url(#spillHighlight)" transform="rotate(-10 -30 -10)"/>

          <!-- Secondary highlight -->
          <ellipse cx="35" cy="45" rx="22" ry="8" fill="#A07850" opacity="0.12" transform="rotate(-5 35 45)"/>

          <!-- Small highlight -->
          <ellipse cx="-15" cy="60" rx="12" ry="5" fill="#B89060" opacity="0.1" transform="rotate(5 -15 60)"/>

          <!-- Splatter drops - large -->
          <g>
            <circle cx="-195" cy="10" r="4" fill="#4A2E14" opacity="0.6"/>
            <circle cx="-210" cy="25" r="2.5" fill="#4A2E14" opacity="0.5"/>
            <circle cx="-200" cy="-5" r="3" fill="#4A2E14" opacity="0.45"/>
            <circle cx="165" cy="60" r="3.5" fill="#4A2E14" opacity="0.55"/>
            <circle cx="178" cy="48" r="2" fill="#4A2E14" opacity="0.4"/>
            <circle cx="182" cy="72" r="2.5" fill="#4A2E14" opacity="0.45"/>
            <circle cx="-180" cy="85" r="2" fill="#4A2E14" opacity="0.4"/>
