<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotless — Premium Cleaning</title>
<style>
  :root {
    --bg: #1A1612;
    --surface: #2A2420;
    --text: #F5F0E8;
    --text-muted: #A89E92;
    --accent: #D4883A;
    --accent-glow: #E8A858;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body, html {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    position: relative;
    width: 100%; height: 100vh;
    overflow: hidden;
  }

  .scene-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .scene-bg svg {
    width: 100%; height: 100%;
    display: block;
  }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    pointer-events: none;
  }

  .content {
    pointer-events: auto;
    max-width: 520px;
    padding: 72px 64px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }

  .content::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(26,22,18,0.92) 0%, rgba(26,22,18,0.6) 55%, transparent 100%);
    z-index: -1;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 64px;
  }

  .brand-mark {
    width: 36px; height: 36px;
    position: relative;
  }

  .brand-name {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    font-size: 56px;
    line-height: 1.05;
    color: var(--text);
    font-weight: 700;
    letter-spacing: -2px;
    margin-bottom: 24px;
  }

  h1 em {
    font-style: italic;
    font-weight: 300;
    color: var(--accent-glow);
    font-family: Georgia, "Times New Roman", serif;
  }

  .subtitle {
    font-size: 16px;
    line-height: 1.8;
    color: var(--text-muted);
    max-width: 360px;
    margin-bottom: 48px;
    font-weight: 400;
  }

  .stats {
    display: flex;
    gap: 48px;
    margin-bottom: 56px;
    padding-top: 8px;
  }

  .stat-value {
    font-size: 38px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -1.5px;
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    opacity: 0.7;
  }

  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: var(--accent);
    color: #1A1612;
    border: none;
    padding: 20px 44px;
    font-size: 14px;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    width: fit-content;
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;
  }

  .cta-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 48px rgba(212,136,58,0.35);
    background: var(--accent-glow);
  }

  .cta-btn .arrow {
    transition: transform 0.3s ease;
  }

  .cta-btn:hover .arrow {
    transform: translateX(4px);
  }

  .tagline {
    position: absolute;
    bottom: 72px;
    right: 64px;
    z-index: 3;
    pointer-events: none;
    text-align: right;
  }

  .tagline-text {
    font-size: 13px;
    color: rgba(245,240,232,0.4);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
  }

  @keyframes floatBubble {
    0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
    25% { transform: translateY(-12px) translateX(3px); opacity: 0.5; }
    50% { transform: translateY(-6px) translateX(-2px); opacity: 0.35; }
    75% { transform: translateY(-18px) translateX(1px); opacity: 0.45; }
  }

  @keyframes gentleSway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(0.3deg); }
  }

  @keyframes shimmer {
    0%, 100% { opacity: 0.03; }
    50% { opacity: 0.08; }
  }

  .bubble-1 { animation: floatBubble 6s infinite ease-in-out; }
  .bubble-2 { animation: floatBubble 7s infinite ease-in-out 1s; }
  .bubble-3 { animation: floatBubble 5s infinite ease-in-out 2s; }
  .bubble-4 { animation: floatBubble 8s infinite ease-in-out 0.5s; }
  .bubble-5 { animation: floatBubble 6.5s infinite ease-in-out 3s; }

  .mop-sway {
    transform-origin: 620px 80px;
    animation: gentleSway 10s infinite ease-in-out;
  }

  .light-shimmer {
    animation: shimmer 5s infinite ease-in-out;
  }
</style>
</head>
<body>
<div class="page">
  <div class="scene-bg">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- === FLOOR GRADIENTS === -->
        <linearGradient id="floorBase" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5C4A38"/>
          <stop offset="100%" stop-color="#3A2C20"/>
        </linearGradient>

        <linearGradient id="floorWarm" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8B7355"/>
          <stop offset="50%" stop-color="#6B5540"/>
          <stop offset="100%" stop-color="#4A3828"/>
        </linearGradient>

        <!-- Plank color variations -->
        <linearGradient id="plankWarm1" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#9A8060"/>
          <stop offset="50%" stop-color="#A89070"/>
          <stop offset="100%" stop-color="#8E7858"/>
        </linearGradient>
        <linearGradient id="plankWarm2" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#8A7458"/>
          <stop offset="50%" stop-color="#9A8468"/>
          <stop offset="100%" stop-color="#7E684C"/>
        </linearGradient>
        <linearGradient id="plankWarm3" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#7E684C"/>
          <stop offset="50%" stop-color="#8E785C"/>
          <stop offset="100%" stop-color="#9A8060"/>
        </linearGradient>
        <linearGradient id="plankWarm4" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#A08A6E"/>
          <stop offset="50%" stop-color="#907A5E"/>
          <stop offset="100%" stop-color="#A89070"/>
        </linearGradient>

        <!-- === PERSPECTIVE FLOOR === -->
        <!-- Vanishing point at center-top, planks converge -->
        <linearGradient id="floorDepth" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#C8B898" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#3A2C20" stop-opacity="0"/>
        </linearGradient>

        <!-- === SPILL GRADIENTS === -->
        <radialGradient id="spillBody" cx="0.4" cy="0.35" r="0.65">
          <stop offset="0%" stop-color="#6B4A28" stop-opacity="0.95"/>
          <stop offset="20%" stop-color="#5C3A1E" stop-opacity="0.9"/>
          <stop offset="50%" stop-color="#4A2E14" stop-opacity="0.85"/>
          <stop offset="75%" stop-color="#3D2410" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#2A1808" stop-opacity="0.2"/>
        </radialGradient>

        <radialGradient id="spillCore" cx="0.35" cy="0.3" r="0.35">
          <stop offset="0%" stop-color="#8A6840" stop-opacity="0.5"/>
          <stop offset="50%" stop-color="#6B4A28" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#6B4A28" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="spillHighlight" cx="0.25" cy="0.25" r="0.4">
          <stop offset="0%" stop-color="#C8A878" stop-opacity="0.45"/>
          <stop offset="40%" stop-color="#A08050" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#A08050" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="spillWetEdge" cx="0.5" cy="0.5" r="0.5">
          <stop offset="55%" stop-color="#2A1808" stop-opacity="0"/>
          <stop offset="80%" stop-color="#2A1808" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#1A0E04" stop-opacity="0.35"/>
        </radialGradient>

        <radialGradient id="spillSpecular" cx="0.3" cy="0.25" r="0.15">
          <stop offset="0%" stop-color="#F0D8B8" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#F0D8B8" stop-opacity="0"/>
        </radialGradient>

        <!-- Wet floor reflection -->
        <radialGradient id="wetReflection" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0%" stop-color="#F0E8D8" stop-opacity="0.1"/>
          <stop offset="60%" stop-color="#F0E8D8" stop-opacity="0.03"/>
          <stop offset="100%" stop-color="#F0E8D8" stop-opacity="0"/>
        </radialGradient>

        <!-- === WINDOW LIGHT === -->
        <linearGradient id="windowLight" x1="1" y1="0" x2="0.2" y2="1">
          <stop offset="0%" stop-color="#FFF8E8" stop-opacity="0.18"/>
          <stop offset="30%" stop-color="#FFF0D0" stop-opacity="0.06"/>
          <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="lightBeam" x1="1" y1="0" x2="0.1" y2="1">
          <stop offset="0%" stop-color="#FFF8E8" stop-opacity="0.08"/>
          <stop offset="50%" stop-color="#FFF8E8" stop-opacity="0.02"/>
          <stop offset="100%" stop-color="#FFF8E8" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="lightBeam2" x1="1" y1="0" x2="0.3" y2="1">
          <stop offset="0%" stop-color="#FFF8E8" stop-opacity="0.05"/>
          <stop offset="100%" stop-color="#FFF8E8" stop-opacity="0"/>
        </linearGradient>

        <!-- === MOP MATERIALS === -->
        <!-- Wooden handle -->
        <linearGradient id="handleWood" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#3A2818"/>
          <stop offset="25%" stop-color="#5A4028"/>
          <stop offset="50%" stop-color="#6A5038"/>
          <stop offset="75%" stop-color="#5A4028"/>
          <stop offset="100%" stop-color="#2A1808"/>
        </linearGradient>

        <linearGradient id="handleHighlight" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#8A7050" stop-opacity="0"/>
          <stop offset="40%" stop-color="#8A7050" stop-opacity="0.15"/>
          <stop offset="60%" stop-color="#8A7050" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#8A7050" stop-opacity="0"/>
        </linearGradient>

        <!-- Metal connector -->
        <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#C8C8C8"/>
          <stop offset="20%" stop-color="#A8A8A8"/>
          <stop offset="50%" stop-color="#909090"/>
          <stop offset="80%" stop-color="#808080"/>
          <stop offset="100%" stop-color="#686868"/>
        </linearGradient>

        <linearGradient id="metalPlate" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#B0B0B0"/>
          <stop offset="50%" stop-color="#989898"/>
          <stop offset="100%" stop-color="#787878"/>
        </linearGradient>

        <linearGradient id="metalRim" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#A0A0A0"/>
          <stop offset="50%" stop-color="#C0C0C0"/>
          <stop offset="100%" stop-color="#888888"/>
        </linearGradient>

        <!-- Mop strands - cotton blend -->
        <linearGradient id="strandBase" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#E8E0D0"/>
          <stop offset="30%" stop-color="#D8D0C0"/>
          <stop offset="100%" stop-color="#C0B8A8"/>
        </linearGradient>

        <linearGradient id="strandWet" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#C8C0B0"/>
          <stop offset="50%" stop-color="#A89888"/>
          <stop offset="100%" stop-color="#887868"/>
        </linearGradient>

        <linearGradient id="strandShadow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#B0A898"/>
          <stop offset="100%" stop-color="#887868"/>
        </linearGradient>

        <!-- Cleaned path -->
        <linearGradient id="cleanPath" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#F0E8D8" stop-opacity="0"/>
          <stop offset="40%" stop-color="#F0E8D8" stop-opacity="0.06"/>
          <stop offset="70%" stop-color="#F0E8D8" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#F0E8D8" stop-opacity="0"/>
        </linearGradient>

        <!-- === VIGNETTE === -->
        <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
          <stop offset="40%" stop-color="#000" stop-opacity="0"/>
          <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
        </radialGradient>

        <!-- === SHADOW FILTERS === -->
        <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="30"/>
          <feOffset dx="12" dy="20"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.2"/>
          </feComponentTransfer>
          <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <filter id="spillShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
          <feOffset dx="6" dy="10"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.25"/>
          </feComponentTransfer>
        </filter>

        <filter id="strandBlur">
          <feGaussianBlur stdDeviation="0.4"/>
        </filter>

        <filter id="wetGlow">
          <feGaussianBlur stdDeviation="3"/>
        </filter>

        <filter id="softGlow">
          <feGaussianBlur stdDeviation="8"/>
        </filter>

        <filter id="dropShadow">
          <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
          <feOffset dx="2" dy="4"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.3"/>
          </feComponentTransfer>
          <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <!-- Wood grain texture pattern -->
        <pattern id="woodGrain" x="0" y="0" width="200" height="20" patternUnits="userSpaceOnUse">
          <path d="M0,5 Q50,3 100,6 Q150,4 200,5" fill="none" stroke="#000" stroke-width="0.3" opacity="0.08"/>
          <path d="M0,12 Q60,10 120,13 Q160,11 200,12" fill="none" stroke="#000" stroke-width="0.2" opacity="0.06"/>
          <path d="M0,17 Q40,16 80,18 Q140,16 200,17" fill="none" stroke="#000" stroke-width="0.2" opacity="0.05"/>
        </pattern>

        <clipPath id="sceneClip">
          <rect x="0" y="0" width="1600" height="900"/>
        </clipPath>
      </defs>

      <g clip-path="url(#sceneClip)">
        <!-- ===== BACKGROUND / WALL ===== -->
        <!-- Upper wall area -->
        <rect x="0" y="0" width="1600" height="200" fill="#2A2420"/>
        <rect x="0" y="180" width="1600" height="40" fill="#3A3430"/>
        <!-- Baseboard -->
        <rect x="0" y="195" width="1600" height="15" fill="#4A4038"/>
        <rect x="0" y="195" width="1600" height="2" fill="#5A5048" opacity="0.5"/>

        <!-- ===== PERSPECTIVE HARDWOOD FLOOR ===== -->
        <!-- Base -->
        <rect x="0" y="210" width="1600" height="690" fill="url(#floorBase)"/>

        <!-- Perspective planks - converging toward vanishing point at (800, 210) -->
        <!-- Using trapezoids for proper perspective -->

        <!-- Plank row 1 (closest) -->
        <polygon points="0,900 1600,900 1600,780 0,780" fill="url(#plankWarm1)"/>
        <polygon points="0,900 1600,900 1600,780 0,780" fill="url(#woodGrain)" opacity="0.5"/>
        <line x1="0" y1="780" x2="1600" y2="780" stroke="#2A1C10" stroke-width="2" opacity="0.4"/>

        <!-- Plank row 2 -->
        <polygon points="0,780 1600,780 1600,670 0,670" fill="url(#plankWarm2)"/>
        <polygon points="0,780 1600,780 1600,670 0,670" fill="url(#woodGrain)" opacity="0.4"/>
        <line x1="0" y1="670" x2="1600" y2="670" stroke="#2A1C10" stroke-width="1.5" opacity="0.35"/>

        <!-- Plank row 3 -->
        <polygon points="0,670 1600,670 1600,570 0,570" fill="url(#plankWarm3)"/>
        <polygon points="0,670 1600,670 1600,570 0,570" fill="url(#woodGrain)" opacity="0.35"/>
        <line x1="0" y1="570" x2="1600" y2="570" stroke="#2A1C10" stroke-width="1.2" opacity="0.3"/>

        <!-- Plank row 4 -->
        <polygon points="0,570 1600,570 1600,480 0,480" fill="url(#plankWarm4)"/>
        <polygon points="0,570 1600,570 1600,480 0,480" fill="url(#woodGrain)" opacity="0.3"/>
        <line x1="0" y1="480" x2="1600" y2="480" stroke="#2A1C10" stroke-width="1" opacity="0.25"/>

        <!-- Plank row 5 -->
        <polygon points="0,480 1600,480 1600,400 0,400" fill="url(#plankWarm1)"/>
        <polygon points="0,480 1600,480 1600,400 0,400" fill="url(#woodGrain)" opacity="0.25"/>
        <line x1="0" y1="400" x2="1600" y2="400" stroke="#2A1C10" stroke-width="0.8" opacity="0.2"/>

        <!-- Plank row 6 -->
        <polygon points="0,400 1600,400 1600,330 0,330" fill="url(#plankWarm2)"/>
        <polygon points="0,400 1600,400 1600,330 0,330" fill="url(#woodGrain)" opacity="0.2"/>
        <line x1="0" y1="330" x2="1600" y2="330" stroke="#2A1C10" stroke-width="0.6" opacity="0.18"/>

        <!-- Plank row 7 -->
        <polygon points="0,330 1600,330 1600,270 0,270" fill="url(#plankWarm3)"/>
        <polygon points="0,330 1600,330 1600,270 0,270" fill="url(#woodGrain)" opacity="0.15"/>
        <line x1="0" y1="270" x2="1600" y2="270" stroke="#2A1C10" stroke-width="0.5" opacity="0.15"/>

        <!-- Plank row 8 (farthest) -->
        <polygon points="0,270 1600,270 1600,210 0,210" fill="url(#plankWarm4)"/>
        <line x1="0" y1="210" x2="1600" y2="210" stroke="#2A1C10" stroke-width="0.3" opacity="0.1"/>

        <!-- Vertical plank seams (staggered, perspective-correct) -->
        <g stroke="#2A1C10" opacity="0.15">
          <!-- Row 1 seams -->
          <line x1="400" y1="780" x2="400" y2="900" stroke-width="1.5"/>
          <line x1="900" y1="780" x2="900" y2="900" stroke-width="1.5"/>
          <line x1="1300" y1="780" x2="1300" y2="900" stroke-width="1.5"/>

          <!-- Row 2 seams -->
          <line x1="250" y1="670" x2="250" y2="780" stroke-width="1.2"/>
          <line x1="750" y1="670" x2="750" y2="780" stroke-width="1.2"/>
          <line x1="1200" y1="670" x2="1200" y2="780" stroke-width="1.2"/>

          <!-- Row 3 seams -->
          <line x1="150" y1="570" x2="150" y2="670" stroke-width="1"/>
          <line x1="600" y1="570" x2="600" y2="670" stroke-width="1"/>
          <line x1="1050" y1="570" x2="1050" y2="670" stroke-width="1"/>
          <line x1="1450" y1="570" x2="1450" y2="670" stroke-width="1"/>

          <!-- Row 4 seams -->
          <line x1="350" y1="480" x2="350" y2="570" stroke-width="0.8"/>
          <line x1="800" y1="480" x2="800" y2="570" stroke-width="0.8"/>
          <line x1="1250" y1="480" x2="1250" y2="570" stroke-width="0.8"/>

          <!-- Row 5 seams -->
          <line x1="500" y1="400" x2="500" y2="480" stroke-width="0.6"/>
          <line x1="950" y1="400" x2="950" y2="480" stroke-width="0.6"/>
          <line x1="1400" y1="400" x2="1400" y2="480" stroke-width="0.6"/>

          <!-- Row 6 seams -->
          <line x1="300" y1="330" x2="300" y2="400" stroke-width="0.5"/>
          <line x1="750" y1="330" x2="750" y2="400" stroke-width="0.5"/>
          <line x1="1200" y1="330" x2="1200" y2="400" stroke-width="0.5"/>

          <!-- Row 7 seams -->
          <line x1="450" y1="270" x2="450" y2="330" stroke-width="0.4"/>
          <line x1="900" y1="270" x2="900" y2="330" stroke-width="0.4"/>
          <line x1="1350" y1="270" x2="1350" y2="330" stroke-width="0.4"/>
        </g>

        <!-- Wood grain detail lines on floor -->
        <g stroke="#000" fill="none" opacity="0.04">
          <path d="M100,850 Q300,845 500,852 Q700,846 900,850 Q1100,844 1300,851 Q1500,847 1600,849" stroke-width="0.5"/>
          <path d="M50,800 Q250,795 450,802 Q650,796 850,800 Q1050,794 1250,801 Q1450,797 1600,799" stroke-width="0.4"/>
          <path d="M0,750 Q200,745 400,752 Q600,746 800,750 Q1000,744 1200,751 Q1400,747 1600,749" stroke-width="0.3"/>
          <path d="M100,700 Q300,695 500,702 Q700,696 900,700 Q1100,694 1300,701 Q1500,697 1600,699" stroke-width="0.3"/>
          <path d="M0,650 Q200,645 400,652 Q600,646 800,650 Q1000,644 1200,651 Q1400,647 1600,649" stroke-width="0.25"/>
          <path d="M100,600 Q300,595 500,602 Q700,596 900,600 Q1100,594 1300,601 Q1500,597 1600,599" stroke-width="0.2"/>
          <path d="M0,550 Q200,545 400,552 Q600,546 800,550 Q1000,544 1200,551 Q1400,547 1600,549" stroke-width="0.2"/>
