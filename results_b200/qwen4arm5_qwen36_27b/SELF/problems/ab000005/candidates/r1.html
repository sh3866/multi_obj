<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless - Premium Cleaning Service</title>
    <style>
        :root {
            --bg-warm: #F5F0E8;
            --text-dark: #1A1A1A;
            --text-mid: #5A5A5A;
            --text-light: #8A8A8A;
            --accent: #C8956C;
            --accent-deep: #A0714E;
            --wood-light: #D4B896;
            --wood-dark: #B8956E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-warm);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            display: grid;
            grid-template-columns: 420px 1fr;
            width: 100%;
            height: 100vh;
        }

        .sidebar {
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #FAFAF7;
            position: relative;
            z-index: 10;
        }

        .brand {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-deep);
            margin-bottom: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            display: inline-block;
        }

        h1 {
            font-size: 56px;
            line-height: 1.05;
            color: var(--text-dark);
            margin: 0 0 30px 0;
            font-weight: 800;
            letter-spacing: -2px;
        }

        h1 em {
            font-style: italic;
            font-weight: 400;
            color: var(--accent-deep);
        }

        .description {
            font-size: 17px;
            line-height: 1.7;
            color: var(--text-mid);
            margin-bottom: 50px;
            max-width: 340px;
            font-weight: 400;
        }

        .stats {
            display: flex;
            gap: 50px;
            margin-bottom: auto;
            padding-top: 20px;
        }

        .stat-item h3 {
            font-size: 36px;
            margin: 0;
            color: var(--text-dark);
            font-weight: 800;
            letter-spacing: -1px;
        }

        .stat-item span {
            font-size: 11px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            display: block;
            margin-top: 6px;
        }

        .cta-button {
            background: var(--text-dark);
            color: #fff;
            border: none;
            padding: 20px 40px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: fit-content;
            margin-top: 50px;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .cta-button:hover {
            background: var(--accent-deep);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(160, 113, 78, 0.3);
        }

        .scene-container {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #EDE8DF 0%, #E5DED3 50%, #DDD5C8 100%);
        }

        svg {
            width: 100%;
            height: 100%;
        }

        @keyframes gentleSway {
            0%, 100% { transform: rotate(0deg) translateX(0); }
            25% { transform: rotate(0.5deg) translateX(2px); }
            75% { transform: rotate(-0.5deg) translateX(-2px); }
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        @keyframes bubbleRise {
            0% { transform: translateY(0) scale(1); opacity: 0.7; }
            100% { transform: translateY(-30px) scale(1.3); opacity: 0; }
        }

        .mop-group {
            transform-origin: 620px 80px;
            animation: gentleSway 6s infinite ease-in-out;
        }

        .shimmer-1 { animation: shimmer 3s infinite ease-in-out; }
        .shimmer-2 { animation: shimmer 3s infinite ease-in-out 1s; }
        .shimmer-3 { animation: shimmer 3s infinite ease-in-out 2s; }

        .bubble-1 { animation: bubbleRise 4s infinite ease-in; }
        .bubble-2 { animation: bubbleRise 4s infinite ease-in 1.5s; }
        .bubble-3 { animation: bubbleRise 4s infinite ease-in 3s; }
    </style>
</head>
<body>
<div class="container">
    <div class="sidebar">
        <div class="brand"><span class="brand-dot"></span> Spotless Co.</div>
        <h1>Clarity in<br>every <em>corner.</em></h1>
        <p class="description">Experience the difference of a deep clean. We restore the natural warmth of your home with eco-friendly solutions and meticulous care.</p>
        <div class="stats">
            <div class="stat-item">
                <h3>99%</h3>
                <span>Efficiency</span>
            </div>
            <div class="stat-item">
                <h3>100%</h3>
                <span>Eco-Friendly</span>
            </div>
        </div>
        <button class="cta-button">Book a Clean</button>
    </div>

    <div class="scene-container">
        <svg viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Floor wood grain pattern -->
                <pattern id="woodGrain" x="0" y="0" width="1000" height="60" patternUnits="userSpaceOnUse">
                    <rect width="1000" height="60" fill="#D9CBB5"/>
                    <line x1="0" y1="30" x2="1000" y2="30" stroke="#C9B99E" stroke-width="0.5" opacity="0.5"/>
                    <line x1="0" y1="15" x2="1000" y2="15" stroke="#C9B99E" stroke-width="0.3" opacity="0.3"/>
                    <line x1="0" y1="45" x2="1000" y2="45" stroke="#C9B99E" stroke-width="0.3" opacity="0.3"/>
                    <!-- Grain lines -->
                    <path d="M0,10 Q250,12 500,8 Q750,14 1000,10" fill="none" stroke="#C4B496" stroke-width="0.5" opacity="0.4"/>
                    <path d="M0,25 Q200,27 400,23 Q600,28 800,24 Q900,26 1000,25" fill="none" stroke="#C4B496" stroke-width="0.5" opacity="0.3"/>
                    <path d="M0,40 Q300,38 600,42 Q800,39 1000,40" fill="none" stroke="#C4B496" stroke-width="0.5" opacity="0.3"/>
                    <path d="M0,55 Q150,53 350,56 Q550,54 750,57 Q900,55 1000,55" fill="none" stroke="#C4B496" stroke-width="0.4" opacity="0.25"/>
                </pattern>

                <!-- Plank divisions -->
                <pattern id="planks" x="0" y="0" width="1000" height="600" patternUnits="userSpaceOnUse">
                    <rect width="1000" height="600" fill="url(#woodGrain)"/>
                    <!-- Horizontal plank lines -->
                    <line x1="0" y1="60" x2="1000" y2="60" stroke="#BFAE8C" stroke-width="1.5" opacity="0.6"/>
                    <line x1="0" y1="120" x2="1000" y2="120" stroke="#BFAE8C" stroke-width="1.5" opacity="0.6"/>
                    <line x1="0" y1="180" x2="1000" y2="180" stroke="#BFAE8C" stroke-width="1.5" opacity="0.6"/>
                    <line x1="0" y1="240" x2="1000" y2="240" stroke="#BFAE8C" stroke-width="1.5" opacity="0.6"/>
                    <line x1="0" y1="300" x2="1000" y2="300" stroke="#BFAE8C" stroke-width="1.5" opacity="0.6"/>
                    <line x1="0" y1="360" x2="1000" y2="360" stroke="#BFAE8C" stroke-width="1.5" opacity="0.6"/>
                    <line x1="0" y1="420" x2="1000" y2="420" stroke="#BFAE8C" stroke-width="1.5" opacity="0.6"/>
                    <line x1="0" y1="480" x2="1000" y2="480" stroke="#BFAE8C" stroke-width="1.5" opacity="0.6"/>
                    <line x1="0" y1="540" x2="1000" y2="540" stroke="#BFAE8C" stroke-width="1.5" opacity="0.6"/>
                    <!-- Vertical staggered joints -->
                    <line x1="200" y1="0" x2="200" y2="60" stroke="#BFAE8C" stroke-width="1" opacity="0.4"/>
                    <line x1="500" y1="60" x2="500" y2="120" stroke="#BFAE8C" stroke-width="1" opacity="0.4"/>
                    <line x1="350" y1="120" x2="350" y2="180" stroke="#BFAE8C" stroke-width="1" opacity="0.4"/>
                    <line x1="700" y1="180" x2="700" y2="240" stroke="#BFAE8C" stroke-width="1" opacity="0.4"/>
                    <line x1="150" y1="240" x2="150" y2="300" stroke="#BFAE8C" stroke-width="1" opacity="0.4"/>
                    <line x1="600" y1="300" x2="600" y2="360" stroke="#BFAE8C" stroke-width="1" opacity="0.4"/>
                    <line x1="400" y1="360" x2="400" y2="420" stroke="#BFAE8C" stroke-width="1" opacity="0.4"/>
                    <line x1="800" y1="420" x2="800" y2="480" stroke="#BFAE8C" stroke-width="1" opacity="0.4"/>
                    <line x1="250" y1="480" x2="250" y2="540" stroke="#BFAE8C" stroke-width="1" opacity="0.4"/>
                    <line x1="550" y1="540" x2="550" y2="600" stroke="#BFAE8C" stroke-width="1" opacity="0.4"/>
                </pattern>

                <!-- Wet floor overlay -->
                <linearGradient id="wetOverlay" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#C8B89A" stop-opacity="0.15"/>
                    <stop offset="50%" stop-color="#B8A88A" stop-opacity="0.1"/>
                    <stop offset="100%" stop-color="#A8987A" stop-opacity="0.2"/>
                </linearGradient>

                <!-- Spill gradients -->
                <radialGradient id="spillShadow" cx="0.4" cy="0.4" r="0.6">
                    <stop offset="0%" stop-color="#8B6914" stop-opacity="0.4"/>
                    <stop offset="100%" stop-color="#8B6914" stop-opacity="0"/>
                </radialGradient>

                <radialGradient id="spillBody" cx="0.35" cy="0.35" r="0.65">
                    <stop offset="0%" stop-color="#E8C84A" stop-opacity="0.95"/>
                    <stop offset="40%" stop-color="#D4A830" stop-opacity="0.9"/>
                    <stop offset="80%" stop-color="#C49828" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#B88820" stop-opacity="0.7"/>
                </radialGradient>

                <radialGradient id="spillHighlight" cx="0.3" cy="0.25" r="0.5">
                    <stop offset="0%" stop-color="#F5E88A" stop-opacity="0.6"/>
                    <stop offset="100%" stop-color="#F5E88A" stop-opacity="0"/>
                </radialGradient>

                <radialGradient id="spillInner" cx="0.45" cy="0.45" r="0.4">
                    <stop offset="0%" stop-color="#D4A030" stop-opacity="0.5"/>
                    <stop offset="100%" stop-color="#D4A030" stop-opacity="0"/>
                </radialGradient>

                <!-- Mop handle gradient -->
                <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#3A3A3A"/>
                    <stop offset="30%" stop-color="#555"/>
                    <stop offset="70%" stop-color="#444"/>
                    <stop offset="100%" stop-color="#2A2A2A"/>
                </linearGradient>

                <!-- Mop head metal -->
                <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#999"/>
                    <stop offset="50%" stop-color="#777"/>
                    <stop offset="100%" stop-color="#666"/>
                </linearGradient>

                <!-- Mop strand gradients -->
                <linearGradient id="strandWet1" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#7BA7C4"/>
                    <stop offset="60%" stop-color="#5E8FAA"/>
                    <stop offset="100%" stop-color="#4A7A96"/>
                </linearGradient>

                <linearGradient id="strandWet2" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#8BB8D4"/>
                    <stop offset="60%" stop-color="#6E9FBA"/>
                    <stop offset="100%" stop-color="#5A8AA6"/>
                </linearGradient>

                <linearGradient id="strandDry" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#A8C8D8"/>
                    <stop offset="100%" stop-color="#7AA8BC"/>
                </linearGradient>

                <!-- Shadow filters -->
                <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
                    <feOffset dx="3" dy="8" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.25"/>
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <filter id="puddleShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
                    <feOffset dx="2" dy="4"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.3"/>
                    </feComponentTransfer>
                </filter>

                <!-- Wet floor sheen -->
                <filter id="wetSheen">
                    <feGaussianBlur stdDeviation="2"/>
                </filter>

                <!-- Light flare -->
                <radialGradient id="lightFlare" cx="0.5" cy="0.5" r="0.5">
                    <stop offset="0%" stop-color="#FFF8E8" stop-opacity="0.15"/>
                    <stop offset="100%" stop-color="#FFF8E8" stop-opacity="0"/>
                </radialGradient>

                <!-- Clip for floor area -->
                <clipPath id="floorClip">
                    <rect x="0" y="0" width="1000" height="800"/>
                </clipPath>
            </defs>

            <!-- Background -->
            <rect width="1000" height="800" fill="#E8E0D2"/>

            <!-- Floor surface -->
            <rect width="1000" height="800" fill="url(#planks)" clip-path="url(#floorClip)"/>

            <!-- Floor ambient lighting overlay -->
            <rect width="1000" height="800" fill="url(#wetOverlay)" opacity="0.5"/>

            <!-- Warm light from upper right -->
            <ellipse cx="850" cy="50" rx="400" ry="300" fill="url(#lightFlare)"/>

            <!-- Subtle vignette -->
            <rect width="1000" height="800" fill="none" stroke="#000" stroke-width="80" opacity="0.03" rx="0"/>

            <!-- ==================== SPILLED MESS ==================== -->
            <g filter="url(#puddleShadow)" transform="translate(480, 480)">
                <!-- Puddle shadow on floor -->
                <path d="M-10,-20 C-60,-35 -130,-15 -150,15 C-170,45 -155,85 -110,100 C-65,115 10,110 60,90 C110,70 130,30 110,-10 C90,-50 40,-60 0,-40 C-30,-50 -50,-35 -10,-20 Z"
                      fill="url(#spillShadow)" transform="translate(8, 12)"/>

                <!-- Main puddle body -->
                <path d="M-10,-20 C-60,-35 -130,-15 -150,15 C-170,45 -155,85 -110,100 C-65,115 10,110 60,90 C110,70 130,30 110,-10 C90,-50 40,-60 0,-40 C-30,-50 -50,-35 -10,-20 Z"
                      fill="url(#spillBody)"/>

                <!-- Inner darker region -->
                <path d="M-5,-15 C-45,-25 -100,-10 -115,12 C-130,35 -120,65 -85,78 C-50,90 5,85 45,70 C80,55 95,25 80,-5 C65,-35 30,-42 0,-30 C-22,-38 -38,-28 -5,-15 Z"
                      fill="url(#spillInner)"/>

                <!-- Specular highlight -->
                <ellipse cx="-30" cy="-10" rx="50" ry="18" fill="url(#spillHighlight)" transform="rotate(-15 -30 -10)"/>

                <!-- Secondary highlight -->
                <ellipse cx="30" cy="40" rx="20" ry="8" fill="#F5E88A" opacity="0.2" transform="rotate(-10 30 40)"/>

                <!-- Edge wet ring -->
                <path d="M-10,-20 C-60,-35 -130,-15 -150,15 C-170,45 -155,85 -110,100 C-65,115 10,110 60,90 C110,70 130,30 110,-10 C90,-50 40,-60 0,-40 C-30,-50 -50,-35 -10,-20 Z"
                      fill="none" stroke="#C49828" stroke-width="1.5" opacity="0.4"/>
            </g>

            <!-- Splatter drops -->
            <g>
                <circle cx="380" cy="440" r="4" fill="#D4A830" opacity="0.8"/>
                <circle cx="365" cy="450" r="2.5" fill="#D4A830" opacity="0.7"/>
                <circle cx="680" cy="520" r="3" fill="#D4A830" opacity="0.75"/>
                <circle cx="695" cy="510" r="2" fill="#D4A830" opacity="0.6"/>
                <circle cx="350" cy="530" r="3.5" fill="#D4A830" opacity="0.7"/>
                <circle cx="340" cy="545" r="1.5" fill="#D4A830" opacity="0.5"/>
                <circle cx="700" cy="540" r="2" fill="#D4A830" opacity="0.6"/>
                <circle cx="660" cy="555" r="1.5" fill="#D4A830" opacity="0.5"/>
                <circle cx="400" cy="395" r="2" fill="#D4A830" opacity="0.6"/>
                <circle cx="415" cy="388" r="1.5" fill="#D4A830" opacity="0.5"/>
            </g>

            <!-- Wet floor area around spill -->
            <ellipse cx="480" cy="480" rx="180" ry="120" fill="#C8B89A" opacity="0.15" filter="url(#wetSheen)"/>

            <!-- ==================== THE MOP ==================== -->
            <g class="mop-group" filter="url(#softShadow)">
                <!-- Handle -->
                <line x1="620" y1="80" x2="420" y2="380" stroke="url(#handleGrad)" stroke-width="14" stroke-linecap="round"/>
                <!-- Handle highlight -->
                <line x1="618" y1="82" x2="418" y2="378" stroke="#666" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

                <!-- Handle top cap -->
                <ellipse cx="620" cy="78" rx="10" ry="6" fill="#444"/>
                <ellipse cx="620" cy="76" rx="8" ry="4" fill="#555"/>

                <!-- Metal connector piece -->
                <g transform="translate(410, 390)">
                    <!-- Main connector body -->
                    <rect x="-18" y="-12" width="36" height="24" rx="4" fill="url(#metalGrad)"/>
                    <!-- Connector highlight -->
                    <rect x="-16" y="-10" width="32" height="8" rx="3" fill="#AAA" opacity="0.3"/>
                    <!-- Connection hole -->
                    <circle cx="0" cy="0" r="5" fill="#555"/>
                    <circle cx="0" cy="0" r="3" fill="#444"/>
                    <!-- Wing nuts -->
                    <rect x="-22" y="-4" width="6" height="8" rx="2" fill="#777"/>
                    <rect x="16" y="-4" width="6" height="8" rx="2" fill="#777"/>
                </g>

                <!-- Mop head plate -->
                <ellipse cx="400" cy="430" rx="55" ry="14" fill="#888" opacity="0.9"/>
                <ellipse cx="400" cy="428" rx="52" ry="12" fill="#999" opacity="0.5"/>

                <!-- Mop strands - back layer (darker, wet) -->
                <g stroke-linecap="round" opacity="0.7">
                    <path d="M370,435 Q360,480 345,520" stroke="#4A7A96" stroke-width="3.5"/>
                    <path d="M380,435 Q372,485 358,528" stroke="#4A7A96" stroke-width="3.5"/>
                    <path d="M390,435 Q385,490 375,535" stroke="#4A7A96" stroke-width="3.5"/>
                    <path d="M400,435 Q398,495 392,540" stroke="#4A7A96" stroke-width="3.5"/>
                    <path d="M410,435 Q412,490 410,538" stroke="#4A7A96" stroke-width="3.5"/>
                    <path d="M420,435 Q425,485 428,530" stroke="#4A7A96" stroke-width="3.5"/>
                    <path d="M430,435 Q438,480 445,522" stroke="#4A7A96" stroke-width="3.5"/>
                </g>

                <!-- Mop strands - middle layer -->
                <g stroke-linecap="round" opacity="0.85">
                    <path d="M365,433 Q355,478 338,518" stroke="url(#strandWet1)" stroke-width="4"/>
                    <path d="M375,433 Q368,482 352,525" stroke="url(#strandWet1)" stroke-width="4"/>
                    <path d="M385,433 Q380,488 370,532" stroke="url(#strandWet2)" stroke-width="4"/>
                    <path d="M395,433 Q392,492 386,538" stroke="url(#strandWet1)" stroke-width="4"/>
                    <path d="M405,433 Q405,492 402,538" stroke="url(#strandWet2)" stroke-width="4"/>
                    <path d="M415,433 Q418,488 418,532" stroke="url(#strandWet1)" stroke-width="4"/>
                    <path d="M425,433 Q430,482 435,525" stroke="url(#strandWet2)" stroke-width="4"/>
                    <path d="M435,433 Q443,478 452,518" stroke="url(#strandWet1)" stroke-width="4"/>
                </g>

                <!-- Mop strands - front layer (lighter, more detail) -->
                <g stroke-linecap="round">
                    <path d="M368,431 Q358,475 342,515" stroke="url(#strandWet2)" stroke-width="3"/>
                    <path d="M378,431 Q370,478 356,520" stroke="url(#strandWet2)" stroke-width="3"/>
                    <path d="M388,431 Q383,484 373,528" stroke="url(#strandWet1)" stroke-width="3"/>
                    <path d="M398,431 Q395,488 390,534" stroke="url(#strandWet2)" stroke-width="3"/>
                    <path d="M408,431 Q408,488 406,534" stroke="url(#strandWet1)" stroke-width="3"/>
                    <path d="M418,431 Q420,484 422,528" stroke="url(#strandWet2)" stroke-width="3"/>
                    <path d="M428,431 Q434,478 442,520" stroke="url(#strandWet1)" stroke-width="3"/>
                    <path d="M438,431 Q446,475 456,515" stroke="url(#strandWet2)" stroke-width="3"/>
                </g>

                <!-- Strand highlights for wet look -->
                <g stroke="#A8D0E8" stroke-width="1" stroke-linecap="round" opacity="0.4">
                    <path d="M372,430 Q363,472 348,510"/>
                    <path d="M382,430 Q375,475 362,516"/>
                    <path d="M392,430 Q388,480 380,524"/>
                    <path d="M402,430 Q400,484 396,530"/>
                    <path d="M412,430 Q412,484 410,530"/>
                    <path d="M422,430 Q424,480 426,524"/>
                    <path d="M432,430 Q438,475 446,516"/>
                </g>

                <!-- Wet drip from mop -->
                <g>
                    <circle cx="370" cy="530" r="2.5" fill="#6E9FBA" opacity="0.6"/>
                    <circle cx="395" cy="542" r="2" fill="#6E9FBA" opacity="0.5"/>
                    <circle cx="420" cy="532" r="2.5" fill="#6E9FBA" opacity="0.55"/>
                </g>
            </g>

            <!-- ==================== SOAP SUDS / BUBBLES ==================== -->
            <g>
                <!-- Suds near mop head -->
                <g fill="none" stroke="#E8E4E0" stroke-width="1.2" opacity="0.5">
                    <circle cx="370" cy="500" r="6" class="bubble-1"/>
                    <circle cx="390" cy="510" r="8" class="bubble-2"/>
                    <circle cx="410" cy="495" r="4" class="bubble-3"/>
                    <circle cx="430" cy="505" r="5" class="bubble-1"/>
                    <circle cx="385" cy="520" r="3" class="bubble-2"/>
                </g>

                <!-- Sud highlights -->
                <g fill="#FFF" opacity="0.3">
                    <circle cx="368" cy="498" r="2" class="bubble-1"/>
                    <circle cx="388" cy="507" r="2.5" class="bubble-2"/>
                    <circle cx="428" cy="503" r="1.8" class="bubble-1"/>
                </g>
            </g>

            <!-- ==================== CLEANED AREA ==================== -->
            <!-- A subtle cleaner sheen where the mop has passed -->
            <g opacity="0.12">
                <path d="M300,400 Q350,420 400,440 Q450,460 500,480 Q550,500 600,520 Q550,510 500,490 Q450,470 400,450 Q350,430 300,410 Z"
                      fill="#E8E0D0"/>
            </g>

            <!-- ==================== WATER DROPLETS ON FLOOR ==================== -->
            <g fill="#C8B89A" opacity="0.3">
                <circle cx="450" cy="560" r="3"/>
                <circle cx="460" cy="565" r="2"/>
