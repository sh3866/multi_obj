<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotless — Premium Cleaning</title>
<style>
  :root {
    --bg: #1C1712;
    --surface: #2A2420;
    --text: #F5F0E8;
    --text-muted: #B8A898;
    --accent: #D4883A;
    --accent-glow: #E8A858;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body, html {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    position: relative;
    width: 100%; height: 100vh;
    overflow: hidden;
  }

  .scene-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .scene-bg svg {
    width: 100%; height: 100%;
    display: block;
  }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    pointer-events: none;
  }

  .content {
    pointer-events: auto;
    max-width: 480px;
    padding: 80px 56px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }

  .content::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(28,23,18,0.95) 0%, rgba(28,23,18,0.7) 50%, transparent 100%);
    z-index: -1;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 56px;
  }

  .brand-mark {
    width: 28px; height: 28px;
    position: relative;
  }

  .brand-name {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    font-size: 52px;
    line-height: 1.05;
    color: var(--text);
    font-weight: 700;
    letter-spacing: -1.5px;
    margin-bottom: 20px;
  }

  h1 em {
    font-style: italic;
    font-weight: 300;
    color: var(--accent-glow);
    font-family: Georgia, "Times New Roman", serif;
  }

  .subtitle {
    font-size: 15px;
    line-height: 1.75;
    color: var(--text-muted);
    max-width: 340px;
    margin-bottom: 44px;
    font-weight: 400;
  }

  .stats {
    display: flex;
    gap: 40px;
    margin-bottom: 48px;
    padding-top: 8px;
  }

  .stat-value {
    font-size: 34px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-label {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    opacity: 0.6;
  }

  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: var(--accent);
    color: #1A1612;
    border: none;
    padding: 18px 40px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    width: fit-content;
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;
  }

  .cta-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 48px rgba(212,136,58,0.35);
    background: var(--accent-glow);
  }

  .cta-btn .arrow {
    transition: transform 0.3s ease;
  }

  .cta-btn:hover .arrow {
    transform: translateX(4px);
  }

  .tagline {
    position: absolute;
    bottom: 64px;
    right: 56px;
    z-index: 3;
    pointer-events: none;
    text-align: right;
  }

  .tagline-text {
    font-size: 11px;
    color: rgba(245,240,232,0.3);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
  }

  @keyframes floatBubble {
    0%, 100% { transform: translateY(0) translateX(0); opacity: 0.25; }
    25% { transform: translateY(-8px) translateX(2px); opacity: 0.4; }
    50% { transform: translateY(-4px) translateX(-1px); opacity: 0.3; }
    75% { transform: translateY(-12px) translateX(1px); opacity: 0.35; }
  }

  @keyframes gentleSway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(0.5deg); }
  }

  @keyframes shimmer {
    0%, 100% { opacity: 0.02; }
    50% { opacity: 0.06; }
  }

  .bubble-1 { animation: floatBubble 6s infinite ease-in-out; }
  .bubble-2 { animation: floatBubble 7s infinite ease-in-out 1s; }
  .bubble-3 { animation: floatBubble 5s infinite ease-in-out 2s; }
  .bubble-4 { animation: floatBubble 8s infinite ease-in-out 0.5s; }
  .bubble-5 { animation: floatBubble 6.5s infinite ease-in-out 3s; }

  .mop-sway {
    transform-origin: 600px 100px;
    animation: gentleSway 12s infinite ease-in-out;
  }

  .light-shimmer {
    animation: shimmer 5s infinite ease-in-out;
  }
</style>
</head>
<body>
<div class="page">
  <div class="scene-bg">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- FLOOR GRADIENTS -->
        <linearGradient id="floorBase" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6B5A48"/>
          <stop offset="100%" stop-color="#3A2C20"/>
        </linearGradient>

        <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3A3430"/>
          <stop offset="100%" stop-color="#2A2420"/>
        </linearGradient>

        <!-- Plank colors with warm variation -->
        <linearGradient id="plank1" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#A08868"/>
          <stop offset="30%" stop-color="#B09878"/>
          <stop offset="70%" stop-color="#A89070"/>
          <stop offset="100%" stop-color="#988060"/>
        </linearGradient>
        <linearGradient id="plank2" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#907858"/>
          <stop offset="30%" stop-color="#A08868"/>
          <stop offset="70%" stop-color="#988060"/>
          <stop offset="100%" stop-color="#887050"/>
        </linearGradient>
        <linearGradient id="plank3" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#B8A080"/>
          <stop offset="30%" stop-color="#C8B090"/>
          <stop offset="70%" stop-color="#B8A080"/>
          <stop offset="100%" stop-color="#A89070"/>
        </linearGradient>
        <linearGradient id="plank4" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#887050"/>
          <stop offset="30%" stop-color="#988060"/>
          <stop offset="70%" stop-color="#907858"/>
          <stop offset="100%" stop-color="#806848"/>
        </linearGradient>

        <!-- SPILL GRADIENTS -->
        <radialGradient id="spillBody" cx="0.4" cy="0.35" r="0.65">
          <stop offset="0%" stop-color="#7A5A38" stop-opacity="0.92"/>
          <stop offset="15%" stop-color="#6B4A28" stop-opacity="0.88"/>
          <stop offset="40%" stop-color="#5C3A1E" stop-opacity="0.82"/>
          <stop offset="65%" stop-color="#4A2E14" stop-opacity="0.7"/>
          <stop offset="85%" stop-color="#3D2410" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="#2A1808" stop-opacity="0.08"/>
        </radialGradient>

        <radialGradient id="spillCore" cx="0.35" cy="0.3" r="0.3">
          <stop offset="0%" stop-color="#9A7850" stop-opacity="0.4"/>
          <stop offset="50%" stop-color="#7A5A38" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#6B4A28" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="spillHighlight" cx="0.28" cy="0.28" r="0.35">
          <stop offset="0%" stop-color="#D8B898" stop-opacity="0.5"/>
          <stop offset="30%" stop-color="#C8A878" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#A08050" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="spillWetEdge" cx="0.5" cy="0.5" r="0.5">
          <stop offset="50%" stop-color="#2A1808" stop-opacity="0"/>
          <stop offset="75%" stop-color="#2A1808" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#1A0E04" stop-opacity="0.28"/>
        </radialGradient>

        <radialGradient id="spillSpecular" cx="0.3" cy="0.25" r="0.12">
          <stop offset="0%" stop-color="#F0D8B8" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#F0D8B8" stop-opacity="0"/>
        </radialGradient>

        <!-- Wet floor reflection -->
        <radialGradient id="wetReflection" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0%" stop-color="#F0E8D8" stop-opacity="0.08"/>
          <stop offset="50%" stop-color="#F0E8D8" stop-opacity="0.02"/>
          <stop offset="100%" stop-color="#F0E8D8" stop-opacity="0"/>
        </radialGradient>

        <!-- WINDOW LIGHT -->
        <linearGradient id="windowLight" x1="1" y1="0" x2="0.15" y2="1">
          <stop offset="0%" stop-color="#FFF8E8" stop-opacity="0.22"/>
          <stop offset="25%" stop-color="#FFF0D0" stop-opacity="0.08"/>
          <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="lightBeam" x1="1" y1="0" x2="0.1" y2="1">
          <stop offset="0%" stop-color="#FFF8E8" stop-opacity="0.06"/>
          <stop offset="40%" stop-color="#FFF8E8" stop-opacity="0.015"/>
          <stop offset="100%" stop-color="#FFF8E8" stop-opacity="0"/>
        </linearGradient>

        <!-- MOP MATERIALS -->
        <linearGradient id="handleWood" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#4A3828"/>
          <stop offset="20%" stop-color="#6A5038"/>
          <stop offset="50%" stop-color="#7A6048"/>
          <stop offset="80%" stop-color="#6A5038"/>
          <stop offset="100%" stop-color="#3A2818"/>
        </linearGradient>

        <linearGradient id="handleHighlight" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#A08868" stop-opacity="0"/>
          <stop offset="35%" stop-color="#A08868" stop-opacity="0.12"/>
          <stop offset="65%" stop-color="#A08868" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#A08868" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#D0D0D0"/>
          <stop offset="25%" stop-color="#B8B8B8"/>
          <stop offset="50%" stop-color="#A0A0A0"/>
          <stop offset="75%" stop-color="#909090"/>
          <stop offset="100%" stop-color="#787878"/>
        </linearGradient>

        <linearGradient id="metalPlate" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#C0C0C0"/>
          <stop offset="50%" stop-color="#A8A8A8"/>
          <stop offset="100%" stop-color="#888888"/>
        </linearGradient>

        <!-- Mop head plate -->
        <linearGradient id="plateGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#B8B8B8"/>
          <stop offset="50%" stop-color="#A0A0A0"/>
          <stop offset="100%" stop-color="#888888"/>
        </linearGradient>

        <!-- Mop strands -->
        <linearGradient id="strandBase" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#F0E8D8"/>
          <stop offset="25%" stop-color="#E8E0D0"/>
          <stop offset="60%" stop-color="#D8D0C0"/>
          <stop offset="100%" stop-color="#C8C0B0"/>
        </linearGradient>

        <linearGradient id="strandWet" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#D0C8B8"/>
          <stop offset="40%" stop-color="#B8A898"/>
          <stop offset="100%" stop-color="#A09080"/>
        </linearGradient>

        <linearGradient id="strandDirty" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#C0B0A0"/>
          <stop offset="50%" stop-color="#A89888"/>
          <stop offset="100%" stop-color="#887868"/>
        </linearGradient>

        <!-- Cleaned path sheen -->
        <linearGradient id="cleanSheen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFF8E8" stop-opacity="0"/>
          <stop offset="50%" stop-color="#FFF8E8" stop-opacity="0.04"/>
          <stop offset="100%" stop-color="#FFF8E8" stop-opacity="0"/>
        </linearGradient>

        <!-- VIGNETTE -->
        <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
          <stop offset="30%" stop-color="#000" stop-opacity="0"/>
          <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
        </radialGradient>

        <!-- SHADOW FILTERS -->
        <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="25"/>
          <feOffset dx="8" dy="16"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.18"/>
          </feComponentTransfer>
          <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <filter id="spillShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
          <feOffset dx="4" dy="8"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.22"/>
          </feComponentTransfer>
        </filter>

        <filter id="strandBlur">
          <feGaussianBlur stdDeviation="0.3"/>
        </filter>

        <filter id="wetGlow">
          <feGaussianBlur stdDeviation="2"/>
        </filter>

        <filter id="softGlow">
          <feGaussianBlur stdDeviation="6"/>
        </filter>

        <filter id="dropShadow">
          <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
          <feOffset dx="1" dy="3"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.25"/>
          </feComponentTransfer>
          <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <!-- Wood grain texture -->
        <pattern id="woodGrain" x="0" y="0" width="300" height="30" patternUnits="userSpaceOnUse">
          <path d="M0,8 Q75,5 150,9 Q225,6 300,8" fill="none" stroke="#000" stroke-width="0.3" opacity="0.06"/>
          <path d="M0,18 Q80,15 160,19 Q240,16 300,18" fill="none" stroke="#000" stroke-width="0.2" opacity="0.04"/>
          <path d="M0,25 Q60,23 120,26 Q180,24 240,25 Q300,24 300,25" fill="none" stroke="#000" stroke-width="0.15" opacity="0.03"/>
        </pattern>

        <pattern id="woodGrainDark" x="0" y="0" width="250" height="25" patternUnits="userSpaceOnUse">
          <path d="M0,6 Q60,4 125,7 Q190,5 250,6" fill="none" stroke="#000" stroke-width="0.25" opacity="0.05"/>
          <path d="M0,15 Q70,13 140,16 Q210,14 250,15" fill="none" stroke="#000" stroke-width="0.15" opacity="0.035"/>
        </pattern>

        <clipPath id="sceneClip">
          <rect x="0" y="0" width="1600" height="900"/>
        </clipPath>
      </defs>

      <g clip-path="url(#sceneClip)">
        <!-- ===== WALL ===== -->
        <rect x="0" y="0" width="1600" height="220" fill="url(#wallGrad)"/>
        <!-- Baseboard -->
        <rect x="0" y="200" width="1600" height="20" fill="#4A4038"/>
        <rect x="0" y="200" width="1600" height="1.5" fill="#5A5048" opacity="0.4"/>
        <rect x="0" y="218" width="1600" height="2" fill="#2A2420" opacity="0.5"/>

        <!-- ===== PERSPECTIVE HARDWOOD FLOOR ===== -->
        <!-- Vanishing point at (800, 220) - proper perspective convergence -->
        <rect x="0" y="220" width="1600" height="680" fill="url(#floorBase)"/>

        <!-- Perspective planks converging to vanishing point -->
        <!-- Row 1 - closest, widest -->
        <polygon points="0,900 1600,900 1560,810 40,810" fill="url(#plank1)"/>
        <polygon points="0,900 1600,900 1560,810 40,810" fill="url(#woodGrain)" opacity="0.6"/>
        <line x1="40" y1="810" x2="1560" y2="810" stroke="#2A1C10" stroke-width="2" opacity="0.35"/>

        <!-- Row 2 -->
        <polygon points="40,810 1560,810 1500,730 100,730" fill="url(#plank2)"/>
        <polygon points="40,810 1560,810 1500,730 100,730" fill="url(#woodGrain)" opacity="0.5"/>
        <line x1="100" y1="730" x2="1500" y2="730" stroke="#2A1C10" stroke-width="1.5" opacity="0.3"/>

        <!-- Row 3 -->
        <polygon points="100,730 1500,730 1430,660 170,660" fill="url(#plank3)"/>
        <polygon points="100,730 1500,730 1430,660 170,660" fill="url(#woodGrainDark)" opacity="0.45"/>
        <line x1="170" y1="660" x2="1430" y2="660" stroke="#2A1C10" stroke-width="1.2" opacity="0.28"/>

        <!-- Row 4 -->
        <polygon points="170,660 1430,660 1350,600 250,600" fill="url(#plank4)"/>
        <polygon points="170,660 1430,660 1350,600 250,600" fill="url(#woodGrain)" opacity="0.4"/>
        <line x1="250" y1="600" x2="1350" y2="600" stroke="#2A1C10" stroke-width="1" opacity="0.25"/>

        <!-- Row 5 -->
        <polygon points="250,600 1350,600 1260,548 340,548" fill="url(#plank1)"/>
        <polygon points="250,600 1350,600 1260,548 340,548" fill="url(#woodGrainDark)" opacity="0.35"/>
        <line x1="340" y1="548" x2="1260" y2="548" stroke="#2A1C10" stroke-width="0.8" opacity="0.22"/>

        <!-- Row 6 -->
        <polygon points="340,548 1260,548 1160,502 440,502" fill="url(#plank2)"/>
        <polygon points="340,548 1260,548 1160,502 440,502" fill="url(#woodGrain)" opacity="0.3"/>
        <line x1="440" y1="502" x2="1160" y2="502" stroke="#2A1C10" stroke-width="0.6" opacity="0.2"/>

        <!-- Row 7 -->
        <polygon points="440,502 1160,502 1050,462 550,462" fill="url(#plank3)"/>
        <polygon points="440,502 1160,502 1050,462 550,462" fill="url(#woodGrainDark)" opacity="0.25"/>
        <line x1="550" y1="462" x2="1050" y2="462" stroke="#2A1C10" stroke-width="0.5" opacity="0.18"/>

        <!-- Row 8 -->
        <polygon points="550,462 1050,462 940,428 660,428" fill="url(#plank4)"/>
        <polygon points="550,462 1050,462 940,428 660,428" fill="url(#woodGrain)" opacity="0.2"/>
        <line x1="660" y1="428" x2="940" y2="428" stroke="#2A1C10" stroke-width="0.4" opacity="0.15"/>

        <!-- Row 9 -->
        <polygon points="660,428 940,428 830,398 770,398" fill="url(#plank1)"/>
        <line x1="770" y1="398" x2="830" y2="398" stroke="#2A1C10" stroke-width="0.3" opacity="0.12"/>

        <!-- Row 10 - farthest -->
        <polygon points="770,398 830,398 805,375 795,375" fill="url(#plank2)"/>
        <line x1="795" y1="375" x2="805" y2="375" stroke="#2A1C10" stroke-width="0.2" opacity="0.1"/>

        <!-- Row 11 -->
        <polygon points="795,375 805,375 802,358 798,358" fill="url(#plank3)"/>
        <line x1="798" y1="358" x2="802" y2="358" stroke="#2A1C10" stroke-width="0.15" opacity="0.08"/>

        <!-- Row 12 -->
        <polygon points="798,358 802,358 800.5,340 800,340" fill="url(#plank4)"/>

        <!-- Row 13 -->
        <polygon points="800,340 800.5,340 800,325 800,325" fill="url(#plank1)"/>

        <!-- Row 14 -->
        <polygon points="800,325 800,325 800,310 800,310" fill="url(#plank2)"/>

        <!-- Row 15 -->
        <polygon points="800,310 800,310 800,295 800,295" fill="url(#plank3)"/>

        <!-- Row 16 -->
        <polygon points="800,295 800,295 800,280 800,280" fill="url(#plank4)"/>

        <!-- Row 17 -->
        <polygon points="800,280 800,280 800,265 800,265" fill="url(#plank1)"/>

        <!-- Row 18 -->
        <polygon points="800,265 800,265 800,250 800,250" fill="url(#plank2)"/>

        <!-- Row 19 -->
        <polygon points="800,250 800,250 800,235 800,235" fill="url(#plank3)"/>

        <!-- Row 20 -->
        <polygon points="800,235 800,235 800,220 800,220" fill="url(#plank4)"/>

        <!-- Vertical plank seams (perspective-correct, staggered) -->
        <g stroke="#2A1C10" opacity="0.12">
          <!-- Row 1 -->
          <line x1="520" y1="810" x2="520" y2="900" stroke-width="1.8"/>
          <line x1="1040" y1="810" x2="1040" y2="900" stroke-width="1.8"/>
          <line x1="1420" y1="810" x2="1420" y2="900" stroke-width="1.5"/>

          <!-- Row 2 -->
          <line x1="320" y1="730" x2="320" y2="810" stroke-width="1.5"/>
          <line x1="800" y1="730" x2="800" y2="810" stroke-width="1.5"/>
          <line x1="1280" y1="730" x2="1280" y2="810" stroke-width="1.2"/>

          <!-- Row 3 -->
          <line x1="220" y1="660" x2="220" y2="730" stroke-width="1.2"/>
          <line x1="650" y1="660" x2="650" y2="730" stroke-width="1.2"/>
          <line x1="1100" y1="660" x2="1100" y2="730" stroke-width="1"/>
          <line x1="1380" y1="660" x2="1380" y2="730" stroke-width="0.8"/>

          <!-- Row 4 -->
          <line x1="380" y1="600" x2="380" y2="660" stroke-width="1"/>
          <line x1="800" y1="600" x2="800" y2="660" stroke-width="1"/>
          <line x1="1180" y1="600" x2="1180" y2="660" stroke-width="0.8"/>

          <!-- Row 5 -->
          <line x1="480" y1="548" x2="480" y2="600" stroke-width="0.8"/>
          <line x1="900" y1="548" x2="900" y2="600" stroke-width="0.8"/>
          <line x1="1200" y1="548" x2="1200" y2="600" stroke-width="0.6"/>

          <!-- Row 6 -->
          <line x1="550" y1="502" x2="550" y2="548" stroke-width="0.6"/>
          <line x1="950" y1="502" x2="950" y2="548" stroke-width="0.6"/>
