<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archon's Ascension</title>
<style>
    :root {
        --void-deep: #07080f;
        --void-mid: #0d1025;
        --void-light: #151838;
        --nebula-purple: #2d1b69;
        --nebula-blue: #1a2744;
        --gold-bright: #f0c040;
        --gold-mid: #c8960a;
        --gold-dim: #8a6a1a;
        --gold-glow: rgba(240, 192, 64, 0.6);
        --cyan-bright: #5ce0d6;
        --cyan-dim: #2a7a74;
        --cyan-glow: rgba(92, 224, 214, 0.4);
        --text-primary: #e8e4dc;
        --text-secondary: #9a9588;
        --text-dim: #5a5548;
        --border-ornate: rgba(200, 150, 10, 0.25);
        --border-subtle: rgba(255, 255, 255, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background: var(--void-deep);
        color: var(--text-primary);
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* Background layers */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
            radial-gradient(ellipse 80% 60% at 30% 20%, rgba(45, 27, 105, 0.35) 0%, transparent 70%),
            radial-gradient(ellipse 60% 50% at 70% 80%, rgba(26, 39, 68, 0.4) 0%, transparent 60%),
            radial-gradient(ellipse 50% 40% at 50% 50%, rgba(15, 18, 40, 0.6) 0%, transparent 80%);
        pointer-events: none;
        z-index: 0;
    }

    body::after {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0L30 60M0 30L60 30' stroke='rgba(255,255,255,0.015)' stroke-width='1'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
    }

    /* --- Header --- */
    header {
        position: relative;
        z-index: 10;
        padding: 18px 40px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .title-wrap {
        text-align: center;
        position: relative;
        padding-bottom: 14px;
    }

    h1 {
        font-family: Georgia, 'Palatino Linotype', 'Times New Roman', serif;
        font-size: 1.75rem;
        font-weight: 400;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--text-primary);
        text-shadow: 0 0 30px rgba(240, 192, 64, 0.15);
        margin: 0;
    }

    .subtitle {
        font-size: 0.7rem;
        color: var(--gold-mid);
        letter-spacing: 0.35em;
        text-transform: uppercase;
        margin-top: 6px;
        font-weight: 600;
    }

    .header-line {
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--border-ornate), transparent);
        position: relative;
    }

    .header-line::before, .header-line::after {
        content: '';
        position: absolute;
        top: -3px;
        width: 8px;
        height: 7px;
        background: var(--gold-mid);
        clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }
    .header-line::before { left: calc(35% - 4px); }
    .header-line::after { right: calc(35% - 4px); }

    /* --- Main Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        z-index: 1;
        overflow: hidden;
    }

    /* --- Sidebar --- */
    aside {
        width: 280px;
        min-width: 280px;
        background: linear-gradient(180deg, rgba(10, 12, 24, 0.95) 0%, rgba(7, 8, 15, 0.98) 100%);
        border-right: 1px solid var(--border-subtle);
        padding: 28px 24px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        position: relative;
        overflow-y: auto;
    }

    aside::before {
        content: '';
        position: absolute;
        top: 0; right: 0;
        width: 1px;
        height: 100%;
        background: linear-gradient(180deg, var(--gold-dim), transparent 40%, transparent 60%, var(--gold-dim));
        opacity: 0.4;
    }

    .stat-block { display: flex; flex-direction: column; gap: 8px; }

    .level-display {
        display: flex;
        align-items: baseline;
        gap: 12px;
    }

    .level-num {
        font-family: Georgia, 'Palatino Linotype', serif;
        font-size: 3.5rem;
        line-height: 1;
        color: var(--text-primary);
        font-weight: 400;
        text-shadow: 0 0 20px rgba(240, 192, 64, 0.1);
    }

    .level-label {
        font-size: 0.85rem;
        text-transform: uppercase;
        color: var(--text-secondary);
        letter-spacing: 0.1em;
        font-weight: 600;
    }

    .xp-container { margin-top: 4px; }

    .xp-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--text-secondary);
        margin-bottom: 6px;
        letter-spacing: 0.03em;
    }

    .xp-bar-bg {
        height: 6px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 3px;
        overflow: hidden;
        position: relative;
    }

    .xp-bar-fill {
        height: 100%;
        width: 62%;
        background: linear-gradient(90deg, var(--gold-mid), var(--gold-bright));
        border-radius: 3px;
        position: relative;
        box-shadow: 0 0 12px var(--gold-glow), inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .xp-bar-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
        animation: xpShimmer 3s ease-in-out infinite;
    }

    @keyframes xpShimmer {
        0%, 100% { opacity: 0.3; transform: translateX(-100%); }
        50% { opacity: 1; transform: translateX(100%); }
    }

    .points-display {
        background: linear-gradient(135deg, rgba(200, 150, 10, 0.08) 0%, rgba(200, 150, 10, 0.02) 100%);
        padding: 16px;
        border: 1px solid rgba(200, 150, 10, 0.15);
        border-radius: 2px;
        text-align: center;
        position: relative;
    }

    .points-display::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 2px;
        background: linear-gradient(135deg, var(--gold-dim), transparent, var(--gold-dim));
        opacity: 0.3;
        z-index: -1;
    }

    .points-val {
        font-family: Georgia, serif;
        font-size: 2.2rem;
        color: var(--gold-bright);
        display: block;
        text-shadow: 0 0 15px var(--gold-glow);
        line-height: 1;
    }

    .points-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-secondary);
        margin-top: 6px;
        display: block;
    }

    .character-details {
        margin-top: auto;
        border-top: 1px solid var(--border-subtle);
        padding-top: 20px;
    }

    .char-name {
        font-family: Georgia, serif;
        font-size: 1.3rem;
        font-weight: 400;
        margin-bottom: 2px;
        color: var(--text-primary);
    }

    .char-class {
        color: var(--text-secondary);
        font-size: 0.78rem;
        margin-bottom: 16px;
        letter-spacing: 0.02em;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 7px;
        font-size: 0.82rem;
        padding: 2px 0;
    }
    .stat-row span:first-child { color: var(--text-secondary); }
    .stat-row span:last-child {
        font-weight: 600;
        color: var(--text-primary);
        font-family: Georgia, serif;
    }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(ellipse at 50% 40%, rgba(20, 25, 55, 0.4) 0%, transparent 70%);
    }

    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 0;
        left: 0;
        width: 1400px;
        height: 1200px;
        transform-origin: 0 0;
        will-change: transform;
    }

    /* Background decorative elements in tree */
    .tree-bg-decor {
        position: absolute;
        width: 400px;
        height: 400px;
        border: 1px solid rgba(200, 150, 10, 0.04);
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }

    .tree-bg-decor::before {
        content: '';
        position: absolute;
        inset: 40px;
        border: 1px solid rgba(200, 150, 10, 0.03);
        border-radius: 50%;
    }

    .tree-bg-decor::after {
        content: '';
        position: absolute;
        inset: 80px;
        border: 1px solid rgba(200, 150, 10, 0.02);
        border-radius: 50%;
    }

    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
    }

    .connection-line {
        stroke: rgba(90, 85, 72, 0.2);
        stroke-width: 1.5;
        fill: none;
        transition: all 0.6s ease;
    }

    .connection-line.active {
        stroke: var(--gold-mid);
        stroke-width: 2;
        filter: drop-shadow(0 0 4px var(--gold-glow));
        stroke-dasharray: 8 4;
        animation: flowDash 2s linear infinite;
    }

    .connection-line.available {
        stroke: rgba(92, 224, 214, 0.15);
        stroke-dasharray: 4 6;
    }

    @keyframes flowDash {
        to { stroke-dashoffset: -24; }
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        width: 64px;
        height: 64px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .node:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }

    .node-hex {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.4s ease;
    }

    /* Hex shape using clip-path */
    .node-hex-bg {
        position: absolute;
        inset: 0;
        clip-path: polygon(50% 0%, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%);
        background: rgba(20, 22, 40, 0.9);
        border: none;
        transition: all 0.4s ease;
    }

    .node-hex-border {
        position: absolute;
        inset: 0;
        clip-path: polygon(50% 0%, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%);
        background: rgba(90, 85, 72, 0.4);
        transition: all 0.4s ease;
    }

    .node-hex-border::after {
        content: '';
        position: absolute;
        inset: 2px;
        clip-path: polygon(50% 0%, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%);
        background: rgba(15, 16, 30, 0.95);
    }

    /* Inner ring */
    .node-ring {
        position: absolute;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(90, 85, 72, 0.3);
        transition: all 0.4s ease;
    }

    .node-icon {
        width: 22px;
        height: 22px;
        position: relative;
        z-index: 2;
        fill: var(--text-dim);
        transition: all 0.4s ease;
        filter: drop-shadow(0 0 0 transparent);
    }

    /* --- Unlocked State --- */
    .node.unlocked .node-hex-bg {
        background: linear-gradient(135deg, rgba(200, 150, 10, 0.25) 0%, rgba(138, 106, 26, 0.15) 100%);
    }

    .node.unlocked .node-hex-border {
        background: var(--gold-mid);
    }

    .node.unlocked .node-hex-border::after {
        background: linear-gradient(135deg, #1a1508 0%, #0d0b04 100%);
    }

    .node.unlocked .node-ring {
        border-color: var(--gold-mid);
        box-shadow: 0 0 12px var(--gold-glow), inset 0 0 8px rgba(240, 192, 64, 0.1);
    }

    .node.unlocked .node-icon {
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 6px var(--gold-glow));
    }

    .node.unlocked::after {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
        opacity: 0.3;
        animation: pulseGlow 3s ease-in-out infinite;
        pointer-events: none;
    }

    @keyframes pulseGlow {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.1); }
    }

    /* --- Available State --- */
    .node.available .node-hex-border {
        background: rgba(92, 224, 214, 0.3);
    }

    .node.available .node-ring {
        border-color: rgba(92, 224, 214, 0.3);
    }

    .node.available .node-icon {
        fill: var(--cyan-dim);
    }

    .node.available:hover .node-hex-bg {
        background: rgba(92, 224, 214, 0.08);
    }

    .node.available:hover .node-hex-border {
        background: var(--cyan-bright);
    }

    .node.available:hover .node-icon {
        fill: var(--cyan-bright);
        filter: drop-shadow(0 0 4px var(--cyan-glow));
    }

    /* --- Ultimate Node --- */
    .node.ultimate .node-hex-bg {
        background: rgba(20, 22, 40, 0.95);
    }

    .node.ultimate.unlocked .node-hex-bg {
        background: linear-gradient(135deg, rgba(200, 100, 200, 0.2) 0%, rgba(100, 50, 150, 0.15) 100%);
    }

    .node.ultimate.unlocked .node-hex-border {
        background: #c080d0;
    }

    .node.ultimate.unlocked .node-ring {
        border-color: #c080d0;
        box-shadow: 0 0 12px rgba(192, 128, 208, 0.5);
    }

    .node.ultimate.unlocked .node-icon {
        fill: #e0a0f0;
        filter: drop-shadow(0 0 6px rgba(192, 128, 208, 0.6));
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: linear-gradient(135deg, rgba(12, 14, 28, 0.97) 0%, rgba(8, 9, 18, 0.98) 100%);
        border: 1px solid rgba(200, 150, 10, 0.2);
        padding: 18px 20px;
        width: 290px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.25s ease, transform 0.25s ease;
        z-index: 100;
        box-shadow: 0 15px 40px rgba(0,0,0,0.7), 0 0 30px rgba(200, 150, 10, 0.05);
        backdrop-filter: blur(12px);
    }

    .tooltip::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--gold-mid), transparent);
        opacity: 0.6;
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        color: var(--gold-bright);
        font-family: Georgia, serif;
        margin-bottom: 4px;
        font-size: 1.05rem;
        font-weight: 400;
        letter-spacing: 0.02em;
    }

    .tooltip .type {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--text-secondary);
        margin-bottom: 10px;
        letter-spacing: 0.12em;
        font-weight: 600;
    }

    .tooltip .type.active-type { color: var(--cyan-bright); }
    .tooltip .type.ultimate-type { color: #c080d0; }

    .tooltip p {
        font-size: 0.82rem;
        line-height: 1.55;
        color: #b0aba0;
    }

    .tooltip .req {
        margin-top: 12px;
        font-size: 0.7rem;
        color: #c06060;
        display: none;
        padding-top: 8px;
        border-top: 1px solid rgba(255,255,255,0.05);
        letter-spacing: 0.02em;
    }

    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-secondary); }
    .tooltip.locked { border-color: rgba(255,255,255,0.08); }
    .tooltip.locked::before { background: linear-gradient(90deg, transparent, var(--text-dim), transparent); }

    /* --- Floating Particles --- */
    .particle {
        position: absolute;
        width: 2px;
        height: 2px;
        background: var(--gold-bright);
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
        opacity: 0;
    }

    /* --- Zoom indicator --- */
    .zoom-controls {
        position: absolute;
        bottom: 20px;
        right: 20px;
        display: flex;
        gap: 8px;
        z-index: 20;
    }

    .zoom-btn {
        width: 36px;
        height: 36px;
        background: rgba(12, 14, 28, 0.9);
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
        font-size: 1.1rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        font-family: inherit;
    }

    .zoom-btn:hover {
        border-color: var(--gold-dim);
        color: var(--gold-bright);
    }

    /* --- Legend --- */
    .legend {
        position: absolute;
        bottom: 20px;
        left: 20px;
        display: flex;
        gap: 16px;
        z-index: 20;
        font-size: 0.68rem;
        color: var(--text-secondary);
        letter-spacing: 0.05em;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .legend-dot {
        width: 8px;
        height: 8px;
        clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }

    .legend-dot.unlocked { background: var(--gold-mid); }
    .legend-dot.available { background: var(--cyan-dim); }
    .legend-dot.locked { background: var(--text-dim); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(200, 150, 10, 0.15); border-radius: 2px; }
</style>
</head>
<body>

    <header>
        <div class="title-wrap">
            <h1>Archon's Ascension</h1>
            <div class="subtitle">Class: Void Walker</div>
        </div>
        <div class="header-line"></div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="stat-block">
                <div class="level-display">
                    <span class="level-num">42</span>
                    <span class="level-label">Level</span>
                </div>
                <div class="xp-container">
                    <div class="xp-labels">
                        <span>XP Progress</span>
                        <span>12,450 / 20,000</span>
                    </div>
                    <div class="xp-bar-bg">
                        <div class="xp-bar-fill"></div>
                    </div>
                </div>
            </div>

            <div class="points-display">
                <span class="points-val">3</span>
                <span class="points-label">Skill Points Available</span>
            </div>

            <div class="character-details">
                <h2 class="char-name">Kaelen Thorne</h2>
                <div class="char-class">Duelist / Arcanist</div>
                <div class="stat-row"><span>Strength</span><span>14</span></div>
                <div class="stat-row"><span>Dexterity</span><span>28</span></div>
                <div class="stat-row"><span>Intelligence</span><span>35</span></div>
                <div class="stat-row"><span>Vitality</span><span>12</span></div>
            </div>
        </aside>

        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <div class="tree-bg-decor"></div>
                <svg class="connections" id="svgConnections"></svg>
            </div>

            <div class="legend">
                <div class="legend-item"><div class="legend-dot unlocked"></div>Unlocked</div>
                <div class="legend-item"><div class="legend-dot available"></div>Available</div>
                <div class="legend-item"><div class="legend-dot locked"></div>Locked</div>
            </div>

            <div class="zoom-controls">
                <button class="zoom-btn" id="zoomIn">+</button>
                <button class="zoom-btn" id="zoomOut">−</button>
                <button class="zoom-btn" id="zoomReset" style="font-size:0.7rem;">⌂</button>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    const skills = [

        { id: 'dex2', x: 1060, y: 380, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks. Evasion grants 2s of shadow immunity.", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 1180, y: 540, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind. Crits apply void bleed for 8s.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1060, y: 540, name: "Dual Wield", type: "Passive", desc: "Unlock ability to hold two weapons. Attack speed increased by 15%.", unlocked: false, req: 'dex2' },
        { id: 'dex5', x: 1280, y: 700, name: "Shadow Step", type: "Active", desc: "Teleport behind target and strike for 200% damage. Cooldown: 6s.", unlocked: false, req: 'dex3' },

        { id: 'int2', x: 560, y: 460, name: "Fireball", type: "Active", desc: "Launch a projectile of condensed void-fire. Pierces through enemies.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 840, y: 460, name: "Frost Nova", type: "Active", desc: "Freeze enemies in an 8m radius for 2s. Slows by 50% for 4s after.", unlocked: false, req: 'int1' },
        { id: 'int4', x: 700, y: 620, name: "Arcane Shield", type: "Passive", desc: "Gain a shield absorbing 15% of max HP when casting spells.", unlocked: false, req: 'int2' },

        { id: 'hybrid', x: 700, y: 800, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows, leaving a clone that explodes. Cooldown: 20s.", unlocked: false, req: 'dex5' },
        { id: 'hybrid2', x: 420, y: 860, name: "Blood Pact", type: "Passive", desc: "Heal for 5% of damage dealt. Void energy sustains your vitality.", unlocked: false, req: 'str4' },
        { id: 'hybrid3', x: 980, y: 860, name: "Entropy", type: "Ultimate", desc: "Unleash chaotic void energy. All enemies take damage over time for 10s.", unlocked: false, req: 'int4' }
    ];

    const icons = {
        passive: "M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21l-6.18-3.27L5.82 21 8 14.14l-5-4.87 6.91-1.01L12 2z",
        active: "M13 2L3 14h9l-1 10 10-12h-9l1-10z",
        ultimate: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
    };

    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;

        panX = cw / 2 - 700;
        panY = ch / 2 - 400;
        updateTransform();

        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''} ${skill.type === 'Ultimate' ? 'ultimate' : ''}`;
            node.style.left = skill.x + 'px';
            node.style.top = skill.y + 'px';
            node.dataset.id = skill.id;

            let iconPath = icons.passive;
            if (skill.type === 'Active') iconPath = icons.active;
            if (skill.type === 'Ultimate') iconPath = icons.ultimate;

            node.innerHTML = `
                <div class="node-hex">
                    <div class="node-hex-border"></div>
                    <div class="node-hex-bg"></div>
                    <div class="node-ring"></div>
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mousemove', (e) => moveTooltip(e));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawLines();
        createParticles();
    }

    function drawLines() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const midX = (parent.x + skill.x) / 2;
                    const midY = (parent.y + skill.y) / 2;
                    const cpOffset = 30;

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const d = `M${parent.x},${parent.y} C${midX},${midY - cpOffset} ${midX},${midY + cpOffset} ${skill.x},${skill.y}`;
                    path.setAttribute('d', d);

                    if (skill.unlocked) {
                        path.classList.add('active');
                    } else {
                        const parentUnlocked = parent.unlocked;
                        if (parentUnlocked) {
                            path.classList.add('available');
                        }
                    }

                    svg.appendChild(path);
                }
            }
        });
    }

    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;

        ttType.className = 'type';
        if (skill.type === 'Active') ttType.classList.add('active-type');
        if (skill.type === 'Ultimate') ttType.classList.add('ultimate-type');

        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        moveTooltip(e);
    }

    function moveTooltip(e) {
        let x = e.clientX + 20;
        let y = e.clientY - 10;
        if (x + 300 > window.innerWidth) x = e.clientX - 310;
        if (y + 150 > window.innerHeight) y = e.clientY - 150;
        tooltip.style.left = x + 'px';
        tooltip.style.top = y + 'px';
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        if (!skill) return;

        if (skill.unlocked) return;

        const parent = skills.find(s => s.id === skill.req);
        if (parent && parent.unlocked) {
            skill.unlocked = true;
            updateVisuals();
        }
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            if (!s) return;

            el.classList.remove('unlocked', 'available', 'ultimate');
            if (s.type === 'Ultimate') el.classList.add('ultimate');

            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) {
                    el.classList.add('available');
                }
            }
        });

        drawLines();
    }

    // Pan & Zoom
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0, panY = 0;
    let scale = 1;

    function updateTransform() {
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node') || e.target.closest('.zoom-btn')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = -e.deltaY * 0.001;
        const newScale = Math.min(Math.max(0.4, scale + delta), 2.5);

        const rect = container.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        const ratio = (newScale - scale) / scale;
        panX -= mx * ratio;
        panY -= my * ratio;

        scale = newScale;
        updateTransform();
    }, { passive: false });

    document.getElementById('zoomIn').addEventListener('click', () => {
        scale = Math.min(2.5, scale + 0.15);
        updateTransform();
    });

    document.getElementById('zoomOut').addEventListener('click', () => {
        scale = Math.max(0.4, scale - 0.15);
        updateTransform();
    });

    document.getElementById('zoomReset').addEventListener('click', () => {
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        panX = cw / 2 - 700;
        panY = ch / 2 - 400;
        scale = 1;
        updateTransform();
    });

    // Floating particles
    function createParticles() {
        const container = document.getElementById('treeContainer');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.animationDuration = (4 + Math.random() * 8) + 's';
            p.style.animationDelay = Math.random() * 5 + 's';
            p.style.animation = `floatParticle ${4 + Math.random() * 8}s ease-in-out ${Math.random() * 5}s infinite`;
            container.appendChild(p);
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes floatParticle {
                0%, 100% { opacity: 0; transform: translateY(0) scale(0.5); }
                20% { opacity: 0.6; transform: translateY(-20px) scale(1); }
                50% { opacity: 0.3; transform: translateY(-50px) scale(0.8); }
                80% { opacity: 0.5; transform: translateY(-80px) scale(1.1); }
            }
        `;
        document.head.appendChild(style);
    }

    init();
</script>
</body>
</html>
