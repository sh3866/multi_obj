<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina — Capture & Collection</title>
<style>
  :root {
    --bg-deep: #050510;
    --bg-mid: #0a0a22;
    --cyan: #4de8ff;
    --cyan-soft: rgba(77,232,255,0.12);
    --magenta: #d946ef;
    --magenta-soft: rgba(217,70,239,0.10);
    --amber: #fbbf24;
    --amber-soft: rgba(251,191,36,0.10);
    --lime: #34d399;
    --lime-soft: rgba(52,211,153,0.10);
    --rose: #fb7185;
    --rose-soft: rgba(251,113,133,0.10);
    --white: #f1f5f9;
    --white-muted: rgba(241,245,249,0.45);
    --white-dim: rgba(241,245,249,0.12);
    --glass: rgba(15,15,35,0.45);
    --glass-border: rgba(255,255,255,0.07);
    --glass-highlight: rgba(255,255,255,0.04);
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg-deep);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--white);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .scene {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  .atmosphere {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(77,232,255,0.03) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 20% 100%, rgba(217,70,239,0.025) 0%, transparent 50%),
      radial-gradient(ellipse 40% 35% at 80% 80%, rgba(251,191,36,0.02) 0%, transparent 45%);
    z-index: 0;
    pointer-events: none;
  }

  #bgCanvas {
    position: absolute; inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  #gameCanvas {
    position: absolute; inset: 0;
    z-index: 5;
    cursor: none;
  }

  .ui-layer {
    position: absolute; inset: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(1.2rem, 3vw, 2.5rem) clamp(1.5rem, 3.5vw, 3rem);
  }

  /* Top bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .brand h1 {
    font-size: clamp(1.5rem, 3.5vw, 2.2rem);
    font-weight: 200;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--white);
    line-height: 1;
    text-shadow: 0 0 40px rgba(77,232,255,0.15);
  }

  .brand h1 em {
    font-style: normal;
    font-weight: 600;
    background: linear-gradient(135deg, var(--cyan), var(--magenta));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .brand .tagline {
    font-size: clamp(0.45rem, 0.9vw, 0.55rem);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--white-muted);
    font-weight: 400;
    margin-left: 0.05em;
  }

  /* HUD Card */
  .hud-card {
    display: flex;
    align-items: center;
    gap: clamp(0.5rem, 1.2vw, 0.8rem);
    background: var(--glass);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: clamp(0.5rem, 1.1vw, 0.65rem) clamp(0.8rem, 1.8vw, 1.2rem);
    box-shadow:
      0 8px 32px rgba(0,0,0,0.3),
      inset 0 1px 0 var(--glass-highlight);
    position: relative;
    overflow: hidden;
  }

  .hud-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
  }

  .hud-icon {
    width: clamp(20px, 2.8vw, 28px);
    height: clamp(20px, 2.8vw, 28px);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border-radius: 10px;
    background: var(--cyan-soft);
    position: relative;
  }

  .hud-icon svg {
    width: 60%; height: 60%;
    filter: drop-shadow(0 0 4px rgba(77,232,255,0.5));
  }

  .hud-content {
    display: flex;
    flex-direction: column;
    gap: 0.05rem;
    min-width: 0;
  }

  .hud-value {
    font-size: clamp(1.15rem, 2.4vw, 1.55rem);
    font-weight: 700;
    color: var(--white);
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .hud-label {
    font-size: clamp(0.4rem, 0.8vw, 0.5rem);
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--white-muted);
    font-weight: 500;
  }

  /* Bottom */
  .bottom-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(0.6rem, 1.8vw, 1rem);
    pointer-events: auto;
  }

  /* Progress Ring */
  .progress-container {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    opacity: 0.6;
    transition: opacity 0.3s;
  }
  .progress-container:hover { opacity: 1; }

  .progress-ring-wrap {
    position: relative;
    width: clamp(28px, 4vw, 36px);
    height: clamp(28px, 4vw, 36px);
  }

  .progress-ring-wrap svg {
    transform: rotate(-90deg);
    width: 100%; height: 100%;
  }

  .progress-ring-bg {
    fill: none;
    stroke: rgba(255,255,255,0.06);
    stroke-width: 2.5;
  }

  .progress-ring-fill {
    fill: none;
    stroke: url(#progressGrad);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-dasharray: 88;
    stroke-dashoffset: 88;
    transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    filter: drop-shadow(0 0 4px rgba(77,232,255,0.3));
  }

  .progress-label {
    font-size: 0.45rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--white-muted);
    font-weight: 500;
    white-space: nowrap;
  }

  /* Button */
  .btn-capture {
    position: relative;
    background: var(--glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    color: var(--white);
    font-family: inherit;
    font-size: clamp(0.55rem, 1vw, 0.65rem);
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding: clamp(0.7rem, 1.6vw, 0.85rem) clamp(2.2rem, 4.5vw, 3.5rem);
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow:
      0 4px 24px rgba(0,0,0,0.2),
      inset 0 1px 0 var(--glass-highlight);
    overflow: hidden;
  }

  .btn-capture::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50px;
    background: linear-gradient(135deg, var(--cyan-soft), var(--magenta-soft));
    opacity: 0;
    transition: opacity 0.4s;
  }

  .btn-capture:hover {
    transform: translateY(-1px);
    border-color: rgba(255,255,255,0.12);
    box-shadow:
      0 8px 40px rgba(77,232,255,0.06),
      0 0 80px rgba(77,232,255,0.02),
      inset 0 1px 0 rgba(255,255,255,0.06);
  }

  .btn-capture:hover::before { opacity: 1; }

  .btn-capture:active {
    transform: translateY(0) scale(0.97);
    transition-duration: 0.12s;
  }

  .btn-capture span {
    position: relative;
    z-index: 1;
  }

  /* Toast */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.92) translateY(12px);
    background: rgba(5,5,16,0.75);
    backdrop-filter: blur(32px);
    -webkit-backdrop-filter: blur(32px);
    border: 1px solid rgba(52,211,153,0.15);
    color: var(--lime);
    padding: 0.6rem 1.4rem;
    border-radius: 12px;
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 20;
    box-shadow: 0 0 60px rgba(52,211,153,0.05);
    white-space: nowrap;
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) translateY(0);
  }

  /* Vignette */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 65% 55% at 50% 50%, transparent 0%, rgba(5,5,16,0.6) 100%);
    z-index: 3;
    pointer-events: none;
  }

  /* Film grain */
  .grain {
    position: absolute; inset: 0;
    z-index: 4;
    pointer-events: none;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
  }

  @media (max-width: 600px) {
    .hud-card { padding: 0.45rem 0.7rem; border-radius: 12px; }
    .btn-capture { width: 85%; max-width: 240px; }
    .brand h1 { letter-spacing: 0.3em; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="atmosphere"></div>
  <canvas id="bgCanvas"></canvas>
  <canvas id="gameCanvas"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="ui-layer">
    <header class="top-bar">
      <div class="brand">
        <h1><em>L</em>umina</h1>
        <div class="tagline">Capture & Collection</div>
      </div>
      <div class="hud-card">
        <div class="hud-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#4de8ff"/>
          </svg>
        </div>
        <div class="hud-content">
          <div class="hud-value" id="scoreDisplay">0</div>
          <div class="hud-label">Captured</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">✦ Specimen Captured</div>

    <footer class="bottom-bar">
      <div class="progress-container">
        <div class="progress-ring-wrap">
          <svg viewBox="0 0 32 32">
            <defs>
              <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#4de8ff"/>
                <stop offset="100%" stop-color="#d946ef"/>
              </linearGradient>
            </defs>
            <circle class="progress-ring-bg" cx="16" cy="16" r="14"/>
            <circle class="progress-ring-fill" id="progressRing" cx="16" cy="16" r="14"/>
          </svg>
        </div>
        <div class="progress-label">Collection</div>
      </div>
      <button class="btn-capture" onclick="resetGame()">
        <span>New Collection</span>
      </button>
    </footer>
  </div>
</div>

<script>
(function() {
  // === BACKGROUND CANVAS ===
  const bgCanvas = document.getElementById('bgCanvas');
  const bgCtx = bgCanvas.getContext('2d');
  let bgW, bgH;
  let bgStars = [];
  let nebulaClouds = [];

  function initBg() {
    bgW = bgCanvas.width = window.innerWidth;
    bgH = bgCanvas.height = window.innerHeight;
    bgStars = [];
    const count = Math.floor((bgW * bgH) / 2800);
    for (let i = 0; i < count; i++) {
      bgStars.push({
        x: Math.random() * bgW,
        y: Math.random() * bgH,
        r: Math.random() * 1.2 + 0.2,
        alpha: Math.random() * 0.35 + 0.03,
        pulse: Math.random() * Math.PI * 2,
        pulseSpeed: Math.random() * 0.006 + 0.002,
        twinkle: Math.random() > 0.65
      });
    }
    nebulaClouds = [];
    for (let i = 0; i < 5; i++) {
      nebulaClouds.push({
        x: Math.random() * bgW,
        y: Math.random() * bgH,
        rx: Math.random() * 350 + 200,
        ry: Math.random() * 220 + 120,
        color: [
          'rgba(77,232,255,',
          'rgba(217,70,239,',
          'rgba(251,191,36,',
          'rgba(52,211,153,'
        ][Math.floor(Math.random() * 4)],
        alpha: Math.random() * 0.012 + 0.004,
        drift: (Math.random() - 0.5) * 0.06,
        driftY: (Math.random() - 0.5) * 0.03,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  function drawBg() {
    bgCtx.clearRect(0, 0, bgW, bgH);

    nebulaClouds.forEach(c => {
      c.phase += 0.0015;
      c.x += c.drift;
      c.y += c.driftY;
      if (c.x < -c.rx) c.x = bgW + c.rx;
      if (c.x > bgW + c.rx) c.x = -c.rx;
      if (c.y < -c.ry) c.y = bgH + c.ry;
      if (c.y > bgH + c.ry) c.y = -c.ry;

      const grad = bgCtx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.rx);
      grad.addColorStop(0, c.color + (c.alpha * (0.7 + Math.sin(c.phase) * 0.3)) + ')');
      grad.addColorStop(1, c.color + '0)');
      bgCtx.fillStyle = grad;
      bgCtx.beginPath();
      bgCtx.ellipse(c.x, c.y, c.rx, c.ry, 0, 0, Math.PI * 2);
      bgCtx.fill();
    });

    bgStars.forEach(s => {
      s.pulse += s.pulseSpeed;
      let a = s.alpha;
      if (s.twinkle) {
        a = s.alpha * (0.4 + Math.sin(s.pulse * 2.5) * 0.6);
      } else {
        a = s.alpha + Math.sin(s.pulse) * 0.06;
      }
      a = Math.max(0.01, a);
      bgCtx.beginPath();
      bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      bgCtx.fillStyle = `rgba(200,210,255,${a})`;
      bgCtx.fill();
    });
  }

  initBg();
  window.addEventListener('resize', initBg);

  // === MAIN GAME CANVAS ===
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');
  const progressRing = document.getElementById('progressRing');

  let W, H;
  let score = 0;
  const MAX_CAPTURES = 20;
  let particles = [];
  let creatures = [];
  let mouse = { x: -9999, y: -9999 };
  let isMouseDown = false;
  let netAngle = 0;
  let ambientParticles = [];
  let screenShake = { x: 0, y: 0, intensity: 0 };
  let time = 0;
  let captureFlash = 0;

  const PALETTES = [
    { main: '#4de8ff', glow: 'rgba(77,232,255,', dim: 'rgba(77,232,255,', name: 'Cyan' },
    { main: '#d946ef', glow: 'rgba(217,70,239,', dim: 'rgba(217,70,239,', name: 'Violet' },
    { main: '#34d399', glow: 'rgba(52,211,153,', dim: 'rgba(52,211,153,', name: 'Moss' },
    { main: '#fbbf24', glow: 'rgba(251,191,36,', dim: 'rgba(251,191,36,', name: 'Amber' },
    { main: '#fb7185', glow: 'rgba(251,113,133,', dim: 'rgba(251,113,133,', name: 'Rose' }
  ];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mousedown', () => { isMouseDown = true; });
  window.addEventListener('mouseup', () => { isMouseDown = false; checkCatch(); });
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => { isMouseDown = false; checkCatch(); });

  // === CLASSES ===

  class AmbientParticle {
    constructor() {
      this.reset();
      this.y = Math.random() * H;
    }
    reset() {
      this.x = Math.random() * W;
      this.y = H + 20;
      this.r = Math.random() * 1.8 + 0.3;
      this.speed = Math.random() * 0.2 + 0.05;
      this.drift = (Math.random() - 0.5) * 0.15;
      this.alpha = Math.random() * 0.1 + 0.02;
      this.palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
      this.phase = Math.random() * Math.PI * 2;
    }
    update() {
      this.y -= this.speed;
      this.phase += 0.008;
      this.x += this.drift + Math.sin(this.phase) * 0.1;
      if (this.y < -10) this.reset();
    }
    draw(c) {
      const a = this.alpha * (0.6 + Math.sin(this.phase) * 0.4);
      c.beginPath();
      c.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      c.fillStyle = this.palette.glow + a + ')';
      c.fill();
    }
  }

  class Particle {
    constructor(x, y, color, type, opts) {
      this.x = x;
      this.y = y;
      this.color = color;
      this.type = type || 'burst';
      this.opts = opts || {};
      const angle = Math.random() * Math.PI * 2;
      const speed = this.type === 'burst' ? Math.random() * 5 + 1.5 :
                    this.type === 'ring' ? Math.random() * 2 + 1 :
                    Math.random() * 1 + 0.5;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.015 + 0.008;
      this.size = Math.random() * 3 + 1;
      this.gravity = this.opts.gravity || 0;
      this.shape = this.opts.shape || 'circle';
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += this.gravity;
      this.vx *= 0.97;
      this.vy *= 0.97;
      this.life -= this.decay;
      this.size *= 0.99;
    }
    draw(c) {
      if (this.life <= 0) return;
      c.globalAlpha = this.life * 0.85;
      c.fillStyle = this.color;
      c.shadowBlur = 8;
      c.shadowColor = this.color;
      if (this.shape === 'circle') {
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
      } else {
        c.save();
        c.translate(this.x, this.y);
        c.rotate(this.life * 3);
        c.fillRect(-this.size/2, -this.size/2, this.size, this.size);
        c.restore();
      }
      c.shadowBlur = 0;
      c.globalAlpha = 1;
    }
  }

  class Creature {
    constructor(type) {
      this.type = type || Math.floor(Math.random() * 4);
      this.palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
      this.color = this.palette.main;
      this.reset();
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.innerPhase = Math.random() * Math.PI * 2;
      this.born = time;
    }

    reset() {
      const side = Math.floor(Math.random() * 4);
      if (side === 0) { this.x = -100; this.y = Math.random() * H; }
      else if (side === 1) { this.x = W + 100; this.y = Math.random() * H; }
      else if (side === 2) { this.x = Math.random() * W; this.y = -100; }
      else { this.x = Math.random() * W; this.y = H + 100; }

      this.vx = (Math.random() - 0.5) * 0.6;
      this.vy = (Math.random() - 0.5) * 0.6;
      this.baseRadius = Math.random() * 12 + 18;
      this.phase = Math.random() * Math.PI * 2;
      this.phaseSpeed = Math.random() * 0.012 + 0.006;
      this.wobbleAmp = Math.random() * 0.35 + 0.2;
      this.isCaught = false;
      this.catchScale = 1;
      this.alpha = 1;
      this.trail = [];
      this.bobPhase = Math.random() * Math.PI * 2;
      this.pulsePhase = Math.random() * Math.PI * 2;
    }

    update() {
      if (this.isCaught) {
        this.catchScale *= 0.91;
        this.alpha *= 0.92;
        return this.alpha > 0.01;
      }

      this.phase += this.phaseSpeed;
      this.bobPhase += 0.015;
      this.innerPhase += 0.025;
      this.pulsePhase += 0.02;

      this.x += this.vx + Math.sin(this.phase) * this.wobbleAmp;
      this.y += this.vy + Math.cos(this.phase * 0.5) * this.wobbleAmp * 0.35;

      this.trail.push({ x: this.x, y: this.y, a: 0.3 });
      if (this.trail.length > 18) this.trail.shift();
      this.trail.forEach(t => t.a *= 0.9);

      const margin = 80;
      if (this.x < margin) this.vx += 0.03;
      if (this.x > W - margin) this.vx -= 0.03;
      if (this.y < margin) this.vy += 0.03;
      if (this.y > H - margin) this.vy -= 0.03;

      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) {
        const force = ((150 - dist) / 150) * 0.5;
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }

      const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      if (speed > 2.2) {
        this.vx = (this.vx / speed) * 2.2;
        this.vy = (this.vy / speed) * 2.2;
      }

      return true;
    }

    draw(c) {
      if (this.alpha <= 0.01) return;
      c.save();
      c.translate(this.x, this.y);
      c.scale(this.catchScale, this.catchScale);
      c.globalAlpha = this.alpha;

      // Trail
      if (!this.isCaught && this.trail.length > 1) {
        for (let i = 0; i < this.trail.length; i++) {
          const t = this.trail[i];
          const ratio = i / this.trail.length;
          c.beginPath();
          c.arc(t.x - this.x, t.y - this.y, this.baseRadius * 0.2 * ratio, 0, Math.PI * 2);
          c.fillStyle = this.palette.glow + (t.a * ratio * 0.35) + ')';
          c.fill();
        }
      }

      // Outer glow
      const glowR = this.baseRadius * 2.8;
      const glow = c.createRadialGradient(0, 0, this.baseRadius * 0.2, 0, 0, glowR);
      glow.addColorStop(0, this.palette.glow + '0.18)');
      glow.addColorStop(0.4, this.palette.glow + '0.06)');
      glow.addColorStop(1, this.palette.glow + '0)');
      c.fillStyle = glow;
      c.beginPath();
      c.arc(0, 0, glowR, 0, Math.PI * 2);
      c.fill();

      const r = this.baseRadius;
      const p = this.phase;
      const pulse = 1 + Math.sin(this.pulsePhase) * 0.06;

      c.shadowBlur = 20;
      c.shadowColor = this.color;

      if (this.type === 0) {
        this.drawJellyfish(c, r * pulse, p);
      } else if (this.type === 1) {
        this.drawOrbWings(c, r * pulse, p);
      } else if (this.type === 2) {
        this.drawMoth(c, r * pulse, p);
      } else {
        this.drawLantern(c, r * pulse, p);
      }

      c.restore();
    }

    drawJellyfish(c, r, p) {
      // Dome
      c.beginPath();
      c.moveTo(-r * 0.85, r * 0.15);
      c.bezierCurveTo(-r * 0.95, -r * 0.6, r * 0.95, -r * 0.6, r * 0.85, r * 0.15);
      c.bezierCurveTo(r * 0.5, r * 0.5, r * 0.15, r * 0.35, 0, r * 0.3);
      c.bezierCurveTo(-r * 0.15, r * 0.35, -r * 0.5, r * 0.5, -r * 0.85, r * 0.15);
      const domeGrad = c.createRadialGradient(0, -r * 0.15, 0, 0, 0, r * 0.9);
      domeGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
      domeGrad.addColorStop(0.25, this.color);
      domeGrad.addColorStop(1, this.palette.glow + '0.5)');
      c.fillStyle = domeGrad;
      c.fill();

      // Tentacles
      c.shadowBlur = 10;
      c.strokeStyle = this.palette.glow + '0.45)';
      c.lineWidth = 1.5;
      for (let i = -2; i <= 2; i++) {
        c.beginPath();
        const tx = i * r * 0.25;
        c.moveTo(tx, r * 0.2);
        const wave = Math.sin(p * 2 + i * 0.7) * r * 0.3;
        c.bezierCurveTo(tx + wave, r * 0.7, tx - wave, r * 1.15, tx + wave * 0.3, r * 1.5);
        c.stroke();
      }

      // Inner core
      c.shadowBlur = 0;
      c.fillStyle = 'rgba(255,255,255,0.95)';
      c.beginPath();
      c.arc(0, -r * 0.12, r * 0.2, 0, Math.PI * 2);
      c.fill();

      // Core glow
      const coreGlow = c.createRadialGradient(0, -r * 0.12, 0, 0, -r * 0.12, r * 0.35);
      coreGlow.addColorStop(0, 'rgba(255,255,255,0.3)');
      coreGlow.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = coreGlow;
      c.beginPath();
      c.arc(0, -r * 0.12, r * 0.35, 0, Math.PI * 2);
      c.fill();
    }

    drawOrbWings(c, r, p) {
      const wingFlap = Math.sin(p * 3) * 0.2;
      for (let side = -1; side <= 1; side += 2) {
        c.beginPath();
        c.ellipse(side * r * 0.7, 0, r * 0.6, r * 0.35 + wingFlap * r * 0.12, side * 0.2, 0, Math.PI * 2);
        const wingGrad = c.createRadialGradient(side * r * 0.45, 0, 0, side * r * 0.45, 0, r * 0.6);
        wingGrad.addColorStop(0, this.palette.glow + '0.65)');
        wingGrad.addColorStop(1, this.palette.glow + '0.12)');
        c.fillStyle = wingGrad;
        c.fill();
      }

      c.shadowBlur = 18;
      const bodyGrad = c.createRadialGradient(0, 0, 0, 0, 0, r * 0.5);
      bodyGrad.addColorStop(0, '#fff');
      bodyGrad.addColorStop(0.35, this.color);
      bodyGrad.addColorStop(1, this.palette.glow + '0.35)');
      c.fillStyle = bodyGrad;
      c.beginPath();
      c.arc(0, 0, r * 0.45, 0, Math.PI * 2);
      c.fill();

      c.shadowBlur = 0;
      c.fillStyle = 'rgba(255,255,255,0.95)';
      c.beginPath();
      c.arc(0, 0, r * 0.15, 0, Math.PI * 2);
      c.fill();
    }

    drawMoth(c, r, p) {
      c.shadowBlur = 14;
      const bodyGrad = c.createRadialGradient(0, 0, 0, 0, 0, r * 0.65);
      bodyGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
      bodyGrad.addColorStop(0.45, this.color);
      bodyGrad.addColorStop(1, this.palette.glow + '0.3)');
      c.fillStyle = bodyGrad;
      c.beginPath();
      c.ellipse(0, 0, r * 0.2, r * 0.55, 0, 0, Math.PI * 2);
      c.fill();

      c.shadowBlur = 10;
      const flap = Math.sin(p * 3.5) * 0.15;
      for (let side = -1; side <= 1; side += 2) {
        c.beginPath();
        c.moveTo(side * r * 0.05, -r * 0.12);
        c.bezierCurveTo(side * r * 1.2, -r * 0.8 + flap * r, side * r * 1.4, r * 0.05, side * r * 0.05, r * 0.22);
        const wingGrad = c.createRadialGradient(side * r * 0.45, -r * 0.08, 0, side * r * 0.45, -r * 0.08, r * 0.9);
        wingGrad.addColorStop(0, this.palette.glow + '0.55)');
        wingGrad.addColorStop(1, this.palette.glow + '0.08)');
        c.fillStyle = wingGrad;
        c.fill();

        c.strokeStyle = this.palette.glow + '0.25)';
        c.lineWidth = 0.8;
        c.beginPath();
        c.arc(side * r * 0.35, 0, r * 0.22, 0, Math.PI * 2);
        c.stroke();
      }

      c.shadowBlur = 0;
      c.fillStyle = '#fff';
      c.beginPath();
      c.arc(0, -r * 0.1, r * 0.12, 0, Math.PI * 2);
      c.fill();
    }

    drawLantern(c, r, p) {
      c.shadowBlur = 16;
      const bodyGrad = c.createRadialGradient(0, 0, 0, 0, 0, r * 0.55);
      bodyGrad.addColorStop(0, 'rgba(255,255,255,0.95)');
      bodyGrad.addColorStop(0.3, this.color);
      bodyGrad.addColorStop(1, this.palette.glow + '0.3)');
      c.fillStyle = bodyGrad;
      c.beginPath();
      c.ellipse(0, 0, r * 0.42, r * 0.55, 0, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = this.palette.glow + '0.45)';
      c.beginPath();
      c.ellipse(0, -r * 0.5, r * 0.18, r * 0.1, 0, 0, Math.PI * 2);
      c.fill();

      c.shadowBlur = 8;
      c.strokeStyle = this.palette.glow + '0.35)';
      c.lineWidth = 1.2;
      const sway = Math.sin(p * 1.8) * r * 0.12;
      c.beginPath();
      c.moveTo(0, r * 0.55);
      c.bezierCurveTo(sway, r * 0.85, -sway, r * 1.05, sway * 0.4, r * 1.25);
      c.stroke();

      c.shadowBlur = 0;
      c.fillStyle = 'rgba(255,255,255,0.85)';
      c.beginPath();
      c.arc(0, 0, r * 0.13, 0, Math.PI * 2);
      c.fill();

      const pulseR = r * (0.75 + Math.sin(p * 1.8) * 0.12);
      c.strokeStyle = this.palette.glow + '0.18)';
      c.lineWidth = 0.8;
      c.beginPath();
      c.ellipse(0, 0, pulseR * 0.48, pulseR * 0.6, 0, 0, Math.PI * 2);
      c.stroke();
    }

    getBounds() {
      return { x: this.x, y: this.y, r: this.baseRadius * 1.4 };
    }
  }

  // === GAME FUNCTIONS ===

  function init() {
    creatures = [];
    const types = [0, 1, 2, 3, 0, 1, 2, 3];
    for (let i = 0; i < 8; i++) {
      creatures.push(new Creature(types[i % types.length]));
    }
    ambientParticles = [];
    for (let i = 0; i < 50; i++) {
      ambientParticles.push(new AmbientParticle());
    }
    score = 0;
    scoreEl.innerText = '0';
    progressRing.style.strokeDashoffset = '88';
    particles = [];
  }

  function checkCatch() {
    const catchRadius = 60;
    let caughtAny = false;

    creatures.forEach((c) => {
      if (c.isCaught) return;
      const b = c.getBounds();
      const dx = b.x - mouse.x;
      const dy = b.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < catchRadius + b.r * 0.4) {
        catchCreature(c);
        caughtAny = true;
      }
    });

    if (caughtAny) {
      screenShake.intensity = 5;
      captureFlash = 1;
      for (let i = 0; i < 14; i++) {
        const angle = (i / 14) * Math.PI * 2;
        particles.push(new Particle(
          mouse.x + Math.cos(angle) * 30,
          mouse.y + Math.sin(angle) * 30,
          'rgba(255,255,255,0.4)',
          'ring'
        ));
      }
    }
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;

    const pct = Math.min(score / MAX_CAPTURES, 1);
    const circumference = 88;
    progressRing.style.strokeDashoffset = circumference * (1 - pct);

    for (let i = 0; i < 30; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color, 'burst'));
    }
    for (let i = 0; i < 12; i++) {
      particles.push(new Particle(creature.x, creature.y, '#fff', 'burst', { shape: 'square' }));
    }

    toastEl.classList.add('active');
    clearTimeout(toastEl._timeout);
    toastEl._timeout = setTimeout(() => toastEl.classList.remove('active'), 1500);

    setTimeout(() => {
      const idx = creatures.indexOf(creature);
      if (idx !== -1) {
        creatures[idx] = new Creature(creature.type);
      }
    }, 3500);
  }

  function resetGame() {
    init();
  }
  window.resetGame = resetGame;
