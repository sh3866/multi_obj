<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina — Capture & Collection</title>
<style>
  :root {
    --bg-deep: #04040e;
    --bg-mid: #08081a;
    --cyan: #5ef0ff;
    --cyan-dim: rgba(94,240,255,0.15);
    --magenta: #e040fb;
    --magenta-dim: rgba(224,64,251,0.12);
    --amber: #ffd54f;
    --amber-dim: rgba(255,213,79,0.12);
    --lime: #4ade80;
    --rose: #fb7185;
    --white: #f0f2ff;
    --white-muted: rgba(240,242,255,0.35);
    --white-dim: rgba(240,242,255,0.08);
    --glass: rgba(10,10,30,0.55);
    --glass-border: rgba(255,255,255,0.06);
    --glass-border-bright: rgba(255,255,255,0.10);
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg-deep);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--white);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .scene {
    position: relative; width: 100%; height: 100%; overflow: hidden;
  }

  #bgCanvas { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  #gameCanvas { position: absolute; inset: 0; z-index: 5; cursor: none; }

  .ui-layer {
    position: absolute; inset: 0; z-index: 10; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: clamp(1.4rem, 3vw, 2.4rem) clamp(1.6rem, 3.5vw, 3.2rem);
  }

  /* ── TOP BAR ── */
  .top-bar {
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: auto;
  }

  .brand { display: flex; flex-direction: column; gap: 0.45rem; }

  .brand h1 {
    font-size: clamp(1.6rem, 3.8vw, 2.4rem);
    font-weight: 300;
    letter-spacing: 0.55em;
    text-transform: uppercase;
    color: var(--white);
    line-height: 1;
    text-shadow: 0 0 60px rgba(94,240,255,0.08);
  }

  .brand h1 .accent {
    font-weight: 700;
    background: linear-gradient(135deg, var(--cyan) 0%, #a78bfa 50%, var(--magenta) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .brand .tagline {
    font-size: clamp(0.4rem, 0.75vw, 0.5rem);
    letter-spacing: 0.55em;
    text-transform: uppercase;
    color: var(--white-muted);
    font-weight: 500;
    margin-left: 0.05em;
  }

  /* ── HUD CARD ── */
  .hud-card {
    display: flex; align-items: center; gap: 0.7rem;
    background: var(--glass);
    backdrop-filter: blur(32px);
    -webkit-backdrop-filter: blur(32px);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 0.55rem 1rem 0.55rem 0.6rem;
    box-shadow: 0 8px 40px rgba(0,0,0,0.35), inset 0 1px 0 var(--white-dim);
    position: relative; overflow: hidden;
  }

  .hud-card::after {
    content: '';
    position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(94,240,255,0.15), transparent);
  }

  .hud-icon {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    border-radius: 10px; background: var(--cyan-dim); flex-shrink: 0;
    position: relative;
  }

  .hud-icon::before {
    content: ''; position: absolute; inset: 0; border-radius: 10px;
    background: radial-gradient(circle at 50% 50%, rgba(94,240,255,0.2), transparent 70%);
  }

  .hud-icon svg { width: 16px; height: 16px; position: relative; z-index: 1; }

  .hud-content { display: flex; flex-direction: column; gap: 1px; }

  .hud-value {
    font-size: clamp(1.2rem, 2.2vw, 1.5rem);
    font-weight: 700; color: var(--white); line-height: 1;
    letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  }

  .hud-label {
    font-size: 0.42rem; text-transform: uppercase; letter-spacing: 0.3em;
    color: var(--white-muted); font-weight: 600;
  }

  /* ── BOTTOM BAR ── */
  .bottom-bar {
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(0.7rem, 1.6vw, 1rem); pointer-events: auto;
  }

  .progress-container {
    display: flex; align-items: center; gap: 0.55rem;
    opacity: 0.45; transition: opacity 0.3s;
  }
  .progress-container:hover { opacity: 0.85; }

  .progress-ring-wrap {
    position: relative; width: 30px; height: 30px;
  }
  .progress-ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }

  .progress-ring-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 2; }

  .progress-ring-fill {
    fill: none; stroke: url(#progressGrad); stroke-width: 2;
    stroke-linecap: round; stroke-dasharray: 81.68; stroke-dashoffset: 81.68;
    transition: stroke-dashoffset 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    filter: drop-shadow(0 0 3px rgba(94,240,255,0.35));
  }

  .progress-label {
    font-size: 0.4rem; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--white-muted); font-weight: 600; white-space: nowrap;
  }

  /* ── BUTTON ── */
  .btn-capture {
    position: relative; background: var(--glass);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border); color: var(--white);
    font-family: inherit; font-size: clamp(0.5rem, 0.9vw, 0.6rem);
    font-weight: 600; letter-spacing: 0.35em; text-transform: uppercase;
    padding: clamp(0.7rem, 1.5vw, 0.85rem) clamp(2.4rem, 4.5vw, 3.6rem);
    border-radius: 50px; cursor: pointer;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 24px rgba(0,0,0,0.25), inset 0 1px 0 var(--white-dim);
    overflow: hidden;
  }

  .btn-capture::before {
    content: ''; position: absolute; inset: 0; border-radius: 50px;
    background: linear-gradient(135deg, var(--cyan-dim), var(--magenta-dim));
    opacity: 0; transition: opacity 0.4s;
  }

  .btn-capture:hover {
    transform: translateY(-1px);
    border-color: var(--glass-border-bright);
    box-shadow: 0 8px 40px rgba(94,240,255,0.06), 0 0 80px rgba(94,240,255,0.02),
                inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .btn-capture:hover::before { opacity: 1; }

  .btn-capture:active {
    transform: translateY(0) scale(0.97); transition-duration: 0.12s;
  }

  .btn-capture span { position: relative; z-index: 1; }

  /* ── TOAST ── */
  .toast {
    position: absolute; top: 48%; left: 50%;
    transform: translate(-50%, -50%) scale(0.92) translateY(12px);
    background: rgba(5,5,20,0.8);
    backdrop-filter: blur(36px); -webkit-backdrop-filter: blur(36px);
    border: 1px solid rgba(74,222,128,0.15);
    color: var(--lime); padding: 0.55rem 1.5rem; border-radius: 10px;
    font-size: 0.55rem; font-weight: 700; letter-spacing: 0.25em;
    text-transform: uppercase; opacity: 0; pointer-events: none;
    transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 20; box-shadow: 0 0 80px rgba(74,222,128,0.06);
    white-space: nowrap;
  }
  .toast.active { opacity: 1; transform: translate(-50%, -50%) scale(1) translateY(0); }

  /* ── VIGNETTE ── */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 50%, transparent 0%, rgba(4,4,14,0.7) 100%);
    z-index: 3; pointer-events: none;
  }

  .grain {
    position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0.02;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
  }

  @media (max-width: 600px) {
    .hud-card { padding: 0.4rem 0.65rem 0.4rem 0.5rem; border-radius: 12px; }
    .hud-icon { width: 28px; height: 28px; border-radius: 8px; }
    .btn-capture { width: 85%; max-width: 220px; }
    .brand h1 { letter-spacing: 0.4em; }
  }
</style>
</head>
<body>

<div class="scene">
  <canvas id="bgCanvas"></canvas>
  <canvas id="gameCanvas"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="ui-layer">
    <header class="top-bar">
      <div class="brand">
        <h1><span class="accent">L</span>umina</h1>
        <div class="tagline">Capture &amp; Collection</div>
      </div>
      <div class="hud-card">
        <div class="hud-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 2l2.9 6.1L22 9.4l-5 4.6 1.3 6.8L12 17.8 4.7 20.8 6 14 1 9.4l7.1-.3L12 2z" fill="#5ef0ff"/>
          </svg>
        </div>
        <div class="hud-content">
          <div class="hud-value" id="scoreDisplay">0</div>
          <div class="hud-label">Captured</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">✦ Specimen Captured</div>

    <footer class="bottom-bar">
      <div class="progress-container">
        <div class="progress-ring-wrap">
          <svg viewBox="0 0 32 32">
            <defs>
              <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#5ef0ff"/>
                <stop offset="100%" stop-color="#e040fb"/>
              </linearGradient>
            </defs>
            <circle class="progress-ring-bg" cx="16" cy="16" r="13"/>
            <circle class="progress-ring-fill" id="progressRing" cx="16" cy="16" r="13"/>
          </svg>
        </div>
        <div class="progress-label">Collection</div>
      </div>
      <button class="btn-capture" onclick="resetGame()">
        <span>New Collection</span>
      </button>
    </footer>
  </div>
</div>

<script>
(function() {
  /* ═══════════════════ BACKGROUND CANVAS ═══════════════════ */
  const bgCanvas = document.getElementById('bgCanvas');
  const bgCtx = bgCanvas.getContext('2d');
  let bgW, bgH, bgStars = [], nebulaClouds = [];

  function initBg() {
    bgW = bgCanvas.width = window.innerWidth;
    bgH = bgCanvas.height = window.innerHeight;
    bgStars = [];
    const count = Math.floor((bgW * bgH) / 3200);
    for (let i = 0; i < count; i++) {
      bgStars.push({
        x: Math.random() * bgW, y: Math.random() * bgH,
        r: Math.random() * 1.1 + 0.15,
        alpha: Math.random() * 0.3 + 0.02,
        pulse: Math.random() * Math.PI * 2,
        pulseSpeed: Math.random() * 0.005 + 0.002,
        twinkle: Math.random() > 0.6
      });
    }
    nebulaClouds = [];
    const colors = ['rgba(94,240,255,','rgba(224,64,251,','rgba(255,213,79,','rgba(74,222,128,'];
    for (let i = 0; i < 6; i++) {
      nebulaClouds.push({
        x: Math.random() * bgW, y: Math.random() * bgH,
        rx: Math.random() * 400 + 250, ry: Math.random() * 250 + 150,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: Math.random() * 0.01 + 0.003,
        drift: (Math.random() - 0.5) * 0.04,
        driftY: (Math.random() - 0.5) * 0.025,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  function drawBg() {
    bgCtx.clearRect(0, 0, bgW, bgH);
    nebulaClouds.forEach(c => {
      c.phase += 0.0012;
      c.x += c.drift; c.y += c.driftY;
      if (c.x < -c.rx) c.x = bgW + c.rx;
      if (c.x > bgW + c.rx) c.x = -c.rx;
      if (c.y < -c.ry) c.y = bgH + c.ry;
      if (c.y > bgH + c.ry) c.y = -c.ry;
      const g = bgCtx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.rx);
      const a = c.alpha * (0.6 + Math.sin(c.phase) * 0.4);
      g.addColorStop(0, c.color + a + ')');
      g.addColorStop(1, c.color + '0)');
      bgCtx.fillStyle = g;
      bgCtx.beginPath();
      bgCtx.ellipse(c.x, c.y, c.rx, c.ry, 0, 0, Math.PI * 2);
      bgCtx.fill();
    });
    bgStars.forEach(s => {
      s.pulse += s.pulseSpeed;
      let a = s.alpha;
      if (s.twinkle) a = s.alpha * (0.3 + Math.sin(s.pulse * 2.5) * 0.7);
      else a = s.alpha + Math.sin(s.pulse) * 0.04;
      a = Math.max(0.01, a);
      bgCtx.beginPath();
      bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      bgCtx.fillStyle = 'rgba(180,195,255,' + a + ')';
      bgCtx.fill();
    });
  }

  initBg();
  window.addEventListener('resize', initBg);

  /* ═══════════════════ MAIN GAME CANVAS ═══════════════════ */
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');
  const progressRing = document.getElementById('progressRing');

  let W, H, score = 0, MAX_CAPTURES = 20;
  let particles = [], creatures = [], ambientParticles = [];
  let mouse = { x: -9999, y: -9999 };
  let isMouseDown = false;
  let screenShake = { x: 0, y: 0, intensity: 0 };
  let time = 0, captureFlash = 0;

  const PALETTES = [
    { main: '#5ef0ff', glow: 'rgba(94,240,255,', name: 'Cyan' },
    { main: '#e040fb', glow: 'rgba(224,64,251,', name: 'Violet' },
    { main: '#4ade80', glow: 'rgba(74,222,128,', name: 'Moss' },
    { main: '#ffd54f', glow: 'rgba(255,213,79,', name: 'Amber' },
    { main: '#fb7185', glow: 'rgba(251,113,133,', name: 'Rose' }
  ];

  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mousedown', () => { isMouseDown = true; });
  window.addEventListener('mouseup', () => { isMouseDown = false; checkCatch(); });
  window.addEventListener('touchmove', e => { e.preventDefault(); mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }, { passive: false });
  window.addEventListener('touchstart', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; isMouseDown = true; });
  window.addEventListener('touchend', () => { isMouseDown = false; checkCatch(); });

  /* ── CLASSES ── */

  class AmbientParticle {
    constructor() { this.reset(); this.y = Math.random() * H; }
    reset() {
      this.x = Math.random() * W; this.y = H + 20;
      this.r = Math.random() * 1.5 + 0.2;
      this.speed = Math.random() * 0.15 + 0.04;
      this.drift = (Math.random() - 0.5) * 0.12;
      this.alpha = Math.random() * 0.08 + 0.015;
      this.palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
      this.phase = Math.random() * Math.PI * 2;
    }
    update() {
      this.y -= this.speed; this.phase += 0.007;
      this.x += this.drift + Math.sin(this.phase) * 0.08;
      if (this.y < -10) this.reset();
    }
    draw(c) {
      const a = this.alpha * (0.5 + Math.sin(this.phase) * 0.5);
      c.beginPath(); c.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      c.fillStyle = this.palette.glow + a + ')'; c.fill();
    }
  }

  class Particle {
    constructor(x, y, color, type, opts) {
      this.x = x; this.y = y; this.color = color;
      this.type = type || 'burst'; this.opts = opts || {};
      const angle = Math.random() * Math.PI * 2;
      const speed = type === 'burst' ? Math.random() * 4 + 1 : type === 'ring' ? Math.random() * 1.5 + 0.8 : Math.random() * 0.8 + 0.3;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1; this.decay = Math.random() * 0.012 + 0.007;
      this.size = Math.random() * 2.5 + 0.8;
      this.gravity = opts.gravity || 0;
      this.shape = opts.shape || 'circle';
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.vy += this.gravity; this.vx *= 0.96; this.vy *= 0.96;
      this.life -= this.decay; this.size *= 0.985;
    }
    draw(c) {
      if (this.life <= 0) return;
      c.globalAlpha = this.life * 0.8;
      c.fillStyle = this.color;
      c.shadowBlur = 6; c.shadowColor = this.color;
      if (this.shape === 'circle') {
        c.beginPath(); c.arc(this.x, this.y, this.size, 0, Math.PI * 2); c.fill();
      } else {
        c.save(); c.translate(this.x, this.y); c.rotate(this.life * 4);
        c.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        c.restore();
      }
      c.shadowBlur = 0; c.globalAlpha = 1;
    }
  }

  class Creature {
    constructor(type) {
      this.type = type || Math.floor(Math.random() * 4);
      this.palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
      this.color = this.palette.main;
      this.reset();
      this.x = Math.random() * W; this.y = Math.random() * H;
      this.innerPhase = Math.random() * Math.PI * 2;
    }
    reset() {
      const side = Math.floor(Math.random() * 4);
      if (side === 0) { this.x = -120; this.y = Math.random() * H; }
      else if (side === 1) { this.x = W + 120; this.y = Math.random() * H; }
      else if (side === 2) { this.x = Math.random() * W; this.y = -120; }
      else { this.x = Math.random() * W; this.y = H + 120; }
      this.vx = (Math.random() - 0.5) * 0.5;
      this.vy = (Math.random() - 0.5) * 0.5;
      this.baseRadius = Math.random() * 10 + 16;
      this.phase = Math.random() * Math.PI * 2;
      this.phaseSpeed = Math.random() * 0.01 + 0.005;
      this.wobbleAmp = Math.random() * 0.3 + 0.15;
      this.isCaught = false; this.catchScale = 1; this.alpha = 1;
      this.trail = []; this.bobPhase = Math.random() * Math.PI * 2;
      this.pulsePhase = Math.random() * Math.PI * 2;
    }
    update() {
      if (this.isCaught) {
        this.catchScale *= 0.9; this.alpha *= 0.91;
        return this.alpha > 0.01;
      }
      this.phase += this.phaseSpeed;
      this.bobPhase += 0.012;
      this.innerPhase += 0.022;
      this.pulsePhase += 0.018;
      this.x += this.vx + Math.sin(this.phase) * this.wobbleAmp;
      this.y += this.vy + Math.cos(this.phase * 0.45) * this.wobbleAmp * 0.3;
      this.trail.push({ x: this.x, y: this.y, a: 0.25 });
      if (this.trail.length > 15) this.trail.shift();
      this.trail.forEach(t => t.a *= 0.88);

      const margin = 100;
      if (this.x < margin) this.vx += 0.02;
      if (this.x > W - margin) this.vx -= 0.02;
      if (this.y < margin) this.vy += 0.02;
      if (this.y > H - margin) this.vy -= 0.02;

      const dx = this.x - mouse.x, dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 140) {
        const force = ((140 - dist) / 140) * 0.45;
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }
      const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      if (speed > 2) { this.vx = (this.vx / speed) * 2; this.vy = (this.vy / speed) * 2; }
      return true;
    }
    draw(c) {
      if (this.alpha <= 0.01) return;
      c.save();
      c.translate(this.x, this.y);
      c.scale(this.catchScale, this.catchScale);
      c.globalAlpha = this.alpha;

      if (!this.isCaught && this.trail.length > 1) {
        for (let i = 0; i < this.trail.length; i++) {
          const t = this.trail[i], ratio = i / this.trail.length;
          c.beginPath();
          c.arc(t.x - this.x, t.y - this.y, this.baseRadius * 0.15 * ratio, 0, Math.PI * 2);
          c.fillStyle = this.palette.glow + (t.a * ratio * 0.3) + ')';
          c.fill();
        }
      }

      const glowR = this.baseRadius * 2.5;
      const glow = c.createRadialGradient(0, 0, this.baseRadius * 0.15, 0, 0, glowR);
      glow.addColorStop(0, this.palette.glow + '0.15)');
      glow.addColorStop(0.5, this.palette.glow + '0.04)');
      glow.addColorStop(1, this.palette.glow + '0)');
      c.fillStyle = glow;
      c.beginPath(); c.arc(0, 0, glowR, 0, Math.PI * 2); c.fill();

      const r = this.baseRadius;
      const pulse = 1 + Math.sin(this.pulsePhase) * 0.05;
      c.shadowBlur = 18; c.shadowColor = this.color;

      if (this.type === 0) this.drawJellyfish(c, r * pulse, this.phase);
      else if (this.type === 1) this.drawOrbWings(c, r * pulse, this.phase);
      else if (this.type === 2) this.drawMoth(c, r * pulse, this.phase);
      else this.drawLantern(c, r * pulse, this.phase);

      c.restore();
    }
    drawJellyfish(c, r, p) {
      c.beginPath();
      c.moveTo(-r * 0.8, r * 0.1);
      c.bezierCurveTo(-r * 0.9, -r * 0.55, r * 0.9, -r * 0.55, r * 0.8, r * 0.1);
      c.bezierCurveTo(r * 0.45, r * 0.45, r * 0.12, r * 0.28, 0, r * 0.25);
      c.bezierCurveTo(-r * 0.12, r * 0.28, -r * 0.45, r * 0.45, -r * 0.8, r * 0.1);
      const dg = c.createRadialGradient(0, -r * 0.1, 0, 0, 0, r * 0.85);
      dg.addColorStop(0, 'rgba(255,255,255,0.88)');
      dg.addColorStop(0.22, this.color);
      dg.addColorStop(1, this.palette.glow + '0.4)');
      c.fillStyle = dg; c.fill();

      c.shadowBlur = 8;
      c.strokeStyle = this.palette.glow + '0.4)';
      c.lineWidth = 1.2;
      for (let i = -2; i <= 2; i++) {
        c.beginPath();
        const tx = i * r * 0.22;
        c.moveTo(tx, r * 0.15);
        const wave = Math.sin(p * 2 + i * 0.65) * r * 0.25;
        c.bezierCurveTo(tx + wave, r * 0.65, tx - wave, r * 1.05, tx + wave * 0.25, r * 1.35);
        c.stroke();
      }
      c.shadowBlur = 0;
      c.fillStyle = 'rgba(255,255,255,0.92)';
      c.beginPath(); c.arc(0, -r * 0.08, r * 0.18, 0, Math.PI * 2); c.fill();
      const cg = c.createRadialGradient(0, -r * 0.08, 0, 0, -r * 0.08, r * 0.3);
      cg.addColorStop(0, 'rgba(255,255,255,0.25)');
      cg.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = cg;
      c.beginPath(); c.arc(0, -r * 0.08, r * 0.3, 0, Math.PI * 2); c.fill();
    }
    drawOrbWings(c, r, p) {
      const wf = Math.sin(p * 3) * 0.18;
      for (let s = -1; s <= 1; s += 2) {
        c.beginPath();
        c.ellipse(s * r * 0.65, 0, r * 0.55, r * 0.32 + wf * r * 0.1, s * 0.15, 0, Math.PI * 2);
        const wg = c.createRadialGradient(s * r * 0.4, 0, 0, s * r * 0.4, 0, r * 0.55);
        wg.addColorStop(0, this.palette.glow + '0.55)');
        wg.addColorStop(1, this.palette.glow + '0.1)');
        c.fillStyle = wg; c.fill();
      }
      c.shadowBlur = 16;
      const bg = c.createRadialGradient(0, 0, 0, 0, 0, r * 0.45);
      bg.addColorStop(0, '#fff');
      bg.addColorStop(0.3, this.color);
      bg.addColorStop(1, this.palette.glow + '0.3)');
      c.fillStyle = bg;
      c.beginPath(); c.arc(0, 0, r * 0.42, 0, Math.PI * 2); c.fill();
      c.shadowBlur = 0;
      c.fillStyle = 'rgba(255,255,255,0.9)';
      c.beginPath(); c.arc(0, 0, r * 0.13, 0, Math.PI * 2); c.fill();
    }
    drawMoth(c, r, p) {
      c.shadowBlur = 12;
      const bg = c.createRadialGradient(0, 0, 0, 0, 0, r * 0.6);
      bg.addColorStop(0, 'rgba(255,255,255,0.85)');
      bg.addColorStop(0.4, this.color);
      bg.addColorStop(1, this.palette.glow + '0.25)');
      c.fillStyle = bg;
      c.beginPath(); c.ellipse(0, 0, r * 0.18, r * 0.5, 0, 0, Math.PI * 2); c.fill();

      c.shadowBlur = 8;
      const flap = Math.sin(p * 3.2) * 0.12;
      for (let s = -1; s <= 1; s += 2) {
        c.beginPath();
        c.moveTo(s * r * 0.04, -r * 0.1);
        c.bezierCurveTo(s * r * 1.1, -r * 0.7 + flap * r, s * r * 1.3, r * 0.02, s * r * 0.04, r * 0.2);
        const wg = c.createRadialGradient(s * r * 0.4, -r * 0.05, 0, s * r * 0.4, -r * 0.05, r * 0.85);
        wg.addColorStop(0, this.palette.glow + '0.45)');
        wg.addColorStop(1, this.palette.glow + '0.06)');
        c.fillStyle = wg; c.fill();
        c.strokeStyle = this.palette.glow + '0.2)';
        c.lineWidth = 0.7;
        c.beginPath(); c.arc(s * r * 0.32, 0, r * 0.2, 0, Math.PI * 2); c.stroke();
      }
      c.shadowBlur = 0;
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(0, -r * 0.08, r * 0.1, 0, Math.PI * 2); c.fill();
    }
    drawLantern(c, r, p) {
      c.shadowBlur = 14;
      const bg = c.createRadialGradient(0, 0, 0, 0, 0, r * 0.5);
      bg.addColorStop(0, 'rgba(255,255,255,0.9)');
      bg.addColorStop(0.28, this.color);
      bg.addColorStop(1, this.palette.glow + '0.25)');
      c.fillStyle = bg;
      c.beginPath(); c.ellipse(0, 0, r * 0.38, r * 0.5, 0, 0, Math.PI * 2); c.fill();

      c.fillStyle = this.palette.glow + '0.4)';
      c.beginPath(); c.ellipse(0, -r * 0.45, r * 0.16, r * 0.09, 0, 0, Math.PI * 2); c.fill();

      c.shadowBlur = 6;
      c.strokeStyle = this.palette.glow + '0.3)';
      c.lineWidth = 1;
      const sway = Math.sin(p * 1.6) * r * 0.1;
      c.beginPath();
      c.moveTo(0, r * 0.5);
      c.bezierCurveTo(sway, r * 0.8, -sway, r * 1, sway * 0.3, r * 1.15);
      c.stroke();

      c.shadowBlur = 0;
      c.fillStyle = 'rgba(255,255,255,0.8)';
      c.beginPath(); c.arc(0, 0, r * 0.11, 0, Math.PI * 2); c.fill();

      const pr = r * (0.7 + Math.sin(p * 1.6) * 0.1);
      c.strokeStyle = this.palette.glow + '0.15)';
      c.lineWidth = 0.7;
      c.beginPath(); c.ellipse(0, 0, pr * 0.44, pr * 0.55, 0, 0, Math.PI * 2); c.stroke();
    }
    getBounds() { return { x: this.x, y: this.y, r: this.baseRadius * 1.3 }; }
  }

  /* ── GAME FUNCTIONS ── */

  function init() {
    creatures = [];
    const types = [0, 1, 2, 3, 0, 1, 2, 3];
    for (let i = 0; i < 8; i++) creatures.push(new Creature(types[i % types.length]));
    ambientParticles = [];
    for (let i = 0; i < 45; i++) ambientParticles.push(new AmbientParticle());
    score = 0; scoreEl.innerText = '0';
    progressRing.style.strokeDashoffset = '81.68';
    particles = [];
  }

  function checkCatch() {
    const catchRadius = 55;
    let caughtAny = false;
    creatures.forEach(c => {
      if (c.isCaught) return;
      const b = c.getBounds();
      const dx = b.x - mouse.x, dy = b.y - mouse.y;
      if (Math.sqrt(dx * dx + dy * dy) < catchRadius + b.r * 0.35) {
        catchCreature(c); caughtAny = true;
      }
    });
    if (caughtAny) {
      screenShake.intensity = 4;
      captureFlash = 1;
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        particles.push(new Particle(mouse.x + Math.cos(a) * 28, mouse.y + Math.sin(a) * 28, 'rgba(255,255,255,0.35)', 'ring'));
      }
    }
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    const pct = Math.min(score / MAX_CAPTURES, 1);
    progressRing.style.strokeDashoffset = 81.68 * (1 - pct);

    for (let i = 0; i < 28; i++) particles.push(new Particle(creature.x, creature.y, creature.color, 'burst'));
    for (let i = 0; i < 10; i++) particles.push(new Particle(creature.x, creature.y, '#fff', 'burst', { shape: 'square' }));

    toastEl.classList.add('active');
    clearTimeout(toastEl._timeout);
    toastEl._timeout = setTimeout(() => toastEl.classList.remove('active'), 1400);

    setTimeout(() => {
      const idx = creatures.indexOf(creature);
      if (idx !== -1) creatures[idx] = new Creature(creature.type);
    }, 3200);
  }

  window.resetGame = function() { init(); };

  /* ── DRAW NET ── */
  function drawNet() {
    if (mouse.x < -100) return;
    ctx.save();
    ctx.translate(mouse.x, mouse.y);

    const pulse = isMouseDown ? 1.12 : 1;
    const baseR = 48 * pulse;
    const breathe = Math.sin(time * 0.022) * 2;

    const og = ctx.createRadialGradient(0, 0, baseR * 0.25, 0, 0, baseR * 1.8);
    og.addColorStop(0, 'rgba(94,240,255,0.04)');
    og.addColorStop(1, 'rgba(94,240,255,0)');
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.arc(0, 0, baseR * 1.8, 0, Math.PI * 2); ctx.fill();

    ctx.shadowBlur = 14;
    ctx.shadowColor = 'rgba(94,240,255,0.3)';
    ctx.strokeStyle = isMouseDown ? 'rgba(255,255,255,0.4)' : 'rgba(94,240,255,0.25)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.arc(0, 0, baseR + breathe, 0, Math.PI * 2);
    ctx.stroke();

    ctx.shadowBlur = 0;
    const segments = 24;
    ctx.strokeStyle = isMouseDown ? 'rgba(255,255,255,0.12)' : 'rgba(94,240,255,0.08)';
    ctx.lineWidth = 0.6;
    for (let i = 0; i < segments; i++) {
      const a = (i / segments) * Math.PI * 2;
      const nextA = ((i + 1) / segments) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(0, 0, baseR + breathe, a, nextA);
      ctx.stroke();
    }

    for (let ring = 1; ring <= 3; ring++) {
      const rr = baseR * (ring / 4) + breathe * (ring / 4);
      ctx.strokeStyle = isMouseDown ? 'rgba(255,255,255,0.06)' : 'rgba(94,240,255,0.04)';
      ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2); ctx.stroke();
    }

    ctx.fillStyle = 'rgba(94,240,255,0.6)';
    ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  /* ── MAIN LOOP ── */
  function loop() {
    time++;
    ctx.clearRect(0, 0, W, H);

    drawBg();

    if (screenShake.intensity > 0) {
      screenShake.x = (Math.random() - 0.5) * screenShake.intensity;
      screenShake.y = (Math.random() - 0.5) * screenShake.intensity;
      screenShake.intensity *= 0.88;
      if (screenShake.intensity < 0.1) screenShake.intensity = 0;
      ctx.save();
      ctx.translate(screenShake.x, screenShake.y);
    }

    if (captureFlash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (captureFlash * 0.06) + ')';
      ctx.fillRect(0, 0, W, H);
      captureFlash *= 0.88;
      if (captureFlash < 0.01) captureFlash = 0;
    }

    ambientParticles.forEach(p => { p.update(); p.draw(ctx); });

    creatures = creatures.filter(c => {
      const alive = c.update();
      if (alive) c.draw(ctx);
      return alive;
    });

    particles = particles.filter(p => { p.update(); p.draw(ctx); return p.life > 0; });

    drawNet();

    if (screenShake.intensity > 0) ctx.restore();

    requestAnimationFrame(loop);
  }

  init();
  loop();
})();
</script>
