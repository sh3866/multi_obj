<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina — Capture & Collection</title>
<style>
  @import url('data:text/css,');
  :root {
    --bg-deep: #06060f;
    --bg-mid: #0c0c20;
    --cyan: #5ce4ff;
    --cyan-dim: rgba(92,228,255,0.15);
    --magenta: #e040fb;
    --magenta-dim: rgba(224,64,251,0.12);
    --amber: #f5a623;
    --amber-dim: rgba(245,166,35,0.12);
    --lime: #7fff6e;
    --lime-dim: rgba(127,255,110,0.12);
    --rose: #ff6b8a;
    --rose-dim: rgba(255,107,138,0.12);
    --white: #f0f0f5;
    --white-dim: rgba(240,240,245,0.06);
    --font-display: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: "SF Mono", "Cascadia Code", "Consolas", "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg-deep);
    overflow: hidden;
    font-family: var(--font-display);
    color: var(--white);
    -webkit-font-smoothing: antialiased;
  }

  .scene {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  .atmosphere {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 100% 50% at 50% -10%, rgba(92,228,255,0.04) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 15% 85%, rgba(224,64,251,0.03) 0%, transparent 60%),
      radial-gradient(ellipse 50% 35% at 85% 60%, rgba(245,166,35,0.02) 0%, transparent 50%);
    z-index: 0;
    pointer-events: none;
  }

  #bgCanvas {
    position: absolute; inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  #gameCanvas {
    position: absolute; inset: 0;
    z-index: 5;
    cursor: none;
  }

  .ui-layer {
    position: absolute; inset: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(1.5rem, 4vw, 3rem) clamp(1.5rem, 4vw, 3rem);
  }

  /* Top bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .brand h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 300;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(240,240,245,0.9);
    line-height: 1;
  }

  .brand h1 span {
    font-weight: 700;
  }

  .brand .tagline {
    font-size: clamp(0.5rem, 1.1vw, 0.6rem);
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: rgba(240,240,245,0.25);
    font-weight: 400;
    margin-left: 0.15em;
  }

  /* HUD */
  .hud {
    display: flex;
    align-items: center;
    gap: clamp(0.6rem, 1.5vw, 1rem);
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: clamp(0.55rem, 1.2vw, 0.75rem) clamp(0.9rem, 2vw, 1.3rem);
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    position: relative;
    overflow: hidden;
  }

  .hud::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  }

  .hud-icon {
    width: clamp(18px, 2.5vw, 24px);
    height: clamp(18px, 2.5vw, 24px);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .hud-icon svg {
    width: 100%; height: 100%;
  }

  .hud-content {
    display: flex;
    flex-direction: column;
    gap: 0.05rem;
    min-width: 0;
  }

  .hud-value {
    font-family: var(--font-mono);
    font-size: clamp(1.1rem, 2.5vw, 1.5rem);
    font-weight: 700;
    color: var(--white);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .hud-label {
    font-size: clamp(0.45rem, 0.9vw, 0.55rem);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: rgba(240,240,245,0.3);
    font-weight: 500;
  }

  /* Bottom */
  .bottom-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(0.75rem, 2vw, 1.2rem);
    pointer-events: auto;
  }

  /* Progress */
  .progress-container {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    opacity: 0.7;
    transition: opacity 0.3s;
  }
  .progress-container:hover { opacity: 1; }

  .progress-track {
    width: clamp(100px, 18vw, 180px);
    height: 2px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    border-radius: 2px;
    transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 0 12px rgba(92,228,255,0.3);
    position: relative;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    right: 0; top: -2px; bottom: -2px;
    width: 4px;
    background: #fff;
    border-radius: 2px;
    box-shadow: 0 0 8px var(--cyan);
  }

  .progress-label {
    font-size: 0.5rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(240,240,245,0.25);
    font-weight: 500;
    white-space: nowrap;
  }

  /* Button */
  .btn-capture {
    position: relative;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(240,240,245,0.8);
    font-family: var(--font-display);
    font-size: clamp(0.65rem, 1.2vw, 0.75rem);
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: clamp(0.75rem, 1.8vw, 0.95rem) clamp(2.5rem, 5vw, 4rem);
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    overflow: hidden;
  }

  .btn-capture::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50px;
    background: linear-gradient(135deg, rgba(92,228,255,0.08), rgba(224,64,251,0.06));
    opacity: 0;
    transition: opacity 0.5s;
  }

  .btn-capture:hover {
    transform: translateY(-1px);
    border-color: rgba(255,255,255,0.15);
    color: var(--white);
    box-shadow: 0 8px 40px rgba(92,228,255,0.08), 0 0 60px rgba(92,228,255,0.03);
  }

  .btn-capture:hover::before { opacity: 1; }

  .btn-capture:active {
    transform: translateY(0) scale(0.98);
    transition-duration: 0.15s;
  }

  .btn-capture span {
    position: relative;
    z-index: 1;
  }

  /* Toast */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.92) translateY(8px);
    background: rgba(6,6,15,0.8);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(127,255,110,0.2);
    color: var(--lime);
    padding: 0.7rem 1.6rem;
    border-radius: 10px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 20;
    box-shadow: 0 0 50px rgba(127,255,110,0.06);
    white-space: nowrap;
  }

  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) translateY(0);
  }

  /* Vignette overlay */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 60% at 50% 50%, transparent 0%, rgba(6,6,15,0.5) 100%);
    z-index: 3;
    pointer-events: none;
  }

  /* Scanline subtle */
  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.015) 2px,
      rgba(0,0,0,0.015) 4px
    );
    z-index: 4;
    pointer-events: none;
  }

  @media (max-width: 600px) {
    .hud { padding: 0.5rem 0.8rem; border-radius: 10px; }
    .btn-capture { width: 85%; max-width: 260px; }
    .progress-track { width: 100px; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="atmosphere"></div>
  <canvas id="bgCanvas"></canvas>
  <canvas id="gameCanvas"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <div class="ui-layer">
    <header class="top-bar">
      <div class="brand">
        <h1><span>Lum</span>ina</h1>
        <div class="tagline">Capture & Collection</div>
      </div>
      <div class="hud">
        <div class="hud-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="var(--cyan)" opacity="0.9"/>
          </svg>
        </div>
        <div class="hud-content">
          <div class="hud-value" id="scoreDisplay">0</div>
          <div class="hud-label">Captured</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">✦ Specimen Captured</div>

    <footer class="bottom-bar">
      <div class="progress-container">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-label">Collection</div>
      </div>
      <button class="btn-capture" onclick="resetGame()">
        <span>New Collection</span>
      </button>
    </footer>
  </div>
</div>

<script>
(function() {
  // === BACKGROUND CANVAS (Nebula + Stars) ===
  const bgCanvas = document.getElementById('bgCanvas');
  const bgCtx = bgCanvas.getContext('2d');
  let bgW, bgH;
  let bgStars = [];
  let nebulaClouds = [];

  function initBg() {
    bgW = bgCanvas.width = window.innerWidth;
    bgH = bgCanvas.height = window.innerHeight;
    bgStars = [];
    const count = Math.floor((bgW * bgH) / 3500);
    for (let i = 0; i < count; i++) {
      bgStars.push({
        x: Math.random() * bgW,
        y: Math.random() * bgH,
        r: Math.random() * 1 + 0.3,
        alpha: Math.random() * 0.4 + 0.05,
        pulse: Math.random() * Math.PI * 2,
        pulseSpeed: Math.random() * 0.008 + 0.003,
        twinkle: Math.random() > 0.7
      });
    }
    nebulaClouds = [];
    for (let i = 0; i < 6; i++) {
      nebulaClouds.push({
        x: Math.random() * bgW,
        y: Math.random() * bgH,
        rx: Math.random() * 300 + 150,
        ry: Math.random() * 200 + 100,
        color: [
          'rgba(92,228,255,',
          'rgba(224,64,251,',
          'rgba(245,166,35,',
          'rgba(127,255,110,'
        ][Math.floor(Math.random() * 4)],
        alpha: Math.random() * 0.015 + 0.005,
        drift: (Math.random() - 0.5) * 0.08,
        driftY: (Math.random() - 0.5) * 0.04,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  function drawBg() {
    bgCtx.clearRect(0, 0, bgW, bgH);

    // Nebula clouds
    nebulaClouds.forEach(c => {
      c.phase += 0.002;
      c.x += c.drift;
      c.y += c.driftY;
      if (c.x < -c.rx) c.x = bgW + c.rx;
      if (c.x > bgW + c.rx) c.x = -c.rx;
      if (c.y < -c.ry) c.y = bgH + c.ry;
      if (c.y > bgH + c.ry) c.y = -c.ry;

      const grad = bgCtx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.rx);
      grad.addColorStop(0, c.color + (c.alpha * (0.8 + Math.sin(c.phase) * 0.2)) + ')');
      grad.addColorStop(1, c.color + '0)');
      bgCtx.fillStyle = grad;
      bgCtx.beginPath();
      bgCtx.ellipse(c.x, c.y, c.rx, c.ry, 0, 0, Math.PI * 2);
      bgCtx.fill();
    });

    // Stars
    bgStars.forEach(s => {
      s.pulse += s.pulseSpeed;
      let a = s.alpha;
      if (s.twinkle) {
        a = s.alpha * (0.5 + Math.sin(s.pulse * 2) * 0.5);
      } else {
        a = s.alpha + Math.sin(s.pulse) * 0.08;
      }
      a = Math.max(0.02, a);
      bgCtx.beginPath();
      bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      bgCtx.fillStyle = `rgba(220,225,255,${a})`;
      bgCtx.fill();
    });
  }

  initBg();
  window.addEventListener('resize', initBg);

  // === MAIN GAME CANVAS ===
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');
  const progressFill = document.getElementById('progressFill');

  let W, H;
  let score = 0;
  const MAX_CAPTURES = 20;
  let particles = [];
  let creatures = [];
  let mouse = { x: -9999, y: -9999 };
  let isMouseDown = false;
  let netAngle = 0;
  let ambientParticles = [];
  let screenShake = { x: 0, y: 0, intensity: 0 };
  let time = 0;

  const PALETTES = [
    { main: '#5ce4ff', glow: 'rgba(92,228,255,', dim: 'rgba(92,228,255,', name: 'Cyan' },
    { main: '#e040fb', glow: 'rgba(224,64,251,', dim: 'rgba(224,64,251,', name: 'Violet' },
    { main: '#7fff6e', glow: 'rgba(127,255,110,', dim: 'rgba(127,255,110,', name: 'Moss' },
    { main: '#f5a623', glow: 'rgba(245,166,35,', dim: 'rgba(245,166,35,', name: 'Amber' },
    { main: '#ff6b8a', glow: 'rgba(255,107,138,', dim: 'rgba(255,107,138,', name: 'Rose' }
  ];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mousedown', () => { isMouseDown = true; });
  window.addEventListener('mouseup', () => { isMouseDown = false; checkCatch(); });
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => { isMouseDown = false; checkCatch(); });

  // === CLASSES ===

  class AmbientParticle {
    constructor() {
      this.reset();
      this.y = Math.random() * H;
    }
    reset() {
      this.x = Math.random() * W;
      this.y = H + 20;
      this.r = Math.random() * 1.5 + 0.3;
      this.speed = Math.random() * 0.25 + 0.08;
      this.drift = (Math.random() - 0.5) * 0.2;
      this.alpha = Math.random() * 0.12 + 0.03;
      this.palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
      this.phase = Math.random() * Math.PI * 2;
    }
    update() {
      this.y -= this.speed;
      this.phase += 0.01;
      this.x += this.drift + Math.sin(this.phase) * 0.15;
      if (this.y < -10) this.reset();
    }
    draw(c) {
      const a = this.alpha * (0.7 + Math.sin(this.phase) * 0.3);
      c.beginPath();
      c.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      c.fillStyle = this.palette.glow + a + ')';
      c.fill();
    }
  }

  class Particle {
    constructor(x, y, color, type, opts) {
      this.x = x;
      this.y = y;
      this.color = color;
      this.type = type || 'burst';
      this.opts = opts || {};
      const angle = Math.random() * Math.PI * 2;
      const speed = this.type === 'burst' ? Math.random() * 5 + 1.5 :
                    this.type === 'ring' ? Math.random() * 2 + 1 :
                    Math.random() * 1 + 0.5;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.018 + 0.01;
      this.size = Math.random() * 3 + 1;
      this.gravity = this.opts.gravity || 0;
      this.shape = this.opts.shape || 'circle';
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += this.gravity;
      this.vx *= 0.97;
      this.vy *= 0.97;
      this.life -= this.decay;
      this.size *= 0.993;
    }
    draw(c) {
      if (this.life <= 0) return;
      c.globalAlpha = this.life * 0.8;
      c.fillStyle = this.color;
      c.shadowBlur = 6;
      c.shadowColor = this.color;
      if (this.shape === 'circle') {
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
      } else {
        c.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
      }
      c.shadowBlur = 0;
      c.globalAlpha = 1;
    }
  }

  class Creature {
    constructor(type) {
      this.type = type || Math.floor(Math.random() * 4);
      this.palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
      this.color = this.palette.main;
      this.reset();
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.innerPhase = Math.random() * Math.PI * 2;
    }

    reset() {
      const side = Math.floor(Math.random() * 4);
      if (side === 0) { this.x = -80; this.y = Math.random() * H; }
      else if (side === 1) { this.x = W + 80; this.y = Math.random() * H; }
      else if (side === 2) { this.x = Math.random() * W; this.y = -80; }
      else { this.x = Math.random() * W; this.y = H + 80; }

      this.vx = (Math.random() - 0.5) * 0.8;
      this.vy = (Math.random() - 0.5) * 0.8;
      this.baseRadius = Math.random() * 10 + 16;
      this.phase = Math.random() * Math.PI * 2;
      this.phaseSpeed = Math.random() * 0.015 + 0.008;
      this.wobbleAmp = Math.random() * 0.4 + 0.25;
      this.isCaught = false;
      this.catchScale = 1;
      this.alpha = 1;
      this.trail = [];
      this.bobPhase = Math.random() * Math.PI * 2;
    }

    update() {
      if (this.isCaught) {
        this.catchScale *= 0.92;
        this.alpha *= 0.93;
        return this.alpha > 0.01;
      }

      this.phase += this.phaseSpeed;
      this.bobPhase += 0.02;
      this.innerPhase += 0.03;

      this.x += this.vx + Math.sin(this.phase) * this.wobbleAmp;
      this.y += this.vy + Math.cos(this.phase * 0.6) * this.wobbleAmp * 0.4;

      // Trail
      this.trail.push({ x: this.x, y: this.y, a: 0.35 });
      if (this.trail.length > 15) this.trail.shift();
      this.trail.forEach(t => t.a *= 0.92);

      // Wall avoidance
      const margin = 60;
      if (this.x < margin) this.vx += 0.04;
      if (this.x > W - margin) this.vx -= 0.04;
      if (this.y < margin) this.vy += 0.04;
      if (this.y > H - margin) this.vy -= 0.04;

      // Mouse avoidance
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 140) {
        const force = ((140 - dist) / 140) * 0.6;
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }

      // Speed limit
      const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      if (speed > 2.5) {
        this.vx = (this.vx / speed) * 2.5;
        this.vy = (this.vy / speed) * 2.5;
      }

      return true;
    }

    draw(c) {
      if (this.alpha <= 0.01) return;
      c.save();
      c.translate(this.x, this.y);
      c.scale(this.catchScale, this.catchScale);
      c.globalAlpha = this.alpha;

      // Trail
      if (!this.isCaught && this.trail.length > 1) {
        for (let i = 0; i < this.trail.length; i++) {
          const t = this.trail[i];
          const ratio = i / this.trail.length;
          c.beginPath();
          c.arc(t.x - this.x, t.y - this.y, this.baseRadius * 0.25 * ratio, 0, Math.PI * 2);
          c.fillStyle = this.palette.glow + (t.a * ratio * 0.4) + ')';
          c.fill();
        }
      }

      // Outer glow
      const glowR = this.baseRadius * 2.5;
      const glow = c.createRadialGradient(0, 0, this.baseRadius * 0.3, 0, 0, glowR);
      glow.addColorStop(0, this.palette.glow + '0.15)');
      glow.addColorStop(0.5, this.palette.glow + '0.05)');
      glow.addColorStop(1, this.palette.glow + '0)');
      c.fillStyle = glow;
      c.beginPath();
      c.arc(0, 0, glowR, 0, Math.PI * 2);
      c.fill();

      const r = this.baseRadius;
      const p = this.phase;

      c.shadowBlur = 18;
      c.shadowColor = this.color;

      if (this.type === 0) {
        this.drawJellyfish(c, r, p);
      } else if (this.type === 1) {
        this.drawOrbWings(c, r, p);
      } else if (this.type === 2) {
        this.drawMoth(c, r, p);
      } else {
        this.drawLantern(c, r, p);
      }

      c.restore();
    }

    drawJellyfish(c, r, p) {
      // Dome
      c.beginPath();
      c.moveTo(-r * 0.85, r * 0.15);
      c.bezierCurveTo(-r * 0.9, -r * 0.65, r * 0.9, -r * 0.65, r * 0.85, r * 0.15);
      c.bezierCurveTo(r * 0.55, r * 0.55, r * 0.2, r * 0.3, 0, r * 0.35);
      c.bezierCurveTo(-r * 0.2, r * 0.3, -r * 0.55, r * 0.55, -r * 0.85, r * 0.15);
      const domeGrad = c.createRadialGradient(0, -r * 0.1, 0, 0, 0, r);
      domeGrad.addColorStop(0, 'rgba(255,255,255,0.95)');
      domeGrad.addColorStop(0.3, this.color);
      domeGrad.addColorStop(1, this.palette.glow + '0.6)');
      c.fillStyle = domeGrad;
      c.fill();

      // Tentacles
      c.shadowBlur = 8;
      c.strokeStyle = this.palette.glow + '0.5)';
      c.lineWidth = 1.2;
      for (let i = -2; i <= 2; i++) {
        c.beginPath();
        const tx = i * r * 0.28;
        c.moveTo(tx, r * 0.25);
        const wave = Math.sin(p * 2.5 + i * 0.8) * r * 0.35;
        c.bezierCurveTo(tx + wave, r * 0.75, tx - wave, r * 1.2, tx + wave * 0.4, r * 1.6);
        c.stroke();
      }

      // Inner core
      c.shadowBlur = 0;
      c.fillStyle = 'rgba(255,255,255,0.9)';
      c.beginPath();
      c.arc(0, -r * 0.15, r * 0.22, 0, Math.PI * 2);
      c.fill();

      // Core glow
      c.fillStyle = 'rgba(255,255,255,0.3)';
      c.beginPath();
      c.arc(0, -r * 0.15, r * 0.35, 0, Math.PI * 2);
      c.fill();
    }

    drawOrbWings(c, r, p) {
      // Wings
      c.shadowBlur = 10;
      const wingFlap = Math.sin(p * 3.5) * 0.25;
      for (let side = -1; side <= 1; side += 2) {
        c.beginPath();
        c.ellipse(side * r * 0.75, 0, r * 0.65, r * 0.38 + wingFlap * r * 0.15, side * 0.25, 0, Math.PI * 2);
        const wingGrad = c.createRadialGradient(side * r * 0.5, 0, 0, side * r * 0.5, 0, r * 0.65);
        wingGrad.addColorStop(0, this.palette.glow + '0.7)');
        wingGrad.addColorStop(1, this.palette.glow + '0.15)');
        c.fillStyle = wingGrad;
        c.fill();
      }

      // Body
      c.shadowBlur = 15;
      const bodyGrad = c.createRadialGradient(0, 0, 0, 0, 0, r * 0.55);
      bodyGrad.addColorStop(0, '#fff');
      bodyGrad.addColorStop(0.4, this.color);
      bodyGrad.addColorStop(1, this.palette.glow + '0.4)');
      c.fillStyle = bodyGrad;
      c.beginPath();
      c.arc(0, 0, r * 0.5, 0, Math.PI * 2);
      c.fill();

      // Core
      c.shadowBlur = 0;
      c.fillStyle = 'rgba(255,255,255,0.95)';
      c.beginPath();
      c.arc(0, 0, r * 0.18, 0, Math.PI * 2);
      c.fill();
    }

    drawMoth(c, r, p) {
      // Body
      c.shadowBlur = 12;
      const bodyGrad = c.createRadialGradient(0, 0, 0, 0, 0, r * 0.7);
      bodyGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
      bodyGrad.addColorStop(0.5, this.color);
      bodyGrad.addColorStop(1, this.palette.glow + '0.3)');
      c.fillStyle = bodyGrad;
      c.beginPath();
      c.ellipse(0, 0, r * 0.22, r * 0.6, 0, 0, Math.PI * 2);
      c.fill();

      // Wings
      c.shadowBlur = 8;
      const flap = Math.sin(p * 4) * 0.18;
      for (let side = -1; side <= 1; side += 2) {
        c.beginPath();
        c.moveTo(side * r * 0.08, -r * 0.15);
        c.bezierCurveTo(side * r * 1.3, -r * 0.85 + flap * r, side * r * 1.5, r * 0.05, side * r * 0.08, r * 0.25);
        const wingGrad = c.createRadialGradient(side * r * 0.5, -r * 0.1, 0, side * r * 0.5, -r * 0.1, r);
        wingGrad.addColorStop(0, this.palette.glow + '0.6)');
        wingGrad.addColorStop(1, this.palette.glow + '0.1)');
        c.fillStyle = wingGrad;
        c.fill();

        // Wing pattern
        c.strokeStyle = this.palette.glow + '0.3)';
        c.lineWidth = 0.8;
        c.beginPath();
        c.arc(side * r * 0.4, 0, r * 0.25, 0, Math.PI * 2);
        c.stroke();
      }

      // Core
      c.shadowBlur = 0;
      c.fillStyle = '#fff';
      c.beginPath();
      c.arc(0, -r * 0.12, r * 0.14, 0, Math.PI * 2);
      c.fill();
    }

    drawLantern(c, r, p) {
      // Lantern body
      c.shadowBlur = 14;
      const bodyGrad = c.createRadialGradient(0, 0, 0, 0, 0, r * 0.6);
      bodyGrad.addColorStop(0, 'rgba(255,255,255,0.95)');
      bodyGrad.addColorStop(0.3, this.color);
      bodyGrad.addColorStop(1, this.palette.glow + '0.3)');
      c.fillStyle = bodyGrad;
      c.beginPath();
      c.ellipse(0, 0, r * 0.45, r * 0.6, 0, 0, Math.PI * 2);
      c.fill();

      // Top cap
      c.fillStyle = this.palette.glow + '0.5)';
      c.beginPath();
      c.ellipse(0, -r * 0.55, r * 0.2, r * 0.12, 0, 0, Math.PI * 2);
      c.fill();

      // Bottom tassel
      c.shadowBlur = 6;
      c.strokeStyle = this.palette.glow + '0.4)';
      c.lineWidth = 1;
      const sway = Math.sin(p * 2) * r * 0.15;
      c.beginPath();
      c.moveTo(0, r * 0.6);
      c.bezierCurveTo(sway, r * 0.9, -sway, r * 1.1, sway * 0.5, r * 1.3);
      c.stroke();

      // Inner light
      c.shadowBlur = 0;
      c.fillStyle = 'rgba(255,255,255,0.8)';
      c.beginPath();
      c.arc(0, 0, r * 0.15, 0, Math.PI * 2);
      c.fill();

      // Pulse ring
      const pulseR = r * (0.8 + Math.sin(p * 2) * 0.15);
      c.strokeStyle = this.palette.glow + '0.2)';
      c.lineWidth = 0.8;
      c.beginPath();
      c.ellipse(0, 0, pulseR * 0.5, pulseR * 0.65, 0, 0, Math.PI * 2);
      c.stroke();
    }

    getBounds() {
      return { x: this.x, y: this.y, r: this.baseRadius * 1.3 };
    }
  }

  // === GAME FUNCTIONS ===

  function init() {
    creatures = [];
    const types = [0, 1, 2, 3, 0, 1, 2, 3];
    for (let i = 0; i < 8; i++) {
      creatures.push(new Creature(types[i % types.length]));
    }
    ambientParticles = [];
    for (let i = 0; i < 40; i++) {
      ambientParticles.push(new AmbientParticle());
    }
    score = 0;
    scoreEl.innerText = '0';
    progressFill.style.width = '0%';
    particles = [];
  }

  function checkCatch() {
    const catchRadius = 55;
    let caughtAny = false;

    creatures.forEach((c) => {
      if (c.isCaught) return;
      const b = c.getBounds();
      const dx = b.x - mouse.x;
      const dy = b.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < catchRadius + b.r * 0.5) {
        catchCreature(c);
        caughtAny = true;
      }
    });

    if (caughtAny) {
      screenShake.intensity = 4;
      for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;
        particles.push(new Particle(
          mouse.x + Math.cos(angle) * 35,
          mouse.y + Math.sin(angle) * 35,
          'rgba(255,255,255,0.5)',
          'ring'
        ));
      }
    }
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;

    const pct = Math.min((score / MAX_CAPTURES) * 100, 100);
    progressFill.style.width = pct + '%';

    // Burst particles
    for (let i = 0; i < 25; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color, 'burst'));
    }
    // Sparkle particles
    for (let i = 0; i < 10; i++) {
      particles.push(new Particle(creature.x, creature.y, '#fff', 'burst', { shape: 'square' }));
    }

    // Toast
    toastEl.classList.add('active');
    clearTimeout(toastEl._timeout);
    toastEl._timeout = setTimeout(() => toastEl.classList.remove('active'), 1400);

    // Respawn
    setTimeout(() => {
      const idx = creatures.indexOf(creature);
      if (idx !== -1) {
        creatures[idx] = new Creature(creature.type);
      }
    }, 3000);
  }

  function resetGame() {
    init();
  }
  window.resetGame = resetGame;
