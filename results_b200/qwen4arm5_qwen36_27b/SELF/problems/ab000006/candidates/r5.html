function fit(){
  const s=Math.min(window.innerWidth/W,window.innerHeight/H);
  canvas.style.width=(W*s)+'px';
  canvas.style.height=(H*s)+'px';
  canvas.style.position='absolute';
  canvas.style.left=((window.innerWidth-W*s)/2)+'px';
  canvas.style.top=((window.innerHeight-H*s)/2)+'px';
}
window.addEventListener('resize',fit);fit();

function drawChar(c,x,y,s,col){
  const d=FONT[c];
  if(!d)return;
  ctx.fillStyle=col;
  for(let r=0;r<d.length;r++){
    for(let cl=0;cl<7;cl++){
      if(d[r]&(1<<(6-cl))){
        ctx.fillRect(x+cl*s,y+r*s,s,s);
      }
    }
  }
}

function drawText(text,x,y,s,col){
  let cx=x;
  for(let i=0;i<text.length;i++){
    drawChar(text[i],cx,y,s,col);
    cx+=8*s;
  }
}

function textWidth(text,s){return text.length*7*s;}

function drawCentered(text,y,s,col){
  const tw=textWidth(text,s);
  drawText(text,Math.floor((W-tw)/2),y,s,col);
}

// === SPRITES ===
function drawSkier(x,y,f){
  const bob=Math.sin(f*0.1)*0.5;
  const lean=Math.sin(f*0.04)*1.5;
  const bx=Math.floor(x+lean);
  const by=Math.floor(y+bob);

  ctx.save();
  ctx.translate(bx,by);

  // Shadow
  ctx.fillStyle='rgba(30,30,60,0.3)';
  ctx.fillRect(-14,24,28,4);

  // Skis
  ctx.fillStyle=P.skierY;
  ctx.fillRect(-14,22,7,3);
  ctx.fillRect(7,22,7,3);
  ctx.fillStyle=P.skierYD;
  ctx.fillRect(-14,24,7,1);
  ctx.fillRect(7,24,7,1);
  // Ski tips
  ctx.fillStyle=P.skierY;
  ctx.fillRect(-14,21,2,1);
  ctx.fillRect(12,21,2,1);

  // Boots
  ctx.fillStyle=P.skierP;
  ctx.fillRect(-12,18,5,5);
  ctx.fillRect(7,18,5,5);
  ctx.fillStyle=P.skierPD;
  ctx.fillRect(-12,22,5,1);
  ctx.fillRect(7,22,5,1);

  // Legs
  ctx.fillStyle=P.skierP;
  ctx.fillRect(-9,10,7,9);
  ctx.fillRect(2,10,7,9);
  ctx.fillStyle=P.skierPD;
  ctx.fillRect(-9,14,7,1);
  ctx.fillRect(2,14,7,1);

  // Body
  ctx.fillStyle=P.skier;
  ctx.fillRect(-8,0,16,11);
  ctx.fillStyle=P.skierD;
  ctx.fillRect(-8,9,16,2);
  // Zipper
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,1,1,8);
  // Collar
  ctx.fillStyle='#ffffff';
  ctx.fillRect(-4,0,8,1);

  // Arms with swing
  const armSwing=Math.sin(f*0.12)*3;
  ctx.fillStyle=P.skier;
  ctx.fillRect(-15,3+armSwing,7,4);
  ctx.fillRect(8,3-armSwing,7,4);
  ctx.fillStyle=P.skierD;
  ctx.fillRect(-15,5+armSwing,7,1);
  ctx.fillRect(8,5-armSwing,7,1);

  // Gloves
  ctx.fillStyle='#ffffff';
  ctx.fillRect(-16,4+armSwing,2,4);
  ctx.fillRect(14,4-armSwing,2,4);

  // Poles
  ctx.fillStyle='#aaaaaa';
  ctx.fillRect(-17,6+armSwing,1,19);
  ctx.fillRect(16,6-armSwing,1,19);
  // Pole baskets
  ctx.fillStyle='#cccccc';
  ctx.fillRect(-18,24,3,1);
  ctx.fillRect(15,24,3,1);

  // Head
  ctx.fillStyle=P.skierS;
  ctx.fillRect(-5,-6,10,9);

  // Hat
  ctx.fillStyle=P.skier;
  ctx.fillRect(-6,-9,12,4);
  ctx.fillStyle=P.skierD;
  ctx.fillRect(-6,-5,12,1);
  // Pom-pom
  ctx.fillStyle='#ffffff';
  ctx.fillRect(-1,-11,3,3);
  ctx.fillStyle=P.skierD;
  ctx.fillRect(1,-11,1,1);

  // Goggles
  ctx.fillStyle=P.skierG;
  ctx.fillRect(-4,-4,9,4);
  ctx.fillStyle=P.skierGH;
  ctx.fillRect(-3,-3,7,1);
  // Goggle strap
  ctx.fillStyle='#111133';
  ctx.fillRect(-6,-3,2,3);
  ctx.fillRect(4,-3,2,3);

  ctx.restore();
}

function drawTree(x,y,s,variant){
  const sc=Math.max(1,Math.floor(s));
  ctx.save();
  ctx.translate(Math.floor(x),Math.floor(y));

  // Shadow
  ctx.fillStyle='rgba(30,30,60,0.25)';
  ctx.fillRect(-sc*6,sc*18,sc*12,sc*2);

  // Trunk
  ctx.fillStyle=P.trunk;
  ctx.fillRect(-sc,sc*14,sc*2,sc*5);
  ctx.fillStyle=P.trunkL;
  ctx.fillRect(-sc,sc*14,sc,sc*5);

  if(variant===0){
    const layers=[
      {dy:12,w:16,h:4,c:P.tree1},
      {dy:9,w:13,h:4,c:P.tree2},
      {dy:6,w:11,h:4,c:P.tree3},
      {dy:3,w:8,h:4,c:P.tree4},
      {dy:0,w:5,h:3,c:P.tree5},
    ];
    layers.forEach((l,i)=>{
      ctx.fillStyle=l.c;
      const hw=Math.floor(l.w/2);
      ctx.fillRect(-hw*sc,l.dy*sc,l.w*sc,l.h*sc);
      if(i<2){
        ctx.fillStyle=P.snow;
        ctx.fillRect(-hw*sc,l.dy*sc,l.w*sc,1);
      }
      ctx.fillStyle=l.c===P.tree1?P.tree3:l.c===P.tree2?P.tree4:P.tree5;
      ctx.fillRect(-hw*sc+sc,l.dy*sc+sc,sc,sc);
    });
    ctx.fillStyle=P.snow;
    ctx.fillRect(-sc*2,-sc,sc*4,sc);
    ctx.fillRect(-sc,0,sc*2,sc);
  } else if(variant===1){
    const layers=[
      {dy:11,w:14,h:5,c:P.tree1},
      {dy:8,w:12,h:4,c:P.tree2},
      {dy:5,w:10,h:4,c:P.tree3},
      {dy:2,w:7,h:3,c:P.tree4},
    ];
    layers.forEach((l,i)=>{
      ctx.fillStyle=l.c;
      const hw=Math.floor(l.w/2);
      ctx.fillRect(-hw*sc,l.dy*sc,l.w*sc,l.h*sc);
      if(i<2){
        ctx.fillStyle=P.snow;
        ctx.fillRect(-hw*sc,l.dy*sc,l.w*sc,1);
      }
    });
    ctx.fillStyle=P.snow;
    ctx.fillRect(-sc,0,sc*3,sc);
  } else {
    const layers=[
      {dy:13,w:12,h:4,c:P.tree1},
      {dy:10,w:10,h:4,c:P.tree2},
      {dy:7,w:8,h:4,c:P.tree3},
      {dy:4,w:6,h:4,c:P.tree4},
      {dy:1,w:4,h:3,c:P.tree5},
    ];
    layers.forEach((l,i)=>{
      ctx.fillStyle=l.c;
      const hw=Math.floor(l.w/2);
      ctx.fillRect(-hw*sc,l.dy*sc,l.w*sc,l.h*sc);
      if(i<2){
        ctx.fillStyle=P.snow;
        ctx.fillRect(-hw*sc,l.dy*sc,l.w*sc,1);
      }
    });
    ctx.fillStyle=P.snow;
    ctx.fillRect(-sc,0,sc*2,sc);
  }

  ctx.restore();
}

function drawMountain(x,y,w,h,layer){
  const colors=[P.mtn1,P.mtn2,P.mtn3,P.mtn4];
  ctx.fillStyle=colors[layer];
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+w/2,y-h);
  ctx.lineTo(x+w,y);
  ctx.fill();

  const capH=h*0.25;
  const peakY=y-h;
  const capY=peakY+capH;
  ctx.fillStyle=P.mtnSnow;
  ctx.beginPath();
  ctx.moveTo(x+w*0.3,capY);
  ctx.lineTo(x+w/2,peakY);
  ctx.lineTo(x+w*0.7,capY);
  ctx.lineTo(x+w*0.58,capY-capH*0.4);
  ctx.lineTo(x+w*0.42,capY-capH*0.3);
  ctx.fill();

  ctx.fillStyle=P.mtnSnowH;
  ctx.beginPath();
  ctx.moveTo(x+w*0.4,capY-capH*0.35);
  ctx.lineTo(x+w/2,peakY);
  ctx.lineTo(x+w*0.5,capY-capH*0.25);
  ctx.fill();
}

// === WORLD ===
let trees=[],snowP=[],clouds=[],stars=[];
let fCount=0;
let btnHover=false;
let btnPressed=false;
let btnX,btnY,btnW,btnH;
let titlePulse=0;

function initWorld(){
  trees=[];
  // Create trees in depth layers
  for(let i=0;i<120;i++){
    const z=Math.random();
    const persp=0.1+z*0.9;
    const y=105+z*130;
    const x=Math.random()*W;
    const scale=0.15+persp*2.5;
    const variant=Math.floor(Math.random()*3);
    trees.push({x,y,scale,z,variant});
  }
  trees.sort((a,b)=>a.z-b.z);

  snowP=[];
  for(let i=0;i<150;i++){
    snowP.push({
      x:Math.random()*W,
      y:Math.random()*H,
      sp:0.3+Math.random()*1.8,
      sz:Math.random()<0.2?2:1,
      dr:-0.6-Math.random()*2,
      wa:Math.random()*Math.PI*2,
      ws:0.015+Math.random()*0.04,
      a:0.2+Math.random()*0.5
    });
  }

  clouds=[];
  for(let i=0;i<8;i++){
    clouds.push({
      x:Math.random()*W,
      y:5+Math.random()*30,
      w:20+Math.random()*60,
      h:3+Math.random()*5,
      sp:0.02+Math.random()*0.12,
      a:0.06+Math.random()*0.1
    });
  }

  stars=[];
  for(let i=0;i<80;i++){
    stars.push({
      x:Math.random()*W,
      y:Math.random()*90,
      b:Math.random(),
      sp:0.006+Math.random()*0.02,
      sz:Math.random()<0.12?2:1
    });
  }
}

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,100);
  g.addColorStop(0,P.skyTop);
  g.addColorStop(0.5,P.skyMid);
  g.addColorStop(0.85,P.skyBot);
  g.addColorStop(1,P.horizon);
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,100);

  // Horizon glow
  const hg=ctx.createLinearGradient(0,85,0,105);
  hg.addColorStop(0,'rgba(232,112,64,0.3)');
  hg.addColorStop(0.5,'rgba(255,144,80,0.15)');
  hg.addColorStop(1,'rgba(255,144,80,0)');
  ctx.fillStyle=hg;
  ctx.fillRect(0,85,W,20);

  // Stars
  stars.forEach(st=>{
    st.b+=st.sp;
    const bright=(Math.sin(st.b)+1)/2;
    if(bright>0.15){
      ctx.globalAlpha=bright*0.6;
      ctx.fillStyle=P.star;
      ctx.fillRect(Math.floor(st.x),Math.floor(st.y),st.sz,st.sz);
    }
  });
  ctx.globalAlpha=1;
}

function drawClouds(){
  clouds.forEach(cl=>{
    cl.x-=cl.sp;
    if(cl.x+cl.w<0)cl.x=W+cl.w;
    ctx.globalAlpha=cl.a;
    ctx.fillStyle=P.cloud;
    const cx=Math.floor(cl.x);
    const cy=Math.floor(cl.y);
    const cw=Math.floor(cl.w);
    const ch=Math.floor(cl.h);
    ctx.fillRect(cx,cy,cw,ch);
    ctx.fillRect(cx+4,cy-1,cw-8,ch);
    ctx.fillRect(cx+8,cy-2,cw-16,Math.max(1,ch-1));
    ctx.fillRect(cx+12,cy-3,Math.max(0,cw-24),Math.max(1,ch-2));
    ctx.globalAlpha=1;
  });
}

function drawMountains(){
  const off=Math.sin(fCount*0.001)*1;

  // Far layer
  ctx.globalAlpha=0.5;
  drawMountain(-40+off*0.3,100,120,35,0);
  drawMountain(80+off*0.3,100,140,50,0);
  drawMountain(210+off*0.3,100,100,30,0);
  ctx.globalAlpha=1;

  // Mid layer
  ctx.globalAlpha=0.7;
  drawMountain(-20+off*0.6,102,130,45,1);
  drawMountain(100+off*0.6,102,150,60,1);
  drawMountain(230+off*0.6,102,110,38,1);
  ctx.globalAlpha=1;

  // Near layer
  drawMountain(10+off,104,90,35,2);
  drawMountain(120+off,104,110,48,2);
  drawMountain(230+off,104,80,30,2);

  // Fog between mountains and slope
  ctx.globalAlpha=0.15;
  ctx.fillStyle=P.fog;
  ctx.fillRect(0,95,W,15);
  ctx.globalAlpha=1;
}

function drawSlope(){
  const g=ctx.createLinearGradient(0,98,0,H);
  g.addColorStop(0,P.snow);
  g.addColorStop(0.3,P.snowMid);
  g.addColorStop(0.7,P.snowDark);
  g.addColorStop(1,P.snowSh);
  ctx.fillStyle=g;
  ctx.fillRect(0,98,W,H-98);

  // Snow texture
  ctx.fillStyle=P.snowMid;
  for(let i=0;i<150;i++){
    const sx=(i*37+fCount*0.15)%W;
    const sy=100+(i*23)%(H-110);
    ctx.fillRect(Math.floor(sx),Math.floor(sy),1,1);
  }

  // Ski tracks
  ctx.globalAlpha=0.08;
  ctx.fillStyle=P.snowSh;
  for(let i=0;i<8;i++){
    const tx=30+i*40+Math.sin(fCount*0.005+i)*5;
    ctx.fillRect(tx,100,2,H-100);
    ctx.fillRect(tx+4,100,2,H-100);
  }
  ctx.globalAlpha=1;

  // Snow drifts
  ctx.fillStyle=P.snowMid;
  for(let i=0;i<15;i++){
    const dx=i*22+5;
    const dy=H-6+Math.sin(i*1.3)*4;
    ctx.fillRect(dx,dy,18,5);
    ctx.fillRect(dx+2,dy-1,14,1);
  }
}

function drawTrees(){
  trees.forEach(t=>{
    drawTree(t.x,t.y,t.scale,t.variant);
  });
}

function drawSnow(){
  snowP.forEach(p=>{
    p.y+=p.sp;
    p.x+=p.dr;
    p.wa+=p.ws;
    p.x+=Math.sin(p.wa)*0.2;

    if(p.y>H){p.y=-2;p.x=Math.random()*W;}
    if(p.x<-5)p.x=W+5;
    if(p.x>W+5)p.x=-5;

    ctx.globalAlpha=p.a;
    ctx.fillStyle='#ffffff';
    ctx.fillRect(Math.floor(p.x),Math.floor(p.y),p.sz,p.sz);
  });
  ctx.globalAlpha=1;
}

function drawWindStreaks(){
  ctx.globalAlpha=0.03;
  ctx.fillStyle='#ffffff';
  for(let i=0;i<6;i++){
    const sx=(i*73+fCount*2.5)%W;
    const sy=105+(i*47)%(H-115);
    ctx.fillRect(sx,sy,10+Math.random()*8,1);
  }
  ctx.globalAlpha=1;
}

// === YETI ===
function drawYeti(){
  const yetiX=220+Math.sin(fCount*0.005)*15;
  const yetiY=118+Math.sin(fCount*0.003)*3;
  const yetiAlpha=0.12+Math.sin(fCount*0.01)*0.06;

  ctx.globalAlpha=yetiAlpha;

  // Body
  ctx.fillStyle=P.yeti;
  ctx.fillRect(yetiX,yetiY,14,18);
  ctx.fillRect(yetiX-1,yetiY+3,16,14);
  ctx.fillRect(yetiX-2,yetiY+6,18,8);

  // Head
  ctx.fillRect(yetiX+1,yetiY-9,11,10);
  ctx.fillRect(yetiX+2,yetiY-11,9,3);

  // Arms
  ctx.fillRect(yetiX-5,yetiY+2,5,12);
  ctx.fillRect(yetiX+14,yetiY+2,5,12);

  // Legs
  ctx.fillRect(yetiX+1,yetiY+18,5,7);
  ctx.fillRect(yetiX+8,yetiY+18,5,7);

  // Eyes (glowing red)
  ctx.fillStyle=P.yetiE;
  ctx.fillRect(yetiX+3,yetiY-6,3,2);
  ctx.fillRect(yetiX+8,yetiY-6,3,2);

  // Eye glow
  ctx.globalAlpha=yetiAlpha*0.5;
  ctx.fillStyle=P.yetiGlow;
  ctx.fillRect(yetiX+2,yetiY-7,5,4);
  ctx.fillRect(yetiX+7,yetiY-7,5,4);

  // Mouth
  ctx.globalAlpha=yetiAlpha*0.4;
  ctx.fillStyle=P.yetiE;
  ctx.fillRect(yetiX+4,yetiY-2,6,1);

  ctx.globalAlpha=1;
}

// === TITLE ===
function drawTitle(){
  titlePulse+=0.02;
  const pulse=Math.sin(titlePulse)*0.08+0.92;

  const titleY=2;
  const titleS=8;

  // Glow behind title
  ctx.globalAlpha=0.06*pulse;
  ctx.fillStyle=P.titleGlow;
  const glowW=textWidth('SKIFREE',titleS);
  ctx.fillRect((W-glowW)/2-10,titleY-8,glowW+20,60);
  ctx.globalAlpha=1;

  // Deep shadow
  drawCentered('SKIFREE',titleY+6,titleS,'#030308');
  // Mid shadow
  drawCentered('SKIFREE',titleY+4,titleS,'#060612');
  // Dark outline
  drawCentered('SKIFREE',titleY+2,titleS,'#0a0a1e');
  // Dark blue
  drawCentered('SKIFREE',titleY,titleS,P.titleDark);
  // Main text
  drawCentered('SKIFREE',titleY-1,titleS,P.title);
  // Highlight
  drawCentered('SKIFREE',titleY-2,titleS,P.titleLight);

  // Snow particles on title
  ctx.fillStyle='rgba(255,255,255,0.5)';
  for(let i=0;i<12;i++){
    const sx=40+i*22+Math.sin(fCount*0.02+i*0.8)*4;
    const sy=titleY-8+Math.abs(Math.sin(fCount*0.03+i*0.7))*4;
    ctx.fillRect(Math.floor(sx),Math.floor(sy),2,1);
  }

  // Subtitle
  ctx.globalAlpha=0.4;
  drawCentered('SURVIVE THE YETI',titleY+62,2,P.hudT);
  ctx.globalAlpha=0.25;
  ctx.fillStyle=P.hudB;
  ctx.fillRect(50,titleY+66,220,1);
  ctx.fillRect(70,titleY+67,180,1);
  ctx.globalAlpha=1;
}

// === INSTRUCTIONS ===
function drawInstructions(){
  const iy=H-52;

  // Panel background
  ctx.fillStyle='rgba(6,6,20,0.75)';
  ctx.fillRect(W/2-105,iy-14,210,34);

  // Panel border
  ctx.fillStyle=P.hudB;
  ctx.fillRect(W/2-105,iy-14,210,1);
  ctx.fillRect(W/2-105,iy+19,210,1);
  ctx.fillRect(W/2-105,iy-14,1,34);
  ctx.fillRect(W/2+104,iy-14,1,34);

  // Corner accents
  ctx.fillStyle=P.hudBr;
  ctx.fillRect(W/2-105,iy-14,3,3);
  ctx.fillRect(W/2+102,iy-14,3,3);
  ctx.fillRect(W/2-105,iy+17,3,3);
  ctx.fillRect(W/2+102,iy+17,3,3);

  drawCentered('USE  <  >  TO STEER',iy-6,2,P.hudBr);
  drawCentered('AVOID TREES & YETI',iy+8,2,P.hudT);
}

// === START BUTTON ===
function drawStartBtn(){
  btnW=130;btnH=28;
  btnX=(W-btnW)/2;
  btnY=H-90;

  const hov=btnHover;
  const prs=btnPressed;

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.fillRect(btnX+4,btnY+5,btnW,btnH);

  // Button body
  ctx.fillStyle=prs?'#a0a0c0':hov?'#f8f8ff':P.btn;
  ctx.fillRect(btnX,btnY,btnW,btnH);

  // Top highlight
  ctx.fillStyle='#ffffff';
  ctx.fillRect(btnX+1,btnY+1,btnW-2,2);
  ctx.fillRect(btnX+1,btnY+1,2,btnH-2);

  // Bottom edge
  ctx.fillStyle=P.btnD;
  ctx.fillRect(btnX+1,btnY+btnH-2,btnW-2,2);
  ctx.fillRect(btnX+btnW-2,btnY+1,2,btnH-2);

  // Inner bevel
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.fillRect(btnX+3,btnY+3,btnW-6,1);
  ctx.fillRect(btnX+3,btnY+3,1,btnH-6);

  // Inner shadow
  ctx.fillStyle='rgba(0,0,0,0.06)';
  ctx.fillRect(btnX+3,btnY+btnH-4,btnW-6,1);
  ctx.fillRect(btnX+btnW-4,btnY+3,1,btnH-6);

  // Text
  const tw=textWidth('START',3);
  const tx=btnX+(btnW-tw)/2;
  const ty=btnY+(btnH-7)/2;
  ctx.fillStyle=P.btnT;
  drawText('START',tx,ty,3,P.btnT);

  // Blinking cursor
  if(Math.floor(fCount/18)%2===0){
    ctx.fillStyle=P.btnT;
    ctx.fillRect(btnX+btnW-14,btnY+10,2,8);
  }

  // Hover glow
  if(hov&&!prs){
    ctx.globalAlpha=0.12;
    ctx.fillStyle='#88aaff';
    ctx.fillRect(btnX-3,btnY-3,btnW+6,btnH+6);
    ctx.globalAlpha=1;
  }
}

// === SCANLINES ===
function drawScanlines(){
  ctx.fillStyle='rgba(0,0,0,0.04)';
  for(let y=0;y<H;y+=2){
    ctx.fillRect(0,y,W,1);
  }
}

// === VIGNETTE ===
function drawVignette(){
  const g=ctx.createRadialGradient(W/2,H/2,W*0.2,W/2,H/2,W*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(0.7,'rgba(0,0,0,0.15)');
  g.addColorStop(1,'rgba(0,0,0,0.45)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}

// === MOUSE ===
canvas.addEventListener('mousemove',function(e){
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width);
  const my=(e.clientY-rect.top)*(H/rect.height);
  btnHover=mx>=btnX&&mx<=btnX+btnW&&my>=btnY&&my<=btnY+btnH;
  canvas.style.cursor=btnHover?'pointer':'default';
});

canvas.addEventListener('mousedown',function(e){
  if(btnHover)btnPressed=true;
});

canvas.addEventListener('mouseup',function(e){
  if(btnPressed&&btnHover){
    btnPressed=false;
    alert('SKIING! Use arrow keys to avoid trees. Watch out for the Yeti!');
  } else {
    btnPressed=false;
  }
});

canvas.addEventListener('mouseleave',function(){
  btnHover=false;
  btnPressed=false;
  canvas.style.cursor='default';
});

canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const touch=e.touches[0];
  const mx=(touch.clientX-rect.left)*(W/rect.width);
  const my=(touch.clientY-rect.top)*(H/rect.height);
  if(mx>=btnX&&mx<=btnX+btnW&&my>=btnY&&my<=btnY+btnH){
    btnPressed=true;
    setTimeout(()=>{
      btnPressed=false;
      alert('SKIING! Use arrow keys to avoid trees. Watch out for the Yeti!');
    },150);
  }
},{passive:false});

// === MAIN LOOP ===
function animate(){
  fCount++;

  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);

  drawSky();
  drawClouds();
  drawMountains();
  drawSlope();
  drawWindStreaks();
  drawTrees();
  drawYeti();

  // Skier
  const skierX=W/2+Math.sin(fCount*0.01)*35;
  drawSkier(skierX,145,fCount);

  drawSnow();

  // UI Layer
  drawTitle();
  drawInstructions();
  drawStartBtn();

  // Post-processing
  drawScanlines();
  drawVignette();

  requestAnimationFrame(animate);
}

initWorld();
animate();
})();
</script>
