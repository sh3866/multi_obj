<script>
(function(){

const ctx=canvas.getContext('2d');

canvas.width=W;canvas.height=H;

function fit(){
  const s=Math.min(window.innerWidth/W,window.innerHeight/H);
  canvas.style.width=(W*s)+'px';
  canvas.style.height=(H*s)+'px';
  canvas.style.position='absolute';
  canvas.style.left=((window.innerWidth-W*s)/2)+'px';
  canvas.style.top=((window.innerHeight-H*s)/2)+'px';
}
window.addEventListener('resize',fit);fit();

  '=':[0,0,0x7e,0,0x7e,0,0],
  '*':[0,0x10,0x2c,0x58,0x2c,0x10,0],
  '$':[0x3e,0x42,0x40,0x3e,0x04,0x42,0x3e],

function drawChar(c,x,y,s,col){
  const d=FONT[c];
  if(!d)return;
  ctx.fillStyle=s;
  for(let r=0;r<d.length;r++){
    for(let cl=0;cl<7;cl++){
      if(d[r]&(1<<(6-cl))){
        ctx.fillRect(x+cl*s,y+r*s,s,s);
      }
    }
  }
}

function drawText(text,x,y,s,col){
  let cx=x;
  for(let i=0;i<text.length;i++){
    drawChar(text[i],cx,y,s,col);
    cx+=8*s;
  }
}

function textWidth(text,s){return text.length*8*s;}

function drawCentered(text,y,s,col){
  const tw=textWidth(text,s);
  drawText(text,Math.floor((W-tw)/2),y,s,col);
}

function drawCenteredShadow(text,y,s,col,shCol,shOff){
  if(shOff===undefined)shOff=2;
  drawCentered(text,y+shOff,s,shCol||P.titleSh);
  drawCentered(text,y,s,col);
}

// === SPRITES ===
function drawSkier(x,y,f){
  const bob=Math.sin(f*0.15)*1;
  const lean=Math.sin(f*0.04)*1.5;
  const bx=Math.floor(x+lean);
  const by=Math.floor(y+bob);

  ctx.save();
  ctx.translate(bx,by);

  // Shadow
  ctx.fillStyle='rgba(80,80,140,0.3)';
  ctx.fillRect(-10,20,20,2);

  // Skis
  ctx.fillStyle=P.skierY;
  ctx.fillRect(-11,18,4,3);
  ctx.fillRect(7,18,4,3);
  ctx.fillStyle=P.skierYD;
  ctx.fillRect(-11,20,4,1);
  ctx.fillRect(7,20,4,1);

  // Boots
  ctx.fillStyle=P.skierP;
  ctx.fillRect(-9,16,3,3);
  ctx.fillRect(6,16,3,3);
  ctx.fillStyle=P.skierPD;
  ctx.fillRect(-9,18,3,1);
  ctx.fillRect(6,18,3,1);

  // Legs
  ctx.fillStyle=P.skierP;
  ctx.fillRect(-7,10,5,7);
  ctx.fillRect(2,10,5,7);
  ctx.fillStyle=P.skierPD;
  ctx.fillRect(-7,12,5,1);
  ctx.fillRect(2,12,5,1);
  ctx.fillRect(-7,15,5,1);
  ctx.fillRect(2,15,5,1);

  // Body
  ctx.fillStyle=P.skier;
  ctx.fillRect(-6,2,12,9);
  ctx.fillStyle=P.skierD;
  ctx.fillRect(-6,9,12,2);
  // Zipper detail
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,3,1,7);

  // Arms
  ctx.fillStyle=P.skier;
  ctx.fillRect(-11,4,5,3);
  ctx.fillRect(6,4,5,3);
  ctx.fillStyle=P.skierD;
  ctx.fillRect(-11,6,5,1);
  ctx.fillRect(6,6,5,1);

  // Gloves
  ctx.fillStyle='#ffffff';
  ctx.fillRect(-12,5,2,2);
  ctx.fillRect(10,5,2,2);

  // Poles
  ctx.fillStyle='#888888';
  ctx.fillRect(-13,6,1,16);
  ctx.fillRect(12,6,1,16);
  ctx.fillStyle='#aaaaaa';
  ctx.fillRect(-14,21,3,1);
  ctx.fillRect(11,21,3,1);

  // Head
  ctx.fillStyle=P.skierS;
  ctx.fillRect(-4,-4,8,7);

  // Hat
  ctx.fillStyle=P.skier;
  ctx.fillRect(-5,-6,10,3);
  ctx.fillStyle=P.skierD;
  ctx.fillRect(-5,-3,10,1);
  // Hat pom-pom
  ctx.fillStyle='#ffffff';
  ctx.fillRect(-1,-8,2,2);

  // Goggles
  ctx.fillStyle=P.skierG;
  ctx.fillRect(-3,-2,7,3);
  ctx.fillStyle=P.skierGH;
  ctx.fillRect(-2,-1,5,1);

  ctx.restore();
}

function drawTree(x,y,s,variant){
  const sc=Math.max(1,Math.floor(s));
  ctx.save();
  ctx.translate(Math.floor(x),Math.floor(y));

  // Shadow
  ctx.fillStyle='rgba(60,60,100,0.25)';
  ctx.fillRect(-sc*4,sc*18,sc*8,sc);

  // Trunk
  ctx.fillStyle=P.trunk;
  ctx.fillRect(-sc,sc*14,sc*2,sc*5);
  ctx.fillStyle=P.trunkL;
  ctx.fillRect(-sc,sc*14,sc,sc*5);

  // Tree layers based on variant
  if(variant===0){
    // Classic triangle
    const layers=[
      {dy:10,w:14,h:4,c:P.tree1},
      {dy:7,w:11,h:4,c:P.tree2},
      {dy:4,w:9,h:4,c:P.tree3},
      {dy:1,w:6,h:4,c:P.tree4},
    ];
    layers.forEach(l=>{
      ctx.fillStyle=l.c;
      const hw=Math.floor(l.w/2);
      ctx.fillRect(-hw*sc,l.dy*sc,l.w*sc,l.h*sc);
      // Highlight
      ctx.fillStyle=l.c===P.tree1?P.tree3:l.c===P.tree2?P.tree4:P.tree5;
      ctx.fillRect(-hw*sc+sc,l.dy*sc+sc,sc,sc);
    });
    // Snow cap
    ctx.fillStyle=P.snow;
    ctx.fillRect(-sc*2,0,sc*4,sc);
    ctx.fillRect(-sc,sc,sc*2,sc);
  } else if(variant===1){
    // Rounder tree
    const layers=[
      {dy:9,w:12,h:5,c:P.tree1},
      {dy:6,w:10,h:4,c:P.tree2},
      {dy:3,w:8,h:4,c:P.tree3},
      {dy:0,w:5,h:3,c:P.tree4},
    ];
    layers.forEach(l=>{
      ctx.fillStyle=l.c;
      const hw=Math.floor(l.w/2);
      ctx.fillRect(-hw*sc,l.dy*sc,l.w*sc,l.h*sc);
      ctx.fillStyle=l.c===P.tree1?P.tree3:P.tree4;
      ctx.fillRect(-hw*sc+sc,l.dy*sc+sc,sc,sc);
    });
    ctx.fillStyle=P.snow;
    ctx.fillRect(-sc,0,sc*3,sc);
  } else {
    // Tall thin tree
    const layers=[
      {dy:10,w:10,h:4,c:P.tree1},
      {dy:7,w:8,h:4,c:P.tree2},
      {dy:4,w:6,h:4,c:P.tree3},
      {dy:1,w:4,h:4,c:P.tree4},
    ];
    layers.forEach(l=>{
      ctx.fillStyle=l.c;
      const hw=Math.floor(l.w/2);
      ctx.fillRect(-hw*sc,l.dy*sc,l.w*sc,l.h*sc);
    });
    ctx.fillStyle=P.snow;
    ctx.fillRect(-sc,0,sc*2,sc);
  }

  ctx.restore();
}

function drawMountain(x,y,w,h,layer){
  const colors=[P.mtn1,P.mtn2,P.mtn3];
  ctx.fillStyle=colors[layer];
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+w/2,y-h);
  ctx.lineTo(x+w,y);
  ctx.fill();

  // Snow cap
  const capH=h*0.3;
  ctx.fillStyle=P.mtnSnow;
  ctx.beginPath();
  ctx.moveTo(x+w*0.35,y-h*0.6);
  ctx.lineTo(x+w/2,y-h);
  ctx.lineTo(x+w*0.65,y-h*0.6);
  ctx.lineTo(x+w*0.55,y-h*0.5);
  ctx.lineTo(x+w*0.45,y-h*0.55);
  ctx.fill();

  // Snow highlight
  ctx.fillStyle=P.mtnSnowH;
  ctx.beginPath();
  ctx.moveTo(x+w*0.42,y-h*0.7);
  ctx.lineTo(x+w/2,y-h);
  ctx.lineTo(x+w*0.5,y-h*0.68);
  ctx.fill();
}

// === WORLD ===
let trees=[],snowP=[],clouds=[],stars=[];
let fCount=0;
let btnHover=false;
let btnPressed=false;
let btnX,btnY,btnW,btnH;
let titlePulse=0;

function initWorld(){
  trees=[];
  for(let i=0;i<80;i++){
    const z=Math.random();
    const persp=0.15+z*0.85;
    const y=100+z*120;
    const x=Math.random()*W;
    const scale=0.3+persp*1.8;
    const variant=Math.floor(Math.random()*3);
    trees.push({x,y,scale,z,variant});
  }
  trees.sort((a,b)=>a.z-b.z);

  snowP=[];
  for(let i=0;i<80;i++){
    snowP.push({
      x:Math.random()*W,
      y:Math.random()*H,
      sp:0.3+Math.random()*1.2,
      sz:Math.random()<0.3?2:1,
      dr:-0.5-Math.random()*1.5,
      wa:Math.random()*Math.PI*2,
      ws:0.015+Math.random()*0.03
    });
  }

  clouds=[];
  for(let i=0;i<8;i++){
    clouds.push({
      x:Math.random()*W,
      y:5+Math.random()*30,
      w:20+Math.random()*40,
      h:2+Math.random()*3,
      sp:0.05+Math.random()*0.2,
      a:0.1+Math.random()*0.15
    });
  }

  stars=[];
  for(let i=0;i<50;i++){
    stars.push({
      x:Math.random()*W,
      y:Math.random()*60,
      b:Math.random(),
      sp:0.01+Math.random()*0.03,
      sz:Math.random()<0.2?2:1
    });
  }
}

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,95);
  g.addColorStop(0,P.sky);
  g.addColorStop(0.5,P.skyMid);
  g.addColorStop(1,P.skyBot);
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,95);

  // Stars
  stars.forEach(st=>{
    st.b+=st.sp;
    const bright=(Math.sin(st.b)+1)/2;
    if(bright>0.3){
      ctx.globalAlpha=bright*0.8;
      ctx.fillStyle='#ffffff';
      ctx.fillRect(Math.floor(st.x),Math.floor(st.y),st.sz,st.sz);
    }
  });
  ctx.globalAlpha=1;
}

function drawClouds(){
  clouds.forEach(cl=>{
    cl.x-=cl.sp;
    if(cl.x+cl.w<0)cl.x=W+cl.w;
    ctx.globalAlpha=cl.a;
    ctx.fillStyle=P.cloud;
    const cx=Math.floor(cl.x);
    const cy=Math.floor(cl.y);
    const cw=Math.floor(cl.w);
    const ch=Math.floor(cl.h);
    ctx.fillRect(cx,cy,cw,ch);
    ctx.fillRect(cx+2,cy-1,cw-4,ch);
    ctx.fillRect(cx+4,cy-2,cw-8,Math.max(1,ch-1));
    ctx.globalAlpha=1;
  });
}

function drawMountains(){
  const off=Math.sin(fCount*0.002)*2;
  // Far layer
  drawMountain(-20+off,96,90,35,0);
  drawMountain(50+off,96,120,50,0);
  drawMountain(160+off,96,80,30,0);
  drawMountain(240+off,96,100,45,0);

  // Mid layer
  drawMountain(-10+off*1.5,98,100,40,1);
  drawMountain(80+off*1.5,98,110,55,1);
  drawMountain(190+off*1.5,98,90,35,1);

  // Near layer
  drawMountain(30+off*2,100,80,30,2);
  drawMountain(140+off*2,100,100,40,2);
  drawMountain(250+off*2,100,70,25,2);
}

function drawSlope(){
  // Base snow with gradient
  const g=ctx.createLinearGradient(0,92,0,H);
  g.addColorStop(0,P.snow);
  g.addColorStop(0.3,P.snowMid);
  g.addColorStop(1,P.snowDark);
  ctx.fillStyle=g;
  ctx.fillRect(0,92,W,H-92);

  // Snow texture
  ctx.fillStyle=P.snowMid;
  for(let i=0;i<80;i++){
    const sx=(i*37+fCount*0.15)%W;
    const sy=95+(i*23)%(H-100);
    ctx.fillRect(Math.floor(sx),Math.floor(sy),1,1);
  }

  // Ski tracks (subtle)
  ctx.globalAlpha=0.08;
  ctx.fillStyle=P.snowDark;
  for(let i=0;i<8;i++){
    const tx=40+i*35;
    ctx.fillRect(tx,95,2,H-95);
    ctx.fillRect(tx+4,95,2,H-95);
  }
  ctx.globalAlpha=1;
}

function drawTrees(){
  trees.forEach(t=>{
    drawTree(t.x,t.y,t.scale,t.variant);
  });
}

function drawSnow(){
  snowP.forEach(p=>{
    p.y+=p.sp;
    p.x+=p.dr;
    p.wa+=p.ws;
    p.x+=Math.sin(p.wa)*0.25;

    if(p.y>H){p.y=-2;p.x=Math.random()*W;}
    if(p.x<-5)p.x=W+5;
    if(p.x>W+5)p.x=-5;

    ctx.globalAlpha=0.2+Math.random()*0.2;
    ctx.fillStyle='#ffffff';
    ctx.fillRect(Math.floor(p.x),Math.floor(p.y),p.sz,p.sz);
  });
  ctx.globalAlpha=1;
}

function drawWindStreaks(){
  ctx.globalAlpha=0.06;
  ctx.fillStyle='#ffffff';
  for(let i=0;i<4;i++){
    const sx=(i*83+fCount*1.5)%W;
    const sy=100+(i*53)%(H-110);
    ctx.fillRect(sx,sy,6+Math.random()*4,1);
  }
  ctx.globalAlpha=1;
}

// === YETI ===
function drawYeti(){
  const yetiX=220+Math.sin(fCount*0.008)*15;
  const yetiY=108+Math.sin(fCount*0.006)*3;
  const alpha=0.12+Math.sin(fCount*0.015)*0.06;

  ctx.globalAlpha=alpha;

  // Body
  ctx.fillStyle=P.yeti;
  ctx.fillRect(yetiX,yetiY,10,14);
  ctx.fillRect(yetiX-1,yetiY+2,12,10);

  // Head
  ctx.fillRect(yetiX+1,yetiY-6,8,7);

  // Eyes (glowing red)
  ctx.fillStyle=P.yetiE;
  ctx.fillRect(yetiX+2,yetiY-4,2,2);
  ctx.fillRect(yetiX+6,yetiY-4,2,2);

  // Eye glow
  ctx.globalAlpha=alpha*0.5;
  ctx.fillStyle=P.yetiE;
  ctx.fillRect(yetiX+1,yetiY-5,4,4);
  ctx.fillRect(yetiX+5,yetiY-5,4,4);

  ctx.globalAlpha=1;
}

// === TITLE ===
function drawTitle(){
  titlePulse+=0.03;
  const pulse=Math.sin(titlePulse)*0.15+0.85;

  const titleY=8;

  // Glow behind title
  ctx.globalAlpha=0.1*pulse;
  ctx.fillStyle=P.titleGlow;
  const glowW=textWidth('SKIFREE',5);
  ctx.fillRect((W-glowW)/2-4,titleY-4,glowW+8,42);
  ctx.globalAlpha=1;

  // Outer shadow
  drawCentered('SKIFREE',titleY+3,5,'#0a0a2a');
  // Inner shadow
  drawCentered('SKIFREE',titleY+1,5,'#1a1a4a');
  // Main text
  drawCentered('SKIFREE',titleY,5,P.title);

  // Snow on title letters
  ctx.fillStyle='rgba(255,255,255,0.5)';
  for(let i=0;i<6;i++){
    const sx=55+i*30+Math.sin(fCount*0.02+i)*2;
    const sy=titleY-3+Math.abs(Math.sin(fCount*0.04+i*0.5))*2;
    ctx.fillRect(Math.floor(sx),Math.floor(sy),2,1);
  }

  // Subtitle
  ctx.globalAlpha=0.6;
  drawCentered('SURVIVE THE YETI',titleY+38,1,P.hudT);
  ctx.globalAlpha=1;

  // Decorative line
  ctx.fillStyle=P.hudB;
  ctx.fillRect(60,titleY+42,200,1);
  ctx.fillRect(80,titleY+43,160,1);
}

// === INSTRUCTIONS ===
function drawInstructions(){
  const iy=H-48;

  // Panel
  ctx.fillStyle='rgba(10,10,30,0.65)';
  ctx.fillRect(W/2-95,iy-10,190,28);
  ctx.fillStyle=P.hudB;
  ctx.fillRect(W/2-95,iy-10,190,1);
  ctx.fillRect(W/2-95,iy+17,190,1);
  ctx.fillRect(W/2-95,iy-10,1,28);
  ctx.fillRect(W/2+94,iy-10,1,28);

  drawCentered('USE  <  >  TO STEER',iy-3,1,P.hudBr);
  drawCentered('AVOID TREES & YETI',iy+9,1,P.hudT);
}

// === START BUTTON ===
function drawStartBtn(){
  btnW=100;btnH=20;
  btnX=(W-btnW)/2;
  btnY=H-78;

  const hov=btnHover;
  const prs=btnPressed;

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.fillRect(btnX+2,btnY+3,btnW,btnH);

  // Button body
  ctx.fillStyle=prs?'#c0c0d0':hov?'#ffffff':P.btn;
  ctx.fillRect(btnX,btnY,btnW,btnH);

  // Top highlight
  ctx.fillStyle='#ffffff';
  ctx.fillRect(btnX,btnY,btnW,2);
  ctx.fillRect(btnX,btnY,2,btnH);

  // Bottom edge
  ctx.fillStyle=P.btnD;
  ctx.fillRect(btnX,btnY+btnH-2,btnW,2);
  ctx.fillRect(btnX+btnW-2,btnY,2,btnH);

  // Inner bevel
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.fillRect(btnX+2,btnY+2,btnW-4,1);
  ctx.fillRect(btnX+2,btnY+2,1,btnH-4);

  // Text
  const tw=textWidth('START',1);
  const tx=btnX+(btnW-tw)/2;
  const ty=btnY+(btnH-7)/2;
  ctx.fillStyle=P.btnT;
  drawText('START',tx,ty,1,P.btnT);

  // Blinking cursor
  if(Math.floor(fCount/25)%2===0){
    ctx.fillStyle=P.btnT;
    ctx.fillRect(btnX+btnW-6,btnY+7,1,5);
  }
}

// === SCANLINES ===
function drawScanlines(){
  ctx.fillStyle='rgba(0,0,0,0.04)';
  for(let y=0;y<H;y+=3){
    ctx.fillRect(0,y,W,1);
  }
}

// === VIGNETTE ===
function drawVignette(){
  const g=ctx.createRadialGradient(W/2,H/2,W*0.3,W/2,H/2,W*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.2)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}

// === MOUSE ===
canvas.addEventListener('mousemove',function(e){
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width);
  const my=(e.clientY-rect.top)*(H/rect.height);
  btnHover=mx>=btnX&&mx<=btnX+btnW&&my>=btnY&&my<=btnY+btnH;
  canvas.style.cursor=btnHover?'pointer':'default';
});

canvas.addEventListener('mousedown',function(e){
  if(btnHover){
    btnPressed=true;
  }
});

canvas.addEventListener('mouseup',function(e){
  if(btnPressed&&btnHover){
    btnPressed=false;
    alert('SKIING! Use arrow keys to avoid trees. Watch out for the Yeti!');
  } else {
    btnPressed=false;
  }
});

canvas.addEventListener('mouseleave',function(){
  btnHover=false;
  btnPressed=false;
  canvas.style.cursor='default';
});

canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const touch=e.touches[0];
  const mx=(touch.clientX-rect.left)*(W/rect.width);
  const my=(touch.clientY-rect.top)*(H/rect.height);
  if(mx>=btnX&&mx<=btnX+btnW&&my>=btnY&&my<=btnY+btnH){
    btnPressed=true;
    setTimeout(()=>{
      btnPressed=false;
      alert('SKIING! Use arrow keys to avoid trees. Watch out for the Yeti!');
    },150);
  }
},{passive:false});

// === MAIN LOOP ===
function animate(){
  fCount++;

  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);

  drawSky();
  drawClouds();
  drawMountains();
  drawSlope();
  drawWindStreaks();
  drawTrees();
  drawYeti();

  // Skier
  const skierX=W/2+Math.sin(fCount*0.015)*25;
  drawSkier(skierX,135,fCount);

  drawSnow();

  // UI
  drawTitle();
  drawInstructions();
  drawStartBtn();

  // Post-processing
  drawScanlines();
  drawVignette();

  requestAnimationFrame(animate);
}

initWorld();
animate();
})();
</script>
