<script>

canvas.width=W;canvas.height=H;

function fit(){
  const s=Math.min(window.innerWidth/W,window.innerHeight/H);
  canvas.style.width=(W*s)+'px';
  canvas.style.height=(H*s)+'px';
  canvas.style.position='absolute';
  canvas.style.left=((window.innerWidth-W*s)/2)+'px';
  canvas.style.top=((window.innerHeight-H*s)/2)+'px';
}
window.addEventListener('resize',fit);fit();

function drawChar(c,x,y,s,col){
  const d=FONT[c];
  if(!d)return;
  ctx.fillStyle=col;
  for(let r=0;r<d.length;r++){
    for(let cl=0;cl<7;cl++){
      if(d[r]&(1<<(6-cl))){
        ctx.fillRect(x+cl*s,y+r*s,s,s);
      }
    }
  }
}

function drawText(text,x,y,s,col){
  let cx=x;
  for(let i=0;i<text.length;i++){
    drawChar(text[i],cx,y,s,col);
    cx+=8*s;
  }
}

function textWidth(text,s){return text.length*7*s;}

function drawCentered(text,y,s,col){
  const tw=textWidth(text,s);
  drawText(text,Math.floor((W-tw)/2),y,s,col);
}

function drawCenteredMulti(text,y,s,col,shCol,shOff){
  if(shOff===undefined)shOff=2;
  if(shCol)drawCentered(text,y+shOff,s,shCol);
  drawCentered(text,y,s,col);
}

// === SPRITES ===
function drawSkier(x,y,f){
  const bob=Math.sin(f*0.12)*1;
  const lean=Math.sin(f*0.03)*2;
  const bx=Math.floor(x+lean);
  const by=Math.floor(y+bob);

  ctx.save();
  ctx.translate(bx,by);

  // Shadow
  ctx.fillStyle='rgba(40,40,80,0.3)';
  ctx.fillRect(-12,22,24,3);

  // Skis
  ctx.fillStyle=P.skierY;
  ctx.fillRect(-13,20,6,3);
  ctx.fillRect(7,20,6,3);
  ctx.fillStyle=P.skierYD;
  ctx.fillRect(-13,22,6,1);
  ctx.fillRect(7,22,6,1);

  // Boots
  ctx.fillStyle=P.skierP;
  ctx.fillRect(-11,17,4,4);
  ctx.fillRect(7,17,4,4);
  ctx.fillStyle=P.skierPD;
  ctx.fillRect(-11,19,4,1);
  ctx.fillRect(7,19,4,1);

  // Legs
  ctx.fillStyle=P.skierP;
  ctx.fillRect(-8,10,6,8);
  ctx.fillRect(2,10,6,8);
  ctx.fillStyle=P.skierPD;
  ctx.fillRect(-8,13,6,1);
  ctx.fillRect(2,13,6,1);
  ctx.fillRect(-8,16,6,1);
  ctx.fillRect(2,16,6,1);

  // Body
  ctx.fillStyle=P.skier;
  ctx.fillRect(-7,1,14,10);
  ctx.fillStyle=P.skierD;
  ctx.fillRect(-7,9,14,2);
  // Zipper
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,2,1,8);
  // Collar
  ctx.fillStyle='#ffffff';
  ctx.fillRect(-3,1,6,1);

  // Arms with swing
  const armSwing=Math.sin(f*0.15)*3;
  ctx.fillStyle=P.skier;
  ctx.fillRect(-13,3+armSwing,6,3);
  ctx.fillRect(7,3-armSwing,6,3);
  ctx.fillStyle=P.skierD;
  ctx.fillRect(-13,5+armSwing,6,1);
  ctx.fillRect(7,5-armSwing,6,1);

  // Gloves
  ctx.fillStyle='#ffffff';
  ctx.fillRect(-14,4+armSwing,2,3);
  ctx.fillRect(12,4-armSwing,2,3);

  // Poles
  ctx.fillStyle='#999999';
  ctx.fillRect(-15,5+armSwing,1,18);
  ctx.fillRect(14,5-armSwing,1,18);
  // Pole baskets
  ctx.fillStyle='#bbbbbb';
  ctx.fillRect(-16,22,3,1);
  ctx.fillRect(13,22,3,1);

  // Head
  ctx.fillStyle=P.skierS;
  ctx.fillRect(-4,-5,8,8);

  // Hat
  ctx.fillStyle=P.skier;
  ctx.fillRect(-5,-7,10,3);
  ctx.fillStyle=P.skierD;
  ctx.fillRect(-5,-4,10,1);
  // Pom-pom
  ctx.fillStyle='#ffffff';
  ctx.fillRect(-1,-9,2,2);
  ctx.fillStyle=P.skierD;
  ctx.fillRect(0,-9,1,1);

  // Goggles
  ctx.fillStyle=P.skierG;
  ctx.fillRect(-3,-3,7,3);
  ctx.fillStyle=P.skierGH;
  ctx.fillRect(-2,-2,5,1);
  // Goggle strap
  ctx.fillStyle='#111133';
  ctx.fillRect(-5,-2,2,2);
  ctx.fillRect(3,-2,2,2);

  ctx.restore();
}

function drawTree(x,y,s,variant){
  const sc=Math.max(1,Math.floor(s));
  ctx.save();
  ctx.translate(Math.floor(x),Math.floor(y));

  // Shadow
  ctx.fillStyle='rgba(40,40,80,0.2)';
  ctx.fillRect(-sc*5,sc*18,sc*10,sc*2);

  // Trunk
  ctx.fillStyle=P.trunk;
  ctx.fillRect(-sc,sc*14,sc*2,sc*5);
  ctx.fillStyle=P.trunkL;
  ctx.fillRect(-sc,sc*14,sc,sc*5);

  if(variant===0){
    // Classic pine
    const layers=[
      {dy:11,w:14,h:4,c:P.tree1},
      {dy:8,w:12,h:4,c:P.tree2},
      {dy:5,w:10,h:4,c:P.tree3},
      {dy:2,w:7,h:4,c:P.tree4},
    ];
    layers.forEach((l,i)=>{
      ctx.fillStyle=l.c;
      const hw=Math.floor(l.w/2);
      ctx.fillRect(-hw*sc,l.dy*sc,l.w*sc,l.h*sc);
      // Snow on branches
      if(i<2){
        ctx.fillStyle=P.snow;
        ctx.fillRect(-hw*sc,l.dy*sc,l.w*sc,1);
      }
      // Highlight
      ctx.fillStyle=l.c===P.tree1?P.tree3:l.c===P.tree2?P.tree4:P.tree5;
      ctx.fillRect(-hw*sc+sc,l.dy*sc+sc,sc,sc);
    });
    // Snow cap
    ctx.fillStyle=P.snow;
    ctx.fillRect(-sc*2,0,sc*4,sc);
    ctx.fillRect(-sc,sc,sc*2,sc);
  } else if(variant===1){
    // Round spruce
    const layers=[
      {dy:10,w:13,h:5,c:P.tree1},
      {dy:7,w:11,h:4,c:P.tree2},
      {dy:4,w:9,h:4,c:P.tree3},
      {dy:1,w:6,h:3,c:P.tree4},
    ];
    layers.forEach((l,i)=>{
      ctx.fillStyle=l.c;
      const hw=Math.floor(l.w/2);
      ctx.fillRect(-hw*sc,l.dy*sc,l.w*sc,l.h*sc);
      if(i<2){
        ctx.fillStyle=P.snow;
        ctx.fillRect(-hw*sc,l.dy*sc,l.w*sc,1);
      }
      ctx.fillStyle=l.c===P.tree1?P.tree3:P.tree4;
      ctx.fillRect(-hw*sc+sc,l.dy*sc+sc,sc,sc);
    });
    ctx.fillStyle=P.snow;
    ctx.fillRect(-sc,0,sc*3,sc);
  } else {
    // Tall thin
    const layers=[
      {dy:12,w:10,h:4,c:P.tree1},
      {dy:9,w:8,h:4,c:P.tree2},
      {dy:6,w:6,h:4,c:P.tree3},
      {dy:3,w:5,h:4,c:P.tree4},
    ];
    layers.forEach((l,i)=>{
      ctx.fillStyle=l.c;
      const hw=Math.floor(l.w/2);
      ctx.fillRect(-hw*sc,l.dy*sc,l.w*sc,l.h*sc);
      if(i<2){
        ctx.fillStyle=P.snow;
        ctx.fillRect(-hw*sc,l.dy*sc,l.w*sc,1);
      }
    });
    ctx.fillStyle=P.snow;
    ctx.fillRect(-sc,0,sc*2,sc);
  }

  ctx.restore();
}

function drawMountain(x,y,w,h,layer){
  const colors=[P.mtn1,P.mtn2,P.mtn3];
  ctx.fillStyle=colors[layer];
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+w/2,y-h);
  ctx.lineTo(x+w,y);
  ctx.fill();

  // Snow cap
  const capH=h*0.28;
  const peakY=y-h;
  const capY=peakY+capH;
  ctx.fillStyle=P.mtnSnow;
  ctx.beginPath();
  ctx.moveTo(x+w*0.32,capY);
  ctx.lineTo(x+w/2,peakY);
  ctx.lineTo(x+w*0.68,capY);
  ctx.lineTo(x+w*0.55,capY-capH*0.3);
  ctx.lineTo(x+w*0.45,capY-capH*0.2);
  ctx.fill();

  // Snow highlight
  ctx.fillStyle=P.mtnSnowH;
  ctx.beginPath();
  ctx.moveTo(x+w*0.42,capY-capH*0.3);
  ctx.lineTo(x+w/2,peakY);
  ctx.lineTo(x+w*0.52,capY-capH*0.25);
  ctx.fill();
}

// === WORLD ===
let trees=[],snowP=[],clouds=[],stars=[];
let fCount=0;
let btnHover=false;
let btnPressed=false;
let btnX,btnY,btnW,btnH;
let titlePulse=0;
let yetiVisible=false;
let yetiAlpha=0;
let yetiX=0,yetiY=0;

function initWorld(){
  trees=[];
  for(let i=0;i<100;i++){
    const z=Math.random();
    const persp=0.1+z*0.9;
    const y=110+z*120;
    const x=Math.random()*W;
    const scale=0.2+persp*2.2;
    const variant=Math.floor(Math.random()*3);
    trees.push({x,y,scale,z,variant});
  }
  trees.sort((a,b)=>a.z-b.z);

  snowP=[];
  for(let i=0;i<120;i++){
    snowP.push({
      x:Math.random()*W,
      y:Math.random()*H,
      sp:0.4+Math.random()*1.5,
      sz:Math.random()<0.25?2:1,
      dr:-0.8-Math.random()*2,
      wa:Math.random()*Math.PI*2,
      ws:0.02+Math.random()*0.04
    });
  }

  clouds=[];
  for(let i=0;i<10;i++){
    clouds.push({
      x:Math.random()*W,
      y:3+Math.random()*25,
      w:15+Math.random()*50,
      h:2+Math.random()*4,
      sp:0.03+Math.random()*0.15,
      a:0.08+Math.random()*0.12
    });
  }

  stars=[];
  for(let i=0;i<60;i++){
    stars.push({
      x:Math.random()*W,
      y:Math.random()*80,
      b:Math.random(),
      sp:0.008+Math.random()*0.025,
      sz:Math.random()<0.15?2:1
    });
  }
}

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,100);
  g.addColorStop(0,P.skyTop);
  g.addColorStop(0.6,P.skyMid);
  g.addColorStop(1,P.skyBot);
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,100);

  // Stars
  stars.forEach(st=>{
    st.b+=st.sp;
    const bright=(Math.sin(st.b)+1)/2;
    if(bright>0.2){
      ctx.globalAlpha=bright*0.7;
      ctx.fillStyle=P.star;
      ctx.fillRect(Math.floor(st.x),Math.floor(st.y),st.sz,st.sz);
    }
  });
  ctx.globalAlpha=1;
}

function drawClouds(){
  clouds.forEach(cl=>{
    cl.x-=cl.sp;
    if(cl.x+cl.w<0)cl.x=W+cl.w;
    ctx.globalAlpha=cl.a;
    ctx.fillStyle=P.cloud;
    const cx=Math.floor(cl.x);
    const cy=Math.floor(cl.y);
    const cw=Math.floor(cl.w);
    const ch=Math.floor(cl.h);
    ctx.fillRect(cx,cy,cw,ch);
    ctx.fillRect(cx+3,cy-1,cw-6,ch);
    ctx.fillRect(cx+6,cy-2,cw-12,Math.max(1,ch-1));
    ctx.globalAlpha=1;
  });
}

function drawMountains(){
  const off=Math.sin(fCount*0.0015)*1.5;

  // Far layer - very distant
  ctx.globalAlpha=0.6;
  drawMountain(-30+off*0.5,100,100,30,0);
  drawMountain(60+off*0.5,100,130,45,0);
  drawMountain(180+off*0.5,100,90,28,0);
  drawMountain(260+off*0.5,100,110,40,0);
  ctx.globalAlpha=1;

  // Mid layer
  ctx.globalAlpha=0.8;
  drawMountain(-20+off,102,110,42,1);
  drawMountain(90+off,102,120,55,1);
  drawMountain(200+off,102,95,35,1);
  ctx.globalAlpha=1;

  // Near layer
  drawMountain(20+off*1.5,104,85,32,2);
  drawMountain(130+off*1.5,104,100,42,2);
  drawMountain(240+off*1.5,104,75,28,2);
}

function drawSlope(){
  // Base snow gradient
  const g=ctx.createLinearGradient(0,95,0,H);
  g.addColorStop(0,P.snow);
  g.addColorStop(0.5,P.snowMid);
  g.addColorStop(1,P.snowDark);
  ctx.fillStyle=g;
  ctx.fillRect(0,95,W,H-95);

  // Snow texture dots
  ctx.fillStyle=P.snowMid;
  for(let i=0;i<100;i++){
    const sx=(i*37+fCount*0.2)%W;
    const sy=98+(i*23)%(H-105);
    ctx.fillRect(Math.floor(sx),Math.floor(sy),1,1);
  }

  // Subtle ski tracks
  ctx.globalAlpha=0.06;
  ctx.fillStyle=P.snowSh;
  for(let i=0;i<6;i++){
    const tx=50+i*45;
    ctx.fillRect(tx,98,2,H-98);
    ctx.fillRect(tx+5,98,2,H-98);
  }
  ctx.globalAlpha=1;

  // Snow drifts at bottom
  ctx.fillStyle=P.snowMid;
  for(let i=0;i<12;i++){
    const dx=i*28+10;
    const dy=H-8+Math.sin(i*1.5)*3;
    ctx.fillRect(dx,dy,20,6);
    ctx.fillRect(dx+3,dy-1,14,1);
  }
}

function drawTrees(){
  trees.forEach(t=>{
    drawTree(t.x,t.y,t.scale,t.variant);
  });
}

function drawSnow(){
  snowP.forEach(p=>{
    p.y+=p.sp;
    p.x+=p.dr;
    p.wa+=p.ws;
    p.x+=Math.sin(p.wa)*0.3;

    if(p.y>H){p.y=-2;p.x=Math.random()*W;}
    if(p.x<-5)p.x=W+5;
    if(p.x>W+5)p.x=-5;

    ctx.globalAlpha=0.15+Math.random()*0.25;
    ctx.fillStyle='#ffffff';
    ctx.fillRect(Math.floor(p.x),Math.floor(p.y),p.sz,p.sz);
  });
  ctx.globalAlpha=1;
}

function drawWindStreaks(){
  ctx.globalAlpha=0.04;
  ctx.fillStyle='#ffffff';
  for(let i=0;i<5;i++){
    const sx=(i*73+fCount*2)%W;
    const sy=100+(i*47)%(H-110);
    ctx.fillRect(sx,sy,8+Math.random()*6,1);
  }
  ctx.globalAlpha=1;
}

// === YETI ===
function drawYeti(){
  yetiX=200+Math.sin(fCount*0.006)*20;
  yetiY=115+Math.sin(fCount*0.004)*4;

  yetiAlpha=0.15+Math.sin(fCount*0.012)*0.08;
  if(fCount%180<90)yetiAlpha+=0.05;

  ctx.globalAlpha=yetiAlpha;

  // Body
  ctx.fillStyle=P.yeti;
  ctx.fillRect(yetiX,yetiY,12,16);
  ctx.fillRect(yetiX-1,yetiY+3,14,12);
  ctx.fillRect(yetiX-2,yetiY+6,16,6);

  // Head
  ctx.fillRect(yetiX+1,yetiY-8,10,9);
  ctx.fillRect(yetiX+2,yetiY-10,8,3);

  // Arms
  ctx.fillRect(yetiX-4,yetiY+2,4,10);
  ctx.fillRect(yetiX+12,yetiY+2,4,10);

  // Legs
  ctx.fillRect(yetiX+1,yetiY+16,4,6);
  ctx.fillRect(yetiX+7,yetiY+16,4,6);

  // Eyes (glowing red)
  ctx.fillStyle=P.yetiE;
  ctx.fillRect(yetiX+3,yetiY-5,2,2);
  ctx.fillRect(yetiX+7,yetiY-5,2,2);

  // Eye glow
  ctx.globalAlpha=yetiAlpha*0.4;
  ctx.fillStyle=P.yetiGlow;
  ctx.fillRect(yetiX+2,yetiY-6,4,4);
  ctx.fillRect(yetiX+6,yetiY-6,4,4);

  // Mouth
  ctx.globalAlpha=yetiAlpha*0.6;
  ctx.fillStyle=P.yetiE;
  ctx.fillRect(yetiX+4,yetiY-2,4,1);

  ctx.globalAlpha=1;
}

// === TITLE ===
function drawTitle(){
  titlePulse+=0.025;
  const pulse=Math.sin(titlePulse)*0.1+0.9;

  const titleY=4;

  // Glow behind title
  ctx.globalAlpha=0.08*pulse;
  ctx.fillStyle=P.titleGlow;
  const glowW=textWidth('SKIFREE',6);
  ctx.fillRect((W-glowW)/2-6,titleY-6,glowW+12,48);
  ctx.globalAlpha=1;

  // Deep shadow
  drawCentered('SKIFREE',titleY+4,6,'#050515');
  // Mid shadow
  drawCentered('SKIFREE',titleY+2,6,'#0a0a2a');
  // Dark outline
  drawCentered('SKIFREE',titleY,6,P.titleDark);
  // Main text
  drawCentered('SKIFREE',titleY-1,6,P.title);
  // Highlight
  drawCentered('SKIFREE',titleY-2,6,P.titleLight);

  // Snow particles on title
  ctx.fillStyle='rgba(255,255,255,0.6)';
  for(let i=0;i<8;i++){
    const sx=50+i*28+Math.sin(fCount*0.025+i*0.7)*3;
    const sy=titleY-5+Math.abs(Math.sin(fCount*0.035+i*0.6))*3;
    ctx.fillRect(Math.floor(sx),Math.floor(sy),2,1);
  }

  // Subtitle with decorative lines
  ctx.globalAlpha=0.5;
  drawCentered('SURVIVE THE YETI',titleY+42,1,P.hudT);
  ctx.globalAlpha=0.3;
  ctx.fillStyle=P.hudB;
  ctx.fillRect(55,titleY+45,210,1);
  ctx.fillRect(75,titleY+46,170,1);
  ctx.globalAlpha=1;
}

// === INSTRUCTIONS ===
function drawInstructions(){
  const iy=H-44;

  // Panel background
  ctx.fillStyle='rgba(8,8,25,0.7)';
  ctx.fillRect(W/2-98,iy-12,196,30);

  // Panel border
  ctx.fillStyle=P.hudB;
  ctx.fillRect(W/2-98,iy-12,196,1);
  ctx.fillRect(W/2-98,iy+17,196,1);
  ctx.fillRect(W/2-98,iy-12,1,30);
  ctx.fillRect(W/2+97,iy-12,1,30);

  // Corner accents
  ctx.fillStyle=P.hudBr;
  ctx.fillRect(W/2-98,iy-12,2,2);
  ctx.fillRect(W/2+96,iy-12,2,2);
  ctx.fillRect(W/2-98,iy+16,2,2);
  ctx.fillRect(W/2+96,iy+16,2,2);

  drawCentered('USE  <  >  TO STEER',iy-5,1,P.hudBr);
  drawCentered('AVOID TREES & YETI',iy+7,1,P.hudT);
}

// === START BUTTON ===
function drawStartBtn(){
  btnW=120;btnH=24;
  btnX=(W-btnW)/2;
  btnY=H-82;

  const hov=btnHover;
  const prs=btnPressed;

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.fillRect(btnX+3,btnY+4,btnW,btnH);

  // Button body
  ctx.fillStyle=prs?'#b0b0d0':hov?'#f0f0ff':P.btn;
  ctx.fillRect(btnX,btnY,btnW,btnH);

  // Top highlight
  ctx.fillStyle='#ffffff';
  ctx.fillRect(btnX+1,btnY+1,btnW-2,2);
  ctx.fillRect(btnX+1,btnY+1,2,btnH-2);

  // Bottom edge
  ctx.fillStyle=P.btnD;
  ctx.fillRect(btnX+1,btnY+btnH-2,btnW-2,2);
  ctx.fillRect(btnX+btnW-2,btnY+1,2,btnH-2);

  // Inner bevel
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.fillRect(btnX+3,btnY+3,btnW-6,1);
  ctx.fillRect(btnX+3,btnY+3,1,btnH-6);

  // Inner shadow
  ctx.fillStyle='rgba(0,0,0,0.08)';
  ctx.fillRect(btnX+3,btnY+btnH-4,btnW-6,1);
  ctx.fillRect(btnX+btnW-4,btnY+3,1,btnH-6);

  // Text
  const tw=textWidth('START',2);
  const tx=btnX+(btnW-tw)/2;
  const ty=btnY+(btnH-7)/2;
  ctx.fillStyle=P.btnT;
  drawText('START',tx,ty,2,P.btnT);

  // Blinking cursor
  if(Math.floor(fCount/20)%2===0){
    ctx.fillStyle=P.btnT;
    ctx.fillRect(btnX+btnW-10,btnY+8,2,6);
  }

  // Hover glow
  if(hov&&!prs){
    ctx.globalAlpha=0.15;
    ctx.fillStyle='#88aaff';
    ctx.fillRect(btnX-2,btnY-2,btnW+4,btnH+4);
    ctx.globalAlpha=1;
  }
}

// === SCANLINES ===
function drawScanlines(){
  ctx.fillStyle='rgba(0,0,0,0.05)';
  for(let y=0;y<H;y+=2){
    ctx.fillRect(0,y,W,1);
  }
}

// === VIGNETTE ===
function drawVignette(){
  const g=ctx.createRadialGradient(W/2,H/2,W*0.25,W/2,H/2,W*0.7);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.35)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}

// === CRT EFFECT ===
function drawCRT(){
  // Subtle screen curve effect at edges
  ctx.fillStyle='rgba(0,0,0,0.03)';
  for(let i=0;i<3;i++){
    ctx.fillRect(0,i*2,W,1);
    ctx.fillRect(0,H-i*2-1,W,1);
  }
}

// === MOUSE ===
canvas.addEventListener('mousemove',function(e){
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width);
  const my=(e.clientY-rect.top)*(H/rect.height);
  btnHover=mx>=btnX&&mx<=btnX+btnW&&my>=btnY&&my<=btnY+btnH;
  canvas.style.cursor=btnHover?'pointer':'default';
});

canvas.addEventListener('mousedown',function(e){
  if(btnHover)btnPressed=true;
});

canvas.addEventListener('mouseup',function(e){
  if(btnPressed&&btnHover){
    btnPressed=false;
    alert('SKIING! Use arrow keys to avoid trees. Watch out for the Yeti!');
  } else {
    btnPressed=false;
  }
});

canvas.addEventListener('mouseleave',function(){
  btnHover=false;
  btnPressed=false;
  canvas.style.cursor='default';
});

canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const touch=e.touches[0];
  const mx=(touch.clientX-rect.left)*(W/rect.width);
  const my=(touch.clientY-rect.top)*(H/rect.height);
  if(mx>=btnX&&mx<=btnX+btnW&&my>=btnY&&my<=btnY+btnH){
    btnPressed=true;
    setTimeout(()=>{
      btnPressed=false;
      alert('SKIING! Use arrow keys to avoid trees. Watch out for the Yeti!');
    },150);
  }
},{passive:false});

// === MAIN LOOP ===
function animate(){
  fCount++;

  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);

  drawSky();
  drawClouds();
  drawMountains();
  drawSlope();
  drawWindStreaks();
  drawTrees();
  drawYeti();

  // Skier - more prominent position
  const skierX=W/2+Math.sin(fCount*0.012)*30;
  drawSkier(skierX,140,fCount);

  drawSnow();

  // UI Layer
  drawTitle();
  drawInstructions();
  drawStartBtn();

  // Post-processing
  drawScanlines();
  drawVignette();
  drawCRT();

  requestAnimationFrame(animate);
}

initWorld();
animate();
})();
</script>
