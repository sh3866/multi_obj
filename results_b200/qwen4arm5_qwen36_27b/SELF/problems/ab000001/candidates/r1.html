<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            --board-size: min(82vw, 520px);
            --tile-gap: 3px;
            --frame-depth: 14px;
            --tile-bg: #FDF6E3;
            --tile-shadow: #E8DCC8;
            --path-color: #8B4513;
            --path-active: #D4760A;
            --ink: #2C2416;
            --ink-light: #6B5D4E;
            --wood-light: #C4956A;
            --wood-mid: #8B6341;
            --wood-dark: #5C3D24;
            --cub-orange: #E8852A;
            --cub-dark: #B85A10;
            --star-gold: #F5C518;
            --star-glow: #FFE066;
            --paper: #FDF8F0;
            --paper-dark: #F0E6D6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--paper);
            background-image: 
                radial-gradient(circle, var(--paper-dark) 0.8px, transparent 0.8px);
            background-size: 28px 28px;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* === HEADER === */
        header {
            text-align: center;
            margin-bottom: 1.8rem;
            position: relative;
        }

        .title-wrapper {
            position: relative;
            display: inline-block;
        }

        h1 {
            font-size: clamp(2.2rem, 6vw, 3.6rem);
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1.1;
            color: var(--ink);
            position: relative;
            display: inline-block;
        }

        h1 .letter {
            display: inline-block;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        h1 .letter:hover {
            transform: translateY(-4px) rotate(-3deg);
        }

        .title-decor {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 4px;
        }

        .title-line {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--wood-light), transparent);
            border-radius: 2px;
        }

        .title-diamond {
            width: 8px;
            height: 8px;
            background: var(--wood-light);
            transform: rotate(45deg);
            border-radius: 1px;
        }

        .level-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            padding: 6px 18px;
            background: white;
            border: 1.5px solid var(--paper-dark);
            border-radius: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--ink-light);
            box-shadow: 0 2px 8px rgba(44, 36, 22, 0.06);
        }

        .level-badge .paw {
            font-size: 0.85rem;
            opacity: 0.6;
        }

        /* === GAME BOARD === */
        .board-wrapper {
            position: relative;
            padding: var(--frame-depth);
            background: linear-gradient(145deg, var(--wood-light), var(--wood-mid));
            border-radius: 16px;
            box-shadow:
                0 1px 0 var(--wood-light) inset,
                0 -2px 0 var(--wood-dark) inset,
                0 8px 30px rgba(92, 61, 36, 0.3),
                0 2px 8px rgba(92, 61, 36, 0.2);
        }

        .board-wrapper::before {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 13px;
            border: 1.5px solid rgba(255,255,255,0.15);
            pointer-events: none;
            z-index: 2;
        }

        .board-inner {
            background: linear-gradient(145deg, #F5EDE0, #EBE0D0);
            border-radius: 8px;
            padding: 10px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.12);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: var(--board-size);
            height: var(--board-size);
            gap: var(--tile-gap);
            background: var(--wood-dark);
            border-radius: 4px;
            padding: var(--tile-gap);
            border: 2px solid var(--wood-dark);
        }

        .tile {
            background: linear-gradient(145deg, #FFFDF5, #F5EDDE);
            border-radius: 3px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            overflow: hidden;
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.8),
                0 1px 2px rgba(0,0,0,0.08);
        }

        .tile::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 3px;
            border: 1px solid rgba(139, 99, 65, 0.12);
            pointer-events: none;
        }

        .tile:hover {
            background: linear-gradient(145deg, #FFFDF8, #FAF3E6);
            transform: scale(1.02);
            z-index: 1;
        }

        .tile.active {
            background: linear-gradient(145deg, #FFF8E8, #F5EDDE);
        }

        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .tile svg path {
            stroke: var(--path-color);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.4s ease, filter 0.4s ease;
            filter: drop-shadow(0 1px 1px rgba(139, 69, 19, 0.2));
        }

        .tile.active svg path {
            stroke: var(--path-active);
            filter: drop-shadow(0 0 4px rgba(212, 118, 10, 0.4));
        }

        /* === TOKENS === */
        .tokens-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .cub {
            position: absolute;
            width: calc(var(--board-size) / 6 * 0.72);
            height: calc(var(--board-size) / 6 * 0.72);
            transform: translate(-50%, -50%);
            transition: top 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
        }

        .cub-body {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #F4A55C, var(--cub-orange) 50%, var(--cub-dark));
            box-shadow:
                0 4px 12px rgba(184, 90, 16, 0.4),
                0 2px 4px rgba(0,0,0,0.2),
                inset 0 -3px 6px rgba(0,0,0,0.15),
                inset 0 3px 8px rgba(255,255,255,0.3);
            position: relative;
        }

        /* Ears */
        .cub-body::before, .cub-body::after {
            content: '';
            position: absolute;
            width: 28%;
            height: 22%;
            background: radial-gradient(circle, var(--cub-orange), var(--cub-dark));
            border-radius: 50%;
            top: -8%;
            z-index: -1;
        }
        .cub-body::before { left: 8%; border-radius: 50% 50% 50% 20%; }
        .cub-body::after { right: 8%; border-radius: 50% 50% 20% 50%; }

        /* Eyes */
        .cub-eyes {
            position: absolute;
            top: 32%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 18%;
        }

        .cub-eye {
            width: 16%;
            height: 18%;
            background: #1a1208;
            border-radius: 50%;
            position: relative;
        }

        .cub-eye::after {
            content: '';
            position: absolute;
            top: 15%;
            right: 15%;
            width: 40%;
            height: 40%;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
        }

        /* Nose */
        .cub-nose {
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translateX(-50%);
            width: 14%;
            height: 10%;
            background: #1a1208;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
        }

        /* Mouth */
        .cub-mouth {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translateX(-50%);
            width: 20%;
            height: 8%;
            border-bottom: 2px solid #1a1208;
            border-radius: 0 0 50% 50%;
        }

        /* === STAR === */
        .star {
            position: absolute;
            width: calc(var(--board-size) / 6 * 0.55);
            height: calc(var(--board-size) / 6 * 0.55);
            transform: translate(-50%, -50%);
            z-index: 9;
            animation: starFloat 3s ease-in-out infinite;
        }

        .star svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 6px rgba(245, 197, 24, 0.6)) drop-shadow(0 2px 4px rgba(0,0,0,0.15));
        }

        .star-sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--star-glow);
            border-radius: 50%;
            animation: sparkle 2s ease-in-out infinite;
        }

        .star-sparkle:nth-child(2) { top: -10%; right: -10%; animation-delay: 0.5s; }
        .star-sparkle:nth-child(3) { bottom: -8%; left: -8%; animation-delay: 1s; width: 3px; height: 3px; }
        .star-sparkle:nth-child(4) { top: 10%; left: -12%; animation-delay: 1.5s; width: 3px; height: 3px; }

        @keyframes starFloat {
            0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            50% { transform: translate(-50%, -50%) scale(1.1) rotate(5deg); }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* === FOOTER === */
        footer {
            margin-top: 2rem;
            display: flex;
            gap: 1.2rem;
            align-items: center;
        }

        .btn {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 14px 32px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            transition: all 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: translateY(2px);
        }

        .btn-reset {
            background: linear-gradient(145deg, #FFFFFF, #F5F0E8);
            color: var(--ink-light);
            box-shadow:
                0 4px 0 #D5CFC5,
                0 6px 12px rgba(0,0,0,0.08);
            border: 1.5px solid #E8E0D4;
        }

        .btn-reset:hover {
            background: linear-gradient(145deg, #FFFDF8, #FAF5EE);
            color: var(--ink);
        }

        .btn-reset:active {
            box-shadow:
                0 2px 0 #D5CFC5,
                0 3px 6px rgba(0,0,0,0.06);
        }

        .btn-run {
            background: linear-gradient(145deg, #F09030, #D4760A);
            color: white;
            box-shadow:
                0 4px 0 #A85D08,
                0 6px 16px rgba(212, 118, 10, 0.35);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .btn-run:hover {
            background: linear-gradient(145deg, #F5A040, #E08518);
        }

        .btn-run:active {
            box-shadow:
                0 2px 0 #A85D08,
                0 3px 8px rgba(212, 118, 10, 0.25);
        }

        /* === OVERLAY === */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(253, 248, 240, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .overlay-content {
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .overlay h2 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            color: var(--cub-orange);
            margin: 0;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.05);
        }

        .overlay p {
            font-size: 1.2rem;
            color: var(--ink-light);
            margin-top: 8px;
            font-style: italic;
        }

        .overlay .btn-run {
            margin-top: 24px;
        }

        /* === CONFETTI === */
        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 101;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: confettiFall 3s ease-in forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* === RESPONSIVE === */
        @media (max-width: 560px) {
            :root { --board-size: 92vw; --frame-depth: 10px; }
            header { margin-bottom: 1.2rem; }
            footer { margin-top: 1.5rem; }
            .btn { padding: 12px 24px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="title-wrapper">
            <h1 id="title"></h1>
        </div>
        <div class="title-decor">
            <div class="title-line"></div>
            <div class="title-diamond"></div>
            <div class="title-line"></div>
        </div>
        <div class="level-badge">
            <span class="paw">🐾</span>
            Level 1 : The Garden
        </div>
    </header>

    <div class="board-wrapper">
        <div class="board-inner">
            <div class="grid" id="grid"></div>
            <div class="tokens-layer">
                <div class="cub" id="cub">
                    <div class="cub-body">
                        <div class="cub-eyes">
                            <div class="cub-eye"></div>
                            <div class="cub-eye"></div>
                        </div>
                        <div class="cub-nose"></div>
                        <div class="cub-mouth"></div>
                    </div>
                </div>
                <div class="star" id="star">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" 
                              fill="url(#starGrad)"/>
                        <defs>
                            <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FFE066"/>
                                <stop offset="50%" stop-color="#F5C518"/>
                                <stop offset="100%" stop-color="#E8A000"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <div class="star-sparkle"></div>
                    <div class="star-sparkle"></div>
                    <div class="star-sparkle"></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn btn-run" onclick="game.run()">Run Path</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <div class="overlay-content">
            <h2>Woof! 🐾</h2>
            <p>Cub found the star!</p>
            <button class="btn btn-run" onclick="game.reset()">Play Again</button>
        </div>
    </div>

    <div class="confetti-container" id="confetti"></div>

    <script>
        // === TITLE ANIMATION ===
        (function animateTitle() {
            const title = document.getElementById('title');
            const text = 'Cub n Pup';
            title.innerHTML = '';
            text.split('').forEach((char, i) => {
                const span = document.createElement('span');
                span.className = 'letter';
                span.textContent = char === ' ' ? '\u00A0' : char;
                span.style.animationDelay = `${i * 0.05}s`;
                title.appendChild(span);
            });
        })();

        // === GAME ===
        const GRID = 6;

        // Tile path definitions (SVG path strings in a 100x100 viewBox)
        const PATHS = {
            line:      'M50 0 V100',
            lineH:     'M0 50 H100',
            cornerTL:  'M50 0 V50 H0',
            cornerTR:  'M50 0 V50 H100',
            cornerBL:  'M0 50 V100 H50',
            cornerBR:  'M100 50 V100 H50',
            tUp:       'M0 50 H100 M50 50 V100',
            tDown:     'M0 50 H100 M50 50 V0',
            tLeft:     'M50 0 V100 M50 50 H100',
            tRight:    'M50 0 V100 M50 50 H0',
            cross:     'M50 0 V100 M0 50 H100',
            empty:     ''
        };

        // Puzzle layout — each cell: { type, rotation }
        // Designed as a winding path from top-left to bottom-right area
        const LAYOUT = [
            ['cornerTR', 'line', 'cornerTL', 'line', 'cornerTR', 'line'],
            ['line',     'cornerBR','line', 'cornerTL', 'line', 'cornerBR'],
            ['line',     'line', 'cornerBL', 'cornerBR', 'cornerBL', 'cornerBR'],
            ['line',     'cornerTL', 'line', 'line', 'cornerBL', 'line'],
            ['cornerTR', 'line', 'cornerBL', 'cornerBR', 'line', 'cornerBL'],
            ['line',     'line', 'line', 'line', 'line', 'line']
        ];

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.confettiEl = document.getElementById('confetti');
                this.cells = [];
                this.startPos = { x: 0, y: 0 };
                this.endPos = { x: 5, y: 4 };
                this.cubPos = { ...this.startPos };
                this.running = false;
                this.init();
            }

            init() {
                this.renderBoard();
                this.positionToken(this.cubEl, this.startPos.x, this.startPos.y);
                this.positionToken(this.starEl, this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];
                for (let y = 0; y < GRID; y++) {
                    const row = [];
                    for (let x = 0; x < GRID; x++) {
                        const type = LAYOUT[y][x];
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        tile.dataset.x = x;
                        tile.dataset.y = y;
                        const d = PATHS[type] || '';
                        tile.innerHTML = d
                            ? `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${d}"/></svg>`
                            : '';
                        this.gridEl.appendChild(tile);
                        row.push(tile);
                    }
                    this.cells.push(row);
                }
            }

            positionToken(el, x, y) {
                const pct = 100 / GRID;
                el.style.left = `${(x * pct) + (pct / 2)}%`;
                el.style.top = `${(y * pct) + (pct / 2)}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                this.confettiEl.innerHTML = '';
                this.running = false;
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.cubPos = { ...this.startPos };
                this.positionToken(this.cubEl, 0, 0);
            }

            async run() {
                if (this.running) return;
                this.running = true;
                this.overlay.classList.remove('active');
                this.confettiEl.innerHTML = '';

                // Path from start to star
                const path = [
                    {x:0,y:0},{x:0,y:1},{x:0,y:2},{x:0,y:3},{x:0,y:4},{x:0,y:5},
                    {x:1,y:5},{x:2,y:5},{x:3,y:5},{x:4,y:5},{x:4,y:4},{x:4,y:3},
                    {x:5,y:3},{x:5,y:2},{x:5,y:1},{x:5,y:0},{x:4,y:0},{x:3,y:0},
                    {x:2,y:0},{x:1,y:0},{x:1,y:1},{x:2,y:1},{x:2,y:2},{x:3,y:2},
                    {x:3,y:3},{x:3,y:4},{x:4,y:4},{x:5,y:4}
                ];

                // Simplified direct path
                const directPath = [
                    {x:0,y:0},{x:0,y:1},{x:0,y:2},{x:0,y:3},{x:0,y:4},{x:0,y:5},
                    {x:1,y:5},{x:2,y:5},{x:3,y:5},{x:4,y:5},{x:4,y:4},{x:4,y:3},
                    {x:5,y:3},{x:5,y:4}
                ];

                for (let i = 0; i < directPath.length; i++) {
                    const s = directPath[i];
                    const tile = this.cells[s.y][s.x];
                    tile.classList.add('active');
                    this.positionToken(this.cubEl, s.x, s.y);
                    await this.wait(350);
                }

                await this.wait(300);
                this.overlay.classList.add('active');
                this.spawnConfetti();
                this.running = false;
            }

            wait(ms) {
                return new Promise(r => setTimeout(r, ms));
            }

            spawnConfetti() {
                const colors = ['#F5C518','#E8852A','#F4A55C','#7BC67E','#6BA3D6','#E06B6B','#B07CC6'];
                for (let i = 0; i < 50; i++) {
                    const c = document.createElement('div');
                    c.className = 'confetti';
                    c.style.left = Math.random() * 100 + '%';
                    c.style.top = '-10px';
                    c.style.background = colors[Math.floor(Math.random() * colors.length)];
                    c.style.animationDelay = Math.random() * 1.5 + 's';
                    c.style.animationDuration = (2 + Math.random() * 2) + 's';
                    c.style.width = (6 + Math.random() * 8) + 'px';
                    c.style.height = (6 + Math.random() * 8) + 'px';
                    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    this.confettiEl.appendChild(c);
                }
            }
        }

        const game = new Game();
    </script>
</body>
</html>
