<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Whispering Keep</title>
<style>
:root {
    --bg-deepest: #08090d;
    --bg-deep: #0c0e14;
    --bg-panel: #11131c;
    --bg-panel-raised: #161926;
    --bg-panel-hover: #1c2030;
    --bg-card: #181b28;
    --border-subtle: #1e2233;
    --border-mid: #2a2f45;
    --border-bright: #3d4460;
    --gold-dim: #6b5a30;
    --gold: #b8952e;
    --gold-bright: #d4af37;
    --gold-glow: rgba(212, 175, 55, 0.25);
    --gold-soft: rgba(212, 175, 55, 0.08);
    --ember: #c45a2a;
    --ember-glow: rgba(196, 90, 42, 0.3);
    --text-bright: #f0ece4;
    --text-main: #c4bfb3;
    --text-muted: #7a756d;
    --text-dim: #4a4740;
    --accent-green: #4a9a6a;
    --accent-green-glow: rgba(74, 154, 106, 0.4);
    --accent-red: #b04040;
    --accent-red-glow: rgba(176, 64, 64, 0.4);
    --accent-amber: #d4943a;
    --accent-amber-glow: rgba(212, 148, 58, 0.35);
    --font-serif: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: var(--bg-deepest);
    color: var(--text-main);
    font-family: var(--font-sans);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-font-smoothing: antialiased;
}

.texture-overlay {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 9999;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
}

.vignette {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 9998;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(4,4,8,0.7) 100%);
}

::selection {
    background: var(--gold-dim);
    color: var(--text-bright);
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-bright); }

/* --- Header --- */
header {
    height: 52px;
    min-height: 52px;
    background: linear-gradient(180deg, #10121c 0%, #0c0e16 100%);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: relative;
    z-index: 100;
}

header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 5%, var(--gold-dim) 50%, transparent 95%);
    opacity: 0.35;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: var(--font-serif);
    font-size: 0.95rem;
    color: var(--gold);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 400;
}

.brand-icon {
    width: 26px; height: 26px;
    color: var(--gold);
    opacity: 0.85;
}

.counters {
    display: flex;
    gap: 28px;
    align-items: center;
}

.counter-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    color: var(--text-muted);
    letter-spacing: 0.3px;
}

.counter-item .icon {
    width: 16px; height: 16px;
    opacity: 0.6;
}

.counter-val {
    color: var(--text-bright);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-size: 0.88rem;
}

/* --- Main Layout --- */
main {
    flex: 1;
    display: grid;
    grid-template-columns: 260px 1fr 300px;
    overflow: hidden;
}

/* --- Left Panel: Roster --- */
.roster-panel {
    background: var(--bg-panel);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.panel-title {
    padding: 22px 20px 16px;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--text-dim);
    font-weight: 700;
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
}

.panel-title::after {
    content: '';
    position: absolute;
    bottom: 0; left: 20px; right: 20px;
    height: 1px;
    background: linear-gradient(90deg, var(--border-mid), transparent 80%);
}

.roster-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.npc-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid transparent;
    position: relative;
    background: transparent;
}

.npc-card:hover {
    background: var(--bg-panel-hover);
    border-color: var(--border-subtle);
}

.npc-card.active {
    background: linear-gradient(135deg, rgba(212,175,55,0.07), rgba(212,175,55,0.02));
    border-color: rgba(184,149,46,0.3);
    box-shadow: 0 2px 12px rgba(0,0,0,0.2), inset 0 1px 0 rgba(212,175,55,0.05);
}

.npc-card.active .npc-name {
    color: var(--gold-bright);
}

.npc-avatar {
    width: 46px; height: 46px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    border: 2px solid var(--border-subtle);
    transition: all 0.25s;
    background: var(--bg-deepest);
}

.npc-card.active .npc-avatar {
    border-color: var(--gold-dim);
    box-shadow: 0 0 16px var(--gold-glow);
}

.npc-avatar svg { width: 100%; height: 100%; }

.npc-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.npc-name {
    font-family: var(--font-serif);
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-bright);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.25s;
    letter-spacing: 0.2px;
}

.npc-role {
    font-size: 0.72rem;
    color: var(--text-muted);
    letter-spacing: 0.3px;
    opacity: 0.8;
}

.status-indicator {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    transition: all 0.25s;
}

.status-indicator.available {
    background: var(--accent-green);
    box-shadow: 0 0 8px var(--accent-green-glow);
}

.status-indicator.busy {
    background: var(--accent-amber);
    box-shadow: 0 0 8px var(--accent-amber-glow);
}

.status-indicator.hostile {
    background: var(--accent-red);
    box-shadow: 0 0 8px var(--accent-red-glow);
}

/* --- Center: Stage --- */
.stage-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-deep);
    position: relative;
}

.scene-visual {
    flex: 1;
    position: relative;
    overflow: hidden;
    min-height: 0;
}

.scene-bg {
    position: absolute;
    inset: 0;
    z-index: 1;
}

.npc-stage {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    width: 280px;
    height: 400px;
    transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
    animation: breathe 5s ease-in-out infinite;
}

@keyframes breathe {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-5px); }
}

.npc-stage:hover {
    animation-play-state: paused;
    transform: translateX(-50%) scale(1.015);
}

.npc-shadow {
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 180px; height: 24px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.6) 0%, transparent 70%);
    border-radius: 50%;
    z-index: 4;
}

/* --- Dialogue Area --- */
.dialogue-area {
    background: linear-gradient(180deg, #11131e 0%, #0e1018 100%);
    border-top: 1px solid var(--border-subtle);
    padding: 24px 32px 20px;
    position: relative;
    z-index: 10;
    min-height: 240px;
}

.dialogue-area::before {
    content: '';
    position: absolute;
    top: -1px; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 10%, var(--gold-dim) 50%, transparent 90%);
    opacity: 0.4;
}

.dialogue-speaker {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
}

.speaker-name {
    font-family: var(--font-serif);
    font-size: 1.3rem;
    color: var(--gold);
    font-weight: 400;
    letter-spacing: 0.5px;
}

.speaker-title {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-style: italic;
    letter-spacing: 0.5px;
    opacity: 0.7;
}

.dialogue-text {
    font-family: var(--font-serif);
    font-size: 1rem;
    line-height: 1.8;
    color: var(--text-bright);
    margin-bottom: 18px;
    opacity: 0.95;
    max-width: 95%;
}

.dialogue-text::first-letter {
    color: var(--gold-bright);
}

.choices-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.choice-btn {
    background: linear-gradient(135deg, rgba(255,255,255,0.025), rgba(255,255,255,0.005));
    border: 1px solid var(--border-subtle);
    padding: 11px 14px;
    text-align: left;
    color: var(--text-main);
    font-family: var(--font-sans);
    font-size: 0.84rem;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 10px;
    line-height: 1.4;
}

.choice-btn:hover {
    background: linear-gradient(135deg, rgba(212,175,55,0.08), rgba(212,175,55,0.03));
    border-color: var(--gold-dim);
    color: var(--gold-bright);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}

.choice-btn:active { transform: translateY(0); }

.choice-key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px; height: 22px;
    padding: 0 5px;
    background: var(--bg-panel-raised);
    border: 1px solid var(--border-mid);
    border-radius: 4px;
    font-size: 0.68rem;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-weight: 600;
    transition: all 0.2s;
}

.choice-btn:hover .choice-key {
    background: var(--gold);
    color: var(--bg-deepest);
    border-color: var(--gold);
}

/* --- Right Panel --- */
.log-panel {
    background: var(--bg-panel);
    border-left: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.log-tabs {
    display: flex;
    border-bottom: 1px solid var(--border-subtle);
    position: relative;
}

.log-tab {
    flex: 1;
    padding: 16px 12px;
    text-align: center;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.25s;
    font-weight: 700;
    position: relative;
    background: transparent;
}

.log-tab::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 25%; right: 25%;
    height: 2px;
    background: var(--gold);
    border-radius: 2px 2px 0 0;
    opacity: 0;
    transition: opacity 0.25s;
}

.log-tab:hover {
    color: var(--text-muted);
    background: rgba(255,255,255,0.015);
}

.log-tab.active {
    color: var(--gold);
}

.log-tab.active::after { opacity: 1; }

.log-content {
    flex: 1;
    padding: 18px;
    overflow-y: auto;
}

.quest-item {
    margin-bottom: 22px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border-subtle);
}

.quest-item:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
}

.quest-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
}

.quest-icon {
    width: 18px; height: 18px;
    color: var(--gold);
    opacity: 0.65;
    flex-shrink: 0;
}

.quest-title {
    font-family: var(--font-serif);
    color: var(--gold);
    font-size: 0.9rem;
    font-weight: 400;
    letter-spacing: 0.3px;
}

.quest-desc {
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 12px;
    padding-left: 28px;
    opacity: 0.85;
}

.quest-progress-track {
    height: 3px;
    background: var(--bg-deepest);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 6px;
    padding-left: 28px;
}

.quest-progress-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.quest-meta {
    font-size: 0.68rem;
    color: var(--text-dim);
    text-align: right;
    padding-right: 28px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-weight: 600;
}

.clue-item {
    background: var(--bg-panel-raised);
    border: 1px solid var(--border-subtle);
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 8px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    transition: all 0.2s;
}

.clue-item:hover {
    border-color: var(--border-mid);
    background: var(--bg-panel-hover);
}

.clue-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, rgba(212,175,55,0.1), rgba(212,175,55,0.03));
    border: 1px solid rgba(212,175,55,0.12);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    flex-shrink: 0;
}

.clue-text {
    font-size: 0.8rem;
    color: var(--text-main);
    line-height: 1.55;
}

.clue-text strong {
    color: var(--gold);
    font-weight: 600;
}

/* --- Particles --- */
.particles-container {
    position: absolute; inset: 0;
    z-index: 3;
    pointer-events: none;
    overflow: hidden;
}

.particle {
    position: absolute;
    width: 2px; height: 2px;
    background: var(--gold);
    border-radius: 50%;
    opacity: 0;
    animation: float-up linear infinite;
}

@keyframes float-up {
    0% { opacity: 0; transform: translateY(0) translateX(0) scale(1); }
    10% { opacity: 0.5; }
    90% { opacity: 0.08; }
    100% { opacity: 0; transform: translateY(-280px) translateX(var(--drift)) scale(0.3); }
}

.light-beam {
    position: absolute;
    top: -15%; left: 50%;
    transform: translateX(-50%);
    width: 350px; height: 110%;
    background: linear-gradient(180deg, rgba(212,175,55,0.02) 0%, transparent 65%);
    clip-path: polygon(42% 0%, 58% 0%, 78% 100%, 22% 100%);
    z-index: 2;
    pointer-events: none;
}

@media (max-width: 1100px) {
    main { grid-template-columns: 220px 1fr 260px; }
}
</style>
</head>
<body>

<div class="texture-overlay"></div>
<div class="vignette"></div>

<header>
    <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
        </svg>
        The Whispering Keep
    </div>
    <div class="counters">
        <div class="counter-item">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#b8952e" stroke-width="1.5">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 7v5l3 3"/>
            </svg>
            <span class="counter-val">1,240</span>
        </div>
        <div class="counter-item">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#4a9a6a" stroke-width="1.5">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2"/>
            </svg>
            <span class="counter-val">85</span>
        </div>
        <div class="counter-item">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#b04040" stroke-width="1.5">
                <circle cx="12" cy="12" r="9"/>
                <polyline points="12 6 12 12 16 14"/>
            </svg>
            <span class="counter-val">Day 14</span>
        </div>
    </div>
</header>

<main>
    <!-- Left Sidebar: Roster -->
    <aside class="roster-panel">
        <div class="panel-title">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="opacity:0.4">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            Townsfolk
        </div>
        <div class="roster-list">
            <div class="npc-card active" onclick="selectNPC(this)">
                <div class="npc-avatar">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <radialGradient id="skin1" cx="50%" cy="40%">
                                <stop offset="0%" stop-color="#f2e8d8"/>
                                <stop offset="100%" stop-color="#d8c8b0"/>
                            </radialGradient>
                            <radialGradient id="hair1" cx="50%" cy="30%">
                                <stop offset="0%" stop-color="#7a5a3a"/>
                                <stop offset="100%" stop-color="#4a3020"/>
                            </radialGradient>
                        </defs>
                        <rect width="100" height="100" fill="#141620"/>
                        <!-- Shoulders -->
                        <path d="M25,78 Q25,68 35,65 L65,65 Q75,68 75,78 L75,100 L25,100Z" fill="#2a3a4a"/>
                        <path d="M30,70 Q30,66 36,64 L64,64 Q70,66 70,70 L70,100 L30,100Z" fill="#344a5a"/>
                        <!-- Neck -->
                        <rect x="42" y="58" width="16" height="12" rx="6" fill="url(#skin1)"/>
                        <!-- Head -->
                        <ellipse cx="50" cy="42" rx="24" ry="28" fill="url(#skin1)"/>
                        <!-- Hair -->
                        <path d="M26,38 Q26,18 50,15 Q74,18 74,38 Q74,30 68,26 Q50,20 32,26 Q26,30 26,38Z" fill="url(#hair1)"/>
                        <path d="M26,38 Q22,50 24,62 Q26,52 28,44Z" fill="url(#hair1)"/>
                        <path d="M74,38 Q78,50 76,62 Q74,52 72,44Z" fill="url(#hair1)"/>
                        <!-- Eyes -->
                        <ellipse cx="41" cy="40" rx="3.5" ry="3.8" fill="#2a2520"/>
                        <ellipse cx="59" cy="40" rx="3.5" ry="3.8" fill="#2a2520"/>
                        <circle cx="42" cy="38.5" r="1.2" fill="white" opacity="0.7"/>
                        <circle cx="60" cy="38.5" r="1.2" fill="white" opacity="0.7"/>
                        <!-- Eyebrows -->
                        <path d="M35,32 Q41,29 47,32" fill="none" stroke="#4a3020" stroke-width="1.8" stroke-linecap="round"/>
                        <path d="M53,32 Q59,29 65,32" fill="none" stroke="#4a3020" stroke-width="1.8" stroke-linecap="round"/>
                        <!-- Nose -->
                        <path d="M49,44 Q50,48 51,44" fill="none" stroke="#c8b8a0" stroke-width="1.2" stroke-linecap="round"/>
                        <!-- Mouth -->
                        <path d="M44,52 Q50,56 56,52" fill="none" stroke="#2a2520" stroke-width="1.5" stroke-linecap="round"/>
                        <!-- Blush -->
                        <ellipse cx="35" cy="48" rx="4" ry="2" fill="#e8a090" opacity="0.2"/>
                        <ellipse cx="65" cy="48" rx="4" ry="2" fill="#e8a090" opacity="0.2"/>
                    </svg>
                </div>
                <div class="npc-info">
                    <div class="npc-name">Elara Vance</div>
                    <div class="npc-role">Blacksmith</div>
                </div>
                <div class="status-indicator available"></div>
            </div>

            <div class="npc-card" onclick="selectNPC(this)">
                <div class="npc-avatar">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <radialGradient id="skin2" cx="50%" cy="40%">
                                <stop offset="0%" stop-color="#e8ddd0"/>
                                <stop offset="100%" stop-color="#c8b8a0"/>
                            </radialGradient>
                            <radialGradient id="hair2" cx="50%" cy="30%">
                                <stop offset="0%" stop-color="#2a2a3a"/>
                                <stop offset="100%" stop-color="#1a1a2a"/>
                            </radialGradient>
                        </defs>
