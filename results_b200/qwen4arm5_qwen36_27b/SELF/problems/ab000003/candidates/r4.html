<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Whispering Keep</title>
<style>
:root {
  --bg-deep: #07080c;
  --bg-panel: #0c0e15;
  --bg-surface: #111420;
  --bg-surface-hover: #161a28;
  --bg-elevated: #1a1e30;
  --border-subtle: rgba(255,255,255,0.04);
  --border-default: rgba(255,255,255,0.07);
  --border-active: rgba(201,168,76,0.3);
  --gold: #c9a84c;
  --gold-light: #e2c97a;
  --gold-dim: #7a6530;
  --gold-glow: rgba(201,168,76,0.12);
  --gold-soft: rgba(201,168,76,0.05);
  --ember: #c45a2a;
  --ember-soft: rgba(196,90,42,0.15);
  --text-bright: #f0ebe0;
  --text-primary: #d4cec0;
  --text-secondary: #8a8478;
  --text-muted: #5a564e;
  --text-faint: #3a3830;
  --status-green: #4a9a6a;
  --status-amber: #d4943a;
  --status-red: #b04040;
  --font-serif: 'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif;
  --font-sans: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',sans-serif;
  --font-mono: 'SF Mono','Cascadia Code','Consolas','Courier New',monospace;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

html,body{height:100%;overflow:hidden}

body{
  background:var(--bg-deep);
  color:var(--text-secondary);
  font-family:var(--font-sans);
  font-size:14px;
  line-height:1.5;
  display:flex;flex-direction:column;
  user-select:none;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* Film grain overlay */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:99999;
  opacity:0.03;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='6' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:256px 256px;
}

/* Vignette */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:99998;
  background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(3,3,6,0.55) 100%);
}

::selection{background:var(--gold-dim);color:var(--text-bright)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.1)}

/* ===== HEADER ===== */
header{
  height:52px;min-height:52px;
  background:linear-gradient(180deg,rgba(12,14,21,0.98),rgba(10,12,18,0.95));
  border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;position:relative;z-index:100;
  backdrop-filter:blur(12px);
}
header::after{
  content:'';position:absolute;bottom:-1px;left:60px;right:60px;height:1px;
  background:linear-gradient(90deg,transparent 5%,var(--gold-dim) 50%,transparent 95%);opacity:0.2;
}

.brand{display:flex;align-items:center;gap:16px}
.brand-icon{
  width:22px;height:22px;color:var(--gold-dim);opacity:0.6;
}
.brand-name{
  font-family:var(--font-serif);font-size:0.72rem;
  color:var(--gold-dim);letter-spacing:5px;text-transform:uppercase;font-weight:400;
}

.counters{display:flex;gap:40px;align-items:center}
.counter{display:flex;align-items:center;gap:9px;font-size:0.75rem;color:var(--text-muted)}
.counter svg{width:14px;height:14px;opacity:0.45}
.counter-val{
  color:var(--text-primary);font-weight:600;font-variant-numeric:tabular-nums;
  font-size:0.82rem;letter-spacing:0.3px;
}

/* ===== MAIN LAYOUT ===== */
main{
  flex:1;display:grid;
  grid-template-columns:260px 1fr 300px;
  overflow:hidden;
}

/* ===== LEFT PANEL: ROSTER ===== */
.roster-panel{
  background:var(--bg-panel);
  border-right:1px solid var(--border-subtle);
  display:flex;flex-direction:column;
  overflow:hidden;
}

.panel-title{
  padding:22px 24px 16px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border-subtle);
}
.panel-title svg{width:13px;height:13px;color:var(--text-faint);opacity:0.5}
.panel-title span{
  font-size:0.58rem;text-transform:uppercase;letter-spacing:4px;
  color:var(--text-faint);font-weight:700;
}

.roster-list{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:4px}

.npc-card{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;border-radius:12px;
  cursor:pointer;transition:all 0.35s cubic-bezier(0.25,0.46,0.45,0.94);
  border:1px solid transparent;position:relative;
  background:transparent;
}
.npc-card:hover{background:var(--bg-surface-hover);border-color:var(--border-default)}

.npc-card.active{
  background:linear-gradient(135deg,rgba(201,168,76,0.07),rgba(201,168,76,0.02));
  border-color:rgba(201,168,76,0.2);
  box-shadow:0 2px 24px rgba(0,0,0,0.3),inset 0 1px 0 rgba(201,168,76,0.05);
}
.npc-card.active .npc-name{color:var(--gold-light)}
.npc-card.active .npc-avatar{border-color:rgba(201,168,76,0.35)}
.npc-card.active .status-dot{box-shadow:0 0 12px var(--status-green)}

.npc-avatar{
  width:44px;height:44px;border-radius:50%;overflow:hidden;
  flex-shrink:0;border:2px solid var(--border-default);
  transition:all 0.35s;background:var(--bg-surface);
}
.npc-avatar svg{width:100%;height:100%}

.npc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.npc-name{
  font-family:var(--font-serif);font-size:0.9rem;font-weight:600;
  color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color 0.35s;letter-spacing:0.2px;
}
.npc-role{font-size:0.68rem;color:var(--text-muted);letter-spacing:0.3px;opacity:0.7}

.status-dot{
  width:7px;height:7px;border-radius:50%;flex-shrink:0;
  transition:all 0.35s;
}
.status-dot.available{background:var(--status-green)}
.status-dot.busy{background:var(--status-amber)}
.status-dot.hostile{background:var(--status-red)}

/* ===== CENTER: STAGE ===== */
.stage-panel{
  display:flex;flex-direction:column;overflow:hidden;
  position:relative;
}

.scene-visual{
  flex:1;position:relative;overflow:hidden;min-height:0;
  display:flex;align-items:flex-end;justify-content:center;
}

/* Atmospheric background */
.scene-bg{
  position:absolute;inset:0;z-index:1;
}

/* Light beam */
.light-cone{
  position:absolute;top:-10%;left:50%;transform:translateX(-50%);
  width:350px;height:110%;
  background:linear-gradient(180deg,rgba(201,168,76,0.02) 0%,transparent 50%);
  clip-path:polygon(42% 0%,58% 0%,75% 100%,25% 100%);
  z-index:2;pointer-events:none;
}

/* Floating particles */
.particles{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.particle{
  position:absolute;width:2px;height:2px;
  background:var(--gold);border-radius:50%;
  opacity:0;animation:floatUp linear infinite;
}
@keyframes floatUp{
  0%{opacity:0;transform:translateY(0) translateX(0) scale(1)}
  12%{opacity:0.5}
  80%{opacity:0.03}
  100%{opacity:0;transform:translateY(-350px) translateX(var(--drift)) scale(0.15)}
}

/* NPC Stage figure */
.npc-stage{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  z-index:5;width:280px;height:380px;
  animation:breathe 5s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(-3px)}
}

.npc-shadow{
  position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  width:180px;height:16px;
  background:radial-gradient(ellipse,rgba(0,0,0,0.4) 0%,transparent 70%);
  border-radius:50%;z-index:4;
}

/* Dialogue area */
.dialogue-area{
  background:linear-gradient(180deg,#0e1018 0%,#0a0c14 100%);
  border-top:1px solid var(--border-subtle);
  padding:24px 44px 22px;position:relative;z-index:10;
  min-height:240px;
}
.dialogue-area::before{
  content:'';position:absolute;top:-1px;left:60px;right:60px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,0.2),transparent);
}

.dialogue-speaker{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.speaker-name{
  font-family:var(--font-serif);font-size:1.3rem;color:var(--gold);
  font-weight:400;letter-spacing:0.5px;
}
.speaker-title{font-size:0.72rem;color:var(--text-muted);font-style:italic;letter-spacing:0.5px;opacity:0.5}

.dialogue-text{
  font-family:var(--font-serif);font-size:1rem;line-height:1.8;
  color:var(--text-primary);margin-bottom:20px;opacity:0.9;max-width:90%;
}
.dialogue-text .first-letter{
  float:left;font-size:2.2rem;line-height:1;margin-right:5px;margin-top:3px;
  color:var(--gold);font-weight:400;
}

.choices-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.choice-btn{
  background:linear-gradient(135deg,rgba(255,255,255,0.025),rgba(255,255,255,0.005));
  border:1px solid var(--border-default);padding:13px 16px;text-align:left;
  color:var(--text-secondary);font-family:var(--font-sans);font-size:0.82rem;
  border-radius:10px;cursor:pointer;
  transition:all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
  display:flex;align-items:center;gap:12px;line-height:1.45;
}
.choice-btn:hover{
  background:linear-gradient(135deg,rgba(201,168,76,0.08),rgba(201,168,76,0.02));
  border-color:rgba(201,168,76,0.25);color:var(--gold-light);
  transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,0.3);
}
.choice-btn:active{transform:translateY(0)}

.choice-key{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;padding:0 6px;
  background:var(--bg-surface);border:1px solid var(--border-default);
  border-radius:5px;font-size:0.68rem;color:var(--text-muted);
  font-family:var(--font-mono);font-weight:600;transition:all 0.25s;
}
.choice-btn:hover .choice-key{
  background:var(--gold);color:var(--bg-deep);border-color:var(--gold);
}

/* ===== RIGHT PANEL ===== */
.log-panel{
  background:var(--bg-panel);border-left:1px solid var(--border-subtle);
  display:flex;flex-direction:column;overflow:hidden;
}

.log-tabs{display:flex;border-bottom:1px solid var(--border-subtle);position:relative}
.log-tab{
  flex:1;padding:16px 12px;text-align:center;
  font-size:0.58rem;text-transform:uppercase;letter-spacing:3.5px;
  color:var(--text-faint);cursor:pointer;transition:all 0.3s;
  font-weight:700;position:relative;background:transparent;
}
.log-tab::after{
  content:'';position:absolute;bottom:-1px;left:35%;right:35%;
  height:2px;background:var(--gold);border-radius:2px 2px 0 0;
  opacity:0;transition:opacity 0.3s;
}
.log-tab:hover{color:var(--text-muted);background:rgba(255,255,255,0.008)}
.log-tab.active{color:var(--gold)}
.log-tab.active::after{opacity:1}

.log-content{flex:1;padding:20px 22px;overflow-y:auto}

.quest-item{margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid var(--border-subtle)}
.quest-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}

.quest-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.quest-icon{width:16px;height:16px;color:var(--gold);opacity:0.5;flex-shrink:0}
.quest-title{font-family:var(--font-serif);color:var(--gold);font-size:0.88rem;font-weight:400;letter-spacing:0.3px}

.quest-desc{
  font-size:0.76rem;color:var(--text-muted);line-height:1.6;
  margin-bottom:12px;padding-left:26px;opacity:0.75;
}

.quest-progress-track{
  height:3px;background:var(--bg-surface);border-radius:2px;
  overflow:hidden;margin-bottom:6px;padding-left:26px;
}
.quest-progress-fill{
  height:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--gold-dim),var(--gold));
  transition:width 0.8s cubic-bezier(0.25,0.46,0.45,0.94);
}
.quest-meta{
  font-size:0.6rem;color:var(--text-faint);text-align:right;
  padding-right:26px;letter-spacing:0.5px;text-transform:uppercase;font-weight:600;
}

/* Clue tab */
.clue-list{display:none}
.clue-list.active{display:block}
.quest-list{display:none}
.quest-list.active{display:block}

.clue-item{
  background:var(--bg-surface);border:1px solid var(--border-subtle);
  padding:13px 15px;border-radius:10px;margin-bottom:8px;
  display:flex;gap:13px;align-items:flex-start;
  transition:all 0.25s;
}
.clue-item:hover{border-color:var(--border-default);background:var(--bg-surface-hover)}

.clue-icon{
  width:34px;height:34px;
  background:linear-gradient(135deg,rgba(201,168,76,0.1),rgba(201,168,76,0.03));
  border:1px solid rgba(201,168,76,0.08);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);flex-shrink:0;
}
.clue-icon svg{width:16px;height:16px}

.clue-text{font-size:0.78rem;color:var(--text-secondary);line-height:1.5}
.clue-text strong{color:var(--gold-light);font-weight:600}
.clue-source{font-size:0.64rem;color:var(--text-faint);margin-top:5px;text-transform:uppercase;letter-spacing:1px}

/* ===== RESPONSIVE ===== */
@media(max-width:1200px){
  main{grid-template-columns:220px 1fr 260px}
}
@media(max-width:900px){
  main{grid-template-columns:1fr}
  .roster-panel,.log-panel{display:none}
}
</style>
</head>

            <path d="M53,30 Q59,28 65,30" fill="none" stroke="#151520" stroke-width="1.6" stroke-linecap="round"/>
