<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Whispering Keep</title>
<style>
:root {
  --void: #06060a;
  --abyss: #0b0d14;
  --deep: #0f1119;
  --panel: #131620;
  --panel-light: #181c2a;
  --panel-hover: #1e2336;
  --border: #1f2438;
  --border-light: #2a3050;
  --border-glow: #3a4270;
  --gold: #c9a84c;
  --gold-bright: #e0c068;
  --gold-dim: #8a7030;
  --gold-glow: rgba(201,168,76,0.15);
  --gold-soft: rgba(201,168,76,0.06);
  --ember: #c45a2a;
  --ember-glow: rgba(196,90,42,0.25);
  --text-primary: #e8e2d8;
  --text-secondary: #9a9488;
  --text-muted: #5a564e;
  --text-dim: #3a3830;
  --green: #4a9a6a;
  --green-glow: rgba(74,154,106,0.35);
  --red: #b04040;
  --red-glow: rgba(176,64,64,0.35);
  --amber: #d4943a;
  --amber-glow: rgba(212,148,58,0.3);
  --serif: 'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono: 'SF Mono','Cascadia Code','Consolas',monospace;
}

*{margin:0;padding:0;box-sizing:border-box}

html,body{height:100%;overflow:hidden}

body{
  background:var(--void);
  color:var(--text-secondary);
  font-family:var(--sans);
  display:flex;
  flex-direction:column;
  user-select:none;
  -webkit-font-smoothing:antialiased;
}

/* Grain texture overlay */
body::before{
  content:'';
  position:fixed;inset:0;
  pointer-events:none;z-index:10000;
  opacity:0.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:128px 128px;
}

/* Vignette */
body::after{
  content:'';
  position:fixed;inset:0;
  pointer-events:none;z-index:9999;
  background:radial-gradient(ellipse at 50% 50%,transparent 50%,rgba(4,4,8,0.6) 100%);
}

::selection{background:var(--gold-dim);color:var(--text-primary)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--border-light)}

/* ===== HEADER ===== */
header{
  height:56px;min-height:56px;
  background:linear-gradient(180deg,#0e1018 0%,#0a0c14 100%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;position:relative;z-index:100;
}
header::after{
  content:'';position:absolute;bottom:-1px;left:40px;right:40px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);opacity:0.3;
}

.brand{display:flex;align-items:center;gap:14px}
.brand-icon{width:24px;height:24px;color:var(--gold);opacity:0.7}
.brand-name{
  font-family:var(--serif);font-size:0.82rem;
  color:var(--gold-dim);letter-spacing:4px;text-transform:uppercase;font-weight:400;
}

.counters{display:flex;gap:32px;align-items:center}
.counter{display:flex;align-items:center;gap:8px;font-size:0.78rem;color:var(--text-muted)}
.counter svg{width:15px;height:15px;opacity:0.5}
.counter-val{color:var(--text-primary);font-weight:600;font-variant-numeric:tabular-nums;font-size:0.85rem}

/* ===== MAIN LAYOUT ===== */
main{
  flex:1;display:grid;
  grid-template-columns:280px 1fr 320px;
  overflow:hidden;
}

/* ===== LEFT PANEL: ROSTER ===== */
.roster-panel{
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
}

.panel-header{
  padding:24px 22px 18px;
  display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--border);
}
.panel-header svg{width:14px;height:14px;color:var(--text-dim);opacity:0.5}
.panel-header span{
  font-size:0.62rem;text-transform:uppercase;letter-spacing:3.5px;
  color:var(--text-dim);font-weight:700;
}

.roster-list{flex:1;overflow-y:auto;padding:14px 14px;display:flex;flex-direction:column;gap:6px}

.npc-card{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;border-radius:12px;
  cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  border:1px solid transparent;position:relative;
  background:transparent;
}
.npc-card:hover{background:var(--panel-hover);border-color:var(--border)}

.npc-card.active{
  background:linear-gradient(135deg,rgba(201,168,76,0.08),rgba(201,168,76,0.02));
  border-color:rgba(201,168,76,0.25);
  box-shadow:0 4px 20px rgba(0,0,0,0.3),inset 0 1px 0 rgba(201,168,76,0.06);
}
.npc-card.active .npc-name{color:var(--gold-bright)}
.npc-card.active .npc-avatar{border-color:var(--gold-dim);box-shadow:0 0 20px rgba(201,168,76,0.15)}

.npc-avatar{
  width:48px;height:48px;border-radius:50%;overflow:hidden;
  flex-shrink:0;border:2px solid var(--border);
  transition:all 0.3s;background:var(--deep);
}
.npc-avatar svg{width:100%;height:100%}

.npc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.npc-name{
  font-family:var(--serif);font-size:0.92rem;font-weight:600;
  color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color 0.3s;letter-spacing:0.2px;
}
.npc-role{font-size:0.72rem;color:var(--text-muted);letter-spacing:0.3px;opacity:0.7}

.status-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  transition:all 0.3s;
}
.status-dot.available{background:var(--green);box-shadow:0 0 10px var(--green-glow)}
.status-dot.busy{background:var(--amber);box-shadow:0 0 10px var(--amber-glow)}
.status-dot.hostile{background:var(--red);box-shadow:0 0 10px var(--red-glow)}

/* ===== CENTER: STAGE ===== */
.stage-panel{
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--abyss);position:relative;
}

.scene-visual{
  flex:1;position:relative;overflow:hidden;min-height:0;
  display:flex;align-items:flex-end;justify-content:center;
}

/* Atmospheric background */
.scene-bg{
  position:absolute;inset:0;z-index:1;
}

/* Light beam from above */
.light-cone{
  position:absolute;top:-20%;left:50%;transform:translateX(-50%);
  width:400px;height:120%;
  background:linear-gradient(180deg,rgba(201,168,76,0.015) 0%,transparent 55%);
  clip-path:polygon(40% 0%,60% 0%,80% 100%,20% 100%);
  z-index:2;pointer-events:none;
}

/* Floating particles */
.particles{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.particle{
  position:absolute;width:2px;height:2px;
  background:var(--gold);border-radius:50%;
  opacity:0;animation:floatUp linear infinite;
}
@keyframes floatUp{
  0%{opacity:0;transform:translateY(0) translateX(0) scale(1)}
  15%{opacity:0.6}
  85%{opacity:0.05}
  100%{opacity:0;transform:translateY(-300px) translateX(var(--drift)) scale(0.2)}
}

/* NPC Stage figure */
.npc-stage{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  z-index:5;width:300px;height:420px;
  animation:breathe 6s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(-4px)}
}
.npc-stage:hover{animation-play-state:paused}

.npc-shadow{
  position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
  width:200px;height:20px;
  background:radial-gradient(ellipse,rgba(0,0,0,0.5) 0%,transparent 70%);
  border-radius:50%;z-index:4;
}

/* Dialogue area */
.dialogue-area{
  background:linear-gradient(180deg,#111420 0%,#0c0e16 100%);
  border-top:1px solid var(--border);
  padding:28px 40px 24px;position:relative;z-index:10;
  min-height:260px;
}
.dialogue-area::before{
  content:'';position:absolute;top:-1px;left:40px;right:40px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);opacity:0.3;
}

.dialogue-speaker{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.speaker-name{
  font-family:var(--serif);font-size:1.4rem;color:var(--gold);
  font-weight:400;letter-spacing:0.5px;
}
.speaker-title{font-size:0.78rem;color:var(--text-muted);font-style:italic;letter-spacing:0.5px;opacity:0.6}

.dialogue-text{
  font-family:var(--serif);font-size:1.05rem;line-height:1.85;
  color:var(--text-primary);margin-bottom:22px;opacity:0.92;max-width:92%;
}
.dialogue-text .first-letter{
  float:left;font-size:2.4rem;line-height:1;margin-right:6px;margin-top:4px;
  color:var(--gold);font-weight:400;
}

.choices-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.choice-btn{
  background:linear-gradient(135deg,rgba(255,255,255,0.03),rgba(255,255,255,0.008));
  border:1px solid var(--border);padding:14px 16px;text-align:left;
  color:var(--text-secondary);font-family:var(--sans);font-size:0.85rem;
  border-radius:10px;cursor:pointer;
  transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
  display:flex;align-items:center;gap:12px;line-height:1.45;
}
.choice-btn:hover{
  background:linear-gradient(135deg,rgba(201,168,76,0.1),rgba(201,168,76,0.03));
  border-color:var(--gold-dim);color:var(--gold-bright);
  transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.35);
}
.choice-btn:active{transform:translateY(0)}

.choice-key{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:24px;height:24px;padding:0 6px;
  background:var(--panel-light);border:1px solid var(--border-light);
  border-radius:5px;font-size:0.7rem;color:var(--text-muted);
  font-family:var(--mono);font-weight:600;transition:all 0.2s;
}
.choice-btn:hover .choice-key{
  background:var(--gold);color:var(--void);border-color:var(--gold);
}

/* ===== RIGHT PANEL ===== */
.log-panel{
  background:var(--panel);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}

.log-tabs{display:flex;border-bottom:1px solid var(--border);position:relative}
.log-tab{
  flex:1;padding:18px 12px;text-align:center;
  font-size:0.62rem;text-transform:uppercase;letter-spacing:3px;
  color:var(--text-dim);cursor:pointer;transition:all 0.3s;
  font-weight:700;position:relative;background:transparent;
}
.log-tab::after{
  content:'';position:absolute;bottom:-1px;left:30%;right:30%;
  height:2px;background:var(--gold);border-radius:2px 2px 0 0;
  opacity:0;transition:opacity 0.3s;
}
.log-tab:hover{color:var(--text-muted);background:rgba(255,255,255,0.01)}
.log-tab.active{color:var(--gold)}
.log-tab.active::after{opacity:1}

.log-content{flex:1;padding:20px;overflow-y:auto}

.quest-item{margin-bottom:24px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.quest-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}

.quest-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.quest-icon{width:18px;height:18px;color:var(--gold);opacity:0.6;flex-shrink:0}
.quest-title{font-family:var(--serif);color:var(--gold);font-size:0.92rem;font-weight:400;letter-spacing:0.3px}

.quest-desc{
  font-size:0.8rem;color:var(--text-muted);line-height:1.65;
  margin-bottom:14px;padding-left:28px;opacity:0.8;
}

.quest-progress-track{
  height:4px;background:var(--deep);border-radius:3px;
  overflow:hidden;margin-bottom:8px;padding-left:28px;
}
.quest-progress-fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--gold-dim),var(--gold));
  transition:width 0.8s cubic-bezier(0.4,0,0.2,1);
}
.quest-meta{
  font-size:0.65rem;color:var(--text-dim);text-align:right;
  padding-right:28px;letter-spacing:0.5px;text-transform:uppercase;font-weight:600;
}

/* Clue tab */
.clue-list{display:none}
.clue-list.active{display:block}
.quest-list{display:none}
.quest-list.active{display:block}

.clue-item{
  background:var(--panel-light);border:1px solid var(--border);
  padding:14px 16px;border-radius:10px;margin-bottom:10px;
  display:flex;gap:14px;align-items:flex-start;
  transition:all 0.25s;
}
.clue-item:hover{border-color:var(--border-light);background:var(--panel-hover)}

.clue-icon{
  width:36px;height:36px;
  background:linear-gradient(135deg,rgba(201,168,76,0.12),rgba(201,168,76,0.04));
  border:1px solid rgba(201,168,76,0.1);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);flex-shrink:0;
}
.clue-icon svg{width:18px;height:18px}

.clue-text{font-size:0.82rem;color:var(--text-secondary);line-height:1.55}
.clue-text strong{color:var(--gold-bright);font-weight:600}
.clue-source{font-size:0.68rem;color:var(--text-dim);margin-top:6px;text-transform:uppercase;letter-spacing:1px}

/* ===== RESPONSIVE ===== */
@media(max-width:1200px){
  main{grid-template-columns:240px 1fr 280px}
}
@media(max-width:900px){
  main{grid-template-columns:1fr}
  .roster-panel,.log-panel{display:none}
}
</style>
</head>
