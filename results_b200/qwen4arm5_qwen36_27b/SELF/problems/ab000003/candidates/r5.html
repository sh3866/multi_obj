<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Whispering Keep</title>
<style>
@import url('data:text/css,');
:root{
  --void:#050508;
  --abyss:#08090d;
  --stone-deep:#0c0e14;
  --stone:#11131c;
  --stone-mid:#161824;
  --stone-light:#1c1f2e;
  --stone-pale:#252840;
  --gold-deep:#8a6d2b;
  --gold:#b8943e;
  --gold-bright:#d4af5c;
  --gold-pale:#e8d5a8;
  --gold-glow:rgba(184,148,62,0.15);
  --gold-soft:rgba(184,148,62,0.06);
  --ember:#c45a2a;
  --ember-glow:rgba(196,90,42,0.12);
  --candle:#f0c860;
  --candle-glow:rgba(240,200,96,0.08);
  --text-hero:#f2ead8;
  --text-primary:#d8d0c0;
  --text-body:#a89f8e;
  --text-dim:#6a6358;
  --text-faint:#3d3a34;
  --verdant:#4a8a5a;
  --verdant-glow:rgba(74,138,90,0.2);
  --crimson:#a03a3a;
  --crimson-glow:rgba(160,58,58,0.2);
  --amber:#c49a3a;
  --amber-glow:rgba(196,154,58,0.2);
  --border:rgba(255,255,255,0.04);
  --border-strong:rgba(255,255,255,0.07);
  --border-gold:rgba(184,148,62,0.15);
  --font-display:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --font-mono:'SF Mono','Cascadia Code','Consolas','Courier New',monospace;
  --font-small:11px;
  --radius:8px;
  --radius-lg:14px;
  --radius-xl:20px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:var(--void);
  color:var(--text-body);
  font-family:var(--font-body);
  font-size:13px;
  line-height:1.55;
  display:flex;flex-direction:column;
  user-select:none;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:100000;
  opacity:0.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:128px 128px;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:99999;
  background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(2,2,5,0.6) 100%);
}
::selection{background:rgba(184,148,62,0.25);color:var(--text-hero)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.05);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.09)}

/* ===== HEADER ===== */
header{
  height:56px;min-height:56px;
  background:linear-gradient(180deg,rgba(8,9,13,0.97),rgba(6,7,11,0.94));
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 36px;position:relative;z-index:200;
}
header::after{
  content:'';position:absolute;bottom:-1px;left:100px;right:100px;height:1px;
  background:linear-gradient(90deg,transparent 8%,var(--gold-deep) 50%,transparent 92%);opacity:0.12;
}
.brand{display:flex;align-items:center;gap:18px}
.brand-icon{
  width:26px;height:26px;color:var(--gold-deep);opacity:0.5;
}
.brand-text{display:flex;flex-direction:column;gap:1px}
.brand-name{
  font-family:var(--font-display);font-size:0.65rem;
  color:var(--gold-deep);letter-spacing:6px;text-transform:uppercase;font-weight:400;
}
.brand-sub{
  font-size:0.55rem;color:var(--text-faint);letter-spacing:3px;text-transform:uppercase;font-weight:600;
}
.counters{display:flex;gap:36px;align-items:center}
.counter{display:flex;align-items:center;gap:10px}
.counter-icon{width:15px;height:15px;opacity:0.4}
.counter-icon svg{width:100%;height:100%}
.counter-val{
  font-family:var(--font-mono);font-size:0.78rem;
  color:var(--text-body);font-weight:500;letter-spacing:0.5px;
}
.counter-val.gold{color:var(--gold);opacity:0.7}
.counter-val.white{color:var(--text-primary);opacity:0.6}

/* ===== MAIN LAYOUT ===== */
main{
  flex:1;display:grid;
  grid-template-columns:280px 1fr 320px;
  overflow:hidden;
  position:relative;
}

/* ===== LEFT PANEL ===== */
.roster-panel{
  background:linear-gradient(180deg,var(--abyss),rgba(8,9,13,0.98));
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;position:relative;
}
.roster-panel::after{
  content:'';position:absolute;top:0;right:0;bottom:0;width:40px;
  background:linear-gradient(90deg,transparent,rgba(8,9,13,0.5));
  pointer-events:none;
}
.panel-header{
  padding:28px 24px 20px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--border);
}
.panel-header svg{width:14px;height:14px;color:var(--text-faint);opacity:0.4}
.panel-header span{
  font-size:0.55rem;text-transform:uppercase;letter-spacing:5px;
  color:var(--text-faint);font-weight:700;
}
.roster-list{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:6px}

.npc-card{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;border-radius:var(--radius-lg);
  cursor:pointer;transition:all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
  border:1px solid transparent;position:relative;
  background:transparent;
}
.npc-card:hover{
  background:rgba(255,255,255,0.018);
  border-color:var(--border);
}
.npc-card.active{
  background:linear-gradient(135deg,rgba(184,148,62,0.06),rgba(184,148,62,0.015));
  border-color:rgba(184,148,62,0.18);
  box-shadow:0 2px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(184,148,62,0.04);
}
.npc-card.active .npc-name{color:var(--gold-pale)}
.npc-card.active .npc-avatar{border-color:rgba(184,148,62,0.25)}
.npc-card.active .status-dot{box-shadow:0 0 10px var(--verdant-glow)}

.npc-avatar{
  width:42px;height:42px;border-radius:50%;overflow:hidden;
  flex-shrink:0;border:1.5px solid var(--border-strong);
  transition:all 0.4s;background:var(--stone-deep);
  position:relative;
}
.npc-avatar svg{width:100%;height:100%}

.npc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.npc-name{
  font-family:var(--font-display);font-size:0.92rem;font-weight:500;
  color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color 0.4s;letter-spacing:0.3px;
}
.npc-role{font-size:0.68rem;color:var(--text-dim);letter-spacing:0.2px;opacity:0.6}

.status-dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
  transition:all 0.4s;
}
.status-dot.available{background:var(--verdant)}
.status-dot.busy{background:var(--amber)}
.status-dot.hostile{background:var(--crimson)}

/* ===== CENTER: STAGE ===== */
.stage-panel{
  display:flex;flex-direction:column;overflow:hidden;
  position:relative;background:var(--void);
}

.scene-visual{
  flex:1;position:relative;overflow:hidden;min-height:0;
  display:flex;align-items:flex-end;justify-content:center;
}

.scene-bg{position:absolute;inset:0;z-index:1}

/* Atmospheric layers */
.atmos-layer{position:absolute;inset:0;z-index:2;pointer-events:none}

/* Light shaft */
.light-shaft{
  position:absolute;top:-5%;left:50%;transform:translateX(-50%);
  width:400px;height:105%;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,rgba(240,200,96,0.015) 0%,transparent 60%);
  clip-path:polygon(45% 0%,55% 0%,68% 100%,32% 100%);
}

/* Particles */
.particles{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.particle{
  position:absolute;width:2px;height:2px;
  background:var(--gold);border-radius:50%;
  opacity:0;animation:floatUp linear infinite;
}
@keyframes floatUp{
  0%{opacity:0;transform:translateY(0) translateX(0) scale(1)}
  15%{opacity:0.4}
  75%{opacity:0.02}
  100%{opacity:0;transform:translateY(-400px) translateX(var(--drift)) scale(0.1)}
}

/* NPC on stage */
.npc-stage{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  z-index:10;width:260px;height:360px;
  animation:breathe 6s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(-4px)}
}

/* Dialogue area */
.dialogue-area{
  background:linear-gradient(180deg,rgba(12,13,20,0.95),rgba(8,9,13,0.98));
  border-top:1px solid var(--border);
  padding:28px 48px 24px;position:relative;z-index:20;
  min-height:220px;
}
.dialogue-area::before{
  content:'';position:absolute;top:-1px;left:80px;right:80px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(184,148,62,0.15),transparent);
}

.dialogue-speaker{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.speaker-name{
  font-family:var(--font-display);font-size:1.25rem;color:var(--gold-pale);
  font-weight:400;letter-spacing:0.5px;
}
.speaker-title{
  font-family:var(--font-display);font-size:0.72rem;color:var(--text-dim);
  font-style:italic;letter-spacing:0.5px;opacity:0.5;
}

.dialogue-text{
  font-family:var(--font-display);font-size:1.05rem;line-height:1.85;
  color:var(--text-primary);margin-bottom:22px;opacity:0.85;max-width:85%;
}
.dialogue-text .first-letter{
  float:left;font-size:2.4rem;line-height:1;margin-right:6px;margin-top:2px;
  color:var(--gold);font-weight:400;
}

.choices-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.choice-btn{
  background:linear-gradient(135deg,rgba(255,255,255,0.02),rgba(255,255,255,0.003));
  border:1px solid var(--border-strong);padding:14px 18px;text-align:left;
  color:var(--text-body);font-family:var(--font-body);font-size:0.82rem;
  border-radius:var(--radius);cursor:pointer;
  transition:all 0.35s cubic-bezier(0.25,0.46,0.45,0.94);
  display:flex;align-items:center;gap:14px;line-height:1.5;
}
.choice-btn:hover{
  background:linear-gradient(135deg,rgba(184,148,62,0.07),rgba(184,148,62,0.015));
  border-color:rgba(184,148,62,0.2);color:var(--gold-pale);
  transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
.choice-btn:active{transform:translateY(0)}

.choice-key{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:24px;height:24px;padding:0 7px;
  background:var(--stone-mid);border:1px solid var(--border-strong);
  border-radius:6px;font-size:0.65rem;color:var(--text-dim);
  font-family:var(--font-mono);font-weight:600;transition:all 0.25s;
  letter-spacing:0.5px;
}
.choice-btn:hover .choice-key{
  background:var(--gold-deep);color:var(--void);border-color:var(--gold-deep);
}

/* ===== RIGHT PANEL ===== */
.log-panel{
  background:linear-gradient(180deg,var(--abyss),rgba(8,9,13,0.98));
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  position:relative;
}
.log-panel::before{
  content:'';position:absolute;top:0;left:0;bottom:0;width:40px;
  background:linear-gradient(270deg,transparent,rgba(8,9,13,0.5));
  pointer-events:none;
}

.log-tabs{display:flex;border-bottom:1px solid var(--border);position:relative}
.log-tab{
  flex:1;padding:18px 12px;text-align:center;
  font-size:0.55rem;text-transform:uppercase;letter-spacing:4px;
  color:var(--text-faint);cursor:pointer;transition:all 0.3s;
  font-weight:700;position:relative;background:transparent;
}
.log-tab::after{
  content:'';position:absolute;bottom:-1px;left:30%;right:30%;
  height:1.5px;background:var(--gold-deep);border-radius:2px 2px 0 0;
  opacity:0;transition:opacity 0.3s;
}
.log-tab:hover{color:var(--text-dim);background:rgba(255,255,255,0.006)}
.log-tab.active{color:var(--gold)}
.log-tab.active::after{opacity:0.6}

.log-content{flex:1;padding:24px 22px;overflow-y:auto}

.quest-item{margin-bottom:24px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.quest-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}

.quest-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.quest-icon{width:16px;height:16px;color:var(--gold-deep);opacity:0.4;flex-shrink:0}
.quest-title{
  font-family:var(--font-display);color:var(--gold);font-size:0.85rem;
  font-weight:400;letter-spacing:0.3px;
}

.quest-desc{
  font-size:0.74rem;color:var(--text-dim);line-height:1.65;
  margin-bottom:14px;padding-left:26px;opacity:0.7;
}

.quest-progress-track{
  height:3px;background:var(--stone-mid);border-radius:2px;
  overflow:hidden;margin-bottom:8px;padding-left:26px;
}
.quest-progress-fill{
  height:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--gold-deep),var(--gold));
  transition:width 0.8s cubic-bezier(0.25,0.46,0.45,0.94);
}
.quest-meta{
  font-size:0.58rem;color:var(--text-faint);text-align:right;
  padding-right:26px;letter-spacing:0.8px;text-transform:uppercase;font-weight:600;
}

.clue-list{display:none}
.clue-list.active{display:block}
.quest-list{display:none}
.quest-list.active{display:block}

.clue-item{
  background:var(--stone);border:1px solid var(--border);
  padding:14px 16px;border-radius:var(--radius);margin-bottom:10px;
  display:flex;gap:14px;align-items:flex-start;
  transition:all 0.25s;
}
.clue-item:hover{border-color:var(--border-strong);background:var(--stone-mid)}

.clue-icon{
  width:32px;height:32px;
  background:linear-gradient(135deg,rgba(184,148,62,0.08),rgba(184,148,62,0.02));
  border:1px solid rgba(184,148,62,0.06);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--gold-deep);flex-shrink:0;
}
.clue-icon svg{width:14px;height:14px}

.clue-text{font-size:0.76rem;color:var(--text-body);line-height:1.55}
.clue-text strong{color:var(--gold-pale);font-weight:600}
.clue-source{font-size:0.6rem;color:var(--text-faint);margin-top:6px;text-transform:uppercase;letter-spacing:1.2px}

/* ===== RESPONSIVE ===== */
@media(max-width:1200px){
  main{grid-template-columns:240px 1fr 280px}
}
@media(max-width:900px){
  main{grid-template-columns:1fr}
  .roster-panel,.log-panel{display:none}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/>
      <path d="M2 17l10 5 10-5"/>
      <path d="M2 12l10 5 10-5"/>
    </svg>
    <div class="brand-text">
      <span class="brand-name">The Whispering Keep</span>
      <span class="brand-sub">Chapter III — Shadows Gather</span>
    </div>
  </div>
  <div class="counters">
    <div class="counter">
      <div class="counter-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#b8943e" stroke-width="1.3">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
        </svg>
      </div>
      <span class="counter-val gold">1,240</span>
    </div>
    <div class="counter">
      <div class="counter-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#4a8a5a" stroke-width="1.3">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2"/>
        </svg>
      </div>
      <span class="counter-val white">85</span>
    </div>
    <div class="counter">
      <div class="counter-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#a03a3a" stroke-width="1.3">
          <circle cx="12" cy="12" r="9"/><polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>
      <span class="counter-val white">Day 14</span>
    </div>
  </div>
</header>

<main>
  <!-- LEFT: Roster -->
  <aside class="roster-panel">
    <div class="panel-header">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>Townsfolk</span>
    </div>
    <div class="roster-list">

      <div class="npc-card active" onclick="selectNPC(this)">
        <div class="npc-avatar">
          <svg viewBox="0 0 100 100">
            <defs>
              <radialGradient id="s1" cx="48%" cy="40%"><stop offset="0%" stop-color="#e8dcc8"/><stop offset="100%" stop-color="#c8b898"/></radialGradient>
              <radialGradient id="h1" cx="50%" cy="22%"><stop offset="0%" stop-color="#5a3a1a"/><stop offset="100%" stop-color="#2e1e0e"/></radialGradient>
              <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a4a5a"/><stop offset="100%" stop-color="#283040"/></linearGradient>
            </defs>
            <rect width="100" height="100" fill="#0c0e14"/>
            <path d="M20,82 Q20,68 33,63 L67,63 Q80,68 80,82 L80,100 L20,100Z" fill="url(#c1)"/>
            <path d="M26,76 Q26,70 35,66 L65,66 Q74,70 74,76 L74,100 L26,100Z" fill="#3e5060"/>
            <rect x="42" y="57" width="16" height="10" rx="5" fill="url(#s1)"/>
            <ellipse cx="50" cy="40" rx="22" ry="26" fill="url(#s1)"/>
            <path d="M28,36 Q28,14 50,11 Q72,14 72,36 Q74,28 66,22 Q50,15 34,22 Q26,28 28,36Z" fill="url(#h1)"/>
            <path d="M28,36 Q24,50 26,62 Q28,48 30,40Z" fill="url(#h1)"/>
            <path d="M72,36 Q76,50 74,62 Q72,48 70,40Z" fill="url(#h1)"/>
            <ellipse cx="41" cy="38" rx="3" ry="3.5" fill="#2a2520"/>
            <ellipse cx="59" cy="38" rx="3" ry="3.5" fill="#2a2520"/>
            <circle cx="42" cy="36.5" r="1" fill="white" opacity="0.6"/>
            <circle cx="60" cy="36.5" r="1" fill="white" opacity="0.6"/>
            <path d="M35,30 Q41,27 47,30" fill="none" stroke="#3a2515" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M53,30 Q59,27 65,30" fill="none" stroke="#3a2515" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M49,42 Q50,45 51,42" fill="none" stroke="#b0a090" stroke-width="0.9" stroke-linecap="round"/>
            <path d="M43,50 Q50,53 57,50" fill="none" stroke="#2a2520" stroke-width="1.3" stroke-linecap="round"/>
            <ellipse cx="34" cy="46" rx="3" ry="1.5" fill="#d09080" opacity="0.15"/>
            <ellipse cx="66" cy="46" rx="3" ry="1.5" fill="#d09080" opacity="0.15"/>
          </svg>
        </div>
        <div class="npc-info">
          <div class="npc-name">Elara Vance</div>
          <div class="npc-role">Blacksmith</div>
        </div>
        <div class="status-dot available"></div>
      </div>

      <div class="npc-card" onclick="selectNPC(this)">
        <div class="npc-avatar">
          <svg viewBox="0 0 100 100">
            <defs>
              <radialGradient id="s2" cx="48%" cy="40%"><stop offset="0%" stop-color="#ddd2c4"/><stop offset="100%" stop-color="#b8a890"/></radialGradient>
              <radialGradient id="h2" cx="50%" cy="22%"><stop offset="0%" stop-color="#2a2a3a"/><stop offset="100%" stop-color="#12121a"/></radialGradient>
            </defs>
            <rect width="100" height="100" fill="#0c0e14"/>
            <path d="M20,82 Q20,68 33,63 L67,63 Q80,68 80,82 L80,100 L20,100Z" fill="#2a2a3a"/>
