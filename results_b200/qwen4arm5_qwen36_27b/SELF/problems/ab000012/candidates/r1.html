<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    @font-face {
        font-family: 'GameHeading';
        src: local('Georgia'), local('Palatino Linotype'), local('Palatino'), local('Times New Roman');
    }

    :root {
        --void: #030108;
        --void-mid: #0a0618;
        --void-light: #150e28;
        --gold: #c9a84c;
        --gold-bright: #f0d678;
        --gold-dim: #7a6228;
        --spirit: #6ee7ff;
        --spirit-dim: #2a8a9a;
        --spirit-glow: rgba(110, 231, 255, 0.15);
        --text: #e8e0f0;
        --text-dim: #8a7fa0;
        --card-bg: rgba(12, 8, 28, 0.75);
        --card-border: rgba(201, 168, 76, 0.15);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    html, body {
        height: 100%;
        overflow: hidden;
    }

    body {
        background: var(--void);
        color: var(--text);
        font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* === BACKGROUND LAYERS === */
    #bg-canvas {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 0;
    }

    .bg-gradient {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1;
        background:
            radial-gradient(ellipse 60% 50% at 50% 40%, rgba(30, 15, 60, 0.6) 0%, transparent 70%),
            radial-gradient(ellipse 80% 60% at 50% 100%, rgba(5, 2, 15, 0.9) 0%, transparent 60%),
            radial-gradient(ellipse 40% 40% at 50% 35%, rgba(110, 231, 255, 0.03) 0%, transparent 60%);
        pointer-events: none;
    }

    .bg-vignette {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
        background: radial-gradient(ellipse at center, transparent 40%, var(--void) 100%);
        pointer-events: none;
    }

    .fog-layer {
        position: fixed;
        bottom: 0; left: 0;
        width: 200%; height: 40%;
        z-index: 3;
        opacity: 0.12;
        background: repeating-linear-gradient(
            90deg,
            transparent 0%,
            rgba(110, 231, 255, 0.08) 10%,
            transparent 20%
        );
        animation: fogDrift 30s linear infinite;
        pointer-events: none;
    }

    @keyframes fogDrift {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
    }

    /* === MAIN LAYOUT === */
    .app-wrapper {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 860px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 1.5rem 2rem 2rem;
    }

    /* === TOP BAR === */
    .top-bar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 0.5rem 0;
        margin-bottom: 1rem;
    }

    .currency-display {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 20px;
        background: linear-gradient(135deg, rgba(20, 14, 40, 0.9), rgba(10, 6, 20, 0.95));
        border: 1px solid var(--gold-dim);
        border-radius: 30px;
        box-shadow:
            0 0 20px rgba(201, 168, 76, 0.08),
            inset 0 1px 0 rgba(255, 255, 255, 0.05);
        position: relative;
        overflow: hidden;
    }

    .currency-display::before {
        content: '';
        position: absolute;
        top: 0; left: -100%;
        width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
        animation: shimmer 4s ease-in-out infinite;
    }

    @keyframes shimmer {
        0%, 100% { left: -100%; }
        50% { left: 100%; }
    }

    .coin-svg {
        width: 22px;
        height: 22px;
        filter: drop-shadow(0 0 6px rgba(201, 168, 76, 0.5));
    }

    .currency-value {
        font-family: Georgia, 'Palatino Linotype', serif;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--gold-bright);
        letter-spacing: 0.5px;
        text-shadow: 0 0 12px rgba(201, 168, 76, 0.3);
    }

    /* === HERO AREA === */
    .hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        min-height: 0;
    }

    .title-group {
        text-align: center;
        margin-bottom: 1.5rem;
        position: relative;
    }

    .game-title {
        font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
        font-size: clamp(2.2rem, 5vw, 3.2rem);
        font-weight: 400;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 40%, var(--gold-dim) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 2px 15px rgba(201, 168, 76, 0.25));
        position: relative;
        line-height: 1.2;
    }

    .game-title::after {
        content: '';
        display: block;
        width: 60%;
        height: 1px;
        margin: 0.6rem auto 0;
        background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }

    .game-subtitle {
        font-family: -apple-system, 'Segoe UI', sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        color: var(--spirit);
        opacity: 0.6;
        margin-top: 0.8rem;
        text-shadow: 0 0 20px var(--spirit-glow);
    }

    /* === SUMMONING ORB === */
    .orb-scene {
        position: relative;
        width: 220px;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1rem;
    }

    .orb-outer-ring {
        position: absolute;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        border: 1px solid rgba(110, 231, 255, 0.08);
        animation: orbSpin 25s linear infinite;
    }

    .orb-outer-ring::before {
        content: '';
        position: absolute;
        top: -3px; left: 50%;
        width: 6px; height: 6px;
        margin-left: -3px;
        border-radius: 50%;
        background: var(--spirit);
        box-shadow: 0 0 10px var(--spirit);
    }

    .orb-inner-ring {
        position: absolute;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        border: 1px solid rgba(110, 231, 255, 0.12);
        animation: orbSpin 18s linear infinite reverse;
    }

    .orb-inner-ring::before,
    .orb-inner-ring::after {
        content: '';
        position: absolute;
        width: 4px; height: 4px;
        border-radius: 50%;
        background: var(--spirit);
        box-shadow: 0 0 8px var(--spirit);
    }
    .orb-inner-ring::before { top: -2px; left: 50%; margin-left: -2px; }
    .orb-inner-ring::after { bottom: -2px; left: 50%; margin-left: -2px; }

    .orb-core-glow {
        position: absolute;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(110, 231, 255, 0.25) 0%, rgba(110, 231, 255, 0.05) 50%, transparent 70%);
        animation: orbPulse 4s ease-in-out infinite;
    }

    .orb-core {
        position: absolute;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%,
            rgba(220, 255, 255, 0.9) 0%,
            rgba(110, 231, 255, 0.6) 25%,
            rgba(42, 138, 154, 0.3) 55%,
            transparent 75%
        );
        box-shadow:
            0 0 30px rgba(110, 231, 255, 0.3),
            0 0 60px rgba(110, 231, 255, 0.15),
            inset 0 0 20px rgba(255, 255, 255, 0.1);
        animation: orbPulse 4s ease-in-out infinite;
    }

    .orb-core::after {
        content: '';
        position: absolute;
        top: 15%; left: 20%;
        width: 30%; height: 25%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.4);
        filter: blur(4px);
    }

    .orb-crosshair {
        position: absolute;
        width: 180px;
        height: 180px;
        opacity: 0.06;
    }

    .orb-crosshair::before,
    .orb-crosshair::after {
        content: '';
        position: absolute;
        background: var(--spirit);
    }
    .orb-crosshair::before {
        width: 1px; height: 100%;
        left: 50%; top: 0;
    }
    .orb-crosshair::after {
        width: 100%; height: 1px;
        top: 50%; left: 0;
    }

    @keyframes orbSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes orbPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.85; }
    }

    /* === MENU CARDS === */
    .menu-area {
        padding: 1rem 0 0.5rem;
    }

    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.25rem;
    }

    .menu-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 1.5rem 0.75rem;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        cursor: pointer;
        transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
        overflow: hidden;
    }

    .menu-card::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 14px;
        background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.03) 0%, transparent 60%);
        pointer-events: none;
    }

    .menu-card::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(201, 168, 76, 0.3), transparent);
        opacity: 0;
        transition: opacity 0.35s;
    }

    .menu-card:hover {
        transform: translateY(-4px);
        border-color: rgba(201, 168, 76, 0.35);
        box-shadow:
            0 8px 32px rgba(0, 0, 0, 0.4),
            0 0 40px rgba(201, 168, 76, 0.06);
        background: rgba(18, 12, 40, 0.85);
    }

    .menu-card:hover::after {
        opacity: 1;
    }

    .menu-card:active {
        transform: translateY(-1px) scale(0.98);
    }

    /* Summon card special styling */
    .menu-card.summon-card {
        background: linear-gradient(180deg, rgba(30, 20, 55, 0.9), rgba(15, 10, 30, 0.95));
        border-color: rgba(201, 168, 76, 0.3);
        box-shadow:
            0 0 30px rgba(201, 168, 76, 0.05),
            inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .menu-card.summon-card::after {
        opacity: 1;
        background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    }

    .menu-card.summon-card:hover {
        border-color: rgba(201, 168, 76, 0.5);
        box-shadow:
            0 8px 40px rgba(0, 0, 0, 0.5),
            0 0 50px rgba(201, 168, 76, 0.12);
    }

    .card-icon-wrap {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .card-icon-wrap svg {
        width: 36px;
        height: 36px;
        fill: var(--text-dim);
        transition: all 0.35s;
    }

    .menu-card:hover .card-icon-wrap svg {
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 8px rgba(201, 168, 76, 0.4));
    }

    .menu-card.summon-card .card-icon-wrap svg {
        fill: var(--gold);
    }

    .menu-card.summon-card:hover .card-icon-wrap svg {
        fill: var(--gold-bright);
    }

    .card-label {
        font-family: Georgia, 'Palatino Linotype', serif;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--text);
        transition: color 0.35s;
    }

    .menu-card:hover .card-label {
        color: var(--gold-bright);
    }

    .menu-card.summon-card .card-label {
        color: var(--gold);
    }

    /* === CORNER ORNAMENTS === */
    .corner-ornament {
        position: fixed;
        width: 80px;
        height: 80px;
        z-index: 5;
        opacity: 0.15;
        pointer-events: none;
    }

    .corner-ornament.tl { top: 12px; left: 12px; }
    .corner-ornament.tr { top: 12px; right: 12px; transform: scaleX(-1); }
    .corner-ornament.bl { bottom: 12px; left: 12px; transform: scaleY(-1); }
    .corner-ornament.br { bottom: 12px; right: 12px; transform: scale(-1, -1); }

    /* === FOOTER === */
    .footer-text {
        text-align: center;
        font-size: 0.72rem;
        color: var(--text-dim);
        opacity: 0.35;
        letter-spacing: 0.1em;
        padding-top: 1rem;
    }

    /* === RESPONSIVE === */
    @media (max-width: 640px) {
        .app-wrapper { padding: 1rem; }
        .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }
        .orb-scene { width: 160px; height: 160px; }
        .orb-outer-ring { width: 150px; height: 150px; }
        .orb-inner-ring { width: 120px; height: 120px; }
        .orb-core-glow { width: 90px; height: 90px; }
        .orb-core { width: 50px; height: 50px; }
        .orb-crosshair { width: 140px; height: 140px; }
        .game-title { letter-spacing: 0.2em; }
        .corner-ornament { width: 50px; height: 50px; }
    }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="bg-gradient"></div>
<div class="bg-vignette"></div>
<div class="fog-layer"></div>

<!-- Corner Ornaments -->
<svg class="corner-ornament tl" viewBox="0 0 80 80" fill="none">
    <path d="M0 0 L80 0 L80 8 L8 8 L8 80 L0 80 Z" fill="rgba(201,168,76,0.5)"/>
    <path d="M20 0 L20 2 L2 2 L2 20 L0 20 L0 0 Z" fill="rgba(201,168,76,0.3)"/>
    <circle cx="12" cy="12" r="2" fill="rgba(201,168,76,0.4)"/>
</svg>
<svg class="corner-ornament tr" viewBox="0 0 80 80" fill="none">
    <path d="M0 0 L80 0 L80 8 L8 8 L8 80 L0 80 Z" fill="rgba(201,168,76,0.5)"/>
    <path d="M20 0 L20 2 L2 2 L2 20 L0 20 L0 0 Z" fill="rgba(201,168,76,0.3)"/>
    <circle cx="12" cy="12" r="2" fill="rgba(201,168,76,0.4)"/>
</svg>
<svg class="corner-ornament bl" viewBox="0 0 80 80" fill="none">
    <path d="M0 0 L80 0 L80 8 L8 8 L8 80 L0 80 Z" fill="rgba(201,168,76,0.5)"/>
    <path d="M20 0 L20 2 L2 2 L2 20 L0 20 L0 0 Z" fill="rgba(201,168,76,0.3)"/>
    <circle cx="12" cy="12" r="2" fill="rgba(201,168,76,0.4)"/>
</svg>
<svg class="corner-ornament br" viewBox="0 0 80 80" fill="none">
    <path d="M0 0 L80 0 L80 8 L8 8 L8 80 L0 80 Z" fill="rgba(201,168,76,0.5)"/>
    <path d="M20 0 L20 2 L2 2 L2 20 L0 20 L0 0 Z" fill="rgba(201,168,76,0.3)"/>
    <circle cx="12" cy="12" r="2" fill="rgba(201,168,76,0.4)"/>
</svg>

<div class="app-wrapper">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="currency-display">
            <svg class="coin-svg" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="url(#coinGrad)" stroke-width="1.5" fill="rgba(201,168,76,0.1)"/>
                <circle cx="12" cy="12" r="7" stroke="rgba(201,168,76,0.3)" stroke-width="0.5"/>
                <text x="12" y="16" text-anchor="middle" font-size="10" font-family="Georgia, serif" fill="#f0d678" font-weight="bold">G</text>
                <defs>
                    <linearGradient id="coinGrad" x1="0" y1="0" x2="24" y2="24">
                        <stop offset="0%" stop-color="#f0d678"/>
                        <stop offset="100%" stop-color="#7a6228"/>
                    </linearGradient>
                </defs>
            </svg>
            <span class="currency-value">12,450</span>
        </div>
    </div>

    <!-- Hero -->
    <div class="hero">
        <div class="title-group">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>
        </div>

        <div class="orb-scene">
            <div class="orb-crosshair"></div>
            <div class="orb-outer-ring"></div>
            <div class="orb-inner-ring"></div>
            <div class="orb-core-glow"></div>
            <div class="orb-core"></div>
        </div>
    </div>

    <!-- Menu -->
    <nav class="menu-area">
        <div class="menu-grid">
            <!-- Summon -->
            <div class="menu-card summon-card" onclick="cardClick(this)">
                <div class="card-icon-wrap">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                    </svg>
                </div>
                <span class="card-label">Summon</span>
            </div>

            <!-- Roster -->
            <div class="menu-card" onclick="cardClick(this)">
                <div class="card-icon-wrap">
                    <svg viewBox="0 0 24 24">
                        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                    </svg>
                </div>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card" onclick="cardClick(this)">
                <div class="card-icon-wrap">
                    <svg viewBox="0 0 24 24">
                        <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
                    </svg>
                </div>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card" onclick="cardClick(this)">
                <div class="card-icon-wrap">
                    <svg viewBox="0 0 24 24">
                        <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.35 0-.64.22-.7.55l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.06.33.35.55.7.55h4c.35 0 .64-.22.7-.55l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                    </svg>
                </div>
                <span class="card-label">Grind</span>
            </div>
        </div>
    </nav>

    <div class="footer-text">Aetherbound v1.0.4 &bull; Offline Mode</div>
</div>

<script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W, H;
    let spirits = [];
    let time = 0;

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }

    class Spirit {
        constructor() {
            this.reset(true);
        }

        reset(initial) {
            this.x = Math.random() * W;
            this.y = initial ? Math.random() * H : H + 20;
            this.baseX = this.x;
            this.size = Math.random() * 2.5 + 0.5;
            this.speedY = -(Math.random() * 0.4 + 0.1);
            this.speedX = (Math.random() - 0.5) * 0.3;
            this.wobbleAmp = Math.random() * 30 + 10;
            this.wobbleSpeed = Math.random() * 0.005 + 0.002;
            this.wobbleOffset = Math.random() * Math.PI * 2;
            this.alpha = Math.random() * 0.4 + 0.1;
            this.alphaSpeed = Math.random() * 0.003 + 0.001;
            this.alphaDir = Math.random() > 0.5 ? 1 : -1;
            this.hue = Math.random() > 0.7 ? 185 : (Math.random() > 0.5 ? 45 : 260);
            this.life = 0;
        }

        update() {
            this.life++;
            this.y += this.speedY;
            this.x = this.baseX + Math.sin(this.life * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;
            this.baseX += this.speedX;

            this.alpha += this.alphaDir * this.alphaSpeed;
            if (this.alpha > 0.5) this.alphaDir = -1;
            if (this.alpha < 0.05) this.alphaDir = 1;

            if (this.y < -20 || this.x < -50 || this.x > W + 50) {
                this.reset(false);
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            const glow = this.size * 4;
            const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glow);
            grad.addColorStop(0, `hsla(${this.hue}, 60%, 75%, ${this.alpha})`);
            grad.addColorStop(1, `hsla(${this.hue}, 60%, 75%, 0)`);
            ctx.fillStyle = grad;
            ctx.fill();
        }
    }

    function init() {
        resize();
        spirits = [];
        const count = Math.min(Math.floor(W * H / 12000), 120);
        for (let i = 0; i < count; i++) {
            spirits.push(new Spirit());
        }
    }

    function animate() {
        time++;
        ctx.clearRect(0, 0, W, H);

        // Draw subtle ambient glow in center
        const cx = W / 2, cy = H * 0.38;
        const ambientGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 200);
        ambientGrad.addColorStop(0, 'rgba(110, 231, 255, 0.02)');
        ambientGrad.addColorStop(0.5, 'rgba(110, 231, 255, 0.008)');
        ambientGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = ambientGrad;
        ctx.fillRect(0, 0, W, H);

        for (const s of spirits) {
            s.update();
            s.draw();
        }

        requestAnimationFrame(animate);
    }

    function cardClick(el) {
        el.style.transform = 'translateY(-4px) scale(0.96)';
        setTimeout(() => {
            el.style.transform = '';
        }, 180);
    }

    window.addEventListener('resize', () => {
        resize();
        spirits.length = 0;
        const count = Math.min(Math.floor(W * H / 12000), 120);
        for (let i = 0; i < count; i++) {
            spirits.push(new Spirit());
        }
    });

    init();
    animate();
</script>
</body>
</html>
