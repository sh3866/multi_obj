<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden}
body{
  background:#05020e;
  color:#e0d8f0;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  display:flex;align-items:center;justify-content:center;
}

canvas#bg{position:fixed;inset:0;z-index:0}

.atmosphere{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 50% 40%,rgba(50,15,80,0.4) 0%,transparent 70%),
    radial-gradient(ellipse 80% 40% at 50% 60%,rgba(10,5,35,0.6) 0%,transparent 60%),
    radial-gradient(ellipse 40% 30% at 50% 35%,rgba(80,120,200,0.06) 0%,transparent 60%),
    radial-gradient(ellipse 100% 50% at 50% 100%,rgba(3,1,10,0.9) 0%,transparent 60%);
}

.vignette{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 25%,rgba(2,0,8,0.75) 100%);
}

.noise{
  position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='6' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:256px 256px;
}

.god-rays{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0.035;
  background:conic-gradient(from 185deg at 50% 38%,transparent 0deg,rgba(180,160,80,0.5) 1.5deg,transparent 3deg,transparent 175deg,rgba(180,160,80,0.3) 176.5deg,transparent 178deg,transparent 355deg,rgba(180,160,80,0.5) 356.5deg,transparent 358deg);
  animation:raysRotate 180s linear infinite;
}
@keyframes raysRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.fog-layer{
  position:fixed;bottom:0;left:-20%;width:140%;height:40%;z-index:4;pointer-events:none;
  background:linear-gradient(to top,rgba(5,2,14,0.95) 0%,transparent 100%);
}

.app{
  position:relative;z-index:10;
  width:100%;max-width:960px;height:100vh;
  display:flex;flex-direction:column;
  padding:1.5rem 2.5rem 1.5rem;
  justify-content:space-between;
}

/* TOP BAR */
.top-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:0.2rem;
  opacity:0;animation:fadeDown 0.7s ease-out 0.1s forwards;
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}

.top-left{display:flex;align-items:center;gap:8px}
.settings-btn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all 0.3s;
}
.settings-btn:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.12)}
.settings-btn svg{width:18px;height:18px;stroke:rgba(200,190,220,0.4);fill:none;stroke-width:1.5}

.currency-pill{
  display:flex;align-items:center;gap:8px;
  padding:6px 16px 6px 8px;
  background:linear-gradient(135deg,rgba(40,28,60,0.9),rgba(15,10,30,0.95));
  border:1px solid rgba(201,168,76,0.2);
  border-radius:20px;
  box-shadow:0 0 20px rgba(201,168,76,0.05),inset 0 1px 0 rgba(255,255,255,0.03);
  position:relative;overflow:hidden;
}
.currency-pill::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.03),transparent);
  animation:shimmer 6s ease-in-out infinite;
}
@keyframes shimmer{0%,100%{left:-100%}50%{left:200%}}

.coin{
  width:22px;height:22px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 35% 30%,#f5e6a3,#d4a843 35%,#8a6e2f 75%,#4a3818);
  box-shadow:0 0 8px rgba(201,168,76,0.35),inset 0 -2px 3px rgba(0,0,0,0.3),inset 0 1px 2px rgba(255,255,255,0.2);
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-size:10px;font-weight:bold;color:#3a2a0a;
  text-shadow:0 1px 0 rgba(255,255,255,0.3);
}
.currency-amount{
  font-family:Georgia,serif;font-size:0.95rem;font-weight:700;
  color:#f0d678;letter-spacing:0.3px;
  text-shadow:0 0 12px rgba(201,168,76,0.3),0 1px 2px rgba(0,0,0,0.5);
}

/* HERO */
.hero{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;min-height:0;padding:0.3rem 0;
  opacity:0;animation:heroIn 1s ease-out 0.2s forwards;
}
@keyframes heroIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

.title-block{text-align:center;margin-bottom:0.3rem;position:relative;z-index:5}

.game-title{
  font-family:Georgia,'Palatino Linotype','Book Antiqua',Palatino,serif;
  font-size:clamp(2.2rem,5vw,3.2rem);
  font-weight:400;letter-spacing:0.5em;text-transform:uppercase;
  background:linear-gradient(180deg,#f5e6a3 0%,#d4b85c 20%,#b8943a 50%,#8a6e2f 80%,#5a4820 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 2px 25px rgba(201,168,76,0.15));
  line-height:1.1;position:relative;
}
.game-title .shimmer{
  position:absolute;top:0;left:-100%;width:50%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent);
  animation:titleShimmer 7s ease-in-out infinite;pointer-events:none;
}
@keyframes titleShimmer{0%,100%{left:-50%}50%{left:150%}}

.title-divider{
  display:flex;align-items:center;justify-content:center;gap:14px;margin-top:0.7rem;
}
.title-divider .line{
  width:100px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,0.25),transparent);
}
.title-divider .gem{
  width:7px;height:7px;
  background:rgba(201,168,76,0.5);
  transform:rotate(45deg);
  box-shadow:0 0 10px rgba(201,168,76,0.25);
}

.subtitle{
  font-size:0.65rem;letter-spacing:0.7em;text-transform:uppercase;
  color:rgba(140,180,230,0.45);margin-top:0.8rem;
  text-shadow:0 0 20px rgba(100,160,240,0.1);
}

/* ORB SCENE */
.orb-scene{
  position:relative;width:300px;height:300px;
  display:flex;align-items:center;justify-content:center;
  margin-top:0.2rem;
}

.magic-ring{
  position:absolute;border-radius:50%;
  border:1px solid rgba(100,160,220,0.06);
}
.magic-ring.r1{width:280px;height:280px;animation:spin 80s linear infinite}
.magic-ring.r1::before{
  content:'';position:absolute;inset:-1px;border-radius:50%;
  border:1px solid transparent;border-top-color:rgba(100,160,220,0.12);border-right-color:rgba(100,160,220,0.08);
}
.magic-ring.r2{width:240px;height:240px;animation:spin 60s linear infinite reverse;border-style:dashed;border-color:rgba(100,160,220,0.04)}
.magic-ring.r3{width:190px;height:190px;animation:spin 40s linear infinite;border-color:rgba(100,160,220,0.05)}
.magic-ring.r3::before{
  content:'';position:absolute;inset:6px;border-radius:50%;
  border:1px solid rgba(100,160,220,0.03);
}

@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.rune-mark{
  position:absolute;width:3px;height:3px;border-radius:50%;
  background:rgba(100,180,240,0.35);
  box-shadow:0 0 6px rgba(100,180,240,0.2);
}
.rune-mark:nth-child(1){top:-1.5px;left:50%;margin-left:-1.5px}
.rune-mark:nth-child(2){bottom:-1.5px;left:50%;margin-left:-1.5px}
.rune-mark:nth-child(3){top:50%;left:-1.5px;margin-top:-1.5px}
.rune-mark:nth-child(4){top:50%;right:-1.5px;margin-top:-1.5px}
.rune-mark:nth-child(5){top:12%;right:8%}
.rune-mark:nth-child(6){bottom:12%;right:8%}
.rune-mark:nth-child(7){bottom:12%;left:8%}
.rune-mark:nth-child(8){top:12%;left:8%}

.cross-line{
  position:absolute;background:rgba(100,160,220,0.03);
}
.cross-line.h{width:220px;height:1px;top:50%;left:50%;transform:translate(-50%,-50%)}
.cross-line.v{width:1px;height:220px;top:50%;left:50%;transform:translate(-50%,-50%)}

.orb-glow{
  position:absolute;border-radius:50%;
}
.orb-glow.g1{
  width:160px;height:160px;
  background:radial-gradient(circle,rgba(100,200,255,0.1) 0%,rgba(70,150,220,0.03) 50%,transparent 70%);
  animation:pulse 5s ease-in-out infinite;
}
.orb-glow.g2{
  width:110px;height:110px;
  background:radial-gradient(circle,rgba(120,210,255,0.18) 0%,rgba(80,170,230,0.06) 50%,transparent 70%);
  animation:pulse 5s ease-in-out infinite 0.5s;
}
.orb-core{
  position:absolute;width:55px;height:55px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,
    rgba(230,248,255,0.95) 0%,
    rgba(140,215,255,0.7) 18%,
    rgba(80,175,240,0.4) 40%,
    rgba(40,115,200,0.15) 65%,transparent 100%);
  box-shadow:
    0 0 30px rgba(100,200,255,0.3),
    0 0 60px rgba(80,170,240,0.12),
    0 0 100px rgba(60,140,220,0.06),
    inset 0 0 12px rgba(255,255,255,0.12);
  animation:pulse 5s ease-in-out infinite;
}
.orb-core::after{
  content:'';position:absolute;top:10%;left:16%;
  width:38%;height:32%;border-radius:50%;
  background:rgba(255,255,255,0.45);filter:blur(4px);
}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:0.88}}

.sparkle{
  position:absolute;width:2.5px;height:2.5px;border-radius:50%;
  background:rgba(140,210,255,0.5);
  box-shadow:0 0 5px rgba(140,210,255,0.3);
  animation:sparkleFloat 4s ease-in-out infinite;
}
.sparkle:nth-child(1){top:18%;left:28%;animation-delay:0s}
.sparkle:nth-child(2){top:32%;right:18%;animation-delay:1.2s}
.sparkle:nth-child(3){bottom:22%;left:22%;animation-delay:2.4s}
.sparkle:nth-child(4){bottom:28%;right:28%;animation-delay:0.6s}
.sparkle:nth-child(5){top:12%;right:32%;animation-delay:1.8s;width:2px;height:2px}
.sparkle:nth-child(6){top:38%;left:12%;animation-delay:3s;width:2px;height:2px}
@keyframes sparkleFloat{0%,100%{transform:translateY(0) scale(1);opacity:0.3}50%{transform:translateY(-10px) scale(1.4);opacity:0.7}}

/* MENU */
.menu-area{
  padding-bottom:0.5rem;
  opacity:0;animation:menuIn 0.8s ease-out 0.5s forwards;
}
@keyframes menuIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.menu-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  gap:0.9rem;
}

.menu-card{
  position:relative;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;
  padding:1.4rem 0.6rem;
  background:linear-gradient(180deg,rgba(22,16,42,0.75) 0%,rgba(10,6,25,0.85) 100%);
  border:1px solid rgba(201,168,76,0.08);
  border-radius:14px;
  cursor:pointer;
  transition:all 0.4s cubic-bezier(0.23,1,0.32,1);
  overflow:hidden;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.menu-card::before{
  content:'';position:absolute;inset:0;border-radius:14px;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,0.02) 0%,transparent 50%);
  pointer-events:none;
}
.menu-card::after{
  content:'';position:absolute;top:0;left:15%;right:15%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,0.15),transparent);
  opacity:0;transition:opacity 0.4s;
}
.menu-card:hover{
  transform:translateY(-4px);
  border-color:rgba(201,168,76,0.2);
  box-shadow:0 8px 35px rgba(0,0,0,0.5),0 0 40px rgba(201,168,76,0.03);
  background:linear-gradient(180deg,rgba(30,22,52,0.85) 0%,rgba(14,8,30,0.95) 100%);
}
.menu-card:hover::after{opacity:1}
.menu-card:active{transform:translateY(-1px) scale(0.97)}

.menu-card.summon{
  background:linear-gradient(180deg,rgba(50,32,70,0.85) 0%,rgba(22,14,45,0.95) 100%);
  border-color:rgba(201,168,76,0.2);
  box-shadow:0 0 25px rgba(201,168,76,0.03),inset 0 1px 0 rgba(255,255,255,0.03);
}
.menu-card.summon::after{
  opacity:1;
  background:linear-gradient(90deg,transparent,rgba(240,214,120,0.35),transparent);
}
.menu-card.summon:hover{
  border-color:rgba(201,168,76,0.35);
  box-shadow:0 10px 45px rgba(0,0,0,0.5),0 0 55px rgba(201,168,76,0.06),inset 0 1px 0 rgba(255,255,255,0.05);
}

.card-icon{
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
}
.card-icon svg{width:28px;height:28px;transition:all 0.4s}
.menu-card:hover .card-icon svg{filter:drop-shadow(0 0 10px rgba(201,168,76,0.25))}

.card-label{
  font-family:Georgia,'Palatino Linotype',serif;
  font-size:0.85rem;font-weight:700;letter-spacing:0.08em;
  color:rgba(220,212,235,0.6);transition:color 0.4s;
}
.menu-card:hover .card-label{color:rgba(240,214,120,0.85)}
.menu-card.summon .card-label{color:rgba(212,184,92,0.75)}
.menu-card.summon:hover .card-label{color:rgba(240,214,120,0.95)}

/* CORNER ORNAMENTS */
.corner{position:fixed;z-index:5;pointer-events:none;opacity:0.1}
.corner svg{width:50px;height:50px}
.corner.tl{top:12px;left:12px}
.corner.tr{top:12px;right:12px;transform:scaleX(-1)}
.corner.bl{bottom:12px;left:12px;transform:scaleY(-1)}
.corner.br{bottom:12px;right:12px;transform:scale(-1)}

.footer{
  text-align:center;font-size:0.6rem;
  color:rgba(130,120,155,0.25);letter-spacing:0.15em;
  padding-top:0.6rem;
  opacity:0;animation:fadeUp 0.6s ease-out 0.8s forwards;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* RESPONSIVE */
@media(max-width:640px){
  .app{padding:0.8rem 1rem 1rem}
  .menu-grid{grid-template-columns:repeat(2,1fr);gap:0.7rem}
  .orb-scene{width:220px;height:220px}
  .magic-ring.r1{width:210px;height:210px}
  .magic-ring.r2{width:180px;height:180px}
  .magic-ring.r3{width:140px;height:140px}
  .orb-glow.g1{width:120px;height:120px}
  .orb-glow.g2{width:85px;height:85px}
  .orb-core{width:42px;height:42px}
  .cross-line.h{width:160px}
  .cross-line.v{height:160px}
  .game-title{letter-spacing:0.3em}
  .corner svg{width:35px;height:35px}
}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="atmosphere"></div>
<div class="god-rays"></div>
<div class="vignette"></div>
<div class="fog-layer"></div>
<div class="noise"></div>

<!-- Corners -->
<div class="corner tl"><svg viewBox="0 0 50 50" fill="none"><path d="M0 0H50V2.5H2.5V50H0Z" fill="rgba(201,168,76,0.7)"/><path d="M12 0H13.5V1.5H1.5V12H0V0Z" fill="rgba(201,168,76,0.35)"/><circle cx="9" cy="9" r="1.2" fill="rgba(201,168,76,0.5)"/><line x1="2.5" y1="25" x2="2.5" y2="42" stroke="rgba(201,168,76,0.12)" stroke-width="0.5"/><line x1="25" y1="2.5" x2="42" y2="2.5" stroke="rgba(201,168,76,0.12)" stroke-width="0.5"/></svg></div>
<div class="corner tr"><svg viewBox="0 0 50 50" fill="none"><path d="M0 0H50V2.5H2.5V50H0Z" fill="rgba(201,168,76,0.7)"/><path d="M12 0H13.5V1.5H1.5V12H0V0Z" fill="rgba(201,168,76,0.35)"/><circle cx="9" cy="9" r="1.2" fill="rgba(201,168,76,0.5)"/><line x1="2.5" y1="25" x2="2.5" y2="42" stroke="rgba(201,168,76,0.12)" stroke-width="0.5"/><line x1="25" y1="2.5" x2="42" y2="2.5" stroke="rgba(201,168,76,0.12)" stroke-width="0.5"/></svg></div>
<div class="corner bl"><svg viewBox="0 0 50 50" fill="none"><path d="M0 0H50V2.5H2.5V50H0Z" fill="rgba(201,168,76,0.7)"/><path d="M12 0H13.5V1.5H1.5V12H0V0Z" fill="rgba(201,168,76,0.35)"/><circle cx="9" cy="9" r="1.2" fill="rgba(201,168,76,0.5)"/><line x1="2.5" y1="25" x2="2.5" y2="42" stroke="rgba(201,168,76,0.12)" stroke-width="0.5"/><line x1="25" y1="2.5" x2="42" y2="2.5" stroke="rgba(201,168,76,0.12)" stroke-width="0.5"/></svg></div>
<div class="corner br"><svg viewBox="0 0 50 50" fill="none"><path d="M0 0H50V2.5H2.5V50H0Z" fill="rgba(201,168,76,0.7)"/><path d="M12 0H13.5V1.5H1.5V12H0V0Z" fill="rgba(201,168,76,0.35)"/><circle cx="9" cy="9" r="1.2" fill="rgba(201,168,76,0.5)"/><line x1="2.5" y1="25" x2="2.5" y2="42" stroke="rgba(201,168,76,0.12)" stroke-width="0.5"/><line x1="25" y1="2.5" x2="42" y2="2.5" stroke="rgba(201,168,76,0.12)" stroke-width="0.5"/></svg></div>

<div class="app">
  <div class="top-bar">
    <div class="top-left">
      <div class="settings-btn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>
      </div>
    </div>
    <div class="currency-pill">
      <div class="coin">G</div>
      <span class="currency-amount">12,450</span>
    </div>
  </div>

  <div class="hero">
    <div class="title-block">
      <h1 class="game-title">
        Aetherbound
        <span class="shimmer"></span>
      </h1>
      <div class="title-divider">
        <div class="line"></div>
        <div class="gem"></div>
        <div class="line"></div>
      </div>
      <p class="subtitle">Spirit Summoning</p>
    </div>

    <div class="orb-scene">
      <div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div>
      <div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div>
      <div class="cross-line h"></div><div class="cross-line v"></div>
      <div class="magic-ring r1">
        <div class="rune-mark"></div><div class="rune-mark"></div><div class="rune-mark"></div><div class="rune-mark"></div>
        <div class="rune-mark"></div><div class="rune-mark"></div><div class="rune-mark"></div><div class="rune-mark"></div>
      </div>
      <div class="magic-ring r2"></div>
      <div class="magic-ring r3"></div>
      <div class="orb-glow g1"></div>
      <div class="orb-glow g2"></div>
      <div class="orb-core"></div>
    </div>
  </div>

  <nav class="menu-area">
    <div class="menu-grid">
      <div class="menu-card summon" onclick="cardClick(this)">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8.5" stroke="rgba(201,168,76,0.5)" stroke-width="1.2"/>
            <circle cx="12" cy="12" r="5" stroke="rgba(201,168,76,0.35)" stroke-width="0.8"/>
            <circle cx="12" cy="12" r="2" fill="rgba(201,168,76,0.4)" stroke="rgba(201,168,76,0.6)" stroke-width="0.8"/>
            <line x1="12" y1="2" x2="12" y2="5" stroke="rgba(201,168,76,0.3)" stroke-width="0.8"/>
            <line x1="12" y1="19" x2="12" y2="22" stroke="rgba(201,168,76,0.3)" stroke-width="0.8"/>
            <line x1="2" y1="12" x2="5" y2="12" stroke="rgba(201,168,76,0.3)" stroke-width="0.8"/>
            <line x1="19" y1="12" x2="22" y2="12" stroke="rgba(201,168,76,0.3)" stroke-width="0.8"/>
            <path d="M12 7 L13.5 10.5 L17 10.5 L14 12.5 L15 16 L12 14 L9 16 L10 12.5 L7 10.5 L10.5 10.5Z" fill="rgba(201,168,76,0.12)" stroke="rgba(201,168,76,0.3)" stroke-width="0.6"/>

            <circle cx="16" cy="7.5" r="2.5" stroke="rgba(180,170,210,0.5)" stroke-width="1.2" fill="rgba(180,170,210,0.06)"/>
            <path d="M3 20 C3 16 5.5 13.5 8 13.5 C8.5 13.5 9 13.6 9.5 13.7 C10 13 11 12.5 12 12.5 C13 12.5 14 13 14.5 13.7 C15 13.6 15.5 13.5 16 13.5 C18.5 13.5 21 16 21 20" stroke="rgba(180,170,210,0.5)" stroke-width="1.2" fill="rgba(180,170,210,0.04)"/>
          </svg>

            <path d="M13 2L4 14L10 14L9 22L18 10L12 10L13 2Z" stroke="rgba(180,170,210,0.5)" stroke-width="1.2" fill="rgba(180,170,210,0.06)"/>

            <path d="M12 3L13.2 6.2L16 5L15 8L18.5 8.5L16 10.5L18.5 12.5L15 13L16 16L13.2 14.8L12 18L10.8 14.8L8 16L9 13L5.5 12.5L8 10.5L5.5 8.5L9 8L8 5L10.8 6.2Z" stroke="rgba(180,170,210,0.4)" stroke-width="0.9" fill="rgba(180,170,210,0.04)"/>

<script>
const canvas=document.getElementById('bg');
const ctx=canvas.getContext('2d');
let W,H;
const spirits=[];

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
window.addEventListener('resize',resize);
resize();

class Spirit{
  constructor(){this.reset(true)}
  reset(init){
    this.x=Math.random()*W;
    this.y=init?Math.random()*H:H+40;
    this.bx=this.x;
    this.sz=Math.random()*2.2+0.4;
    this.vy=-(Math.random()*0.25+0.06);
    this.vx=(Math.random()-0.5)*0.12;
    this.wA=Math.random()*30+10;
    this.wS=Math.random()*0.003+0.0008;
    this.wO=Math.random()*Math.PI*2;
    this.a=Math.random()*0.25+0.04;
    this.aS=Math.random()*0.0015+0.0004;
    this.aD=Math.random()>0.5?1:-1;
    const r=Math.random();
    if(r>0.7){this.h=42+Math.random()*12;this.s=45+Math.random()*25;this.l=58+Math.random()*18}
    else if(r>0.4){this.h=225+Math.random()*25;this.s=35+Math.random()*35;this.l=52+Math.random()*22}
    else{this.h=195+Math.random()*18;this.s=45+Math.random()*35;this.l=58+Math.random()*18}
    this.t=0;
  }
  update(){
    this.t++;
    this.y+=this.vy;
    this.x=this.bx+Math.sin(this.t*this.wS+this.wO)*this.wA;
    this.bx+=this.vx;
    this.a+=this.aD*this.aS;
    if(this.a>0.4)this.aD=-1;
    if(this.a<0.02)this.aD=1;
    if(this.y<-40||this.x<-80||this.x>W+80)this.reset(false);
  }
  draw(){
    const g=this.sz*6;
    const grad=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,g);
    grad.addColorStop(0,`hsla(${this.h},${this.s}%,${this.l}%,${this.a})`);
    grad.addColorStop(0.35,`hsla(${this.h},${this.s}%,${this.l}%,${this.a*0.35})`);
    grad.addColorStop(1,`hsla(${this.h},${this.s}%,${this.l}%,0)`);
    ctx.beginPath();ctx.arc(this.x,this.y,g,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
    ctx.beginPath();ctx.arc(this.x,this.y,this.sz*0.45,0,Math.PI*2);
    ctx.fillStyle=`hsla(${this.h},${this.s}%,${this.l+18}%,${this.a*1.4})`;ctx.fill();
  }
}

for(let i=0;i<70;i++)spirits.push(new Spirit());

// Central ambient glow on canvas
function drawAmbient(){
  const cx=W/2,cy=H*0.38;
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*0.35);
  grad.addColorStop(0,'rgba(60,30,90,0.08)');
  grad.addColorStop(0.5,'rgba(30,15,60,0.03)');
  grad.addColorStop(1,'transparent');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawAmbient();
  spirits.forEach(s=>{s.update();s.draw()});
  requestAnimationFrame(loop);
}
loop();

function cardClick(el){
  el.style.transform='translateY(-1px) scale(0.96)';
  setTimeout(()=>{el.style.transform=''},150);
}
</script>
</body>
