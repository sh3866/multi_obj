<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }
    html, body { height: 100%; overflow: hidden; }

    body {
        background: #020008;
        color: #e8e0f0;
        font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* === NOISE TEXTURE OVERLAY === */
    .noise-overlay {
        position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-size: 256px 256px;
    }

    /* === BACKGROUND CANVAS === */
    #bg-canvas {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
    }

    /* === ATMOSPHERIC GRADIENTS === */
    .atmosphere {
        position: fixed; inset: 0; z-index: 2; pointer-events: none;
        background:
            radial-gradient(ellipse 50% 45% at 50% 35%, rgba(60, 20, 90, 0.35) 0%, transparent 70%),
            radial-gradient(ellipse 70% 50% at 50% 50%, rgba(15, 5, 40, 0.5) 0%, transparent 60%),
            radial-gradient(ellipse 30% 30% at 50% 42%, rgba(100, 180, 255, 0.04) 0%, transparent 60%),
            radial-gradient(ellipse 100% 60% at 50% 100%, rgba(2, 0, 8, 0.95) 0%, transparent 50%);
    }

    .vignette {
        position: fixed; inset: 0; z-index: 3; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 35%, rgba(1, 0, 5, 0.85) 100%);
    }

    /* === GOD RAYS === */
    .god-rays {
        position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0.04;
        background:
            conic-gradient(from 170deg at 50% 30%, transparent 0deg, rgba(180, 140, 60, 0.3) 2deg, transparent 4deg, transparent 170deg, rgba(180, 140, 60, 0.2) 172deg, transparent 174deg, transparent 350deg, rgba(180, 140, 60, 0.3) 352deg, transparent 354deg);
        animation: raysRotate 120s linear infinite;
    }

    @keyframes raysRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    /* === BOTTOM FOG === */
    .fog-bottom {
        position: fixed; bottom: -10%; left: -10%; width: 120%; height: 35%; z-index: 4; pointer-events: none;
        background: linear-gradient(to top, rgba(8, 4, 20, 0.8) 0%, transparent 100%);
    }

    .fog-bottom::before {
        content: '';
        position: absolute; bottom: 0; left: 0; width: 200%; height: 100%;
        background: repeating-linear-gradient(90deg, transparent 0%, rgba(100, 160, 220, 0.015) 8%, transparent 16%);
        animation: fogDrift 40s linear infinite;
    }

    @keyframes fogDrift {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
    }

    /* === MAIN LAYOUT === */
    .app-wrapper {
        position: relative; z-index: 10;
        width: 100%; max-width: 900px; height: 100vh;
        display: flex; flex-direction: column;
        padding: 1.2rem 2rem 1.5rem;
        justify-content: space-between;
    }

    /* === TOP BAR === */
    .top-bar {
        display: flex; justify-content: flex-end; align-items: center;
        padding-top: 0.3rem;
    }

    .currency-display {
        display: flex; align-items: center; gap: 10px;
        padding: 7px 18px 7px 14px;
        background: linear-gradient(135deg, rgba(30, 20, 50, 0.85), rgba(10, 6, 25, 0.95));
        border: 1px solid rgba(201, 168, 76, 0.25);
        border-radius: 24px;
        box-shadow:
            0 0 25px rgba(201, 168, 76, 0.06),
            inset 0 1px 0 rgba(255, 255, 255, 0.04),
            0 2px 15px rgba(0, 0, 0, 0.4);
        position: relative; overflow: hidden;
    }

    .currency-display::before {
        content: '';
        position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
        animation: shimmer 5s ease-in-out infinite;
    }

    @keyframes shimmer {
        0%, 100% { left: -100%; }
        50% { left: 200%; }
    }

    .coin-icon {
        width: 24px; height: 24px; position: relative;
    }

    .coin-icon .coin-body {
        width: 24px; height: 24px; border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #f5e6a3, #c9a84c 40%, #8a6e2f 80%, #5a4820);
        box-shadow: 0 0 10px rgba(201, 168, 76, 0.4), inset 0 -2px 4px rgba(0,0,0,0.3), inset 0 2px 3px rgba(255,255,255,0.2);
        display: flex; align-items: center; justify-content: center;
        font-family: Georgia, 'Palatino Linotype', serif;
        font-size: 12px; font-weight: bold; color: #3a2a0a;
        text-shadow: 0 1px 0 rgba(255,255,255,0.3);
    }

    .currency-value {
        font-family: Georgia, 'Palatino Linotype', serif;
        font-size: 1.05rem; font-weight: 700;
        color: #f0d678;
        letter-spacing: 0.3px;
        text-shadow: 0 0 15px rgba(201, 168, 76, 0.35), 0 1px 2px rgba(0,0,0,0.5);
    }

    /* === HERO AREA === */
    .hero {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        position: relative; min-height: 0;
        padding: 0.5rem 0;
    }

    /* === TITLE === */
    .title-group {
        text-align: center; margin-bottom: 0.5rem; position: relative; z-index: 5;
    }

    .game-title {
        font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
        font-size: clamp(2.4rem, 5.5vw, 3.6rem);
        font-weight: 400;
        letter-spacing: 0.45em;
        text-transform: uppercase;
        background: linear-gradient(180deg, #f5e6a3 0%, #d4b85c 25%, #b8943a 50%, #8a6e2f 80%, #5a4820 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 2px 20px rgba(201, 168, 76, 0.2));
        line-height: 1.15;
        position: relative;
    }

    .title-ornament {
        display: flex; align-items: center; justify-content: center;
        margin-top: 0.6rem; gap: 12px;
    }

    .title-line {
        width: 80px; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(201, 168, 76, 0.3), transparent);
    }

    .title-diamond {
        width: 6px; height: 6px;
        background: rgba(201, 168, 76, 0.5);
        transform: rotate(45deg);
        box-shadow: 0 0 8px rgba(201, 168, 76, 0.3);
    }

    .game-subtitle {
        font-family: -apple-system, 'Segoe UI', sans-serif;
        font-size: 0.7rem;
        letter-spacing: 0.6em;
        text-transform: uppercase;
        color: rgba(140, 200, 240, 0.55);
        margin-top: 0.9rem;
        text-shadow: 0 0 20px rgba(100, 180, 255, 0.15);
    }

    /* === SUMMONING CIRCLE === */
    .orb-scene {
        position: relative;
        width: 280px; height: 280px;
        display: flex; align-items: center; justify-content: center;
        margin-top: 0.5rem;
    }

    /* Outer magical circle */
    .magic-circle {
        position: absolute; width: 260px; height: 260px;
        border-radius: 50%;
        border: 1px solid rgba(100, 160, 220, 0.08);
        animation: circleSpin 60s linear infinite;
    }

    .magic-circle::before {
        content: '';
        position: absolute; inset: -1px;
        border-radius: 50%;
        border: 1px solid transparent;
        border-top-color: rgba(100, 160, 220, 0.15);
        border-right-color: rgba(100, 160, 220, 0.1);
    }

    .magic-circle::after {
        content: '';
        position: absolute; inset: 8px;
        border-radius: 50%;
        border: 1px dashed rgba(100, 160, 220, 0.05);
    }

    /* Rune marks on the circle */
    .rune-ring {
        position: absolute; width: 230px; height: 230px;
        border-radius: 50%;
        animation: circleSpin 45s linear infinite reverse;
    }

    .rune-dot {
        position: absolute; width: 4px; height: 4px;
        border-radius: 50%;
        background: rgba(100, 180, 220, 0.4);
        box-shadow: 0 0 6px rgba(100, 180, 220, 0.3);
    }

    .rune-dot:nth-child(1) { top: -2px; left: 50%; margin-left: -2px; }
    .rune-dot:nth-child(2) { bottom: -2px; left: 50%; margin-left: -2px; }
    .rune-dot:nth-child(3) { top: 50%; left: -2px; margin-top: -2px; }
    .rune-dot:nth-child(4) { top: 50%; right: -2px; margin-top: -2px; }
    .rune-dot:nth-child(5) { top: 15%; right: 5%; }
    .rune-dot:nth-child(6) { bottom: 15%; right: 5%; }
    .rune-dot:nth-child(7) { bottom: 15%; left: 5%; }
    .rune-dot:nth-child(8) { top: 15%; left: 5%; }

    /* Inner ring */
    .inner-ring {
        position: absolute; width: 170px; height: 170px;
        border-radius: 50%;
        border: 1px solid rgba(100, 160, 220, 0.1);
        animation: circleSpin 30s linear infinite;
    }

    .inner-ring::before {
        content: '';
        position: absolute; inset: 5px;
        border-radius: 50%;
        border: 1px solid rgba(100, 160, 220, 0.06);
    }

    /* Crosshair lines */
    .crosshair-h, .crosshair-v {
        position: absolute;
        background: rgba(100, 160, 220, 0.04);
    }
    .crosshair-h { width: 200px; height: 1px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .crosshair-v { width: 1px; height: 200px; top: 50%; left: 50%; transform: translate(-50%, -50%); }

    /* Orb glow layers */
    .orb-glow-outer {
        position: absolute; width: 140px; height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(100, 200, 255, 0.12) 0%, rgba(80, 160, 220, 0.04) 50%, transparent 70%);
        animation: orbPulse 5s ease-in-out infinite;
    }

    .orb-glow-mid {
        position: absolute; width: 100px; height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(120, 210, 255, 0.2) 0%, rgba(80, 170, 230, 0.08) 50%, transparent 70%);
        animation: orbPulse 5s ease-in-out infinite 0.5s;
    }

    .orb-core {
        position: absolute; width: 60px; height: 60px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%,
            rgba(230, 250, 255, 0.95) 0%,
            rgba(140, 220, 255, 0.7) 20%,
            rgba(80, 180, 240, 0.4) 45%,
            rgba(40, 120, 200, 0.15) 70%,
            transparent 100%
        );
        box-shadow:
            0 0 25px rgba(100, 200, 255, 0.35),
            0 0 50px rgba(80, 170, 240, 0.15),
            0 0 80px rgba(60, 140, 220, 0.08),
            inset 0 0 15px rgba(255, 255, 255, 0.15);
        animation: orbPulse 5s ease-in-out infinite;
    }

    .orb-core::after {
        content: '';
        position: absolute; top: 12%; left: 18%;
        width: 35%; height: 30%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        filter: blur(5px);
    }

    /* Floating sparkles around orb */
    .sparkle {
        position: absolute; width: 3px; height: 3px;
        border-radius: 50%;
        background: rgba(140, 210, 255, 0.6);
        box-shadow: 0 0 6px rgba(140, 210, 255, 0.4);
        animation: sparkleFloat 4s ease-in-out infinite;
    }

    .sparkle:nth-child(1) { top: 20%; left: 30%; animation-delay: 0s; }
    .sparkle:nth-child(2) { top: 35%; right: 20%; animation-delay: 1s; }
    .sparkle:nth-child(3) { bottom: 25%; left: 25%; animation-delay: 2s; }
    .sparkle:nth-child(4) { bottom: 30%; right: 30%; animation-delay: 0.5s; }
    .sparkle:nth-child(5) { top: 15%; right: 35%; animation-delay: 1.5s; width: 2px; height: 2px; }
    .sparkle:nth-child(6) { top: 40%; left: 15%; animation-delay: 2.5s; width: 2px; height: 2px; }

    @keyframes sparkleFloat {
        0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
        50% { transform: translateY(-8px) scale(1.3); opacity: 0.8; }
    }

    @keyframes circleSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes orbPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.88; }
    }

    /* === MENU AREA === */
    .menu-area {
        padding-bottom: 0.5rem;
    }

    .menu-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        gap: 1rem;
    }

    .menu-card {
        position: relative;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 10px;
        padding: 1.3rem 0.5rem;
        background: linear-gradient(180deg, rgba(20, 14, 40, 0.8) 0%, rgba(10, 6, 25, 0.9) 100%);
        border: 1px solid rgba(201, 168, 76, 0.1);
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        overflow: hidden;
    }

    .menu-card::before {
        content: '';
        position: absolute; inset: 0;
        border-radius: 12px;
        background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.025) 0%, transparent 55%);
        pointer-events: none;
    }

    .menu-card::after {
        content: '';
        position: absolute; top: 0; left: 10%; right: 10%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(201, 168, 76, 0.2), transparent);
        opacity: 0;
        transition: opacity 0.4s;
    }

    .menu-card:hover {
        transform: translateY(-3px);
        border-color: rgba(201, 168, 76, 0.25);
        box-shadow:
            0 6px 30px rgba(0, 0, 0, 0.5),
            0 0 35px rgba(201, 168, 76, 0.04);
        background: linear-gradient(180deg, rgba(28, 20, 50, 0.9) 0%, rgba(14, 8, 30, 0.95) 100%);
    }

    .menu-card:hover::after { opacity: 1; }

    .menu-card:active {
        transform: translateY(-1px) scale(0.97);
    }

    /* Summon card - hero button */
    .menu-card.summon-card {
        background: linear-gradient(180deg, rgba(45, 30, 65, 0.9) 0%, rgba(20, 12, 40, 0.95) 100%);
        border-color: rgba(201, 168, 76, 0.25);
        box-shadow:
            0 0 30px rgba(201, 168, 76, 0.04),
            inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .menu-card.summon-card::after {
        opacity: 1;
        background: linear-gradient(90deg, transparent, rgba(240, 214, 120, 0.4), transparent);
    }

    .menu-card.summon-card:hover {
        border-color: rgba(201, 168, 76, 0.45);
        box-shadow:
            0 8px 40px rgba(0, 0, 0, 0.5),
            0 0 50px rgba(201, 168, 76, 0.08),
            inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .card-icon-wrap {
        width: 42px; height: 42px;
        display: flex; align-items: center; justify-content: center;
        position: relative;
    }

    .card-icon-wrap svg {
        width: 32px; height: 32px;
        transition: all 0.4s;
    }

    .menu-card:hover .card-icon-wrap svg {
        filter: drop-shadow(0 0 8px rgba(201, 168, 76, 0.3));
    }

    .card-label {
        font-family: Georgia, 'Palatino Linotype', serif;
        font-size: 0.88rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: rgba(232, 224, 240, 0.7);
        transition: color 0.4s;
    }

    .menu-card:hover .card-label {
        color: rgba(240, 214, 120, 0.9);
    }

    .menu-card.summon-card .card-label {
        color: rgba(212, 184, 92, 0.85);
    }

    .menu-card.summon-card:hover .card-label {
        color: rgba(240, 214, 120, 1);
    }

    /* === CORNER ORNAMENTS === */
    .corner-ornament {
        position: fixed; z-index: 5; pointer-events: none;
        opacity: 0.12;
    }

    .corner-ornament.tl { top: 16px; left: 16px; }
    .corner-ornament.tr { top: 16px; right: 16px; transform: scaleX(-1); }
    .corner-ornament.bl { bottom: 16px; left: 16px; transform: scaleY(-1); }
    .corner-ornament.br { bottom: 16px; right: 16px; transform: scale(-1, -1); }

    /* === FOOTER === */
    .footer-text {
        text-align: center;
        font-size: 0.65rem;
        color: rgba(138, 127, 160, 0.3);
        letter-spacing: 0.12em;
        padding-top: 0.8rem;
    }

    /* === RESPONSIVE === */
    @media (max-width: 640px) {
        .app-wrapper { padding: 0.8rem 1rem 1rem; }
        .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 0.7rem; }
        .orb-scene { width: 200px; height: 200px; }
        .magic-circle { width: 190px; height: 190px; }
        .rune-ring { width: 165px; height: 165px; }
        .inner-ring { width: 125px; height: 125px; }
        .orb-glow-outer { width: 100px; height: 100px; }
        .orb-glow-mid { width: 70px; height: 70px; }
        .orb-core { width: 44px; height: 44px; }
        .crosshair-h { width: 150px; }
        .crosshair-v { height: 150px; }
        .game-title { letter-spacing: 0.25em; }
        .corner-ornament { width: 40px; height: 40px; }
    }

    /* === TITLE ANIMATION === */
    .title-shimmer {
        position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
        animation: titleShimmer 6s ease-in-out infinite;
        pointer-events: none;
    }

    @keyframes titleShimmer {
        0%, 100% { left: -60%; }
        50% { left: 120%; }
    }

    /* === CARD ENTRANCE ANIMATION === */
    .menu-card {
        opacity: 0;
        animation: cardEntrance 0.6s ease-out forwards;
    }
    .menu-card:nth-child(1) { animation-delay: 0.1s; }
    .menu-card:nth-child(2) { animation-delay: 0.2s; }
    .menu-card:nth-child(3) { animation-delay: 0.3s; }
    .menu-card:nth-child(4) { animation-delay: 0.4s; }

    @keyframes cardEntrance {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .hero {
        opacity: 0;
        animation: heroEntrance 0.8s ease-out 0.05s forwards;
    }

    @keyframes heroEntrance {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .top-bar {
        opacity: 0;
        animation: topBarEntrance 0.5s ease-out 0.02s forwards;
    }

    @keyframes topBarEntrance {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="atmosphere"></div>
<div class="god-rays"></div>
<div class="vignette"></div>
<div class="fog-bottom"></div>
<div class="noise-overlay"></div>

<!-- Corner Ornaments -->
<svg class="corner-ornament tl" width="60" height="60" viewBox="0 0 60 60" fill="none">
    <path d="M0 0 L60 0 L60 3 L3 3 L3 60 L0 60 Z" fill="rgba(201,168,76,0.6)"/>
    <path d="M15 0 L15 1.5 L1.5 1.5 L1.5 15 L0 15 L0 0 Z" fill="rgba(201,168,76,0.35)"/>
    <circle cx="10" cy="10" r="1.5" fill="rgba(201,168,76,0.5)"/>
    <line x1="3" y1="30" x2="3" x2="45" stroke="rgba(201,168,76,0.15)" stroke-width="0.5"/>
    <line x1="30" y1="3" x2="45" y2="3" stroke="rgba(201,168,76,0.15)" stroke-width="0.5"/>
</svg>
<svg class="corner-ornament tr" width="60" height="60" viewBox="0 0 60 60" fill="none">
    <path d="M0 0 L60 0 L60 3 L3 3 L3 60 L0 60 Z" fill="rgba(201,168,76,0.6)"/>
    <path d="M15 0 L15 1.5 L1.5 1.5 L1.5 15 L0 15 L0 0 Z" fill="rgba(201,168,76,0.35)"/>
    <circle cx="10" cy="10" r="1.5" fill="rgba(201,168,76,0.5)"/>
    <line x1="3" y1="30" x2="3" x2="45" stroke="rgba(201,168,76,0.15)" stroke-width="0.5"/>
    <line x1="30" y1="3" x2="45" y2="3" stroke="rgba(201,168,76,0.15)" stroke-width="0.5"/>
</svg>
<svg class="corner-ornament bl" width="60" height="60" viewBox="0 0 60 60" fill="none">
    <path d="M0 0 L60 0 L60 3 L3 3 L3 60 L0 60 Z" fill="rgba(201,168,76,0.6)"/>
    <path d="M15 0 L15 1.5 L1.5 1.5 L1.5 15 L0 15 L0 0 Z" fill="rgba(201,168,76,0.35)"/>
    <circle cx="10" cy="10" r="1.5" fill="rgba(201,168,76,0.5)"/>
    <line x1="3" y1="30" x2="3" x2="45" stroke="rgba(201,168,76,0.15)" stroke-width="0.5"/>
    <line x1="30" y1="3" x2="45" y2="3" stroke="rgba(201,168,76,0.15)" stroke-width="0.5"/>
</svg>
<svg class="corner-ornament br" width="60" height="60" viewBox="0 0 60 60" fill="none">
    <path d="M0 0 L60 0 L60 3 L3 3 L3 60 L0 60 Z" fill="rgba(201,168,76,0.6)"/>
    <path d="M15 0 L15 1.5 L1.5 1.5 L1.5 15 L0 15 L0 0 Z" fill="rgba(201,168,76,0.35)"/>
    <circle cx="10" cy="10" r="1.5" fill="rgba(201,168,76,0.5)"/>
    <line x1="3" y1="30" x2="3" x2="45" stroke="rgba(201,168,76,0.15)" stroke-width="0.5"/>
    <line x1="30" y1="3" x2="45" y2="3" stroke="rgba(201,168,76,0.15)" stroke-width="0.5"/>
</svg>

<div class="app-wrapper">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="currency-display">
            <div class="coin-icon">
                <div class="coin-body">G</div>
            </div>
            <span class="currency-value">12,450</span>
        </div>

<script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W, H;
    let spirits = [];
    let time = 0;

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }

    class Spirit {
        constructor() {
            this.reset(true);
        }

        reset(initial) {
            this.x = Math.random() * W;
            this.y = initial ? Math.random() * H : H + 30;
            this.baseX = this.x;
            this.size = Math.random() * 2 + 0.5;
            this.speedY = -(Math.random() * 0.3 + 0.08);
            this.speedX = (Math.random() - 0.5) * 0.15;
            this.wobbleAmp = Math.random() * 25 + 8;
            this.wobbleSpeed = Math.random() * 0.004 + 0.001;
            this.wobbleOffset = Math.random() * Math.PI * 2;
            this.alpha = Math.random() * 0.3 + 0.05;
            this.alphaSpeed = Math.random() * 0.002 + 0.0005;
            this.alphaDir = Math.random() > 0.5 ? 1 : -1;
            // More varied hues - mostly blue-purple with some gold
            const r = Math.random();
            if (r > 0.75) {
                this.hue = 40 + Math.random() * 15; // gold
                this.sat = 50 + Math.random() * 20;
                this.light = 60 + Math.random() * 15;
            } else if (r > 0.4) {
                this.hue = 220 + Math.random() * 30; // blue-purple
                this.sat = 40 + Math.random() * 30;
                this.light = 55 + Math.random() * 20;
            } else {
                this.hue = 190 + Math.random() * 20; // cyan-blue
                this.sat = 50 + Math.random() * 30;
                this.light = 60 + Math.random() * 15;
            }
            this.life = 0;
        }

        update() {
            this.life++;
            this.y += this.speedY;
            this.x = this.baseX + Math.sin(this.life * this.wobbleSpeed + this.wobbleOffset) * this.wobbleAmp;
            this.baseX += this.speedX;

            this.alpha += this.alphaDir * this.alphaSpeed;
            if (this.alpha > 0.45) this.alphaDir = -1;
            if (this.alpha < 0.03) this.alphaDir = 1;

            if (this.y < -30 || this.x < -60 || this.x > W + 60) {
                this.reset(false);
            }
        }

        draw() {
            const glow = this.size * 5;
            const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glow);
            grad.addColorStop(0, `hsla(${this.hue}, ${this.sat}%, ${this.light}%, ${this.alpha})`);
            grad.addColorStop(0.4, `hsla(${this.hue}, ${this.sat}%, ${this.light}%, ${this.alpha * 0.3})`);
            grad.addColorStop(1, `hsla(${this.hue}, ${this.sat}%, ${this.light}%, 0)`);
            ctx.beginPath();
            ctx.arc(this.x, this.y, glow, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            // Core dot
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${this.hue}, ${this.sat}%, ${this.light + 20}%, ${this.alpha * 1.5})`;
            ctx.fill();
        }
    }

    function init() {
