<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden}
body{
  background:#030108;
  color:#c8bfe0;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  display:flex;align-items:center;justify-content:center;
}

canvas#bg{position:fixed;inset:0;z-index:0}

.atmosphere{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 55% 45% at 50% 42%,rgba(40,12,75,0.5) 0%,transparent 65%),
    radial-gradient(ellipse 70% 35% at 50% 55%,rgba(8,4,30,0.7) 0%,transparent 55%),
    radial-gradient(ellipse 35% 25% at 50% 38%,rgba(60,100,180,0.04) 0%,transparent 55%),
    radial-gradient(ellipse 100% 40% at 50% 100%,rgba(2,0,8,0.95) 0%,transparent 55%);
}

.vignette{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 20%,rgba(2,0,8,0.8) 100%);
}

.noise{
  position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0.02;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='6' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:256px 256px;
}

.god-rays{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0.04;
  background:conic-gradient(from 185deg at 50% 38%,transparent 0deg,rgba(200,180,100,0.6) 1deg,transparent 2.5deg,transparent 175deg,rgba(200,180,100,0.4) 176deg,transparent 178deg,transparent 355deg,rgba(200,180,100,0.6) 356deg,transparent 358deg);
  animation:raysRotate 200s linear infinite;
}
@keyframes raysRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.fog-layer{
  position:fixed;bottom:0;left:-20%;width:140%;height:35%;z-index:4;pointer-events:none;
  background:linear-gradient(to top,rgba(5,2,14,0.9) 0%,transparent 100%);
}

.app{
  position:relative;z-index:10;
  width:100%;max-width:900px;height:100vh;
  display:flex;flex-direction:column;
  padding:1.2rem 2rem 1.2rem;
  justify-content:space-between;
}

/* TOP BAR */
.top-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:0.3rem;
  opacity:0;animation:fadeDown 0.8s ease-out 0.15s forwards;
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}

.top-left{display:flex;align-items:center;gap:10px}

.settings-btn{
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all 0.3s;
  position:relative;overflow:hidden;
}
.settings-btn::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.04) 0%,transparent 70%);
  opacity:0;transition:opacity 0.3s;
}
.settings-btn:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.1)}
.settings-btn:hover::before{opacity:1}
.settings-btn svg{width:18px;height:18px;stroke:rgba(180,170,200,0.35);fill:none;stroke-width:1.5;transition:stroke 0.3s}
.settings-btn:hover svg{stroke:rgba(200,190,220,0.6)}

.currency-pill{
  display:flex;align-items:center;gap:10px;
  padding:7px 18px 7px 10px;
  background:linear-gradient(135deg,rgba(35,25,55,0.9),rgba(12,8,28,0.95));
  border:1px solid rgba(201,168,76,0.15);
  border-radius:22px;
  box-shadow:0 0 25px rgba(201,168,76,0.04),inset 0 1px 0 rgba(255,255,255,0.03),0 4px 15px rgba(0,0,0,0.3);
  position:relative;overflow:hidden;
}
.currency-pill::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.02),transparent);
  animation:shimmer 8s ease-in-out infinite;
}
@keyframes shimmer{0%,100%{left:-100%}50%{left:200%}}

.coin{
  width:24px;height:24px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 35% 30%,#f7e8b0,#d4a843 30%,#a07d35 65%,#5a4220);
  box-shadow:0 0 10px rgba(201,168,76,0.3),inset 0 -2px 4px rgba(0,0,0,0.35),inset 0 1px 2px rgba(255,255,255,0.25);
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-size:10px;font-weight:bold;color:#3a2a0a;
  text-shadow:0 1px 0 rgba(255,255,255,0.3);
  border:1px solid rgba(201,168,76,0.3);
}
.currency-amount{
  font-family:Georgia,serif;font-size:1rem;font-weight:700;
  color:#f0d678;letter-spacing:0.3px;
  text-shadow:0 0 15px rgba(201,168,76,0.25),0 1px 3px rgba(0,0,0,0.5);
}

/* HERO */
.hero{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;min-height:0;padding:0.1rem 0;
  opacity:0;animation:heroIn 1.1s ease-out 0.25s forwards;
}
@keyframes heroIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

.title-block{text-align:center;margin-bottom:0.5rem;position:relative;z-index:5}

.title-pre{
  font-size:0.55rem;letter-spacing:0.6em;text-transform:uppercase;
  color:rgba(130,170,220,0.35);margin-bottom:0.6rem;
  text-shadow:0 0 25px rgba(100,160,240,0.1);
  font-weight:400;
}

.game-title{
  font-family:Georgia,'Palatino Linotype','Book Antiqua',Palatino,serif;
  font-size:clamp(2.4rem,5.5vw,3.4rem);
  font-weight:400;letter-spacing:0.45em;text-transform:uppercase;
  background:linear-gradient(180deg,#f5e6a3 0%,#e8c86a 15%,#d4a843 35%,#b8943a 55%,#8a6e2f 80%,#5a4820 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 2px 30px rgba(201,168,76,0.12));
  line-height:1.1;position:relative;
}
.game-title .shimmer{
  position:absolute;top:0;left:-100%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);
  animation:titleShimmer 8s ease-in-out infinite;pointer-events:none;
  border-radius:2px;
}
@keyframes titleShimmer{0%,100%{left:-40%}50%{left:140%}}

.title-ornament{
  display:flex;align-items:center;justify-content:center;gap:16px;margin-top:0.8rem;
  position:relative;
}
.title-ornament .line{
  width:80px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,0.2),transparent);
}
.title-ornament .line.long{width:140px}
.title-ornament .gem{
  width:8px;height:8px;
  background:linear-gradient(135deg,rgba(240,214,120,0.7),rgba(201,168,76,0.4));
  transform:rotate(45deg);
  box-shadow:0 0 12px rgba(201,168,76,0.2);
  position:relative;
}
.title-ornament .gem::before{
  content:'';position:absolute;inset:2px;
  background:linear-gradient(135deg,rgba(255,240,180,0.5),rgba(201,168,76,0.3));
  transform:rotate(0deg);
}
.title-ornament .small-diamond{
  width:4px;height:4px;
  background:rgba(201,168,76,0.3);
  transform:rotate(45deg);
}

.subtitle{
  font-size:0.6rem;letter-spacing:0.65em;text-transform:uppercase;
  color:rgba(130,175,230,0.4);margin-top:0.9rem;
  text-shadow:0 0 20px rgba(100,160,240,0.08);
  font-weight:400;
}

/* ORB SCENE */
.orb-scene{
  position:relative;width:280px;height:280px;
  display:flex;align-items:center;justify-content:center;
  margin-top:0.5rem;
}

.summoning-circle{
  position:absolute;border-radius:50%;
  border:1px solid rgba(100,160,220,0.05);
}
.summoning-circle.r1{width:270px;height:270px;animation:spin 90s linear infinite}
.summoning-circle.r1::before{
  content:'';position:absolute;inset:-1px;border-radius:50%;
  border:1px solid transparent;border-top-color:rgba(100,160,220,0.1);border-right-color:rgba(100,160,220,0.06);
}
.summoning-circle.r1::after{
  content:'';position:absolute;inset:4px;border-radius:50%;
  border:1px dashed rgba(100,160,220,0.03);
}
.summoning-circle.r2{width:225px;height:225px;animation:spin 70s linear infinite reverse;border-style:dashed;border-color:rgba(100,160,220,0.035)}
.summoning-circle.r3{width:175px;height:175px;animation:spin 50s linear infinite;border-color:rgba(100,160,220,0.04)}

@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.rune-mark{
  position:absolute;width:3px;height:3px;border-radius:50%;
  background:rgba(100,180,240,0.3);
  box-shadow:0 0 8px rgba(100,180,240,0.15);
}
.rune-mark:nth-child(1){top:-1.5px;left:50%;margin-left:-1.5px}
.rune-mark:nth-child(2){bottom:-1.5px;left:50%;margin-left:-1.5px}
.rune-mark:nth-child(3){top:50%;left:-1.5px;margin-top:-1.5px}
.rune-mark:nth-child(4){top:50%;right:-1.5px;margin-top:-1.5px}
.rune-mark:nth-child(5){top:10%;right:10%}
.rune-mark:nth-child(6){bottom:10%;right:10%}
.rune-mark:nth-child(7){bottom:10%;left:10%}
.rune-mark:nth-child(8){top:10%;left:10%}

.cross-line{
  position:absolute;background:rgba(100,160,220,0.025);
}
.cross-line.h{width:200px;height:1px;top:50%;left:50%;transform:translate(-50%,-50%)}
.cross-line.v{width:1px;height:200px;top:50%;left:50%;transform:translate(-50%,-50%)}

.orb-glow{
  position:absolute;border-radius:50%;
}
.orb-glow.g1{
  width:150px;height:150px;
  background:radial-gradient(circle,rgba(90,180,255,0.08) 0%,rgba(60,140,220,0.02) 50%,transparent 70%);
  animation:pulse 6s ease-in-out infinite;
}
.orb-glow.g2{
  width:100px;height:100px;
  background:radial-gradient(circle,rgba(110,200,255,0.15) 0%,rgba(70,160,230,0.05) 50%,transparent 70%);
  animation:pulse 6s ease-in-out infinite 0.5s;
}
.orb-glow.g3{
  width:70px;height:70px;
  background:radial-gradient(circle,rgba(130,220,255,0.12) 0%,rgba(80,170,240,0.04) 60%,transparent 80%);
  animation:pulse 6s ease-in-out infinite 1s;
}
.orb-core{
  position:absolute;width:50px;height:50px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,
    rgba(230,248,255,0.9) 0%,
    rgba(140,215,255,0.65) 15%,
    rgba(80,175,240,0.35) 38%,
    rgba(40,115,200,0.12) 60%,transparent 100%);
  box-shadow:
    0 0 35px rgba(100,200,255,0.25),
    0 0 70px rgba(80,170,240,0.1),
    0 0 120px rgba(60,140,220,0.05),
    inset 0 0 15px rgba(255,255,255,0.1);
  animation:pulse 6s ease-in-out infinite;
}
.orb-core::after{
  content:'';position:absolute;top:8%;left:14%;
  width:40%;height:35%;border-radius:50%;
  background:rgba(255,255,255,0.5);filter:blur(4px);
}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:0.85}}

.sparkle{
  position:absolute;width:2.5px;height:2.5px;border-radius:50%;
  background:rgba(140,210,255,0.45);
  box-shadow:0 0 6px rgba(140,210,255,0.25);
  animation:sparkleFloat 5s ease-in-out infinite;
}
.sparkle:nth-child(1){top:16%;left:26%;animation-delay:0s}
.sparkle:nth-child(2){top:30%;right:16%;animation-delay:1.4s}
.sparkle:nth-child(3){bottom:20%;left:20%;animation-delay:2.8s}
.sparkle:nth-child(4){bottom:26%;right:26%;animation-delay:0.8s}
.sparkle:nth-child(5){top:10%;right:30%;animation-delay:2s;width:2px;height:2px}
.sparkle:nth-child(6){top:36%;left:10%;animation-delay:3.2s;width:2px;height:2px}
@keyframes sparkleFloat{0%,100%{transform:translateY(0) scale(1);opacity:0.25}50%{transform:translateY(-12px) scale(1.5);opacity:0.65}}

/* MENU */
.menu-area{
  padding-bottom:0.4rem;
  opacity:0;animation:menuIn 0.9s ease-out 0.55s forwards;
}
@keyframes menuIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}

.menu-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  gap:0.8rem;
}

.menu-card{
  position:relative;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
  padding:1.3rem 0.5rem;
  background:linear-gradient(180deg,rgba(20,14,38,0.7) 0%,rgba(8,5,22,0.85) 100%);
  border:1px solid rgba(201,168,76,0.06);
  border-radius:12px;
  cursor:pointer;
  transition:all 0.4s cubic-bezier(0.23,1,0.32,1);
  overflow:hidden;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.menu-card::before{
  content:'';position:absolute;inset:0;border-radius:12px;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,0.015) 0%,transparent 50%);
  pointer-events:none;
}
.menu-card::after{
  content:'';position:absolute;top:0;left:20%;right:20%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,0.12),transparent);
  opacity:0;transition:opacity 0.4s;
}
.menu-card:hover{
  transform:translateY(-3px);
  border-color:rgba(201,168,76,0.15);
  box-shadow:0 8px 30px rgba(0,0,0,0.4),0 0 35px rgba(201,168,76,0.02);
  background:linear-gradient(180deg,rgba(28,20,48,0.8) 0%,rgba(12,7,28,0.95) 100%);
}
.menu-card:hover::after{opacity:1}
.menu-card:active{transform:translateY(-1px) scale(0.97)}

.menu-card.summon{
  background:linear-gradient(180deg,rgba(48,30,68,0.8) 0%,rgba(20,12,42,0.95) 100%);
  border-color:rgba(201,168,76,0.15);
  box-shadow:0 0 30px rgba(201,168,76,0.02),inset 0 1px 0 rgba(255,255,255,0.02),0 4px 20px rgba(0,0,0,0.3);
}
.menu-card.summon::after{
  opacity:1;
  background:linear-gradient(90deg,transparent,rgba(240,214,120,0.3),transparent);
}
.menu-card.summon:hover{
  border-color:rgba(201,168,76,0.25);
  box-shadow:0 10px 40px rgba(0,0,0,0.45),0 0 50px rgba(201,168,76,0.05),inset 0 1px 0 rgba(255,255,255,0.04);
}

.card-icon{
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  position:relative;
}
.card-icon svg{width:26px;height:26px;transition:all 0.4s}
.menu-card:hover .card-icon svg{filter:drop-shadow(0 0 8px rgba(201,168,76,0.2))}

.card-label{
  font-family:Georgia,'Palatino Linotype',serif;
  font-size:0.82rem;font-weight:700;letter-spacing:0.06em;
  color:rgba(200,192,220,0.5);transition:color 0.4s;
}
.menu-card:hover .card-label{color:rgba(230,210,130,0.8)}
.menu-card.summon .card-label{color:rgba(200,175,85,0.7)}
.menu-card.summon:hover .card-label{color:rgba(240,214,120,0.9)}

/* CORNER ORNAMENTS */
.corner{position:fixed;z-index:5;pointer-events:none;opacity:0.08}
.corner svg{width:45px;height:45px}
.corner.tl{top:10px;left:10px}
.corner.tr{top:10px;right:10px;transform:scaleX(-1)}
.corner.bl{bottom:10px;left:10px;transform:scaleY(-1)}
.corner.br{bottom:10px;right:10px;transform:scale(-1)}

.footer{
  text-align:center;font-size:0.55rem;
  color:rgba(120,110,145,0.2);letter-spacing:0.15em;
  padding-top:0.5rem;
  opacity:0;animation:fadeUp 0.7s ease-out 0.9s forwards;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* RESPONSIVE */
@media(max-width:640px){
  .app{padding:0.7rem 0.9rem 0.9rem}
  .menu-grid{grid-template-columns:repeat(2,1fr);gap:0.6rem}
  .orb-scene{width:200px;height:200px}
  .summoning-circle.r1{width:190px;height:190px}
  .summoning-circle.r2{width:160px;height:160px}
  .summoning-circle.r3{width:125px;height:125px}
  .orb-glow.g1{width:110px;height:110px}
  .orb-glow.g2{width:78px;height:78px}
  .orb-glow.g3{width:55px;height:55px}
  .orb-core{width:38px;height:38px}
  .cross-line.h{width:140px}
  .cross-line.v{height:140px}
  .game-title{letter-spacing:0.3em}
  .corner svg{width:30px;height:30px}
  .title-ornament .line{width:55px}
  .title-ornament .line.long{width:90px}
}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="atmosphere"></div>
<div class="god-rays"></div>
<div class="vignette"></div>
<div class="fog-layer"></div>
<div class="noise"></div>

<!-- Corners -->
<div class="corner tl"><svg viewBox="0 0 50 50" fill="none"><path d="M0 0H50V2H2.5V50H0Z" fill="rgba(201,168,76,0.8)"/><path d="M14 0H15.5V1.5H1.5V14H0V0Z" fill="rgba(201,168,76,0.3)"/><circle cx="10" cy="10" r="1.5" fill="rgba(201,168,76,0.4)"/><line x1="2.5" y1="28" x2="2.5" y2="44" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/><line x1="28" y1="2.5" x2="44" y2="2.5" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/></svg></div>
<div class="corner tr"><svg viewBox="0 0 50 50" fill="none"><path d="M0 0H50V2H2.5V50H0Z" fill="rgba(201,168,76,0.8)"/><path d="M14 0H15.5V1.5H1.5V14H0V0Z" fill="rgba(201,168,76,0.3)"/><circle cx="10" cy="10" r="1.5" fill="rgba(201,168,76,0.4)"/><line x1="2.5" y1="28" x2="2.5" y2="44" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/><line x1="28" y1="2.5" x2="44" y2="2.5" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/></svg></div>
<div class="corner bl"><svg viewBox="0 0 50 50" fill="none"><path d="M0 0H50V2H2.5V50H0Z" fill="rgba(201,168,76,0.8)"/><path d="M14 0H15.5V1.5H1.5V14H0V0Z" fill="rgba(201,168,76,0.3)"/><circle cx="10" cy="10" r="1.5" fill="rgba(201,168,76,0.4)"/><line x1="2.5" y1="28" x2="2.5" y2="44" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/><line x1="28" y1="2.5" x2="44" y2="2.5" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/></svg></div>
<div class="corner br"><svg viewBox="0 0 50 50" fill="none"><path d="M0 0H50V2H2.5V50H0Z" fill="rgba(201,168,76,0.8)"/><path d="M14 0H15.5V1.5H1.5V14H0V0Z" fill="rgba(201,168,76,0.3)"/><circle cx="10" cy="10" r="1.5" fill="rgba(201,168,76,0.4)"/><line x1="2.5" y1="28" x2="2.5" y2="44" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/><line x1="28" y1="2.5" x2="44" y2="2.5" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/></svg></div>

<div class="app">
  <div class="top-bar">
    <div class="top-left">
      <div class="settings-btn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>
      </div>
    </div>
    <div class="currency-pill">
      <div class="coin">G</div>
      <span class="currency-amount">12,450</span>
    </div>
  </div>

  <div class="hero">
    <div class="title-block">
      <p class="title-pre">Spirit Summoning</p>
      <h1 class="game-title">
        Aetherbound
        <span class="shimmer"></span>
      </h1>
      <div class="title-ornament">
        <div class="line"></div>
        <div class="small-diamond"></div>
        <div class="gem"></div>
        <div class="small-diamond"></div>
        <div class="line"></div>
      </div>

<script>
const canvas=document.getElementById('bg');
const ctx=canvas.getContext('2d');
let W,H;
const spirits=[];

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
window.addEventListener('resize',resize);
resize();

class Spirit{
  constructor(){this.reset(true)}
  reset(init){
    this.x=Math.random()*W;
    this.y=init?Math.random()*H:H+50;
    this.bx=this.x;
    this.sz=Math.random()*2+0.3;
    this.vy=-(Math.random()*0.2+0.05);
    this.vx=(Math.random()-0.5)*0.1;
    this.wA=Math.random()*25+8;
    this.wS=Math.random()*0.002+0.0006;
    this.wO=Math.random()*Math.PI*2;
    this.a=Math.random()*0.2+0.03;
    this.aS=Math.random()*0.001+0.0003;
    this.aD=Math.random()>0.5?1:-1;
    const r=Math.random();
    if(r>0.75){this.h=40+Math.random()*15;this.s=40+Math.random()*25;this.l=55+Math.random()*18}
    else if(r>0.45){this.h=220+Math.random()*30;this.s=30+Math.random()*35;this.l=48+Math.random()*22}
    else{this.h=190+Math.random()*20;this.s=40+Math.random()*35;this.l=55+Math.random()*18}
    this.t=0;
  }
  update(){
    this.t++;
    this.y+=this.vy;
    this.x=this.bx+Math.sin(this.t*this.wS+this.wO)*this.wA;
    this.bx+=this.vx;
    this.a+=this.aD*this.aS;
    if(this.a>0.35)this.aD=-1;
    if(this.a<0.015)this.aD=1;
    if(this.y<-50||this.x<-100||this.x>W+100)this.reset(false);
  }
  draw(){
    const g=this.sz*7;
    const grad=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,g);
    grad.addColorStop(0,`hsla(${this.h},${this.s}%,${this.l}%,${this.a})`);
    grad.addColorStop(0.3,`hsla(${this.h},${this.s}%,${this.l}%,${this.a*0.3})`);
    grad.addColorStop(1,`hsla(${this.h},${this.s}%,${this.l}%,0)`);
    ctx.beginPath();ctx.arc(this.x,this.y,g,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
    ctx.beginPath();ctx.arc(this.x,this.y,this.sz*0.4,0,Math.PI*2);
    ctx.fillStyle=`hsla(${this.h},${this.s}%,${this.l+20}%,${this.a*1.3})`;ctx.fill();
  }
}

for(let i=0;i<65;i++)spirits.push(new Spirit());

function drawAmbient(){
  const cx=W/2,cy=H*0.38;
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*0.32);
  grad.addColorStop(0,'rgba(55,25,85,0.06)');
  grad.addColorStop(0.4,'rgba(25,12,50,0.02)');
  grad.addColorStop(1,'transparent');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawAmbient();
  spirits.forEach(s=>{s.update();s.draw()});
  requestAnimationFrame(loop);
}
loop();

function cardClick(el){
  el.style.transform='translateY(-1px) scale(0.95)';
  setTimeout(()=>{el.style.transform=''},180);
}
</script>
