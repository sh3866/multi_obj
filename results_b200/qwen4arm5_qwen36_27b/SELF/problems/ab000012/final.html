<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden}
body{
  background:#05020d;
  color:#c8bfe0;
  font-family:system-ui,-apple-system,sans-serif;
  display:flex;align-items:center;justify-content:center;
}

canvas#bg{position:fixed;inset:0;z-index:0}

.atmosphere{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 50% 35%,rgba(50,15,90,0.4) 0%,transparent 60%),
    radial-gradient(ellipse 80% 40% at 50% 60%,rgba(8,3,30,0.6) 0%,transparent 50%),
    radial-gradient(ellipse 30% 30% at 50% 30%,rgba(100,60,180,0.06) 0%,transparent 50%),
    radial-gradient(ellipse 100% 50% at 50% 100%,rgba(3,0,10,0.95) 0%,transparent 50%);
}

.vignette{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 35%,transparent 15%,rgba(3,0,10,0.85) 100%);
}

.noise{
  position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0.018;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='6' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:256px 256px;
}

.god-rays{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0.035;
  background:conic-gradient(from 185deg at 50% 35%,transparent 0deg,rgba(200,180,100,0.5) 0.8deg,transparent 2deg,transparent 170deg,rgba(200,180,100,0.3) 171deg,transparent 173deg,transparent 350deg,rgba(200,180,100,0.5) 351deg,transparent 353deg);
  animation:raysRotate 240s linear infinite;
}
@keyframes raysRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.fog-layer{
  position:fixed;bottom:0;left:-10%;width:120%;height:30%;z-index:4;pointer-events:none;
  background:linear-gradient(to top,rgba(5,2,14,0.95) 0%,transparent 100%);
}

.app{
  position:relative;z-index:10;
  width:100%;max-width:860px;height:100vh;
  display:flex;flex-direction:column;
  padding:1rem 1.5rem 1rem;
  justify-content:space-between;
}

.top-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:0.2rem;
  opacity:0;animation:fadeDown 0.9s ease-out 0.1s forwards;
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}

.top-left{display:flex;align-items:center;gap:10px}

.settings-btn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all 0.3s;position:relative;overflow:hidden;
}
.settings-btn:hover{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.12)}
.settings-btn svg{width:16px;height:16px;stroke:rgba(180,170,200,0.3);fill:none;stroke-width:1.5;transition:stroke 0.3s}
.settings-btn:hover svg{stroke:rgba(200,190,220,0.55)}

.currency-pill{
  display:flex;align-items:center;gap:10px;
  padding:6px 16px 6px 8px;
  background:linear-gradient(135deg,rgba(40,28,58,0.85),rgba(15,10,30,0.9));
  border:1px solid rgba(201,168,76,0.12);
  border-radius:20px;
  box-shadow:0 0 20px rgba(201,168,76,0.03),inset 0 1px 0 rgba(255,255,255,0.03),0 4px 12px rgba(0,0,0,0.3);
  position:relative;overflow:hidden;
}
.currency-pill::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.02),transparent);
  animation:shimmer 8s ease-in-out infinite;
}
@keyframes shimmer{0%,100%{left:-100%}50%{left:200%}}

.coin{
  width:22px;height:22px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 35% 30%,#f7e8b0,#d4a843 30%,#a07d35 65%,#5a4220);
  box-shadow:0 0 8px rgba(201,168,76,0.25),inset 0 -2px 3px rgba(0,0,0,0.35),inset 0 1px 2px rgba(255,255,255,0.25);
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-size:9px;font-weight:bold;color:#3a2a0a;
  text-shadow:0 1px 0 rgba(255,255,255,0.3);
  border:1px solid rgba(201,168,76,0.25);
}
.currency-amount{
  font-family:Georgia,serif;font-size:0.95rem;font-weight:700;
  color:#f0d678;letter-spacing:0.2px;
  text-shadow:0 0 12px rgba(201,168,76,0.2),0 1px 3px rgba(0,0,0,0.5);
}

.hero{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;min-height:0;padding:0 0 0.5rem;
  opacity:0;animation:heroIn 1.2s ease-out 0.2s forwards;
}
@keyframes heroIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

.title-block{text-align:center;margin-bottom:0.3rem;position:relative;z-index:5}

.title-pre{
  font-size:0.5rem;letter-spacing:0.7em;text-transform:uppercase;
  color:rgba(130,170,220,0.3);margin-bottom:0.5rem;
  text-shadow:0 0 20px rgba(100,160,240,0.08);
  font-weight:400;
}

.game-title{
  font-family:Georgia,'Palatino Linotype','Book Antiqua',Palatino,serif;
  font-size:clamp(2.2rem,5.2vw,3.2rem);
  font-weight:400;letter-spacing:0.55em;text-transform:uppercase;
  background:linear-gradient(180deg,#f5e6a3 0%,#e8c86a 12%,#d4a843 30%,#b8943a 50%,#8a6e2f 75%,#5a4820 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 2px 25px rgba(201,168,76,0.1));
  line-height:1.1;position:relative;
}
.game-title .shimmer{
  position:absolute;top:0;left:-100%;width:35%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.05),transparent);
  animation:titleShimmer 8s ease-in-out infinite;pointer-events:none;
}
@keyframes titleShimmer{0%,100%{left:-35%}50%{left:135%}}

.title-ornament{
  display:flex;align-items:center;justify-content:center;gap:14px;margin-top:0.7rem;
  position:relative;
}
.title-ornament .line{
  width:70px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,0.15),transparent);
}
.title-ornament .line.long{width:120px}
.title-ornament .gem{
  width:7px;height:7px;
  background:linear-gradient(135deg,rgba(240,214,120,0.6),rgba(201,168,76,0.35));
  transform:rotate(45deg);
  box-shadow:0 0 10px rgba(201,168,76,0.15);
  position:relative;
}
.title-ornament .gem::before{
  content:'';position:absolute;inset:2px;
  background:linear-gradient(135deg,rgba(255,240,180,0.4),rgba(201,168,76,0.25));
}
.title-ornament .small-diamond{
  width:3px;height:3px;
  background:rgba(201,168,76,0.25);
  transform:rotate(45deg);
}

.subtitle{
  font-size:0.55rem;letter-spacing:0.6em;text-transform:uppercase;
  color:rgba(130,175,230,0.35);margin-top:0.7rem;
  text-shadow:0 0 15px rgba(100,160,240,0.06);
  font-weight:400;
}

.orb-scene{
  position:relative;width:260px;height:260px;
  display:flex;align-items:center;justify-content:center;
  margin-top:0.3rem;
}

.summoning-circle{
  position:absolute;border-radius:50%;
  border:1px solid rgba(100,160,220,0.04);
}
.summoning-circle.r1{width:250px;height:250px;animation:spin 100s linear infinite}
.summoning-circle.r1::before{
  content:'';position:absolute;inset:-1px;border-radius:50%;
  border:1px solid transparent;border-top-color:rgba(100,160,220,0.08);border-right-color:rgba(100,160,220,0.04);
}
.summoning-circle.r1::after{
  content:'';position:absolute;inset:5px;border-radius:50%;
  border:1px dashed rgba(100,160,220,0.025);
}
.summoning-circle.r2{width:205px;height:205px;animation:spin 80s linear infinite reverse;border-style:dashed;border-color:rgba(100,160,220,0.03)}
.summoning-circle.r3{width:155px;height:155px;animation:spin 60s linear infinite;border-color:rgba(100,160,220,0.035)}

@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.rune-mark{
  position:absolute;width:2.5px;height:2.5px;border-radius:50%;
  background:rgba(100,180,240,0.25);
  box-shadow:0 0 6px rgba(100,180,240,0.12);
}
.rune-mark:nth-child(1){top:-1.25px;left:50%;margin-left:-1.25px}
.rune-mark:nth-child(2){bottom:-1.25px;left:50%;margin-left:-1.25px}
.rune-mark:nth-child(3){top:50%;left:-1.25px;margin-top:-1.25px}
.rune-mark:nth-child(4){top:50%;right:-1.25px;margin-top:-1.25px}
.rune-mark:nth-child(5){top:8%;right:8%}
.rune-mark:nth-child(6){bottom:8%;right:8%}
.rune-mark:nth-child(7){bottom:8%;left:8%}
.rune-mark:nth-child(8){top:8%;left:8%}

.cross-line{
  position:absolute;background:rgba(100,160,220,0.02);
}
.cross-line.h{width:180px;height:1px;top:50%;left:50%;transform:translate(-50%,-50%)}
.cross-line.v{width:1px;height:180px;top:50%;left:50%;transform:translate(-50%,-50%)}

.orb-glow{
  position:absolute;border-radius:50%;
}
.orb-glow.g1{
  width:140px;height:140px;
  background:radial-gradient(circle,rgba(90,180,255,0.07) 0%,rgba(60,140,220,0.02) 50%,transparent 70%);
  animation:pulse 6s ease-in-out infinite;
}
.orb-glow.g2{
  width:95px;height:95px;
  background:radial-gradient(circle,rgba(110,200,255,0.12) 0%,rgba(70,160,230,0.04) 50%,transparent 70%);
  animation:pulse 6s ease-in-out infinite 0.5s;
}
.orb-glow.g3{
  width:65px;height:65px;
  background:radial-gradient(circle,rgba(130,220,255,0.1) 0%,rgba(80,170,240,0.03) 60%,transparent 80%);
  animation:pulse 6s ease-in-out infinite 1s;
}
.orb-core{
  position:absolute;width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,
    rgba(230,248,255,0.85) 0%,
    rgba(140,215,255,0.6) 15%,
    rgba(80,175,240,0.3) 38%,
    rgba(40,115,200,0.1) 60%,transparent 100%);
  box-shadow:
    0 0 30px rgba(100,200,255,0.2),
    0 0 60px rgba(80,170,240,0.08),
    0 0 100px rgba(60,140,220,0.04),
    inset 0 0 12px rgba(255,255,255,0.08);
  animation:pulse 6s ease-in-out infinite;
}
.orb-core::after{
  content:'';position:absolute;top:8%;left:14%;
  width:40%;height:35%;border-radius:50%;
  background:rgba(255,255,255,0.45);filter:blur(3px);
}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:0.85}}

.sparkle{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:rgba(140,210,255,0.4);
  box-shadow:0 0 5px rgba(140,210,255,0.2);
  animation:sparkleFloat 5s ease-in-out infinite;
}
.sparkle:nth-child(1){top:14%;left:24%;animation-delay:0s}
.sparkle:nth-child(2){top:28%;right:14%;animation-delay:1.4s}
.sparkle:nth-child(3){bottom:18%;left:18%;animation-delay:2.8s}
.sparkle:nth-child(4){bottom:24%;right:24%;animation-delay:0.8s}
.sparkle:nth-child(5){top:8%;right:28%;animation-delay:2s;width:1.5px;height:1.5px}
.sparkle:nth-child(6){top:34%;left:8%;animation-delay:3.2s;width:1.5px;height:1.5px}
@keyframes sparkleFloat{0%,100%{transform:translateY(0) scale(1);opacity:0.2}50%{transform:translateY(-10px) scale(1.4);opacity:0.55}}

.menu-area{
  padding-bottom:0.3rem;
  opacity:0;animation:menuIn 1s ease-out 0.5s forwards;
}
@keyframes menuIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.menu-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  gap:0.7rem;
}

.menu-card{
  position:relative;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;
  padding:1.1rem 0.4rem;
  background:linear-gradient(180deg,rgba(22,15,40,0.65) 0%,rgba(10,6,24,0.8) 100%);
  border:1px solid rgba(201,168,76,0.05);
  border-radius:10px;
  cursor:pointer;
  transition:all 0.4s cubic-bezier(0.23,1,0.32,1);
  overflow:hidden;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.menu-card::before{
  content:'';position:absolute;inset:0;border-radius:10px;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,0.012) 0%,transparent 50%);
  pointer-events:none;
}
.menu-card::after{
  content:'';position:absolute;top:0;left:25%;right:25%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,0.1),transparent);
  opacity:0;transition:opacity 0.4s;
}
.menu-card:hover{
  transform:translateY(-2px);
  border-color:rgba(201,168,76,0.12);
  box-shadow:0 6px 25px rgba(0,0,0,0.35),0 0 30px rgba(201,168,76,0.015);
  background:linear-gradient(180deg,rgba(30,22,50,0.75) 0%,rgba(14,8,30,0.9) 100%);
}
.menu-card:hover::after{opacity:1}
.menu-card:active{transform:translateY(-1px) scale(0.97)}

.menu-card.summon{
  background:linear-gradient(180deg,rgba(50,32,70,0.75) 0%,rgba(22,14,44,0.9) 100%);
  border-color:rgba(201,168,76,0.12);
  box-shadow:0 0 25px rgba(201,168,76,0.015),inset 0 1px 0 rgba(255,255,255,0.015),0 4px 15px rgba(0,0,0,0.25);
}
.menu-card.summon::after{
  opacity:1;
  background:linear-gradient(90deg,transparent,rgba(240,214,120,0.25),transparent);
}
.menu-card.summon:hover{
  border-color:rgba(201,168,76,0.22);
  box-shadow:0 8px 35px rgba(0,0,0,0.4),0 0 45px rgba(201,168,76,0.04),inset 0 1px 0 rgba(255,255,255,0.03);
}

.card-icon{
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  position:relative;
}
.card-icon svg{width:24px;height:24px;transition:all 0.4s}
.menu-card:hover .card-icon svg{filter:drop-shadow(0 0 6px rgba(201,168,76,0.15))}

.card-label{
  font-family:Georgia,'Palatino Linotype',serif;
  font-size:0.78rem;font-weight:700;letter-spacing:0.05em;
  color:rgba(200,192,220,0.45);transition:color 0.4s;
}
.menu-card:hover .card-label{color:rgba(230,210,130,0.75)}
.menu-card.summon .card-label{color:rgba(200,175,85,0.65)}
.menu-card.summon:hover .card-label{color:rgba(240,214,120,0.85)}

.corner{position:fixed;z-index:5;pointer-events:none;opacity:0.06}
.corner svg{width:40px;height:40px}
.corner.tl{top:8px;left:8px}
.corner.tr{top:8px;right:8px;transform:scaleX(-1)}
.corner.bl{bottom:8px;left:8px;transform:scaleY(-1)}
.corner.br{bottom:8px;right:8px;transform:scale(-1)}

.footer{
  text-align:center;font-size:0.5rem;
  color:rgba(120,110,145,0.18);letter-spacing:0.12em;
  padding-top:0.4rem;
  opacity:0;animation:fadeUp 0.7s ease-out 0.85s forwards;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:640px){
  .app{padding:0.6rem 0.8rem 0.8rem}
  .menu-grid{grid-template-columns:repeat(2,1fr);gap:0.55rem}
  .orb-scene{width:190px;height:190px}
  .summoning-circle.r1{width:180px;height:180px}
  .summoning-circle.r2{width:150px;height:150px}
  .summoning-circle.r3{width:118px;height:118px}
  .orb-glow.g1{width:105px;height:105px}
  .orb-glow.g2{width:74px;height:74px}
  .orb-glow.g3{width:52px;height:52px}
  .orb-core{width:36px;height:36px}
  .cross-line.h{width:130px}
  .cross-line.v{height:130px}
  .game-title{letter-spacing:0.28em}
  .corner svg{width:28px;height:28px}
  .title-ornament .line{width:50px}
  .title-ornament .line.long{width:85px}
}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="atmosphere"></div>
<div class="god-rays"></div>
<div class="vignette"></div>
<div class="fog-layer"></div>
<div class="noise"></div>

<div class="corner tl"><svg viewBox="0 0 50 50" fill="none"><path d="M0 0H50V2H2.5V50H0Z" fill="rgba(201,168,76,0.8)"/><path d="M14 0H15.5V1.5H1.5V14H0V0Z" fill="rgba(201,168,76,0.3)"/><circle cx="10" cy="10" r="1.5" fill="rgba(201,168,76,0.4)"/><line x1="2.5" y1="28" x2="2.5" y2="44" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/><line x1="28" y1="2.5" x2="44" y2="2.5" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/></svg></div>
<div class="corner tr"><svg viewBox="0 0 50 50" fill="none"><path d="M0 0H50V2H2.5V50H0Z" fill="rgba(201,168,76,0.8)"/><path d="M14 0H15.5V1.5H1.5V14H0V0Z" fill="rgba(201,168,76,0.3)"/><circle cx="10" cy="10" r="1.5" fill="rgba(201,168,76,0.4)"/><line x1="2.5" y1="28" x2="2.5" y2="44" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/><line x1="28" y1="2.5" x2="44" y2="2.5" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/></svg></div>
<div class="corner bl"><svg viewBox="0 0 50 50" fill="none"><path d="M0 0H50V2H2.5V50H0Z" fill="rgba(201,168,76,0.8)"/><path d="M14 0H15.5V1.5H1.5V14H0V0Z" fill="rgba(201,168,76,0.3)"/><circle cx="10" cy="10" r="1.5" fill="rgba(201,168,76,0.4)"/><line x1="2.5" y1="28" x2="2.5" y2="44" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/><line x1="28" y1="2.5" x2="44" y2="2.5" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/></svg></div>
<div class="corner br"><svg viewBox="0 0 50 50" fill="none"><path d="M0 0H50V2H2.5V50H0Z" fill="rgba(201,168,76,0.8)"/><path d="M14 0H15.5V1.5H1.5V14H0V0Z" fill="rgba(201,168,76,0.3)"/><circle cx="10" cy="10" r="1.5" fill="rgba(201,168,76,0.4)"/><line x1="2.5" y1="28" x2="2.5" y2="44" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/><line x1="28" y1="2.5" x2="44" y2="2.5" stroke="rgba(201,168,76,0.1)" stroke-width="0.5"/></svg></div>

<div class="app">
  <div class="top-bar">
    <div class="top-left">
      <div class="settings-btn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>
      </div>
    </div>
    <div class="currency-pill">
      <div class="coin">G</div>
      <span class="currency-amount">12,450</span>
    </div>
  </div>

  <div class="hero">
    <div class="title-block">
      <p class="title-pre">Spirit Summoning</p>
      <h1 class="game-title">
        Aetherbound
        <span class="shimmer"></span>
      </h1>
      <div class="title-ornament">
        <div class="line"></div>
        <div class="small-diamond"></div>
        <div class="gem"></div>
        <div class="small-diamond"></div>
        <div class="line"></div>
      </div>
    </div>

    <div class="orb-scene">
      <div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div>
      <div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div>
      <div class="cross-line h"></div><div class="cross-line v"></div>
      <div class="summoning-circle r1">
        <div class="rune-mark"></div><div class="rune-mark"></div><div class="rune-mark"></div><div class="rune-mark"></div>

<script>
const canvas=document.getElementById('bg');
const ctx=canvas.getContext('2d');
let W,H;
const spirits=[];

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
window.addEventListener('resize',resize);
resize();

class Spirit{
  constructor(){this.reset(true)}
  reset(init){
    this.x=Math.random()*W;
    this.y=init?Math.random()*H:H+40;
    this.bx=this.x;
    this.sz=Math.random()*1.8+0.2;
    this.vy=-(Math.random()*0.18+0.04);
    this.vx=(Math.random()-0.5)*0.08;
    this.wA=Math.random()*20+6;
    this.wS=Math.random()*0.0018+0.0005;
    this.wO=Math.random()*Math.PI*2;
    this.a=Math.random()*0.18+0.02;
    this.aS=Math.random()*0.0008+0.0002;
    this.aD=Math.random()>0.5?1:-1;
    const r=Math.random();
    if(r>0.7){this.h=40+Math.random()*12;this.s=35+Math.random()*20;this.l=50+Math.random()*15}
    else if(r>0.4){this.h=220+Math.random()*25;this.s=25+Math.random()*30;this.l=45+Math.random()*18}
    else{this.h=190+Math.random()*18;this.s=35+Math.random()*30;this.l=50+Math.random()*15}
    this.t=0;
  }
  update(){
    this.t++;
    this.y+=this.vy;
    this.x=this.bx+Math.sin(this.t*this.wS+this.wO)*this.wA;
    this.bx+=this.vx;
    this.a+=this.aD*this.aS;
    if(this.a>0.3)this.aD=-1;
    if(this.a<0.01)this.aD=1;
    if(this.y<-40||this.x<-80||this.x>W+80)this.reset(false);
  }
  draw(){
    const g=this.sz*6;
    const grad=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,g);
    grad.addColorStop(0,`hsla(${this.h},${this.s}%,${this.l}%,${this.a})`);
    grad.addColorStop(0.3,`hsla(${this.h},${this.s}%,${this.l}%,${this.a*0.25})`);
    grad.addColorStop(1,`hsla(${this.h},${this.s}%,${this.l}%,0)`);
    ctx.beginPath();ctx.arc(this.x,this.y,g,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
    ctx.beginPath();ctx.arc(this.x,this.y,this.sz*0.35,0,Math.PI*2);
    ctx.fillStyle=`hsla(${this.h},${this.s}%,${this.l+18}%,${this.a*1.2})`;ctx.fill();
  }
}

for(let i=0;i<55;i++)spirits.push(new Spirit());

function drawAmbient(){
  const cx=W/2,cy=H*0.35;
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*0.28);
  grad.addColorStop(0,'rgba(50,22,80,0.05)');
  grad.addColorStop(0.4,'rgba(22,10,45,0.015)');
  grad.addColorStop(1,'transparent');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawAmbient();
  spirits.forEach(s=>{s.update();s.draw()});
  requestAnimationFrame(loop);
}
loop();

function cardClick(el){
  el.style.transform='translateY(-1px) scale(0.95)';
  setTimeout(()=>{el.style.transform=''},150);
}
</script>
