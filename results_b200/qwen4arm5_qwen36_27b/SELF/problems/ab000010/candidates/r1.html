<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway Sphere</title>
<style>
  :root {
    --bg-deep: #020108;
    --bg-mid: #0a0a1a;
    --panel-bg: rgba(12, 12, 28, 0.75);
    --panel-border: rgba(255, 255, 255, 0.06);
    --panel-highlight: rgba(255, 255, 255, 0.03);
    --text-primary: #f0f0f5;
    --text-secondary: rgba(200, 205, 230, 0.6);
    --text-dim: rgba(150, 155, 180, 0.35);
    --accent-cyan: #00e5ff;
    --accent-purple: #b388ff;
    --accent-amber: #ffab40;
    --accent-rose: #ff5252;
    --glow-cyan: rgba(0, 229, 255, 0.15);
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "SF Mono", "Fira Code", "Fira Mono", "Roboto Mono", "Courier New", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--font-sans);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  #canvas-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  #ui-layer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
  }

  /* ── Header ── */
  .header {
    position: absolute;
    top: 2.5rem;
    left: 2.5rem;
    pointer-events: auto;
  }
  .header h1 {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 0.35rem;
  }
  .header .brand {
    font-size: 1.6rem;
    font-weight: 200;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    line-height: 1.1;
  }
  .header .brand span {
    font-weight: 600;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── Panel ── */
  .panel {
    position: absolute;
    top: 2.5rem;
    right: 2.5rem;
    width: 260px;
    pointer-events: auto;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 1.5rem;
    backdrop-filter: blur(24px) saturate(1.2);
    -webkit-backdrop-filter: blur(24px) saturate(1.2);
    box-shadow:
      0 4px 40px rgba(0,0,0,0.4),
      0 0 0 1px rgba(255,255,255,0.02) inset;
  }

  .panel-section {
    margin-bottom: 1.25rem;
  }
  .panel-section:last-child { margin-bottom: 0; }

  .section-label {
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 0.75rem;
  }

  /* Stats */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  .stat-card {
    background: var(--panel-highlight);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 0.7rem 0.8rem;
  }
  .stat-card .stat-label {
    font-size: 0.55rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 0.3rem;
  }
  .stat-card .stat-value {
    font-family: var(--font-mono);
    font-size: 1.15rem;
    font-weight: 400;
    color: var(--text-primary);
    letter-spacing: -0.02em;
  }
  .stat-card.accent .stat-value {
    color: var(--accent-cyan);
  }

  /* Slider */
  .slider-container {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .slider-container .slider-label {
    font-size: 0.65rem;
    color: var(--text-secondary);
    white-space: nowrap;
    min-width: 32px;
  }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--text-primary);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(255,255,255,0.2);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.25);
    box-shadow: 0 0 14px rgba(255,255,255,0.35);
  }
  input[type=range]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--text-primary);
    cursor: pointer;
    border: none;
    box-shadow: 0 0 8px rgba(255,255,255,0.2);
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
  }
  button {
    font-family: var(--font-sans);
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: none;
    border-radius: 8px;
    padding: 0.65rem 1rem;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    outline: none;
    flex: 1;
  }
  button.btn-primary {
    background: linear-gradient(135deg, var(--accent-cyan), #00b8d4);
    color: #000;
    box-shadow: 0 2px 16px rgba(0, 229, 255, 0.25);
  }
  button.btn-primary:hover {
    box-shadow: 0 4px 24px rgba(0, 229, 255, 0.4);
    transform: translateY(-1px);
  }
  button.btn-primary:active {
    transform: translateY(0);
  }
  button.btn-secondary {
    background: rgba(255,255,255,0.04);
    color: var(--text-secondary);
    border: 1px solid var(--panel-border);
  }
  button.btn-secondary:hover {
    background: rgba(255,255,255,0.08);
    color: var(--text-primary);
    border-color: rgba(255,255,255,0.12);
  }
  button.btn-danger {
    background: rgba(255, 82, 82, 0.1);
    color: var(--accent-rose);
    border: 1px solid rgba(255, 82, 82, 0.2);
  }
  button.btn-danger:hover {
    background: rgba(255, 82, 82, 0.2);
    border-color: rgba(255, 82, 82, 0.4);
  }
  button.btn-full {
    width: 100%;
  }

  /* ── Footer ── */
  .footer {
    position: absolute;
    bottom: 2rem;
    left: 2.5rem;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .footer::before {
    content: '';
    display: block;
    width: 16px;
    height: 1px;
    background: var(--text-dim);
  }

  /* ── Population Bar ── */
  .pop-bar-track {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    margin-top: 0.5rem;
    overflow: hidden;
  }
  .pop-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
    transition: width 0.3s ease;
  }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .header { top: 1.5rem; left: 1.5rem; }
    .panel { top: auto; bottom: 1.5rem; right: 1.5rem; left: 1.5rem; width: auto; }
    .footer { display: none; }
  }
</style>
</head>
<body>

<div id="canvas-container">
  <canvas id="sphereCanvas"></canvas>
</div>

<div id="ui-layer">
  <div class="header">
    <h1>Conway's Game of Life</h1>
    <div class="brand">Spherical <span>Life</span></div>
  </div>

  <div class="panel">
    <div class="panel-section">
      <div class="section-label">Simulation Stats</div>
      <div class="stat-grid">
        <div class="stat-card accent">
          <div class="stat-label">Generation</div>
          <div class="stat-value" id="gen-count">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Population</div>
          <div class="stat-value" id="pop-count">0</div>
        </div>
      </div>
      <div class="pop-bar-track">
        <div class="pop-bar-fill" id="pop-bar" style="width:0%"></div>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-label">Simulation Speed</div>
      <div class="slider-container">
        <span class="slider-label" id="speed-val">10</span>
        <input type="range" id="speed-slider" min="1" max="60" value="10">
      </div>
    </div>

    <div class="panel-section">
      <div class="section-label">Controls</div>
      <div class="btn-row">
        <button id="btn-pause" class="btn-primary">Pause</button>
        <button id="btn-reset" class="btn-danger">Reset</button>
      </div>
      <button id="btn-step" class="btn-secondary btn-full">Step Once</button>
    </div>
  </div>

  <div class="footer">
    Drag to rotate &bull; Scroll to zoom
  </div>
</div>

<script>
const CONFIG = {
  cellCount: 4200,
  sphereRadius: 220,
  cellSize: 3.2,
  rotationSpeed: 0.0015,
  neighborThreshold: 1.15,
};

let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 10,
  lastStepTime: 0,
  rotation: { x: 0.3, y: 0 },
  zoom: 1,
  isDragging: false,
  lastMouse: { x: 0, y: 0 },
  velocity: { x: 0, y: 0 },
};

const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width * devicePixelRatio;
  canvas.height = height * devicePixelRatio;
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ── Vector Math ──
const V = {
  len: v => Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z),
  dist: (a, b) => {
    const dx=a.x-b.x, dy=a.y-b.y, dz=a.z-b.z;
    return Math.sqrt(dx*dx+dy*dy+dz*dz);
  },
  dot: (a, b) => a.x*b.x + a.y*b.y + a.z*b.z,
};

// ── Fibonacci Sphere ──
function createSpherePoints(count, radius) {
  const pts = [];
  const ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2;
    const rY = Math.sqrt(1 - y * y);
    const theta = ga * i;
    pts.push({ x: Math.cos(theta)*rY*radius, y: y*radius, z: Math.sin(theta)*rY*radius });
  }
  return pts;
}

// ── Init Game ──
function initGame() {
  const pts = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  const avgDist = (2 * Math.PI * CONFIG.sphereRadius) / Math.sqrt(CONFIG.cellCount);
  const threshold = avgDist * CONFIG.neighborThreshold;

  state.cells = pts.map((p, i) => {
    const neighbors = [];
    for (let j = 0; j < pts.length; j++) {
      if (i === j) continue;
      if (V.dist(p, pts[j]) < threshold) neighbors.push(j);
    }
    return {
      pos: p,
      neighbors,
      alive: Math.random() > 0.65,
      bornGen: 0,
      age: 0,
    };
  });

  state.generation = 0;
  updateStats();
}

// ── Game Step ──
function stepGame() {
  const next = state.cells.map(cell => {
    const n = cell.neighbors.reduce((a, idx) => a + (state.cells[idx].alive ? 1 : 0), 0);
    let alive = false;
    let born = false;
    if (cell.alive) {
      if (n === 2 || n === 3) alive = true;
    } else {
      if (n === 3) { alive = true; born = true; }
    }
    return { alive, bornGen: born ? state.generation : cell.bornGen, age: alive ? (cell.alive ? cell.age + 1 : 0) : 0 };
  });

  state.cells.forEach((c, i) => {
    c.alive = next[i].alive;
    c.bornGen = next[i].bornGen;
    c.age = next[i].age;
  });

  state.generation++;
  updateStats();
}

// ── Projection ──
function project(p, rx, ry, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(ry) - p.z * Math.sin(ry);
  let z = p.z * Math.cos(ry) + p.x * Math.sin(ry);
  // Rotate X
  let y = p.y * Math.cos(rx) - z * Math.sin(rx);
  let zf = z * Math.cos(rx) + p.y * Math.sin(rx);

  const fov = 900 * zoom;
  const scale = fov / (fov + zf);

  return { x: x * scale + width/2, y: y * scale + height/2, scale, z: zf };
}

// ── Color Palette ──
function getCellColor(cell, projZ) {
  if (!cell.alive) return null;

  // Hue based on age with cycling
  const ageHue = (cell.age * 3 + state.generation * 0.5) % 360;
  
  // Depth-based lighting: cells facing camera are brighter
  const depthFactor = (CONFIG.sphereRadius - projZ) / (CONFIG.sphereRadius * 2);
  const lightness = 35 + depthFactor * 35;
  const saturation = 70 + depthFactor * 25;
  const alpha = 0.4 + depthFactor * 0.6;

  return {
    h: ageHue,
    s: saturation,
    l: lightness,
    a: alpha,
  };
}

// ── Draw ──
function draw() {
  // Background
  ctx.fillStyle = '#020108';
  ctx.fillRect(0, 0, width, height);

  // Subtle radial gradient background
  const bgGrad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.max(width, height) * 0.6);
  bgGrad.addColorStop(0, 'rgba(20, 15, 50, 0.3)');
  bgGrad.addColorStop(0.5, 'rgba(10, 8, 30, 0.15)');
  bgGrad.addColorStop(1, 'rgba(2, 1, 8, 0)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, width, height);

  // Project all cells
  const projected = state.cells.map(cell => ({
    cell,
    proj: project(cell.pos, state.rotation.x, state.rotation.y, state.zoom),
  }));

  // Sort back to front
  projected.sort((a, b) => b.proj.z - a.proj.z);

  // Draw sphere atmosphere glow
  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;

  // Outer glow
  const atmosGrad = ctx.createRadialGradient(cx, cy, r * 0.85, cx, cy, r * 1.6);
  atmosGrad.addColorStop(0, 'rgba(0, 229, 255, 0.0)');
  atmosGrad.addColorStop(0.4, 'rgba(80, 60, 180, 0.04)');
  atmosGrad.addColorStop(0.7, 'rgba(0, 229, 255, 0.02)');
  atmosGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = atmosGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.6, 0, Math.PI * 2);
  ctx.fill();

  // Inner rim light
  const rimGrad = ctx.createRadialGradient(cx, cy, r * 0.7, cx, cy, r * 1.05);
  rimGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  rimGrad.addColorStop(0.6, 'rgba(0, 0, 0, 0)');
  rimGrad.addColorStop(0.85, 'rgba(0, 229, 255, 0.06)');
  rimGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = rimGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.05, 0, Math.PI * 2);
  ctx.fill();

  // Draw dead cells (subtle structure)
  projected.forEach(({ cell, proj }) => {
    if (cell.alive) return;
    const size = CONFIG.cellSize * proj.scale * 0.5;
    if (size < 0.3) return;
    const depthFactor = (CONFIG.sphereRadius - proj.z) / (CONFIG.sphereRadius * 2);
    const alpha = 0.03 + depthFactor * 0.08;
    ctx.fillStyle = `rgba(100, 120, 160, ${alpha})`;
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
  });

  // Draw alive cells with glow
  projected.forEach(({ cell, proj }) => {
    if (!cell.alive) return;
    const size = CONFIG.cellSize * proj.scale;
    if (size < 0.3) return;

    const color = getCellColor(cell, proj.z);
    if (!color) return;

    // Glow layer
    if (size > 1.5) {
      const glowSize = size * 3;
      const glowGrad = ctx.createRadialGradient(proj.x, proj.y, 0, proj.x, proj.y, glowSize);
      glowGrad.addColorStop(0, `hsla(${color.h}, ${color.s}%, ${color.l}%, ${color.a * 0.4})`);
      glowGrad.addColorStop(0.5, `hsla(${color.h}, ${color.s}%, ${color.l}%, ${color.a * 0.08})`);
      glowGrad.addColorStop(1, `hsla(${color.h}, ${color.s}%, ${color.l}%, 0)`);
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, glowSize, 0, Math.PI * 2);
      ctx.fill();
    }

    // Core cell
    ctx.fillStyle = `hsla(${color.h}, ${color.s}%, ${color.l + 15}%, ${color.a})`;
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();

    // Bright center
    if (size > 2) {
      ctx.fillStyle = `hsla(${color.h}, ${color.s}%, ${Math.min(95, color.l + 30)}%, ${color.a * 0.7})`;
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, size * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Subtle wireframe sphere outline
  ctx.strokeStyle = 'rgba(0, 229, 255, 0.04)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
}

// ── Stats ──
function updateStats() {
  document.getElementById('gen-count').textContent = state.generation.toLocaleString();
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').textContent = pop.toLocaleString();
  const pct = (pop / state.cells.length) * 100;
  document.getElementById('pop-bar').style.width = pct + '%';
}

// ── Main Loop ──
function loop(timestamp) {
  if (state.isRunning) {
    state.rotation.y += CONFIG.rotationSpeed;

    const interval = 1000 / state.speed;
    if (timestamp - state.lastStepTime >= interval) {
      stepGame();
      state.lastStepTime = timestamp;
    }
  }

  // Inertia when not dragging
  if (!state.isDragging) {
    state.rotation.y += state.velocity.y;
    state.rotation.x += state.velocity.x;
    state.velocity.x *= 0.95;
    state.velocity.y *= 0.95;
  }

  draw();
  requestAnimationFrame(loop);
}

// ── Controls ──
document.getElementById('btn-pause').addEventListener('click', function(e) {
  state.isRunning = !state.isRunning;
  e.target.textContent = state.isRunning ? 'Pause' : 'Resume';
  e.target.className = state.isRunning ? 'btn-primary' : 'btn-secondary';
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  const btn = document.getElementById('btn-pause');
  btn.textContent = 'Resume';
  btn.className = 'btn-secondary';
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', function(e) {
  state.speed = parseInt(e.target.value);
  document.getElementById('speed-val').textContent = state.speed;
});

// ── Mouse / Touch ──
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', e => {
  state.isDragging = true;
  state.velocity.x = 0;
  state.velocity.y = 0;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', e => {
  if (!state.isDragging) return;
  const dx = e.clientX - state.lastMouse.x;
  const dy = e.clientY - state.lastMouse.y;
  state.rotation.y += dx * 0.005;
  state.rotation.x += dy * 0.005;
  state.velocity.y = dx * 0.0003;
  state.velocity.x = dy * 0.0003;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => { state.isDragging = false; });

container.addEventListener('wheel', e => {
  e.preventDefault();
  state.zoom -= e.deltaY * 0.0008;
  state.zoom = Math.max(0.4, Math.min(3, state.zoom));
}, { passive: false });

// Touch support
let lastTouch = null;
let lastTouchDist = null;

container.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    state.isDragging = true;
    state.lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  } else if (e.touches.length === 2) {
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });

container.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && state.isDragging) {
    const dx = e.touches[0].clientX - state.lastMouse.x;
    const dy = e.touches[0].clientY - state.lastMouse.y;
    state.rotation.y += dx * 0.005;
    state.rotation.x += dy * 0.005;
    state.velocity.y = dx * 0.0003;
    state.velocity.x = dy * 0.0003;
    state.lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    if (lastTouchDist) {
      const delta = (dist - lastTouchDist) * 0.005;
      state.zoom = Math.max(0.4, Math.min(3, state.zoom + delta));
    }
    lastTouchDist = dist;
  }
}, { passive: false });

container.addEventListener('touchend', () => {
  state.isDragging = false;
  lastTouchDist = null;
});

// ── Start ──
initGame();
requestAnimationFrame(loop);
</script>
</body>
