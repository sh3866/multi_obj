<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Life</title>
<style>
  :root {
    --bg: #000005;
    --panel-bg: rgba(8, 8, 30, 0.55);
    --panel-border: rgba(255, 255, 255, 0.06);
    --text-primary: #f0eef6;
    --text-secondary: rgba(160, 165, 200, 0.5);
    --text-tertiary: rgba(120, 125, 160, 0.25);
    --cyan: #00f5d4;
    --violet: #9d4edd;
    --magenta: #f72585;
    --gold: #ffd60a;
    --mono: "SF Mono", "Fira Code", "Cascadia Code", "Roboto Mono", "Consolas", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--sans);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  #canvas-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  #ui-layer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
  }

  .header {
    position: absolute;
    top: 2.4rem;
    left: 3rem;
    pointer-events: auto;
  }
  .header .label {
    font-size: 0.5rem;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 0.5rem;
  }
  .header .brand {
    font-size: 2.6rem;
    font-weight: 200;
    letter-spacing: -0.04em;
    color: var(--text-primary);
    line-height: 1;
  }
  .header .brand strong {
    font-weight: 800;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--violet) 40%, var(--magenta) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .panel {
    position: absolute;
    top: 2rem;
    right: 2.4rem;
    width: 320px;
    pointer-events: auto;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 1.6rem;
    backdrop-filter: blur(40px) saturate(1.4);
    -webkit-backdrop-filter: blur(40px) saturate(1.4);
    box-shadow:
      0 40px 120px rgba(0,0,0,0.6),
      0 0 0 1px rgba(255,255,255,0.02) inset,
      0 1px 0 rgba(255,255,255,0.03) inset;
  }

  .section-label {
    font-size: 0.42rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 0.7rem;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
    margin-bottom: 1.2rem;
  }
  .stat-card {
    background: rgba(255, 255, 255, 0.018);
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 14px;
    padding: 0.9rem 1rem;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
  }
  .stat-card .stat-label {
    font-size: 0.38rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 0.35rem;
  }
  .stat-card .stat-value {
    font-family: var(--mono);
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .stat-card.accent .stat-value {
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .pop-track {
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,0.03);
    border-radius: 1px;
    margin-bottom: 1.2rem;
    overflow: hidden;
  }
  .pop-fill {
    height: 100%;
    border-radius: 1px;
    background: linear-gradient(90deg, var(--cyan), var(--violet), var(--magenta), var(--gold));
    background-size: 300% 100%;
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    animation: popGradient 5s ease infinite;
  }
  @keyframes popGradient {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .density-bars {
    display: flex;
    align-items: flex-end;
    gap: 1.5px;
    height: 24px;
    margin-bottom: 1.2rem;
  }
  .density-bars .bar {
    flex: 1;
    border-radius: 1px;
    min-height: 1.5px;
    transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    background: rgba(255,255,255,0.04);
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 1.2rem;
  }
  .slider-row .slider-val {
    font-family: var(--mono);
    font-size: 0.55rem;
    color: var(--text-secondary);
    min-width: 20px;
    text-align: right;
    font-weight: 600;
  }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.04);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--text-primary);
    cursor: pointer;
    box-shadow: 0 0 12px rgba(0,245,212,0.3), 0 0 24px rgba(0,245,212,0.1);
    border: 2px solid rgba(0,245,212,0.3);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.25);
    box-shadow: 0 0 16px rgba(0,245,212,0.5), 0 0 32px rgba(0,245,212,0.2);
  }
  input[type=range]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--text-primary);
    cursor: pointer;
    border: 2px solid rgba(0,245,212,0.3);
    box-shadow: 0 0 12px rgba(0,245,212,0.3);
  }

  .btn-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
  }
  button {
    font-family: var(--sans);
    font-size: 0.48rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border: none;
    border-radius: 12px;
    padding: 0.75rem 1rem;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    outline: none;
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  button::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
  }
  button.btn-primary {
    background: linear-gradient(135deg, var(--cyan), #00c4b8);
    color: #010108;
    box-shadow: 0 4px 24px rgba(0, 245, 212, 0.15);
  }
  button.btn-primary:hover {
    box-shadow: 0 6px 36px rgba(0, 245, 212, 0.3);
    transform: translateY(-1px);
  }
  button.btn-primary:active { transform: translateY(0); }
  button.btn-secondary {
    background: rgba(255, 255, 255, 0.02);
    color: var(--text-secondary);
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  button.btn-secondary:hover {
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-primary);
    border-color: rgba(255, 255, 255, 0.08);
  }
  button.btn-danger {
    background: rgba(247, 37, 133, 0.06);
    color: var(--magenta);
    border: 1px solid rgba(247, 37, 133, 0.1);
  }
  button.btn-danger:hover {
    background: rgba(247, 37, 133, 0.12);
    border-color: rgba(247, 37, 133, 0.2);
    box-shadow: 0 0 20px rgba(247, 37, 133, 0.06);
  }
  button.btn-full { width: 100%; }

  .footer {
    position: absolute;
    bottom: 2.4rem;
    left: 3rem;
    font-size: 0.4rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .footer::before {
    content: '';
    display: block;
    width: 18px;
    height: 1px;
    background: linear-gradient(90deg, var(--text-tertiary), transparent);
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
    margin: 1rem 0;
  }

  @media (max-width: 768px) {
    .header { top: 1rem; left: 1rem; }
    .header .brand { font-size: 1.5rem; }
    .panel { top: auto; bottom: 1rem; right: 1rem; left: 1rem; width: auto; padding: 1.2rem; }
    .footer { display: none; }
  }
</style>
</head>
<body>

<div id="canvas-container">
  <canvas id="sphereCanvas"></canvas>
</div>

<div id="ui-layer">
  <div class="header">
    <div class="label">Conway's Game of Life</div>
    <div class="brand">Spherical <strong>Life</strong></div>
  </div>

  <div class="panel">
    <div class="section-label">Simulation Stats</div>
    <div class="stat-grid">
      <div class="stat-card accent">
        <div class="stat-label">Generation</div>
        <div class="stat-value" id="gen-count">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Population</div>
        <div class="stat-value" id="pop-count">0</div>
      </div>
    </div>
    <div class="pop-track">
      <div class="pop-fill" id="pop-bar" style="width:0%"></div>
    </div>

    <div class="section-label">Population Density</div>
    <div class="density-bars" id="density-chart"></div>

    <div class="section-label">Simulation Speed</div>
    <div class="slider-row">
      <span class="slider-val" id="speed-val">12</span>
      <input type="range" id="speed-slider" min="1" max="60" value="12">
    </div>

    <div class="divider"></div>

    <div class="section-label">Controls</div>
    <div class="btn-row">
      <button id="btn-pause" class="btn-primary">Pause</button>
      <button id="btn-reset" class="btn-danger">Reset</button>
    </div>
    <button id="btn-step" class="btn-secondary btn-full">Step Once</button>
  </div>

  <div class="footer">
    Drag to rotate &bull; Scroll to zoom
  </div>
</div>

<script>
const CONFIG = {
  cellCount: 4800,
  sphereRadius: 240,
  cellBaseSize: 2.2,
  rotationSpeed: 0.0003,
  neighborThreshold: 1.15,
};

let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 12,
  lastStepTime: 0,
  rotation: { x: 0.25, y: 0 },
  zoom: 1,
  isDragging: false,
  lastMouse: { x: 0, y: 0 },
  velocity: { x: 0, y: 0 },
  time: 0,
  history: [],
};

const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width, height;

const PALETTE = [
  { h: 175, s: 100, l: 58 },
  { h: 270, s: 85, l: 62 },
  { h: 330, s: 90, l: 60 },
  { h: 45, s: 100, l: 56 },
  { h: 350, s: 95, l: 62 },
  { h: 200, s: 90, l: 58 },
  { h: 150, s: 85, l: 55 },
  { h: 30, s: 95, l: 60 },
];

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const stars = [];
for (let i = 0; i < 400; i++) {
  stars.push({
    x: Math.random(),
    y: Math.random(),
    size: Math.random() * 1.0 + 0.15,
    alpha: Math.random() * 0.35 + 0.03,
    twinkleSpeed: Math.random() * 2.5 + 0.3,
    twinkleOffset: Math.random() * Math.PI * 2,
  });
}

function initDensityChart() {
  const chart = document.getElementById('density-chart');
  for (let i = 0; i < 40; i++) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = '1.5px';
    chart.appendChild(bar);
  }
}
initDensityChart();

function updateDensityChart() {
  const bars = document.querySelectorAll('.density-bars .bar');
  const len = state.history.length;
  bars.forEach((bar, i) => {
    const idx = Math.floor((i / bars.length) * len);
    if (idx < len) {
      const val = state.history[idx] / CONFIG.cellCount;
      const h = Math.max(1.5, val * 24);
      bar.style.height = h + 'px';
      const hue = 175 + val * 90;
      bar.style.background = `hsla(${hue}, 80%, 60%, ${0.2 + val * 0.5})`;
    } else {
      bar.style.height = '1.5px';
      bar.style.background = 'rgba(255,255,255,0.03)';
    }
  });
}

const V = {
  dist: (a, b) => {
    const dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
    return Math.sqrt(dx * dx + dy * dy + dz * dz);
  },
};

function createSpherePoints(count, radius) {
  const pts = [];
  const ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2;
    const rY = Math.sqrt(1 - y * y);
    const theta = ga * i;
    pts.push({
      x: Math.cos(theta) * rY * radius,
      y: y * radius,
      z: Math.sin(theta) * rY * radius,
    });
  }
  return pts;
}

function initGame() {
  const pts = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  const avgDist = (2 * Math.PI * CONFIG.sphereRadius) / Math.sqrt(CONFIG.cellCount);
  const threshold = avgDist * CONFIG.neighborThreshold;

  state.cells = pts.map((p, i) => {
    const neighbors = [];
    for (let j = 0; j < pts.length; j++) {
      if (i === j) continue;
      if (V.dist(p, pts[j]) < threshold) neighbors.push(j);
    }
    return {
      pos: p,
      neighbors,
      alive: Math.random() > 0.62,
      bornGen: 0,
      age: 0,
      colorIdx: Math.floor(Math.random() * PALETTE.length),
      neighborDensity: neighbors.length,
    };
  });

  state.generation = 0;
  state.history = [];
  updateStats();
}

function stepGame() {
  const next = state.cells.map(cell => {
    const n = cell.neighbors.reduce((a, idx) => a + (state.cells[idx].alive ? 1 : 0), 0);
    let alive = false;
    let born = false;
    if (cell.alive) {
      if (n === 2 || n === 3) alive = true;
    } else {
      if (n === 3) { alive = true; born = true; }
    }
    return {
      alive,
      bornGen: born ? state.generation : cell.bornGen,
      age: alive ? (cell.alive ? cell.age + 1 : 0) : 0,
      colorIdx: born ? Math.floor(Math.random() * PALETTE.length) : cell.colorIdx,
    };
  });

  state.cells.forEach((c, i) => {
    c.alive = next[i].alive;
    c.bornGen = next[i].bornGen;
    c.age = next[i].age;
    c.colorIdx = next[i].colorIdx;
  });

  state.generation++;
  const pop = state.cells.filter(c => c.alive).length;
  state.history.push(pop);
  if (state.history.length > 60) state.history.shift();
  updateStats();
  updateDensityChart();
}

function project(p, rx, ry, zoom) {
  let x = p.x * Math.cos(ry) - p.z * Math.sin(ry);
  let z = p.z * Math.cos(ry) + p.x * Math.sin(ry);
  let y = p.y * Math.cos(rx) - z * Math.sin(rx);
  let zf = z * Math.cos(rx) + p.y * Math.sin(rx);

  const fov = 900 * zoom;
  const scale = fov / (fov + zf);

  return { x: x * scale + width / 2, y: y * scale + height / 2, scale, z: zf };
}

function draw() {
  state.time += 0.016;

  ctx.fillStyle = '#000005';
  ctx.fillRect(0, 0, width, height);

  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;

  // Deep space nebula washes
  const nebula1 = ctx.createRadialGradient(cx * 0.65, cy * 0.75, 0, cx * 0.65, cy * 0.75, width * 0.45);
  nebula1.addColorStop(0, 'rgba(25, 8, 55, 0.06)');
  nebula1.addColorStop(0.5, 'rgba(15, 5, 40, 0.02)');
  nebula1.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = nebula1;
  ctx.fillRect(0, 0, width, height);

  const nebula2 = ctx.createRadialGradient(cx * 1.35, cy * 0.55, 0, cx * 1.35, cy * 0.55, width * 0.35);
  nebula2.addColorStop(0, 'rgba(8, 25, 45, 0.05)');
  nebula2.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = nebula2;
  ctx.fillRect(0, 0, width, height);

  // Starfield
  stars.forEach(star => {
    const twinkle = 0.5 + 0.5 * Math.sin(state.time * star.twinkleSpeed + star.twinkleOffset);
    const a = star.alpha * twinkle;
    ctx.fillStyle = `rgba(180, 190, 240, ${a})`;
    ctx.beginPath();
    ctx.arc(star.x * width, star.y * height, star.size, 0, Math.PI * 2);
    ctx.fill();
  });

  // Sphere ambient glow - large soft bloom
  const ambientGlow = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, r * 2.8);
  ambientGlow.addColorStop(0, 'rgba(0, 245, 212, 0.012)');
  ambientGlow.addColorStop(0.25, 'rgba(100, 50, 180, 0.008)');
  ambientGlow.addColorStop(0.5, 'rgba(20, 10, 50, 0.004)');
  ambientGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = ambientGlow;
  ctx.fillRect(0, 0, width, height);

  // Sphere base - subtle dark volume
  const sphereBase = ctx.createRadialGradient(cx - r * 0.12, cy - r * 0.12, r * 0.05, cx, cy, r);
  sphereBase.addColorStop(0, 'rgba(18, 14, 45, 0.12)');
  sphereBase.addColorStop(0.4, 'rgba(12, 9, 35, 0.06)');
  sphereBase.addColorStop(0.75, 'rgba(8, 6, 25, 0.03)');
  sphereBase.addColorStop(1, 'rgba(5, 4, 18, 0.01)');
  ctx.fillStyle = sphereBase;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  // Inner shadow for depth
  const innerShadow = ctx.createRadialGradient(cx, cy, r * 0.75, cx, cy, r);
  innerShadow.addColorStop(0, 'rgba(0, 0, 0, 0)');
  innerShadow.addColorStop(0.6, 'rgba(0, 0, 0, 0)');
  innerShadow.addColorStop(1, 'rgba(0, 0, 0, 0.12)');
  ctx.fillStyle = innerShadow;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  // Rim light - cyan (left side)
  const rimCyan = ctx.createRadialGradient(cx - r * 0.05, cy, r * 0.82, cx - r * 0.05, cy, r * 1.05);
  rimCyan.addColorStop(0, 'rgba(0, 0, 0, 0)');
  rimCyan.addColorStop(0.4, 'rgba(0, 245, 212, 0.015)');
  rimCyan.addColorStop(0.7, 'rgba(0, 245, 212, 0.04)');
  rimCyan.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = rimCyan;
  ctx.beginPath();
  ctx.arc(cx - r * 0.05, cy, r * 1.05, 0, Math.PI * 2);
  ctx.fill();

  // Rim light - violet (right side)
  const rimViolet = ctx.createRadialGradient(cx + r * 0.05, cy, r * 0.8, cx + r * 0.05, cy, r * 1.08);
  rimViolet.addColorStop(0, 'rgba(0, 0, 0, 0)');
  rimViolet.addColorStop(0.5, 'rgba(0, 0, 0, 0)');
  rimViolet.addColorStop(0.8, 'rgba(157, 78, 221, 0.02)');
  rimViolet.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = rimViolet;
  ctx.beginPath();
  ctx.arc(cx + r * 0.05, cy, r * 1.08, 0, Math.PI * 2);
  ctx.fill();

  // Subtle wireframe grid
  ctx.lineWidth = 0.25;
  const gridOpacity = 0.01;

  for (let lat = -60; lat <= 60; lat += 30) {
    const phi = (lat * Math.PI) / 180;
    const ringR = CONFIG.sphereRadius * Math.cos(phi);
    const ringY = CONFIG.sphereRadius * Math.sin(phi);

    ctx.strokeStyle = `rgba(100, 140, 255, ${gridOpacity})`;
    ctx.beginPath();
    let started = false;
    for (let lon = 0; lon <= 360; lon += 3) {
      const theta = (lon * Math.PI) / 180;
      let px = ringR * Math.cos(theta);
      let py = ringY;
      let pz = ringR * Math.sin(theta);

      let x = px * Math.cos(state.rotation.y) - pz * Math.sin(state.rotation.y);
      let z = pz * Math.cos(state.rotation.y) + px * Math.sin(state.rotation.y);
      let y = py * Math.cos(state.rotation.x) - z * Math.sin(state.rotation.x);
      let zf = z * Math.cos(state.rotation.x) + py * Math.sin(state.rotation.x);

      const fov = 900 * state.zoom;
      const sc = fov / (fov + zf);
      const sx = x * sc + width / 2;
      const sy = y * sc + height / 2;

      if (!started) { ctx.moveTo(sx, sy); started = true; }
      else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
  }

  for (let lon = 0; lon < 360; lon += 30) {
    const theta = (lon * Math.PI) / 180;
    ctx.strokeStyle = `rgba(100, 140, 255, ${gridOpacity})`;
    ctx.beginPath();
    let started = false;
    for (let phi = -90; phi <= 90; phi += 3) {
      const phiRad = (phi * Math.PI) / 180;
      let px = CONFIG.sphereRadius * Math.cos(phiRad) * Math.cos(theta);
      let py = CONFIG.sphereRadius * Math.sin(phiRad);
      let pz = CONFIG.sphereRadius * Math.cos(phiRad) * Math.sin(theta);

      let x = px * Math.cos(state.rotation.y) - pz * Math.sin(state.rotation.y);
      let z = pz * Math.cos(state.rotation.y) + px * Math.sin(state.rotation.y);
      let y = py * Math.cos(state.rotation.x) - z * Math.sin(state.rotation.x);
      let zf = z * Math.cos(state.rotation.x) + py * Math.sin(state.rotation.x);

      const fov = 900 * state.zoom;
      const sc = fov / (fov + zf);
      const sx = x * sc + width / 2;
      const sy = y * sc + height / 2;

      if (!started) { ctx.moveTo(sx, sy); started = true; }
      else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
  }

  // Project all cells
  const projected = state.cells.map(cell => ({
    cell,
    proj: project(cell.pos, state.rotation.x, state.rotation.y, state.zoom),
  }));

  // Sort back to front
  projected.sort((a, b) => b.proj.z - a.proj.z);

  // Draw dead cells - subtle presence
  projected.forEach(({ cell, proj }) => {
    if (cell.alive) return;
    const size = CONFIG.cellBaseSize * proj.scale * 0.25;
    if (size < 0.08) return;
    const depthFactor = (CONFIG.sphereRadius - proj.z) / (CONFIG.sphereRadius * 2);
    const alpha = 0.008 + depthFactor * 0.03;
    ctx.fillStyle = `rgba(60, 80, 140, ${alpha})`;
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
  });

  // Draw alive cells - large outer glow (additive blending)
  ctx.globalCompositeOperation = 'lighter';
  projected.forEach(({ cell, proj }) => {
    if (!cell.alive) return;
    const pulse = 1 + Math.sin(state.time * 1.2 + cell.age * 0.1) * 0.1;
    const size = CONFIG.cellBaseSize * proj.scale * pulse;
    if (size < 0.3) return;

    const depthFactor = (CONFIG.sphereRadius - proj.z) / (CONFIG.sphereRadius * 2);
    const pal = PALETTE[cell.colorIdx];
    const ageShift = (cell.age * 0.4) % 360;
    const hue = (pal.h + ageShift) % 360;
    const sat = pal.s;
    const light = pal.l + depthFactor * 18;
    const alpha = 0.12 + depthFactor * 0.3;

    if (size > 0.5) {
      const glowSize = size * (6 + depthFactor * 5);
      const glowGrad = ctx.createRadialGradient(proj.x, proj.y, 0, proj.x, proj.y, glowSize);
      glowGrad.addColorStop(0, `hsla(${hue}, ${sat}%, ${light + 12}%, ${alpha * 0.45})`);
      glowGrad.addColorStop(0.12, `hsla(${hue}, ${sat}%, ${light}%, ${alpha * 0.22})`);
      glowGrad.addColorStop(0.35, `hsla(${hue}, ${sat}%, ${light - 5}%, ${alpha * 0.06})`);
      glowGrad.addColorStop(1, `hsla(${hue}, ${sat}%, ${light}%, 0)`);
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, glowSize, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Draw alive cells - medium glow
  projected.forEach(({ cell, proj }) => {
    if (!cell.alive) return;
    const pulse = 1 + Math.sin(state.time * 1.2 + cell.age * 0.1) * 0.1;
    const size = CONFIG.cellBaseSize * proj.scale * pulse;
    if (size < 0.3) return;

    const depthFactor = (CONFIG.sphereRadius - proj.z) / (CONFIG.sphereRadius * 2);
    const pal = PALETTE[cell.colorIdx];
    const ageShift = (cell.age * 0.4) % 360;
    const hue = (pal.h + ageShift) % 360;
    const sat = pal.s;
    const light = pal.l + depthFactor * 14;
    const alpha = 0.22 + depthFactor * 0.35;

    if (size > 0.7) {
      const midGlowSize = size * 3.2;
      const midGlow = ctx.createRadialGradient(proj.x, proj.y, 0, proj.x, proj.y, midGlowSize);
      midGlow.addColorStop(0, `hsla(${hue}, ${sat}%, ${light + 16}%, ${alpha * 0.55})`);
      midGlow.addColorStop(0.35, `hsla(${hue}, ${sat}%, ${light}%, ${alpha * 0.18})`);
      midGlow.addColorStop(1, `hsla(${hue}, ${sat}%, ${light}%, 0)`);
      ctx.fillStyle = midGlow;
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, midGlowSize, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Draw alive cell cores
  ctx.globalCompositeOperation = 'source-over';
  projected.forEach(({ cell, proj }) => {
    if (!cell.alive) return;
    const pulse = 1 + Math.sin(state.time * 1.2 + cell.age * 0.1) * 0.1;
    const size = CONFIG.cellBaseSize * proj.scale * pulse;
    if (size < 0.15) return;

    const depthFactor = (CONFIG.sphereRadius - proj.z) / (CONFIG.sphereRadius * 2);
    const pal = PALETTE[cell.colorIdx];
    const ageShift = (cell.age * 0.4) % 360;
    const hue = (pal.h + ageShift) % 360;
    const sat = pal.s;
    const light = pal.l + 22 + depthFactor * 18;
    const alpha = Math.min(1, 0.45 + depthFactor * 0.5);

    ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();

    // Bright center highlight
    if (size > 0.9) {
      const centerAlpha = Math.min(0.75, alpha * 0.55 * depthFactor);
      ctx.fillStyle = `hsla(${hue}, ${Math.max(10, sat - 65)}%, ${Math.min(96, light + 28)}%, ${centerAlpha})`;
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, size * 0.22, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Draw connection lines between nearby alive cells
  ctx.globalCompositeOperation = 'lighter';
  const aliveProjected = projected.filter(({ cell }) => cell.alive);
  for (let i = 0; i < aliveProjected.length; i++) {
    const a = aliveProjected[i];
    if (!a.cell.alive) continue;
    const aProj = a.proj;
    const aDepth = (CONFIG.sphereRadius - aProj.z) / (CONFIG.sphereRadius * 2);
    if (aDepth < 0.25) continue;

    const aPal = PALETTE[a.cell.colorIdx];
    const aHue = (aPal.h + (a.cell.age * 0.4) % 360) % 360;

    for (const nid of a.cell.neighbors) {
      const b = state.cells[nid];
      if (!b.alive) continue;
      const bProj = project(b.pos, state.rotation.x, state.rotation.y, state.zoom);
      const bDepth = (CONFIG.sphereRadius - bProj.z) / (CONFIG.sphereRadius * 2);
      if (bDepth < 0.25) continue;

      const dx = aProj.x - bProj.x;
      const dy = aProj.y - bProj.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 28 * state.zoom) continue;

      const lineAlpha = (1 - dist / (28 * state.zoom)) * 0.045 * aDepth * bDepth;
      if (lineAlpha < 0.003) continue;

      ctx.strokeStyle = `hsla(${aHue}, 70%, 65%, ${lineAlpha})`;
      ctx.lineWidth = 0.4;
      ctx.beginPath();
      ctx.moveTo(aProj.x, aProj.y);
      ctx.lineTo(bProj.x, bProj.y);
      ctx.stroke();
    }
  }

  // Sphere outline ring
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = 'rgba(0, 245, 212, 0.02)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  // Edge highlight
  const edgeGrad = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r);
  edgeGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  edgeGrad.addColorStop(1, 'rgba(0, 245, 212, 0.015)');
  ctx.strokeStyle = edgeGrad;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
}

function updateStats() {
  document.getElementById('gen-count').textContent = state.generation.toLocaleString();
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').textContent = pop.toLocaleString();
  const pct = (pop / state.cells.length) * 100;
  document.getElementById('pop-bar').style.width = pct + '%';
}

function loop(timestamp) {
  if (state.isRunning) {
    state.rotation.y += CONFIG.rotationSpeed;

    const interval = 1000 / state.speed;
    if (timestamp - state.lastStepTime >= interval) {
      stepGame();
      state.lastStepTime = timestamp;
    }
  }

  if (!state.isDragging) {
    state.rotation.y += state.velocity.y;
    state.rotation.x += state.velocity.x;
    state.velocity.x *= 0.95;
    state.velocity.y *= 0.95;
  }

  draw();
  requestAnimationFrame(loop);
}

document.getElementById('btn-pause').addEventListener('click', function(e) {
  state.isRunning = !state.isRunning;
  e.target.textContent = state.isRunning ? 'Pause' : 'Resume';
  e.target.className = state.isRunning ? 'btn-primary' : 'btn-secondary';
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  const btn = document.getElementById('btn-pause');
  btn.textContent = 'Resume';
  btn.className = 'btn-secondary';
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', function(e) {
  state.speed = parseInt(e.target.value);
  document.getElementById('speed-val').textContent = state.speed;
});

const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', e => {
  state.isDragging = true;
  state.velocity.x = 0;
  state.velocity.y = 0;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', e => {
  if (!state.isDragging) return;
  const dx = e.clientX - state.lastMouse.x;
  const dy = e.clientY - state.lastMouse.y;
  state.rotation.y += dx * 0.005;
  state.rotation.x += dy * 0.005;
  state.velocity.y = dx * 0.0003;
  state.velocity.x = dy * 0.0003;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => { state.isDragging = false; });

container.addEventListener('wheel', e => {
  e.preventDefault();
  state.zoom -= e.deltaY * 0.0008;
  state.zoom = Math.max(0.4, Math.min(3, state.zoom));
}, { passive: false });

let lastTouchDist = null;

container.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    state.isDragging = true;
    state.lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  } else if (e.touches.length === 2) {
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });

container.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && state.isDragging) {
    const dx = e.touches[0].clientX - state.lastMouse.x;
    const dy = e.touches[0].clientY - state.lastMouse.y;
    state.rotation.y += dx * 0.005;
    state.rotation.x += dy * 0.005;
    state.velocity.y = dx * 0.0003;
    state.velocity.x = dy * 0.0003;
    state.lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  } else if (e.touches.length === 2 && lastTouchDist) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const delta = dist - lastTouchDist;
    state.zoom += delta * 0.003;
    state.zoom = Math.max(0.4, Math.min(3, state.zoom));
    lastTouchDist = dist;
  }
}, { passive: false });

container.addEventListener('touchend', e => {
  state.isDragging = false;
  lastTouchDist = null;
});

initGame();
requestAnimationFrame(loop);
</script>
</body>
