<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL DANCE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0015;font-family:monospace}

#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}

.scanlines{position:fixed;top:0;left:0;width:100%;height:100%;z-index:50;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.12) 0px,rgba(0,0,0,0.12) 1px,transparent 1px,transparent 3px)}

.vignette{position:fixed;top:0;left:0;width:100%;height:100%;z-index:49;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(5,0,15,0.7) 100%)}

#game-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}

.ui-layer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}

.title-block{position:relative;margin-bottom:10px;text-align:center;filter:drop-shadow(0 0 30px rgba(255,0,255,0.5))}

.title-main{font-size:clamp(3rem,8vw,7rem);font-weight:900;letter-spacing:0.05em;line-height:0.95;color:#fff;
  text-shadow:
    0 0 10px #ff00ff,
    0 0 30px #ff00ff,
    0 0 60px #ff00ff,
    4px 4px 0 #0055ff,
    -2px -2px 0 #00ffff;
  animation:titlePulse 2s ease-in-out infinite,titleFloat 4s ease-in-out infinite;
  image-rendering:pixelated;
  position:relative;
}

.title-main::before,.title-main::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%}
.title-main::before{color:#ff00ff;z-index:-1;animation:glitch1 3s infinite;clip-path:inset(0 0 60% 0)}
.title-main::after{color:#00ffff;z-index:-1;animation:glitch2 3s infinite;clip-path:inset(60% 0 0 0)}

@keyframes glitch1{
  0%,90%,100%{transform:translate(0)}
  92%{transform:translate(-3px,1px)}
  94%{transform:translate(3px,-1px)}
  96%{transform:translate(-2px,0)}
}
@keyframes glitch2{
  0%,88%,100%{transform:translate(0)}
  90%{transform:translate(3px,1px)}
  93%{transform:translate(-3px,-1px)}
  95%{transform:translate(2px,0)}
}

@keyframes titlePulse{
  0%,100%{filter:drop-shadow(0 0 30px rgba(255,0,255,0.5))}
  50%{filter:drop-shadow(0 0 50px rgba(255,0,255,0.8))}
}
@keyframes titleFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

.subtitle{font-size:clamp(0.7rem,2vw,1.3rem);letter-spacing:0.6em;color:#00ffff;margin-top:8px;
  text-shadow:0 0 10px #00ffff,0 0 30px #00ffff;
  animation:subtitlePulse 2s ease-in-out infinite 0.5s}
@keyframes subtitlePulse{0%,100%{opacity:0.8}50%{opacity:1}}

.highway-wrapper{position:relative;width:clamp(280px,50vw,500px);height:clamp(180px,25vh,280px);margin:20px 0 30px;
  perspective:600px;pointer-events:none}

.highway{width:100%;height:100%;transform:rotateX(55deg);transform-origin:center bottom;
  background:linear-gradient(180deg,rgba(10,0,30,0.3) 0%,rgba(10,0,30,0.8) 100%);
  border:1px solid rgba(0,255,255,0.3);
  box-shadow:0 0 40px rgba(255,0,255,0.2),inset 0 0 40px rgba(0,255,255,0.05);
  position:relative;overflow:hidden;
  border-radius:2px}

.highway::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(180deg,transparent 0%,rgba(255,0,255,0.03) 50%,transparent 100%);
  animation:hwySweep 3s linear infinite}
@keyframes hwySweep{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}

.lane{position:absolute;top:0;bottom:0;width:25%;border-left:1px solid rgba(255,255,255,0.06);border-right:1px solid rgba(255,255,255,0.06)}
.lane:nth-child(1){left:0;background:linear-gradient(180deg,rgba(255,0,255,0.02),rgba(255,0,255,0.08))}
.lane:nth-child(2){left:25%;background:linear-gradient(180deg,rgba(0,255,255,0.02),rgba(0,255,255,0.08))}
.lane:nth-child(3){left:50%;background:linear-gradient(180deg,rgba(255,255,0,0.02),rgba(255,255,0,0.08))}
.lane:nth-child(4){left:75%;background:linear-gradient(180deg,rgba(0,255,100,0.02),rgba(0,255,100,0.08))}

.hit-line{position:absolute;bottom:8px;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.9),rgba(255,255,255,1),rgba(255,255,255,0.9),transparent);
  box-shadow:0 0 15px rgba(255,255,255,0.8),0 0 30px rgba(255,0,255,0.4);z-index:5}

.note{position:absolute;width:70%;height:14px;left:15%;border-radius:2px;z-index:3;
  animation:noteFall var(--speed,1.5s) linear forwards}

.note::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:40%;height:40%;background:rgba(255,255,255,0.6);border-radius:1px}

@keyframes noteFall{0%{top:-14px;opacity:1}80%{opacity:1}100%{top:calc(100% - 22px);opacity:0.3}}

.note-glow{position:absolute;width:70%;height:14px;left:15%;border-radius:2px;z-index:2;
  animation:noteFall var(--speed,1.5s) linear forwards;filter:blur(6px);opacity:0.6}

.btn-row{display:flex;gap:20px;pointer-events:all;margin-top:10px}

.btn{position:relative;padding:14px 36px;font-family:monospace;font-size:clamp(0.8rem,1.5vw,1.1rem);
  font-weight:bold;text-transform:uppercase;letter-spacing:0.15em;cursor:pointer;
  background:transparent;border:none;color:#fff;overflow:hidden;
  transition:all 0.15s ease}

.btn-start{border:2px solid #ff00ff;color:#ff00ff;
  box-shadow:inset 0 0 20px rgba(255,0,255,0.1),0 0 15px rgba(255,0,255,0.3),4px 4px 0 rgba(0,255,255,0.3)}
.btn-start:hover{background:rgba(255,0,255,0.15);box-shadow:inset 0 0 30px rgba(255,0,255,0.2),0 0 30px rgba(255,0,255,0.6),4px 4px 0 rgba(0,255,255,0.5);
  transform:translate(-2px,-2px);text-shadow:0 0 10px #ff00ff}
.btn-start:active{transform:translate(2px,2px);box-shadow:inset 0 0 10px rgba(255,0,255,0.1),0 0 5px rgba(255,0,255,0.3)}

.btn-opt{border:2px solid #00ffff;color:#00ffff;
  box-shadow:inset 0 0 20px rgba(0,255,255,0.1),0 0 15px rgba(0,255,255,0.3),4px 4px 0 rgba(255,0,255,0.3)}
.btn-opt:hover{background:rgba(0,255,255,0.15);box-shadow:inset 0 0 30px rgba(0,255,255,0.2),0 0 30px rgba(0,255,255,0.6),4px 4px 0 rgba(255,0,255,0.5);
  transform:translate(-2px,-2px);text-shadow:0 0 10px #00ffff}
.btn-opt:active{transform:translate(2px,2px);box-shadow:inset 0 0 10px rgba(0,255,255,0.1),0 0 5px rgba(0,255,255,0.3)}

.btn::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
  transition:left 0.4s}
.btn:hover::before{left:150%}

.corner-deco{position:fixed;width:60px;height:60px;z-index:20;pointer-events:none}
.corner-deco.tl{top:20px;left:20px;border-top:2px solid rgba(255,0,255,0.4);border-left:2px solid rgba(255,0,255,0.4)}
.corner-deco.tr{top:20px;right:20px;border-top:2px solid rgba(0,255,255,0.4);border-right:2px solid rgba(0,255,255,0.4)}
.corner-deco.bl{bottom:20px;left:20px;border-bottom:2px solid rgba(0,255,255,0.4);border-left:2px solid rgba(0,255,255,0.4)}
.corner-deco.br{bottom:20px;right:20px;border-bottom:2px solid rgba(255,0,255,0.4);border-right:2px solid rgba(255,0,255,0.4)}

.fps-counter{position:fixed;top:25px;right:25px;font-size:0.65rem;color:rgba(0,255,255,0.4);z-index:55;letter-spacing:0.1em}

@media(max-width:600px){
  .btn{padding:10px 22px;font-size:0.75rem}
  .highway-wrapper{width:260px;height:160px}
  .corner-deco{width:30px;height:30px}
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="game-canvas"></canvas>

<div class="scanlines"></div>
<div class="vignette"></div>

<div class="corner-deco tl"></div>
<div class="corner-deco tr"></div>
<div class="corner-deco bl"></div>
<div class="corner-deco br"></div>

<div class="ui-layer">
  <div class="title-block">
    <div class="title-main" data-text="PIXEL DANCE">PIXEL<br>DANCE</div>
    <div class="subtitle">RHYTHM EDITION</div>
  </div>

  <div class="highway-wrapper">
    <div class="highway" id="highway">
      <div class="lane" id="lane0"></div>
      <div class="lane" id="lane1"></div>
      <div class="lane" id="lane2"></div>
      <div class="lane" id="lane3"></div>
      <div class="hit-line"></div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-start" onclick="document.body.style.animation='flash 0.15s'">START GAME</button>
    <button class="btn btn-opt">OPTIONS</button>
  </div>
</div>

<div class="fps-counter" id="fps">60 FPS</div>

<script>
(function(){
  // === BACKGROUND CANVAS ===
  const bgC = document.getElementById('bg-canvas');
  const bgX = bgC.getContext('2d');
  const gC = document.getElementById('game-canvas');
  const gX = gC.getContext('2d');

  let W, H, horizonY;
  let time = 0;
  let lastTime = performance.now();
  let frameCount = 0;
  let fpsDisplay = 0;

  function resize(){
    W = bgC.width = gC.width = window.innerWidth;
    H = bgC.height = gC.height = window.innerHeight;
    horizonY = H * 0.42;
  }
  window.addEventListener('resize', resize);
  resize();

  // Stars
  const stars = [];
  for(let i=0;i<120;i++){
    stars.push({
      x: Math.random(),
      y: Math.random() * 0.45,
      s: Math.random() * 1.5 + 0.5,
      b: Math.random(),
      sp: Math.random() * 0.02 + 0.005
    });
  }

  // Floating particles
  const particles = [];
  for(let i=0;i<30;i++){
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random()-0.5)*0.3,
      vy: -Math.random()*0.5 - 0.1,
      s: Math.random()*3+1,
      c: Math.random()>0.5 ? '#ff00ff' : '#00ffff',
      a: Math.random()*0.4+0.1
    });
  }

  function drawBg(){
    // Sky gradient
    const grad = bgX.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#050010');
    grad.addColorStop(0.3,'#0a0025');
    grad.addColorStop(0.5,'#15003a');
    grad.addColorStop(0.7,'#1a0044');
    grad.addColorStop(1,'#0d0020');
    bgX.fillStyle = grad;
    bgX.fillRect(0,0,W,H);

    // Stars
    for(const s of stars){
      const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(time * s.sp + s.b * 10));
      bgX.globalAlpha = twinkle;
      bgX.fillStyle = '#fff';
      bgX.fillRect(s.x * W, s.y * H, s.s, s.s);
    }
    bgX.globalAlpha = 1;

    // Sun
    const sunCX = W / 2;
    const sunCY = horizonY - 20;
    const sunR = Math.min(W,H) * 0.18;

    // Sun glow layers
    for(let g=3;g>=0;g--){
      bgX.beginPath();
      bgX.arc(sunCX, sunCY, sunR + g*20, 0, Math.PI*2);
      bgX.fillStyle = `rgba(255,0,255,${0.04 - g*0.008})`;
      bgX.fill();
    }

    // Sun body gradient
    const sunGrad = bgX.createLinearGradient(sunCX, sunCY - sunR, sunCX, sunCY + sunR);
    sunGrad.addColorStop(0,'#ff44ff');
    sunGrad.addColorStop(0.3,'#ff00aa');
    sunGrad.addColorStop(0.6,'#ff6600');
    sunGrad.addColorStop(1,'#ffcc00');

    bgX.beginPath();
    bgX.arc(sunCX, sunCY, sunR, 0, Math.PI*2);
    bgX.fillStyle = sunGrad;
    bgX.fill();

    // Sun stripes (cutout effect)
    bgX.save();
    bgX.globalCompositeOperation = 'destination-out';
    const stripeCount = 12;
    for(let i=0;i<stripeCount;i++){
      const t = i / stripeCount;
      const y = sunCY - sunR + t * sunR * 2;
      const h = 3 + t * 8;
      if(y > sunCY - sunR * 0.1){
        bgX.fillRect(sunCX - sunR, y, sunR*2, h);
      }
    }
    bgX.restore();

    // Horizon glow
    const hGrad = bgX.createLinearGradient(0, horizonY - 30, 0, horizonY + 60);
    hGrad.addColorStop(0,'transparent');
    hGrad.addColorStop(0.5,'rgba(255,0,255,0.15)');
    hGrad.addColorStop(1,'transparent');
    bgX.fillStyle = hGrad;
    bgX.fillRect(0, horizonY - 30, W, 90);

    // Grid
    const gridTop = horizonY;
    const gridBot = H;
    const gridH = gridBot - gridTop;
    const gridSpeed = (time * 1.5) % 1;

    bgX.strokeStyle = 'rgba(255,0,255,0.5)';
    bgX.lineWidth = 1.5;
    bgX.shadowBlur = 8;
    bgX.shadowColor = '#ff00ff';

    // Vertical perspective lines
    const numVLines = 21;
    for(let i=0;i<=numVLines;i++){
      const t = i / numVLines;
      const topX = W/2 + (t - 0.5) * W * 0.01;
      const botX = W/2 + (t - 0.5) * W * 2.5;
      bgX.beginPath();
      bgX.moveTo(topX, gridTop);
      bgX.lineTo(botX, gridBot);
      bgX.stroke();
    }

    // Horizontal lines with perspective spacing
    const numHLines = 25;
    for(let i=0;i<numHLines;i++){
      const rawT = (i / numHLines - gridSpeed + 1) % 1;
      const t = rawT * rawT; // quadratic for perspective
      const y = gridTop + t * gridH;
      const alpha = 0.15 + t * 0.5;
      bgX.strokeStyle = `rgba(255,0,255,${alpha})`;
      bgX.beginPath();
      bgX.moveTo(0, y);
      bgX.lineTo(W, y);
      bgX.stroke();
    }

    bgX.shadowBlur = 0;

    // Particles
    for(const p of particles){
      p.x += p.vx;
      p.y += p.vy;
      if(p.y < -10){ p.y = H + 10; p.x = Math.random()*W; }
      if(p.x < -10) p.x = W + 10;
      if(p.x > W + 10) p.x = -10;

      bgX.globalAlpha = p.a * (0.5 + 0.5 * Math.sin(time * 0.03 + p.x));
      bgX.fillStyle = p.c;
      bgX.fillRect(p.x, p.y, p.s, p.s);
    }
    bgX.globalAlpha = 1;
  }

  // === HIGHWAY NOTES ===
  const lanes = [
    document.getElementById('lane0'),
    document.getElementById('lane1'),
    document.getElementById('lane2'),
    document.getElementById('lane3')
  ];

  const noteColors = ['#ff00ff','#00ffff','#ffff00','#00ff66'];
  const noteGlows = ['rgba(255,0,255,0.5)','rgba(0,255,255,0.5)','rgba(255,255,0,0.5)','rgba(0,255,102,0.5)'];

  function spawnNote(){
    const laneIdx = Math.floor(Math.random()*4);
    const lane = lanes[laneIdx];
    const speed = 1.2 + Math.random()*0.8;

    // Glow element
    const glow = document.createElement('div');
    glow.className = 'note-glow';
    glow.style.background = noteGlows[laneIdx];
    glow.style.setProperty('--speed', speed+'s');
    lane.appendChild(glow);

    // Note element
    const note = document.createElement('div');
    note.className = 'note';
    note.style.background = noteColors[laneIdx];
    note.style.boxShadow = `0 0 8px ${noteColors[laneIdx]}, 0 0 20px ${noteColors[laneIdx]}`;
    note.style.setProperty('--speed', speed+'s');
    lane.appendChild(note);

    const dur = speed * 1000;
    setTimeout(()=>{ note.remove(); glow.remove(); }, dur);
  }

  // Spawn notes rhythmically
  let noteTimer = 0;
  let beatInterval = 30; // frames between beats

  function updateNotes(){
    noteTimer++;
    // Variable rhythm pattern
    const pattern = [30,30,15,30,15,30,30,15,15,30,30,15];
    const idx = Math.floor(noteTimer / 15) % pattern.length;
    if(noteTimer % pattern[idx] === 0){
      spawnNote();
      // Sometimes spawn double
      if(Math.random() < 0.25){
        setTimeout(spawnNote, 80);
      }
    }
  }

  // === GAME CANVAS - Highway reflection / extra effects ===
  function drawGameLayer(){
    gX.clearRect(0,0,W,H);

    // Subtle road reflection under highway
    const hwy = document.getElementById('highway');
    const rect = hwy.getBoundingClientRect();
    const reflY = rect.bottom;
    const reflH = 40;

    const reflGrad = gX.createLinearGradient(0, reflY, 0, reflY + reflH);
    reflGrad.addColorStop(0,'rgba(255,0,255,0.08)');
    reflGrad.addColorStop(1,'transparent');
    gX.fillStyle = reflGrad;
    gX.fillRect(rect.left - 20, reflY, rect.width + 40, reflH);
  }

  // === MAIN LOOP ===
  function loop(now){
    const dt = now - lastTime;
    lastTime = now;
    time++;

    frameCount++;
    if(frameCount % 30 === 0){
      fpsDisplay = Math.round(1000 / dt);
      document.getElementById('fps').textContent = fpsDisplay + ' FPS';
    }

    drawBg();
    updateNotes();
    drawGameLayer();

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);

  // Flash animation for start button
  const style = document.createElement('style');
  style.textContent = `@keyframes flash{0%{filter:brightness(1)}50%{filter:brightness(2)}100%{filter:brightness(1)}}`;
  document.head.appendChild(style);

})();
</script>
</body>
</html>
