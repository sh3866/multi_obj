<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL DANCE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#030008;font-family:'Courier New',monospace}

canvas#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
canvas#fx{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2}

.scanlines{position:fixed;top:0;left:0;width:100%;height:100%;z-index:15;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.12) 0px,rgba(0,0,0,0.12) 1px,transparent 1px,transparent 2px);
  animation:scanMove 8s linear infinite}
@keyframes scanMove{0%{background-position:0 0}100%{background-position:0 200px}}

.vignette{position:fixed;top:0;left:0;width:100%;height:100%;z-index:14;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.6) 100%)}

.chromatic{position:fixed;top:0;left:0;width:100%;height:100%;z-index:13;pointer-events:none;
  mix-blend-mode:screen;opacity:0.025;
  background:linear-gradient(90deg,#ff0040 0%,transparent 30%,transparent 70%,#00f0ff 100%);
  animation:chromShift 4s ease-in-out infinite alternate}
@keyframes chromShift{0%{transform:translateX(-2px)}100%{transform:translateX(2px)}}

#ui{position:fixed;top:0;left:0;width:100%;height:100%;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;padding:clamp(20px,4vh,60px) clamp(16px,3vw,40px) clamp(20px,4vh,50px)}

/* Title */
.title-wrap{text-align:center;position:relative;margin-top:clamp(10px,2vh,30px)}

.title-main{font-size:clamp(2.2rem,6vw,5.5rem);font-weight:900;letter-spacing:0.08em;
  color:#fff;position:relative;display:inline-block;
  text-shadow:
    0 0 10px rgba(255,0,120,0.8),
    0 0 30px rgba(255,0,120,0.5),
    0 0 60px rgba(255,0,120,0.3),
    0 0 100px rgba(255,0,120,0.15),
    3px 3px 0 rgba(0,200,255,0.9),
    5px 5px 0 rgba(0,100,200,0.4);
  animation:titlePulse 2s ease-in-out infinite;
  image-rendering:pixelated}
@keyframes titlePulse{
  0%,100%{transform:scale(1);filter:brightness(1)}
  50%{transform:scale(1.015);filter:brightness(1.15)}}

.title-sub{font-size:clamp(0.55rem,1.3vw,1rem);letter-spacing:0.5em;color:#00e5ff;
  margin-top:clamp(4px,0.8vh,12px);opacity:0.7;
  text-shadow:0 0 10px rgba(0,229,255,0.6),0 0 25px rgba(0,229,255,0.3)}

.title-line{width:clamp(120px,30vw,350px);height:2px;margin:clamp(6px,1vh,16px) auto 0;
  background:linear-gradient(90deg,transparent,#00e5ff 20%,#00e5ff 80%,transparent);
  opacity:0.4;box-shadow:0 0 8px rgba(0,229,255,0.3)}

/* Buttons */
.btn-area{display:flex;gap:clamp(14px,3vw,36px);align-items:center;flex-wrap:wrap;justify-content:center}

.btn{position:relative;padding:clamp(10px,1.4vh,16px) clamp(24px,4vw,52px);
  font-family:'Courier New',monospace;font-size:clamp(0.6rem,1.1vw,0.85rem);
  font-weight:bold;text-transform:uppercase;letter-spacing:0.3em;cursor:pointer;
  background:transparent;border:none;color:#fff;overflow:hidden;outline:none;
  transition:all 0.15s ease;image-rendering:pixelated}

.btn-start{border:2px solid #ff0070;color:#ff0070;
  box-shadow:0 0 12px rgba(255,0,112,0.25),inset 0 0 12px rgba(255,0,112,0.06);
  animation:btnGlow 2.5s ease-in-out infinite}
.btn-start:hover{background:rgba(255,0,112,0.1);
  box-shadow:0 0 25px rgba(255,0,112,0.5),0 0 50px rgba(255,0,112,0.2),inset 0 0 20px rgba(255,0,112,0.1);
  transform:translateY(-2px);text-shadow:0 0 10px #ff0070}
.btn-start:active{transform:translateY(1px) scale(0.97);
  box-shadow:0 0 8px rgba(255,0,112,0.3)}

.btn-opt{border:2px solid #00e5ff;color:#00e5ff;
  box-shadow:0 0 12px rgba(0,229,255,0.25),inset 0 0 12px rgba(0,229,255,0.06)}
.btn-opt:hover{background:rgba(0,229,255,0.1);
  box-shadow:0 0 25px rgba(0,229,255,0.5),0 0 50px rgba(0,229,255,0.2),inset 0 0 20px rgba(0,229,255,0.1);
  transform:translateY(-2px);text-shadow:0 0 10px #00e5ff}
.btn-opt:active{transform:translateY(1px) scale(0.97);
  box-shadow:0 0 8px rgba(0,229,255,0.3)}

@keyframes btnGlow{0%,100%{opacity:1}50%{opacity:0.75}}

.btn::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);
  transition:left 0.4s ease}
.btn:hover::before{left:150%}

/* Corner brackets */
.corner{position:fixed;z-index:16;pointer-events:none}
.corner svg{width:clamp(24px,4vw,48px);height:clamp(24px,4vw,48px)}
.corner.tl{top:clamp(10px,2vh,24px);left:clamp(10px,2vw,24px)}
.corner.tr{top:clamp(10px,2vh,24px);right:clamp(10px,2vw,24px);transform:scaleX(-1)}
.corner.bl{bottom:clamp(10px,2vh,24px);left:clamp(10px,2vw,24px);transform:scaleY(-1)}
.corner.br{bottom:clamp(10px,2vh,24px);right:clamp(10px,2vw,24px);transform:scale(-1)}

/* Beat indicator */
.beat-ring{position:fixed;top:50%;left:50%;width:clamp(300px,50vw,600px);height:clamp(300px,50vw,600px);
  transform:translate(-50%,-50%);z-index:3;pointer-events:none;opacity:0.06;
  border:1px solid #ff0070;border-radius:50%;
  animation:beatExpand 2s ease-out infinite}
.beat-ring:nth-child(2){animation-delay:0.5s;border-color:#00e5ff}
@keyframes beatExpand{0%{transform:translate(-50%,-50%) scale(0.5);opacity:0.08}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}

@media(max-width:600px){
  .btn{padding:8px 16px;font-size:0.55rem;letter-spacing:0.15em}
  .title-sub{letter-spacing:0.25em}
}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="fx"></canvas>

<div class="scanlines"></div>
<div class="vignette"></div>
<div class="chromatic"></div>

<div class="beat-ring"></div>
<div class="beat-ring"></div>

<div class="corner tl"><svg viewBox="0 0 40 40"><path d="M0 40 L0 0 L40 0" stroke="#ff0070" stroke-width="1.5" fill="none" opacity="0.6"/><path d="M0 28 L0 0 L28 0" stroke="#ff0070" stroke-width="0.8" fill="none" opacity="0.25"/></svg></div>
<div class="corner tr"><svg viewBox="0 0 40 40"><path d="M0 40 L0 0 L40 0" stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.6"/><path d="M0 28 L0 0 L28 0" stroke="#00e5ff" stroke-width="0.8" fill="none" opacity="0.25"/></svg></div>
<div class="corner bl"><svg viewBox="0 0 40 40"><path d="M0 40 L0 0 L40 0" stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.6"/><path d="M0 28 L0 0 L28 0" stroke="#00e5ff" stroke-width="0.8" fill="none" opacity="0.25"/></svg></div>
<div class="corner br"><svg viewBox="0 0 40 40"><path d="M0 40 L0 0 L40 0" stroke="#ff0070" stroke-width="1.5" fill="none" opacity="0.6"/><path d="M0 28 L0 0 L28 0" stroke="#ff0070" stroke-width="0.8" fill="none" opacity="0.25"/></svg></div>

<div id="ui">
  <div class="title-wrap">
    <div class="title-main">PIXEL DANCE</div>
    <div class="title-sub">RHYTHM EDITION</div>
    <div class="title-line"></div>
  </div>
  <div class="btn-area">
    <button class="btn btn-start" id="btn-start">START GAME</button>
    <button class="btn btn-opt" id="btn-opt">OPTIONS</button>
  </div>
</div>

<script>
(function(){
  const bgC=document.getElementById('bg');
  const bgX=bgC.getContext('2d');
  const fxC=document.getElementById('fx');
  const fxX=fxC.getContext('2d');

  let W,H,horizonY;
  let time=0;
  const BPM=128;
  const beatInterval=60000/BPM;
  let lastBeat=0;
  let beatPulse=0;

  function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    [bgC,fxC].forEach(c=>{c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)});
    horizonY=H*0.45;
  }
  window.addEventListener('resize',resize);
  resize();

  // Stars
  const stars=[];
  for(let i=0;i<200;i++) stars.push({x:Math.random(),y:Math.random()*0.44,s:Math.random()*1.5+0.3,b:Math.random()*Math.PI*2,sp:Math.random()*0.04+0.01});

  // Highway notes
  const laneColors=[
    {r:255,g:0,b:112},
    {r:0,g:229,b:255},
    {r:255,g:220,b:0},
    {r:0,g:255,b:130}
  ];

  const notes=[];
  const patterns=[
    [0],[1],[2],[3],[0,2],[1],[3],[0],
    [1],[3],[0,2],[1],[3],[0],[2],[1],
    [0],[2],[1,3],[0],[2],[1],[3],[0],
    [0,3],[1,2],[0],[3],[1],[2],[0,1],[2,3]
  ];
  let patIdx=0;
  let beatAccum=0;
  const noteSpeed=0.018;

  function spawnNotes(lanes){
    lanes.forEach(li=>{
      notes.push({lane:li,y:-0.08,speed:noteSpeed*(0.92+Math.random()*0.16),alpha:1,phase:Math.random()*Math.PI*2});
    });
  }

  // Highway geometry
  let hwyTopW,hwyBotW,hwyX,hwyY,hwyH,hwyTopY,hwyBotY;

  function calcHighway(){
    const maxW=Math.min(W*0.65,W*0.55);
    hwyBotW=maxW;
    hwyTopW=maxW*0.28;
    hwyH=H*0.38;
    hwyY=horizonY+H*0.02;
    hwyTopY=hwyY;
    hwyBotY=hwyY+hwyH;
    hwyX=(W-hwyBotW)/2;
  }

  function drawBackground(){
    // Sky gradient
    const sky=bgX.createLinearGradient(0,0,0,horizonY+30);
    sky.addColorStop(0,'#020006');
    sky.addColorStop(0.25,'#050010');
    sky.addColorStop(0.55,'#0a0020');
    sky.addColorStop(0.8,'#150035');
    sky.addColorStop(1,'#200045');
    bgX.fillStyle=sky;
    bgX.fillRect(0,0,W,horizonY+30);

    // Stars
    for(const s of stars){
      const tw=0.15+0.85*Math.abs(Math.sin(time*s.sp+s.b));
      bgX.globalAlpha=tw*0.7;
      bgX.fillStyle='#fff';
      bgX.fillRect(s.x*W,s.y*H,s.s,s.s);
    }
    bgX.globalAlpha=1;

    // Sun
    const sunCX=W/2;
    const sunCY=horizonY-5;
    const sunR=Math.min(W,H)*0.11;

    // Sun glow layers
    for(let g=6;g>=0;g--){
      const r=sunR+g*sunR*0.5;
      const grd=bgX.createRadialGradient(sunCX,sunCY,r*0.15,sunCX,sunCY,r);
      grd.addColorStop(0,`rgba(255,0,100,${0.04-g*0.004})`);
      grd.addColorStop(1,'transparent');
      bgX.fillStyle=grd;
      bgX.fillRect(sunCX-r,sunCY-r,r*2,r*2);
    }

    // Sun body
    const sunGrad=bgX.createLinearGradient(sunCX,sunCY-sunR,sunCX,sunCY+sunR);
    sunGrad.addColorStop(0,'#ff0080');
    sunGrad.addColorStop(0.2,'#ff1060');
    sunGrad.addColorStop(0.45,'#ff4020');
    sunGrad.addColorStop(0.7,'#ff8000');
    sunGrad.addColorStop(1,'#ffcc00');
    bgX.beginPath();
    bgX.arc(sunCX,sunCY,sunR,0,Math.PI*2);
    bgX.fillStyle=sunGrad;
    bgX.fill();

    // Sun stripes
    bgX.save();
    bgX.globalCompositeOperation='destination-out';
    const stripes=12;
    for(let i=0;i<stripes;i++){
      const t=(i+1)/stripes;
      const y=sunCY-sunR+t*sunR*2;
      const h=1.5+t*12;
      if(y>sunCY-sunR*0.1){
        bgX.fillStyle=`rgba(0,0,0,${0.2+t*0.8})`;
        bgX.fillRect(sunCX-sunR-8,y,sunR*2+16,h);
      }
    }
    bgX.restore();

    // Horizon glow
    const hGlow=bgX.createLinearGradient(0,horizonY-50,0,horizonY+100);
    hGlow.addColorStop(0,'transparent');
    hGlow.addColorStop(0.35,'rgba(255,0,80,0.1)');
    hGlow.addColorStop(0.5,'rgba(255,0,80,0.18)');
    hGlow.addColorStop(0.65,'rgba(255,0,80,0.08)');
    hGlow.addColorStop(1,'transparent');
    bgX.fillStyle=hGlow;
    bgX.fillRect(0,horizonY-50,W,150);

    // Ground
    const ground=bgX.createLinearGradient(0,horizonY,0,H);
    ground.addColorStop(0,'#0a0015');
    ground.addColorStop(1,'#030008');
    bgX.fillStyle=ground;
    bgX.fillRect(0,horizonY,W,H-horizonY);

    // Perspective grid
    const gridScroll=(time*0.008)%1;
    const numV=30;
    const numH=40;

    // Vertical lines
    bgX.shadowBlur=4;
    bgX.shadowColor='#ff0070';
    for(let i=0;i<=numV;i++){
      const t=i/numV;
      const topX=W/2+(t-0.5)*hwyTopW*1.1;
      const botX=W/2+(t-0.5)*W*2.5;
      const alpha=0.06+Math.abs(t-0.5)*0.35;
      bgX.strokeStyle=`rgba(255,0,112,${alpha})`;
      bgX.lineWidth=0.6;
      bgX.beginPath();
      bgX.moveTo(topX,horizonY);
      bgX.lineTo(botX,H);
      bgX.stroke();
    }

    // Horizontal lines
    for(let i=0;i<numH;i++){
      const rawT=((i/numH-gridScroll)%1+1)%1;
      const t=rawT*rawT*rawT;
      const y=horizonY+t*(H-horizonY);
      const alpha=0.04+t*0.3;
      bgX.strokeStyle=`rgba(255,0,112,${alpha})`;
      bgX.lineWidth=0.4+t*0.6;
      bgX.beginPath();
      bgX.moveTo(0,y);
      bgX.lineTo(W,y);
      bgX.stroke();
    }
    bgX.shadowBlur=0;

    // Secondary grid (cyan, fainter)
    for(let i=0;i<=numV;i+=6){
      const t=i/numV;
      const topX=W/2+(t-0.5)*hwyTopW*1.1;
      const botX=W/2+(t-0.5)*W*2.5;
      bgX.strokeStyle='rgba(0,229,255,0.08)';
      bgX.lineWidth=0.4;
      bgX.beginPath();
      bgX.moveTo(topX,horizonY);
      bgX.lineTo(botX,H);
      bgX.stroke();
    }
  }

  function drawHighway(){
    calcHighway();
    const ctx=fxX;
    const topL=hwyX+(hwyBotW-hwyTopW)/2;
    const topR=topL+hwyTopW;

    // Highway shape
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(topL,hwyTopY);
    ctx.lineTo(topR,hwyTopY);
    ctx.lineTo(hwyX+hwyBotW,hwyBotY);
    ctx.lineTo(hwyX,hwyBotY);
    ctx.closePath();

    // Highway fill
    const hGrad=ctx.createLinearGradient(0,hwyTopY,0,hwyBotY);
    hGrad.addColorStop(0,'rgba(5,0,20,0.15)');
    hGrad.addColorStop(0.4,'rgba(8,0,30,0.4)');
    hGrad.addColorStop(1,'rgba(12,0,40,0.75)');
    ctx.fillStyle=hGrad;
    ctx.fill();

    // Highway border
    ctx.strokeStyle='rgba(0,229,255,0.35)';
    ctx.lineWidth=1.5;
    ctx.shadowBlur=8;
    ctx.shadowColor='#00e5ff';
    ctx.stroke();
    ctx.shadowBlur=0;

    // Lane dividers
    const lanes=4;
    for(let i=0;i<=lanes;i++){
      const t=i/lanes;
      const tlX=topL+t*hwyTopW;
      const blX=hwyX+t*hwyBotW;
      const alpha=0.06+t*0.12;
      ctx.strokeStyle=`rgba(255,255,255,${alpha})`;
      ctx.lineWidth=0.5;
      ctx.beginPath();
      ctx.moveTo(tlX,hwyTopY);
      ctx.lineTo(blX,hwyBotY);
      ctx.stroke();
    }

    // Lane color washes
    for(let i=0;i<lanes;i++){
      const t1=i/lanes,t2=(i+1)/lanes;
      const tlX=topL+t1*hwyTopW,trX=topL+t2*hwyTopW;
      const blX=hwyX+t1*hwyBotW,brX=hwyX+t2*hwyBotW;
      const col=laneColors[i];
      ctx.beginPath();
      ctx.moveTo(tlX,hwyTopY);
      ctx.lineTo(trX,hwyTopY);
      ctx.lineTo(brX,hwyBotY);
      ctx.lineTo(blX,hwyBotY);
      ctx.closePath();
      ctx.fillStyle=`rgba(${col.r},${col.g},${col.b},0.025)`;
      ctx.fill();
    }

    // Hit zone
    const hitY=hwyBotY-6;
    const hitL=hwyX+4,hitR=hwyX+hwyBotW-4;

    // Hit zone glow
    ctx.shadowBlur=15;
    ctx.shadowColor='#fff';
    ctx.strokeStyle='rgba(255,255,255,0.7)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(hitL,hitY);
    ctx.lineTo(hitR,hitY);
    ctx.stroke();

    // Hit zone secondary glow
    ctx.shadowBlur=25;
    ctx.shadowColor='#ff0070';
    ctx.strokeStyle='rgba(255,0,112,0.3)';
    ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(hitL,hitY);
    ctx.lineTo(hitR,hitY);
    ctx.stroke();
    ctx.shadowBlur=0;

    // Hit zone lane markers
    for(let i=0;i<=lanes;i++){
      const t=i/lanes;
      const x=hwyX+t*hwyBotW;
      ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.fillRect(x-1,hitY-2,2,4);
    }

    // Draw notes
    for(let i=notes.length-1;i>=0;i--){
      const n=notes[i];
      n.y+=n.speed;
      if(n.y>1.15){notes.splice(i,1);continue;}

      const ny=hwyTopY+n.y*(hwyBotY-hwyTopY);
      const nt=n.y;
      const laneW_top=hwyTopW/lanes;
      const laneW_bot=hwyBotW/lanes;
      const laneW=laneW_top+(laneW_bot-laneW_top)*nt;
      const laneL=topL+n.lane*laneW_top+(hwyX+n.lane*laneW_bot-topL-n.lane*laneW_top)*nt;

      const noteH=6+nt*8;
      const pad=laneW*0.12;
      const nx=laneL+pad;
      const nw=laneW-pad*2;
      const col=laneColors[n.lane];

      // Note glow
      ctx.shadowBlur=12+beatPulse*8;
      ctx.shadowColor=`rgba(${col.r},${col.g},${col.b},0.5)`;

      // Note body
      ctx.fillStyle=`rgba(${col.r},${col.g},${col.b},0.85)`;
      ctx.fillRect(nx,ny-noteH,nw,noteH);

      // Note highlight
      ctx.shadowBlur=0;
      ctx.fillStyle=`rgba(255,255,255,0.3)`;
      ctx.fillRect(nx,ny-noteH,nw,noteH*0.35);

      // Note inner pixel detail
      ctx.fillStyle=`rgba(255,255,255,0.15)`;
      const innerPad=2;
      ctx.fillRect(nx+innerPad,ny-noteH+innerPad,nw-innerPad*2,noteH-innerPad*2);

      // Note border
      ctx.strokeStyle=`rgba(255,255,255,0.4)`;
      ctx.lineWidth=0.5;
      ctx.strokeRect(nx,ny-noteH,nw,noteH);
    }

    ctx.restore();
  }

  // Floating particles
  const particles=[];
  for(let i=0;i<50;i++) particles.push({
    x:Math.random()*2000,y:Math.random()*1200,
    vx:(Math.random()-0.5)*0.15,vy:-Math.random()*0.2-0.03,
    s:Math.random()*2+0.5,c:Math.random()>0.5?0:1,
    a:Math.random()*0.2+0.03,phase:Math.random()*Math.PI*2
  });

  function drawParticles(){
    const ctx=bgX;
    for(const p of particles){
      p.x+=p.vx;p.y+=p.vy;
      if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}
      if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;
      const pulse=0.4+0.6*Math.sin(time*0.015+p.phase);
      ctx.globalAlpha=p.a*pulse;
      ctx.fillStyle=p.c?'rgb(255,0,112)':'rgb(0,229,255)';
      ctx.fillRect(p.x,p.y,p.s,p.s);
    }
    ctx.globalAlpha=1;
  }

  // Main loop
  let lastT=performance.now();
  function loop(now){
    const dt=now-lastT;
    lastT=now;
    time++;

    // Beat tracking
    if(now-lastBeat>=beatInterval){
      lastBeat=now;
      beatPulse=1;
    }
    beatPulse*=0.92;

    bgX.clearRect(0,0,W,H);
    fxX.clearRect(0,0,W,H);

    drawBackground();
    drawParticles();

    // Spawn notes on beats
    beatAccum++;
    const beatsPerSpawn=2;
    if(beatAccum>=beatsPerSpawn){
      beatAccum=0;
      spawnNotes(patterns[patIdx%patterns.length]);
      patIdx++;
    }

    drawHighway();

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);

  // Button flash
  document.getElementById('btn-start').addEventListener('click',()=>{
    document.body.style.transition='filter 0.08s';
    document.body.style.filter='brightness(2.5) saturate(1.5)';
    setTimeout(()=>{document.body.style.filter='brightness(1)';},80);
  });
  document.getElementById('btn-opt').addEventListener('click',()=>{
    document.body.style.transition='filter 0.08s';
    document.body.style.filter='brightness(1.8) saturate(1.3)';
    setTimeout(()=>{document.body.style.filter='none';},100);
  });

})();
</script>
</body>
