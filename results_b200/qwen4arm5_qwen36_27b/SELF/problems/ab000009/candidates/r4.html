<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess</title>
    <style>
        :root {
            --bg-primary: #0e0e12;
            --bg-surface: #18181f;
            --bg-elevated: #1e1e28;
            --bg-hover: #252530;
            --border-subtle: rgba(255, 255, 255, 0.04);
            --border-medium: rgba(255, 255, 255, 0.07);
            --border-strong: rgba(255, 255, 255, 0.12);
            --text-primary: #e8e4dc;
            --text-secondary: #9a9590;
            --text-tertiary: #5e5a56;
            --accent: #c8a84e;
            --accent-dim: rgba(200, 168, 78, 0.12);
            --accent-glow: rgba(200, 168, 78, 0.2);
            --board-light: #f2e8d5;
            --board-dark: #7d9168;
            --highlight-from: rgba(200, 168, 78, 0.35);
            --highlight-to: rgba(200, 168, 78, 0.42);
            --hint-move: rgba(0, 0, 0, 0.13);
            --hint-capture: rgba(0, 0, 0, 0.13);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container {
            display: flex;
            gap: 32px;
            padding: 40px;
            max-width: 1100px;
            width: 100%;
            align-items: flex-start;
            position: relative;
        }

        /* ========== BOARD ========== */
        .board-section {
            flex-shrink: 0;
            position: relative;
        }

        .board-frame {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 16px;
            border: 1px solid var(--border-subtle);
            box-shadow:
                0 4px 40px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.02) inset;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 560px;
            height: 560px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
        }

        .square {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.15s ease;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }

        .square.selected {
            background-color: var(--highlight-from) !important;
        }

        .square.last-from {
            background-color: var(--highlight-from) !important;
        }

        .square.last-to {
            background-color: var(--highlight-to) !important;
        }

        .square.hint-move::after {
            content: '';
            position: absolute;
            width: 26%;
            height: 26%;
            border-radius: 50%;
            background: var(--hint-move);
            pointer-events: none;
            z-index: 2;
        }

        .square.hint-capture::after {
            content: '';
            position: absolute;
            width: 84%;
            height: 84%;
            border-radius: 50%;
            border: 3px solid var(--hint-capture);
            background: transparent;
            pointer-events: none;
            z-index: 2;
        }

        .coord {
            position: absolute;
            font-size: 9.5px;
            font-weight: 600;
            pointer-events: none;
            z-index: 3;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .square:hover .coord { opacity: 0.85; }

        .coord-rank { top: 4px; left: 5px; }
        .coord-file { bottom: 4px; right: 5px; }

        .square.light .coord { color: var(--board-dark); }
        .square.dark .coord { color: var(--board-light); }

        .piece-container {
            width: 80%;
            height: 80%;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1);
        }

        .square:hover .piece-container {
            transform: translateY(-2px) scale(1.04);
        }

        .piece-container svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.25));
        }

        .square:hover .piece-container svg {
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 560px;
            max-width: 340px;
        }

        .panel {
            background: var(--bg-surface);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            overflow: hidden;
        }

        /* Player Panels */
        .player-panel {
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            transition: all 0.3s ease;
        }

        .player-panel.active {
            background: linear-gradient(135deg, var(--accent-dim), transparent);
            border-color: rgba(200, 168, 78, 0.15);
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .player-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }

        .player-icon svg {
            width: 24px;
            height: 24px;
        }

        .player-icon.white-icon {
            background: linear-gradient(145deg, #f5eed8, #ddd2b8);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .player-icon.black-icon {
            background: linear-gradient(145deg, #2a2a35, #1a1a24);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .player-icon .active-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: 2.5px solid var(--bg-surface);
            background: var(--text-tertiary);
            transition: all 0.3s ease;
        }

        .player-panel.active .active-dot {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
            border-color: var(--bg-surface);
        }

        .player-details { min-width: 0; }

        .player-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.01em;
        }

        .player-rating {
            font-size: 11.5px;
            color: var(--text-tertiary);
            margin-top: 2px;
            font-weight: 400;
        }

        .player-timer {
            font-family: "SF Mono", "Cascadia Code", "Fira Code", "Consolas", "Courier New", monospace;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            transition: all 0.3s ease;
            flex-shrink: 0;
            min-width: 90px;
            text-align: center;
        }

        .player-panel.active .player-timer {
            color: var(--accent);
            background: rgba(200, 168, 78, 0.06);
            border-color: rgba(200, 168, 78, 0.12);
        }

        /* Status */
        .status-bar {
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(200, 168, 78, 0.4); }
            50% { opacity: 0.6; box-shadow: 0 0 0 5px rgba(200, 168, 78, 0); }
        }

        .status-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.01em;
        }

        /* Move History */
        .history-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 220px;
        }

        .history-header {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .history-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--text-tertiary);
        }

        .history-badge {
            font-size: 10px;
            color: var(--text-tertiary);
            font-family: "SF Mono", "Cascadia Code", "Fira Code", "Consolas", monospace;
            font-weight: 500;
        }

        .history-body {
            flex: 1;
            overflow-y: auto;
            padding: 6px 0;
        }

        .history-body::-webkit-scrollbar { width: 3px; }
        .history-body::-webkit-scrollbar-track { background: transparent; }
        .history-body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.05); border-radius: 3px; }

        .move-entry {
            display: flex;
            align-items: center;
            padding: 2px 18px;
            transition: background 0.12s;
        }

        .move-entry:hover { background: rgba(255, 255, 255, 0.015); }
        .move-entry.current { background: var(--accent-dim); }

        .move-number {
            width: 28px;
            font-size: 11px;
            color: var(--text-tertiary);
            font-family: "SF Mono", "Cascadia Code", "Fira Code", "Consolas", monospace;
            text-align: right;
            padding-right: 12px;
            flex-shrink: 0;
        }

        .move-text {
            flex: 1;
            font-size: 13.5px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.12s;
            font-family: "SF Mono", "Cascadia Code", "Fira Code", "Consolas", monospace;
            letter-spacing: 0.02em;
            color: var(--text-secondary);
            min-height: 28px;
            display: flex;
            align-items: center;
        }

        .move-text:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--accent);
        }

        .move-text.active-move {
            color: var(--accent);
            background: rgba(200, 168, 78, 0.08);
        }

        /* Controls */
        .controls-panel {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .controls-row {
            display: flex;
            gap: 8px;
        }

        .ctrl-btn {
            flex: 1;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            background: transparent;
            color: var(--text-secondary);
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-family: inherit;
            letter-spacing: 0.01em;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: var(--border-medium);
            color: var(--text-primary);
        }

        .ctrl-btn:active { transform: scale(0.97); }

        .ctrl-btn svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .ctrl-btn-primary {
            background: linear-gradient(135deg, #c8a84e, #a8903e);
            color: #1a1a1a;
            border-color: transparent;
            font-weight: 600;
            letter-spacing: 0.02em;
            box-shadow: 0 2px 12px rgba(200, 168, 78, 0.15);
            padding: 11px 12px;
        }

        .ctrl-btn-primary:hover {
            background: linear-gradient(135deg, #d4b458, #c8a84e);
            box-shadow: 0 4px 20px rgba(200, 168, 78, 0.25);
            color: #1a1a1a;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 980px) {
            .app-container {
                flex-direction: column;
                align-items: center;
                padding: 20px;
                overflow-y: auto;
                height: auto;
            }
            body { overflow-y: auto; height: auto; }
            .board { width: min(80vw, 460px); height: min(80vw, 460px); }
            .sidebar { width: 100%; max-width: 460px; min-height: auto; }
        }

        @media (max-width: 520px) {
            .board { width: calc(100vw - 48px); height: calc(100vw - 48px); }
            .board-frame { padding: 10px; }
            .app-container { padding: 12px; gap: 16px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Board Section -->
    <div class="board-section">
        <div class="board-frame">
            <div class="board" id="chessboard"></div>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">

        <!-- White Player -->
        <div class="panel player-panel active" id="whiteCard">
            <div class="player-left">
                <div class="player-icon white-icon">
                    <svg viewBox="0 0 45 45" fill="none">
                        <g fill="#3a3226" stroke="#3a3226" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22.5 6.5v5M19.5 9.5h6"/>
                            <path d="M22.5 20.5c-2-2-5.5-3-5.5-6a5.5 5.5 0 0 1 11 0c0 3-3.5 4-5.5 6z"/>
                            <path d="M11.5 30c5.5 1.5 15.5 1.5 21 0l1-5.5h-23l1 5.5z"/>
                            <path d="M12.5 24.5c6 1 14 1 20 0"/>
                            <path d="M11.5 30c0 3 2 5.5 5.5 5.5h15c3.5 0 5.5-2.5 5.5-5.5"/>
                            <path d="M11.5 30c0 3-1.5 5.5 0 8.5h22c1.5-3 0-5.5 0-8.5"/>
                        </g>
                    </svg>
                    <div class="active-dot"></div>
                </div>
                <div class="player-details">
                    <div class="player-name">White</div>
                    <div class="player-rating">2450 Elo</div>
                </div>
            </div>
            <div class="player-timer" id="whiteClock">10:00</div>
        </div>

        <!-- Status Bar -->
        <div class="panel status-bar">
            <div class="status-indicator"></div>
            <span class="status-label" id="statusText">White to Move</span>
        </div>

        <!-- Move History -->
        <div class="panel history-panel">
            <div class="history-header">
                <span class="history-title">Move History</span>
                <span class="history-badge" id="moveCount">0 moves</span>
            </div>
            <div class="history-body" id="moveHistory"></div>
        </div>

        <!-- Black Player -->
        <div class="panel player-panel" id="blackCard">
            <div class="player-left">
                <div class="player-icon black-icon">
                    <svg viewBox="0 0 45 45" fill="none">
                        <g fill="#c8c4d0" stroke="#c8c4d0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22.5 6.5v5M19.5 9.5h6"/>
                            <path d="M22.5 20.5c-2-2-5.5-3-5.5-6a5.5 5.5 0 0 1 11 0c0 3-3.5 4-5.5 6z"/>
                            <path d="M11.5 30c5.5 1.5 15.5 1.5 21 0l1-5.5h-23l1 5.5z"/>
                            <path d="M12.5 24.5c6 1 14 1 20 0"/>
                            <path d="M11.5 30c0 3 2 5.5 5.5 5.5h15c3.5 0 5.5-2.5 5.5-5.5"/>
                            <path d="M11.5 30c0 3-1.5 5.5 0 8.5h22c1.5-3 0-5.5 0-8.5"/>
                        </g>
                    </svg>
                    <div class="active-dot"></div>
                </div>
                <div class="player-details">
                    <div class="player-name">Black</div>
                    <div class="player-rating">2380 Elo</div>
                </div>
            </div>
            <div class="player-timer" id="blackClock">10:00</div>
        </div>

        <!-- Controls -->
        <div class="panel controls-panel">
            <div class="controls-row">
                <button class="ctrl-btn" onclick="resetGame()">
                    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 7v5h5"/></svg>
                    Reset
                </button>
                <button class="ctrl-btn">
                    <svg viewBox="0 0 24 24"><path d="M2 22l1-1h3l9-9"/><path d="M3 21V3l18 18H3z"/><path d="M14 4l6 6"/></svg>
                    Analyze
                </button>
            </div>
            <button class="ctrl-btn ctrl-btn-primary" onclick="resetGame()">
                New Game
            </button>
        </div>
    </div>
</div>
