<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess</title>
    <style>
        :root {
            --bg-primary: #0c0c12;
            --bg-secondary: #14141c;
            --bg-tertiary: #1a1a24;
            --bg-card: #16161f;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-accent: rgba(255, 255, 255, 0.1);
            --text-primary: #e8e6e3;
            --text-secondary: #8a8a96;
            --text-muted: #5a5a66;
            --accent-gold: #c9a84c;
            --accent-gold-dim: rgba(201, 168, 76, 0.15);
            --board-dark: #3d5a4c;
            --board-light: #e2d8c4;
            --highlight-from: rgba(201, 168, 76, 0.35);
            --highlight-to: rgba(201, 168, 76, 0.25);
            --highlight-move: rgba(201, 168, 76, 0.12);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.6);
            --shadow-lg: 0 16px 64px rgba(0, 0, 0, 0.8);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-primary);
            background-image: radial-gradient(ellipse at 20% 50%, rgba(61, 90, 76, 0.08) 0%, transparent 60%),
                              radial-gradient(ellipse at 80% 50%, rgba(201, 168, 76, 0.04) 0%, transparent 60%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container {
            display: flex;
            gap: 32px;
            padding: 24px;
            max-width: 1100px;
            width: 100%;
            align-items: flex-start;
        }

        /* === BOARD SECTION === */
        .board-section {
            position: relative;
            flex-shrink: 0;
        }

        .board-frame {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 12px;
            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.04);
            border: 1px solid var(--border-subtle);
        }

        .board-inner {
            position: relative;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 560px;
            height: 560px;
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .square {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }

        .square.selected-from {
            background-color: var(--highlight-from) !important;
        }

        .square.selected-to {
            background-color: var(--highlight-to) !important;
        }

        .square.possible-move::after {
            content: '';
            position: absolute;
            width: 22%;
            height: 22%;
            border-radius: 50%;
            background: var(--highlight-move);
            pointer-events: none;
        }

        .square.capture-move::after {
            content: '';
            position: absolute;
            width: 88%;
            height: 88%;
            border-radius: 50%;
            border: 3px solid var(--highlight-move);
            background: transparent;
            pointer-events: none;
        }

        /* Coordinates */
        .coord-label {
            position: absolute;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.02em;
            pointer-events: none;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .square:hover .coord-label { opacity: 1; }

        .coord-rank {
            top: 3px;
            left: 4px;
        }

        .coord-file {
            bottom: 3px;
            right: 4px;
        }

        .square.light .coord-label { color: var(--board-dark); }
        .square.dark .coord-label { color: var(--board-light); }

        /* Pieces */
        .piece {
            width: 80%;
            height: 80%;
            position: relative;
            z-index: 2;
            transition: transform 0.12s cubic-bezier(0.2, 0, 0.2, 1);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .square:hover .piece {
            transform: translateY(-2px) scale(1.04);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }

        .piece svg {
            width: 100%;
            height: 100%;
        }

        /* === SIDEBAR === */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 584px;
            max-width: 380px;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        /* Player Status Cards */
        .player-card {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s;
        }

        .player-card.active {
            background: linear-gradient(135deg, rgba(201, 168, 76, 0.08), rgba(201, 168, 76, 0.02));
            border-color: rgba(201, 168, 76, 0.2);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .player-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            position: relative;
        }

        .player-avatar.white-avatar {
            background: linear-gradient(135deg, #f5f0e8, #d4cbb8);
            color: #2a2a2a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .player-avatar.black-avatar {
            background: linear-gradient(135deg, #2a2a32, #1a1a22);
            color: #e8e6e3;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .player-avatar .status-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2.5px solid var(--bg-card);
            transition: background 0.3s;
        }

        .player-card.active .status-dot {
            background: var(--accent-gold);
            box-shadow: 0 0 8px rgba(201, 168, 76, 0.6);
        }

        .player-card:not(.active) .status-dot {
            background: var(--text-muted);
        }

        .player-name {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .player-title {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .player-clock {
            font-family: "SF Mono", "Cascadia Code", "Fira Code", "Consolas", monospace;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
            padding: 6px 14px;
            background: rgba(0,0,0,0.25);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            transition: all 0.3s;
        }

        .player-card.active .player-clock {
            color: var(--text-primary);
            background: rgba(201, 168, 76, 0.1);
            border-color: rgba(201, 168, 76, 0.2);
        }

        /* Move History */
        .history-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 240px;
        }

        .history-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .history-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .history-count {
            font-size: 11px;
            color: var(--text-muted);
            font-family: "SF Mono", monospace;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        .move-row {
            display: flex;
            align-items: center;
            padding: 5px 20px;
            transition: background 0.15s;
        }

        .move-row:hover {
            background: rgba(255,255,255,0.02);
        }

        .move-row.latest {
            background: rgba(201, 168, 76, 0.06);
        }

        .move-num {
            width: 32px;
            font-size: 12px;
            color: var(--text-muted);
            font-family: "SF Mono", monospace;
            text-align: right;
            padding-right: 16px;
            flex-shrink: 0;
        }

        .move-cell {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: "SF Mono", "Cascadia Code", monospace;
            letter-spacing: 0.02em;
        }

        .move-cell:hover {
            background: rgba(255,255,255,0.06);
            color: var(--accent-gold);
        }

        .move-cell.latest-move {
            color: var(--accent-gold);
        }

        /* Controls */
        .controls-card {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn:hover {
            background: rgba(255,255,255,0.04);
            border-color: var(--border-accent);
            color: var(--text-primary);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-gold), #b8943f);
            color: #1a1a1a;
            border-color: transparent;
            font-weight: 600;
            letter-spacing: 0.02em;
            box-shadow: 0 2px 12px rgba(201, 168, 76, 0.25);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #d4b35a, #c9a84c);
            box-shadow: 0 4px 20px rgba(201, 168, 76, 0.35);
            color: #1a1a1a;
        }

        .btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        /* Game Status Bar */
        .status-bar {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .status-pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-gold);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(201, 168, 76, 0.4); }
            50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(201, 168, 76, 0); }
        }

        .status-text {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 960px) {
            .app-container {
                flex-direction: column;
                align-items: center;
                padding: 16px;
                overflow-y: auto;
            }
            body { overflow-y: auto; height: auto; }
            .board-inner { width: min(85vw, 480px); height: min(85vw, 480px); }
            .sidebar { width: 100%; max-width: 480px; min-height: auto; }
        }
    </style>
</head>

<div class="app-container">
    <!-- Board Section -->
    <div class="board-section">
        <div class="board-frame">
            <div class="board-inner" id="chessboard"></div>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        
        <!-- White Player -->
        <div class="card player-card" id="whiteCard">
            <div class="player-info">
                <div class="player-avatar white-avatar">
                    ♔
                    <div class="status-dot"></div>
                </div>
                <div>
                    <div class="player-name">White</div>
                    <div class="player-title">2450 Elo</div>
                </div>
            </div>
            <div class="player-clock" id="whiteClock">10:00</div>
        </div>

        <!-- Status Bar -->
        <div class="card status-bar">
            <div class="status-pulse"></div>
            <span class="status-text" id="statusText">White to Move</span>
        </div>

        <!-- Move History -->
        <div class="card history-card">
            <div class="history-header">
                <span class="history-title">Move History</span>
                <span class="history-count" id="moveCount">0 moves</span>
            </div>
            <div class="history-list" id="moveHistory"></div>
        </div>

        <!-- Black Player -->
        <div class="card player-card" id="blackCard">
            <div class="player-info">
                <div class="player-avatar black-avatar">
                    ♚
                    <div class="status-dot"></div>
                </div>
                <div>
                    <div class="player-name">Black</div>
                    <div class="player-title">2380 Elo</div>
                </div>
            </div>
            <div class="player-clock" id="blackClock">10:00</div>
        </div>

        <!-- Controls -->
        <div class="card controls-card">
            <div class="btn-row">
                <button class="btn" onclick="resetGame()">
                    <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    Reset
                </button>
                <button class="btn">
                    <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    Analyze
                </button>
            </div>
            <button class="btn btn-primary" onclick="resetGame()">
                New Game
            </button>
        </div>
    </div>
</div>

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function updateClocks() {
        whiteClock.textContent = formatTime(whiteTime);
        blackClock.textContent = formatTime(blackTime);
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (turn === 'w') {
                whiteTime = Math.max(0, whiteTime - 1);
            } else {
                blackTime = Math.max(0, blackTime - 1);
            }
            updateClocks();
        }, 1000);
    }

    function renderBoard() {
        boardEl.innerHTML = '';
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.dataset.row = r;
                square.dataset.col = c;
                square.onclick = () => handleSquareClick(r, c);

                // Coordinates
                if (c === 0) {
                    const rank = document.createElement('span');
                    rank.className = 'coord-label coord-rank';
                    rank.innerText = 8 - r;
                    square.appendChild(rank);
                }
                if (r === 7) {

                    file.className = 'coord-label coord-file';
                    file.innerText = String.fromCharCode(97 + c);
                    square.appendChild(file);
                }

                // Piece

                if (pieceCode) {
                    const piece = document.createElement('div');
                    piece.className = 'piece';
                    piece.innerHTML = PIECE_SVGS[pieceCode];

                // Selection highlights

                }

                // Show possible moves for selected piece
                if (selectedSquare && isValidMove(selectedSquare.r, selectedSquare.c, r, c)) {
                    if (board[r][c]) {

                    } else {

                    }

    // Simplified move validation for demo
    function isValidMove(fromR, fromC, toR, toC) {
        if (fromR === toR && fromC === toC) return false;
        const piece = board[fromR][fromC];
        if (!piece) return false;
        
        const target = board[toR][toC];
        if (target && target[0] === piece[0]) return false; // Can't capture own piece

        const type = piece[1];
        const dr = toR - fromR;
        const dc = toC - fromC;

        switch(type) {
            case 'P': {
                const dir = piece[0] === 'w' ? -1 : 1;
                const startRow = piece[0] === 'w' ? 6 : 1;
                // Forward one
                if (dc === 0 && dr === dir && !target) return true;
                // Forward two from start
                if (dc === 0 && dr === 2 * dir && fromR === startRow && !target && !board[fromR + dir][fromC]) return true;
                // Capture
                if (Math.abs(dc) === 1 && dr === dir && target) return true;
                return false;
            }
            case 'R': {
                if (dr !== 0 && dc !== 0) return false;
                return isPathClear(fromR, fromC, toR, toC);
            }
            case 'B': {
                if (Math.abs(dr) !== Math.abs(dc)) return false;
                return isPathClear(fromR, fromC, toR, toC);
            }
            case 'Q': {
                if (dr !== 0 && dc !== 0 && Math.abs(dr) !== Math.abs(dc)) return false;
                return isPathClear(fromR, fromC, toR, toC);
            }
            case 'N': {
                return (Math.abs(dr) === 2 && Math.abs(dc) === 1) || (Math.abs(dr) === 1 && Math.abs(dc) === 2);
            }
            case 'K': {
                return Math.abs(dr) <= 1 && Math.abs(dc) <= 1;
            }
        }
        return false;
    }

    function isPathClear(fromR, fromC, toR, toC) {
        const dr = Math.sign(toR - fromR);
        const dc = Math.sign(toC - fromC);
        let r = fromR + dr;
        let c = fromC + dc;
        while (r !== toR || c !== toC) {
            if (board[r][c]) return false;
            r += dr;
            c += dc;
        }
        return true;
    }
