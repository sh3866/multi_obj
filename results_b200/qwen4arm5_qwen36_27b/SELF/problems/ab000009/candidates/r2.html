<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess</title>
    <style>
        :root {
            --bg-base: #0a0a0f;
            --bg-surface: #13131d;
            --bg-elevated: #1a1a27;
            --bg-hover: #222233;
            --border-primary: rgba(255, 255, 255, 0.06);
            --border-secondary: rgba(255, 255, 255, 0.03);
            --text-primary: #e4e4ed;
            --text-secondary: #7a7a8e;
            --text-tertiary: #4a4a5a;
            --accent: #c8a84e;
            --accent-glow: rgba(200, 168, 78, 0.15);
            --accent-dim: rgba(200, 168, 78, 0.08);
            --board-dark: #2a3a32;
            --board-light: #d4c4a8;
            --board-dark-alt: #354840;
            --board-light-alt: #e0d4bc;
            --highlight-from: rgba(200, 168, 78, 0.3);
            --highlight-to: rgba(200, 168, 78, 0.2);
            --highlight-move: rgba(200, 168, 78, 0.18);
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 80px rgba(0, 0, 0, 0.6);
            --radius: 10px;
            --radius-lg: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-base);
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(42, 58, 50, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(200, 168, 78, 0.02) 0%, transparent 50%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container {
            display: flex;
            gap: 28px;
            padding: 20px;
            max-width: 1080px;
            width: 100%;
            align-items: flex-start;
        }

        /* === BOARD === */
        .board-section {
            position: relative;
            flex-shrink: 0;
        }

        .board-frame {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 10px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-primary);
        }

        .board-inner {
            position: relative;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 540px;
            height: 540px;
            border-radius: 4px;
            overflow: hidden;
        }

        .square {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.12s ease;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }

        .square.selected-from {
            background-color: var(--highlight-from) !important;
        }

        .square.selected-to {
            background-color: var(--highlight-to) !important;
        }

        .square.possible-move::after {
            content: '';
            position: absolute;
            width: 26%;
            height: 26%;
            border-radius: 50%;
            background: var(--highlight-move);
            pointer-events: none;
            z-index: 1;
        }

        .square.capture-move::after {
            content: '';
            position: absolute;
            width: 86%;
            height: 86%;
            border-radius: 50%;
            border: 3px solid var(--highlight-move);
            background: transparent;
            pointer-events: none;
            z-index: 1;
        }

        .coord-label {
            position: absolute;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.01em;
            pointer-events: none;
            opacity: 0.55;
            transition: opacity 0.2s;
            z-index: 3;
            font-family: "SF Mono", "Cascadia Code", "Fira Code", "Consolas", monospace;
        }

        .square:hover .coord-label { opacity: 0.9; }

        .coord-rank { top: 3px; left: 4px; }
        .coord-file { bottom: 3px; right: 4px; }

        .square.light .coord-label { color: var(--board-dark); }
        .square.dark .coord-label { color: var(--board-light); }

        .piece {
            width: 78%;
            height: 78%;
            position: relative;
            z-index: 2;
            transition: transform 0.1s cubic-bezier(0.2, 0, 0.2, 1);
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35));
        }

        .square:hover .piece {
            transform: translateY(-2px) scale(1.03);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.45));
        }

        .piece svg { width: 100%; height: 100%; }

        /* === SIDEBAR === */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 580px;
            max-width: 360px;
        }

        .card {
            background: var(--bg-surface);
            border-radius: var(--radius);
            border: 1px solid var(--border-primary);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }

        /* Player Cards */
        .player-card {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .player-card.active {
            background: linear-gradient(135deg, rgba(200, 168, 78, 0.06), rgba(200, 168, 78, 0.01));
            border-color: rgba(200, 168, 78, 0.15);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            position: relative;
            flex-shrink: 0;
        }

        .player-avatar.white-avatar {
            background: linear-gradient(145deg, #e8dcc8, #c8bca8);
            color: #2a2a2a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.4);
        }

        .player-avatar.black-avatar {
            background: linear-gradient(145deg, #2a2a36, #1a1a24);
            color: #d0d0da;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .player-avatar .status-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            border: 2.5px solid var(--bg-surface);
            transition: all 0.3s ease;
        }

        .player-card.active .status-dot {
            background: var(--accent);
            box-shadow: 0 0 8px rgba(200, 168, 78, 0.5);
        }

        .player-card:not(.active) .status-dot {
            background: var(--text-tertiary);
        }

        .player-name {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--text-primary);
        }

        .player-title {
            font-size: 10.5px;
            color: var(--text-tertiary);
            margin-top: 1px;
            font-weight: 500;
        }

        .player-clock {
            font-family: "SF Mono", "Cascadia Code", "Fira Code", "Consolas", monospace;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            padding: 6px 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            border: 1px solid var(--border-secondary);
            transition: all 0.3s ease;
            min-width: 72px;
            text-align: center;
        }

        .player-card.active .player-clock {
            color: var(--text-primary);
            background: rgba(200, 168, 78, 0.08);
            border-color: rgba(200, 168, 78, 0.15);
        }

        /* Status Bar */
        .status-bar {
            padding: 11px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-pulse {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(200, 168, 78, 0.4); }
            50% { opacity: 0.6; box-shadow: 0 0 0 5px rgba(200, 168, 78, 0); }
        }

        .status-text {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.01em;
        }

        /* Move History */
        .history-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 220px;
        }

        .history-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .history-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-tertiary);
        }

        .history-count {
            font-size: 10px;
            color: var(--text-tertiary);
            font-family: "SF Mono", monospace;
            font-weight: 500;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 0;
        }

        .history-list::-webkit-scrollbar { width: 3px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

        .move-row {
            display: flex;
            align-items: center;
            padding: 4px 16px;
            transition: background 0.15s;
            border-bottom: 1px solid var(--border-secondary);
        }

        .move-row:hover { background: rgba(255,255,255,0.015); }

        .move-row.latest {
            background: rgba(200, 168, 78, 0.04);
        }

        .move-num {
            width: 28px;
            font-size: 11px;
            color: var(--text-tertiary);
            font-family: "SF Mono", monospace;
            text-align: right;
            padding-right: 14px;
            flex-shrink: 0;
        }

        .move-cell {
            flex: 1;
            font-size: 12.5px;
            font-weight: 500;
            padding: 3px 6px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: "SF Mono", "Cascadia Code", monospace;
            letter-spacing: 0.02em;
            color: var(--text-secondary);
        }

        .move-cell:hover {
            background: rgba(255,255,255,0.04);
            color: var(--accent);
        }

        .move-cell.latest-move {
            color: var(--accent);
        }

        /* Controls */
        .controls-card {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 9px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-primary);
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-family: inherit;
            letter-spacing: 0.01em;
        }

        .btn:hover {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }

        .btn:active { transform: scale(0.98); }

        .btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .btn-primary {
            background: linear-gradient(135deg, #c8a84e, #a88a3a);
            color: #1a1a1a;
            border-color: transparent;
            font-weight: 600;
            letter-spacing: 0.02em;
            box-shadow: 0 2px 12px rgba(200, 168, 78, 0.2);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #d4b45a, #c8a84e);
            box-shadow: 0 4px 20px rgba(200, 168, 78, 0.3);
            color: #1a1a1a;
        }

        /* Responsive */
        @media (max-width: 920px) {
            .app-container {
                flex-direction: column;
                align-items: center;
                padding: 16px;
                overflow-y: auto;
            }
            body { overflow-y: auto; height: auto; }
            .board-inner { width: min(85vw, 440px); height: min(85vw, 440px); }
            .sidebar { width: 100%; max-width: 440px; min-height: auto; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Board Section -->
    <div class="board-section">
        <div class="board-frame">
            <div class="board-inner" id="chessboard"></div>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">

        <!-- White Player -->
        <div class="card player-card active" id="whiteCard">
            <div class="player-info">
                <div class="player-avatar white-avatar">
                    ♔
                    <div class="status-dot"></div>
                </div>
                <div>
                    <div class="player-name">White</div>
                    <div class="player-title">2450 Elo</div>
                </div>
            </div>
            <div class="player-clock" id="whiteClock">10:00</div>
        </div>

        <!-- Status Bar -->
        <div class="card status-bar">
            <div class="status-pulse"></div>
            <span class="status-text" id="statusText">White to Move</span>
        </div>

        <!-- Move History -->
        <div class="card history-card">
            <div class="history-header">
                <span class="history-title">Move History</span>
                <span class="history-count" id="moveCount">0 moves</span>
            </div>
            <div class="history-list" id="moveHistory"></div>
        </div>

        <!-- Black Player -->
        <div class="card player-card" id="blackCard">
            <div class="player-info">
                <div class="player-avatar black-avatar">
                    ♚
                    <div class="status-dot"></div>
                </div>
                <div>
                    <div class="player-name">Black</div>
                    <div class="player-title">2380 Elo</div>
                </div>
            </div>
            <div class="player-clock" id="blackClock">10:00</div>
        </div>

        <!-- Controls -->
        <div class="card controls-card">
            <div class="btn-row">
                <button class="btn" onclick="resetGame()">
                    <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    Reset
                </button>
                <button class="btn">
                    <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    Analyze
                </button>
            </div>
            <button class="btn btn-primary" onclick="resetGame()">
                New Game
            </button>
        </div>
    </div>
</div>
