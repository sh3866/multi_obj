<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup - The Garden</title>
    <style>
        :root {
            /* Palette: Warm Storybook */
            --bg-paper: #FDFBF7;
            --bg-paper-dark: #EBE3D5;
            
            /* Typography */
            --text-title: #4A3B32;
            --text-subtitle: #749F84; /* Sage Green */
            --text-ui: #5D4037;
            
            /* Board & Grid */
            --frame-wood: #795548;
            --frame-shadow: #5D4037;
            --grid-bg: #F2EBE5;
            --grid-line: #D7CCC8; /* Soft Taupe */
            
            /* Paths */
            --path-inactive: #E0D6CC;
            --path-active: #D87D4A; /* Vibrant Terracotta */
            
            /* Buttons */
            --btn-run: #689F38; /* Lush Green */
            --btn-run-shadow: #558B2F;
            --btn-reset: #D7CCC8;
            --btn-reset-shadow: #BCAAA4;

            /* Dimensions */
            --board-size: min(85vw, 480px);
            --grid-gap: 2px;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            /* System fallbacks for rounded/playful sans */
            font-family: 'Nunito', 'Quicksand', 'Varela Round', 'Segoe UI', sans-serif;
            color: var(--text-ui);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* CSS Noise Texture */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 24px; /* 24px gap per critique */
            position: relative;
            z-index: 2;
        }

        h1 {
            /* Playful, chunky serif fallbacks */
            font-family: 'Fredoka One', 'Chewy', 'Brush Script MT', 'Comic Sans MS', cursive;
            font-size: 3.5rem;
            margin: 0;
            color: var(--text-title);
            line-height: 1.1;
            letter-spacing: 1px;
            transform: rotate(-1deg);
            text-shadow: 2px 2px 0px rgba(255,255,255,0.9);
        }

        .level-info {
            font-family: 'Nunito', 'Quicksand', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-subtitle);
            margin-top: 16px; /* Spacing between title and subtitle */
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
        }
        
        /* Decorative lines for subtitle */
        .level-info::before, .level-info::after {
            content: '';
            display: block;
            width: 24px;
            height: 2px;
            background: var(--text-subtitle);
            border-radius: 2px;
            opacity: 0.6;
        }

        /* --- Game Board --- */
        .game-container {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            background: var(--frame-wood);
            padding: 12px;
            border-radius: 16px;
            box-shadow: 
                inset 0 2px 0 rgba(255,255,255,0.2),
                inset 0 -4px 0 rgba(0,0,0,0.15),
                0 12px 24px rgba(93, 64, 55, 0.2);
            border: 1px solid rgba(0,0,0,0.1);
        }

        .board-surface {
            width: 100%;
            height: 100%;
            background-color: var(--grid-bg);
            border-radius: 8px;
            position: relative;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: var(--grid-gap);
            background-color: var(--grid-line); /* Shows through gap as grid lines */
            box-shadow: inset 0 0 15px rgba(0,0,0,0.03);
        }

        .tile {
            position: relative;
            background: var(--grid-bg);
            cursor: pointer;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Tactile plank feel */
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
        }

        /* SVG Paths */
        .tile svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
            overflow: visible;
        }

        .tile path {
            fill: none;
            stroke: var(--path-inactive); 
            stroke-width: 20; /* 8pt multiple (20px) */
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s ease, filter 0.3s ease;
        }

        /* Active State */
        .tile.active path {
            stroke: var(--path-active);
            /* Subtle embossed look */
            filter: drop-shadow(0px 2px 0px rgba(0,0,0,0.15));
        }

        /* --- Tokens (Fixed 48x48px Bounding Box) --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* The Cub */
        .cub-token {
            position: absolute;
            width: 48px; 
            height: 48px;
            /* Center logic handled in JS */
            transform: translate(-50%, -50%);
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.25));
        }

        /* The Star */
        .star-marker {
            position: absolute;
            width: 48px;
            height: 48px;
            transform: translate(-50%, -50%);
            z-index: 5;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            50% { transform: translate(-50%, -55%) rotate(5deg); }
        }

        /* --- Footer & Buttons --- */
        footer {
            margin-top: 32px; /* ~32px gap per critique */
            display: flex;
            gap: 20px;
            z-index: 2;
        }

        button {
            font-family: 'Nunito', 'Quicksand', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            padding: 12px 36px;
            border: none;
            border-radius: 12px; /* Slightly softer corners */
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: transform 0.1s, box-shadow 0.1s;
            position: relative;
            color: white;
        }

        /* Run Button: Lush Green */
        .btn-run {
            background-color: var(--btn-run);
            box-shadow: 0 6px 0 var(--btn-run-shadow), 0 10px 10px rgba(0,0,0,0.1);
        }

        /* Reset Button: Secondary */
        .btn-reset {
            background-color: var(--bg-paper);
            color: var(--text-ui);
            box-shadow: 0 6px 0 var(--btn-reset-shadow), 0 10px 10px rgba(0,0,0,0.05);
        }

        /* Flat, illustrative finish - NO stitched borders */
        button::after {
            display: none;
        }

        button:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(253, 251, 247, 0.9);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-family: 'Fredoka One', 'Chewy', cursive;
            font-size: 5rem;
            color: var(--path-active);
            margin: 0;
            transform: rotate(-5deg);
            text-shadow: 3px 3px 0 var(--bg-paper-dark);
        }
        .overlay p {
            font-size: 1.5rem;
            color: var(--text-ui);
            margin-bottom: 2rem;
            font-weight: 700;
        }

        @media (max-width: 500px) {
            h1 { font-size: 2.8rem; }
            :root { --board-size: 92vw; }
            button { padding: 10px 24px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="level-info">Level 1: The Garden</div>
    </header>

    <div class="game-container">
        <div class="board-surface" id="grid"></div>
        
        <!-- Token Layer -->
        <div class="token-layer">
            <!-- The Cub: Wooden Token Style -->
            <div class="cub-token" id="cub">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <defs>
                        <linearGradient id="woodGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#E67E22;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#D35400;stop-opacity:1" />
                        </linearGradient>
                        <filter id="inset-shadow">
                            <feOffset dx="0" dy="3"/>
                            <feGaussianBlur stdDeviation="3" result="offset-blur"/>
                            <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                            <feFlood flood-color="black" flood-opacity="0.2" result="color"/>
                            <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                            <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                        </filter>
                    </defs>
                    
                    <!-- Wooden Base -->
                    <circle cx="50" cy="50" r="46" fill="url(#woodGradient)" filter="url(#inset-shadow)" stroke="#A04000" stroke-width="2"/>
                    
                    <!-- Face Details -->
                    <g transform="translate(0, 2)">
                        <!-- Ears -->
                        <path d="M18 35 Q10 15 35 25" fill="#A04000" stroke="#5D4037" stroke-width="1"/>
                        <path d="M82 35 Q90 15 65 25" fill="#A04000" stroke="#5D4037" stroke-width="1"/>
                        
                        <!-- Eyes -->
                        <circle cx="38" cy="45" r="5" fill="#3E2723"/>
                        <circle cx="62" cy="45" r="5" fill="#3E2723"/>
                        <circle cx="39" cy="43" r="1.5" fill="white"/>
                        <circle cx="63" cy="43" r="1.5" fill="white"/>
                        
                        <!-- Nose -->
                        <path d="M45 55 L55 55 L50 62 Z" fill="#3E2723"/>
                        
                        <!-- Mouth -->
                        <path d="M50 62 L50 68 M45 68 Q50 72 55 68" stroke="#3E2723" stroke-width="2" fill="none" stroke-linecap="round"/>
                    </g>
                </svg>
            </div>
            
            <!-- The Star: Fabric Patch Style -->
            <div class="star-marker" id="star">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <defs>
                        <filter id="patch-shadow">
                            <feDropShadow dx="0" dy="2" stdDeviation="1" flood-opacity="0.3"/>
                        </filter>
                    </defs>
                    <!-- Felt backing -->
                    <circle cx="50" cy="50" r="42" fill="#F1C40F" filter="url(#patch-shadow)"/>
                    <!-- Stitching -->
                    <circle cx="50" cy="50" r="38" fill="none" stroke="#F39C12" stroke-width="2" stroke-dasharray="4,3"/>
                    <!-- Star Shape -->
                    <path d="M50 15 L61 38 L85 38 L66 53 L73 77 L50 63 L27 77 L34 53 L15 38 L39 38 Z" 
                          fill="#FFF" stroke="#F39C12" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        const GRID_SIZE = 6;
        
        // SVG Path Definitions (Center is 50,50)
        // Using slightly wider strokes for the tactile feel
        const TILE_TYPES = {
            EMPTY: { paths: [] },
            LINE: { paths: ['M50 0 V100'], con: [1,0,1,0] }, 
            LINE_H: { paths: ['M0 50 H100'], con: [0,1,0,1] }, 
            CORNER_TR: { paths: ['M50 0 V50 H100'], con: [1,1,0,0] },
            CORNER_BR: { paths: ['M100 50 V100 H50'], con: [0,1,1,0] },
            CORNER_BL: { paths: ['M0 50 V100 H50'], con: [0,0,1,1] },
            CORNER_TL: { paths: ['M50 0 V50 H0'], con: [1,0,0,1] },
            T_DOWN: { paths: ['M50 0 V100 M0 50 H100'], con: [1,1,1,1] }, 
            T_UP: { paths: ['M0 50 H100 M50 50 V100'], con: [0,1,1,1] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,0,1,1] },
            T_LEFT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,1,1,0] }
        };

        // Visual Layout Map
        const PUZZLE_LAYOUT = [
            ['C_TL', 'L', 'C_TR', 'L', 'C_TL', 'L'],
            ['L', 'C_BR', 'L', 'C_TL', 'L', 'L'],
            ['L', 'L', 'C_BL', 'C_BR', 'C_BL', 'C_BR'],
            ['L', 'C_TL', 'L', 'L', 'C_BL', 'L'],
            ['C_TR', 'L', 'C_BL', 'C_BR', 'L', 'L'],
            ['L', 'L', 'L', 'L', 'L', 'L']
        ];

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 4}; 
                this.cubPos = {x: 0, y: 0};
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const key = PUZZLE_LAYOUT[y][x];
                        const tileDef = this.getTileDef(key);
                        
                        const div = document.createElement('div');
                        div.className = 'tile';
                        
                        // Build SVG
                        const svgNS = "http://www.w3.org/2000/svg";
                        const svg = document.createElementNS(svgNS, "svg");
                        svg.setAttribute("viewBox", "0 0 100 100");
                        svg.setAttribute("preserveAspectRatio", "none");
                        
                        tileDef.paths.forEach(d => {
                            const path = document.createElementNS(svgNS, "path");
                            path.setAttribute("d", d);
                            svg.appendChild(path);
                        });

                        div.appendChild(svg);
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            getTileDef(key) {
                const map = {
                    'L': TILE_TYPES.LINE,
                    'C_TL': TILE_TYPES.CORNER_TL,
                    'C_TR': TILE_TYPES.CORNER_TR,
                    'C_BL': TILE_TYPES.CORNER_BL,
                    'C_BR': TILE_TYPES.CORNER_BR,
                    'C': TILE_TYPES.CORNER_TL 
                };
                return map[key] || TILE_TYPES.EMPTY;
            }

            updateTokenPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                // Reset visual active states
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.cubPos = {x: 0, y: 0};
                this.updateTokenPosition(0, 0);
            }

            async run() {
                // Path to Star at 5,4
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:4, y:4}, {x:4, y:3}, 
                    {x:5, y:3}, {x:5, y:4} 
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    
                    // Highlight tile
                    const tile = this.cells[step.y][step.x];
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateTokenPosition(step.x, step.y);
                    
                    // Wait
                    await new Promise(r => setTimeout(r, 400));
                }

                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 300);
            }
        }

        const game = new Game();
    </script>
</body>
</html>
