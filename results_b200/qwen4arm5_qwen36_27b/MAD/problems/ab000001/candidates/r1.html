<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        /* 
           DESIGN STRATEGY:
           1. Typography: System fonts mimicking a storybook feel (Chunky Serif + Rounded Sans).
           2. Colors: Warm, organic palette (Cream, Wood, Tangerine, Teal).
           3. Texture: CSS-based paper noise and grass grain.
           4. Layout: Tighter vertical rhythm, unified button group.
        */

        :root {
            /* Palette */
            --bg-color: #F2E8D9; /* Warm paper */
            --ink-main: #2C3E50;
            --ink-light: #5D6D7E;
            --accent-orange: #E67E22; /* Cub & Active Paths */
            --accent-teal: #1ABC9C;   /* Secondary Paths */
            --accent-gold: #F1C40F;   /* Star */
            --wood-light: #A1887F;
            --wood-dark: #5D4037;
            --board-bg: #E8E0D5;
            
            /* Dimensions */
            --board-size: min(85vw, 480px);
            --tile-size: calc(var(--board-size) / 6);
            --radius-lg: 16px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            /* Paper Texture Effect */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            font-family: "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
            color: var(--ink-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 1.2rem; /* Reduced gap to board */
            z-index: 2;
        }

        h1 {
            /* Storybook Title: Chunky Serif */
            font-family: "Brush Script MT", "Comic Sans MS", "Chalkboard SE", cursive;
            font-size: 4rem;
            margin: 0;
            letter-spacing: 1px;
            color: var(--wood-dark);
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
            line-height: 0.9;
            transform: rotate(-2deg);
        }

        .subtitle {
            /* Friendly Rounded Sans */
            font-family: "Varela Round", "Segoe UI", "Arial Rounded MT Bold", sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--ink-light);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 0.6rem;
            background: rgba(255, 255, 255, 0.6);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* --- The Game Board --- */
        .game-container {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            /* Wood Frame */
            background: var(--wood-dark);
            padding: 12px;
            border-radius: var(--radius-lg);
            box-shadow: 
                0 20px 40px rgba(44, 62, 80, 0.2),
                0 5px 0 rgba(0,0,0,0.1);
        }

        /* Inner Board Surface (Grass/Paper) */
        .board-surface {
            width: 100%;
            height: 100%;
            background-color: var(--board-bg);
            /* Grass/Grain Texture */
            background-image: 
                radial-gradient(var(--wood-light) 1px, transparent 1px),
                linear-gradient(45deg, rgba(0,0,0,0.02) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.02) 75%, rgba(0,0,0,0.02)), 
                linear-gradient(45deg, rgba(0,0,0,0.02) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.02) 75%, rgba(0,0,0,0.02));
            background-size: 20px 20px, 4px 4px, 4px 4px;
            border-radius: 6px;
            position: relative;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            /* Gap replaced by borders for "lines" look */
            gap: 0; 
        }

        .tile {
            position: relative;
            /* Taupe grid lines */
            border: 1px solid rgba(93, 64, 55, 0.15); 
            background: rgba(255,255,255,0.2);
            cursor: pointer;
        }

        /* SVG Paths */
        .tile svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }

        .tile path {
            fill: none;
            stroke: var(--wood-light); /* Default inactive path */
            stroke-width: 10;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.4s ease, filter 0.4s ease;
        }

        /* Active Path State */
        .tile.active path {
            stroke: var(--accent-orange);
            filter: drop-shadow(0 2px 2px rgba(230, 126, 34, 0.3));
        }

        /* --- Tokens --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* The Cub: Flat 2D Illustration */
        .cub-token {
            position: absolute;
            width: calc(var(--tile-size) * 0.8);
            height: calc(var(--tile-size) * 0.8);
            transform: translate(-50%, -50%);
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20;
        }

        /* The Star Marker */
        .star-marker {
            position: absolute;
            width: calc(var(--tile-size) * 0.7);
            height: calc(var(--tile-size) * 0.7);
            transform: translate(-50%, -50%);
            z-index: 5;
            color: var(--accent-gold);
            filter: drop-shadow(0 2px 0 rgba(0,0,0,0.1));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            50% { transform: translate(-50%, -55%) rotate(10deg); }
        }

        /* --- Footer Controls --- */
        footer {
            margin-top: 1.5rem; /* Tightened gap */
            display: flex;
            gap: 12px; /* Unified group */
            z-index: 2;
        }

        /* Button Styles: Tactile Wooden Signs */
        button {
            font-family: "Brush Script MT", "Comic Sans MS", cursive;
            font-size: 1.6rem;
            padding: 10px 32px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: #fff;
            position: relative;
            background: var(--accent-orange);
            box-shadow: 
                inset 0 2px 0 rgba(255,255,255,0.3),
                inset 0 -2px 0 rgba(0,0,0,0.1),
                0 4px 0 var(--wood-dark),
                0 6px 5px rgba(0,0,0,0.15);
            transition: transform 0.1s, box-shadow 0.1s;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
            min-width: 120px;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 
                inset 0 2px 5px rgba(0,0,0,0.2),
                0 0 0 var(--wood-dark);
        }

        .btn-reset {
            background: var(--wood-light);
            box-shadow: 
                inset 0 2px 0 rgba(255,255,255,0.3),
                inset 0 -2px 0 rgba(0,0,0,0.1),
                0 4px 0 #5D4037, /* Darker wood shadow */
                0 6px 5px rgba(0,0,0,0.15);
        }
        
        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(254, 248, 245, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
            backdrop-filter: blur(4px);
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-family: "Brush Script MT", cursive;
            font-size: 5rem;
            color: var(--accent-orange);
            margin: 0;
            transform: rotate(-5deg);
            text-shadow: 3px 3px 0 var(--wood-dark);
        }
        .overlay p {
            font-family: "Varela Round", sans-serif;
            font-size: 1.5rem;
            color: var(--wood-dark);
            margin-bottom: 2rem;
        }

        /* Responsive adjustments */
        @media (max-width: 500px) {
            h1 { font-size: 3rem; }
            :root { --board-size: 92vw; }
            button { padding: 8px 24px; font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 1: The Garden</div>
    </header>

    <div class="game-container">
        <div class="board-surface" id="grid"></div>
        
        <!-- Token Layer -->
        <div class="token-layer">
            <!-- Hand-drawn Cub SVG -->
            <div class="cub-token" id="cub">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <!-- Ears -->
                    <circle cx="25" cy="25" r="12" fill="#E67E22"/>
                    <circle cx="75" cy="25" r="12" fill="#E67E22"/>
                    <!-- Head -->
                    <circle cx="50" cy="55" r="35" fill="#E67E22"/>
                    <!-- Snout -->
                    <ellipse cx="50" cy="65" rx="18" ry="14" fill="#FDF2E9"/>
                    <!-- Eyes -->
                    <circle cx="40" cy="50" r="4" fill="#2C3E50"/>
                    <circle cx="60" cy="50" r="4" fill="#2C3E50"/>
                    <!-- Nose -->
                    <circle cx="50" cy="62" r="5" fill="#2C3E50"/>
                    <!-- Mouth -->
                    <path d="M45 70 Q50 75 55 70" stroke="#2C3E50" stroke-width="2" fill="none"/>
                </svg>
            </div>
            
            <!-- Star Marker SVG -->
            <div class="star-marker" id="star">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        const GRID_SIZE = 6;
        
        // SVG Path Definitions (Center is 50,50)
        // Using slightly thicker strokes for organic feel
        const TILE_TYPES = {
            EMPTY: { paths: [] },
            LINE: { paths: ['M50 0 V100'], con: [1,0,1,0] }, 
            LINE_H: { paths: ['M0 50 H100'], con: [0,1,0,1] }, 
            CORNER_TR: { paths: ['M50 0 V50 H100'], con: [1,1,0,0] },
            CORNER_BR: { paths: ['M100 50 V100 H50'], con: [0,1,1,0] },
            CORNER_BL: { paths: ['M0 50 V100 H50'], con: [0,0,1,1] },
            CORNER_TL: { paths: ['M50 0 V50 H0'], con: [1,0,0,1] },
            T_DOWN: { paths: ['M50 0 V100 M0 50 H100'], con: [1,1,1,1] }, 
            T_UP: { paths: ['M0 50 H100 M50 50 V100'], con: [0,1,1,1] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,0,1,1] },
            T_LEFT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,1,1,0] }
        };

        // Visual Layout Map
        const PUZZLE_LAYOUT = [
            ['C_TL', 'L', 'C_TR', 'L', 'C_TL', 'L'],
            ['L', 'C_BR', 'L', 'C_TL', 'L', 'L'],
            ['L', 'L', 'C_BL', 'C_BR', 'C_BL', 'C_BR'],
            ['L', 'C_TL', 'L', 'L', 'C_BL', 'L'],
            ['C_TR', 'L', 'C_BL', 'C_BR', 'L', 'L'],
            ['L', 'L', 'L', 'L', 'L', 'L']
        ];

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 4}; 
                this.cubPos = {x: 0, y: 0};
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const key = PUZZLE_LAYOUT[y][x];
                        const tileDef = this.getTileDef(key);
                        
                        const div = document.createElement('div');
                        div.className = 'tile';
                        
                        // Build SVG
                        const svgNS = "http://www.w3.org/2000/svg";
                        const svg = document.createElementNS(svgNS, "svg");
                        svg.setAttribute("viewBox", "0 0 100 100");
                        svg.setAttribute("preserveAspectRatio", "none");
                        
                        tileDef.paths.forEach(d => {
                            const path = document.createElementNS(svgNS, "path");
                            path.setAttribute("d", d);
                            svg.appendChild(path);
                        });

                        div.appendChild(svg);
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            getTileDef(key) {
                const map = {
                    'L': TILE_TYPES.LINE,
                    'C_TL': TILE_TYPES.CORNER_TL,
                    'C_TR': TILE_TYPES.CORNER_TR,
                    'C_BL': TILE_TYPES.CORNER_BL,
                    'C_BR': TILE_TYPES.CORNER_BR,
                    'C': TILE_TYPES.CORNER_TL 
                };
                return map[key] || TILE_TYPES.EMPTY;
            }

            updateTokenPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                // Reset visual active states
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.cubPos = {x: 0, y: 0};
                this.updateTokenPosition(0, 0);
            }

            async run() {
                // Path to Star at 5,4
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:4, y:4}, {x:4, y:3}, 
                    {x:5, y:3}, {x:5, y:4} 
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    
                    // Highlight tile
                    const tile = this.cells[step.y][step.x];
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateTokenPosition(step.x, step.y);
                    
                    // Wait
                    await new Promise(r => setTimeout(r, 400));
                }

                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 300);
            }
        }

        const game = new Game();
    </script>
</body>
</html>
