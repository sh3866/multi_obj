<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup - The Garden</title>
    <style>
        /* 
           DESIGN REVISION:
           - Identity: Storybook, tactile, warm.
           - Layout: Level badge integrated into board frame. Tighter spacing.
           - Materiality: Wood textures, rope paths, fabric buttons.
        */

        :root {
            /* Palette */
            --bg-paper: #F4EFE6;
            --board-wood: #5D4037;
            --board-wood-light: #8D6E63;
            --board-surface: #EAE0D5;
            
            --ink-dark: #3E2723;
            --ink-sage: #556B2F;
            
            --rope-inactive: #D7CCC8; /* Light wood/grass */
            --rope-active: #5D4037;   /* Chocolate Brown */
            
            --accent-orange: #E67E22;
            --accent-gold: #F1C40F;
            --accent-green: #6B8E23;

            /* Dimensions */
            --board-size: min(85vw, 480px);
            --radius-lg: 12px;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            /* Paper Grain Texture */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
            font-family: "Varela Round", "Segoe UI", "Arial Rounded MT Bold", sans-serif;
            color: var(--ink-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 1rem; /* Tightened gap */
            z-index: 2;
        }

        h1 {
            /* Storybook Title */
            font-family: "Brush Script MT", "Comic Sans MS", "Chalkboard SE", cursive;
            font-size: 4rem;
            margin: 0;
            letter-spacing: 1px;
            color: var(--board-wood);
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
            line-height: 1;
            transform: rotate(-2deg);
        }

        .subtitle {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--ink-sage);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 1.5rem; /* Increased breathing room */
            opacity: 0.8;
        }

        /* --- The Game Board --- */
        .game-container {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            /* Wood Frame */
            background: var(--board-wood);
            padding: 16px; /* Slightly thicker frame */
            border-radius: var(--radius-lg);
            box-shadow: 
                inset 0 2px 4px rgba(255,255,255,0.2), /* Top highlight */
                inset 0 -4px 6px rgba(0,0,0,0.2), /* Bottom shadow */
                0 20px 40px rgba(44, 62, 80, 0.15),
                0 8px 0 rgba(0,0,0,0.15); /* 3D depth */
            border: 4px solid var(--board-wood-light); /* Bevel */
        }

        /* --- Level Badge (Ribbon) --- */
        .level-badge {
            position: absolute;
            top: -18px;
            left: -18px;
            background: var(--accent-orange);
            color: white;
            padding: 8px 24px;
            font-family: "Brush Script MT", cursive;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 20;
            transform: rotate(-5deg);
            box-shadow: 
                0 4px 0 #D35400,
                0 8px 10px rgba(0,0,0,0.2);
            /* Ribbon tails */
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 50% 85%, 0% 100%);
            text-align: center;
            line-height: 1.2;
        }
        .level-badge span {
            display: block;
            font-size: 0.8rem;
            font-family: "Segoe UI", sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
            margin-bottom: 2px;
        }

        /* Inner Board Surface */
        .board-surface {
            width: 100%;
            height: 100%;
            background-color: var(--board-surface);
            /* Subtle grass/paper texture */
            background-image: 
                radial-gradient(var(--board-wood-light) 1px, transparent 1px);
            background-size: 24px 24px;
            border-radius: 4px;
            position: relative;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            gap: 1px; /* Thin grid lines */
            background-color: rgba(93, 64, 55, 0.1); /* Grid line color */
        }

        .tile {
            position: relative;
            background: var(--board-surface);
            /* Reset inner background to solid to hide grid lines inside tiles */
            background-image: none; 
            cursor: pointer;
            overflow: hidden; /* Keep paths inside */
        }

        /* SVG Paths (Rope Style) */
        .tile svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }

        .tile path {
            fill: none;
            /* Rope effect: Double stroke */
            stroke: var(--rope-inactive); 
            stroke-width: 16;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.4;
            transition: stroke 0.4s ease, filter 0.4s ease, opacity 0.4s ease;
        }

        /* Active Path State */
        .tile.active path {
            stroke: var(--rope-active); /* Chocolate Brown */
            opacity: 1;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2));
        }

        /* --- Tokens --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* The Cub: Expressive Illustration */
        .cub-token {
            position: absolute;
            width: calc(var(--board-size) / 7); /* Slightly smaller than tile */
            height: calc(var(--board-size) / 7);
            transform: translate(-50%, -50%);
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20;
            filter: drop-shadow(0 4px 3px rgba(0,0,0,0.3));
        }

        /* The Star Marker */
        .star-marker {
            position: absolute;
            width: calc(var(--board-size) / 8);
            height: calc(var(--board-size) / 8);
            transform: translate(-50%, -50%);
            z-index: 5;
            color: var(--accent-gold);
            filter: drop-shadow(0 2px 0 rgba(0,0,0,0.1));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            50% { transform: translate(-50%, -55%) rotate(10deg); }
        }

        /* --- Footer Controls --- */
        footer {
            margin-top: 2rem; /* 32px approx */
            display: flex;
            gap: 16px;
            z-index: 2;
        }

        /* Button Styles: Stitched Fabric / Wood Block */
        button {
            font-family: "Segoe UI", sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 12px 36px; /* Proportional width */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
            position: relative;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s, box-shadow 0.1s;
            
            /* Fabric Texture */
            background-color: var(--accent-orange);
            background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(0,0,0,0.05) 5px, rgba(0,0,0,0.05) 10px);
            
            /* Stitching Effect */
            box-shadow: 
                inset 0 0 0 2px rgba(255,255,255,0.3), /* Inner highlight */
                0 4px 0 #D35400, /* Darker orange bottom */
                0 8px 10px rgba(0,0,0,0.2); /* Drop shadow */
        }
        
        /* Stitching Dashes */
        button::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 2px dashed rgba(255,255,255,0.4);
            border-radius: 4px;
            pointer-events: none;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 
                inset 0 0 0 2px rgba(255,255,255,0.3),
                0 0 0 #D35400,
                0 0 0 rgba(0,0,0,0.2);
        }

        .btn-reset {
            background-color: #FFFFFF;
            color: var(--ink-dark);
            background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(0,0,0,0.03) 5px, rgba(0,0,0,0.03) 10px);
            box-shadow: 
                inset 0 0 0 1px rgba(0,0,0,0.1),
                0 4px 0 #D7CCC8, 
                0 8px 10px rgba(0,0,0,0.1);
        }
        .btn-reset::after {
            border-color: rgba(0,0,0,0.15);
        }
        .btn-reset:active {
            box-shadow: 
                inset 0 0 0 1px rgba(0,0,0,0.1),
                0 0 0 #D7CCC8,
                0 0 0 rgba(0,0,0,0.1);
        }
        
        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(244, 239, 230, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
            backdrop-filter: blur(4px);
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-family: "Brush Script MT", cursive;
            font-size: 5rem;
            color: var(--accent-orange);
            margin: 0;
            transform: rotate(-5deg);
            text-shadow: 3px 3px 0 var(--board-wood);
        }
        .overlay p {
            font-family: "Segoe UI", sans-serif;
            font-size: 1.5rem;
            color: var(--ink-dark);
            margin-bottom: 2rem;
            font-weight: 600;
        }

        /* Responsive adjustments */
        @media (max-width: 500px) {
            h1 { font-size: 3rem; }
            :root { --board-size: 92vw; }
            button { padding: 10px 24px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">A Path Puzzle Game</div>
    </header>

    <div class="game-container">
        <!-- Integrated Level Badge -->
        <div class="level-badge">
            <span>Level 1</span>
            The Garden
        </div>

        <div class="board-surface" id="grid"></div>
        
        <!-- Token Layer -->
        <div class="token-layer">
            <!-- Expressive Cub SVG -->
            <div class="cub-token" id="cub">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <!-- Back Ears -->
                    <path d="M20 30 Q10 10 35 20" fill="#D35400" stroke="#A04000" stroke-width="2"/>
                    <path d="M80 30 Q90 10 65 20" fill="#D35400" stroke="#A04000" stroke-width="2"/>
                    <!-- Head Base -->
                    <circle cx="50" cy="55" r="32" fill="#E67E22"/>
                    <!-- Cheeks -->
                    <circle cx="35" cy="65" r="8" fill="#F39C12" opacity="0.5"/>
                    <circle cx="65" cy="65" r="8" fill="#F39C12" opacity="0.5"/>
                    <!-- Snout -->
                    <ellipse cx="50" cy="65" rx="16" ry="12" fill="#FDF2E9"/>
                    <!-- Eyes -->
                    <circle cx="42" cy="50" r="4.5" fill="#3E2723"/>
                    <circle cx="58" cy="50" r="4.5" fill="#3E2723"/>
                    <circle cx="43.5" cy="48.5" r="1.5" fill="white"/>
                    <circle cx="59.5" cy="48.5" r="1.5" fill="white"/>
                    <!-- Nose -->
                    <ellipse cx="50" cy="62" rx="5" ry="3.5" fill="#3E2723"/>
                    <!-- Mouth -->
                    <path d="M50 65 L50 70 M46 70 Q50 74 54 70" stroke="#3E2723" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            
            <!-- Star Marker SVG -->
            <div class="star-marker" id="star">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
                </svg>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        const GRID_SIZE = 6;
        
        // SVG Path Definitions (Center is 50,50)
        // Paths connect to edges: Top(50,0), Right(100,50), Bottom(50,100), Left(0,50)
        const TILE_TYPES = {
            EMPTY: { paths: [] },
            LINE: { paths: ['M50 0 V100'], con: [1,0,1,0] }, // Vertical
            LINE_H: { paths: ['M0 50 H100'], con: [0,1,0,1] }, // Horizontal
            CORNER_TR: { paths: ['M50 0 V50 H100'], con: [1,1,0,0] },
            CORNER_BR: { paths: ['M100 50 V100 H50'], con: [0,1,1,0] },
            CORNER_BL: { paths: ['M0 50 V100 H50'], con: [0,0,1,1] },
            CORNER_TL: { paths: ['M50 0 V50 H0'], con: [1,0,0,1] },
            T_DOWN: { paths: ['M50 0 V100 M0 50 H100'], con: [1,1,1,1] }, 
            T_UP: { paths: ['M0 50 H100 M50 50 V100'], con: [0,1,1,1] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,0,1,1] },
            T_LEFT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,1,1,0] }
        };

        // Visual Layout Map
        const PUZZLE_LAYOUT = [
            ['C_TL', 'L', 'C_TR', 'L', 'C_TL', 'L'],
            ['L', 'C_BR', 'L', 'C_TL', 'L', 'L'],
            ['L', 'L', 'C_BL', 'C_BR', 'C_BL', 'C_BR'],
            ['L', 'C_TL', 'L', 'L', 'C_BL', 'L'],
            ['C_TR', 'L', 'C_BL', 'C_BR', 'L', 'L'],
            ['L', 'L', 'L', 'L', 'L', 'L']
        ];

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 4}; 
                this.cubPos = {x: 0, y: 0};
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const key = PUZZLE_LAYOUT[y][x];
                        const tileDef = this.getTileDef(key);
                        
                        const div = document.createElement('div');
                        div.className = 'tile';
                        
                        // Build SVG
                        const svgNS = "http://www.w3.org/2000/svg";
                        const svg = document.createElementNS(svgNS, "svg");
                        svg.setAttribute("viewBox", "0 0 100 100");
                        svg.setAttribute("preserveAspectRatio", "none");
                        
                        tileDef.paths.forEach(d => {
                            const path = document.createElementNS(svgNS, "path");
                            path.setAttribute("d", d);
                            svg.appendChild(path);
                        });

                        div.appendChild(svg);
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            getTileDef(key) {
                const map = {
                    'L': TILE_TYPES.LINE,
                    'C_TL': TILE_TYPES.CORNER_TL,
                    'C_TR': TILE_TYPES.CORNER_TR,
                    'C_BL': TILE_TYPES.CORNER_BL,
                    'C_BR': TILE_TYPES.CORNER_BR,
                    'C': TILE_TYPES.CORNER_TL 
                };
                return map[key] || TILE_TYPES.EMPTY;
            }

            updateTokenPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                // Reset visual active states
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.cubPos = {x: 0, y: 0};
                this.updateTokenPosition(0, 0);
            }

            async run() {
                // Path to Star at 5,4
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:4, y:4}, {x:4, y:3}, 
                    {x:5, y:3}, {x:5, y:4} 
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    
                    // Highlight tile
                    const tile = this.cells[step.y][step.x];
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateTokenPosition(step.x, step.y);
                    
                    // Wait
                    await new Promise(r => setTimeout(r, 400));
                }

                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 300);
            }
        }

        const game = new Game();
    </script>
</body>
</html>
