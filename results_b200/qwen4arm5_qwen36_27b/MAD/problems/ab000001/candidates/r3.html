<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup - The Garden</title>
    <style>
        /* 
           DESIGN REVISION v2:
           1. Board Visibility: Darker paths, 'carved' look with inset shadows.
           2. Thematic UI: Buttons as wooden blocks/stitched patches. Cub is distinct.
           3. Layout: Level badge overlaps frame cleanly. Tighter footer spacing.
           4. Color: Earthy tones (Olive, Rust, Wood).
        */

        :root {
            /* Palette - Earthy & Warm */
            --bg-paper: #F2EBE5; /* Warmer off-white */
            --board-wood-frame: #8D6E63; /* Lighter, less oppressive wood */
            --board-wood-dark: #5D4037;
            --board-surface: #F5F0EB; /* Creamy grid bg */
            
            --ink-dark: #4E342E; /* Dark Brown for text */
            --ink-sage: #556B2F; /* Olive for accents */
            
            --rope-inactive: #D7CCC8; 
            --rope-active: #3E2723; /* Darker, higher contrast path */
            
            --accent-rust: #C05838; /* Terracotta/Rust instead of bright orange */
            --accent-gold: #F1C40F;
            
            /* Dimensions */
            --board-size: min(85vw, 480px);
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            /* Subtle Paper Noise */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            font-family: "Varela Round", "Segoe UI", "Arial Rounded MT Bold", sans-serif;
            color: var(--ink-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 0.5rem; /* Tightened */
            z-index: 2;
        }

        h1 {
            font-family: "Brush Script MT", "Comic Sans MS", "Chalkboard SE", cursive;
            font-size: 3.5rem;
            margin: 0;
            color: var(--board-wood-dark);
            text-shadow: 2px 2px 0px rgba(255,255,255,0.6);
            line-height: 1;
            transform: rotate(-2deg);
        }

        .subtitle {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--ink-sage);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0.25rem;
            opacity: 0.9;
        }

        /* --- The Game Board --- */
        .game-container {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            /* Wood Frame - Lightened */
            background: var(--board-wood-frame);
            padding: 12px;
            border-radius: var(--radius-lg);
            box-shadow: 
                inset 0 2px 5px rgba(255,255,255,0.3),
                inset 0 -5px 10px rgba(0,0,0,0.15),
                0 15px 35px rgba(78, 52, 46, 0.2);
            border: 2px solid rgba(0,0,0,0.1);
        }

        /* --- Level Badge (Die-cut look) --- */
        .level-badge {
            position: absolute;
            top: -14px;
            left: -10px;
            background: var(--accent-rust); /* Earthy Rust */
            color: #FFF;
            padding: 6px 20px 6px 24px;
            font-family: "Brush Script MT", cursive;
            font-size: 1.4rem;
            font-weight: bold;
            z-index: 20;
            transform: rotate(-4deg);
            /* Shadow for depth */
            box-shadow: 
                0 4px 0 #8D3F26,
                0 6px 8px rgba(0,0,0,0.2);
            /* Ribbon Tail shape */
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 50% 85%, 0% 100%);
            text-align: center;
            line-height: 1.1;
        }
        .level-badge span {
            display: block;
            font-size: 0.7rem;
            font-family: "Segoe UI", sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.95;
            margin-bottom: 2px;
        }

        /* Inner Board Surface */
        .board-surface {
            width: 100%;
            height: 100%;
            background-color: var(--board-surface);
            /* Subtle cross-hatch paper texture */
            background-image: 
                linear-gradient(45deg, rgba(0,0,0,0.02) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.02) 75%, rgba(0,0,0,0.02)),
                linear-gradient(45deg, rgba(0,0,0,0.02) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.02) 75%, rgba(0,0,0,0.02));
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            border-radius: 6px;
            position: relative;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            /* Thicker grid lines (Gap) */
            gap: 2px; 
            background-color: #D7CCC8; /* Grid line color */
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .tile {
            position: relative;
            background: var(--board-surface);
            cursor: pointer;
            overflow: visible; /* Allow paths to touch edges cleanly */
            z-index: 1;
        }

        /* SVG Paths - "Carved" Look */
        .tile svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
            overflow: visible;
        }

        .tile path {
            fill: none;
            stroke: var(--rope-inactive); 
            stroke-width: 18; /* Thicker paths */
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.5;
            transition: stroke 0.4s ease, filter 0.4s ease, opacity 0.4s ease;
        }

        /* Active Path State - High Contrast */
        .tile.active path {
            stroke: var(--rope-active); 
            opacity: 1;
            /* Inset shadow to look carved or pressed */
            filter: drop-shadow(1px 1px 1px rgba(255,255,255,0.4)); 
        }

        /* --- Tokens --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* The Cub: Distinct Character Illustration */
        .cub-token {
            position: absolute;
            width: calc(var(--board-size) / 6.5); 
            height: calc(var(--board-size) / 6.5);
            transform: translate(-50%, -50%);
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
        }

        /* The Star Marker: Golden/Magical */
        .star-marker {
            position: absolute;
            width: calc(var(--board-size) / 7);
            height: calc(var(--board-size) / 7);
            transform: translate(-50%, -50%);
            z-index: 5;
            color: var(--accent-gold);
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            50% { transform: translate(-50%, -55%) rotate(10deg); }
        }

        /* --- Footer Controls --- */
        footer {
            margin-top: 1rem; /* Reduced whitespace ~50% */
            display: flex;
            gap: 16px;
            z-index: 2;
        }

        /* Button Styles: Tactile Wood Blocks */
        button {
            font-family: "Segoe UI", sans-serif;
            font-size: 1rem;
            font-weight: 800;
            padding: 10px 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s, box-shadow 0.1s;
            
            /* Wood/Fabric Texture */
            background-color: var(--accent-rust);
            background-image: repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(0,0,0,0.05) 6px, rgba(0,0,0,0.05) 12px);
            color: #fff;
            
            /* Stitched Border Effect */
            box-shadow: 
                inset 0 0 0 2px rgba(255,255,255,0.2),
                0 4px 0 #8D3F26, /* Darker rust bottom */
                0 6px 10px rgba(0,0,0,0.2);
            position: relative;
        }
        
        /* Stitching Dashes */
        button::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 4px;
            pointer-events: none;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 
                inset 0 0 0 2px rgba(255,255,255,0.2),
                0 0 0 #8D3F26,
                0 0 0 rgba(0,0,0,0.2);
        }

        .btn-reset {
            background-color: #EAE0D5;
            color: var(--ink-dark);
            background-image: repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(0,0,0,0.02) 6px, rgba(0,0,0,0.02) 12px);
            box-shadow: 
                inset 0 0 0 2px rgba(255,255,255,0.5),
                0 4px 0 #BCAAA4, 
                0 6px 10px rgba(0,0,0,0.1);
        }
        .btn-reset::after {
            border-color: rgba(0,0,0,0.15);
        }
        .btn-reset:active {
            box-shadow: 
                inset 0 0 0 2px rgba(255,255,255,0.5),
                0 0 0 #BCAAA4,
                0 0 0 rgba(0,0,0,0.1);
        }
        
        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(244, 239, 230, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
            backdrop-filter: blur(4px);
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-family: "Brush Script MT", cursive;
            font-size: 4.5rem;
            color: var(--accent-rust);
            margin: 0;
            transform: rotate(-5deg);
            text-shadow: 3px 3px 0 var(--board-wood-dark);
        }
        .overlay p {
            font-family: "Segoe UI", sans-serif;
            font-size: 1.5rem;
            color: var(--ink-dark);
            margin-bottom: 2rem;
            font-weight: 600;
        }

        /* Responsive adjustments */
        @media (max-width: 500px) {
            h1 { font-size: 2.8rem; }
            :root { --board-size: 92vw; }
            button { padding: 10px 24px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">The Garden</div>
    </header>

    <div class="game-container">
        <!-- Integrated Level Badge -->
        <div class="level-badge">
            <span>Level 1</span>
            Start
        </div>

        <div class="board-surface" id="grid"></div>
        
        <!-- Token Layer -->
        <div class="token-layer">
            <!-- Expressive Cub SVG -->
            <div class="cub-token" id="cub">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <!-- Back Ears -->
                    <path d="M22 30 Q10 10 35 20" fill="#A04000" stroke="#5D4037" stroke-width="2"/>
                    <path d="M78 30 Q90 10 65 20" fill="#A04000" stroke="#5D4037" stroke-width="2"/>
                    <!-- Head Base -->
                    <circle cx="50" cy="55" r="30" fill="#E67E22"/>
                    <!-- Cheeks -->
                    <circle cx="35" cy="65" r="7" fill="#F39C12" opacity="0.6"/>
                    <circle cx="65" cy="65" r="7" fill="#F39C12" opacity="0.6"/>
                    <!-- Snout -->
                    <ellipse cx="50" cy="65" rx="14" ry="10" fill="#FFF3E0"/>
                    <!-- Eyes -->
                    <circle cx="42" cy="50" r="4" fill="#3E2723"/>
                    <circle cx="58" cy="50" r="4" fill="#3E2723"/>
                    <circle cx="43" cy="49" r="1.5" fill="white"/>
                    <circle cx="59" cy="49" r="1.5" fill="white"/>
                    <!-- Nose -->
                    <ellipse cx="50" cy="62" rx="4" ry="3" fill="#3E2723"/>
                    <!-- Mouth -->
                    <path d="M50 65 L50 69 M46 69 Q50 73 54 69" stroke="#3E2723" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            
            <!-- Star Marker SVG -->
            <div class="star-marker" id="star">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                </svg>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        const GRID_SIZE = 6;
        
        // SVG Path Definitions (Center is 50,50)
        // Paths connect to edges: Top(50,0), Right(100,50), Bottom(50,100), Left(0,50)
        const TILE_TYPES = {
            EMPTY: { paths: [] },
            LINE: { paths: ['M50 0 V100'], con: [1,0,1,0] }, // Vertical
            LINE_H: { paths: ['M0 50 H100'], con: [0,1,0,1] }, // Horizontal
            CORNER_TR: { paths: ['M50 0 V50 H100'], con: [1,1,0,0] },
            CORNER_BR: { paths: ['M100 50 V100 H50'], con: [0,1,1,0] },
            CORNER_BL: { paths: ['M0 50 V100 H50'], con: [0,0,1,1] },
            CORNER_TL: { paths: ['M50 0 V50 H0'], con: [1,0,0,1] },
            T_DOWN: { paths: ['M50 0 V100 M0 50 H100'], con: [1,1,1,1] }, 
            T_UP: { paths: ['M0 50 H100 M50 50 V100'], con: [0,1,1,1] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,0,1,1] },
            T_LEFT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,1,1,0] }
        };

        // Visual Layout Map
        const PUZZLE_LAYOUT = [
            ['C_TL', 'L', 'C_TR', 'L', 'C_TL', 'L'],
            ['L', 'C_BR', 'L', 'C_TL', 'L', 'L'],
            ['L', 'L', 'C_BL', 'C_BR', 'C_BL', 'C_BR'],
            ['L', 'C_TL', 'L', 'L', 'C_BL', 'L'],
            ['C_TR', 'L', 'C_BL', 'C_BR', 'L', 'L'],
            ['L', 'L', 'L', 'L', 'L', 'L']
        ];

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 4}; 
                this.cubPos = {x: 0, y: 0};
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const key = PUZZLE_LAYOUT[y][x];
                        const tileDef = this.getTileDef(key);
                        
                        const div = document.createElement('div');
                        div.className = 'tile';
                        
                        // Build SVG
                        const svgNS = "http://www.w3.org/2000/svg";
                        const svg = document.createElementNS(svgNS, "svg");
                        svg.setAttribute("viewBox", "0 0 100 100");
                        svg.setAttribute("preserveAspectRatio", "none");
                        
                        tileDef.paths.forEach(d => {
                            const path = document.createElementNS(svgNS, "path");
                            path.setAttribute("d", d);
                            svg.appendChild(path);
                        });

                        div.appendChild(svg);
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            getTileDef(key) {
                const map = {
                    'L': TILE_TYPES.LINE,
                    'C_TL': TILE_TYPES.CORNER_TL,
                    'C_TR': TILE_TYPES.CORNER_TR,
                    'C_BL': TILE_TYPES.CORNER_BL,
                    'C_BR': TILE_TYPES.CORNER_BR,
                    'C': TILE_TYPES.CORNER_TL 
                };
                return map[key] || TILE_TYPES.EMPTY;
            }

            updateTokenPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                // Reset visual active states
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.cubPos = {x: 0, y: 0};
                this.updateTokenPosition(0, 0);
            }

            async run() {
                // Path to Star at 5,4
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:4, y:4}, {x:4, y:3}, 
                    {x:5, y:3}, {x:5, y:4} 
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    
                    // Highlight tile
                    const tile = this.cells[step.y][step.x];
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateTokenPosition(step.x, step.y);
                    
                    // Wait
                    await new Promise(r => setTimeout(r, 400));
                }

                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 300);
            }
        }

        const game = new Game();
    </script>
</body>
</html>
