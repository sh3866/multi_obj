<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup - The Garden</title>
    <style>
        :root {
            /* Palette: Storybook Warmth */
            --bg-paper: #FDFCF8;
            --bg-paper-dark: #EAE0D5;
            
            /* Typography Colors */
            --text-title: #3E2723; /* Dark Roast */
            --text-subtitle: #607D5B; /* Vibrant Sage Green */
            --text-ui: #5D4037;
            
            /* Board Colors */
            --frame-wood: #8D6E63;
            --frame-shadow: #5D4037;
            --grid-bg: #F5F0EB;
            --grid-line: #D7CCC8;
            
            /* Path Colors */
            --path-inactive: #EFEBE9; /* Very faint */
            --path-active: #C05838;   /* Terracotta/Rust */
            
            /* Dimensions */
            --board-size: min(80vw, 480px);
            --spacing-unit: 24px;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            font-family: "Varela Round", "Nunito", "Quicksand", "Segoe UI", sans-serif;
            color: var(--text-ui);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Subtle paper grain */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }

        /* --- Header & Typography --- */
        header {
            text-align: center;
            margin-bottom: var(--spacing-unit);
            position: relative;
            z-index: 2;
        }

        h1 {
            /* Whimsical Rounded Display Font Fallback */
            font-family: "Brush Script MT", "Comic Sans MS", "Chalkboard SE", cursive;
            font-size: 3.5rem;
            margin: 0;
            color: var(--text-title);
            line-height: 1;
            letter-spacing: -1px;
            transform: rotate(-2deg);
            text-shadow: 2px 2px 0px rgba(255,255,255,0.8);
        }

        .level-info {
            font-family: "Segoe UI", sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-subtitle);
            margin-top: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .level-info::before, .level-info::after {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            background: var(--text-subtitle);
            border-radius: 50%;
            opacity: 0.5;
        }

        /* --- Game Board --- */
        .game-container {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            /* Wooden Frame */
            background: var(--frame-wood);
            padding: 10px;
            border-radius: 16px;
            box-shadow: 
                inset 0 3px 0 rgba(255,255,255,0.2),
                inset 0 -4px 0 rgba(0,0,0,0.15),
                0 10px 25px rgba(62, 39, 35, 0.15);
            border: 1px solid rgba(0,0,0,0.1);
        }

        .board-surface {
            width: 100%;
            height: 100%;
            background-color: var(--grid-bg);
            border-radius: 6px;
            position: relative;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 1px; /* Tight gap for clean grid lines */
            background-color: var(--grid-line); /* Grid line color via gap */
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .tile {
            position: relative;
            background: var(--grid-bg);
            cursor: pointer;
            z-index: 1;
            /* Center the tile content */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG Paths */
        .tile svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
            overflow: visible;
        }

        .tile path {
            fill: none;
            stroke: var(--path-inactive); 
            stroke-width: 16;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s ease, filter 0.3s ease;
        }

        /* Active State - Terracotta */
        .tile.active path {
            stroke: var(--path-active);
            filter: drop-shadow(0px 2px 0px rgba(0,0,0,0.1));
        }

        /* --- Tokens --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* The Cub */
        .cub-token {
            position: absolute;
            width: calc(var(--board-size) / 6.2); 
            height: calc(var(--board-size) / 6.2);
            transform: translate(-50%, -50%);
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.25));
        }

        /* The Star */
        .star-marker {
            position: absolute;
            width: calc(var(--board-size) / 7.5);
            height: calc(var(--board-size) / 7.5);
            transform: translate(-50%, -50%);
            z-index: 5;
            color: #F1C40F;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            50% { transform: translate(-50%, -55%) rotate(10deg); }
        }

        /* --- Footer & Buttons --- */
        footer {
            margin-top: var(--spacing-unit); /* Reduced gap */
            display: flex;
            gap: 16px;
            z-index: 2;
        }

        button {
            font-family: "Segoe UI", "Arial Rounded MT Bold", sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 8px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s, box-shadow 0.1s;
            position: relative;
            
            /* Wood Block Texture */
            background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(0,0,0,0.03) 5px, rgba(0,0,0,0.03) 10px);
        }

        /* Run Button: Primary */
        .btn-run {
            background-color: var(--path-active);
            color: #fff;
            padding: 10px 32px; /* Larger */
            box-shadow: 
                inset 0 0 0 2px rgba(255,255,255,0.2),
                0 4px 0 #8D3F26,
                0 6px 12px rgba(0,0,0,0.15);
        }

        /* Reset Button: Secondary */
        .btn-reset {
            background-color: var(--bg-paper-dark);
            color: var(--text-ui);
            box-shadow: 
                inset 0 0 0 2px rgba(255,255,255,0.6),
                0 4px 0 #BCAAA4,
                0 6px 12px rgba(0,0,0,0.1);
        }

        /* Stitched Effect for Buttons */
        button::after {
            content: '';
            position: absolute;
            top: 3px; left: 3px; right: 3px; bottom: 3px;
            border: 1.5px dashed rgba(255,255,255,0.3);
            border-radius: 6px;
            pointer-events: none;
        }
        .btn-reset::after {
            border-color: rgba(0,0,0,0.15);
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none; /* Flatten on press */
        }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(253, 252, 248, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(2px);
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-family: "Brush Script MT", "Comic Sans MS", cursive;
            font-size: 5rem;
            color: var(--path-active);
            margin: 0;
            transform: rotate(-5deg);
            text-shadow: 3px 3px 0 var(--bg-paper-dark);
        }
        .overlay p {
            font-size: 1.5rem;
            color: var(--text-ui);
            margin-bottom: 2rem;
            font-weight: 600;
        }

        @media (max-width: 500px) {
            h1 { font-size: 2.8rem; }
            :root { --board-size: 92vw; }
            button { padding: 8px 16px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="level-info">Level 1: The Garden</div>
    </header>

    <div class="game-container">
        <div class="board-surface" id="grid"></div>
        
        <!-- Token Layer -->
        <div class="token-layer">
            <!-- The Cub -->
            <div class="cub-token" id="cub">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <!-- Ears -->
                    <path d="M22 30 Q10 10 35 20" fill="#A04000" stroke="#5D4037" stroke-width="2"/>
                    <path d="M78 30 Q90 10 65 20" fill="#A04000" stroke="#5D4037" stroke-width="2"/>
                    <!-- Head -->
                    <circle cx="50" cy="55" r="30" fill="#E67E22"/>
                    <!-- Cheeks -->
                    <circle cx="35" cy="65" r="7" fill="#F39C12" opacity="0.6"/>
                    <circle cx="65" cy="65" r="7" fill="#F39C12" opacity="0.6"/>
                    <!-- Snout -->
                    <ellipse cx="50" cy="65" rx="14" ry="10" fill="#FFF3E0"/>
                    <!-- Eyes -->
                    <circle cx="42" cy="50" r="4" fill="#3E2723"/>
                    <circle cx="58" cy="50" r="4" fill="#3E2723"/>
                    <circle cx="43" cy="49" r="1.5" fill="white"/>
                    <circle cx="59" cy="49" r="1.5" fill="white"/>
                    <!-- Nose -->
                    <ellipse cx="50" cy="62" rx="4" ry="3" fill="#3E2723"/>
                    <!-- Mouth -->
                    <path d="M50 65 L50 69 M46 69 Q50 73 54 69" stroke="#3E2723" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            
            <!-- The Star -->
            <div class="star-marker" id="star">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                </svg>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        const GRID_SIZE = 6;
        
        // SVG Path Definitions (Center is 50,50)
        const TILE_TYPES = {
            EMPTY: { paths: [] },
            LINE: { paths: ['M50 0 V100'], con: [1,0,1,0] }, 
            LINE_H: { paths: ['M0 50 H100'], con: [0,1,0,1] }, 
            CORNER_TR: { paths: ['M50 0 V50 H100'], con: [1,1,0,0] },
            CORNER_BR: { paths: ['M100 50 V100 H50'], con: [0,1,1,0] },
            CORNER_BL: { paths: ['M0 50 V100 H50'], con: [0,0,1,1] },
            CORNER_TL: { paths: ['M50 0 V50 H0'], con: [1,0,0,1] },
            T_DOWN: { paths: ['M50 0 V100 M0 50 H100'], con: [1,1,1,1] }, 
            T_UP: { paths: ['M0 50 H100 M50 50 V100'], con: [0,1,1,1] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,0,1,1] },
            T_LEFT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,1,1,0] }
        };

        // Visual Layout Map
        const PUZZLE_LAYOUT = [
            ['C_TL', 'L', 'C_TR', 'L', 'C_TL', 'L'],
            ['L', 'C_BR', 'L', 'C_TL', 'L', 'L'],
            ['L', 'L', 'C_BL', 'C_BR', 'C_BL', 'C_BR'],
            ['L', 'C_TL', 'L', 'L', 'C_BL', 'L'],
            ['C_TR', 'L', 'C_BL', 'C_BR', 'L', 'L'],
            ['L', 'L', 'L', 'L', 'L', 'L']
        ];

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 4}; 
                this.cubPos = {x: 0, y: 0};
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const key = PUZZLE_LAYOUT[y][x];
                        const tileDef = this.getTileDef(key);
                        
                        const div = document.createElement('div');
                        div.className = 'tile';
                        
                        // Build SVG
                        const svgNS = "http://www.w3.org/2000/svg";
                        const svg = document.createElementNS(svgNS, "svg");
                        svg.setAttribute("viewBox", "0 0 100 100");
                        svg.setAttribute("preserveAspectRatio", "none");
                        
                        tileDef.paths.forEach(d => {
                            const path = document.createElementNS(svgNS, "path");
                            path.setAttribute("d", d);
                            svg.appendChild(path);
                        });

                        div.appendChild(svg);
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            getTileDef(key) {
                const map = {
                    'L': TILE_TYPES.LINE,
                    'C_TL': TILE_TYPES.CORNER_TL,
                    'C_TR': TILE_TYPES.CORNER_TR,
                    'C_BL': TILE_TYPES.CORNER_BL,
                    'C_BR': TILE_TYPES.CORNER_BR,
                    'C': TILE_TYPES.CORNER_TL 
                };
                return map[key] || TILE_TYPES.EMPTY;
            }

            updateTokenPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                // Reset visual active states
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.cubPos = {x: 0, y: 0};
                this.updateTokenPosition(0, 0);
            }

            async run() {
                // Path to Star at 5,4
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:4, y:4}, {x:4, y:3}, 
                    {x:5, y:3}, {x:5, y:4} 
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    
                    // Highlight tile
                    const tile = this.cells[step.y][step.x];
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateTokenPosition(step.x, step.y);
                    
                    // Wait
                    await new Promise(r => setTimeout(r, 400));
                }

                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 300);
            }
        }

        const game = new Game();
    </script>
</body>
</html>
