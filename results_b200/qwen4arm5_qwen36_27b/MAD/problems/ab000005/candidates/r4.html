<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless Co. - Premium Cleaning</title>
    <style>
        :root {
            /* Palette: Sophisticated & Warm */
            --floor-base: #E8E1D9;
            --floor-shadow: #D1C7BC;
            
            --text-dark: #1C1C1C;
            --text-muted: #4A4A4A;
            
            /* Sage & Forest Greens */
            --brand-green: #2F523F;
            --brand-green-dark: #1E3628;
            --brand-green-light: #4B7A60;
            
            /* Liquid: Soapy Aqua/Teal */
            --liquid-core: #48C9B0;
            --liquid-edge: #1ABC9C;
            --liquid-foam: #E8F8F5;

            /* Typography */
            --font-serif: "Playfair Display", "Georgia", "Times New Roman", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--floor-base);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        /* Layout Container */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* Layer 1: Wood Floor Texture */
        .texture-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.8;
            mix-blend-mode: soft-light;
        }

        /* Layer 2: The Scene */
        .scene-container {
            flex-grow: 1;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        /* Layer 3: UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%; /* Occupy left half */
            height: 100%;
            z-index: 10;
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Anchor content at bottom */
            pointer-events: none; /* Let clicks pass through empty areas */
        }

        /* Branding */
        .brand {
            position: absolute;
            top: 60px;
            left: 60px;
            font-size: 24px; /* Scaled up */
            font-weight: 700;
            color: var(--brand-green-dark);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-serif);
            pointer-events: auto;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: var(--brand-green);
            border-radius: 6px;
            display: grid;
            place-items: center;
            color: white;
            font-family: var(--font-sans);
            font-size: 18px;
        }

        /* Typography & Content */
        .content-wrapper {
            pointer-events: auto;
            max-width: 480px;
            margin-bottom: 40px;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 64px;
            line-height: 1.1;
            color: var(--text-dark);
            margin: 0 0 24px 0;
            font-weight: 400; /* Elegant, lighter weight */
            letter-spacing: -1px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-dark); /* High contrast charcoal */
            margin-bottom: 40px;
            max-width: 400px;
            font-weight: 500;
            opacity: 0.9;
        }

        /* Stats & CTA - No Card */
        .action-row {
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            gap: 60px;
        }

        .stats-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-item {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .stat-value {
            font-family: var(--font-serif);
            font-size: 32px;
            font-weight: 700;
            color: var(--brand-green);
        }

        .stat-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .cta-button {
            background-color: var(--brand-green);
            color: #fff;
            border: none;
            padding: 18px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 25px rgba(47, 82, 63, 0.3);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .cta-button:hover {
            background-color: var(--brand-green-dark);
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(47, 82, 63, 0.4);
        }

        /* SVG Animations */
        @keyframes floatBubble {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-120px) scale(1.5); opacity: 0; }
        }

        .bubble {
            animation: floatBubble 6s infinite ease-in;
        }

        @keyframes subtleWobble {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(1deg); }
        }

        .mop-group {
            transform-origin: 250px 650px;
            animation: subtleWobble 8s infinite ease-in-out;
        }

    </style>
</head>
<body>

<div class="container">
    
    <!-- 1. Background: Procedural Wood Grain -->
    <svg class="texture-layer" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
        <defs>
            <!-- Wood Grain Filter -->
            <filter id="woodTexture">
                <feTurbulence type="fractalNoise" baseFrequency="0.01 0.15" numOctaves="4" result="noise"/>
                <feColorMatrix type="matrix" values="
                    0 0 0 0 0.92
                    0 0 0 0 0.88
                    0 0 0 0 0.84
                    0 0 0 0.15 0" in="noise" result="coloredNoise"/>
                <feComponentTransfer in="coloredNoise" result="contrast">
                    <feFuncA type="linear" slope="1.5" intercept="-0.1"/>
                </feComponentTransfer>
            </filter>
        </defs>
        <rect width="100%" height="100%" fill="#E8E1D9"/>
        <rect width="100%" height="100%" filter="url(#woodTexture)"/>
    </svg>

    <!-- 2. The Scene: SVG Graphic -->
    <div class="scene-container">
        <svg viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Gradients -->
                
                <!-- Sophisticated Sage Bucket -->
                <linearGradient id="bucketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#2F523F;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#3E664F;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#1E3628;stop-opacity:1" />
                </linearGradient>

                <!-- Warm Wood Handle -->
                <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#C1A892;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#8E7560;stop-opacity:1" />
                </linearGradient>

                <!-- Wet Mop Head -->
                <linearGradient id="mopHeadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#3E664F;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#1E3628;stop-opacity:1" />
                </linearGradient>

                <!-- Liquid Depth -->
                <radialGradient id="puddleGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                    <stop offset="0%" style="stop-color:#48C9B0;stop-opacity:0.9" />
                    <stop offset="70%" style="stop-color:#1ABC9C;stop-opacity:0.7" />
                    <stop offset="100%" style="stop-color:#16A085;stop-opacity:0.1" />
                </radialGradient>

                <!-- Ground Shadows -->
                <filter id="blurShadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="15"/>
                </filter>
                <filter id="heavyShadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="8"/>
                    <feOffset dx="0" dy="10" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.4"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>
            </defs>

            <!-- Scene Composition -->
            <g transform="translate(150, 100)"> <!-- Centered shift -->
                
                <!-- 1. The Spilled Mess (Warm Aqua/Soapy) -->
                <!-- Positioned centrally but slightly right to balance the mop handle -->
                <g transform="translate(600, 550)">
                    <!-- Shadow under puddle -->
                    <ellipse cx="0" cy="0" rx="160" ry="60" fill="rgba(0,0,0,0.08)" filter="url(#blurShadow)"/>
                    
                    <!-- Main Puddle Shape -->
                    <path d="M-140,-20 C-140,-80 80,-90 180,-20 C240,40 140,130 0,130 C-140,130 -240,40 -140,-20 Z" 
                          fill="url(#puddleGrad)"/>
                    
                    <!-- Foam/Froth details (White/Translucent) -->
                    <path d="M-100,-10 C-110,-40 -40,-50 0,-20 C30,-10 20,20 -10,10 C-40,20 -90,20 -100,-10 Z" 
                          fill="rgba(255,255,255,0.3)" filter="url(#blurShadow)"/>
                    
                    <!-- Bubbles -->
                    <circle cx="40" cy="20" r="12" stroke="white" stroke-width="2" fill="none" class="bubble" style="animation-delay: 1s;"/>
                    <circle cx="-60" cy="-20" r="6" stroke="white" stroke-width="1.5" fill="none" class="bubble" style="animation-delay: 3s;"/>
                    <circle cx="80" cy="-10" r="18" stroke="white" stroke-width="2" fill="none" class="bubble" style="animation-delay: 0.5s;"/>
                    <circle cx="-20" cy="40" r="8" stroke="white" stroke-width="1.5" fill="none" class="bubble" style="animation-delay: 2s;"/>
                </g>

                <!-- 2. The Bucket (Left/Top - Fully visible) -->
                <g transform="translate(400, 250)" filter="url(#heavyShadow)">
                    <!-- Bucket Body -->
                    <path d="M-80,-60 L-90,100 C-90,115 -60,125 0,125 C60,125 90,115 90,100 L80,-60 Z" 
                          fill="url(#bucketGrad)" />
                    
                    <!-- Rim -->
                    <ellipse cx="0" cy="-60" rx="80" ry="22" fill="#2F523F" stroke="#1E3628" stroke-width="2"/>
                    <ellipse cx="0" cy="-60" rx="70" ry="16" fill="#15261C"/> <!-- Inside bucket -->
                    
                    <!-- Water inside -->
                    <ellipse cx="0" cy="-55" rx="65" ry="12" fill="#1ABC9C" opacity="0.8"/>
                    
                    <!-- Handle Loop -->
                    <path d="M-70,-60 C-70,-180 70,-180 70,-60" fill="none" stroke="#1A1A1A" stroke-width="10" stroke-linecap="round"/>
                    <path d="M-70,-60 C-70,-180 70,-180 70,-60" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                    
                    <!-- Highlight -->
                    <path d="M-60,-40 L-70,80" stroke="#FFF" stroke-width="4" stroke-linecap="round" opacity="0.1"/>
                </g>

                <!-- 3. The Mop (Diagonal Flow) -->
                <g class="mop-group">
                    <!-- Handle: Starts near bucket, points toward CTA area (Bottom Right) -->
                    <!-- Using a curve to create dynamic flow -->
                    <path d="M320,190 Q 450,400 850,750" 
                          stroke="url(#handleGrad)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#heavyShadow)"/>
                    
                    <!-- Mop Head Connection -->
                    <circle cx="850" cy="750" r="14" fill="#1A1A1A"/>
                    
                    <!-- Mop Strands (Spreading out on the floor) -->
                    <g transform="translate(850, 750)">
                        <path d="M-10,0 Q-40,40 -80,80" stroke="url(#mopHeadGrad)" stroke-width="18" stroke-linecap="round"/>
                        <path d="M0,0 Q-10,50 -20,90" stroke="url(#mopHeadGrad)" stroke-width="20" stroke-linecap="round"/>
                        <path d="M10,0 Q30,40 50,85" stroke="url(#mopHeadGrad)" stroke-width="16" stroke-linecap="round"/>
                        <path d="M20,0 Q60,30 90,60" stroke="url(#mopHeadGrad)" stroke-width="14" stroke-linecap="round"/>
                        
                        <!-- Wetness/Reflection on strands -->
                        <path d="M0,20 Q-10,40 -20,70" stroke="#5E8E78" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
                        <path d="M15,20 Q30,35 40,60" stroke="#5E8E78" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
                    </g>
                </g>

            </g>
        </svg>
    </div>

    <!-- 3. UI Overlay -->
    <div class="ui-layer">
        <div class="brand">
            <div class="brand-logo">S</div>
            Spotless Co.
        </div>
        
        <div class="content-wrapper">
            <h1>Clarity in<br>every corner.</h1>
            <p>Experience the difference of a deep clean. We restore the natural warmth of your home with eco-friendly solutions and meticulous care.</p>
            
            <div class="action-row">
                <div class="stats-group">
                    <div class="stat-item">
                        <span class="stat-value">99%</span>
                        <span class="stat-label">Efficiency</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value">100%</span>
                        <span class="stat-label">Eco-Friendly</span>
                    </div>
                </div>
                <button class="cta-button">Book a Clean</button>
            </div>
        </div>
    </div>

</div>

</body>
</html>
