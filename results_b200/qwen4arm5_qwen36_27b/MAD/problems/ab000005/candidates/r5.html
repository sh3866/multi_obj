<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless Co. - Premium Cleaning</title>
    <style>
        :root {
            /* Palette: Warm, Earthy, Sophisticated */
            --bg-wall: #FDFBF9; /* Warm off-white */
            --bg-floor-base: #E3DCD2;
            --bg-floor-dark: #C4B8A9;
            
            --text-main: #2C2A26; /* Warm Charcoal */
            --text-muted: #6B665E;
            
            /* Brand: Deep Terracotta & Amber */
            --brand-primary: #B85C38; /* Terracotta */
            --brand-dark: #8A3F25;
            --brand-accent: #D49A6A; /* Amber/Wood */
            
            /* Liquid: Soapy Water */
            --water-core: #4A90E2;
            --water-edge: #85C1E9;
            --water-highlight: #FFFFFF;

            /* Typography */
            --font-serif: "Georgia", "Times New Roman", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-wall);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        /* Layout Container */
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* Top Section: Clean Wall */
        .wall-section {
            flex: 0 0 60%; /* Top 60% */
            width: 100%;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 60px 80px;
        }

        /* Bottom Section: The Floor */
        .floor-section {
            flex: 0 0 45%; /* Overlap slightly for perspective */
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            background: linear-gradient(180deg, var(--bg-floor-base) 0%, var(--bg-floor-dark) 100%);
            z-index: 1;
            transform: perspective(1000px) rotateX(20deg) scale(1.3); /* 3D Perspective */
            transform-origin: bottom center;
            box-shadow: inset 0 10px 30px rgba(0,0,0,0.05);
        }

        /* Wood Texture Overlay */
        .floor-texture {
            width: 100%;
            height: 100%;
            opacity: 0.4;
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        /* UI Layer */
        .ui-layer {
            position: relative;
            z-index: 10;
            max-width: 600px;
            margin-top: auto; /* Push content down */
            margin-bottom: 120px; /* Ensure it sits nicely above the floor visually */
        }

        /* Branding */
        .brand {
            position: absolute;
            top: 60px;
            left: 80px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-sans);
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            background: var(--brand-primary);
            border-radius: 8px;
            display: grid;
            place-items: center;
            color: white;
            font-family: var(--font-serif);
            font-size: 20px;
            font-style: italic;
        }

        /* Typography */
        .content-wrapper {
            pointer-events: auto;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 72px;
            line-height: 1.05;
            color: var(--text-main);
            margin: 0 0 24px 0;
            font-weight: 400;
            letter-spacing: -1.5px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 48px;
            max-width: 420px;
            font-weight: 400;
        }

        /* Data Viz & CTA */
        .action-row {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .stats-row {
            display: flex;
            align-items: flex-end;
            gap: 32px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .stat-value {
            font-family: var(--font-serif);
            font-size: 36px;
            font-weight: 700;
            color: var(--brand-primary);
            line-height: 1;
        }

        /* The Refined Accent Bar */
        .accent-bar {
            width: 40px;
            height: 4px;
            background-color: var(--brand-primary);
            border-radius: 2px;
            box-shadow: 0 2px 4px rgba(184, 92, 56, 0.3);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .cta-button {
            background-color: var(--text-main);
            color: #fff;
            border: none;
            padding: 20px 48px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 20px rgba(44, 42, 38, 0.15);
            letter-spacing: 0.5px;
            align-self: flex-start;
        }

        .cta-button:hover {
            background-color: var(--brand-primary);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(184, 92, 56, 0.25);
        }

        /* Scene Graphics */
        .scene-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* Animations */
        @keyframes floatBubble {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }

        .bubble {
            animation: floatBubble 4s infinite ease-in;
            transform-box: fill-box;
            transform-origin: center;
        }

        @keyframes mopWipe {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(5px, 2px) rotate(1deg); }
        }

        .mop-group {
            animation: mopWipe 6s infinite ease-in-out;
        }

    </style>
</head>
<body>

<div class="container">
    
    <!-- 1. Top Section: Wall & UI -->
    <div class="wall-section">
        
        <div class="brand">
            <div class="brand-logo">S</div>
            Spotless Co.
        </div>

        <div class="ui-layer">
            <div class="content-wrapper">
                <h1>Deep clean,<br>natural warmth.</h1>
                <p>Restoring the soul of your home. We combine eco-friendly solutions with meticulous care to bring out the beauty in your living spaces.</p>
                
                <div class="action-row">
                    <!-- Refined Stats -->
                    <div class="stats-row">
                        <div class="stat-item">
                            <!-- Accent Bar aligned left with text -->
                            <div class="accent-bar"></div>
                            <div class="stat-header">
                                <span class="stat-value">99%</span>
                                <span class="stat-label">Efficiency</span>
                            </div>
                        </div>
                        <div class="stat-item" style="margin-bottom: 20px;"> <!-- Offset to align bottoms visually -->
                            <div class="stat-label" style="height: 20px;"></div> <!-- Spacer -->
                            <div class="stat-header">
                                <span class="stat-value" style="font-size: 24px; color: var(--text-muted);">100%</span>
                                <span class="stat-label">Eco-Friendly</span>
                            </div>
                        </div>
                    </div>

                    <button class="cta-button">Book a Clean</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. Bottom Section: Floor Plane -->
    <div class="floor-section">
        <!-- Procedural Wood Texture -->
        <svg class="floor-texture" width="100%" height="100%" preserveAspectRatio="none">
            <defs>
                <filter id="woodGrain">
                    <feTurbulence type="fractalNoise" baseFrequency="0.005 0.15" numOctaves="3" result="noise"/>
                    <feColorMatrix type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.80  0 0 0 0 0.75  0 0 0 0.2 0" in="noise" result="colored"/>
                </filter>
                <pattern id="planks" width="200" height="1000" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="0" x2="200" y2="0" stroke="#000" stroke-width="1" opacity="0.1"/>
                    <rect width="200" height="1000" filter="url(#woodGrain)"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#planks)"/>
        </svg>
    </div>

    <!-- 3. The Scene: SVG Graphic Overlay -->
    <!-- Positioned to bridge the gap between wall and floor perspective -->
    <svg class="scene-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
        <defs>
            <!-- Lighting: Top Left Source -->
            
            <!-- Bucket Gradient (Terracotta) -->
            <linearGradient id="bucketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#A04F32;stop-opacity:1" />
                <stop offset="30%" style="stop-color:#B85C38;stop-opacity:1" /> <!-- Highlight -->
                <stop offset="100%" style="stop-color:#6E3520;stop-opacity:1" /> <!-- Shadow -->
            </linearGradient>

            <!-- Liquid Gradient (Soapy Water) -->
            <radialGradient id="liquidGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                <stop offset="0%" style="stop-color:#85C1E9;stop-opacity:0.8" />
                <stop offset="60%" style="stop-color:#4A90E2;stop-opacity:0.5" />
                <stop offset="100%" style="stop-color:#2874A6;stop-opacity:0.1" />
            </radialGradient>

            <!-- Mop Head Gradient (Damp Cotton) -->
            <linearGradient id="mopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#F2F0E9;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#D5CFC5;stop-opacity:1" />
            </linearGradient>

            <!-- Drop Shadow Filter -->
            <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
                <feOffset dx="15" dy="25" result="offsetblur"/>
                <feComponentTransfer>
                    <feFuncA type="linear" slope="0.3"/>
                </feComponentTransfer>
                <feMerge> 
                    <feMergeNode/>
                    <feMergeNode in="SourceGraphic"/> 
                </feMerge>
            </filter>

            <!-- Wetness Blur -->
            <filter id="wetBlur">
                <feGaussianBlur stdDeviation="2"/>
            </filter>
        </defs>

        <!-- Composition Group: Positioned to sit on the floor plane -->
        <g transform="translate(850, 480)">
            
            <!-- 1. The Spilled Mess (Organic & Wet) -->
            <g transform="translate(0, 0)">
                <!-- Shadow for depth -->
                <ellipse cx="0" cy="0" rx="180" ry="70" fill="rgba(0,0,0,0.1)" filter="url(#wetBlur)"/>
                
                <!-- Main Liquid Body -->
                <path d="M-160,-10 C-180,-60 -80,-90 20,-80 C120,-70 180,-30 160,20 C140,70 60,90 0,90 C-100,90 -180,50 -160,-10 Z" 
                      fill="url(#liquidGrad)"/>
                
                <!-- Specular Highlight (The "Wet" look) -->
                <path d="M-100,-30 C-60,-50 40,-50 80,-20" stroke="white" stroke-width="3" fill="none" opacity="0.6" filter="url(#wetBlur)"/>
                <path d="M-140,10 C-120,-10 -60,-20 -20,-10" stroke="white" stroke-width="1.5" fill="none" opacity="0.4"/>

                <!-- Foam Splatter -->
                <circle cx="-120" cy="-30" r="4" fill="#fff" opacity="0.7"/>
                <circle cx="100" cy="40" r="6" fill="#fff" opacity="0.6"/>
                <circle cx="-40" cy="60" r="3" fill="#fff" opacity="0.8"/>
                
                <!-- Animated Bubbles -->
                <circle cx="0" cy="-10" r="10" stroke="#E0F7FA" stroke-width="1" fill="none" class="bubble" style="animation-delay: 0.2s;"/>
                <circle cx="40" cy="20" r="14" stroke="#E0F7FA" stroke-width="1" fill="none" class="bubble" style="animation-delay: 1.5s;"/>
                <circle cx="-60" cy="10" r="8" stroke="#E0F7FA" stroke-width="1" fill="none" class="bubble" style="animation-delay: 2.8s;"/>
            </g>

            <!-- 2. The Bucket (Lowered & Cohesive) -->
            <g transform="translate(-180, -40)" filter="url(#dropShadow)">
                <!-- Bucket Body -->
                <path d="M-70,-80 L-80,80 C-80,95 -50,105 0,105 C50,105 80,95 80,80 L70,-80 Z" 
                      fill="url(#bucketGrad)" />
                
                <!-- Rim -->
                <ellipse cx="0" cy="-80" rx="70" ry="18" fill="#A04F32" stroke="#6E3520" stroke-width="2"/>
                <ellipse cx="0" cy="-80" rx="62" ry="14" fill="#4A2515"/> <!-- Dark Interior -->
                
                <!-- Water inside bucket -->
                <ellipse cx="0" cy="-76" rx="58" ry="10" fill="#4A90E2" opacity="0.9"/>
                <path d="M-30,-76 Q0,-72 30,-76" stroke="white" stroke-width="1" fill="none" opacity="0.5"/>

                <!-- Handle -->
                <path d="M-65,-80 C-65,-200 65,-200 65,-80" fill="none" stroke="#2C2A26" stroke-width="6" stroke-linecap="round"/>
            </g>

            <!-- 3. The Mop (Interacting with Puddle) -->
            <g class="mop-group">
                <!-- Handle (Wood) -->
                <line x1="-280" y1="-250" x2="80" y2="40" stroke="#D49A6A" stroke-width="12" stroke-linecap="round" filter="url(#dropShadow)"/>
                <line x1="-280" y1="-250" x2="80" y2="40" stroke="#E8C39E" stroke-width="4" stroke-linecap="round" opacity="0.5"/> <!-- Highlight -->

                <!-- Mop Head Base -->
                <g transform="translate(80, 40)">
                    <!-- Connector -->
                    <path d="M-10,-10 L10,-10 L15,10 L-15,10 Z" fill="#333"/>
                    
                    <!-- Strands -->
                    <g transform="rotate(10)">
                        <path d="M-5,10 Q-20,50 -40,80" stroke="url(#mopGrad)" stroke-width="16" stroke-linecap="round"/>
                        <path d="M0,10 Q0,60 -10,90" stroke="url(#mopGrad)" stroke-width="18" stroke-linecap="round"/>
                        <path d="M5,10 Q20,50 40,70" stroke="url(#mopGrad)" stroke-width="14" stroke-linecap="round"/>
                        
                        <!-- Wet/Darker Strands -->
                        <path d="M-2,10 Q-5,60 -15,85" stroke="#85C1E9" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
                        <path d="M2,10 Q10,40 20,60" stroke="#85C1E9" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
                    </g>
                </g>
            </g>

        </g>
    </svg>

</div>

</body>
</html>
