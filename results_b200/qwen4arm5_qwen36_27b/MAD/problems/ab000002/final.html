<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Ascension - Skill Matrix</title>
<style>
    :root {
        /* PALETTE: DEEP ETHEREAL */
        --bg-deep: #050308;
        --bg-panel: #0e0b14;
        --bg-panel-light: #161120;
        
        --accent-gold: #eebb44;
        --accent-gold-dim: #8a6d1e;
        --accent-glow: rgba(238, 187, 68, 0.4);
        
        --accent-violet: #8b5cf6;
        --accent-violet-dark: #4c1d95;
        --accent-violet-glow: rgba(139, 92, 246, 0.5);
        
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --text-dim: #475569;

        --node-locked-bg: #110e17;
        --node-border: #2e243a;

        /* TYPOGRAPHY */
        --font-display: 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', system-ui, sans-serif;
        --font-mono: 'Consolas', monospace;

        /* SPACING & GRID */
        --sidebar-width: 280px;
        --node-size: 80px; /* Rigid Grid Size */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        
        /* Deep Void Radial Background */
        background-image: 
            radial-gradient(circle at 50% 30%, #1a1025 0%, #050308 80%),
            radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.05) 0%, transparent 40%);
        background-repeat: no-repeat;
    }

    /* Noise Texture Overlay */
    body::after {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
    }

    /* --- LAYOUT --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
        z-index: 1;
    }

    /* --- SIDEBAR --- */
    aside {
        width: var(--sidebar-width);
        height: 100%;
        background: linear-gradient(180deg, rgba(15, 12, 22, 0.95) 0%, rgba(8, 6, 12, 0.98) 100%);
        border-right: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        padding: 24px;
        z-index: 10;
        backdrop-filter: blur(8px);
        box-shadow: 5px 0 30px rgba(0,0,0,0.6);
    }

    /* Decorative Sidebar Line */
    aside::after {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0;
        width: 1px;
        background: linear-gradient(to bottom, transparent, var(--accent-gold-dim), transparent);
        opacity: 0.3;
    }

    /* Typography & Header */
    .sidebar-header {
        margin-bottom: 24px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding-bottom: 16px;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 1.4rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-main);
        margin: 0;
        font-weight: 700;
        line-height: 1.2;
        background: linear-gradient(to bottom right, #fff, #cbd5e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 2px 10px rgba(255,255,255,0.1);
    }

    .subtitle {
        font-family: var(--font-body);
        font-size: 0.65rem;
        color: var(--accent-gold);
        letter-spacing: 0.25em;
        margin-top: 6px;
        text-transform: uppercase;
        font-weight: 700;
        opacity: 0.8;
    }

    /* Character Identity */
    .char-header {
        margin-bottom: 28px;
    }
    
    .char-name {
        font-size: 1.35rem; /* Increased Size */
        font-family: var(--font-display); /* Stylized font */
        color: var(--text-main);
        font-weight: 700; /* Bold */
        line-height: 1.2;
        margin-bottom: 4px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    
    .char-class {
        color: var(--accent-violet);
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-weight: 700;
        text-shadow: 0 0 8px var(--accent-violet-glow);
    }

    /* Status Block */
    .status-block {
        background: var(--bg-panel-light);
        border: 1px solid rgba(255,255,255,0.05);
        padding: 20px;
        border-radius: 2px;
        margin-bottom: 24px;
        position: relative;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }

    .level-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 12px;
    }

    .level-num {
        font-family: var(--font-display);
        font-size: 2.8rem;
        line-height: 0.8;
        color: var(--text-main);
        font-weight: 700;
    }

    .level-label {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-muted); /* Lightened grey */
        letter-spacing: 0.1em;
    }

    /* XP Bar - Metallic Gradient */
    .xp-track {
        height: 6px;
        background: #000;
        border-radius: 2px;
        overflow: hidden;
        position: relative;
        margin-top: 8px;
        border: 1px solid rgba(255,255,255,0.1);
    }

    .xp-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--accent-violet), var(--accent-gold));
        box-shadow: 0 0 10px var(--accent-violet-glow);
        border-radius: 2px;
        position: relative;
    }
    
    /* Shimmer effect */
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
        width: 100%;
        transform: translateX(-100%);
        animation: shimmer 4s infinite;
    }

    .xp-text {
        display: flex;
        justify-content: space-between;
        font-size: 0.65rem;
        color: var(--text-muted); /* Lightened */
        margin-top: 8px;
        font-family: var(--font-mono);
    }

    /* Skill Points - Rich Gold */
    .points-display {
        background: linear-gradient(135deg, rgba(238, 187, 68, 0.05), rgba(0,0,0,0));
        border: 1px solid rgba(238, 187, 68, 0.3);
        padding: 16px;
        border-radius: 2px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    
    .points-display::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
    }

    .points-val {
        font-size: 2.2rem;
        font-family: var(--font-display);
        font-weight: 700;
        color: var(--accent-gold);
        text-shadow: 0 0 10px rgba(238, 187, 68, 0.4);
        line-height: 1;
    }

    .points-label {
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        font-weight: 700;
        text-align: right;
        line-height: 1.2;
    }

    /* Stats List */
    .stats-list {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
    }
    
    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        padding: 8px 12px;
        background: rgba(255,255,255,0.01);
        border: 1px solid rgba(255,255,255,0.03);
        border-radius: 2px;
        transition: background 0.2s;
    }
    
    .stat-row:hover {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.08);
    }
    
    .stat-name { color: var(--text-muted); font-weight: 500; letter-spacing: 0.02em; }
    .stat-val { color: var(--text-main); font-weight: 700; font-family: var(--font-mono); }

    /* --- WORKSPACE (Skill Tree) --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: 
            radial-gradient(circle at center, rgba(30, 27, 43, 0.2) 0%, transparent 60%),
            linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 100% 100%, var(--node-size) var(--node-size), var(--node-size) var(--node-size);
    }

    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1600px;
        height: 1400px;
        transform-origin: center center;
        transition: transform 0.1s linear;
        pointer-events: none;
    }

    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: visible;
    }

    /* Lines - Glowing Matrix */
    .connection-line {
        stroke: #2e243a;
        stroke-width: 2;
        fill: none;
        transition: all 0.5s ease;
    }

    .connection-line.active {
        stroke: var(--accent-gold);
        stroke-width: 3;
        filter: drop-shadow(0 0 6px rgba(238, 187, 68, 0.6));
    }

    .connection-line.available {
        stroke: var(--accent-violet);
        stroke-width: 2;
        stroke-dasharray: 8, 8;
        opacity: 0.6;
        filter: drop-shadow(0 0 4px rgba(139, 92, 246, 0.3));
    }

    /* --- NODES --- */
    .node {
        position: absolute;
        width: var(--node-size);
        height: var(--node-size);
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        pointer-events: auto;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* Node Shape - Square container with Inner Hexagon */
    .node-shape {
        width: 100%;
        height: 100%;
        background: var(--node-locked-bg);
        /* Hexagon Clip */
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        transition: all 0.3s ease;
    }
    
    /* Bevel/Border effect via pseudo element since clip-path cuts borders */
    .node-shape::before {
        content: '';
        position: absolute;
        inset: 1px;
        background: var(--node-locked-bg);
        z-index: 1;
    }

    .node-shape::after {
        content: '';
        position: absolute;
        inset: 0;
        border: 2px solid var(--node-border);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        z-index: 2;
        transition: all 0.3s ease;
    }

    .node-icon {
        width: 36px;
        height: 36px;
        fill: var(--text-dim);
        opacity: 0.4;
        transition: all 0.3s ease;
        z-index: 3;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }

    /* --- NODE STATES --- */
    
    /* Unlocked (Active) - Gold & Rich */
    .node.unlocked .node-shape {
        background: linear-gradient(135deg, #2a2235, #1e1529);
    }
    
    .node.unlocked .node-shape::after {
        border-color: var(--accent-gold);
        box-shadow: 0 0 15px rgba(238, 187, 68, 0.2);
    }

    .node.unlocked .node-icon {
        fill: var(--accent-gold);
        opacity: 1;
        filter: drop-shadow(0 0 5px rgba(238, 187, 68, 0.5));
    }
    
    /* Available (Hoverable) - Violet & Electric */
    .node.available .node-shape {
        background: rgba(139, 92, 246, 0.05);
    }
    
    .node.available .node-shape::after {
        border-color: var(--accent-violet);
        box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
    }
    
    .node.available:hover .node-shape {
        transform: scale(1.1);
        background: rgba(139, 92, 246, 0.15);
    }
    
    .node.available:hover .node-shape::after {
        border-color: #c4b5fd;
        box-shadow: 0 0 20px var(--accent-violet);
    }
    
    .node.available .node-icon {
        fill: #c4b5fd;
        opacity: 0.8;
    }

    /* Locked (Default) */
    .node:hover {
        z-index: 10;
    }

    /* --- TOOLTIP --- */
    .tooltip {
        position: fixed;
        background: rgba(15, 12, 22, 0.98);
        border: 1px solid var(--accent-violet);
        padding: 24px;
        width: 340px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 0 1px rgba(139, 92, 246, 0.2);
        backdrop-filter: blur(12px);
    }

    .tooltip::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(139, 92, 246, 0.08), transparent);
        z-index: -1;
        pointer-events: none;
        border-radius: 4px;
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        color: var(--text-main);
        font-family: var(--font-display);
        margin-bottom: 6px;
        font-size: 1.4rem;
        letter-spacing: 0.05em;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 10px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .tooltip .type {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--accent-gold);
        margin-bottom: 14px;
        letter-spacing: 0.15em;
        font-weight: 700;
    }

    .tooltip p {
        font-size: 0.9rem;
        line-height: 1.6;
        color: #cbd5e1;
        margin-bottom: 0;
        font-weight: 300;
    }

    .tooltip .req {
        margin-top: 16px;
        font-size: 0.75rem;
        color: #f472b6;
        display: none;
        border-top: 1px solid rgba(255,255,255,0.1);
        padding-top: 10px;
        font-style: italic;
        font-family: var(--font-mono);
    }

    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-muted); border-color: rgba(255,255,255,0.05); }
    .tooltip.locked { border-color: var(--node-border); }

    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }

</style>
</head>
<body>

    <div class="main-layout">
        <!-- CONTROL PANEL (Sidebar) -->
        <aside>
            <div class="sidebar-header">
                <h1>Aether Ascension</h1>
                <div class="subtitle">Matrix of Power</div>
            </div>

            <div class="char-header">
                <h2 class="char-name">Kaelen Thorne</h2>
                <div class="char-class">Void Walker</div>
            </div>

            <!-- Status Block -->
            <div class="status-block">
                <div class="level-row">
                    <span class="level-num">42</span>
                    <span class="level-label">Level</span>
                </div>
                <div class="xp-track">
                    <div class="xp-fill"></div>
                </div>
                <div class="xp-text">
                    <span>XP</span>
                    <span>12,450 / 20,000</span>
                </div>
            </div>

            <!-- Skill Points -->
            <div class="points-display">
                <span class="points-val">3</span>
                <span class="points-label">Skill Points<br>Available</span>
            </div>

            <!-- Stats List -->
            <div class="stats-list">
                <div class="stat-row"><span class="stat-name">Strength</span><span class="stat-val">14</span></div>
                <div class="stat-row"><span class="stat-name">Dexterity</span><span class="stat-val">28</span></div>
                <div class="stat-row"><span class="stat-name">Intelligence</span><span class="stat-val">35</span></div>
                <div class="stat-row"><span class="stat-name">Vitality</span><span class="stat-val">12</span></div>
                <div class="stat-row"><span class="stat-name">Arcana</span><span class="stat-val">41</span></div>
            </div>
        </aside>

        <!-- WORKSPACE (Skill Tree) -->
        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected by JS -->
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- DATA ---
    // Coordinates adjusted for a more centered, symmetric matrix layout
    // Grid: 128px spacing roughly
    const skills = [
        { id: 'root', x: 800, y: 100, name: "Void Spark", type: "Origin", desc: "The genesis of your power. Increases void damage by 10%.", unlocked: true, req: null },
        
        // Branch 1: Strength/Physical (Left)
        { id: 'str1', x: 500, y: 300, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4 and weapon weight.", unlocked: true, req: 'root' },
        { id: 'str2', x: 300, y: 500, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str3', x: 200, y: 700, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back. +20% Resist.", unlocked: false, req: 'str2' },
        { id: 'str4', x: 200, y: 900, name: "Earthshaker", type: "Ultimate", desc: "Shatter the ground beneath enemies.", unlocked: false, req: 'str3' },
        { id: 'str5', x: 300, y: 1100, name: "Colossus", type: "Passive", desc: "Massive health increase, slow regen.", unlocked: false, req: 'str4' },

        // Branch 2: Dexterity/Mobility (Right)
        { id: 'dex1', x: 1100, y: 300, name: "Shadow Step", type: "Passive", desc: "Increases Movement Speed by 8%.", unlocked: true, req: 'root' },
        { id: 'dex2', x: 1300, y: 500, name: "Evasion", type: "Passive", desc: "15% chance to dodge melee attacks.", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 1400, y: 700, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1400, y: 900, name: "Phantom Blade", type: "Ultimate", desc: "Strike from the shadows instantly.", unlocked: false, req: 'dex3' },
        { id: 'dex5', x: 1300, y: 1100, name: "Speed Demon", type: "Passive", desc: "Attack speed +50%.", unlocked: false, req: 'dex4' },

        // Branch 3: Intelligence/Magic (Center)
        { id: 'int1', x: 800, y: 500, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regen by 15%.", unlocked: false, req: 'root' },
        { id: 'int2', x: 600, y: 700, name: "Fireball", type: "Active", desc: "Launch a projectile of void fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 1000, y: 700, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        { id: 'int4', x: 800, y: 900, name: "Mana Shield", type: "Passive", desc: "Absorb damage with mana.", unlocked: false, req: 'int2' },
        
        // Endgame Nodes
        { id: 'hybrid1', x: 600, y: 1100, name: "Entropy", type: "Passive", desc: "Damage decays enemy armor.", unlocked: false, req: 'int4' },
        { id: 'hybrid2', x: 1000, y: 1100, name: "Singularity", type: "Ultimate", desc: "Create a black hole.", unlocked: false, req: 'int4' }
    ];

    // --- ICONS (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z",
        origin: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const ww = 1600;
        const wh = 1400;
        
        // Initial center
        world.style.transform = `translate(${cw/2 - ww/2}px, ${ch/2 - wh/2}px)`;

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.type === 'Origin') iconPath = icons.origin;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('mousemove', (e) => moveTooltip(e));
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        updateVisuals();
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        moveTooltip(e);
    }

    function moveTooltip(e) {
        const x = e.clientX;
        const y = e.clientY;
        const ttW = 360;
        const ttH = 200;
        
        let left = x + 20;
        let top = y - 20;

        if (left + ttW > window.innerWidth) left = x - ttW - 20;
        if (top + ttH > window.innerHeight) top = window.innerHeight - ttH - 10;
        
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        const parent = skills.find(s => s.id === skill.req);
        
        if (!skill.unlocked) {
            if (!skill.req || (parent && parent.unlocked)) {
                skill.unlocked = true;
                updateVisuals();
            }
        } else {
            // Prevent removing root or if children depend on it (simple check)
            const hasChildren = skills.some(s => s.req === id && s.unlocked);
            if (!hasChildren) {
                skill.unlocked = false;
                updateVisuals();
            }
        }
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            el.classList.remove('unlocked', 'available');
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) el.classList.add('available');
            }
        });

        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    } else if (parent.unlocked) {
                        line.classList.add('available');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = container.clientWidth/2 - 800;
    let panY = container.clientHeight/2 - 700;
    let scale = 1;

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.4, scale + delta), 2.5);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    init();

</script>
</body>
</html>
