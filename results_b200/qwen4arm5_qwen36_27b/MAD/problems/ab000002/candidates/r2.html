<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Walker - Ascension</title>
<style>
    :root {
        /* Palette: Deep Void & Ethereal Glow */
        --bg-deep: #030206;
        --bg-panel: rgba(12, 8, 20, 0.75);
        --bg-panel-border: rgba(100, 80, 160, 0.25);
        
        --accent-primary: #8b5cf6; /* Soft Violet */
        --accent-secondary: #c4b5fd; /* Pale Violet */
        --accent-teal: #2dd4bf; /* Ethereal Teal */
        --accent-glow: rgba(139, 92, 246, 0.4);
        
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --text-dim: #64748b;
        
        --node-bg: #130f1a;
        --node-border: #332845;
        --node-active-bg: #2e1065;
        --node-active-border: #8b5cf6;
        
        --font-display: 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Inter', 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        
        /* Background: Noise + Radial Vignette */
        background-image: 
            radial-gradient(circle at 50% 50%, #1e1b4b 0%, transparent 60%),
            radial-gradient(circle at 50% 100%, #0f172a 0%, transparent 50%);
        background-repeat: no-repeat;
    }
    
    /* CSS Noise Texture Overlay */
    body::before {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
    }

    /* --- Header --- */
    header {
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 10;
        background: linear-gradient(to bottom, rgba(3,2,6,0.95), transparent);
    }

    .title-container {
        text-align: center;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 1.5rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
        margin: 0;
        font-weight: 600;
    }

    .subtitle {
        font-family: var(--font-display); /* Distinct identity */
        font-size: 0.7rem;
        color: var(--accent-teal);
        letter-spacing: 0.3em;
        margin-top: 2px;
        text-transform: uppercase;
        opacity: 0.9;
    }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
        z-index: 1;
    }

    /* --- Sidebar (25% Width) --- */
    aside {
        width: 25%;
        min-width: 320px;
        height: 100%;
        background: linear-gradient(90deg, rgba(5,2,10,0.9) 0%, rgba(5,2,10,0.6) 100%);
        border-right: 1px solid var(--bg-panel-border);
        padding: 40px 30px;
        display: flex;
        flex-direction: column;
        gap: 30px;
        z-index: 5;
        backdrop-filter: blur(16px);
        box-shadow: 5px 0 30px rgba(0,0,0,0.5);
        position: relative;
    }

    /* Decorative border */
    aside::after {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0;
        width: 1px;
        background: linear-gradient(to bottom, transparent, var(--accent-primary), transparent);
        opacity: 0.4;
    }

    /* Character Identity */
    .char-header {
        margin-bottom: 10px;
    }
    
    .char-name {
        font-size: 1.6rem;
        font-family: var(--font-display);
        color: var(--text-main);
        line-height: 1.2;
    }
    
    .char-class {
        color: var(--accent-teal);
        font-size: 0.8rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-weight: 600;
        margin-top: 4px;
    }

    /* Level Block */
    .level-block {
        display: flex;
        align-items: flex-end;
        gap: 10px;
    }

    .level-num {
        font-family: var(--font-display);
        font-size: 3.5rem;
        line-height: 0.9;
        color: var(--text-main);
        font-weight: 700;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .level-label {
        font-size: 0.85rem;
        font-weight: 500;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        margin-bottom: 10px;
    }

    /* XP Bar (Glassmorphism) */
    .xp-container {
        margin-top: 15px;
    }

    .xp-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-bottom: 8px;
        font-weight: 500;
    }

    .xp-track {
        height: 8px;
        background: #1e1b2e; /* Dark grey/purple base */
        border-radius: 4px;
        overflow: hidden;
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.05);
        position: relative;
    }

    .xp-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--accent-primary), var(--accent-teal));
        box-shadow: 0 0 12px var(--accent-primary);
        position: relative;
        border-radius: 4px;
    }
    
    /* Inner glow on XP fill */
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        width: 100%;
        transform: translateX(-100%);
        animation: shimmer 3s infinite;
    }

    /* Skill Points (Glassmorphism) */
    .points-display {
        background: rgba(139, 92, 246, 0.05);
        border: 1px solid rgba(139, 92, 246, 0.2);
        padding: 20px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(4px);
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    
    .points-display::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    }

    .points-val {
        font-size: 2.2rem;
        font-family: var(--font-body);
        font-weight: 700;
        color: var(--accent-teal);
        text-shadow: 0 0 10px rgba(45, 212, 191, 0.4);
    }

    .points-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        font-weight: 600;
        line-height: 1.2;
        text-align: right;
    }

    /* Stats List (Cleaned up) */
    .stats-list {
        margin-top: 10px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
    }
    
    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    
    .stat-name { color: var(--text-muted); font-weight: 500; }
    .stat-val { color: var(--text-main); font-weight: 600; }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        /* Subtle radial highlight in center */
        background: radial-gradient(circle at center, rgba(30, 27, 43, 0.3) 0%, transparent 70%);
    }

    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1400px;
        height: 1200px;
        transform-origin: center center;
        transition: transform 0.1s linear;
        pointer-events: none;
    }

    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: visible;
    }

    /* Lines */
    .connection-line {
        stroke: #2e243a;
        stroke-width: 2;
        fill: none;
        transition: all 0.5s ease;
    }

    .connection-line.active {
        stroke: var(--accent-primary);
        stroke-width: 3;
        filter: drop-shadow(0 0 5px var(--accent-primary));
    }

    .connection-line.available {
        stroke: #6d28d9;
        stroke-dasharray: 6, 6;
        opacity: 0.6;
    }

    /* --- Nodes (Thematic Shapes) --- */
    .node {
        position: absolute;
        width: 60px;
        height: 60px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        pointer-events: auto;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .node-shape {
        width: 100%;
        height: 100%;
        background: var(--node-bg);
        border: 2px solid var(--node-border);
        /* Fractured Hexagon / Rune Shape */
        clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        position: relative;
    }
    
    /* Inner detail for nodes */
    .node-shape::before {
        content: '';
        position: absolute;
        inset: 4px;
        background: rgba(255,255,255,0.02);
        clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
        transition: background 0.3s;
    }

    .node-icon {
        width: 24px;
        height: 24px;
        fill: var(--text-dim);
        opacity: 0.5;
        transition: all 0.3s ease;
        z-index: 2;
    }

    /* --- States --- */
    
    /* Unlocked */
    .node.unlocked .node-shape {
        border-color: var(--accent-teal);
        background: linear-gradient(135deg, #2e1065, #1e1b4b);
        box-shadow: 0 0 20px rgba(45, 212, 191, 0.2);
    }

    .node.unlocked .node-shape::before {
        background: rgba(45, 212, 191, 0.1);
    }

    .node.unlocked .node-icon {
        fill: var(--text-main);
        opacity: 1;
        filter: drop-shadow(0 0 3px var(--accent-teal));
    }
    
    /* Available */
    .node.available .node-shape {
        border-color: var(--accent-primary);
        background: rgba(139, 92, 246, 0.1);
    }
    
    .node.available:hover .node-shape {
        transform: scale(1.1);
        border-color: var(--text-main);
        background: rgba(139, 92, 246, 0.25);
        box-shadow: 0 0 15px var(--accent-primary);
    }
    
    .node.available .node-icon {
        fill: var(--accent-secondary);
        opacity: 0.9;
    }

    /* Locked (Default) */
    .node:hover {
        z-index: 10;
    }
    
    /* Tooltip */
    .tooltip {
        position: fixed;
        background: rgba(8, 5, 16, 0.95);
        border: 1px solid var(--accent-primary);
        padding: 20px;
        width: 320px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(139, 92, 246, 0.2);
        backdrop-filter: blur(8px);
    }

    .tooltip::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(45deg, rgba(139, 92, 246, 0.1), transparent);
        z-index: -1;
        pointer-events: none;
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        color: var(--text-main);
        font-family: var(--font-display);
        margin-bottom: 4px;
        font-size: 1.3rem;
        letter-spacing: 0.05em;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 8px;
    }

    .tooltip .type {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--accent-teal);
        margin-bottom: 12px;
        letter-spacing: 0.15em;
        font-weight: 700;
    }

    .tooltip p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #cbd5e1;
        margin-bottom: 0;
    }

    .tooltip .req {
        margin-top: 12px;
        font-size: 0.75rem;
        color: #f472b6;
        display: none;
        border-top: 1px solid rgba(255,255,255,0.1);
        padding-top: 8px;
        font-style: italic;
    }

    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-muted); border-color: rgba(255,255,255,0.05); }
    .tooltip.locked { border-color: var(--node-border); }

    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #05020a; }
    ::-webkit-scrollbar-thumb { background: #4c1d95; border-radius: 3px; }

</style>
</head>
<body>

    <header>
        <div class="title-container">
            <h1>Ascension</h1>
            <div class="subtitle">Void Walker</div>
        </div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="char-header">
                <h2 class="char-name">Kaelen Thorne</h2>
                <div class="char-class">Void Walker</div>
            </div>

            <div class="level-block">
                <span class="level-num">42</span>
                <span class="level-label">Level</span>
            </div>

            <div class="xp-container">
                <div class="xp-labels">
                    <span>Experience</span>
                    <span>12,450 / 20,000</span>
                </div>
                <div class="xp-track">
                    <div class="xp-fill"></div>
                </div>
            </div>

            <div class="points-display">
                <span class="points-val">3</span>
                <span class="points-label">Skill Points<br>Available</span>
            </div>

            <div class="stats-list">
                <div class="stat-row"><span class="stat-name">Strength</span><span class="stat-val">14</span></div>
                <div class="stat-row"><span class="stat-name">Dexterity</span><span class="stat-val">28</span></div>
                <div class="stat-row"><span class="stat-name">Intelligence</span><span class="stat-val">35</span></div>
                <div class="stat-row"><span class="stat-name">Vitality</span><span class="stat-val">12</span></div>
                <div class="stat-row"><span class="stat-name">Arcana</span><span class="stat-val">41</span></div>
            </div>
        </aside>

        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected by JS -->
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data ---
    const skills = [
        { id: 'root', x: 700, y: 100, name: "Void Spark", type: "Origin", desc: "The genesis of your power. Increases void damage by 10%.", unlocked: true, req: null },
        
        // Branch 1: Strength/Physical
        { id: 'str1', x: 450, y: 280, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4 and weapon weight.", unlocked: true, req: 'root' },
        { id: 'str2', x: 300, y: 480, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str3', x: 150, y: 680, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back. +20% Resist.", unlocked: false, req: 'str2' },
        { id: 'str4', x: 150, y: 900, name: "Earthshaker", type: "Ultimate", desc: "Shatter the ground beneath enemies.", unlocked: false, req: 'str3' },

        // Branch 2: Dexterity/Mobility
        { id: 'dex1', x: 950, y: 280, name: "Shadow Step", type: "Passive", desc: "Increases Movement Speed by 8%.", unlocked: true, req: 'root' },
        { id: 'dex2', x: 1100, y: 480, name: "Evasion", type: "Passive", desc: "15% chance to dodge melee attacks.", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 1250, y: 680, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1250, y: 900, name: "Phantom Blade", type: "Ultimate", desc: "Strike from the shadows instantly.", unlocked: false, req: 'dex3' },

        // Branch 3: Intelligence/Magic
        { id: 'int1', x: 700, y: 420, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regen by 15%.", unlocked: false, req: 'root' },
        { id: 'int2', x: 550, y: 620, name: "Fireball", type: "Active", desc: "Launch a projectile of void fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 850, y: 620, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        { id: 'int4', x: 700, y: 820, name: "Mana Shield", type: "Passive", desc: "Absorb damage with mana.", unlocked: false, req: 'int2' },

        // Ultimate Center
        { id: 'hybrid', x: 700, y: 1050, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows. Master of all.", unlocked: false, req: 'str4' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z",
        origin: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const ww = 1400;
        const wh = 1200;
        
        // Initial center
        world.style.transform = `translate(${cw/2 - ww/2}px, ${ch/2 - wh/2}px)`;

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.type === 'Origin') iconPath = icons.origin;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('mousemove', (e) => moveTooltip(e));
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        updateVisuals();
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        moveTooltip(e);
    }

    function moveTooltip(e) {
        const x = e.clientX;
        const y = e.clientY;
        const ttW = 320;
        const ttH = 180;
        
        let left = x + 20;
        let top = y - 20;

        if (left + ttW > window.innerWidth) left = x - ttW - 20;
        if (top + ttH > window.innerHeight) top = window.innerHeight - ttH - 10;
        
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        const parent = skills.find(s => s.id === skill.req);
        
        if (!skill.unlocked) {
            if (!skill.req || (parent && parent.unlocked)) {
                skill.unlocked = true;
                updateVisuals();
            }
        } else {
            skill.unlocked = false;
            updateVisuals();
        }
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            el.classList.remove('unlocked', 'available');
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) el.classList.add('available');
            }
        });

        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    } else if (parent.unlocked) {
                        line.classList.add('available');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = container.clientWidth/2 - 700;
    let panY = container.clientHeight/2 - 600;
    let scale = 1;

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    init();

</script>
</body>
</html>
