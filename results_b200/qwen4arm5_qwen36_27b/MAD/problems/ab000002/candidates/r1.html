<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Walker - Ascension</title>
<style>
    :root {
        /* Palette: Void Walker */
        --bg-deep: #05020a;
        --bg-panel: rgba(15, 10, 25, 0.85);
        --bg-panel-border: rgba(100, 50, 150, 0.3);
        
        --accent-primary: #a855f7; /* Electric Violet */
        --accent-secondary: #d8b4fe; /* Light Purple */
        --accent-cyan: #06b6d4; /* Ethereal Cyan */
        
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-dim: #475569;
        
        --node-locked: #1e1b2e;
        --node-locked-border: #4c1d95;
        --node-unlocked: #2e1065;
        --node-glow: rgba(168, 85, 247, 0.6);
        
        --font-display: 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        /* Atmospheric Background */
        background-image: 
            radial-gradient(circle at 50% 50%, #2e1065 0%, transparent 60%),
            radial-gradient(circle at 20% 80%, #1e1b4b 0%, transparent 40%),
            radial-gradient(circle at 80% 20%, #312e81 0%, transparent 40%);
    }

    /* --- Header --- */
    header {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 10;
        border-bottom: 1px solid rgba(168, 85, 247, 0.1);
        background: linear-gradient(to bottom, rgba(5,2,10,0.9), transparent);
    }

    .title-container {
        text-align: center;
        position: relative;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 1.8rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        margin: 0;
    }

    .subtitle {
        font-size: 0.75rem;
        color: var(--accent-cyan);
        letter-spacing: 0.4em;
        margin-top: 2px;
        text-transform: uppercase;
        font-weight: 600;
    }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
    }

    /* --- Sidebar (Priority 1 & 4) --- */
    aside {
        width: 25%; /* 25% width as requested */
        min-width: 300px;
        background: linear-gradient(90deg, rgba(5,2,10,0.95) 0%, rgba(5,2,10,0.8) 100%);
        border-right: 1px solid var(--bg-panel-border);
        padding: 40px 30px;
        display: flex;
        flex-direction: column;
        gap: 40px; /* Consistent Rhythm */
        z-index: 5;
        backdrop-filter: blur(12px);
        box-shadow: 10px 0 40px rgba(0,0,0,0.6);
        position: relative;
    }

    /* Decorative sidebar border */
    aside::after {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0;
        width: 1px;
        background: linear-gradient(to bottom, transparent, var(--accent-primary), transparent);
        opacity: 0.3;
    }

    .stat-block {
        display: flex;
        flex-direction: column;
        gap: 15px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding-bottom: 20px;
    }
    
    .stat-block:last-child { border-bottom: none; }

    /* Level Block */
    .level-display {
        display: flex;
        align-items: flex-end; /* Align bottom */
        gap: 12px;
        align-items: baseline;
    }

    .level-num {
        font-family: var(--font-display);
        font-size: 4.5rem;
        line-height: 1;
        color: var(--text-main);
        font-weight: 700;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .level-label {
        font-size: 0.9rem; /* Reduced size */
        font-weight: 400;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        margin-bottom: 8px; /* Optical alignment */
    }

    /* XP Bar */
    .xp-container {
        margin-top: 10px;
    }

    .xp-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-bottom: 6px;
        font-family: var(--font-body);
        letter-spacing: 0.05em;
    }

    .xp-bar-bg {
        height: 6px;
        background: #110a1a;
        border-radius: 2px;
        overflow: hidden;
        border: 1px solid rgba(168, 85, 247, 0.2);
        position: relative;
    }

    .xp-bar-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--accent-primary), var(--accent-cyan));
        box-shadow: 0 0 10px var(--accent-primary);
        position: relative;
    }
    
    .xp-bar-fill::after {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
        width: 100%;
        transform: translateX(-100%);
        animation: shimmer 3s infinite;
    }

    /* Points Block */
    .points-display {
        background: rgba(168, 85, 247, 0.05);
        padding: 20px;
        border: 1px solid var(--bg-panel-border);
        border-left: 3px solid var(--accent-primary);
        border-radius: 2px;
        text-align: left; /* Left align for grid discipline */
        transition: all 0.3s ease;
    }

    .points-val {
        font-size: 2.5rem;
        font-family: var(--font-display);
        color: var(--accent-primary);
        display: block;
        line-height: 1;
        text-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
    }

    .points-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-muted);
        margin-top: 5px;
        display: block;
    }

    /* Character Details */
    .character-details {
        margin-top: auto;
    }
    
    .char-name {
        font-size: 1.4rem;
        font-family: var(--font-display);
        margin-bottom: 2px;
        color: var(--text-main);
    }
    
    .char-class {
        color: var(--accent-secondary);
        font-size: 0.8rem;
        margin-bottom: 25px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px; /* Increased spacing */
        font-size: 0.9rem;
        border-bottom: 1px dashed rgba(255,255,255,0.05);
        padding-bottom: 4px;
    }
    .stat-row:last-child { border-bottom: none; }
    
    /* Lightened grey text for contrast (Priority 3) */
    .stat-row span:first-child { color: #cbd5e1; } 
    .stat-row span:last-child { font-weight: 700; color: var(--text-main); font-family: var(--font-display); }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1; /* Occupies remaining 75% */
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, rgba(30, 27, 43, 0.4) 0%, transparent 70%);
    }

    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1200px;
        height: 1000px;
        transform-origin: center center;
        transition: transform 0.1s linear;
        pointer-events: none; /* Let clicks pass to container for panning if not on node */
    }

    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: visible;
    }

    /* Lines */
    .connection-line {
        stroke: #3b0764; /* Dark purple for inactive */
        stroke-width: 2;
        fill: none;
        transition: all 0.5s ease;
    }

    .connection-line.active {
        stroke: var(--accent-primary);
        stroke-width: 3;
        filter: drop-shadow(0 0 6px var(--accent-primary));
    }

    .connection-line.available {
        stroke: #6d28d9;
        stroke-dasharray: 5, 5;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        width: 70px;
        height: 70px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        pointer-events: auto;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .node-shape {
        width: 100%;
        height: 100%;
        /* Priority 2: Locked nodes have faint outlines/dark fills */
        background: var(--node-locked);
        border: 2px solid var(--node-locked-border);
        border-radius: 50%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* Inner ring detail */
    .node-shape::after {
        content: '';
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.05);
        pointer-events: none;
    }

    .node-icon {
        width: 28px;
        height: 28px;
        fill: var(--text-dim);
        opacity: 0.4;
        transition: all 0.3s ease;
    }

    /* --- States --- */
    
    /* Unlocked */
    .node.unlocked .node-shape {
        border-color: var(--accent-cyan);
        background: radial-gradient(circle at 30% 30%, #4c1d95, #1e1b4b);
        box-shadow: 0 0 20px var(--node-glow), inset 0 0 10px rgba(168, 85, 247, 0.5);
    }

    .node.unlocked .node-icon {
        fill: var(--text-main);
        opacity: 1;
        filter: drop-shadow(0 0 2px var(--accent-cyan));
    }
    
    /* Available (Parent unlocked) */
    .node.available .node-shape {
        border-color: var(--accent-primary);
        background: rgba(168, 85, 247, 0.1);
    }
    
    .node.available:hover .node-shape {
        transform: scale(1.15);
        border-color: var(--text-main);
        background: rgba(168, 85, 247, 0.3);
        box-shadow: 0 0 15px var(--accent-primary);
    }
    
    .node.available .node-icon {
        fill: var(--accent-secondary);
        opacity: 0.8;
    }

    /* Locked (Default) */
    .node:hover {
        z-index: 10;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(10, 5, 20, 0.95);
        border: 1px solid var(--accent-primary);
        padding: 20px;
        width: 300px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 15px 40px rgba(0,0,0,0.9), 0 0 0 1px rgba(168, 85, 247, 0.1);
        backdrop-filter: blur(8px);
    }

    .tooltip::before {
        content: '';
        position: absolute;
        top: -1px; left: -1px; right: -1px; bottom: -1px;
        background: linear-gradient(45deg, var(--accent-primary), transparent, var(--accent-cyan));
        z-index: -1;
        opacity: 0.3;
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        color: var(--accent-secondary);
        font-family: var(--font-display);
        margin-bottom: 4px;
        font-size: 1.2rem;
        letter-spacing: 0.05em;
    }

    .tooltip .type {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--accent-cyan);
        margin-bottom: 12px;
        letter-spacing: 0.1em;
        font-weight: bold;
    }

    .tooltip p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #cbd5e1;
        margin-bottom: 0;
    }

    .tooltip .req {
        margin-top: 12px;
        font-size: 0.75rem;
        color: #f472b6; /* Pinkish for locked */
        display: none;
        border-top: 1px solid rgba(255,255,255,0.1);
        padding-top: 8px;
    }

    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-muted); }
    .tooltip.locked { border-color: var(--node-locked-border); }

    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #05020a; }
    ::-webkit-scrollbar-thumb { background: #4c1d95; border-radius: 3px; }

</style>
</head>
<body>

    <header>
        <div class="title-container">
            <h1>Ascension</h1>
            <div class="subtitle">Void Walker</div>
        </div>
    </header>

    <div class="main-layout">
        <aside>
            <!-- Priority 4: Consistent vertical spacing -->
            <div class="stat-block">
                <div class="level-display">
                    <span class="level-num">42</span>
                    <span class="level-label">Level</span>
                </div>
                <div class="xp-container">
                    <div class="xp-labels">
                        <span>Experience</span>
                        <span>12,450 / 20,000</span>
                    </div>
                    <div class="xp-bar-bg">
                        <div class="xp-bar-fill"></div>
                    </div>
                </div>
            </div>

            <div class="points-display">
                <span class="points-val">3</span>
                <span class="points-label">Skill Points Available</span>
            </div>

            <div class="character-details">
                <h2 class="char-name">Kaelen Thorne</h2>
                <div class="char-class">Void Walker</div>
                
                <!-- Priority 3: Better contrast on labels -->
                <div class="stat-row"><span>Strength</span><span>14</span></div>
                <div class="stat-row"><span>Dexterity</span><span>28</span></div>
                <div class="stat-row"><span>Intelligence</span><span>35</span></div>
                <div class="stat-row"><span>Vitality</span><span>12</span></div>
                <div class="stat-row"><span>Arcana</span><span>41</span></div>
            </div>
        </aside>

        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <!-- SVG Lines injected by JS -->
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected by JS -->
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data ---
    const skills = [
        { id: 'root', x: 600, y: 80, name: "Void Spark", type: "Origin", desc: "The genesis of your power. Increases void damage by 10%.", unlocked: true, req: null },
        
        // Branch 1: Strength/Physical
        { id: 'str1', x: 400, y: 220, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4 and weapon weight.", unlocked: true, req: 'root' },
        { id: 'str2', x: 250, y: 380, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str3', x: 100, y: 550, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back. +20% Resist.", unlocked: false, req: 'str2' },
        { id: 'str4', x: 100, y: 750, name: "Earthshaker", type: "Ultimate", desc: "Shatter the ground beneath enemies.", unlocked: false, req: 'str3' },

        // Branch 2: Dexterity/Mobility
        { id: 'dex1', x: 800, y: 220, name: "Shadow Step", type: "Passive", desc: "Increases Movement Speed by 8%.", unlocked: true, req: 'root' },
        { id: 'dex2', x: 950, y: 380, name: "Evasion", type: "Passive", desc: "15% chance to dodge melee attacks.", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 1100, y: 550, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1100, y: 750, name: "Phantom Blade", type: "Ultimate", desc: "Strike from the shadows instantly.", unlocked: false, req: 'dex3' },

        // Branch 3: Intelligence/Magic
        { id: 'int1', x: 600, y: 350, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regen by 15%.", unlocked: false, req: 'root' },
        { id: 'int2', x: 500, y: 500, name: "Fireball", type: "Active", desc: "Launch a projectile of void fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 700, y: 500, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        { id: 'int4', x: 600, y: 650, name: "Mana Shield", type: "Passive", desc: "Absorb damage with mana.", unlocked: false, req: 'int2' },

        // Ultimate Center
        { id: 'hybrid', x: 600, y: 850, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows. Master of all.", unlocked: false, req: 'str4' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z",
        origin: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        // Center the world initially
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const ww = 1200;
        const wh = 1000;
        
        // Initial center
        world.style.transform = `translate(${cw/2 - ww/2}px, ${ch/2 - wh/2}px)`;

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Determine Icon
            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.type === 'Origin') iconPath = icons.origin;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('mousemove', (e) => moveTooltip(e));
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        // Draw Lines
        updateVisuals();
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        moveTooltip(e);
    }

    function moveTooltip(e) {
        // Keep tooltip within screen bounds
        const x = e.clientX;
        const y = e.clientY;
        const ttW = 300;
        const ttH = 150;
        
        let left = x + 20;
        let top = y - 20;

        if (left + ttW > window.innerWidth) left = x - ttW - 20;
        if (top + ttH > window.innerHeight) top = window.innerHeight - ttH - 10;
        
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        const parent = skills.find(s => s.id === skill.req);
        
        // Logic: Can unlock if parent is unlocked (or is root)
        if (!skill.unlocked) {
            if (!skill.req || (parent && parent.unlocked)) {
                skill.unlocked = true;
                updateVisuals();
            }
        } else {
            // Simple toggle off for demo (not recursive lock)
            skill.unlocked = false;
            updateVisuals();
        }
    }

    function updateVisuals() {
        // Update Nodes
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            
            el.classList.remove('unlocked', 'available');
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                // Check availability (parent unlocked)
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) el.classList.add('available');
            }
        });

        // Re-draw lines
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    } else if (parent.unlocked) {
                        line.classList.add('available');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = container.clientWidth/2 - 600;
    let panY = container.clientHeight/2 - 500;
    let scale = 1;

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        // Zoom towards mouse pointer
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    init();

</script>
</body>
</html>
