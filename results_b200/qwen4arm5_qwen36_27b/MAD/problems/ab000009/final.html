<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess</title>
    <style>
        :root {
            /* Palette: Premium Slate & Cream */
            --color-bg: #F4F4F5; /* Subtle background */
            --color-panel-bg: #FAFAFA; /* Panel background */
            --color-panel-border: #E4E4E7;
            
            /* Board Palette */
            --board-light: #F0E6D2; /* Warm Cream */
            --board-dark: #36454F;   /* Deep Charcoal/Slate */
            
            /* UI Colors */
            --color-text-main: #18181B; /* Zinc 900 */
            --color-text-muted: #71717A; /* Zinc 500 */
            --color-accent: #36454F;
            --color-highlight: rgba(255, 255, 255, 0.35);
            --color-move-hint: rgba(54, 69, 79, 0.2);
            --color-capture: rgba(220, 38, 38, 0.2); /* Subtle red for captures */

            /* Dimensions */
            --board-size: 680px;
            --panel-width: 360px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --radius-md: 8px;
            --radius-pill: 999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--color-bg);
            color: var(--color-text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Main Layout --- */
        .app-container {
            display: flex;
            height: var(--board-size);
            /* Subtle shadow for premium feel, no thick border */
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.15);
            border-radius: var(--radius-md);
            overflow: hidden;
            background-color: #fff;
        }

        /* --- Board Section --- */
        .board-wrapper {
            width: var(--board-size);
            height: 100%;
            /* The "Margin" Background for Coordinates */
            background-color: #27272A; /* Dark Zinc for contrast with labels */
            padding: 32px; /* Outer margin space */
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            position: relative;
            user-select: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); /* Subtle board lift */
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        
        /* Highlights */
        .square.selected { background-color: rgba(255, 255, 255, 0.4) !important; }
        
        .square.possible-move::after {
            content: '';
            width: 25%;
            height: 25%;
            background: var(--color-move-hint);
            border-radius: 50%;
            position: absolute;
            z-index: 2;
        }
        
        .square.capture-move {
            box-shadow: inset 0 0 0 4px var(--color-capture);
        }

        /* Coordinate Labels: Outside Grid, on Margin Background */
        .coord {
            position: absolute;
            font-size: 13px;
            font-weight: 700;
            font-family: "SF Mono", "Roboto Mono", monospace;
            color: #A1A1AA; /* Light grey text on dark background */
            pointer-events: none;
            z-index: 10;
            /* Centering in the margin */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Ranks (1-8) on the Left */
        .coord.rank { 
            top: 50%; 
            left: 12px; 
            transform: translateY(-50%);
        }
        
        /* Files (a-h) on the Bottom */
        .coord.file { 
            bottom: 12px; 
            left: 50%; 
            transform: translateX(-50%);
        }

        /* Pieces: Crisp SVGs */
        .piece {
            width: 85%;
            height: 85%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            cursor: pointer;
            z-index: 2;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* No heavy drop shadow, pieces pop via contrast */
        }
        .piece:hover { transform: scale(1.1); }

        /* --- Sidebar: Rhythm & Layout --- */
        .sidebar {
            width: var(--panel-width);
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--color-panel-bg);
            border-left: 1px solid var(--color-panel-border);
            flex-shrink: 0;
            /* Subtle texture via noise would go here, keeping it clean for now */
        }

        /* Header / Status */
        .sidebar-header {
            padding: var(--spacing-lg);
            /* Removed aggressive divider, using spacing instead */
            flex-shrink: 0;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .turn-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #ddd;
            border: 1px solid rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        .turn-dot.white { background-color: #fff; box-shadow: 0 0 0 1px #d4d4d8; }
        .turn-dot.black { background-color: var(--color-text-main); border-color: transparent; }

        .status-text {
            font-size: 1.125rem;
            font-weight: 700; /* Strong weight */
            color: var(--color-text-main);
            letter-spacing: -0.02em;
        }

        .timer {
            font-family: "SF Mono", "Roboto Mono", "Menlo", monospace;
            font-size: 1rem;
            font-weight: 500;
            color: var(--color-text-muted);
            background: #fff;
            padding: 6px 12px;
            border-radius: var(--radius-pill); /* Pill shape */
            border: 1px solid var(--color-panel-border);
        }

        /* Move History: Expanded to fill space */
        .history-section {
            flex: 1; /* Fills vertical space */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-top: 1px solid var(--color-panel-border);
            border-bottom: 1px solid var(--color-panel-border);
            background-color: #fff; /* Distinct background for list */
        }

        .history-header {
            padding: var(--spacing-md) var(--spacing-lg);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text-muted);
            font-weight: 700;
            background-color: #FAFAFA;
            border-bottom: 1px solid var(--color-panel-border);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            /* Serif font for scorecard feel */
            font-family: "Merriweather", "Georgia", serif; 
        }

        /* Scrollbar styling */
        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: #E4E4E7; border-radius: 3px; }

        .move-row {
            display: grid;
            grid-template-columns: 40px 1fr 1fr;
            height: 40px; /* Taller, more legible */
            align-items: center;
            font-size: 1rem;
            border-bottom: 1px solid #F4F4F5;
            color: var(--color-text-main);
        }
        
        .move-row:nth-child(odd) { background-color: #FAFAFA; }

        .move-num {
            color: var(--color-text-muted);
            font-weight: 600;
            padding-left: var(--spacing-lg);
            width: 100%;
            text-align: right;
            padding-right: var(--spacing-sm);
            font-family: -apple-system, sans-serif;
            font-size: 0.9rem;
        }
        
        .move-cell {
            padding: 0 var(--spacing-lg);
            cursor: pointer;
            color: var(--color-text-main);
            font-weight: 600;
        }
        .move-cell:hover { color: var(--color-accent); background-color: #f4f4f5; }

        /* Controls: Anchored Footer */
        .sidebar-footer {
            padding: var(--spacing-lg);
            background-color: var(--color-panel-bg);
            flex-shrink: 0;
            /* Subtle texture/gradient */
            background-image: linear-gradient(to top, #f4f4f5, #ffffff);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: var(--spacing-sm);
        }

        .btn {
            border: none;
            padding: 10px;
            border-radius: var(--radius-pill); /* Pill shaped buttons */
            font-family: -apple-system, sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 42px;
        }

        /* Primary Button */
        .btn-primary {
            background-color: var(--color-accent);
            color: #fff;
            /* Subtle border match */
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .btn-primary:hover {
            background-color: #273035;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Secondary Buttons */
        .btn-secondary {
            background: #fff;
            color: var(--color-text-main);
            border: 1px solid var(--color-panel-border);
        }
        .btn-secondary:hover {
            background: #F4F4F5;
            border-color: #D4D4D8;
        }

        /* SVG Icons */
        .icon { width: 16px; height: 16px; fill: currentColor; }

        /* Responsive */
        @media (max-width: 1100px) {
            .app-container {
                flex-direction: column;
                height: auto;
                padding: 20px;
                width: 100%;
                max-width: 600px;
            }
            body { overflow-y: auto; height: auto; }
            .board-wrapper { 
                width: 100%; 
                aspect-ratio: 1/1; 
                height: auto;
                padding: 20px; /* Adjust margin */
            }
            .sidebar { 
                width: 100%; 
                height: 350px; 
                border-left: none;
                border-top: 1px solid var(--color-panel-border);
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Left: Board -->
    <div class="board-wrapper">
        <div class="board" id="chessboard">
            <!-- Generated by JS -->
        </div>
    </div>

    <!-- Right: Unified Sidebar -->
    <div class="sidebar">
        
        <!-- Header / Status -->
        <div class="sidebar-header">
            <div class="status-row">
                <div class="turn-indicator">
                    <div class="turn-dot white" id="turnDot"></div>
                    <span class="status-text" id="statusText">White to Move</span>
                </div>
                <div class="timer">10:00</div>
            </div>
        </div>

        <!-- Move History: Expanded -->
        <div class="history-section">
            <div class="history-header">Move History</div>
            <div class="history-list" id="moveHistory">
                <!-- Moves injected here -->
            </div>
        </div>

        <!-- Controls: Anchored Footer -->
        <div class="sidebar-footer">
            <div class="btn-group">
                <button class="btn btn-primary" onclick="newGame()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                    New
                </button>
                <button class="btn btn-secondary" onclick="resetGame()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    Reset
                </button>
                <button class="btn btn-secondary">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    Edit
                </button>
            </div>
        </div>
    </div>
</div>

        bQ: `<svg viewBox="0 0 45 45" xmlns="http://www.w3.org/2000/svg"><g fill="#18181B" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM24.5 7.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM41 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM10.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM38.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5-3-15-3 15-5.5-13.5V25l-7-11 2 12zM9 26c0 2 1.5 2 2.5 4 1 2.5 1 4.5 1 4.5h20s0-2 1-4.5c1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z"/><path d="M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0"/></g></svg>`,
        bK: `<svg viewBox="0 0 45 45" xmlns="http://www.w3.org/2000/svg"><g fill="#18181B" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22.5 11.63V6M20 8h5"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-5 2-8 2s-4-2-8-2-4 1-8-2-4-3-8-2c-3 6 6 10.5 6 10.5v7z"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/></g></svg>`,
    };

    // --- State ---
    const initialBoard = [
        ['bR', 'bN', 'bB', 'bQ', 'bK', 'bB', 'bN', 'bR'],
        ['bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP'],
        ['wR', 'wN', 'wB', 'wQ', 'wK', 'wB', 'wN', 'wR']
    ];

    let board = JSON.parse(JSON.stringify(initialBoard));
    let turn = 'w'; // 'w' or 'b'
    let selectedSquare = null;

    // --- Rendering ---
    const boardEl = document.getElementById('chessboard');
    const moveHistoryEl = document.getElementById('moveHistory');
    const statusText = document.getElementById('statusText');
    const turnDot = document.getElementById('turnDot');

    function renderBoard() {
        boardEl.innerHTML = '';
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.dataset.row = r;
                square.dataset.col = c;
                square.onclick = () => handleSquareClick(r, c);

                // Piece
                const pieceCode = board[r][c];
                if (pieceCode) {
                    const piece = document.createElement('div');
                    piece.className = 'piece';
                    piece.innerHTML = SVG_PIECES[pieceCode];
                    square.appendChild(piece);
                }

                // Selection highlight
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    square.classList.add('selected');
                }

                boardEl.appendChild(square);
            }
        }
        
        // Render coordinates outside the grid (on the wrapper background)
        renderCoordinates();
    }

    function renderCoordinates() {
        // Remove old coordinates if any
        document.querySelectorAll('.coord').forEach(el => el.remove());

        const wrapper = document.querySelector('.board-wrapper');
        const boardRect = boardEl.getBoundingClientRect();
        const wrapperRect = wrapper.getBoundingClientRect();

        // Calculate offset of board relative to wrapper
        const boardOffsetX = boardRect.left - wrapperRect.left;
        const boardOffsetY = boardRect.top - wrapperRect.top;
        const squareSize = boardRect.width / 8;

        // Ranks (1-8) on the left
        for (let r = 0; r < 8; r++) {
            const rank = document.createElement('div');
            rank.className = 'coord rank';
            rank.innerText = 8 - r;
            // Position relative to wrapper
            // Left margin is 32px. Center of square is squareSize/2.
            // We want it in the margin.
            rank.style.top = (boardOffsetY + r * squareSize + squareSize/2) + 'px';
            rank.style.left = '16px'; // Center in 32px margin
            wrapper.appendChild(rank);
        }

        // Files (a-h) on the bottom
        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        for (let c = 0; c < 8; c++) {
            const file = document.createElement('div');
            file.className = 'coord file';
            file.innerText = files[c];
            file.style.left = (boardOffsetX + c * squareSize + squareSize/2) + 'px';
            file.style.bottom = '16px'; // Center in 32px margin
            wrapper.appendChild(file);
        }
    }

    function updateStatus() {
        const player = turn === 'w' ? 'White' : 'Black';
        statusText.innerText = `${player} to Move`;
        turnDot.className = `turn-dot ${turn === 'w' ? 'white' : 'black'}`;
    }

    // --- Interaction ---
    function handleSquareClick(r, c) {
        const piece = board[r][c];
        const isOwnPiece = piece && piece.startsWith(turn);

        if (isOwnPiece) {
            // Select piece
            selectedSquare = { r, c };
            renderBoard();
        } else if (selectedSquare) {
            // Move piece (Visual only for this demo)
            movePiece(selectedSquare.r, selectedSquare.c, r, c);
        }
    }

    function movePiece(fromR, fromC, toR, toC) {
        const piece = board[fromR][fromC];
        
        // Update board state
        board[toR][toC] = piece;
        board[fromR][fromC] = '';
        
        // Add fake move to history
        addMoveToHistory(piece, fromR, fromC, toR, toC);

        // Switch turn
        turn = turn === 'w' ? 'b' : 'w';
        selectedSquare = null;
        
        renderBoard();
        updateStatus();
    }

    function addMoveToHistory(piece, fromR, fromC, toR, toC) {
        const files = 'abcdefgh';
        const ranks = '87654321';
        
        // Simplified algebraic notation
        const pieceType = piece[1];
        let notation = '';
        
        if (pieceType === 'P') {
            notation = files[toC] + ranks[toR];
        } else {
            notation = pieceType.toUpperCase() + files[toC] + ranks[toR];
        }

        const moveNum = Math.ceil((moveHistoryEl.children.length + 1) / 2);
        
        // Check if we need a new row (White's move) or append to existing (Black's move)
        if (turn === 'b') { // White just moved (because turn is already switched in movePiece)
            const row = document.createElement('div');
            row.className = 'move-row';
            row.innerHTML = `
                <div class="move-num">${moveNum}.</div>
                <div class="move-cell">${notation}</div>
                <div class="move-cell"></div>
            `;
            moveHistoryEl.appendChild(row);
        } else { // Black just moved
            const lastRow = moveHistoryEl.lastElementChild;
            if (lastRow) {
                const blackCell = lastRow.querySelector('.move-cell:last-child');
                blackCell.innerText = notation;
            }
        }
        
        // Auto scroll
        moveHistoryEl.scrollTop = moveHistoryEl.scrollHeight;
    }

    function resetGame() {
        board = JSON.parse(JSON.stringify(initialBoard));
        turn = 'w';
        selectedSquare = null;
        moveHistoryEl.innerHTML = '';
        renderBoard();
        updateStatus();
    }

    function newGame() {
        if(confirm("Start a new game?")) {
            resetGame();
        }
    }

    // --- Init ---
    renderBoard();
    updateStatus();
    
    // Simulate first move visually
    addMoveToHistory('wP', 6, 4, 4, 4); // e4
    turn = 'b';
    updateStatus();
    addMoveToHistory('bP', 1, 4, 3, 4); // e5
    turn = 'w';
    updateStatus();
    
    // Re-render coordinates on resize
    window.addEventListener('resize', renderCoordinates);
</script>
</body>
</html>
