<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* Palette: Sophisticated & High Contrast */
            --bg-app: #f4f4f6;
            --bg-panel: #ffffff;
            --text-main: #2c2c2e;
            --text-muted: #8e8e93;
            
            /* Board Colors: Deep Forest & Warm Cream */
            --board-light: #E8EDDF; 
            --board-dark: #4B7358;
            --board-highlight: rgba(255, 215, 0, 0.5);
            --board-move: rgba(0, 0, 0, 0.15);
            
            /* Accents */
            --accent-gold: #b8860b; /* Dark Goldenrod */
            --accent-gold-hover: #d4a017;
            
            /* Dimensions */
            --board-size: 640px;
            --gutter-size: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Main Layout --- */
        .app-container {
            display: flex;
            gap: 48px; /* Generous spacing */
            padding: 40px;
            align-items: flex-start;
        }

        /* --- Board Section --- */
        .board-wrapper {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            /* Outer Gutter for Coordinates */
            padding: var(--gutter-size);
            background-color: #2c2c2e; /* Dark frame */
            border-radius: 4px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            flex-shrink: 0;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            position: relative;
            user-select: none;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        
        /* Coordinate Labels */
        .coord {
            position: absolute;
            font-size: 12px;
            font-weight: 600;
            pointer-events: none;
            z-index: 1;
        }
        .coord.rank { top: 4px; left: 4px; }
        .coord.file { bottom: 4px; right: 4px; }

        /* Contrast logic for coordinates */
        .square.light .coord { color: var(--board-dark); }
        .square.dark .coord { color: var(--board-light); }

        /* Highlighting */
        .square.selected { background-color: var(--board-highlight) !important; }
        .square.possible-move::after {
            content: '';
            width: 25%;
            height: 25%;
            background: rgba(0,0,0,0.2);
            border-radius: 50%;
            position: absolute;
            z-index: 2;
        }
        .square.capture-move {
            box-shadow: inset 0 0 0 6px rgba(0,0,0,0.2);
        }

        /* Pieces */
        .piece {
            width: 90%;
            height: 90%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            cursor: pointer;
            z-index: 2;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* Soft Drop Shadow for physical presence */
            filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.3));
        }
        .piece:hover { transform: scale(1.1); }

        /* --- Sidebar (Unified) --- */
        .sidebar {
            width: 340px;
            height: var(--board-size); /* Match board height including gutter */
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
            overflow: hidden;
        }

        /* Header / Status */
        .sidebar-header {
            padding: 32px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .turn-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #ddd;
            border: 1px solid rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        .turn-dot.white { background-color: #fff; box-shadow: 0 0 0 1px #ccc; }
        .turn-dot.black { background-color: #1c1c1e; }

        .status-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .timer {
            font-family: 'SF Mono', 'Roboto Mono', monospace;
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-muted);
            background: #f9f9f9;
            padding: 6px 12px;
            border-radius: 6px;
        }

        /* Move History */
        .history-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .history-header {
            padding: 16px 32px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            font-weight: 700;
            border-bottom: 1px solid #f0f0f0;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        /* Custom Scrollbar */
        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: #e5e5e5; border-radius: 3px; }
        .history-list::-webkit-scrollbar-thumb:hover { background: #d1d1d1; }

        .move-row {
            display: flex;
            height: 44px;
            align-items: center;
            font-size: 0.95rem;
        }
        
        .move-num {
            width: 40px;
            color: var(--text-muted);
            font-weight: 500;
            font-family: monospace;
        }
        .move-cell {
            flex: 1;
            padding: 0 12px;
            cursor: pointer;
            color: var(--text-main);
            font-weight: 500;
        }
        .move-cell:hover { background-color: #f5f5f7; color: var(--accent-gold); }
        .move-cell:first-of-type { border-right: 1px solid #f0f0f0; }

        /* Controls */
        .sidebar-footer {
            padding: 24px 32px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #fafafa;
        }

        .btn {
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Primary Button: Muted Gold */
        .btn-primary {
            background-color: var(--accent-gold);
            color: #fff;
            box-shadow: 0 4px 12px rgba(184, 134, 11, 0.2);
        }
        .btn-primary:hover {
            background-color: var(--accent-gold-hover);
            transform: translateY(-1px);
        }
        .btn-primary:active { transform: translateY(0); }

        /* Secondary Buttons: Ghost/Outline */
        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #dcdcdc;
            color: var(--text-main);
        }
        .btn-secondary:hover {
            border-color: #bbb;
            background: #fff;
        }

        /* SVG Icons */
        .icon { width: 18px; height: 18px; fill: currentColor; }

        /* Responsive */
        @media (max-width: 1100px) {
            .app-container {
                flex-direction: column;
                align-items: center;
                padding: 20px;
                overflow-y: auto;
            }
            body { overflow-y: auto; height: auto; }
            .board-wrapper { 
                width: 100%; 
                max-width: 500px; 
                height: auto; 
                aspect-ratio: 1/1; 
            }
            .sidebar { 
                width: 100%; 
                max-width: 500px; 
                height: 400px; /* Fixed height for mobile */
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Left: Board -->
    <div class="board-wrapper">
        <div class="board" id="chessboard">
            <!-- Generated by JS -->
        </div>
    </div>

    <div class="sidebar">
        
        <!-- Header / Status -->
        <div class="sidebar-header">
            <div class="status-row">
                <div class="turn-indicator">

            <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: -8px;">Standard Time Control</div>
        </div>

        <!-- Move History -->
        <div class="history-section">

                    <div class="move-num">2.</div>
                    <div class="move-cell">Nf3</div>
                    <div class="move-cell">Nc6</div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="sidebar-footer">
            <button class="btn btn-primary" onclick="newGame()">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                New Game
            </button>
            <div class="btn-row">
                <button class="btn btn-secondary" onclick="resetGame()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                    Reset

                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                    Edit
                </button>
            </div>
        </div>
    </div>
</div>

        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP'],
        ['wR', 'wN', 'wB', 'wQ', 'wK', 'wB', 'wN', 'wR']
    ];

    let board = JSON.parse(JSON.stringify(initialBoard));
    let turn = 'w'; // 'w' or 'b'
    let selectedSquare = null;

    // --- Rendering ---
    const boardEl = document.getElementById('chessboard');
    const moveHistoryEl = document.getElementById('moveHistory');
    const statusText = document.getElementById('statusText');
    const turnDot = document.getElementById('turnDot');

    function renderBoard() {
        boardEl.innerHTML = '';
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.dataset.row = r;
                square.dataset.col = c;
                square.onclick = () => handleSquareClick(r, c);

                // Coordinates
                // Only render coordinates on the edges
                if (c === 0) {
                    const rank = document.createElement('span');
                    rank.className = 'coord rank';
                    rank.innerText = 8 - r;
                    square.appendChild(rank);
                }
                if (r === 7) {
                    const file = document.createElement('span');
                    file.className = 'coord file';
                    file.innerText = String.fromCharCode(97 + c);
                    square.appendChild(file);
                }

                // Piece
                const pieceCode = board[r][c];
                if (pieceCode) {
                    const piece = document.createElement('div');
                    piece.className = 'piece';
                    piece.innerHTML = SVG_PIECES[pieceCode];
                    square.appendChild(piece);
                }

                // Selection highlight
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    square.classList.add('selected');
                }

                boardEl.appendChild(square);
            }
        }
    }

    function updateStatus() {
        const player = turn === 'w' ? 'White' : 'Black';
        statusText.innerText = `${player} to Move`;
        turnDot.className = `turn-dot ${turn === 'w' ? 'white' : 'black'}`;
    }

    // --- Interaction ---
    function handleSquareClick(r, c) {
        const piece = board[r][c];
        const isOwnPiece = piece && piece.startsWith(turn);

        if (isOwnPiece) {
            // Select piece
            selectedSquare = { r, c };
            renderBoard();
        } else if (selectedSquare) {
            // Move piece (Visual only for this demo)
            movePiece(selectedSquare.r, selectedSquare.c, r, c);
        }
    }

    function movePiece(fromR, fromC, toR, toC) {
        const piece = board[fromR][fromC];
        
        // Update board state
        board[toR][toC] = piece;
        board[fromR][fromC] = '';
        
        // Add fake move to history
        addMoveToHistory(piece, fromR, fromC, toR, toC);

        // Switch turn
        turn = turn === 'w' ? 'b' : 'w';
        selectedSquare = null;
        
        renderBoard();
        updateStatus();
    }

    function addMoveToHistory(piece, fromR, fromC, toR, toC) {
        const files = 'abcdefgh';
        const ranks = '87654321';
        
        const notation = (piece[1] === 'P' ? '' : piece[1].toUpperCase()) + 
                         files[toC] + ranks[toR];

        const moveNum = Math.ceil((moveHistoryEl.children.length + 1) / 2);
        
        // Check if we need a new row (White's move) or append to existing (Black's move)
        // Note: In this simplified logic, turn has already switched in movePiece
        // So if turn is 'b', it means White just moved.
        
        if (turn === 'b') { // White just moved, create new row
            const row = document.createElement('div');
            row.className = 'move-row';
            row.innerHTML = `
                <div class="move-num">${moveNum}.</div>
                <div class="move-cell">${notation}</div>
                <div class="move-cell"></div>
            `;
            moveHistoryEl.appendChild(row);
        } else { // Black just moved, fill the second cell
            const lastRow = moveHistoryEl.lastElementChild;
            if (lastRow) {
                const blackCell = lastRow.querySelector('.move-cell:last-child');
                blackCell.innerText = notation;
            }
        }
        
        // Auto scroll
        moveHistoryEl.scrollTop = moveHistoryEl.scrollHeight;
    }

    function resetGame() {
        board = JSON.parse(JSON.stringify(initialBoard));
        turn = 'w';
        selectedSquare = null;
        moveHistoryEl.innerHTML = '';
        renderBoard();
        updateStatus();
    }

    function newGame() {
        if(confirm("Start a new game?")) {
            resetGame();
        }
    }

    // --- Init ---
    renderBoard();
    updateStatus();

</script>
</body>
</html>
