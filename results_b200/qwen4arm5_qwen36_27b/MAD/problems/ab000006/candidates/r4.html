<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        :root {
            /* 
               DESIGN SYSTEM: RETRO PIXEL
               Palette: Deep cool blues for depth, stark white for snow, 
               high contrast UI elements.
            */
            --c-sky-top: #1A2A3A;
            --c-sky-bot: #4B6E8C;
            --c-mountain: #2C3E50;
            --c-snow-base: #E8F4F8;
            --c-snow-shadow: #C5D8E0;
            --c-text-white: #FFFFFF;
            --c-text-shadow: #111111;
            
            /* UI Colors */
            --c-wood-light: #D2B48C;
            --c-wood-dark: #8B4513;
            --c-wood-mid: #A0522D;
            --c-sign-bg: #FDF5E6;
            
            /* Font Stack: System pixel fonts preferred, fallback to monospace */
            --font-pixel: "Courier New", "Lucida Console", monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
            cursor: default;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: var(--font-pixel);
            image-rendering: pixelated; /* Essential for retro aesthetic */
        }

        /* 
           CRT Overlay 
           Uniform scanlines across the entire screen for visual consistency.
        */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 0px,
                rgba(0, 0, 0, 0.12) 2px,
                rgba(0, 0, 0, 0) 4px
            );
            pointer-events: none;
            z-index: 100;
            mix-blend-mode: multiply;
        }

        /* Main Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* The Canvas World */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            /* Push title down for breathing room */
            padding-top: 8vh; 
        }

        /* Typography: SKIFREE Title */
        h1 {
            margin: 0;
            font-size: clamp(3rem, 12vw, 10rem);
            text-transform: uppercase;
            color: var(--c-text-white);
            /* 3D Extrusion Effect via multiple shadows */
            text-shadow: 
                0px 4px 0 #000,
                0px 8px 0 #000,
                4px 4px 0 #000,
                8px 8px 0 #000,
                4px 8px 0 #000;
            letter-spacing: 0.05em;
            line-height: 0.9;
            font-weight: 900;
            position: relative;
            z-index: 11;
            transform: perspective(500px) rotateX(5deg);
            /* Subtle float animation */
            animation: floatTitle 4s ease-in-out infinite;
        }

        /* Action Cluster: Instructions + Button */
        /* Positioned at the bottom to create vertical rhythm */
        .action-cluster {
            position: absolute;
            bottom: 6vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 12;
        }

        .instructions-text {
            color: var(--c-text-white);
            font-size: clamp(0.8rem, 1.5vw, 1.1rem);
            text-align: center;
            line-height: 1.6;
            text-shadow: 2px 2px 0px #000;
            background-color: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 4px;
            border: 2px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(2px);
        }

        /* Start Button: Diegetic Wooden Signpost Style */
        .start-btn {
            position: relative;
            font-family: var(--font-pixel);
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            color: #444;
            background-color: var(--c-sign-bg);
            padding: 12px 40px;
            border: 4px solid var(--c-wood-dark);
            outline: none;
            /* Pixel Art Bevel */
            box-shadow: 
                inset 4px 4px 0px var(--c-wood-light),
                inset -4px -4px 0px var(--c-wood-mid),
                4px 4px 0px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            letter-spacing: 2px;
        }

        .start-btn:hover {
            transform: translateY(-4px);
            color: #000;
        }

        .start-btn:hover::after {
            /* Little shadow projection on ground */
            content: '';
            position: absolute;
            bottom: -12px;
            left: 10%;
            width: 80%;
            height: 4px;
            background: rgba(0,0,0,0.5);
            filter: blur(2px);
        }

        .start-btn:active {
            transform: translateY(0);
            box-shadow: 
                inset 4px 4px 0px var(--c-wood-mid),
                inset -4px -4px 0px var(--c-wood-light);
        }

        /* Blinking Cursor for Instructions */
        .blink {
            animation: blinker 1s step-end infinite;
        }

        /* Animations */
        @keyframes floatTitle {
            0%, 100% { transform: perspective(500px) rotateX(5deg) translateY(0); }
            50% { transform: perspective(500px) rotateX(5deg) translateY(-10px); }
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas for Procedural Graphics -->
        <canvas id="world"></canvas>
        
        <!-- Post-processing effects -->
        <div class="crt-overlay"></div>

        <!-- HUD / UI Layer -->
        <div class="ui-layer">
            <h1>SkiFree</h1>
            
            <!-- Action Cluster at the bottom -->
            <div class="action-cluster">
                <div class="instructions-text">
                    USE <span style="color: #FFFF00; text-shadow: 2px 2px 0 #000;">ARROWS</span> TO STEER<br>
                    AVOID TREES & YETIS <span class="blink">_</span>
                </div>
                
                <button class="start-btn" id="startBtn">START GAME</button>
            </div>
        </div>
    </div>

<script>
    /**
     * VISUAL ENGINE
     * Draws the retro pixel art scene procedurally.
     * Focus: Depth, Texture, Atmosphere.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency

    // Pixel Scale (Higher = chunkier)
    const PIXEL_SIZE = 4;
    
    // State
    let width, height;
    let frame = 0;
    let trees = [];
    let snowParticles = [];
    let mountains = [];
    
    // Colors
    const C_SKY_TOP = '#1A2A3A'; // Deep atmospheric blue
    const C_SKY_BOT = '#4B6E8C'; // Horizon blue
    const C_MOUNTAIN = '#2C3E50'; // Dark grey-blue mountains
    const C_SNOW = '#E8F4F8';     // Crisp white snow
    const C_SNOW_DARK = '#C5D8E0'; // Shadow snow
    const C_TREE_DARK = '#1E4D2B';
    const C_TREE_LIGHT = '#2E8B57';

    // Assets (Drawn via functions)
    
    function drawPixelSkier(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Skier Palette
        const cSkin = '#FFCC80';
        const cHat = '#D32F2F';
        const cJacket = '#D32F2F';
        const cPants = '#1A237E';
        const cSkis = '#FBC02D';
        const cPoles = '#555555';

        // Bobbing animation
        const bob = Math.sin(frame * 0.2) * 3;
        // Subtle leaning
        const lean = Math.sin(frame * 0.05) * 0.1; 

        ctx.translate(0, bob);
        ctx.rotate(lean);

        const p = scale; 

        // Shadow under skis (grounding the character)
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(-6*p, 24*p, 12*p, 2*p);

        // Skis (drawn first to be behind)
        ctx.fillStyle = cSkis;
        // Left Ski
        ctx.fillRect(-5*p, 12*p, 2*p, 14*p); 
        // Right Ski
        ctx.fillRect(3*p, 12*p, 2*p, 14*p);  

        // Poles
        ctx.fillStyle = cPoles;
        ctx.fillRect(-7*p, 4*p, 1*p, 18*p);
        ctx.fillRect(6*p, 4*p, 1*p, 18*p);

        // Legs
        ctx.fillStyle = cPants;
        ctx.fillRect(-3*p, 8*p, 2*p, 5*p);
        ctx.fillRect(2*p, 8*p, 2*p, 5*p);

        // Body
        ctx.fillStyle = cJacket;
        ctx.fillRect(-3*p, 1*p, 6*p, 8*p);

        // Head
        ctx.fillStyle = cSkin;
        ctx.fillRect(-2*p, -3*p, 4*p, 4*p);
        
        // Hat
        ctx.fillStyle = cHat;
        ctx.fillRect(-2*p, -4*p, 4*p, 2*p);

        // Goggles
        ctx.fillStyle = '#000000';
        ctx.fillRect(-2*p, -1*p, 4*p, 1*p);

        ctx.restore();
    }

    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Shadow (Simple block)
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.fillRect(-4*scale, 20*scale, 8*scale, 2*scale);

        const p = scale;
        
        // Trunk
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(-p, 14*p, 2*p, 6*p);

        // Leaves - Bottom
        ctx.fillStyle = C_TREE_DARK;
        ctx.fillRect(-6*p, 6*p, 12*p, 4*p);
        
        // Leaves - Mid
        ctx.fillRect(-5*p, 2*p, 10*p, 4*p);
        
        // Leaves - Top
        ctx.fillRect(-3*p, -2*p, 6*p, 4*p);

        // Highlights (Pixel Art Magic)
        ctx.fillStyle = C_TREE_LIGHT;
        ctx.fillRect(-4*p, 6*p, 2*p, 2*p);
        ctx.fillRect(-3*p, 2*p, 2*p, 2*p);
        ctx.fillRect(-1*p, -2*p, 2*p, 2*p);

        ctx.restore();
    }

    function drawSnowflake(x, y, size) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(size), Math.ceil(size));
    }

    // Initialization
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        // Set internal resolution to match display for crisp pixels
        canvas.width = width;
        canvas.height = height;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        mountains = [];
        
        // Generate Mountains (Background)
        // Create jagged peaks
        const segments = 12;
        const segmentWidth = width / segments;
        for(let i=0; i<=segments; i++) {
            mountains.push({
                x: i * segmentWidth,
                h: (height * 0.25) + (Math.random() * height * 0.2) // Varying heights
            });
        }

        // Generate Trees (Midground/Foreground)
        // We want trees to be denser at the bottom (perspective)
        const rows = 30;
        
        for(let i=5; i<rows; i++) {
            let z = i; 
            
            // Perspective math: Trees at bottom are bigger and spaced wider
            // Map Z to Y position with a curve to simulate slope
            let y = height - (z * (height/rows)) - 20; 
            y += Math.pow(z/rows, 2.5) * 150; // Stronger curve for slope feel
            
            let scale = 1 + (z * 0.12); 
            
            // Add random trees (more trees closer to bottom)
            let numTrees = Math.floor(Math.random() * 2) + 1;
            if(z > rows - 10) numTrees = Math.floor(Math.random() * 4) + 2;
            
            for(let j=0; j<numTrees; j++) {
                let x = Math.random() * width;
                trees.push({x, y, scale, z: z});
            }
        }
        
        // Sort trees by Z (distance) so far trees draw first
        trees.sort((a, b) => a.z - b.z);

        // Snow particles
        snowParticles = [];
        for(let i=0; i<150; i++) {
            snowParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speed: Math.random() * 2 + 0.5,
                size: Math.random() > 0.8 ? 3 : 1
            });
        }
    }

    function drawBackground() {
        // 1. Textured Sky (Gradient)
        let grad = ctx.createLinearGradient(0, 0, 0, height * 0.6);
        grad.addColorStop(0, C_SKY_TOP);
        grad.addColorStop(1, C_SKY_BOT);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // 2. Mountains (Atmospheric Perspective)
        ctx.fillStyle = C_MOUNTAIN;
        ctx.beginPath();
        ctx.moveTo(0, height * 0.65); // Base of mountains
        for(let m of mountains) {
            ctx.lineTo(m.x, m.h);
        }
        ctx.lineTo(width, height * 0.65);
        ctx.lineTo(0, height * 0.65);
        ctx.fill();

        // 3. Snowy Slope Base (Gradient for depth, no harsh lines)
        let snowGrad = ctx.createLinearGradient(0, height * 0.55, 0, height);
        snowGrad.addColorStop(0, '#AABBCB'); // Distant blueish snow
        snowGrad.addColorStop(0.4, C_SNOW);
        snowGrad.addColorStop(1, C_SNOW_DARK);
        
        ctx.fillStyle = snowGrad;
        ctx.fillRect(0, height * 0.55, width, height * 0.45);

        // 4. Slope Texture (Horizontal noise lines - speed lines)
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.globalAlpha = 0.5;
        for(let i=0; i<height; i+=15) {
            if(i > height * 0.55) {
                // Randomize length slightly
                let w = Math.random() * 50 + 20;
                let x = Math.random() * width;
                ctx.fillRect(x, i, w, 1);
            }
        }
        ctx.globalAlpha = 1.0;
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        drawBackground();

        // Draw Trees
        trees.forEach(tree => {
            drawTree(tree.x, tree.y, tree.scale);
        });

        // Draw Skier (Foreground Anchor)
        // Positioned in the lower third, fully visible
        const skierX = width / 2;
        const skierY = height * 0.72; 
        drawPixelSkier(skierX, skierY, PIXEL_SIZE * 2.5);

        // Draw Snow Particles
        snowParticles.forEach(p => {
            p.y += p.speed;
            p.x -= 0.5; // Wind blowing left
            if (p.y > height) {
                p.y = 0;
                p.x = Math.random() * width;
            }
            if (p.x < 0) p.x = width;
            drawSnowflake(p.x, p.y, p.size);
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);
    
    // Button Interaction
    document.getElementById('startBtn').addEventListener('click', function() {
        this.innerText = "LOADING...";
        // Visual feedback
        this.style.backgroundColor = "#555";
        this.style.color = "#FFF";
        this.style.borderColor = "#333";
        
        setTimeout(() => {
            alert("Game Start! (Visual Demo Complete)");
            this.innerText = "START GAME";
            this.style.backgroundColor = ""; // Reset to CSS var
            this.style.color = "";
            this.style.borderColor = "";
        }, 500);
    });

    // Init
    resize();
    animate();

</script>
</body>
</html>
