<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        :root {
            /* Palette */
            --c-sky-top: #0055AA;
            --c-sky-bot: #6699CC;
            --c-snow: #FFFFFF;
            --c-snow-shadow: #D0E0F0;
            --c-text-white: #FFFFFF;
            --c-text-yellow: #FFFFCC;
            --c-btn-face: #D4AF37; /* Mustard Gold */
            --c-btn-light: #FFD700;
            --c-btn-dark: #8B6508;
            --c-btn-text: #000000;
            --c-box-bg: rgba(10, 20, 40, 0.85);
            
            /* Typography */
            --font-pixel: "Courier New", "Lucida Console", monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none; /* Keep fonts sharp */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: var(--font-pixel);
            image-rendering: pixelated;
        }

        /* CRT Scanline Effect Overlay */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
        }

        /* Main Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* The Canvas World */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Vertical Hierarchy: Title -> Instructions -> Button -> Skier */
            justify-content: flex-start; 
            padding-top: 8vh; /* Push title up into sky */
        }

        /* Typography: SKIFREE Title */
        h1 {
            margin: 0;
            font-size: clamp(4rem, 12vw, 10rem); 
            text-transform: uppercase;
            color: var(--c-text-white);
            /* Thick dark outline for contrast */
            text-shadow: 
                4px 4px 0px #000000,
                -2px -2px 0px #000000,
                2px -2px 0px #000000,
                -2px 2px 0px #000000;
            letter-spacing: -0.05em;
            line-height: 1;
            font-weight: bold;
            /* Subtle float animation */
            animation: floatTitle 4s ease-in-out infinite;
            transform: skewX(-5deg); /* Retro slant */
        }

        /* Spacer to separate title from instructions */
        .spacer {
            flex-grow: 1;
            max-height: 20vh;
        }

        /* Instructions Box */
        .instructions-container {
            margin-bottom: 32px;
            z-index: 11;
        }

        .instructions {
            color: var(--c-text-white);
            font-size: 1.1rem;
            text-align: center;
            line-height: 1.6;
            /* Pixelated semi-transparent dark box */
            background-color: var(--c-box-bg);
            padding: 16px 24px;
            border: 4px solid #000;
            outline: 2px solid #FFF; /* Double border effect */
            outline-offset: 4px;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.4);
            max-width: 90%;
            width: 400px;
        }

        .instructions kbd {
            background: #FFF;
            color: #000;
            border: 2px solid #000;
            padding: 2px 6px;
            font-family: inherit;
            font-weight: bold;
            margin: 0 4px;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            display: inline-block;
        }

        /* Start Button: Pixel Art Object */
        .start-btn {
            /* Compact dimensions */
            padding: 12px 32px;
            font-size: 1.5rem;
            font-family: var(--font-pixel);
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            color: var(--c-btn-text);
            background-color: var(--c-btn-face);
            border: none;
            outline: none;
            position: relative;
            /* 3D Bevel Effect using borders */
            border-top: 6px solid var(--c-btn-light);
            border-left: 6px solid var(--c-btn-light);
            border-right: 6px solid var(--c-btn-dark);
            border-bottom: 6px solid var(--c-btn-dark);
            box-shadow: 0px 10px 0px rgba(0,0,0,0.3);
            transition: transform 0.1s, border-width 0.1s, box-shadow 0.1s;
        }

        .start-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 0px 12px 0px rgba(0,0,0,0.3);
            border-top-width: 8px;
            border-left-width: 8px;
            border-right-width: 8px;
            border-bottom-width: 8px;
        }

        .start-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px rgba(0,0,0,0.3);
            border-top-width: 2px;
            border-left-width: 2px;
            border-right-width: 2px;
            border-bottom-width: 2px;
            background-color: var(--c-btn-dark);
            color: var(--c-btn-light);
        }

        .blink {
            animation: blinker 1s step-end infinite;
        }

        /* Animations */
        @keyframes floatTitle {
            0%, 100% { transform: translateY(0) skewX(-5deg); }
            50% { transform: translateY(-12px) skewX(-5deg); }
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas for Procedural Graphics -->
        <canvas id="world"></canvas>
        
        <!-- Post-processing effects -->
        <div class="crt-overlay"></div>

        <!-- HUD / UI Layer -->
        <div class="ui-layer">
            <h1>SkiFree</h1>
            
            <!-- Spacer to separate title from middle content -->
            <div class="spacer"></div>

            <div class="instructions-container">
                <div class="instructions">
                    Use <kbd>←</kbd> <kbd>→</kbd> to steer.<br>
                    Avoid trees. Survive the Yeti.
                </div>
            </div>
            
            <button class="start-btn" id="startBtn">Start Game</button>
        </div>
    </div>

<script>
    /**
     * VISUAL ENGINE
     * Draws the retro pixel art scene procedurally.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    // Pixel Scale
    const PIXEL_SIZE = 4;
    
    // State
    let width, height;
    let frame = 0;
    let trees = [];
    let snowParticles = [];
    
    // Colors
    const C_SKY_TOP = '#0055AA';
    const C_SKY_BOT = '#6699CC';
    const C_SNOW = '#FFFFFF';
    const C_SNOW_DARK = '#D0E0F0';
    const C_TREE_DARK = '#004400';
    const C_TREE_LIGHT = '#006600';
    const C_MOUNTAIN = '#445566';

    // Assets (Drawn via functions)
    
    function drawPixelSkier(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Skier Palette
        const cSkin = '#FFCC80';
        const cHat = '#D32F2F';
        const cJacket = '#D32F2F';
        const cPants = '#1A237E';
        const cSkis = '#FBC02D';
        const cPoles = '#555555';

        // Bobbing animation
        const bob = Math.sin(frame * 0.2) * 2;
        const lean = Math.sin(frame * 0.1) * 0.05; 

        ctx.translate(0, bob);
        ctx.rotate(lean);

        const p = scale; 

        // Skis (drawn first to be behind)
        ctx.fillStyle = cSkis;
        ctx.fillRect(-4*p, 10*p, p, 14*p); // Left ski
        ctx.fillRect(3*p, 10*p, p, 14*p);  // Right ski

        // Poles
        ctx.fillStyle = cPoles;
        ctx.fillRect(-5*p, 4*p, p, 16*p);
        ctx.fillRect(4*p, 4*p, p, 16*p);

        // Legs
        ctx.fillStyle = cPants;
        ctx.fillRect(-3*p, 8*p, 2*p, 4*p);
        ctx.fillRect(2*p, 8*p, 2*p, 4*p);

        // Body
        ctx.fillStyle = cJacket;
        ctx.fillRect(-3*p, 2*p, 6*p, 7*p);

        // Head
        ctx.fillStyle = cSkin;
        ctx.fillRect(-2*p, -2*p, 4*p, 4*p);
        
        // Hat
        ctx.fillStyle = cHat;
        ctx.fillRect(-2*p, -3*p, 4*p, 2*p);

        ctx.restore();
    }

    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(-4*scale, 20*scale, 8*scale, 2*scale);

        const p = scale;
        
        // Trunk
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(-p, 14*p, 2*p, 6*p);

        // Leaves
        ctx.fillStyle = C_TREE_DARK;
        
        // Layer 1 (Bottom)
        ctx.fillRect(-6*p, 6*p, 12*p, 4*p);
        ctx.fillRect(-5*p, 4*p, 10*p, 2*p);
        
        // Layer 2 (Mid)
        ctx.fillRect(-5*p, 2*p, 10*p, 4*p);
        
        // Layer 3 (Top)
        ctx.fillRect(-3*p, -2*p, 6*p, 4*p);

        // Highlights
        ctx.fillStyle = C_TREE_LIGHT;
        ctx.fillRect(-4*p, 6*p, 2*p, 2*p);
        ctx.fillRect(-3*p, 2*p, 2*p, 2*p);

        ctx.restore();
    }

    function drawSnowflake(x, y, size) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.fillRect(x, y, size, size);
    }

    // Initialization
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        canvas.width = width;
        canvas.height = height;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        const rows = 30;
        
        for(let i=0; i<rows; i++) {
            let rowIdx = rows - i; 
            
            // Perspective math: Trees at bottom are bigger
            let y = height - (rowIdx * (height/rows)) - 50; 
            
            // Smooth curve for slope
            y += Math.sin(rowIdx * 0.2) * 30;
            
            let scale = 1 + (rowIdx * 0.12); 
            
            // Add random trees
            let numTrees = Math.floor(Math.random() * 4) + 1;
            for(let j=0; j<numTrees; j++) {
                let x = Math.random() * width;
                trees.push({x, y, scale, z: rowIdx});
            }
        }
        
        // Sort trees by Z (distance) so far trees draw first
        trees.sort((a, b) => a.z - b.z);

        // Snow particles
        snowParticles = [];
        for(let i=0; i<150; i++) {
            snowParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speed: Math.random() * 3 + 0.5,
                size: Math.random() * 4 + 2
            });
        }
    }

    function drawBackground() {
        // Sky Gradient
        let grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, C_SKY_TOP);
        grad.addColorStop(1, C_SKY_BOT);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Snowy Slope (Bottom half)
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.lineTo(0, height * 0.45);
        ctx.bezierCurveTo(width * 0.3, height * 0.35, width * 0.7, height * 0.55, width, height * 0.45);
        ctx.lineTo(width, height);
        ctx.fillStyle = C_SNOW;
        ctx.fill();

        // Slope shading
        ctx.beginPath();
        ctx.moveTo(width * 0.7, height * 0.55);
        ctx.lineTo(width, height * 0.45);
        ctx.lineTo(width, height);
        ctx.lineTo(width * 0.7, height);
        ctx.fillStyle = C_SNOW_DARK;
        ctx.globalAlpha = 0.6;
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }

    function drawMountains() {
        // Draw mountains behind the snow line
        ctx.fillStyle = C_MOUNTAIN;
        ctx.beginPath();
        ctx.moveTo(0, height * 0.5);
        ctx.lineTo(100, height * 0.35);
        ctx.lineTo(200, height * 0.45);
        ctx.lineTo(350, height * 0.25);
        ctx.lineTo(500, height * 0.4);
        ctx.lineTo(width, height * 0.3);
        ctx.lineTo(width, height * 0.5);
        ctx.lineTo(0, height * 0.5);
        ctx.fill();
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        drawBackground();
        drawMountains();

        // Draw Trees
        trees.forEach(tree => {
            drawTree(tree.x, tree.y, tree.scale);
        });

        // Draw Skier (Foreground)
        // Repositioned upwards to anchor composition better
        const skierX = width / 2;
        const skierY = height * 0.72; 
        drawPixelSkier(skierX, skierY, PIXEL_SIZE * 1.5); // Slightly larger

        // Draw Snow Particles
        snowParticles.forEach(p => {
            p.y += p.speed;
            p.x -= 1.5; // Wind blowing left
            if (p.y > height) p.y = 0;
            if (p.x < 0) p.x = width;
            drawSnowflake(p.x, p.y, p.size);
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);
    
    // Button Interaction
    document.getElementById('startBtn').addEventListener('click', function() {
        this.innerText = "LOADING...";
        this.style.background = "#fff";
        setTimeout(() => {
            alert("Game Start! (This is a visual demo)");
            this.innerText = "START GAME";
            this.style.background = "var(--c-btn-face)";
        }, 500);
    });

    // Init
    resize();
    animate();

</script>
</body>
</html>
