<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        /* 
           DESIGN SYSTEM: RETRO PIXEL 
           Palette: High contrast, flat colors.
           Typography: Chunky, bitmap-style (Press Start 2P fallback to Courier).
           UI: Flat, hard borders, no blur.
        */
        :root {
            --c-sky-top: #003399;
            --c-sky-bot: #6699CC;
            --c-snow: #F0F8FF;
            --c-snow-shadow: #B0C4DE;
            --c-text-white: #FFFFFF;
            --c-text-shadow: #000000;
            --c-ui-panel: #000000;
            --c-btn-face: #CC0000;
            --c-btn-highlight: #FF6666;
            --c-btn-shadow: #660000;
            --c-btn-text: #FFFFFF;
            
            /* Font stack for that chunky 8-bit feel */
            --font-pixel: "Press Start 2P", "Courier New", monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: var(--font-pixel);
            image-rendering: pixelated; /* Critical for crisp pixel art */
        }

        /* CRT Scanline Effect - Subtle Overlay */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 0px,
                rgba(0, 0, 0, 0.15) 2px,
                rgba(0, 0, 0, 0) 4px
            );
            pointer-events: none;
            z-index: 20;
            mix-blend-mode: multiply;
        }

        /* Main Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* The Canvas World */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 6vh;
        }

        /* Typography: SKIFREE Title */
        h1 {
            margin: 0;
            font-size: clamp(3rem, 10vw, 8rem);
            text-transform: uppercase;
            color: var(--c-text-white);
            /* Pixelated Drop Shadow (Hard) */
            text-shadow: 
                4px 4px 0px var(--c-text-shadow),
                -2px -2px 0px var(--c-text-shadow),
                2px -2px 0px var(--c-text-shadow),
                -2px 2px 0px var(--c-text-shadow);
            letter-spacing: 0.1em;
            line-height: 1;
            font-weight: normal; /* Bitmap fonts usually look better regular weight */
            position: relative;
            z-index: 11;
            /* Subtle float animation */
            animation: floatTitle 4s ease-in-out infinite;
        }

        /* Instructions Text - Floating in negative space */
        .instructions-wrapper {
            margin-top: 24px;
            margin-bottom: 48px;
            z-index: 11;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .instructions-text {
            color: var(--c-text-white);
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            text-align: center;
            line-height: 1.5;
            text-shadow: 2px 2px 0px #000;
        }

        .pixel-arrow {
            font-size: 1.5rem;
            color: var(--c-text-white);
            text-shadow: 2px 2px 0px #000;
            animation: bounceArrow 1s steps(2) infinite;
        }

        /* Start Button: Flat Pixel Art Object */
        .start-btn {
            position: relative;
            padding: 16px 32px;
            font-family: var(--font-pixel);
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            color: var(--c-btn-text);
            background-color: var(--c-btn-face);
            border: 4px solid #000;
            outline: none;
            /* Flat 3D Bevel using borders */
            box-shadow: 
                inset 4px 4px 0px var(--c-btn-highlight),
                inset -4px -4px 0px var(--c-btn-shadow),
                4px 4px 0px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            margin-top: auto; /* Push down relative to flex container if needed, but here we use margin */
            margin-bottom: 10vh; /* Ensure separation from skier */
        }

        .start-btn:hover {
            transform: translateY(-2px);
        }

        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 
                inset 4px 4px 0px var(--c-btn-shadow),
                inset -4px -4px 0px var(--c-btn-highlight);
        }

        /* Blinking Cursor Effect for Instructions */
        .blink {
            animation: blinker 1s step-end infinite;
        }

        /* Animations */
        @keyframes floatTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        @keyframes bounceArrow {
            0% { transform: translateY(0); }
            50% { transform: translateY(4px); }
            100% { transform: translateY(0); }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas for Procedural Graphics -->
        <canvas id="world"></canvas>
        
        <!-- Post-processing effects -->
        <div class="crt-overlay"></div>

        <!-- HUD / UI Layer -->
        <div class="ui-layer">
            <h1>SkiFree</h1>
            
            <div class="instructions-wrapper">
                <div class="instructions-text">
                    USE <span style="color: #FFFF00">ARROWS</span> TO STEER<br>
                    AVOID TREES & YETIS
                </div>
                <div class="pixel-arrow">▼</div>
            </div>
            
            <button class="start-btn" id="startBtn">START GAME</button>
        </div>
    </div>

<script>
    /**
     * VISUAL ENGINE
     * Draws the retro pixel art scene procedurally.
     * Focus: Depth, Texture, Atmosphere.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency

    // Pixel Scale (Higher = chunkier)
    const PIXEL_SIZE = 4;
    
    // State
    let width, height;
    let frame = 0;
    let trees = [];
    let snowParticles = [];
    let mountains = [];
    
    // Colors
    const C_SKY_TOP = '#003399';
    const C_SKY_BOT = '#6699CC';
    const C_SNOW = '#FFFFFF';
    const C_SNOW_DARK = '#D0E0F0';
    const C_TREE_DARK = '#005500';
    const C_TREE_LIGHT = '#008800';
    const C_MOUNTAIN = '#556677';

    // Assets (Drawn via functions)
    
    function drawPixelSkier(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Skier Palette
        const cSkin = '#FFCC80';
        const cHat = '#D32F2F';
        const cJacket = '#D32F2F';
        const cPants = '#1A237E';
        const cSkis = '#FBC02D';
        const cPoles = '#555555';

        // Bobbing animation
        const bob = Math.sin(frame * 0.2) * 2;
        // Subtle leaning based on sine wave to simulate turns
        const lean = Math.sin(frame * 0.05) * 0.1; 

        ctx.translate(0, bob);
        ctx.rotate(lean);

        const p = scale; 

        // Skis (drawn first to be behind)
        ctx.fillStyle = cSkis;
        ctx.fillRect(-4*p, 10*p, p, 14*p); // Left ski
        ctx.fillRect(3*p, 10*p, p, 14*p);  // Right ski

        // Poles
        ctx.fillStyle = cPoles;
        ctx.fillRect(-6*p, 4*p, p, 18*p);
        ctx.fillRect(5*p, 4*p, p, 18*p);

        // Legs
        ctx.fillStyle = cPants;
        ctx.fillRect(-3*p, 8*p, 2*p, 4*p);
        ctx.fillRect(2*p, 8*p, 2*p, 4*p);

        // Body
        ctx.fillStyle = cJacket;
        ctx.fillRect(-3*p, 2*p, 6*p, 7*p);

        // Head
        ctx.fillStyle = cSkin;
        ctx.fillRect(-2*p, -2*p, 4*p, 4*p);
        
        // Hat
        ctx.fillStyle = cHat;
        ctx.fillRect(-2*p, -3*p, 4*p, 2*p);

        // Goggles
        ctx.fillStyle = '#000000';
        ctx.fillRect(-2*p, -1*p, 4*p, 1*p);

        ctx.restore();
    }

    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Shadow (Simple block)
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(-4*scale, 20*scale, 8*scale, 2*scale);

        const p = scale;
        
        // Trunk
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(-p, 14*p, 2*p, 6*p);

        // Leaves - Bottom
        ctx.fillStyle = C_TREE_DARK;
        ctx.fillRect(-6*p, 6*p, 12*p, 4*p);
        
        // Leaves - Mid
        ctx.fillRect(-5*p, 2*p, 10*p, 4*p);
        
        // Leaves - Top
        ctx.fillRect(-3*p, -2*p, 6*p, 4*p);

        // Highlights (Pixel Art Magic)
        ctx.fillStyle = C_TREE_LIGHT;
        ctx.fillRect(-4*p, 6*p, 2*p, 2*p);
        ctx.fillRect(-3*p, 2*p, 2*p, 2*p);
        ctx.fillRect(-1*p, -2*p, 2*p, 2*p);

        ctx.restore();
    }

    function drawSnowflake(x, y, size) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(size), Math.ceil(size));
    }

    // Initialization
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        // Set internal resolution to match display for crisp pixels
        // or scale down for retro look. Here we match for clarity.
        canvas.width = width;
        canvas.height = height;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        mountains = [];
        
        // Generate Mountains (Background)
        const segments = 10;
        const segmentWidth = width / segments;
        for(let i=0; i<=segments; i++) {
            mountains.push({
                x: i * segmentWidth,
                h: (height * 0.2) + (Math.random() * height * 0.15)
            });
        }

        // Generate Trees (Midground/Foreground)
        const rows = 20;
        
        for(let i=0; i<rows; i++) {
            // Z-index simulation: 0 is far, rows is near
            let z = i; 
            
            // Perspective math: Trees at bottom are bigger
            // Map Z to Y position with a curve to simulate slope
            let y = height - (z * (height/rows)) - 50; 
            y += Math.pow(z/rows, 2) * 100; // Curve the slope
            
            let scale = 1 + (z * 0.15); 
            
            // Add random trees (more trees closer to bottom)
            let numTrees = Math.floor(Math.random() * 3) + 1;
            for(let j=0; j<numTrees; j++) {
                let x = Math.random() * width;
                trees.push({x, y, scale, z: z});
            }
        }
        
        // Sort trees by Z (distance) so far trees draw first
        trees.sort((a, b) => a.z - b.z);

        // Snow particles
        snowParticles = [];
        for(let i=0; i<100; i++) {
            snowParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speed: Math.random() * 2 + 1,
                size: Math.random() > 0.8 ? 4 : 2 // Variety in snow size
            });
        }
    }

    function drawBackground() {
        // 1. Textured Sky
        let grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, C_SKY_TOP);
        grad.addColorStop(1, C_SKY_BOT);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // 2. Mountains
        ctx.fillStyle = C_MOUNTAIN;
        ctx.beginPath();
        ctx.moveTo(0, height * 0.6);
        for(let m of mountains) {
            ctx.lineTo(m.x, m.h);
        }
        ctx.lineTo(width, height * 0.6);
        ctx.fill();

        // 3. Snowy Slope Base
        ctx.fillStyle = C_SNOW;
        ctx.fillRect(0, height * 0.55, width, height * 0.45);

        // 4. Slope Texture (Horizontal noise lines)
        ctx.fillStyle = C_SNOW_DARK;
        ctx.globalAlpha = 0.3;
        for(let i=0; i<height; i+=20) {
            if(i > height * 0.55) {
                ctx.fillRect(0, i, width, 2);
            }
        }
        ctx.globalAlpha = 1.0;
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        drawBackground();

        // Draw Trees
        trees.forEach(tree => {
            drawTree(tree.x, tree.y, tree.scale);
        });

        // Draw Skier (Foreground Anchor)
        // Positioned in the lower third
        const skierX = width / 2;
        const skierY = height * 0.75; 
        drawPixelSkier(skierX, skierY, PIXEL_SIZE * 2);

        // Draw Snow Particles
        snowParticles.forEach(p => {
            p.y += p.speed;
            p.x -= 0.5; // Wind blowing left
            if (p.y > height) {
                p.y = 0;
                p.x = Math.random() * width;
            }
            if (p.x < 0) p.x = width;
            drawSnowflake(p.x, p.y, p.size);
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);
    
    // Button Interaction
    document.getElementById('startBtn').addEventListener('click', function() {
        this.innerText = "LOADING...";
        // Visual feedback
        this.style.backgroundColor = "#333";
        this.style.borderColor = "#555";
        
        setTimeout(() => {
            alert("Game Start! (Visual Demo Complete)");
            this.innerText = "START GAME";
            this.style.backgroundColor = ""; // Reset to CSS var
            this.style.borderColor = "";
        }, 500);
    });

    // Init
    resize();
    animate();

</script>
</body>
</html>
