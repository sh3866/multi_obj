<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        :root {
            /* 
               REVISED DESIGN SYSTEM
               Palette: High contrast, deep blues, vibrant reds.
            */
            --c-sky-top: #000044;      /* Deep space blue */
            --c-sky-bot: #0066CC;      /* Bright horizon blue */
            --c-snow-base: #FFFFFF;    /* Pure white */
            --c-snow-shadow: #A0C0D0;  /* Cool blue shadow */
            --c-ui-red: #FF2222;       /* Vibrant retro red */
            --c-ui-red-dark: #B30000;  /* Darker red for depth */
            --c-wood: #8B4513;         /* Classic wood */
            --c-wood-light: #CD853F;
            
            /* Typography */
            --font-pixel: 'Courier New', Courier, monospace; /* Fallback for offline */
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: var(--font-pixel);
            /* Force pixelated rendering for crisp edges */
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        /* 
           CRT / Scanline Overlay
           Adds that authentic retro monitor feel.
        */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 0px,
                rgba(0, 0, 0, 0.15) 2px,
                rgba(0, 0, 0, 0) 4px
            );
            pointer-events: none;
            z-index: 100;
            mix-blend-mode: multiply;
        }

        /* Main Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Let clicks pass through to canvas if needed, though we have specific buttons */
        }

        /* 
           TITLE DESIGN
           Chunky, extruded, sitting lower to meet the tree line.
        */
        h1 {
            margin: 0;
            margin-bottom: 20vh; /* Push title down towards tree line */
            font-size: clamp(3rem, 10vw, 8rem);
            text-transform: uppercase;
            color: var(--c-snow-base);
            font-weight: 900;
            letter-spacing: -0.05em;
            line-height: 1;
            /* Hard retro shadow */
            text-shadow: 
                6px 6px 0px #000000,
                10px 10px 0px rgba(0,0,0,0.4);
            position: relative;
            z-index: 11;
            /* Subtle float */
            animation: floatTitle 4s ease-in-out infinite;
        }

        /* 
           INSTRUCTION SIGNPOST
           Diegetic UI: A wooden sign on the side.
        */
        .signpost-container {
            position: absolute;
            top: 55%; /* Positioned near the "horizon/tree line" */
            left: 5%; /* Left side */
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            pointer-events: auto;
            z-index: 12;
            transform: perspective(600px) rotateY(10deg); /* Slight tilt */
        }

        .sign-board {
            background-color: var(--c-wood);
            border: 4px solid var(--c-wood-light);
            padding: 12px 16px;
            color: #FFF;
            font-size: 1rem;
            line-height: 1.4;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
            position: relative;
            max-width: 220px;
        }

        /* Wood grain effect via border trickery or simple CSS */
        .sign-board::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 2px dashed rgba(255,255,255,0.2);
            pointer-events: none;
        }

        .sign-post {
            width: 12px;
            height: 60px;
            background-color: var(--c-wood);
            margin-top: -4px; /* Connect to board */
            margin-left: 50px;
            border: 2px solid #3e1e09;
        }

        .key-cap {
            display: inline-block;
            background: #fff;
            color: #000;
            padding: 2px 4px;
            border-radius: 2px;
            font-weight: bold;
            box-shadow: 0 2px 0 #000;
        }

        /* 
           START BUTTON
           Vibrant Red, High Contrast, Centered below skier.
        */
        .action-cluster {
            position: absolute;
            bottom: 8vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
            z-index: 12;
        }

        .start-btn {
            font-family: var(--font-pixel);
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            background-color: var(--c-ui-red);
            padding: 16px 32px;
            border: none;
            outline: none;
            cursor: pointer;
            /* Pixelated Bevel Effect */
            box-shadow: 
                inset -6px -6px 0px var(--c-ui-red-dark),
                inset 6px 6px 0px #ff8888,
                0px 6px 0px #000;
            transition: transform 0.1s, box-shadow 0.1s;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #000;
            position: relative;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                inset -6px -6px 0px var(--c-ui-red-dark),
                inset 6px 6px 0px #ff8888,
                0px 8px 0px #000;
            filter: brightness(1.1);
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 
                inset -4px -4px 0px var(--c-ui-red-dark),
                inset 4px 4px 0px #ff8888,
                0px 2px 0px #000;
        }

        /* Animations */
        @keyframes floatTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .signpost-container {
                left: 50%;
                transform: translateX(-50%) perspective(600px) rotateY(0deg);
                top: 45%;
                align-items: center;
            }
            .sign-board {
                background-color: rgba(139, 69, 19, 0.9);
                border-radius: 4px;
                text-align: center;
                font-size: 0.8rem;
            }
            .sign-post { display: none; }
            h1 { font-size: 3.5rem; margin-bottom: 15vh; }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas for Procedural Graphics -->
        <canvas id="world"></canvas>
        
        <!-- Post-processing effects -->
        <div class="crt-overlay"></div>

        <!-- HUD / UI Layer -->
        <div class="ui-layer">
            
            <h1>SkiFree</h1>

            <!-- Diegetic Instructions on Signpost -->
            <div class="signpost-container">
                <div class="sign-board">
                    USE <span class="key-cap">←</span> <span class="key-cap">→</span> TO STEER<br>
                    AVOID TREES & YETIS<br>
                    <span style="font-size: 0.8em; opacity: 0.8;">DON'T STOP SKIING!</span>
                </div>
                <div class="sign-post"></div>
            </div>
            
            <!-- Action Cluster at the bottom -->
            <div class="action-cluster">
                <button class="start-btn" id="startBtn">START GAME</button>
            </div>
        </div>
    </div>

<script>
    /**
     * VISUAL ENGINE
     * Draws the retro pixel art scene procedurally.
     * Focus: "Runway" composition, crisp pixels, depth.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false });

    // Pixel Scale (Higher = chunkier)
    const PIXEL_SIZE = 4;
    
    let width, height;
    let frame = 0;
    let trees = [];
    let snowParticles = [];
    
    // Colors
    const C_SKY_TOP = '#000044';
    const C_SKY_BOT = '#0066CC';
    const C_SNOW = '#FFFFFF';     
    const C_SNOW_DARK = '#A0C0D0'; 
    const C_TREE_DARK = '#004400';
    const C_TREE_LIGHT = '#006600';

    // Helper: Draw a block
    function drawRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
    }

    // Assets (Drawn via functions)
    
    function drawPixelSkier(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Skier Palette (Vibrant)
        const cSkin = '#FFCCAA';
        const cHat = '#CC0000';
        const cJacket = '#CC0000'; // Matches button
        const cPants = '#0000CC';
        const cSkis = '#FFCC00';
        const cPoles = '#555555';

        // Bobbing animation
        const bob = Math.sin(frame * 0.2) * 2;
        const lean = Math.sin(frame * 0.05) * 0.1; 

        ctx.translate(0, bob);
        ctx.rotate(lean);

        const p = scale; 

        // Shadow (Grounding)
        drawRect(-6*p, 22*p, 12*p, 2*p, 'rgba(0,0,0,0.3)');

        // Skis
        drawRect(-5*p, 12*p, 2*p, 14*p, cSkis); 
        drawRect(3*p, 12*p, 2*p, 14*p, cSkis);  

        // Poles
        drawRect(-7*p, 4*p, 1*p, 18*p, cPoles);
        drawRect(6*p, 4*p, 1*p, 18*p, cPoles);

        // Legs
        drawRect(-3*p, 8*p, 2*p, 5*p, cPants);
        drawRect(2*p, 8*p, 2*p, 5*p, cPants);

        // Body
        drawRect(-3*p, 1*p, 6*p, 8*p, cJacket);

        // Head
        drawRect(-2*p, -3*p, 4*p, 4*p, cSkin);
        
        // Hat
        drawRect(-2*p, -4*p, 4*p, 2*p, cHat);

        // Goggles (White for contrast)
        drawRect(-2*p, -1*p, 4*p, 1*p, '#FFF');

        ctx.restore();
    }

    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        const p = scale;
        
        // Shadow
        drawRect(-4*scale, 20*scale, 8*scale, 2*scale, 'rgba(0,0,0,0.2)');

        // Trunk
        drawRect(-p, 14*p, 2*p, 6*p, '#5D4037');

        // Leaves (Layered triangles via rects)
        // Bottom
        drawRect(-6*p, 6*p, 12*p, 4*p, C_TREE_DARK);
        // Mid
        drawRect(-5*p, 2*p, 10*p, 4*p, C_TREE_DARK);
        // Top
        drawRect(-3*p, -2*p, 6*p, 4*p, C_TREE_DARK);

        // Highlights
        drawRect(-4*p, 6*p, 2*p, 2*p, C_TREE_LIGHT);
        drawRect(-3*p, 2*p, 2*p, 2*p, C_TREE_LIGHT);
        drawRect(-1*p, -2*p, 2*p, 2*p, C_TREE_LIGHT);

        ctx.restore();
    }

    function drawSnowflake(x, y, size) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(size), Math.ceil(size));
    }

    // Initialization
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        // Set internal resolution to match display for crisp pixels
        canvas.width = width;
        canvas.height = height;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        
        // Generate Trees (Midground/Foreground)
        // We create a "Runway" in the center by skipping trees in the middle X range
        const rows = 25;
        
        for(let i=5; i<rows; i++) {
            let z = i; 
            
            // Perspective math
            let y = height - (z * (height/rows)) - 20; 
            y += Math.pow(z/rows, 2.5) * 150; 
            
            let scale = 1 + (z * 0.12); 
            
            // Density increases as we get closer (lower Z index, higher Y)
            let numTrees = Math.floor(Math.random() * 2) + 1;
            if(z > rows - 10) numTrees = Math.floor(Math.random() * 5) + 2;
            
            for(let j=0; j<numTrees; j++) {
                let x = Math.random() * width;
                
                // RUNWAY LOGIC: 
                // Clear the center 20% of the screen for trees in the mid-ground
                // to create a visual path for the skier.
                const centerStart = width * 0.35;
                const centerEnd = width * 0.65;
                
                // If tree is in the "danger zone" (mid-distance), push it out
                if (i > 10 && i < 20) {
                    if (x > centerStart && x < centerEnd) {
                        // Move tree left or right
                        x = (Math.random() > 0.5) ? x - (Math.random() * 200) : x + (Math.random() * 200);
                    }
                }

                trees.push({x, y, scale, z: z});
            }
        }
        
        // Sort trees by Z (distance) so far trees draw first
        trees.sort((a, b) => a.z - b.z);

        // Snow particles
        snowParticles = [];
        for(let i=0; i<100; i++) {
            snowParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speed: Math.random() * 3 + 1,
                size: Math.random() > 0.9 ? 3 : 2
            });
        }
    }

    function drawBackground() {
        // 1. Sky (Gradient)
        let grad = ctx.createLinearGradient(0, 0, 0, height * 0.6);
        grad.addColorStop(0, C_SKY_TOP);
        grad.addColorStop(1, C_SKY_BOT);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // 2. Snowy Slope Base
        // Create a subtle horizon line
        const horizonY = height * 0.55;
        
        // Horizon color (faded blue)
        ctx.fillStyle = '#88AACC';
        ctx.fillRect(0, horizonY, width, height - horizonY);

        // Foreground Snow Gradient
        let snowGrad = ctx.createLinearGradient(0, horizonY, 0, height);
        snowGrad.addColorStop(0, '#88AACC'); // Match horizon
        snowGrad.addColorStop(0.3, C_SNOW);
        snowGrad.addColorStop(1, C_SNOW_DARK);
        
        ctx.fillStyle = snowGrad;
        ctx.fillRect(0, horizonY, width, height - horizonY);

        // 3. Slope Texture (Speed lines / tracks)
        ctx.fillStyle = 'rgba(160, 192, 208, 0.5)'; // Faint shadow color
        for(let i=0; i<height; i+=20) {
            if(i > horizonY) {
                // Random horizontal dashes
                let w = Math.random() * 100 + 20;
                let x = Math.random() * width;
                ctx.fillRect(x, i, w, 2);
            }
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        drawBackground();

        // Draw Trees
        trees.forEach(tree => {
            drawTree(tree.x, tree.y, tree.scale);
        });

        // Draw Skier (Foreground Anchor)
        // Positioned in the lower third, fully visible
        const skierX = width / 2;
        const skierY = height * 0.72; 
        drawPixelSkier(skierX, skierY, PIXEL_SIZE * 2.5);

        // Draw Snow Particles
        snowParticles.forEach(p => {
            p.y += p.speed;
            p.x -= 1; // Wind blowing left
            if (p.y > height) {
                p.y = 0;
                p.x = Math.random() * width;
            }
            if (p.x < 0) p.x = width;
            drawSnowflake(p.x, p.y, p.size);
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);
    
    // Button Interaction
    document.getElementById('startBtn').addEventListener('click', function() {
        this.innerText = "LOADING...";
        // Visual feedback
        this.style.backgroundColor = "#555";
        this.style.boxShadow = "none";
        
        setTimeout(() => {
            alert("Game Start! (Visual Demo Complete)");
            this.innerText = "START GAME";
            this.style.backgroundColor = ""; // Reset to CSS var
            this.style.boxShadow = "";
        }, 500);
    });

    // Init
    resize();
    animate();

</script>
</body>
</html>
