<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            /* Palette - Refined Synthwave */
            --c-bg-top: #050014;
            --c-bg-bot: #1a0033;
            --c-primary: #ff00ff; /* Magenta */
            --c-secondary: #00ffff; /* Cyan */
            --c-sun-top: #ff00ff;
            --c-sun-bot: #00ffff;
            --c-grid: rgba(255, 0, 255, 0.4);
            
            /* UI Dimensions */
            --btn-height: 70px;
            --font-stack: 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
            font-smooth: never;
        }

        body {
            background-color: var(--c-bg-top);
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-stack);
        }

        /* --- BACKGROUND CANVAS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- CRT & SCANLINES --- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 50;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.2),
                rgba(0, 0, 0, 0.2) 1px,
                transparent 1px,
                transparent 3px
            );
            background-size: 100% 3px;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 49;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.9) 100%);
        }

        /* --- MAIN STAGE --- */
        .main-stage {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px; /* Adds depth to the UI layer */
        }

        /* --- TITLE BLOCK --- */
        .title-container {
            text-align: center;
            position: absolute;
            top: 12%; /* Lifted up */
            width: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: clamp(4rem, 12vw, 10rem);
            line-height: 0.85;
            letter-spacing: -4px;
            color: white;
            margin: 0;
            position: relative;
            /* 3D Stack Effect */
            text-shadow: 
                0 0 10px var(--c-primary),
                4px 4px 0px var(--c-secondary),
                8px 8px 0px #000000;
            transform: skewX(-5deg);
        }

        /* --- CONTROLS / BUTTONS --- */
        .controls-wrapper {
            position: relative;
            z-index: 30;
            /* Positioning: Overlapping the "Hit Line" area */
            top: 25vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .btn-row {
            display: flex;
            gap: 32px; /* Spacing per critique */
            align-items: center;
            transform: rotateX(15deg) skewX(-10deg); /* Perspective integration */
            transform-style: preserve-3d;
        }

        .btn {
            font-family: var(--font-stack);
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            outline: none;
            padding: 0 40px;
            height: var(--btn-height);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            letter-spacing: 2px;
            border: none;
            color: white;
            font-size: 1.2rem;
            /* Pixelated corners */
            clip-path: polygon(
                15px 0, 100% 0, 
                100% calc(100% - 15px), calc(100% - 15px) 100%, 
                0 100%, 0 15px
            );
            /* Shadow to lift off the grid */
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        /* START BUTTON: Deep Purple to Pink Gradient */
        .btn-start {
            background: linear-gradient(135deg, #2b0055 0%, #ff0099 100%);
            border: 2px solid #ffccff;
            font-size: 1.5rem;
            min-width: 280px;
            text-shadow: 2px 2px 0px #000;
            /* Neon Glow */
            box-shadow: 
                0 0 15px rgba(255, 0, 153, 0.6),
                0 20px 40px rgba(0,0,0,0.6);
        }
        
        .btn-start:hover {
            transform: translateY(-4px) scale(1.02);
            background: linear-gradient(135deg, #440077 0%, #ff33aa 100%);
            box-shadow: 
                0 0 25px rgba(255, 0, 153, 0.9),
                0 25px 50px rgba(0,0,0,0.6);
        }

        .btn-start:active {
            transform: translateY(2px);
            box-shadow: 0 0 10px rgba(255, 0, 153, 0.8);
        }

        /* OPTIONS BUTTON: Dark Box with Neon Border */
        .btn-options {
            background: #111;
            border: 3px solid var(--c-secondary);
            color: var(--c-secondary);
            text-shadow: 0 0 5px var(--c-secondary);
            min-width: 160px;
        }

        .btn-options:hover {
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 
                0 0 15px var(--c-secondary),
                0 20px 40px rgba(0,0,0,0.6);
            color: white;
        }

        /* --- HIT LINE INDICATOR (Visual Aid) --- */
        /* A subtle glowing line behind the buttons to anchor them to the "Highway" */
        .hit-line-anchor {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--c-secondary), transparent);
            box-shadow: 0 0 20px var(--c-secondary);
            opacity: 0.6;
            z-index: 5;
            pointer-events: none;
            /* Perspective skew to match floor */
            transform: translate(-50%, -50%) perspective(500px) rotateX(60deg);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .title-container { top: 8%; }
            h1 { font-size: 4rem; }
            .controls-wrapper { top: 30vh; }
            .btn-row { 
                flex-direction: column; 
                gap: 20px;
                transform: rotateX(5deg) skewX(-5deg); /* Less skew on mobile */
            }
            .btn { width: 260px; }
        }
    </style>
</head>
<body>

    <!-- Background rendering -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- CRT Overlay & Vignette -->
    <div class="overlay"></div>
    <div class="vignette"></div>

    <div class="main-stage">
        
        <!-- Title Block -->
        <div class="title-container">
            <h1>PIXEL<br>DANCE</h1>
        </div>

        <!-- UI Controls -->
        <div class="controls-wrapper">
            <!-- Visual Anchor for the Hit Line -->
            <div class="hit-line-anchor"></div>
            
            <div class="btn-row">
                <button class="btn btn-start" onclick="alert('Game Starting...')">START GAME</button>
                <button class="btn btn-options" onclick="alert('Options Menu')">OPTIONS</button>
            </div>
        </div>

    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Draws the 3D Perspective Highway, Neon Sun, and Stars
         */

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // State
        let time = 0;
        let gridOffset = 0;

        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Colors
        const COL_BG_TOP = '#050014';
        const COL_BG_BOT = '#1a0033';
        const COL_GRID = '#ff00ff';
        const COL_SUN_TOP = '#ff00ff';
        const COL_SUN_BOT = '#00ffff';
        const COL_HIT_LINE = '#00ffff';

        function drawBackground() {
            // 1. Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, COL_BG_TOP);
            grad.addColorStop(0.6, '#110022');
            grad.addColorStop(1, COL_BG_BOT);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. Neon Gradient Sun
            const horizonY = height * 0.5; // Horizon exactly in middle
            const sunRadius = Math.min(width, height) * 0.25;
            const sunX = width / 2;
            const sunY = horizonY - (sunRadius * 0.1); 

            // Sun Gradient (Magenta to Cyan)
            const sunGrad = ctx.createLinearGradient(sunX, sunY - sunRadius, sunX, sunY + sunRadius);
            sunGrad.addColorStop(0, COL_SUN_TOP);
            sunGrad.addColorStop(1, COL_SUN_BOT);
            
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
            ctx.fill();

            // Sun Stripes (Cutout effect) - using sky color to "cut"
            ctx.fillStyle = COL_BG_TOP; 
            for(let i = 0; i < 12; i++) {
                let y = sunY - sunRadius + (i * (sunRadius * 2 / 12));
                let h = 2 + (i * 2); // Exponential thickness
                if (y > sunY - (sunRadius/2)) {
                    ctx.fillRect(sunX - sunRadius - 10, y, (sunRadius * 2) + 20, h);
                }
            }

            // 3. Stars
            ctx.fillStyle = 'white';
            for(let i = 0; i < 60; i++) {
                const seed = i * 1234.5;
                const sx = (Math.sin(seed) * 0.5 + 0.5) * width;
                const sy = (Math.cos(seed * 0.7) * 0.5 + 0.5) * (horizonY * 0.9);
                
                // Twinkle
                const alpha = Math.abs(Math.sin(time * 0.03 + i));
                ctx.globalAlpha = alpha * 0.8;
                
                const size = (i % 5 === 0) ? 3 : 1;
                ctx.fillRect(Math.floor(sx / 4) * 4, Math.floor(sy / 4) * 4, size, size);
            }
            ctx.globalAlpha = 1.0;

            // 4. Perspective Grid (The Highway Floor)
            const vanishX = width / 2;
            
            // Grid speed
            gridOffset = (gridOffset + 4) % 80; // Faster movement

            ctx.lineWidth = 2;
            
            // Vertical Lines (Lanes)
            ctx.strokeStyle = COL_GRID;
            ctx.beginPath();
            
            // Draw main perspective lines
            const lines = 20;
            for (let i = -lines; i <= lines; i++) {
                // Fan out from center
                let x1 = vanishX + (i * 0.5); // Start near center at horizon
                let x2 = vanishX + (i * (width / lines) * 2.5); // End far out at bottom
                
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
            }
            ctx.stroke();

            // Horizontal Lines (Moving)
            ctx.beginPath();
            const segments = 30;
            for (let i = 0; i < segments; i++) {
                let z = (i * 80) - gridOffset; 
                if (z <= 0) continue;

                // Perspective projection math
                // p goes from 0 (horizon) to 1 (bottom of screen)
                // Using a non-linear scale for depth
                let p = 1 - (1 / (z * 0.05 + 1)); 
                
                // Add exponential curve for better depth perception
                let y = horizonY + (height - horizonY) * Math.pow(p, 1.5);
                
                if (y > horizonY && y < height) {
                    // Fade out near horizon
                    let alpha = Math.min(((y - horizonY) / (height - horizonY)), 0.6);
                    ctx.globalAlpha = alpha; 
                    
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                }
            }
            ctx.stroke();
            ctx.globalAlpha = 1.0;

            // 5. The "Hit Line" (Visual Cue)
            // Draw a glowing line across the grid at a specific "distance"
            // We calculate a Y position that represents a specific Z-depth
            const hitZ = 150; // Arbitrary depth unit
            const hitP = 1 - (1 / (hitZ * 0.05 + 1));
            const hitY = horizonY + (height - horizonY) * Math.pow(hitP, 1.5);

            if (hitY > horizonY && hitY < height) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = COL_HIT_LINE;
                ctx.strokeStyle = COL_HIT_LINE;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, hitY);
                ctx.lineTo(width, hitY);
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.lineWidth = 2;
            }
        }

        // Main Loop
        function loop() {
            time++;
            drawBackground();
            requestAnimationFrame(loop);
        }

        // Start
        loop();

    </script>
</body>
</html>
