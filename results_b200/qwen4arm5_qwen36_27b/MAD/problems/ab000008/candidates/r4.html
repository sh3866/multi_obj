<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Edition</title>
    <style>
        :root {
            /* Palette - Synthwave / Pixel Art */
            --c-bg-top: #050011;
            --c-bg-bot: #1a0033;
            --c-primary: #ff0055; /* Hot Magenta */
            --c-secondary: #00ffff; /* Cyan */
            --c-accent: #ffcc00; /* Gold */
            --c-grid: #ff00ff;
            --c-sun-top: #ffcc00;
            --c-sun-bot: #ff0055;
            
            /* UI Dimensions */
            --btn-height: 64px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
            font-smooth: never;
        }

        body {
            background-color: var(--c-bg-top);
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            /* Pixelated rendering for the whole page */
            image-rendering: pixelated; 
        }

        /* --- TYPOGRAPHY: Pixel Art Font Simulation --- */
        @font-face {
            font-family: 'PixelFont';
            src: local('Courier New');
        }

        .pixel-text {
            font-family: 'Courier New', monospace;
            font-weight: 900;
            text-transform: uppercase;
            /* Hard shadow to simulate pixel depth */
            text-shadow: 
                4px 4px 0px #000000,
                6px 6px 0px rgba(0,0,0,0.5);
        }

        /* --- BACKGROUND CANVAS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- CRT & SCANLINES --- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 20;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.25),
                rgba(0, 0, 0, 0.25) 1px,
                transparent 1px,
                transparent 3px
            );
            background-size: 100% 3px;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 19;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
        }

        /* --- MAIN STAGE --- */
        .main-stage {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 4vh; 
        }

        /* --- TITLE BLOCK --- */
        .title-container {
            text-align: center;
            position: absolute;
            top: 15%; /* Positioned in the sky */
            width: 100%;
            z-index: 12;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: clamp(3.5rem, 10vw, 8rem);
            line-height: 0.9;
            letter-spacing: -2px;
            color: white;
            margin-bottom: 10px; /* Breathing room */
            position: relative;
        }

        /* RGB Glitch Effect */
        h1::before, h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }
        h1::before {
            color: #ff0000;
            z-index: -1;
            transform: translate(-4px, 2px);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
        }
        h1::after {
            color: #00ffff;
            z-index: -1;
            transform: translate(4px, -2px);
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
        }

        /* Subtitle Box */
        .subtitle-box {
            background: #000000;
            border: 3px solid white;
            padding: 6px 16px;
            display: inline-block;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.8);
            transform: skewX(-12deg);
        }

        .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            letter-spacing: 0.2em;
            color: var(--c-secondary);
            transform: skewX(12deg); /* Counter-skew text */
            display: block;
            text-shadow: 0 0 8px var(--c-secondary);
        }

        /* --- HIGHWAY PREVIEW (The Grid Floor) --- */
        /* This is purely visual, anchoring the buttons to the floor */
        .highway-visual {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40vh;
            z-index: 5;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%);
            /* This helps blend the canvas grid into the UI area */
        }

        /* --- UI CONTROLS (Bottom Center) --- */
        .controls-wrapper {
            position: relative;
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 5vh; /* Lifted slightly off bottom */
            width: 100%;
        }

        .btn-row {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .btn {
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            outline: none;
            padding: 0 30px;
            height: var(--btn-height);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            letter-spacing: 2px;
            border: none;
            background: transparent;
            /* Pixel corners */
            clip-path: polygon(
                10px 0, 100% 0, 
                100% calc(100% - 10px), calc(100% - 10px) 100%, 
                0 100%, 0 10px
            );
        }

        /* START BUTTON (Primary) */
        .btn-start {
            color: white;
            background: var(--c-primary);
            border: 3px solid white;
            box-shadow: 
                0 0 20px var(--c-primary),
                inset 0 0 10px rgba(255,255,255,0.4);
            font-size: 1.6rem;
            padding: 0 50px;
            text-shadow: 2px 2px 0px #000;
        }
        
        .btn-start:hover {
            background: #ff3377;
            transform: translateY(-2px);
            box-shadow: 
                0 0 40px var(--c-primary),
                inset 0 0 20px rgba(255,255,255,0.6);
        }

        .btn-start:active {
            transform: translateY(2px);
            box-shadow: 0 0 10px var(--c-primary);
        }

        /* OPTIONS BUTTON (Secondary) */
        .btn-options {
            color: white;
            background: #111;
            border: 3px solid var(--c-secondary);
            font-size: 1.1rem;
            box-shadow: 0 0 10px var(--c-secondary);
        }

        .btn-options:hover {
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 20px var(--c-secondary);
            text-shadow: 0 0 5px var(--c-secondary);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .title-container { top: 10%; }
            .btn-row { flex-direction: column; width: 80%; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Background rendering -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- CRT Overlay & Vignette -->
    <div class="overlay"></div>
    <div class="vignette"></div>

    <div class="main-stage">
        
        <!-- Title Block (Sky) -->
        <div class="title-container">
            <h1 class="pixel-text" data-text="PIXEL DANCE">PIXEL<br>DANCE</h1>
            <div class="subtitle-box">
                <span class="subtitle pixel-text">RHYTHM EDITION</span>
            </div>
        </div>

        <!-- Highway Visual Anchor (Floor) -->
        <div class="highway-visual"></div>

        <!-- UI Controls (Bottom Center) -->
        <div class="controls-wrapper">
            <div class="btn-row">
                <button class="btn btn-start" onclick="alert('Game Starting...')">START GAME</button>
                <button class="btn btn-options" onclick="alert('Options Menu')">OPTIONS</button>
            </div>
        </div>

    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Draws the Synthwave Grid, Sun, and Stars
         * Optimized for performance and aesthetic integration with UI
         */

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // State
        let time = 0;
        let gridOffset = 0;

        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Colors
        const COL_BG_TOP = '#050011';
        const COL_BG_BOT = '#1a0033';
        const COL_GRID = '#ff00ff';
        const COL_SUN_TOP = '#ffcc00';
        const COL_SUN_BOT = '#ff0055';

        function drawBackground() {
            // 1. Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, COL_BG_TOP);
            grad.addColorStop(0.5, '#110022'); // Darker mid for better contrast
            grad.addColorStop(1, COL_BG_BOT);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. Retro Sun (Reduced opacity/dominance per critique)
            const horizonY = height * 0.55;
            const sunRadius = Math.min(width, height) * 0.2; // Slightly smaller
            const sunX = width / 2;
            const sunY = horizonY - (sunRadius * 0.1); // Lowered slightly

            // Sun Gradient
            const sunGrad = ctx.createLinearGradient(sunX, sunY - sunRadius, sunX, sunY + sunRadius);
            sunGrad.addColorStop(0, COL_SUN_TOP);
            sunGrad.addColorStop(1, COL_SUN_BOT);
            
            // Draw Sun with lower opacity
            ctx.globalAlpha = 0.8;
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
            ctx.fill();

            // Sun Stripes (Cutout effect) - using sky color to "cut"
            ctx.fillStyle = COL_BG_TOP; 
            for(let i = 0; i < 10; i++) {
                let y = sunY - sunRadius + (i * (sunRadius * 2 / 10));
                let h = 4 + (i * 1.5); // Thicker stripes
                if (y > sunY - (sunRadius/2)) {
                    ctx.fillRect(sunX - sunRadius - 10, y, (sunRadius * 2) + 20, h);
                }
            }
            ctx.globalAlpha = 1.0;

            // 3. Pixelated Stars
            ctx.fillStyle = 'white';
            for(let i = 0; i < 50; i++) {
                const seed = i * 1234.5;
                const sx = (Math.sin(seed) * 0.5 + 0.5) * width;
                const sy = (Math.cos(seed * 0.7) * 0.5 + 0.5) * (horizonY * 0.8);
                
                const alpha = Math.abs(Math.sin(time * 0.05 + i));
                ctx.globalAlpha = alpha * 0.6; // Dimmer stars
                
                const size = (i % 7 === 0) ? 3 : 1;
                // Snap to grid for pixel look
                ctx.fillRect(Math.floor(sx / 4) * 4, Math.floor(sy / 4) * 4, size, size);
            }
            ctx.globalAlpha = 1.0;

            // 4. Perspective Grid (The Highway Floor)
            const vanishX = width / 2;
            
            // Grid speed
            gridOffset = (gridOffset + 2.5) % 60; 

            ctx.strokeStyle = COL_GRID;
            ctx.lineWidth = 2; // Thicker lines for retro feel
            
            ctx.beginPath();

            // Vertical Lines
            // Fan out from center
            const lines = 30;
            for (let i = -lines; i <= lines; i++) {
                // Adjusted math for a steeper perspective
                let x1 = vanishX + (i * 1); 
                let x2 = vanishX + (i * (width / lines) * 3.5); 
                
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
            }

            // Horizontal Lines (Moving)
            const segments = 25;
            for (let i = 0; i < segments; i++) {
                let z = (i * 60) - gridOffset; 
                if (z <= 0) continue;

                // Exponential curve
                let p = (z * 0.025); 
                let y = horizonY + (height - horizonY) * (1 - (1 / (p + 1)));
                
                if (y > horizonY && y < height) {
                    // Fade out near horizon
                    let alpha = Math.min(((y - horizonY) / (height - horizonY)), 0.8);
                    ctx.globalAlpha = alpha; 
                    
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                }
            }
            ctx.stroke();
            ctx.globalAlpha = 1.0;

            // 5. Horizon Haze (Subtle)
            const hazeGrad = ctx.createLinearGradient(0, horizonY - 20, 0, horizonY + 100);
            hazeGrad.addColorStop(0, "transparent");
            hazeGrad.addColorStop(0.5, COL_SUN_BOT); 
            hazeGrad.addColorStop(1, "transparent");
            ctx.fillStyle = hazeGrad;
            ctx.globalAlpha = 0.3;
            ctx.fillRect(0, horizonY - 20, width, 120);
            ctx.globalAlpha = 1.0;
        }

        // Main Loop
        function loop() {
            time++;
            drawBackground();
            requestAnimationFrame(loop);
        }

        // Start
        loop();

    </script>
</body>
</html>
