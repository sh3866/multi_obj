<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Edition</title>
    <style>
        :root {
            /* Palette */
            --c-bg-top: #050011;
            --c-bg-bot: #1a0033;
            --c-primary: #ff0055; /* Hot Magenta */
            --c-secondary: #00ffff; /* Cyan */
            --c-accent: #ffcc00; /* Gold */
            --c-grid: #ff00ff;
            --c-text-glow: rgba(255, 255, 255, 0.8);
            
            /* UI Dimensions */
            --btn-height: 60px;
            --gap: 40px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
            font-smooth: never;
        }

        body {
            background-color: var(--c-bg-top);
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; /* Anchor to bottom */
            font-family: 'Courier New', Courier, monospace; /* Fallback pixel font */
        }

        /* --- BACKGROUND CANVAS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- CRT & SCANLINES --- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 20;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            background-size: 100% 2px;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 19;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.9) 100%);
        }

        /* --- MAIN STAGE --- */
        .main-stage {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; /* Push content down */
            padding-bottom: 5vh; /* Space from absolute bottom */
        }

        /* --- TYPOGRAPHY & IDENTITY --- */
        .title-container {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 12;
            /* Floating above the horizon */
            transform: translateY(-30%); 
        }

        h1 {
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(4rem, 10vw, 9rem);
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -2px;
            color: white;
            position: relative;
            display: inline-block;
            /* Hard Block Shadow */
            text-shadow: 
                4px 4px 0px #000000,
                8px 8px 0px #440044;
        }

        /* Hard RGB Split (No Blur) */
        h1::before, h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        h1::before {
            color: #ff0000;
            z-index: -1;
            transform: translate(-4px, 2px);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%); /* Top half */
        }

        h1::after {
            color: #00ffff;
            z-index: -1;
            transform: translate(4px, -2px);
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%); /* Bottom half */
        }

        /* Subtitle */
        .subtitle {
            display: block;
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            letter-spacing: 0.3em;
            color: var(--c-secondary);
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 10px;
            text-shadow: 0 0 10px var(--c-secondary), 2px 2px 0px #000;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 20px;
            border: 2px solid var(--c-secondary);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.8);
            transform: skewX(-10deg);
        }

        /* --- HIGHWAY PREVIEW --- */
        /* This wrapper positions the highway visually between title and buttons */
        .highway-wrapper {
            position: relative;
            width: 100%;
            height: 250px; /* Fixed height to reserve space */
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Align to bottom of wrapper */
            perspective: 800px; 
            margin-bottom: var(--gap); /* Generous gap above buttons */
            z-index: 11;
        }

        /* The 3D Highway Box */
        .highway-container {
            position: relative;
            width: 320px;
            height: 100%;
            /* Tilt back to simulate depth */
            transform: rotateX(55deg) scale(0.9);
            transform-origin: bottom center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, rgba(10,0,30,0.8) 100%);
            border: 2px solid var(--c-secondary);
            border-bottom: none; /* Connect to floor */
            display: flex;
            overflow: hidden;
            box-shadow: 
                0 0 30px rgba(0, 255, 255, 0.2),
                inset 0 0 50px rgba(0,0,0,1);
            /* Pixelated rendering */
            image-rendering: pixelated; 
        }

        /* Lanes */
        .lane {
            flex: 1;
            position: relative;
            border-right: 2px solid rgba(0, 255, 255, 0.2);
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 48px,
                rgba(0, 255, 255, 0.3) 48px,
                rgba(0, 255, 255, 0.3) 50px
            );
            background-size: 100% 50px;
            animation: gridScroll 1.5s linear infinite;
        }
        .lane:last-child { border-right: none; }

        /* Fade out top of highway (Horizon integration) */
        .highway-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, var(--c-bg-top) 0%, transparent 40%, transparent 100%);
            pointer-events: none;
            z-index: 6;
        }

        /* Hit Line (Neon Receptor) */
        .hit-zone {
            position: absolute;
            bottom: 0px; 
            left: -10px;
            width: calc(100% + 20px);
            height: 8px;
            background: #ffffff;
            box-shadow: 
                0 0 15px #ffffff, 
                0 0 30px var(--c-secondary),
                0 10px 0px var(--c-bg-bot); /* Drop shadow */
            z-index: 10;
        }

        /* Notes */
        .note {
            position: absolute;
            width: 70%;
            height: 20px;
            left: 15%;
            border: 2px solid rgba(255,255,255,0.8);
            z-index: 5;
            /* Neon Tube Glow */
            filter: drop-shadow(0 0 8px currentColor);
        }
        
        .note-color-0 { background: var(--c-primary); color: var(--c-primary); }
        .note-color-1 { background: var(--c-secondary); color: var(--c-secondary); }
        .note-color-2 { background: var(--c-accent); color: var(--c-accent); }

        /* --- UI CONTROLS --- */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
            z-index: 15;
        }

        .btn {
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            outline: none;
            padding: 0 40px;
            height: var(--btn-height);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.4rem;
            letter-spacing: 2px;
            border: none;
            background: transparent;
        }

        /* START BUTTON - Neon Glow */
        .btn-start {
            color: white;
            border: 2px solid var(--c-primary);
            background: rgba(255, 0, 85, 0.1);
            box-shadow: 
                0 0 10px var(--c-primary),
                inset 0 0 10px var(--c-primary);
            text-shadow: 0 0 5px white;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }
        
        .btn-start:hover {
            background: var(--c-primary);
            box-shadow: 
                0 0 30px var(--c-primary),
                inset 0 0 20px rgba(255,255,255,0.5);
            transform: scale(1.05);
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        /* OPTIONS BUTTON - Minimal */
        .btn-options {
            color: rgba(255,255,255,0.7);
            border: 2px solid rgba(255,255,255,0.3);
            font-size: 1.1rem;
        }

        .btn-options:hover {
            color: var(--c-secondary);
            border-color: var(--c-secondary);
            box-shadow: 0 0 15px var(--c-secondary);
            text-shadow: 0 0 5px var(--c-secondary);
        }

        /* --- ANIMATIONS --- */
        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 50px; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .title-container { transform: translateY(-10%); }
            .highway-wrapper { height: 180px; margin-bottom: 20px; }
            .controls { gap: 15px; }
            .btn { padding: 0 20px; font-size: 1rem; height: 50px; }
        }
    </style>
</head>
<body>

    <!-- Background rendering -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- CRT Overlay & Vignette -->
    <div class="overlay"></div>
    <div class="vignette"></div>

    <div class="main-stage">
        
        <!-- Title Block (Hovering Horizon) -->
        <div class="title-container">
            <h1 data-text="PIXEL DANCE">PIXEL<br>DANCE</h1>
            <span class="subtitle">Rhythm Edition</span>
        </div>

        <!-- The 3D Highway Preview (Emerging from grid) -->
        <div class="highway-wrapper">
            <div class="highway-container">
                <!-- Lanes -->
                <div class="lane"></div>
                <div class="lane"></div>
                <div class="lane"></div>
                <div class="lane"></div>
                
                <!-- Hit Line -->
                <div class="hit-zone"></div>

                <!-- Static Notes (Patterned) -->
                <!-- Lane 1 -->
                <div class="note note-color-0" style="bottom: 50px;"></div>
                <div class="note note-color-0" style="bottom: 170px;"></div>
                
                <!-- Lane 2 -->
                <div class="note note-color-1" style="bottom: 110px;"></div>
                <div class="note note-color-1" style="bottom: 230px;"></div>

                <!-- Lane 3 -->
                <div class="note note-color-2" style="bottom: 20px;"></div>
                <div class="note note-color-2" style="bottom: 140px;"></div>

                <!-- Lane 4 -->
                <div class="note note-color-0" style="bottom: 270px;"></div>
            </div>
        </div>

        <!-- UI Controls (Bottom) -->
        <div class="controls">
            <button class="btn btn-start" onclick="alert('Game Starting...')">START GAME</button>
            <button class="btn btn-options" onclick="alert('Options Menu')">OPTIONS</button>
        </div>

    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Draws the Synthwave Grid, Sun, and Stars
         */

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // State
        let time = 0;
        let gridOffset = 0;

        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Colors
        const COL_BG_TOP = '#050011';
        const COL_BG_BOT = '#1a0033';
        const COL_GRID = '#ff00ff';
        const COL_SUN_TOP = '#ffcc00';
        const COL_SUN_BOT = '#ff0055';

        function drawBackground() {
            // 1. Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, COL_BG_TOP);
            grad.addColorStop(0.6, '#2a0044'); // Deep purple mid
            grad.addColorStop(1, COL_BG_BOT);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. Retro Sun
            const horizonY = height * 0.55;
            const sunRadius = Math.min(width, height) * 0.25;
            const sunX = width / 2;
            const sunY = horizonY - (sunRadius * 0.2); // Sun sitting on horizon

            // Sun Gradient
            const sunGrad = ctx.createLinearGradient(sunX, sunY - sunRadius, sunX, sunY + sunRadius);
            sunGrad.addColorStop(0, COL_SUN_TOP);
            sunGrad.addColorStop(1, COL_SUN_BOT);
            
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
            ctx.fill();

            // Sun Stripes (Cutout effect)
            ctx.fillStyle = COL_BG_BOT; // Match bottom sky to "cut" the sun
            for(let i = 0; i < 10; i++) {
                let y = sunY - sunRadius + (i * (sunRadius * 2 / 12));
                let h = 2 + (i * 0.5); // Stripes get thicker at bottom
                // Only draw stripes in bottom half of sun
                if (y > sunY) {
                    ctx.fillRect(sunX - sunRadius - 10, y, (sunRadius * 2) + 20, h);
                }
            }
            
            // Sun Glow
            ctx.shadowColor = COL_SUN_BOT;
            ctx.shadowBlur = 50;
            ctx.fillStyle = "transparent"; // Just for glow
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius * 0.9, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; // Reset

            // 3. Pixelated Stars
            ctx.fillStyle = 'white';
            for(let i = 0; i < 60; i++) {
                const seed = i * 1234.5;
                const sx = (Math.sin(seed) * 0.5 + 0.5) * width;
                const sy = (Math.cos(seed * 0.7) * 0.5 + 0.5) * (horizonY * 0.8);
                
                // Twinkle
                const alpha = Math.abs(Math.sin(time * 0.05 + i));
                ctx.globalAlpha = alpha;
                
                // Draw square pixels
                const size = (i % 7 === 0) ? 3 : 1;
                ctx.fillRect(Math.floor(sx / 4) * 4, Math.floor(sy / 4) * 4, size, size);
            }
            ctx.globalAlpha = 1.0;

            // 4. Perspective Grid
            const vanishX = width / 2;
            
            // Grid speed
            gridOffset = (gridOffset + 2) % 60; 

            ctx.strokeStyle = COL_GRID;
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.3; // Atmospheric haze via opacity
            
            ctx.beginPath();

            // Vertical Lines
            // Create a fan effect
            const lines = 40;
            for (let i = -lines; i <= lines; i++) {
                // Perspective math
                // x1 is near vanish point, x2 is spread at bottom
                // Using a non-linear spread for better perspective feel
                let x1 = vanishX + (i * 2); 
                let x2 = vanishX + (i * (width / lines) * 2.5); 
                
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
            }

            // Horizontal Lines (Moving)
            const segments = 20;
            for (let i = 0; i < segments; i++) {
                let z = (i * 60) - gridOffset; 
                if (z <= 0) continue;

                // Exponential perspective curve
                let p = (z * 0.02); 
                let y = horizonY + (height - horizonY) * (1 - (1 / (p + 1)));
                
                if (y > horizonY && y < height) {
                    // Fade out near horizon
                    let alpha = (y - horizonY) / (height - horizonY);
                    ctx.globalAlpha = Math.min(alpha, 0.6); 
                    
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                }
            }
            ctx.stroke();
            ctx.globalAlpha = 1.0;

            // 5. Horizon Haze
            const hazeGrad = ctx.createLinearGradient(0, horizonY - 50, 0, horizonY + 50);
            hazeGrad.addColorStop(0, "transparent");
            hazeGrad.addColorStop(0.5, COL_SUN_BOT); // Glow on horizon
            hazeGrad.addColorStop(1, "transparent");
            ctx.fillStyle = hazeGrad;
            ctx.globalAlpha = 0.4;
            ctx.fillRect(0, horizonY - 50, width, 100);
            ctx.globalAlpha = 1.0;
        }

        // Main Loop
        function loop() {
            time++;
            drawBackground();
            requestAnimationFrame(loop);
        }

        // Start
        loop();

    </script>
</body>
</html>
