<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - Rhythm Edition</title>
    <style>
        :root {
            /* Palette */
            --c-bg-top: #050011;
            --c-bg-bot: #150033;
            --c-primary: #ff0055; /* Hot Magenta/Pink */
            --c-secondary: #00ffff; /* Bright Cyan */
            --c-accent: #ffcc00; /* Gold */
            --c-grid: #ff00ff;
            
            /* Fonts */
            /* Using standard stack but styled to look blocky/pixelated */
            --font-pixel: 'Courier New', Courier, monospace; 
            --font-ui: system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: var(--c-bg-top);
            color: white;
            font-family: var(--font-pixel);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- BACKGROUND CANVAS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- CRT & SCANLINES --- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            /* Scanlines */
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
        }

        /* Subtle vignette via radial gradient */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.8) 100%);
        }

        /* --- MAIN STAGE --- */
        .main-stage {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 90vh;
            gap: 20px;
        }

        /* --- TYPOGRAPHY & IDENTITY --- */
        .title-container {
            text-align: center;
            position: relative;
            z-index: 6;
            margin-top: 40px;
        }

        h1 {
            font-family: var(--font-pixel);
            font-size: clamp(3.5rem, 9vw, 8rem);
            font-weight: 900;
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -2px;
            color: white;
            position: relative;
            display: inline-block;
            /* Hard Shadow */
            text-shadow: 6px 6px 0px #000000;
        }

        /* Chromatic Aberration (Red/Cyan Split) */
        h1::before, h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        h1::before {
            color: #ff0000;
            z-index: -1;
            transform: translate(-3px, 0);
        }

        h1::after {
            color: #00ffff;
            z-index: -2;
            transform: translate(3px, 0);
        }

        /* Subtitle */
        .subtitle {
            display: block;
            font-family: var(--font-ui);
            font-size: clamp(1rem, 2vw, 1.5rem);
            letter-spacing: 0.5em;
            color: var(--c-secondary);
            font-weight: 800; /* Heavy weight */
            text-transform: uppercase;
            margin-top: 15px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 24px;
            border: 2px solid var(--c-secondary);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            transform: skewX(-15deg);
        }

        /* --- HIGHWAY PREVIEW --- */
        .highway-wrapper {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px; /* Strong perspective */
            margin: 20px 0;
        }

        .highway-container {
            position: relative;
            width: 360px;
            height: 400px;
            /* Tilt back */
            transform: rotateX(60deg);
            transform-origin: bottom center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,20,40,0.8) 100%);
            border: 4px solid var(--c-secondary);
            /* Neon Glow for the highway box */
            box-shadow: 
                0 0 20px var(--c-secondary),
                inset 0 0 30px rgba(0, 255, 255, 0.2);
            display: flex;
            overflow: hidden;
            /* Pixelated rendering for the highway contents */
            image-rendering: pixelated; 
        }

        /* Lanes */
        .lane {
            flex: 1;
            position: relative;
            border-right: 2px solid rgba(0, 255, 255, 0.3);
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 38px,
                var(--c-secondary) 38px,
                var(--c-secondary) 40px
            );
            /* The 8px interval grid lines requested */
            background-size: 100% 40px; 
            animation: gridScroll 2s linear infinite;
        }
        .lane:last-child { border-right: none; }

        /* Hard Shadow Grid Overlay (to create the "solid color offset" glow effect) */
        .highway-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* Hit Line */
        .hit-zone {
            position: absolute;
            bottom: 20px; /* Raised slightly from bottom */
            left: -5px;
            width: calc(100% + 10px);
            height: 6px;
            background: #ffffff;
            box-shadow: 
                0 0 10px #ffffff, 
                0 0 20px var(--c-secondary);
            z-index: 10;
            border-top: 2px solid var(--c-primary);
        }

        /* Static Notes */
        .note {
            position: absolute;
            width: 80%;
            height: 24px; /* Chunky */
            left: 10%;
            border: 2px solid white;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5); /* Hard shadow */
            z-index: 4;
            /* No animation for static notes per brief */
        }
        
        .note-color-0 { background: var(--c-primary); box-shadow: 4px 4px 0px #4a001d; }
        .note-color-1 { background: var(--c-secondary); box-shadow: 4px 4px 0px #004d4d; }
        .note-color-2 { background: var(--c-accent); box-shadow: 4px 4px 0px #4d4000; }

        /* --- UI CONTROLS --- */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            z-index: 6;
        }

        .btn {
            font-family: var(--font-ui); /* Clean sans-serif for UI */
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s;
            outline: none;
            padding: 18px 40px; 
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 1px;
            border: none;
            clip-path: polygon(
                10px 0, 100% 0, 
                100% calc(100% - 10px), calc(100% - 10px) 100%, 
                0 100%, 0 10px
            ); /* Angular cuts */
        }

        /* START BUTTON */
        .btn-start {
            background: var(--c-primary); /* Hot Magenta */
            color: white;
            box-shadow: 0 0 20px var(--c-primary);
            transform: scale(1.05);
        }
        
        .btn-start:hover {
            background: #ff3377;
            box-shadow: 0 0 40px var(--c-primary);
            transform: scale(1.1) translateY(-2px);
        }

        .btn-start:active {
            transform: scale(0.98);
        }

        /* OPTIONS BUTTON */
        .btn-options {
            background: transparent;
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .btn-options:hover {
            border-color: var(--c-secondary);
            color: var(--c-secondary);
            box-shadow: 0 0 15px var(--c-secondary);
            transform: translateY(-2px);
        }

        /* --- ANIMATIONS --- */
        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .subtitle { font-size: 0.9rem; letter-spacing: 0.3em; }
            .highway-container { width: 280px; height: 300px; }
            .controls { gap: 15px; }
            .btn { padding: 14px 24px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Background rendering -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- CRT Overlay & Vignette -->
    <div class="overlay"></div>
    <div class="vignette"></div>

    <div class="main-stage">
        <div class="title-container">
            <h1 data-text="PIXEL DANCE">PIXEL<br>DANCE</h1>
            <span class="subtitle">Rhythm Edition</span>
        </div>

        <!-- The 3D Highway Preview -->
        <div class="highway-wrapper">
            <div class="highway-container">
                <!-- Lanes (Grid lines handled by CSS background) -->
                <div class="lane" id="l1"></div>
                <div class="lane" id="l2"></div>
                <div class="lane" id="l3"></div>
                <div class="lane" id="l4"></div>
                
                <!-- Hit Line -->
                <div class="hit-zone"></div>

                <!-- Static Notes (Positioned to imply a pattern) -->
                <!-- Lane 1 -->
                <div class="note note-color-0" style="bottom: 60px;"></div>
                <div class="note note-color-0" style="bottom: 180px;"></div>
                
                <!-- Lane 2 -->
                <div class="note note-color-1" style="bottom: 120px;"></div>
                <div class="note note-color-1" style="bottom: 240px;"></div>

                <!-- Lane 3 -->
                <div class="note note-color-2" style="bottom: 20px;"></div>
                <div class="note note-color-2" style="bottom: 140px;"></div>

                <!-- Lane 4 -->
                <div class="note note-color-0" style="bottom: 280px;"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-start" onclick="alert('Game Starting...')">START GAME</button>
            <button class="btn btn-options" onclick="alert('Options Menu')">OPTIONS</button>
        </div>
    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Draws the Synthwave Grid and Stars
         */

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // State
        let time = 0;
        let gridOffset = 0;

        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Colors
        const COL_BG_TOP = '#050011';
        const COL_BG_BOT = '#150033';
        const COL_GRID = '#ff00ff'; // Magenta Grid
        const COL_SUN_TOP = '#ffcc00'; // Gold Top
        const COL_SUN_BOT = '#ff0055'; // Red Bottom

        function drawBackground() {
            // Clear & Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, COL_BG_TOP);
            grad.addColorStop(1, COL_BG_BOT);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // --- PIXELATED STARS ---
            ctx.fillStyle = 'white';
            ctx.shadowBlur = 0;
            for(let i = 0; i < 80; i++) {
                // Deterministic random
                const seed = i * 1234.5;
                const sx = (Math.sin(seed) * 0.5 + 0.5) * width;
                const sy = (Math.cos(seed * 0.7) * 0.5 + 0.5) * (height * 0.6);
                
                // Twinkle
                const alpha = Math.abs(Math.sin(time * 0.02 + i));
                ctx.globalAlpha = alpha;
                
                // Draw square pixels
                const size = (i % 5 === 0) ? 3 : 2;
                ctx.fillRect(Math.floor(sx / 4) * 4, Math.floor(sy / 4) * 4, size, size);
            }
            ctx.globalAlpha = 1.0;

            // --- PERSPECTIVE GRID ---
            const horizonY = height * 0.55; // Horizon slightly lower
            const vanishX = width / 2;
            
            // Grid speed
            gridOffset = (gridOffset + 1.5) % 60; // Slower, smoother movement

            ctx.strokeStyle = COL_GRID;
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.4; // Low opacity per critique
            
            ctx.beginPath();

            // Vertical Lines (Fan out)
            const fov = width * 1.2;
            // Draw more lines for density
            for (let i = -20; i <= 20; i++) {
                let x1 = vanishX + (i * 5); // Near vanish point
                let x2 = vanishX + (i * fov * 0.15); // Spread at bottom
                
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
            }

            // Horizontal Lines (Moving)
            const segments = 25;
            for (let i = 0; i < segments; i++) {
                let z = (i * 60) - gridOffset; 
                if (z <= 0) continue;

                // Perspective formula
                let p = (z * 0.015); 
                let y = horizonY + (height - horizonY) * (1 - (1 / (p + 1)));
                
                if (y > horizonY && y < height) {
                    // Thicker lines closer to camera
                    ctx.lineWidth = (y - horizonY) / (height - horizonY) * 3;
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                }
            }
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }

        // Main Loop
        function loop() {
            time++;
            drawBackground();
            requestAnimationFrame(loop);
        }

        // Start
        loop();

    </script>
</body>
</html>
