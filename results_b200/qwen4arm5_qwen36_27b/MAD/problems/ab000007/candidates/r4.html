<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina - Deep Sea Collection</title>
<style>
  :root {
    /* Palette: Bioluminescent & Deep Sea */
    --bg-deep: #010205;
    --bg-mid: #0a1128;
    --accent-teal: #00f2ea;
    --accent-mint: #39ff14;
    --accent-gold: #ffd700;
    --text-main: #ffffff;
    --text-muted: #8b9bb4;
    
    /* UI Sizing */
    --safe-area: 64px;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  /* --- Scene Composition --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  /* Deep Atmospheric Gradient */
  .bg-gradient {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(ellipse at 50% 0%, var(--bg-mid) 0%, var(--bg-deep) 80%);
    z-index: 0;
  }

  /* Ground Plane / Horizon */
  .ground-plane {
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 30%;
    background: linear-gradient(to top, #020617 0%, transparent 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* Floating Dust/Stars */
  .fog-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,0.2), transparent),
      radial-gradient(1px 1px at 50% 70%, rgba(255,255,255,0.1), transparent);
    background-size: 500px 500px;
    opacity: 0.6;
    z-index: 1;
    pointer-events: none;
    animation: drift 60s linear infinite;
  }

  @keyframes drift {
    from { transform: translateY(0); }
    to { transform: translateY(-500px); }
  }

  /* --- Canvas --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: var(--safe-area);
  }

  /* --- Header --- */
  .header-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    pointer-events: none;
    margin-top: 16px; /* Rhythm */
  }

  h1 {
    font-family: 'Arial Black', Impact, sans-serif;
    font-weight: 900;
    font-size: 4rem;
    margin: 0;
    letter-spacing: -0.04em;
    line-height: 1;
    color: white;
    text-shadow: 0 0 40px rgba(0, 242, 234, 0.3);
    background: linear-gradient(180deg, #ffffff 0%, #d0e8f2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hud-counter {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .stat-value {
    font-family: 'Courier New', Courier, monospace; /* Tech feel */
    font-weight: 700;
    font-size: 1.75rem;
    color: var(--accent-teal);
    text-shadow: 0 0 10px rgba(0, 242, 234, 0.5);
    line-height: 1;
  }

  .stat-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-top: 8px;
  }

  /* --- Footer / CTA --- */
  .footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: auto;
    margin-bottom: 48px; /* Lift off bottom */
  }

  .btn-main {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(0, 242, 234, 0.3);
    color: var(--accent-teal);
    font-family: 'Segoe UI', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    padding: 1.2rem 3.5rem;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 0 0 rgba(0, 242, 234, 0);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    position: relative;
    overflow: hidden;
  }

  /* Holographic scanline effect */
  .btn-main::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: translateX(-100%);
  }

  .btn-main:hover {
    background: rgba(0, 242, 234, 0.1);
    border-color: var(--accent-teal);
    box-shadow: 0 0 20px rgba(0, 242, 234, 0.2);
    transform: translateY(-2px);
    color: white;
  }
  
  .btn-main:hover::after {
    animation: shine 0.8s;
  }

  @keyframes shine {
    100% { transform: translateX(100%); }
  }

  /* Toast Notification */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(5, 15, 30, 0.9);
    border: 1px solid var(--accent-mint);
    color: var(--accent-mint);
    padding: 1rem 2rem;
    border-radius: 2px;
    font-family: 'Courier New', monospace;
    font-weight: 700;
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile tweaks */
  @media (max-width: 600px) {
    h1 { font-size: 3rem; }
    .ui-layer { padding: 32px; }
    .btn-main { width: 100%; max-width: 300px; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Backgrounds -->
  <div class="bg-gradient"></div>
  <div class="fog-layer"></div>
  <div class="ground-plane"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    
    <!-- Header -->
    <div class="header-container">
      <h1>Lumina</h1>
      <div class="hud-counter">
        <div class="stat-value" id="scoreDisplay">00</div>
        <div class="stat-label">Specimens Collected</div>
      </div>
    </div>

    <div id="toast" class="toast">Specimen Secured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Focus: Visual Polish, Organic Movement, Depth
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let stars = []; // Static background stars
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;

  // Configuration
  // Bioluminescent Palette
  const COLORS = ['#00f2ea', '#39ff14', '#00e5ff', '#76ff03']; 
  const CREATURE_COUNT = 12;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initStars();
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  window.addEventListener('touchmove', e => {
    e.preventDefault(); 
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;
      this.vx *= 0.95;
      this.vy *= 0.95;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset();
      // Random start positions
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.trail = [];
    }

    reset() {
      // Spawn from edges or center
      const edge = Math.random();
      if (edge < 0.5) {
        this.x = (width/2) + (Math.random() * 600 - 300);
        this.y = (height/2) + (Math.random() * 600 - 300);
      } else {
        const side = Math.floor(Math.random() * 4);
        if (side === 0) { this.x = Math.random() * width; this.y = -80; }
        else if (side === 1) { this.x = width + 80; this.y = Math.random() * height; }
        else if (side === 2) { this.x = Math.random() * width; this.y = height + 80; }
        else { this.x = -80; this.y = Math.random() * height; }
      }

      this.vx = (Math.random() * 1.2) - 0.6; 
      this.vy = (Math.random() * 1.2) - 0.6;
      
      this.radius = Math.random() * 10 + 12;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = 0;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.02 + 0.01;
      this.isCaught = false;
      this.pulse = Math.random() * 100;
      
      // Define shape type (0: Jelly, 1: Jellyfish, 2: Star-like)
      this.shapeType = Math.floor(Math.random() * 3);
    }

    update() {
      if (this.isCaught) return;

      this.x += this.vx;
      this.y += this.vy;
      this.wobble += this.wobbleSpeed;
      this.pulse += 0.05;

      // Organic drift
      this.x += Math.sin(this.wobble) * 0.4;
      this.y += Math.cos(this.wobble * 0.7) * 0.4;

      // Avoid Mouse (Net)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 180) {
        const force = (180 - dist) / 180;
        const nx = dx / dist;
        const ny = dy / dist;
        this.vx += nx * force * 1.5;
        this.vy += ny * force * 1.5;
      }

      // Wall wrapping
      if (this.x < -100) this.vx = Math.abs(this.vx);
      if (this.x > width + 100) this.vx = -Math.abs(this.vx);
      if (this.y < -100) this.vy = Math.abs(this.vy);
      if (this.y > height + 100) this.vy = -Math.abs(this.vy);

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 3.5) {
        this.vx = (this.vx / speed) * 3.5;
        this.vy = (this.vy / speed) * 3.5;
      }

      // Trail
      this.trail.push({x: this.x, y: this.y});
      if (this.trail.length > 10) this.trail.shift();
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Draw Trail
      ctx.beginPath();
      if(this.trail.length > 0) {
        ctx.moveTo(this.trail[0].x - this.x, this.trail[0].y - this.y);
        for(let i=1; i<this.trail.length; i++) {
          ctx.lineTo(this.trail[i].x - this.x, this.trail[i].y - this.y);
        }
      }
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.3;
      ctx.stroke();
      ctx.globalAlpha = 1.0;

      // Glow
      ctx.shadowBlur = 15;
      ctx.shadowColor = this.color;
      ctx.fillStyle = this.color;
      
      const r = this.radius + Math.sin(this.pulse) * 1.5;
      
      ctx.beginPath();
      
      // Draw distinct shapes
      if (this.shapeType === 0) {
        // Asymmetric Blob
        for (let i = 0; i <= 360; i += 10) {
          const rad = i * Math.PI / 180;
          const noise = Math.sin(rad * 3 + this.wobble) * 3;
          const px = Math.cos(rad) * (r + noise);
          const py = Math.sin(rad) * (r + noise);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
      } else if (this.shapeType === 1) {
        // Jellyfish-ish
        ctx.arc(0, 0, r, Math.PI, 0); // Top dome
        ctx.lineTo(r, r * 0.5);
        ctx.lineTo(r * 0.5, r * 0.2);
        ctx.lineTo(0, r * 0.6);
        ctx.lineTo(-r * 0.5, r * 0.2);
        ctx.lineTo(-r, r * 0.5);
      } else {
        // Star / Asymmetric
        for (let i = 0; i < 5; i++) {
          const rad = (i * 72) * Math.PI / 180;
          const innerRad = r * 0.4;
          const outerRad = r * 1.3;
          ctx.lineTo(Math.cos(rad) * outerRad, Math.sin(rad) * outerRad);
          const nextRad = ((i * 72) + 36) * Math.PI / 180;
          ctx.lineTo(Math.cos(nextRad) * innerRad, Math.sin(nextRad) * innerRad);
        }
      }
      
      ctx.closePath();
      ctx.fill();

      // Inner Eye/Core
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.arc(-r*0.2, -r*0.2, r * 0.25, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Background Stars ---
  function initStars() {
    stars = [];
    for(let i=0; i<50; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 1.5,
        alpha: Math.random() * 0.5 + 0.1
      });
    }
  }

  function drawStars() {
    ctx.fillStyle = '#ffffff';
    stars.forEach(s => {
      ctx.globalAlpha = s.alpha;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1.0;
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = "00";
  }

  function checkCatch() {
    const catchRadius = 70; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score < 10 ? "0" + score : score;
    
    // Visual FX
    for(let i=0; i<12; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 800);

    // Respawn logic
    setTimeout(() => {
      creature.reset();
    }, 800);
  }

  function resetGame() {
    init();
  }

  // Draw Player Net (Tangible Tool)
  function drawNet() {
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Glow
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#00f2ea';
    
    const active = isMouseDown;
    const baseColor = active ? '#ffffff' : '#00f2ea';
    const meshColor = active ? 'rgba(0, 242, 234, 0.5)' : 'rgba(0, 242, 234, 0.2)';

    // 1. Handle (Diegetic anchor)
    // We draw a handle extending down-right to simulate holding it
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(40, 40);
    ctx.stroke();
    
    // Handle highlight
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(40, 40);
    ctx.stroke();

    // 2. Net Head (Mesh)
    ctx.strokeStyle = baseColor;
    ctx.lineWidth = 2;
    ctx.shadowBlur = 15;
    ctx.shadowColor = baseColor;
    
    // Outer rim
    ctx.beginPath();
    ctx.arc(0, 0, 50, 0, Math.PI * 2);
    ctx.stroke();

    // Inner mesh pattern
    ctx.strokeStyle = meshColor;
    ctx.lineWidth = 1;
    ctx.shadowBlur = 0;
    
    // Draw cross-hatching
    for(let i = -40; i <= 40; i+=10) {
      ctx.beginPath();
      // Diagonal 1
      ctx.moveTo(i, -Math.sqrt(1600 - i*i)); 
      ctx.lineTo(i + 40, Math.sqrt(1600 - (i+40)*(i+40)) || 0);
      ctx.stroke();
      
      // Diagonal 2
      ctx.moveTo(i, Math.sqrt(1600 - i*i) || 0);
      ctx.lineTo(i + 40, -Math.sqrt(1600 - (i+40)*(i+40)));
      ctx.stroke();
    }

    // 3. Active Suction Effect
    if (active) {
      ctx.strokeStyle = 'rgba(0, 242, 234, 0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 65, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  // Draw "Protagonist" Silhouette
  function drawPlayerAnchor() {
    ctx.save();
    const anchorX = width / 2;
    const anchorY = height - 100; 
    
    // Silhouette
    ctx.fillStyle = '#000';
    ctx.strokeStyle = 'rgba(0, 242, 234, 0.15)';
    ctx.lineWidth = 2;

    // Body shape
    ctx.beginPath();
    ctx.ellipse(anchorX, anchorY + 60, 35, 15, 0, 0, Math.PI * 2); // Shoulders
    ctx.fill();
    ctx.stroke();

    // Head
    ctx.beginPath();
    ctx.arc(anchorX, anchorY + 20, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Visor (Reflective)
    ctx.fillStyle = '#00f2ea';
    ctx.globalAlpha = 0.15;
    ctx.beginPath();
    ctx.ellipse(anchorX, anchorY + 20, 12, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;

    // Arm to Net
    // Calculate angle to mouse
    const dx = mouse.x - anchorX;
    const dy = mouse.y - (anchorY);
    const angle = Math.atan2(dy, dx);
    
    // Arm segments
    ctx.strokeStyle = 'rgba(0, 242, 234, 0.3)';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    
    // Shoulder joint
    const shoulderX = anchorX + 15;
    const shoulderY = anchorY + 45;
    
    // Elbow joint (intermediate point)
    const elbowX = shoulderX + Math.cos(angle) * 60;
    const elbowY = shoulderY + Math.sin(angle) * 60;

    // Hand (at mouse)
    // Limit visual reach so arm doesn't stretch infinitely across screen
    const reach = Math.min(Math.sqrt(dx*dx + dy*dy), 250);
    const handX = shoulderX + Math.cos(angle) * reach;
    const handY = shoulderY + Math.sin(angle) * reach;

    ctx.beginPath();
    ctx.moveTo(shoulderX, shoulderY);
    ctx.lineTo(handX, handY); // Direct line for simplicity in this view
    ctx.stroke();

    ctx.restore();
  }

  function loop() {
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Draw Background Stars
    drawStars();

    // Update & Draw Creatures (Mid-ground)
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net (Follows Mouse)
    drawNet();

    // Draw Player Anchor (Foreground Silhouette)
    drawPlayerAnchor();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
