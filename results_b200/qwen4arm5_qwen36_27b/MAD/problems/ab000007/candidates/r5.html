<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina - Deep Sea Collection</title>
<style>
  :root {
    /* Palette: Deep Ocean Bioluminescence */
    --bg-deep: #02040a;
    --bg-mid: #061024;
    --bg-light: #0b1a3a;
    --accent-teal: #00f2ea;
    --accent-mint: #39ff14;
    --accent-purple: #b026ff;
    --accent-gold: #ffd700;
    --text-main: #ffffff;
    --text-muted: #5c7c9e;
    
    /* UI Sizing */
    --safe-area: 40px;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  /* --- Scene Composition --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  /* Deep Atmospheric Gradient */
  .bg-gradient {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 0%, var(--bg-light) 0%, var(--bg-deep) 70%);
    z-index: 0;
  }

  /* Ground Plane / Horizon */
  .ground-plane {
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 35%;
    background: linear-gradient(to top, #000000 0%, rgba(2, 4, 10, 0.8) 60%, transparent 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* Floating Dust/Plankton */
  .fog-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4), transparent),
      radial-gradient(2px 2px at 80% 20%, rgba(0, 242, 234, 0.2), transparent),
      radial-gradient(1px 1px at 50% 70%, rgba(255,255,255,0.2), transparent);
    background-size: 600px 600px;
    opacity: 0.7;
    z-index: 1;
    pointer-events: none;
    animation: drift 80s linear infinite;
  }

  @keyframes drift {
    from { transform: translateY(0); }
    to { transform: translateY(-600px); }
  }

  /* --- Canvas --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: var(--safe-area);
  }

  /* --- Header --- */
  .header-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    pointer-events: none;
    margin-top: 24px;
  }

  h1 {
    /* Thematic Font Styling */
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-weight: 900;
    font-size: 5rem;
    margin: 0;
    letter-spacing: 0.1em;
    line-height: 0.9;
    text-transform: uppercase;
    color: white;
    text-shadow: 0 0 50px rgba(0, 242, 234, 0.4);
    background: linear-gradient(180deg, #ffffff 20%, #a0c4ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
  }

  .hud-counter {
    margin-top: 24px; /* Increased gap from Title */
    display: flex;
    flex-direction: row; /* Group horizontally for cleaner UI */
    align-items: baseline;
    justify-content: center;
    gap: 12px; /* Tight gap between count and label */
  }

  .stat-value {
    font-family: 'Courier New', Courier, monospace;
    font-weight: 700;
    font-size: 2rem;
    color: var(--accent-teal);
    text-shadow: 0 0 15px rgba(0, 242, 234, 0.6);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .stat-label {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  /* --- Footer / CTA --- */
  .footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: auto;
    /* Moved up 32px from original logic (approx 100px -> 68px) */
    margin-bottom: 68px; 
  }

  .btn-main {
    background: rgba(10, 20, 40, 0.4);
    border: 1px solid rgba(0, 242, 234, 0.4);
    color: var(--accent-teal);
    font-family: 'Segoe UI', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 1rem 3rem;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 0 0 rgba(0, 242, 234, 0);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    position: relative;
    overflow: hidden;
  }

  /* Holographic scanline effect */
  .btn-main::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: translateX(-100%);
  }

  .btn-main:hover {
    background: rgba(0, 242, 234, 0.15);
    border-color: var(--accent-teal);
    box-shadow: 0 0 30px rgba(0, 242, 234, 0.3);
    transform: translateY(-2px);
    color: white;
  }
  
  .btn-main:hover::after {
    animation: shine 0.8s;
  }

  @keyframes shine {
    100% { transform: translateX(100%); }
  }

  /* Toast Notification */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(5, 15, 30, 0.95);
    border: 1px solid var(--accent-mint);
    color: var(--accent-mint);
    padding: 1.2rem 2.5rem;
    border-radius: 2px;
    font-family: 'Courier New', monospace;
    font-weight: 700;
    letter-spacing: 0.15em;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(57, 255, 20, 0.3);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile tweaks */
  @media (max-width: 600px) {
    h1 { font-size: 3.5rem; }
    .ui-layer { padding: 24px; }
    .btn-main { width: 100%; max-width: 320px; }
    .hud-counter { flex-direction: column; gap: 4px; }
    .stat-label { font-size: 0.65rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Backgrounds -->
  <div class="bg-gradient"></div>
  <div class="fog-layer"></div>
  <div class="ground-plane"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    
    <!-- Header -->
    <div class="header-container">
      <h1>Lumina</h1>
      <div class="hud-counter">
        <div class="stat-value" id="scoreDisplay">00</div>
        <div class="stat-label">Specimens Collected</div>
      </div>
    </div>

    <div id="toast" class="toast">
      <span>⬡</span> Specimen Secured
    </div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Focus: Visual Polish, Organic Movement, Depth
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let stars = []; 
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;

  // Configuration
  // Bioluminescent Palette
  const COLORS = ['#00f2ea', '#39ff14', '#00e5ff', '#76ff03', '#b026ff']; 
  const CREATURE_COUNT = 14;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initStars();
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  window.addEventListener('touchmove', e => {
    e.preventDefault(); 
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.025 + 0.01;
      this.size = Math.random() * 4 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;
      this.vx *= 0.92;
      this.vy *= 0.92;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset();
      // Random start positions spread across canvas
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.trail = [];
      this.wobble = Math.random() * Math.PI * 2;
    }

    reset() {
      // Spawn logic
      const side = Math.floor(Math.random() * 4);
      if (side === 0) { this.x = Math.random() * width; this.y = -100; }
      else if (side === 1) { this.x = width + 100; this.y = Math.random() * height; }
      else if (side === 2) { this.x = Math.random() * width; this.y = height + 100; }
      else { this.x = -100; this.y = Math.random() * height; }

      this.vx = (Math.random() * 1.5) - 0.75; 
      this.vy = (Math.random() * 1.5) - 0.75;
      
      // Scale for depth (0.6 to 1.3)
      this.scale = Math.random() * 0.7 + 0.6;
      this.radius = (Math.random() * 12 + 12) * this.scale;
      
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = 0;
      this.wobbleSpeed = Math.random() * 0.03 + 0.01;
      this.isCaught = false;
      this.pulse = Math.random() * 100;
      
      // Shape type
      this.shapeType = Math.floor(Math.random() * 3);
    }

    update() {
      if (this.isCaught) return;

      this.x += this.vx;
      this.y += this.vy;
      this.wobble += this.wobbleSpeed;
      this.pulse += 0.05;

      // Organic drift
      this.x += Math.sin(this.wobble) * 0.6;
      this.y += Math.cos(this.wobble * 0.7) * 0.6;

      // Avoid Mouse (Net)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 200) {
        const force = (200 - dist) / 200;
        const nx = dx / dist;
        const ny = dy / dist;
        this.vx += nx * force * 2.0;
        this.vy += ny * force * 2.0;
      }

      // Wall wrapping
      if (this.x < -150) this.vx = Math.abs(this.vx);
      if (this.x > width + 150) this.vx = -Math.abs(this.vx);
      if (this.y < -150) this.vy = Math.abs(this.vy);
      if (this.y > height + 150) this.vy = -Math.abs(this.vy);

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 4.0) {
        this.vx = (this.vx / speed) * 4.0;
        this.vy = (this.vy / speed) * 4.0;
      }

      // Trail
      this.trail.push({x: this.x, y: this.y});
      if (this.trail.length > 12) this.trail.shift();
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Draw Trail (Biological thread)
      ctx.beginPath();
      if(this.trail.length > 0) {
        ctx.moveTo(this.trail[0].x - this.x, this.trail[0].y - this.y);
        for(let i=1; i<this.trail.length; i++) {
          ctx.lineTo(this.trail[i].x - this.x, this.trail[i].y - this.y);
        }
      }
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.3;
      ctx.stroke();
      ctx.globalAlpha = 1.0;

      // Glow
      ctx.shadowBlur = 20;
      ctx.shadowColor = this.color;
      ctx.fillStyle = this.color;
      
      const r = this.radius + Math.sin(this.pulse) * 2;
      
      ctx.beginPath();
      
      // Draw distinct biological shapes
      if (this.shapeType === 0) {
        // Asymmetric Blob
        for (let i = 0; i <= 360; i += 15) {
          const rad = i * Math.PI / 180;
          const noise = Math.sin(rad * 4 + this.wobble) * (r * 0.3);
          const px = Math.cos(rad) * (r + noise);
          const py = Math.sin(rad) * (r + noise);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
      } else if (this.shapeType === 1) {
        // Jellyfish-ish
        ctx.arc(0, 0, r, Math.PI, 0); // Top dome
        ctx.lineTo(r * 1.1, r * 0.4);
        ctx.quadraticCurveTo(r*0.5, r*0.8, 0, r*0.4);
        ctx.quadraticCurveTo(-r*0.5, r*0.8, -r*1.1, r*0.4);
      } else {
        // Star / Asymmetric
        for (let i = 0; i < 5; i++) {
          const rad = (i * 72) * Math.PI / 180;
          const innerRad = r * 0.4;
          const outerRad = r * 1.4;
          ctx.lineTo(Math.cos(rad) * outerRad, Math.sin(rad) * outerRad);
          const nextRad = ((i * 72) + 36) * Math.PI / 180;
          ctx.lineTo(Math.cos(nextRad) * innerRad, Math.sin(nextRad) * innerRad);
        }
      }
      
      ctx.closePath();
      ctx.fill();

      // Inner Eye/Core
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.arc(-r*0.25, -r*0.25, r * 0.25, 0, Math.PI * 2);
      ctx.fill();
      
      // Internal Pattern (veins)
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-r*0.25, -r*0.25);
      ctx.lineTo(r*0.3, r*0.3);
      ctx.stroke();

      ctx.restore();
    }
  }

  // --- Background Stars ---
  function initStars() {
    stars = [];
    for(let i=0; i<60; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 2,
        alpha: Math.random() * 0.6 + 0.1,
        speed: Math.random() * 0.2
      });
    }
  }

  function drawStars() {
    ctx.fillStyle = '#ffffff';
    stars.forEach(s => {
      // Parallax drift
      s.y += s.speed;
      if(s.y > height) s.y = 0;

      ctx.globalAlpha = s.alpha;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1.0;
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = "00";
  }

  function checkCatch() {
    const catchRadius = 80; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score < 10 ? "0" + score : score;
    
    // Visual FX
    for(let i=0; i<16; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 800);

    // Respawn logic
    setTimeout(() => {
      creature.reset();
    }, 1000);
  }

  function resetGame() {
    init();
  }

  // Draw Player Net (Tangible Tool)
  function drawNet() {
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    const active = isMouseDown;
    const baseColor = active ? '#ffffff' : '#00f2ea';
    const meshColor = active ? 'rgba(0, 242, 234, 0.6)' : 'rgba(0, 242, 234, 0.3)';

    // 1. Handle (Diegetic anchor - drawn separately to connect to player)
    // Just the grip part here
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(20, 20); // Short extension into hand
    ctx.stroke();

    // 2. Net Head (Mesh)
    ctx.shadowBlur = 15;
    ctx.shadowColor = baseColor;
    
    // Outer rim
    ctx.strokeStyle = baseColor;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 60, 0, Math.PI * 2);
    ctx.stroke();

    // Inner mesh pattern (Grid)
    ctx.strokeStyle = meshColor;
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 0;
    
    // Draw cross-hatching
    const step = 15;
    const limit = 60;
    
    ctx.beginPath();
    for(let i = -limit; i <= limit; i+=step) {
      // Diagonal 1
      ctx.moveTo(i, -Math.sqrt(Math.max(0, limit*limit - i*i))); 
      ctx.lineTo(i + limit, Math.sqrt(Math.max(0, limit*limit - (i+limit)*(i+limit))));
      // Diagonal 2
      ctx.moveTo(i, Math.sqrt(Math.max(0, limit*limit - i*i)));
      ctx.lineTo(i + limit, -Math.sqrt(Math.max(0, limit*limit - (i+limit)*(i+limit))));
    }
    ctx.stroke();

    // 3. Active Suction Effect (Pulse)
    if (active) {
      ctx.strokeStyle = 'rgba(0, 242, 234, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 75, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  // Draw "Protagonist" Silhouette
  function drawPlayerAnchor() {
    ctx.save();
    // Shift player up by 24px (approx -120 instead of -100)
    const anchorX = width / 2;
    const anchorY = height - 120; 
    
    // Silhouette
    ctx.fillStyle = '#02040a'; // Match deep bg
    ctx.strokeStyle = 'rgba(0, 242, 234, 0.2)';
    ctx.lineWidth = 2;

    // Body shape (Larger, Protagonist feel)
    ctx.beginPath();
    ctx.ellipse(anchorX, anchorY + 70, 45, 20, 0, 0, Math.PI * 2); // Shoulders
    ctx.fill();
    ctx.stroke();

    // Head
    ctx.beginPath();
    ctx.arc(anchorX, anchorY + 25, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Visor (Reflective, Bright)
    ctx.fillStyle = '#00f2ea';
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.ellipse(anchorX, anchorY + 25, 16, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Visor reflection highlight
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.ellipse(anchorX + 5, anchorY + 22, 4, 2, -0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1.0;

    // Arm to Net
    const dx = mouse.x - anchorX;
    const dy = mouse.y - (anchorY + 20);
    const angle = Math.atan2(dy, dx);
    
    // Arm segments
    ctx.strokeStyle = '#00f2ea';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    // Shoulder joint
    const shoulderX = anchorX + 20;
    const shoulderY = anchorY + 50;
    
    // Elbow joint (intermediate point)
    // Calculate a natural elbow bend
    const dist = Math.sqrt(dx*dx + dy*dy);
    const reach = Math.min(dist, 250); // Limit visual reach
    
    // Calculate elbow position (simplified inverse kinematics)
    const armLen1 = 90;
    const armLen2 = 100;
    const elbowDist = Math.min(dist, armLen1 + armLen2);
    
    // Simple elbow bend logic
    const elbowX = shoulderX + Math.cos(angle) * armLen1;
    const elbowY = shoulderY + Math.sin(angle) * armLen1;

    const handX = shoulderX + Math.cos(angle) * reach;
    const handY = shoulderY + Math.sin(angle) * reach;

    // Draw Arm
    ctx.beginPath();
    ctx.moveTo(shoulderX, shoulderY);
    // Quadratic curve for bent arm
    ctx.quadraticCurveTo(shoulderX + Math.cos(angle + 0.5) * 60, shoulderY + Math.sin(angle + 0.5) * 60, handX, handY);
    ctx.stroke();

    ctx.restore();
  }

  function loop() {
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Draw Background Stars
    drawStars();

    // Update & Draw Creatures (Mid-ground)
    // Sort by Y to fake depth
    creatures.sort((a, b) => a.y - b.y);
    
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net (Follows Mouse)
    drawNet();

    // Draw Player Anchor (Foreground Silhouette)
    drawPlayerAnchor();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();
