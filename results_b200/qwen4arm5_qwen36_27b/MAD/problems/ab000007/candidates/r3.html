<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina - Deep Sea Collection</title>
<style>
  :root {
    --bg-deep: #02040a;
    --bg-radial: #111b33;
    --accent-gold: #ffd700;
    --accent-lime: #ccff00;
    --accent-cyan: #00f0ff;
    --accent-purple: #9d00ff;
    --glass-bg: rgba(10, 20, 40, 0.3);
    --glass-border: rgba(255, 255, 255, 0.05);
    --font-display: 'Arial Black', 'Impact', 'Helvetica Neue', sans-serif;
    --font-ui: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Background Layers --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  /* Refined Background: Deep Atmospheric Gradient */
  .bg-gradient {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 20%, var(--bg-radial) 0%, var(--bg-deep) 90%);
    z-index: 0;
  }

  /* Atmospheric Mist */
  .fog-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: 
      radial-gradient(circle at 15% 30%, rgba(157, 0, 255, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 85% 70%, rgba(0, 240, 255, 0.1) 0%, transparent 40%);
    z-index: 1;
    pointer-events: none;
    animation: pulseFog 15s infinite alternate ease-in-out;
  }

  @keyframes pulseFog {
    0% { opacity: 0.5; transform: scale(1); }
    100% { opacity: 0.8; transform: scale(1.1); }
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none; /* Hide default cursor */
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3rem 3.5rem;
  }

  /* --- Header & HUD (Diegetic/Floating) --- */
  .header-container {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none; /* Let clicks pass through empty space */
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.5rem; 
    position: relative;
    z-index: 2;
    text-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
  }

  h1 {
    /* Distinctive Display Font */
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 4.5rem;
    margin: 0;
    letter-spacing: -0.03em;
    line-height: 0.9;
    color: white;
    /* Subtle gradient text effect */
    background: linear-gradient(180deg, #ffffff 0%, #a0a0a0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 0.9rem;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    /* Wide Tracking */
    letter-spacing: 0.35em;
    text-transform: uppercase;
    margin: 0;
  }

  /* HUD Counter (Integrated, no box) */
  .hud-panel {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    pointer-events: auto;
  }

  .stat-value {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 2.5rem;
    color: var(--accent-gold);
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    line-height: 1;
    margin: 0;
  }

  .stat-label {
    font-size: 0.65rem;
    font-weight: 700;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-top: 4px;
    text-align: right;
  }

  /* --- Footer / CTA (Harmonized) --- */
  .footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: auto;
    padding-bottom: 1rem;
    /* Ensure it doesn't overlap the player anchor arm too much */
    margin-bottom: 2rem;
  }

  .btn-main {
    /* Holographic/Glowing Style */
    background: rgba(0, 240, 255, 0.1);
    border: 1px solid rgba(0, 240, 255, 0.4);
    color: var(--accent-cyan);
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 1rem;
    padding: 1.2rem 3rem;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.1), inset 0 0 10px rgba(0, 240, 255, 0.05);
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }

  /* Shine effect on button */
  .btn-main::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: 0.5s;
  }

  .btn-main:hover {
    background: rgba(0, 240, 255, 0.2);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.4), inset 0 0 20px rgba(0, 240, 255, 0.2);
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
    transform: translateY(-2px);
  }
  
  .btn-main:hover::before {
    left: 100%;
  }
  
  .btn-main:active {
    transform: translateY(1px);
    background: rgba(0, 240, 255, 0.3);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 45%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(20, 30, 50, 0.9);
    border: 1px solid var(--accent-lime);
    color: var(--accent-lime);
    padding: 1rem 2rem;
    border-radius: 2px;
    font-family: var(--font-ui);
    font-weight: 700;
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(204, 255, 0, 0.3);
    white-space: nowrap;
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    h1 { font-size: 3rem; }
    .ui-layer { padding: 1.5rem; }
    .btn-main { padding: 1rem 2rem; font-size: 0.8rem; width: 100%; max-width: 280px; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="bg-gradient"></div>
  <div class="fog-layer"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    
    <!-- Floating Header -->
    <div class="header-container">
      <div class="brand">
        <h1>Lumina</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      
      <div class="hud-panel">
        <div class="stat-value" id="scoreDisplay">0</div>
        <div class="stat-label">Specimens Caught</div>
      </div>
    </div>

    <div id="toast" class="toast">Specimen Captured!</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Focus: Visual Polish, Organic Movement, Depth
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;

  // Configuration
  // Distinct hues for creatures
  const COLORS = ['#ccff00', '#76ff03', '#64dd17', '#aeea00']; 
  const CREATURE_COUNT = 14;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault(); 
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.03 + 0.01;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;
      this.vx *= 0.92;
      this.vy *= 0.92;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset();
      // Start at random positions initially to populate scene
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.trail = [];
    }

    reset() {
      // Spawn logic: Cluster drifting creatures
      const edge = Math.random();
      if (edge < 0.5) {
        // Spawn center-ish
        this.x = (width/2) + (Math.random() * 400 - 200);
        this.y = (height/2) + (Math.random() * 400 - 200);
      } else {
        // Spawn edges
        const side = Math.floor(Math.random() * 4);
        if (side === 0) { this.x = Math.random() * width; this.y = -50; }
        else if (side === 1) { this.x = width + 50; this.y = Math.random() * height; }
        else if (side === 2) { this.x = Math.random() * width; this.y = height + 50; }
        else { this.x = -50; this.y = Math.random() * height; }
      }

      this.vx = (Math.random() * 1.5) - 0.75; 
      this.vy = (Math.random() * 1.5) - 0.75;
      
      this.radius = Math.random() * 12 + 10;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = 0;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.03 + 0.01;
      this.isCaught = false;
      this.pulse = 0;
    }

    update() {
      if (this.isCaught) return;

      this.x += this.vx;
      this.y += this.vy;
      this.wobble += this.wobbleSpeed;
      this.pulse += 0.05;

      // Organic sine wave drift
      this.x += Math.sin(this.wobble) * 0.5;
      this.y += Math.cos(this.wobble * 0.8) * 0.5;

      // Avoid Mouse (Net)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      // Flee behavior radius
      if (dist < 200) {
        const force = (200 - dist) / 200;
        const nx = dx / dist;
        const ny = dy / dist;
        this.vx += nx * force * 2.0;
        this.vy += ny * force * 2.0;
      }

      // Soft wall wrapping
      if (this.x < -100) this.vx = Math.abs(this.vx);
      if (this.x > width + 100) this.vx = -Math.abs(this.vx);
      if (this.y < -100) this.vy = Math.abs(this.vy);
      if (this.y > height + 100) this.vy = -Math.abs(this.vy);

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 4) {
        this.vx = (this.vx / speed) * 4;
        this.vy = (this.vy / speed) * 4;
      }

      // Trail
      this.trail.push({x: this.x, y: this.y});
      if (this.trail.length > 8) this.trail.shift();
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Draw Trail
      ctx.beginPath();
      if(this.trail.length > 0) {
        ctx.moveTo(this.trail[0].x - this.x, this.trail[0].y - this.y);
        for(let i=1; i<this.trail.length; i++) {
          ctx.lineTo(this.trail[i].x - this.x, this.trail[i].y - this.y);
        }
      }
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.4;
      ctx.stroke();
      ctx.globalAlpha = 1.0;

      // Glow
      ctx.shadowBlur = 20;
      ctx.shadowColor = this.color;
      
      // Body
      ctx.fillStyle = this.color;
      ctx.beginPath();
      
      const r = this.radius + Math.sin(this.pulse) * 2;
      // Organic shape
      for (let i = 0; i <= 360; i += 15) {
        const rad = i * Math.PI / 180;
        const noise = Math.sin(rad * 4 + this.wobble) * 2;
        const px = Math.cos(rad) * (r + noise);
        const py = Math.sin(rad) * (r + noise);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();

      // Inner Eye/Core (Distinct entity look)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(-r*0.2, -r*0.2, r * 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 80; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<15; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1000);

    // Respawn logic
    setTimeout(() => {
      creature.reset();
    }, 1000);
  }

  function resetGame() {
    init();
  }

  // Draw Player Avatar (Net) - Fixed in foreground relative to creatures, but moves with mouse
  function drawNet() {
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Glow - Cyan to differentiate from Green creatures
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f0ff';
    
    // Net Shape
    ctx.strokeStyle = isMouseDown ? '#ffffff' : '#00f0ff';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    
    // Draw main ring
    ctx.beginPath();
    ctx.arc(0, 0, 60, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner dashed ring
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, 45, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Center point
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    // Active effect
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, 75, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  // Draw "Protagonist" Anchor in Foreground
  // This is a static visual element to satisfy "Player character in lower-center foreground"
  function drawPlayerAnchor() {
    ctx.save();
    const anchorX = width / 2;
    const anchorY = height - 120; // Just above the button area
    
    // We draw a subtle silhouette of a diver/catcher holding the net
    // This is purely decorative to ground the scene
    
    // Silhouette color
    ctx.fillStyle = '#020408';
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.lineWidth = 2;

    // Shoulders/Back
    ctx.beginPath();
    ctx.ellipse(anchorX, anchorY + 50, 40, 20, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Helmet
    ctx.beginPath();
    ctx.arc(anchorX, anchorY + 10, 25, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    
    // Visor
    ctx.fillStyle = '#00f0ff';
    ctx.globalAlpha = 0.2;
    ctx.beginPath();
    ctx.ellipse(anchorX, anchorY + 10, 15, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;

    // Arm reaching out to mouse (Dynamic line)
    // Calculate angle to mouse
    const dx = mouse.x - anchorX;
    const dy = mouse.y - (anchorY - 20);
    const angle = Math.atan2(dy, dx);
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    // Limit arm length visually
    const armLen = Math.min(dist, 300);
    
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(anchorX, anchorY + 10);
    ctx.lineTo(
      anchorX + Math.cos(angle) * armLen,
      (anchorY - 20) + Math.sin(angle) * armLen
    );
    ctx.stroke();

    ctx.restore();
  }

  function loop() {
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures (Mid-ground)
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net (Follows Mouse)
    drawNet();

    // Draw Player Anchor (Foreground Silhouette)
    drawPlayerAnchor();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
