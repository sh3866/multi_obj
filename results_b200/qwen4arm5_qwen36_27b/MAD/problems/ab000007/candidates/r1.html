<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina - Deep Sea Collection</title>
<style>
  :root {
    --bg-deep: #020408;
    --bg-cave: #06101c;
    --accent-cyan: #00f0ff;
    --accent-magenta: #ff0077;
    --accent-lime: #ccff00;
    --accent-purple: #9d00ff;
    --glass-bg: rgba(12, 20, 35, 0.6);
    --glass-border: rgba(255, 255, 255, 0.15);
    --glass-highlight: rgba(255, 255, 255, 0.05);
    --font-ui: 'Nunito', 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
    /* Fallback font stack if Nunito isn't local, but Nunito is requested */
  }

  /* --- Background Layers --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  /* Deep sea gradient */
  .bg-gradient {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 120%, #0a1a30 0%, #020408 70%);
    z-index: 0;
  }

  /* Cave Fog / Mist */
  .fog-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: 
      radial-gradient(circle at 20% 30%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(157, 0, 255, 0.08) 0%, transparent 40%);
    z-index: 1;
    pointer-events: none;
    animation: pulseFog 10s infinite alternate ease-in-out;
  }

  @keyframes pulseFog {
    0% { opacity: 0.5; transform: scale(1); }
    100% { opacity: 0.8; transform: scale(1.05); }
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    /* Critique: Adjusted padding for vertical balance */
    padding: 2rem 2rem 2.5rem 2rem; 
  }

  /* --- Header & HUD --- */
  .header-container {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    /* Critique: Unify HUD container */
    background: linear-gradient(180deg, rgba(10, 20, 40, 0.8) 0%, rgba(10, 20, 40, 0.4) 100%);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 1rem 1.5rem;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.2), inset 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
    max-width: 100%;
  }

  /* Decorative glow inside HUD */
  .header-container::after {
    content: '';
    position: absolute;
    top: 0; right: 0; width: 100px; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.1));
    pointer-events: none;
  }

  .brand {
    display: flex;
    flex-direction: column;
    /* Critique: Increase vertical gap to 16px */
    gap: 16px; 
    position: relative;
    z-index: 2;
  }

  h1 {
    font-family: var(--font-ui);
    font-weight: 800; /* Extra bold for impact */
    font-size: 2.5rem;
    margin: 0;
    letter-spacing: 0.02em;
    line-height: 1;
    color: white;
    text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
  }

  .subtitle {
    font-size: 0.9rem;
    font-weight: 600;
    color: rgba(255,255,255,0.8);
    /* Critique: Tighten tracking, increase opacity */
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 0;
  }

  /* HUD Counter */
  .hud-panel {
    display: flex;
    align-items: center; /* Critique: Vertically center icon */
    gap: 1rem;
    background: rgba(0, 0, 0, 0.2);
    padding: 0.5rem 1rem;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .stat-icon {
    width: 24px; height: 24px;
    fill: var(--accent-lime);
    filter: drop-shadow(0 0 4px var(--accent-lime));
  }

  .stat-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    line-height: 1.1;
  }

  .stat-value {
    font-family: var(--font-ui);
    font-weight: 800;
    font-size: 1.5rem;
    color: white;
    margin: 0;
  }

  .stat-label {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0;
  }

  /* --- Footer / CTA --- */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    /* Critique: Move button up 24px (approx 1.5rem) */
    padding-bottom: 24px;
  }

  .btn-main {
    background: rgba(0, 240, 255, 0.1);
    backdrop-filter: blur(10px);
    border: 2px solid var(--accent-cyan);
    color: white;
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 1.1rem;
    padding: 1rem 3rem;
    border-radius: 50px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    /* Critique: Strong glowing outline */
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.3), inset 0 0 10px rgba(0, 240, 255, 0.1);
  }

  .btn-main:hover {
    background: rgba(0, 240, 255, 0.25);
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.6), inset 0 0 15px rgba(0, 240, 255, 0.2);
    border-color: white;
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(20, 30, 50, 0.9);
    border: 1px solid var(--accent-lime);
    color: var(--accent-lime);
    padding: 0.8rem 1.5rem;
    border-radius: 8px;
    font-family: var(--font-ui);
    font-weight: 700;
    letter-spacing: 0.05em;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(204, 255, 0, 0.2);
    white-space: nowrap;
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    h1 { font-size: 1.8rem; }
    .ui-layer { padding: 1rem; }
    .header-container { padding: 0.8rem 1rem; }
    .btn-main { padding: 0.8rem 2rem; font-size: 0.9rem; width: 100%; max-width: 300px; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="bg-gradient"></div>
  <div class="fog-layer"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    
    <!-- Critique: Unified Header Container -->
    <div class="header-container">
      <div class="brand">
        <h1>Lumina</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      
      <div class="hud-panel">
        <!-- Star Icon -->
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" />
        </svg>
        <div class="stat-content">
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Caught</div>
        </div>
      </div>
    </div>

    <div id="toast" class="toast">Specimen Captured!</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Critique: Improved visual design, organic movement, and depth.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;

  // Configuration
  const COLORS = ['#00f0ff', '#ff0077', '#ccff00', '#9d00ff']; // Cyan, Magenta, Lime, Purple
  const CREATURE_COUNT = 8;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault(); 
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 4 + 2;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;
      this.vx *= 0.95;
      this.vy *= 0.95;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset();
      // Start at random positions initially
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.trail = []; // For movement trails
    }

    reset() {
      // Spawn at edges
      const side = Math.floor(Math.random() * 4);
      if (side === 0) { this.x = Math.random() * width; this.y = -50; } // Top
      else if (side === 1) { this.x = width + 50; this.y = Math.random() * height; } // Right
      else if (side === 2) { this.x = Math.random() * width; this.y = height + 50; } // Bottom
      else { this.x = -50; this.y = Math.random() * height; } // Left

      // Curated flow: move generally towards center/right to lead eye
      this.vx = (Math.random() * 2) - 0.5; 
      this.vy = (Math.random() * 2) - 0.5;
      
      this.radius = Math.random() * 15 + 12;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = 0;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.05 + 0.02;
      this.isCaught = false;
      this.pulse = 0;
    }

    update() {
      if (this.isCaught) return;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.wobble += this.wobbleSpeed;
      this.pulse += 0.05;

      // Organic sine wave drift
      this.x += Math.sin(this.wobble) * 0.8;
      this.y += Math.cos(this.wobble * 0.8) * 0.8;

      // Avoid Mouse (Net) - Flee behavior
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 180) {
        const force = (180 - dist) / 180;
        // Normalize vector
        const nx = dx / dist;
        const ny = dy / dist;
        this.vx += nx * force * 1.5;
        this.vy += ny * force * 1.5;
      }

      // Soft wall wrapping/bouncing
      if (this.x < -100) this.vx = Math.abs(this.vx);
      if (this.x > width + 100) this.vx = -Math.abs(this.vx);
      if (this.y < -100) this.vy = Math.abs(this.vy);
      if (this.y > height + 100) this.vy = -Math.abs(this.vy);

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 5) {
        this.vx = (this.vx / speed) * 5;
        this.vy = (this.vy / speed) * 5;
      }

      // Update Trail
      this.trail.push({x: this.x, y: this.y});
      if (this.trail.length > 10) this.trail.shift();
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Draw Trail
      ctx.beginPath();
      if(this.trail.length > 0) {
        ctx.moveTo(this.trail[0].x - this.x, this.trail[0].y - this.y);
        for(let i=1; i<this.trail.length; i++) {
          ctx.lineTo(this.trail[i].x - this.x, this.trail[i].y - this.y);
        }
      }
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.3;
      ctx.stroke();
      ctx.globalAlpha = 1.0;

      // Glow
      ctx.shadowBlur = 25;
      ctx.shadowColor = this.color;
      
      // Body - Organic Silhouette (Blob)
      ctx.fillStyle = this.color;
      ctx.beginPath();
      
      const r = this.radius + Math.sin(this.pulse) * 2;
      // Draw a slightly irregular circle
      for (let i = 0; i <= 360; i += 10) {
        const rad = i * Math.PI / 180;
        const noise = Math.sin(rad * 3 + this.wobble) * 3;
        const px = Math.cos(rad) * (r + noise);
        const py = Math.sin(rad) * (r + noise);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();

      // Inner Core
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(-r*0.2, -r*0.2, r * 0.35, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    // Simple collision detection with the "Net" radius
    const catchRadius = 70; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<20; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1200);

    // Respawn logic
    setTimeout(() => {
      creature.reset();
    }, 1500);
  }

  function resetGame() {
    init();
  }

  // Critique: Redraw player avatar (Net) with more character
  function drawNet() {
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#00f0ff';
    
    // Net Shape (Organic Circle)
    ctx.strokeStyle = isMouseDown ? '#ffffff' : '#00f0ff';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    
    // Draw main ring
    ctx.beginPath();
    ctx.arc(0, 0, 65, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner dashed ring for tech feel
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.arc(0, 0, 50, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Crosshair / Focus point
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-15, 0); ctx.lineTo(15, 0);
    ctx.moveTo(0, -15); ctx.lineTo(0, 15);
    ctx.stroke();

    // "Sucking" / Active effect
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 80, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
