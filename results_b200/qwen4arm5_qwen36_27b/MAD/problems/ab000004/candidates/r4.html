<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Planet Defense - Command Interface</title>
<style>
    :root {
        /* Palette - Deep Space & Neon */
        --bg-deep: #030409;
        --bg-panel: rgba(10, 15, 25, 0.85);
        
        --primary: #00f0ff;
        --primary-dim: rgba(0, 240, 255, 0.1);
        --primary-glow: rgba(0, 240, 255, 0.6);
        
        --accent-hp: #ff3333;
        --accent-credits: #ffd700;
        
        --text-main: #ffffff;
        --text-muted: #94a3b8; /* Light grey for body text */

        --font-display: 'Impact', 'Arial Black', 'Helvetica Neue', sans-serif;
        --font-ui: 'Courier New', 'Consolas', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        height: 100vh;
        overflow: hidden;
        font-family: var(--font-ui);
        display: flex;
        flex-direction: column;
    }

    /* --- BACKGROUND LAYERS --- */
    .bg-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0;
        pointer-events: none;
    }

    /* Grid Texture for depth */
    .grid-overlay {
        background-image: 
            linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
        -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
    }

    .vignette {
        background: radial-gradient(circle at center, transparent 0%, var(--bg-deep) 85%);
    }

    /* --- PLANET FOCAL POINT --- */
    .planet-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 800px;
        height: 800px;
        z-index: 1;
        pointer-events: none;
        opacity: 0.6; /* Dimmed so text pops */
    }

    .planet-sphere {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #1e293b 0%, #0f172a 40%, #000000 85%);
        box-shadow: 
            inset -30px -30px 100px rgba(0,0,0,1), 
            0 0 0 2px rgba(0, 240, 255, 0.1),
            0 0 100px rgba(0, 240, 255, 0.1);
        position: relative;
        overflow: hidden;
    }

    /* Atmosphere Glow */
    .planet-sphere::after {
        content: '';
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        box-shadow: inset 0 0 60px rgba(0, 240, 255, 0.2);
        z-index: -1;
    }

    /* --- HUD HEADER --- */
    .hud-header {
        position: relative;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 40px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    }

    .hud-group { display: flex; gap: 40px; }

    .hud-item {
        display: flex;
        flex-direction: column;
        position: relative;
        padding-left: 12px;
        border-left: 3px solid var(--primary);
    }

    .hud-item.hp { border-color: var(--accent-hp); }
    .hud-item.credits { border-color: var(--accent-credits); }

    .hud-label {
        font-size: 0.7rem;
        letter-spacing: 2px;
        color: var(--primary);
        text-transform: uppercase;
        font-weight: bold;
        margin-bottom: 2px;
    }
    .hud-item.hp .hud-label { color: var(--accent-hp); }
    .hud-item.credits .hud-label { color: var(--accent-credits); }

    .hud-value {
        font-size: 1.8rem;
        font-weight: 900;
        color: #fff;
        line-height: 1;
        font-family: var(--font-display);
        letter-spacing: 1px;
    }

    /* --- MAIN STAGE --- */
    .main-stage {
        position: relative;
        z-index: 5;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    /* --- TITLE --- */
    .game-title {
        font-family: var(--font-display);
        font-size: 6rem;
        line-height: 0.85;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 30px;
        color: #fff;
        /* Strong Neon Glow */
        text-shadow: 
            0 0 10px rgba(255,255,255,0.8),
            0 0 30px var(--primary-glow),
            0 0 60px var(--primary);
        letter-spacing: 0.05em;
        mix-blend-mode: lighten;
    }

    /* --- COMMAND CONSOLE (The Central Panel) --- */
    .command-console {
        width: 100%;
        max-width: 900px;
        background: var(--bg-panel);
        /* High opacity backdrop to block noise */
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,0.1);
        border-top: 2px solid var(--primary); /* Top highlight */
        box-shadow: 
            0 20px 60px rgba(0,0,0,0.8),
            0 0 20px rgba(0, 240, 255, 0.1);
        padding: 40px;
        position: relative;
        clip-path: polygon(
            0 0, 100% 0, 
            100% calc(100% - 20px), calc(100% - 20px) 100%, 
            0 100%
        ); /* Sci-fi cut corner */
    }

    /* --- LAYOUT: BRIEFING & UPGRADES --- */
    .console-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        margin-bottom: 40px;
    }

    /* Briefing Block */
    .briefing-block {
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-right: 1px solid rgba(255,255,255,0.1);
        padding-right: 40px;
    }

    .briefing-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
    }

    .briefing-header h3 {
        font-size: 0.9rem;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .briefing-text {
        color: var(--text-muted); /* Light grey per critique */
        font-size: 1.05rem;
        line-height: 1.6;
    }

    /* Upgrade Block */
    .upgrades-block {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .upgrade-card {
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
    }

    .upgrade-card::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0; width: 4px;
        background: var(--primary);
        opacity: 0.5;
        transition: opacity 0.2s;
    }

    .upgrade-card:hover {
        background: rgba(0, 240, 255, 0.05);
        border-color: var(--primary);
        transform: translateX(4px);
    }
    .upgrade-card:hover::before { opacity: 1; box-shadow: 0 0 10px var(--primary); }

    .upg-info { display: flex; align-items: center; gap: 16px; }
    
    .upg-icon {
        width: 24px; height: 24px;
        color: var(--primary);
        stroke-width: 2;
        stroke: currentColor;
        fill: none;
    }

    .upg-name {
        font-size: 1rem;
        font-weight: bold;
        text-transform: uppercase;
        color: #fff;
        letter-spacing: 1px;
    }

    .upg-cost {
        font-family: var(--font-display);
        color: var(--accent-credits);
        font-size: 1.1rem;
    }

    /* --- PRIMARY CTA --- */
    .btn-start {
        width: 100%;
        padding: 28px;
        background: var(--primary); /* Solid bright fill */
        color: #000; /* Black text */
        border: none;
        font-family: var(--font-display);
        font-size: 1.5rem;
        text-transform: uppercase;
        letter-spacing: 4px;
        cursor: pointer;
        position: relative;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-shadow: 
            0 0 0 1px var(--primary),
            0 0 20px var(--primary-glow);
        clip-path: polygon(
            0 0, 100% 0, 
            100% calc(100% - 10px), calc(100% - 10px) 100%, 
            0 100%
        );
    }

    .btn-start:hover {
        background: #fff; /* White on hover */
        box-shadow: 
            0 0 0 1px #fff,
            0 0 40px var(--primary),
            0 0 80px var(--primary);
        transform: translateY(-2px);
    }
    
    .btn-start:active {
        transform: scale(0.99);
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 800px) {
        .game-title { font-size: 3.5rem; }
        .console-grid { grid-template-columns: 1fr; gap: 30px; }
        .briefing-block { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 30px; padding-right: 0; }
        .hud-header { flex-direction: column; gap: 10px; align-items: flex-start; }
        .hud-group { gap: 20px; width: 100%; justify-content: space-between; }
        .planet-container { width: 400px; height: 400px; top: 20%; opacity: 0.3; }
    }
</style>
</head>
<body>

    <!-- Background Layers -->
    <div class="bg-layer" id="starfield"></div>
    <div class="bg-layer grid-overlay"></div>
    <div class="bg-layer vignette"></div>

    <!-- Planet Visual -->
    <div class="planet-container">
        <div class="planet-sphere"></div>
    </div>

    <!-- HUD Header -->
    <header class="hud-header">
        <div class="hud-group">
            <div class="hud-item">
                <span class="hud-label">Wave</span>
                <span class="hud-value">001</span>
            </div>
            <div class="hud-item hp">
                <span class="hud-label">Integrity</span>
                <span class="hud-value">100%</span>
            </div>
        </div>
        <div class="hud-group">
            <div class="hud-item credits">
                <span class="hud-label">Credits</span>
                <span class="hud-value">500</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-stage">
        
        <h1 class="game-title">JS PLANET<br>DEFENSE</h1>

        <div class="command-console">
            
            <div class="console-grid">
                <!-- Briefing Section -->
                <div class="briefing-block">
                    <div class="briefing-header">
                        <!-- Warning Icon -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                            <line x1="12" y1="9" x2="12" y2="13" stroke-linecap="square"></line>
                            <line x1="12" y1="17" x2="12.01" y2="17" stroke-linecap="square"></line>
                        </svg>
                        <h3>Mission Briefing</h3>
                    </div>
                    <p class="briefing-text">
                        Sensors detect massive swarm approaching sector. Orbital cannons are online. 
                        Optimize turret systems before the first wave breaches the perimeter.
                    </p>
                </div>

                <!-- Upgrade Options -->
                <div class="upgrades-block">
                    
                    <div class="upgrade-card" onclick="flashCard(this)">
                        <div class="upg-info">
                            <!-- Chunky Bolt Icon -->
                            <svg class="upg-icon" viewBox="0 0 24 24" stroke-linejoin="miter">
                                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                            </svg>
                            <span class="upg-name">Damage</span>
                        </div>
                        <span class="upg-cost">150</span>
                    </div>

                    <div class="upgrade-card" onclick="flashCard(this)">
                        <div class="upg-info">
                            <!-- Chunky Clock Icon -->
                            <svg class="upg-icon" viewBox="0 0 24 24" stroke-linecap="square" stroke-linejoin="miter">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                            <span class="upg-name">Fire Rate</span>
                        </div>
                        <span class="upg-cost">200</span>
                    </div>

                    <div class="upgrade-card" onclick="flashCard(this)">
                        <div class="upg-info">
                            <!-- Chunky Layers Icon -->
                            <svg class="upg-icon" viewBox="0 0 24 24" stroke-linejoin="miter">
                                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                            </svg>
                            <span class="upg-name">Speed</span>
                        </div>
                        <span class="upg-cost">100</span>
                    </div>

                </div>
            </div>

            <!-- Primary CTA -->
            <button class="btn-start" onclick="startGame()">INITIALIZE DEFENSE</button>
            
        </div>
    </main>

    <script>
        // --- VISUAL EFFECTS SCRIPT ---

        // 1. Starfield Generation (Canvas)
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        const stars = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function createStars() {
            stars.length = 0;
            const count = Math.floor((width * height) / 2000); // Higher density
            for(let i=0; i<count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.05 + 0.01
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                
                star.y -= star.speed;
                star.alpha += (Math.random() - 0.5) * 0.02;
                if (star.alpha < 0.1) star.alpha = 0.1;
                if (star.alpha > 1) star.alpha = 1;

                if (star.y < 0) star.y = height;
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => { resize(); createStars(); });
        resize();
        createStars();
        animate();

        // 2. Interactivity
        function flashCard(element) {
            // Quick visual feedback
            const originalBg = element.style.background;
            element.style.background = 'rgba(0, 240, 255, 0.3)';
            element.style.borderColor = '#fff';
            
            setTimeout(() => {
                element.style.background = '';
                element.style.borderColor = '';
            }, 150);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            const originalText = btn.innerText;
            btn.innerText = "CALIBRATING...";
            btn.style.backgroundColor = "#fff";
            btn.style.boxShadow = "0 0 50px #fff";
            
            setTimeout(() => {
                // Flash effect
                const flash = document.createElement('div');
                flash.style.position = 'fixed';
                flash.style.top = '0'; flash.style.left = '0';
                flash.style.width = '100vw'; flash.style.height = '100vh';
                flash.style.backgroundColor = 'var(--primary)';
                flash.style.zIndex = '100';
                flash.style.transition = 'opacity 1s ease-out';
                document.body.appendChild(flash);
                
                // Fade out
                setTimeout(() => { flash.style.opacity = '0'; }, 50);
                
                setTimeout(() => {
                    flash.remove();
                    alert("Game Engine Initialized (Demo End)");
                    btn.innerText = originalText;
                    btn.style.backgroundColor = '';
                    btn.style.boxShadow = '';
                }, 1000);
            }, 600);
        }
    </script>
</body>
</html>
