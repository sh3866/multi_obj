<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Planet Defense</title>
<style>
    :root {
        /* Palette */
        --c-bg: #030305;
        --c-cyan: #00f0ff;
        --c-cyan-dim: rgba(0, 240, 255, 0.15);
        --c-orange: #ff5e00;
        --c-orange-glow: rgba(255, 94, 0, 0.4);
        --c-red: #ff3333;
        --c-yellow: #ffd700;
        --c-text-main: #e0e6ed;
        --c-text-dim: #7a8ba3;
        
        /* Fonts - System Fallbacks */
        --font-title: 'Arial Black', 'Impact', sans-serif;
        --font-term: 'Courier New', 'Lucida Console', monospace;
        
        /* Dimensions */
        --gap-rhythm: 48px;
        --clip-size: 12px;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--c-bg);
        color: var(--c-text-main);
        height: 100vh;
        overflow: hidden;
        font-family: var(--font-term);
        display: flex;
        flex-direction: column;
        /* Deep void background */
        background: radial-gradient(circle at center, #0b0d14 0%, #000000 100%);
    }

    /* --- BACKGROUND LAYERS --- */
    .bg-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0;
        pointer-events: none;
    }

    /* Scanlines */
    .scanlines {
        background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
        background-size: 100% 4px;
        opacity: 0.3;
        z-index: 10;
    }

    /* --- HUD HEADER --- */
    .hud-header {
        position: relative;
        z-index: 5;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 32px 48px; /* Increased breathing room */
    }

    .hud-group {
        display: flex;
        gap: 40px;
    }

    .hud-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: rgba(0, 0, 0, 0.4);
        padding: 8px 12px;
        border-left: 3px solid var(--c-cyan);
    }

    .hud-label {
        font-size: 0.7rem;
        letter-spacing: 2px;
        color: var(--c-cyan);
        text-transform: uppercase;
        font-weight: bold;
    }

    .hud-value {
        font-size: 1.5rem;
        font-weight: 900;
        letter-spacing: 1px;
        color: #fff;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    /* Specific HUD Colors */
    .hud-item.hp { border-color: var(--c-red); }
    .hud-item.hp .hud-label { color: var(--c-red); }
    .hud-item.hp .hud-value { color: var(--c-red); text-shadow: 0 0 10px rgba(255, 51, 51, 0.5); }

    .hud-item.credits { border-color: var(--c-yellow); }
    .hud-item.credits .hud-label { color: var(--c-yellow); }
    .hud-item.credits .hud-value { color: var(--c-yellow); text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }

    /* --- MAIN CONTENT --- */
    .main-stage {
        position: relative;
        z-index: 4;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 0 20px;
        max-width: 1100px;
        margin: 0 auto;
        width: 100%;
    }

    /* --- TITLE --- */
    .game-title {
        font-family: var(--font-title);
        font-size: 5rem;
        font-weight: 900;
        text-transform: uppercase;
        /* Wide stretched look */
        letter-spacing: 0.15em;
        line-height: 0.9;
        text-align: center;
        margin: 0;
        color: var(--c-text-main);
        text-shadow: 0 4px 0px rgba(0,0,0,0.5);
        position: relative;
    }
    
    .game-title .accent-word {
        color: var(--c-orange);
        text-shadow: 0 0 20px var(--c-orange-glow);
    }

    /* --- COMMAND CONSOLE (Unified Block) --- */
    .command-console {
        margin-top: var(--gap-rhythm);
        width: 100%;
        max-width: 900px;
        position: relative;
        background: rgba(10, 14, 23, 0.85);
        border: 1px solid var(--c-cyan-dim);
        backdrop-filter: blur(12px);
        /* Tech Clip Path */
        clip-path: polygon(
            20px 0, 100% 0, 
            100% calc(100% - 20px), calc(100% - 20px) 100%, 
            0 100%, 0 20px
        );
        box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(0, 240, 255, 0.05);
        display: flex;
        flex-direction: column;
    }

    /* Decorative Tech Brackets */
    .command-console::before {
        content: '';
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: 
            linear-gradient(135deg, transparent 49.5%, var(--c-cyan) 50%, transparent 50.5%) top left 0 0 / 20px 20px no-repeat,
            linear-gradient(-135deg, transparent 49.5%, var(--c-cyan) 50%, transparent 50.5%) bottom right 0 0 / 20px 20px no-repeat;
        opacity: 0.5;
        pointer-events: none;
    }

    /* --- BRIEFING SECTION --- */
    .briefing-section {
        padding: 24px 32px;
        border-bottom: 1px solid var(--c-cyan-dim);
        display: flex;
        align-items: flex-start;
        gap: 16px;
    }

    .briefing-icon {
        color: var(--c-cyan);
        flex-shrink: 0;
        margin-top: 2px;
        animation: pulse 2s infinite;
    }

    .briefing-content h3 {
        margin: 0 0 8px 0;
        font-size: 0.9rem;
        color: var(--c-cyan);
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .briefing-text {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.5;
        color: var(--c-text-dim);
        max-width: 90%;
    }

    /* --- INTERACTION AREA --- */
    .interaction-area {
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    /* Upgrade Cards */
    .upgrades-row {
        display: flex;
        gap: 16px;
        width: 100%;
    }

    .upgrade-card {
        flex: 1;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--c-cyan-dim);
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        /* Inner clip for card */
        clip-path: polygon(
            10px 0, 100% 0, 
            100% calc(100% - 10px), calc(100% - 10px) 100%, 
            0 100%, 0 10px
        );
    }

    .upgrade-card:hover {
        background: rgba(0, 240, 255, 0.1);
        border-color: var(--c-cyan);
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(0, 240, 255, 0.1);
    }
    
    .upgrade-card:hover .upgrade-icon {
        filter: drop-shadow(0 0 5px var(--c-cyan));
    }

    .upgrade-icon {
        width: 28px; height: 28px;
        margin-bottom: 12px;
        stroke: var(--c-cyan);
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .upgrade-name {
        font-size: 0.8rem;
        font-weight: bold;
        color: var(--c-text-main);
        text-transform: uppercase;
        margin-bottom: 4px;
        letter-spacing: 1px;
    }

    .upgrade-cost {
        font-size: 0.75rem;
        color: var(--c-yellow);
    }

    /* Start Button */
    .btn-start {
        background: var(--c-cyan);
        color: #000;
        border: none;
        padding: 20px;
        font-family: var(--font-title);
        font-size: 1.2rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        cursor: pointer;
        width: 100%;
        position: relative;
        transition: all 0.2s ease;
        clip-path: polygon(
            15px 0, 100% 0, 
            100% calc(100% - 15px), calc(100% - 15px) 100%, 
            0 100%, 0 15px
        );
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }

    .btn-start:hover {
        background: #fff;
        box-shadow: 0 0 30px var(--c-cyan);
    }

    .btn-start:active {
        transform: scale(0.98);
    }

    /* --- ANIMATED PLANET (CSS/SVG) --- */
    .planet-wrapper {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -55%);
        width: 600px;
        height: 600px;
        z-index: -1;
        pointer-events: none;
        opacity: 0.6;
    }

    .planet-body {
        width: 100%; height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #2b3245 0%, #0f111a 60%, #000000 100%);
        box-shadow: inset -30px -30px 60px rgba(0,0,0,0.9), 0 0 50px rgba(0, 240, 255, 0.1);
        position: relative;
        overflow: hidden;
    }

    /* Craters */
    .crater {
        position: absolute;
        border-radius: 50%;
        background: rgba(0,0,0,0.3);
        box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8), 1px 1px 2px rgba(255,255,255,0.05);
    }

    .ring {
        position: absolute;
        top: 50%; left: 50%;
        width: 140%; height: 40%;
        transform: translate(-50%, -50%) rotate(-15deg);
        border: 2px solid rgba(0, 240, 255, 0.2);
        border-radius: 50%;
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
        background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.1), transparent);
    }

    @keyframes pulse {
        0% { opacity: 0.6; }
        50% { opacity: 1; }
        100% { opacity: 0.6; }
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 768px) {
        .game-title { font-size: 3rem; }
        .hud-header { padding: 16px 20px; flex-direction: column; gap: 16px; }
        .hud-group { gap: 16px; flex-wrap: wrap; }
        .planet-wrapper { width: 300px; height: 300px; top: 20%; }
        .upgrades-row { flex-direction: column; }
        .interaction-area { padding: 20px; }
    }
</style>
</head>
<body>

    <!-- Backgrounds -->
    <div class="bg-layer" id="starfield"></div>
    <div class="bg-layer scanlines"></div>

    <!-- HUD Header -->
    <header class="hud-header">
        <div class="hud-group">
            <div class="hud-item">
                <span class="hud-label">Wave</span>
                <span class="hud-value">001</span>
            </div>
            <div class="hud-item hp">
                <span class="hud-label">Integrity</span>
                <span class="hud-value">100%</span>
            </div>
        </div>
        <div class="hud-group">
            <div class="hud-item credits">
                <span class="hud-label">Credits</span>
                <span class="hud-value">500</span>
            </div>
        </div>
    </header>

    <!-- Main Stage -->
    <main class="main-stage">
        
        <!-- Hero Element: Stylized Planet -->
        <div class="planet-wrapper">
            <div class="planet-body">
                <!-- CSS Craters -->
                <div class="crater" style="top: 20%; left: 30%; width: 40px; height: 40px;"></div>
                <div class="crater" style="top: 60%; left: 60%; width: 80px; height: 80px;"></div>
                <div class="crater" style="top: 70%; left: 20%; width: 25px; height: 25px;"></div>
                <div class="crater" style="top: 30%; left: 70%; width: 50px; height: 50px;"></div>
            </div>
            <div class="ring"></div>
        </div>

        <h1 class="game-title">JS <span class="accent-word">PLANET</span><br>DEFENSE</h1>

        <!-- Unified Command Console -->
        <div class="command-console">
            
            <!-- Top: Briefing -->
            <div class="briefing-section">
                <div class="briefing-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </div>
                <div class="briefing-content">
                    <h3>Mission Briefing</h3>
                    <p class="briefing-text">
                        SENSORS DETECT MASSIVE SWARM APPROACHING SECTOR. ORBITAL CANNONS ONLINE. 
                        OPTIMIZE TURRET SYSTEMS BEFORE FIRST WAVE BREACHES PERIMETER.
                    </p>
                </div>
            </div>

            <!-- Bottom: Interaction -->
            <div class="interaction-area">
                
                <div class="upgrades-row">
                    <div class="upgrade-card" onclick="simulateClick(this)">
                        <svg class="upgrade-icon" viewBox="0 0 24 24">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                        </svg>
                        <div class="upgrade-name">Damage</div>
                        <div class="upgrade-cost">150 CR</div>
                    </div>
                    <div class="upgrade-card" onclick="simulateClick(this)">
                        <svg class="upgrade-icon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <div class="upgrade-name">Fire Rate</div>
                        <div class="upgrade-cost">200 CR</div>
                    </div>
                    <div class="upgrade-card" onclick="simulateClick(this)">
                        <svg class="upgrade-icon" viewBox="0 0 24 24">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                        </svg>
                        <div class="upgrade-name">Speed</div>
                        <div class="upgrade-cost">100 CR</div>
                    </div>
                </div>

                <button class="btn-start" onclick="startGame()">INITIALIZE DEFENSE</button>
            </div>

        </div>
    </main>

    <script>
        // --- VISUAL EFFECTS SCRIPT ---

        // 1. Starfield Generation (Canvas)
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        const stars = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function createStars() {
            stars.length = 0;
            const count = Math.floor((width * height) / 4000); // Density
            for(let i=0; i<count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.05 + 0.01
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Slow drift
                star.y -= star.speed;
                // Twinkle
                star.alpha += (Math.random() - 0.5) * 0.02;
                if (star.alpha < 0.1) star.alpha = 0.1;
                if (star.alpha > 1) star.alpha = 1;

                // Wrap around
                if (star.y < 0) star.y = height;
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => { resize(); createStars(); });
        resize();
        createStars();
        animate();

        // 2. Interactivity
        function simulateClick(element) {
            // Simple visual feedback
            const originalBorder = element.style.borderColor;
            element.style.borderColor = '#fff';
            element.style.background = 'rgba(0, 240, 255, 0.3)';
            
            setTimeout(() => {
                element.style.borderColor = '';
                element.style.background = '';
            }, 150);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            const originalText = btn.innerText;
            btn.innerText = "CALIBRATING...";
            
            // Simulate transition
            setTimeout(() => {
                document.body.style.transition = "filter 0.5s ease";
                document.body.style.filter = "brightness(20)";
                setTimeout(() => {
                    alert("Game Engine Initialized (Demo End)");
                    document.body.style.filter = "brightness(1)";
                    btn.innerText = originalText;
                }, 500);
            }, 800);
        }
    </script>
</body>
</html>
