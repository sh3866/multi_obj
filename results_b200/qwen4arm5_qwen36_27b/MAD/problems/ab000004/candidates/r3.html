<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Planet Defense</title>
<style>
    :root {
        /* Palette - Unified */
        --c-bg: #020204;
        --c-cyan: #00f0ff;
        --c-cyan-dim: rgba(0, 240, 255, 0.15);
        --c-cyan-glow: rgba(0, 240, 255, 0.5);
        --c-red: #ff3333;
        --c-yellow: #ffd700;
        --c-text-main: #e0e6ed;
        --c-text-dim: #8daab9;
        
        /* Glassmorphism */
        --glass-bg: rgba(10, 15, 25, 0.65);
        --glass-border: rgba(0, 240, 255, 0.2);
        --glass-blur: 12px;

        /* Typography */
        --font-ui: 'Courier New', 'Lucida Console', monospace; /* Fallback tech font */
        
        /* Spacing */
        --gap-rhythm: 48px;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--c-bg);
        color: var(--c-text-main);
        height: 100vh;
        overflow: hidden;
        font-family: var(--font-ui);
        display: flex;
        flex-direction: column;
    }

    /* --- BACKGROUND LAYERS --- */
    .bg-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0;
        pointer-events: none;
    }

    /* Scanlines Overlay */
    .scanlines {
        background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.15));
        background-size: 100% 4px;
        z-index: 10;
        opacity: 0.4;
    }

    /* --- PLANET FOCAL POINT --- */
    .planet-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -55%);
        width: 700px;
        height: 700px;
        z-index: 1;
        pointer-events: none;
        opacity: 0.85;
    }

    .planet-sphere {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        /* Deep Space Planet Gradient */
        background: radial-gradient(circle at 35% 35%, #1a2035 0%, #0d111a 60%, #000000 100%);
        box-shadow: 
            inset -40px -40px 80px rgba(0,0,0,0.9), 
            0 0 80px rgba(0, 240, 255, 0.15),
            0 0 2px var(--c-cyan); /* Rim light */
        position: relative;
        overflow: hidden;
        animation: breathe 8s ease-in-out infinite;
    }

    /* Surface Details (Atmosphere/Clouds) */
    .planet-sphere::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 200%; height: 100%;
        background: repeating-linear-gradient(
            90deg,
            transparent 0%,
            rgba(0, 240, 255, 0.03) 10%,
            transparent 20%
        );
        opacity: 0.5;
    }

    .atmosphere-glow {
        position: absolute;
        top: -10%; left: -10%; width: 120%; height: 120%;
        border-radius: 50%;
        box-shadow: inset 0 0 60px rgba(0, 240, 255, 0.2);
        z-index: -1;
    }

    @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
    }

    /* --- HUD HEADER --- */
    .hud-header {
        position: relative;
        z-index: 5;
        display: flex;
        justify-content: space-between;
        align-items: flex-end; /* Baseline align */
        padding: 40px 60px;
        height: 120px;
    }

    .hud-group {
        display: flex;
        gap: 40px;
    }

    .hud-item {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        position: relative;
        padding-left: 16px;
        /* Vertical Accent Line */
        border-left: 4px solid var(--c-cyan);
    }

    /* Specific HUD Colors */
    .hud-item.hp { border-color: var(--c-red); }
    .hud-item.credits { border-color: var(--c-yellow); }

    .hud-label {
        font-size: 0.75rem;
        letter-spacing: 2px;
        color: var(--c-cyan); /* Unified Cyan for labels */
        text-transform: uppercase;
        font-weight: bold;
        margin-bottom: 4px;
    }
    .hud-item.hp .hud-label { color: var(--c-red); }
    .hud-item.credits .hud-label { color: var(--c-yellow); }

    .hud-value {
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: 1px;
        color: #fff;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        line-height: 1;
    }
    
    .hud-item.hp .hud-value { text-shadow: 0 0 15px rgba(255, 51, 51, 0.4); }
    .hud-item.credits .hud-value { text-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }

    /* --- MAIN CONTENT --- */
    .main-stage {
        position: relative;
        z-index: 4;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 0 20px;
        width: 100%;
    }

    /* --- TITLE --- */
    .game-title {
        font-family: 'Arial Black', 'Impact', sans-serif; /* Heavy Sans */
        font-size: 5.5rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        line-height: 0.9;
        text-align: center;
        margin: 0 0 20px 0;
        color: #fff;
        text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        mix-blend-mode: screen; /* Blends with planet behind */
        pointer-events: none;
    }

    /* --- COMMAND CONSOLE (Glassmorphism) --- */
    .command-console {
        width: 100%;
        max-width: 860px;
        position: relative;
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        border: 1px solid var(--glass-border);
        border-top: 1px solid rgba(0, 240, 255, 0.4); /* Top highlight */
        border-bottom: 1px solid rgba(0, 240, 255, 0.1);
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        padding: 40px;
    }

    /* Decorative Corners */
    .command-console::before {
        content: '';
        position: absolute;
        top: -1px; left: -1px;
        width: 20px; height: 20px;
        border-top: 2px solid var(--c-cyan);
        border-left: 2px solid var(--c-cyan);
    }
    .command-console::after {
        content: '';
        position: absolute;
        bottom: -1px; right: -1px;
        width: 20px; height: 20px;
        border-bottom: 2px solid var(--c-cyan);
        border-right: 2px solid var(--c-cyan);
    }

    /* --- BRIEFING SECTION --- */
    .briefing-section {
        display: flex;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: var(--gap-rhythm);
        padding-bottom: 24px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .briefing-icon {
        color: var(--c-cyan);
        flex-shrink: 0;
        margin-top: 2px;
        animation: pulse 3s infinite;
    }

    .briefing-content h3 {
        margin: 0 0 8px 0;
        font-size: 0.9rem;
        color: var(--c-cyan);
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0.8;
    }

    .briefing-text {
        margin: 0;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--c-text-dim);
        font-weight: 400;
        /* Sentence case applied in HTML */
    }

    /* --- INTERACTION AREA --- */
    .interaction-area {
        display: flex;
        flex-direction: column;
        gap: var(--gap-rhythm); /* Consistent Rhythm */
    }

    /* Upgrade Cards - Tech Modules */
    .upgrades-row {
        display: flex;
        gap: 24px;
        width: 100%;
    }

    .upgrade-card {
        flex: 1;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--c-cyan-dim);
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        position: relative;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    /* Tech corner accents on cards */
    .upgrade-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 2px;
        background: linear-gradient(90deg, transparent, var(--c-cyan), transparent);
        opacity: 0.3;
        transition: opacity 0.3s;
    }

    .upgrade-card:hover {
        background: rgba(0, 240, 255, 0.05);
        border-color: var(--c-cyan);
        transform: translateY(-4px);
        box-shadow: 0 10px 20px rgba(0, 240, 255, 0.15), inset 0 0 10px rgba(0, 240, 255, 0.1);
    }
    
    .upgrade-card:hover::before { opacity: 1; }

    .upgrade-icon {
        width: 32px; height: 32px;
        margin-bottom: 16px;
        stroke: var(--c-cyan);
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: filter 0.3s;
    }

    .upgrade-card:hover .upgrade-icon {
        filter: drop-shadow(0 0 8px var(--c-cyan));
    }

    .upgrade-name {
        font-size: 0.9rem;
        font-weight: bold;
        color: #fff;
        text-transform: uppercase;
        margin-bottom: 8px;
        letter-spacing: 1.5px;
    }

    .upgrade-cost {
        font-size: 0.85rem;
        color: var(--c-yellow);
        font-weight: bold;
        text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
    }

    /* Start Button - Hardware Style */
    .btn-start {
        background: rgba(0, 0, 0, 0.6);
        color: var(--c-cyan);
        border: 1px solid var(--c-cyan);
        padding: 24px;
        font-family: var(--font-ui);
        font-size: 1.1rem;
        font-weight: bold;
        letter-spacing: 3px;
        text-transform: uppercase;
        cursor: pointer;
        width: 100%;
        position: relative;
        transition: all 0.3s ease;
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        text-shadow: 0 0 5px var(--c-cyan-dim);
    }

    .btn-start:hover {
        background: var(--c-cyan);
        color: #000;
        box-shadow: 0 0 30px var(--c-cyan-glow);
        text-shadow: none;
    }

    .btn-start:active {
        transform: scale(0.98);
    }

    @keyframes pulse {
        0% { opacity: 0.5; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.05); }
        100% { opacity: 0.5; transform: scale(0.95); }
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 768px) {
        .game-title { font-size: 3.5rem; }
        .hud-header { padding: 20px; height: auto; flex-direction: column; gap: 20px; align-items: flex-start; }
        .hud-group { gap: 20px; width: 100%; justify-content: space-between; }
        .planet-container { width: 400px; height: 400px; top: 30%; }
        .upgrades-row { flex-direction: column; gap: 16px; }
        .command-console { padding: 24px; }
        .briefing-section { flex-direction: column; gap: 10px; }
    }
</style>
</head>
<body>

    <!-- Backgrounds -->
    <div class="bg-layer" id="starfield"></div>
    <div class="bg-layer scanlines"></div>

    <!-- HUD Header -->
    <header class="hud-header">
        <div class="hud-group">
            <div class="hud-item">
                <span class="hud-label">Wave</span>
                <span class="hud-value">001</span>
            </div>
            <div class="hud-item hp">
                <span class="hud-label">Integrity</span>
                <span class="hud-value">100%</span>
            </div>
        </div>
        <div class="hud-group">
            <div class="hud-item credits">
                <span class="hud-label">Credits</span>
                <span class="hud-value">500</span>
            </div>
        </div>
    </header>

    <!-- Main Stage -->
    <main class="main-stage">
        
        <!-- Hero Element: Stylized Planet -->
        <div class="planet-container">
            <div class="atmosphere-glow"></div>
            <div class="planet-sphere"></div>
        </div>

        <h1 class="game-title">JS PLANET<br>DEFENSE</h1>

        <!-- Unified Command Console (Glassmorphism) -->
        <div class="command-console">
            
            <!-- Top: Briefing -->
            <div class="briefing-section">
                <div class="briefing-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </div>
                <div class="briefing-content">
                    <h3>Mission Briefing</h3>
                    <p class="briefing-text">
                        Sensors detect massive swarm approaching sector. Orbital cannons are online. 
                        Optimize turret systems before the first wave breaches the perimeter.
                    </p>
                </div>
            </div>

            <!-- Bottom: Interaction -->
            <div class="interaction-area">
                
                <div class="upgrades-row">
                    <div class="upgrade-card" onclick="simulateClick(this)">
                        <svg class="upgrade-icon" viewBox="0 0 24 24">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                        </svg>
                        <div class="upgrade-name">Damage</div>
                        <div class="upgrade-cost">150 CR</div>
                    </div>
                    <div class="upgrade-card" onclick="simulateClick(this)">
                        <svg class="upgrade-icon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <div class="upgrade-name">Fire Rate</div>
                        <div class="upgrade-cost">200 CR</div>
                    </div>
                    <div class="upgrade-card" onclick="simulateClick(this)">
                        <svg class="upgrade-icon" viewBox="0 0 24 24">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                        </svg>
                        <div class="upgrade-name">Speed</div>
                        <div class="upgrade-cost">100 CR</div>
                    </div>
                </div>

                <button class="btn-start" onclick="startGame()">INITIALIZE DEFENSE</button>
            </div>

        </div>
    </main>

    <script>
        // --- VISUAL EFFECTS SCRIPT ---

        // 1. Starfield Generation (Canvas)
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        const stars = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function createStars() {
            stars.length = 0;
            const count = Math.floor((width * height) / 3000); // Density
            for(let i=0; i<count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.05 + 0.01
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Slow drift
                star.y -= star.speed;
                // Twinkle
                star.alpha += (Math.random() - 0.5) * 0.02;
                if (star.alpha < 0.1) star.alpha = 0.1;
                if (star.alpha > 1) star.alpha = 1;

                // Wrap around
                if (star.y < 0) star.y = height;
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => { resize(); createStars(); });
        resize();
        createStars();
        animate();

        // 2. Interactivity
        function simulateClick(element) {
            // Simple visual feedback
            const originalBorder = element.style.borderColor;
            element.style.borderColor = '#fff';
            element.style.background = 'rgba(0, 240, 255, 0.2)';
            
            setTimeout(() => {
                element.style.borderColor = '';
                element.style.background = '';
            }, 150);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            const originalText = btn.innerText;
            btn.innerText = "CALIBRATING...";
            
            // Simulate transition
            setTimeout(() => {
                document.body.style.transition = "filter 0.5s ease";
                document.body.style.filter = "brightness(20)";
                setTimeout(() => {
                    alert("Game Engine Initialized (Demo End)");
                    document.body.style.filter = "brightness(1)";
                    btn.innerText = originalText;
                }, 500);
            }, 800);
        }
    </script>
</body>
</html>
