<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette: Deep Mystical Void */
        --bg-deep: #050508;
        --bg-void: #0a0a12;
        --accent-teal: #0f353a;
        --accent-violet: #2a1b3d;
        
        /* Metallic Gold Palette (Multi-stop for realism) */
        --gold-1: #f2d06b; /* Highlight */
        --gold-2: #d4af37; /* Mid */
        --gold-3: #aa7c11; /* Shadow */
        --gold-4: #5e4b15; /* Deep */
        
        /* Text */
        --text-primary: #e2e8f0;
        --text-gold: #f2d06b;
        --text-muted: #64748b;

        /* Fonts */
        --font-display: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
    }

    /* --- 1. Atmospheric Background --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    /* Grain Overlay for Texture */
    .grain-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        opacity: 0.07;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Ethereal Glow Layer */
    .atmosphere-glow {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        /* Deep Violet/Teal glow behind center */
        background: radial-gradient(circle at 50% 45%, rgba(42, 27, 61, 0.4) 0%, rgba(15, 53, 58, 0.2) 40%, transparent 70%);
        pointer-events: none;
    }

    /* Vignette */
    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, transparent 30%, var(--bg-deep) 100%);
        z-index: 2;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 900px;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 2rem 1rem 2rem;
    }

    /* --- 2. Unified Header --- */
    header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: flex-start; /* Align top */
        margin-bottom: 0; /* Tight spacing */
        /* NO DIVIDER */
    }

    .title-block {
        text-align: left;
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 3rem;
        line-height: 1;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        /* Rich Gold Gradient */
        background: linear-gradient(to bottom, var(--gold-1) 0%, var(--gold-2) 40%, var(--gold-3) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));
        margin-bottom: 0.2rem;
    }

    .game-subtitle {
        font-family: var(--font-ui);
        font-size: 0.75rem;
        color: var(--text-muted);
        letter-spacing: 0.4em;
        text-transform: uppercase;
        font-weight: 600;
        opacity: 0.8;
    }

    .currency-container {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(197, 155, 60, 0.2);
        padding: 6px 16px;
        border-radius: 4px; /* Slight chamfer feel */
        backdrop-filter: blur(5px);
        margin-top: 10px;
    }

    .gold-coin {
        width: 20px;
        height: 20px;
        background: radial-gradient(circle at 30% 30%, var(--gold-1), var(--gold-3));
        border-radius: 50%;
        border: 1px solid var(--gold-4);
        box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
    }

    .currency-amount {
        font-family: var(--font-display);
        font-size: 1.1rem;
        color: var(--gold-1);
        letter-spacing: 0.05em;
        font-weight: 600;
    }

    /* --- 3. Central Cluster (Hero) --- */
    .hero-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        position: relative;
        /* Pushing content up */
        padding-bottom: 2rem; 
    }

    /* Elevated Summon Portal */
    .summon-portal {
        position: relative;
        width: 280px;
        height: 280px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .summon-portal:hover {
        transform: scale(1.05);
    }

    /* Outer Etched Ring */
    .portal-ring-outer {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 1px solid rgba(197, 155, 60, 0.15);
        background: radial-gradient(circle, rgba(20,20,30,0.6) 0%, rgba(5,5,8,0.9) 100%);
        box-shadow: 0 0 60px rgba(15, 53, 58, 0.3), inset 0 0 40px rgba(0,0,0,0.8);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Rotating Magic Geometry */
    .rune-ring {
        position: absolute;
        width: 92%;
        height: 92%;
        border-radius: 50%;
        border: 2px dashed rgba(197, 155, 60, 0.2);
        animation: spin 30s linear infinite;
    }

    .rune-ring-reverse {
        position: absolute;
        width: 85%;
        height: 85%;
        border-radius: 50%;
        border-top: 2px solid var(--gold-2);
        border-bottom: 2px solid var(--gold-2);
        border-left: 1px solid transparent;
        border-right: 1px solid transparent;
        opacity: 0.6;
        animation: spin-reverse 20s linear infinite;
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
    }

    /* The Core Entity */
    .entity-core {
        width: 120px;
        height: 120px;
        z-index: 5;
        filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.5));
        animation: float 4s ease-in-out infinite;
    }

    /* Strong CTA */
    .summon-cta {
        position: absolute;
        bottom: 10px;
        font-family: var(--font-display);
        font-size: 1.4rem;
        letter-spacing: 0.2em;
        color: var(--gold-1);
        text-transform: uppercase;
        text-shadow: 0 2px 10px rgba(0,0,0,0.8), 0 0 20px rgba(212, 175, 55, 0.6);
        font-weight: 700;
        pointer-events: none;
        animation: pulse-glow 3s ease-in-out infinite;
    }

    /* --- 4. Substantial Menu Cards --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
        width: 100%;
        margin-bottom: 1rem;
    }

    .menu-card {
        position: relative;
        height: 90px; /* Substantial height */
        background: linear-gradient(160deg, rgba(30,30,40,0.9) 0%, rgba(15,15,20,0.95) 100%);
        border: 1px solid rgba(197, 155, 60, 0.2);
        border-top: 1px solid rgba(197, 155, 60, 0.5); /* Top highlight */
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        
        /* Chamfered Corners Effect */
        clip-path: polygon(
            15px 0, 100% 0, 
            100% calc(100% - 15px), calc(100% - 15px) 100%, 
            0 100%, 0 15px
        );
        
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .menu-card:hover {
        transform: translateY(-5px);
        background: linear-gradient(160deg, rgba(40,40,55,0.95) 0%, rgba(20,20,30,0.95) 100%);
        border-color: var(--gold-2);
        box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 15px rgba(212, 175, 55, 0.15);
    }

    /* Thematic Icons */
    .card-icon {
        width: 32px;
        height: 32px;
        margin-bottom: 8px;
        fill: var(--text-primary);
        transition: fill 0.3s;
    }

    .menu-card:hover .card-icon {
        fill: var(--gold-1);
        filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.6));
    }

    .card-label {
        font-family: var(--font-display); /* Elegant Serif */
        font-size: 1rem;
        color: var(--text-primary);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition: color 0.3s;
    }

    .menu-card:hover .card-label {
        color: var(--gold-1);
    }

    /* --- 5. Footer Anchoring --- */
    footer {
        width: 100%;
        text-align: center;
        padding-top: 0.5rem;
        font-size: 0.7rem;
        color: var(--text-muted);
        opacity: 0.5;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-family: var(--font-ui);
    }

    /* --- Animations --- */
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }
    @keyframes pulse-glow {
        0%, 100% { opacity: 0.8; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        50% { opacity: 1; text-shadow: 0 2px 15px rgba(212, 175, 55, 0.8); }
    }

    /* --- Responsive --- */
    @media (max-width: 600px) {
        .app-container { padding: 1.5rem 1rem 1rem 1rem; }
        .game-title { font-size: 2.2rem; }
        .summon-portal { width: 220px; height: 220px; }
        .entity-core { width: 90px; height: 90px; }
        .menu-grid { gap: 0.8rem; }
        .menu-card { height: 80px; }
        .card-label { font-size: 0.9rem; }
    }
</style>
</head>
<body>

    <!-- Background Layers -->
    <canvas id="canvas-bg"></canvas>
    <div class="grain-overlay"></div>
    <div class="atmosphere-glow"></div>
    <div class="vignette"></div>

    <div class="app-container">
        
        <!-- Header: Unified, no divider -->
        <header>
            <div class="title-block">
                <h1 class="game-title">Aetherbound</h1>
                <p class="game-subtitle">Spirit Summoning</p>
            </div>
            
            <div class="currency-container">
                <div class="gold-coin"></div>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Central Hero Area -->
        <div class="hero-area">
            <div class="summon-portal" onclick="interact('Summon')">
                <div class="portal-ring-outer">
                    <div class="rune-ring"></div>
                    <div class="rune-ring-reverse"></div>
                    
                    <!-- Complex Spectral Eye -->
                    <svg class="entity-core" viewBox="0 0 100 100">
                        <defs>
                            <radialGradient id="eyeCore" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#fff" stop-opacity="1" />
                                <stop offset="30%" stop-color="#f2d06b" stop-opacity="0.9" />
                                <stop offset="100%" stop-color="#2a1b3d" stop-opacity="0" />
                            </radialGradient>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        
                        <!-- Outer Eye Shape -->
                        <path d="M10 50 Q50 5 90 50 Q50 95 10 50 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" />
                        
                        <!-- Pupil -->
                        <circle cx="50" cy="50" r="15" fill="url(#eyeCore)" filter="url(#glow)">
                            <animate attributeName="r" values="14;16;14" dur="4s" repeatCount="indefinite" />
                        </circle>
                        
                        <!-- Iris details -->
                        <circle cx="50" cy="50" r="8" stroke="#fff" stroke-width="0.5" fill="none" opacity="0.5">
                             <animateTransform attributeName="transform" type="rotate" values="0 50 50;360 50 50" dur="10s" repeatCount="indefinite"/>
                        </circle>
                    </svg>
                </div>
                <span class="summon-cta">Summon</span>
            </div>
        </div>

        <!-- Substantial Menu Grid -->
        <div class="menu-grid">
            
            <!-- Roster -->
            <div class="menu-card" onclick="interact('Roster')">
                <!-- Scroll Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" />
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card" onclick="interact('Battle')">
                <!-- Sword Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M3,17.25V21H6.75L17.81,9.94L14.06,6.19L3,17.25M18.61,2.64L21.36,5.39C21.57,5.6 21.57,5.95 21.36,6.21L18.13,9.44L14.38,5.59L17.61,2.36C17.87,2.15 18.32,2.15 18.61,2.64Z" />
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card" onclick="interact('Grind')">
                <!-- Pickaxe/Work Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M15.5,12L13,14.5L14.5,16L17,13.5V12H15.5M7.5,12L10,9.5L8.5,8L6,10.5V12H7.5M12,2L4,10L6,22H18L20,10L12,2M17,18H7L6.2,14H17.8L17,18Z" />
                </svg>
                <span class="card-label">Grind</span>
            </div>

        </div>

        <footer>
            Aetherbound v2.1 &bull; Realm Connected
        </footer>
    </div>

<script>
    // --- Atmospheric Background System ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.15; // Very slow drift
            this.vy = (Math.random() - 0.5) * 0.15;
            this.size = Math.random() * 2;
            this.alpha = Math.random() * 0.3;
            this.fadeDir = Math.random() > 0.5 ? 0.001 : -0.001;
            
            // Colors: Gold, Teal, Violet
            const r = Math.random();
            if(r < 0.4) this.color = '212, 175, 55'; // Gold
            else if(r < 0.7) this.color = '100, 200, 200'; // Teal
            else this.color = '150, 100, 200'; // Violet
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha += this.fadeDir;

            if (this.alpha <= 0 || this.alpha >= 0.4) {
                this.fadeDir = -this.fadeDir;
            }

            if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // Density based on screen size
        const count = Math.floor((width * height) / 8000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        // Interaction feedback
        console.log(`Action: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
