<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #040406;
        --bg-charcoal: #101018;
        --bg-indigo: #18192b;
        
        /* Sophisticated Metallic Gold Palette */
        --gold-light: #fff4d4;
        --gold-highlight: #f6d884;
        --gold-mid: #c59b3c;
        --gold-dark: #7a5c18;
        
        /* Text Colors */
        --text-primary: #ffffff;
        --text-secondary: #e2e8f0;
        --text-muted: #94a3b8;

        /* Font Families - System Only */
        --font-serif: 'Cinzel', 'Trajan Pro', 'Times New Roman', 'Georgia', serif;
        --font-sans: 'Segoe UI', 'Roboto', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        
        --spacing-unit: 1rem;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-sans);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* Deep Atmospheric Background */
        background: radial-gradient(circle at 50% 30%, var(--bg-indigo) 0%, var(--bg-charcoal) 40%, var(--bg-deep) 100%);
    }

    /* --- Background Canvas --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: 0.6;
        pointer-events: none;
    }

    /* Vignette for depth */
    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, transparent 20%, rgba(4,4,6,0.9) 100%);
        z-index: 1;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1100px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 0 2rem;
    }

    /* --- 1. Restructured Header Rail --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center; /* Strict baseline alignment */
        padding: 2rem 0 1rem 0; /* Consistent top margin, reduced bottom gap */
        width: 100%;
        border-bottom: 1px solid rgba(197, 155, 60, 0.15); /* Subtle divider */
        margin-bottom: 0;
    }

    .title-block {
        display: flex;
        flex-direction: column;
    }

    /* Typography: Sophisticated Metallic Gradient */
    .game-title {
        font-family: var(--font-serif);
        font-size: 2.5rem;
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: 0.05em;
        /* Metallic Gradient */
        background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-highlight) 20%, var(--gold-mid) 50%, var(--gold-dark) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        /* Subtle Outer Glow */
        filter: drop-shadow(0 0 15px rgba(197, 155, 60, 0.25));
        text-transform: uppercase;
    }

    .game-subtitle {
        font-family: var(--font-sans); /* Sans-serif for secondary */
        font-size: 0.85rem;
        color: var(--text-muted);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin-top: 0.25rem;
        font-weight: 600;
    }

    /* Currency UI */
    .currency-container {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 20px;
        background: linear-gradient(90deg, rgba(10,10,15,0.0), rgba(20,20,30,0.6), rgba(10,10,15,0.0));
        border-top: 1px solid rgba(197, 155, 60, 0.3);
        border-bottom: 1px solid rgba(197, 155, 60, 0.3);
        backdrop-filter: blur(4px);
    }

    .gold-coin {
        width: 24px;
        height: 24px;
        background: radial-gradient(circle at 30% 30%, var(--gold-light), var(--gold-mid));
        border-radius: 50%;
        border: 2px solid var(--gold-dark);
        box-shadow: 0 0 10px rgba(197, 155, 60, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-serif);
        font-size: 0.9rem;
        color: var(--bg-deep);
        font-weight: bold;
    }

    .currency-amount {
        font-family: var(--font-serif);
        font-size: 1.2rem;
        color: var(--gold-highlight);
        letter-spacing: 0.05em;
        font-weight: 600;
    }

    /* --- 2. Central Cluster (Hero + Nav) --- */
    .central-cluster {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        gap: 2.5rem; /* Controlled gap between Summon and Nav */
        perspective: 1000px;
        margin-bottom: 2rem; /* Increased bottom padding */
    }

    /* Hero: Summoning Circle */
    .summon-circle-container {
        position: relative;
        width: 300px;
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .summon-circle-container:hover {
        transform: scale(1.02);
    }

    .summon-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(30,30,45,0.4) 0%, rgba(10,10,15,0.8) 80%);
        border: 1px solid rgba(197, 155, 60, 0.2);
        box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* Rotating Elements */
    .ring-inner {
        position: absolute;
        width: 80%;
        height: 80%;
        border: 1px dashed var(--gold-dark);
        border-radius: 50%;
        animation: spin 25s linear infinite;
        opacity: 0.5;
    }

    .ring-outer {
        position: absolute;
        width: 96%;
        height: 96%;
        border: 2px solid transparent;
        border-top-color: var(--gold-mid);
        border-bottom-color: var(--gold-mid);
        border-radius: 50%;
        animation: spin-reverse 20s linear infinite;
        opacity: 0.4;
    }

    /* Entity Core */
    .entity-core {
        width: 100px;
        height: 100px;
        filter: drop-shadow(0 0 20px rgba(246, 216, 132, 0.6));
        z-index: 5;
    }

    .summon-label {
        position: absolute;
        bottom: 35px;
        font-family: var(--font-serif); /* Serif for primary action */
        font-size: 1.3rem;
        letter-spacing: 0.4em;
        color: var(--gold-light);
        text-transform: uppercase;
        text-shadow: 0 0 15px rgba(197, 155, 60, 0.8);
        animation: pulse-text 4s ease-in-out infinite;
    }

    /* --- 3. Enhanced Navigation UI --- */
    .nav-row {
        display: flex;
        gap: 2rem;
        width: 100%;
        justify-content: center;
    }

    /* Distinct, High-Contrast Cards */
    .nav-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 140px;
        height: 100px;
        background: linear-gradient(180deg, rgba(30,30,40,0.8) 0%, rgba(15,15,20,0.95) 100%);
        border: 1px solid rgba(197, 155, 60, 0.3);
        border-top: 1px solid rgba(197, 155, 60, 0.6); /* Highlighted top edge */
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        text-decoration: none;
    }

    .nav-card:hover {
        transform: translateY(-6px);
        background: linear-gradient(180deg, rgba(40,40,55,0.9) 0%, rgba(25,25,35,0.95) 100%);
        border-color: var(--gold-highlight);
        box-shadow: 0 15px 30px rgba(0,0,0,0.6), 0 0 15px rgba(197, 155, 60, 0.15);
    }

    .nav-icon {
        width: 32px;
        height: 32px;
        fill: var(--text-secondary);
        margin-bottom: 10px;
        transition: fill 0.3s;
    }

    .nav-card:hover .nav-icon {
        fill: var(--gold-light);
        filter: drop-shadow(0 0 5px rgba(246, 216, 132, 0.4));
    }

    /* Typography: Geometric Sans-Serif for Menu */
    .nav-label {
        font-family: var(--font-sans);
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-secondary); /* Brighter text */
        transition: color 0.3s;
    }

    .nav-card:hover .nav-label {
        color: var(--gold-light);
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.7rem;
        opacity: 0.4;
        padding-bottom: 1.5rem;
        letter-spacing: 0.1em;
        font-family: var(--font-sans);
    }

    /* --- Animations --- */
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }

    @keyframes pulse-text {
        0%, 100% { opacity: 0.7; text-shadow: 0 0 10px rgba(197, 155, 60, 0.4); }
        50% { opacity: 1; text-shadow: 0 0 25px rgba(197, 155, 60, 0.9); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .app-container { padding: 0 1rem; }
        header { padding-top: 1.5rem; }
        .game-title { font-size: 1.8rem; }
        .nav-row { gap: 1rem; }
        .nav-card { width: 100px; height: 80px; }
        .nav-label { font-size: 0.75rem; }
        .summon-circle-container { width: 240px; height: 240px; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="app-container">
        
        <!-- Header Rail -->
        <header>
            <div class="title-block">
                <h1 class="game-title">Aetherbound</h1>
                <p class="game-subtitle">Spirit Summoning</p>
            </div>
            
            <div class="currency-container">
                <div class="gold-coin">A</div>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Central Cluster -->
        <div class="central-cluster">
            
            <!-- Hero: Summoning Circle -->
            <div class="summon-circle-container" onclick="interact('Summon')">
                <div class="summon-ring">
                    <div class="ring-outer"></div>
                    <div class="ring-inner"></div>
                    
                    <!-- Spectral Eye SVG -->
                    <svg class="entity-core" viewBox="0 0 100 100">
                        <defs>
                            <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                                <stop offset="0%" style="stop-color:#fff4d4;stop-opacity:1" />
                                <stop offset="40%" style="stop-color:#f6d884;stop-opacity:0.8" />
                                <stop offset="100%" style="stop-color:#18192b;stop-opacity:0" />
                            </radialGradient>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        <!-- Pupil -->
                        <circle cx="50" cy="50" r="12" fill="url(#eyeGrad)" filter="url(#glow)">
                            <animate attributeName="r" values="11;14;11" dur="4s" repeatCount="indefinite" />
                        </circle>
                        <!-- Eye Shape -->
                        <path d="M10 50 Q50 10 90 50 Q50 90 10 50 Z" fill="none" stroke="#c59b3c" stroke-width="2" opacity="0.8">
                             <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="4s" repeatCount="indefinite" transform-origin="50 50"/>
                        </path>
                        <!-- Particles -->
                        <circle cx="50" cy="30" r="1.5" fill="#fff" opacity="0.6">
                             <animate attributeName="cy" values="30;15;30" dur="3s" repeatCount="indefinite"/>
                        </circle>
                        <circle cx="50" cy="70" r="1.5" fill="#fff" opacity="0.6">
                             <animate attributeName="cy" values="70;85;70" dur="3s" repeatCount="indefinite"/>
                        </circle>
                    </svg>
                </div>
                <span class="summon-label">Summon</span>
            </div>

            <!-- Navigation Row -->
            <nav class="nav-row">
                
                <!-- Roster -->
                <div class="nav-card" onclick="interact('Roster')">
                    <svg class="nav-icon" viewBox="0 0 24 24">
                        <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z"/>
                    </svg>
                    <span class="nav-label">Roster</span>
                </div>

                <!-- Battle -->
                <div class="nav-card" onclick="interact('Battle')">
                    <svg class="nav-icon" viewBox="0 0 24 24">
                        <path d="M6.9 11.1l-1.4 1.4 1.4 1.4 1.4-1.4-1.4-1.4zm10.2 0l-1.4 1.4 1.4 1.4 1.4-1.4-1.4-1.4zM12 2L2 12l10 10 10-10L12 2zm0 3.4L18.6 12 12 18.6 5.4 12 12 5.4z"/>
                    </svg>
                    <span class="nav-label">Battle</span>
                </div>

                <!-- Grind -->
                <div class="nav-card" onclick="interact('Grind')">
                    <svg class="nav-icon" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                    </svg>
                    <span class="nav-label">Grind</span>
                </div>

            </nav>
        </div>

        <footer>
            Aetherbound v2.1 &bull; Realm Connected
        </footer>
    </div>

<script>
    // --- Background Particle System ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.vx = (Math.random() - 0.5) * 0.2;
            this.vy = -(Math.random() * 0.5 + 0.1); 
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.3;
            this.life = Math.random() * 0.5 + 0.5;
            // Mix of Gold and Silver
            this.color = Math.random() > 0.7 ? '197, 155, 60' : '226, 232, 240'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.0005;

            if (this.alpha <= 0 || this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 15000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        ctx.lineWidth = 0.5;
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
            
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 80) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(197, 155, 60, ${0.05 - dist/1500})`;
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        console.log(`Action triggered: ${action}`);
    }

    resize();
    initParticles();
    animate();

</script>
</body>
</html>
