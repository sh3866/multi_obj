<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #050508;
        --bg-charcoal: #12121a;
        --bg-indigo: #1a1b2e;
        --gold-primary: #d4af37;
        --gold-bright: #f9e689;
        --gold-dim: #7a631e;
        --silver-muted: #64748b;
        --silver-bright: #cbd5e1;
        --accent-cyan: #0ea5e9;
        --font-heading: 'Trajan Pro', 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--silver-bright);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* Deep Indigo/Charcoal Radial Gradient Background */
        background: radial-gradient(circle at center, var(--bg-indigo) 0%, var(--bg-charcoal) 50%, var(--bg-deep) 100%);
    }

    /* --- Background Atmosphere --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: 0.4;
        pointer-events: none;
    }

    /* Vignette to darken edges and focus center */
    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, transparent 30%, rgba(5,5,8,0.8) 100%);
        z-index: 1;
        pointer-events: none;
    }

    /* --- Main Container --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem;
        max-height: 900px;
    }

    /* --- Header & Currency --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start; /* Align to top */
        margin-bottom: 1rem;
        padding: 0 0.5rem;
    }

    .title-block {
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    /* Typography: Tighter tracking, cohesive look */
    .game-title {
        font-family: var(--font-heading);
        font-size: 3rem;
        text-transform: uppercase;
        letter-spacing: 0.05em; /* Tightened from 0.3em */
        line-height: 1;
        background: linear-gradient(to bottom, var(--gold-bright), var(--gold-primary), var(--gold-dim));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(212, 175, 55, 0.25));
        margin-bottom: 0.25rem;
        font-weight: 400;
    }

    /* Typography: Increased opacity, size, contrast */
    .game-subtitle {
        font-family: var(--font-heading);
        font-size: 1.1rem;
        color: var(--silver-bright);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        opacity: 0.9;
        font-weight: 600;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Diegetic Currency UI */
    .currency-container {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 16px;
        background: linear-gradient(90deg, rgba(10,10,15,0.0), rgba(10,10,15,0.6), rgba(10,10,15,0.0));
        border-top: 1px solid rgba(212, 175, 55, 0.3);
        border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        position: relative;
    }

    /* Floating Gold Coin */
    .gold-coin {
        width: 32px;
        height: 32px;
        background: radial-gradient(circle at 30% 30%, var(--gold-bright), var(--gold-primary), var(--gold-dim));
        border-radius: 50%;
        border: 2px solid var(--gold-dim);
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.4), inset 0 0 5px rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        animation: float-coin 4s ease-in-out infinite;
    }

    .gold-coin::after {
        content: '$';
        font-family: var(--font-heading);
        font-weight: bold;
        color: var(--bg-deep);
        font-size: 1.2rem;
        line-height: 1;
    }

    .currency-amount {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.4rem;
        color: var(--gold-bright);
        letter-spacing: 0.05em;
        text-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
    }

    /* --- Hero Section (Summoning Circle) --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        width: 100%;
        perspective: 1000px;
    }

    /* The Primary Action: Summoning Circle */
    .summon-circle-container {
        position: relative;
        width: 320px;
        height: 320px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        z-index: 20;
    }

    .summon-circle-container:hover {
        transform: scale(1.05);
    }

    .summon-circle-container:active {
        transform: scale(0.98);
    }

    /* Complex CSS/SVG Construct for the Circle */
    .summon-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 1px solid rgba(212, 175, 55, 0.1);
        box-shadow: 0 0 40px rgba(0,0,0,0.8);
        background: radial-gradient(circle, rgba(20,20,30,0.8) 0%, rgba(10,10,15,0.95) 80%);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: box-shadow 0.3s, border-color 0.3s;
    }

    .summon-circle-container:hover .summon-ring {
        border-color: rgba(212, 175, 55, 0.5);
        box-shadow: 0 0 60px rgba(212, 175, 55, 0.15);
    }

    /* Rotating Rings inside */
    .ring-inner {
        position: absolute;
        width: 85%;
        height: 85%;
        border: 1px dashed var(--gold-dim);
        border-radius: 50%;
        animation: spin 20s linear infinite;
    }

    .ring-outer {
        position: absolute;
        width: 95%;
        height: 95%;
        border: 2px solid transparent;
        border-top: 2px solid var(--gold-primary);
        border-bottom: 2px solid var(--gold-primary);
        border-radius: 50%;
        animation: spin-reverse 15s linear infinite;
        opacity: 0.6;
    }

    /* Central Entity (Spectral Eye/Orb) */
    .entity-core {
        width: 120px;
        height: 120px;
        position: relative;
        z-index: 5;
        filter: drop-shadow(0 0 15px var(--gold-primary));
    }

    /* Label inside the circle */
    .summon-label {
        position: absolute;
        bottom: 40px;
        font-family: var(--font-heading);
        font-size: 1.2rem;
        letter-spacing: 0.4em;
        color: var(--gold-bright);
        text-transform: uppercase;
        opacity: 0.8;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
        animation: pulse-text 3s ease-in-out infinite;
    }

    /* --- Secondary Menu (Bespoke Sigils) --- */
    .menu-area {
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 3rem; /* Generous padding */
        margin-top: 2rem;
        position: relative;
        z-index: 15;
    }

    /* Themed Element: Runestone/Sigil */
    .sigil-card {
        width: 100px;
        height: 120px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        /* Muted Silver/Grey, No Borders */
        color: var(--silver-muted);
    }

    /* The Runestone Shape */
    .sigil-shape {
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, rgba(30,30,40,0.6) 0%, rgba(15,15,20,0.8) 100%);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); /* Hexagon */
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255,255,255,0.05);
        box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        transition: all 0.3s;
        position: relative;
    }

    /* Subtle texture overlay */
    .sigil-shape::after {
        content: '';
        position: absolute;
        top:0; left:0; right:0; bottom:0;
        background: url("data:image/svg+xml,%3Csvg width='4' height='4' viewBox='0 0 4 4' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 3h1v1H1V3zm2-2h1v1H3V1z' fill='%23ffffff' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
    }

    .sigil-card:hover .sigil-shape {
        background: linear-gradient(180deg, rgba(40,40,55,0.9) 0%, rgba(20,20,30,0.95) 100%);
        transform: translateY(-5px);
        box-shadow: 0 15px 30px rgba(0,0,0,0.6), 0 0 15px rgba(100, 116, 139, 0.1);
        border-color: rgba(255,255,255,0.15);
    }

    .sigil-card:hover {
        color: var(--silver-bright);
    }

    /* Custom Drawn Icons */
    .sigil-icon {
        width: 36px;
        height: 36px;
        fill: currentColor;
        margin-bottom: 8px;
        transition: filter 0.3s;
        filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
    }

    .sigil-card:hover .sigil-icon {
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.2));
    }

    .sigil-label {
        font-family: var(--font-heading);
        font-size: 0.75rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-weight: 700;
        margin-top: 10px;
        opacity: 0.8;
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--silver-muted);
        font-size: 0.75rem;
        opacity: 0.3;
        margin-top: auto;
        padding-top: 2rem;
        letter-spacing: 0.1em;
    }

    /* --- Animations --- */
    @keyframes float-coin {
        0%, 100% { transform: translateY(0) rotateY(0deg); }
        50% { transform: translateY(-5px) rotateY(180deg); }
    }

    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }

    @keyframes pulse-text {
        0%, 100% { opacity: 0.6; text-shadow: 0 0 10px rgba(212, 175, 55, 0.4); }
        50% { opacity: 1; text-shadow: 0 0 20px rgba(212, 175, 55, 0.8); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 2.2rem; }
        .game-subtitle { font-size: 0.9rem; }
        .menu-area { gap: 1.5rem; flex-wrap: wrap; }
        .sigil-card { width: 80px; height: 100px; }
        .summon-circle-container { width: 260px; height: 260px; }
        .entity-core { width: 90px; height: 90px; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="title-block">
                <h1 class="game-title">Aetherbound</h1>
                <p class="game-subtitle">Spirit Summoning</p>
            </div>
            
            <!-- Diegetic Currency UI -->
            <div class="currency-container">
                <div class="gold-coin"></div>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero Section: Primary Action -->
        <section class="hero-section">
            <!-- The Summoning Circle (Button) -->
            <div class="summon-circle-container" onclick="interact('Summon')">
                <div class="summon-ring">
                    <div class="ring-outer"></div>
                    <div class="ring-inner"></div>
                    
                    <!-- Spectral Entity SVG -->
                    <svg class="entity-core" viewBox="0 0 100 100">
                        <defs>
                            <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                                <stop offset="0%" style="stop-color:#f9e689;stop-opacity:1" />
                                <stop offset="40%" style="stop-color:#d4af37;stop-opacity:0.8" />
                                <stop offset="100%" style="stop-color:#1a1b2e;stop-opacity:0" />
                            </radialGradient>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        <!-- Pupil/Iris -->
                        <circle cx="50" cy="50" r="15" fill="url(#eyeGrad)" filter="url(#glow)">
                            <animate attributeName="r" values="14;16;14" dur="3s" repeatCount="indefinite" />
                        </circle>
                        <!-- Mystical Eye Shape -->
                        <path d="M10 50 Q50 10 90 50 Q50 90 10 50 Z" fill="none" stroke="var(--gold-primary)" stroke-width="2" opacity="0.8">
                             <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="3s" repeatCount="indefinite" transform-origin="50 50"/>
                        </path>
                        <!-- Floating particles inside -->
                        <circle cx="50" cy="30" r="1.5" fill="#fff" opacity="0.6">
                             <animate attributeName="cy" values="30;20;30" dur="4s" repeatCount="indefinite"/>
                             <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
                        </circle>
                        <circle cx="50" cy="70" r="1.5" fill="#fff" opacity="0.6">
                             <animate attributeName="cy" values="70;80;70" dur="4s" repeatCount="indefinite"/>
                             <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
                        </circle>
                    </svg>
                </div>
                <span class="summon-label">Summon</span>
            </div>
        </section>

        <!-- Menu Area: Bespoke Sigils -->
        <nav class="menu-area">
            
            <!-- Roster: Runestone -->
            <div class="sigil-card" onclick="interact('Roster')">
                <div class="sigil-shape">
                    <!-- Custom Icon: Three Spirits/Stars -->
                    <svg class="sigil-icon" viewBox="0 0 24 24">
                        <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z" opacity="0.9"/>
                        <circle cx="12" cy="12" r="2" fill="currentColor"/>
                    </svg>
                </div>
                <span class="sigil-label">Roster</span>
            </div>

            <!-- Battle: Runestone -->
            <div class="sigil-card" onclick="interact('Battle')">
                <div class="sigil-shape">
                    <!-- Custom Icon: Crossed Swords -->
                    <svg class="sigil-icon" viewBox="0 0 24 24">
                        <path d="M6.9 11.1l-1.4 1.4 1.4 1.4 1.4-1.4-1.4-1.4zm10.2 0l-1.4 1.4 1.4 1.4 1.4-1.4-1.4-1.4zM12 2L2 12l10 10 10-10L12 2zm0 3.4L18.6 12 12 18.6 5.4 12 12 5.4z"/>
                    </svg>
                </div>
                <span class="sigil-label">Battle</span>
            </div>

            <!-- Grind: Runestone -->
            <div class="sigil-card" onclick="interact('Grind')">
                <div class="sigil-shape">
                    <!-- Custom Icon: Anvil/Forge -->
                    <svg class="sigil-icon" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                    </svg>
                </div>
                <span class="sigil-label">Grind</span>
            </div>

        </nav>

        <footer>
            Aetherbound v2.0 &bull; Realm Connected
        </footer>
    </div>

<script>
    // --- Background Particle System (Refined) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.vx = (Math.random() - 0.5) * 0.3;
            this.vy = -(Math.random() * 0.8 + 0.2); // Slower, more mystical rise
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.3;
            this.life = Math.random() * 0.5 + 0.5;
            // Mix of Gold and Silver particles
            this.color = Math.random() > 0.7 ? '212, 175, 55' : '203, 213, 225'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.001;

            if (this.alpha <= 0 || this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // Slightly higher density for atmosphere
        const count = Math.floor((width * height) / 12000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        // Draw subtle connecting lines
        ctx.lineWidth = 0.5;
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
            
            // Connect close particles (Goldish lines)
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 80) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(212, 175, 55, ${0.05 - dist/1500})`;
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        // Visual feedback logic could go here
        // For now, just a console log and simple animation trigger
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
