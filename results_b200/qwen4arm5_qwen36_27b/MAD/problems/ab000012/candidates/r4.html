<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette: Deep Mystical Void */
        --bg-deep: #050508;
        --bg-void: #0a0a12;
        
        /* Metallic Gold Palette (Rich Multi-stop) */
        --gold-1: #f2d06b; /* Highlight */
        --gold-2: #d4af37; /* Mid */
        --gold-3: #aa7c11; /* Shadow */
        --gold-4: #5e4b15; /* Deep */
        
        /* Mystical Accents */
        --accent-teal: #0f353a;
        --accent-violet: #2a1b3d;
        
        /* Text */
        --text-primary: #e2e8f0;
        --text-gold: #f2d06b;
        --text-muted: #64748b;

        /* Fonts */
        --font-display: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
    }

    /* --- 1. Atmospheric Background --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    /* Grain Overlay for Texture */
    .grain-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Vignette: Stronger edges */
    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, transparent 20%, var(--bg-deep) 100%);
        z-index: 2;
        pointer-events: none;
    }

    /* --- Main Layout: Central Vertical Axis --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 900px;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center; /* Perfect Centering */
        padding: 0 2rem 2rem 2rem; /* Bottom padding for cards */
    }

    /* --- 2. Header (Unified Spine) --- */
    header {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-top: 4vh; /* Tight spacing */
        margin-bottom: 2rem;
        position: relative;
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 3.5rem;
        line-height: 1;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        /* Rich Gold Gradient */
        background: linear-gradient(to bottom, var(--gold-1) 0%, var(--gold-2) 30%, var(--gold-3) 80%, var(--gold-4) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.9));
        margin-bottom: 0.5rem;
    }

    .game-subtitle {
        font-family: var(--font-ui);
        font-size: 0.85rem;
        color: var(--text-muted);
        letter-spacing: 0.5em;
        text-transform: uppercase;
        font-weight: 600;
        opacity: 1;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        margin-bottom: 1.5rem;
    }

    /* Currency: Rich & Valuable */
    .currency-container {
        display: flex;
        align-items: center;
        gap: 12px;
        background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(10,10,15,0.8) 20%, rgba(10,10,15,0.8) 80%, rgba(0,0,0,0) 100%);
        padding: 8px 32px;
        border-radius: 4px;
        position: relative;
    }

    /* Gold filigree borders on currency */
    .currency-container::before, .currency-container::after {
        content: '';
        position: absolute;
        top: 50%;
        height: 1px;
        width: 40px;
        background: linear-gradient(90deg, transparent, var(--gold-3), transparent);
    }
    .currency-container::before { left: -20px; }
    .currency-container::after { right: -20px; }

    .gold-coin {
        width: 24px;
        height: 24px;
        background: radial-gradient(circle at 30% 30%, var(--gold-1), var(--gold-3));
        border-radius: 50%;
        border: 2px solid var(--gold-1);
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
        position: relative;
    }
    .gold-coin::after {
        content: '';
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 16px; height: 16px;
        border-radius: 50%;
        border: 1px solid rgba(94, 75, 21, 0.5);
    }

    .currency-amount {
        font-family: var(--font-display);
        font-size: 1.25rem;
        /* Multi-stop metallic text */
        background: linear-gradient(to bottom, var(--gold-1), var(--gold-3));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 0.05em;
        font-weight: 700;
    }

    /* --- 3. Central Hero Area (Summoning Circle) --- */
    .hero-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        position: relative;
        min-height: 300px;
    }

    /* The Summoning Circle */
    .summon-portal {
        position: relative;
        width: 320px;
        height: 320px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .summon-portal:hover {
        transform: scale(1.03);
    }

    /* Base Stone/Ring */
    .portal-ring-outer {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid rgba(197, 155, 60, 0.2);
        background: radial-gradient(circle, rgba(20,20,30,0.4) 0%, rgba(5,5,8,0.9) 80%);
        box-shadow: 
            0 0 60px rgba(15, 53, 58, 0.3), 
            inset 0 0 50px rgba(0,0,0,0.9);
    }

    /* Geometric Rune Ring */
    .rune-ring {
        position: absolute;
        width: 90%;
        height: 90%;
        border-radius: 50%;
        border: 1px solid rgba(197, 155, 60, 0.3);
        border-top: 3px solid var(--gold-2);
        border-bottom: 3px solid var(--gold-2);
        animation: spin 24s linear infinite;
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
    }

    /* Inner Complex Geometry */
    .rune-ring-inner {
        position: absolute;
        width: 75%;
        height: 75%;
        border-radius: 50%;
        border: 1px dashed rgba(197, 155, 60, 0.2);
        animation: spin-reverse 40s linear infinite;
    }
    
    /* SVG Runes on the ring */
    .rune-svg-ring {
        position: absolute;
        width: 96%;
        height: 96%;
        animation: spin 60s linear infinite;
        opacity: 0.5;
    }

    /* The Core Entity (Ethereal Eye/Spirit) */
    .entity-core {
        width: 140px;
        height: 140px;
        z-index: 5;
        filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
        animation: float 6s ease-in-out infinite;
    }

    /* Summon Label: Separated below to avoid collision */
    .summon-cta {
        margin-top: 24px;
        font-family: var(--font-display);
        font-size: 1.5rem;
        letter-spacing: 0.3em;
        color: var(--gold-1);
        text-transform: uppercase;
        text-shadow: 
            0 2px 10px rgba(0,0,0,0.8), 
            0 0 15px rgba(212, 175, 55, 0.5);
        font-weight: 700;
        animation: pulse-glow 4s ease-in-out infinite;
        pointer-events: none;
    }

    /* --- 4. Menu Cards (Stone Tablets) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
        width: 100%;
        margin-bottom: 2rem; /* Spacing from footer */
        position: relative;
    }

    .menu-card {
        position: relative;
        height: 110px; /* Taller, tablet-like */
        background: linear-gradient(180deg, #1a1a24 0%, #0d0d14 100%);
        border: 1px solid rgba(197, 155, 60, 0.15);
        border-top: 2px solid var(--gold-3); /* Highlight top edge */
        border-bottom: 2px solid #000; /* Heavy bottom edge */
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        
        /* Stone Tablet Shape */
        clip-path: polygon(
            10px 0, 100% 0, 
            100% calc(100% - 10px), calc(100% - 10px) 100%, 
            10px 100%, 0 calc(100% - 10px)
        );
        
        box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    }

    .menu-card:hover {
        transform: translateY(-4px);
        background: linear-gradient(180deg, #252530 0%, #15151f 100%);
        border-color: var(--gold-2);
        border-top-color: var(--gold-1);
        box-shadow: 0 15px 30px rgba(0,0,0,0.7), 0 0 15px rgba(212, 175, 55, 0.1);
    }

    /* Mystical Icons (Glowing Runes) */
    .card-icon {
        width: 36px;
        height: 36px;
        margin-bottom: 12px;
        stroke: var(--gold-2);
        stroke-width: 1.5;
        fill: none;
        filter: drop-shadow(0 0 2px rgba(212, 175, 55, 0.3));
        transition: all 0.3s;
    }

    .menu-card:hover .card-icon {
        stroke: var(--gold-1);
        filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.8));
    }

    .card-label {
        font-family: var(--font-display);
        font-size: 1.1rem;
        color: var(--text-primary);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        transition: color 0.3s;
        font-weight: 600;
    }

    .menu-card:hover .card-label {
        color: var(--gold-1);
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }

    /* --- 5. Footer --- */
    footer {
        width: 100%;
        text-align: center;
        font-size: 0.65rem;
        color: var(--text-muted);
        opacity: 0.4;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-family: var(--font-ui);
        margin-top: auto; /* Push to bottom if flex allows */
    }

    /* --- Animations --- */
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }
    @keyframes pulse-glow {
        0%, 100% { opacity: 0.8; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        50% { opacity: 1; text-shadow: 0 2px 20px rgba(212, 175, 55, 0.8); }
    }

    /* --- Responsive --- */
    @media (max-width: 600px) {
        .app-container { padding: 0 1rem 1.5rem 1rem; }
        .game-title { font-size: 2.5rem; }
        .summon-portal { width: 260px; height: 260px; }
        .entity-core { width: 110px; height: 110px; }
        .menu-grid { gap: 1rem; }
        .menu-card { height: 90px; }
        .card-label { font-size: 0.95rem; }
    }
</style>
</head>
<body>

    <!-- Background Layers -->
    <canvas id="canvas-bg"></canvas>
    <div class="grain-overlay"></div>
    <div class="vignette"></div>

    <div class="app-container">
        
        <!-- Header: Unified Vertical Spine -->
        <header>
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>
            
            <!-- Currency Indicator -->
            <div class="currency-container">
                <div class="gold-coin"></div>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Central Hero Area -->
        <div class="hero-area">
            <div class="summon-portal" onclick="interact('Summon')">
                <div class="portal-ring-outer">
                    <div class="rune-ring"></div>
                    <div class="rune-ring-inner"></div>
                    
                    <!-- Rotating Rune SVG Ring -->
                    <svg class="rune-svg-ring" viewBox="0 0 100 100">
                        <defs>
                            <g id="rune-mark">
                                <path d="M50 0 L52 4 L50 8 L48 4 Z" fill="#d4af37" />
                            </g>
                        </defs>
                        <!-- Place runes every 30 degrees -->
                        <use href="#rune-mark" transform="rotate(0 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(30 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(60 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(90 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(120 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(150 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(180 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(210 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(240 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(270 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(300 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(330 50 50) translate(0, -46)" />
                    </svg>

                    <!-- Complex Spectral Eye -->
                    <svg class="entity-core" viewBox="0 0 100 100">
                        <defs>
                            <radialGradient id="eyeCore" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#fff" stop-opacity="1" />
                                <stop offset="20%" stop-color="#f2d06b" stop-opacity="0.9" />
                                <stop offset="60%" stop-color="#aa7c11" stop-opacity="0.4" />
                                <stop offset="100%" stop-color="#050508" stop-opacity="0" />
                            </radialGradient>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        
                        <!-- Outer Eye Shape -->
                        <path d="M5 50 Q50 5 95 50 Q50 95 5 50 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4" />
                        
                        <!-- Pupil -->
                        <circle cx="50" cy="50" r="18" fill="url(#eyeCore)" filter="url(#glow)">
                            <animate attributeName="r" values="16;19;16" dur="4s" repeatCount="indefinite" />
                        </circle>
                        
                        <!-- Iris details -->
                        <circle cx="50" cy="50" r="10" stroke="#fff" stroke-width="0.5" fill="none" opacity="0.6">
                             <animateTransform attributeName="transform" type="rotate" values="0 50 50;360 50 50" dur="12s" repeatCount="indefinite"/>
                        </circle>
                    </svg>
                </div>
            </div>
            <!-- Summon Label Separated Below -->
            <span class="summon-cta">Summon</span>
        </div>

        <!-- Substantial Menu Grid -->
        <div class="menu-grid">
            
            <!-- Roster: Crest/Shield -->
            <div class="menu-card" onclick="interact('Roster')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L4 5V11.09C4 16.14 7.41 20.86 12 22C16.59 20.86 20 16.14 20 11.09V5L12 2ZM12 18C10 17.29 8.29 15.58 7.58 13.58L12 11L16.42 13.58C15.71 15.58 14 17.29 12 18ZM12 14.5L8 12L12 9.5L16 12L12 14.5Z" />
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle: Sword Hilt -->
            <div class="menu-card" onclick="interact('Battle')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.5 17.5L3 6V3H6L17.5 14.5L14.5 17.5M19 19L15 21L13 19L15 17L19 19M6 18L8 20L10 18L8 16L6 18" />
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind: Hammer/Anvil -->
            <div class="menu-card" onclick="interact('Grind')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M21 12L12 3L10 5L15 10L10 15L8 17L6 15L12 9L7 4L3 8L4 9L9 14L4 19L6 21L10 17L15 22L21 16L19 14L14 19L12 17L17 12L21 12Z" />
                </svg>
                <span class="card-label">Grind</span>
            </div>

        </div>

        <footer>
            Aetherbound v2.1 &bull; Realm Connected
        </footer>
    </div>

<script>
    // --- Atmospheric Background System ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.2; 
            this.vy = (Math.random() - 0.5) * 0.2;
            this.size = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.3;
            this.fadeDir = Math.random() > 0.5 ? 0.002 : -0.002;
            
            // Colors: Gold, Teal, Violet
            const r = Math.random();
            if(r < 0.5) this.color = '212, 175, 55'; // Gold (Dust)
            else if(r < 0.8) this.color = '100, 200, 200'; // Teal (Spirit)
            else this.color = '150, 100, 200'; // Violet (Magic)
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha += this.fadeDir;

            if (this.alpha <= 0.05 || this.alpha >= 0.4) {
                this.fadeDir = -this.fadeDir;
            }

            if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // Density based on screen size
        const count = Math.floor((width * height) / 10000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        // Interaction feedback
        console.log(`Action: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
