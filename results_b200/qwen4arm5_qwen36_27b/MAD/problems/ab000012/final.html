<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette: Deep Void & Ethereal Magic */
        --bg-deep: #030305;
        --bg-void: #0a0a12;
        
        /* Metallic Gold Palette (Multi-stop Bronze to Gold) */
        --gold-highlight: #fbf5b7;
        --gold-light: #f2d06b;
        --gold-mid: #d4af37;
        --gold-shadow: #8a6e2f;
        --gold-dark: #4a3b14;

        /* Mystical Accents */
        --accent-teal: #00f0ff;
        --accent-teal-dim: #005f63;
        --accent-violet: #b026ff;
        
        /* Text */
        --text-primary: #e2e8f0;
        --text-gold: #f2d06b;
        --text-muted: #64748b;

        /* Fonts */
        --font-display: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
    }

    /* --- 1. Atmospheric Background --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    .grain-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        opacity: 0.07;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, transparent 10%, var(--bg-deep) 90%);
        z-index: 2;
        pointer-events: none;
    }

    /* --- Main Layout: Central Vertical Axis --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* Tighter top padding, breathing room at bottom */
        padding: 2rem 2rem 4rem 2rem; 
    }

    /* --- 2. Header (Unified Spine) --- */
    header {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem; /* Tightened gap to hero */
        position: relative;
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 3rem;
        line-height: 1;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        /* Unified Gold Gradient */
        background: linear-gradient(to bottom, var(--gold-highlight) 0%, var(--gold-light) 20%, var(--gold-mid) 60%, var(--gold-shadow) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 10px rgba(212, 175, 55, 0.3));
        margin-bottom: 0.4rem;
    }

    .game-subtitle {
        font-family: var(--font-ui);
        font-size: 0.75rem;
        color: var(--text-muted);
        letter-spacing: 0.6em;
        text-transform: uppercase;
        font-weight: 600;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        margin-bottom: 1.2rem;
    }

    /* Currency: Refined */
    .currency-container {
        display: flex;
        align-items: center;
        gap: 10px;
        background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(10,10,15,0.6) 20%, rgba(10,10,15,0.6) 80%, rgba(0,0,0,0) 100%);
        padding: 6px 24px;
        border-radius: 2px;
        position: relative;
    }

    .gold-coin {
        width: 20px;
        height: 20px;
        background: radial-gradient(circle at 30% 30%, var(--gold-light), var(--gold-shadow));
        border-radius: 50%;
        border: 1px solid var(--gold-mid);
        box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
        position: relative;
    }
    .gold-coin::after {
        content: '';
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 12px; height: 12px;
        border-radius: 50%;
        border: 1px solid rgba(74, 59, 20, 0.6);
    }

    .currency-amount {
        font-family: var(--font-display);
        font-size: 1.1rem;
        background: linear-gradient(to bottom, var(--gold-light), var(--gold-mid));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 0.05em;
        font-weight: 700;
    }

    /* --- 3. Central Hero Area (The Portal) --- */
    .hero-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        position: relative;
        min-height: 350px;
        margin-bottom: 3rem; /* Increased whitespace from secondary cards */
    }

    /* The Summoning Circle (Primary CTA) */
    .summon-portal {
        position: relative;
        width: 340px;
        height: 340px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        border-radius: 50%;
    }

    .summon-portal:hover {
        transform: scale(1.02);
    }
    
    .summon-portal:active {
        transform: scale(0.98);
    }

    /* Base Stone/Ring - Textured */
    .portal-ring-outer {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        /* Stone Texture Gradient */
        background: radial-gradient(circle at 30% 30%, #2a2a35 0%, #0f0f14 70%, #050508 100%);
        border: 4px solid var(--gold-shadow);
        /* Ethereal Teal Glow */
        box-shadow: 
            0 0 0 2px var(--bg-deep),
            0 0 30px rgba(0, 240, 255, 0.15), 
            0 0 60px rgba(0, 240, 255, 0.05),
            inset 0 0 40px rgba(0,0,0,0.9);
    }

    /* Geometric Rune Ring */
    .rune-ring {
        position: absolute;
        width: 85%;
        height: 85%;
        border-radius: 50%;
        border: 1px solid rgba(212, 175, 55, 0.2);
        border-top: 3px solid var(--gold-mid);
        border-bottom: 3px solid var(--gold-mid);
        animation: spin 20s linear infinite;
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
    }

    .rune-ring-inner {
        position: absolute;
        width: 70%;
        height: 70%;
        border-radius: 50%;
        border: 1px dashed rgba(212, 175, 55, 0.15);
        animation: spin-reverse 30s linear infinite;
    }
    
    .rune-svg-ring {
        position: absolute;
        width: 98%;
        height: 98%;
        animation: spin 60s linear infinite;
        opacity: 0.6;
    }

    /* The Core Entity */
    .entity-core {
        width: 160px;
        height: 160px;
        z-index: 5;
        filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.4));
        animation: float 5s ease-in-out infinite;
    }

    /* Integrated CTA Label */
    .summon-cta {
        position: absolute;
        bottom: 25px;
        font-family: var(--font-display);
        font-size: 1.4rem;
        letter-spacing: 0.5em; /* Wide tracking */
        color: var(--gold-light);
        text-transform: uppercase;
        text-shadow: 
            0 2px 10px rgba(0,0,0,1), 
            0 0 10px rgba(212, 175, 55, 0.6);
        font-weight: 700;
        pointer-events: none;
        animation: pulse-glow 3s ease-in-out infinite;
    }

    /* --- 4. Menu Cards (Artifacts) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2rem;
        width: 100%;
        max-width: 800px;
        margin-bottom: auto; /* Push footer down */
    }

    .menu-card {
        position: relative;
        height: 140px; /* Artifact proportions */
        background: linear-gradient(180deg, #1e202b 0%, #0d0e14 100%);
        /* Unified Rich Gold Border */
        border: 1px solid var(--gold-shadow);
        /* Inner Glow */
        box-shadow: 
            inset 0 0 20px rgba(0,0,0,0.8),
            0 0 5px rgba(0,0,0,0.5);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        
        /* Artifact Shape (Rounded corners with bevel feel) */
        border-radius: 4px;
        overflow: hidden;
    }

    /* Decorative corner accents on cards */
    .menu-card::before {
        content: '';
        position: absolute;
        top: 4px; left: 4px; right: 4px; bottom: 4px;
        border: 1px solid rgba(212, 175, 55, 0.1);
        pointer-events: none;
        border-radius: 2px;
    }

    .menu-card:hover {
        transform: translateY(-5px);
        background: linear-gradient(180deg, #252836 0%, #14151e 100%);
        border-color: var(--gold-mid);
        box-shadow: 
            inset 0 0 25px rgba(212, 175, 55, 0.1), /* Inner Gold Glow */
            0 10px 20px rgba(0,0,0,0.5);
    }

    .card-icon {
        width: 40px;
        height: 40px;
        margin-bottom: 16px;
        stroke: var(--gold-mid);
        stroke-width: 1.5;
        fill: none;
        filter: drop-shadow(0 0 2px rgba(212, 175, 55, 0.2));
        transition: all 0.3s;
    }

    .menu-card:hover .card-icon {
        stroke: var(--gold-light);
        filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.6));
        transform: scale(1.1);
    }

    .card-label {
        font-family: var(--font-display);
        font-size: 1rem;
        color: var(--text-primary);
        letter-spacing: 0.2em; /* Wide tracking */
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        transition: color 0.3s;
        font-weight: 600;
    }

    .menu-card:hover .card-label {
        color: var(--gold-light);
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }

    /* --- 5. Footer --- */
    footer {
        width: 100%;
        text-align: center;
        font-size: 0.7rem;
        color: var(--text-muted);
        opacity: 0.5;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-family: var(--font-ui);
        padding-top: 2rem; /* Breathing room */
    }

    /* --- Animations --- */
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }
    @keyframes pulse-glow {
        0%, 100% { opacity: 0.7; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        50% { opacity: 1; text-shadow: 0 2px 15px rgba(212, 175, 55, 0.8); }
    }

    /* --- Responsive --- */
    @media (max-width: 700px) {
        .app-container { padding: 1.5rem 1rem 2rem 1rem; }
        .game-title { font-size: 2.2rem; }
        .summon-portal { width: 280px; height: 280px; }
        .entity-core { width: 130px; height: 130px; }
        .summon-cta { font-size: 1.1rem; bottom: 20px; }
        .menu-grid { gap: 1rem; }
        .menu-card { height: 110px; }
        .card-label { font-size: 0.85rem; }
    }
</style>
</head>
<body>

    <!-- Background Layers -->
    <canvas id="canvas-bg"></canvas>
    <div class="grain-overlay"></div>
    <div class="vignette"></div>

    <div class="app-container">
        
        <!-- Header: Unified Vertical Spine -->
        <header>
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>
            
            <!-- Currency Indicator -->
            <div class="currency-container">
                <div class="gold-coin"></div>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Central Hero Area (Primary CTA) -->
        <div class="hero-area">
            <div class="summon-portal" onclick="interact('Summon')">
                <div class="portal-ring-outer">
                    <div class="rune-ring"></div>
                    <div class="rune-ring-inner"></div>
                    
                    <!-- Rotating Rune SVG Ring -->
                    <svg class="rune-svg-ring" viewBox="0 0 100 100">
                        <defs>
                            <g id="rune-mark">
                                <path d="M50 0 L53 4 L50 8 L47 4 Z" fill="#d4af37" />
                            </g>
                        </defs>
                        <!-- Place runes every 30 degrees -->
                        <use href="#rune-mark" transform="rotate(0 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(30 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(60 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(90 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(120 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(150 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(180 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(210 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(240 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(270 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(300 50 50) translate(0, -46)" />
                        <use href="#rune-mark" transform="rotate(330 50 50) translate(0, -46)" />
                    </svg>

                    <!-- Complex Spectral Eye (Teal/Gold mix) -->
                    <svg class="entity-core" viewBox="0 0 100 100">
                        <defs>
                            <radialGradient id="eyeCore" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#fff" stop-opacity="1" />
                                <stop offset="20%" stop-color="#00f0ff" stop-opacity="0.8" />
                                <stop offset="60%" stop-color="#d4af37" stop-opacity="0.4" />
                                <stop offset="100%" stop-color="#030305" stop-opacity="0" />
                            </radialGradient>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        
                        <!-- Outer Eye Shape -->
                        <path d="M5 50 Q50 5 95 50 Q50 95 5 50 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4" />
                        
                        <!-- Pupil -->
                        <circle cx="50" cy="50" r="18" fill="url(#eyeCore)" filter="url(#glow)">
                            <animate attributeName="r" values="16;20;16" dur="4s" repeatCount="indefinite" />
                        </circle>
                        
                        <!-- Iris details -->
                        <circle cx="50" cy="50" r="10" stroke="#fff" stroke-width="0.5" fill="none" opacity="0.6">
                             <animateTransform attributeName="transform" type="rotate" values="0 50 50;360 50 50" dur="12s" repeatCount="indefinite"/>
                        </circle>
                    </svg>
                </div>
                <!-- Integrated Label -->
                <span class="summon-cta">Summon</span>
            </div>
        </div>

        <!-- Secondary Actions (Artifacts) -->
        <div class="menu-grid">
            
            <!-- Roster: Crest -->
            <div class="menu-card" onclick="interact('Roster')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L4 5V11.09C4 16.14 7.41 20.86 12 22C16.59 20.86 20 16.14 20 11.09V5L12 2ZM12 18C10 17.29 8.29 15.58 7.58 13.58L12 11L16.42 13.58C15.71 15.58 14 17.29 12 18ZM12 14.5L8 12L12 9.5L16 12L12 14.5Z" />
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle: Sword -->
            <div class="menu-card" onclick="interact('Battle')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.5 17.5L3 6V3H6L17.5 14.5L14.5 17.5M19 19L15 21L13 19L15 17L19 19M6 18L8 20L10 18L8 16L6 18" />
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind: Anvil -->
            <div class="menu-card" onclick="interact('Grind')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M21 12L12 3L10 5L15 10L10 15L8 17L6 15L12 9L7 4L3 8L4 9L9 14L4 19L6 21L10 17L15 22L21 16L19 14L14 19L12 17L17 12L21 12Z" />
                </svg>
                <span class="card-label">Grind</span>
            </div>

        </div>

        <footer>
            Aetherbound v2.1 &bull; Realm Connected
        </footer>
    </div>

<script>
    // --- Atmospheric Background System ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.15; 
            this.vy = (Math.random() - 0.5) * 0.15;
            this.size = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.3;
            this.fadeDir = Math.random() > 0.5 ? 0.002 : -0.002;
            
            // Colors: Gold, Teal, Violet
            const r = Math.random();
            if(r < 0.4) this.color = '212, 175, 55'; // Gold (Dust)
            else if(r < 0.7) this.color = '0, 240, 255'; // Teal (Spirit)
            else this.color = '176, 38, 255'; // Violet (Magic)
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha += this.fadeDir;

            if (this.alpha <= 0.05 || this.alpha >= 0.4) {
                this.fadeDir = -this.fadeDir;
            }

            if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // Density based on screen size
        const count = Math.floor((width * height) / 12000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        // Interaction feedback
        console.log(`Action: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
