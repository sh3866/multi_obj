<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway Sphere: Bioluminescence</title>
<style>
  :root {
    --bg-color: #050508;
    --panel-bg: rgba(12, 12, 18, 0.65);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text-main: #eef0f5;
    --text-muted: #7a8095;
    --accent-cyan: #00f0ff;
    --accent-magenta: #ff00ea;
    --accent-glow: rgba(0, 240, 255, 0.3);
    --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "JetBrains Mono", "Fira Code", "Consolas", "Monaco", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
  }

  /* --- Layout Split --- */
  
  /* Left: Main Viewport */
  #viewport {
    position: relative;
    flex: 1;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #0e101a 0%, #020204 100%);
    cursor: grab;
  }
  #viewport:active { cursor: grabbing; }

  /* Right: Sidebar Panel */
  #sidebar {
    width: 360px;
    height: 100%;
    background: var(--panel-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-left: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    padding: 32px;
    z-index: 20;
    box-shadow: -10px 0 40px rgba(0,0,0,0.5);
    overflow-y: auto;
  }

  /* Scrollbar styling for sidebar */
  #sidebar::-webkit-scrollbar { width: 4px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  /* --- Typography & UI Elements --- */

  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #fff, #a5a5a5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  h2 {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 16px; /* 24px scale */
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .subtitle {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 32px;
    line-height: 1.4;
  }

  /* Panel Sections */
  .panel-section {
    margin-bottom: 32px; /* 24px scale */
  }

  /* Stats Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .stat-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }

  .stat-value {
    font-family: var(--font-mono);
    font-size: 1.25rem;
    font-weight: 500;
    color: var(--text-main);
  }

  /* Buttons */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  
  button {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    padding: 12px 0;
    border-radius: 6px;
    font-family: var(--font-ui);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.25);
    transform: translateY(-1px);
  }

  button:active {
    transform: translateY(1px);
    background: rgba(0,0,0,0.2);
  }

  button.primary {
    background: rgba(0, 240, 255, 0.1);
    border-color: rgba(0, 240, 255, 0.3);
    color: var(--accent-cyan);
  }
  
  button.primary:hover {
    background: rgba(0, 240, 255, 0.2);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
  }

  /* Sliders */
  .slider-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  
  .slider-label-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--text-main);
    cursor: pointer;
    border: 2px solid #000;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.2);
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
    background: var(--accent-cyan);
  }

  /* Footer / Hints */
  .interaction-hints {
    position: absolute;
    bottom: 24px;
    left: 24px;
    display: flex;
    gap: 24px;
    pointer-events: none;
  }
  
  .hint-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.6);
    font-size: 0.75rem;
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  
  .key-icon {
    width: 20px;
    height: 20px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6rem;
  }

  /* Canvas */
  #sphereCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }

</style>
</head>
<body>

  <!-- Left: 3D Viewport -->
  <div id="viewport">
    <canvas id="sphereCanvas"></canvas>
    
    <!-- Overlay Hints -->
    <div class="interaction-hints">
      <div class="hint-item"><div class="key-icon">L</div> Drag Rotate</div>
      <div class="hint-item"><div class="key-icon">SC</div> Zoom</div>
    </div>
  </div>

  <!-- Right: Control Sidebar -->
  <div id="sidebar">
    <h1>Conway Sphere</h1>
    <div class="subtitle">Bioluminescent cellular automata simulation on a spherical manifold.</div>

    <!-- Telemetry -->
    <div class="panel-section">
      <h2>Live Telemetry</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-label">Generation</span>
          <span class="stat-value" id="gen-count">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Population</span>
          <span class="stat-value" id="pop-count">0</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="panel-section">
      <h2>Simulation Control</h2>
      <div class="btn-group">
        <button id="btn-pause" class="primary">Pause</button>
        <button id="btn-reset">Reset</button>
      </div>
      <button id="btn-step" style="width: 100%; margin-top: 12px;">Step Once</button>
    </div>

    <!-- Settings -->
    <div class="panel-section">
      <h2>Parameters</h2>
      
      <div class="slider-container">
        <div class="slider-label-row">
          <span>Simulation Speed</span>
          <span id="speed-val">20 FPS</span>
        </div>
        <input type="range" id="speed-slider" min="1" max="60" value="20">
      </div>

      <div class="slider-container" style="margin-top: 24px;">
        <div class="slider-label-row">
          <span>Cell Density</span>
          <span>High</span>
        </div>
        <input type="range" disabled style="opacity: 0.5; cursor: default;" value="80">
      </div>
    </div>

    <div style="margin-top: auto; padding-top: 24px; font-size: 0.65rem; color: rgba(255,255,255,0.2);">
      System Status: <span style="color: var(--accent-cyan)">ONLINE</span><br>
      Rendering: WebGL2 / Canvas 2D
    </div>
  </div>

<script>
/**
 * Spherical Conway's Game of Life
 * 
 * Visual Design Update:
 * - Split layout (Sidebar + Viewport)
 * - Bioluminescent palette (Cyan/Magenta/Purple)
 * - Volumetric depth fog (Dead cells aren't pure black)
 * - Glassmorphism UI
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 3200, 
  sphereRadius: 280,
  cellBaseSize: 2.5,
  rotationSpeed: 0.0015,
  colors: {
    // Palette Logic:
    // Newborn (Age 0): Neon Cyan (185)
    // Young (Age 5):  Electric Purple (270)
    // Old (Age 20+): Deep Magenta (310)
    // Dead: Dark Navy/Charcoal
  }
};

// --- State ---
let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 20,
  lastFrameTime: 0,
  rotation: { x: 0.3, y: 0 },
  zoom: 1.0,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 
const viewport = document.getElementById('viewport');

let width, height;

function resize() {
  width = viewport.clientWidth;
  height = viewport.clientHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  distSq: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return dx*dx + dy*dy + dz*dz;
  }
};

// Fibonacci Lattice for even distribution
function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2;
    const radiusAtY = Math.sqrt(1 - y * y);
    const theta = goldenAngle * i;
    
    points.push({
      x: Math.cos(theta) * radiusAtY * radius,
      y: y * radius,
      z: Math.sin(theta) * radiusAtY * radius,
      idx: i
    });
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Neighbor Calculation
  const avgDist = (4 * Math.PI * Math.pow(CONFIG.sphereRadius, 2)) / CONFIG.cellCount;
  const threshold = Math.sqrt(avgDist) * 1.35; 
  const thresholdSq = threshold * threshold;

  state.cells = points.map((p, i) => {
    const neighbors = [];
    // Optimization: Only check subset if count is huge, but for 3k O(N^2) is manageable initially
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      if (Vec3.distSq(p, points[j]) < thresholdSq) {
        neighbors.push(j);
      }
    }
    
    return {
      pos: p,
      neighbors: neighbors,
      alive: Math.random() > 0.5, // 50% initial population
      bornGen: 0,
      age: 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  const nextStates = state.cells.map(cell => {
    const neighborCount = cell.neighbors.reduce((acc, idx) => acc + (state.cells[idx].alive ? 1 : 0), 0);
    
    let nextAlive = false;
    let isBorn = false;

    if (cell.alive) {
      if (neighborCount === 2 || neighborCount === 3) nextAlive = true;
    } else {
      if (neighborCount === 3) {
        nextAlive = true;
        isBorn = true;
      }
    }
    
    return {
      alive: nextAlive,
      bornGen: isBorn ? state.generation : cell.bornGen,
      age: nextAlive ? (cell.alive ? cell.age + 1 : 0) : 0
    };
  });

  state.cells.forEach((cell, i) => {
    cell.alive = nextStates[i].alive;
    cell.bornGen = nextStates[i].bornGen;
    cell.age = nextStates[i].age;
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 800 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // Clear background
  ctx.fillStyle = '#050508'; // Match CSS var
  ctx.fillRect(0, 0, width, height);

  const projectedCells = [];
  
  for(let i=0; i<state.cells.length; i++) {
    const cell = state.cells[i];
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    projectedCells.push({ cell, proj });
  }
  
  // Sort back to front (Painter's Algorithm)
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // Render Loop
  for (const { cell, proj } of projectedCells) {
    // Cull far back cells slightly to maintain sphere illusion
    if (proj.z > CONFIG.sphereRadius * 0.9) continue;

    const baseSize = CONFIG.cellBaseSize;
    const size = baseSize * proj.scale;

    if (cell.alive) {
      // --- COLOR MAPPING: Bioluminescent Age ---
      // 0 (New) -> Cyan (185)
      // 10 (Mid) -> Purple (270)
      // 30+ (Old) -> Magenta (310)
      
      const ageFactor = Math.min(cell.age, 30) / 30; 
      
      // Hue interpolation
      let hue;
      if (ageFactor < 0.5) {
        // Cyan to Purple
        hue = 185 + (ageFactor * 2 * 85); 
      } else {
        // Purple to Magenta
        hue = 270 + ((ageFactor - 0.5) * 2 * 40);
      }
      
      // --- DEPTH LIGHTING ---
      // Normalize z: -R (front) to R (back).
      // Front is bright, back is dim.
      const depthLight = 1.0 - ((proj.z + CONFIG.sphereRadius) / (2 * CONFIG.sphereRadius));
      // Exponential curve for sharper falloff
      const lightIntensity = Math.pow(depthLight, 0.5);
      
      const lightness = 50 + (30 * lightIntensity); // 50% to 80%
      const alpha = 0.4 + (0.6 * lightIntensity);

      ctx.fillStyle = `hsla(${hue}, 100%, ${lightness}%, ${alpha})`;
      
      // GLOW EFFECT (Only for front-facing cells)
      if (proj.z < 0 && size > 1.2) {
        ctx.shadowBlur = 10 * proj.scale * lightIntensity;
        ctx.shadowColor = `hsla(${hue}, 100%, 60%, 0.8)`;
      } else {
        ctx.shadowBlur = 0;
      }

      ctx.beginPath();
      ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
      ctx.fill();

    } else {
      // --- DEAD CELLS: Volumetric Shading ---
      // Dead cells are NOT black. They are dark navy/charcoal to show the sphere's volume.
      
      // Depth fog calculation
      // Front dead cells: Dark Navy (#1a1a2e)
      // Back dead cells: Invisible/Background color
      
      const depthFade = 1.0 - ((proj.z + CONFIG.sphereRadius) / (2 * CONFIG.sphereRadius));
      
      // Only draw if somewhat visible
      if (depthFade > 0.1) {
        // Mix between background (#050508) and highlight (#1a1a2e) based on depth
        // Simple lerp approach visually:
        const alpha = depthFade * 0.6; 
        ctx.fillStyle = `rgba(30, 40, 65, ${alpha})`; // Dark Blue/Charcoal
        ctx.shadowBlur = 0;
        
        ctx.beginPath();
        ctx.arc(proj.x, proj.y, size * 0.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  
  ctx.shadowBlur = 0;
  
  // --- ATMOSPHERE RIM GLOW ---
  // Adds a "faint background rim light" to separate sphere from void
  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;
  
  // Inner glow
  const grad = ctx.createRadialGradient(cx, cy, r * 0.6, cx, cy, r * 1.2);
  grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  grad.addColorStop(0.8, 'rgba(0, 240, 255, 0.03)'); // Very faint cyan tint
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.3, 0, Math.PI * 2);
  ctx.fill();
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    // Auto rotation
    if (!state.isDragging) {
      state.rotation.y += CONFIG.rotationSpeed;
    }
    
    // Update Logic based on speed slider
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation;
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop;
}

// Controls
const btnPause = document.getElementById('btn-pause');
const btnReset = document.getElementById('btn-reset');
const btnStep = document.getElementById('btn-step');

btnPause.addEventListener('click', () => {
  state.isRunning = !state.isRunning;
  btnPause.innerText = state.isRunning ? "Pause" : "Resume";
  if (state.isRunning) {
    btnPause.classList.add('primary');
  } else {
    btnPause.classList.remove('primary');
  }
});

btnReset.addEventListener('click', () => {
  initGame();
});

btnStep.addEventListener('click', () => {
  state.isRunning = false;
  btnPause.innerText = "Resume";
  btnPause.classList.remove('primary');
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
  document.getElementById('speed-val').innerText = state.speed + " FPS";
});

// Mouse Drag Rotation
viewport.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.6, Math.min(2.5, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
