<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway Sphere: Bioluminescence</title>
<style>
  :root {
    /* CRITIQUE 1: Unified Deep Blue-Black Background */
    --bg-color: #050810; 
    --panel-border: rgba(255, 255, 255, 0.08);
    
    /* Typography Colors */
    --text-main: #f1f5f9;
    --text-muted: #64748b; 
    --text-bright: #ffffff;
    
    /* Accents (Bioluminescence Palette) */
    --accent-cyan: #06b6d4;
    --accent-magenta: #d946ef;
    --accent-gold: #f59e0b;
    
    /* Fonts */
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Menlo", "Monaco", "Consolas", "Liberation Mono", "Courier New", monospace;
    
    /* CRITIQUE 3: 8px/16px Grid System */
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 32px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
  }

  /* --- Layout Split --- */
  
  /* Left: Main Viewport (Dominant 75%) */
  #viewport {
    position: relative;
    flex: 1; 
    height: 100%;
    overflow: hidden;
    /* Subtle radial gradient on canvas background for depth */
    background: radial-gradient(circle at 50% 50%, #0a0f1d 0%, var(--bg-color) 100%);
    cursor: grab;
  }
  #viewport:active { cursor: grabbing; }

  /* Right: Sidebar Panel (Fixed Width) */
  #sidebar {
    width: 400px;
    height: 100%;
    background: var(--bg-color); /* CRITIQUE 1: Unified background */
    border-left: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    padding: var(--space-xl);
    z-index: 20;
    overflow-y: auto;
  }

  /* Scrollbar styling */
  #sidebar::-webkit-scrollbar { width: 4px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  /* --- Typography & UI Elements --- */

  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: var(--space-xs);
    color: var(--text-bright);
  }

  .subtitle {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: var(--space-xl);
    line-height: 1.5;
  }

  /* CRITIQUE 4: Enhanced Section Headers */
  .panel-section {
    margin-bottom: var(--space-xl);
  }

  h2 {
    font-size: 0.65rem;
    font-weight: 800;
    color: var(--text-bright);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: var(--space-md);
    opacity: 0.9;
  }

  /* CRITIQUE 3: Floating Telemetry Metrics */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: var(--space-md);
    /* Removed heavy card backgrounds */
  }

  .stat-box {
    display: flex;
    flex-direction: column;
    justify-content: center;
    /* No background/border here to let them float */
  }

  .stat-label {
    font-size: 0.6rem;
    color: var(--accent-cyan); /* Bright subtle label */
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: var(--space-xs);
    font-weight: 600;
  }

  .stat-value {
    font-family: var(--font-mono);
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1;
    /* High contrast */
    text-shadow: 0 0 10px rgba(255,255,255,0.1);
  }

  /* CRITIQUE 3: Button Group Layout */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-sm);
    margin-bottom: var(--space-sm);
  }
  
  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-main);
    padding: var(--space-sm) 0;
    border-radius: 4px;
    font-family: var(--font-ui);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  button:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.2);
    transform: translateY(-1px);
  }

  button:active {
    transform: translateY(1px);
  }

  button.primary {
    background: rgba(6, 182, 212, 0.1); 
    border-color: rgba(6, 182, 212, 0.3);
    color: var(--accent-cyan);
  }
  
  button.primary:hover {
    background: rgba(6, 182, 212, 0.2);
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.1);
  }

  /* CRITIQUE 3: Step Once as Tertiary */
  .btn-secondary {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: var(--space-xs) 0;
    font-size: 0.7rem;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: flex-start; /* Left align */
    gap: 8px;
    border-radius: 0;
  }
  
  .btn-secondary:hover {
    background: transparent;
    color: var(--text-bright);
    transform: none;
    padding-left: 4px; /* Subtle nudge */
  }

  /* CRITIQUE 4: Slider Polish */
  .slider-container {
    display: flex;
    flex-direction: column;
    gap: var(--space-md); /* Increased vertical padding */
  }
  
  .slider-label-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: var(--font-mono);
    letter-spacing: 0.05em;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,0.15);
    border-radius: 1px;
    outline: none;
  }
  
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text-bright);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  /* CRITIQUE 4: Footer Anchoring */
  .footer-status {
    margin-top: auto; 
    padding-top: var(--space-xl); /* 32px gap from last control */
    font-size: 0.65rem; 
    color: rgba(255,255,255,0.3); 
    font-family: var(--font-mono);
    border-top: 1px solid rgba(255,255,255,0.05);
    padding-top: 24px;
  }

  /* CRITIQUE 4: Interaction Hints */
  .interaction-hints {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 24px;
    pointer-events: none;
    z-index: 10;
    background: rgba(5, 8, 16, 0.6); /* Semi-transparent backing for legibility */
    padding: 8px 16px;
    border-radius: 20px;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.05);
  }
  
  .hint-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.7);
    font-size: 0.65rem;
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  
  .key-icon {
    width: 18px;
    height: 18px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.55rem;
    background: rgba(0,0,0,0.4);
    box-shadow: 0 2px 0 rgba(0,0,0,0.5);
  }

  /* Canvas */
  #sphereCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }

</style>
</head>
<body>

  <!-- Left: 3D Viewport -->
  <div id="viewport">
    <canvas id="sphereCanvas"></canvas>
    
    <!-- Overlay Hints -->
    <div class="interaction-hints">
      <div class="hint-item"><div class="key-icon">LMB</div> Rotate</div>
      <div class="hint-item"><div class="key-icon">SCRL</div> Zoom</div>
    </div>
  </div>

  <!-- Right: Control Sidebar -->
  <div id="sidebar">
    <h1>Conway Sphere</h1>
    <div class="subtitle">Cellular automata mapped to a spherical manifold.</div>

    <!-- Telemetry (Floating, no cards) -->
    <div class="panel-section">
      <h2>Live Telemetry</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-label">Gen</span>
          <span class="stat-value" id="gen-count">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Pop</span>
          <span class="stat-value" id="pop-count">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">FPS</span>
          <span class="stat-value" id="fps-count">0</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="panel-section">
      <h2>Simulation Control</h2>
      <div class="btn-group">
        <button id="btn-pause" class="primary">Pause</button>
        <button id="btn-reset">Reset</button>
      </div>
      <!-- Step Once integrated into group -->
      <button id="btn-step" class="btn-secondary">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        Step Once
      </button>
    </div>

    <!-- Settings -->
    <div class="panel-section">
      <h2>Parameters</h2>
      
      <div class="slider-container">
        <div class="slider-label-row">
          <span>Simulation Speed</span>
          <span id="speed-val">30 FPS</span>
        </div>
        <input type="range" id="speed-slider" min="1" max="60" value="30">
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-status">
      System Status: <span style="color: var(--accent-cyan)">ONLINE</span><br>
      Render: WebGL / Canvas 2D
    </div>
  </div>

<script>
/**
 * Spherical Conway's Game of Life - Bioluminescent Revision
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 4500, // High density for "swarm" look
  sphereRadius: 300,
  cellBaseSize: 1.8,
  rotationSpeed: 0.0005,
  wireframeOpacity: 0.04
};

// --- State ---
let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 30,
  lastFrameTime: 0,
  rotation: { x: 0.1, y: 0 },
  zoom: 0.85, // Zoomed out slightly to show full sphere
  isDragging: false,
  lastMouse: { x: 0, y: 0 },
  fps: 0,
  frameCount: 0,
  lastFpsTime: 0
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 
const viewport = document.getElementById('viewport');

let width, height;

function resize() {
  width = viewport.clientWidth;
  height = viewport.clientHeight;
  // CRITIQUE 1: Scale sphere to occupy 70-80% of vertical viewport
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  distSq: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return dx*dx + dy*dy + dz*dz;
  }
};

// Fibonacci Lattice
function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2;
    const radiusAtY = Math.sqrt(1 - y * y);
    const theta = goldenAngle * i;
    
    points.push({
      x: Math.cos(theta) * radiusAtY * radius,
      y: y * radius,
      z: Math.sin(theta) * radiusAtY * radius,
      idx: i
    });
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Neighbor Calculation (Spatial Hashing or Brute Force for N<5000)
  // Optimization: For 4500 points, O(N^2) is heavy. 
  // We use a distance threshold based on average density.
  const avgDist = (4 * Math.PI * Math.pow(CONFIG.sphereRadius, 2)) / CONFIG.cellCount;
  const threshold = Math.sqrt(avgDist) * 1.3; 
  const thresholdSq = threshold * threshold;

  state.cells = points.map((p, i) => {
    const neighbors = [];
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      if (Vec3.distSq(p, points[j]) < thresholdSq) {
        neighbors.push(j);
      }
    }
    
    return {
      pos: p,
      neighbors: neighbors,
      alive: Math.random() > 0.5, // 50% density start
      bornGen: 0,
      age: 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  // Parallel update
  const nextStates = state.cells.map(cell => {
    const neighborCount = cell.neighbors.reduce((acc, idx) => acc + (state.cells[idx].alive ? 1 : 0), 0);
    
    let nextAlive = false;
    let isBorn = false;

    if (cell.alive) {
      if (neighborCount === 2 || neighborCount === 3) nextAlive = true;
    } else {
      if (neighborCount === 3) {
        nextAlive = true;
        isBorn = true;
      }
    }
    
    return {
      alive: nextAlive,
      bornGen: isBorn ? state.generation : cell.bornGen,
      age: nextAlive ? (cell.alive ? cell.age + 1 : 0) : 0
    };
  });

  state.cells.forEach((cell, i) => {
    cell.alive = nextStates[i].alive;
    cell.bornGen = nextStates[i].bornGen;
    cell.age = nextStates[i].age;
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 1000 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

// CRITIQUE 2: Translucent wireframe/mesh
function drawWireframe(cx, cy, scale) {
  const r = CONFIG.sphereRadius * scale;
  
  ctx.lineWidth = 1;
  ctx.strokeStyle = `rgba(6, 182, 212, ${CONFIG.wireframeOpacity})`; // Faint Cyan
  
  // Draw a subtle "Meridian" and "Equator" to give structure
  ctx.beginPath();
  // Equator
  ctx.ellipse(cx, cy, r, r * 0.15, 0, 0, Math.PI * 2);
  ctx.stroke();
  
  // Meridian
  ctx.beginPath();
  ctx.ellipse(cx, cy, r * 0.15, r, 0, 0, Math.PI * 2);
  ctx.stroke();

  // Outer rim glow
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(6, 182, 212, 0.05)`;
  ctx.stroke();
}

function draw() {
  // Clear background (CSS handles the deep blue-black, but we need to clear canvas)
  ctx.clearRect(0, 0, width, height);

  const projectedCells = [];
  
  for(let i=0; i<state.cells.length; i++) {
    const cell = state.cells[i];
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    projectedCells.push({ cell, proj });
  }
  
  // Sort back to front
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // --- Draw Wireframe/Structure ---
  drawWireframe(width/2, height/2, state.zoom);

  // Render Loop
  for (const { cell, proj } of projectedCells) {
    // Cull far back cells
    if (proj.z > CONFIG.sphereRadius * 1.05) continue;

    const baseSize = CONFIG.cellBaseSize;
    const size = baseSize * proj.scale;

    if (cell.alive) {
      // --- CRITIQUE 2: Bioluminescent Color Palette ---
      // Map Age to Hue:
      // 0 (New): Cyan/Blue (190)
      // 10 (Mid): Purple (270)
      // 30+ (Old): Magenta/Orange (320 -> 30)
      
      const ageFactor = Math.min(cell.age, 40) / 40; 
      // Shift from Cyan (190) through Purple to warm Magenta (330)
      let hue = 190 + (ageFactor * 140); 
      
      // --- DEPTH LIGHTING (Fresnel-ish effect) ---
      // Normalize z: -R (front) to R (back).
      // Cells at the "edge" of the sphere (z approx 0 relative to camera) should be brightest?
      // Or standard 3D lighting: Front (z < 0) is bright.
      
      const depthLight = 1.0 - ((proj.z + CONFIG.sphereRadius) / (2 * CONFIG.sphereRadius));
      const lightIntensity = Math.pow(depthLight, 0.6); // Softer falloff
      
      const lightness = 50 + (40 * lightIntensity); // 50% to 90%
      const alpha = 0.4 + (0.6 * lightIntensity);

      ctx.fillStyle = `hsla(${hue}, 90%, ${lightness}%, ${alpha})`;
      
      // --- CRITIQUE 2: Bloom/Glow ---
      // Only apply heavy shadow blur to front-facing, large cells for performance
      if (proj.z < 0 && size > 1.2) {
        ctx.shadowBlur = 10 * proj.scale * lightIntensity;
        ctx.shadowColor = `hsla(${hue}, 90%, 60%, 0.8)`;
      } else {
        ctx.shadowBlur = 0;
      }

      ctx.beginPath();
      ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
      ctx.fill();

    } else {
      // --- DEAD CELLS: Volume definition ---
      // Faint dots to show the sphere shape even where empty
      
      const depthFade = 1.0 - ((proj.z + CONFIG.sphereRadius) / (2 * CONFIG.sphereRadius));
      
      // Only draw if visible
      if (depthFade > 0.1) {
        const alpha = depthFade * 0.08; // Very faint
        ctx.fillStyle = `rgba(148, 163, 184, ${alpha})`; // Slate
        ctx.shadowBlur = 0;
        
        ctx.beginPath();
        ctx.arc(proj.x, proj.y, size * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  
  ctx.shadowBlur = 0; // Reset
}

// --- Main Loop ---

function loop(timestamp) {
  // FPS Calculation
  state.frameCount++;
  if (timestamp - state.lastFpsTime >= 1000) {
    state.fps = state.frameCount;
    state.frameCount = 0;
    state.lastFpsTime = timestamp;
    document.getElementById('fps-count').innerText = state.fps;
  }

  if (state.isRunning) {
    // Auto rotation
    if (!state.isDragging) {
      state.rotation.y += CONFIG.rotationSpeed;
    }
    
    // Update Logic based on speed slider
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation;
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop;
}

// Controls
const btnPause = document.getElementById('btn-pause');
const btnReset = document.getElementById('btn-reset');
const btnStep = document.getElementById('btn-step');

btnPause.addEventListener('click', () => {
  state.isRunning = !state.isRunning;
  btnPause.innerText = state.isRunning ? "Pause" : "Resume";
  if (state.isRunning) {
    btnPause.classList.add('primary');
  } else {
    btnPause.classList.remove('primary');
  }
});

btnReset.addEventListener('click', () => {
  initGame();
});

btnStep.addEventListener('click', () => {
  state.isRunning = false;
  btnPause.innerText = "Resume";
  btnPause.classList.remove('primary');
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
  document.getElementById('speed-val').innerText = state.speed + " FPS";
});

// Mouse Drag Rotation
viewport.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.4, Math.min(2.5, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
