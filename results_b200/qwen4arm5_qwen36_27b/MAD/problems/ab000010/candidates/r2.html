<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway Sphere: Bioluminescence</title>
<style>
  :root {
    --bg-color: #020204;
    --panel-bg: rgba(18, 18, 24, 0.45);
    --panel-border: rgba(255, 255, 255, 0.1);
    --text-main: #f0f0f5;
    --text-muted: #8a8a9b;
    --accent: #00e5ff; /* Cyan for active/new */
    --accent-glow: rgba(0, 229, 255, 0.4);
    --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", "Fira Code", "Consolas", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Subtle deep space radial gradient */
    background-image: radial-gradient(circle at 50% 50%, #0a0b10 0%, #000000 100%);
  }

  /* Canvas Container */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Layer */
  #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
  }

  /* Title: Minimal, Top Left */
  .title-container {
    position: absolute;
    top: 2rem;
    left: 2rem;
    pointer-events: auto;
  }

  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-main);
    text-transform: uppercase;
    margin-bottom: 0.25rem;
    opacity: 0.9;
  }

  .subtitle {
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    font-weight: 400;
  }

  /* Control Panel: Bottom Right, Glassmorphism */
  .panel {
    position: absolute;
    bottom: 2rem;
    right: 2rem;
    pointer-events: auto;
    width: 280px;
    background: var(--panel-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    gap: 1.5rem; /* 24px vertical rhythm */
  }

  .panel-section {
    display: flex;
    flex-direction: column;
  }

  .panel-label {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 0.75rem;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding-bottom: 0.4rem;
  }

  /* Stats */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.5rem;
  }
  .stat-name {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 400;
  }
  .stat-value {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-main);
    letter-spacing: -0.02em;
  }

  /* Sliders */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
    margin-top: 0.5rem;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--text-main);
    cursor: pointer;
    border: 2px solid var(--bg-color);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.2);
    transition: transform 0.1s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.1);
    background: var(--accent);
  }

  /* Buttons */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 0.75rem; /* 12px gap */
  }
  
  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    padding: 0.75rem 0;
    border-radius: 8px;
    font-family: var(--font-ui);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.3);
  }

  button:active {
    transform: scale(0.98);
    background: rgba(255,255,255,0.02);
  }

  /* Active State */
  button.active-state {
    background: rgba(0, 229, 255, 0.1);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
  }
  button.active-state:hover {
    background: rgba(0, 229, 255, 0.15);
  }

  /* Interaction Hint */
  .interaction-hint {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    opacity: 0.5;
    pointer-events: none;
    display: flex;
    gap: 1.5rem;
    align-items: center;
  }
  
  .hint-divider {
    width: 4px;
    height: 4px;
    background: var(--text-muted);
    border-radius: 50%;
    opacity: 0.5;
  }

</style>
</head>
<body>

  <!-- Canvas -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Title -->
    <div class="title-container">
      <h1>Conway Sphere</h1>
      <div class="subtitle">Bioluminescent Simulation</div>
    </div>

    <!-- Interaction Hint -->
    <div class="interaction-hint">
      <span>Drag to Rotate</span>
      <div class="hint-divider"></div>
      <span>Scroll to Zoom</span>
    </div>

    <!-- Control Panel -->
    <div class="panel">
      
      <!-- Telemetry Section -->
      <div class="panel-section">
        <div class="panel-label">Telemetry</div>
        <div class="stat-row">
          <span class="stat-name">Generation</span>
          <span class="stat-value" id="gen-count">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-name">Population</span>
          <span class="stat-value" id="pop-count">0</span>
        </div>
      </div>

      <!-- Controls Section -->
      <div class="panel-section">
        <div class="panel-label">Controls</div>
        <div class="btn-group">
          <button id="btn-pause" class="active-state">Pause</button>
          <button id="btn-reset">Reset</button>
        </div>
        <button id="btn-step" style="width: 100%;">Step Once</button>
      </div>

      <!-- Settings Section -->
      <div class="panel-section">
        <div class="panel-label">Simulation Speed</div>
        <input type="range" id="speed-slider" min="1" max="60" value="20">
      </div>
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life - Bioluminescent Edition
 * Design Focus: Volumetric rendering, Age-based color mapping, Depth fog
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 3500, // Slightly lower count for larger, cleaner dots
  sphereRadius: 260,
  cellBaseSize: 2.8,
  rotationSpeed: 0.0008,
  colors: {
    bg: '#020204',
    // Palette: 
    // Dead/Old: Deep Indigo (260)
    // Mid: Purple (280)
    // Active/New: Cyan (190) -> White (0)
  }
};

// --- State ---
let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 20,
  lastFrameTime: 0,
  rotation: { x: 0.2, y: 0 },
  zoom: 1.1,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  distSq: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return dx*dx + dy*dy + dz*dz;
  }
};

// Fibonacci Lattice for even distribution
function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2;
    const radiusAtY = Math.sqrt(1 - y * y);
    const theta = goldenAngle * i;
    
    points.push({
      x: Math.cos(theta) * radiusAtY * radius,
      y: y * radius,
      z: Math.sin(theta) * radiusAtY * radius,
      idx: i
    });
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Neighbor Calculation
  // Threshold based on density
  const avgDist = (4 * Math.PI * Math.pow(CONFIG.sphereRadius, 2)) / CONFIG.cellCount;
  const threshold = Math.sqrt(avgDist) * 1.35; 
  const thresholdSq = threshold * threshold;

  state.cells = points.map((p, i) => {
    const neighbors = [];
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      if (Vec3.distSq(p, points[j]) < thresholdSq) {
        neighbors.push(j);
      }
    }
    
    return {
      pos: p,
      neighbors: neighbors,
      alive: Math.random() > 0.6, // 40% initial population
      bornGen: 0,
      age: 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  const nextStates = state.cells.map(cell => {
    const neighborCount = cell.neighbors.reduce((acc, idx) => acc + (state.cells[idx].alive ? 1 : 0), 0);
    
    let nextAlive = false;
    let isBorn = false;

    if (cell.alive) {
      if (neighborCount === 2 || neighborCount === 3) nextAlive = true;
    } else {
      if (neighborCount === 3) {
        nextAlive = true;
        isBorn = true;
      }
    }
    
    return {
      alive: nextAlive,
      bornGen: isBorn ? state.generation : cell.bornGen,
      age: nextAlive ? (cell.alive ? cell.age + 1 : 0) : 0
    };
  });

  state.cells.forEach((cell, i) => {
    cell.alive = nextStates[i].alive;
    cell.bornGen = nextStates[i].bornGen;
    cell.age = nextStates[i].age;
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 900 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // Clear background
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0, 0, width, height);

  const projectedCells = [];
  
  for(let i=0; i<state.cells.length; i++) {
    const cell = state.cells[i];
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    projectedCells.push({ cell, proj });
  }
  
  // Sort back to front
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // Render Loop
  for (const { cell, proj } of projectedCells) {
    // Cull far back cells to create solid sphere illusion
    if (proj.z > CONFIG.sphereRadius * 0.85) continue;

    const baseSize = CONFIG.cellBaseSize;
    const size = baseSize * proj.scale;

    if (cell.alive) {
      // COLOR MAPPING: Age based
      // 0 (New) -> Cyan (190)
      // 20+ (Old) -> Deep Indigo (260)
      
      const ageFactor = Math.min(cell.age, 30) / 30; // 0 to 1
      
      // Interpolate Hue: 190 -> 260
      const hue = 190 + (ageFactor * 70);
      
      // DEPTH LIGHTING & AMBIENT OCCLUSION
      // Normalize z: -R (front) to R (back).
      // Map -R -> 1.0 brightness, R -> 0.2 brightness
      // This creates the "volumetric" look
      const depthLight = 1.0 - ((proj.z + CONFIG.sphereRadius) / (2 * CONFIG.sphereRadius)) * 0.85;
      
      const lightness = 65 * depthLight; // Max lightness
      const alpha = 0.5 + (0.5 * depthLight); // Fade out at edges

      ctx.fillStyle = `hsla(${hue}, 80%, ${lightness}%, ${alpha})`;
      
      // GLOW EFFECT
      // Only glow front-facing cells to save performance and add depth
      if (proj.z < 0 && size > 1.5) {
        ctx.shadowBlur = 12 * proj.scale;
        ctx.shadowColor = `hsla(${hue}, 90%, 70%, 0.6)`;
      } else {
        ctx.shadowBlur = 0;
      }

      ctx.beginPath();
      ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
      ctx.fill();

    } else {
      // Dead cells: Subtle, dark grid
      // Heavy fade at edges
      const depthFade = 1.0 - ((proj.z + CONFIG.sphereRadius) / (2 * CONFIG.sphereRadius));
      if (depthFade > 0.15) {
         ctx.fillStyle = `rgba(30, 35, 50, ${depthFade * 0.4})`;
         ctx.shadowBlur = 0;
         ctx.beginPath();
         ctx.arc(proj.x, proj.y, size * 0.5, 0, Math.PI * 2);
         ctx.fill();
      }
    }
  }
  
  ctx.shadowBlur = 0;
  
  // ATMOSPHERE GLOW
  // Adds a soft halo around the entire sphere
  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;
  
  const grad = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r * 1.6);
  grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  grad.addColorStop(0.7, 'rgba(10, 15, 30, 0.2)'); // Subtle blue tint
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.6, 0, Math.PI * 2);
  ctx.fill();
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    // Auto rotation
    if (!state.isDragging) {
      state.rotation.y += CONFIG.rotationSpeed;
    }
    
    // Update Logic based on speed slider
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation;
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop;
}

// Controls
const btnPause = document.getElementById('btn-pause');
const btnReset = document.getElementById('btn-reset');
const btnStep = document.getElementById('btn-step');

btnPause.addEventListener('click', () => {
  state.isRunning = !state.isRunning;
  btnPause.innerText = state.isRunning ? "Pause" : "Resume";
  if (state.isRunning) {
    btnPause.classList.add('active-state');
  } else {
    btnPause.classList.remove('active-state');
  }
});

btnReset.addEventListener('click', () => {
  initGame();
});

btnStep.addEventListener('click', () => {
  state.isRunning = false;
  btnPause.innerText = "Resume";
  btnPause.classList.remove('active-state');
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
});

// Mouse Drag Rotation
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.6, Math.min(2.5, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
