<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway Sphere</title>
<style>
  :root {
    --bg-color: #050508;
    --panel-bg: rgba(15, 15, 20, 0.6);
    --panel-border: rgba(255, 255, 255, 0.08);
    --accent: #ffaa00; /* Amber */
    --accent-glow: rgba(255, 170, 0, 0.3);
    --text-main: #e6e6e6;
    --text-muted: #7a7a7a;
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-color);
    /* Subtle radial gradient for depth */
    background-image: radial-gradient(circle at 50% 50%, #0a0a10 0%, #000000 100%);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Canvas Container */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Layer */
  #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
  }

  /* Title: Subdued, Top Left */
  .title-container {
    position: absolute;
    top: 2rem;
    left: 2rem;
    pointer-events: auto;
    opacity: 0.8;
    transition: opacity 0.3s;
  }
  .title-container:hover { opacity: 1; }

  h1 {
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: var(--text-main);
    text-transform: uppercase;
    margin-bottom: 0.25rem;
  }

  .subtitle {
    font-size: 0.65rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  /* Control Panel: Bottom Left, Glassmorphism */
  .panel {
    position: absolute;
    bottom: 2rem;
    left: 2rem;
    pointer-events: auto;
    width: 260px;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    gap: 1.5rem; /* 24px spacing */
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .panel-label {
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 0.5rem;
  }

  /* Stats */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-variant-numeric: tabular-nums;
    margin-bottom: 0.25rem;
  }
  .stat-name {
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .stat-value {
    font-size: 1rem;
    font-weight: 500;
    color: var(--text-main);
  }

  /* Sliders */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    outline: none;
    margin-top: 4px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--text-main);
    cursor: pointer;
    border: 2px solid var(--bg-color);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
    transition: all 0.2s;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
    background: var(--accent);
  }

  /* Buttons: Refined Ghost Style */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  
  button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-main);
    padding: 0.6rem 0;
    border-radius: 6px;
    font-size: 0.7rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  button:hover {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.4);
  }

  button:active {
    transform: scale(0.98);
  }

  /* Active State for Primary Button */
  button.active-state {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
  }
  button.active-state:hover {
    background: rgba(255, 170, 0, 0.1);
  }

  /* Interaction Hint: Bottom Center */
  .interaction-hint {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.65rem;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.6;
    pointer-events: none;
    display: flex;
    gap: 1rem;
    align-items: center;
  }
  
  .hint-divider {
    width: 4px;
    height: 4px;
    background: var(--text-muted);
    border-radius: 50%;
    opacity: 0.5;
  }

</style>
</head>
<body>

  <!-- Canvas -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Subdued Title -->
    <div class="title-container">
      <h1>Conway Sphere</h1>
      <div class="subtitle">Algorithmic Life</div>
    </div>

    <!-- Interaction Hint -->
    <div class="interaction-hint">
      <span>Drag to Rotate</span>
      <div class="hint-divider"></div>
      <span>Scroll to Zoom</span>
    </div>

    <!-- Control Panel -->
    <div class="panel">
      <div class="panel-section">
        <div class="panel-label">Telemetry</div>
        <div class="stat-row">
          <span class="stat-name">Generation</span>
          <span class="stat-value" id="gen-count">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-name">Population</span>
          <span class="stat-value" id="pop-count">0</span>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-label">Simulation Speed</div>
        <input type="range" id="speed-slider" min="1" max="60" value="15">
      </div>

      <div class="panel-section">
        <div class="panel-label">Controls</div>
        <div class="btn-group">
          <button id="btn-pause" class="active-state">Pause</button>
          <button id="btn-reset">Reset</button>
        </div>
        <button id="btn-step" style="margin-top: 0.75rem;">Step Once</button>
      </div>
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life
 * Optimized for visual design:
 * - Multicolor palette based on age (Violet -> Magenta -> Amber)
 * - Depth fog and size attenuation
 * - Bloom effect
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 4000, // Higher density for better look
  sphereRadius: 280,
  cellBaseSize: 2.5,
  rotationSpeed: 0.0015,
  colors: {
    bg: '#050508',
    // Palette: Deep Violet (Old) -> Magenta (Mid) -> Amber (New)
    // HSL: 280 (Purple) -> 320 (Magenta) -> 40 (Amber)
  }
};

// --- State ---
let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 15,
  lastFrameTime: 0,
  rotation: { x: 0.2, y: 0 }, // Slight initial tilt
  zoom: 1.2, // Zoomed out slightly
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  distSq: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return dx*dx + dy*dy + dz*dz;
  }
};

// Fibonacci Lattice
function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2;
    const radiusAtY = Math.sqrt(1 - y * y);
    const theta = goldenAngle * i;
    
    points.push({
      x: Math.cos(theta) * radiusAtY * radius,
      y: y * radius,
      z: Math.sin(theta) * radiusAtY * radius,
      idx: i
    });
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Neighbor Calculation
  // For a sphere, we can use a distance threshold based on the density.
  // Approximate surface area / count = area per cell.
  // Radius of influence approx sqrt(Area / PI).
  // Using a slightly larger threshold to ensure connectivity.
  const avgDist = (4 * Math.PI * Math.pow(CONFIG.sphereRadius, 2)) / CONFIG.cellCount;
  const threshold = Math.sqrt(avgDist) * 1.35; 
  const thresholdSq = threshold * threshold;

  state.cells = points.map((p, i) => {
    const neighbors = [];
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      if (Vec3.distSq(p, points[j]) < thresholdSq) {
        neighbors.push(j);
      }
    }
    
    return {
      pos: p,
      neighbors: neighbors,
      alive: Math.random() > 0.65, // Higher initial density
      bornGen: 0,
      age: 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  const nextStates = state.cells.map(cell => {
    const neighborCount = cell.neighbors.reduce((acc, idx) => acc + (state.cells[idx].alive ? 1 : 0), 0);
    
    let nextAlive = false;
    let isBorn = false;

    if (cell.alive) {
      if (neighborCount === 2 || neighborCount === 3) nextAlive = true;
    } else {
      if (neighborCount === 3) {
        nextAlive = true;
        isBorn = true;
      }
    }
    
    return {
      alive: nextAlive,
      bornGen: isBorn ? state.generation : cell.bornGen,
      age: nextAlive ? (cell.alive ? cell.age + 1 : 0) : 0
    };
  });

  state.cells.forEach((cell, i) => {
    cell.alive = nextStates[i].alive;
    cell.bornGen = nextStates[i].bornGen;
    cell.age = nextStates[i].age;
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 900 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // Clear with subtle trail for motion blur effect
  // Instead of full clear, we use a very low opacity fill to create trails
  // But to keep it crisp, we clear fully and rely on the visual density.
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0, 0, width, height);

  // Prepare cells for drawing
  // We only draw cells that are facing somewhat towards the camera (z < radius)
  // to give a spherical volume illusion, or draw all with opacity.
  
  const projectedCells = [];
  
  for(let i=0; i<state.cells.length; i++) {
    const cell = state.cells[i];
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    
    // Optimization: Only project visible side or back side first
    projectedCells.push({ cell, proj });
  }
  
  // Sort back to front (Z descending)
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // Render Loop
  for (const { cell, proj } of projectedCells) {
    // Z-Depth check: Don't draw cells on the far back of the sphere to see "through" it
    // This creates a solid sphere look.
    if (proj.z > CONFIG.sphereRadius * 0.8) continue;

    const baseSize = CONFIG.cellBaseSize;
    const size = baseSize * proj.scale;

    if (cell.alive) {
      // Color Logic:
      // Map Age (0 to ~100) to Hue.
      // 0 (New) -> Amber (40)
      // Mid -> Magenta (300)
      // Old -> Violet (260)
      
      // We use a non-linear mapping for better visual spread
      const ageFactor = Math.min(cell.age, 60) / 60; // 0 to 1
      
      // Interpolate Hue: 40 -> 320 -> 280
      let hue;
      if (ageFactor < 0.5) {
        // Amber to Magenta
        hue = 40 + (ageFactor * 2) * (320 - 40); 
        if (hue > 360) hue -= 360;
      } else {
        // Magenta to Violet
        const subFactor = (ageFactor - 0.5) * 2;
        // 320 down to 280
        hue = 320 - (subFactor * 40);
      }

      // Depth Lighting:
      // Cells facing camera (low z) are brighter. Cells at edge (high z) are darker.
      // Normalize z: -R (front) to R (back). We are filtering back, so range is approx -R to 0.8R
      // Map -R -> 1.0 brightness, R -> 0.3 brightness
      const depthLight = 1.0 - ((proj.z + CONFIG.sphereRadius) / (2 * CONFIG.sphereRadius)) * 0.7;
      
      const lightness = 50 * depthLight;
      const alpha = 0.6 + (0.4 * depthLight); // Fade out at edges

      ctx.fillStyle = `hsla(${hue}, 85%, ${lightness}%, ${alpha})`;
      
      // Bloom/Glow for front-facing active cells
      if (proj.z < 0 && size > 1.5) {
        ctx.shadowBlur = 8 * proj.scale;
        ctx.shadowColor = `hsla(${hue}, 90%, 60%, 0.5)`;
      } else {
        ctx.shadowBlur = 0;
      }

      ctx.beginPath();
      ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
      ctx.fill();

    } else {
      // Dead cells: Subtle grid
      // Fade out dead cells at the back heavily
      const depthFade = 1.0 - ((proj.z + CONFIG.sphereRadius) / (2 * CONFIG.sphereRadius));
      if (depthFade > 0.1) {
         ctx.fillStyle = `rgba(40, 45, 60, ${depthFade * 0.3})`;
         ctx.shadowBlur = 0;
         ctx.beginPath();
         ctx.arc(proj.x, proj.y, size * 0.6, 0, Math.PI * 2);
         ctx.fill();
      }
    }
  }
  
  // Reset Shadow
  ctx.shadowBlur = 0;
  
  // Atmosphere Glow (Behind the sphere)
  // Draw a large soft gradient in the center
  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;
  
  const grad = ctx.createRadialGradient(cx, cy, r * 0.7, cx, cy, r * 1.4);
  grad.addColorStop(0, 'rgba(20, 20, 30, 0)');
  grad.addColorStop(0.8, 'rgba(30, 30, 40, 0.1)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.5, 0, Math.PI * 2);
  ctx.fill();
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    // Auto rotation
    if (!state.isDragging) {
      state.rotation.y += CONFIG.rotationSpeed;
    }
    
    // Update Logic
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation;
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop;
}

// Controls
const btnPause = document.getElementById('btn-pause');
const btnReset = document.getElementById('btn-reset');
const btnStep = document.getElementById('btn-step');

btnPause.addEventListener('click', () => {
  state.isRunning = !state.isRunning;
  btnPause.innerText = state.isRunning ? "Pause" : "Resume";
  if (state.isRunning) {
    btnPause.classList.add('active-state');
  } else {
    btnPause.classList.remove('active-state');
  }
});

btnReset.addEventListener('click', () => {
  initGame();
});

btnStep.addEventListener('click', () => {
  state.isRunning = false;
  btnPause.innerText = "Resume";
  btnPause.classList.remove('active-state');
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
});

// Mouse Drag Rotation
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.6, Math.min(2.5, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
