<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aetheris: Deep Dive</title>
<style>
  :root {
    --bg-deep: #00050a;
    --bg-mid: #021224;
    --accent-cyan: #00f2ff;
    --accent-purple: #d94dff;
    --accent-lime: #5aff85;
    --accent-pink: #ff3366;
    --glass-bg: rgba(2, 18, 36, 0.65);
    --glass-border: rgba(0, 242, 255, 0.2);
    --font-display: 'Impact', 'Arial Black', sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Environment Layers --- */
  .scene-wrapper {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
    /* Deep ocean gradient */
    background: 
      radial-gradient(circle at 50% 10%, rgba(0, 242, 255, 0.08) 0%, transparent 40%), /* Surface light */
      radial-gradient(circle at 50% 120%, #061a30 0%, transparent 70%), /* Deep glow */
      linear-gradient(to bottom, #00050a, #021224 40%, #000810 100%);
  }

  /* Canvas Layer */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 2;
    mix-blend-mode: screen; /* Makes creatures pop against dark bg */
  }

  /* Vignette */
  .overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.9) 100%);
    z-index: 3;
    pointer-events: none;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(24px, 4vw, 48px);
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(2.5rem, 7vw, 5rem);
    margin: 0;
    letter-spacing: -0.02em;
    line-height: 0.9;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,255,255,0.2);
  }

  .subtitle {
    font-size: clamp(0.9rem, 1.8vw, 1.2rem);
    font-weight: 700;
    letter-spacing: 0.25em;
    color: var(--accent-cyan);
    margin-top: 8px;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(0, 242, 255, 0.4);
    opacity: 0.9;
  }

  /* HUD Container */
  .hud-container {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
  }

  .hud-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-right: 4px solid var(--accent-cyan);
    padding: 12px 24px;
    border-radius: 4px 0 0 4px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    transform: skewX(-6deg);
    min-width: 140px;
  }

  .stat-group {
    display: flex;
    flex-direction: column;
    transform: skewX(6deg); /* Counter skew text */
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2.2rem;
    line-height: 1;
    color: white;
    letter-spacing: 0.05em;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--accent-cyan);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 600;
    margin-top: 2px;
  }

  /* Bottom HUD Bar */
  .bottom-hud {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: auto;
    width: 100%;
  }

  .depth-meter {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    opacity: 0.7;
  }
  
  .depth-label {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-cyan);
  }
  
  .depth-value {
    font-family: var(--font-display);
    font-size: 1.5rem;
  }

  /* Action Button */
  .btn-main {
    position: relative;
    background: linear-gradient(180deg, #004d66 0%, #001a24 100%);
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    font-family: var(--font-display);
    font-size: 1.4rem;
    padding: 1rem 3rem;
    border-radius: 2px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
    overflow: hidden;
    box-shadow: 0 0 15px rgba(0, 242, 255, 0.15), inset 0 0 15px rgba(0, 242, 255, 0.05);
    text-shadow: 0 0 5px var(--accent-cyan);
    transform: skewX(-6deg);
  }

  /* Button Content Skew Fix */
  .btn-content {
    transform: skewX(6deg);
    display: block;
  }

  .btn-main:hover {
    background: linear-gradient(180deg, #006680 0%, #002a38 100%);
    box-shadow: 0 0 30px rgba(0, 242, 255, 0.3), inset 0 0 20px rgba(0, 242, 255, 0.15);
    color: #fff;
    text-shadow: 0 0 10px #fff;
  }

  .btn-main:active {
    transform: skewX(-6deg) scale(0.96);
  }

  /* Toast */
  .toast {
    position: absolute;
    top: 35%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0, 20, 40, 0.9);
    border: 1px solid var(--accent-purple);
    color: #fff;
    padding: 1rem 2.5rem;
    font-family: var(--font-display);
    letter-spacing: 0.15em;
    font-size: 1.2rem;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(217, 77, 255, 0.4);
    text-shadow: 0 0 8px var(--accent-purple);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

</style>
</head>
<body>

<div class="scene-wrapper">
  <canvas id="gameCanvas"></canvas>
  <div class="overlay"></div>

  <!-- UI Layer -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>AETHERIS</h1>
        <div class="subtitle">Deep Dive Collection</div>
      </div>
      <div class="hud-container">
        <div class="hud-panel">
          <div class="stat-group">
            <div class="stat-value" id="scoreDisplay">00</div>
            <div class="stat-label">Specimens</div>
          </div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Secured</div>

    <div class="bottom-hud">
      <div class="depth-meter">
        <div class="depth-label">Depth</div>
        <div class="depth-value">420m</div>
      </div>
      <button class="btn-main" onclick="resetGame()">
        <span class="btn-content">Start Dive</span>
      </button>
    </div>
  </div>
</div>

<script>
  /**
   * Aetheris: Deep Dive - Visual Revision
   * 
   * Visual Improvements:
   * 1. Player Net: Added a visible, physics-based cursor/net.
   * 2. Atmosphere: Light rays, dust, and deep water gradients.
   * 3. Creatures: Improved geometry (dome + tentacles) and additive lighting.
   * 4. Typography: Skewed HUD elements, tighter tracking, distinct hierarchy.
   * 5. Colors: Saturated, glowing entities against dark background.
   */

  const gameCanvas = document.getElementById('gameCanvas');
  const ctx = gameCanvas.getContext('2d', { alpha: true });
  
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let dustParticles = [];
  let creatures = [];
  
  // Input State
  let mouse = { x: -1000, y: -1000 };
  let net = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let time = 0;

  // Config
  const COLORS = [
    { main: '#00f2ff', glow: '#00f2ff' }, // Cyan
    { main: '#d94dff', glow: '#d94dff' }, // Purple
    { main: '#5aff85', glow: '#5aff85' }, // Lime
    { main: '#ff3366', glow: '#ff3366' }  // Pink
  ];
  const CREATURE_COUNT = 15; 

  // --- Initialization ---

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    
    gameCanvas.width = width;
    gameCanvas.height = height;

    initDust();
  }

  function initDust() {
    dustParticles = [];
    for(let i=0; i<100; i++) {
      dustParticles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 1.5,
        speedY: Math.random() * 0.2 + 0.05,
        speedX: (Math.random() - 0.5) * 0.1,
        alpha: Math.random() * 0.3 + 0.1
      });
    }
  }

  function initGame() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = "00";
  }

  // --- Classes ---

  class Creature {
    constructor() {
      this.reset();
      // Random start pos
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    }

    reset() {
      // Spawn logic
      const side = Math.floor(Math.random() * 4);
      if(side === 0) { this.x = Math.random() * width; this.y = -150; }
      else if(side === 1) { this.x = width + 150; this.y = Math.random() * height; }
      else if(side === 2) { this.x = Math.random() * width; this.y = height + 150; }
      else { this.x = -150; this.y = Math.random() * height; }

      this.vx = (Math.random() - 0.5) * 0.5;
      this.vy = (Math.random() - 0.5) * 0.5;
      
      // Depth sizing
      this.sizeClass = Math.random(); 
      this.radius = (this.sizeClass > 0.7 ? 30 : 18) + (Math.random() * 12); 
      
      this.colorSet = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.wobble = Math.random() * Math.PI * 2;
      this.isCaught = false;
      this.opacity = 0; 
      
      // Tentacles
      this.tentacles = [];
      const tentCount = Math.floor(Math.random() * 3) + 4;
      for(let i=0; i<tentCount; i++) {
        this.tentacles.push({
          offset: (i / tentCount) * Math.PI,
          len: Math.random() * 30 + 20,
          wave: Math.random() * Math.PI
        });
      }
    }

    update() {
      if (this.isCaught) return;

      // Fade in
      if (this.opacity < 1) this.opacity += 0.01;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.wobble += 0.03;
      this.y += Math.sin(this.wobble) * 0.2; // Bobbing

      // Mouse Interaction (Flee)
      const dx = this.x - net.x;
      const dy = this.y - net.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      const fleeDist = 180 + this.radius;
      
      if (dist < fleeDist) {
        const force = (fleeDist - dist) / fleeDist;
        this.vx += (dx / dist) * force * 0.4;
        this.vy += (dy / dist) * force * 0.4;
      }

      // Friction & Speed Limit
      this.vx *= 0.96;
      this.vy *= 0.96;
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      const maxSpeed = 1.5 + (this.sizeClass * 1.5);
      if (speed > maxSpeed) {
        this.vx = (this.vx / speed) * maxSpeed;
        this.vy = (this.vy / speed) * maxSpeed;
      }

      // Bounds
      if (this.x < -100) this.vx += 0.05;
      if (this.x > width + 100) this.vx -= 0.05;
      if (this.y < -100) this.vy += 0.05;
      if (this.y > height + 100) this.vy -= 0.05;
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.globalAlpha = this.opacity;
      ctx.translate(this.x, this.y);
      
      // --- LIGHTING EFFECT ---
      // Additive blending for that "deep sea bioluminescence" look
      ctx.globalCompositeOperation = 'screen'; 
      
      // Outer Glow
      const gradient = ctx.createRadialGradient(0, 0, this.radius * 0.5, 0, 0, this.radius * 3);
      gradient.addColorStop(0, this.colorSet.glow);
      gradient.addColorStop(1, 'transparent');
      
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * 3, 0, Math.PI * 2);
      ctx.fill();

      // Reset blend
      ctx.globalCompositeOperation = 'source-over';

      // Draw Tentacles
      ctx.strokeStyle = this.colorSet.main;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      
      this.tentacles.forEach((t, i) => {
        ctx.beginPath();
        const startX = Math.cos(t.offset) * (this.radius * 0.8);
        const startY = Math.sin(t.offset) * (this.radius * 0.2); 
        
        const waveX = Math.sin(time * 0.05 + t.wave) * 10;
        const waveY = Math.cos(time * 0.05 + t.wave) * 5;

        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(
          startX + waveX, 
          startY + t.len/2, 
          startX + waveX * 1.5, 
          startY + t.len
        );
        ctx.stroke();
      });

      // Draw Body (Jellyfish Dome)
      ctx.fillStyle = this.colorSet.main;
      ctx.shadowBlur = 10;
      ctx.shadowColor = this.colorSet.glow;
      
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, Math.PI, 0); // Top half circle
      // Curved bottom
      ctx.quadraticCurveTo(this.radius * 0.8, this.radius * 0.8, this.radius * 0.5, this.radius * 0.6);
      ctx.quadraticCurveTo(0, this.radius * 0.3, -this.radius * 0.5, this.radius * 0.6);
      ctx.quadraticCurveTo(-this.radius * 0.8, this.radius * 0.8, -this.radius, 0);
      ctx.fill();

      // Inner Core (Bright)
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#fff';
      ctx.beginPath();
      ctx.arc(0, -this.radius * 0.3, this.radius * 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.03 + 0.02;
      this.size = Math.random() * 4 + 2;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;
      this.vx *= 0.95;
      this.vy *= 0.95;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  // --- Core Functions ---

  function drawNet() {
    // Smooth lerp for net
    net.x += (mouse.x - net.x) * 0.15;
    net.y += (mouse.y - net.y) * 0.15;

    ctx.save();
    ctx.translate(net.x, net.y);
    
    // Slight rotation based on movement
    const rot = (net.x - mouse.x) * 0.002;
    ctx.rotate(rot);

    const r = isMouseDown ? 40 : 50; // Contract on click

    // Outer Ring
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(0, 242, 255, 0.9)';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(0, 242, 255, 0.8)';
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Tech Ring (Dashed)
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.6)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, r - 8, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Crosshair
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-12, 0); ctx.lineTo(12, 0);
    ctx.moveTo(0, -12); ctx.lineTo(0, 12);
    ctx.stroke();

    // "Suction" visual
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      for(let i=0; i<6; i++) {
        ctx.beginPath();
        ctx.arc(0, 0, r + 10 + (time % 15), i * 1.2, i * 1.2 + 0.5);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function drawEnvironment() {
    // Dust
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    
    dustParticles.forEach(p => {
      p.y -= p.speedY;
      p.x += p.speedX;
      
      if(p.y < 0) { p.y = height; p.x = Math.random() * width; }
      
      ctx.globalAlpha = p.alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    // Light Rays (subtle)
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.03;
    ctx.fillStyle = '#fff';
    
    const rayWidth = 100;
    const rayHeight = height;
    const rayX = width * 0.5 + Math.sin(time * 0.01) * 200;
    
    ctx.beginPath();
    ctx.moveTo(rayX - rayWidth/2, 0);
    ctx.lineTo(rayX + rayWidth/2, 0);
    ctx.lineTo(rayX + rayWidth, rayHeight);
    ctx.lineTo(rayX - rayWidth, rayHeight);
    ctx.fill();
    ctx.restore();
  }

  function checkCatch() {
    const catchRadius = 55; 
    let caughtAny = false;

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - net.x;
      const dy = c.y - net.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
        caughtAny = true;
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score < 10 ? "0" + score : score;
    
    // FX
    for(let i=0; i<25; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.colorSet.main));
    }

    // Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1500);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 2000);
  }

  function resetGame() {
    initGame();
  }

  // --- Loops ---

  function loop() {
    time++;
    ctx.clearRect(0, 0, width, height);

    // Draw Environment (Dust & Rays)
    drawEnvironment();

    // Sort creatures by size (depth)
    creatures.sort((a, b) => a.radius - b.radius);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // --- Event Listeners ---
  window.addEventListener('resize', resize);
  
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });

  // Touch
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // Start
  resize();
  initGame();
  loop();

</script>
</body>
</html>
