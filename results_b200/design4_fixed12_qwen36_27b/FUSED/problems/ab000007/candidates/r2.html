<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aetheris: The Deep Catch</title>
<style>
  :root {
    --bg-deep: #02040a;
    --bg-mid: #0a1128;
    --accent-primary: #00f2ff; /* Cyan */
    --accent-glow: rgba(0, 242, 255, 0.4);
    --glass-surface: rgba(2, 4, 10, 0.4);
    --glass-border: rgba(255, 255, 255, 0.15);
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Environment Layers --- */
  .scene-wrapper {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  /* Deep Sea / Space Fog */
  .atmosphere {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: 
      radial-gradient(circle at 50% 100%, #0d2b52 0%, transparent 70%),
      radial-gradient(circle at 20% 20%, rgba(100, 0, 255, 0.1) 0%, transparent 50%),
      linear-gradient(to bottom, #02040a, #061020);
    z-index: 0;
  }

  /* Floating Dust/Plankton Canvas */
  #envCanvas {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    opacity: 0.6;
  }

  /* Main Game Canvas */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 2;
  }

  /* Vignette & Grain */
  .overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
    z-index: 3;
    pointer-events: none;
    box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(20px, 4vw, 40px);
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    text-transform: uppercase;
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(2rem, 5vw, 4rem);
    margin: 0;
    letter-spacing: 0.05em;
    background: linear-gradient(to bottom, #fff, #a5f3fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.3));
  }

  .subtitle {
    font-size: 0.8rem;
    letter-spacing: 0.4em;
    color: var(--accent-primary);
    margin-top: 5px;
    text-shadow: 0 0 10px var(--accent-glow);
  }

  /* HUD Glass Panel */
  .hud-panel {
    background: var(--glass-surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    padding: 10px 25px;
    border-radius: 30px;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    transition: transform 0.3s ease;
  }

  .hud-panel:hover {
    transform: translateY(-2px);
    border-color: rgba(0, 242, 255, 0.3);
  }

  .specimen-icon {
    width: 24px; height: 24px;
    background: var(--accent-primary);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent-primary);
    position: relative;
  }
  .specimen-icon::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 10px; height: 10px; background: #fff; border-radius: 50%;
  }

  .stat-group {
    display: flex;
    flex-direction: column;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 1.5rem;
    line-height: 1;
    color: white;
  }

  .stat-label {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Footer / Action Button */
  .footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: auto;
    padding-bottom: 20px;
  }

  .btn-main {
    background: linear-gradient(135deg, rgba(0, 242, 255, 0.1), rgba(0, 242, 255, 0.05));
    backdrop-filter: blur(10px);
    border: 1px solid rgba(0, 242, 255, 0.4);
    color: #fff;
    font-family: var(--font-display);
    font-size: 1.2rem;
    padding: 1rem 4rem;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
  }

  .btn-main::before {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: 0.5s;
  }

  .btn-main:hover {
    background: rgba(0, 242, 255, 0.2);
    border-color: var(--accent-primary);
    box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
    transform: translateY(-2px);
    text-shadow: 0 0 8px var(--accent-primary);
  }

  .btn-main:hover::before {
    left: 100%;
  }

  /* Toast */
  .toast {
    position: absolute;
    top: 30%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0,0,0,0.6);
    border: 1px solid var(--accent-primary);
    backdrop-filter: blur(4px);
    color: var(--accent-primary);
    padding: 1rem 2rem;
    border-radius: 2px;
    font-family: var(--font-display);
    letter-spacing: 0.2em;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile tweaks */
  @media (max-width: 600px) {
    .hud-panel { padding: 8px 15px; border-radius: 20px; }
    .stat-value { font-size: 1.2rem; }
    .btn-main { padding: 1rem 2rem; width: 100%; font-size: 1rem; }
  }
</style>
</head>
<body>

<div class="scene-wrapper">
  <!-- Environment Backgrounds -->
  <div class="atmosphere"></div>
  <canvas id="envCanvas"></canvas> <!-- Dust/Particles -->

  <!-- Game Layer -->
  <canvas id="gameCanvas"></canvas>
  
  <!-- Overlays -->
  <div class="overlay"></div>

  <!-- UI Layer -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Aetheris</h1>
        <div class="subtitle">Deep Dive Collection</div>
      </div>
      <div class="hud-panel">
        <div class="specimen-icon"></div>
        <div class="stat-group">
          <div class="stat-value" id="scoreDisplay">00</div>
          <div class="stat-label">Collected</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">Open Case</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Aetheris: The Deep Catch
   * Visual Overhaul:
   * 1. Atmosphere: Canvas-based dust + CSS gradients for depth.
   * 2. Player: First-person "Net" cursor with physics-based movement.
   * 3. Creatures: Organic, glowing jellyfish-like entities with trails.
   * 4. Interaction: Fluid movement, fleeing behaviors, particle bursts.
   */

  const gameCanvas = document.getElementById('gameCanvas');
  const ctx = gameCanvas.getContext('2d', { alpha: true });
  
  const envCanvas = document.getElementById('envCanvas');
  const envCtx = envCanvas.getContext('2d', { alpha: true });

  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let dustParticles = [];
  
  // Input State
  let mouse = { x: -1000, y: -1000 };
  let net = { x: -1000, y: -1000 }; // Net lags behind mouse slightly
  let isMouseDown = false;
  let time = 0;

  // Config
  const COLORS = [
    { main: '#00f2ff', glow: '#00f2ff' }, // Cyan
    { main: '#bd00ff', glow: '#bd00ff' }, // Purple
    { main: '#00ff9d', glow: '#00ff9d' }, // Lime
    { main: '#ff0055', glow: '#ff0055' }  // Pink
  ];
  const CREATURE_COUNT = 4;

  // --- Initialization ---

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    
    gameCanvas.width = width;
    gameCanvas.height = height;
    
    envCanvas.width = width;
    envCanvas.height = height;

    initDust();
  }

  function initDust() {
    dustParticles = [];
    for(let i=0; i<80; i++) {
      dustParticles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 2,
        speedY: Math.random() * 0.5 + 0.1,
        speedX: (Math.random() - 0.5) * 0.2,
        alpha: Math.random() * 0.5
      });
    }
  }

  function initGame() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = "00";
  }

  // --- Classes ---

  class Creature {
    constructor() {
      this.reset();
      // Random start pos
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    }

    reset() {
      // Spawn at edges
      const side = Math.floor(Math.random() * 4);
      if(side === 0) { this.x = Math.random() * width; this.y = -100; } // Top
      else if(side === 1) { this.x = width + 100; this.y = Math.random() * height; } // Right
      else if(side === 2) { this.x = Math.random() * width; this.y = height + 100; } // Bottom
      else { this.x = -100; this.y = Math.random() * height; } // Left

      this.vx = (Math.random() - 0.5) * 1;
      this.vy = (Math.random() - 0.5) * 1;
      
      this.radius = Math.random() * 15 + 20;
      this.colorSet = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.wobble = Math.random() * Math.PI * 2;
      this.isCaught = false;
      this.opacity = 0; // Fade in
      
      // Tentacles
      this.tentacles = [];
      const tentCount = Math.floor(Math.random() * 3) + 4;
      for(let i=0; i<tentCount; i++) {
        this.tentacles.push({
          offset: (i / tentCount) * Math.PI, // Spread across bottom
          len: Math.random() * 30 + 20,
          wave: Math.random() * Math.PI
        });
      }
    }

    update() {
      if (this.isCaught) return;

      // Fade in
      if (this.opacity < 1) this.opacity += 0.01;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.wobble += 0.03;
      this.y += Math.sin(this.wobble) * 0.2; // Bobbing

      // Mouse Interaction (Flee)
      const dx = this.x - net.x;
      const dy = this.y - net.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      // Flee radius
      if (dist < 200) {
        const force = (200 - dist) / 200;
        this.vx += (dx / dist) * force * 0.5;
        this.vy += (dy / dist) * force * 0.5;
      }

      // Friction & Speed Limit
      this.vx *= 0.98;
      this.vy *= 0.98;
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 3) {
        this.vx = (this.vx / speed) * 3;
        this.vy = (this.vy / speed) * 3;
      }

      // Bounds (Soft bounce)
      if (this.x < -50) this.vx += 0.2;
      if (this.x > width + 50) this.vx -= 0.2;
      if (this.y < -50) this.vy += 0.2;
      if (this.y > height + 50) this.vy -= 0.2;
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.globalAlpha = this.opacity;
      ctx.translate(this.x, this.y);
      
      // Glow
      ctx.shadowBlur = 20;
      ctx.shadowColor = this.colorSet.glow;

      // Draw Tentacles
      ctx.strokeStyle = this.colorSet.main;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      
      this.tentacles.forEach((t, i) => {
        ctx.beginPath();
        // Calculate base of tentacle on the dome
        const startX = Math.cos(t.offset) * (this.radius * 0.8);
        const startY = Math.sin(t.offset) * (this.radius * 0.2); // Slightly below center
        
        const waveX = Math.sin(time * 0.05 + t.wave) * 10;
        const waveY = Math.cos(time * 0.05 + t.wave) * 5;

        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(
          startX + waveX, 
          startY + t.len/2, 
          startX + waveX * 1.5, 
          startY + t.len
        );
        ctx.stroke();
      });

      // Draw Body (Jellyfish Dome)
      ctx.fillStyle = this.colorSet.main;
      ctx.beginPath();
      // Top dome
      ctx.arc(0, 0, this.radius, Math.PI, 0); 
      // Scalloped bottom
      ctx.quadraticCurveTo(this.radius * 0.8, this.radius * 0.6, this.radius * 0.6, this.radius * 0.4);
      ctx.quadraticCurveTo(0, this.radius * 0.2, -this.radius * 0.6, this.radius * 0.4);
      ctx.quadraticCurveTo(-this.radius * 0.8, this.radius * 0.6, -this.radius, 0);
      ctx.fill();

      // Inner Core (Bright)
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 5;
      ctx.beginPath();
      ctx.arc(0, -this.radius * 0.3, this.radius * 0.25, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.015;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  // --- Core Functions ---

  function drawNet() {
    // Smooth lerp for net
    net.x += (mouse.x - net.x) * 0.15;
    net.y += (mouse.y - net.y) * 0.15;

    ctx.save();
    ctx.translate(net.x, net.y);
    
    // Slight rotation based on movement
    const rot = (net.x - mouse.x) * 0.005;
    ctx.rotate(rot);

    const r = isMouseDown ? 45 : 55; // Contract on click

    // Outer Ring
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(0, 242, 255, 0.8)';
    ctx.lineWidth = 3;
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(0, 242, 255, 0.5)';
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Tech Ring (Dashed)
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, r - 8, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Crosshair
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-10, 0); ctx.lineTo(10, 0);
    ctx.moveTo(0, -10); ctx.lineTo(0, 10);
    ctx.stroke();

    // "Suction" visual
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.lineWidth = 1;
      for(let i=0; i<4; i++) {
        ctx.beginPath();
        ctx.arc(0, 0, r + 10 + (time % 20), i * 1.5, i * 1.5 + 0.5);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function checkCatch() {
    const catchRadius = 60; 
    let caughtAny = false;

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - net.x;
      const dy = c.y - net.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
        caughtAny = true;
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score < 10 ? "0" + score : score;
    
    // FX
    for(let i=0; i<25; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.colorSet.main));
    }

    // Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1500);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 2000);
  }

  function resetGame() {
    initGame();
  }

  // --- Loops ---

  function drawEnvironment() {
    envCtx.clearRect(0, 0, width, height);
    envCtx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    
    dustParticles.forEach(p => {
      p.y -= p.speedY;
      p.x += p.speedX;
      
      if(p.y < 0) { p.y = height; p.x = Math.random() * width; }
      
      envCtx.globalAlpha = p.alpha;
      envCtx.beginPath();
      envCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      envCtx.fill();
    });
    envCtx.globalAlpha = 1.0;
    requestAnimationFrame(drawEnvironment);
  }

  function loop() {
    time++;
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // --- Event Listeners ---
  window.addEventListener('resize', resize);
  
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });

  // Touch
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // Start
  resize();
  initGame();
  loop();
  drawEnvironment();

</script>
</body>
</html>
