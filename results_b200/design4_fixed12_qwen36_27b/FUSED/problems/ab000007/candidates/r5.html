<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AETHERIS: Aether Collection</title>
<style>
  :root {
    --bg-deep: #000000;
    --bg-gradient: linear-gradient(135deg, #00050a 0%, #021224 50%, #0a0015 100%);
    --neon-cyan: #00f2ff;
    --neon-purple: #d94dff;
    --neon-lime: #5aff85;
    --neon-pink: #ff3366;
    --glass-panel: rgba(10, 20, 30, 0.4);
    --glass-border: rgba(0, 242, 255, 0.15);
    --font-display: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Geneva, Verdana, sans-serif;
    --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Scene Container --- */
  .scene-wrapper {
    position: relative;
    width: 100%; height: 100%;
    background: var(--bg-gradient);
    overflow: hidden;
  }

  /* Canvas */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
  }

  /* Vignette & Scanlines Overlay */
  .overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: 
      radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.8) 90%),
      linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
    background-size: 100% 100%, 100% 4px;
    z-index: 2;
    pointer-events: none;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(20px, 4vw, 40px);
  }

  /* --- Header & Typography --- */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    position: relative;
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(2.5rem, 8vw, 6rem);
    margin: 0;
    letter-spacing: 0.15em;
    line-height: 0.85;
    text-transform: uppercase;
    color: #fff;
    font-weight: 400;
    /* Futuristic gradient text */
    background: linear-gradient(180deg, #fff 0%, #b4eaff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 15px rgba(0, 242, 255, 0.3));
  }

  .subtitle {
    font-size: clamp(0.7rem, 1.5vw, 1rem);
    font-weight: 600;
    letter-spacing: 0.4em;
    color: var(--neon-cyan);
    margin-top: 10px;
    text-transform: uppercase;
    opacity: 0.8;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .subtitle::before {
    content: '';
    display: block;
    width: 20px;
    height: 1px;
    background: var(--neon-cyan);
    box-shadow: 0 0 8px var(--neon-cyan);
  }

  /* --- HUD: Holographic Panel --- */
  .hud-container {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .hud-panel {
    background: var(--glass-panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-right: 2px solid var(--neon-cyan);
    padding: 15px 30px;
    border-radius: 0 12px 12px 0; /* Asymmetrical rounded */
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
  }

  /* Scanning line animation on HUD */
  .hud-panel::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 242, 255, 0.1), transparent);
    animation: scan 4s infinite linear;
  }

  @keyframes scan {
    0% { left: -100%; }
    100% { left: 200%; }
  }

  .stat-group {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2.5rem;
    line-height: 1;
    color: white;
    letter-spacing: 0.05em;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
    font-variant-numeric: tabular-nums;
  }

  .stat-label {
    font-size: 0.6rem;
    color: var(--neon-cyan);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 700;
    margin-top: 4px;
  }

  /* --- Bottom Bar --- */
  .bottom-hud {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: auto;
    width: 100%;
  }

  .depth-meter {
    display: flex;
    flex-direction: column;
    gap: 2px;
    opacity: 0.6;
  }
  
  .depth-label {
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--neon-cyan);
  }
  
  .depth-value {
    font-family: var(--font-display);
    font-size: 1.2rem;
    color: #fff;
  }

  /* --- Action Button: Tactile & Glowing --- */
  .btn-main {
    position: relative;
    background: rgba(0, 20, 30, 0.6);
    border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan);
    font-family: var(--font-ui);
    font-weight: 800;
    font-size: 1rem;
    padding: 1.2rem 3.5rem;
    border-radius: 50px; /* Pill shape */
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    overflow: hidden;
    box-shadow: 
      0 0 20px rgba(0, 242, 255, 0.1),
      inset 0 0 20px rgba(0, 242, 255, 0.05);
    backdrop-filter: blur(5px);
  }

  .btn-main:hover {
    background: rgba(0, 242, 255, 0.15);
    box-shadow: 
      0 0 40px rgba(0, 242, 255, 0.4),
      inset 0 0 10px rgba(0, 242, 255, 0.2);
    color: #fff;
    transform: translateY(-2px);
    text-shadow: 0 0 8px rgba(255,255,255,0.8);
    border-color: #fff;
  }

  .btn-main:active {
    transform: scale(0.95);
    box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
  }

  /* --- Toast Notification --- */
  .toast {
    position: absolute;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0, 10, 20, 0.85);
    border: 1px solid var(--neon-purple);
    color: #fff;
    padding: 1rem 2rem;
    font-family: var(--font-ui);
    font-weight: 600;
    letter-spacing: 0.1em;
    font-size: 1rem;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 40px rgba(217, 77, 255, 0.3);
    text-shadow: 0 0 5px var(--neon-purple);
    border-radius: 4px;
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

</style>
</head>
<body>

<div class="scene-wrapper">
  <canvas id="gameCanvas"></canvas>
  <div class="overlay"></div>

  <!-- UI Layer -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Aetheris</h1>
        <div class="subtitle">Collection System</div>
      </div>
      <div class="hud-container">
        <div class="hud-panel">
          <div class="stat-group">
            <div class="stat-value" id="scoreDisplay">00</div>
            <div class="stat-label">Captured</div>
          </div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Secured</div>

    <div class="bottom-hud">
      <div class="depth-meter">
        <div class="depth-label">Depth</div>
        <div class="depth-value">420m</div>
      </div>
      <button class="btn-main" onclick="resetGame()">
        Start Dive
      </button>
    </div>
  </div>
</div>

<script>
  /**
   * AETHERIS: Visual Revision
   * - Organic Jellyfish with pulsing organs & tentacles
   * - Volumetric lighting (God rays)
   * - Holographic UI elements
   * - Atmospheric particles
   */

  const gameCanvas = document.getElementById('gameCanvas');
  const ctx = gameCanvas.getContext('2d', { alpha: true });
  
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let dustParticles = [];
  let creatures = [];
  
  // Input State
  let mouse = { x: -1000, y: -1000 };
  let net = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let time = 0;

  // Config
  const COLORS = [
    { main: '#00f2ff', glow: '#00f2ff' }, // Cyan
    { main: '#d94dff', glow: '#d94dff' }, // Purple
    { main: '#5aff85', glow: '#5aff85' }, // Lime
    { main: '#ff3366', glow: '#ff3366' }  // Pink
  ];
  const CREATURE_COUNT = 12; 

  // --- Initialization ---

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    
    gameCanvas.width = width;
    gameCanvas.height = height;

    initDust();
  }

  function initDust() {
    dustParticles = [];
    for(let i=0; i<80; i++) {
      dustParticles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 2,
        speedY: Math.random() * 0.3 + 0.1,
        speedX: (Math.random() - 0.5) * 0.2,
        alpha: Math.random() * 0.4 + 0.1
      });
    }
  }

  function initGame() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = "00";
  }

  // --- Classes ---

  class Creature {
    constructor() {
      this.reset();
      // Random start pos
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    }

    reset() {
      // Spawn logic
      const side = Math.floor(Math.random() * 4);
      if(side === 0) { this.x = Math.random() * width; this.y = -150; }
      else if(side === 1) { this.x = width + 150; this.y = Math.random() * height; }
      else if(side === 2) { this.x = Math.random() * width; this.y = height + 150; }
      else { this.x = -150; this.y = Math.random() * height; }

      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = (Math.random() - 0.5) * 0.3;
      
      // Depth sizing
      this.sizeClass = Math.random(); 
      this.radius = (this.sizeClass > 0.7 ? 35 : 20) + (Math.random() * 15); 
      
      this.colorSet = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.wobble = Math.random() * Math.PI * 2;
      this.pulsePhase = Math.random() * Math.PI * 2;
      this.isCaught = false;
      this.opacity = 0; 
      
      // Tentacles
      this.tentacles = [];
      const tentCount = Math.floor(Math.random() * 3) + 3;
      for(let i=0; i<tentCount; i++) {
        this.tentacles.push({
          offset: (i / (tentCount - 1)) * Math.PI, // Spread across bottom
          len: Math.random() * 40 + 20,
          wave: Math.random() * Math.PI
        });
      }
    }

    update() {
      if (this.isCaught) return;

      // Fade in
      if (this.opacity < 1) this.opacity += 0.02;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.wobble += 0.02;
      this.pulsePhase += 0.05;
      this.y += Math.sin(this.wobble) * 0.3; // Bobbing

      // Mouse Interaction (Flee)
      const dx = this.x - net.x;
      const dy = this.y - net.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      const fleeDist = 200 + this.radius;
      
      if (dist < fleeDist) {
        const force = (fleeDist - dist) / fleeDist;
        this.vx += (dx / dist) * force * 0.6;
        this.vy += (dy / dist) * force * 0.6;
      }

      // Friction & Speed Limit
      this.vx *= 0.98;
      this.vy *= 0.98;
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      const maxSpeed = 2.0 + (this.sizeClass * 1.5);
      if (speed > maxSpeed) {
        this.vx = (this.vx / speed) * maxSpeed;
        this.vy = (this.vy / speed) * maxSpeed;
      }

      // Bounds
      if (this.x < -100) this.vx += 0.02;
      if (this.x > width + 100) this.vx -= 0.02;
      if (this.y < -100) this.vy += 0.02;
      if (this.y > height + 100) this.vy -= 0.02;
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.globalAlpha = this.opacity;
      ctx.translate(this.x, this.y);
      
      // --- LIGHTING EFFECT ---
      // Additive blending for bioluminescence
      ctx.globalCompositeOperation = 'screen'; 
      
      // Outer Glow
      const gradient = ctx.createRadialGradient(0, 0, this.radius * 0.5, 0, 0, this.radius * 4);
      gradient.addColorStop(0, this.colorSet.glow);
      gradient.addColorStop(0.4, this.colorSet.main + '40'); // Hex alpha
      gradient.addColorStop(1, 'transparent');
      
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * 4, 0, Math.PI * 2);
      ctx.fill();

      // Reset blend for structural details
      ctx.globalCompositeOperation = 'source-over';

      // Draw Tentacles
      ctx.strokeStyle = this.colorSet.main;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.shadowBlur = 5;
      ctx.shadowColor = this.colorSet.glow;
      
      this.tentacles.forEach((t, i) => {
        ctx.beginPath();
        // Start from bottom arc
        const startX = Math.cos(t.offset) * (this.radius * 0.9);
        const startY = Math.sin(t.offset) * (this.radius * 0.2) + (this.radius * 0.4); 
        
        const waveX = Math.sin(time * 0.04 + t.wave + i) * 15;
        const waveY = Math.cos(time * 0.04 + t.wave + i) * 5;

        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(
          startX + waveX, 
          startY + t.len/2, 
          startX + waveX * 1.2, 
          startY + t.len
        );
        ctx.stroke();
      });

      // Draw Body (Jellyfish Dome)
      // Pulsing effect
      const pulse = 1 + Math.sin(this.pulsePhase) * 0.05;
      const currentR = this.radius * pulse;

      ctx.fillStyle = this.colorSet.main;
      ctx.shadowBlur = 15;
      ctx.shadowColor = this.colorSet.glow;
      
      ctx.beginPath();
      // Dome shape
      ctx.arc(0, 0, currentR, Math.PI, 0); 
      // Curved bottom with scallops
      ctx.bezierCurveTo(currentR * 1.1, currentR * 0.5, currentR * 0.5, currentR * 0.8, 0, currentR * 0.5);
      ctx.bezierCurveTo(-currentR * 0.5, currentR * 0.8, -currentR * 1.1, currentR * 0.5, -currentR, 0);
      ctx.fill();

      // Inner Core (Bright Organ)
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#fff';
      ctx.beginPath();
      ctx.arc(0, -currentR * 0.4, currentR * 0.25, 0, Math.PI * 2);
      ctx.fill();
      
      // Secondary organ spot
      ctx.fillStyle = this.colorSet.main;
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.arc(currentR * 0.4, -currentR * 0.2, currentR * 0.1, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.03 + 0.02;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;
      this.vx *= 0.92;
      this.vy *= 0.92;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  // --- Core Functions ---

  function drawNet() {
    // Smooth lerp for net
    net.x += (mouse.x - net.x) * 0.15;
    net.y += (mouse.y - net.y) * 0.15;

    ctx.save();
    ctx.translate(net.x, net.y);
    
    // Slight rotation based on movement
    const rot = (net.x - mouse.x) * 0.002;
    ctx.rotate(rot);

    const r = isMouseDown ? 35 : 50; // Contract on click
    const pulse = Math.sin(time * 0.1) * 2;

    // Outer Ring
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(0, 242, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(0, 242, 255, 0.6)';
    ctx.beginPath();
    ctx.arc(0, 0, r + pulse, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Tech Ring (Dashed)
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.arc(0, 0, r - 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Crosshair
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-15, 0); ctx.lineTo(15, 0);
    ctx.moveTo(0, -15); ctx.lineTo(0, 15);
    ctx.stroke();

    // "Suction" visual
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 1;
      for(let i=0; i<8; i++) {
        ctx.beginPath();
        const rotOffset = (time * 0.2) + (i * 0.8);
        const spiralR = r + 20 + (time % 10);
        ctx.arc(0, 0, spiralR, rotOffset, rotOffset + 0.5);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function drawEnvironment() {
    // Volumetric Lighting (God Rays)
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.04;
    ctx.fillStyle = '#fff';
    
    const rayWidth = 150;
    const rayHeight = height;
    const rayX = width * 0.5 + Math.sin(time * 0.005) * 300;
    
    // Multiple rays
    ctx.beginPath();
    ctx.moveTo(rayX - rayWidth/2, 0);
    ctx.lineTo(rayX + rayWidth/2, 0);
    ctx.lineTo(rayX + rayWidth, rayHeight);
    ctx.lineTo(rayX - rayWidth, rayHeight);
    ctx.fill();
    
    // Secondary faint ray
    ctx.globalAlpha = 0.02;
    const rayX2 = width * 0.2 + Math.sin(time * 0.008 + 2) * 100;
    ctx.beginPath();
    ctx.moveTo(rayX2 - 50, 0);
    ctx.lineTo(rayX2 + 50, 0);
    ctx.lineTo(rayX2 + 100, rayHeight);
    ctx.lineTo(rayX2 - 100, rayHeight);
    ctx.fill();
    
    ctx.restore();

    // Dust / Plankton
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    
    dustParticles.forEach(p => {
      p.y -= p.speedY;
      p.x += p.speedX;
      
      if(p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
      
      ctx.globalAlpha = p.alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1.0;
  }

  function checkCatch() {
    const catchRadius = 60; 
    let caughtAny = false;

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - net.x;
      const dy = c.y - net.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
        caughtAny = true;
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score < 10 ? "0" + score : score;
    
    // FX
    for(let i=0; i<30; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.colorSet.main));
    }

    // Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1500);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 2000);
  }

  function resetGame() {
    initGame();
  }

  // --- Loops ---

  function loop() {
    time++;
    ctx.clearRect(0, 0, width, height);

    // Draw Environment (Dust & Rays)
    drawEnvironment();

    // Sort creatures by size (depth)
    creatures.sort((a, b) => a.radius - b.radius);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // --- Event Listeners ---
  window.addEventListener('resize', resize);
  
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });

  // Touch
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // Start
  resize();
  initGame();
  loop();

</script>
</body>
