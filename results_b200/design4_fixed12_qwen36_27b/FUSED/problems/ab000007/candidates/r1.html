<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina: Capture & Collection</title>
<style>
  :root {
    --bg-deep: #050508;
    --bg-grid: #0a0f18;
    --accent-primary: #00f0ff; /* Cyan */
    --accent-secondary: #bd00ff; /* Purple */
    --accent-highlight: #ff0055; /* Pink */
    --glass-surface: rgba(10, 15, 30, 0.6);
    --glass-border: rgba(255, 255, 255, 0.1);
    --font-display: 'Impact', 'Arial Black', 'Trebuchet MS', sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- 3D Environment --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
    perspective: 800px; /* Sets the depth for the 3D floor */
  }

  /* The Retro Grid Floor */
  .grid-floor {
    position: absolute;
    top: 50%; left: -50%; width: 200%; height: 100%;
    background-image: 
      linear-gradient(var(--glass-border) 1px, transparent 1px),
      linear-gradient(90deg, var(--glass-border) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: rotateX(60deg);
    transform-origin: center top;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,1) 100%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,1) 100%);
    z-index: 0;
    pointer-events: none;
    box-shadow: inset 0 0 100px var(--bg-deep);
  }

  /* Ambient Glow */
  .ambient-glow {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 120%, rgba(189, 0, 255, 0.15), transparent 60%);
    z-index: 1;
    pointer-events: none;
  }

  /* Vignette for depth */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 40%, var(--bg-deep) 95%);
    z-index: 2;
    pointer-events: none;
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 3;
    cursor: none; /* We draw our own cursor */
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Header & Title */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 4rem;
    margin: 0;
    line-height: 0.9;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: white;
    text-shadow: 
      0 0 10px rgba(0, 240, 255, 0.5),
      0 0 20px rgba(0, 240, 255, 0.3);
    transform: skewX(-5deg); /* Dynamic feel */
  }

  .subtitle {
    font-size: 0.9rem;
    color: var(--accent-primary);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 0.5rem;
    font-weight: 600;
    opacity: 0.8;
  }

  /* HUD - Glassmorphism Card */
  .hud-panel {
    background: var(--glass-surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    padding: 0.75rem 2rem;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }

  /* Decorative accent on HUD */
  .hud-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 4px; height: 100%;
    background: var(--accent-primary);
    box-shadow: 0 0 10px var(--accent-primary);
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2rem;
    color: white;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* Footer / Actions */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    margin-bottom: 2rem;
  }

  .btn-main {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(8px);
    border: 1px solid var(--glass-border);
    color: white;
    font-family: var(--font-display);
    font-size: 1.1rem;
    padding: 1rem 3rem;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
    clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%); /* Sci-fi shape */
  }

  .btn-main:hover {
    background: rgba(0, 240, 255, 0.1);
    border-color: var(--accent-primary);
    text-shadow: 0 0 8px var(--accent-primary);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
    transform: translateY(-2px);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 20%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.8);
    border: 1px solid var(--accent-primary);
    color: var(--accent-primary);
    padding: 0.8rem 1.5rem;
    border-radius: 2px;
    font-family: var(--font-display);
    letter-spacing: 0.15em;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    h1 { font-size: 2.5rem; }
    .ui-layer { padding: 1.5rem; }
    .hud-panel { padding: 0.5rem 1rem; }
    .btn-main { width: 100%; padding: 1rem; }
    .grid-floor { background-size: 40px 40px; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- 3D Environment -->
  <div class="grid-floor"></div>
  <div class="ambient-glow"></div>
  <div class="vignette"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Lumina</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-panel">
        <div>
          <div class="stat-value" id="scoreDisplay">00</div>
          <div class="stat-label">Specimens</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">Reset Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Lumina: Capture & Collection
   * Enhanced Visuals:
   * 1. Player: Distinct cursor (Net) with interactive state.
   * 2. Creatures: Jellyfish/Spirit silhouettes with tentacles.
   * 3. Environment: 3D perspective floor (CSS) + atmospheric fog.
   * 4. UI: Glassmorphism, improved hierarchy, no red blobs.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let stars = []; // Background stars
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let time = 0;

  // Configuration
  const COLORS = ['#00f0ff', '#bd00ff', '#00ff9d']; // Cyan, Purple, Lime
  const CREATURE_COUNT = 5;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initStars();
  }
  window.addEventListener('resize', resize);
  
  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Star {
    constructor() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.size = Math.random() * 1.5;
      this.alpha = Math.random();
      this.speed = Math.random() * 0.02;
    }
    update() {
      this.alpha += this.speed;
      if (this.alpha > 1 || this.alpha < 0.2) this.speed *= -1;
    }
    draw(ctx) {
      ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * 0.5})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += 0.1; // Gravity
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset();
      // Initial random placement
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    }

    reset() {
      // Spawn off-screen or edges
      this.x = Math.random() < 0.5 ? -50 : width + 50;
      this.y = Math.random() * (height * 0.6); // Keep them mostly in upper/mid view
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.radius = Math.random() * 15 + 20;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.wobble = Math.random() * Math.PI * 2;
      this.isCaught = false;
      this.tentacles = [];
      
      // Generate tentacle data
      for(let i=0; i<5; i++) {
        this.tentacles.push({
          angle: (Math.PI / 4) + (i * 0.15), // Spread out
          length: Math.random() * 20 + 10,
          offset: Math.random() * Math.PI * 2
        });
      }
    }

    update() {
      if (this.isCaught) return;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.wobble += 0.05;
      
      // Float vertically slightly
      this.y += Math.sin(this.wobble) * 0.5;

      // Bounce/Wrap
      if (this.x < -100) this.x = width + 100;
      if (this.x > width + 100) this.x = -100;
      if (this.y < 0 || this.y > height) this.vy *= -1;

      // Avoid Mouse (Net)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 180) {
        // Flee behavior - push away gently
        const force = (180 - dist) / 180;
        this.vx += (dx / dist) * force * 0.8;
        this.vy += (dy / dist) * force * 0.8;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 3) {
        this.vx = (this.vx / speed) * 3;
        this.vy = (this.vy / speed) * 3;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Glow
      ctx.shadowBlur = 15;
      ctx.shadowColor = this.color;
      
      // Draw Tentacles (Back)
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      
      this.tentacles.forEach(t => {
        ctx.beginPath();
        const wave = Math.sin(time * 0.05 + t.offset) * 10;
        const startX = 0;
        const startY = this.radius * 0.5;
        const endX = Math.cos(t.angle) * t.length + wave;
        const endY = startY + Math.sin(t.angle) * t.length;
        
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(startX + wave/2, startY + 10, endX, endY);
        ctx.stroke();
      });

      // Draw Main Body (Jellyfish Dome)
      ctx.fillStyle = this.color;
      ctx.beginPath();
      // Dome shape
      ctx.arc(0, 0, this.radius, Math.PI, 0); 
      // Scalloped bottom
      ctx.quadraticCurveTo(this.radius, this.radius * 0.8, this.radius * 0.6, this.radius * 0.6);
      ctx.quadraticCurveTo(this.radius * 0.3, this.radius * 0.4, 0, this.radius * 0.6);
      ctx.quadraticCurveTo(-this.radius * 0.3, this.radius * 0.4, -this.radius * 0.6, this.radius * 0.6);
      ctx.quadraticCurveTo(-this.radius, this.radius * 0.8, -this.radius, 0);
      ctx.fill();

      // Inner Core (Bright center)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(0, -this.radius * 0.2, this.radius * 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function initStars() {
    stars = [];
    for(let i=0; i<50; i++) {
      stars.push(new Star());
    }
  }

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = "00";
  }

  function checkCatch() {
    const catchRadius = 70; 

    let caughtAny = false;
    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
        caughtAny = true;
      }
    });
    
    if (caughtAny) {
      // Button pulse effect logic could go here
    }
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score < 10 ? "0" + score : score;
    
    // Visual FX
    for(let i=0; i<20; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1500);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 2500);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Glow
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#00f0ff';
    
    const baseRadius = isMouseDown ? 50 : 60; // Contract when clicking
    
    // Outer Ring
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(0, 240, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, baseRadius, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner Tech Ring
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.arc(0, 0, baseRadius - 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Crosshair
    ctx.beginPath();
    ctx.moveTo(-15, 0); ctx.lineTo(-5, 0);
    ctx.moveTo(15, 0); ctx.lineTo(5, 0);
    ctx.moveTo(0, -15); ctx.lineTo(0, -5);
    ctx.moveTo(0, 15); ctx.lineTo(0, 5);
    ctx.stroke();

    // Sucking effect visual if held
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.beginPath();
      ctx.arc(0, 0, 80, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    time++;
    ctx.clearRect(0, 0, width, height);

    // Draw Stars (Background)
    stars.forEach(s => {
      s.update();
      s.draw(ctx);
    });

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  resize();
  init();
  loop();

</script>
</body>
</html>
