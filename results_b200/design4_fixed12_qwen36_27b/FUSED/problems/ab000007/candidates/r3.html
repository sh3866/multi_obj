<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aetheris: The Deep Catch</title>
<style>
  :root {
    --bg-deep: #010205;
    --accent-cyan: #00f2ff;
    --accent-purple: #bd00ff;
    --accent-lime: #00ff9d;
    --accent-pink: #ff0055;
    --glass-surface: rgba(1, 2, 5, 0.6);
    --glass-border: rgba(255, 255, 255, 0.08);
    --font-display: 'Impact', 'Arial Black', 'Helvetica Neue', sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Environment Layers --- */
  .scene-wrapper {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 120%, #0d2b52 0%, transparent 60%),
                radial-gradient(circle at 10% 10%, rgba(60, 0, 100, 0.15) 0%, transparent 40%),
                linear-gradient(to bottom, #010205, #050a14);
  }

  /* Canvas Layer */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 2;
  }

  /* Vignette & Film Grain */
  .overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.85) 100%);
    z-index: 3;
    pointer-events: none;
    box-shadow: inset 0 0 150px rgba(0,0,0,0.95);
  }

  /* Scanlines */
  .scanlines {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
    background-size: 100% 4px;
    z-index: 4;
    pointer-events: none;
    opacity: 0.5;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(20px, 5vw, 60px);
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    text-transform: uppercase;
    transform: skewX(-10deg); /* Stylized lean */
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(3rem, 8vw, 6rem);
    margin: 0;
    letter-spacing: -0.02em;
    line-height: 0.9;
    background: linear-gradient(to bottom, #fff 40%, var(--accent-cyan) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 15px rgba(0, 242, 255, 0.4));
    text-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
  }

  .subtitle {
    font-size: clamp(0.8rem, 1.5vw, 1.1rem);
    font-weight: 600;
    letter-spacing: 0.4em;
    color: #fff;
    margin-top: 10px;
    opacity: 0.8;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    border-left: 3px solid var(--accent-cyan);
    padding-left: 10px;
  }

  /* HUD Container */
  .hud-container {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .hud-panel {
    background: rgba(0, 20, 40, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 242, 255, 0.3);
    border-right: 4px solid var(--accent-cyan);
    padding: 15px 25px;
    border-radius: 4px 0 0 4px;
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    transform: skewX(-10deg);
    transition: all 0.3s ease;
  }

  .hud-panel:hover {
    background: rgba(0, 30, 60, 0.8);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
  }

  .specimen-icon {
    width: 40px; height: 40px;
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  .specimen-icon::before {
    content: ''; width: 12px; height: 12px;
    background: var(--accent-cyan);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent-cyan);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.8); opacity: 0.5; }
    50% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(0.8); opacity: 0.5; }
  }

  .stat-group {
    display: flex;
    flex-direction: column;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2.5rem;
    line-height: 1;
    color: white;
    letter-spacing: 0.05em;
  }

  .stat-label {
    font-size: 0.7rem;
    color: var(--accent-cyan);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 700;
  }

  /* Footer / Action Button */
  .footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: auto;
    padding-bottom: 40px;
  }

  .btn-main {
    position: relative;
    background: linear-gradient(180deg, #003c4d 0%, #001a24 100%);
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    font-family: var(--font-display);
    font-size: 1.5rem;
    padding: 1.2rem 5rem;
    border-radius: 2px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    transition: all 0.2s ease;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(0, 242, 255, 0.1), inset 0 0 20px rgba(0, 242, 255, 0.05);
    text-shadow: 0 0 8px var(--accent-cyan);
  }

  /* Button Shine */
  .btn-main::after {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 242, 255, 0.4), transparent);
    transform: skewX(-20deg);
    transition: 0.5s;
  }

  .btn-main:hover {
    background: #00506b;
    box-shadow: 0 0 40px rgba(0, 242, 255, 0.4), inset 0 0 20px rgba(0, 242, 255, 0.2);
    color: #fff;
    transform: scale(1.02);
  }

  .btn-main:hover::after {
    left: 150%;
    transition: 0.7s;
  }

  .btn-main:active {
    transform: scale(0.98);
  }

  /* Toast */
  .toast {
    position: absolute;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0,0,0,0.8);
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    padding: 1.5rem 3rem;
    font-family: var(--font-display);
    letter-spacing: 0.2em;
    font-size: 1.5rem;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 50px rgba(0, 242, 255, 0.3);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

</style>
</head>
<body>

<div class="scene-wrapper">
  <div class="atmosphere"></div>
  <canvas id="gameCanvas"></canvas>
  <div class="overlay"></div>
  <div class="scanlines"></div>

  <!-- UI Layer -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Aetheris</h1>
        <div class="subtitle">Deep Dive Collection</div>
      </div>
      <div class="hud-container">
        <div class="hud-panel">
          <div class="specimen-icon"></div>
          <div class="stat-group">
            <div class="stat-value" id="scoreDisplay">00</div>
            <div class="stat-label">Specimens</div>
          </div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">Open Case</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Aetheris: The Deep Catch - Design Revision
   * 
   * Key Visual Changes:
   * 1. Light Sources: Creatures act as point lights using additive blending.
   * 2. Density: Increased creature count and varied sizes for depth (parallax).
   * 3. Typography: Bolder, skewed, high-contrast HUD.
   * 4. Button: Solid, glowing, textured action button.
   */

  const gameCanvas = document.getElementById('gameCanvas');
  const ctx = gameCanvas.getContext('2d', { alpha: true });
  
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let dustParticles = [];
  let creatures = [];
  
  // Input State
  let mouse = { x: -1000, y: -1000 };
  let net = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let time = 0;

  // Config
  const COLORS = [
    { main: '#00f2ff', glow: '#00f2ff' }, // Cyan
    { main: '#bd00ff', glow: '#bd00ff' }, // Purple
    { main: '#00ff9d', glow: '#00ff9d' }, // Lime
    { main: '#ff0055', glow: '#ff0055' }  // Pink
  ];
  const CREATURE_COUNT = 12; // Increased density

  // --- Initialization ---

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    
    gameCanvas.width = width;
    gameCanvas.height = height;

    initDust();
  }

  function initDust() {
    dustParticles = [];
    // Increased dust count for atmosphere
    for(let i=0; i<150; i++) {
      dustParticles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 1.5,
        speedY: Math.random() * 0.3 + 0.05,
        speedX: (Math.random() - 0.5) * 0.1,
        alpha: Math.random() * 0.4
      });
    }
  }

  function initGame() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = "00";
  }

  // --- Classes ---

  class Creature {
    constructor() {
      this.reset();
      // Random start pos to fill screen initially
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    }

    reset() {
      // Spawn at edges
      const side = Math.floor(Math.random() * 4);
      if(side === 0) { this.x = Math.random() * width; this.y = -150; }
      else if(side === 1) { this.x = width + 150; this.y = Math.random() * height; }
      else if(side === 2) { this.x = Math.random() * width; this.y = height + 150; }
      else { this.x = -150; this.y = Math.random() * height; }

      this.vx = (Math.random() - 0.5) * 0.8;
      this.vy = (Math.random() - 0.5) * 0.8;
      
      // Varied sizes for depth
      this.sizeClass = Math.random(); 
      this.radius = (this.sizeClass > 0.7 ? 25 : 15) + (Math.random() * 10); 
      
      this.colorSet = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.wobble = Math.random() * Math.PI * 2;
      this.isCaught = false;
      this.opacity = 0; 
      
      // Tentacles
      this.tentacles = [];
      const tentCount = Math.floor(Math.random() * 3) + 4;
      for(let i=0; i<tentCount; i++) {
        this.tentacles.push({
          offset: (i / tentCount) * Math.PI,
          len: Math.random() * 30 + 20,
          wave: Math.random() * Math.PI
        });
      }
    }

    update() {
      if (this.isCaught) return;

      // Fade in
      if (this.opacity < 1) this.opacity += 0.005;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.wobble += 0.02;
      this.y += Math.sin(this.wobble) * 0.15; // Bobbing

      // Mouse Interaction (Flee)
      const dx = this.x - net.x;
      const dy = this.y - net.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      // Flee radius based on size (smaller ones are skittish)
      const fleeDist = 150 + this.radius;
      
      if (dist < fleeDist) {
        const force = (fleeDist - dist) / fleeDist;
        this.vx += (dx / dist) * force * 0.3;
        this.vy += (dy / dist) * force * 0.3;
      }

      // Friction & Speed Limit
      this.vx *= 0.98;
      this.vy *= 0.98;
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      const maxSpeed = 2 + (this.sizeClass * 1.5);
      if (speed > maxSpeed) {
        this.vx = (this.vx / speed) * maxSpeed;
        this.vy = (this.vy / speed) * maxSpeed;
      }

      // Bounds (Soft bounce)
      if (this.x < -50) this.vx += 0.1;
      if (this.x > width + 50) this.vx -= 0.1;
      if (this.y < -50) this.vy += 0.1;
      if (this.y > height + 50) this.vy -= 0.1;
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.globalAlpha = this.opacity;
      ctx.translate(this.x, this.y);
      
      // --- LIGHTING EFFECT ---
      // Additive blending to make creatures glow against the dark background
      ctx.globalCompositeOperation = 'screen'; 
      
      // Outer Glow (Light Source)
      const gradient = ctx.createRadialGradient(0, 0, this.radius * 0.5, 0, 0, this.radius * 4);
      gradient.addColorStop(0, this.colorSet.glow);
      gradient.addColorStop(1, 'transparent');
      
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * 4, 0, Math.PI * 2);
      ctx.fill();

      // Reset blend for the body drawing
      ctx.globalCompositeOperation = 'source-over';

      // Draw Tentacles
      ctx.strokeStyle = this.colorSet.main;
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      
      this.tentacles.forEach((t, i) => {
        ctx.beginPath();
        const startX = Math.cos(t.offset) * (this.radius * 0.8);
        const startY = Math.sin(t.offset) * (this.radius * 0.2); 
        
        const waveX = Math.sin(time * 0.05 + t.wave) * 10;
        const waveY = Math.cos(time * 0.05 + t.wave) * 5;

        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(
          startX + waveX, 
          startY + t.len/2, 
          startX + waveX * 1.5, 
          startY + t.len
        );
        ctx.stroke();
      });

      // Draw Body (Jellyfish Dome)
      ctx.fillStyle = this.colorSet.main;
      ctx.shadowBlur = 15;
      ctx.shadowColor = this.colorSet.glow;
      
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, Math.PI, 0); 
      ctx.quadraticCurveTo(this.radius * 0.8, this.radius * 0.6, this.radius * 0.6, this.radius * 0.4);
      ctx.quadraticCurveTo(0, this.radius * 0.2, -this.radius * 0.6, this.radius * 0.4);
      ctx.quadraticCurveTo(-this.radius * 0.8, this.radius * 0.6, -this.radius, 0);
      ctx.fill();

      // Inner Core (Bright)
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 5;
      ctx.beginPath();
      ctx.arc(0, -this.radius * 0.3, this.radius * 0.25, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.015;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  // --- Core Functions ---

  function drawNet() {
    // Smooth lerp for net
    net.x += (mouse.x - net.x) * 0.12;
    net.y += (mouse.y - net.y) * 0.12;

    ctx.save();
    ctx.translate(net.x, net.y);
    
    // Slight rotation based on movement
    const rot = (net.x - mouse.x) * 0.003;
    ctx.rotate(rot);

    const r = isMouseDown ? 45 : 55; // Contract on click

    // Outer Ring
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(0, 242, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(0, 242, 255, 0.8)';
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Tech Ring (Dashed)
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, r - 8, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Crosshair
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-10, 0); ctx.lineTo(10, 0);
    ctx.moveTo(0, -10); ctx.lineTo(0, 10);
    ctx.stroke();

    // "Suction" visual
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 1;
      for(let i=0; i<4; i++) {
        ctx.beginPath();
        ctx.arc(0, 0, r + 10 + (time % 20), i * 1.5, i * 1.5 + 0.5);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function drawEnvironment() {
    // We draw dust on the main canvas to integrate with lighting
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    
    dustParticles.forEach(p => {
      p.y -= p.speedY;
      p.x += p.speedX;
      
      if(p.y < 0) { p.y = height; p.x = Math.random() * width; }
      
      ctx.globalAlpha = p.alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1.0;
  }

  function checkCatch() {
    const catchRadius = 60; 
    let caughtAny = false;

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - net.x;
      const dy = c.y - net.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
        caughtAny = true;
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score < 10 ? "0" + score : score;
    
    // FX
    for(let i=0; i<30; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.colorSet.main));
    }

    // Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1500);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 2000);
  }

  function resetGame() {
    initGame();
  }

  // --- Loops ---

  function loop() {
    time++;
    ctx.clearRect(0, 0, width, height);

    // Draw Environment (Dust)
    drawEnvironment();

    // Sort creatures by size (depth) so smaller ones are drawn first (further away)
    creatures.sort((a, b) => a.radius - b.radius);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // --- Event Listeners ---
  window.addEventListener('resize', resize);
  
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });

  // Touch
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // Start
  resize();
  initGame();
  loop();

</script>
</body>
</html>
