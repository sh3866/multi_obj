<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm Storybook & Garden */
            --bg-paper: #F2E8D5;
            --bg-paper-dark: #E6D7B8;
            --board-wood: #5D4037;
            --board-shadow: #3E2723;
            --board-inner: #FFF8E1;
            
            /* Game Elements */
            --path-idle: #D7CCC8; /* Faint wood grain path */
            --path-active: #43A047; /* Vibrant Garden Green */
            --path-glow: #A5D6A7;
            
            /* UI */
            --btn-primary: #FF7043;
            --btn-primary-dark: #D84315;
            --btn-secondary: #90A4AE;
            --btn-secondary-dark: #607D8B;
            
            /* Dimensions */
            --board-size: min(92vw, 560px);
            --gap: 6px;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-paper);
            /* Paper Texture Pattern */
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0,0,0,0.03) 1px, transparent 1px),
                radial-gradient(circle at 80% 80%, rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 40px 40px, 40px 40px, 20px 20px, 20px 20px;
            font-family: 'Georgia', serif;
            color: #3E2723;
            overflow: hidden;
        }

        /* --- Typography & Header --- */
        header {
            margin-bottom: 1.5rem;
            text-align: center;
            z-index: 10;
            position: relative;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 3.2rem;
            margin: 0;
            font-weight: 900;
            color: #4E342E;
            /* Storybook Title Style */
            font-family: 'Georgia', serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 
                2px 2px 0px #FFF8E1, 
                4px 4px 0px rgba(0,0,0,0.1);
            line-height: 1;
        }

        .subtitle {
            font-family: 'Courier New', monospace; /* Typewriter style */
            font-weight: bold;
            font-size: 1rem;
            color: #8D6E63;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(255,255,255,0.8);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px dashed #A1887F;
            box-shadow: 0 2px 0 rgba(0,0,0,0.05);
        }

        /* --- The Game Board --- */
        .game-frame {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            background: var(--board-wood);
            border-radius: 12px;
            padding: 12px;
            /* Deep, tactile shadow for depth */
            box-shadow: 
                0 20px 40px -10px rgba(0,0,0,0.4),
                0 10px 0 var(--board-shadow);
            border: 4px solid #3E2723;
        }

        /* Wood grain accent on frame */
        .game-frame::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            pointer-events: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100%;
            height: 100%;
            gap: var(--gap);
            background: var(--board-wood); /* Gap color matches frame */
            border-radius: 4px;
            overflow: hidden;
        }

        .tile {
            background-color: var(--board-inner);
            position: relative;
            cursor: pointer;
            border-radius: 2px;
            /* Inner shadow for tile depth */
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05), inset -1px -1px 0 rgba(255,255,255,0.8);
            transition: background-color 0.2s;
        }

        .tile:hover {
            background-color: #FFFDE7;
        }

        /* SVG Paths: Thick, "Rope" like */
        .tile svg {
            width: 100%;
            height: 100%;
            stroke: var(--path-idle);
            stroke-width: 18; /* Thicker, rope-like */
            stroke-linecap: round;
            fill: none;
            /* Dashed look for unlit path */
            stroke-dasharray: 12 4; 
            transition: all 0.4s ease;
            filter: grayscale(0.8) opacity(0.4);
        }

        /* Active State: Solid, Green Vine/Rope */
        .tile.active svg {
            stroke: var(--path-active);
            stroke-dasharray: 0; /* Solid line */
            filter: grayscale(0) opacity(1) drop-shadow(0 2px 2px rgba(67, 160, 71, 0.3));
        }

        /* --- Tokens (Cub & Star) --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
            /* Ensure tokens don't clip out of frame */
            overflow: hidden; 
        }

        /* The Bear Cub Token - SVG for crispness */
        .cub-token {
            position: absolute;
            width: 85%; /* Fits nicely inside cell */
            height: 85%;
            transform: translate(-50%, -50%);
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 30;
            filter: drop-shadow(0 4px 3px rgba(0,0,0,0.3));
        }

        /* Star Marker */
        .star-marker {
            position: absolute;
            width: 70%;
            height: 70%;
            transform: translate(-50%, -50%);
            color: #FFCA28;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
            animation: floatStar 3s infinite ease-in-out;
            z-index: 15;
        }

        @keyframes floatStar {
            0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            50% { transform: translate(-50%, -50%) scale(1.15) rotate(10deg); }
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Footer Controls --- */
        footer {
            margin-top: 2rem;
            display: flex;
            gap: 1.5rem;
            z-index: 10;
            width: var(--board-size);
            justify-content: center;
        }

        button {
            font-family: 'Georgia', serif;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: 1;
            max-width: 200px;
            position: relative;
            top: 0;
            /* Stitching effect */
            box-shadow: 
                inset 0 0 0 2px rgba(255,255,255,0.2), /* Inner highlight */
                0 6px 0 var(--btn-secondary-dark), /* 3D depth */
                0 10px 10px rgba(0,0,0,0.2); /* Drop shadow */
        }

        button:active {
            transform: translateY(6px);
            box-shadow: 
                inset 0 0 0 2px rgba(255,255,255,0.2),
                0 0 0 var(--btn-secondary-dark), 
                inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .btn-reset {
            background: var(--btn-secondary);
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .btn-run {
            background: var(--btn-primary);
            color: #fff;
            box-shadow: 
                inset 0 0 0 2px rgba(255,255,255,0.3),
                0 6px 0 var(--btn-primary-dark),
                0 10px 15px rgba(216, 67, 21, 0.3);
        }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 248, 225, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(2px);
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-size: 4rem;
            color: var(--btn-primary);
            margin: 0;
            transform: rotate(-3deg);
            font-family: 'Georgia', serif;
            text-shadow: 2px 2px 0 #FFE0B2;
        }
        .overlay p {
            font-size: 1.4rem;
            color: #5D4037;
            margin-bottom: 2rem;
            font-style: italic;
        }

        /* Responsive */
        @media (max-width: 600px) {
            :root { --board-size: 94vw; }
            h1 { font-size: 2.4rem; }
            .subtitle { font-size: 0.9rem; }
            footer { flex-direction: row; gap: 10px; }
            button { font-size: 0.9rem; padding: 10px 16px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 1: The Garden</div>
    </header>

    <div class="game-frame">
        <!-- The Grid -->
        <div class="grid" id="grid"></div>
        
        <!-- Tokens Layer -->
        <div class="token-layer">
            <!-- SVG Cub Token -->
            <div class="cub-token" id="cub">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Ears -->
                    <circle cx="25" cy="30" r="12" fill="#8D6E63" stroke="#3E2723" stroke-width="2"/>
                    <circle cx="75" cy="30" r="12" fill="#8D6E63" stroke="#3E2723" stroke-width="2"/>
                    <circle cx="25" cy="30" r="6" fill="#D7CCC8"/>
                    <circle cx="75" cy="30" r="6" fill="#D7CCC8"/>
                    <!-- Body -->
                    <path d="M25 100 V65 C25 50 35 45 50 45 C65 45 75 50 75 65 V100 Z" fill="#8D6E63" stroke="#3E2723" stroke-width="2"/>
                    <!-- Head -->
                    <circle cx="50" cy="45" r="24" fill="#8D6E63" stroke="#3E2723" stroke-width="2"/>
                    <!-- Snout -->
                    <ellipse cx="50" cy="52" rx="14" ry="10" fill="#D7CCC8" stroke="#3E2723" stroke-width="2"/>
                    <!-- Nose -->
                    <path d="M45 50 Q50 45 55 50 Q50 56 45 50" fill="#3E2723"/>
                    <!-- Eyes -->
                    <circle cx="40" cy="40" r="2.5" fill="#3E2723">
                        <animate attributeName="r" values="2.5;0;2.5" dur="4s" repeatCount="indefinite" keyTimes="0;0.05;0.1"/>
                    </circle>
                    <circle cx="60" cy="40" r="2.5" fill="#3E2723">
                        <animate attributeName="r" values="2.5;0;2.5" dur="4s" repeatCount="indefinite" keyTimes="0;0.05;0.1"/>
                    </circle>
                </svg>
            </div>

            <!-- SVG Star Marker -->
            <div class="star-marker" id="star">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run Path</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        // --- Game Logic & Drawing ---

        const GRID_SIZE = 6;
        
        // Tile Types (SVG Paths)
        // Coordinates: Top(50,0), Right(100,50), Bottom(50,100), Left(0,50)
        // Note: SVG coordinates start top-left.
        const TILE_TYPES = {
            EMPTY: { paths: [] },
            LINE: { paths: ['M50 0 V100'], con: [1,0,1,0] }, // Vertical
            LINE_H: { paths: ['M0 50 H100'], con: [0,1,0,1] }, // Horizontal
            CORNER_TR: { paths: ['M50 0 V50 H100'], con: [1,1,0,0] },
            CORNER_BR: { paths: ['M100 50 V100 H50'], con: [0,1,1,0] },
            CORNER_BL: { paths: ['M0 50 V100 H50'], con: [0,0,1,1] },
            CORNER_TL: { paths: ['M50 0 V50 H0'], con: [1,0,0,1] },
            T_UP: { paths: ['M0 50 H100 M50 50 V100'], con: [0,1,1,1] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,0,1,1] },
            T_LEFT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,1,1,0] }
        };

        // Helper to draw SVG
        function createSVG(paths) {
            let svgContent = paths.map(p => `<path d="${p}" />`).join('');
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svgContent}</svg>`;
        }

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; // Store DOM elements
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 4}; 
                this.cubPos = {x: 0, y: 0};
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const tileType = this.getTileType(x, y);
                        const div = document.createElement('div');
                        div.className = 'tile';
                        div.innerHTML = createSVG(tileType.paths);
                        
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            // Determine tile visual based on neighbors to ensure path continuity
            getTileType(x, y) {
                // Hardcoded specific layout for visual consistency in this demo
                const layout = [
                    ['C_TL', 'L', 'C_TR', 'L', 'C_TL', 'L'],
                    ['L', 'C_BR', 'L', 'C_TL', 'L', 'L'],
                    ['L', 'L', 'C_BL', 'C_BR', 'C_BL', 'C_BR'],
                    ['L', 'C_TL', 'L', 'L', 'C_BL', 'L'],
                    ['C_TR', 'L', 'C_BL', 'C_BR', 'L', 'L'],
                    ['L', 'L', 'L', 'L', 'L', 'L']
                ];

                const key = layout[y][x];
                
                const map = {
                    'L': TILE_TYPES.LINE,
                    'C_TL': TILE_TYPES.CORNER_TL,
                    'C_TR': TILE_TYPES.CORNER_TR,
                    'C_BL': TILE_TYPES.CORNER_BL,
                    'C_BR': TILE_TYPES.CORNER_BR,
                    'C': TILE_TYPES.CORNER_TL 
                };
                
                return map[key] || TILE_TYPES.EMPTY;
            }

            updateTokenPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tile svg').forEach(s => s.style.stroke = ''); // Reset inline styles if any
                this.cubPos = {x: 0, y: 0};
                this.updateTokenPosition(0, 0);
            }

            async run() {
                // Correct path to Star at 5,4
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:4, y:4}, {x:4, y:3}, 
                    {x:5, y:3}, {x:5, y:4} // Star
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    
                    // Highlight tile
                    const tile = this.cells[step.y][step.x];
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateTokenPosition(step.x, step.y);
                    
                    // Wait
                    await new Promise(r => setTimeout(r, 350));
                }

                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 200);
            }
        }

        const game = new Game();

    </script>
</body>
</html>
