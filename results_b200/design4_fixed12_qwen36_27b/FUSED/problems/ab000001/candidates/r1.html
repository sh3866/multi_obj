<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm Storybook */
            --bg-wood-light: #D7CCC8;
            --bg-wood-dark: #8D6E63;
            --board-bg: #EFEBE9;
            --board-inner: #FFF8E1; /* Creamy paper */
            --ink-primary: #3E2723;
            --ink-faint: #A1887F;
            
            /* Game Elements */
            --path-idle: #D7CCC8; /* Very faint path */
            --path-active: #E65100; /* Vibrant Burnt Orange */
            --path-glow: #FFCC80;
            
            /* Dimensions */
            --board-size: min(90vw, 580px);
            --tile-size: calc(var(--board-size) / 6);
            --gap: 6px;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Wood texture background */
            background-color: var(--bg-wood-light);
            background-image: 
                linear-gradient(90deg, rgba(255,255,255,0.1) 50%, transparent 50%),
                linear-gradient(rgba(255,255,255,0.1) 50%, transparent 50%);
            background-size: 40px 40px;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: var(--ink-primary);
            overflow: hidden;
        }

        /* --- Typography & Header --- */
        header {
            margin-bottom: 1.5rem;
            text-align: center;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            font-weight: 900;
            color: var(--ink-primary);
            text-shadow: 2px 2px 0px rgba(255,255,255,0.4);
            letter-spacing: -1px;
            font-family: 'Georgia', serif;
            line-height: 0.9;
        }

        .subtitle {
            /* Unified font family but distinct weight */
            font-family: 'Georgia', serif; 
            font-style: italic;
            font-size: 1.2rem;
            color: var(--ink-faint);
            margin-top: 0.5rem;
            background: rgba(255,255,255,0.6);
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.8);
        }

        /* --- The Game Board --- */
        .game-frame {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            background: var(--board-bg);
            border-radius: 16px;
            padding: 12px;
            /* Softened, illustrative border */
            box-shadow: 
                0 15px 35px rgba(62, 39, 35, 0.3), /* Deep drop shadow */
                0 5px 0 #5D4037, /* Solid bottom lip */
                inset 0 0 20px rgba(0,0,0,0.05);
            border: 2px solid rgba(255,255,255,0.3);
        }

        /* Wood grain effect on the frame */
        .game-frame::before {
            content: '';
            position: absolute;
            top: -12px; left: -12px; right: -12px; bottom: -12px;
            border-radius: 22px;
            border: 2px solid rgba(93, 64, 55, 0.1);
            z-index: -1;
            pointer-events: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100%;
            height: 100%;
            gap: var(--gap);
            background: rgba(93, 64, 55, 0.1); /* Subtle gap color */
            border-radius: 8px;
            overflow: hidden;
        }

        .tile {
            background-color: var(--board-inner);
            position: relative;
            cursor: pointer;
            border-radius: 4px;
            transition: transform 0.2s ease, background-color 0.2s;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
        }

        .tile:hover {
            background-color: #FFFDE7;
            z-index: 2;
        }

        /* SVG Paths: Thick and Vibrant */
        .tile svg {
            width: 100%;
            height: 100%;
            stroke: var(--path-idle); /* Default faint color */
            stroke-width: 14; /* Thicker paths */
            stroke-linecap: round;
            fill: none;
            transition: stroke 0.4s ease, filter 0.4s ease;
            filter: grayscale(0.5) opacity(0.6); /* Muted initially */
        }

        /* Active State for Paths */
        .tile.active svg {
            stroke: var(--path-active);
            filter: grayscale(0) opacity(1) drop-shadow(0 0 2px var(--path-glow));
        }

        /* --- Tokens (Cub & Star) --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        /* The Bear Cub Token - Illustrated via CSS */
        .cub-token {
            position: absolute;
            width: 80%;
            height: 80%;
            transform: translate(-50%, -50%);
            transition: top 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 30;
        }

        /* Bear Body */
        .cub-body {
            position: absolute;
            bottom: 0; left: 10%; width: 80%; height: 70%;
            background: #8D6E63;
            border-radius: 40% 40% 45% 45%;
            box-shadow: 0 4px 0 #5D4037;
            z-index: 1;
        }

        /* Bear Head */
        .cub-head {
            position: absolute;
            top: 15%; left: 10%; width: 80%; height: 65%;
            background: #8D6E63;
            border-radius: 45%;
            z-index: 2;
            box-shadow: 0 4px 0 #5D4037;
        }

        /* Ears */
        .cub-ear {
            position: absolute;
            top: 5%; width: 25%; height: 25%;
            background: #8D6E63;
            border-radius: 50%;
            z-index: 1;
            box-shadow: inset 0 -2px 0 #5D4037;
        }
        .cub-ear.left { left: 5%; }
        .cub-ear.right { right: 5%; }
        
        /* Inner Ears */
        .cub-ear::after {
            content: '';
            position: absolute;
            top: 30%; left: 25%; width: 50%; height: 50%;
            background: #D7CCC8;
            border-radius: 50%;
        }

        /* Face details */
        .cub-snout {
            position: absolute;
            bottom: 20%; left: 25%; width: 50%; height: 35%;
            background: #D7CCC8;
            border-radius: 40%;
            z-index: 3;
        }

        .cub-nose {
            position: absolute;
            top: 15%; left: 35%; width: 30%; height: 40%;
            background: #3E2723;
            border-radius: 50% 50% 40% 40%;
            z-index: 4;
        }

        .cub-eye {
            position: absolute;
            top: 40%; width: 10%; height: 12%;
            background: #3E2723;
            border-radius: 50%;
            z-index: 3;
            animation: blink 4s infinite;
        }
        .cub-eye.left { left: 25%; }
        .cub-eye.right { right: 25%; }

        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        /* Star Marker */
        .star-marker {
            position: absolute;
            width: 60%;
            height: 60%;
            transform: translate(-50%, -50%);
            color: #FFC107;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            animation: floatStar 3s infinite ease-in-out;
            z-index: 15;
        }

        @keyframes floatStar {
            0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            50% { transform: translate(-50%, -50%) scale(1.1) rotate(10deg); }
        }

        /* --- Footer Controls --- */
        footer {
            margin-top: 2rem;
            display: flex;
            gap: 1.5rem;
            z-index: 10;
            width: var(--board-size);
            justify-content: center;
        }

        button {
            font-family: 'Georgia', serif;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 14px 32px;
            border: none;
            border-radius: 50px; /* Fully rounded pill shape */
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: 1;
            max-width: 200px;
            position: relative;
            top: 0;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: none !important;
        }

        .btn-reset {
            background: #fff;
            color: var(--ink-faint);
            box-shadow: 0 4px 0 #CFD8DC, 0 8px 10px rgba(0,0,0,0.1);
        }
        .btn-reset:hover {
            background: #FAFAFA;
            color: var(--ink-primary);
        }

        .btn-run {
            background: #FF7043; /* Playful Coral/Orange */
            color: #fff;
            box-shadow: 0 4px 0 #D84315, 0 8px 15px rgba(216, 67, 21, 0.3);
        }
        .btn-run:hover {
            background: #FF8A65;
        }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-size: 4rem;
            color: #FF7043;
            margin: 0;
            transform: rotate(-5deg);
            text-shadow: 3px 3px 0 #FFE0B2;
        }
        .overlay p {
            font-size: 1.5rem;
            color: var(--ink-faint);
            margin-bottom: 2rem;
        }

        /* Responsive */
        @media (max-width: 600px) {
            :root { --board-size: 92vw; }
            h1 { font-size: 2.5rem; }
            .subtitle { font-size: 1rem; }
            footer { flex-direction: row; gap: 10px; }
            button { font-size: 1rem; padding: 12px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 1: The Garden</div>
    </header>

    <div class="game-frame">
        <!-- The Grid -->
        <div class="grid" id="grid"></div>
        
        <!-- Tokens Layer -->
        <div class="token-layer">
            <!-- Illustrated Cub -->
            <div class="cub-token" id="cub">
                <div class="cub-ear left"></div>
                <div class="cub-ear right"></div>
                <div class="cub-body"></div>
                <div class="cub-head">
                    <div class="cub-eye left"></div>
                    <div class="cub-eye right"></div>
                    <div class="cub-snout">
                        <div class="cub-nose"></div>
                    </div>
                </div>
            </div>

            <!-- Star Marker -->
            <div class="star-marker" id="star">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run Path</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        // --- Game Logic & Drawing ---

        const GRID_SIZE = 6;
        
        // Tile Types (SVG Paths)
        // Coordinates: Top(0,50), Right(50,100), Bottom(100,50), Left(50,0)
        const TILE_TYPES = {
            EMPTY: { paths: [] },
            LINE: { paths: ['M50 0 V100'], con: [1,0,1,0] }, // Vertical
            LINE_H: { paths: ['M0 50 H100'], con: [0,1,0,1] }, // Horizontal
            CORNER_TR: { paths: ['M50 0 V50 H100'], con: [1,1,0,0] },
            CORNER_BR: { paths: ['M100 50 V100 H50'], con: [0,1,1,0] },
            CORNER_BL: { paths: ['M0 50 V100 H50'], con: [0,0,1,1] },
            CORNER_TL: { paths: ['M50 0 V50 H0'], con: [1,0,0,1] },
            T_UP: { paths: ['M0 50 H100 M50 50 V100'], con: [0,1,1,1] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,0,1,1] },
            T_LEFT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,1,1,0] }
        };

        // Helper to draw SVG
        function createSVG(paths) {
            let svgContent = paths.map(p => `<path d="${p}" />`).join('');
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svgContent}</svg>`;
        }

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; // Store DOM elements
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 4}; 
                this.cubPos = {x: 0, y: 0};
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const tileType = this.getTileType(x, y);
                        const div = document.createElement('div');
                        div.className = 'tile';
                        div.innerHTML = createSVG(tileType.paths);
                        
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            // Determine tile visual based on neighbors to ensure path continuity
            getTileType(x, y) {
                // Hardcoded specific layout for visual consistency in this demo
                const layout = [
                    ['C_TL', 'L', 'C_TR', 'L', 'C_TL', 'L'],
                    ['L', 'C_BR', 'L', 'C_TL', 'L', 'L'],
                    ['L', 'L', 'C_BL', 'C_BR', 'C_BL', 'C_BR'],
                    ['L', 'C_TL', 'L', 'L', 'C_BL', 'L'],
                    ['C_TR', 'L', 'C_BL', 'C_BR', 'L', 'L'],
                    ['L', 'L', 'L', 'L', 'L', 'L']
                ];

                const key = layout[y][x];
                
                const map = {
                    'L': TILE_TYPES.LINE,
                    'C_TL': TILE_TYPES.CORNER_TL,
                    'C_TR': TILE_TYPES.CORNER_TR,
                    'C_BL': TILE_TYPES.CORNER_BL,
                    'C_BR': TILE_TYPES.CORNER_BR,
                    'C': TILE_TYPES.CORNER_TL 
                };
                
                return map[key] || TILE_TYPES.EMPTY;
            }

            updateTokenPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tile svg').forEach(s => s.style.stroke = ''); // Reset inline styles if any
                this.cubPos = {x: 0, y: 0};
                this.updateTokenPosition(0, 0);
            }

            async run() {
                // Correct path to Star at 5,4
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:4, y:4}, {x:4, y:3}, 
                    {x:5, y:3}, {x:5, y:4} // Star
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    
                    // Highlight tile
                    const tile = this.cells[step.y][step.x];
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateTokenPosition(step.x, step.y);
                    
                    // Wait
                    await new Promise(r => setTimeout(r, 350));
                }

                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 200);
            }
        }

        const game = new Game();

    </script>
</body>
</html>
