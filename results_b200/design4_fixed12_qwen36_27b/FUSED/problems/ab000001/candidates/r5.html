<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Revitalized Storybook (Critique Point 4) */
            --bg-wall: #EAE0D5;
            --bg-wall-pattern: #E0D4C5;
            
            /* Board Colors */
            --board-frame: #6D4C41; /* Rich Wood */
            --board-frame-dark: #4E342E;
            --board-inner: #FFF8E1; /* Warm Cream */
            --board-inner-shadow: #F5E6CA;
            
            /* Path Lines (Critique Point 1) */
            --path-inactive: #D7CCC8; /* Muted warm grey */
            --path-active: #00897B; /* Teal/Deep Green contrast */
            --path-stroke: 8px;
            
            /* UI Colors */
            --btn-primary: #E64A19; /* Burnt Orange */
            --btn-primary-shadow: #BF360C;
            --btn-secondary: #8D6E63; /* Earthy Brown */
            --btn-secondary-shadow: #5D4037;
            
            --text-main: #3E2723;
            --text-light: #FFF8E1;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-wall);
            /* Subtle Wallpaper Pattern */
            background-image: 
                radial-gradient(circle, var(--bg-wall-pattern) 15%, transparent 16%),
                radial-gradient(circle, var(--bg-wall-pattern) 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            font-family: 'Georgia', serif; /* Critique Point 3 */
            color: var(--text-main);
            overflow: hidden;
        }

        /* --- Typography & Header --- */
        header {
            margin-bottom: 1.5rem;
            text-align: center;
            z-index: 10;
            position: relative;
        }

        h1 {
            /* Critique Point 3: Chunky Serif */
            font-family: 'Georgia', serif; 
            font-weight: 900;
            font-size: 3.5rem;
            margin: 0;
            color: var(--board-frame-dark);
            letter-spacing: -1.5px;
            text-shadow: 
                2px 2px 0px var(--board-frame), 
                4px 4px 0px rgba(0,0,0,0.1);
            transform: rotate(-1deg);
        }

        /* Level Badge: Stitched Label Style */
        .subtitle {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1rem; /* Critique Point 3: Increased contrast/size */
            color: var(--board-frame-dark);
            margin-top: 10px;
            text-transform: uppercase;
            background: #FFF8E1;
            padding: 6px 18px;
            display: inline-block;
            border-radius: 4px;
            border: 2px dashed var(--board-frame);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            position: relative;
        }
        
        /* Decorative "stitches" */
        .subtitle::before, .subtitle::after {
            content: '';
            position: absolute;
            width: 6px; height: 6px;
            background: var(--board-frame);
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
        }
        .subtitle::before { left: 6px; }
        .subtitle::after { right: 6px; }

        /* --- The Game Board --- */
        .game-frame {
            position: relative;
            width: min(94vw, 580px);
            height: min(94vw, 580px);
            /* Critique Point 4: Rich Wood Frame */
            background: linear-gradient(145deg, #8D6E63, #5D4037);
            border-radius: 16px;
            padding: 14px;
            box-shadow: 
                0 25px 50px -12px rgba(62, 39, 35, 0.5),
                0 12px 20px -5px rgba(0,0,0,0.3),
                inset 0 2px 4px rgba(255,255,255,0.2);
            border: 2px solid #3E2723;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100%;
            height: 100%;
            /* Critique Point 1: Distinct Grid Lines */
            gap: 4px; 
            background: #4E342E; /* Dark gaps */
            border-radius: 6px;
            overflow: hidden;
            border: 4px solid #3E2723;
        }

        .tile {
            background-color: var(--board-inner);
            position: relative;
            cursor: pointer;
            /* Subtle inner texture for paper feel */
            background-image: linear-gradient(to bottom right, rgba(255,255,255,0.8), rgba(245,240,230,0.4));
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        /* SVG Paths (Critique Point 1: Legible & Distinct) */
        .tile svg {
            width: 100%;
            height: 100%;
            stroke: var(--path-inactive);
            stroke-width: var(--path-stroke);
            stroke-linecap: round;
            fill: none;
            opacity: 0.7;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Active State */
        .tile.active svg {
            stroke: var(--path-active);
            opacity: 1;
            /* Slight glow */
            filter: drop-shadow(0 2px 4px rgba(0, 137, 123, 0.4));
        }

        /* --- Tokens (Cub & Star) --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
            overflow: hidden; 
            /* Padding to match grid gap so tokens sit inside cells */
            padding: 4px; 
            box-sizing: border-box;
        }

        /* Critique Point 2: Cub Token - Integrated, not overlaying */
        .cub-token {
            position: absolute;
            width: 80%; 
            height: 80%;
            transform: translate(-50%, -50%);
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 30;
            filter: drop-shadow(0 4px 2px rgba(0,0,0,0.25));
        }

        /* Critique Point 5: Star as Physical Token */
        .star-marker {
            position: absolute;
            width: 65%; 
            height: 65%;
            transform: translate(-50%, -50%);
            z-index: 15;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.2));
            animation: floatStar 3s infinite ease-in-out;
        }

        @keyframes floatStar {
            0%, 100% { transform: translate(-50%, -50%) rotate(-5deg); }
            50% { transform: translate(-50%, -50%) rotate(5deg) scale(1.05); }
        }

        /* --- Footer Controls (Critique Point 5: Modernize) --- */
        footer {
            margin-top: 2.5rem;
            display: flex;
            gap: 1.5rem;
            z-index: 10;
            width: min(94vw, 580px);
            justify-content: center;
        }

        /* Tactile, Flat-ish Buttons */
        button {
            font-family: 'Georgia', serif;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 16px 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex: 1;
            max-width: 240px;
            position: relative;
            
            /* Clean Shadow (No dated bevels) */
            box-shadow: 
                0 6px 0px rgba(0,0,0,0.15),
                0 10px 10px rgba(0,0,0,0.1);
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 
                0 2px 0px rgba(0,0,0,0.15),
                0 4px 4px rgba(0,0,0,0.1);
        }

        .btn-reset {
            background: var(--btn-secondary);
            color: #FFF;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .btn-reset:hover { background: #795548; }

        .btn-run {
            background: var(--btn-primary);
            color: #FFF;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            box-shadow: 
                0 6px 0px var(--btn-primary-shadow),
                0 10px 10px rgba(0,0,0,0.15);
        }
        .btn-run:hover { background: #D84315; }
        .btn-run:active {
            box-shadow: 
                0 2px 0px var(--btn-primary-shadow),
                0 4px 4px rgba(0,0,0,0.15);
        }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(234, 224, 213, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(4px);
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-size: 5rem;
            color: var(--btn-primary);
            margin: 0;
            transform: rotate(-3deg);
            font-family: 'Georgia', serif;
            text-shadow: 4px 4px 0 #FFCCBC;
        }
        .overlay p {
            font-size: 1.5rem;
            color: #5D4037;
            margin-bottom: 2.5rem;
            font-style: italic;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.8rem; }
            .subtitle { font-size: 0.8rem; padding: 4px 12px; }
            footer { gap: 1rem; }
            button { font-size: 1rem; padding: 14px 24px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 1: The Garden</div>
    </header>

    <div class="game-frame">
        <!-- The Grid -->
        <div class="grid" id="grid"></div>
        
        <!-- Tokens Layer -->
        <div class="token-layer">
            
            <!-- Critique Point 2: Detailed Cub Token -->
            <div class="cub-token" id="cub">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Fur Texture / Body -->
                    <path d="M25 100 V65 C25 45 35 40 50 40 C65 40 75 45 75 65 V100 Z" fill="#8D6E63" stroke="#3E2723" stroke-width="3" stroke-linejoin="round"/>
                    <!-- Ears -->
                    <circle cx="28" cy="30" r="11" fill="#8D6E63" stroke="#3E2723" stroke-width="3"/>
                    <circle cx="72" cy="30" r="11" fill="#8D6E63" stroke="#3E2723" stroke-width="3"/>
                    <circle cx="28" cy="30" r="5" fill="#D7CCC8" stroke="#3E2723" stroke-width="1"/>
                    <circle cx="72" cy="30" r="5" fill="#D7CCC8" stroke="#3E2723" stroke-width="1"/>
                    <!-- Head -->
                    <circle cx="50" cy="40" r="23" fill="#8D6E63" stroke="#3E2723" stroke-width="3"/>
                    <!-- Snout -->
                    <ellipse cx="50" cy="48" rx="14" ry="11" fill="#D7CCC8" stroke="#3E2723" stroke-width="2"/>
                    <!-- Nose -->
                    <path d="M46 44 Q50 40 54 44 Q50 49 46 44" fill="#3E2723"/>
                    <!-- Mouth -->
                    <path d="M50 47 V50 Q48 52 46 50 M50 50 Q52 52 54 50" stroke="#3E2723" stroke-width="2" stroke-linecap="round" fill="none"/>
                    <!-- Eyes with Animation -->
                    <circle cx="40" cy="38" r="3" fill="#3E2723">
                        <animate attributeName="r" values="3;0.5;3" dur="4s" repeatCount="indefinite" keyTimes="0;0.05;0.1"/>
                    </circle>
                    <circle cx="60" cy="38" r="3" fill="#3E2723">
                        <animate attributeName="r" values="3;0.5;3" dur="4s" repeatCount="indefinite" keyTimes="0;0.05;0.1"/>
                    </circle>
                    <!-- Cheeks -->
                    <circle cx="32" cy="46" r="3" fill="#FFAB91" opacity="0.6"/>
                    <circle cx="68" cy="46" r="3" fill="#FFAB91" opacity="0.6"/>
                </svg>
            </div>

            <!-- Critique Point 5: Physical Star Token -->
            <div class="star-marker" id="star">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#FFCA28;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#FFB300;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#FF8F00;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <!-- Outer Star Shape -->
                    <path d="M50 5 L63 35 L95 35 L69 55 L79 85 L50 68 L21 85 L31 55 L5 35 L37 35 Z" fill="url(#goldGradient)" stroke="#E65100" stroke-width="3" stroke-linejoin="round"/>
                    <!-- Inner Detail -->
                    <path d="M50 25 L55 40 L70 40 L58 50 L62 65 L50 55 L38 65 L42 50 L30 40 L45 40 Z" fill="#FFF8E1" opacity="0.5"/>
                </svg>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run Path</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        // --- Game Logic & Drawing ---

        const GRID_SIZE = 6;
        
        // Tile Types (SVG Paths)
        // Coordinates: Top(50,0), Right(100,50), Bottom(50,100), Left(0,50)
        const TILE_TYPES = {
            EMPTY: { paths: [] },
            LINE: { paths: ['M50 0 V100'], con: [1,0,1,0] }, // Vertical
            LINE_H: { paths: ['M0 50 H100'], con: [0,1,0,1] }, // Horizontal
            CORNER_TR: { paths: ['M50 0 V50 H100'], con: [1,1,0,0] },
            CORNER_BR: { paths: ['M100 50 V100 H50'], con: [0,1,1,0] },
            CORNER_BL: { paths: ['M0 50 V100 H50'], con: [0,0,1,1] },
            CORNER_TL: { paths: ['M50 0 V50 H0'], con: [1,0,0,1] },
            T_UP: { paths: ['M0 50 H100 M50 50 V100'], con: [0,1,1,1] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,0,1,1] },
            T_LEFT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,1,1,0] }
        };

        // Helper to draw SVG
        function createSVG(paths) {
            let svgContent = paths.map(p => `<path d="${p}" />`).join('');
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svgContent}</svg>`;
        }

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; // Store DOM elements
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 4}; 
                this.cubPos = {x: 0, y: 0};
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const tileType = this.getTileType(x, y);
                        const div = document.createElement('div');
                        div.className = 'tile';
                        div.innerHTML = createSVG(tileType.paths);
                        
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            // Determine tile visual based on neighbors to ensure path continuity
            getTileType(x, y) {
                // Hardcoded specific layout for visual consistency in this demo
                const layout = [
                    ['C_TL', 'L', 'C_TR', 'L', 'C_TL', 'L'],
                    ['L', 'C_BR', 'L', 'C_TL', 'L', 'L'],
                    ['L', 'L', 'C_BL', 'C_BR', 'C_BL', 'C_BR'],
                    ['L', 'C_TL', 'L', 'L', 'C_BL', 'L'],
                    ['C_TR', 'L', 'C_BL', 'C_BR', 'L', 'L'],
                    ['L', 'L', 'L', 'L', 'L', 'L']
                ];

                const key = layout[y][x];
                
                const map = {
                    'L': TILE_TYPES.LINE,
                    'C_TL': TILE_TYPES.CORNER_TL,
                    'C_TR': TILE_TYPES.CORNER_TR,
                    'C_BL': TILE_TYPES.CORNER_BL,
                    'C_BR': TILE_TYPES.CORNER_BR,
                    'C': TILE_TYPES.CORNER_TL 
                };
                
                return map[key] || TILE_TYPES.EMPTY;
            }

            updateTokenPosition(x, y) {
                // Calculate percentage position relative to the container
                // Note: The token layer has padding to match the grid gap, 
                // so the grid logic maps directly to the percentage space.
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.cubPos = {x: 0, y: 0};
                this.updateTokenPosition(0, 0);
            }

            async run() {
                // Correct path to Star at 5,4
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:4, y:4}, {x:4, y:3}, 
                    {x:5, y:3}, {x:5, y:4} // Star
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    
                    // Highlight tile
                    const tile = this.cells[step.y][step.x];
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateTokenPosition(step.x, step.y);
                    
                    // Wait
                    await new Promise(r => setTimeout(r, 350));
                }

                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 200);
            }
        }

        const game = new Game();

    </script>
</body>
</html>
