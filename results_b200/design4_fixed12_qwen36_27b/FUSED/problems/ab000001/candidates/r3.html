<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Warm Storybook */
            --bg-paper: #F2E8D5;
            --board-wood: #5D4037;
            --board-frame: #3E2723;
            --board-inner: #FFF8E1;
            --board-grid: #D7CCC8; /* Soft brown/grey for lines */
            
            /* Game Elements */
            --path-idle: #EFEBE9; /* Faint path */
            --path-active: #43A047; /* Vibrant Garden Green */
            --path-stroke: 8px; /* Thinner, cleaner lines */
            
            /* UI */
            --btn-run: #FF7043;
            --btn-run-shadow: #E64A19;
            --btn-reset: #BCAAA4; /* Warm neutral */
            --btn-reset-shadow: #8D6E63;
            
            /* Dimensions */
            --board-size: min(92vw, 560px);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; user-select: none; }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-paper);
            /* Subtle Paper Texture */
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0,0,0,0.02) 1px, transparent 1px),
                radial-gradient(circle at 80% 80%, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Georgia', serif;
            color: #3E2723;
            overflow: hidden;
        }

        /* --- Typography & Header --- */
        header {
            margin-bottom: 1.5rem;
            text-align: center;
            z-index: 10;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            /* Playful, chunky serif style using system fonts */
            font-family: 'Georgia', 'Times New Roman', serif;
            font-weight: 900;
            font-size: 3.5rem;
            margin: 0;
            color: #4E342E;
            line-height: 1;
            letter-spacing: -1px;
            /* No drop shadow, just pure color */
        }

        .subtitle {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 0.9rem;
            color: #8D6E63;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            /* Clean pill background, no dashed border */
            background: rgba(93, 64, 55, 0.08);
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
        }

        /* --- The Game Board --- */
        .game-frame {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            background: var(--board-wood);
            border-radius: 16px;
            padding: 10px; /* Reduced padding for cleaner look */
            /* Softer frame, lifted shadow */
            box-shadow: 
                0 15px 35px rgba(62, 39, 35, 0.3),
                0 5px 0 rgba(0,0,0,0.1);
            border: 2px solid var(--board-frame); /* Thinner border */
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100%;
            height: 100%;
            gap: 1px; /* Very thin gap for grid lines */
            background: var(--board-grid); /* Creates the thin grid lines */
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--board-grid); /* Outer grid line */
        }

        .tile {
            background-color: var(--board-inner);
            position: relative;
            cursor: pointer;
            /* Removed inner shadows for flatter, cleaner look */
            transition: background-color 0.2s;
        }

        .tile:hover {
            background-color: #FFFDE7;
        }

        /* SVG Paths: Thinner, cleaner */
        .tile svg {
            width: 100%;
            height: 100%;
            stroke: var(--path-idle);
            stroke-width: var(--path-stroke);
            stroke-linecap: round;
            fill: none;
            /* No dashes, just low opacity for idle state */
            opacity: 0.3;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Active State: High contrast, solid green */
        .tile.active svg {
            stroke: var(--path-active);
            opacity: 1;
            filter: drop-shadow(0 2px 0 rgba(0,0,0,0.1));
        }

        /* --- Tokens (Cub & Star) --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
            overflow: hidden; 
        }

        /* Redesigned Cub Token: Cute Character */
        .cub-token {
            position: absolute;
            width: 80%; 
            height: 80%;
            transform: translate(-50%, -50%);
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 30;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.25));
        }

        /* Redesigned Star: Smaller, fits in cell */
        .star-marker {
            position: absolute;
            width: 45%; /* Smaller size */
            height: 45%;
            transform: translate(-50%, -50%);
            color: #FFCA28;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1));
            animation: floatStar 3s infinite ease-in-out;
            z-index: 15;
        }

        @keyframes floatStar {
            0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            50% { transform: translate(-50%, -50%) scale(1.1) rotate(10deg); }
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Footer Controls --- */
        footer {
            margin-top: 2rem;
            display: flex;
            gap: 1.5rem;
            z-index: 10;
            width: var(--board-size);
            justify-content: center;
        }

        button {
            font-family: 'Georgia', serif;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 12px 32px;
            border: none;
            border-radius: 12px; /* Softer corners */
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: 1;
            max-width: 200px;
            position: relative;
            /* Flatter design, subtle shadow */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.1);
        }

        .btn-reset {
            background: var(--btn-reset);
            color: #fff;
        }
        .btn-reset:hover {
            background: #A1887F;
        }

        .btn-run {
            background: var(--btn-run);
            color: #fff;
            /* Modern subtle shadow instead of hard 3D */
            box-shadow: 0 6px 0 var(--btn-run-shadow), 0 10px 15px rgba(230, 74, 25, 0.3);
        }
        .btn-run:active {
            box-shadow: 0 2px 0 var(--btn-run-shadow), 0 5px 10px rgba(230, 74, 25, 0.3);
        }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 248, 225, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(4px);
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-size: 4rem;
            color: var(--btn-run);
            margin: 0;
            transform: rotate(-3deg);
            font-family: 'Georgia', serif;
            text-shadow: 2px 2px 0 #FFE0B2;
        }
        .overlay p {
            font-size: 1.4rem;
            color: #5D4037;
            margin-bottom: 2rem;
            font-style: italic;
        }

        /* Responsive */
        @media (max-width: 600px) {
            :root { --board-size: 94vw; }
            h1 { font-size: 2.8rem; }
            .subtitle { font-size: 0.8rem; }
            footer { flex-direction: row; gap: 10px; }
            button { font-size: 0.9rem; padding: 12px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 1: The Garden</div>
    </header>

    <div class="game-frame">
        <!-- The Grid -->
        <div class="grid" id="grid"></div>
        
        <!-- Tokens Layer -->
        <div class="token-layer">
            <!-- Redesigned Cub Token (Cute Bear) -->
            <div class="cub-token" id="cub">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Body -->
                    <path d="M30 100 V65 C30 50 40 45 50 45 C60 45 70 50 70 65 V100 Z" fill="#8D6E63" stroke="#3E2723" stroke-width="2"/>
                    <!-- Ears -->
                    <circle cx="28" cy="35" r="10" fill="#8D6E63" stroke="#3E2723" stroke-width="2"/>
                    <circle cx="72" cy="35" r="10" fill="#8D6E63" stroke="#3E2723" stroke-width="2"/>
                    <circle cx="28" cy="35" r="5" fill="#D7CCC8"/>
                    <circle cx="72" cy="35" r="5" fill="#D7CCC8"/>
                    <!-- Head -->
                    <circle cx="50" cy="45" r="22" fill="#8D6E63" stroke="#3E2723" stroke-width="2"/>
                    <!-- Snout -->
                    <ellipse cx="50" cy="50" rx="12" ry="9" fill="#D7CCC8" stroke="#3E2723" stroke-width="2"/>
                    <!-- Nose -->
                    <path d="M46 48 Q50 44 54 48 Q50 53 46 48" fill="#3E2723"/>
                    <!-- Mouth -->
                    <path d="M50 51 V53 Q48 55 46 53 M50 53 Q52 55 54 53" stroke="#3E2723" stroke-width="1.5" stroke-linecap="round"/>
                    <!-- Eyes -->
                    <circle cx="40" cy="40" r="2.5" fill="#3E2723">
                        <animate attributeName="r" values="2.5;0;2.5" dur="4s" repeatCount="indefinite" keyTimes="0;0.05;0.1"/>
                    </circle>
                    <circle cx="60" cy="40" r="2.5" fill="#3E2723">
                        <animate attributeName="r" values="2.5;0;2.5" dur="4s" repeatCount="indefinite" keyTimes="0;0.05;0.1"/>
                    </circle>
                </svg>
            </div>

            <!-- Redesigned Star Marker (Smaller) -->
            <div class="star-marker" id="star">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run Path</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        // --- Game Logic & Drawing ---

        const GRID_SIZE = 6;
        
        // Tile Types (SVG Paths)
        // Coordinates: Top(50,0), Right(100,50), Bottom(50,100), Left(0,50)
        const TILE_TYPES = {
            EMPTY: { paths: [] },
            LINE: { paths: ['M50 0 V100'], con: [1,0,1,0] }, // Vertical
            LINE_H: { paths: ['M0 50 H100'], con: [0,1,0,1] }, // Horizontal
            CORNER_TR: { paths: ['M50 0 V50 H100'], con: [1,1,0,0] },
            CORNER_BR: { paths: ['M100 50 V100 H50'], con: [0,1,1,0] },
            CORNER_BL: { paths: ['M0 50 V100 H50'], con: [0,0,1,1] },
            CORNER_TL: { paths: ['M50 0 V50 H0'], con: [1,0,0,1] },
            T_UP: { paths: ['M0 50 H100 M50 50 V100'], con: [0,1,1,1] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,0,1,1] },
            T_LEFT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,1,1,0] }
        };

        // Helper to draw SVG
        function createSVG(paths) {
            let svgContent = paths.map(p => `<path d="${p}" />`).join('');
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svgContent}</svg>`;
        }

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; // Store DOM elements
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 4}; 
                this.cubPos = {x: 0, y: 0};
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const tileType = this.getTileType(x, y);
                        const div = document.createElement('div');
                        div.className = 'tile';
                        div.innerHTML = createSVG(tileType.paths);
                        
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            // Determine tile visual based on neighbors to ensure path continuity
            getTileType(x, y) {
                // Hardcoded specific layout for visual consistency in this demo
                const layout = [
                    ['C_TL', 'L', 'C_TR', 'L', 'C_TL', 'L'],
                    ['L', 'C_BR', 'L', 'C_TL', 'L', 'L'],
                    ['L', 'L', 'C_BL', 'C_BR', 'C_BL', 'C_BR'],
                    ['L', 'C_TL', 'L', 'L', 'C_BL', 'L'],
                    ['C_TR', 'L', 'C_BL', 'C_BR', 'L', 'L'],
                    ['L', 'L', 'L', 'L', 'L', 'L']
                ];

                const key = layout[y][x];
                
                const map = {
                    'L': TILE_TYPES.LINE,
                    'C_TL': TILE_TYPES.CORNER_TL,
                    'C_TR': TILE_TYPES.CORNER_TR,
                    'C_BL': TILE_TYPES.CORNER_BL,
                    'C_BR': TILE_TYPES.CORNER_BR,
                    'C': TILE_TYPES.CORNER_TL 
                };
                
                return map[key] || TILE_TYPES.EMPTY;
            }

            updateTokenPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tile svg').forEach(s => s.style.stroke = ''); // Reset inline styles if any
                this.cubPos = {x: 0, y: 0};
                this.updateTokenPosition(0, 0);
            }

            async run() {
                // Correct path to Star at 5,4
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:4, y:4}, {x:4, y:3}, 
                    {x:5, y:3}, {x:5, y:4} // Star
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    
                    // Highlight tile
                    const tile = this.cells[step.y][step.x];
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateTokenPosition(step.x, step.y);
                    
                    // Wait
                    await new Promise(r => setTimeout(r, 350));
                }

                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 200);
            }
        }

        const game = new Game();

    </script>
</body>
</html>
