<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        :root {
            --c-bg-top: #050014;
            --c-bg-bot: #2a003b;
            --c-grid: #ff00ff;
            --c-sun-top: #ffdd00;
            --c-sun-bot: #ff0055;
            --c-cyan: #00ffff;
            --c-yellow: #ffff00;
            --c-white: #ffffff;
            --c-dark: #110022;
            --c-btn: #ff00ff; /* Changed to fit palette */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: var(--c-bg-top);
            color: var(--c-white);
            font-family: "Courier New", Courier, monospace; 
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- CANVAS BACKGROUND --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            /* Critical for pixel art look on high DPI screens */
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        /* --- CRT / SCANLINE OVERLAY --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.2) 2px,
                rgba(0,0,0,0.2) 4px
            );
            background-size: 100% 4px;
            z-index: 90;
            pointer-events: none;
        }
        
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
            z-index: 91;
            pointer-events: none;
        }

        /* --- MAIN UI LAYER --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Compress top section to allow highway to dominate */
            justify-content: flex-start; 
            padding-top: 5vh;
            pointer-events: none;
        }

        /* --- TYPOGRAPHY --- */
        .title-group {
            text-align: center;
            margin-bottom: 2vh;
            pointer-events: auto;
            position: relative;
            z-index: 20;
        }

        h1 {
            font-size: 6rem;
            font-weight: 900;
            line-height: 0.85;
            text-transform: uppercase;
            color: var(--c-white);
            /* Clean solid shadow instead of messy glow */
            text-shadow: 
                6px 6px 0px var(--c-grid),
                12px 12px 0px rgba(0,0,0,0.5);
            margin: 0;
            letter-spacing: -4px;
            animation: floatTitle 4s ease-in-out infinite;
            /* Pixelated font rendering */
            -webkit-text-stroke: 1px rgba(255,255,255,0.2);
        }

        .subtitle {
            display: block;
            font-size: 1.2rem;
            color: var(--c-cyan);
            margin-top: 10px;
            letter-spacing: 8px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            opacity: 0.9;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border: 1px solid var(--c-cyan);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }

        /* --- GAMEPLAY PREVIEW (HIGHWAY) --- */
        /* Enlarged significantly to dominate lower half */
        .highway-container {
            position: absolute;
            bottom: -5%;
            left: 0;
            width: 100%;
            height: 65vh; /* Much taller */
            display: flex;
            justify-content: center;
            align-items: flex-end;
            perspective: 800px;
            pointer-events: auto;
            z-index: 15;
            /* Mask to blend top into the sun */
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 30%, black 100%);
        }

        /* The 3D Highway Plane */
        .highway {
            width: 60vw; /* Wider */
            max-width: 800px;
            min-width: 300px;
            height: 100%;
            background: rgba(5, 0, 20, 0.95);
            transform-origin: 50% 100%;
            transform: rotateX(55deg);
            position: relative;
            display: flex;
            border: 4px solid var(--c-cyan);
            box-shadow: 0 0 30px var(--c-cyan);
        }

        /* Individual Lanes */
        .lane {
            flex: 1;
            position: relative;
            border-right: 2px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }
        .lane:last-child { border-right: none; }

        /* Lane Colors (Subtle Tints) */
        .lane:nth-child(1) { background: linear-gradient(to bottom, transparent, rgba(255, 0, 255, 0.15)); }
        .lane:nth-child(2) { background: linear-gradient(to bottom, transparent, rgba(0, 255, 255, 0.15)); }
        .lane:nth-child(3) { background: linear-gradient(to bottom, transparent, rgba(255, 255, 0, 0.15)); }
        .lane:nth-child(4) { background: linear-gradient(to bottom, transparent, rgba(255, 0, 255, 0.15)); }

        /* The Hit Line */
        .hit-line {
            position: absolute;
            bottom: 50px;
            left: -40px;
            width: calc(100% + 80px);
            height: 8px;
            background: var(--c-white);
            box-shadow: 0 0 20px var(--c-white), 0 0 10px var(--c-cyan);
            z-index: 5;
        }

        /* Falling Notes */
        .note {
            position: absolute;
            width: 70%;
            left: 15%;
            height: 24px;
            /* Pixel art note shape */
            clip-path: polygon(
                0% 0%, 100% 0%, 
                100% 70%, 80% 100%, 
                0% 100%
            );
            box-shadow: inset 0 0 5px rgba(255,255,255,0.8);
        }

        /* --- CONTROLS --- */
        .controls {
            display: flex;
            gap: 20px;
            pointer-events: auto;
            margin-top: 20px;
            z-index: 20;
        }

        .btn {
            position: relative;
            background: #000;
            border: none;
            padding: 18px 60px;
            font-family: "Courier New", Courier, monospace;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--c-white);
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.1s;
            /* Retro Bevel Shape */
            clip-path: polygon(
                20px 0, 100% 0, 
                100% calc(100% - 20px), calc(100% - 20px) 100%, 
                0 100%, 0 20px
            );
        }

        /* Primary Button (Start) - Integrated Palette Color (Magenta) */
        .btn-start {
            color: var(--c-white);
            background: var(--c-btn);
            box-shadow: 
                inset 4px 4px 0px rgba(255,255,255,0.4),
                inset -4px -4px 0px rgba(0,0,0,0.4),
                6px 6px 0px rgba(0,0,0,0.5);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        .btn-start:hover {
            transform: translateY(-4px);
            background: #ff33ff;
            box-shadow: 
                inset 4px 4px 0px rgba(255,255,255,0.6),
                inset -4px -4px 0px rgba(0,0,0,0.4),
                10px 10px 0px rgba(0,0,0,0.5),
                0 0 25px var(--c-btn);
        }

        .btn-start:active {
            transform: translateY(2px);
            box-shadow: inset 4px 4px 0px rgba(0,0,0,0.4);
        }

        /* Secondary Button (Options) */
        .btn-opt {
            color: var(--c-cyan);
            border: 2px solid var(--c-cyan);
            background: rgba(0,0,0,0.8);
            box-shadow: 6px 6px 0px rgba(0,0,0,0.5);
        }

        .btn-opt:hover {
            background: var(--c-cyan);
            color: #000;
            box-shadow: 
                10px 10px 0px rgba(0,0,0,0.5),
                0 0 20px var(--c-cyan);
            transform: translateY(-4px);
        }

        /* --- ANIMATIONS --- */
        @keyframes floatTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 3.5rem; }
            .subtitle { font-size: 0.9rem; letter-spacing: 4px; }
            .highway-container { height: 55vh; }
            .btn { padding: 14px 40px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- VISUAL ENGINE -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- OVERLAYS -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- UI LAYER -->
    <div class="ui-layer">
        
        <div class="title-group">
            <h1>PIXEL<br>DANCE</h1>
            <span class="subtitle">RHYTHM EDITION</span>
        </div>

        <div class="highway-container">
            <div class="highway" id="highway">
                <div class="lane" id="l1"></div>
                <div class="lane" id="l2"></div>
                <div class="lane" id="l3"></div>
                <div class="lane" id="l4"></div>
                <div class="hit-line"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-start" onclick="alert('GAME START')">START</button>
            <button class="btn btn-opt" onclick="alert('OPTIONS')">OPTIONS</button>
        </div>

    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Renders the Synthwave background with strict pixel-art aesthetic
         */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let time = 0;

        // Pixelation Factor: The smaller the number, the chunkier the pixels
        const PIXEL_SIZE = 6; 

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawBackground() {
            // Clear
            ctx.clearRect(0, 0, width, height);

            // 1. Sky Gradient (Rendered in pixels)
            const steps = Math.ceil(height / PIXEL_SIZE);
            for (let i = 0; i < steps; i++) {
                const t = i / steps;
                let r, g, b;
                if (t < 0.5) {
                    // 0,0,20 -> 42,0,59
                    r = Math.floor(t * 2 * 42);
                    g = 0;
                    b = Math.floor(20 + t * 2 * 39);
                } else {
                    // 42,0,59 -> 100,0,150
                    r = Math.floor(42 + (t-0.5)*2*58);
                    g = 0;
                    b = Math.floor(59 + (t-0.5)*2*91);
                }
                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.fillRect(0, i * PIXEL_SIZE, width, PIXEL_SIZE);
            }

            // 2. The Sun (Pixelated Gradient)
            // Positioned higher to allow highway to emerge from center
            const cx = width / 2;
            const cy = height * 0.35; 
            const r = Math.min(width, height) * 0.25; 

            ctx.save();
            ctx.translate(cx, cy);

            // Draw Sun Body
            const sunGrad = ctx.createLinearGradient(0, -r, 0, r);
            sunGrad.addColorStop(0, '#ffdd00');
            sunGrad.addColorStop(0.5, '#ff0055');
            sunGrad.addColorStop(1, '#aa00ff');
            
            // Draw circle as a base
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = sunGrad;
            ctx.fill();

            // Pixelated Sun Stripes (The "Retro" look)
            // We only draw black rectangles on the bottom half
            ctx.fillStyle = '#050014'; // Match top sky color for cutout effect
            for(let i = 0; i < r; i += PIXEL_SIZE) {
                let yPos = i;
                let thickness = PIXEL_SIZE + (i / r * 6); // Stripes get thicker at bottom
                
                // Calculate width of stripe at this height
                let stripeHalfWidth = Math.sqrt(r*r - yPos*yPos);
                
                if(stripeHalfWidth > 0) {
                    ctx.fillRect(-stripeHalfWidth, yPos, stripeHalfWidth * 2, thickness);
                }
            }
            ctx.restore();

            // 3. Stars (Blocky)
            ctx.fillStyle = '#ffffff';
            for(let i=0; i<80; i++) {
                const sx = (Math.sin(i * 123.45) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 67.89) * 0.5 + 0.5) * (height * 0.45);
                
                const alpha = 0.5 + 0.5 * Math.sin(time * 0.05 + i);
                ctx.globalAlpha = alpha;
                
                const size = (i % 3 === 0) ? PIXEL_SIZE * 2 : PIXEL_SIZE;
                ctx.fillRect(Math.floor(sx/PIXEL_SIZE)*PIXEL_SIZE, Math.floor(sy/PIXEL_SIZE)*PIXEL_SIZE, size, size);
            }
            ctx.globalAlpha = 1;

            // 4. Perspective Grid (The Floor)
            const horizonY = height * 0.45; // Horizon line
            const vanishX = width / 2;
            
            const speed = 8;
            const offset = (time * speed) % 100; 

            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 3;
            // Add glow
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff00ff';

            ctx.beginPath();

            // Vertical Lines (Fan out)
            const numVertLines = 30;
            for (let i = -numVertLines; i <= numVertLines; i++) {
                let x1 = vanishX + (i * 2); // Start near center
                let x2 = vanishX + (i * width * 0.25); // Fan out wider
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
            }

            // Horizontal Lines
            for (let i = 0; i < 20; i++) {
                let z = 100 - (i * 5 + offset); 
                
                if (z <= 1) continue; 

                let y = horizonY + (height * 0.6) / (z * 0.02);

                if (y > horizonY && y < height) {
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                }
            }
            ctx.stroke();
            ctx.shadowBlur = 0; 
        }

        // --- HIGHWAY LOGIC ---
        const lanes = [
            document.getElementById('l1'),
            document.getElementById('l2'),
            document.getElementById('l3'),
            document.getElementById('l4')
        ];
        
        const colors = ['#ff00ff', '#00ffff', '#ffff00', '#ff00ff'];

        function spawnNote() {
            const laneIdx = Math.floor(Math.random() * 4);
            const lane = lanes[laneIdx];
            
            const note = document.createElement('div');
            note.className = 'note';
            note.style.backgroundColor = colors[laneIdx];
            
            // Start position (Top of highway div)
            note.style.top = '-30px';
            
            // Duration
            const duration = 1.5 + Math.random() * 0.5;
            note.style.transition = `top ${duration}s linear`;
            
            lane.appendChild(note);

            // Trigger animation
            requestAnimationFrame(() => {
                note.style.top = '110%'; 
            });

            // Cleanup
            setTimeout(() => {
                if(note.parentNode) note.remove();
            }, duration * 1000);
        }

        // --- MAIN LOOP ---
        function loop() {
            time++;
            drawBackground();

            // Spawn notes rhythmically (slightly faster to match larger highway)
            if (Math.random() < 0.08) {
                spawnNote();
            }

            requestAnimationFrame(loop);
        }

        // Start
        loop();

    </script>
</body>
</html>
