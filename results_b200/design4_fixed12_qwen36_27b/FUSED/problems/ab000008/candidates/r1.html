<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM EDITION</title>
    <style>
        :root {
            --c-bg: #0a0014;
            --c-grid: #ff00ff;
            --c-grid-dim: #550055;
            --c-sun-top: #ffaa00;
            --c-sun-bot: #ff00aa;
            --c-cyan: #00ffff;
            --c-yellow: #ffff00;
            --c-white: #ffffff;
            
            --font-stack: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--c-bg);
            color: white;
            font-family: var(--font-stack);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- CANVAS BACKGROUND --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- GLOBAL SCANLINES (Critique Point 3) --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
            z-index: 20;
            pointer-events: none;
            opacity: 0.6;
        }

        /* --- MAIN CONTENT LAYER --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Let clicks pass through empty areas */
        }

        /* --- TITLE (Critique Point 4) --- */
        .title-group {
            text-align: center;
            margin-bottom: 2rem;
            pointer-events: auto;
            transform: perspective(500px) rotateX(5deg);
        }

        h1 {
            font-size: 6rem;
            font-weight: 900;
            line-height: 0.9;
            text-transform: uppercase;
            color: var(--c-white);
            /* Pixelated shadow effect */
            text-shadow: 
                5px 5px 0px var(--c-grid),
                10px 10px 0px rgba(0,0,0,0.5);
            margin: 0;
            letter-spacing: -4px;
            animation: titleFloat 4s ease-in-out infinite;
        }

        h1 span {
            display: block;
            font-size: 1.8rem;
            color: var(--c-cyan);
            letter-spacing: 12px;
            margin-top: 10px;
            /* Critique: More aggressive styling */
            text-shadow: 
                2px 2px 0px #000, 
                0 0 10px var(--c-cyan);
            font-weight: bold;
        }

        /* --- 3D HIGHWAY (Critique Point 1) --- */
        .highway-wrapper {
            position: relative;
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px; /* Deep perspective */
            margin-bottom: 2rem;
            pointer-events: auto;
        }

        .highway {
            width: 200px;
            height: 600px;
            background: rgba(0, 0, 0, 0.6);
            transform-origin: 50% 0%;
            transform: rotateX(65deg) scale(1.2); /* Tilt back to horizon */
            position: relative;
            display: flex;
            border-top: 4px solid var(--c-white);
            box-shadow: 0 0 50px var(--c-grid);
            /* Mask to fade into distance */
            mask-image: linear-gradient(to top, black 40%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 40%, transparent 100%);
        }

        .lane {
            flex: 1;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }
        .lane:last-child { border-right: none; }

        /* Lane Colors */
        .lane:nth-child(1) { background: linear-gradient(to bottom, transparent, rgba(255, 0, 255, 0.15)); }
        .lane:nth-child(2) { background: linear-gradient(to bottom, transparent, rgba(0, 255, 255, 0.15)); }
        .lane:nth-child(3) { background: linear-gradient(to bottom, transparent, rgba(255, 255, 0, 0.15)); }
        .lane:nth-child(4) { background: linear-gradient(to bottom, transparent, rgba(255, 0, 255, 0.15)); }

        /* Hit Line */
        .hit-line {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 6px;
            background: var(--c-white);
            box-shadow: 0 0 15px 2px var(--c-white);
            z-index: 5;
        }

        /* Notes */
        .note {
            position: absolute;
            width: 80%;
            left: 10%;
            height: 25px;
            border-radius: 2px;
            top: -30px;
            box-shadow: 0 0 10px currentColor;
        }

        /* --- BUTTONS (Critique Point 2) --- */
        .controls {
            display: flex;
            gap: 30px;
            pointer-events: auto;
            transform: perspective(500px) rotateX(10deg);
        }

        .btn {
            position: relative;
            background: #000;
            border: none;
            padding: 15px 40px;
            font-family: var(--font-stack);
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--c-white);
            text-transform: uppercase;
            cursor: pointer;
            /* Pixel Art Border Shape */
            clip-path: polygon(
                10px 0, 100% 0, 
                100% calc(100% - 10px), calc(100% - 10px) 100%, 
                0 100%, 0 10px
            );
            transition: all 0.1s;
        }

        /* The neon border effect using a wrapper or pseudo-element is hard with clip-path, 
           so we use a box-shadow trick on a slightly larger background or just text-shadow */
        
        .btn-start {
            color: var(--c-white);
            box-shadow: 
                inset 2px 2px 0px var(--c-cyan),
                inset -2px -2px 0px var(--c-grid),
                4px 4px 0px rgba(0,0,0,0.5);
            border: 2px solid var(--c-cyan);
        }

        .btn-start:hover {
            background: var(--c-cyan);
            color: #000;
            box-shadow: 0 0 30px var(--c-cyan);
            transform: translateY(-2px);
        }

        .btn-opt {
            color: var(--c-grid);
            border: 2px solid var(--c-grid);
            box-shadow: 
                inset 2px 2px 0px var(--c-white),
                inset -2px -2px 0px var(--c-grid-dim),
                4px 4px 0px rgba(0,0,0,0.5);
        }

        .btn-opt:hover {
            background: var(--c-grid);
            color: #fff;
            box-shadow: 0 0 30px var(--c-grid);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* --- ANIMATIONS --- */
        @keyframes titleFloat {
            0%, 100% { transform: perspective(500px) rotateX(5deg) translateY(0); }
            50% { transform: perspective(500px) rotateX(5deg) translateY(-15px); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .highway { width: 140px; }
            .btn { padding: 12px 25px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- VISUAL ENGINE -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- CRT OVERLAY -->
    <div class="scanlines"></div>

    <!-- UI LAYER -->
    <div class="ui-layer">
        
        <div class="title-group">
            <h1>PIXEL<br>DANCE</h1>
            <h1><span>RHYTHM EDITION</span></h1>
        </div>

        <div class="highway-wrapper">
            <div class="highway" id="highway">
                <div class="lane" id="l1"></div>
                <div class="lane" id="l2"></div>
                <div class="lane" id="l3"></div>
                <div class="lane" id="l4"></div>
                <div class="hit-line"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-start" onclick="alert('STARTING SEQUENCE...')">START</button>
            <button class="btn btn-opt">OPTIONS</button>
        </div>

    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Renders the Synthwave background and sun
         */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawBackground() {
            // 1. Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#050011');
            grad.addColorStop(0.5, '#1a0033');
            grad.addColorStop(1, '#330055');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. The Sun (Critique: Gradient, Soft Stripes)
            const cx = width / 2;
            const cy = height * 0.35;
            const r = Math.min(width, height) * 0.25;

            // Sun Gradient (Orange to Pink)
            const sunGrad = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
            sunGrad.addColorStop(0, '#ffaa00'); // Orange
            sunGrad.addColorStop(0.5, '#ff00aa'); // Pink
            sunGrad.addColorStop(1, '#aa00ff'); // Purple

            ctx.save();
            ctx.translate(cx, cy);
            
            // Glow
            ctx.shadowBlur = 50;
            ctx.shadowColor = '#ff00aa';

            // Draw Sun Circle
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = sunGrad;
            ctx.fill();

            // Soft Scanlines on Sun (Critique: Not harsh black bars)
            ctx.globalCompositeOperation = 'destination-out';
            ctx.shadowBlur = 0; // No shadow for cutouts
            
            // Draw fading horizontal lines
            for(let i = 0; i < 20; i++) {
                // Calculate Y position relative to circle center
                // We only want lines in the bottom half mostly
                let y = (i * (r/8)) - r + (r*0.5); 
                
                // Thickness increases as it goes down
                let h = i * 1.5 + 1;
                
                // Opacity fade for the cutout
                ctx.globalAlpha = (i / 20) * 0.8; 
                
                ctx.fillStyle = '#000';
                ctx.fillRect(-r, y, r*2, h);
            }
            ctx.restore();

            // 3. Stars
            ctx.fillStyle = 'white';
            ctx.globalAlpha = 1;
            for(let i=0; i<80; i++) {
                const sx = (Math.sin(i * 123.45) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 67.89) * 0.5 + 0.5) * (height * 0.4);
                const size = (i % 5 === 0) ? 2 : 1;
                // Twinkle effect
                const alpha = 0.5 + 0.5 * Math.sin(time * 0.05 + i);
                ctx.globalAlpha = alpha;
                ctx.fillRect(sx, sy, size, size);
            }
            ctx.globalAlpha = 1;

            // 4. Perspective Grid
            const horizonY = height * 0.5; // Horizon at 50%
            const vanishX = width / 2;
            
            // Moving Grid Logic
            const speed = 4;
            const offset = (time * speed) % 100;

            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff00ff';

            ctx.beginPath();

            // Vertical Lines (Fan out)
            const numVertLines = 20;
            for (let i = -numVertLines; i <= numVertLines; i++) {
                let x1 = vanishX + (i * 10); // Start near center at horizon
                let x2 = vanishX + (i * width * 0.25); // Fan out wide at bottom
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
            }

            // Horizontal Lines (Logarithmic spacing for perspective)
            // We draw lines from bottom to top based on Z-depth
            for (let i = 0; i < 30; i++) {
                // Map index to a Z value that moves
                let z = (i * 20) - offset;
                if (z <= 1) continue; // Don't draw behind camera

                // Project Z to Y screen coordinate
                // Simple perspective projection: y = h + (scale / z)
                // We want it to fill the bottom half
                const scale = 500; 
                let y = horizonY + (scale / (z * 0.02));

                if (y > horizonY && y < height) {
                    // Fade out lines near horizon
                    const alpha = Math.min(1, (y - horizonY) / (height * 0.2));
                    ctx.globalAlpha = alpha;
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                }
            }
            ctx.stroke();
            ctx.globalAlpha = 1;
        }

        // --- HIGHWAY LOGIC ---
        const lanes = [
            document.getElementById('l1'),
            document.getElementById('l2'),
            document.getElementById('l3'),
            document.getElementById('l4')
        ];
        
        // Colors matching the lane gradients
        const colors = ['#ff00ff', '#00ffff', '#ffff00', '#ff00ff'];

        function spawnNote() {
            const laneIdx = Math.floor(Math.random() * 4);
            const lane = lanes[laneIdx];
            
            const note = document.createElement('div');
            note.className = 'note';
            note.style.backgroundColor = colors[laneIdx];
            note.style.color = colors[laneIdx];
            note.style.top = '-30px';
            
            // Randomize speed
            const duration = 1.5 + Math.random() * 1.0;
            note.style.transition = `top ${duration}s linear`;
            
            lane.appendChild(note);

            // Force reflow
            note.getBoundingClientRect();

            // Animate
            note.style.top = '110%'; // Fall past the bottom

            // Cleanup
            setTimeout(() => {
                note.remove();
            }, duration * 1000);
        }

        // --- MAIN LOOP ---
        function loop() {
            time++;
            drawBackground();

            // Spawn notes randomly
            if (Math.random() < 0.08) {
                spawnNote();
            }

            requestAnimationFrame(loop);
        }

        // Start
        loop();

    </script>
</body>
</html>
