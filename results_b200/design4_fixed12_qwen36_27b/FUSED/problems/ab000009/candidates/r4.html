<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* Palette - Refined & High Contrast */
            --bg-body: #121212; /* Deepest Charcoal */
            --bg-panel: #1e1e1e; /* Panel Surface */
            --bg-panel-inner: #181818; /* Inner recess */
            
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --text-dim: #444444;

            /* Board Palette: Deep Slate & Warm Cream */
            --board-dark: #306998; /* Richer, deeper blue */
            --board-light: #eae9d2; /* Warm cream */
            
            --highlight: rgba(255, 255, 255, 0.2);
            --highlight-move: rgba(0, 0, 0, 0.15);
            --highlight-capture: rgba(0, 0, 0, 0.15);
            
            --accent: #5c8bb5; /* Muted blue accent */
            
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-serif: "Georgia", "Times New Roman", serif; /* For coordinates */
            --font-mono: "SF Mono", "Roboto Mono", "Consolas", "Courier New", monospace;
            
            --shadow-soft: 0 10px 30px -10px rgba(0,0,0,0.6);
            --border-subtle: 1px solid rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Layout --- */
        .app-container {
            display: flex;
            gap: 32px;
            padding: 40px;
            max-width: 1200px;
            width: 100%;
            align-items: center;
            justify-content: center;
        }

        /* --- Board Section --- */
        .board-container {
            position: relative;
            padding: 16px; /* Frame thickness */
            background-color: var(--bg-panel);
            border-radius: 4px;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .board-wrapper {
            position: relative;
            width: 640px;
            height: 640px;
            border: 2px solid #111; /* Inner frame border */
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            user-select: none;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        
        /* Highlights */
        .square.selected { 
            background-color: rgba(255, 255, 255, 0.4) !important; 
        }
        
        /* Dot for valid moves */
        .square.valid-move::after {
            content: '';
            width: 20%;
            height: 20%;
            background: var(--highlight-move);
            border-radius: 50%;
            position: absolute;
        }
        
        /* Ring for captures */
        .square.valid-capture::after {
            content: '';
            width: 80%;
            height: 80%;
            border: 4px solid var(--highlight-capture);
            border-radius: 50%;
            position: absolute;
        }

        /* Coordinate Labels */
        .coord-label {
            position: absolute;
            font-size: 11px;
            font-weight: 400;
            font-family: var(--font-serif); /* Serif for classic touch */
            text-transform: uppercase;
            font-variant: small-caps;
            pointer-events: none;
            z-index: 1;
            line-height: 1;
        }
        
        .coord-rank {
            left: 4px;
            height: 80px; 
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 4px;
        }
        
        .coord-file {
            bottom: 4px;
            width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Color logic for coordinates to ensure contrast */
        .square.light .coord-label { color: var(--board-dark); opacity: 0.8; }
        .square.dark .coord-label { color: var(--board-light); opacity: 0.8; }

        /* Pieces */
        .piece {
            width: 85%;
            height: 85%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            cursor: pointer;
            z-index: 2;
            transition: transform 0.1s ease;
        }
        .piece:hover { transform: scale(1.05); }

        /* --- Unified Sidebar --- */
        .sidebar {
            flex: 0 0 380px;
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            border-radius: 12px;
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            border: var(--border-subtle);
            height: 720px; /* Matches board height + padding roughly */
        }

        /* Header Section */
        .sidebar-header {
            padding: 32px;
            background: var(--bg-panel);
            border-bottom: var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .game-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .status-indicator {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .turn-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .turn-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #fff;
            border: 1px solid rgba(0,0,0,0.2);
            box-shadow: 0 0 6px rgba(255,255,255,0.3);
        }
        .turn-dot.black { 
            background-color: #222; 
            border-color: #444;
            box-shadow: 0 0 6px rgba(0,0,0,0.5);
        }

        /* Timer - Dominant Element */
        .timer {
            font-family: var(--font-mono);
            font-size: 3.2rem;
            font-weight: 400;
            color: var(--text-main);
            line-height: 1;
            letter-spacing: -1px;
        }

        /* History Section */
        .sidebar-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-panel-inner);
        }

        .history-header {
            padding: 16px 32px;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.1em;
            border-bottom: var(--border-subtle);
            background: var(--bg-panel);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            position: relative;
        }

        .history-list:empty::before {
            content: "Moves will appear here";
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-dim);
            font-family: var(--font-sans);
            font-size: 0.85rem;
            pointer-events: none;
        }

        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        .move-row {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            height: 40px;
            align-items: center;
            transition: background 0.1s;
        }
        .move-row:hover { background: rgba(255,255,255,0.02); }
        
        .move-num {
            width: 40px;
            color: var(--text-dim);
            font-size: 0.8rem;
            font-family: var(--font-sans);
            text-align: right;
            padding-right: 16px;
            flex-shrink: 0;
        }
        
        .move-cell {
            flex: 1;
            color: var(--text-main);
            font-weight: 500;
            cursor: default;
        }
        .move-cell:last-child {
            color: var(--text-muted);
        }

        /* Controls Section */
        .sidebar-footer {
            padding: 24px 32px;
            background: var(--bg-panel);
            border-top: var(--border-subtle);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 6px;
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.2);
            color: var(--text-main);
        }

        /* Primary Action */
        .btn-primary {
            background: var(--board-dark);
            border-color: var(--board-dark);
            color: #fff;
            grid-column: span 2;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(48, 105, 152, 0.3);
        }
        .btn-primary:hover {
            background: #3d7bb0;
            border-color: #3d7bb0;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(48, 105, 152, 0.4);
        }

        /* SVG Icons */
        .icon { width: 16px; height: 16px; fill: currentColor; }

        /* Responsive */
        @media (max-width: 1050px) {
            .app-container {
                flex-direction: column;
                padding: 20px;
                height: auto;
                overflow-y: auto;
            }
            body { overflow-y: auto; height: auto; }
            
            .board-container { width: 100%; max-width: 500px; padding: 12px; }
            .board-wrapper { width: 100%; height: auto; aspect-ratio: 1/1; }
            .coord-rank { height: 12.5%; }
            .coord-file { width: 12.5%; }
            
            .sidebar { width: 100%; max-width: 500px; height: auto; min-height: 400px; }
            .history-list { min-height: 200px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- Left: Board -->
    <div class="board-container">
        <div class="board-wrapper">
            <div class="board" id="chessboard">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <!-- Right: Unified Sidebar -->
    <div class="sidebar">
        
        <!-- Header / Status -->
        <div class="sidebar-header">
            <div class="game-title">Classical • 10+0</div>
            <div class="status-row">
                <div class="status-indicator">
                    <div class="turn-text">
                        <div class="turn-dot white" id="turnDot"></div>
                        <span id="statusText">White to Move</span>
                    </div>
                </div>
                <div class="timer" id="timer">10:00</div>
            </div>
        </div>

        <!-- Move History -->
        <div class="sidebar-body">
            <div class="history-header">Moves</div>
            <div class="history-list" id="moveHistory">
                <!-- Moves injected here -->
            </div>
        </div>

        <!-- Controls -->
        <div class="sidebar-footer">
            <div class="controls-grid">
                <button class="btn" onclick="resetGame()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                    Reset
                </button>
                <button class="btn">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H6v-2h6v2zm4-4H6v-2h10v2zm0-4H6V7h10v2z"/></svg>
                    Analyze
                </button>
                
                <button class="btn btn-primary" onclick="newGame()">
                    New Game
                </button>
            </div>
        </div>
    </div>
</div>

        bR: `<svg viewBox="0 0 45 45" xmlns="http://www.w3.org/2000/svg"><g fill="#262421" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"><path d="M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5"/><path d="M34 14l-3 3H14l-3-3"/><path d="M31 17v12.5H14V17"/><path d="M31 29.5l1.5 2.5h-20l1.5-2.5"/><path d="M11 14h23" fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="miter"/></g></svg>`,
        bQ: `<svg viewBox="0 0 45 45" xmlns="http://www.w3.org/2000/svg"><g fill="#262421" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"><path d="M8 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM24.5 7.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM41 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM10.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM38.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5-3-15-3 15-5.5-13.5V25l-7-11 2 12zM9 26c0 2 1.5 2 2.5 4 1 2.5 1 4.5 1 4.5h20s0-2 1-4.5c1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z"/><path d="M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0"/></g></svg>`,
        bK: `<svg viewBox="0 0 45 45" xmlns="http://www.w3.org/2000/svg"><g fill="#262421" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"><path d="M22.5 11.63V6M20 8h5"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-5 2-8 2s-4-2-8-2-4 1-8-2-4-3-8-2c-3 6 6 10.5 6 10.5v7z"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/></g></svg>`,
    };

    // --- State ---
    const initialBoard = [
        ['bR', 'bN', 'bB', 'bQ', 'bK', 'bB', 'bN', 'bR'],
        ['bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP'],
        ['wR', 'wN', 'wB', 'wQ', 'wK', 'wB', 'wN', 'wR']
    ];

    let board = JSON.parse(JSON.stringify(initialBoard));
    let turn = 'w'; // 'w' or 'b'
    let selectedSquare = null;

    // --- Rendering ---
    const boardEl = document.getElementById('chessboard');
    const moveHistoryEl = document.getElementById('moveHistory');
    const statusText = document.getElementById('statusText');
    const turnDot = document.getElementById('turnDot');
    const timerEl = document.getElementById('timer');

    function renderBoard() {
        boardEl.innerHTML = '';
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.dataset.row = r;
                square.dataset.col = c;
                square.onclick = () => handleSquareClick(r, c);

                // Coordinate Labels (Top-Left for Rank, Bottom-Right for File)
                // Rank on a-file (c=0), File on 8th rank (r=7)
                if (c === 0) {
                    const rankLabel = document.createElement('span');
                    rankLabel.className = 'coord-label coord-rank';
                    rankLabel.innerText = 8 - r;
                    square.appendChild(rankLabel);
                }
                if (r === 7) {
                    const fileLabel = document.createElement('span');
                    fileLabel.className = 'coord-label coord-file';
                    fileLabel.innerText = String.fromCharCode(97 + c);
                    square.appendChild(fileLabel);
                }

                // Piece
                const pieceCode = board[r][c];
                if (pieceCode) {
                    const piece = document.createElement('div');
                    piece.className = 'piece';
                    piece.innerHTML = SVG_PIECES[pieceCode];
                    square.appendChild(piece);
                }

                // Selection highlight
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    square.classList.add('selected');
                }

                boardEl.appendChild(square);
            }
        }
    }

    function updateStatus() {
        const player = turn === 'w' ? 'White' : 'Black';
        statusText.innerText = `${player} to Move`;
        turnDot.className = `turn-dot ${turn === 'w' ? 'white' : 'black'}`;
    }

    // --- Interaction ---
    function handleSquareClick(r, c) {
        const piece = board[r][c];
        const isOwnPiece = piece && piece.startsWith(turn);

        if (isOwnPiece) {
            // Select piece
            selectedSquare = { r, c };
            renderBoard();
        } else if (selectedSquare) {
            // Move piece (Visual only for this demo)
            movePiece(selectedSquare.r, selectedSquare.c, r, c);
        }
    }

    function movePiece(fromR, fromC, toR, toC) {
        const piece = board[fromR][fromC];
        
        // Update board state
        board[toR][toC] = piece;
        board[fromR][fromC] = '';
        
        // Add fake move to history
        addMoveToHistory(piece, fromR, fromC, toR, toC);

        // Switch turn
        turn = turn === 'w' ? 'b' : 'w';
        selectedSquare = null;
        
        renderBoard();
        updateStatus();
    }

    function addMoveToHistory(piece, fromR, fromC, toR, toC) {
        const files = 'abcdefgh';
        const ranks = '87654321';
        
        // Simple notation logic
        const pieceChar = piece[1] === 'P' ? '' : piece[1].toUpperCase();
        const notation = pieceChar + files[toC] + ranks[toR];

        const moveNum = Math.ceil((moveHistoryEl.children.length + 1) / 2);
        
        // If it's white's move, create new row
        // Note: In this simple logic, turn has already flipped in movePiece, 
        // so if turn is 'b', it means White JUST moved.
        if (turn === 'b') { 
            const row = document.createElement('div');
            row.className = 'move-row';
            row.innerHTML = `
                <div class="move-num">${moveNum}.</div>
                <div class="move-cell">${notation}</div>
                <div class="move-cell"></div>
            `;
            moveHistoryEl.appendChild(row);
        } else { // Black just moved
            const lastRow = moveHistoryEl.lastElementChild;
            if (lastRow) {
                lastRow.querySelector('.move-cell:nth-child(3)').innerText = notation;
            }
        }
        
        // Auto scroll
        moveHistoryEl.scrollTop = moveHistoryEl.scrollHeight;
    }

    function resetGame() {
        board = JSON.parse(JSON.stringify(initialBoard));
        turn = 'w';
        selectedSquare = null;
        moveHistoryEl.innerHTML = '';
        timerEl.innerText = "10:00";
        renderBoard();
        updateStatus();
    }
    
    function newGame() {
        resetGame();
    }

    // --- Init ---
    renderBoard();
    updateStatus();

</script>
</body>
