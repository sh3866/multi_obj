<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* Palette - Deep Wood & Cream */
            --bg-body: #1e2023; /* Dark Matte Grey */
            --bg-panel: #26292e; /* Slightly lighter panel */
            
            --text-main: #e6e6e6;
            --text-muted: #9ca3af;
            --text-dim: #52575f;

            /* Critique 1: Richer board palette */
            --board-light: #e8ebd4; /* Cream/Off-white */
            --board-dark: #4b7399;  /* Deep Classic Blue */
            
            --highlight: rgba(255, 255, 255, 0.4);
            --valid-move: rgba(0, 0, 0, 0.15);
            --valid-capture: rgba(0, 0, 0, 0.15);
            
            --accent: #3b82f6; 
            --accent-hover: #60a5fa;
            
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "SF Mono", "Roboto Mono", "Courier New", monospace;
            
            --shadow-deep: 0 20px 40px -10px rgba(0,0,0,0.5);
            --border-color: #373b41;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Layout --- */
        .app-container {
            display: flex;
            gap: 40px;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            align-items: center;
            justify-content: center;
        }

        /* --- Board Section --- */
        .board-container {
            position: relative;
            /* Critique 5: Integrated coordinates frame */
            padding: 24px; 
            background-color: var(--bg-panel);
            border-radius: 8px;
            box-shadow: var(--shadow-deep);
            border: 1px solid var(--border-color);
        }

        .board-wrapper {
            position: relative;
            width: 640px;
            height: 640px;
            /* Board border/frame */
            border: 2px solid #333; 
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            user-select: none;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        
        /* Highlights */
        .square.selected { 
            background-color: rgba(255, 255, 255, 0.5) !important; 
        }
        
        /* Dot for valid moves */
        .square.valid-move::after {
            content: '';
            width: 24%;
            height: 24%;
            background: var(--valid-move);
            border-radius: 50%;
            position: absolute;
        }
        
        /* Ring for captures */
        .square.valid-capture::after {
            content: '';
            width: 85%;
            height: 85%;
            border: 4px solid var(--valid-capture);
            border-radius: 50%;
            position: absolute;
        }

        /* Coordinate Labels (Inside the Frame) */
        .coord-label {
            position: absolute;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            font-family: var(--font-sans);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        
        .coord-rank {
            left: 6px;
            height: 80px; /* 640 / 8 */
        }
        
        .coord-file {
            bottom: 6px;
            width: 80px;
        }

        /* Pieces */
        .piece {
            width: 85%;
            height: 85%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            cursor: pointer;
            transition: transform 0.1s ease;
            z-index: 2;
            /* Critique 2: Refine piece styling - soft directional shadow */
            filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.35));
        }
        .piece:hover { transform: scale(1.1); }

        /* --- Unified Sidebar --- */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            border-radius: 12px;
            box-shadow: var(--shadow-deep);
            overflow: hidden;
            border: 1px solid var(--border-color);
            min-width: 360px;
            max-width: 400px;
            height: 700px; /* Fixed height for balance */
        }

        /* 1. Header Section - Critique 3: Make timer/status prominent */
        .sidebar-header {
            padding: 32px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .game-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-weight: 700;
            align-self: flex-start;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .status-indicator {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .turn-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .turn-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #fff;
            border: 1px solid #999;
            box-shadow: 0 0 8px rgba(255,255,255,0.4);
            transition: all 0.3s ease;
        }
        .turn-dot.black { 
            background-color: #111; 
            border-color: #555;
            box-shadow: 0 0 8px rgba(0,0,0,0.4);
        }

        .timer {
            font-family: var(--font-mono);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
            background: #16181b;
            padding: 12px 24px;
            border-radius: 12px;
            letter-spacing: -2px;
            border: 1px solid #333;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        /* 2. History Section */
        .sidebar-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background: #212327;
        }

        .history-header {
            padding: 16px 32px;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.02);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            font-family: var(--font-mono); /* Monospace aligns numbers better */
            font-size: 1rem;
            position: relative;
        }

        /* Critique 3: Placeholder for empty state */
        .history-list:empty::before {
            content: "Waiting for first move...";
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-dim);
            font-family: var(--font-sans);
            font-style: italic;
            font-size: 0.9rem;
            pointer-events: none;
        }

        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: #373b41; border-radius: 3px; }

        .move-row {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            height: 44px;
            align-items: center;
            transition: background 0.1s;
        }
        .move-row:hover { background: rgba(255,255,255,0.02); }
        
        .move-num {
            width: 40px;
            color: var(--text-dim);
            font-size: 0.85rem;
            font-family: var(--font-sans);
            font-weight: 600;
            text-align: center;
            flex-shrink: 0;
        }
        
        .move-cell {
            flex: 1;
            padding: 0 16px;
            color: var(--text-main);
            cursor: default;
            font-weight: 500;
        }
        .move-cell:last-child {
            color: var(--text-muted);
        }

        /* 3. Controls Section */
        .sidebar-footer {
            padding: 24px 32px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border-color);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 6px;
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: #32363d;
            border-color: #52575f;
            color: var(--text-main);
        }

        /* Critique 4: Distinct accent for primary action */
        .btn-primary {
            background: var(--board-dark);
            border-color: var(--board-dark);
            color: #fff;
            grid-column: span 2;
            font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(75, 115, 153, 0.2);
        }
        .btn-primary:hover {
            background: #5882ab;
            border-color: #5882ab;
            transform: translateY(-1px);
        }

        /* SVG Icons */
        .icon { width: 16px; height: 16px; fill: currentColor; }

        /* Responsive */
        @media (max-width: 1000px) {
            .app-container {
                flex-direction: column;
                align-items: center;
                padding: 20px;
                height: auto;
                overflow-y: auto;
            }
            body { overflow-y: auto; height: auto; }
            
            .board-container { width: 100%; max-width: 600px; padding: 20px; }
            .board-wrapper { width: 100%; height: auto; aspect-ratio: 1/1; }
            
            .sidebar { width: 100%; max-width: 600px; height: auto; min-height: 300px; }
            .history-list { min-height: 150px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- Left: Board -->
    <div class="board-container">
        <div class="board-wrapper">
            <div class="board" id="chessboard">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <!-- Right: Unified Sidebar -->
    <div class="sidebar">
        
        <!-- Header / Status -->
        <div class="sidebar-header">
            <div class="game-title">Classical • 10+0</div>
            <div class="status-row">
                <div class="status-indicator">
                    <div class="turn-text">
                        <div class="turn-dot white" id="turnDot"></div>
                        <span id="statusText">White to Move</span>
                    </div>
                </div>
                <div class="timer" id="timer">10:00</div>
            </div>
        </div>

        <!-- Move History -->
        <div class="sidebar-body">
            <div class="history-header">Moves</div>
            <div class="history-list" id="moveHistory">
                <!-- Moves injected here -->
            </div>
        </div>

        <!-- Controls -->
        <div class="sidebar-footer">
            <div class="controls-grid">
                <button class="btn" onclick="resetGame()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    Reset
                </button>
                <!-- Replaced 'Edit' with 'Analyze' for better context -->
                <button class="btn">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H6v-2h6v2zm4-4H6v-2h10v2zm0-4H6V7h10v2z"/></svg>
                    Analyze
                </button>
                
                <button class="btn btn-primary" onclick="newGame()">
                    New Game
                </button>
            </div>
        </div>
    </div>
</div>

        bR: `<svg viewBox="0 0 45 45" xmlns="http://www.w3.org/2000/svg"><g fill="#1a1a1a" stroke="#fff" stroke-width="1.5"><path d="M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5"/><path d="M34 14l-3 3H14l-3-3"/><path d="M31 17v12.5H14V17"/><path d="M31 29.5l1.5 2.5h-20l1.5-2.5"/><path d="M11 14h23" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="miter"/></g></svg>`,
        bQ: `<svg viewBox="0 0 45 45" xmlns="http://www.w3.org/2000/svg"><g fill="#1a1a1a" stroke="#fff" stroke-width="1.5"><path d="M8 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM24.5 7.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM41 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM10.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM38.5 20a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11V11l-5.5 13.5-3-15-3 15-5.5-13.5V25l-7-11 2 12zM9 26c0 2 1.5 2 2.5 4 1 2.5 1 4.5 1 4.5h20s0-2 1-4.5c1-2 2.5-2 2.5-4-8.5-1.5-18.5-1.5-27 0z"/><path d="M11.5 30c3.5-1 18.5-1 22 0M12 33.5c6-1 15-1 21 0"/></g></svg>`,
        bK: `<svg viewBox="0 0 45 45" xmlns="http://www.w3.org/2000/svg"><g fill="#1a1a1a" stroke="#fff" stroke-width="1.5"><path d="M22.5 11.63V6M20 8h5"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-5 2-8 2s-4-2-8-2-4 1-8-2-4-3-8-2c-3 6 6 10.5 6 10.5v7z"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/></g></svg>`,
    };

    // --- State ---
    const initialBoard = [
        ['bR', 'bN', 'bB', 'bQ', 'bK', 'bB', 'bN', 'bR'],
        ['bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP'],
        ['wR', 'wN', 'wB', 'wQ', 'wK', 'wB', 'wN', 'wR']
    ];

    let board = JSON.parse(JSON.stringify(initialBoard));
    let turn = 'w'; // 'w' or 'b'
    let selectedSquare = null;

    // --- Rendering ---
    const boardEl = document.getElementById('chessboard');
    const moveHistoryEl = document.getElementById('moveHistory');
    const statusText = document.getElementById('statusText');
    const turnDot = document.getElementById('turnDot');
    const timerEl = document.getElementById('timer');

    function renderBoard() {
        boardEl.innerHTML = '';
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.dataset.row = r;
                square.dataset.col = c;
                square.onclick = () => handleSquareClick(r, c);

                // Piece
                const pieceCode = board[r][c];
                if (pieceCode) {
                    const piece = document.createElement('div');
                    piece.className = 'piece';
                    piece.innerHTML = SVG_PIECES[pieceCode];
                    square.appendChild(piece);
                }

                // Selection highlight
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    square.classList.add('selected');
                }

                boardEl.appendChild(square);
            }
        }

        // Add Coordinate Labels (Critique 5: Inside the frame)
        const wrapper = document.querySelector('.board-wrapper');
        // Remove old labels
        wrapper.querySelectorAll('.coord-label').forEach(el => el.remove());

        // Ranks (Numbers) - Left side
        for(let i=0; i<8; i++) {
            const label = document.createElement('div');
            label.className = 'coord-label coord-rank';
            label.innerText = 8 - i;
            // Position inside the padding area
            // 80px per square (640/8)
            label.style.top = (i * 80 + 34) + 'px'; // Centered vertically in square
            wrapper.appendChild(label);
        }

        // Files (Letters) - Bottom side
        for(let i=0; i<8; i++) {
            const label = document.createElement('div');
            label.className = 'coord-label coord-file';
            label.innerText = String.fromCharCode(97 + i);
            label.style.left = (i * 80 + 34) + 'px'; // Centered horizontally in square
            wrapper.appendChild(label);
        }
    }

    function updateStatus() {
        const player = turn === 'w' ? 'White' : 'Black';
        statusText.innerText = `${player} to Move`;
        turnDot.className = `turn-dot ${turn === 'w' ? 'white' : 'black'}`;
    }

    // --- Interaction ---
    function handleSquareClick(r, c) {
        const piece = board[r][c];
        const isOwnPiece = piece && piece.startsWith(turn);

        if (isOwnPiece) {
            // Select piece
            selectedSquare = { r, c };
            renderBoard();
        } else if (selectedSquare) {
            // Move piece (Visual only for this demo)
            movePiece(selectedSquare.r, selectedSquare.c, r, c);
        }
    }

    function movePiece(fromR, fromC, toR, toC) {
        const piece = board[fromR][fromC];
        
        // Update board state
        board[toR][toC] = piece;
        board[fromR][fromC] = '';
        
        // Add fake move to history
        addMoveToHistory(piece, fromR, fromC, toR, toC);

        // Switch turn
        turn = turn === 'w' ? 'b' : 'w';
        selectedSquare = null;
        
        renderBoard();
        updateStatus();
    }

    function addMoveToHistory(piece, fromR, fromC, toR, toC) {
        const files = 'abcdefgh';
        const ranks = '87654321';
        
        // Simple notation logic
        const pieceChar = piece[1] === 'P' ? '' : piece[1].toUpperCase();
        const notation = pieceChar + files[toC] + ranks[toR];

        const moveNum = Math.ceil((moveHistoryEl.children.length + 1) / 2);
        
        // If it's white's move, create new row
        // Note: In this simple logic, turn has already flipped in movePiece, 
        // so if turn is 'b', it means White JUST moved.
        if (turn === 'b') { 
            const row = document.createElement('div');
            row.className = 'move-row';
            row.innerHTML = `
                <div class="move-num">${moveNum}.</div>
                <div class="move-cell">${notation}</div>
                <div class="move-cell"></div>
            `;
            moveHistoryEl.appendChild(row);
        } else { // Black just moved
            const lastRow = moveHistoryEl.lastElementChild;
            if (lastRow) {
                lastRow.querySelector('.move-cell:nth-child(3)').innerText = notation;
            }
        }
        
        // Auto scroll
        moveHistoryEl.scrollTop = moveHistoryEl.scrollHeight;
    }

    function resetGame() {
        board = JSON.parse(JSON.stringify(initialBoard));
        turn = 'w';
        selectedSquare = null;
        moveHistoryEl.innerHTML = '';
        timerEl.innerText = "10:00";
        renderBoard();
        updateStatus();
    }
    
    function newGame() {
        resetGame();
    }

    // --- Init ---
    renderBoard();
    updateStatus();

</script>
</body>
</html>
