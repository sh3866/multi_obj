<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless - Premium Cleaning Service</title>
    <style>
        :root {
            /* Palette: Warm, Wood-toned Harmony */
            --bg-color: #F4F1EA; 
            --text-main: #4A3B2C; /* Warm dark brown instead of blue-black */
            --text-muted: #7D6E5E; /* Warm grey-brown */
            --accent-primary: #C75B12; /* Burnt Orange/Terracotta */
            --accent-hover: #A84A0D;
            
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-stack);
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
        }

        /* Layout */
        .container {
            display: grid;
            grid-template-columns: 480px 1fr;
            width: 100%;
            height: 100vh;
        }

        /* Left Panel: UI */
        .sidebar {
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--bg-color);
            z-index: 10;
            position: relative;
            border-right: 1px solid rgba(74, 59, 44, 0.08);
        }

        .brand {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-main);
            margin-bottom: 80px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 12px;
            height: 12px;
            background: var(--accent-primary);
            border-radius: 50%;
        }

        h1 {
            font-size: 58px;
            line-height: 1.1;
            color: var(--text-main);
            margin: 0 0 28px 0;
            font-weight: 700;
            letter-spacing: -1px;
        }

        p {
            font-size: 19px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 50px;
            max-width: 400px;
            font-weight: 400;
        }

        .cta-button {
            background-color: var(--accent-primary);
            color: #fff;
            border: none;
            padding: 22px 44px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 4px; /* Slightly less round for a premium feel */
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: fit-content;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 20px rgba(199, 91, 18, 0.2);
        }

        .cta-button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(199, 91, 18, 0.3);
        }

        /* Right Panel: Scene */
        .scene-container {
            position: relative;
            background-color: #E6DCC8; 
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sidebar > * {
            animation: fadeUp 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
        }
        .sidebar > *:nth-child(1) { animation-delay: 0.1s; }
        .sidebar > *:nth-child(2) { animation-delay: 0.2s; }
        .sidebar > *:nth-child(3) { animation-delay: 0.3s; }
        .sidebar > *:nth-child(4) { animation-delay: 0.4s; }

    </style>
</head>
<body>

<div class="container">
    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="brand">Spotless Co.</div>
        
        <h1>Restoring<br>natural warmth.</h1>
        
        <p>We don't just clean surfaces; we restore the soul of your home. Deep cleaning that respects the texture and history of your space.</p>

        <button class="cta-button">Book a Clean</button>
    </div>

    <!-- Right Visual Scene -->
    <div class="scene-container">
        <svg viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- LIGHTING FILTERS -->
                <!-- Soft Drop Shadow -->
                <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
                    <feOffset dx="12" dy="22" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.4"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <!-- Wet Blur -->
                <filter id="wetBlur">
                    <feGaussianBlur stdDeviation="4" />
                </filter>

                <!-- WOOD TEXTURE GENERATION -->
                <!-- 1. Base Planks -->
                <pattern id="planks" x="0" y="0" width="1000" height="240" patternUnits="userSpaceOnUse">
                    <rect width="1000" height="240" fill="#D4B48E" />
                    <!-- Plank Gap (Shadow) -->
                    <rect x="0" y="238" width="1000" height="2" fill="#7A5C3E" opacity="0.6" />
                    <!-- Plank Gap (Highlight edge) -->
                    <rect x="0" y="237" width="1000" height="1" fill="#F5E6D3" opacity="0.5" />
                </pattern>

                <!-- 2. Wood Grain Noise -->
                <filter id="woodGrain">
                    <!-- Horizontal grain noise -->
                    <feTurbulence type="fractalNoise" baseFrequency="0.005 0.1" numOctaves="3" result="noise"/>
                    <feColorMatrix type="matrix" values="0 0 0 0 0.6   0 0 0 0 0.4   0 0 0 0 0.2   0 0 0 0.2 0" in="noise" result="coloredNoise"/>
                    <feComposite operator="in" in="coloredNoise" in2="SourceGraphic" result="texture"/>
                    <feBlend mode="multiply" in="texture" in2="SourceGraphic" />
                </filter>

                <!-- 3. Wood Knots -->
                <g id="knots" opacity="0.15" fill="#5C4033">
                    <ellipse cx="250" cy="120" rx="4" ry="18" transform="rotate(90 250 120)"/>
                    <ellipse cx="850" cy="60" rx="5" ry="22" transform="rotate(90 850 60)"/>
                    <ellipse cx="600" cy="480" rx="3" ry="12" transform="rotate(90 600 480)"/>
                </g>

                <!-- LIQUID GRADIENTS -->
                <!-- The Spill Body (Coffee/Spilled Drink) -->
                <radialGradient id="spillBody" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" style="stop-color:#E5C56B;stop-opacity:0.85" />
                    <stop offset="70%" style="stop-color:#C29B24;stop-opacity:0.9" />
                    <stop offset="100%" style="stop-color:#8A6D15;stop-opacity:0.85" />
                </radialGradient>

                <!-- The "Wet" Darkening (Water soaking in) -->
                <radialGradient id="wetDarken" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#4A3B2C;stop-opacity:0.5" />
                    <stop offset="100%" style="stop-color:#4A3B2C;stop-opacity:0" />
                </radialGradient>

                <!-- Sunbeam Gradient -->
                <linearGradient id="sunbeam" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#FFF;stop-opacity:0.12" />
                    <stop offset="100%" style="stop-color:#FFF;stop-opacity:0" />
                </linearGradient>
            </defs>

            <!-- BACKGROUND: FLOOR -->
            <!-- 1. Base Pattern -->
            <rect width="100%" height="100%" fill="url(#planks)" />
            
            <!-- 2. Apply Grain Texture -->
            <rect width="100%" height="100%" fill="url(#planks)" filter="url(#woodGrain)" style="mix-blend-mode: multiply;" />
            
            <!-- 3. Knots Layer -->
            <use href="#knots" />

            <!-- SCENE COMPOSITION -->
            <g id="scene" transform="translate(0, 0)">
                
                <!-- 1. THE SPILL -->
                <!-- Located centrally-right -->
                <g transform="translate(550, 450)">
                    
                    <!-- A. The Wet Patch (Darkening the wood underneath) -->
                    <path d="M-200,-20 C-160,-130 70,-150 160,-60 C230,10 190,140 80,150 C-40,160 -240,60 -200,-20 Z" 
                          fill="url(#wetDarken)" filter="url(#wetBlur)"/>

                    <!-- B. The Liquid Surface -->
                    <path d="M-160,-10 C-130,-100 40,-110 110,-50 C170,0 140,100 60,90 C-50,100 -180,60 -160,-10 Z" 
                          fill="url(#spillBody)" opacity="0.95" />

                    <!-- C. Surface Reflections (Specular highlights - diagonal to match light) -->
                    <path d="M-100,-30 Q-20,-80 60,-30" stroke="#FFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.5" filter="url(#wetBlur)"/>
                    <ellipse cx="-60" cy="20" rx="25" ry="6" fill="#FFF" opacity="0.4" transform="rotate(-25 -60 20)"/>
                    <ellipse cx="60" cy="-10" rx="15" ry="5" fill="#FFF" opacity="0.3" transform="rotate(-25 60 -10)"/>

                    <!-- D. Splatters -->
                    <g fill="#C29B24" opacity="0.9">
                        <!-- Large drops -->
                        <circle cx="170" cy="-30" r="12" />
                        <circle cx="190" cy="-10" r="6" />
                        <circle cx="210" cy="20" r="4" />
                        <circle cx="-180" cy="40" r="9" />
                        <circle cx="-160" cy="60" r="5" />
                        <!-- Tiny droplets -->
                        <circle cx="150" cy="-60" r="2.5" />
                        <circle cx="-130" cy="-50" r="2" />
                        <circle cx="120" cy="110" r="3" />
                    </g>
                </g>

                <!-- 2. THE MOP (Flat Microfiber Style) -->
                <g filter="url(#dropShadow)">
                    
                    <!-- A. The Handle -->
                    <!-- Main stick -->
                    <line x1="200" y1="100" x2="480" y2="480" stroke="#E0D6CC" stroke-width="24" stroke-linecap="round" />
                    <!-- Stick Highlight (Cylindrical feel) -->
                    <line x1="200" y1="100" x2="480" y2="480" stroke="#F9F7F2" stroke-width="8" stroke-linecap="round" opacity="0.9" />
                    <!-- Stick Shadow (Bottom edge) -->
                    <line x1="200" y1="100" x2="480" y2="480" stroke="#A89F91" stroke-width="4" stroke-linecap="round" transform="translate(3,3)" opacity="0.4" />

                    <!-- B. The Connector (Metal joint) -->
                    <circle cx="480" cy="480" r="16" fill="#374151" />
                    <circle cx="480" cy="480" r="10" fill="#1F2937" />
                    <circle cx="478" cy="478" r="3" fill="#9CA3AF" opacity="0.6" /> <!-- Specular -->

                    <!-- C. The Mop Head (Flat Microfiber) -->
                    <!-- Rotated to align with handle angle (~62 degrees) -->
                    <g transform="translate(480, 480) rotate(62)">
                        
                        <!-- Metal Base Plate (Rectangular with rounded corners) -->
                        <rect x="-50" y="-12" width="100" height="24" rx="4" fill="#4B5563" />
                        <rect x="-48" y="-10" width="96" height="20" rx="3" fill="#9CA3AF" opacity="0.2" /> <!-- Plate highlight -->

                        <!-- The Microfiber Cloth -->
                        <!-- Base cloth shape -->
                        <path d="M-55,-5 L-55,45 C-55,50 55,50 55,45 L55,-5 Z" fill="#F0F0F0" />
                        
                        <!-- Cloth Texture (Horizontal lines for fibers) -->
                        <g stroke="#D1D5DB" stroke-width="1" opacity="0.6">
                            <line x1="-55" y1="0" x2="55" y2="0" />
                            <line x1="-55" y1="5" x2="55" y2="5" />
                            <line x1="-55" y1="10" x2="55" y2="10" />
                            <line x1="-55" y1="15" x2="55" y2="15" />
                            <line x1="-55" y1="20" x2="55" y2="20" />
                            <line x1="-55" y1="25" x2="55" y2="25" />
                            <line x1="-55" y1="30" x2="55" y2="30" />
                            <line x1="-55" y1="35" x2="55" y2="35" />
                            <line x1="-55" y1="40" x2="55" y2="40" />
                        </g>

                        <!-- The "Wet" Streak on the cloth -->
                        <!-- This creates the illusion it just passed through the mess -->
                        <path d="M-40,10 L40,10 L45,40 L-45,40 Z" fill="#C29B24" opacity="0.4" filter="url(#wetBlur)"/>
                        <path d="M-35,15 L35,15 L38,35 L-38,35 Z" fill="#C29B24" opacity="0.6" />

                        <!-- Cloth Folds/Shadow -->
                        <path d="M-55,45 C-55,50 55,50 55,45 L50,50 C0,55 -50,55 -55,50 Z" fill="#000" opacity="0.1" filter="url(#wetBlur)"/>
                    </g>
                </g>

                <!-- 3. LIGHTING & ATMOSPHERE -->
                
                <!-- Sunbeam from Top Right -->
                <polygon points="1000,0 1000,800 200,800" fill="url(#sunbeam)" style="mix-blend-mode: overlay;" pointer-events="none"/>

                <!-- Sparkles/Dust Motes (Floating in the light) -->
                <g fill="#FFF" opacity="0.7">
                    <circle cx="750" cy="250" r="2" filter="url(#wetBlur)"/>
                    <circle cx="880" cy="380" r="1.5" />
                    <circle cx="680" cy="180" r="2.5" opacity="0.5" />
                    <circle cx="450" cy="280" r="1" />
                </g>

            </g>
        </svg>
    </div>
</div>

</body>
</html>
