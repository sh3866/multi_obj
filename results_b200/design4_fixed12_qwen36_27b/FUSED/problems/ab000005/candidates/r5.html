<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless - Premium Cleaning Service</title>
    <style>
        :root {
            /* Palette: Refined Earth Tones */
            --bg-color: #F7F4EE; 
            --text-main: #3E2723; /* Deep Coffee */
            --text-muted: #6D5E56; /* Taupe */
            --accent-primary: #5D4037; /* Dark Wood/Brown - Premium Mute */
            --accent-hover: #4E342E;
            --accent-secondary: #8D6E63; /* Lighter Wood */
            
            /* Typography: High Contrast & Character */
            --font-serif: "Playfair Display", "Didot", "Times New Roman", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* Layout */
        .container {
            display: grid;
            grid-template-columns: 450px 1fr;
            width: 100%;
            height: 100vh;
        }

        /* Left Panel: UI */
        .sidebar {
            padding: 90px 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--bg-color);
            z-index: 10;
            position: relative;
            border-right: 1px solid rgba(62, 39, 35, 0.06);
        }

        .brand {
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-main);
            margin-bottom: 100px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 20px;
            height: 2px;
            background: var(--accent-primary);
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 64px;
            line-height: 1.05;
            color: var(--text-main);
            margin: 0 0 32px 0;
            font-weight: 400; /* Lighter weight for elegance */
            letter-spacing: -0.5px;
        }

        h1 span {
            font-style: italic;
            color: var(--accent-secondary);
        }

        p {
            font-family: var(--font-sans);
            font-size: 17px;
            line-height: 1.7; /* Increased for readability */
            color: var(--text-muted);
            margin-bottom: 60px;
            max-width: 380px;
            font-weight: 300;
        }

        .cta-button {
            background-color: var(--accent-primary);
            color: #FFF;
            border: none;
            padding: 24px 48px;
            font-family: var(--font-sans);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 2px; /* Sharp but slightly softened */
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: fit-content;
            box-shadow: 0 10px 30px rgba(93, 64, 55, 0.2);
            text-transform: uppercase;
        }

        .cta-button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(93, 64, 55, 0.3);
        }

        /* Right Panel: Scene */
        .scene-container {
            position: relative;
            background-color: #EAE3D5; 
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sidebar > * {
            animation: fadeUp 1s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
            opacity: 0;
        }
        .sidebar > *:nth-child(1) { animation-delay: 0.1s; }
        .sidebar > *:nth-child(2) { animation-delay: 0.25s; }
        .sidebar > *:nth-child(3) { animation-delay: 0.4s; }
        .sidebar > *:nth-child(4) { animation-delay: 0.55s; }

    </style>
</head>
<body>

<div class="container">
    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="brand">Spotless Co.</div>
        
        <h1>Restoring<br>the <span>natural</span><br>warmth.</h1>
        
        <p>We don't just clean surfaces; we restore the soul of your home. Deep cleaning that respects the texture and history of your space.</p>

        <button class="cta-button">Book a Clean</button>
    </div>

    <!-- Right Visual Scene -->
    <div class="scene-container">
        <svg viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- FILTERS -->
                <!-- Complex Wood Grain Texture -->
                <filter id="woodGrain" x="0%" y="0%" width="100%" height="100%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.003 0.05" numOctaves="4" result="noise"/>
                    <feColorMatrix type="matrix" values="0 0 0 0 0.55   0 0 0 0 0.35   0 0 0 0 0.2   0 0 0 0.4 0" in="noise" result="coloredNoise"/>
                    <feComposite operator="in" in="coloredNoise" in2="SourceGraphic" result="texture"/>
                    <feBlend mode="multiply" in="texture" in2="SourceGraphic" />
                </filter>

                <!-- Soft, grounded Drop Shadow -->
                <filter id="realShadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
                    <feOffset dx="15" dy="25" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.35"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <!-- Refraction / Wet Blur -->
                <filter id="wetBlur">
                    <feGaussianBlur stdDeviation="3" />
                </filter>

                <!-- Liquid Specular -->
                <filter id="specular">
                    <feGaussianBlur stdDeviation="1.5" />
                </filter>

                <!-- LIGHTING GRADIENTS -->
                <!-- Vignette -->
                <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
                    <stop offset="60%" stop-color="#000" stop-opacity="0" />
                    <stop offset="100%" stop-color="#3E2723" stop-opacity="0.15" />
                </radialGradient>

                <!-- Sunbeam -->
                <linearGradient id="sunbeam" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#FFF" stop-opacity="0.15" />
                    <stop offset="50%" stop-color="#FFF" stop-opacity="0.05" />
                    <stop offset="100%" stop-color="#FFF" stop-opacity="0" />
                </linearGradient>

                <!-- WOOD PLANK PATTERN -->
                <!-- Pattern is taller to allow for staggered planks -->
                <pattern id="floorPlanks" x="0" y="0" width="200" height="600" patternUnits="userSpaceOnUse">
                    <!-- Base Plank Color -->
                    <rect width="200" height="600" fill="#D2B48C" />
                    
                    <!-- Planks -->
                    <!-- Plank 1 -->
                    <rect x="0" y="0" width="198" height="148" fill="#CFA777" />
                    <!-- Plank 2 (Offset) -->
                    <rect x="0" y="150" width="198" height="198" fill="#D4B48E" />
                    <!-- Plank 3 -->
                    <rect x="0" y="350" width="198" height="148" fill="#C69C6D" />
                    <!-- Plank 4 -->
                    <rect x="0" y="500" width="198" height="100" fill="#D1A672" />

                    <!-- Gaps (Shadows) -->
                    <rect x="0" y="148" width="200" height="2" fill="#4A3B2C" opacity="0.4" />
                    <rect x="0" y="348" width="200" height="2" fill="#4A3B2C" opacity="0.4" />
                    <rect x="0" y="498" width="200" height="2" fill="#4A3B2C" opacity="0.4" />
                    
                    <!-- Highlight Edges (Bevel) -->
                    <rect x="0" y="149" width="200" height="1" fill="#F5E6D3" opacity="0.3" />
                    <rect x="0" y="349" width="200" height="1" fill="#F5E6D3" opacity="0.3" />
                    <rect x="0" y="499" width="200" height="1" fill="#F5E6D3" opacity="0.3" />
                </pattern>

                <!-- LIQUID GRADIENTS -->
                <!-- The Spill (Coffee/Dirty Water) -->
                <radialGradient id="spillBody" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" style="stop-color:#8B5A2B;stop-opacity:0.8" />
                    <stop offset="60%" style="stop-color:#6F4E37;stop-opacity:0.9" />
                    <stop offset="100%" style="stop-color:#3E2723;stop-opacity:0.7" />
                </radialGradient>

                <!-- The "Wet" Darkening (Water soaking in) -->
                <radialGradient id="wetDarken" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#2D1A11;stop-opacity:0.6" />
                    <stop offset="80%" style="stop-color:#2D1A11;stop-opacity:0.2" />
                    <stop offset="100%" style="stop-color:#2D1A11;stop-opacity:0" />
                </radialGradient>
            </defs>

            <!-- BACKGROUND: FLOOR -->
            <!-- 1. Base Pattern -->
            <rect width="100%" height="100%" fill="url(#floorPlanks)" />
            
            <!-- 2. Apply Grain Texture (Global Overlay) -->
            <rect width="100%" height="100%" fill="url(#floorPlanks)" filter="url(#woodGrain)" style="mix-blend-mode: multiply; opacity: 0.8;" />
            
            <!-- 3. Knots & Imperfections Layer -->
            <g opacity="0.2" fill="#3E2723" filter="url(#wetBlur)">
                <ellipse cx="150" cy="120" rx="6" ry="25" transform="rotate(90 150 120)"/>
                <ellipse cx="850" cy="360" rx="8" ry="30" transform="rotate(90 850 360)"/>
                <ellipse cx="600" cy="680" rx="5" ry="20" transform="rotate(90 600 680)"/>
                <path d="M 300 500 Q 310 520 300 540" stroke="#3E2723" stroke-width="2" fill="none"/>
            </g>

            <!-- SCENE COMPOSITION -->
            <g id="scene" transform="translate(0, 0)">
                
                <!-- 1. THE SPILL -->
                <!-- Located centrally-right -->
                <g transform="translate(600, 480)">
                    
                    <!-- A. The Wet Patch (Darkening the wood underneath - Refraction) -->
                    <!-- Organic irregular shape -->
                    <path d="M-220,-20 C-180,-150 80,-180 180,-80 C250,0 220,160 90,170 C-50,180 -260,80 -220,-20 Z" 
                          fill="url(#wetDarken)" filter="url(#wetBlur)"/>

                    <!-- B. The Liquid Surface (Translucent) -->
                    <path d="M-180,-10 C-150,-120 50,-130 130,-60 C190,-10 160,120 70,110 C-60,120 -200,70 -180,-10 Z" 
                          fill="url(#spillBody)" opacity="0.9" style="mix-blend-mode: multiply;"/>

                    <!-- C. Surface Reflections (Specular highlights - diagonal from Top Left) -->
                    <!-- Main highlight streak -->
                    <path d="M-110,-40 Q-20,-100 70,-40" stroke="#FFF" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.4" filter="url(#specular)"/>
                    
                    <!-- Secondary highlights -->
                    <ellipse cx="-70" cy="10" rx="30" ry="8" fill="#FFF" opacity="0.3" transform="rotate(-25 -70 10)" filter="url(#specular)"/>
                    <ellipse cx="50" cy="-20" rx="18" ry="6" fill="#FFF" opacity="0.2" transform="rotate(-25 50 -20)" filter="url(#specular)"/>

                    <!-- D. Splatters (Realistic droplets) -->
                    <g fill="#6F4E37" opacity="0.85" filter="url(#wetBlur)">
                        <!-- Large drops -->
                        <circle cx="190" cy="-40" r="14" />
                        <circle cx="215" cy="-15" r="7" />
                        <circle cx="240" cy="25" r="5" />
                        <circle cx="-200" cy="50" r="11" />
                        <circle cx="-175" cy="75" r="6" />
                        <!-- Tiny droplets -->
                        <circle cx="160" cy="-70" r="3" />
                        <circle cx="-140" cy="-60" r="2.5" />
                        <circle cx="130" cy="130" r="4" />
                        <circle cx="-100" cy="140" r="3" />
                    </g>
                </g>

                <!-- 2. THE MOP (Fibers & Realism) -->
                <g filter="url(#realShadow)">
                    
                    <!-- A. The Handle -->
                    <!-- Main stick (Wood texture implied by color) -->
                    <line x1="200" y1="100" x2="490" y2="490" stroke="#D7CCC8" stroke-width="26" stroke-linecap="round" />
                    
                    <!-- Stick Highlight (Cylindrical feel - Top Left Light) -->
                    <line x1="200" y1="100" x2="490" y2="490" stroke="#F5F5F5" stroke-width="8" stroke-linecap="round" opacity="0.7" transform="translate(-4, -2)"/>
                    
                    <!-- Stick Shadow (Bottom edge) -->
                    <line x1="200" y1="100" x2="490" y2="490" stroke="#8D6E63" stroke-width="6" stroke-linecap="round" opacity="0.3" transform="translate(4,4)"/>

                    <!-- B. The Connector (Metal joint) -->
                    <circle cx="490" cy="490" r="18" fill="#424242" />
                    <circle cx="490" cy="490" r="12" fill="#212121" />
                    <circle cx="486" cy="486" r="4" fill="#FFF" opacity="0.5" /> <!-- Specular -->

                    <!-- C. The Mop Head (Wet Fibers) -->
                    <!-- Rotated to align with handle angle (~62 degrees) -->
                    <g transform="translate(490, 490) rotate(62)">
                        
                        <!-- Metal Base Plate -->
                        <rect x="-45" y="-10" width="90" height="20" rx="3" fill="#757575" />
                        <rect x="-43" y="-8" width="86" height="16" rx="2" fill="#9E9E9E" opacity="0.3" />

                        <!-- The Fiber Cloth (Dirty/Wet Look) -->
                        <!-- Instead of a flat rectangle, use a jagged, organic path -->
                        <path d="M-50,-10 L-50,50 C-45,55 -35,55 -30,50 L-20,60 C-10,65 0,55 10,60 L20,50 C30,55 40,60 50,55 L50,-10 Z" fill="#8D6E63" />

                        <!-- Fiber Texture (Clumps of dirt) -->
                        <g stroke="#5D4037" stroke-width="2" opacity="0.6">
                            <path d="M-45,0 L-20,0 M-30,10 L-10,10 M-40,20 L-15,20 M-35,30 L-5,30 M-25,40 L0,40" />
                            <path d="M0,0 L25,0 M10,10 L35,10 M-5,20 L20,20 M5,30 L30,30 M15,40 L40,40" />
                            <path d="M-45,5 L-25,5 M-30,15 L-10,15 M-40,25 L-15,25" />
                        </g>

                        <!-- The "Wet" Streak (Darker, saturated fibers) -->
                        <path d="M-35,15 L35,15 L40,50 L-40,50 Z" fill="#3E2723" opacity="0.4" filter="url(#wetBlur)"/>
                        
                        <!-- Highlight on wet fibers -->
                        <path d="M-30,20 L30,20 L35,45 L-35,45 Z" fill="#A1887F" opacity="0.3" />
                    </g>
                </g>

                <!-- 3. LIGHTING & ATMOSPHERE -->
                
                <!-- Sunbeam from Top Right -->
                <polygon points="1000,0 1000,800 300,800" fill="url(#sunbeam)" style="mix-blend-mode: overlay;" pointer-events="none"/>

                <!-- Vignette (Focus center) -->
                <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none"/>

                <!-- Sparkles/Dust Motes (Floating in the light) -->
                <g fill="#FFF" opacity="0.6">
                    <circle cx="750" cy="250" r="2.5" filter="url(#wetBlur)"/>
                    <circle cx="880" cy="380" r="1.5" />
                    <circle cx="680" cy="180" r="3" opacity="0.4" />
                    <circle cx="450" cy="280" r="1.5" />
                </g>

            </g>
        </svg>
    </div>
</div>

</body>
</html>
