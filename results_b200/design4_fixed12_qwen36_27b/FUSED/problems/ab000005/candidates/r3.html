<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless - Premium Cleaning Service</title>
    <style>
        :root {
            /* Palette: Refined Warmth & Contrast */
            --bg-color: #FDFBF7; 
            --text-main: #1A2639; 
            --text-muted: #5F6E7E;
            --accent-primary: #D97706; 
            --accent-hover: #B45309;
            
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-stack);
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
        }

        /* Layout */
        .container {
            display: grid;
            grid-template-columns: 450px 1fr;
            width: 100%;
            height: 100vh;
        }

        /* Left Panel: UI */
        .sidebar {
            padding: 80px 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--bg-color);
            z-index: 10;
            position: relative;
            box-shadow: 5px 0 30px rgba(0,0,0,0.02);
        }

        .brand {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-primary);
            margin-bottom: 80px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            background: var(--text-main);
            border-radius: 2px;
            transform: rotate(45deg);
        }

        h1 {
            font-size: 64px;
            line-height: 1.05;
            color: var(--text-main);
            margin: 0 0 32px 0;
            font-weight: 700;
            letter-spacing: -1.5px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 60px;
            max-width: 420px;
            font-weight: 400;
        }

        .cta-button {
            background-color: var(--accent-primary);
            color: #fff;
            border: none;
            padding: 24px 48px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: fit-content;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 25px rgba(217, 119, 6, 0.25);
        }

        .cta-button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(217, 119, 6, 0.35);
        }

        /* Right Panel: Scene */
        .scene-container {
            position: relative;
            background-color: #E6DCC8; 
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sidebar > * {
            animation: fadeUp 0.8s ease-out forwards;
            opacity: 0;
        }
        .sidebar > *:nth-child(1) { animation-delay: 0.1s; }
        .sidebar > *:nth-child(2) { animation-delay: 0.2s; }
        .sidebar > *:nth-child(3) { animation-delay: 0.3s; }
        .sidebar > *:nth-child(4) { animation-delay: 0.4s; }

    </style>
</head>
<body>

<div class="container">
    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="brand">Spotless Co.</div>
        
        <h1>Restoring<br>natural warmth.</h1>
        
        <p>We don't just clean surfaces; we restore the soul of your home. Deep cleaning that respects the texture and history of your space.</p>

        <button class="cta-button">Book a Clean</button>
    </div>

    <!-- Right Visual Scene -->
    <div class="scene-container">
        <svg viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- LIGHTING FILTERS -->
                <!-- Drop shadow for 3D objects -->
                <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
                    <feOffset dx="15" dy="25" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.3"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <!-- Wet Blur for liquid edges -->
                <filter id="wetBlur">
                    <feGaussianBlur stdDeviation="3" />
                </filter>

                <!-- WOOD TEXTURE GENERATION -->
                <!-- 1. Base Planks -->
                <pattern id="planks" x="0" y="0" width="1000" height="220" patternUnits="userSpaceOnUse">
                    <rect width="1000" height="220" fill="#DCC8B2" />
                    <!-- Plank Gap (Shadow) -->
                    <rect x="0" y="218" width="1000" height="2" fill="#8C755E" opacity="0.5" />
                    <!-- Plank Gap (Highlight edge) -->
                    <rect x="0" y="217" width="1000" height="1" fill="#F5E6D3" opacity="0.6" />
                </pattern>

                <!-- 2. Wood Grain Noise -->
                <filter id="woodGrain">
                    <!-- Horizontal grain noise -->
                    <feTurbulence type="fractalNoise" baseFrequency="0.005 0.08" numOctaves="4" result="noise"/>
                    <!-- Colorize noise to brown -->
                    <feColorMatrix type="matrix" values="0 0 0 0 0.55   0 0 0 0 0.35   0 0 0 0 0.2   0 0 0 0.15 0" in="noise" result="coloredNoise"/>
                    <!-- Blend noise with planks -->
                    <feComposite operator="in" in="coloredNoise" in2="SourceGraphic" result="texture"/>
                    <feBlend mode="multiply" in="texture" in2="SourceGraphic" />
                </filter>

                <!-- 3. Wood Knots (Scattered) -->
                <g id="knots">
                    <ellipse cx="200" cy="100" rx="3" ry="15" fill="#8C755E" opacity="0.15" transform="rotate(90 200 100)"/>
                    <ellipse cx="850" cy="50" rx="4" ry="20" fill="#8C755E" opacity="0.1" transform="rotate(90 850 50)"/>
                    <ellipse cx="600" cy="450" rx="2" ry="10" fill="#8C755E" opacity="0.12" transform="rotate(90 600 450)"/>
                </g>

                <!-- LIQUID GRADIENTS -->
                <!-- The Spill Body -->
                <radialGradient id="spillBody" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" style="stop-color:#E5C56B;stop-opacity:0.9" />
                    <stop offset="60%" style="stop-color:#C29B24;stop-opacity:0.95" />
                    <stop offset="100%" style="stop-color:#8A6D15;stop-opacity:0.9" />
                </radialGradient>

                <!-- The "Wet" Darkening (Simulates water soaking into wood) -->
                <radialGradient id="wetDarken" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#5A4328;stop-opacity:0.6" />
                    <stop offset="100%" style="stop-color:#5A4328;stop-opacity:0" />
                </radialGradient>

                <!-- MOP STRINGS GRADIENT -->
                <!-- Simulates cylindrical white/grey fibers -->
                <linearGradient id="stringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
                    <stop offset="20%" style="stop-color:#FFFFFF;stop-opacity:1" />
                    <stop offset="80%" style="stop-color:#E0E0E0;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#999999;stop-opacity:1" />
                </linearGradient>

                <!-- Sunbeam Gradient -->
                <linearGradient id="sunbeam" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#FFF;stop-opacity:0.15" />
                    <stop offset="100%" style="stop-color:#FFF;stop-opacity:0" />
                </linearGradient>
            </defs>

            <!-- BACKGROUND: FLOOR -->
            <!-- 1. Base Pattern -->
            <rect width="100%" height="100%" fill="url(#planks)" />
            
            <!-- 2. Apply Grain Texture (Multiply blend mode darkens the wood naturally) -->
            <rect width="100%" height="100%" fill="url(#planks)" filter="url(#woodGrain)" style="mix-blend-mode: multiply;" />
            
            <!-- 3. Knots Layer -->
            <use href="#knots" />

            <!-- SCENE COMPOSITION -->
            <g id="scene" transform="translate(0, 0)">
                
                <!-- 1. THE SPILL -->
                <!-- Located centrally-right, anchoring the composition -->
                <g transform="translate(550, 450)">
                    
                    <!-- A. The Wet Patch (Darkening the wood underneath) -->
                    <!-- This creates the illusion that the wood is soaked -->
                    <path d="M-180,-20 C-150,-110 60,-130 140,-50 C210,20 170,120 70,130 C-30,140 -210,50 -180,-20 Z" 
                          fill="url(#wetDarken)" filter="url(#wetBlur)"/>

                    <!-- B. The Liquid Surface -->
                    <path d="M-150,-10 C-120,-90 30,-100 90,-40 C150,10 120,90 40,80 C-40,90 -170,50 -150,-10 Z" 
                          fill="url(#spillBody)" opacity="0.95" />

                    <!-- C. Surface Reflections (Specular highlights) -->
                    <!-- Brightest spots where light hits the liquid surface -->
                    <path d="M-90,-30 Q-20,-70 60,-20" stroke="#FFF" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6" filter="url(#wetBlur)"/>
                    <ellipse cx="-50" cy="20" rx="30" ry="8" fill="#FFF" opacity="0.5" transform="rotate(-15 -50 20)"/>
                    <ellipse cx="50" cy="-10" rx="12" ry="4" fill="#FFF" opacity="0.3" transform="rotate(20 50 -10)"/>

                    <!-- D. Splatters (Physics simulation) -->
                    <g fill="#C29B24" opacity="0.9">
                        <circle cx="160" cy="-30" r="10" />
                        <circle cx="180" cy="-15" r="5" />
                        <circle cx="195" cy="10" r="3" />
                        <circle cx="-170" cy="40" r="8" />
                        <circle cx="-150" cy="60" r="4" />
                        <circle cx="90" cy="100" r="6" />
                        <!-- Tiny droplets -->
                        <circle cx="140" cy="-60" r="2" />
                        <circle cx="-120" cy="-50" r="2" />
                    </g>
                </g>

                <!-- 2. THE MOP -->
                <!-- Positioned left, angled dynamically towards the spill -->
                <g filter="url(#dropShadow)">
                    
                    <!-- A. The Handle -->
                    <!-- Main stick -->
                    <line x1="200" y1="100" x2="500" y2="480" stroke="#D1D5DB" stroke-width="22" stroke-linecap="round" />
                    <!-- Stick Highlight (Cylindrical feel) -->
                    <line x1="200" y1="100" x2="500" y2="480" stroke="#F9FAFB" stroke-width="8" stroke-linecap="round" opacity="0.8" />
                    <!-- Stick Shadow (Bottom edge) -->
                    <line x1="200" y1="100" x2="500" y2="480" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round" transform="translate(2,2)" opacity="0.5" />

                    <!-- B. The Connector (Metal joint) -->
                    <circle cx="500" cy="480" r="18" fill="#374151" />
                    <circle cx="500" cy="480" r="12" fill="#1F2937" />
                    <circle cx="498" cy="478" r="4" fill="#9CA3AF" opacity="0.5" /> <!-- Specular -->

                    <!-- C. The Mop Head -->
                    <!-- Rotated to align with handle angle (~62 degrees) -->
                    <g transform="translate(500, 480) rotate(62)">
                        
                        <!-- Metal Base Plate -->
                        <ellipse cx="0" cy="0" rx="55" ry="14" fill="#4B5563" />
                        <ellipse cx="0" cy="-2" rx="50" ry="10" fill="#9CA3AF" opacity="0.3" /> <!-- Plate highlight -->

                        <!-- The Strings (Fiber Bundle) -->
                        <!-- Layered paths for density and depth -->
                        <g fill="none" stroke-linecap="round">
                            <!-- Outer strands -->
                            <path d="M-45,0 Q-60,100 -40,220" stroke="#B0B0B0" stroke-width="12" />
                            <path d="M45,0 Q60,100 40,220" stroke="#B0B0B0" stroke-width="12" />
                            
                            <!-- Mid strands -->
                            <path d="M-30,0 Q-40,110 -20,230" stroke="url(#stringGrad)" stroke-width="14" />
                            <path d="M30,0 Q40,110 20,230" stroke="url(#stringGrad)" stroke-width="14" />
                            
                            <!-- Inner strands (Darker/Wet) -->
                            <path d="M-15,0 Q-10,120 5,240" stroke="#888" stroke-width="16" />
                            <path d="M15,0 Q10,120 -5,240" stroke="#888" stroke-width="16" />
                        </g>

                        <!-- String Texture/Highlights -->
                        <g stroke="#FFF" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
                             <path d="M-35,10 Q-45,100 -25,200" />
                             <path d="M25,10 Q35,100 15,200" />
                             <path d="M-5,10 Q0,100 10,200" />
                        </g>

                        <!-- Wetness on the mop head (Bottom is darker) -->
                        <ellipse cx="0" cy="200" rx="50" ry="30" fill="#555" opacity="0.2" filter="url(#wetBlur)"/>
                    </g>
                </g>

                <!-- 3. LIGHTING & ATMOSPHERE -->
                
                <!-- Sunbeam from Top Right -->
                <polygon points="1000,0 1000,800 200,800" fill="url(#sunbeam)" style="mix-blend-mode: overlay;" pointer-events="none"/>

                <!-- Sparkles/Dust Motes (Floating in the light) -->
                <g fill="#FFF" opacity="0.6">
                    <circle cx="700" cy="200" r="2" />
                    <circle cx="850" cy="350" r="1.5" />
                    <circle cx="650" cy="150" r="2.5" opacity="0.4" />
                    <circle cx="400" cy="250" r="1" />
                </g>

            </g>
        </svg>
    </div>
</div>

</body>
</html>
