<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Life Simulation</title>
<style>
  :root {
    --bg-color: #030305;
    --panel-bg: rgba(20, 20, 28, 0.6);
    --panel-border: rgba(255, 255, 255, 0.08);
    --accent-glow: #00f0ff;
    --accent-hot: #ff0055;
    --accent-purple: #9d00ff;
    --text-main: #ffffff;
    --text-muted: #8b9bb4;
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-color);
    /* Subtle deep space background */
    background-image: 
      radial-gradient(circle at 50% 50%, #11111a 0%, #030305 80%);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Canvas Container */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Overlay */
  #ui-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    pointer-events: none; 
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 2rem;
  }

  /* Header - More subtle */
  .header {
    position: absolute;
    top: 2rem;
    left: 2rem;
    pointer-events: auto;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin-bottom: 0.25rem;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.8);
    text-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
  }

  .subtitle {
    font-size: 0.65rem;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* Control Panel - Glassmorphism Refined */
  .panel {
    pointer-events: auto;
    width: 300px;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--panel-border);
    border-top: 1px solid rgba(255,255,255,0.15); /* Highlight top edge */
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    /* Positioning: Center vertically on the right side */
    position: absolute;
    top: 50%;
    right: 2rem;
    transform: translateY(-50%);
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .panel-label {
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding-bottom: 0.5rem;
    margin-bottom: 0.25rem;
  }

  /* Stats - High Contrast */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.5rem;
    font-variant-numeric: tabular-nums;
  }
  .stat-name {
    font-size: 0.85rem;
    color: var(--text-muted);
  }
  .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }
  
  /* Progress bar for population density */
  .density-bar-bg {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    margin-top: 0.25rem;
    overflow: hidden;
  }
  .density-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-purple), var(--accent-hot));
    width: 0%;
    transition: width 0.3s ease;
    box-shadow: 0 0 10px var(--accent-hot);
  }

  /* Sliders */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
    transition: transform 0.1s;
    margin-top: -7px; /* Center thumb */
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.1);
  }

  /* Buttons - Unified Style */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  
  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    padding: 0.8rem;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    backdrop-filter: blur(4px);
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.3);
    box-shadow: 0 0 15px rgba(255,255,255,0.05);
  }

  button:active {
    transform: scale(0.98);
  }

  button.primary {
    background: rgba(0, 240, 255, 0.1);
    border: 1px solid var(--accent-glow);
    color: var(--accent-glow);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
  }
  button.primary:hover {
    background: var(--accent-glow);
    color: #000;
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.65rem;
    color: var(--text-muted);
    opacity: 0.4;
    letter-spacing: 0.1em;
    text-align: center;
  }

</style>
</head>
<body>

  <!-- Canvas for the Sphere -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Header -->
    <div class="header">
      <h1>Conway Sphere</h1>
      <div class="subtitle">Cellular Automata Topology</div>
    </div>

    <!-- Control Panel -->
    <div class="panel">
      
      <!-- Stats Section -->
      <div class="panel-section">
        <div class="panel-label">Live Statistics</div>
        <div class="stat-row">
          <span class="stat-name">Generation</span>
          <span class="stat-value" id="gen-count">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-name">Population</span>
          <span class="stat-value" id="pop-count">0</span>
        </div>
        <div class="density-bar-bg">
          <div class="density-bar-fill" id="density-bar"></div>
        </div>
      </div>

      <!-- Controls Section -->
      <div class="panel-section">
        <div class="panel-label">Simulation Controls</div>
        <div class="btn-group">
          <button id="btn-pause" class="primary">Pause</button>
          <button id="btn-reset">Randomize</button>
        </div>
        <button id="btn-step" style="margin-top: 0.75rem; width: 100%;">Step Once</button>
      </div>

      <!-- Settings Section -->
      <div class="panel-section">
        <div class="panel-label">Settings</div>
        <div style="display:flex; justify-content: space-between; font-size: 0.75rem; color: #fff; margin-bottom: 0.5rem;">
          <span>Speed</span>
          <span id="speed-val">10 FPS</span>
        </div>
        <input type="range" id="speed-slider" min="1" max="60" value="20">
      </div>
    </div>

    <div class="footer">
      DRAG TO ROTATE &bull; SCROLL TO ZOOM
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life - Design Overhaul
 * 
 * Visual Changes:
 * - Spectral coloring based on generation age.
 * - Depth-based size attenuation and opacity fading.
 * - Wireframe shell for structural definition.
 * - Glow effects for "alive" cells.
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 3500, 
  sphereRadius: 260,
  baseCellSize: 2.5,
  rotationSpeed: 0.0015,
  colors: {
    wireframe: 'rgba(100, 200, 255, 0.08)',
    dead: 'rgba(30, 35, 50, 0.5)', 
    ambient: '#00f0ff'
  }
};

// --- State ---
let state = {
  cells: [], 
  generation: 0,
  isRunning: true,
  speed: 20, 
  lastFrameTime: 0,
  rotation: { x: 0.2, y: 0 }, // Slight tilt initially
  zoom: 1,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  add: (v1, v2) => ({ x: v1.x + v2.x, y: v1.y + v2.y, z: v1.z + v2.z }),
  sub: (v1, v2) => ({ x: v1.x - v2.x, y: v1.y - v2.y, z: v1.z - v2.z }),
  dot: (v1, v2) => v1.x * v2.x + v1.y * v2.y + v1.z * v2.z,
  len: (v) => Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z),
  normalize: (v) => {
    const l = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z);
    return l > 0 ? { x: v.x/l, y: v.y/l, z: v.z/l } : {x:0,y:0,z:0};
  },
  scale: (v, s) => ({ x: v.x * s, y: v.y * s, z: v.z * s }),
  dist: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return Math.sqrt(dx*dx + dy*dy + dz*dz);
  }
};

// Fibonacci Lattice Sphere Generation
function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5)); 
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y); 
    const theta = goldenAngle * i; 
    
    const x = Math.cos(theta) * radiusAtY;
    const z = Math.sin(theta) * radiusAtY;
    
    points.push({
      x: x * radius,
      y: y * radius,
      z: z * radius,
      idx: i
    });
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Neighbor calculation
  // Radius of a single cell area on the sphere surface
  const surfaceArea = 4 * Math.PI * Math.pow(CONFIG.sphereRadius, 2);
  const cellArea = surfaceArea / CONFIG.cellCount;
  const threshold = Math.sqrt(cellArea) * 1.15; // slightly more than 1 cell diameter
  
  state.cells = points.map((p, i) => {
    const neighbors = [];
    // Optimization: Since points are generated sequentially in Fibonacci lattice,
    // we only need to check a small window of indices, but for robustness on a sphere
    // we stick to distance check.
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      const d = Vec3.dist(p, points[j]);
      if (d < threshold) { 
        neighbors.push(j);
      }
    }
    
    return {
      pos: p,
      idx: i,
      neighbors: neighbors,
      alive: Math.random() > 0.75, // 25% density
      bornGen: 0, 
      age: 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  const nextStates = state.cells.map(cell => {
    const neighborCount = cell.neighbors.reduce((acc, idx) => acc + (state.cells[idx].alive ? 1 : 0), 0);
    
    let nextAlive = false;
    let isBorn = false;

    if (cell.alive) {
      if (neighborCount === 2 || neighborCount === 3) nextAlive = true;
    } else {
      if (neighborCount === 3) {
        nextAlive = true;
        isBorn = true;
      }
    }
    
    return {
      alive: nextAlive,
      bornGen: isBorn ? state.generation : cell.bornGen,
      age: nextAlive ? (cell.alive ? cell.age + 1 : 0) : 0
    };
  });

  state.cells.forEach((cell, i) => {
    cell.alive = nextStates[i].alive;
    cell.bornGen = nextStates[i].bornGen;
    cell.age = nextStates[i].age;
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotation Matrix Math
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective Projection
  const fov = 600 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function drawWireframe(radius, zoom) {
    // Draw a subtle outline to define the sphere volume
    ctx.beginPath();
    ctx.strokeStyle = CONFIG.colors.wireframe;
    ctx.lineWidth = 1;
    ctx.arc(width/2, height/2, radius * zoom, 0, Math.PI * 2);
    ctx.stroke();
}

function draw() {
  // Clear background (Solid color for better contrast with trails)
  ctx.fillStyle = '#030305'; 
  ctx.fillRect(0, 0, width, height);

  // 1. Draw Ambient Glow behind sphere
  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;
  
  const grad = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 1.5);
  grad.addColorStop(0, 'rgba(0, 240, 255, 0.03)');
  grad.addColorStop(0.6, 'rgba(100, 0, 255, 0.01)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,width,height);

  // 2. Project and Sort Cells
  const projectedCells = state.cells.map(cell => {
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    return { cell, proj };
  });
  
  // Sort by Z (far to near)
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // 3. Draw Wireframe (Behind cells)
  drawWireframe(CONFIG.sphereRadius, state.zoom);

  // 4. Draw Cells
  projectedCells.forEach(({ cell, proj }) => {
    // Size Attenuation: Cells look smaller when further away (scale < 1)
    // and we add a base opacity fade for depth perception
    const size = CONFIG.baseCellSize * proj.scale;
    
    // Determine visual properties based on state and depth
    if (cell.alive) {
      // SPECTRAL COLOR STRATEGY
      // Color shifts based on when it was born relative to current gen
      // Older cells shift hue, newer cells are "hotter"
      const age = state.generation - cell.bornGen;
      const hue = (260 + (age * 4)) % 360; // Start purple/pink, shift to blue/cyan
      
      // Lighting: Brighter at front (z < 0), darker at back
      // z is roughly -R to R. 
      const lightIntensity = (proj.z / -CONFIG.sphereRadius); // 1 at front, -1 at back
      const alpha = 0.3 + (Math.max(0, lightIntensity) * 0.7); // Fade back cells
      
      ctx.fillStyle = `hsla(${hue}, 90%, 60%, ${alpha})`;
      
      // Glow effect for front-facing alive cells
      if (proj.z < -50 && size > 1.5) {
        ctx.shadowBlur = 8 * proj.scale;
        ctx.shadowColor = `hsla(${hue}, 100%, 50%, 0.8)`;
      } else {
        ctx.shadowBlur = 0;
      }

    } else {
      // Dead cells: Subtle grid structure
      // Fade out significantly at the back to reduce noise
      const lightIntensity = (proj.z / -CONFIG.sphereRadius);
      const alpha = 0.05 + (Math.max(0, lightIntensity) * 0.15);
      
      ctx.fillStyle = `rgba(100, 150, 200, ${alpha})`;
      ctx.shadowBlur = 0;
    }
    
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, Math.max(0.5, size), 0, Math.PI * 2);
    ctx.fill();
  });
  
  ctx.shadowBlur = 0; // Reset
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    // Auto rotation
    state.rotation.y += CONFIG.rotationSpeed;
    
    // Logic Update
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation;
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop;
  
  // Update density bar
  const density = (pop / state.cells.length) * 100;
  document.getElementById('density-bar').style.width = `${density}%`;
}

// Controls
const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', (e) => {
  state.isRunning = !state.isRunning;
  e.target.innerText = state.isRunning ? "Pause" : "Resume";
  // Toggle visual style
  if(state.isRunning) {
      e.target.classList.add('primary');
  } else {
      e.target.classList.remove('primary');
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  btnPause.innerText = "Resume";
  btnPause.classList.remove('primary');
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
  document.getElementById('speed-val').innerText = `${state.speed} FPS`;
});

// Mouse Drag Rotation
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(2.5, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
