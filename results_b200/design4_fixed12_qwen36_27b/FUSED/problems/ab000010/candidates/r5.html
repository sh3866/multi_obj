<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway Sphere :: Topological Automata</title>
<style>
  :root {
    /* Palette - Deep Space & Cyberpunk */
    --bg-deep: #020204;
    --bg-grid: rgba(255, 255, 255, 0.02);
    
    /* Accents */
    --accent-cyan: #00f3ff;
    --accent-pink: #ff00aa;
    --accent-green: #00ff9d;
    
    /* UI Elements */
    --glass-bg: rgba(10, 12, 16, 0.6);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-highlight: rgba(255, 255, 255, 0.05);
    
    /* Typography */
    --font-display: "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    --font-mono: "SF Mono", "Roboto Mono", "Menlo", Consolas, monospace;
    
    /* Text Colors */
    --text-main: #ffffff;
    --text-dim: #6e7f99;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-display);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    position: relative;
  }

  /* Background Grid for "Tech" feel */
  body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
  }

  /* Canvas Container */
  #canvas-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Overlay Layer */
  #ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3rem;
  }

  /* --- Header --- */
  .header {
    position: relative;
    z-index: 20;
    pointer-events: auto;
    max-width: 500px;
  }

  h1 {
    font-size: 3.5rem;
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 0.9;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, #fff 0%, #aaa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .subtitle-group {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .subtitle {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--accent-cyan);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 700;
    text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
  }

  .decor-line {
    height: 2px;
    flex-grow: 1;
    background: linear-gradient(90deg, var(--accent-pink), transparent);
    max-width: 100px;
  }

  /* --- Control Panel --- */
  .panel {
    pointer-events: auto;
    width: 340px;
    /* Glassmorphism */
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-top: 1px solid rgba(255,255,255,0.2);
    border-radius: 16px;
    padding: 1.5rem;
    position: relative;
    align-self: flex-end;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    transition: transform 0.3s ease, border-color 0.3s ease;
  }
  
  .panel:hover {
    border-color: rgba(255,255,255,0.25);
  }

  .panel-header {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--glass-border);
    padding-bottom: 0.75rem;
  }
  
  .status-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--accent-green);
  }

  .status-dot {
    width: 8px; height: 8px;
    background-color: var(--accent-green);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent-green);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

  /* Stats Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .stat-item { display: flex; flex-direction: column; gap: 0.4rem; }
  
  .stat-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-family: var(--font-display);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  
  .stat-value {
    font-family: var(--font-mono);
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1;
    text-shadow: 0 0 15px rgba(255,255,255,0.1);
  }
  
  .stat-value.pop { color: var(--accent-cyan); }

  /* Controls */
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  button {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    color: var(--text-main);
    padding: 0.8rem;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    position: relative;
    overflow: hidden;
  }

  button:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.4);
    box-shadow: 0 0 15px rgba(255,255,255,0.05);
  }

  button:active { transform: translateY(2px); }

  /* Primary Button */
  button.primary {
    background: rgba(0, 243, 255, 0.1);
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }
  button.primary:hover {
    background: var(--accent-cyan);
    color: #000;
    box-shadow: 0 0 25px var(--accent-cyan);
  }

  /* Slider */
  .slider-container {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .slider-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-family: var(--font-display);
    text-transform: uppercase;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    outline: none;
    cursor: pointer;
    border-radius: 2px;
  }
  
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    background: var(--text-main);
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.1s;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    border: 2px solid var(--bg-deep);
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

  /* Footer Instructions */
  .footer {
    position: relative;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
  }

  .instruction {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-dim);
    display: flex;
    gap: 1.5rem;
    background: rgba(0,0,0,0.4);
    padding: 0.5rem 1rem;
    border-radius: 20px;
    border: 1px solid var(--glass-border);
  }
  .instruction span { display: flex; align-items: center; gap: 0.5rem; }
  .key {
    border: 1px solid var(--text-dim);
    padding: 0 6px;
    border-radius: 4px;
    font-size: 0.6rem;
    color: var(--text-main);
    background: rgba(255,255,255,0.05);
  }

</style>
</head>
<body>

  <!-- Canvas -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Header -->
    <div class="header">
      <h1>Conway<br>Sphere</h1>
      <div class="subtitle-group">
        <div class="subtitle">Topological Automata</div>
        <div class="decor-line"></div>
      </div>
    </div>

    <!-- Footer / Instructions -->
    <div class="footer">
      <div class="instruction">
        <span><span class="key">LMB</span> ROTATE</span>
        <span><span class="key">SCRL</span> ZOOM</span>
      </div>
    </div>

    <!-- Control Panel -->
    <div class="panel">
      
      <div class="panel-header">
        <span>System Control</span>
        <div class="status-indicator">
          <span>ACTIVE</span>
          <div class="status-dot"></div>
        </div>
      </div>

      <!-- Telemetry -->
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-label">Generation</span>
          <span class="stat-value" id="gen-count">0000</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Population</span>
          <span class="stat-value pop" id="pop-count">0000</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="control-group">
        <div class="btn-row">
          <button id="btn-pause" class="primary">Pause</button>
          <button id="btn-reset">Randomize</button>
        </div>
        
        <div class="slider-container">
          <div class="slider-header">
            <span class="slider-label">Simulation Speed</span>
            <span class="slider-label" id="speed-val" style="color:var(--text-main)">20Hz</span>
          </div>
          <input type="range" id="speed-slider" min="1" max="60" value="20">
        </div>
      </div>
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life - Visual Revision
 * 
 * Design Changes:
 * 1. Lighting: Hemisphere lighting model (Ambient + Directional).
 * 2. Palette: Cyan (Born) -> Magenta (Young) -> Pink (Old).
 * 3. Depth: Fog effect (alpha fade) for cells at the back.
 * 4. Post-Processing: Additive blending (lighter) for neon glow.
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 4000, // Reduced slightly for better performance with glow
  sphereRadius: 320, // Scaled up
  baseCellSize: 2.5,
  rotationSpeed: 0.0015,
  colors: {
    born: 185,  // Cyan
    young: 290, // Magenta
    old: 330    // Pink
  }
};

// --- State ---
let state = {
  cells: [], 
  generation: 0,
  isRunning: true,
  speed: 20, 
  lastFrameTime: 0,
  rotation: { x: 0.2, y: 0.5 },
  zoom: 1.0,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  distSq: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return dx*dx + dy*dy + dz*dz;
  }
};

// Fibonacci Lattice for even distribution
function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5)); 
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y); 
    const theta = goldenAngle * i; 
    
    points.push({
      x: Math.cos(theta) * radiusAtY * radius,
      y: y * radius,
      z: Math.sin(theta) * radiusAtY * radius,
      idx: i
    });
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Connectivity Threshold
  // Slightly adjusted for density
  const thresholdSq = Math.pow((2 * Math.PI * CONFIG.sphereRadius) / Math.sqrt(CONFIG.cellCount) * 0.6, 2);
  
  state.cells = points.map((p, i) => {
    const neighbors = [];
    // Optimization: check indices near i
    const range = 12; 
    for (let j = i - range; j <= i + range; j++) {
      if (j < 0 || j >= points.length || i === j) continue;
      if (Vec3.distSq(p, points[j]) < thresholdSq) {
        neighbors.push(j);
      }
    }
    
    return {
      pos: p,
      idx: i,
      neighbors: neighbors,
      alive: Math.random() > 0.6, // 40% density
      age: 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  const nextStates = state.cells.map(cell => {
    const neighborCount = cell.neighbors.reduce((acc, idx) => acc + (state.cells[idx].alive ? 1 : 0), 0);
    
    let nextAlive = false;
    let isBorn = false;

    if (cell.alive) {
      if (neighborCount === 2 || neighborCount === 3) nextAlive = true;
    } else {
      if (neighborCount === 3) {
        nextAlive = true;
        isBorn = true;
      }
    }
    
    return {
      alive: nextAlive,
      age: nextAlive ? (isBorn ? 0 : cell.age + 1) : 0
    };
  });

  state.cells.forEach((cell, i) => {
    cell.alive = nextStates[i].alive;
    cell.age = nextStates[i].age;
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 1200 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // 1. Clear with deep background
  ctx.fillStyle = '#020204'; 
  ctx.fillRect(0, 0, width, height);

  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;

  // 2. Ambient Glow (Atmosphere)
  // A large, soft radial gradient behind the sphere
  const grad = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 3.5);
  grad.addColorStop(0, 'rgba(0, 243, 255, 0.08)'); // Cyan glow
  grad.addColorStop(0.5, 'rgba(100, 0, 255, 0.02)'); // Purple tint
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,width,height);

  // 3. Project and Sort
  const projectedCells = state.cells.map(cell => {
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    return { cell, proj };
  });
  
  // Painter's Algorithm (Sort by Z depth, back to front)
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // 4. Draw Surface Structure (Subtle Silhouette)
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 5. Draw Cells
  // Use 'lighter' for additive blending (neon effect)
  ctx.globalCompositeOperation = 'lighter';

  projectedCells.forEach(({ cell, proj }) => {
    const size = CONFIG.baseCellSize * proj.scale;
    
    // Normalized Z: 1.0 (front) to -1.0 (back)
    // In our projection, zFinal is positive when in front of camera (if camera is at -z)
    // But standard rotation math puts -Z as forward. Let's check logic:
    // If zFinal is negative, it's closer to camera?
    // Actually, in our projection: fov / (fov + z). If z is negative (towards camera), scale > 1.
    // So z < 0 is front.
    
    // Let's normalize z for lighting.
    // We want zNorm to be 1 at front, -1 at back.
    const zNorm = -proj.z / (CONFIG.sphereRadius * state.zoom); 
    
    // LIGHTING CALCULATION
    // Light source from Top-Left-Front
    // Vector roughly (-0.5, -0.5, -1.0) in camera space?
    // Let's use the projected X/Y relative to center for surface normal approximation
    const xNorm = (proj.x - cx) / r;
    const yNorm = (proj.y - cy) / r;
    
    // Diffuse factor
    // Brighter at Front (zNorm > 0), Left (xNorm < 0), Top (yNorm < 0)
    let light = 0.35 + (0.4 * zNorm) - (0.2 * xNorm) - (0.2 * yNorm);
    light = Math.max(0.1, Math.min(1.0, light));

    if (cell.alive) {
      // COLOR LOGIC
      let hue, saturation, lightness;
      
      if (cell.age < 3) {
        hue = CONFIG.colors.born; // Cyan
        lightness = 60;
      } else if (cell.age < 10) {
        hue = CONFIG.colors.young; // Magenta
        lightness = 55;
      } else {
        hue = CONFIG.colors.old; // Pink
        lightness = 65;
      }
      saturation = 100;

      // DEPTH FOG
      // Fade out significantly at the back (zNorm < 0)
      // If zNorm is 1 (front), alpha is high. If -1 (back), alpha is low.
      const alpha = 0.15 + (Math.max(0, zNorm) * 0.85); 
      
      // Apply lighting to lightness
      const finalLight = lightness * light;
      
      ctx.fillStyle = `hsla(${hue}, ${saturation}%, ${finalLight}%, ${alpha})`;
      
      // BLOOM (Only for front-facing cells)
      if (zNorm > 0.2 && size > 1.2) {
        ctx.shadowBlur = 8 * proj.scale;
        ctx.shadowColor = `hsla(${hue}, 100%, 50%, 0.5)`;
      } else {
        ctx.shadowBlur = 0;
      }

    } else {
      // DEAD CELLS: The "Grid"
      // Monochromatic, subtle, structural
      // Brighter at front to give volume
      const alpha = 0.02 + (Math.max(0, zNorm) * 0.12);
      // Apply lighting to dead cells too
      const deadBright = 15 * light; 
      ctx.fillStyle = `rgba(${deadBright+15}, ${deadBright+15}, ${deadBright+25}, ${alpha})`;
      ctx.shadowBlur = 0;
    }
    
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, Math.max(0.5, size), 0, Math.PI * 2);
    ctx.fill();
    
    // Add a tiny stroke to active cells for crispness
    if (cell.alive && zNorm > 0.3) {
        ctx.strokeStyle = `rgba(255, 255, 255, ${zNorm * 0.5 * light})`;
        ctx.lineWidth = 0.5 * proj.scale;
        ctx.stroke();
    }
  });
  
  ctx.globalCompositeOperation = 'source-over'; // Reset
  ctx.shadowBlur = 0;
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    state.rotation.y += CONFIG.rotationSpeed;
    
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  const g = state.generation.toString().padStart(4, '0');
  const p = state.cells.filter(c => c.alive).length.toString().padStart(4, '0');
  
  document.getElementById('gen-count').innerText = g;
  document.getElementById('pop-count').innerText = p;
}

// Controls
const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', (e) => {
  state.isRunning = !state.isRunning;
  e.target.innerText = state.isRunning ? "Pause" : "Resume";
  if(state.isRunning) {
      e.target.classList.add('primary');
  } else {
      e.target.classList.remove('primary');
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
  document.getElementById('speed-val').innerText = `${state.speed}Hz`;
});

// Mouse Drag
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.6, Math.min(2.5, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
