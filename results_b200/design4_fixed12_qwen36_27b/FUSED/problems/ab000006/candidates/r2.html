<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        :root {
            /* Palette: Classic 16-bit SkiFree inspired */
            --c-sky-top: #4682B4;
            --c-sky-bot: #87CEEB;
            --c-snow-base: #FFFFFF;
            --c-snow-shadow: #C0C0C0;
            --c-snow-accent: #E0F0FF;
            --c-tree-dark: #006400;
            --c-tree-light: #228B22;
            --c-tree-shadow: #004d00;
            --c-wood-dark: #5D4037;
            --c-wood-light: #8D6E63;
            --c-btn-bg: #FFD700;
            --c-btn-shadow: #B8860B;
            --c-text-main: #000000;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none; /* Keep fonts crisp */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: "Courier New", Courier, monospace;
        }

        /* Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Canvas World */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* Critical for pixel art scaling: Nearest Neighbor */
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        /* UI Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas if needed, but we have a button */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; /* Push content down */
            padding-bottom: 10vh;
        }

        /* Title Container */
        .title-container {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 20;
        }

        h1 {
            margin: 0;
            font-size: 4rem;
            line-height: 1;
            text-transform: uppercase;
            color: #fff;
            /* Retro 3D Text Effect */
            text-shadow: 
                4px 4px 0 #000,
                -2px -2px 0 #5C94FC;
            letter-spacing: -2px;
            font-weight: 900;
        }

        .subtitle {
            display: block;
            margin-top: 10px;
            font-size: 1.2rem;
            color: #fff;
            background: #000;
            display: inline-block;
            padding: 4px 12px;
            border: 2px solid #fff;
            font-weight: bold;
            animation: blinker 1.2s linear infinite;
            text-shadow: none;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Start Button: Wooden Sign Style */
        .start-btn-container {
            pointer-events: auto;
            position: relative;
            margin-bottom: 40px;
            z-index: 30;
        }

        .start-btn {
            background: var(--c-wood-light);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-family: "Courier New", Courier, monospace;
            font-weight: 900;
            font-size: 1.5rem;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            outline: none;
            /* Pixelated Border Simulation */
            box-shadow: 
                inset 4px 4px 0 var(--c-wood-light),
                inset -4px -4px 0 var(--c-wood-dark),
                0 8px 0 #000; /* Drop shadow */
            
            /* Wood Texture Pattern via CSS */
            background-image: repeating-linear-gradient(
                45deg,
                var(--c-wood-light),
                var(--c-wood-light) 10px,
                var(--c-wood-dark) 10px,
                var(--c-wood-dark) 12px
            );
            
            text-shadow: 2px 2px 0 #000;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        /* Button Nails */
        .start-btn::before, .start-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 8px;
            height: 8px;
            background: #333;
            border-radius: 50%;
            box-shadow: inset 1px 1px 0 rgba(255,255,255,0.3);
            transform: translateY(-50%);
        }
        .start-btn::before { left: 10px; }
        .start-btn::after { right: 10px; }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                inset 4px 4px 0 var(--c-wood-light),
                inset -4px -4px 0 var(--c-wood-dark),
                0 10px 0 #000;
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 
                inset 4px 4px 0 var(--c-wood-dark),
                inset -4px -4px 0 var(--c-wood-light),
                0 2px 0 #000;
        }

        /* CRT Vignette Overlay */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 70%, rgba(0,0,0,0.6) 100%);
            z-index: 5;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="world"></canvas>
        <div class="vignette"></div>

        <!-- UI Overlay -->
        <div class="ui-layer">
            
            <div class="title-container">
                <h1>Ski Free</h1>
                <span class="subtitle">PRESS START</span>
            </div>

            <div class="start-btn-container">
                <button class="start-btn" id="startBtn">START GAME</button>
            </div>

        </div>
    </div>

<script>
    /**
     * VISUAL ENGINE
     * Procedural Canvas rendering for the background scene.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    // Configuration
    // We use a low internal resolution to force the "pixel art" look when scaled up by CSS
    const LOGICAL_WIDTH = 320;
    const LOGICAL_HEIGHT = 240;
    
    // State
    let width, height;
    let frame = 0;
    let trees = [];
    let particles = [];
    
    // Colors (matching CSS variables for consistency)
    const C_SKY_TOP = '#4682B4';
    const C_SKY_BOT = '#87CEEB';
    const C_SNOW = '#FFFFFF';
    const C_SNOW_SHADOW = '#D3D3D3'; // Lighter grey for slope shading
    const C_TREE_DARK = '#006400';
    const C_TREE_LIGHT = '#228B22';
    const C_SKIER_JACKET = '#D32F2F';
    const C_SKIER_PANTS = '#1A237E';
    const C_SKIER_SKIS = '#FBC02D';
    const C_SKIER_POLE = '#555555';
    const C_SKIER_SKIN = '#FFCC80';
    const C_SKIER_HAT = '#B71C1C';

    // --- Drawing Helpers ---

    function drawRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
    }

    // --- Sprite Generators ---

    function drawPixelSkier(x, y) {
        ctx.save();
        ctx.translate(Math.floor(x), Math.floor(y));
        
        // Animation vars: Bobbing and Leaning
        const bob = Math.sin(frame * 0.2) * 1.5;
        const lean = Math.sin(frame * 0.1) * 0.1; 
        
        ctx.translate(0, bob);
        ctx.rotate(lean);

        // 1. Skis (Behind) - Wider stance
        drawRect(-6, 12, 2, 16, C_SKIER_SKIS); // Left
        drawRect(4, 12, 2, 16, C_SKIER_SKIS);  // Right

        // 2. Poles
        drawRect(-7, 6, 1, 18, C_SKIER_POLE);
        drawRect(6, 6, 1, 18, C_SKIER_POLE);

        // 3. Legs
        drawRect(-4, 10, 3, 5, C_SKIER_PANTS);
        drawRect(2, 10, 3, 5, C_SKIER_PANTS);

        // 4. Body (Jacket)
        drawRect(-4, 3, 8, 8, C_SKIER_JACKET);

        // 5. Head
        drawRect(-3, -2, 6, 5, C_SKIER_SKIN);
        
        // 6. Hat
        drawRect(-3, -3, 6, 2, C_SKIER_HAT);
        // Pom pom
        drawRect(-1, -5, 2, 2, '#FFFFFF');

        ctx.restore();
    }

    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(Math.floor(x), Math.floor(y));
        
        const s = Math.floor(scale); 

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.beginPath();
        ctx.ellipse(0, 20*s, 6*s, 2*s, 0, 0, Math.PI*2);
        ctx.fill();

        // Trunk
        drawRect(-s, 14*s, 2*s, 6*s, '#5D4037');

        // Leaves (Layered Triangles)
        // Layer 1 (Bottom)
        ctx.fillStyle = C_TREE_DARK;
        ctx.beginPath();
        ctx.moveTo(-7*s, 12*s);
        ctx.lineTo(7*s, 12*s);
        ctx.lineTo(0, 4*s);
        ctx.fill();

        // Layer 2 (Middle)
        ctx.fillStyle = C_TREE_LIGHT;
        ctx.beginPath();
        ctx.moveTo(-6*s, 8*s);
        ctx.lineTo(6*s, 8*s);
        ctx.lineTo(0, 0*s);
        ctx.fill();

        // Layer 3 (Top)
        ctx.fillStyle = C_TREE_DARK;
        ctx.beginPath();
        ctx.moveTo(-4*s, 4*s);
        ctx.lineTo(4*s, 4*s);
        ctx.lineTo(0, -4*s);
        ctx.fill();

        // Snow on branches (White highlights)
        ctx.fillStyle = '#FFFFFF';
        ctx.globalAlpha = 0.8;
        // Top cap
        ctx.fillRect(-2*s, -4*s, 4*s, 1*s);
        // Middle cap
        ctx.fillRect(-4*s, 0*s, 2*s, 1*s);
        ctx.fillRect(2*s, 1*s, 2*s, 1*s);
        ctx.globalAlpha = 1.0;

        ctx.restore();
    }

    // --- World Logic ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        // Set logical resolution
        canvas.width = LOGICAL_WIDTH;
        canvas.height = LOGICAL_HEIGHT;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        
        // Horizon line is roughly at 40% height
        const horizonY = LOGICAL_HEIGHT * 0.4;
        const groundHeight = LOGICAL_HEIGHT - horizonY;
        
        // Generate Trees in perspective rows
        const rows = 12;
        
        for(let i=0; i<rows; i++) {
            const rowProgress = (i + 1) / rows; // 0.0 to 1.0
            
            // Perspective curve: Objects closer to bottom are further apart
            const y = horizonY + (rowProgress * rowProgress * groundHeight);
            
            // Scale: Bigger at bottom
            const scale = 0.4 + (rowProgress * 1.8);
            
            // Density: More trees as we go down
            const treesInRow = Math.floor(2 + (rowProgress * 5));
            
            for(let t=0; t<treesInRow; t++) {
                // X Position: Spread out more at bottom
                // We want to frame the center, so we bias towards edges slightly
                const spread = (LOGICAL_WIDTH * 0.1) + (rowProgress * LOGICAL_WIDTH * 1.2);
                const centerX = LOGICAL_WIDTH / 2;
                
                // Random X
                const x = centerX + (Math.random() * spread - spread/2);
                
                trees.push({x, y, scale, z: i});
            }
        }
        
        // Sort by Y (Painter's algorithm) so lower trees draw on top of higher ones
        trees.sort((a, b) => a.y - b.y);

        // Snow Particles
        particles = [];
        for(let i=0; i<60; i++) {
            particles.push({
                x: Math.random() * LOGICAL_WIDTH,
                y: Math.random() * LOGICAL_HEIGHT,
                speed: Math.random() * 0.8 + 0.2,
                size: Math.random() > 0.7 ? 2 : 1,
                wind: Math.random() * 0.5
            });
        }
    }

    // --- Main Render Loop ---

    function drawBackground() {
        // 1. Sky Gradient
        let grad = ctx.createLinearGradient(0, 0, 0, LOGICAL_HEIGHT * 0.4);
        grad.addColorStop(0, C_SKY_TOP);
        grad.addColorStop(1, C_SKY_BOT);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        // 2. Snow Ground (Below horizon)
        const horizonY = LOGICAL_HEIGHT * 0.4;
        ctx.fillStyle = C_SNOW;
        ctx.fillRect(0, horizonY, LOGICAL_WIDTH, LOGICAL_HEIGHT - horizonY);

        // 3. Horizon Line (Subtle)
        ctx.fillStyle = '#E0F0FF';
        ctx.fillRect(0, horizonY, LOGICAL_WIDTH, 2);

        // 4. Slope Shading (Right side gets darker/shadowed)
        // Using a gradient for a smooth retro look
        let shadowGrad = ctx.createLinearGradient(LOGICAL_WIDTH * 0.4, 0, LOGICAL_WIDTH, 0);
        shadowGrad.addColorStop(0, 'rgba(0,0,0,0)');
        shadowGrad.addColorStop(1, 'rgba(0,0,0,0.1)');
        ctx.fillStyle = shadowGrad;
        ctx.fillRect(0, horizonY, LOGICAL_WIDTH, LOGICAL_HEIGHT - horizonY);
    }

    function animate() {
        // Clear
        ctx.clearRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        // 1. Background
        drawBackground();

        // 2. Trees
        trees.forEach(tree => {
            drawTree(tree.x, tree.y, tree.scale);
        });

        // 3. Skier (Centered, placed on the "ground")
        // Positioned slightly above the UI button area
        const skierX = LOGICAL_WIDTH / 2;
        const skierY = LOGICAL_HEIGHT * 0.75; 
        drawPixelSkier(skierX, skierY);

        // 4. Particles (Snow)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        particles.forEach(p => {
            p.y += p.speed;
            p.x -= p.wind; // Wind blowing left
            if (p.y > LOGICAL_HEIGHT) { p.y = 0; p.x = Math.random() * LOGICAL_WIDTH; }
            if (p.x < 0) p.x = LOGICAL_WIDTH;
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // --- Interaction ---
    
    document.getElementById('startBtn').addEventListener('click', function() {
        const btn = this;
        const originalText = btn.innerText;
        
        // Visual feedback
        btn.innerText = "LOADING...";
        
        // Fake loading delay for effect
        setTimeout(() => {
            alert("GAME START!\n\n(This is a visual demo of the start screen)");
            btn.innerText = originalText;
        }, 600);
    });

    // Init
    window.addEventListener('resize', resize);
    resize(); // Initial setup
    animate(); // Start loop

</script>
</body>
</html>
