<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        :root {
            /* Palette: Authentic 8-bit/16-bit Snow Colors */
            --c-sky-top: #2C6496;
            --c-sky-bot: #87CEEB;
            --c-snow: #FFFFFF;
            --c-snow-shadow: #D0E4F2;
            --c-text: #000000;
            --c-wood: #8B5A2B;
            --c-wood-dark: #5C3A1B;
            --c-wood-light: #A67B5B;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: "Courier New", Courier, monospace; /* Fallback for pixel feel */
        }

        /* Main Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Pixel Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* Critical for pixel art: Nearest Neighbor */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* UI Overlay Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Click through to canvas where possible */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        /* Title Styling */
        .title-container {
            position: absolute;
            top: 12%; /* Lowered horizon allows more space here */
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 5rem;
            line-height: 1;
            text-transform: uppercase;
            color: var(--c-snow);
            /* Hard Retro 3D Text Shadow */
            text-shadow: 
                6px 6px 0 #000,
                -2px -2px 0 #2C6496;
            letter-spacing: -4px;
            font-weight: 900;
        }

        .instructions {
            display: block;
            margin-top: 15px;
            font-size: 1.2rem;
            color: var(--c-snow);
            text-shadow: 2px 2px 0 #000;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* 
           The Start Button (Wooden Sign)
           Positioned at bottom to anchor the composition
        */
        .start-btn-container {
            pointer-events: auto;
            margin-bottom: 8vh;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* The Wooden Sign */
        .start-btn {
            background-color: var(--c-wood);
            color: #FFE4C4;
            border: 4px solid #000;
            padding: 12px 32px;
            font-family: "Courier New", Courier, monospace;
            font-weight: 900;
            font-size: 1.5rem;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            outline: none;
            
            /* Bevel effect */
            box-shadow: 
                inset 4px 4px 0 var(--c-wood-light),
                inset -4px -4px 0 var(--c-wood-dark),
                0 6px 0 #000;

            text-shadow: 2px 2px 0 #000;
            transition: transform 0.1s, box-shadow 0.1s;
            min-width: 220px;
        }

        /* Wood grain via CSS pattern */
        .start-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 10px,
                rgba(0,0,0,0.1) 10px,
                rgba(0,0,0,0.1) 12px
            );
            pointer-events: none;
        }

        /* Nails */
        .start-btn::before {
            content: '';
            position: absolute;
            top: 50%; left: 12px;
            width: 6px; height: 6px;
            background: #333;
            border-radius: 50%;
            box-shadow: 190px 0 0 #333; /* Second nail */
            transform: translateY(-50%);
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                inset 4px 4px 0 var(--c-wood-light),
                inset -4px -4px 0 var(--c-wood-dark),
                0 8px 0 #000;
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 
                inset 4px 4px 0 var(--c-wood-dark),
                inset -4px -4px 0 var(--c-wood-light),
                0 0 0 #000;
        }

        /* CRT Vignette */
        .vignette {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.7) 100%);
            z-index: 50;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="world"></canvas>
        <div class="vignette"></div>

        <div class="ui-layer">
            
            <div class="title-container">
                <h1>Ski Free</h1>
                <span class="instructions">USE ARROW KEYS TO MOVE</span>
            </div>

            <div class="start-btn-container">
                <button class="start-btn" id="startBtn">START GAME</button>
            </div>

        </div>
    </div>

<script>
    /**
     * VISUAL ENGINE
     * Procedural Canvas rendering.
     * We render at a low resolution (320x240) and scale up via CSS
     * to achieve authentic pixel art without external assets.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    // Configuration
    const LOGICAL_WIDTH = 320;
    const LOGICAL_HEIGHT = 240;
    
    let width, height;
    let frame = 0;
    let trees = [];
    let clouds = [];
    let particles = [];
    
    // Colors
    const C_SKY_TOP = '#2C6496';
    const C_SKY_BOT = '#87CEEB';
    const C_SNOW = '#FFFFFF';
    const C_SNOW_SHADOW = '#D0E4F2';
    const C_TREE_DARK = '#006400';
    const C_TREE_LIGHT = '#228B22';
    const C_TREE_SHADOW = '#004d00';
    
    // Skier Palette
    const C_SKI_RED = '#D32F2F';
    const C_SKI_BLUE = '#1A237E';
    const C_SKI_SKIN = '#FFCC80';
    const C_SKI_HAT = '#B71C1C';
    const C_SKI_SKIS = '#FBC02D';

    // --- Helpers ---

    function drawRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
    }

    function drawPixelSkier(x, y) {
        ctx.save();
        ctx.translate(Math.floor(x), Math.floor(y));
        
        // Idle Animation: Bobbing
        const bob = Math.sin(frame * 0.15) * 1; 
        
        ctx.translate(0, bob);

        // 1. Skis (Yellow)
        drawRect(-7, 14, 2, 16, C_SKI_SKIS); 
        drawRect(5, 14, 2, 16, C_SKI_SKIS);  

        // 2. Poles (Grey)
        drawRect(-8, 8, 1, 18, '#777');
        drawRect(7, 8, 1, 18, '#777');

        // 3. Legs (Blue)
        drawRect(-4, 12, 3, 6, C_SKI_BLUE);
        drawRect(1, 12, 3, 6, C_SKI_BLUE);

        // 4. Body (Red Jacket)
        drawRect(-5, 4, 10, 9, C_SKI_RED);
        // Zipper detail
        drawRect(-1, 4, 2, 9, '#B71C1C'); 

        // 5. Head (Skin)
        drawRect(-3, -1, 6, 6, C_SKI_SKIN);
        
        // 6. Hat (Red)
        drawRect(-3, -3, 6, 3, C_SKI_HAT);
        // Hat brim
        drawRect(-4, 1, 8, 1, C_SKI_HAT);
        
        // 7. Goggles
        drawRect(-3, 0, 6, 2, '#000');
        drawRect(-2, 0, 2, 1, '#FFF'); // Reflection

        ctx.restore();
    }

    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(Math.floor(x), Math.floor(y));
        
        const s = Math.floor(scale); 

        // Shadow on snow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(0, 18*s, 8*s, 3*s, 0, 0, Math.PI*2);
        ctx.fill();

        // Trunk
        drawRect(-s, 14*s, 2*s, 6*s, '#5D4037');

        // Leaves (Layered Triangles)
        // Bottom
        ctx.fillStyle = C_TREE_DARK;
        ctx.beginPath();
        ctx.moveTo(-8*s, 12*s);
        ctx.lineTo(8*s, 12*s);
        ctx.lineTo(0, 4*s);
        ctx.fill();

        // Middle
        ctx.fillStyle = C_TREE_LIGHT;
        ctx.beginPath();
        ctx.moveTo(-7*s, 8*s);
        ctx.lineTo(7*s, 8*s);
        ctx.lineTo(0, 0*s);
        ctx.fill();

        // Top
        ctx.fillStyle = C_TREE_DARK;
        ctx.beginPath();
        ctx.moveTo(-5*s, 4*s);
        ctx.lineTo(5*s, 4*s);
        ctx.lineTo(0, -4*s);
        ctx.fill();

        // Snow Caps (White)
        ctx.fillStyle = '#FFF';
        // Top
        ctx.fillRect(-3*s, -4*s, 6*s, 1*s);
        // Mid
        ctx.fillRect(-5*s, 0*s, 3*s, 1*s);
        ctx.fillRect(2*s, 1*s, 3*s, 1*s);

        ctx.restore();
    }

    function drawCloud(x, y, scale) {
        ctx.save();
        ctx.translate(Math.floor(x), Math.floor(y));
        const s = scale;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        // Simple blocky cloud
        drawRect(0, 0, 20*s, 6*s, ctx.fillStyle);
        drawRect(4*s, -4*s, 12*s, 4*s, ctx.fillStyle);
        drawRect(10*s, -2*s, 8*s, 2*s, ctx.fillStyle);
        ctx.restore();
    }

    // --- World Logic ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        // Set internal resolution (Pixel Art Style)
        canvas.width = LOGICAL_WIDTH;
        canvas.height = LOGICAL_HEIGHT;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        clouds = [];
        
        // Horizon line: Lowered to 30% to give sky breathing room
        const horizonY = LOGICAL_HEIGHT * 0.3; 
        const groundHeight = LOGICAL_HEIGHT - horizonY;
        
        // Generate Trees
        const rows = 15;
        for(let i=0; i<rows; i++) {
            const rowProgress = (i + 1) / rows; 
            
            // Perspective curve: Objects closer to bottom are further apart
            const y = horizonY + (Math.pow(rowProgress, 1.5) * groundHeight);
            
            // Scale: Bigger at bottom
            const scale = 0.3 + (rowProgress * 2.2);
            
            // Density: More trees as we go down
            const treesInRow = Math.floor(2 + (rowProgress * 6));
            
            for(let t=0; t<treesInRow; t++) {
                const spread = (LOGICAL_WIDTH * 0.1) + (rowProgress * LOGICAL_WIDTH * 1.1);
                const centerX = LOGICAL_WIDTH / 2;
                const x = centerX + (Math.random() * spread - spread/2);
                
                trees.push({x, y, scale, z: i});
            }
        }
        
        // Sort by Y
        trees.sort((a, b) => a.y - b.y);

        // Generate Clouds
        for(let i=0; i<5; i++) {
            clouds.push({
                x: Math.random() * LOGICAL_WIDTH,
                y: Math.random() * (horizonY - 20),
                speed: Math.random() * 0.2 + 0.05,
                scale: Math.random() * 0.5 + 0.5
            });
        }

        // Snow Particles
        particles = [];
        for(let i=0; i<80; i++) {
            particles.push({
                x: Math.random() * LOGICAL_WIDTH,
                y: Math.random() * LOGICAL_HEIGHT,
                speed: Math.random() * 1.2 + 0.3,
                size: Math.random() > 0.8 ? 2 : 1,
                wind: Math.random() * 0.4
            });
        }
    }

    // --- Main Render Loop ---

    function drawBackground() {
        const horizonY = LOGICAL_HEIGHT * 0.3;

        // 1. Sky Gradient (Smooth but limited stops)
        let grad = ctx.createLinearGradient(0, 0, 0, horizonY);
        grad.addColorStop(0, C_SKY_TOP);
        grad.addColorStop(1, C_SKY_BOT);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, LOGICAL_WIDTH, horizonY);

        // 2. Sun (Pixelated Circle)
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(260, 40, 12, 0, Math.PI*2);
        ctx.fill();

        // 3. Snow Ground
        ctx.fillStyle = C_SNOW;
        ctx.fillRect(0, horizonY, LOGICAL_WIDTH, LOGICAL_HEIGHT - horizonY);

        // 4. Horizon Line
        ctx.fillStyle = '#E0F0FF';
        ctx.fillRect(0, horizonY, LOGICAL_WIDTH, 2);

        // 5. Slope Shading (Subtle gradient)
        let shadowGrad = ctx.createLinearGradient(LOGICAL_WIDTH * 0.4, 0, LOGICAL_WIDTH, 0);
        shadowGrad.addColorStop(0, 'rgba(0,0,0,0)');
        shadowGrad.addColorStop(1, 'rgba(0,0,0,0.15)');
        ctx.fillStyle = shadowGrad;
        ctx.fillRect(0, horizonY, LOGICAL_WIDTH, LOGICAL_HEIGHT - horizonY);
    }

    function animate() {
        // Clear
        ctx.clearRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        // 1. Background
        drawBackground();

        // 2. Clouds
        clouds.forEach(c => {
            c.x -= c.speed;
            if(c.x < -50) c.x = LOGICAL_WIDTH + 50;
            drawCloud(c.x, c.y, c.scale);
        });

        // 3. Trees
        trees.forEach(tree => {
            drawTree(tree.x, tree.y, tree.scale);
        });

        // 4. Skier (Centered, placed on the "ground")
        // Positioned slightly above the button area visually
        const skierX = LOGICAL_WIDTH / 2;
        const skierY = LOGICAL_HEIGHT * 0.75; 
        drawPixelSkier(skierX, skierY);

        // 5. Particles (Snow)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        particles.forEach(p => {
            p.y += p.speed;
            p.x -= p.wind; 
            if (p.y > LOGICAL_HEIGHT) { p.y = -5; p.x = Math.random() * LOGICAL_WIDTH; }
            if (p.x < 0) p.x = LOGICAL_WIDTH;
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // --- Interaction ---
    
    document.getElementById('startBtn').addEventListener('click', function() {
        const btn = this;
        const originalText = btn.innerText;
        
        btn.innerText = "LOADING...";
        
        setTimeout(() => {
            alert("GAME START!\n\n(This is a visual demo of the start screen)");
            btn.innerText = originalText;
        }, 600);
    });

    // Init
    window.addEventListener('resize', resize);
    resize(); 
    animate(); 

</script>
</body>
</html>
