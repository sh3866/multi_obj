<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        :root {
            --c-sky-top: #003388;
            --c-sky-bot: #66BBFF;
            --c-snow: #FFFFFF;
            --c-snow-shadow: #CCDDEE;
            --c-ui-bg: #000;
            --c-ui-text: #FFF;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            /* System fonts that render pixelated */
            font-family: "Courier New", Courier, monospace;
        }

        /* Main Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Pixel Canvas */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* Critical for pixel art: Nearest Neighbor */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* UI Overlay Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* Title Styling */
        .title-container {
            position: absolute;
            top: 8%;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 6rem;
            line-height: 0.8;
            text-transform: uppercase;
            color: var(--c-snow);
            /* Critique Fix: Thick block shadow for arcade feel */
            text-shadow: 8px 8px 0px #000000;
            letter-spacing: -5px;
            font-weight: 900;
        }

        .instructions {
            display: block;
            margin-top: 15px;
            font-size: 1.2rem;
            color: var(--c-ui-text);
            font-weight: bold;
            letter-spacing: 2px;
            /* Critique Fix: Solid dark box for high contrast */
            background-color: #000;
            border: 2px solid #FFF;
            padding: 6px 16px;
            display: inline-block;
            transform: scale(1, 1);
        }

        /* 
           The Start Button (Critique Fix: Diegetic Wooden Sign)
           Floating in the sky area for clarity
        */
        .start-btn-container {
            pointer-events: auto;
            position: absolute;
            top: 38%; /* Floating in the sky */
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* The Wooden Sign Button */
        .start-btn {
            background-color: #8B4513; /* Wood Brown */
            color: #FFF;
            border: 4px solid #000;
            padding: 15px 30px;
            font-family: "Courier New", Courier, monospace;
            font-weight: 900;
            font-size: 1.8rem;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            outline: none;
            
            /* Pixel Art Wood Texture via CSS */
            background-image: 
                linear-gradient(90deg, transparent 50%, rgba(0,0,0,0.1) 50%),
                linear-gradient(0deg, transparent 50%, rgba(0,0,0,0.1) 50%);
            background-size: 10px 10px;

            /* Diegetic Post Styling */
            box-shadow: 
                inset 2px 2px 0 #A0522D,
                inset -2px -2px 0 #5D2906,
                0px 10px 0 #000; /* Drop shadow looks like a post shadow */
            
            transition: transform 0.1s, box-shadow 0.1s;
            min-width: 260px;
        }

        /* Sign Nails */
        .start-btn::before, .start-btn::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background: #444;
            border: 1px solid #000;
            top: 50%;
            transform: translateY(-50%);
        }
        .start-btn::before { left: 10px; }
        .start-btn::after { right: 10px; }

        .start-btn:hover {
            transform: translateY(-4px);
            background-color: #9B5523;
            box-shadow: 
                inset 2px 2px 0 #B0623D,
                inset -2px -2px 0 #6D3916,
                0px 14px 0 #000;
        }

        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 
                inset 2px 2px 0 #5D2906,
                inset -2px -2px 0 #A0522D,
                0px 2px 0 #000;
        }

        /* CRT Scanline Effect */
        .scanlines {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
            z-index: 50;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="world"></canvas>
        <div class="scanlines"></div>

        <div class="ui-layer">
            
            <div class="title-container">
                <h1>Ski Free</h1>
                <span class="instructions">USE ARROW KEYS TO MOVE</span>
            </div>

            <div class="start-btn-container">
                <button class="start-btn" id="startBtn">START GAME</button>
            </div>

        </div>
    </div>

<script>
    /**
     * VISUAL ENGINE
     * Procedural Canvas rendering.
     * Low resolution (320x240) scaled up for authentic pixel art.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    // Configuration
    const LOGICAL_WIDTH = 320;
    const LOGICAL_HEIGHT = 240;
    
    let width, height;
    let frame = 0;
    let trees = [];
    let clouds = [];
    let particles = [];
    
    // Colors
    const C_SKY_TOP = '#003388';
    const C_SKY_BOT = '#66BBFF';
    const C_SNOW = '#FFFFFF';
    // Critique Fix: Tree variation
    const C_TREE_DARK = '#004400';
    const C_TREE_MED = '#006600';
    const C_TREE_LIGHT = '#008800';
    
    // Skier Palette
    const C_SKI_RED = '#D32F2F';
    const C_SKI_BLUE = '#1A237E';
    const C_SKI_SKIN = '#FFCC80';
    const C_SKI_HAT = '#B71C1C';
    const C_SKI_SKIS = '#FBC02D';

    // --- Helpers ---

    function drawRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
    }

    function drawPixelSkier(x, y) {
        ctx.save();
        ctx.translate(Math.floor(x), Math.floor(y));
        
        // Idle Animation: Bobbing
        const bob = Math.sin(frame * 0.15) * 1; 
        
        ctx.translate(0, bob);

        // 1. Skis (Yellow)
        drawRect(-7, 14, 2, 16, C_SKI_SKIS); 
        drawRect(5, 14, 2, 16, C_SKI_SKIS);  

        // 2. Poles (Grey)
        drawRect(-8, 8, 1, 18, '#777');
        drawRect(7, 8, 1, 18, '#777');

        // 3. Legs (Blue)
        drawRect(-4, 12, 3, 6, C_SKI_BLUE);
        drawRect(1, 12, 3, 6, C_SKI_BLUE);

        // 4. Body (Red Jacket)
        drawRect(-5, 4, 10, 9, C_SKI_RED);
        // Zipper detail
        drawRect(-1, 4, 2, 9, '#B71C1C'); 

        // 5. Head (Skin)
        drawRect(-3, -1, 6, 6, C_SKI_SKIN);
        
        // 6. Hat (Red)
        drawRect(-3, -3, 6, 3, C_SKI_HAT);
        // Hat brim
        drawRect(-4, 1, 8, 1, C_SKI_HAT);
        
        // 7. Goggles
        drawRect(-3, 0, 6, 2, '#000');
        drawRect(-2, 0, 2, 1, '#FFF'); // Reflection

        ctx.restore();
    }

    // Critique Fix: Pixelated Tree with varied greens
    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(Math.floor(x), Math.floor(y));
        
        const s = Math.floor(scale); 

        // Shadow on snow (Solid color, no blur)
        ctx.fillStyle = '#CCDDEE';
        ctx.fillRect(0, 16*s, 10*s, 4*s);

        // Trunk
        drawRect(-s, 14*s, 2*s, 6*s, '#5D4037');

        // Leaves (Layered Rectangles to form a triangle)
        // Bottom Layer (Dark)
        drawRect(-7*s, 10*s, 14*s, 4*s, C_TREE_DARK);
        drawRect(-5*s, 8*s, 10*s, 2*s, C_TREE_DARK);

        // Middle Layer (Med)
        drawRect(-6*s, 6*s, 12*s, 4*s, C_TREE_MED);
        drawRect(-4*s, 4*s, 8*s, 2*s, C_TREE_MED);

        // Top Layer (Light)
        drawRect(-4*s, 2*s, 8*s, 4*s, C_TREE_LIGHT);
        drawRect(-2*s, 0*s, 4*s, 2*s, C_TREE_LIGHT);

        // Snow Caps (White Rects)
        ctx.fillStyle = '#FFF';
        drawRect(-3*s, 0, 6*s, 1*s);
        drawRect(-5*s, 4*s, 3*s, 1*s);
        drawRect(2*s, 4*s, 3*s, 1*s);

        ctx.restore();
    }

    // Critique Fix: Varied Cloud Shapes
    function drawCloud(x, y, scale) {
        ctx.save();
        ctx.translate(Math.floor(x), Math.floor(y));
        const s = scale;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        
        // Base
        drawRect(0, 0, 24*s, 6*s, ctx.fillStyle);
        
        // Variation: Randomly sized bumps
        drawRect(4*s, -4*s, 10*s, 4*s, ctx.fillStyle);
        drawRect(12*s, -6*s, 8*s, 6*s, ctx.fillStyle); // Taller bump
        drawRect(2*s, -2*s, 6*s, 2*s, ctx.fillStyle);
        
        ctx.restore();
    }

    // --- World Logic ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        // Set internal resolution (Pixel Art Style)
        canvas.width = LOGICAL_WIDTH;
        canvas.height = LOGICAL_HEIGHT;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        clouds = [];
        
        // Horizon line
        const horizonY = LOGICAL_HEIGHT * 0.35; 
        const groundHeight = LOGICAL_HEIGHT - horizonY;
        
        // Generate Trees
        const rows = 18;
        for(let i=0; i<rows; i++) {
            const rowProgress = (i + 1) / rows; 
            
            // Perspective curve
            const y = horizonY + (Math.pow(rowProgress, 1.8) * groundHeight);
            
            // Scale: Significantly larger at bottom
            const scale = 0.4 + (rowProgress * 3.5);
            
            // Density
            const treesInRow = Math.floor(2 + (rowProgress * 6));
            
            for(let t=0; t<treesInRow; t++) {
                const spread = (LOGICAL_WIDTH * 0.2) + (rowProgress * LOGICAL_WIDTH * 1.2);
                const centerX = LOGICAL_WIDTH / 2;
                let x = centerX + (Math.random() * spread - spread/2);
                
                // Critique Fix: Establish Depth - Create a "Lane" in the center
                // Clear a wider path for the skier to pop
                if (rowProgress > 0.4) {
                    const distFromCenter = Math.abs(x - centerX);
                    const safeZone = 30 + (rowProgress * 20); // Wider safe zone closer to camera
                    if (distFromCenter < safeZone) {
                        x = (x > centerX) ? centerX + safeZone + Math.random()*10 : centerX - safeZone - Math.random()*10;
                    }
                }

                trees.push({x, y, scale, z: i});
            }
        }
        
        // Sort by Y
        trees.sort((a, b) => a.y - b.y);

        // Generate Clouds
        for(let i=0; i<6; i++) {
            clouds.push({
                x: Math.random() * LOGICAL_WIDTH,
                y: Math.random() * (horizonY - 20),
                speed: Math.random() * 0.15 + 0.05,
                scale: Math.random() * 0.6 + 0.5
            });
        }

        // Snow Particles
        particles = [];
        for(let i=0; i<80; i++) {
            particles.push({
                x: Math.random() * LOGICAL_WIDTH,
                y: Math.random() * LOGICAL_HEIGHT,
                speed: Math.random() * 1.2 + 0.3,
                size: Math.random() > 0.8 ? 2 : 1,
                wind: Math.random() * 0.4
            });
        }
    }

    // --- Main Render Loop ---

    function drawBackground() {
        const horizonY = LOGICAL_HEIGHT * 0.35;

        // 1. Sky Gradient (Stepped/Low-res to match pixel aesthetic)
        const steps = 8;
        const stepHeight = horizonY / steps;
        for(let i=0; i<steps; i++) {
            const ratio = i / steps;
            // Interpolate between C_SKY_TOP (#003388) and C_SKY_BOT (#66BBFF)
            // 0, 51, 136  ->  102, 187, 255
            const r = Math.floor(0 + (102 - 0) * ratio);
            const g = Math.floor(51 + (187 - 51) * ratio);
            const b = Math.floor(136 + (255 - 136) * ratio);
            ctx.fillStyle = `rgb(${r},${g},${b})`;
            ctx.fillRect(0, i * stepHeight, LOGICAL_WIDTH, stepHeight + 1);
        }

        // 2. Sun (Pixelated - Jagged/Cross shape)
        ctx.fillStyle = '#FFD700';
        const cx = 260, cy = 40;
        // Draw a pixelated diamond/cross shape
        drawRect(cx-2, cy-12, 4, 24, '#FFD700');
        drawRect(cx-12, cy-2, 24, 4, '#FFD700');
        drawRect(cx-6, cy-6, 12, 12, '#FFD700'); // Inner square
        
        // 3. Snow Ground
        ctx.fillStyle = C_SNOW;
        ctx.fillRect(0, horizonY, LOGICAL_WIDTH, LOGICAL_HEIGHT - horizonY);

        // 4. Horizon Line
        ctx.fillStyle = '#E0F0FF';
        ctx.fillRect(0, horizonY, LOGICAL_WIDTH, 2);

        // 5. Slope Shading (Hard block shadow on right side)
        ctx.fillStyle = 'rgba(0,0,0,0.03)';
        ctx.fillRect(LOGICAL_WIDTH * 0.6, horizonY, LOGICAL_WIDTH * 0.4, LOGICAL_HEIGHT - horizonY);
    }

    function animate() {
        // Clear
        ctx.clearRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        // 1. Background
        drawBackground();

        // 2. Clouds
        clouds.forEach(c => {
            c.x -= c.speed;
            if(c.x < -60) c.x = LOGICAL_WIDTH + 60;
            drawCloud(c.x, c.y, c.scale);
        });

        // 3. Trees
        trees.forEach(tree => {
            drawTree(tree.x, tree.y, tree.scale);
        });

        // 4. Skier (Centered, placed on the "ground")
        // Moved up slightly to ensure he sits in the cleared path
        const skierX = LOGICAL_WIDTH / 2;
        const skierY = LOGICAL_HEIGHT * 0.60; 
        drawPixelSkier(skierX, skierY);

        // 5. Particles (Snow)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        particles.forEach(p => {
            p.y += p.speed;
            p.x -= p.wind; 
            if (p.y > LOGICAL_HEIGHT) { p.y = -5; p.x = Math.random() * LOGICAL_WIDTH; }
            if (p.x < 0) p.x = LOGICAL_WIDTH;
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // --- Interaction ---
    
    document.getElementById('startBtn').addEventListener('click', function() {
        const btn = this;
        const originalText = btn.innerText;
        
        btn.innerText = "LOADING...";
        
        setTimeout(() => {
            alert("GAME START!\n\n(This is a visual demo of the start screen)");
            btn.innerText = originalText;
        }, 600);
    });

    // Init
    window.addEventListener('resize', resize);
    resize(); 
    animate(); 

</script>
</body>
</html>
