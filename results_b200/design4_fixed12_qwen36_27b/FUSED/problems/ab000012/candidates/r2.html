<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #030305;
        --bg-panel: #0a0a10;
        --gold-primary: #d4af37;
        --gold-dim: #8a701e;
        --gold-glow: #ffe680;
        --accent-cyan: #00f0ff;
        --accent-purple: #b026ff;
        --text-main: #e0e6ed;
        --text-muted: #7a8c9e;
        --font-heading: 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Helvetica Neue', sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* --- Background Atmosphere --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 30%, rgba(10, 10, 20, 0) 0%, var(--bg-deep) 85%);
        z-index: 1;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 900px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 1.5rem;
        justify-content: space-between;
    }

    /* --- Header: Currency --- */
    header {
        display: flex;
        justify-content: flex-end; /* Align right */
        align-items: center;
        padding-top: 1rem;
        z-index: 20;
    }

    /* Redesigned Currency: Magic Coin */
    .currency-container {
        position: relative;
        display: flex;
        align-items: center;
        background: radial-gradient(circle at center, #1a1a20 0%, #050505 100%);
        padding: 8px 20px 8px 10px;
        border-radius: 30px;
        border: 1px solid #333;
        box-shadow: 
            0 4px 15px rgba(0,0,0,0.8),
            inset 0 0 10px rgba(0,0,0,0.9);
        transform: skewX(-5deg);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .currency-container:hover {
        transform: skewX(-5deg) scale(1.05);
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        border-color: var(--gold-dim);
    }

    .coin-visual {
        width: 36px;
        height: 36px;
        background: radial-gradient(circle at 30% 30%, #ffe680, #d4af37, #755d1e);
        border-radius: 50%;
        border: 2px solid #5a4610;
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 12px;
        position: relative;
        transform: skewX(5deg); /* Counter skew */
    }

    .coin-visual::after {
        content: '';
        position: absolute;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1px dashed rgba(90, 70, 16, 0.6);
    }

    .coin-visual svg {
        width: 16px;
        fill: #4a3b00;
        transform: skewX(5deg);
    }

    .currency-value {
        font-family: var(--font-heading);
        font-size: 1.2rem;
        font-weight: bold;
        color: var(--gold-primary);
        text-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
        transform: skewX(5deg);
        letter-spacing: 1px;
    }

    /* --- Hero Section: Title & Circle --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        margin: 1rem 0;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 3.5rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        margin-bottom: 0.5rem;
        background: linear-gradient(to bottom, #fff 20%, var(--gold-primary) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
        z-index: 10;
        position: relative;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.85rem;
        color: var(--accent-cyan);
        letter-spacing: 0.5em;
        text-transform: uppercase;
        margin-bottom: 2rem;
        opacity: 0.8;
        text-shadow: 0 0 8px var(--accent-cyan);
        z-index: 10;
    }

    /* The Summoning Circle (Expanded Hero Element) */
    .summoning-circle-container {
        position: relative;
        width: 320px;
        height: 320px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1rem;
    }

    .summoning-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    /* --- Menu Grid: Cards --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
        width: 100%;
        padding: 0 1rem;
        margin-bottom: 1rem;
        perspective: 1000px;
    }

    /* Card Design */
    .menu-card {
        position: relative;
        background: linear-gradient(180deg, #15151e 0%, #08080c 100%);
        border-top: 1px solid #333;
        border-bottom: 1px solid #111;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.2rem 0.5rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        overflow: hidden;
    }

    /* Texture Overlay on Card */
    .menu-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 80%);
        pointer-events: none;
    }

    /* Glow Border Effect */
    .menu-card::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 4px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
        pointer-events: none;
        transition: box-shadow 0.3s ease;
    }

    .menu-card:hover {
        transform: translateY(-5px);
        background: linear-gradient(180deg, #1c1c26 0%, #0a0a0f 100%);
        border-top-color: #555;
    }

    .menu-card:hover::after {
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15), 0 0 15px rgba(255,255,255,0.05);
    }

    /* Specific Card Styles */
    .menu-card.summon {
        background: linear-gradient(180deg, #2a2210 0%, #0f0c05 100%);
        border-top: 1px solid var(--gold-dim);
    }
    .menu-card.summon:hover {
        border-top-color: var(--gold-primary);
        box-shadow: 0 5px 20px rgba(212, 175, 55, 0.15);
    }
    .menu-card.summon .card-icon { fill: var(--gold-primary); filter: drop-shadow(0 0 5px var(--gold-dim)); }
    
    .menu-card.battle:hover { border-top-color: #ff4d4d; }
    .menu-card.battle:hover .card-icon { fill: #ff4d4d; filter: drop-shadow(0 0 8px #ff4d4d); }

    .menu-card.roster:hover { border-top-color: var(--accent-cyan); }
    .menu-card.roster:hover .card-icon { fill: var(--accent-cyan); filter: drop-shadow(0 0 8px var(--accent-cyan)); }

    .menu-card.grind:hover { border-top-color: #a380ff; }
    .menu-card.grind:hover .card-icon { fill: #a380ff; filter: drop-shadow(0 0 8px #a380ff); }

    /* Icons */
    .card-icon {
        width: 42px;
        height: 42px;
        fill: var(--text-muted);
        margin-bottom: 12px;
        transition: all 0.3s ease;
    }

    .card-label {
        font-family: var(--font-heading);
        font-size: 0.9rem;
        color: var(--text-main);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 600;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.7rem;
        opacity: 0.3;
        padding-bottom: 1rem;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    /* --- Animations --- */
    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }
    @keyframes pulse-glow {
        0%, 100% { opacity: 0.6; filter: blur(2px); }
        50% { opacity: 1; filter: blur(4px); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 2.2rem; }
        .summoning-circle-container { width: 220px; height: 220px; }
        .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }
        .app-container { padding: 1rem; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-container">
                <div class="coin-visual">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                    </svg>
                </div>
                <span class="currency-value">12,450</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <!-- Expanded Summoning Circle -->
            <div class="summoning-circle-container">
                <svg class="summoning-svg" viewBox="0 0 300 300">
                    <defs>
                        <!-- Filters -->
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>

                        <!-- Gradients -->
                        <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
                            <stop offset="40%" style="stop-color:#00f0ff;stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:#0a0a10;stop-opacity:0" />
                        </radialGradient>
                        
                        <linearGradient id="runeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#b026ff;stop-opacity:1" />
                        </linearGradient>
                    </defs>

                    <!-- Outer Runes (Rotating Clockwise) -->
                    <g filter="url(#glow)">
                        <circle cx="150" cy="150" r="130" stroke="url(#runeGrad)" stroke-width="1" stroke-dasharray="2 12" fill="none" opacity="0.5">
                            <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="40s" repeatCount="indefinite" />
                        </circle>
                        <circle cx="150" cy="150" r="135" stroke="rgba(0, 240, 255, 0.1)" stroke-width="1" fill="none">
                             <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="60s" repeatCount="indefinite" />
                        </circle>
                    </g>

                    <!-- Middle Magic Geometry (Rotating Counter-Clockwise) -->
                    <g opacity="0.7" filter="url(#glow)">
                        <polygon points="150,40 245,205 55,205" fill="none" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1">
                            <animateTransform attributeName="transform" type="rotate" from="360 150 150" to="0 150 150" dur="25s" repeatCount="indefinite" />
                        </polygon>
                        <polygon points="150,260 55,95 245,95" fill="none" stroke="rgba(176, 38, 255, 0.3)" stroke-width="1">
                            <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="35s" repeatCount="indefinite" />
                        </polygon>
                        <!-- Connecting Ring -->
                        <circle cx="150" cy="150" r="100" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" stroke-dasharray="10 20" fill="none">
                            <animateTransform attributeName="transform" type="rotate" from="360 150 150" to="0 150 150" dur="20s" repeatCount="indefinite" />
                        </circle>
                    </g>

                    <!-- Inner Core Aura -->
                    <circle cx="150" cy="150" r="60" fill="url(#coreGrad)" filter="url(#heavyGlow)">
                        <animate attributeName="r" values="58;65;58" dur="4s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Center Spirit Eye/Orb -->
                    <circle cx="150" cy="150" r="20" fill="white" opacity="0.9">
                         <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
                    </circle>
                </svg>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Flame/Diamond -->
                    <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                </svg>
                <span class="card-label">Summon</span>
            </div>

            <!-- Roster -->
            <div class="menu-card roster" onclick="interact('Roster')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- People -->
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card battle" onclick="interact('Battle')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Sword & Shield (Combined) -->
                    <path d="M14.5 13.5L11 17l-4-4 3.5-3.5 4 4zM6 18l2-2 2 2-2 2-2-2zm12.5-8.5l-2-2 2-2 2 2-2 2zM7 7l2-2 2 2-2 2-2-2z" opacity="0.3"/> <!-- Faint background details -->
                    <path d="M19.5 3.5L17 6l-1-1-8 8 1 1 8-8 2.5-2.5-1-1zM5 19l2-2-1-1-3 3 2 0z"/> <!-- Sword -->
                    <path d="M3 13c0 3.87 3.13 7 7 7s7-3.13 7-7H3z" opacity="0.6"/> <!-- Shield bottom -->
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card grind" onclick="interact('Grind')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Pickaxe -->
                    <path d="M17.66 11.2c-.23-.3-.51-.56-.77-.82-.67-.67-1.8-.67-2.47 0l-1.06 1.06-1.06-1.06c-.67-.67-1.8-.67-2.47 0-.26.26-.54.52-.77.82L2.6 19.15c-.61.61-.61 1.6 0 2.21.3.3.7.46 1.1.46s.8-.16 1.1-.46l7.95-7.95 1.06 1.06c.67.67 1.8.67 2.47 0 .26-.26.54-.52.77-.82l1.06-1.06c.67-.67.67-1.8 0-2.47l-1.06-1.06zM4.6 20.2c-.2.2-.52.2-.72 0s-.2-.52 0-.72l7.6-7.6 1.43 1.43-7.6 7.6z"/>
                    <path d="M21.41 6.64l-3.5-3.5c-.2-.2-.51-.2-.71 0l-2.12 2.12 3.5 3.5 2.12-2.12c.2-.2.2-.51 0-.71z"/>
                </svg>
                <span class="card-label">Grind</span>
            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline
        </footer>
    </div>

<script>
    // --- Background Particle System ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.vx = (Math.random() - 0.5) * 0.2;
            this.vy = -(Math.random() * 1.0 + 0.2); // Slower, more ethereal rise
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.5;
            // Color palette
            const rand = Math.random();
            if (rand > 0.9) {
                this.color = '212, 175, 55'; // Gold
            } else if (rand > 0.8) {
                this.color = '0, 240, 255'; // Cyan
            } else {
                this.color = '255, 255, 255'; // White
            }
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.0005;

            if (this.alpha <= 0 || this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 15000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        // Simple scale animation
        btn.style.transform = 'scale(0.95)';
        btn.style.filter = 'brightness(1.2)';
        setTimeout(() => {
            btn.style.transform = '';
            btn.style.filter = '';
        }, 150);
        
        // Logic placeholder
        console.log(`Interacting with: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
