<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Walker - Skill Matrix</title>
<style>
    :root {
        /* Base Colors */
        --bg-deep: #050308;
        --bg-panel: rgba(18, 14, 28, 0.95);
        
        /* Accents - Thematic Identity (Critique #3) */
        --accent-lightning: #00f0ff; /* Cyan/Teal */
        --accent-shield: #7000ff;    /* Deep Purple */
        --accent-intellect: #d946ef; /* Magenta */
        --accent-void: #ffffff;
        
        /* UI Colors */
        --text-primary: #f0f0f5;
        --text-secondary: #9ca3af;
        --text-muted: #4b5563;
        --border-dim: #2d2a3e;
        --border-bright: #5e5680;

        /* Typography */
        --font-header: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', Roboto, Helvetica, sans-serif;
    }

    * { box-sizing: border-box; user-select: none; outline: none; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background Depth & Texture (Critique #3) --- */
    .bg-layer {
        position: absolute;
        inset: 0;
        z-index: -1;
        background: 
            radial-gradient(circle at 50% 30%, rgba(112, 0, 255, 0.15) 0%, transparent 60%),
            radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
        animation: bgPulse 10s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
        0% { opacity: 0.8; transform: scale(1); }
        100% { opacity: 1; transform: scale(1.05); }
    }

    /* --- Header (Critique #2: Overlap Fix) --- */
    header {
        height: 100px;
        /* Gradient overlay to prevent hard cut */
        background: linear-gradient(180deg, rgba(5, 3, 8, 0.95) 0%, rgba(5, 3, 8, 0.6) 80%, transparent 100%);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 50px;
        z-index: 20;
        position: relative;
    }

    .brand {
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-left: 4px solid var(--accent-lightning);
        padding-left: 20px;
    }

    .brand h1 {
        font-family: var(--font-header);
        font-size: 2rem;
        letter-spacing: 0.08em;
        margin: 0;
        color: var(--text-primary);
        text-transform: uppercase;
        text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }

    .brand span {
        font-family: var(--font-ui);
        font-size: 0.85rem;
        color: var(--accent-intellect);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-top: 5px;
        font-weight: 600;
    }

    .char-summary {
        display: flex;
        align-items: center;
        gap: 40px;
        background: rgba(0,0,0,0.4);
        padding: 10px 30px;
        border-radius: 4px;
        border: 1px solid var(--border-dim);
    }

    .char-name {
        font-family: var(--font-header);
        font-size: 1.5rem;
        color: var(--text-primary);
        border-right: 1px solid var(--border-bright);
        padding-right: 20px;
    }

    .char-class {
        font-family: var(--font-ui);
        font-size: 0.9rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-weight: 600;
    }

    /* --- Main Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        height: calc(100vh - 100px);
        position: relative;
    }

    /* --- Sidebar (Critique #5: Hierarchy) --- */
    aside {
        width: 360px;
        background: var(--bg-panel);
        border-right: 1px solid var(--border-dim);
        display: flex;
        flex-direction: column;
        padding: 30px;
        position: relative;
        z-index: 10;
        backdrop-filter: blur(10px);
        box-shadow: 10px 0 40px rgba(0,0,0,0.6);
    }

    /* Decorative accent line */
    aside::before {
        content: '';
        position: absolute;
        top: 20px; left: 0; bottom: 20px;
        width: 2px;
        background: linear-gradient(180deg, var(--accent-lightning), var(--accent-shield));
        box-shadow: 0 0 10px var(--accent-lightning);
    }

    .stat-group {
        margin-bottom: 40px;
    }

    .section-title {
        font-family: var(--font-ui);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--text-muted);
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .section-title::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border-dim);
    }

    /* Level Block */
    .level-display {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 10px;
    }

    .lvl-num {
        font-family: var(--font-header);
        font-size: 4.5rem;
        line-height: 1;
        color: var(--text-primary);
        text-shadow: 0 0 25px rgba(112, 0, 255, 0.3);
        font-weight: 700;
    }

    .lvl-label {
        font-family: var(--font-ui);
        font-size: 1.1rem;
        color: var(--accent-shield);
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.05em;
    }

    /* XP Bar */
    .xp-container {
        margin-bottom: 5px;
        position: relative;
    }

    .xp-bar-track {
        width: 100%;
        height: 6px;
        background: rgba(255,255,255,0.05);
        border-radius: 3px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.1);
    }

    .xp-fill {
        width: 68%;
        height: 100%;
        background: linear-gradient(90deg, var(--accent-shield), var(--accent-intellect));
        box-shadow: 0 0 15px var(--accent-intellect);
        position: relative;
    }
    
    .xp-text {
        text-align: right;
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-top: 8px;
        font-weight: 600;
        letter-spacing: 0.05em;
    }

    /* Skill Points (Critique #5: Smooth Integration) */
    .points-container {
        background: linear-gradient(90deg, rgba(0, 240, 255, 0.1) 0%, transparent 100%);
        border-left: 3px solid var(--accent-lightning);
        padding: 15px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 0 4px 4px 0;
        transition: all 0.3s ease;
        cursor: default;
    }

    .points-container:hover {
        background: linear-gradient(90deg, rgba(0, 240, 255, 0.2) 0%, transparent 100%);
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
    }

    .pts-info {
        display: flex;
        flex-direction: column;
    }

    .pts-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-secondary);
        margin-bottom: 4px;
    }

    .pts-val {
        font-family: var(--font-header);
        font-size: 2.2rem;
        color: var(--accent-lightning);
        line-height: 1;
        text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
    }

    /* Attributes (Critique #5: Visual Indicators) */
    .attributes-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 15px;
    }

    .attr-row {
        display: flex;
        align-items: center;
        gap: 15px;
        position: relative;
    }

    .attr-icon-box {
        width: 32px;
        height: 32px;
        background: rgba(255,255,255,0.05);
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border-dim);
    }

    .attr-icon {
        width: 18px;
        height: 18px;
        fill: var(--text-secondary);
        transition: fill 0.3s;
    }

    .attr-details {
        flex: 1;
    }

    .attr-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
    }

    .attr-name {
        color: var(--text-secondary);
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .attr-val {
        font-family: var(--font-header);
        color: var(--text-primary);
        font-size: 1rem;
    }

    .attr-bar-bg {
        width: 100%;
        height: 3px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
    }

    .attr-bar-fill {
        height: 100%;
        background: var(--accent-intellect);
        border-radius: 2px;
        box-shadow: 0 0 5px var(--accent-intellect);
    }

    /* --- Skill Tree Canvas --- */
    .canvas-container {
        flex: 1;
        position: relative;
        background: transparent;
        overflow: hidden;
        cursor: grab;
        /* Ensure header doesn't block top */
        margin-top: -40px; 
        padding-top: 40px;
    }

    .canvas-container:active {
        cursor: grabbing;
    }

    .tree-viewport {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        transform-origin: 0 0;
    }

    .tree-content {
        position: absolute;
        width: 1800px;
        height: 1200px;
    }

    /* --- SVG Connections (Critique #1) --- */
    svg.connections {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 1;
    }

    /* Base line style */
    .conn-line {
        stroke: #2a253a; /* Dark muted purple */
        stroke-width: 6;
        fill: none;
        transition: stroke 0.5s ease;
        stroke-linecap: round;
    }

    /* Active path style - Glowing */
    .conn-line.active {
        stroke-width: 6;
        filter: drop-shadow(0 0 8px currentColor);
    }

    /* --- Nodes (Critique #4: Elevate Design) --- */
    .node {
        position: absolute;
        width: 80px;
        height: 80px;
        transform: translate(-50%, -50%);
        z-index: 2;
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .node:hover {
        z-index: 10;
        transform: translate(-50%, -50%) scale(1.15);
    }

    .node-body {
        width: 100%;
        height: 100%;
        background: #0f0c17;
        /* Hexagon-ish shape using clip-path for distinctiveness */
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        border: 2px solid var(--border-dim); /* Border simulation via bg layer */
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        transition: all 0.4s ease;
    }

    /* Outer Ring simulation */
    .node-body::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--border-dim);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        z-index: -1;
    }
    
    /* Inner Shape */
    .node-body::after {
        content: '';
        position: absolute;
        inset: 6px;
        background: #050308;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        z-index: 1;
        transition: background 0.3s;
    }

    .node-icon {
        width: 36px;
        height: 36px;
        fill: var(--text-muted);
        position: relative;
        z-index: 2;
        transition: all 0.4s ease;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }

    /* --- Node States & Categories --- */
    
    /* 1. Locked State */
    .node.locked .node-body::before { background: #1a1824; }
    .node.locked .node-body::after { background: #0a090e; }
    .node.locked .node-icon { fill: #3f3d56; opacity: 0.6; }

    /* 2. Available State (Pulse) */
    .node.available .node-body::before { background: var(--accent-lightning); }
    .node.available .node-body::after { background: rgba(0, 240, 255, 0.1); }
    .node.available .node-icon { fill: var(--accent-lightning); filter: drop-shadow(0 0 8px var(--accent-lightning)); }
    
    .node.available {
        animation: pulseNode 2.5s infinite;
    }

    /* 3. Unlocked States (Thematic Colors) */
    
    /* Lightning / Strength */
    .node.unlocked[data-type="lightning"] .node-body::before { background: var(--accent-lightning); box-shadow: 0 0 15px var(--accent-lightning); }
    .node.unlocked[data-type="lightning"] .node-body::after { background: rgba(0, 240, 255, 0.15); }
    .node.unlocked[data-type="lightning"] .node-icon { fill: #fff; filter: drop-shadow(0 0 10px var(--accent-lightning)); }
    .node.unlocked[data-type="lightning"] .node-body { filter: drop-shadow(0 0 10px var(--accent-lightning)); }

    /* Shield / Defense */
    .node.unlocked[data-type="shield"] .node-body::before { background: var(--accent-shield); }
    .node.unlocked[data-type="shield"] .node-body::after { background: rgba(112, 0, 255, 0.15); }
    .node.unlocked[data-type="shield"] .node-icon { fill: #fff; filter: drop-shadow(0 0 10px var(--accent-shield)); }
    .node.unlocked[data-type="shield"] .node-body { filter: drop-shadow(0 0 10px var(--accent-shield)); }

    /* Intellect / Magic */
    .node.unlocked[data-type="intellect"] .node-body::before { background: var(--accent-intellect); }
    .node.unlocked[data-type="intellect"] .node-body::after { background: rgba(217, 70, 239, 0.15); }
    .node.unlocked[data-type="intellect"] .node-icon { fill: #fff; filter: drop-shadow(0 0 10px var(--accent-intellect)); }
    .node.unlocked[data-type="intellect"] .node-body { filter: drop-shadow(0 0 10px var(--accent-intellect)); }

    /* Origin Node */
    .node.unlocked[data-type="origin"] .node-body::before { background: var(--accent-void); }
    .node.unlocked[data-type="origin"] .node-body::after { background: rgba(255, 255, 255, 0.1); }
    .node.unlocked[data-type="origin"] .node-icon { fill: var(--bg-deep); filter: drop-shadow(0 0 15px #fff); }

    /* Animations */
    @keyframes pulseNode {
        0% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -50%) scale(1.05); filter: brightness(1.2); }
        100% { transform: translate(-50%, -50%) scale(1); }
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        width: 340px;
        background: rgba(12, 10, 20, 0.95);
        border: 1px solid var(--border-bright);
        padding: 0;
        border-radius: 6px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        backdrop-filter: blur(15px);
        overflow: hidden;
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip-border {
        height: 3px;
        background: var(--border-dim);
        width: 100%;
        transition: background 0.3s;
    }
    
    .tooltip[data-theme="lightning"] .tooltip-border { background: var(--accent-lightning); box-shadow: 0 0 15px var(--accent-lightning); }
    .tooltip[data-theme="shield"] .tooltip-border { background: var(--accent-shield); box-shadow: 0 0 15px var(--accent-shield); }
    .tooltip[data-theme="intellect"] .tooltip-border { background: var(--accent-intellect); box-shadow: 0 0 15px var(--accent-intellect); }

    .tooltip-content {
        padding: 20px;
    }

    .tooltip-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 10px;
    }

    .tooltip-title {
        font-family: var(--font-header);
        color: var(--text-primary);
        font-size: 1.4rem;
        margin: 0;
        letter-spacing: 0.02em;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .tooltip-type {
        font-family: var(--font-ui);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-secondary);
        font-weight: 700;
        background: rgba(255,255,255,0.05);
        padding: 2px 6px;
        border-radius: 2px;
    }

    .tooltip-desc {
        font-family: var(--font-ui);
        font-size: 0.95rem;
        line-height: 1.6;
        color: #d1d5db;
        margin-bottom: 15px;
        font-weight: 400;
    }

    .tooltip-req {
        font-size: 0.8rem;
        color: #ef4444;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(239, 68, 68, 0.1);
        padding: 8px 12px;
        border-radius: 4px;
        margin-top: 10px;
        border: 1px solid rgba(239, 68, 68, 0.2);
    }
    
    .tooltip-req::before {
        content: '';
        display: inline-block;
        width: 6px; height: 6px;
        background: #ef4444;
        border-radius: 50%;
        box-shadow: 0 0 5px #ef4444;
    }

    .tooltip-req.met {
        color: var(--accent-lightning);
        background: rgba(0, 240, 255, 0.1);
        border-color: rgba(0, 240, 255, 0.2);
    }
    
    .tooltip-req.met::before {
        background: var(--accent-lightning);
        box-shadow: 0 0 5px var(--accent-lightning);
    }

</style>
</head>
<body>

    <!-- Background Texture Layer -->
    <div class="bg-layer"></div>

    <header>
        <div class="brand">
            <h1>Void Walker</h1>
            <span>Ascension Class</span>
        </div>
        <div class="char-summary">
            <div class="char-name">Kaelen Thorne</div>
            <div class="char-class">Duelist / Arcanist</div>
        </div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="stat-group">
                <div class="level-display">
                    <span class="lvl-num">42</span>
                    <span class="lvl-label">Level</span>
                </div>
                <div class="xp-container">
                    <div class="xp-bar-track">
                        <div class="xp-fill"></div>
                    </div>
                </div>
                <div class="xp-text">12,450 / 20,000 XP</div>
            </div>

            <div class="stat-group">
                <div class="section-title">Resources</div>
                <div class="points-container">
                    <div class="pts-info">
                        <span class="pts-label">Skill Points</span>
                        <span class="pts-val">3</span>
                    </div>
                    <!-- Simple visual icon for points -->
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-lightning); opacity: 0.8;">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2"></polygon>
                    </svg>
                </div>
            </div>

            <div class="stat-group">
                <div class="section-title">Attributes</div>
                <div class="attributes-grid">
                    <div class="attr-row">
                        <div class="attr-icon-box">
                            <svg class="attr-icon" viewBox="0 0 24 24"><path d="M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z"/></svg>
                        </div>
                        <div class="attr-details">
                            <div class="attr-header">
                                <span class="attr-name">Strength</span>
                                <span class="attr-val">14</span>
                            </div>
                            <div class="attr-bar-bg"><div class="attr-bar-fill" style="width: 30%; background: var(--accent-lightning)"></div></div>
                        </div>
                    </div>
                    <div class="attr-row">
                        <div class="attr-icon-box">
                            <svg class="attr-icon" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                        </div>
                        <div class="attr-details">
                            <div class="attr-header">
                                <span class="attr-name">Dexterity</span>
                                <span class="attr-val">28</span>
                            </div>
                            <div class="attr-bar-bg"><div class="attr-bar-fill" style="width: 60%; background: var(--accent-shield)"></div></div>
                        </div>
                    </div>
                    <div class="attr-row">
                        <div class="attr-icon-box">
                            <svg class="attr-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                        </div>
                        <div class="attr-details">
                            <div class="attr-header">
                                <span class="attr-name">Intelligence</span>
                                <span class="attr-val">35</span>
                            </div>
                            <div class="attr-bar-bg"><div class="attr-bar-fill" style="width: 85%; background: var(--accent-intellect)"></div></div>
                        </div>
                    </div>
                    <div class="attr-row">
                        <div class="attr-icon-box">
                            <svg class="attr-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        </div>
                        <div class="attr-details">
                            <div class="attr-header">
                                <span class="attr-name">Vitality</span>
                                <span class="attr-val">12</span>
                            </div>
                            <div class="attr-bar-bg"><div class="attr-bar-fill" style="width: 25%; background: #ef4444"></div></div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="canvas-container" id="canvasContainer">
            <div class="tree-viewport" id="treeViewport">
                <div class="tree-content" id="treeContent">
                    <svg class="connections" id="svgConnections"></svg>
                    <!-- Nodes injected here -->
                </div>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <div class="tooltip-border"></div>
        <div class="tooltip-content">
            <div class="tooltip-header">
                <h3 class="tooltip-title" id="tt-title">Skill Name</h3>
                <span class="tooltip-type" id="tt-type">Passive</span>
            </div>
            <p class="tooltip-desc" id="tt-desc">Description goes here.</p>
            <div class="tooltip-req" id="tt-req">Requires: Skill Name</div>
        </div>
    </div>

<script>
    // --- Data Model (Expanded Layout with Themes) ---
    // Types map to CSS classes: 'lightning', 'shield', 'intellect', 'origin'
    const skills = [
        // Root
        { id: 'root', x: 900, y: 150, name: "Void Spark", type: "Origin", theme: "origin", desc: "The source of your power. Increases global damage by 5%.", unlocked: true, req: null },
        
        // Branch 1: Lightning (Left) - Strength/Aggro
        { id: 'str1', x: 600, y: 300, name: "Titan's Grip", type: "Passive", theme: "lightning", desc: "Increases Strength by 4. Attacks deal 10% more damage.", unlocked: true, req: 'root' },
        { id: 'str2', x: 400, y: 450, name: "Heavy Strike", type: "Active", theme: "lightning", desc: "Slam weapon into ground dealing AoE lightning damage.", unlocked: true, req: 'str1' },
        { id: 'str3', x: 250, y: 650, name: "Unstoppable", type: "Passive", theme: "lightning", desc: "Cannot be knocked back by crowd control. +15% Stun Resist.", unlocked: false, req: 'str2' },
        { id: 'str4', x: 250, y: 850, name: "Blood Pact", type: "Passive", theme: "lightning", desc: "Heal for 5% of damage dealt. Life steal increased.", unlocked: false, req: 'str3' },
        { id: 'str5', x: 400, y: 1050, name: "Colossal Rage", type: "Ultimate", theme: "lightning", desc: "Double size and damage for 10s. Invulnerable during cast.", unlocked: false, req: 'str4' },

        // Branch 2: Intellect (Center) - Magic
        { id: 'int1', x: 900, y: 300, name: "Arcane Mind", type: "Passive", theme: "intellect", desc: "Increases Mana Regen by 10%. Spell cost reduced by 5%.", unlocked: true, req: 'root' },
        { id: 'int2', x: 750, y: 450, name: "Fireball", type: "Active", theme: "intellect", desc: "Launch a projectile of fire. Deals damage over time.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 1050, y: 450, name: "Frost Nova", type: "Active", theme: "intellect", desc: "Freeze enemies in radius. Slows movement by 40%.", unlocked: false, req: 'int1' },
        { id: 'int4', x: 900, y: 650, name: "Mana Shield", type: "Passive", theme: "intellect", desc: "Absorb damage with mana. Mana regen increased while active.", unlocked: false, req: 'int2' },
        { id: 'int5', x: 900, y: 850, name: "Void Rift", type: "Ultimate", theme: "intellect", desc: "Open a rift that pulls enemies in and deals massive void damage.", unlocked: false, req: 'int4' },

        // Branch 3: Shield (Right) - Defense/Utility
        { id: 'dex1', x: 1200, y: 300, name: "Swift Foot", type: "Passive", theme: "shield", desc: "Increases Movement Speed by 5%. Cooldowns reduced by 3%.", unlocked: true, req: 'root' },
        { id: 'dex2', x: 1400, y: 450, name: "Evasion", type: "Passive", theme: "shield", desc: "10% chance to dodge attacks. Dodge grants 2s immunity.", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 1550, y: 650, name: "Backstab", type: "Active", theme: "shield", desc: "Deals 300% damage from behind. Teleports behind target.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1400, y: 850, name: "Dual Wield", type: "Passive", theme: "shield", desc: "Unlock ability to hold two weapons. Attack speed +20%.", unlocked: false, req: 'dex2' },
        { id: 'dex5', x: 1550, y: 1050, name: "Shadow Step", type: "Ultimate", theme: "shield", desc: "Become invisible and untargetable for 5s. Next attack is crit.", unlocked: false, req: 'dex3' },

        // Cross connections
        { id: 'cross1', x: 600, y: 800, name: "Spellblade", type: "Hybrid", theme: "lightning", desc: "Melee attacks trigger random spells.", unlocked: false, req: 'str4' },
        { id: 'cross2', x: 1200, y: 800, name: "Arcane Trickster", type: "Hybrid", theme: "intellect", desc: "Casting spells increases dodge chance.", unlocked: false, req: 'dex4' },
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        origin: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z", 
        passive: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z", 
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z", 
        ultimate: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z", 
        hybrid: "M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" 
    };

    // --- DOM Elements ---
    const treeContent = document.getElementById('treeContent');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('canvasContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Center the content
        const offsetX = (cw - 1800) / 2;
        const offsetY = (ch - 1200) / 2;
        
        panX = offsetX;
        panY = offsetY;
        updateTransform();

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            
            // Determine classes
            let statusClass = skill.unlocked ? 'unlocked' : 'locked';
            node.className = `node ${statusClass}`;
            node.setAttribute('data-type', skill.theme); // For CSS theming
            
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Determine Icon
            let iconPath = icons.passive;
            if(skill.type === 'Origin') iconPath = icons.origin;
            else if(skill.type === 'Active') iconPath = icons.active;
            else if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            else if(skill.type === 'Hybrid') iconPath = icons.hybrid;

            node.innerHTML = `
                <div class="node-body">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            treeContent.appendChild(node);
        });

        drawLines();
    }

    function drawLines() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    // Logic: If child is unlocked, the line is active and inherits child color
                    if (skill.unlocked) {
                        line.classList.add('active');
                        // Set color based on child theme
                        if(skill.theme === 'lightning') line.style.stroke = 'var(--accent-lightning)';
                        else if(skill.theme === 'shield') line.style.stroke = 'var(--accent-shield)';
                        else if(skill.theme === 'intellect') line.style.stroke = 'var(--accent-intellect)';
                        else if(skill.theme === 'origin') line.style.stroke = '#fff';
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        // Set Tooltip Theme
        tooltip.setAttribute('data-theme', skill.theme);
        
        const reqSkill = skills.find(s => s.id === skill.req);
        
        if (skill.unlocked) {
            ttReq.style.display = 'none';
        } else {
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'flex';
            if(reqSkill && reqSkill.unlocked) {
                ttReq.classList.add('met');
            } else {
                ttReq.classList.remove('met');
            }
        }

        tooltip.classList.add('visible');
        moveTooltip(e.clientX, e.clientY);
        
        // Highlight available node
        const nodeEl = document.querySelector(`.node[data-id="${skill.id}"]`);
        if (!skill.unlocked && reqSkill && reqSkill.unlocked) {
            nodeEl.classList.add('available');
            nodeEl.classList.remove('locked'); // Switch visual state
        }
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function moveTooltip(x, y) {
        const ttWidth = 340;
        const ttHeight = 200;
        let finalX = x + 20;
        let finalY = y - 20;

        if (finalX + ttWidth > window.innerWidth) finalX = x - ttWidth - 20;
        if (finalY + ttHeight > window.innerHeight) finalY = y - ttHeight - 20;

        tooltip.style.left = `${finalX}px`;
        tooltip.style.top = `${finalY}px`;
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        if (skill.unlocked) return;

        const parent = skills.find(s => s.id === skill.req);
        if (parent && !parent.unlocked) return;

        // Mock point deduction
        skill.unlocked = true;
        
        const nodeEl = document.querySelector(`.node[data-id="${id}"]`);
        nodeEl.classList.add('unlocked');
        nodeEl.classList.remove('available', 'locked');
        
        drawLines();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('canvasContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0;
    let panY = 0;
    let scale = 1;

    function updateTransform() {
        treeContent.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2.5);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        updateTransform();
    });

    // Initialize
    init();

</script>
</body>
</html>
