<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascension - Skill Matrix</title>
<style>
    :root {
        /* Palette: Deep Void & Celestial Gold */
        --bg-deep: #05070a;
        --bg-panel: #0f131a;
        --bg-panel-trans: rgba(15, 19, 26, 0.95);
        
        --border-dim: #1f2937;
        --border-bright: #374151;
        
        --accent-gold: #fbbf24;
        --accent-gold-dim: #78350f;
        --accent-gold-glow: rgba(251, 191, 36, 0.4);
        --accent-blue: #38bdf8;
        --accent-red: #ef4444;
        
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #475569;

        /* Typography */
        --font-header: 'Georgia', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background Depth (Critique Fix 5) --- */
    /* A complex background to ground the nodes */
    .bg-layer {
        position: absolute;
        inset: 0;
        z-index: -1;
        background: 
            radial-gradient(circle at 50% 50%, rgba(20, 30, 50, 0.8) 0%, var(--bg-deep) 90%),
            linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    /* --- Header --- */
    header {
        height: 80px;
        background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 100%);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        z-index: 20;
        border-bottom: 1px solid var(--border-dim);
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .brand {
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .brand h1 {
        font-family: var(--font-header);
        font-size: 1.8rem;
        letter-spacing: 0.05em;
        margin: 0;
        color: var(--text-primary);
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .brand span {
        font-family: var(--font-ui);
        font-size: 0.8rem;
        color: var(--accent-gold);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-top: 4px;
    }

    .char-summary {
        display: flex;
        align-items: center;
        gap: 30px;
    }

    .char-name {
        font-family: var(--font-header);
        font-size: 1.4rem;
        color: var(--text-primary);
        border-right: 1px solid var(--border-bright);
        padding-right: 20px;
    }

    .char-class {
        font-family: var(--font-ui);
        font-size: 0.9rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 600;
    }

    /* --- Main Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        height: calc(100vh - 80px);
    }

    /* --- Sidebar (Enriched & Refined) --- */
    aside {
        width: 380px;
        background: var(--bg-panel-trans);
        border-right: 1px solid var(--border-dim);
        display: flex;
        flex-direction: column;
        padding: 40px;
        position: relative;
        z-index: 10;
        backdrop-filter: blur(10px);
        box-shadow: 5px 0 30px rgba(0,0,0,0.5);
    }

    /* Decorative Line */
    aside::after {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0;
        width: 1px;
        background: linear-gradient(180deg, var(--accent-gold), transparent 60%, var(--accent-gold));
        opacity: 0.3;
    }

    .stat-group {
        margin-bottom: 50px;
    }

    .section-title {
        font-family: var(--font-ui);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-muted);
        margin-bottom: 20px;
        display: block;
        border-bottom: 1px solid var(--border-dim);
        padding-bottom: 5px;
    }

    /* Level Block */
    .level-block {
        display: flex;
        align-items: flex-end;
        gap: 15px;
        margin-bottom: 15px;
    }

    .lvl-num {
        font-family: var(--font-header);
        font-size: 5rem;
        line-height: 0.8;
        color: var(--text-primary);
        text-shadow: 0 0 30px rgba(251, 191, 36, 0.15);
    }

    .lvl-title {
        font-family: var(--font-header);
        font-size: 1.2rem;
        color: var(--accent-gold);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 15px;
        padding-bottom: 0;
    }

    /* XP Bar */
    .xp-bar-container {
        width: 100%;
        height: 8px;
        background: rgba(0,0,0,0.5);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        border: 1px solid var(--border-dim);
    }

    .xp-fill {
        width: 68%;
        height: 100%;
        background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
        box-shadow: 0 0 15px var(--accent-gold-glow);
        position: relative;
    }
    
    /* Shimmer */
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(45deg, transparent 25%, rgba(255,255,255,0.3) 50%, transparent 75%);
        background-size: 200% 200%;
        animation: shimmer 3s infinite linear;
    }

    .xp-text {
        text-align: right;
        font-family: var(--font-ui);
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin-top: 8px;
        font-weight: 500;
    }

    /* Skill Points (High Contrast) */
    .points-card {
        background: linear-gradient(135deg, rgba(251, 191, 36, 0.05) 0%, rgba(0,0,0,0) 100%);
        border: 1px solid rgba(251, 191, 36, 0.3);
        padding: 25px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
    }

    .points-card:hover {
        background: rgba(251, 191, 36, 0.1);
        border-color: var(--accent-gold);
    }

    .pts-val {
        font-family: var(--font-header);
        font-size: 3rem;
        color: var(--accent-gold);
        line-height: 1;
    }

    .pts-text {
        font-family: var(--font-ui);
        font-size: 0.9rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-primary);
        text-align: right;
        line-height: 1.2;
        letter-spacing: 0.05em;
    }

    /* Attributes with Icons */
    .attributes-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .attr-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        border-radius: 4px;
        background: rgba(255,255,255,0.02);
        transition: background 0.2s;
    }

    .attr-row:hover {
        background: rgba(255,255,255,0.05);
    }

    .attr-left {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .attr-icon {
        width: 16px;
        height: 16px;
        fill: var(--text-secondary);
        opacity: 0.7;
    }

    .attr-name {
        color: var(--text-secondary);
        font-size: 0.95rem;
        font-weight: 500;
    }

    .attr-val {
        font-family: var(--font-header);
        font-weight: bold;
        color: var(--text-primary);
        font-size: 1.1rem;
    }

    /* --- Skill Tree Canvas --- */
    .canvas-container {
        flex: 1;
        position: relative;
        background: transparent;
        overflow: hidden;
        cursor: grab;
    }

    .canvas-container:active {
        cursor: grabbing;
    }

    .tree-viewport {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        transform-origin: 0 0;
    }

    .tree-content {
        position: absolute;
        /* Expanded Canvas to fill negative space */
        width: 1600px;
        height: 1400px;
    }

    /* SVG Connections */
    svg.connections {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 1;
        filter: drop-shadow(0 0 2px rgba(0,0,0,0.8));
    }

    .conn-line {
        stroke: var(--border-dim);
        stroke-width: 4;
        fill: none;
        transition: all 0.4s ease;
        stroke-linecap: round;
    }

    .conn-line.active {
        stroke: var(--accent-gold);
        stroke-width: 4;
        filter: drop-shadow(0 0 8px var(--accent-gold-glow));
    }

    /* Nodes */
    .node {
        position: absolute;
        width: 70px;
        height: 70px;
        transform: translate(-50%, -50%);
        z-index: 2;
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .node:hover {
        z-index: 10;
        transform: translate(-50%, -50%) scale(1.2);
    }

    .node-body {
        width: 100%;
        height: 100%;
        background: #111827;
        border-radius: 50%;
        border: 2px solid var(--border-dim);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        transition: all 0.3s;
    }

    /* Inner Hexagon shape via SVG mask logic or simple CSS clip-path could be used, 
       but keeping circles with inner rings for clean design */
    .node-body::after {
        content: '';
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.05);
    }

    .node-icon {
        width: 32px;
        height: 32px;
        fill: var(--text-muted);
        transition: all 0.3s;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* Node States */
    .node.unlocked .node-body {
        background: radial-gradient(circle at 30% 30%, #451a03, #0f172a);
        border-color: var(--accent-gold);
        box-shadow: 0 0 30px rgba(251, 191, 36, 0.2);
    }

    .node.unlocked .node-icon {
        fill: var(--accent-gold);
        filter: drop-shadow(0 0 5px rgba(251, 191, 36, 0.8));
    }

    .node.available {
        animation: pulse 3s infinite;
    }
    
    .node.available .node-body {
        border-color: var(--accent-blue);
        background: #1e293b;
    }
    
    .node.available .node-icon {
        fill: var(--accent-blue);
    }

    /* Tooltip */
    .tooltip {
        position: fixed;
        width: 320px;
        background: rgba(15, 23, 42, 0.98);
        border: 1px solid var(--border-bright);
        padding: 0;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        backdrop-filter: blur(12px);
        overflow: hidden;
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip-border {
        height: 2px;
        background: var(--border-dim);
        width: 100%;
    }
    
    .tooltip.unlocked .tooltip-border {
        background: var(--accent-gold);
        box-shadow: 0 0 10px var(--accent-gold);
    }

    .tooltip-content {
        padding: 20px;
    }

    .tooltip-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 12px;
    }

    .tooltip-title {
        font-family: var(--font-header);
        color: var(--text-primary);
        font-size: 1.3rem;
        margin: 0;
        letter-spacing: 0.02em;
    }

    .tooltip-type {
        font-family: var(--font-ui);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--accent-blue);
        font-weight: 700;
    }

    .tooltip-desc {
        font-family: var(--font-ui);
        font-size: 0.95rem;
        line-height: 1.6;
        color: #cbd5e1;
        margin-bottom: 15px;
        font-weight: 400;
    }

    .tooltip-req {
        font-size: 0.8rem;
        color: var(--accent-red);
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(239, 68, 68, 0.1);
        padding: 6px 10px;
        border-radius: 4px;
        margin-top: 10px;
    }
    
    .tooltip-req.locked::before {
        content: '';
        display: inline-block;
        width: 8px; height: 8px;
        background: var(--accent-red);
        border-radius: 50%;
        box-shadow: 0 0 5px var(--accent-red);
    }

    /* Animations */
    @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }

    @keyframes pulse {
        0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4); }
        50% { transform: translate(-50%, -50%) scale(1.05); box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
        100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }

</style>

    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('canvasContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Center the content
        const offsetX = (cw - 1600) / 2;
        const offsetY = (ch - 1400) / 2;
        
        panX = offsetX;
        panY = offsetY;
        updateTransform();

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Determine Icon
            let iconPath = icons.passive;
            if(skill.type === 'Origin') iconPath = icons.origin;
            else if(skill.type === 'Active') iconPath = icons.active;
            else if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            else if(skill.type === 'Hybrid') iconPath = icons.hybrid;

            node.innerHTML = `
                <div class="node-body">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            treeContent.appendChild(node);
        });

        drawLines();
    }

    function drawLines() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    // If both parent and child are unlocked, line is active
                    if (skill.unlocked && parent.unlocked) {
                        line.classList.add('active');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        const reqSkill = skills.find(s => s.id === skill.req);
        
        if (skill.unlocked) {
            ttReq.style.display = 'none';
            tooltip.classList.add('unlocked');
        } else {
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'flex';
            ttReq.classList.add('locked');
            tooltip.classList.remove('unlocked');
        }

        tooltip.classList.add('visible');
        moveTooltip(e.clientX, e.clientY);
        
        // Check availability to highlight node
        const nodeEl = document.querySelector(`.node[data-id="${skill.id}"]`);
        if (!skill.unlocked && reqSkill && reqSkill.unlocked) {
            nodeEl.classList.add('available');
        }
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
        // Clean up available class visual state if needed, 
        // but keeping it helps show the tree structure better
    }

    function moveTooltip(x, y) {
        const ttWidth = 320;
        const ttHeight = 200;
        let finalX = x + 20;
        let finalY = y - 20;

        if (finalX + ttWidth > window.innerWidth) finalX = x - ttWidth - 20;
        if (finalY + ttHeight > window.innerHeight) finalY = y - ttHeight - 20;

        tooltip.style.left = `${finalX}px`;
        tooltip.style.top = `${finalY}px`;
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        if (skill.unlocked) return;

        const parent = skills.find(s => s.id === skill.req);
        if (parent && !parent.unlocked) return;

        // Mock point deduction
        skill.unlocked = true;
        
        const nodeEl = document.querySelector(`.node[data-id="${id}"]`);
        nodeEl.classList.add('unlocked');
        nodeEl.classList.remove('available');
        
        drawLines();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('canvasContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0;
    let panY = 0;
    let scale = 1;

    function updateTransform() {
        treeContent.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2.5);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        updateTransform();
    });

    // Initialize
    init();

</script>
</body>
</html>
