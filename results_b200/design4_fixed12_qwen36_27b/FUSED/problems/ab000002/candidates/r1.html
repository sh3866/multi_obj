<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascension - Skill Matrix</title>
<style>
    :root {
        --bg-deep: #020406;
        --bg-panel: rgba(10, 15, 25, 0.95);
        --border-dim: rgba(60, 70, 90, 0.4);
        --border-bright: rgba(100, 120, 160, 0.6);
        
        --accent-gold: #fbbf24;
        --accent-gold-dim: #78350f;
        --accent-blue: #38bdf8;
        --accent-red: #ef4444;
        
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-dark: #475569;

        --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --font-header: 'Cinzel', 'Georgia', serif;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background Texture --- */
    body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: 
            linear-gradient(rgba(15, 23, 42, 0.3) 1px, transparent 1px),
            linear-gradient(90deg, rgba(15, 23, 42, 0.3) 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.2;
        z-index: -1;
    }
    
    body::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, transparent 0%, var(--bg-deep) 80%);
        z-index: -1;
        pointer-events: none;
    }

    /* --- Top Bar (Integrated) --- */
    header {
        height: 70px;
        background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        z-index: 20;
        border-bottom: 1px solid var(--border-dim);
    }

    .brand {
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .brand h1 {
        font-family: var(--font-header);
        font-size: 1.4rem;
        letter-spacing: 0.1em;
        margin: 0;
        color: var(--text-primary);
        text-transform: uppercase;
    }

    .brand span {
        font-size: 0.75rem;
        color: var(--accent-gold);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-top: 2px;
    }

    .char-summary {
        display: flex;
        align-items: center;
        gap: 20px;
        font-family: var(--font-header);
    }

    .char-name {
        font-size: 1.2rem;
        color: var(--text-primary);
        border-right: 2px solid var(--accent-gold);
        padding-right: 20px;
    }

    .char-class {
        font-family: var(--font-ui);
        font-size: 0.85rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    /* --- Main Layout (30/70) --- */
    .main-layout {
        display: flex;
        flex: 1;
        height: calc(100vh - 70px);
    }

    /* --- Sidebar (30%) --- */
    aside {
        width: 35%; /* Slightly more than 30 to give breathing room */
        background: var(--bg-panel);
        border-right: 1px solid var(--border-dim);
        display: flex;
        flex-direction: column;
        padding: 40px;
        position: relative;
        box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        z-index: 10;
    }

    /* Decorative sidebar line */
    aside::before {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0;
        width: 1px;
        background: linear-gradient(180deg, var(--accent-gold), transparent 50%, var(--accent-gold));
        opacity: 0.5;
    }

    .stat-group {
        margin-bottom: 40px;
    }

    .stat-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-secondary);
        margin-bottom: 10px;
        display: block;
    }

    /* Level & XP */
    .level-block {
        display: flex;
        align-items: flex-end;
        gap: 15px;
        margin-bottom: 15px;
    }

    .lvl-num {
        font-family: var(--font-header);
        font-size: 4.5rem;
        line-height: 0.8;
        color: var(--text-primary);
        text-shadow: 0 0 20px rgba(251, 191, 36, 0.2);
    }

    .lvl-title {
        font-size: 1rem;
        color: var(--accent-gold);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 10px;
    }

    .xp-bar-container {
        width: 100%;
        height: 6px;
        background: rgba(255,255,255,0.05);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
    }

    .xp-fill {
        width: 68%;
        height: 100%;
        background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
        box-shadow: 0 0 10px var(--accent-gold);
        position: relative;
    }
    
    /* Shimmer effect */
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(45deg, transparent 25%, rgba(255,255,255,0.4) 50%, transparent 75%);
        background-size: 200% 200%;
        animation: shimmer 3s infinite linear;
    }

    .xp-text {
        text-align: right;
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-top: 8px;
    }

    /* Skill Points */
    .points-card {
        background: rgba(251, 191, 36, 0.05);
        border: 1px solid rgba(251, 191, 36, 0.2);
        padding: 20px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 40px;
        transition: background 0.3s;
    }

    .points-card:hover {
        background: rgba(251, 191, 36, 0.1);
    }

    .pts-val {
        font-family: var(--font-header);
        font-size: 2.5rem;
        color: var(--accent-gold);
    }

    .pts-text {
        font-size: 0.8rem;
        text-transform: uppercase;
        color: var(--text-secondary);
        text-align: right;
        line-height: 1.2;
    }

    /* Attributes */
    .attributes-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 15px;
    }

    .attr-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-dim);
        padding-bottom: 5px;
    }

    .attr-name {
        color: var(--text-secondary);
        font-size: 0.9rem;
    }

    .attr-val {
        font-weight: bold;
        color: var(--text-primary);
    }

    /* --- Skill Tree Canvas (70%) --- */
    .canvas-container {
        width: 65%;
        position: relative;
        background: radial-gradient(circle at center, #111827 0%, #020406 100%);
        overflow: hidden;
        cursor: grab;
    }

    .canvas-container:active {
        cursor: grabbing;
    }

    .tree-viewport {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        transform-origin: 0 0;
    }

    .tree-content {
        position: absolute;
        /* Centered initially via JS */
        width: 1400px;
        height: 1200px;
        /* transform: translate(...) applied by JS */
    }

    /* SVG Connections */
    svg.connections {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 1;
    }

    .conn-line {
        stroke: var(--border-dim);
        stroke-width: 2;
        fill: none;
        transition: all 0.4s ease;
    }

    .conn-line.active {
        stroke: var(--accent-gold);
        stroke-width: 3;
        filter: drop-shadow(0 0 4px var(--accent-gold));
    }

    /* Nodes */
    .node {
        position: absolute;
        width: 64px;
        height: 64px;
        transform: translate(-50%, -50%);
        z-index: 2;
        cursor: pointer;
        transition: transform 0.2s ease;
    }

    .node:hover {
        z-index: 10;
        transform: translate(-50%, -50%) scale(1.15);
    }

    .node-ring {
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.1);
        transition: all 0.3s;
    }

    .node-body {
        width: 100%;
        height: 100%;
        background: #1e293b;
        border-radius: 50%;
        border: 2px solid var(--border-dim);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        transition: all 0.3s;
    }

    .node-icon {
        width: 28px;
        height: 28px;
        fill: var(--text-dark);
        transition: all 0.3s;
    }

    /* Node States */
    .node.unlocked .node-body {
        background: radial-gradient(circle at 30% 30%, #451a03, #0f172a);
        border-color: var(--accent-gold);
        box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
    }

    .node.unlocked .node-icon {
        fill: var(--accent-gold);
        filter: drop-shadow(0 0 2px rgba(251, 191, 36, 0.8));
    }

    .node.unlocked .node-ring {
        border-color: rgba(251, 191, 36, 0.3);
    }

    .node.available {
        animation: pulse 3s infinite;
    }
    
    .node.available .node-body {
        border-color: var(--border-bright);
        background: #253045;
    }
    
    .node.available .node-icon {
        fill: var(--text-secondary);
    }

    /* Tooltip */
    .tooltip {
        position: fixed;
        width: 300px;
        background: rgba(15, 23, 42, 0.98);
        border: 1px solid var(--accent-gold);
        padding: 20px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        backdrop-filter: blur(8px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        border-bottom: 1px solid var(--border-dim);
        padding-bottom: 10px;
    }

    .tooltip-title {
        font-family: var(--font-header);
        color: var(--accent-gold);
        font-size: 1.2rem;
        margin: 0;
    }

    .tooltip-type {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        background: rgba(255,255,255,0.1);
        padding: 2px 6px;
        border-radius: 2px;
        color: var(--text-secondary);
    }

    .tooltip-desc {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #cbd5e1;
        margin-bottom: 15px;
    }

    .tooltip-req {
        font-size: 0.75rem;
        color: var(--accent-red);
        display: flex;
        align-items: center;
        gap: 5px;
    }
    
    .tooltip-req.locked::before {
        content: '';
        display: inline-block;
        width: 6px; height: 6px;
        background: var(--accent-red);
        border-radius: 50%;
    }

    /* Animations */
    @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }

    @keyframes pulse {
        0% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -50%) scale(1.05); }
        100% { transform: translate(-50%, -50%) scale(1); }
    }

</style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>Archon's Ascension</h1>
            <span>Class: Void Walker</span>
        </div>
        <div class="char-summary">
            <div class="char-name">Kaelen Thorne</div>
            <div class="char-class">Duelist / Arcanist</div>
        </div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="stat-group">
                <div class="level-block">
                    <span class="lvl-num">42</span>
                    <span class="lvl-title">Level</span>
                </div>
                <div class="xp-bar-container">
                    <div class="xp-fill"></div>
                </div>
                <div class="xp-text">12,450 / 20,000 XP</div>
            </div>

            <div class="stat-group">
                <span class="stat-label">Resources</span>
                <div class="points-card">
                    <div class="pts-val">3</div>
                    <div class="pts-text">Available<br>Skill Points</div>
                </div>
            </div>

            <div class="stat-group">
                <span class="stat-label">Attributes</span>
                <div class="attributes-grid">
                    <div class="attr-row"><span class="attr-name">Strength</span><span class="attr-val">14</span></div>
                    <div class="attr-row"><span class="attr-name">Dexterity</span><span class="attr-val">28</span></div>
                    <div class="attr-row"><span class="attr-name">Intelligence</span><span class="attr-val">35</span></div>
                    <div class="attr-row"><span class="attr-name">Vitality</span><span class="attr-val">12</span></div>
                    <div class="attr-row"><span class="attr-name">Wisdom</span><span class="attr-val">18</span></div>
                </div>
            </div>
        </aside>

        <div class="canvas-container" id="canvasContainer">
            <div class="tree-viewport" id="treeViewport">
                <div class="tree-content" id="treeContent">
                    <svg class="connections" id="svgConnections"></svg>
                    <!-- Nodes injected here -->
                </div>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <div class="tooltip-header">
            <h3 class="tooltip-title" id="tt-title">Skill Name</h3>
            <span class="tooltip-type" id="tt-type">Passive</span>
        </div>
        <p class="tooltip-desc" id="tt-desc">Description goes here.</p>
        <div class="tooltip-req" id="tt-req">Requires: Skill Name</div>
    </div>

<script>
    // --- Data Model ---
    const skills = [
        { id: 'root', x: 700, y: 100, name: "Archon's Spark", type: "Origin", desc: "The source of your power. Increases global damage by 5%.", unlocked: true, req: null },
        
        // Branch 1: Strength
        { id: 'str1', x: 400, y: 250, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'str2', x: 250, y: 400, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str3', x: 100, y: 550, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back by crowd control.", unlocked: false, req: 'str2' },
        { id: 'str4', x: 250, y: 700, name: "Blood Pact", type: "Passive", desc: "Heal for 5% of damage dealt.", unlocked: false, req: 'str3' },

        // Branch 2: Intelligence
        { id: 'int1', x: 700, y: 250, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regen by 10%.", unlocked: true, req: 'root' },
        { id: 'int2', x: 550, y: 400, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 850, y: 400, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        { id: 'int4', x: 700, y: 550, name: "Mana Shield", type: "Passive", desc: "Absorb damage with mana.", unlocked: false, req: 'int2' },

        // Branch 3: Dexterity
        { id: 'dex1', x: 1000, y: 250, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: true, req: 'root' },
        { id: 'dex2', x: 1150, y: 400, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 1300, y: 550, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1150, y: 700, name: "Dual Wield", type: "Passive", desc: "Unlock ability to hold two weapons.", unlocked: false, req: 'dex2' },

        // Hybrid / Ultimate
        { id: 'ult1', x: 700, y: 850, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows to target location.", unlocked: false, req: 'int4' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        origin: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z", // Star
        passive: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z", // Shield/Head
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z", // Lightning
        ultimate: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" // Globe
    };

    // --- DOM Elements ---
    const treeContent = document.getElementById('treeContent');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('canvasContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Center the 1400x1200 content in the viewport
        const offsetX = (cw - 1400) / 2;
        const offsetY = (ch - 1200) / 2;
        
        treeContent.style.transform = `translate(${offsetX}px, ${offsetY}px)`;

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Determine Icon
            let iconPath = icons.passive;
            if(skill.type === 'Origin') iconPath = icons.origin;
            else if(skill.type === 'Active') iconPath = icons.active;
            else if(skill.type === 'Ultimate') iconPath = icons.ultimate;

            node.innerHTML = `
                <div class="node-ring"></div>
                <div class="node-body">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            treeContent.appendChild(node);
        });

        drawLines();
    }

    function drawLines() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    // If both parent and child are unlocked, line is active
                    if (skill.unlocked && parent.unlocked) {
                        line.classList.add('active');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        const reqSkill = skills.find(s => s.id === skill.req);
        
        if (skill.unlocked) {
            ttReq.style.display = 'none';
            tooltip.style.borderColor = 'var(--accent-gold)';
        } else {
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'flex';
            ttReq.classList.add('locked');
            tooltip.style.borderColor = 'var(--border-dim)';
        }

        tooltip.classList.add('visible');
        moveTooltip(e.clientX, e.clientY);
        
        // Also check availability to highlight node
        const nodeEl = document.querySelector(`.node[data-id="${skill.id}"]`);
        if (!skill.unlocked && reqSkill && reqSkill.unlocked) {
            nodeEl.classList.add('available');
        }
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
        document.querySelectorAll('.node.available').forEach(n => {
            // Only remove if the skill is actually locked (visual reset)
             const id = n.dataset.id;
             const s = skills.find(sk => sk.id === id);
             if(s.unlocked) return; 
             // We keep 'available' class for now as a hover effect, 
             // but usually we want to remove it on mouseleave to clean up
             n.classList.remove('available');
        });
    }

    function moveTooltip(x, y) {
        // Keep tooltip within screen bounds
        const ttWidth = 300;
        const ttHeight = 150;
        let finalX = x + 20;
        let finalY = y - 20;

        if (finalX + ttWidth > window.innerWidth) finalX = x - ttWidth - 20;
        if (finalY + ttHeight > window.innerHeight) finalY = y - ttHeight - 20;

        tooltip.style.left = `${finalX}px`;
        tooltip.style.top = `${finalY}px`;
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        // Logic: Can only unlock if not already unlocked, has points (mocked), and parent is unlocked
        if (skill.unlocked) return; // Already unlocked

        const parent = skills.find(s => s.id === skill.req);
        if (parent && !parent.unlocked) return; // Parent locked

        // Mock point deduction
        skill.unlocked = true;
        
        // Update visuals
        const nodeEl = document.querySelector(`.node[data-id="${id}"]`);
        nodeEl.classList.add('unlocked');
        nodeEl.classList.remove('available');
        
        drawLines(); // Redraw lines to light them up
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('canvasContainer');
    const viewport = document.getElementById('treeViewport');
    let isPanning = false;
    let startX, startY;
    let panX = (container.clientWidth - 1400) / 2;
    let panY = (container.clientHeight - 1200) / 2;
    let scale = 1;

    function updateTransform() {
        treeContent.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2.5);
        
        // Zoom towards mouse pointer logic
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        updateTransform();
    });

    // Initialize
    init();

</script>
</body>
</html>
