<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Walker - Skill Matrix</title>
<style>
    :root {
        /* Palette - Deep Void & Neon Cyberpunk */
        --bg-deep: #020104;
        --bg-panel: rgba(15, 12, 25, 0.85);
        
        /* Accents */
        --accent-cyan: #00f0ff;
        --accent-magenta: #ff0055;
        --accent-purple: #8b5cf6;
        --accent-gold: #ffd700;
        --accent-white: #ffffff;
        
        /* UI Colors */
        --text-main: #f0f0f5;
        --text-dim: #6e6b85;
        --border-glass: rgba(255, 255, 255, 0.08);
        --border-glow: rgba(0, 240, 255, 0.4);

        /* Typography */
        --font-stack: 'Segoe UI', system-ui, -apple-system, sans-serif;
        --font-display: 'Segoe UI', sans-serif; /* Fallback for distinct headers */
    }

    * { box-sizing: border-box; user-select: none; outline: none; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background Atmosphere (Critique #4: Depth & Texture) --- */
    .bg-layer {
        position: absolute;
        inset: 0;
        z-index: -1;
        background: 
            /* Grid Pattern */
            linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            /* Radial Depth */
            radial-gradient(circle at 50% 50%, rgba(30, 20, 60, 0.6) 0%, rgba(2, 1, 4, 1) 80%);
        background-size: 40px 40px, 40px 40px, 100% 100%;
    }
    
    /* Noise Texture Overlay */
    .bg-layer::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        pointer-events: none;
        opacity: 0.4;
    }

    /* --- Header --- */
    header {
        height: 60px;
        background: rgba(2, 1, 4, 0.9);
        border-bottom: 1px solid var(--border-glass);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        z-index: 50;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .brand-logo {
        width: 28px;
        height: 28px;
        background: var(--accent-cyan);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        box-shadow: 0 0 12px var(--accent-cyan);
        position: relative;
    }
    
    .brand-logo::after {
        content: '';
        position: absolute;
        inset: 2px;
        background: #000;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }

    .brand h1 {
        font-family: var(--font-display);
        font-size: 1.1rem;
        letter-spacing: 0.2em;
        margin: 0;
        color: var(--text-main);
        text-transform: uppercase;
        font-weight: 800;
    }

    .char-identity {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }

    .char-name {
        font-size: 1rem;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    .char-class {
        font-size: 0.7rem;
        color: var(--accent-cyan);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-weight: 600;
        opacity: 0.8;
    }

    /* --- Main Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        height: calc(100vh - 60px);
        position: relative;
    }

    /* --- Sidebar (Critique #5: Refined Typography & Layout) --- */
    aside {
        width: 340px;
        background: var(--bg-panel);
        border-right: 1px solid var(--border-glass);
        display: flex;
        flex-direction: column;
        padding: 25px;
        z-index: 40;
        backdrop-filter: blur(12px);
        box-shadow: 5px 0 30px rgba(0,0,0,0.5);
        overflow-y: auto;
    }

    /* Decorative Tech Line */
    aside::after {
        content: '';
        position: absolute;
        top: 20px; right: 0; bottom: 20px;
        width: 1px;
        background: linear-gradient(180deg, transparent, var(--accent-cyan), transparent);
        opacity: 0.2;
        filter: blur(1px);
    }

    .stat-block {
        margin-bottom: 35px;
        position: relative;
    }
    .stat-block:last-child { margin-bottom: 0; }

    .section-label {
        font-family: var(--font-display);
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        color: var(--text-dim);
        margin-bottom: 15px;
        font-weight: 700;
        display: flex;
        align-items: center;
    }
    
    .section-label::before {
        content: '';
        display: inline-block;
        width: 8px;
        height: 2px;
        background: var(--accent-cyan);
        margin-right: 10px;
        box-shadow: 0 0 5px var(--accent-cyan);
    }

    /* Level Display */
    .level-group {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 15px;
    }

    .level-display {
        font-family: var(--font-display);
        font-size: 4.5rem;
        line-height: 0.8;
        font-weight: 900;
        color: var(--text-main);
        background: linear-gradient(180deg, #fff, #a0a0a0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
    }

    .level-label {
        font-size: 0.8rem;
        color: var(--text-dim);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    /* XP Bar (Thicker, Vibrant) */
    .xp-bar-container {
        width: 100%;
        height: 12px;
        background: rgba(0,0,0,0.4);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
        border: 1px solid rgba(255,255,255,0.05);
    }

    .xp-fill {
        width: 68%;
        height: 100%;
        background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
        box-shadow: 0 0 15px var(--accent-cyan);
        position: relative;
        border-radius: 3px;
    }
    
    /* Shine effect on bar */
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        transform: translateX(-100%);
        animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }

    .xp-text {
        text-align: right;
        font-size: 0.75rem;
        color: var(--text-dim);
        margin-top: 6px;
        font-family: monospace;
        letter-spacing: 0.05em;
    }

    /* Skill Points */
    .points-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(0, 240, 255, 0.05);
        border: 1px solid rgba(0, 240, 255, 0.3);
        padding: 15px 20px;
        border-radius: 6px;
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
    }

    .points-container:hover {
        background: rgba(0, 240, 255, 0.1);
        border-color: rgba(0, 240, 255, 0.6);
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
    }

    .pts-val {
        font-family: var(--font-display);
        font-size: 2.5rem;
        font-weight: 900;
        color: var(--accent-cyan);
        text-shadow: 0 0 15px var(--accent-cyan);
        line-height: 1;
    }

    /* Attributes */
    .attr-row {
        display: flex;
        align-items: center;
        margin-bottom: 18px;
        padding: 8px;
        border-radius: 4px;
        transition: background 0.2s;
    }
    
    .attr-row:hover {
        background: rgba(255,255,255,0.03);
    }

    .attr-icon {
        width: 20px;
        height: 20px;
        margin-right: 12px;
        color: var(--text-dim);
        fill: currentColor;
    }

    .attr-info {
        flex: 1;
    }

    .attr-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
    }

    .attr-name {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-main);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .attr-val {
        font-family: monospace;
        font-size: 0.9rem;
        color: var(--text-dim);
        font-weight: 700;
    }

    .attr-bar-bg {
        width: 100%;
        height: 8px; /* Thicker */
        background: rgba(0,0,0,0.3);
        border-radius: 4px;
        overflow: hidden;
    }

    .attr-bar-fill {
        height: 100%;
        border-radius: 4px;
        box-shadow: 0 0 8px currentColor;
        transition: width 1s ease;
    }

    /* --- Skill Tree Canvas --- */
    .canvas-container {
        flex: 1;
        position: relative;
        background: transparent;
        overflow: hidden;
        cursor: grab;
    }
    
    .canvas-container:active { cursor: grabbing; }

    .tree-viewport {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        transform-origin: 0 0;
        will-change: transform;
    }

    .tree-content {
        position: absolute;
        width: 1600px;
        height: 1200px;
        transform: translate(0, 0); 
    }

    /* --- SVG Connections (Critique #3: Glowing, Thick) --- */
    svg.connections {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 1;
    }

    /* Base line (inactive path) */
    .conn-line {
        stroke: #1a1824;
        stroke-width: 6;
        fill: none;
        stroke-linecap: round;
        transition: stroke 0.5s ease, filter 0.5s ease, stroke-width 0.3s;
    }

    /* Active line (unlocked path) */
    .conn-line.active {
        stroke-width: 8;
        filter: drop-shadow(0 0 5px currentColor);
    }
    
    /* Critique #3: Dashed for available/locked but connected */
    .conn-line.available {
        stroke: #2a253a;
        stroke-dasharray: 10, 5;
        stroke-width: 6;
    }

    /* --- Nodes (Critique #2: Presence, 3D, Icons) --- */
    .node {
        position: absolute;
        width: 110px;
        height: 110px;
        transform: translate(-50%, -50%);
        z-index: 2;
        cursor: pointer;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .node:hover {
        z-index: 10;
        transform: translate(-50%, -50%) scale(1.15);
    }

    /* Hexagon Construction (3D Effect) */
    .node-body {
        width: 100%;
        height: 100%;
        background: #050408;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        transition: all 0.3s ease;
    }

    /* Outer Glow/Border */
    .node-body::before {
        content: '';
        position: absolute;
        inset: -4px;
        background: #15121e;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        z-index: -1;
        transition: background 0.3s, filter 0.3s;
    }
    
    /* Inner Face */
    .node-body::after {
        content: '';
        position: absolute;
        inset: 6px;
        background: #0a0812;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        z-index: 1;
        transition: background 0.3s;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .node-icon {
        width: 44px;
        height: 44px;
        fill: var(--text-dim);
        position: relative;
        z-index: 2;
        transition: all 0.3s ease;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }

    /* --- Node States --- */
    
    /* 1. Locked (Dimmed but visible) */
    .node.locked .node-body::before { background: #110e18; }
    .node.locked .node-body::after { background: #050408; }
    .node.locked .node-icon { fill: #3f3d56; opacity: 0.6; }

    /* 2. Available (Pulse & Glow) */
    .node.available .node-body::before { 
        background: var(--accent-cyan); 
        filter: drop-shadow(0 0 10px var(--accent-cyan));
    }
    .node.available .node-body::after { background: rgba(0, 240, 255, 0.15); }
    .node.available .node-icon { fill: var(--accent-cyan); filter: drop-shadow(0 0 8px var(--accent-cyan)); }
    
    .node.available { animation: pulseNode 2.5s infinite ease-in-out; }

    /* 3. Unlocked - Thematic Colors */
    
    /* Lightning / Strength (Cyan) */
    .node.unlocked[data-type="lightning"] .node-body::before { background: var(--accent-cyan); filter: drop-shadow(0 0 15px var(--accent-cyan)); }
    .node.unlocked[data-type="lightning"] .node-body::after { background: rgba(0, 240, 255, 0.15); border: 1px solid rgba(255,255,255,0.1); }
    .node.unlocked[data-type="lightning"] .node-icon { fill: #fff; filter: drop-shadow(0 0 10px var(--accent-cyan)); }

    /* Shield / Defense (Purple) */
    .node.unlocked[data-type="shield"] .node-body::before { background: var(--accent-purple); filter: drop-shadow(0 0 15px var(--accent-purple)); }
    .node.unlocked[data-type="shield"] .node-body::after { background: rgba(139, 92, 246, 0.15); }
    .node.unlocked[data-type="shield"] .node-icon { fill: #fff; filter: drop-shadow(0 0 10px var(--accent-purple)); }

    /* Intellect / Magic (Magenta) */
    .node.unlocked[data-type="intellect"] .node-body::before { background: var(--accent-magenta); filter: drop-shadow(0 0 15px var(--accent-magenta)); }
    .node.unlocked[data-type="intellect"] .node-body::after { background: rgba(255, 0, 85, 0.15); }
    .node.unlocked[data-type="intellect"] .node-icon { fill: #fff; filter: drop-shadow(0 0 10px var(--accent-magenta)); }

    /* Origin (White) */
    .node.unlocked[data-type="origin"] .node-body::before { background: var(--accent-white); filter: drop-shadow(0 0 20px rgba(255,255,255,0.8)); }
    .node.unlocked[data-type="origin"] .node-body::after { background: rgba(255, 255, 255, 0.2); }
    .node.unlocked[data-type="origin"] .node-icon { fill: #000; filter: drop-shadow(0 0 5px #fff); }

    /* Animations */
    @keyframes pulseNode {
        0% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
        50% { transform: translate(-50%, -50%) scale(1.05); filter: brightness(1.2); }
        100% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        width: 340px;
        background: rgba(10, 8, 18, 0.95);
        border: 1px solid var(--border-glass);
        padding: 0;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        overflow: hidden;
    }

    .tooltip.visible { opacity: 1; transform: translateY(0); }

    .tooltip-border { height: 3px; width: 100%; background: var(--border-glass); }
    .tooltip[data-theme="lightning"] .tooltip-border { background: var(--accent-cyan); box-shadow: 0 0 15px var(--accent-cyan); }
    .tooltip[data-theme="shield"] .tooltip-border { background: var(--accent-purple); box-shadow: 0 0 15px var(--accent-purple); }
    .tooltip[data-theme="intellect"] .tooltip-border { background: var(--accent-magenta); box-shadow: 0 0 15px var(--accent-magenta); }

    .tooltip-content { padding: 20px; }

    .tooltip-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }

    .tooltip-title {
        font-family: var(--font-display);
        color: var(--text-main);
        font-size: 1.3rem;
        margin: 0;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .tooltip-type {
        font-family: var(--font-display);
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-dim);
        font-weight: 700;
        border: 1px solid var(--border-glass);
        padding: 3px 8px;
        border-radius: 2px;
        background: rgba(0,0,0,0.3);
    }

    .tooltip-desc {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #d1d5db;
        margin-bottom: 15px;
        font-weight: 400;
    }

    .tooltip-req {
        font-size: 0.75rem;
        color: #ef4444;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(239, 68, 68, 0.1);
        padding: 8px 12px;
        border-radius: 4px;
        border: 1px solid rgba(239, 68, 68, 0.2);
        font-weight: 600;
    }
    
    .tooltip-req.met {
        color: var(--accent-cyan);
        background: rgba(0, 240, 255, 0.1);
        border-color: rgba(0, 240, 255, 0.2);
    }

</style>
</head>
<body>

    <!-- Background -->
    <div class="bg-layer"></div>

    <header>
        <div class="brand">
            <div class="brand-logo"></div>
            <h1>Void Walker</h1>
        </div>
        <div class="char-identity">
            <span class="char-name">Kaelen Thorne</span>
            <span class="char-class">Duelist / Arcanist</span>
        </div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="stat-block">
                <div class="section-label">Character Progress</div>
                <div class="level-group">
                    <div>
                        <div class="level-display">42</div>
                        <div class="level-label">Level</div>
                    </div>
                </div>
                <div class="xp-bar-container">
                    <div class="xp-fill"></div>
                </div>
                <div class="xp-text">12,450 / 20,000 XP</div>
            </div>

            <div class="stat-block">
                <div class="section-label">Resources</div>
                <div class="points-container">
                    <div>
                        <div style="font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; letter-spacing: 0.1em;">Skill Points</div>
                    </div>
                    <div class="pts-val">3</div>
                </div>
            </div>

            <div class="stat-block">
                <div class="section-label">Attributes</div>
                
                <div class="attr-row">
                    <svg class="attr-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z"/></svg>
                    <div class="attr-info">
                        <div class="attr-header">
                            <span class="attr-name">Strength</span>
                            <span class="attr-val">14</span>
                        </div>
                        <div class="attr-bar-bg"><div class="attr-bar-fill" style="width: 30%; background: var(--accent-cyan); color: var(--accent-cyan)"></div></div>
                    </div>
                </div>

                <div class="attr-row">
                    <svg class="attr-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                    <div class="attr-info">
                        <div class="attr-header">
                            <span class="attr-name">Dexterity</span>
                            <span class="attr-val">28</span>
                        </div>
                        <div class="attr-bar-bg"><div class="attr-bar-fill" style="width: 60%; background: var(--accent-purple); color: var(--accent-purple)"></div></div>
                    </div>
                </div>

                <div class="attr-row">
                    <svg class="attr-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                    <div class="attr-info">
                        <div class="attr-header">
                            <span class="attr-name">Intelligence</span>
                            <span class="attr-val">35</span>
                        </div>
                        <div class="attr-bar-bg"><div class="attr-bar-fill" style="width: 85%; background: var(--accent-magenta); color: var(--accent-magenta)"></div></div>
                    </div>
                </div>

                <div class="attr-row">
                    <svg class="attr-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <div class="attr-info">
                        <div class="attr-header">
                            <span class="attr-name">Vitality</span>
                            <span class="attr-val">12</span>
                        </div>
                        <div class="attr-bar-bg"><div class="attr-bar-fill" style="width: 25%; background: #ef4444; color: #ef4444"></div></div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="canvas-container" id="canvasContainer">
            <div class="tree-viewport" id="treeViewport">
                <div class="tree-content" id="treeContent">
                    <svg class="connections" id="svgConnections"></svg>
                    <!-- Nodes injected here -->
                </div>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <div class="tooltip-border"></div>
        <div class="tooltip-content">
            <div class="tooltip-header">
                <h3 class="tooltip-title" id="tt-title">Skill Name</h3>
                <span class="tooltip-type" id="tt-type">Passive</span>
            </div>
            <p class="tooltip-desc" id="tt-desc">Description goes here.</p>
            <div class="tooltip-req" id="tt-req">Requires: Skill Name</div>
        </div>
    </div>

<script>
    // --- Data Model (Densified & Structured) ---
    // Layout: Radial/Tree hybrid. Center is Origin.
    // Left: Lightning (Cyan)
    // Center: Intellect (Magenta)
    // Right: Shield/Dex (Purple)
    const skills = [
        // Root
        { id: 'root', x: 800, y: 200, name: "Void Spark", type: "Origin", theme: "origin", desc: "The source of your power. Increases global damage by 5%.", unlocked: true, req: null },
        
        // Branch 1: Lightning (Left)
        { id: 'str1', x: 500, y: 350, name: "Titan's Grip", type: "Passive", theme: "lightning", desc: "Increases Strength by 4. Attacks deal 10% more damage.", unlocked: true, req: 'root' },
        { id: 'str2', x: 350, y: 500, name: "Heavy Strike", type: "Active", theme: "lightning", desc: "Slam weapon into ground dealing AoE lightning damage.", unlocked: true, req: 'str1' },
        { id: 'str3', x: 200, y: 700, name: "Unstoppable", type: "Passive", theme: "lightning", desc: "Cannot be knocked back by crowd control. +15% Stun Resist.", unlocked: false, req: 'str2' },
        { id: 'str4', x: 200, y: 900, name: "Blood Pact", type: "Passive", theme: "lightning", desc: "Heal for 5% of damage dealt. Life steal increased.", unlocked: false, req: 'str3' },
        { id: 'str5', x: 350, y: 1100, name: "Colossal Rage", type: "Ultimate", theme: "lightning", desc: "Double size and damage for 10s. Invulnerable during cast.", unlocked: false, req: 'str4' },

        // Branch 2: Intellect (Center)
        { id: 'int1', x: 800, y: 350, name: "Arcane Mind", type: "Passive", theme: "intellect", desc: "Increases Mana Regen by 10%. Spell cost reduced by 5%.", unlocked: true, req: 'root' },
        { id: 'int2', x: 650, y: 500, name: "Fireball", type: "Active", theme: "intellect", desc: "Launch a projectile of fire. Deals damage over time.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 950, y: 500, name: "Frost Nova", type: "Active", theme: "intellect", desc: "Freeze enemies in radius. Slows movement by 40%.", unlocked: false, req: 'int1' },
        { id: 'int4', x: 800, y: 700, name: "Mana Shield", type: "Passive", theme: "intellect", desc: "Absorb damage with mana. Mana regen increased while active.", unlocked: false, req: 'int2' },
        { id: 'int5', x: 800, y: 900, name: "Void Rift", type: "Ultimate", theme: "intellect", desc: "Open a rift that pulls enemies in and deals massive void damage.", unlocked: false, req: 'int4' },
        { id: 'int6', x: 800, y: 1100, name: "Singularity", type: "Ultimate", theme: "intellect", desc: "Create a black hole consuming all enemies.", unlocked: false, req: 'int5' },

        // Branch 3: Shield (Right)
        { id: 'dex1', x: 1100, y: 350, name: "Swift Foot", type: "Passive", theme: "shield", desc: "Increases Movement Speed by 5%. Cooldowns reduced by 3%.", unlocked: true, req: 'root' },
        { id: 'dex2', x: 1250, y: 500, name: "Evasion", type: "Passive", theme: "shield", desc: "10% chance to dodge attacks. Dodge grants 2s immunity.", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 1400, y: 700, name: "Backstab", type: "Active", theme: "shield", desc: "Deals 300% damage from behind. Teleports behind target.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1250, y: 900, name: "Dual Wield", type: "Passive", theme: "shield", desc: "Unlock ability to hold two weapons. Attack speed +20%.", unlocked: false, req: 'dex2' },
        { id: 'dex5', x: 1400, y: 1100, name: "Shadow Step", type: "Ultimate", theme: "shield", desc: "Become invisible and untargetable for 5s. Next attack is crit.", unlocked: false, req: 'dex3' },

        // Cross connections (Densify)
        { id: 'cross1', x: 550, y: 850, name: "Spellblade", type: "Hybrid", theme: "lightning", desc: "Melee attacks trigger random spells.", unlocked: false, req: 'str4' },
        { id: 'cross2', x: 1050, y: 850, name: "Arcane Trickster", type: "Hybrid", theme: "shield", desc: "Casting spells increases dodge chance.", unlocked: false, req: 'dex4' },
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        origin: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z", 
        passive: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z", 
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z", 
        ultimate: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z", 
        hybrid: "M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" 
    };

    // --- DOM Elements ---
    const treeContent = document.getElementById('treeContent');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('canvasContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Center the content
        const offsetX = (cw - 1600) / 2;
        const offsetY = (ch - 1200) / 2;
        
        panX = offsetX;
        panY = offsetY;
        updateTransform();

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            
            let statusClass = skill.unlocked ? 'unlocked' : 'locked';
            node.className = `node ${statusClass}`;
            node.setAttribute('data-type', skill.theme);
            
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            let iconPath = icons.passive;
            if(skill.type === 'Origin') iconPath = icons.origin;
            else if(skill.type === 'Active') iconPath = icons.active;
            else if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            else if(skill.type === 'Hybrid') iconPath = icons.hybrid;

            node.innerHTML = `
                <div class="node-body">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            treeContent.appendChild(node);
        });

        drawLines();
    }

    function drawLines() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                        if(skill.theme === 'lightning') line.style.stroke = 'var(--accent-cyan)';
                        else if(skill.theme === 'shield') line.style.stroke = 'var(--accent-purple)';
                        else if(skill.theme === 'intellect') line.style.stroke = 'var(--accent-magenta)';
                        else if(skill.theme === 'origin') line.style.stroke = '#fff';
                    } else {
                        // Check if available (parent is unlocked)
                        if (parent.unlocked) {
                            line.classList.add('available');
                        }
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        tooltip.setAttribute('data-theme', skill.theme);
        
        const reqSkill = skills.find(s => s.id === skill.req);
        
        if (skill.unlocked) {
            ttReq.style.display = 'none';
        } else {
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'flex';
            if(reqSkill && reqSkill.unlocked) {
                ttReq.classList.add('met');
            } else {
                ttReq.classList.remove('met');
            }
        }

        tooltip.classList.add('visible');
        moveTooltip(e.clientX, e.clientY);
        
        const nodeEl = document.querySelector(`.node[data-id="${skill.id}"]`);
        if (!skill.unlocked && reqSkill && reqSkill.unlocked) {
            nodeEl.classList.add('available');
            nodeEl.classList.remove('locked');
        }
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function moveTooltip(x, y) {
        const ttWidth = 340;
        const ttHeight = 220;
        let finalX = x + 20;
        let finalY = y - 20;

        if (finalX + ttWidth > window.innerWidth) finalX = x - ttWidth - 20;
        if (finalY + ttHeight > window.innerHeight) finalY = y - ttHeight - 20;

        tooltip.style.left = `${finalX}px`;
        tooltip.style.top = `${finalY}px`;
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        if (skill.unlocked) return;

        const parent = skills.find(s => s.id === skill.req);
        if (parent && !parent.unlocked) return;

        // Check points (Mock logic)
        // In a real app, check available points > 0
        
        skill.unlocked = true;
        
        const nodeEl = document.querySelector(`.node[data-id="${id}"]`);
        nodeEl.classList.add('unlocked');
        nodeEl.classList.remove('available', 'locked');
        
        drawLines();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('canvasContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0;
    let panY = 0;
    let scale = 1;

    function updateTransform() {
        treeContent.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2.5);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        updateTransform();
    });

    // Initialize
    init();

</script>
</body>
</html>
