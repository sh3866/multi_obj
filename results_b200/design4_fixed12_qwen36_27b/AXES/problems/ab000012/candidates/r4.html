<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether - Spirit Summoning</title>
<style>
    /* 
     * DESIGN REVISION:
     * 1. Layout: Footer-style navigation, Header currency alignment, Centered Summon Interface.
     * 2. Visuals: Artifact aesthetics, Metallic Gold Typography, Teal Accents.
     * 3. Texture: Noise overlay, Particle system.
     */

    :root {
        --bg-deep: #05020a;
        --gold-primary: #d4af37;
        --gold-highlight: #fff4cc;
        --gold-shadow: #5c4812;
        --teal-primary: #00f2ff;
        --teal-shadow: #005f6b;
        --spirit-core: #b08dff;
        --spirit-glow: #6b21a8;
        --text-main: #e0e0e0;
        
        /* System Fonts mimicking Trajan/Cinzel (Heading) and Montserrat (Body) */
        --font-heading: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        /* Deep Void Gradient */
        background: radial-gradient(circle at 50% 30%, #180f29 0%, #090510 60%, #000000 100%);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between; /* Pushes header top, footer bottom */
    }

    /* --- Texture Overlay --- */
    .noise-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.07'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 1;
        opacity: 0.6;
    }

    /* --- Canvas Background --- */
    #canvas-bg {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 0;
        pointer-events: none;
    }

    /* --- 1. Header & Currency --- */
    header {
        position: relative;
        z-index: 10;
        width: 100%;
        padding: 2rem 3rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .title-group {
        display: flex;
        flex-direction: column;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 3.5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        line-height: 1;
        /* Metallic Gold Gradient */
        background: linear-gradient(to bottom, #fffdf5 0%, var(--gold-primary) 50%, var(--gold-shadow) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 10px rgba(180, 140, 60, 0.4));
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.75rem;
        color: var(--gold-primary);
        letter-spacing: 0.4em;
        text-transform: uppercase;
        opacity: 0.8;
        margin-top: 5px;
    }

    .currency-pill {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0.5rem 1.5rem;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--gold-shadow);
        border-radius: 4px;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
        position: relative;
        /* Decorative corners */
    }
    
    .currency-pill::before, .currency-pill::after {
        content: ''; position: absolute; width: 6px; height: 6px;
        border: 1px solid var(--gold-primary);
        transition: all 0.3s ease;
    }
    .currency-pill::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .currency-pill::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

    .currency-pill svg {
        fill: var(--gold-primary);
        width: 20px; height: 20px;
        filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.6));
    }

    .currency-text {
        font-family: var(--font-body);
        color: var(--gold-highlight);
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 0.05em;
    }

    /* --- 2. Hero: Summoning Interface --- */
    .hero-zone {
        position: relative;
        z-index: 10;
        flex-grow: 1;
        display: flex;
        flex-direction: column; /* Vertical stack */
        align-items: center;
        justify-content: center;
        gap: 32px; /* Tight grouping */
    }

    /* Orb Container */
    .orb-container {
        width: 280px;
        height: 280px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: floatOrb 6s ease-in-out infinite;
    }

    .spirit-core {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff 0%, var(--spirit-core) 40%, #2e0249 90%);
        box-shadow: 
            0 0 40px var(--spirit-glow),
            0 0 80px rgba(176, 141, 255, 0.2),
            inset 0 0 20px rgba(255, 255, 255, 0.6);
        z-index: 2;
    }

    .spirit-core::after {
        content: '';
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 120%; height: 120%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 60%);
        opacity: 0.4;
        animation: pulseCore 3s infinite alternate;
    }

    .ritual-ring {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        box-shadow: 0 0 15px rgba(176, 141, 255, 0.1);
    }

    .ring-1 {
        width: 160px; height: 160px;
        border: 1px dashed var(--gold-primary);
        opacity: 0.7;
        animation: spinSlow 20s linear infinite;
    }

    .ring-2 {
        width: 240px; height: 240px;
        border: 1px dotted rgba(176, 141, 255, 0.4);
        animation: spinReverse 30s linear infinite;
    }

    /* --- 3. The 'Summon' Artifact Button --- */
    .summon-btn {
        width: 280px; /* Matches Orb Container */
        height: 64px;
        background: linear-gradient(180deg, #1a150a 0%, #050402 100%);
        border: 2px solid var(--gold-primary);
        position: relative;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        
        /* Artifact Styling */
        box-shadow: 
            inset 0 0 20px #000,
            inset 0 0 10px rgba(212, 175, 55, 0.2),
            0 0 20px rgba(212, 175, 55, 0.15);
        clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%, 0 25%);
    }

    .summon-btn:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 
            inset 0 0 25px rgba(212, 175, 55, 0.2),
            0 0 30px rgba(212, 175, 55, 0.4);
        border-color: var(--gold-highlight);
    }

    .summon-btn:active {
        transform: scale(0.98);
    }

    .summon-text {
        font-family: var(--font-body);
        font-size: 1rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        /* Metallic Text */
        background: linear-gradient(to bottom, #fffdf5 0%, var(--gold-primary) 60%, var(--gold-shadow) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* --- 4. Footer Navigation --- */
    footer {
        position: relative;
        z-index: 10;
        width: 100%;
        padding: 1.5rem 3rem 3rem 3rem;
        display: flex;
        justify-content: center;
    }

    .nav-row {
        display: flex;
        gap: 1.5rem;
        width: 100%;
        max-width: 900px;
    }

    .nav-card {
        flex: 1;
        padding: 1rem;
        background: linear-gradient(160deg, rgba(20, 20, 25, 0.6), rgba(10, 10, 15, 0.8));
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-top: 1px solid rgba(0, 242, 255, 0.2); /* Teal Accent */
        backdrop-filter: blur(5px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .nav-card:hover {
        background: rgba(20, 20, 30, 0.8);
        border-color: rgba(0, 242, 255, 0.5);
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 242, 255, 0.1);
    }

    .nav-card:hover .nav-icon {
        fill: var(--teal-primary);
        filter: drop-shadow(0 0 8px var(--teal-primary));
    }

    .nav-card:hover .nav-label {
        color: #fff;
        text-shadow: 0 0 8px rgba(0, 242, 255, 0.4);
    }

    .nav-icon {
        width: 28px;
        height: 28px;
        fill: #8b8b9e;
        transition: all 0.3s ease;
    }

    .nav-label {
        font-family: var(--font-body);
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: #8b8b9e;
        transition: all 0.3s ease;
    }

    /* --- Animations --- */
    @keyframes floatOrb {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
    }

    @keyframes pulseCore {
        0% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.9); }
        100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
    }

    @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        header { flex-direction: column; gap: 1rem; padding: 1.5rem; }
        .game-title { font-size: 2.5rem; }
        .orb-container { width: 220px; height: 220px; }
        .ring-1 { width: 120px; height: 120px; }
        .ring-2 { width: 190px; height: 190px; }
        .summon-btn { width: 220px; }
        
        footer { padding: 1rem; }
        .nav-row { gap: 0.8rem; }
        .nav-card { padding: 0.8rem 0.5rem; }
        .nav-label { font-size: 0.7rem; }
    }
</style>
</head>
<body>

    <!-- Texture & Background -->
    <div class="noise-overlay"></div>
    <canvas id="canvas-bg"></canvas>

    <!-- 1. Header -->
    <header>
        <div class="title-group">
            <h1 class="game-title">Aether</h1>
            <span class="game-subtitle">Spirit Summoning</span>
        </div>

        <div class="currency-pill">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
            </svg>
            <span class="currency-text">12,450</span>
        </div>
    </header>

    <!-- 2. Hero: Summoning Interface -->
    <div class="hero-zone">
        <div class="orb-container">
            <div class="spirit-core"></div>
            <div class="ritual-ring ring-1"></div>
            <div class="ritual-ring ring-2"></div>
        </div>

        <button class="summon-btn" onclick="interact('Summon')">
            <span class="summon-text">Summon Spirit</span>
        </button>
    </div>

    <!-- 3. Footer Navigation -->
    <footer>
        <div class="nav-row">
            
            <!-- Roster: Scroll Icon -->
            <div class="nav-card" onclick="interact('Roster')">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                </svg>
                <span class="nav-label">Roster</span>
            </div>

            <!-- Battle: Sword Icon -->
            <div class="nav-card" onclick="interact('Battle')">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M6 2l12 12-2 2-2-2-2 2 2 2-2 2-2-2-2 2-2-2-2 2-2-2 2-2-2-2 2-2z" opacity="0.3"/> <!-- Fallback -->
                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                </svg>
                <span class="nav-label">Battle</span>
            </div>

            <!-- Grind: Anvil Icon -->
            <div class="nav-card" onclick="interact('Grind')">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M20.5 6c-2.61.7-5.67 1-8.5 1s-5.89-.3-8.5-1L3 8c1.86.5 4 .83 6 1v13h2v-6h2v6h2V9c2-.17 4.14-.5 6-1l-.5-2zM12 6c1.93 0 3.83-.25 5.62-.76L12 1 6.38 5.24C8.17 5.75 10.07 6 12 6z"/>
                </svg>
                <span class="nav-label">Grind</span>
            </div>

        </div>
    </footer>

<script>
    // --- Particle System (Spirit Dust) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
            this.y = Math.random() * height; // Initial fill
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 20;
            this.vx = (Math.random() - 0.5) * 0.2;
            this.vy = -(Math.random() * 0.5 + 0.2);
            this.size = Math.random() * 2;
            this.alpha = Math.random() * 0.5;
            // Color palette: Gold, Violet, and a hint of Teal
            const r = Math.random();
            if (r > 0.7) this.color = '212, 175, 55'; // Gold
            else if (r > 0.3) this.color = '176, 141, 255'; // Violet
            else this.color = '0, 242, 255'; // Teal
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            // Drift
            this.vx += (Math.random() - 0.5) * 0.01;
            this.vx *= 0.98;

            if (this.y < -10 || this.alpha <= 0) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 10000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.96)';
        
        // Flash effect
        const flash = document.createElement('div');
        flash.style.position = 'absolute';
        flash.style.top = '0'; flash.style.left = '0';
        flash.style.width = '100%'; flash.style.height = '100%';
        flash.style.background = 'rgba(255,255,255,0.1)';
        flash.style.pointerEvents = 'none';
        flash.style.borderRadius = 'inherit';
        btn.appendChild(flash);
        
        setTimeout(() => {
            btn.style.transform = '';
            flash.remove();
        }, 150);
        
        console.log(`Navigating to: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
