<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether - Spirit Summoning</title>
<style>
    /* 
     * DESIGN REVISION NOTES:
     * 1. Layout: Z-Pattern (Title Top-Center, Hero Right, Nav Left).
     * 2. Atmosphere: Deep Void Purple/Blue radial gradient + Ember particles.
     * 3. Hero: Mystical artifact with glowing aura and dashed ritual borders.
     * 4. Cards: 'Ancient Tablets' style, gold borders, muted silver icons.
     * 5. Type: Serif (Trajan/Cinzel style) for Title, Sans-Serif tracked out for UI.
     */

    :root {
        --bg-deep: #05020a;
        --bg-panel: #0e0b14;
        --gold-primary: #c5a059;
        --gold-highlight: #fdf5e6;
        --gold-shadow: #6e5420;
        --silver-muted: #a8a8b5;
        --text-main: #e0e0e0;
        --text-muted: #7a7a8c;
        
        /* System Fonts mimicking Trajan/Cinzel */
        --font-heading: 'Trajan Pro', 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        /* Critique Point 2: Rich Void Purple/Blue Radial Gradient */
        background: radial-gradient(ellipse at 50% 0%, #1a1025 0%, #090510 60%, #000000 100%);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        position: relative;
    }

    /* --- Canvas Background --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
    }

    /* --- Main Layout Container --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        height: 100%;
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        /* Critique Point 1: Z-Pattern Layout Zones */
        /* Row 1: Header/Title. Row 2: Hero/Nav. */
        grid-template-rows: auto 1fr;
        grid-template-columns: 1fr;
        padding: 2rem;
    }

    /* --- Zone A: Top Center Header --- */
    header {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        margin-top: 2rem;
        z-index: 20;
    }

    /* Critique Point 5: Aggressive Serif + Metallic Gradient */
    .game-title {
        font-family: var(--font-heading);
        font-size: 4.5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        line-height: 1;
        background: linear-gradient(to bottom, #fffdf5 0%, var(--gold-primary) 50%, var(--gold-shadow) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        /* Subtle glow behind text */
        filter: drop-shadow(0 0 15px rgba(197, 160, 89, 0.2));
        margin-bottom: 0.5rem;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.9rem;
        color: var(--text-muted);
        letter-spacing: 0.4em;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(197, 160, 89, 0.3);
        padding-bottom: 6px;
    }

    /* --- Zone B & C: The Content Area --- */
    .content-area {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between; /* Pushes Hero Right, Nav Left */
        height: 100%;
        width: 100%;
        position: relative;
    }

    /* --- Zone C: Bottom-Left Navigation (Ancient Tablets) --- */
    .nav-zone {
        width: 45%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end; /* Align to bottom */
        padding-bottom: 3rem;
        gap: 1.5rem;
    }

    .currency-pill {
        margin-bottom: 1rem;
        background: linear-gradient(90deg, rgba(197, 160, 89, 0.1), transparent);
        border-left: 2px solid var(--gold-primary);
        padding: 0.5rem 1rem;
        display: flex;
        align-items: center;
        gap: 10px;
        width: fit-content;
    }

    .currency-pill svg {
        fill: var(--gold-primary);
        width: 18px;
        height: 18px;
    }

    .currency-text {
        font-family: var(--font-heading);
        color: var(--gold-highlight);
        font-size: 1.1rem;
        letter-spacing: 0.05em;
    }

    .menu-grid {
        display: grid;
        grid-template-columns: 1fr 1fr; /* Equal width columns */
        gap: 1rem;
        width: 100%;
    }

    .menu-card {
        /* Critique Point 4: Ancient Tablet Style */
        background: linear-gradient(160deg, rgba(20, 18, 25, 0.95), rgba(10, 8, 12, 0.98));
        border: 1px solid var(--gold-shadow);
        border-top: 1px solid var(--gold-primary);
        border-bottom: 1px solid var(--gold-shadow);
        border-radius: 4px;
        padding: 1.5rem;
        position: relative;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
    }

    /* Decorative corners for "Tablet" look */
    .menu-card::before, .menu-card::after {
        content: '';
        position: absolute;
        width: 6px;
        height: 6px;
        border: 1px solid var(--gold-primary);
        transition: all 0.3s ease;
    }
    .menu-card::before { top: 4px; left: 4px; border-right: none; border-bottom: none; }
    .menu-card::after { bottom: 4px; right: 4px; border-left: none; border-top: none; }

    .menu-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 15px rgba(197, 160, 89, 0.15);
        border-color: var(--gold-primary);
        background: linear-gradient(160deg, rgba(30, 25, 40, 0.95), rgba(15, 12, 18, 0.98));
    }

    .card-icon {
        width: 32px;
        height: 32px;
        /* Critique Point 4: Muted Silver/Pale Gold (No Cyan) */
        fill: var(--silver-muted);
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        transition: fill 0.3s ease;
    }

    .menu-card:hover .card-icon {
        fill: var(--gold-highlight);
    }

    .card-label {
        font-family: var(--font-body);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--text-muted);
        font-weight: 600;
    }

    .menu-card:hover .card-label {
        color: var(--gold-highlight);
    }

    /* Primary Button Styling */
    .menu-card.primary {
        border: 1px solid var(--gold-primary);
        background: linear-gradient(180deg, rgba(40, 35, 20, 0.9), rgba(20, 15, 5, 0.95));
        box-shadow: 0 0 20px rgba(197, 160, 89, 0.1);
    }
    .menu-card.primary .card-label {
        color: var(--gold-primary);
    }

    /* --- Zone B: Center-Right Hero Orb --- */
    .hero-zone {
        width: 50%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    /* Critique Point 3: Hero Element Upgrade */
    .orb-container {
        width: 320px;
        height: 320px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: floatOrb 6s ease-in-out infinite;
    }

    /* The Artifact Core */
    .orb-core {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff 0%, #a4c8e1 20%, #1c2e4a 60%, #05070a 100%);
        /* Layered Shadows for Depth */
        box-shadow: 
            0 0 30px rgba(164, 200, 225, 0.3),
            0 0 60px rgba(197, 160, 89, 0.2),
            inset 0 0 20px rgba(0,0,0,0.8);
        position: relative;
        z-index: 2;
    }

    /* Inner energy pulse */
    .orb-core::after {
        content: '';
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 40%;
        height: 40%;
        border-radius: 50%;
        background: #fff;
        filter: blur(8px);
        opacity: 0.6;
        animation: pulseCore 4s infinite alternate;
    }

    /* Rotating Ritual Circle (Dashed Border) */
    .ritual-ring {
        position: absolute;
        border-radius: 50%;
        border-style: dashed;
        border-color: rgba(197, 160, 89, 0.4);
        pointer-events: none;
    }

    .ring-1 {
        width: 240px; height: 240px;
        border-width: 1px;
        animation: spinSlow 20s linear infinite;
    }

    .ring-2 {
        width: 290px; height: 290px;
        border-width: 2px;
        border-color: rgba(164, 200, 225, 0.2);
        animation: spinReverse 30s linear infinite;
    }

    .ring-3 {
        width: 330px; height: 330px;
        border-width: 1px;
        border-style: dotted;
        border-color: rgba(197, 160, 89, 0.15);
        animation: spinSlow 40s linear infinite reverse;
    }

    /* --- Animations --- */
    @keyframes floatOrb {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
    }

    @keyframes pulseCore {
        0% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.9); }
        100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
    }

    @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }

    /* --- Responsive Design --- */
    @media (max-width: 900px) {
        .content-area {
            flex-direction: column-reverse; /* Nav on top, Orb below on mobile */
            justify-content: center;
            gap: 3rem;
        }
        
        .nav-zone, .hero-zone {
            width: 100%;
            align-items: center;
            padding-bottom: 0;
        }

        .game-title { font-size: 3rem; }
        
        .orb-container {
            width: 250px; height: 250px;
        }
        .ring-1 { width: 180px; height: 180px; }
        .ring-2 { width: 220px; height: 220px; }
        .ring-3 { width: 250px; height: 250px; }
    }

</style>
</head>
<body>

    <!-- Background Canvas for Embers -->
    <canvas id="canvas-bg"></canvas>

    <div class="app-container">
        
        <!-- Zone A: Header (Top Center) -->
        <header>
            <h1 class="game-title">Aether</h1>
            <p class="game-subtitle">Spirit Summoning</p>
        </header>

        <!-- Main Content Area -->
        <div class="content-area">

            <!-- Zone C: Navigation (Left) -->
            <div class="nav-zone">
                
                <!-- Currency Indicator -->
                <div class="currency-pill">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                    </svg>
                    <span class="currency-text">12,450</span>
                </div>

                <!-- Menu Grid (Cards) -->
                <nav class="menu-grid">
                    
                    <!-- Summon (Primary) -->
                    <div class="menu-card primary" onclick="interact('Summon')">
                        <svg class="card-icon" viewBox="0 0 24 24">
                            <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                        </svg>
                        <span class="card-label">Summon</span>
                    </div>

                    <!-- Roster -->
                    <div class="menu-card" onclick="interact('Roster')">
                        <svg class="card-icon" viewBox="0 0 24 24">
                            <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                        </svg>
                        <span class="card-label">Roster</span>
                    </div>

                    <!-- Battle -->
                    <div class="menu-card" onclick="interact('Battle')">
                        <svg class="card-icon" viewBox="0 0 24 24">
                            <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
                        </svg>
                        <span class="card-label">Battle</span>
                    </div>

                    <!-- Grind -->
                    <div class="menu-card" onclick="interact('Grind')">
                        <svg class="card-icon" viewBox="0 0 24 24">
                            <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.35 0-.64.22-.7.55l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.06.33.35.55.7.55h4c.35 0 .64-.22.7-.55l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                        </svg>
                        <span class="card-label">Grind</span>
                    </div>

                </nav>
            </div>

            <!-- Zone B: Hero Visual Anchor (Right) -->
            <div class="hero-zone">
                <div class="orb-container">
                    <!-- CSS Constructed Artifact -->
                    <div class="orb-core"></div>
                    <div class="ritual-ring ring-1"></div>
                    <div class="ritual-ring ring-2"></div>
                    <div class="ritual-ring ring-3"></div>
                </div>
            </div>

        </div>
    </div>

<script>
    // --- Background Particle System (Embers/Dust) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
            // Start at random Y to fill screen immediately
            this.y = Math.random() * height; 
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 20;
            this.vx = (Math.random() - 0.5) * 0.2;
            this.vy = -(Math.random() * 0.5 + 0.1); // Slow upward drift
            this.size = Math.random() * 2;
            // Opacity based on size
            this.alpha = Math.random() * 0.5 + 0.1; 
            // Gold/Silver mix for embers
            this.color = Math.random() > 0.8 ? '212, 175, 55' : '200, 200, 220'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            // Subtle horizontal drift
            this.vx += (Math.random() - 0.5) * 0.01;
            // Dampen horizontal velocity
            this.vx *= 0.99;

            // Fade out near top
            if (this.y < height * 0.2) {
                this.alpha -= 0.002;
            }

            // Reset if off screen or invisible
            if (this.alpha <= 0 || this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
            
            // Add a tiny glow to larger particles
            if(this.size > 1.5) {
                ctx.shadowBlur = 5;
                ctx.shadowColor = `rgba(${this.color}, ${this.alpha})`;
            } else {
                ctx.shadowBlur = 0;
            }
        }
    }

    function initParticles() {
        particles = [];
        // Density calculation
        const count = Math.floor((width * height) / 15000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        
        // Button Press Effect
        btn.style.transform = 'scale(0.96)';
        btn.style.borderColor = '#fff';
        
        // Create flash
        const flash = document.createElement('div');
        flash.style.position = 'absolute';
        flash.style.top = '0'; flash.style.left = '0';
        flash.style.width = '100%'; flash.style.height = '100%';
        flash.style.background = 'rgba(255,255,255,0.2)';
        flash.style.pointerEvents = 'none';
        btn.appendChild(flash);
        
        setTimeout(() => {
            btn.style.transform = '';
            btn.style.borderColor = '';
            flash.remove();
        }, 200);
        
        console.log(`Navigating to: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
