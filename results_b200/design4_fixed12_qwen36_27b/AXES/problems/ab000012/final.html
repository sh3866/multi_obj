<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #05020a;
        --gold-primary: #d4af37;
        --gold-highlight: #fff4cc;
        --gold-shadow: #5c4812;
        --teal-primary: #00f2ff;
        --spirit-core: #b08dff;
        --spirit-glow: #6b21a8;
        --text-main: #e0e0e0;
        
        /* Using System Serifs to mimic Cinzel/Trajan for headings */
        --font-heading: 'Cinzel', 'Trajan Pro', 'Times New Roman', 'Palatino Linotype', serif;
        --font-body: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        /* Deep Void Gradient */
        background: radial-gradient(circle at 50% 30%, #180f29 0%, #090510 60%, #000000 100%);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* --- Texture Overlay (SVG Noise) --- */
    .noise-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 1;
        opacity: 0.8;
    }

    /* --- Canvas Background --- */
    #canvas-bg {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 0;
        pointer-events: none;
    }

    /* --- 1. Header & Currency --- */
    header {
        position: relative;
        z-index: 10;
        width: 100%;
        padding: 2rem 3rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .title-group {
        display: flex;
        flex-direction: column;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 3.5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        line-height: 1;
        /* Multi-stop Metallic Gold Gradient */
        background: linear-gradient(to bottom, #fffdf5 0%, var(--gold-primary) 40%, var(--gold-shadow) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 10px rgba(180, 140, 60, 0.4));
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.75rem;
        color: var(--gold-primary);
        letter-spacing: 0.4em;
        text-transform: uppercase;
        opacity: 0.8;
        margin-top: 5px;
    }

    /* CRITIQUE FIX: Floating Gold Currency (No heavy box) */
    .currency-pill {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0.2rem 0.5rem;
        /* No background border box, just floating elements */
        position: relative;
    }
    
    .currency-pill svg {
        fill: var(--gold-primary);
        width: 24px; 
        height: 24px;
        /* Soft glow instead of hard border */
        filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.6));
    }

    .currency-text {
        font-family: var(--font-heading); /* Use heading font for prestige */
        color: var(--gold-highlight);
        font-size: 1.3rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }

    /* --- 2. Hero: Summoning Station (Unified Vertical Axis) --- */
    .hero-zone {
        position: relative;
        z-index: 10;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* CRITIQUE FIX: Reduced gap to merge Orb and Button */
        gap: 16px; 
    }

    /* Orb Container */
    .orb-container {
        width: 260px;
        height: 260px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: floatOrb 6s ease-in-out infinite;
    }

    .spirit-core {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff 0%, var(--spirit-core) 40%, #2e0249 90%);
        box-shadow: 
            0 0 40px var(--spirit-glow),
            0 0 80px rgba(176, 141, 255, 0.2),
            inset 0 0 20px rgba(255, 255, 255, 0.6);
        z-index: 2;
        /* CRITIQUE FIX: Boiling Animation */
        animation: boilCore 3s infinite alternate;
    }

    .ritual-ring {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        box-shadow: 0 0 15px rgba(176, 141, 255, 0.1);
    }

    .ring-1 {
        width: 180px; height: 180px;
        border: 1px dashed var(--gold-primary);
        opacity: 0.7;
        animation: spinSlow 20s linear infinite;
    }

    .ring-2 {
        width: 250px; height: 250px;
        border: 1px dotted rgba(176, 141, 255, 0.4);
        animation: spinReverse 30s linear infinite;
    }

    /* --- The 'Summon' Artifact Button --- */
    .summon-btn {
        width: 320px; /* Slightly wider than orb for stability */
        height: 70px;
        background: linear-gradient(180deg, #1a150a 0%, #050402 100%);
        border: 2px solid var(--gold-primary);
        position: relative;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        
        /* Artifact Styling */
        box-shadow: 
            inset 0 0 20px #000,
            inset 0 0 10px rgba(212, 175, 55, 0.2),
            0 0 20px rgba(212, 175, 55, 0.15);
        /* Tapered shape */
        clip-path: polygon(5% 0, 95% 0, 100% 100%, 0% 100%);
    }

    .summon-btn:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 
            inset 0 0 25px rgba(212, 175, 55, 0.2),
            0 0 30px rgba(212, 175, 55, 0.4);
        border-color: var(--gold-highlight);
    }

    .summon-btn:active {
        transform: scale(0.98);
    }

    .summon-text {
        font-family: var(--font-heading);
        font-size: 1.1rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        /* Metallic Text */
        background: linear-gradient(to bottom, #fffdf5 0%, var(--gold-primary) 60%, var(--gold-shadow) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* --- 3. Footer Navigation: Rune Stones --- */
    footer {
        position: relative;
        z-index: 10;
        width: 100%;
        padding: 1.5rem 3rem 3rem 3rem;
        display: flex;
        justify-content: center;
    }

    .nav-row {
        display: flex;
        gap: 2rem; /* Tighter, centered row */
        width: 100%;
        justify-content: center;
        max-width: 800px;
    }

    /* CRITIQUE FIX: Rune Stone / Tarot Card Styling */
    .nav-card {
        /* Narrower than main button */
        width: 140px; 
        height: 200px;
        padding: 1.5rem 0.5rem;
        
        /* Stone Texture Gradient */
        background: linear-gradient(160deg, rgba(30, 30, 35, 0.9), rgba(15, 15, 20, 0.95));
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        
        /* Tapered Top Shape (Tombstone/Card) */
        clip-path: polygon(50% 0%, 100% 10%, 100% 100%, 0% 100%, 0% 10%);
        
        backdrop-filter: blur(4px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start; /* Align to top of card */
        padding-top: 2.5rem; /* Space for the cut top */
        gap: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    /* Stone Noise Texture overlay on cards */
    .nav-card::before {
        content: '';
        position: absolute;
        top:0; left:0; right:0; bottom:0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
        opacity: 0.5;
        pointer-events: none;
    }

    .nav-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 242, 255, 0.1);
        border-color: rgba(0, 242, 255, 0.4);
    }

    .nav-card:hover .nav-icon {
        fill: var(--teal-primary);
        filter: drop-shadow(0 0 10px var(--teal-primary));
        transform: scale(1.1);
    }

    .nav-card:hover .nav-label {
        color: #fff;
        text-shadow: 0 0 8px rgba(0, 242, 255, 0.6);
    }

    .nav-icon {
        width: 48px;
        height: 48px;
        fill: #8b8b9e;
        transition: all 0.3s ease;
        z-index: 2;
    }

    /* CRITIQUE FIX: Typography Refinement */
    .nav-label {
        font-family: var(--font-heading); /* Match Title Font */
        font-size: 1rem;
        font-weight: 600; /* Semi-Bold */
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #a0a0b0;
        transition: all 0.3s ease;
        z-index: 2;
    }

    /* --- Animations --- */
    @keyframes floatOrb {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
    }

    /* CRITIQUE FIX: Boiling Animation */
    @keyframes boilCore {
        0% { 
            transform: scale(1); 
            filter: brightness(1) blur(0px);
        }
        25% {
            transform: scale(1.02) translate(1px, -1px);
            filter: brightness(1.1) blur(1px);
        }
        50% {
            transform: scale(0.98) translate(-1px, 1px);
            filter: brightness(0.9) blur(0px);
        }
        75% {
            transform: scale(1.01) translate(1px, 1px);
            filter: brightness(1.05) blur(0.5px);
        }
        100% { 
            transform: scale(1) translate(0,0); 
            filter: brightness(1) blur(0px);
        }
    }

    @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        header { flex-direction: column; gap: 1rem; padding: 1.5rem; }
        .game-title { font-size: 2.5rem; }
        .orb-container { width: 220px; height: 220px; }
        .ring-1 { width: 140px; height: 140px; }
        .ring-2 { width: 200px; height: 200px; }
        .summon-btn { width: 260px; }
        
        footer { padding: 1rem; }
        .nav-row { gap: 1rem; transform: scale(0.9); }
    }
</style>
</head>
<body>

    <!-- Texture & Background -->
    <div class="noise-overlay"></div>
    <canvas id="canvas-bg"></canvas>

    <!-- 1. Header -->
    <header>
        <div class="title-group">
            <h1 class="game-title">Aether</h1>
            <span class="game-subtitle">Spirit Summoning</span>
        </div>

        <!-- CRITIQUE FIX: Floating Gold Currency -->
        <div class="currency-pill">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
            </svg>
            <span class="currency-text">12,450</span>
        </div>
    </header>

    <!-- 2. Hero: Summoning Station -->
    <div class="hero-zone">
        <div class="orb-container">
            <div class="spirit-core"></div>
            <div class="ritual-ring ring-1"></div>
            <div class="ritual-ring ring-2"></div>
        </div>

        <button class="summon-btn" onclick="interact('Summon')">
            <span class="summon-text">Summon Spirit</span>
        </button>
    </div>

    <!-- 3. Footer Navigation: Rune Stones -->
    <footer>
        <div class="nav-row">
            
            <!-- Roster: Scroll Icon -->
            <div class="nav-card" onclick="interact('Roster')">
                <!-- Custom Scroll SVG -->
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-7-2h2V7h-4v2h2z"/>
                </svg>
                <span class="nav-label">Roster</span>
            </div>

            <!-- Battle: Sword Icon -->
            <div class="nav-card" onclick="interact('Battle')">
                <!-- Custom Sword SVG -->
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                </svg>
                <span class="nav-label">Battle</span>
            </div>

            <!-- Grind: Anvil/Flask Icon -->
            <div class="nav-card" onclick="interact('Grind')">
                <!-- Custom Flask/Alchemy SVG -->
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M12 2c-1.1 0-2 .9-2 2v2h-1.5l-5 9c-.2.3-.2.7 0 1 .2.3.5.5.9.5h15.2c.4 0 .7-.2.9-.5.2-.3.2-.7 0-1l-5-9H14V4c0-1.1-.9-2-2-2zm-1 13h2v2h-2v-2zm0-4h2v2h-2v-2z"/>
                </svg>
                <span class="nav-label">Grind</span>
            </div>

        </div>
    </footer>

<script>
    // --- Particle System (Spirit Dust) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
            this.y = Math.random() * height;
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 20;
            this.vx = (Math.random() - 0.5) * 0.2;
            this.vy = -(Math.random() * 0.5 + 0.2);
            this.size = Math.random() * 2;
            this.alpha = Math.random() * 0.5;
            // Palette: Gold, Violet, White
            const r = Math.random();
            if (r > 0.8) this.color = '255, 255, 255'; // White Sparkle
            else if (r > 0.5) this.color = '212, 175, 55'; // Gold
            else this.color = '176, 141, 255'; // Violet
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            // Drift
            this.vx += (Math.random() - 0.5) * 0.01;
            this.vx *= 0.98;

            if (this.y < -10 || this.alpha <= 0) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 12000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.96)';
        
        // Flash effect
        const flash = document.createElement('div');
        flash.style.position = 'absolute';
        flash.style.top = '0'; flash.style.left = '0';
        flash.style.width = '100%'; flash.style.height = '100%';
        flash.style.background = 'rgba(255,255,255,0.1)';
        flash.style.pointerEvents = 'none';
        flash.style.borderRadius = 'inherit';
        btn.appendChild(flash);
        
        setTimeout(() => {
            btn.style.transform = '';
            flash.remove();
        }, 150);
        
        console.log(`Navigating to: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
