<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM EDITION</title>
    <style>
        /* 
           SYSTEM FONT STACK FOR PIXEL ART 
           Using 'Courier New' (monospace) as the base for offline pixel rendering.
           -webkit-font-smoothing: none ensures hard edges.
        */
        :root {
            --c-bg-top: #050014;
            --c-bg-bot: #1a0033;
            --c-grid: #7000ff; /* Deep Purple/Magenta */
            --c-grid-dim: #3a0088;
            --c-neon-pink: #ff00ff;
            --c-neon-cyan: #00ffff;
            --c-neon-orange: #ffaa00;
            --c-white: #ffffff;
            --c-black: #000000;
            
            --font-pixel: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none; 
            text-rendering: geometricPrecision;
        }

        body {
            background-color: var(--c-bg-top);
            color: var(--c-white);
            font-family: var(--font-pixel);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* --- BACKGROUND CANVAS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            /* Slight pixelation effect on the canvas itself */
            image-rendering: pixelated; 
        }

        /* --- CRT / VHS OVERLAY --- */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 20;
            pointer-events: none;
            /* Scanlines */
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.4) 50%
            ), linear-gradient(
                90deg, 
                rgba(255, 0, 0, 0.06), 
                rgba(0, 255, 0, 0.02), 
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 6px 100%;
            box-shadow: inset 0 0 120px rgba(0,0,0,0.8); /* Vignette */
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            5% { opacity: 0.90; }
            10% { opacity: 0.95; }
            15% { opacity: 0.90; }
            100% { opacity: 0.95; }
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Start from top */
            padding-top: 5vh;
        }

        /* --- TITLE BLOCK --- */
        .title-block {
            text-align: center;
            margin-bottom: 10px; /* Tight spacing */
            position: relative;
            z-index: 10;
            /* Pixelated shadow effect */
            filter: drop-shadow(4px 4px 0px var(--c-black));
        }

        h1 {
            font-size: 5rem;
            line-height: 0.9;
            color: var(--c-white);
            text-transform: uppercase;
            letter-spacing: -2px;
            margin: 0;
            /* Hard blocky shadow */
            text-shadow: 
                4px 4px 0px var(--c-black), 
                -2px -2px 0px var(--c-black), 
                6px 6px 0px var(--c-neon-pink);
            /* Animation for "breathing" title */
            animation: floatTitle 3s ease-in-out infinite;
        }

        .subtitle {
            font-size: 1.4rem; /* Increased size */
            color: var(--c-neon-cyan);
            letter-spacing: 6px;
            margin-top: 10px;
            font-weight: bold;
            text-shadow: 0 0 10px var(--c-neon-cyan), 2px 2px 0px var(--c-black);
            opacity: 1;
        }

        @keyframes floatTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* --- HIGHWAY SCENE (The Bridge) --- */
        .highway-scene {
            width: 100%;
            height: 35vh; /* Takes up significant vertical space */
            perspective: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 0; /* Connects directly to buttons */
        }

        /* The 3D Road */
        .highway-plane {
            position: relative;
            width: 500px;
            height: 100%;
            transform-style: preserve-3d;
            /* Rotate to create floor perspective */
            transform: rotateX(60deg); 
            /* Center the bottom of the road at the horizon line roughly */
            transform-origin: center 100%;
        }

        /* The Track Container */
        .track-surface {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 600px; /* Long enough to go back */
            background: rgba(0, 0, 0, 0.85);
            /* Desaturated grid lines */
            border-left: 2px solid var(--c-grid-dim);
            border-right: 2px solid var(--c-grid-dim);
            box-shadow: 0 0 30px var(--c-neon-pink);
            overflow: hidden;
            /* Gradient fade at top (horizon) */
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 30%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 30%);
        }

        /* Grid lines on the track */
        .track-surface::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(90deg, transparent 24%, var(--c-grid-dim) 25%, transparent 26%, transparent 49%, var(--c-grid-dim) 50%, transparent 52%, transparent 74%, var(--c-grid-dim) 75%, transparent 76%),
                linear-gradient(0deg, transparent 95%, var(--c-grid-dim) 96%);
            background-size: 100% 100%, 100% 50px;
            animation: trackScroll 0.8s linear infinite;
            opacity: 0.5;
        }

        /* The Hit Line (The Goal) */
        .hit-line-container {
            position: absolute;
            bottom: 40px; /* Close to player */
            left: 50%;
            transform: translateX(-50%);
            width: 320px; /* Slightly wider than track */
            height: 10px;
            z-index: 10;
        }

        .hit-line {
            width: 100%;
            height: 100%;
            background: var(--c-white);
            box-shadow: 0 0 15px var(--c-white), 0 0 30px var(--c-neon-cyan);
            /* Pixelated edges */
            border: 2px solid var(--c-black);
        }

        /* Notes */
        .note {
            position: absolute;
            width: 20%; /* Fits in lane */
            height: 20px;
            left: 10%; /* Center of lane approx */
            border: 2px solid var(--c-white);
            box-shadow: 0 0 8px currentColor;
            z-index: 5;
            image-rendering: pixelated;
        }

        @keyframes trackScroll {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 0 0, 0 50px; }
        }

        /* --- CONTROLS --- */
        .controls {
            position: absolute;
            bottom: 10vh; /* Anchored near bottom */
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 15;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            /* Make buttons look like they sit on the grid */
            filter: drop-shadow(0px 10px 0px rgba(0,0,0,0.5));
        }

        .btn {
            background: rgba(0,0,0,0.8);
            border: 4px solid;
            color: var(--c-white);
            font-family: var(--font-pixel);
            cursor: pointer;
            position: relative;
            text-transform: uppercase;
            transition: all 0.1s;
            padding: 15px 25px;
            outline: none;
            font-weight: bold;
            letter-spacing: 1px;
            /* Pixel corners effect via box shadow */
            box-shadow: 
                inset 4px 4px 0px rgba(255,255,255,0.2),
                inset -4px -4px 0px rgba(0,0,0,0.5);
        }

        /* START Button */
        .btn-start {
            font-size: 1.8rem;
            border-color: var(--c-neon-pink);
            color: var(--c-neon-pink);
            box-shadow: 4px 4px 0px var(--c-black), 0 0 20px var(--c-neon-pink);
            animation: pulseBtn 1.2s infinite alternate;
            width: 220px;
        }

        .btn-start:hover {
            background: var(--c-neon-pink);
            color: var(--c-black);
            transform: translateY(-4px);
            box-shadow: 4px 8px 0px var(--c-black), 0 0 40px var(--c-neon-pink);
        }

        .btn-start:active {
            transform: translateY(2px);
            box-shadow: 2px 2px 0px var(--c-black);
        }

        /* OPTIONS Button */
        .btn-options {
            font-size: 1.2rem;
            border-color: var(--c-neon-cyan);
            color: var(--c-neon-cyan);
            box-shadow: 4px 4px 0px var(--c-black);
            opacity: 0.9;
        }

        .btn-options:hover {
            background: var(--c-neon-cyan);
            color: var(--c-black);
            opacity: 1;
            transform: translateY(-4px);
            box-shadow: 4px 8px 0px var(--c-black), 0 0 20px var(--c-neon-cyan);
        }

        @keyframes pulseBtn {
            0% { text-shadow: 0 0 5px var(--c-neon-pink); }
            100% { text-shadow: 0 0 15px var(--c-neon-pink), 0 0 5px var(--c-white); }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .subtitle { font-size: 1rem; letter-spacing: 2px; }
            .highway-scene { height: 30vh; }
            .track-surface { width: 240px; }
            .hit-line-container { width: 260px; }
            .btn-start { font-size: 1.4rem; width: 180px; padding: 12px 15px; }
            .btn-options { font-size: 1rem; padding: 12px 15px; }
        }
    </style>
</head>
<body>

    <!-- Background Rendering (Sun, Stars, Grid) -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- CRT / Noise Overlay -->
    <div class="crt-overlay"></div>

    <div class="ui-layer">
        
        <!-- Title -->
        <div class="title-block">
            <h1>PIXEL<br>DANCE</h1>
            <div class="subtitle">RHYTHM EDITION</div>
        </div>

        <!-- 3D Highway Preview -->
        <div class="highway-scene">
            <div class="highway-plane">
                <div class="track-surface" id="track-surface">
                    <!-- Notes will be injected here via JS -->
                </div>
            </div>
            <!-- Hit Line sits at the bottom of the perspective plane -->
            <div class="hit-line-container">
                <div class="hit-line"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="btn-group">
                <button class="btn btn-start" onclick="startGame()">START</button>
                <button class="btn btn-options">OPTIONS</button>
            </div>
        </div>

    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Renders the Synthwave Background (Sun, Stars, Horizon Grid)
         */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let time = 0;

        // Colors
        const COL_SUN_TOP = '#ff00ff';
        const COL_SUN_BOT = '#ffaa00';
        const COL_GRID_HORIZON = '#7000ff'; // Purple horizon
        const COL_GRID_FLOOR = 'rgba(112, 0, 255, 0.3)'; // Desaturated magenta/purple

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawPixelSun(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            // Glow
            ctx.shadowBlur = 40;
            ctx.shadowColor = COL_SUN_TOP;

            const grad = ctx.createLinearGradient(0, -size, 0, size);
            grad.addColorStop(0, COL_SUN_TOP);
            grad.addColorStop(1, COL_SUN_BOT);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, size, 0, Math.PI * 2);
            ctx.fill();

            // "Thinner" Black Bars as per critique
            ctx.fillStyle = '#050014'; // Match BG
            ctx.shadowBlur = 0;
            
            // Draw stripes from bottom up
            // Reduced thickness logic
            for (let i = 0; i < 10; i++) {
                let yPos = (i * (size / 6)) - size + (size * 0.1); 
                let h = (i * 1.5) + 2; // Thinner bars
                
                // Ensure we don't draw above the top of the sun
                if (yPos > -size) {
                    ctx.fillRect(-size, yPos, size * 2, h);
                }
            }
            ctx.restore();
        }

        function drawGrid() {
            const horizonY = height * 0.45;
            const vanishX = width / 2;
            const speed = (time * 1.5) % 40; 

            ctx.lineWidth = 1; // Thinner lines for cleaner look
            ctx.strokeStyle = COL_GRID_FLOOR;

            ctx.beginPath();

            // Vertical Perspective Lines
            // Fan out from center
            for (let i = -15; i <= 15; i++) {
                let x1 = vanishX + (i * 2); // Tight at horizon
                let x2 = vanishX + (i * width * 0.15); // Wide at bottom
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
            }

            // Horizontal Moving Lines
            // Using simple perspective math: y = horizon + (1/z)
            for (let i = 0; i < 25; i++) {
                let z = i * 20 - speed;
                if (z <= 0) continue;
                
                // Exponential spacing
                let perspective = 1000 / z;
                let y = horizonY + (height * 0.8) * (1 - (1 / (z * 0.02 + 1)));

                if (y > horizonY && y < height) {
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                }
            }
            ctx.stroke();

            // Horizon Glow
            ctx.fillStyle = COL_GRID_HORIZON;
            ctx.fillRect(0, horizonY - 2, width, 4);
        }

        function drawStars() {
            ctx.fillStyle = '#ffffff';
            for(let i=0; i<50; i++) {
                // Deterministic pseudo-random positions
                const sx = (Math.sin(i * 132.1) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 54.3) * 0.5 + 0.5) * (height * 0.4);
                const size = (i % 3 === 0) ? 2 : 1;
                
                // Twinkle
                const alpha = Math.abs(Math.sin(time * 0.05 + i));
                ctx.globalAlpha = alpha;
                ctx.fillRect(sx, sy, size, size);
            }
            ctx.globalAlpha = 1.0;
        }

        function loop() {
            // Clear and Draw BG Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#050014');
            grad.addColorStop(0.5, '#1a0033');
            grad.addColorStop(1, '#2a0055');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            time++;

            drawStars();
            // Sun sits exactly at the horizon
            drawPixelSun(width / 2, height * 0.45, Math.min(width, height) * 0.25);
            drawGrid();

            requestAnimationFrame(loop);
        }

        loop();

        /**
         * HIGHWAY LOGIC
         * Generates notes falling down the CSS 3D plane
         */
        const trackSurface = document.getElementById('track-surface');
        
        // Note colors
        const noteColors = ['#ff00ff', '#00ffff', '#00ffff', '#ff00ff'];

        function spawnNote() {
            const laneIdx = Math.floor(Math.random() * 4);
            
            const note = document.createElement('div');
            note.className = 'note';
            note.style.backgroundColor = noteColors[laneIdx];
            
            // Position logic based on 4 lanes
            // 0: 10%, 1: 35%, 2: 60%, 3: 85% (approx centers)
            const leftPos = 10 + (laneIdx * 25); 
            note.style.left = leftPos + '%';
            
            // Start high up (far away in perspective)
            note.style.top = '0px'; 
            
            trackSurface.appendChild(note);

            // Animate falling
            const duration = 1500 + Math.random() * 400;
            
            const animation = note.animate([
                { top: '-20px', opacity: 0 },
                { top: '0px', opacity: 1, offset: 0.1 },
                { top: '100%', opacity: 1 }
            ], {
                duration: duration,
                easing: 'linear'
            });

            animation.onfinish = () => {
                note.remove();
            };
        }

        // Continuous note generation
        setInterval(() => {
            // High probability of spawning for visual density
            if (Math.random() < 0.6) { 
                spawnNote();
            }
        }, 150);

        function startGame() {
            const ui = document.querySelector('.ui-layer');
            const btn = document.querySelector('.btn-start');
            
            // Visual feedback
            btn.innerHTML = "LOADING...";
            btn.style.backgroundColor = "var(--c-neon-pink)";
            btn.style.color = "black";
            
            // Simulate loading
            setTimeout(() => {
                alert('SYSTEM READY. ENTERING RHYTHM STREAM.');
                btn.innerHTML = "START";
                // Reset styles
                btn.style.backgroundColor = "";
                btn.style.color = "";
            }, 500);
        }

    </script>
</body>
</html>
