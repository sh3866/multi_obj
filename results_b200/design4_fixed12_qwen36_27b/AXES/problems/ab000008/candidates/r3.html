<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM EDITION</title>
    <style>
        /* 
           SYSTEM FONT STACK FOR PIXEL ART 
           Using 'Courier New' (monospace) as the base for offline pixel rendering.
           -webkit-font-smoothing: none ensures hard edges.
        */
        :root {
            --c-bg-top: #050014;
            --c-bg-bot: #1a0033;
            --c-grid: #ff00ff; /* Neon Magenta */
            --c-grid-dim: #5500aa; 
            --c-neon-pink: #ff00ff;
            --c-neon-cyan: #00ffff;
            --c-neon-orange: #ffaa00;
            --c-white: #ffffff;
            --c-black: #000000;
            --c-arcade-red: #ff3333;
            
            --font-pixel: 'Courier New', Courier, monospace;
            --btn-width: 220px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none; 
            text-rendering: geometricPrecision;
        }

        body {
            background-color: var(--c-bg-top);
            color: var(--c-white);
            font-family: var(--font-pixel);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* --- BACKGROUND CANVAS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            image-rendering: pixelated; 
        }

        /* --- CRT / VHS OVERLAY --- */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            pointer-events: none;
            /* Scanlines */
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            /* Vignette */
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            animation: flicker 0.1s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            50% { opacity: 0.98; }
            100% { opacity: 0.95; }
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 4vh;
        }

        /* --- TITLE BLOCK --- */
        .title-block {
            text-align: center;
            margin-bottom: 0;
            position: relative;
            z-index: 20;
            /* Hard Glitch Shadow */
            text-shadow: 
                4px 4px 0px var(--c-neon-pink), 
                -2px -2px 0px var(--c-neon-cyan);
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }

        h1 {
            font-size: 5.5rem;
            line-height: 0.85;
            color: var(--c-white);
            text-transform: uppercase;
            letter-spacing: -4px;
            margin: 0;
            /* Inner block for contrast */
            background: linear-gradient(180deg, #fff 0%, #ccc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--c-neon-cyan);
            letter-spacing: 8px;
            margin-top: 5px;
            font-weight: bold;
            text-shadow: 2px 2px 0px var(--c-black);
            text-transform: uppercase;
        }

        @keyframes glitch-anim {
            0% { text-shadow: 4px 4px 0px var(--c-neon-pink), -2px -2px 0px var(--c-neon-cyan); transform: translate(0,0); }
            2% { text-shadow: -4px 2px 0px var(--c-neon-pink), 2px -2px 0px var(--c-neon-cyan); transform: translate(1px, -1px); }
            4% { text-shadow: 4px 4px 0px var(--c-neon-pink), -2px -2px 0px var(--c-neon-cyan); transform: translate(0,0); }
            98% { text-shadow: 4px 4px 0px var(--c-neon-pink), -2px -2px 0px var(--c-neon-cyan); transform: translate(0,0); }
            100% { text-shadow: -2px -2px 0px var(--c-neon-pink), 2px 2px 0px var(--c-neon-cyan); transform: translate(-1px, 1px); }
        }

        /* --- HIGHWAY SCENE (The Bridge) --- */
        .highway-scene {
            width: 100%;
            height: 35vh;
            perspective: 600px;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Anchor to bottom */
            position: relative;
            margin-bottom: -20px; /* Pull buttons up into the scene */
            z-index: 5;
        }

        /* The 3D Road */
        .highway-plane {
            position: relative;
            width: 600px;
            height: 100%;
            transform-style: preserve-3d;
            transform: rotateX(65deg) translateY(50px); 
            transform-origin: center bottom;
            /* Mask the top so it fades into the horizon/sun */
            mask-image: linear-gradient(to bottom, transparent 0%, black 40%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 40%);
        }

        /* The Track Container */
        .track-surface {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            border-left: 4px solid var(--c-neon-pink);
            border-right: 4px solid var(--c-neon-cyan);
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.3);
            overflow: hidden;
        }

        /* Grid lines on the track */
        .track-surface::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(90deg, transparent 24%, rgba(255,255,255,0.1) 25%, transparent 26%, transparent 49%, rgba(255,255,255,0.1) 50%, transparent 52%, transparent 74%, rgba(255,255,255,0.1) 75%, transparent 76%),
                linear-gradient(0deg, transparent 95%, rgba(255,255,255,0.2) 96%);
            background-size: 100% 100%, 100% 40px;
            animation: trackScroll 0.4s linear infinite;
        }

        /* The Hit Line (The Goal) */
        .hit-line-container {
            position: absolute;
            bottom: 0px; /* At the very bottom of the plane */
            left: 50%;
            transform: translateX(-50%);
            width: 340px;
            height: 4px;
            z-index: 20;
            background: var(--c-white);
            box-shadow: 0 0 15px var(--c-white), 0 0 30px var(--c-neon-cyan);
            border-top: 2px solid var(--c-black);
            border-bottom: 2px solid var(--c-black);
        }

        /* Notes */
        .note {
            position: absolute;
            width: 24%; /* Fits in lane */
            height: 16px;
            left: 50%; /* Center anchor */
            transform: translateX(-50%);
            border: 2px solid var(--c-white);
            box-shadow: 0 0 8px currentColor;
            z-index: 15;
            image-rendering: pixelated;
        }

        @keyframes trackScroll {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 0 0, 0 40px; }
        }

        /* --- CONTROLS (ARCADE STYLE) --- */
        .controls {
            position: absolute;
            /* Position exactly where the hit line is visually */
            bottom: 60px; 
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 50; /* Above highway */
            transform: perspective(600px) rotateX(10deg); /* Slight tilt to match floor */
        }

        .btn-group {
            display: flex;
            gap: 0; /* Connected arcade panel look */
            background: #222;
            padding: 10px;
            border: 4px solid #444;
            border-radius: 4px;
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.8),
                inset 0 2px 0px rgba(255,255,255,0.1);
        }

        .btn {
            background: #111;
            border: none;
            color: var(--c-white);
            font-family: var(--font-pixel);
            cursor: pointer;
            position: relative;
            text-transform: uppercase;
            transition: all 0.05s;
            padding: 15px 0;
            outline: none;
            font-weight: bold;
            letter-spacing: 2px;
            width: var(--btn-width);
            display: flex;
            align-items: center;
            justify-content: center;
            /* Beveled 3D look */
            box-shadow: 
                inset 2px 2px 0px rgba(255,255,255,0.1),
                inset -2px -2px 0px rgba(0,0,0,0.5);
        }

        /* Separator between buttons */
        .btn + .btn {
            border-left: 2px solid #333;
        }

        /* START Button (Heavy Weight) */
        .btn-start {
            font-size: 1.6rem;
            color: var(--c-white);
            background: var(--c-neon-pink);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            /* Arcade Button Glow */
            box-shadow: 
                inset 4px 4px 0px rgba(255,255,255,0.4),
                inset -4px -4px 0px rgba(0,0,0,0.4),
                0 0 20px var(--c-neon-pink);
            border: 2px solid rgba(255,255,255,0.2);
            animation: pulseBtn 1.5s infinite alternate;
        }

        .btn-start:hover {
            background: #ff4dff;
            transform: translateY(2px);
            box-shadow: 
                inset 2px 2px 0px rgba(0,0,0,0.4),
                inset -2px -2px 0px rgba(255,255,255,0.4),
                0 0 30px var(--c-neon-pink);
        }

        .btn-start:active {
            transform: translateY(4px);
            background: #cc00cc;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.6);
        }

        /* OPTIONS Button (Ghost / Low Weight) */
        .btn-options {
            font-size: 1.2rem;
            color: #666;
            background: transparent;
            box-shadow: none;
            border: none;
        }

        .btn-options:hover {
            color: var(--c-neon-cyan);
            text-shadow: 0 0 8px var(--c-neon-cyan);
        }

        @keyframes pulseBtn {
            0% { box-shadow: inset 4px 4px 0px rgba(255,255,255,0.4), inset -4px -4px 0px rgba(0,0,0,0.4), 0 0 15px var(--c-neon-pink); }
            100% { box-shadow: inset 4px 4px 0px rgba(255,255,255,0.4), inset -4px -4px 0px rgba(0,0,0,0.4), 0 0 35px var(--c-neon-pink), 0 0 10px var(--c-white); }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 600px) {
            :root { --btn-width: 140px; }
            h1 { font-size: 3rem; letter-spacing: -2px; }
            .subtitle { font-size: 0.9rem; letter-spacing: 2px; }
            .highway-scene { height: 30vh; }
            .track-surface { width: 240px; }
            .hit-line-container { width: 260px; }
            .btn-start { font-size: 1.2rem; }
            .btn-options { font-size: 0.9rem; }
            .controls { bottom: 40px; }
        }
    </style>
</head>
<body>

    <!-- Background Rendering (Sun, Stars, Grid) -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- CRT / Noise Overlay -->
    <div class="crt-overlay"></div>

    <div class="ui-layer">
        
        <!-- Title -->
        <div class="title-block">
            <h1>PIXEL<br>DANCE</h1>
            <div class="subtitle">RHYTHM EDITION</div>
        </div>

        <!-- 3D Highway Preview -->
        <div class="highway-scene">
            <div class="highway-plane">
                <div class="track-surface" id="track-surface">
                    <!-- Notes will be injected here via JS -->
                </div>
            </div>
            <!-- Hit Line -->
            <div class="hit-line-container"></div>
        </div>

        <!-- Controls (Positioned at the Hit Line) -->
        <div class="controls">
            <div class="btn-group">
                <button class="btn btn-start" onclick="startGame()">START</button>
                <button class="btn btn-options" onclick="alert('OPTIONS MENU DISABLED IN DEMO')">OPTIONS</button>
            </div>
        </div>

    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Renders the Synthwave Background (Sun, Stars, Horizon Grid)
         */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let time = 0;

        // Colors
        const COL_SUN_TOP = '#ff00ff';
        const COL_SUN_BOT = '#ffaa00';
        const COL_GRID_HORIZON = '#7000ff'; 
        const COL_GRID_FLOOR = 'rgba(112, 0, 255, 0.4)'; 

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawPixelSun(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            // Glow
            ctx.shadowBlur = 50;
            ctx.shadowColor = COL_SUN_TOP;

            const grad = ctx.createLinearGradient(0, -size, 0, size);
            grad.addColorStop(0, COL_SUN_TOP);
            grad.addColorStop(1, COL_SUN_BOT);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, size, 0, Math.PI * 2);
            ctx.fill();

            // "Thinner" Black Bars (Scanlines on Sun)
            ctx.fillStyle = '#050014'; // Match BG
            ctx.shadowBlur = 0;
            
            // Draw stripes from bottom up
            for (let i = 0; i < 12; i++) {
                // Exponential spacing for stripes to match perspective slightly
                let yPos = (i * (size / 5)) - size + (size * 0.2); 
                let h = (i * 2) + 3; // Variable thickness
                
                if (yPos > -size) {
                    ctx.fillRect(-size, yPos, size * 2, h);
                }
            }
            ctx.restore();
        }

        function drawGrid() {
            const horizonY = height * 0.45;
            const vanishX = width / 2;
            const speed = (time * 2) % 40; 

            ctx.lineWidth = 2; 
            ctx.strokeStyle = COL_GRID_FLOOR;

            ctx.beginPath();

            // Vertical Perspective Lines
            for (let i = -15; i <= 15; i++) {
                let x1 = vanishX + (i * 2); // Tight at horizon
                let x2 = vanishX + (i * width * 0.2); // Wide at bottom
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
            }

            // Horizontal Moving Lines
            for (let i = 0; i < 25; i++) {
                let z = i * 20 - speed;
                if (z <= 0) continue;
                
                // Exponential spacing
                let perspective = 1000 / z;
                let y = horizonY + (height * 0.8) * (1 - (1 / (z * 0.02 + 1)));

                if (y > horizonY && y < height) {
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                }
            }
            ctx.stroke();

            // Horizon Glow Line
            ctx.fillStyle = COL_GRID_HORIZON;
            ctx.fillRect(0, horizonY - 2, width, 4);
        }

        function drawStars() {
            ctx.fillStyle = '#ffffff';
            for(let i=0; i<80; i++) {
                const sx = (Math.sin(i * 132.1) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 54.3) * 0.5 + 0.5) * (height * 0.4);
                const size = (i % 3 === 0) ? 2 : 1;
                
                const alpha = Math.abs(Math.sin(time * 0.05 + i));
                ctx.globalAlpha = alpha;
                ctx.fillRect(sx, sy, size, size);
            }
            ctx.globalAlpha = 1.0;
        }

        function loop() {
            // Clear and Draw BG Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#050014');
            grad.addColorStop(0.5, '#1a0033');
            grad.addColorStop(1, '#2a0055');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            time++;

            drawStars();
            // Sun sits exactly at the horizon
            drawPixelSun(width / 2, height * 0.45, Math.min(width, height) * 0.22);
            drawGrid();

            requestAnimationFrame(loop);
        }

        loop();

        /**
         * HIGHWAY LOGIC
         * Generates notes falling down the CSS 3D plane
         */
        const trackSurface = document.getElementById('track-surface');
        
        // Note colors
        const noteColors = ['#ff00ff', '#00ffff', '#00ffff', '#ff00ff'];

        function spawnNote() {
            const laneIdx = Math.floor(Math.random() * 4);
            
            const note = document.createElement('div');
            note.className = 'note';
            note.style.backgroundColor = noteColors[laneIdx];
            
            // Position logic based on 4 lanes
            // 0: 12.5%, 1: 37.5%, 2: 62.5%, 3: 87.5%
            const leftPos = 12.5 + (laneIdx * 25); 
            note.style.left = leftPos + '%';
            
            // Start high up (far away in perspective)
            note.style.top = '-20px'; 
            
            trackSurface.appendChild(note);

            // Animate falling
            const duration = 1200 + Math.random() * 200;
            
            const animation = note.animate([
                { top: '-20px', opacity: 0 },
                { top: '0px', opacity: 1, offset: 0.1 },
                { top: '100%', opacity: 1 }
            ], {
                duration: duration,
                easing: 'linear'
            });

            animation.onfinish = () => {
                note.remove();
            };
        }

        // Continuous note generation
        setInterval(() => {
            if (Math.random() < 0.5) { 
                spawnNote();
            }
        }, 100);

        function startGame() {
            const btn = document.querySelector('.btn-start');
            
            btn.innerHTML = "LOADING...";
            btn.style.animation = "none"; // Stop pulse
            btn.style.backgroundColor = "var(--c-white)";
            btn.style.color = "black";
            btn.style.boxShadow = "0 0 30px var(--c-white)";
            
            setTimeout(() => {
                alert('SYSTEM READY. ENTERING RHYTHM STREAM.');
                btn.innerHTML = "START";
                // Reset styles
                btn.style.backgroundColor = "";
                btn.style.color = "";
                btn.style.animation = "pulseBtn 1.5s infinite alternate";
                btn.style.boxShadow = "";
            }, 800);
        }

    </script>
</body>
</html>
