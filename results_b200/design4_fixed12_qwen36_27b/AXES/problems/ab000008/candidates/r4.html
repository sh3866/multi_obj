<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM EDITION</title>
    <style>
        /* 
           SYSTEM FONT STACK FOR PIXEL ART 
           Since external fonts (Google Fonts) are blocked offline, 
           we use a tight monospace stack and -moz-osx-font-smoothing: grayscale 
           to create a blocky, pixelated appearance without anti-aliasing.
        */
        :root {
            --c-bg-top: #050014;
            --c-bg-bot: #1a0033;
            --c-grid: #ff00ff; 
            --c-neon-pink: #ff00ff;
            --c-neon-cyan: #00ffff;
            --c-neon-orange: #ffaa00;
            --c-white: #ffffff;
            --c-black: #000000;
            
            /* Hardware Colors */
            --hw-dark: #111111;
            --hw-light: #333333;
            --hw-highlight: #555555;
            
            /* Pixel Font Stack */
            --font-pixel: 'Courier New', 'Lucida Console', monospace;
            
            --btn-width: 240px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none; /* Critical for pixel look */
            text-rendering: geometricPrecision;
        }

        body {
            background-color: var(--c-bg-top);
            color: var(--c-white);
            font-family: var(--font-pixel);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* --- BACKGROUND CANVAS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            image-rendering: pixelated; 
        }

        /* --- CRT / VHS OVERLAY --- */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.96; }
            50% { opacity: 0.99; }
            100% { opacity: 0.96; }
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Tightened composition: Title sits lower */
            padding-top: 12vh; 
        }

        /* --- TITLE BLOCK --- */
        .title-block {
            text-align: center;
            position: relative;
            z-index: 20;
            width: 100%;
            max-width: 600px;
            /* Hard Glitch Shadow */
            text-shadow: 
                4px 4px 0px var(--c-neon-pink), 
                -2px -2px 0px var(--c-neon-cyan);
            animation: glitch-anim 4s infinite linear alternate-reverse;
        }

        h1 {
            font-size: 4.5rem;
            line-height: 0.9;
            color: var(--c-white);
            text-transform: uppercase;
            letter-spacing: -2px;
            margin: 0;
            /* Pixelated text fill simulation */
            background: linear-gradient(180deg, #fff 0%, #ddd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
        }

        .subtitle {
            font-size: 1rem;
            color: var(--c-neon-cyan);
            letter-spacing: 6px;
            margin-top: 8px;
            font-weight: bold;
            text-shadow: 2px 2px 0px var(--c-black);
            text-transform: uppercase;
            margin-bottom: 2vh;
        }

        @keyframes glitch-anim {
            0% { text-shadow: 4px 4px 0px var(--c-neon-pink), -2px -2px 0px var(--c-neon-cyan); transform: translate(0,0); }
            2% { text-shadow: -4px 2px 0px var(--c-neon-pink), 2px -2px 0px var(--c-neon-cyan); transform: translate(1px, -1px); }
            4% { text-shadow: 4px 4px 0px var(--c-neon-pink), -2px -2px 0px var(--c-neon-cyan); transform: translate(0,0); }
            98% { text-shadow: 4px 4px 0px var(--c-neon-pink), -2px -2px 0px var(--c-neon-cyan); transform: translate(0,0); }
            100% { text-shadow: -2px -2px 0px var(--c-neon-pink), 2px 2px 0px var(--c-neon-cyan); transform: translate(-1px, 1px); }
        }

        /* --- HIGHWAY SCENE (The Bridge) --- */
        .highway-scene {
            width: 100%;
            /* Reduced height to tighten layout */
            height: 25vh; 
            perspective: 800px;
            display: flex;
            justify-content: center;
            align-items: flex-end; 
            position: relative;
            z-index: 5;
            margin-top: -20px; /* Overlap title slightly */
        }

        /* The 3D Road */
        .highway-plane {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform: rotateX(60deg) translateY(20px); 
            transform-origin: center bottom;
            /* Fade into horizon */
            mask-image: linear-gradient(to bottom, transparent 0%, black 30%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 30%);
        }

        /* The Track Container */
        .track-surface {
            position: absolute;
            bottom: -50px; /* Extend down */
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 200%; /* Tall to fill perspective */
            /* Semi-transparent for Sun bleed-through */
            background: rgba(5, 0, 20, 0.6);
            border-left: 2px solid var(--c-neon-pink);
            border-right: 2px solid var(--c-neon-cyan);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.2);
            overflow: hidden;
            /* Wireframe Grid Look */
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Hit Line */
        .hit-line-container {
            position: absolute;
            bottom: 0px; 
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 6px;
            z-index: 20;
            background: var(--c-white);
            box-shadow: 0 0 20px var(--c-white), 0 0 40px var(--c-neon-cyan);
            border-top: 2px solid var(--c-black);
            border-bottom: 2px solid var(--c-black);
        }

        /* Notes */
        .note {
            position: absolute;
            width: 22%; 
            height: 12px;
            left: 50%; 
            transform: translateX(-50%);
            border: 2px solid var(--c-white);
            box-shadow: 0 0 10px currentColor;
            z-index: 15;
            image-rendering: pixelated;
        }

        /* --- CONTROLS (HARDWARE AESTHETIC) --- */
        .controls {
            position: relative;
            /* Tucked up into the scene */
            margin-top: -40px; 
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 50;
            transform: perspective(800px) rotateX(15deg);
        }

        /* Arcade Cabinet Panel */
        .btn-group {
            display: flex;
            gap: 0; 
            background: #222;
            padding: 6px;
            /* 3D Bevel */
            border-top: 4px solid #666;
            border-left: 4px solid #666;
            border-right: 4px solid #111;
            border-bottom: 4px solid #111;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .btn {
            background: #1a1a1a;
            border: none;
            color: var(--c-white);
            font-family: var(--font-pixel);
            cursor: pointer;
            position: relative;
            text-transform: uppercase;
            transition: all 0.1s;
            padding: 18px 0;
            outline: none;
            font-weight: bold;
            letter-spacing: 2px;
            width: var(--btn-width);
            display: flex;
            align-items: center;
            justify-content: center;
            /* Recessed button look */
            box-shadow: 
                inset 3px 3px 0px #000,
                inset -3px -3px 0px #444;
        }

        .btn + .btn {
            border-left: 4px solid #111;
        }

        /* START Button (Heavy Red) */
        .btn-start {
            font-size: 1.4rem;
            color: var(--c-white);
            background: #cc0000;
            text-shadow: 2px 2px 0px #550000;
            /* 3D Extrusion */
            box-shadow: 
                inset 2px 2px 0px rgba(255,100,100,0.4),
                inset -2px -2px 0px rgba(0,0,0,0.6),
                0 0 15px var(--c-neon-pink);
            border: 2px solid #880000;
            animation: pulseBtn 2s infinite alternate;
        }

        .btn-start:hover {
            background: #ff0000;
            transform: translateY(2px);
            box-shadow: 
                inset 2px 2px 0px rgba(0,0,0,0.6),
                inset -2px -2px 0px rgba(255,100,100,0.4),
                0 0 25px var(--c-neon-pink);
        }

        .btn-start:active {
            transform: translateY(4px);
            background: #990000;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8);
        }

        /* OPTIONS Button (High Contrast Dark) */
        .btn-options {
            font-size: 1.1rem;
            color: var(--c-neon-cyan);
            background: #0a0a0a;
            text-shadow: 0 0 5px var(--c-neon-cyan);
            box-shadow: 
                inset 3px 3px 0px #000,
                inset -3px -3px 0px #333;
        }

        .btn-options:hover {
            color: var(--c-white);
            background: #1a1a1a;
            text-shadow: 0 0 10px var(--c-neon-cyan);
            transform: translateY(2px);
        }

        .btn-options:active {
            transform: translateY(4px);
            background: #000;
        }

        @keyframes pulseBtn {
            0% { box-shadow: inset 2px 2px 0px rgba(255,100,100,0.4), inset -2px -2px 0px rgba(0,0,0,0.6), 0 0 15px var(--c-neon-pink); }
            100% { box-shadow: inset 2px 2px 0px rgba(255,100,100,0.4), inset -2px -2px 0px rgba(0,0,0,0.6), 0 0 30px var(--c-neon-pink), 0 0 10px var(--c-white); }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 600px) {
            :root { --btn-width: 140px; }
            h1 { font-size: 3rem; letter-spacing: -1px; }
            .subtitle { font-size: 0.8rem; }
            .highway-scene { height: 20vh; }
            .track-surface { width: 240px; }
            .hit-line-container { width: 260px; }
            .btn-start { font-size: 1.1rem; }
            .btn-options { font-size: 0.9rem; }
            .controls { margin-top: -30px; }
        }
    </style>
</head>
<body>

    <!-- Background Rendering (Sun, Stars, Grid) -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- CRT / Noise Overlay -->
    <div class="crt-overlay"></div>

    <div class="ui-layer">
        
        <!-- Title -->
        <div class="title-block">
            <h1>PIXEL<br>DANCE</h1>
            <div class="subtitle">RHYTHM EDITION</div>
        </div>

        <!-- 3D Highway Preview -->
        <div class="highway-scene">
            <div class="highway-plane">
                <div class="track-surface" id="track-surface">
                    <!-- Notes will be injected here via JS -->
                </div>
            </div>
            <!-- Hit Line -->
            <div class="hit-line-container"></div>
        </div>

        <!-- Controls (Arcade Hardware) -->
        <div class="controls">
            <div class="btn-group">
                <button class="btn btn-start" onclick="startGame()">START</button>
                <button class="btn btn-options" onclick="alert('OPTIONS DISABLED')">OPT</button>
            </div>
        </div>

    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Renders the Synthwave Background (Sun, Stars, Horizon Grid)
         */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let time = 0;

        // Colors
        const COL_SUN_TOP = '#ff00ff';
        const COL_SUN_BOT = '#ffaa00';
        const COL_GRID_HORIZON = '#7000ff'; 
        const COL_GRID_FLOOR = 'rgba(112, 0, 255, 0.4)'; 

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawPixelSun(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            // Glow
            ctx.shadowBlur = 60;
            ctx.shadowColor = COL_SUN_TOP;

            const grad = ctx.createLinearGradient(0, -size, 0, size);
            grad.addColorStop(0, COL_SUN_TOP);
            grad.addColorStop(1, COL_SUN_BOT);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, size, 0, Math.PI * 2);
            ctx.fill();

            // "Thinner" Black Bars (Scanlines on Sun)
            ctx.fillStyle = '#050014'; // Match BG
            ctx.shadowBlur = 0;
            
            // Draw stripes from bottom up
            for (let i = 0; i < 14; i++) {
                // Exponential spacing
                let yPos = (i * (size / 5)) - size + (size * 0.2); 
                let h = (i * 1.5) + 2; 
                
                if (yPos > -size) {
                    ctx.fillRect(-size, yPos, size * 2, h);
                }
            }
            ctx.restore();
        }

        function drawGrid() {
            const horizonY = height * 0.45;
            const vanishX = width / 2;
            const speed = (time * 2) % 40; 

            ctx.lineWidth = 2; 
            ctx.strokeStyle = COL_GRID_FLOOR;

            ctx.beginPath();

            // Vertical Perspective Lines
            for (let i = -15; i <= 15; i++) {
                let x1 = vanishX + (i * 2); 
                let x2 = vanishX + (i * width * 0.2); 
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
            }

            // Horizontal Moving Lines
            for (let i = 0; i < 25; i++) {
                let z = i * 20 - speed;
                if (z <= 0) continue;
                
                let perspective = 1000 / z;
                let y = horizonY + (height * 0.8) * (1 - (1 / (z * 0.02 + 1)));

                if (y > horizonY && y < height) {
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                }
            }
            ctx.stroke();

            // Horizon Glow Line
            ctx.fillStyle = COL_GRID_HORIZON;
            ctx.fillRect(0, horizonY - 2, width, 4);
        }

        function drawStars() {
            ctx.fillStyle = '#ffffff';
            for(let i=0; i<80; i++) {
                const sx = (Math.sin(i * 132.1) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 54.3) * 0.5 + 0.5) * (height * 0.4);
                const size = (i % 3 === 0) ? 2 : 1;
                
                const alpha = Math.abs(Math.sin(time * 0.05 + i));
                ctx.globalAlpha = alpha;
                ctx.fillRect(sx, sy, size, size);
            }
            ctx.globalAlpha = 1.0;
        }

        function loop() {
            // Clear and Draw BG Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#050014');
            grad.addColorStop(0.5, '#1a0033');
            grad.addColorStop(1, '#2a0055');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            time++;

            drawStars();
            drawPixelSun(width / 2, height * 0.45, Math.min(width, height) * 0.22);
            drawGrid();

            requestAnimationFrame(loop);
        }

        loop();

        /**
         * HIGHWAY LOGIC
         * Generates notes falling down the CSS 3D plane
         */
        const trackSurface = document.getElementById('track-surface');
        
        // Note colors
        const noteColors = ['#ff00ff', '#00ffff', '#00ffff', '#ff00ff'];

        function spawnNote() {
            const laneIdx = Math.floor(Math.random() * 4);
            
            const note = document.createElement('div');
            note.className = 'note';
            note.style.backgroundColor = noteColors[laneIdx];
            
            // Position logic based on 4 lanes
            const leftPos = 12.5 + (laneIdx * 25); 
            note.style.left = leftPos + '%';
            
            // Start high up (far away in perspective)
            note.style.top = '-20px'; 
            
            trackSurface.appendChild(note);

            // Animate falling
            const duration = 1000 + Math.random() * 300;
            
            const animation = note.animate([
                { top: '-20px', opacity: 0 },
                { top: '0px', opacity: 1, offset: 0.1 },
                { top: '100%', opacity: 1 }
            ], {
                duration: duration,
                easing: 'linear'
            });

            animation.onfinish = () => {
                note.remove();
            };
        }

        // Continuous note generation
        setInterval(() => {
            if (Math.random() < 0.6) { 
                spawnNote();
            }
        }, 100);

        function startGame() {
            const btn = document.querySelector('.btn-start');
            
            btn.innerHTML = "LOADING...";
            btn.style.animation = "none"; 
            btn.style.backgroundColor = "var(--c-white)";
            btn.style.color = "black";
            btn.style.boxShadow = "0 0 30px var(--c-white)";
            
            setTimeout(() => {
                alert('SYSTEM READY. ENTERING RHYTHM STREAM.');
                btn.innerHTML = "START";
                // Reset styles
                btn.style.backgroundColor = "";
                btn.style.color = "";
                btn.style.animation = "pulseBtn 2s infinite alternate";
                btn.style.boxShadow = "";
            }, 800);
        }

    </script>
</body>
</html>
