<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* Palette - Refined High Contrast */
            --board-dark: #4B5D67;   /* Deep Slate Blue */
            --board-light: #F0EAD6;  /* Crisp Cream */
            
            /* UI Colors */
            --bg-body: #E5E5E7;      /* Light neutral background for contrast */
            --bg-container: #FFFFFF; /* White container */
            --text-main: #1F2937;    /* Dark Slate text */
            --text-muted: #6B7280;   /* Grey text */
            
            /* Accents */
            --accent-primary: #2563EB; /* Royal Blue */
            --accent-highlight: rgba(255, 215, 0, 0.4);
            
            /* Layout */
            --board-size: 640px;
            --gutter-size: 24px;
            --sidebar-width: 320px;
            --radius: 12px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-family);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        /* Unified Container (Critique #1) */
        .app-container {
            background: var(--bg-container);
            border-radius: var(--radius);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.15);
            display: flex;
            overflow: hidden;
            width: calc(var(--board-size) + var(--sidebar-width) + 48px); /* +padding */
            height: var(--board-size);
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* --- Board Section --- */
        .board-wrapper {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            /* Critique #1: Coordinate labels live here, outside the grid */
            padding: 24px; 
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #333; /* Dark trim behind board */
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            position: relative;
            user-select: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Critique #2: New Palette */
        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        
        /* Coordinates (Critique #1 & #3) */
        .coord {
            position: absolute;
            font-family: var(--font-family);
            font-size: 13px;
            font-weight: 600;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            z-index: 10;
        }
        
        /* Ranks (1-8) on Left */
        .coord.rank {
            top: 4px;
            left: 6px;
        }
        
        /* Files (a-h) on Bottom */
        .coord.file {
            bottom: 4px;
            right: 6px;
        }

        /* Dynamic Color for Coordinates based on square */
        .square.light .coord { color: var(--board-dark); }
        .square.dark .coord { color: var(--board-light); }

        /* Highlighting */
        .square.selected { background-color: rgba(255, 255, 50, 0.5) !important; }
        .square.possible-move::after {
            content: '';
            width: 24%;
            height: 24%;
            background: rgba(0,0,0,0.2);
            border-radius: 50%;
            position: absolute;
        }
        .square.capture-move {
            box-shadow: inset 0 0 0 4px rgba(0,0,0,0.2);
        }

        /* Pieces (Critique #3: Polish & Depth) */
        .piece {
            width: 85%;
            height: 85%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        .piece svg {
            width: 100%;
            height: 100%;
            /* Critique #3: Soft drop shadow instead of thick outlines */
            filter: drop-shadow(2px 4px 3px rgba(0,0,0,0.4));
        }
        .piece:hover { transform: scale(1.1); }

        /* --- Sidebar Section (Critique #4) --- */
        .sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background: var(--bg-container);
            display: flex;
            flex-direction: column;
            border-left: 1px solid #E5E7EB;
            padding: 32px;
        }

        /* Header / Controls Group */
        .sidebar-header {
            display: flex;
            flex-direction: column;
            gap: 24px; /* Critique #5: Consistent Spacing */
            margin-bottom: 24px;
        }

        /* Status (Critique #4: Clear Hierarchy) */
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .turn-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #e5e7eb;
            border: 2px solid #d1d5db;
            transition: all 0.3s ease;
        }
        .turn-dot.white { background-color: #fff; border-color: #9ca3af; box-shadow: 0 0 0 1px #000; }
        .turn-dot.black { background-color: #1f2937; border-color: #000; }

        .status-text {
            font-size: 1.5rem; /* Larger font */
            font-weight: 800;  /* Bolder font */
            color: var(--text-main);
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        .status-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }

        /* New Game Button (Critique #4: Secondary Action) */
        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid #E5E7EB;
            padding: 10px 16px;
            border-radius: 6px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            align-self: flex-start; /* Don't span full width */
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-secondary:hover {
            background: #F3F4F6;
            color: var(--text-main);
            border-color: #D1D5DB;
        }

        /* Move History (Critique #5) */
        .history-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #F3F4F6;
            border-radius: 8px;
            background: #F9FAFB;
        }
        
        .history-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            padding: 12px 16px;
            font-weight: 700;
            background: #F9FAFB;
            border-bottom: 1px solid #F3F4F6;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }
        
        /* Critique #5: Placeholder text */
        .history-placeholder {
            padding: 24px;
            text-align: center;
            color: #9CA3AF;
            font-size: 0.9rem;
            font-style: italic;
        }

        /* Scrollbar styling */
        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 3px; }

        .move-row {
            display: flex;
            padding: 8px 16px;
            border-bottom: 1px solid #F3F4F6;
            font-size: 0.95rem;
        }
        .move-row:last-child { border-bottom: none; }
        
        .move-num {
            width: 30px;
            color: #9CA3AF;
            text-align: right;
            padding-right: 12px;
            font-variant-numeric: tabular-nums;
        }
        .move-white, .move-black {
            flex: 1;
            cursor: pointer;
            color: var(--text-main);
            font-weight: 500;
            transition: color 0.2s;
        }
        .move-white:hover, .move-black:hover { color: var(--accent-primary); }

        /* Responsive */
        @media (max-width: 1000px) {
            .app-container {
                flex-direction: column;
                width: 100%;
                height: auto;
                max-width: 500px;
                gap: 0;
            }
            body { overflow-y: auto; height: auto; padding: 20px; }
            .board-wrapper { width: 100%; height: auto; aspect-ratio: 1/1; }
            .sidebar { width: 100%; height: auto; min-height: 300px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Left: Board -->
    <div class="board-wrapper">
        <div class="board" id="chessboard">
            <!-- Generated by JS -->
        </div>
    </div>

    <!-- Right: Sidebar -->
    <div class="sidebar">
        
        <!-- Header / Controls Group -->
        <div class="sidebar-header">
            <div>
                <div class="status-indicator">
                    <div class="turn-dot white" id="turnDot"></div>
                    <div>
                        <div class="status-text" id="statusText">White to Move</div>
                        <div class="status-sub">Standard Rules</div>
                    </div>
                </div>
            </div>
            <!-- Critique: Secondary Button Style -->
            <button class="btn-secondary" onclick="resetGame()">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                New Game
            </button>
        </div>

        <!-- Move History -->
        <div class="history-container">
            <div class="history-title">Move History</div>
            <div class="history-list" id="moveHistory">
                <div class="history-placeholder">Waiting for moves...</div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- Data & Config ---

        // Black pieces: Dark fill, subtle stroke
        bP: `<svg viewBox="0 0 45 45"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="#1a1a1a" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,

        bK: `<svg viewBox="0 0 45 45"><g fill="#1a1a1a" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22.5 11.63V6M20 8h5"/><path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-5 2-8 2s-4-2-8-2-4 1-8-2-4-3-8-2c-3 6 6 10.5 6 10.5v7z"/><path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/></g></svg>`,
    };

    // --- State ---
    const initialBoard = [
        ['bR', 'bN', 'bB', 'bQ', 'bK', 'bB', 'bN', 'bR'],
        ['bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP'],
        ['wR', 'wN', 'wB', 'wQ', 'wK', 'wB', 'wN', 'wR']
    ];

    let board = JSON.parse(JSON.stringify(initialBoard));
    let turn = 'w'; // 'w' or 'b'
    let selectedSquare = null;

    // --- Rendering ---
    const boardEl = document.getElementById('chessboard');
    const moveHistoryEl = document.getElementById('moveHistory');
    const statusText = document.getElementById('statusText');
    const turnDot = document.getElementById('turnDot');

    function renderBoard() {
        boardEl.innerHTML = '';
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.dataset.row = r;
                square.dataset.col = c;
                square.onclick = () => handleSquareClick(r, c);

                // Coordinates (Critique #1: Inside loop but positioned outside grid visually)
                if (c === 0) {
                    const rank = document.createElement('span');
                    rank.className = 'coord rank';
                    rank.innerText = 8 - r;
                    square.appendChild(rank);
                }
                if (r === 7) {
                    const file = document.createElement('span');
                    file.className = 'coord file';
                    file.innerText = String.fromCharCode(97 + c);
                    square.appendChild(file);
                }

                // Piece
                const pieceCode = board[r][c];
                if (pieceCode) {
                    const piece = document.createElement('div');
                    piece.className = 'piece';
                    piece.innerHTML = SVG_PIECES[pieceCode];
                    square.appendChild(piece);
                }

                // Selection highlight
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    square.classList.add('selected');
                }

                boardEl.appendChild(square);
            }
        }
    }

    function updateStatus() {
        const player = turn === 'w' ? 'White' : 'Black';
        statusText.innerText = `${player} to Move`;
        turnDot.className = `turn-dot ${turn === 'w' ? 'white' : 'black'}`;
    }

    // --- Interaction ---
    function handleSquareClick(r, c) {
        const piece = board[r][c];
        const isOwnPiece = piece && piece.startsWith(turn);

        if (isOwnPiece) {
            // Select piece
            selectedSquare = { r, c };
            renderBoard();
        } else if (selectedSquare) {
            // Move piece (Visual only for this demo)
            movePiece(selectedSquare.r, selectedSquare.c, r, c);
        }
    }

    function movePiece(fromR, fromC, toR, toC) {
        const piece = board[fromR][fromC];
        
        // Update board state
        board[toR][toC] = piece;
        board[fromR][fromC] = '';
        
        // Add fake move to history
        addMoveToHistory(piece, fromR, fromC, toR, toC);

        // Switch turn
        turn = turn === 'w' ? 'b' : 'w';
        selectedSquare = null;
        
        renderBoard();
        updateStatus();
    }

    function addMoveToHistory(piece, fromR, fromC, toR, toC) {
        // Remove placeholder if present
        const placeholder = document.querySelector('.history-placeholder');
        if (placeholder) placeholder.remove();

        const files = 'abcdefgh';
        const ranks = '87654321';
        
        const notation = (piece[1] === 'P' ? '' : piece[1].toUpperCase()) + 
                         files[toC] + ranks[toR];

        const moveNum = Math.ceil((moveHistoryEl.children.length + 1) / 2);
        
        // If it's white's move, create new row
        if (turn === 'b') { // White just moved
            const row = document.createElement('div');
            row.className = 'move-row';
            row.innerHTML = `
                <div class="move-num">${moveNum}.</div>
                <div class="move-white">${notation}</div>
                <div class="move-black"></div>
            `;
            moveHistoryEl.appendChild(row);
        } else { // Black just moved
            const lastRow = moveHistoryEl.lastElementChild;
            if (lastRow) {
                lastRow.querySelector('.move-black').innerText = notation;
            }
        }
        
        // Auto scroll
        moveHistoryEl.scrollTop = moveHistoryEl.scrollHeight;
    }

    function resetGame() {
        board = JSON.parse(JSON.stringify(initialBoard));
        turn = 'w';
        selectedSquare = null;
        moveHistoryEl.innerHTML = '<div class="history-placeholder">Waiting for moves...</div>';
        renderBoard();
        updateStatus();
    }

    // --- Init ---
    renderBoard();
    updateStatus();

</script>
</body>
</html>
