<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Life Simulation</title>
<style>
  :root {
    --bg-color: #050508;
    --panel-bg: rgba(10, 10, 15, 0.4);
    --panel-border: rgba(255, 255, 255, 0.08);
    --panel-highlight: rgba(255, 255, 255, 0.15);
    --accent-cyan: #00f0ff;
    --accent-pink: #ff0055;
    --text-main: #e0e6ed;
    --text-muted: #7a8599;
    /* Monospace font stack for scientific instrument look */
    --font-stack: 'Space Mono', 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-color);
    /* Subtle vignette via CSS to focus attention */
    background-image: radial-gradient(circle at center, #12121a 0%, #020203 100%);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Canvas Container - Fills screen, acts as background */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Layer - Absolute positioning */
  #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none; /* Pass clicks to canvas */
    display: flex;
    flex-direction: column;
    justify-content: flex-end; /* Anchor to bottom */
    align-items: center; /* Center horizontally */
    padding: 2rem;
  }

  /* Control Panel - Glassmorphism */
  .panel {
    pointer-events: auto;
    width: 100%;
    max-width: 400px;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--panel-border);
    border-top: 1px solid var(--panel-highlight);
    border-radius: 12px 12px 0 0; /* Rounded top only */
    padding: 1.5rem;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    gap: 1.25rem; /* 8pt grid rhythm */
    margin-bottom: 0; /* Flush with bottom */
    transition: transform 0.3s ease;
  }

  /* Title Section */
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 0.75rem;
    margin-bottom: 0.25rem;
  }

  h1 {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #fff;
    margin: 0;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }

  .subtitle {
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: right;
  }

  /* Stats Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .panel-label {
    font-size: 0.65rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .stat-value {
    font-size: 1.25rem;
    font-weight: 400;
    color: var(--accent-cyan);
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    font-variant-numeric: tabular-nums;
  }

  /* Controls Area */
  .controls-area {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  /* Slider Styling */
  .slider-container {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent-cyan);
    cursor: pointer;
    box-shadow: 0 0 10px var(--accent-cyan);
    margin-top: -6px; /* Center on track */
  }

  /* Button Grid */
  .btn-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }

  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--panel-border);
    color: var(--text-main);
    padding: 0.75rem 1rem;
    border-radius: 4px;
    font-family: var(--font-stack);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-align: center;
  }

  button:hover {
    background: rgba(255,255,255,0.1);
    border-color: var(--text-main);
    box-shadow: 0 0 15px rgba(255,255,255,0.1);
  }

  button:active {
    transform: translateY(1px);
  }

  button.primary {
    background: rgba(0, 240, 255, 0.1);
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }
  
  button.primary:hover {
    background: var(--accent-cyan);
    color: #000;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
  }

  button.danger {
    color: var(--accent-pink);
    border-color: rgba(255, 0, 85, 0.3);
  }

  button.danger:hover {
    background: var(--accent-pink);
    color: #fff;
    box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
    border-color: var(--accent-pink);
  }

  /* Footer hint */
  .interaction-hint {
    position: absolute;
    top: 2rem;
    right: 2rem;
    font-size: 0.65rem;
    color: var(--text-muted);
    opacity: 0.6;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-align: right;
    pointer-events: none;
  }

</style>
</head>
<body>

  <!-- Canvas for the Sphere -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- Interaction Hint (Top Right) -->
  <div class="interaction-hint">
    Drag to Rotate &bull; Scroll to Zoom
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Control Panel (Bottom Center) -->
    <div class="panel">
      
      <div class="panel-header">
        <h1>Conway Sphere</h1>
        <div class="subtitle">Algorithmic Life in 3D</div>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-item">
          <span class="panel-label">Generation</span>
          <span class="stat-value" id="gen-count">0000</span>
        </div>
        <div class="stat-item">
          <span class="panel-label">Population</span>
          <span class="stat-value" id="pop-count">0000</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-area">
        
        <div class="slider-container">
          <div style="display:flex; justify-content:space-between;">
            <span class="panel-label">Sim Speed</span>
            <span class="panel-label" id="speed-val">10 FPS</span>
          </div>
          <input type="range" id="speed-slider" min="1" max="60" value="15">
        </div>

        <div class="btn-grid">
          <button id="btn-pause" class="primary">Pause</button>
          <button id="btn-reset" class="danger">Randomize</button>
        </div>
        
        <button id="btn-step">Step Frame</button>
      </div>

    </div>
  </div>

<script>
/**
 * Spherical Conway's Game of Life - Visual Revision
 * 
 * Key changes:
 * 1. Dynamic color palette based on cell age (Hot Pink/Orange -> Deep Violet).
 * 2. Canvas Composite Operations for Bloom/Glow effect.
 * 3. Updated Layout logic (Centered Sphere).
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 3500, // High density
  sphereRadius: 280,
  cellSizeBase: 2.5,
  rotationSpeed: 0.0015,
  colors: {
    bg: '#050508'
  }
};

// --- State ---
let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 15,
  lastFrameTime: 0,
  rotation: { x: 0, y: 0 },
  zoom: 1.2, // Initial zoom to fit screen better
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  add: (v1, v2) => ({ x: v1.x + v2.x, y: v1.y + v2.y, z: v1.z + v2.z }),
  sub: (v1, v2) => ({ x: v1.x - v2.x, y: v1.y - v2.y, z: v1.z - v2.z }),
  dot: (v1, v2) => v1.x * v2.x + v1.y * v2.y + v1.z * v2.z,
  len: (v) => Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z),
  dist: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return Math.sqrt(dx*dx + dy*dy + dz*dz);
  }
};

// --- Initialization ---

function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2;
    const radiusAtY = Math.sqrt(1 - y * y);
    const theta = goldenAngle * i;
    points.push({
      x: Math.cos(theta) * radiusAtY * radius,
      y: y * radius,
      z: Math.sin(theta) * radiusAtY * radius,
      idx: i
    });
  }
  return points;
}

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Neighbor search optimization:
  // Since points are generated in a specific order (Fibonacci), neighbors are usually 
  // within a small index range or wrapped around. But brute force distance check 
  // is safest for correctness on a sphere.
  
  // Calculate approximate nearest neighbor distance for threshold
  // Area = 4*pi*r^2. Density = count/Area. Dist ~ sqrt(1/Density)
  const area = 4 * Math.PI * CONFIG.sphereRadius * CONFIG.sphereRadius;
  const threshold = Math.sqrt(area / CONFIG.cellCount) * 1.1; 

  state.cells = points.map((p, i) => {
    const neighbors = [];
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      // Optimization: Early exit if Y diff is too large
      if (Math.abs(p.y - points[j].y) > threshold) continue;
      
      const d = Vec3.dist(p, points[j]);
      if (d < threshold) {
        neighbors.push(j);
      }
    }
    
    return {
      pos: p,
      idx: i,
      neighbors: neighbors,
      alive: Math.random() > 0.65, // Higher density start
      age: 0, // How many frames it has been alive
      bornGen: 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

// --- Game Logic ---

function stepGame() {
  // Snapshot current state for neighbor counting
  const currentAlive = state.cells.map(c => c.alive);
  
  state.cells.forEach((cell, i) => {
    // Count alive neighbors
    let aliveNeighbors = 0;
    for (let k = 0; k < cell.neighbors.length; k++) {
      if (currentAlive[cell.neighbors[k]]) aliveNeighbors++;
    }

    const isAlive = cell.alive;
    let nextAlive = false;

    if (isAlive) {
      if (aliveNeighbors === 2 || aliveNeighbors === 3) nextAlive = true;
    } else {
      if (aliveNeighbors === 3) nextAlive = true;
    }

    cell.alive = nextAlive;
    
    if (nextAlive) {
      if (!isAlive) {
        // Just born
        cell.age = 0;
        cell.bornGen = state.generation;
      } else {
        // Survived
        cell.age++;
      }
    } else {
      // Died
      cell.age = 0;
    }
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotation Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotation X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective projection
  const fov = 900;
  const scale = (fov / (fov + zFinal)) * zoom;
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // 1. Clear Background (Solid)
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0, 0, width, height);

  // 2. Sort cells by Z (Painter's Algorithm)
  // We need to project them first to know Z
  const projectedCells = state.cells.map(cell => {
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    return { cell, proj };
  });
  
  // Sort back to front
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // 3. Draw Sphere Atmosphere (The "Glow" behind the sphere)
  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;
  
  const grad = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 1.3);
  grad.addColorStop(0, 'rgba(20, 30, 50, 0.0)');
  grad.addColorStop(0.8, 'rgba(10, 10, 20, 0.3)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
  
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.3, 0, Math.PI * 2);
  ctx.fill();

  // 4. Draw Cells
  // Use 'lighter' composite operation for additive blending (Bloom effect)
  ctx.globalCompositeOperation = 'lighter';

  projectedCells.forEach(({ cell, proj }) => {
    // Culling: Don't draw if behind the sphere center (optional, but looks cleaner)
    // Keeping it slightly visible for "glass" look, but dimmed.
    const isBack = proj.z > 0;
    
    if (!cell.alive) return; // Only draw alive cells for performance & visual clarity

    const size = CONFIG.cellSizeBase * proj.scale;
    
    // Color Logic: Age Mapping
    // Age 0 (New) = Hot Pink/Orange
    // Age 50+ (Old) = Deep Violet/Blue
    // We use HSL. 
    // Hue: Start ~340 (Pink) -> Move to ~260 (Violet/Blue)
    
    // Clamp age for color cycle
    const ageFactor = Math.min(cell.age, 60) / 60; // 0 to 1
    
    const hue = 340 - (ageFactor * 90); // 340 -> 250
    const saturation = 100;
    const lightness = 60 - (ageFactor * 20); // 60% -> 40% (gets darker as it ages)
    
    // Depth fog: Back cells are dimmer
    const alpha = isBack ? 0.3 : 1.0;
    
    ctx.fillStyle = `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`;
    
    // Glow effect: Draw a larger, dimmer circle behind the main dot
    if (!isBack && size > 1.5) {
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, size * 3, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha * 0.2})`;
      ctx.fill();
    }

    // Main cell
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
  });

  // Reset composite operation
  ctx.globalCompositeOperation = 'source-over';
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    state.rotation.y += CONFIG.rotationSpeed;
    
    // Throttle logic updates based on speed setting
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  const pop = state.cells.filter(c => c.alive).length;
  // Pad numbers for consistent width
  document.getElementById('gen-count').innerText = state.generation.toString().padStart(4, '0');
  document.getElementById('pop-count').innerText = pop.toString().padStart(4, '0');
}

// Controls
document.getElementById('btn-pause').addEventListener('click', (e) => {
  state.isRunning = !state.isRunning;
  e.target.innerText = state.isRunning ? "Pause" : "Resume";
  e.target.classList.toggle('primary');
  e.target.classList.toggle('danger'); // Toggle visual style
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  document.getElementById('btn-pause').innerText = "Resume";
  document.getElementById('btn-pause').classList.remove('primary');
  document.getElementById('btn-pause').classList.add('danger');
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
  document.getElementById('speed-val').innerText = state.speed + " FPS";
});

// Mouse Drag Rotation
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.6, Math.min(2.5, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
