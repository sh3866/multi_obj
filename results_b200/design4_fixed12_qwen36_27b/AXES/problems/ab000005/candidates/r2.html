<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless - Premium Cleaning Service</title>
    <style>
        :root {
            /* Palette Update: Warm, Creamy, Sophisticated */
            --bg-color: #F9F7F2; /* Alabaster/Cream base */
            --sidebar-bg: #FFFFFF;
            --text-main: #2A2622; /* Deep warm charcoal */
            --text-muted: #78716C; /* Warm grey */
            --accent-terra: #C05621; /* Terracotta */
            --accent-terra-hover: #9C4219;
            --accent-gold: #D69E2E;
            
            /* Typography */
            --font-serif: "Playfair Display", "Didot", "Georgia", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
        }

        /* Layout Container */
        .container {
            display: grid;
            grid-template-columns: 450px 1fr;
            width: 100%;
            height: 100vh;
            max-width: 1800px;
            margin: 0 auto;
            box-shadow: 0 0 120px rgba(0,0,0,0.04);
        }

        /* Left Panel: UI & Typography */
        .sidebar {
            padding: 80px 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--sidebar-bg);
            border-right: 1px solid rgba(0,0,0,0.04);
            z-index: 10;
            position: relative;
        }

        .brand {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 80px; /* Spacing Rhythm */
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 12px;
            height: 12px;
            background: var(--accent-terra);
            border-radius: 50%;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 64px;
            line-height: 1.05;
            color: var(--text-main);
            margin: 0 0 48px 0; /* Fixed 48px Rhythm */
            font-weight: 700; /* CRITIQUE: Increased weight for authority */
            letter-spacing: -1px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 64px; /* Fixed 64px Rhythm */
            max-width: 360px;
            font-weight: 400;
        }

        /* CRITIQUE: Stats Alignment & Grouping */
        .stats {
            display: flex;
            gap: 60px; /* Tightened gap for cohesive unit */
            margin-bottom: 64px; /* Fixed 64px Rhythm */
            padding-bottom: 40px;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            align-items: baseline; /* Ensures numbers align perfectly */
        }

        .stat-item h3 {
            font-family: var(--font-serif);
            font-size: 40px;
            margin: 0;
            color: var(--text-main);
            font-weight: 600;
            line-height: 1;
        }

        .stat-item span {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 12px;
            display: block;
            font-weight: 500;
        }

        .cta-button {
            background-color: var(--accent-terra);
            color: #fff;
            border: none;
            padding: 24px 40px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: fit-content;
            box-shadow: 0 10px 25px rgba(192, 86, 33, 0.25);
        }

        .cta-button:hover {
            background-color: var(--accent-terra-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(192, 86, 33, 0.35);
        }

        /* Right Panel: The Scene */
        .scene-container {
            position: relative;
            /* CRITIQUE: Warm Alabaster/Cream Radial Gradient */
            background: radial-gradient(circle at 70% 40%, #FFFFFF 0%, #F3EFE6 100%);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG Styling */
        svg {
            width: 100%;
            height: 100%;
            max-width: 1400px;
            display: block;
        }

        /* Animations */
        @keyframes sway {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(1.2deg); }
            100% { transform: rotate(0deg); }
        }

        .mop-group {
            /* CRITIQUE: Adjusted pivot for new position */
            transform-origin: 450px 150px; 
            animation: sway 7s infinite ease-in-out;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.7; }
            100% { transform: translateY(-60px) scale(1.3); opacity: 0; }
        }

        .bubble {
            animation: floatUp 6s infinite ease-in;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="brand">Spotless Co.</div>
        
        <h1>Clarity in<br>every corner.</h1>
        
        <p>Experience the difference of a deep clean. We restore the natural warmth of your home with eco-friendly solutions and meticulous care.</p>
        
        <div class="stats">
            <div class="stat-item">
                <h3>99%</h3>
                <span>Efficiency</span>
            </div>
            <div class="stat-item">
                <h3>100%</h3>
                <span>Eco-Friendly</span>
            </div>
        </div>

        <button class="cta-button">Book a Clean</button>
    </div>

    <!-- Right Visual Scene -->
    <div class="scene-container">
        <!-- Main SVG Graphic -->
        <svg viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Noise Filter for Texture -->
                <filter id="floorNoise">
                    <feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="4" result="noise"/>
                    <feColorMatrix type="matrix" values="0 0 0 0 0.96  0 0 0 0 0.94  0 0 0 0 0.90  0 0 0 0.06 0" in="noise" result="coloredNoise"/>
                </filter>

                <!-- Drop Shadow for Grounding -->
                <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
                    <feOffset dx="8" dy="20" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.2"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <!-- Blur for Liquid Depth -->
                <filter id="liquidBlur">
                    <feGaussianBlur stdDeviation="2" />
                </filter>

                <!-- CRITIQUE: Rich Translucent Amber Gradient -->
                <radialGradient id="spillGrad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
                    <stop offset="0%" style="stop-color:#FDE68A;stop-opacity:0.9" /> <!-- Honey highlight -->
                    <stop offset="40%" style="stop-color:#D97706;stop-opacity:0.85" /> <!-- Amber -->
                    <stop offset="80%" style="stop-color:#92400E;stop-opacity:0.8" /> <!-- Deep Brown -->
                    <stop offset="100%" style="stop-color:#78350F;stop-opacity:0.5" /> <!-- Edge fade -->
                </radialGradient>

                <!-- CRITIQUE: Deep Teal/Navy Mop Gradient -->
                <linearGradient id="mopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#0F766E;stop-opacity:1" /> <!-- Deep Teal -->
                    <stop offset="60%" style="stop-color:#115E59;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#134E4A;stop-opacity:1" /> <!-- Navy-ish Teal -->
                </linearGradient>

                <!-- Wood Handle Gradient -->
                <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#57534E;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#44403C;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#292524;stop-opacity:1" />
                </linearGradient>
                
                <!-- Specular Highlight Gradient -->
                <linearGradient id="specular" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
                    <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
                </linearGradient>
            </defs>

            <!-- 1. Background / Floor -->
            <rect width="100%" height="100%" fill="transparent" />
            
            <!-- CRITIQUE: Distinct Floor Plane with Texture -->
            <g opacity="0.8">
                <!-- Floor Base Shadow -->
                <ellipse cx="600" cy="750" rx="700" ry="250" fill="#EBE7DF" opacity="0.6" filter="blur(20px)"/>
                <!-- Wood Grain/Tile Overlay -->
                <rect width="100%" height="100%" fill="url(#floorNoise)" style="mix-blend-mode: multiply;" opacity="0.5" />
            </g>

            <!-- 2. The Spill (CRITIQUE: Shifted Up ~15%, Realism) -->
            <!-- Positioned higher to align with headline -->
            <g transform="translate(450, 420)">
                
                <!-- Main puddle: Irregular organic path -->
                <path d="M0,0 C60,-40 180,-30 240,20 C300,70 280,150 180,170 C80,190 -30,170 -70,90 C-110,10 -70,-40 0,0 Z" 
                      fill="url(#spillGrad)" />
                
                <!-- CRITIQUE: Specular Highlights (White Reflections) -->
                <ellipse cx="120" cy="60" rx="40" ry="10" fill="url(#specular)" transform="rotate(-15 120 60)" opacity="0.6" />
                <path d="M40,100 Q60,120 20,130" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>

                <!-- Inner liquid detail -->
                <path d="M20,20 C70,-20 170,-10 220,30 C260,70 240,130 160,150 C70,170 -10,150 -50,80 C-80,10 -50,-20 20,20 Z" 
                      fill="none" stroke="#FDE68A" stroke-width="1.5" opacity="0.3" filter="url(#liquidBlur)" />

                <!-- Splatter drops -->
                <circle cx="270" cy="40" r="6" fill="#D97706" opacity="0.8" />
                <circle cx="290" cy="25" r="3" fill="#D97706" opacity="0.6" />
                <circle cx="-50" cy="140" r="8" fill="#92400E" opacity="0.5" />
                <circle cx="-20" cy="170" r="2" fill="#92400E" opacity="0.4" />
                <circle cx="280" cy="110" r="5" fill="#D97706" opacity="0.7" />
            </g>

            <!-- 3. The Mop (CRITIQUE: Shifted Up, Navy/Teal, Clumped) -->
            <g class="mop-group" filter="url(#dropShadow)">
                <!-- Handle -->
                <line x1="700" y1="100" x2="480" y2="420" stroke="url(#handleGrad)" stroke-width="12" stroke-linecap="round" />
                
                <!-- Metal Joint -->
                <circle cx="480" cy="420" r="14" fill="#292524" />
                <circle cx="480" cy="420" r="8" fill="#57534E" />

                <!-- Mop Head Base -->
                <ellipse cx="480" cy="435" rx="55" ry="18" fill="#1C1917" />

                <!-- CRITIQUE: Clumped Bristles (Wet Fabric Look) -->
                <g stroke="url(#mopGrad)" stroke-width="7" stroke-linecap="round">
                    <!-- Left Clump (Into spill) -->
                    <path d="M460,435 Q440,490 400,540" />
                    <path d="M470,435 Q450,500 415,550" />
                    <path d="M450,435 Q420,510 380,560" />
                    <path d="M465,435 Q430,520 390,570" stroke-width="5" />

                    <!-- Right Clump -->
                    <path d="M500,435 Q520,490 560,540" />
                    <path d="M490,435 Q510,500 545,550" />
                    <path d="M510,435 Q540,510 580,560" />
                    <path d="M495,435 Q530,520 570,570" stroke-width="5" />

                    <!-- Center Messy Strands -->
                    <path d="M480,435 Q490,500 480,580" />
                    <path d="M480,435 Q470,510 460,590" />
                    <path d="M480,435 Q500,500 510,580" />
                    
                    <!-- Texture lines on bristles -->
                    <path d="M460,450 L465,460" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />
                    <path d="M500,450 L495,460" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />
                    <path d="M480,455 L480,465" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />
                </g>
            </g>

            <!-- 4. Soap Bubbles (Dynamic) -->
            <g fill="none" stroke="#FFFFFF" stroke-width="1.5">
                <circle cx="460" cy="480" r="8" class="bubble" style="animation-delay: 0s; opacity: 0.6;" />
                <circle cx="500" cy="510" r="12" class="bubble" style="animation-delay: 1.8s; opacity: 0.5;" />
                <circle cx="430" cy="450" r="5" class="bubble" style="animation-delay: 0.9s; opacity: 0.7;" />
                <circle cx="520" cy="470" r="9" class="bubble" style="animation-delay: 2.5s; opacity: 0.6;" />
            </g>

            <!-- 5. Lighting / Mood -->
            <circle cx="900" cy="200" r="400" fill="#FFF" opacity="0.4" filter="blur(80px)" />
            <circle cx="100" cy="850" r="500" fill="#D69E2E" opacity="0.05" filter="blur(100px)" />
        </svg>
    </div>
</div>

</body>
</html>
