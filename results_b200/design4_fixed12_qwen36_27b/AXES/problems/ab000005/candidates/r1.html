<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless - Premium Cleaning Service</title>
    <style>
        :root {
            /* Palette Update: Warm, Creamy, Sophisticated */
            --bg-color: #FDFBF7; /* Updated: Warm off-white */
            --sidebar-bg: #FFFFFF;
            --text-main: #2D2A26; /* Soft Black */
            --text-muted: #6B655E; /* Warm Grey */
            --accent-terra: #C05621; /* Terracotta */
            --accent-terra-hover: #9C4219;
            --accent-gold: #D69E2E;
            --font-serif: "Playfair Display", "Didot", "Georgia", serif; /* Elegant Serif */
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
        }

        /* Layout Container */
        .container {
            display: grid;
            grid-template-columns: 400px 1fr;
            width: 100%;
            height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
            box-shadow: 0 0 100px rgba(0,0,0,0.03);
        }

        /* Left Panel: UI & Typography */
        .sidebar {
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--sidebar-bg);
            border-right: 1px solid rgba(0,0,0,0.03);
            z-index: 10;
            position: relative;
        }

        .brand {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 10px;
            height: 10px;
            background: var(--accent-terra);
            border-radius: 50%;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 56px;
            line-height: 1.1;
            color: var(--text-main);
            margin: 0 0 30px 0;
            font-weight: 400; /* Elegant weight */
            letter-spacing: -0.5px;
        }

        p {
            font-size: 17px;
            line-height: 1.7;
            color: var(--text-muted);
            margin-bottom: 50px;
            max-width: 340px;
            font-weight: 300;
        }

        .stats {
            display: flex;
            gap: 50px;
            margin-bottom: 40px; /* Reduced space, button moves up */
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .stat-item h3 {
            font-family: var(--font-serif);
            font-size: 36px;
            margin: 0;
            color: var(--text-main);
            font-weight: 400;
        }

        .stat-item span {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 5px;
            display: block;
        }

        .cta-button {
            background-color: var(--accent-terra); /* Warm Terracotta */
            color: #fff;
            border: none;
            padding: 20px 36px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 6px; /* Slightly softer radius */
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: fit-content;
            box-shadow: 0 4px 15px rgba(192, 86, 33, 0.2);
        }

        .cta-button:hover {
            background-color: var(--accent-terra-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(192, 86, 33, 0.3);
        }

        /* Right Panel: The Scene */
        .scene-container {
            position: relative;
            background-color: var(--bg-color);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG Styling */
        svg {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            display: block;
        }

        /* Animations */
        @keyframes sway {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(1.5deg); }
            100% { transform: rotate(0deg); }
        }

        .mop-group {
            transform-origin: 400px 300px; /* Pivot point at handle top */
            animation: sway 6s infinite ease-in-out;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.6; }
            100% { transform: translateY(-50px) scale(1.2); opacity: 0; }
        }

        .bubble {
            animation: floatUp 5s infinite ease-in;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="brand">Spotless Co.</div>
        
        <h1>Clarity in<br>every corner.</h1>
        
        <p>Experience the difference of a deep clean. We restore the natural warmth of your home with eco-friendly solutions and meticulous care.</p>
        
        <div class="stats">
            <div class="stat-item">
                <h3>99%</h3>
                <span>Efficiency</span>
            </div>
            <div class="stat-item">
                <h3>100%</h3>
                <span>Eco-Friendly</span>
            </div>
        </div>

        <button class="cta-button">Book a Clean</button>
    </div>

    <!-- Right Visual Scene -->
    <div class="scene-container">
        <!-- Main SVG Graphic -->
        <svg viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Noise Filter for Texture -->
                <filter id="floorNoise">
                    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise"/>
                    <feColorMatrix type="matrix" values="0 0 0 0 0.95  0 0 0 0 0.92  0 0 0 0 0.88  0 0 0 0.08 0" in="noise" result="coloredNoise"/>
                </filter>

                <!-- Drop Shadow for Grounding -->
                <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
                    <feOffset dx="10" dy="25" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.15"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <!-- Blurry Shadow for Puddle -->
                <filter id="blurShadow">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/>
                    <feOffset dx="5" dy="10" result="offsetBlur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.3"/>
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <!-- Honey/Amber Gradient for Spill -->
                <radialGradient id="spillGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
                    <stop offset="0%" style="stop-color:#F6E05E;stop-opacity:0.95" />
                    <stop offset="40%" style="stop-color:#D69E2E;stop-opacity:0.9" />
                    <stop offset="80%" style="stop-color:#975A16;stop-opacity:0.8" />
                    <stop offset="100%" style="stop-color:#744210;stop-opacity:0.6" />
                </radialGradient>

                <!-- Mop Head Gradient -->
                <linearGradient id="mopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#BEE3F8;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#63B3ED;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#2B6CB0;stop-opacity:1" />
                </linearGradient>

                <!-- Wood Handle Gradient -->
                <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#4A5568;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#2D3748;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#1A202C;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- 1. Background / Floor -->
            <rect width="100%" height="100%" fill="#FDFBF7" />
            <!-- Apply Noise Texture -->
            <rect width="100%" height="100%" fill="url(#floorNoise)" opacity="0.6" style="mix-blend-mode: multiply;" />

            <!-- 2. The Spill (Organic Shape, Grounded) -->
            <!-- Positioned Center-Left to anchor the composition -->
            <g transform="translate(350, 550)" filter="url(#blurShadow)">
                <!-- Main puddle: Irregular organic path -->
                <path d="M0,0 C80,-50 200,-40 260,10 C320,60 300,160 200,180 C100,200 -40,180 -80,100 C-120,20 -80,-50 0,0 Z" 
                      fill="url(#spillGrad)" />
                
                <!-- Inner liquid detail/highlight -->
                <path d="M20,20 C90,-30 190,-20 240,20 C280,60 260,140 180,160 C90,180 -20,160 -60,90 C-90,20 -60,-30 20,20 Z" 
                      fill="none" stroke="#F6E05E" stroke-width="2" opacity="0.4" />

                <!-- Splatter drops (various opacities) -->
                <circle cx="280" cy="30" r="8" fill="#D69E2E" opacity="0.8" />
                <circle cx="300" cy="15" r="4" fill="#D69E2E" opacity="0.6" />
                <circle cx="-60" cy="150" r="10" fill="#975A16" opacity="0.5" />
                <circle cx="-30" cy="180" r="3" fill="#975A16" opacity="0.4" />
                <circle cx="310" cy="120" r="6" fill="#D69E2E" opacity="0.7" />
            </g>

            <!-- 3. The Mop (Shifted to overlap spill) -->
            <g class="mop-group" filter="url(#dropShadow)">
                <!-- Handle (Repositioned: Top Right to Bottom Left) -->
                <line x1="650" y1="100" x2="400" y2="500" stroke="url(#handleGrad)" stroke-width="10" stroke-linecap="round" />
                
                <!-- Metal Joint -->
                <circle cx="400" cy="500" r="12" fill="#2D3748" />
                <circle cx="400" cy="500" r="6" fill="#718096" />

                <!-- Mop Head Base (Rubber disc) -->
                <ellipse cx="400" cy="510" rx="50" ry="15" fill="#1A202C" />

                <!-- Mop Strands (Organic curves, pointing towards spill) -->
                <g stroke="url(#mopGrad)" stroke-width="6" stroke-linecap="round">
                    <!-- Center strands -->
                    <path d="M400,510 Q410,560 390,620" />
                    <path d="M400,510 Q390,560 410,625" />
                    <path d="M400,510 Q415,560 400,630" />
                    
                    <!-- Left strands (reaching into spill) -->
                    <path d="M385,510 Q370,570 340,630" />
                    <path d="M390,510 Q360,570 355,635" />
                    <path d="M375,510 Q340,570 310,620" />
                    <path d="M380,510 Q335,570 300,600" />

                    <!-- Right strands -->
                    <path d="M415,510 Q430,570 460,630" />
                    <path d="M410,510 Q440,570 445,635" />
                    <path d="M425,510 Q460,570 490,620" />
                    <path d="M420,510 Q465,570 500,600" />

                    <!-- Volume/Highlight strands -->
                    <path d="M395,510 Q410,580 430,640" stroke="#63B3ED" stroke-width="3" opacity="0.6"/>
                    <path d="M405,510 Q380,580 370,640" stroke="#63B3ED" stroke-width="3" opacity="0.6"/>
                </g>
            </g>

            <!-- 4. Soap Bubbles (Dynamic, overlapping) -->
            <g fill="none" stroke="#FFFFFF" stroke-width="1.5">
                <!-- Bubbles floating up from the mop head/spill area -->
                <circle cx="380" cy="580" r="6" class="bubble" style="animation-delay: 0s; opacity: 0.5;" />
                <circle cx="420" cy="600" r="10" class="bubble" style="animation-delay: 1.5s; opacity: 0.4;" />
                <circle cx="350" cy="550" r="4" class="bubble" style="animation-delay: 0.8s; opacity: 0.6;" />
                <circle cx="440" cy="560" r="7" class="bubble" style="animation-delay: 2.2s; opacity: 0.5;" />
            </g>

            <!-- 5. Lighting / Mood (Warm Vignette) -->
            <circle cx="850" cy="150" r="300" fill="#FFF" opacity="0.3" filter="blur(60px)" />
            <circle cx="100" cy="850" r="400" fill="#F6E05E" opacity="0.05" filter="blur(80px)" />
        </svg>
    </div>
</div>

</body>
</html>
