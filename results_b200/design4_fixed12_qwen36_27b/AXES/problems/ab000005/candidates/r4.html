<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless - Premium Cleaning Service</title>
    <style>
        :root {
            /* Palette: Warm, Earthy, Sophisticated */
            --text-main: #2D1A08; /* Deep Espresso - High contrast against warm floor */
            --text-muted: #5C4033; /* Warm Brown */
            --accent-terra: #C05621; /* Terracotta */
            --accent-terra-hover: #9C4219;
            
            /* Typography */
            --font-serif: "Playfair Display", "Didot", "Georgia", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2D1A08; /* Fallback */
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
        }

        /* Layout: Full Screen Immersive */
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: block;
            overflow: hidden;
        }

        /* The Scene: Background Layer */
        .scene-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: #E6D5B8; /* Base Amber */
        }

        /* The Content: Floating over the scene */
        .content-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to background if needed */
        }

        /* Right-Aligned Layout */
        .sidebar {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            padding: 120px 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end; /* Right align text */
            text-align: right;
            pointer-events: auto; /* Re-enable clicks for text/buttons */
        }

        .brand {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-main);
            margin-bottom: 64px; /* 24px * ~2.5 */
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            opacity: 0.9;
        }

        .brand::after {
            content: '';
            display: block;
            width: 10px;
            height: 10px;
            background: var(--accent-terra);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(192, 86, 33, 0.4);
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 96px; /* Massive scale */
            line-height: 0.9;
            color: var(--text-main);
            margin: 0 0 32px 0; /* 32px baseline rhythm */
            font-weight: 700;
            letter-spacing: -0.03em;
            text-shadow: 0 10px 30px rgba(255,255,255,0.1); /* Slight lift from texture */
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            color: var(--text-main);
            margin-bottom: 64px;
            max-width: 480px;
            font-weight: 500;
            opacity: 0.9;
        }

        /* Stats: Grouped visual unit, tight horizontal spacing */
        .stats {
            display: flex;
            gap: 60px; /* Tighter grouping */
            margin-bottom: 80px;
            align-items: baseline;
            border-bottom: 1px solid rgba(45, 26, 8, 0.15);
            padding-bottom: 40px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* Right align numbers */
        }

        .stat-item h3 {
            font-family: var(--font-serif);
            font-size: 42px;
            margin: 0;
            color: var(--text-main);
            font-weight: 600;
            line-height: 1;
        }

        .stat-item span {
            font-size: 12px;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 12px;
            font-weight: 600;
            opacity: 0.7;
        }

        .cta-button {
            background-color: var(--accent-terra);
            color: #fff;
            border: none;
            padding: 24px 56px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 15px 35px rgba(192, 86, 33, 0.3);
            position: relative;
            overflow: hidden;
        }

        .cta-button:hover {
            background-color: var(--accent-terra-hover);
            transform: translateY(-3px);
            box-shadow: 0 20px 45px rgba(192, 86, 33, 0.4);
        }

        /* SVG Styling */
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Animations */
        @keyframes sway {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(1.5deg); }
            100% { transform: rotate(0deg); }
        }

        .mop-group {
            transform-origin: 350px 150px; /* Pivot near top of handle */
            animation: sway 12s infinite ease-in-out;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.7; }
            100% { transform: translateY(-100px) scale(1.8); opacity: 0; }
        }

        .bubble {
            animation: floatUp 6s infinite ease-in;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 1024px) {
            .sidebar {
                width: 100%;
                align-items: flex-start;
                text-align: left;
                padding: 80px 60px;
                background: linear-gradient(to top, rgba(230, 213, 184, 0.9), rgba(230, 213, 184, 0.6));
            }
            h1 { font-size: 64px; }
            .stats { gap: 40px; }
            .stat-item { align-items: flex-start; }
            .brand { justify-content: flex-start; }
            .brand::after { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- The Scene: Full Background SVG -->
    <div class="scene-background">
        <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- 1. Advanced Wood/Stone Texture -->
                <filter id="floorTexture" x="0" y="0" width="100%" height="100%">
                    <!-- Layer 1: Large grain -->
                    <feTurbulence type="fractalNoise" baseFrequency="0.005 0.001" numOctaves="4" result="noise1" />
                    <!-- Layer 2: Fine grain -->
                    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.01" numOctaves="2" result="noise2" />
                    <!-- Combine -->
                    <feBlend in="noise1" in2="noise2" mode="multiply" result="combinedNoise" />
                    <!-- Colorize: Warm Oak -->
                    <feColorMatrix type="matrix" values="
                        0.5 0 0 0 0.9
                        0.4 0 0 0 0.8
                        0.2 0 0 0 0.6
                        0   0 0 0.15 0" in="combinedNoise" result="coloredNoise" />
                    <!-- Soften -->
                    <feGaussianBlur stdDeviation="4" in="coloredNoise" result="blurredNoise" />
                    <!-- Overlay -->
                    <feBlend in="SourceGraphic" in2="blurredNoise" mode="multiply" />
                </filter>

                <!-- 2. Liquid Sheen Filter (Glow) -->
                <filter id="liquidGlow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="6" result="blur" />
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.5"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <!-- 3. Wood Handle Texture -->
                <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#5C4033;stop-opacity:1" />
                    <stop offset="20%" style="stop-color:#8B5A2B;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#5C4033;stop-opacity:1" />
                    <stop offset="80%" style="stop-color:#3E2723;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#2D1A08;stop-opacity:1" />
                </linearGradient>

                <!-- 4. Liquid Gradient: Terracotta/Amber -->
                <radialGradient id="spillGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
                    <stop offset="0%" style="stop-color:#FDE68A;stop-opacity:0.9" /> <!-- Highlight -->
                    <stop offset="30%" style="stop-color:#C05621;stop-opacity:0.85" /> <!-- Core Color -->
                    <stop offset="70%" style="stop-color:#78350F;stop-opacity:0.9" /> <!-- Deep Edge -->
                    <stop offset="100%" style="stop-color:#451A03;stop-opacity:0.2" /> <!-- Fade -->
                </radialGradient>

                <!-- 5. Mop Head Texture -->
                <linearGradient id="mopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#1A3C40;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#051416;stop-opacity:1" />
                </linearGradient>
                
                <!-- Vignette -->
                <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
                    <stop offset="50%" stop-color="#000" stop-opacity="0"/>
                    <stop offset="100%" stop-color="#1A0F05" stop-opacity="0.6"/>
                </radialGradient>
            </defs>

            <!-- 1. Background: Textured Floor -->
            <rect width="100%" height="100%" fill="#E6D5B8" filter="url(#floorTexture)" />
            
            <!-- Lighting overlay -->
            <rect width="100%" height="100%" fill="url(#vignette)" style="mix-blend-mode: multiply;"/>

            <!-- 2. The Spill: Organic, messy, positioned bottom left -->
            <g transform="translate(250, 750)" filter="url(#liquidGlow)">
                <!-- Main puddle -->
                <path d="M0,0 
                         C60,-50 180,-60 260,-10 
                         C340,40 380,140 300,200 
                         C220,260 80,280 -10,200 
                         C-100,120 -80,20 0,0 Z" 
                      fill="url(#spillGrad)" />
                
                <!-- Secondary splash -->
                <path d="M280,180 
                         C320,160 380,190 400,240 
                         C360,280 300,260 260,220 Z" 
                      fill="url(#spillGrad)" opacity="0.8" />

                <!-- Specular Highlights (Wet look) -->
                <path d="M50,50 Q100,40 150,60" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.4" filter="blur(3px)" />
                <path d="M280,190 Q300,185 320,195" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5" filter="blur(2px)" />

                <!-- Droplets -->
                <circle cx="420" cy="200" r="12" fill="#C05621" opacity="0.8" />
                <circle cx="440" cy="220" r="6" fill="#C05621" opacity="0.6" />
                <circle cx="-40" cy="240" r="14" fill="#78350F" opacity="0.7" />
                <circle cx="-60" cy="220" r="8" fill="#78350F" opacity="0.5" />
            </g>

            <!-- 3. The Mop: Diagonal Leading Line (Bottom Left to Top Right) -->
            <g class="mop-group">
                <!-- Drop Shadow for Mop -->
                <filter id="mopShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="10"/>
                    <feOffset dx="-15" dy="20" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.3"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <g filter="url(#mopShadow)">
                    <!-- Handle: Angled from Bottom Left (Mop Head) to Top Right (Hand) -->
                    <!-- Head at approx 350, 800. Hand at approx 1300, 100 -->
                    <line x1="350" y1="800" x2="1300" y2="100" stroke="url(#handleGrad)" stroke-width="16" stroke-linecap="round" />
                    
                    <!-- Handle Detail (Rivets) -->
                    <circle cx="600" cy="590" r="3" fill="#2D1A08" opacity="0.5" />
                    <circle cx="850" cy="380" r="3" fill="#2D1A08" opacity="0.5" />
                    <circle cx="1100" cy="170" r="3" fill="#2D1A08" opacity="0.5" />

                    <!-- Metal Joint -->
                    <circle cx="350" cy="800" r="22" fill="#44403C" />
                    <circle cx="350" cy="800" r="12" fill="#1C1917" />

                    <!-- Mop Head Base -->
                    <ellipse cx="350" cy="820" rx="70" ry="25" fill="#1C1917" transform="rotate(-10 350 820)" />

                    <!-- Bristles: Splayed and messy -->
                    <g stroke="url(#mopGrad)" stroke-width="7" stroke-linecap="round">
                        <!-- Left Splay -->
                        <path d="M330,820 Q280,880 250,940" />
                        <path d="M340,820 Q290,890 260,960" />
                        <path d="M320,820 Q260,870 230,920" stroke-width="5" />
                        
                        <!-- Right Splay (Overlapping spill) -->
                        <path d="M370,820 Q420,880 450,940" />
                        <path d="M360,820 Q410,890 440,960" />
                        <path d="M380,820 Q440,870 470,920" stroke-width="5" />

                        <!-- Center Heavy Strands -->
                        <path d="M350,820 Q360,900 350,980" />
                        <path d="M350,820 Q340,910 330,990" />
                        <path d="M350,820 Q370,900 380,970" />
                        
                        <!-- Wet/Dirty Strands (Lighter color to show wetness) -->
                        <path d="M350,820 Q355,880 350,950" stroke="#2A5C60" stroke-width="3" />
                    </g>
                </g>
            </g>

            <!-- 4. Soap Bubbles -->
            <g fill="none" stroke="#FFFFFF" stroke-width="1.5">
                <circle cx="300" cy="780" r="10" class="bubble" style="animation-delay: 0s; opacity: 0.6;" />
                <circle cx="380" cy="850" r="14" class="bubble" style="animation-delay: 2s; opacity: 0.5;" />
                <circle cx="260" cy="820" r="7" class="bubble" style="animation-delay: 1s; opacity: 0.8;" />
                <circle cx="420" cy="760" r="11" class="bubble" style="animation-delay: 3s; opacity: 0.7;" />
            </g>
        </svg>
    </div>

    <!-- The Content: Overlay -->
    <div class="content-overlay">
        <div class="sidebar">
            <div class="brand">Spotless Co.</div>
            
            <h1>Clarity in<br>every corner.</h1>
            
            <p>Experience the difference of a deep clean. We restore the natural warmth of your home with eco-friendly solutions and meticulous care.</p>
            
            <div class="stats">
                <div class="stat-item">
                    <h3>99%</h3>
                    <span>Efficiency</span>
                </div>
                <div class="stat-item">
                    <h3>100%</h3>
                    <span>Eco-Friendly</span>
                </div>
            </div>

            <button class="cta-button">Book a Clean</button>
        </div>
    </div>
</div>

</body>
</html>
