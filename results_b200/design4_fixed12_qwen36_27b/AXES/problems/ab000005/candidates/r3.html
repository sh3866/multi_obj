<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless - Premium Cleaning Service</title>
    <style>
        :root {
            /* Palette: Warm, Earthy, Sophisticated */
            --bg-color: #FDFCF8; 
            --sidebar-bg: #FDFCF8;
            --text-main: #2D2420; /* Deep Charcoal/Brown */
            --text-muted: #5C524A; 
            --accent-terra: #C05621; 
            --accent-terra-hover: #9C4219;
            
            /* Typography */
            --font-serif: "Playfair Display", "Didot", "Georgia", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
        }

        /* Layout Container */
        .container {
            display: grid;
            grid-template-columns: 500px 1fr;
            width: 100%;
            height: 100vh;
            max-width: 1920px;
            margin: 0 auto;
        }

        /* Left Panel: UI & Typography */
        .sidebar {
            padding: 100px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--sidebar-bg);
            position: relative;
            z-index: 10;
        }

        .brand {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 120px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            background: var(--accent-terra);
            border-radius: 50%;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 72px; /* Significantly increased */
            line-height: 1.0;
            color: var(--text-main);
            margin: 0 0 24px 0; /* Tightened vertical gap */
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 19px;
            line-height: 1.5;
            color: var(--text-main); /* Changed from grey to charcoal for contrast */
            margin-bottom: 80px;
            max-width: 380px;
            font-weight: 400;
            opacity: 0.85;
        }

        /* Stats: Grouped visual unit */
        .stats {
            display: flex;
            gap: 40px;
            margin-bottom: 100px; /* Increased bottom padding to anchor */
            padding-bottom: 40px;
            border-bottom: 1px solid rgba(45, 36, 32, 0.1);
            align-items: baseline;
        }

        .stat-item h3 {
            font-family: var(--font-serif);
            font-size: 36px;
            margin: 0;
            color: var(--text-main);
            font-weight: 600;
            line-height: 1;
        }

        .stat-item span {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
            display: block;
            font-weight: 500;
        }

        .cta-button {
            background-color: var(--accent-terra);
            color: #fff;
            border: none;
            padding: 22px 44px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: fit-content;
            box-shadow: 0 10px 30px rgba(192, 86, 33, 0.2);
        }

        .cta-button:hover {
            background-color: var(--accent-terra-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(192, 86, 33, 0.3);
        }

        /* Right Panel: The Scene */
        .scene-container {
            position: relative;
            background-color: #E6D5B8; /* Base Amber */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Animations */
        @keyframes sway {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(0.8deg); }
            100% { transform: rotate(0deg); }
        }

        .mop-group {
            transform-origin: 950px 200px; 
            animation: sway 8s infinite ease-in-out;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
        }

        .bubble {
            animation: floatUp 5s infinite ease-in;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="brand">Spotless Co.</div>
        
        <h1>Clarity in<br>every corner.</h1>
        
        <p>Experience the difference of a deep clean. We restore the natural warmth of your home with eco-friendly solutions and meticulous care.</p>
        
        <div class="stats">
            <div class="stat-item">
                <h3>99%</h3>
                <span>Efficiency</span>
            </div>
            <div class="stat-item">
                <h3>100%</h3>
                <span>Eco-Friendly</span>
            </div>
        </div>

        <button class="cta-button">Book a Clean</button>
    </div>

    <!-- Right Visual Scene -->
    <div class="scene-container">
        <!-- Main SVG Graphic -->
        <svg viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- 1. Floor Texture Filter: Fractal Noise + Color Matrix for Wood Grain -->
                <filter id="woodTexture" x="0" y="0" width="100%" height="100%">
                    <!-- Generate noise -->
                    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.002" numOctaves="3" result="noise" />
                    <!-- Map noise to Amber/Brown tones -->
                    <feColorMatrix type="matrix" values="
                        0.6 0 0 0 0.85
                        0.4 0 0 0 0.75
                        0.2 0 0 0 0.65
                        0   0 0 0.1 0" in="noise" result="coloredNoise" />
                    <!-- Blur slightly to soften grain -->
                    <feGaussianBlur stdDeviation="2" in="coloredNoise" result="blurredNoise" />
                    <!-- Overlay onto background -->
                    <feBlend in="SourceGraphic" in2="blurredNoise" mode="multiply" />
                </filter>

                <!-- 2. Drop Shadow -->
                <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
                    <feOffset dx="5" dy="15" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.15"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <!-- 3. Liquid Gradient: Complex Radial for Specular Highlight -->
                <radialGradient id="spillGrad" cx="40%" cy="40%" r="60%" fx="30%" fy="30%">
                    <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" /> <!-- Sharp Specular -->
                    <stop offset="15%" style="stop-color:#FDE68A;stop-opacity:0.8" /> <!-- Highlight -->
                    <stop offset="45%" style="stop-color:#D97706;stop-opacity:0.85" /> <!-- Main Body -->
                    <stop offset="85%" style="stop-color:#78350F;stop-opacity:0.9" /> <!-- Deep Edge -->
                    <stop offset="100%" style="stop-color:#451A03;stop-opacity:0.4" /> <!-- Fade out -->
                </radialGradient>

                <!-- 4. Mop Bristle Gradient: Deep Forest Green/Navy -->
                <linearGradient id="mopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#1A3C40;stop-opacity:1" /> <!-- Deep Navy/Teal -->
                    <stop offset="50%" style="stop-color:#0F292C;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#051416;stop-opacity:1" /> <!-- Dark Shadow -->
                </linearGradient>
                
                <!-- Wood Handle Gradient -->
                <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#57534E;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#44403C;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#292524;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- 1. Background: Textured Floor -->
            <!-- Base color + Filter applied -->
            <rect width="100%" height="100%" fill="#E6D5B8" filter="url(#woodTexture)" />
            <!-- Subtle vignette for depth -->
            <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
                <stop offset="60%" stop-color="#000" stop-opacity="0"/>
                <stop offset="100%" stop-color="#2D1A08" stop-opacity="0.3"/>
            </radialGradient>
            <rect width="100%" height="100%" fill="url(#vignette)" style="mix-blend-mode: multiply;"/>

            <!-- 2. The Spill: Organic, Irregular, Bottom Right Cluster -->
            <g transform="translate(750, 700)">
                <!-- Main puddle shape: Irregular blob -->
                <path d="M0,0 
                         C40,-60 160,-80 240,-20 
                         C320,40 360,120 280,180 
                         C200,240 60,260 -20,180 
                         C-100,100 -80,20 0,0 Z" 
                      fill="url(#spillGrad)" />
                
                <!-- Meniscus Ring (Thicker Edge) -->
                <path d="M0,0 
                         C40,-60 160,-80 240,-20 
                         C320,40 360,120 280,180 
                         C200,240 60,260 -20,180 
                         C-100,100 -80,20 0,0 Z" 
                      fill="none" stroke="#FDE68A" stroke-width="2" opacity="0.4" />

                <!-- Specular Highlight Detail -->
                <ellipse cx="80" cy="40" rx="60" ry="15" fill="#FFFFFF" transform="rotate(-20 80 40)" opacity="0.4" filter="blur(4px)" />

                <!-- Scattered Droplets (Viscosity) -->
                <circle cx="320" cy="-10" r="8" fill="#D97706" opacity="0.8" />
                <circle cx="340" cy="10" r="4" fill="#D97706" opacity="0.6" />
                <circle cx="-30" cy="200" r="10" fill="#78350F" opacity="0.6" />
                <circle cx="-50" cy="180" r="5" fill="#78350F" opacity="0.4" />
                <circle cx="290" cy="210" r="6" fill="#D97706" opacity="0.7" />
                <circle cx="310" cy="230" r="3" fill="#D97706" opacity="0.5" />
            </g>

            <!-- 3. The Mop: Diagonal Bridge, Physics Applied -->
            <g class="mop-group" filter="url(#dropShadow)">
                <!-- Handle: Angled from Top-Left to Bottom-Right -->
                <!-- Start near headline (approx x=500, y=200) end at floor (x=850, y=750) -->
                <line x1="500" y1="150" x2="860" y2="750" stroke="url(#handleGrad)" stroke-width="14" stroke-linecap="round" />
                
                <!-- Metal Joint -->
                <circle cx="860" cy="750" r="16" fill="#292524" />
                <circle cx="860" cy="750" r="9" fill="#57534E" />

                <!-- Mop Head Base (Hidden mostly by bristles) -->
                <ellipse cx="860" cy="765" rx="60" ry="20" fill="#1C1917" />

                <!-- Bristles: Splayed, bent, Deep Green/Navy -->
                <g stroke="url(#mopGrad)" stroke-width="6" stroke-linecap="round">
                    <!-- Left Splay (Into spill) -->
                    <path d="M845,765 Q810,810 780,850" />
                    <path d="M850,765 Q820,820 790,870" />
                    <path d="M835,765 Q790,830 760,880" />
                    <path d="M840,765 Q780,840 750,890" stroke-width="4" />

                    <!-- Right Splay -->
                    <path d="M875,765 Q910,810 940,850" />
                    <path d="M870,765 Q900,820 930,870" />
                    <path d="M885,765 Q930,830 960,880" />
                    <path d="M880,765 Q940,840 970,890" stroke-width="4" />

                    <!-- Center Heavy Strands -->
                    <path d="M860,765 Q870,830 860,900" />
                    <path d="M860,765 Q850,840 840,910" />
                    <path d="M860,765 Q880,830 890,900" />
                    
                    <!-- Texture lines -->
                    <path d="M845,780 L850,790" stroke="#FFFFFF" stroke-width="1" opacity="0.2" />
                    <path d="M875,780 L870,790" stroke="#FFFFFF" stroke-width="1" opacity="0.2" />
                </g>
            </g>

            <!-- 4. Soap Bubbles (Dynamic) -->
            <g fill="none" stroke="#FFFFFF" stroke-width="1.5">
                <circle cx="800" cy="720" r="8" class="bubble" style="animation-delay: 0s; opacity: 0.6;" />
                <circle cx="840" cy="780" r="12" class="bubble" style="animation-delay: 1.8s; opacity: 0.5;" />
                <circle cx="760" cy="750" r="5" class="bubble" style="animation-delay: 0.9s; opacity: 0.7;" />
                <circle cx="900" cy="700" r="9" class="bubble" style="animation-delay: 2.5s; opacity: 0.6;" />
            </g>

            <!-- 5. Lighting / Mood -->
            <!-- Warm glow from top left (headline side) -->
            <circle cx="200" cy="200" r="600" fill="#FFFFFF" opacity="0.1" filter="blur(60px)" />
            <!-- Rim light on floor -->
            <circle cx="1000" cy="850" r="400" fill="#D69E2E" opacity="0.1" filter="blur(80px)" />
        </svg>
    </div>
</div>

</body>
</html>
