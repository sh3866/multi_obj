<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archon's Ascension - Skill Tree</title>
<style>
    :root {
        /* Palette: Deep Void & Amber Gold */
        --bg-void: #05070a;
        --bg-void-light: #0f141e;
        --bg-panel: #0b0f16;
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-highlight: rgba(251, 191, 36, 0.3);
        
        --accent-gold: #fbbf24;
        --accent-gold-dim: #b45309;
        --accent-glow: rgba(251, 191, 36, 0.4);
        
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #475569;

        /* Typography */
        --font-display: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
        --font-body: 'Inter', 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-void);
        /* Deep textured void background */
        background-image: 
            radial-gradient(circle at 50% 50%, #121a2b 0%, #05070a 80%),
            url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        color: var(--text-primary);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
    }

    /* --- Layout: Sidebar & Main --- */
    .sidebar {
        width: 340px;
        height: 100%;
        background: linear-gradient(90deg, var(--bg-panel) 85%, rgba(11, 15, 22, 0.6) 100%);
        border-right: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        z-index: 20;
        position: relative;
        padding: 40px 35px;
        box-shadow: 10px 0 40px rgba(0,0,0,0.5);
    }

    .main-area {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, rgba(30, 41, 59, 0.15) 0%, transparent 70%);
    }
    .main-area:active { cursor: grabbing; }

    /* --- Sidebar Header (Title) --- */
    .sidebar-header {
        margin-bottom: 40px;
        border-bottom: 1px solid var(--border-subtle);
        padding-bottom: 25px;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 1.8rem;
        line-height: 1.1;
        color: var(--text-primary);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-shadow: 0 4px 12px rgba(0,0,0,0.8);
        margin-bottom: 8px;
    }

    .class-badge {
        display: inline-block;
        font-family: var(--font-body);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--accent-gold);
        background: rgba(251, 191, 36, 0.1);
        padding: 4px 8px;
        border-radius: 2px;
        border: 1px solid rgba(251, 191, 36, 0.2);
    }

    /* --- Sidebar Stats (Resources) --- */
    .resource-block {
        display: flex;
        flex-direction: column;
        gap: 24px; /* Uniform rhythm */
        margin-bottom: 40px;
    }

    /* Level Display */
    .level-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
    }

    .level-val {
        font-family: var(--font-display);
        font-size: 3.5rem;
        color: var(--text-primary);
        line-height: 1;
    }

    .level-label {
        font-size: 0.8rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 4px;
        border-bottom: 1px solid var(--border-subtle);
        padding-bottom: 2px;
    }

    /* XP Bar */
    .xp-container {
        width: 100%;
    }

    .xp-info {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-bottom: 8px;
        font-weight: 500;
        letter-spacing: 0.05em;
    }

    .xp-track {
        width: 100%;
        height: 8px;
        background: #1e293b;
        border-radius: 4px;
        overflow: hidden;
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
    }

    .xp-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
        position: relative;
        box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Skill Points Box */
    .points-box {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-subtle);
        border-left: 3px solid var(--accent-gold);
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-radius: 0 4px 4px 0;
    }

    .points-val {
        font-family: var(--font-display);
        font-size: 2rem;
        color: var(--accent-gold);
        text-shadow: 0 0 10px var(--accent-glow);
    }

    .points-label {
        font-size: 0.7rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        text-align: right;
        line-height: 1.2;
    }

    /* --- Sidebar Stats (Character) --- */
    .divider {
        height: 1px;
        background: linear-gradient(90deg, var(--border-subtle), transparent);
        margin-bottom: 24px;
    }

    .char-header {
        margin-bottom: 20px;
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.4rem;
        color: var(--text-primary);
        margin-bottom: 4px;
    }

    .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr; /* 2 columns */
        gap: 12px 24px;
    }

    .stat-item {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding-bottom: 4px;
    }

    .stat-name {
        font-size: 0.75rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .stat-val {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
    }

    /* --- Skill Tree Area --- */
    .tree-world {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
        /* JS will handle initial translation */
    }

    /* SVG Connections */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: visible;
    }

    .connection-path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: all 0.5s ease;
    }

    /* Base dark line */
    .path-bg {
        stroke: #1e293b;
        stroke-width: 6px;
    }

    /* Active glowing core line */
    .path-core {
        stroke: var(--accent-gold);
        stroke-width: 2px;
        filter: drop-shadow(0 0 4px var(--accent-gold));
        opacity: 0; /* Hidden by default */
        transition: opacity 0.5s ease;
    }

    .connection-group.active .path-core {
        opacity: 1;
        animation: pulse-line 3s infinite alternate;
    }
    
    .connection-group.active .path-bg {
        stroke: #2a364d; /* Slightly lighter base when active */
    }

    @keyframes pulse-line {
        0% { stroke-opacity: 0.5; filter: drop-shadow(0 0 2px var(--accent-gold)); }
        100% { stroke-opacity: 1; filter: drop-shadow(0 0 8px var(--accent-gold)); }
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        width: 76px;
        height: 88px; /* Vertical hex dimensions */
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .node:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }

    /* Hexagon Clip Path */
    .hex-shape {
        width: 100%;
        height: 100%;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    /* Outer Ring (Border simulation) */
    .hex-border {
        position: absolute;
        inset: 0;
        background: #1e293b; /* Dark slate */
        transition: background 0.3s ease;
    }

    /* Inner Core */
    .hex-core {
        position: absolute;
        inset: 4px;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        background: #0b0f16;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.3s ease;
    }

    .node-icon {
        width: 24px;
        height: 24px;
        fill: var(--text-muted);
        opacity: 0.5;
        transition: all 0.3s ease;
        filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
    }

    /* --- Node States --- */
    
    /* Unlocked / Active */
    .node.unlocked .hex-border {
        background: var(--accent-gold);
        box-shadow: 0 0 15px var(--accent-glow); /* Glow effect on border */
    }

    .node.unlocked .hex-core {
        background: #fcd34d; /* Bright gold core */
        background: radial-gradient(circle at 30% 30%, #fff, var(--accent-gold));
    }

    .node.unlocked .node-icon {
        fill: #451a03; /* Dark brown icon for contrast */
        opacity: 1;
        filter: drop-shadow(0 0 2px rgba(255,255,255,0.5));
    }

    /* Available (Hoverable) */
    .node.available .hex-border {
        background: #334155; /* Lighter slate */
    }
    
    .node.available:hover .hex-border {
        background: #94a3b8;
    }

    .node.available .node-icon {
        fill: #cbd5e1;
        opacity: 0.8;
    }

    /* Locked */
    .node.locked .hex-border {
        background: #1e293b;
        opacity: 0.6;
    }
    
    .node.locked .hex-core {
        background: #0f172a;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(11, 15, 22, 0.95);
        border: 1px solid var(--border-subtle);
        border-left: 3px solid var(--text-muted);
        padding: 20px;
        width: 320px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s, border-color 0.2s;
        z-index: 100;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        backdrop-filter: blur(8px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip.active {
        border-left-color: var(--accent-gold);
    }

    .tooltip h3 {
        color: var(--text-primary);
        font-family: var(--font-display);
        margin-bottom: 4px;
        font-size: 1.3rem;
        letter-spacing: 0.02em;
    }

    .tooltip .type {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--text-secondary);
        margin-bottom: 12px;
        letter-spacing: 0.1em;
        font-weight: 700;
    }

    .tooltip p {
        font-size: 0.85rem;
        line-height: 1.6;
        color: #cbd5e1;
        font-weight: 300;
    }

    .tooltip .req {
        margin-top: 12px;
        font-size: 0.75rem;
        color: #ef4444; 
        display: none;
        font-weight: 600;
        background: rgba(239, 68, 68, 0.1);
        padding: 6px 8px;
        border-radius: 2px;
    }

    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-secondary); }

</style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <!-- Title Block -->
        <div class="sidebar-header">
            <h1>Archon's<br>Ascension</h1>
            <div class="class-badge">Void Walker</div>
        </div>

        <!-- Resources Block -->
        <div class="resource-block">
            <!-- Level -->
            <div class="level-row">
                <div class="level-val">42</div>
                <div class="level-label">Character Level</div>
            </div>
            
            <!-- XP -->
            <div class="xp-container">
                <div class="xp-info">
                    <span>Experience</span>
                    <span>12,450 / 20,000</span>
                </div>
                <div class="xp-track">
                    <div class="xp-fill"></div>
                </div>
            </div>

            <!-- Skill Points -->
            <div class="points-box">
                <span class="points-val">3</span>
                <span class="points-label">Skill Points<br>Available</span>
            </div>
        </div>

        <!-- Character Stats Block -->
        <div class="divider"></div>
        
        <div class="char-header">
            <h2 class="char-name">Kaelen Thorne</h2>
        </div>

        <div class="stat-grid">
            <div class="stat-item"><span class="stat-name">Strength</span><span class="stat-val">14</span></div>
            <div class="stat-item"><span class="stat-name">Dexterity</span><span class="stat-val">28</span></div>
            <div class="stat-item"><span class="stat-name">Intelligence</span><span class="stat-val">35</span></div>
            <div class="stat-item"><span class="stat-name">Vitality</span><span class="stat-val">12</span></div>
            <div class="stat-item"><span class="stat-name">Crit. Chance</span><span class="stat-val">18%</span></div>
            <div class="stat-item"><span class="stat-name">Resilience</span><span class="stat-val">45</span></div>
        </div>
    </aside>

    <!-- Main Skill Tree Area -->
    <div class="main-area" id="treeContainer">
        <div class="tree-world" id="treeWorld">
            <!-- SVG Connections Layer -->
            <svg class="connections" id="svgConnections"></svg>
            <!-- Nodes Layer (Generated by JS) -->
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data Configuration ---
    // Coordinate system: 1200px width, approx 900px height
    const skills = [
        // Row 1: Root
        { id: 'root', x: 600, y: 80, name: "Archon's Spark", type: "Passive", desc: "The origin of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Row 2: Branching
        { id: 'str1', x: 350, y: 250, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'dex1', x: 850, y: 250, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: true, req: 'root' },
        
        // Row 3: Mid-tier
        { id: 'int1', x: 600, y: 380, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", unlocked: false, req: 'root' },
        { id: 'str2', x: 200, y: 420, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'dex2', x: 1000, y: 420, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: true, req: 'dex1' },
        
        // Row 4: Specialization
        { id: 'str3', x: 100, y: 580, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        { id: 'dex3', x: 900, y: 580, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1100, y: 580, name: "Dual Wield", type: "Passive", desc: "Unlock ability to hold two weapons.", unlocked: false, req: 'dex2' },
        { id: 'int2', x: 450, y: 580, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 750, y: 580, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        
        // Row 5: Ultimate
        { id: 'hybrid', x: 600, y: 750, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows.", unlocked: false, req: 'int3' },
        { id: 'hybrid2', x: 350, y: 750, name: "Blood Pact", type: "Passive", desc: "Heal for 5% of damage dealt.", unlocked: false, req: 'str3' }
    ];

    // --- SVG Icons (Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z", // Star
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z", // Bolt
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z", // Eye/Circle
        dagger: "M19 3L5 17l-2-2 14-14 2 2zm-1.7 1.3L6.3 15.6l2.1 2.1L19.4 6.4 17.3 4.3z", // Dagger
        rune: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z" // Rune
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Initial Centering
        // Tree center is roughly (600, 400)
        const initialPanX = (cw / 2) - 600;
        const initialPanY = (ch / 2) - 400;
        
        world.style.transform = `translate(${initialPanX}px, ${initialPanY}px) scale(1)`;
        
        // Global Pan Variables
        window.panX = initialPanX;
        window.panY = initialPanY;
        window.scale = 1;

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Determine Icon
            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;

            node.innerHTML = `
                <div class="hex-shape">
                    <div class="hex-border"></div>
                    <div class="hex-core">
                        <svg class="node-icon" viewBox="0 0 24 24">
                            <path d="${iconPath}" />
                        </svg>
                    </div>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('mousemove', moveTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        // Draw Connections
        drawConnections();
    }

    function drawConnections() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    g.classList.add('connection-group');
                    if (skill.unlocked) g.classList.add('active');

                    // Create a slightly curved path for elegance
                    const dx = skill.x - parent.x;
                    const dy = skill.y - parent.y;
                    // Control point for curve (slight S-curve effect)
                    const cx = (parent.x + skill.x) / 2;
                    const cy = (parent.y + skill.y) / 2 + (Math.abs(dx) * 0.1); // Slight sag

                    const pathD = `M ${parent.x} ${parent.y} Q ${cx} ${cy} ${skill.x} ${skill.y}`;

                    // Background Track
                    const bgPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    bgPath.setAttribute('d', pathD);
                    bgPath.classList.add('connection-path', 'path-bg');
                    
                    // Active Core
                    const corePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    corePath.setAttribute('d', pathD);
                    corePath.classList.add('connection-path', 'path-core');

                    g.appendChild(bgPath);
                    g.appendChild(corePath);
                    svg.appendChild(g);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            tooltip.classList.add('active');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            tooltip.classList.remove('active');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        moveTooltip(e);
    }

    function moveTooltip(e) {
        const x = e.clientX;
        const y = e.clientY;
        
        const ttWidth = 320;
        const ttHeight = 150;
        
        let left = x + 20;
        let top = y - 20;
        
        // Boundary checks
        if (left + ttWidth > window.innerWidth) left = x - ttWidth - 20;
        if (top + ttHeight > window.innerHeight) top = y - ttHeight;

        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        // Unlock Logic
        if (!skill.unlocked) {
            // Check if parent is unlocked
            if (!skill.req || skills.find(s => s.id === skill.req).unlocked) {
                skill.unlocked = true;
                updateVisuals();
            }
        }
    }

    function updateVisuals() {
        // Update Nodes
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            
            // Reset classes
            el.classList.remove('unlocked', 'available', 'locked');
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) {
                    el.classList.add('available');
                } else {
                    el.classList.add('locked');
                }
            }
        });

        // Update Lines
        drawConnections();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - window.panX;
        startY = e.clientY - window.panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        window.panX = e.clientX - startX;
        window.panY = e.clientY - startY;
        world.style.transform = `translate(${window.panX}px, ${window.panY}px) scale(${window.scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, window.scale + delta), 2);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - window.scale;
        window.panX -= mouseX * scaleChange;
        window.panY -= mouseY * scaleChange;
        
        window.scale = newScale;
        world.style.transform = `translate(${window.panX}px, ${window.panY}px) scale(${window.scale})`;
    });

    // Start
    init();

</script>
</body>
</html>
