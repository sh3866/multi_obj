<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archon's Ascension - Skill Tree</title>
<style>
    :root {
        --bg-dark: #05070a;
        --bg-panel: rgba(10, 15, 20, 0.85);
        --border-color: rgba(100, 116, 139, 0.2);
        --accent-gold: #fbbf24;
        --accent-amber: #d97706;
        --accent-glow: rgba(251, 191, 36, 0.5);
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --font-display: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
        --font-body: 'Montserrat', 'Segoe UI', 'Roboto', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-dark);
        /* Deep charcoal/midnight blue radial gradient */
        background-image: radial-gradient(circle at 50% 50%, #162032 0%, #05070a 100%);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Header --- */
    header {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 20;
        background: linear-gradient(to bottom, rgba(5,7,10,1), transparent);
    }

    .title-container {
        text-align: center;
        position: relative;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 2.2rem;
        letter-spacing: 0.2em; /* Wide tracking */
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        font-weight: 700;
    }

    .subtitle {
        font-family: var(--font-body);
        font-size: 0.75rem;
        color: var(--accent-gold);
        letter-spacing: 0.4em;
        margin-top: 2px;
        text-transform: uppercase;
        opacity: 0.8;
    }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
    }

    /* --- Sidebar --- */
    aside {
        width: 320px;
        height: 100%;
        /* Semi-transparent dark background with subtle border */
        background: var(--bg-panel);
        border-right: 1px solid var(--border-color);
        backdrop-filter: blur(12px);
        display: flex;
        flex-direction: column;
        padding: 40px 30px;
        z-index: 10;
        box-shadow: 5px 0 30px rgba(0,0,0,0.6);
    }

    /* Top Block: Level, XP, Points */
    .top-stats-block {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: auto; /* Pushes bottom content down */
    }

    .level-display {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 15px;
    }

    .level-num {
        font-family: var(--font-display);
        font-size: 4.5rem; /* Significantly larger */
        line-height: 0.8;
        color: var(--text-main);
        text-shadow: 0 0 15px rgba(255,255,255,0.1);
    }

    .level-label {
        font-size: 1rem;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        margin-bottom: 8px;
        font-weight: 600;
    }

    /* XP Bar Styling */
    .xp-container {
        width: 100%;
    }

    .xp-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-bottom: 6px;
        font-weight: 600;
        letter-spacing: 0.05em;
    }

    .xp-bar-bg {
        height: 12px;
        background: rgba(0,0,0,0.4);
        border-radius: 2px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
        position: relative;
    }

    .xp-bar-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, #b45309, var(--accent-gold));
        box-shadow: 0 0 15px var(--accent-glow); /* Glowing fill */
        position: relative;
    }
    
    /* Particle/Gradient effect on XP bar */
    .xp-bar-fill::after {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
        width: 50%;
        transform: translateX(-100%);
        animation: shimmer 2.5s infinite;
    }

    /* Skill Points */
    .points-display {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(0,0,0,0.3);
        padding: 12px 20px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        position: relative;
    }

    .points-display::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0; width: 4px;
        background: var(--accent-gold);
        border-radius: 4px 0 0 4px;
    }

    .points-val {
        font-size: 2rem;
        font-family: var(--font-display);
        color: var(--accent-gold); /* Amber color */
        font-weight: 700;
        text-shadow: 0 0 10px var(--accent-glow);
    }

    .points-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        text-align: right;
        line-height: 1.2;
    }

    /* Bottom Anchor: Character Stats */
    .character-details {
        margin-top: 30px;
        border-top: 1px solid var(--border-color);
        padding-top: 20px;
    }
    
    .char-name {
        font-size: 1.4rem;
        font-family: var(--font-display);
        margin-bottom: 2px;
        color: var(--text-main);
    }
    
    .char-class {
        color: var(--accent-gold);
        font-size: 0.8rem;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        opacity: 0.8;
    }

    /* Rigid column alignment for stats */
    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 12px; /* Increased line-height equivalent */
        font-size: 0.9rem;
        font-family: var(--font-body);
    }
    .stat-row span:first-child { 
        color: var(--text-muted); 
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.05em;
    }
    .stat-row span:last-child { 
        font-weight: 700; 
        color: var(--text-main); 
        font-variant-numeric: tabular-nums; /* Aligns numbers */
    }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background-image: 
            radial-gradient(circle at 50% 50%, rgba(30, 41, 59, 0.3) 0%, transparent 70%);
    }

    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform-origin: 0 0;
        /* Will be centered by JS */
    }

    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: visible;
    }

    .connection-line {
        stroke: #334155;
        stroke-width: 3;
        fill: none;
        transition: stroke 0.4s ease, filter 0.4s ease;
        stroke-linecap: round;
    }

    .connection-line.active {
        stroke: var(--accent-gold);
        filter: drop-shadow(0 0 4px var(--accent-gold));
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        width: 70px;
        height: 70px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .node:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }

    /* Hexagon Shape using Clip Path */
    .node-shape {
        width: 100%;
        height: 100%;
        background: #1e293b;
        border: 2px solid #334155;
        /* Hexagon Clip Path */
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    /* Inner Ring / Core */
    .node-core {
        width: 40px;
        height: 40px;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.3s ease;
    }

    .node-icon {
        width: 20px;
        height: 20px;
        fill: var(--text-muted);
        opacity: 0.4;
        transition: all 0.3s ease;
        filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
    }

    /* States */
    .node.unlocked .node-shape {
        border-color: var(--accent-gold);
        background: rgba(251, 191, 36, 0.15); /* Translucent amber */
        box-shadow: 0 0 20px var(--accent-glow);
    }

    .node.unlocked .node-core {
        background: var(--accent-gold);
    }

    .node.unlocked .node-icon {
        fill: #000; /* Dark icon on gold background */
        opacity: 1;
    }
    
    .node.available .node-shape {
        border-color: #94a3b8;
        background: rgba(148, 163, 184, 0.1);
    }
    
    .node.available:hover .node-shape {
        border-color: var(--text-main);
        background: rgba(255,255,255,0.1);
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(10, 15, 20, 0.95);
        border: 1px solid var(--accent-gold);
        padding: 20px;
        width: 300px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        backdrop-filter: blur(8px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        color: var(--accent-gold);
        font-family: var(--font-display);
        margin-bottom: 4px;
        font-size: 1.2rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    .tooltip .type {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 12px;
        letter-spacing: 0.1em;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 8px;
        display: inline-block;
    }

    .tooltip p {
        font-size: 0.9rem;
        line-height: 1.6;
        color: #cbd5e1;
        font-weight: 300;
    }

    .tooltip .req {
        margin-top: 12px;
        font-size: 0.75rem;
        color: #ef4444; 
        display: none;
        font-weight: 600;
    }

    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-muted); }
    .tooltip.locked { border-color: #334155; }

    @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
    }

</style>
</head>
<body>

    <header>
        <div class="title-container">
            <h1>Archon's Ascension</h1>
            <div class="subtitle">Class: Void Walker</div>
        </div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="top-stats-block">
                <div class="level-display">
                    <span class="level-num">42</span>
                    <span class="level-label">Level</span>
                </div>
                
                <div class="xp-container">
                    <div class="xp-labels">
                        <span>Experience</span>
                        <span>12,450 / 20,000</span>
                    </div>
                    <div class="xp-bar-bg">
                        <div class="xp-bar-fill"></div>
                    </div>
                </div>

                <div class="points-display">
                    <span class="points-val">3</span>
                    <span class="points-label">Skill Points<br>Available</span>
                </div>
            </div>

            <div class="character-details">
                <h2 class="char-name">Kaelen Thorne</h2>
                <div class="char-class">Duelist / Arcanist</div>
                <div class="stat-row"><span>Strength</span><span>14</span></div>
                <div class="stat-row"><span>Dexterity</span><span>28</span></div>
                <div class="stat-row"><span>Intelligence</span><span>35</span></div>
                <div class="stat-row"><span>Vitality</span><span>12</span></div>
                <div class="stat-row"><span>Crit. Chance</span><span>18%</span></div>
            </div>
        </aside>

        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <svg class="connections" id="svgConnections"></svg>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data: Centered layout spanning roughly 350px to 1100px ---
    // Using a 1200px wide coordinate system for the tree world
    const skills = [
        // Row 1: Root
        { id: 'root', x: 600, y: 100, name: "Archon's Spark", type: "Passive", desc: "The origin of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Row 2: Branching
        { id: 'str1', x: 400, y: 250, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'dex1', x: 800, y: 250, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: true, req: 'root' },
        
        // Row 3: Mid-tier
        { id: 'int1', x: 600, y: 350, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", unlocked: false, req: 'root' },
        { id: 'str2', x: 300, y: 400, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'dex2', x: 900, y: 400, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: true, req: 'dex1' },
        
        // Row 4: Specialization
        { id: 'str3', x: 200, y: 550, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        { id: 'dex3', x: 1000, y: 550, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 800, y: 550, name: "Dual Wield", type: "Passive", desc: "Unlock ability to hold two weapons.", unlocked: false, req: 'dex2' },
        { id: 'int2', x: 500, y: 550, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 700, y: 550, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        
        // Row 5: Ultimate
        { id: 'hybrid', x: 600, y: 700, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows.", unlocked: false, req: 'int3' },
        { id: 'hybrid2', x: 400, y: 700, name: "Blood Pact", type: "Passive", desc: "Heal for 5% of damage dealt.", unlocked: false, req: 'str3' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        // Center the world initially
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // We want the tree (approx 1200px wide) centered in the container
        // But we also want to respect the "350px to 1100px" visual range request.
        // We will center the 1200px world.
        const initialPanX = (cw / 2) - 600; // Center 1200px width
        const initialPanY = (ch / 2) - 400; // Center height roughly
        
        // Apply initial transform
        world.style.transform = `translate(${initialPanX}px, ${initialPanY}px) scale(1)`;

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Determine Icon
            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;

            node.innerHTML = `
                <div class="node-shape">
                    <div class="node-core">
                        <svg class="node-icon" viewBox="0 0 24 24">
                            <path d="${iconPath}" />
                        </svg>
                    </div>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        // Draw Lines
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        
        // Positioning
        const x = e.clientX;
        const y = e.clientY;
        
        // Prevent overflow off screen right/bottom
        const ttWidth = 300;
        const ttHeight = 150;
        let left = x + 20;
        let top = y - 20;
        
        if (left + ttWidth > window.innerWidth) left = x - ttWidth - 20;
        if (top + ttHeight > window.innerHeight) top = y - ttHeight;

        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        // Simple logic: if not unlocked and has no req (root) or parent is unlocked
        if (!skill.unlocked) {
            if (!skill.req) { 
                skill.unlocked = true;
                updateVisuals();
            } else {
                const parent = skills.find(s => s.id === skill.req);
                if (parent && parent.unlocked) {
                    skill.unlocked = true;
                    updateVisuals();
                }
            }
        }
    }

    function updateVisuals() {
        // Update Nodes
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            if (s.unlocked) {
                el.classList.add('unlocked');
                el.classList.remove('available');
            } else {
                el.classList.remove('unlocked');
                // Check availability (parent unlocked)
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) el.classList.add('available');
                else el.classList.remove('available');
            }
        });

        // Re-draw lines to update active state
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    if (skill.unlocked) line.classList.add('active');
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = container.clientWidth/2 - 600;
    let panY = container.clientHeight/2 - 400;
    let scale = 1;

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        // Zoom towards mouse pointer
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    // Handle resize
    window.addEventListener('resize', () => {
        // Optional: Recenter on resize, but usually users want to keep their view
    });

    init();

</script>
</body>
</html>
