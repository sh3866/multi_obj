<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup - The Garden</title>
    <style>
        :root {
            /* --- Color Palette --- */
            --bg-cream: #F7F4EB;
            --bg-texture: #EBE6D9;
            
            --text-brown: #4A3B32;
            --text-muted: #8B7D6B;
            
            /* Board Tactile */
            --board-frame: #A68A68; /* Darker Wood */
            --board-frame-shadow: #7A6348;
            --board-bg: #D8CFC0; /* Grout */
            
            --tile-wood: #FFF8E7; /* Light Plywood */
            --tile-wood-shadow: #E0D6C1; /* Bevel */
            --tile-wood-active: #FFFDF8;
            
            /* Paths */
            --path-color: #2ECCAA; /* Vibrant Teal */
            --path-shadow: rgba(46, 204, 170, 0.3);
            
            /* Buttons */
            --btn-run: #27AE60;
            --btn-run-dark: #1E8449;
            --btn-reset: #95A5A6;
            --btn-reset-dark: #7F8C8D;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: var(--bg-cream);
            /* Storybook Texture */
            background-image: radial-gradient(var(--bg-texture) 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Fredoka One', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-brown);
            overflow-x: hidden;
        }

        /* --- Header Section --- */
        header {
            text-align: center;
            margin-bottom: 24px;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            color: var(--text-brown);
            line-height: 1;
            letter-spacing: -1px;
            transform: rotate(-2deg);
            text-shadow: 3px 3px 0px rgba(255,255,255,0.8);
        }

        .level-badge {
            display: inline-block;
            font-family: 'Georgia', serif; /* Contrast font */
            font-style: italic;
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-top: 8px;
            padding: 4px 12px;
            background: rgba(255,255,255,0.4);
            border-radius: 12px;
            border: 1px dashed rgba(0,0,0,0.1);
        }

        /* --- The Puzzle Board (Hero) --- */
        .board-container {
            width: 100%;
            max-width: 700px; /* Larger width as requested */
            padding: 0 20px;
            display: flex;
            justify-content: center;
        }

        .board-frame {
            background: var(--board-frame);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.15), /* Depth */
                0 6px 0 var(--board-frame-shadow); /* 3D Edge */
            position: relative;
            width: 100%;
            /* Aspect Ratio for 8x6 grid */
            aspect-ratio: 8 / 6; 
        }

        .grid-container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            background: var(--board-bg);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        /* Individual Tiles */
        .tile {
            background: var(--tile-wood);
            border-radius: 4px;
            position: relative;
            /* Tactile Bevel */
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.6),
                0 3px 0 var(--tile-wood-shadow);
            transition: background-color 0.3s;
        }

        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            stroke: #D7CCC8; /* Inactive Grey/Beige */
            stroke-width: 14;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            opacity: 0.4;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Active State */
        .tile.active {
            background: var(--tile-wood-active);
        }
        
        .tile.active svg {
            stroke: var(--path-color);
            opacity: 1;
            filter: drop-shadow(0px 2px 3px var(--path-shadow));
        }

        /* --- Tokens (Cub & Star) --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        /* Cub Character */
        .cub-token {
            position: absolute;
            width: 85%; /* Fits nicely inside the tile */
            aspect-ratio: 1/1;
            transform: translate(-50%, -50%);
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 4px 2px rgba(0,0,0,0.2));
        }

        /* Star Marker */
        .star-marker {
            position: absolute;
            width: 60%;
            aspect-ratio: 1/1;
            transform: translate(-50%, -50%);
            color: #F1C40F;
            animation: float 3s infinite ease-in-out;
            filter: drop-shadow(0 0 8px rgba(241, 196, 15, 0.6));
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            50% { transform: translate(-50%, -50%) rotate(10deg) translateY(-3px); }
        }

        /* --- Footer Controls --- */
        footer {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        button {
            font-family: inherit;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 12px 32px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            top: 0;
            transition: transform 0.1s, box-shadow 0.1s;
            
            /* Tactile Button Style */
            box-shadow: 
                0 6px 0 rgba(0,0,0,0.15),
                0 10px 10px rgba(0,0,0,0.1),
                inset 0 2px 0 rgba(255,255,255,0.3);
        }

        button:active {
            top: 6px;
            box-shadow: 
                0 0 0 rgba(0,0,0,0.15),
                0 0 0 rgba(0,0,0,0.1),
                inset 0 2px 0 rgba(255,255,255,0.3);
        }

        .btn-run {
            background-color: var(--btn-run);
            border-bottom: 6px solid var(--btn-run-dark);
        }

        .btn-reset {
            background-color: var(--btn-reset);
            border-bottom: 6px solid var(--btn-reset-dark);
            color: #ECF0F1;
            font-size: 1rem; /* Slightly smaller */
            padding: 12px 24px;
        }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(247, 244, 235, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            backdrop-filter: blur(4px);
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-size: 5rem;
            color: #E67E22;
            margin: 0;
            transform: rotate(-5deg);
            text-shadow: 4px 4px 0px #F1C40F;
        }
        .overlay p {
            font-family: 'Georgia', serif;
            font-size: 1.5rem;
            color: var(--text-brown);
            margin-top: 10px;
            font-style: italic;
        }
        .overlay button {
            margin-top: 30px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .board-container { padding: 0 10px; }
            button { padding: 10px 20px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="level-badge">Level 1: The Garden</div>
    </header>

    <div class="board-container">
        <div class="board-frame">
            <div class="grid-container" id="grid"></div>
            
            <div class="token-layer">
                <!-- Cub Token: Custom SVG Illustration -->
                <div class="cub-token" id="cub">
                    <svg viewBox="0 0 100 100">
                        <!-- Ears -->
                        <path d="M20 35 Q 15 15 35 25" fill="#D35400" stroke="#D35400" stroke-width="1"/>
                        <path d="M80 35 Q 85 15 65 25" fill="#D35400" stroke="#D35400" stroke-width="1"/>
                        
                        <!-- Body -->
                        <rect x="15" y="25" width="70" height="65" rx="20" fill="#E67E22" />
                        
                        <!-- Snout Area -->
                        <ellipse cx="50" cy="65" rx="22" ry="16" fill="#FDFBF7" />
                        
                        <!-- Eyes -->
                        <circle cx="35" cy="45" r="5" fill="#2C3E50" />
                        <circle cx="65" cy="45" r="5" fill="#2C3E50" />
                        <circle cx="36" cy="43" r="2" fill="#fff" />
                        <circle cx="66" cy="43" r="2" fill="#fff" />
                        
                        <!-- Nose -->
                        <ellipse cx="50" cy="60" rx="6" ry="4" fill="#2C3E50" />
                        
                        <!-- Mouth -->
                        <path d="M50 64 V68 M50 68 Q 45 72 40 68 M50 68 Q 55 72 60 68" stroke="#2C3E50" stroke-width="2" stroke-linecap="round" fill="none"/>
                    </svg>
                </div>

                <!-- Star Marker -->
                <div class="star-marker" id="star">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" />
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run Path</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        // --- Game Logic ---

        const COLS = 8;
        const ROWS = 6;
        
        // Tile Definitions (SVG paths relative to 100x100 box)
        // Coordinates: Center is 50,50. Edges are 0 and 100.
        const TILES = {
            EMPTY: { p: [] },
            H: { p: ['M0 50 H100'] },
            V: { p: ['M50 0 V100'] },
            // Corners
            TL: { p: ['M50 0 V50 H0'] }, // Top-Left
            TR: { p: ['M50 0 V50 H100'] }, // Top-Right
            BL: { p: ['M0 50 V100 H50'] }, // Bottom-Left
            BR: { p: ['M100 50 V100 H50'] }, // Bottom-Right
            // T-Splits
            T_D: { p: ['M50 0 V100 M0 50 H100'] }, 
            T_U: { p: ['M50 100 V50 H0 M50 50 H100'] } 
        };

        // Layout Map
        const LAYOUT = [
            ['TL', 'H', 'H', 'TR', 'TL', 'H', 'H', 'TR'],
            ['V', 'TL', 'H', 'BL', 'V', 'TL', 'H', 'BL'],
            ['V', 'V', 'V', 'V', 'V', 'V', 'V', 'V'],
            ['V', 'TR', 'H', 'H', 'TL', 'TR', 'H', 'BL'],
            ['V', 'V', 'TL', 'H', 'BL', 'V', 'TL', 'H'],
            ['BL', 'H', 'V', 'V', 'V', 'BL', 'H', 'BR']
        ];

        // Path for the animation
        const PATH_TO_GOAL = [
            {x:0,y:0}, {x:1,y:0}, {x:2,y:0}, {x:3,y:0}, {x:4,y:0}, {x:5,y:0}, {x:6,y:0}, {x:7,y:0},
            {x:7,y:1}, {x:7,y:2}, {x:7,y:3}, {x:6,y:3}, {x:5,y:3}, {x:4,y:3}, {x:3,y:3}, {x:2,y:3},
            {x:2,y:4}, {x:2,y:5}, {x:3,y:5}, {x:4,y:5}, {x:5,y:5}, {x:6,y:5}, {x:7,y:5}
        ];

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = [];
                this.startPos = {x:0, y:0};
                this.endPos = {x:7, y:5}; 
                
                this.init();
            }

            init() {
                this.renderGrid();
                this.updateCub(0, 0);
                this.updateStar(this.endPos.x, this.endPos.y);
            }

            renderGrid() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<ROWS; y++) {
                    let row = [];
                    for(let x=0; x<COLS; x++) {
                        const type = LAYOUT[y][x];
                        const div = document.createElement('div');
                        div.className = 'tile';
                        div.innerHTML = `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${
                            TILES[type].p.map(d => `<path d="${d}" />`).join('')
                        }</svg>`;
                        
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            updateCub(x, y) {
                // Calculate center of cell percentage
                const pX = 100 / COLS;
                const pY = 100 / ROWS;
                const left = (x * pX) + (pX / 2);
                const top = (y * pY) + (pY / 2);
                
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStar(x, y) {
                const pX = 100 / COLS;
                const pY = 100 / ROWS;
                const left = (x * pX) + (pX / 2);
                const top = (y * pY) + (pY / 2);
                
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.updateCub(0, 0);
                
                // Re-enable buttons
                const btns = document.querySelectorAll('button');
                btns.forEach(b => {
                    b.style.opacity = '1';
                    b.style.pointerEvents = 'all';
                    b.style.transform = 'translateY(0)';
                });
            }

            async run() {
                // Disable buttons
                const btns = document.querySelectorAll('button');
                btns.forEach(b => {
                    b.style.opacity = '0.6';
                    b.style.pointerEvents = 'none';
                    b.style.transform = 'translateY(4px)';
                });

                // Animate along path
                for (let i = 0; i < PATH_TO_GOAL.length; i++) {
                    const pos = PATH_TO_GOAL[i];
                    const tile = this.cells[pos.y][pos.x];
                    
                    // Light up tile
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateCub(pos.x, pos.y);
                    
                    // Wait
                    await new Promise(r => setTimeout(r, 300));
                }

                // Win
                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 300);
            }
        }

        const game = new Game();
    </script>
</body>
</html>
