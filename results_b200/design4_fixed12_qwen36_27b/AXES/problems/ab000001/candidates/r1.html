<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        /* 
           DESIGN SYSTEM: 
           Fonts: System UI fallbacks to rounded sans-serif (San Francisco, Segoe UI, Quicksand).
           Colors: Warm, creamy paper tones and soft slate inks.
        */

        :root {
            /* Palette */
            --bg-paper: #FDFBF7;
            --bg-paper-noise: #EBE5D9;
            --ink-primary: #2D3436;
            --ink-secondary: #636E72;
            
            /* Board Colors */
            --board-bg: #F4F1EA;
            --tile-bg: #FFFFFF;
            --tile-shadow: #E0Dcd5;
            --path-inactive: #B2BEC3;
            --path-active: #E17055; /* Warm Coral/Orange */
            --frame-color: #4B4B4B;
            --frame-shadow: #2D3436;
            
            /* Character Colors */
            --cub-color: #6C5CE7; /* Playful Purple */
            --cub-face: #FFFFFF;
            --star-color: #FDCB6E;
            
            /* Dimensions */
            --board-size: min(85vw, 480px);
            --gap-size: 6px;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            /* Subtle paper noise texture */
            background-image: radial-gradient(var(--bg-paper-noise) 1px, transparent 1px);
            background-size: 16px 16px;
            font-family: 'Quicksand', 'Nunito', 'Segoe UI', 'Roboto', sans-serif;
            color: var(--ink-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 1.5rem; /* Tightened spacing */
            z-index: 2;
        }

        h1 {
            font-family: 'Fredoka One', 'Baloo 2', 'Comic Sans MS', cursive, sans-serif; /* Fallback stack for rounded look */
            font-size: 3.5rem;
            margin: 0;
            color: var(--ink-primary);
            line-height: 1;
            letter-spacing: -1px;
            /* Soft text shadow for storybook feel */
            text-shadow: 2px 2px 0px rgba(0,0,0,0.08);
        }

        .subtitle {
            font-family: 'Quicksand', 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--ink-secondary);
            margin-top: 0.5rem;
            background: rgba(255,255,255,0.6);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            /* Clean, no debug styling */
            letter-spacing: 0; 
        }

        /* --- The Game Board --- */
        .game-container {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            background: var(--board-bg);
            border-radius: 16px;
            padding: 12px;
            
            /* Double border / Physical frame effect */
            border: 2px solid var(--frame-color);
            box-shadow: 
                0 0 0 4px var(--bg-paper), /* Inner gap */
                0 0 0 6px var(--frame-color), /* Outer frame line */
                0 15px 35px rgba(0,0,0,0.15), /* Drop shadow */
                0 5px 0 var(--frame-shadow); /* 3D depth */
            
            z-index: 10;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100%;
            height: 100%;
            gap: var(--gap-size);
            /* Warm slate gaps */
            background: #B2BEC3; 
            border-radius: 8px;
            overflow: hidden;
        }

        .tile {
            background-color: var(--tile-bg);
            position: relative;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.05); /* Subtle tile depth */
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .tile:hover {
            transform: scale(0.96);
            background-color: #FAFAFA;
        }

        /* SVG Paths inside tiles */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            stroke: var(--path-inactive);
            stroke-width: 10;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.4s ease;
            margin: -2px; /* Allow stroke to bleed slightly to corners */
            box-sizing: border-box;
        }

        .tile.active svg {
            stroke: var(--path-active);
            filter: drop-shadow(0 0 2px rgba(225, 112, 85, 0.4));
        }

        /* --- Tokens Layer --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        /* Cub Character: Flat Vector Style */
        .cub-token {
            position: absolute;
            width: 70%;
            height: 70%;
            transform: translate(-50%, -50%);
            transition: top 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: top, left;
        }

        /* Draw Cub with SVG for crisp scaling */
        .cub-token svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0 4px 2px rgba(0,0,0,0.2));
        }

        /* Star Marker */
        .star-marker {
            position: absolute;
            width: 60%;
            height: 60%;
            transform: translate(-50%, -50%);
            color: var(--star-color);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-3px); }
        }

        /* --- Footer Controls --- */
        footer {
            margin-top: 1.5rem; /* Grouped closer */
            display: flex;
            gap: 16px;
            z-index: 2;
            width: var(--board-size); /* Align width with board */
            justify-content: space-between;
        }

        button {
            font-family: 'Quicksand', 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            flex: 1; /* Equal width buttons */
            padding: 14px 0;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            top: 0;
        }

        button:active {
            top: 3px;
            box-shadow: none !important;
        }

        .btn-reset {
            background: #FFFFFF;
            color: var(--ink-secondary);
            border: 2px solid #E0E0E0;
            box-shadow: 0 4px 0 #E0E0E0;
        }
        .btn-reset:hover {
            background: #F9F9F9;
            border-color: #D0D0D0;
            box-shadow: 0 4px 0 #D0D0D0;
        }

        .btn-run {
            background: var(--path-active);
            color: #fff;
            border: 2px solid #D65A43;
            box-shadow: 0 4px 0 #D65A43;
        }
        .btn-run:hover {
            background: #E87A62;
            border-color: #D65A43;
        }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(253, 251, 247, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-family: 'Fredoka One', 'Baloo 2', cursive;
            font-size: 4rem;
            color: var(--path-active);
            margin: 0;
            transform: rotate(-5deg);
            text-shadow: 3px 3px 0px #FDCB6E;
        }
        .overlay p {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--ink-secondary);
            margin-top: 10px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            :root { --board-size: 92vw; }
            h1 { font-size: 2.8rem; }
            footer { width: 92vw; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 1: The Garden</div>
    </header>

    <div class="game-container">
        <!-- The Grid -->
        <div class="grid" id="grid"></div>
        
        <!-- Tokens Layer -->
        <div class="token-layer">
            <!-- Cub Character (Flat Vector) -->
            <div class="cub-token" id="cub">
                <svg viewBox="0 0 100 100">
                    <!-- Body -->
                    <rect x="15" y="15" width="70" height="70" rx="15" fill="#6C5CE7" />
                    <!-- Shine -->
                    <path d="M20 20 Q 50 20 80 20" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round" fill="none" />
                    <!-- Eyes -->
                    <circle cx="35" cy="45" r="8" fill="#fff" />
                    <circle cx="65" cy="45" r="8" fill="#fff" />
                    <circle cx="35" cy="45" r="3" fill="#2D3436" />
                    <circle cx="65" cy="45" r="3" fill="#2D3436" />
                    <!-- Mouth -->
                    <path d="M45 65 Q 50 70 55 65" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" />
                    <!-- Ears/Antennae -->
                    <path d="M30 15 L 25 5 L 40 15" fill="#6C5CE7" stroke="#6C5CE7" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M70 15 L 75 5 L 60 15" fill="#6C5CE7" stroke="#6C5CE7" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </div>

            <!-- Star Marker -->
            <div class="star-marker" id="star">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run Path</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()" style="margin-top: 20px; width: 200px;">Play Again</button>
    </div>

    <script>
        // --- Game Logic & Drawing ---

        const GRID_SIZE = 6;
        
        // Tile Types (SVG Paths) - Center point is 50,50
        const TILE_TYPES = {
            EMPTY: { paths: [] },
            LINE_V: { paths: ['M50 0 V100'], con: [1,0,1,0] }, 
            LINE_H: { paths: ['M0 50 H100'], con: [0,1,0,1] }, 
            CORNER_TR: { paths: ['M50 0 V50 H100'], con: [1,1,0,0] },
            CORNER_BR: { paths: ['M100 50 V100 H50'], con: [0,1,1,0] },
            CORNER_BL: { paths: ['M0 50 V100 H50'], con: [0,0,1,1] },
            CORNER_TL: { paths: ['M50 0 V50 H0'], con: [1,0,0,1] },
            T_DOWN: { paths: ['M50 0 V100 M0 50 H100'], con: [1,1,1,1] }, // Cross visual, simplified
            T_UP: { paths: ['M0 50 H100 M50 50 V100'], con: [0,1,1,1] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,0,1,1] },
            T_LEFT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,1,1,0] }
        };

        // Helper to draw SVG
        function createSVG(paths) {
            let svgContent = paths.map(p => `<path d="${p}" />`).join('');
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svgContent}</svg>`;
        }

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                
                // Layout definition
                this.layout = [
                    ['C_TL', 'L', 'C_TR', 'L', 'C_TL', 'L'],
                    ['L', 'C_BR', 'L', 'C_TL', 'L', 'L'],
                    ['L', 'L', 'C_BL', 'C_BR', 'C_BL', 'C_BR'],
                    ['L', 'C_TL', 'L', 'L', 'C_BL', 'L'],
                    ['C_TR', 'L', 'C_BL', 'C_BR', 'L', 'L'],
                    ['L', 'L', 'L', 'L', 'L', 'L']
                ];

                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 4}; 
                this.cubPos = {x: 0, y: 0};
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const tileKey = this.layout[y][x];
                        const div = document.createElement('div');
                        div.className = 'tile';
                        
                        // Map keys to SVG definitions
                        const map = {
                            'L': TILE_TYPES.LINE_V,
                            'C_TL': TILE_TYPES.CORNER_TL,
                            'C_TR': TILE_TYPES.CORNER_TR,
                            'C_BL': TILE_TYPES.CORNER_BL,
                            'C_BR': TILE_TYPES.CORNER_BR
                        };
                        
                        const tileType = map[tileKey] || TILE_TYPES.EMPTY;
                        div.innerHTML = createSVG(tileType.paths);
                        
                        // Store coordinates
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            updateTokenPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.cubPos = {x: 0, y: 0};
                this.updateTokenPosition(0, 0);
            }

            async run() {
                // Path to Star at 5,4
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:4, y:4}, {x:4, y:3}, 
                    {x:5, y:3}, {x:5, y:4} 
                ];

                // Disable buttons visually during run
                document.querySelectorAll('button').forEach(b => b.style.opacity = '0.5');

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    
                    // Highlight tile
                    const tile = this.cells[step.y][step.x];
                    tile.classList.add('active');
                    
                    // Move Cub
                    this.updateTokenPosition(step.x, step.y);
                    
                    // Wait
                    await new Promise(r => setTimeout(r, 350));
                }

                // Re-enable buttons
                document.querySelectorAll('button').forEach(b => b.style.opacity = '1');

                // Win!
                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 200);
            }
        }

        const game = new Game();

    </script>
</body>
</html>
