<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        :root {
            /* CRITIQUE FIX: Palette Overhaul */
            --sky-cyan: #4fa4b8;
            --snow-white: #e0f7fa;
            --snow-shadow: #b2ebf2;
            --pine-dark: #004d40;
            --pine-light: #00bfa5;
            
            --text-white: #ffffff;
            --text-black: #000000;
            
            --btn-yellow: #ffeb3b;
            --btn-yellow-dark: #fbc02d;
            --btn-yellow-light: #fff9c4;
            
            --font-pixel: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--sky-cyan);
            font-family: var(--font-pixel);
        }

        /* CRITIQUE FIX: Removed heavy scanlines, replaced with subtle noise */
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            pointer-events: none;
            z-index: 90;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Main Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* The Canvas World */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: pixelated;
        }

        /* UI Layer */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* CRITIQUE FIX: Adjusted spacing to resolve floating island effect */
            gap: 0; 
            pointer-events: none; /* Let clicks pass through to canvas where needed */
        }

        /* Typography Overhaul */
        h1 {
            margin: 0;
            font-size: 6rem;
            text-transform: uppercase;
            color: var(--text-white);
            /* CRITIQUE FIX: Hard offset black outline for 3D logo feel */
            text-shadow: 
                6px 6px 0 var(--text-black);
            letter-spacing: 4px;
            line-height: 1;
            font-weight: 900;
            /* CRITIQUE FIX: Positioned visually */
            margin-bottom: -10px; 
            pointer-events: auto;
        }

        .instructions {
            color: var(--text-white);
            font-size: 1.2rem;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 40px;
            /* CRITIQUE FIX: Increased line height */
            line-height: 1.8; 
            /* High contrast outline */
            text-shadow: 
                2px 2px 0 var(--text-black);
            pointer-events: auto;
        }

        .instructions kbd {
            background: #fff;
            color: #000;
            border: 2px solid #000;
            padding: 2px 6px;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
        }

        /* CRITIQUE FIX: Button Redesign */
        .start-btn {
            pointer-events: auto;
            background: var(--btn-yellow);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.5rem;
            font-family: var(--font-pixel);
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            /* CRITIQUE FIX: Chunky 3D pixel block style */
            border-top: 4px solid var(--btn-yellow-light);
            border-left: 4px solid var(--btn-yellow-light);
            border-bottom: 4px solid var(--btn-yellow-dark);
            border-right: 4px solid var(--btn-yellow-dark);
            outline: 3px solid #000;
            outline-offset: -3px;
            transition: transform 0.05s;
            /* CRITIQUE FIX: Shrink significantly */
            width: 220px;
            margin-top: 10px;
            position: relative;
        }

        .start-btn:active {
            transform: translate(4px, 4px);
            border-top: 4px solid var(--btn-yellow-dark);
            border-left: 4px solid var(--btn-yellow-dark);
            border-bottom: 4px solid var(--btn-yellow-light);
            border-right: 4px solid var(--btn-yellow-light);
            outline-offset: -7px;
        }

        /* Subtle Vignette for depth */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.2) 100%);
            z-index: 5;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas for Procedural Graphics -->
        <canvas id="world"></canvas>
        
        <!-- Post-processing effects -->
        <div class="vignette"></div>
        <div class="noise-overlay"></div>

        <!-- HUD / UI -->
        <div class="ui-layer">
            <h1>SkiFree</h1>
            
            <div class="instructions">
                Use <kbd>←</kbd> <kbd>→</kbd> to steer<br>
                Avoid trees. Survive the Yeti.
            </div>
            
            <button class="start-btn" id="startBtn">START GAME</button>
        </div>
    </div>

<script>
    /**
     * VISUAL ENGINE
     * Draws the retro pixel art scene procedurally.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    // Pixel Scale
    const PIXEL_SIZE = 4;
    
    // State
    let width, height;
    let frame = 0;
    let trees = [];
    let snowParticles = [];
    
    // Colors (CRITIQUE FIX: Palette Update)
    const C_SKY = '#4fa4b8';
    const C_SNOW = '#e0f7fa';
    const C_SNOW_SHADOW = '#b2ebf2';
    const C_TREE_DARK = '#004d40';
    const C_TREE_LIGHT = '#00bfa5';
    const C_MTN = '#80deea'; // Distant mountains matching cyan theme

    // Assets (Drawn via functions)
    
    function drawPixelSkier(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Skier Palette (Classic)
        const cSkin = '#FFCC80';
        const cHat = '#D32F2F';
        const cJacket = '#D32F2F';
        const cPants = '#1A237E';
        const cSkis = '#FBC02D';
        const cPoles = '#757575';

        // Bobbing animation
        const bob = Math.sin(frame * 0.15) * 3;
        const lean = Math.sin(frame * 0.1) * 0.05; 

        ctx.translate(0, bob);
        ctx.rotate(lean);

        const p = scale; 

        // Skis (drawn first to be behind)
        ctx.fillStyle = cSkis;
        ctx.fillRect(-4*p, 10*p, p, 14*p); // Left ski
        ctx.fillRect(3*p, 10*p, p, 14*p);  // Right ski

        // Poles
        ctx.fillStyle = cPoles;
        ctx.fillRect(-5*p, 4*p, p, 16*p);
        ctx.fillRect(4*p, 4*p, p, 16*p);

        // Legs
        ctx.fillStyle = cPants;
        ctx.fillRect(-3*p, 8*p, 2*p, 4*p);
        ctx.fillRect(2*p, 8*p, 2*p, 4*p);

        // Body
        ctx.fillStyle = cJacket;
        ctx.fillRect(-3*p, 2*p, 6*p, 7*p);

        // Head
        ctx.fillStyle = cSkin;
        ctx.fillRect(-2*p, -2*p, 4*p, 4*p);
        
        // Hat
        ctx.fillStyle = cHat;
        ctx.fillRect(-2*p, -3*p, 4*p, 2*p);

        ctx.restore();
    }

    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Shadow
        ctx.fillStyle = C_SNOW_SHADOW;
        ctx.fillRect(-4*scale, 20*scale, 8*scale, 2*scale);

        const p = scale;
        
        // Trunk
        ctx.fillStyle = '#4E342E';
        ctx.fillRect(-p, 14*p, 2*p, 6*p);

        // Leaves (Simple Triangle-ish shape)
        ctx.fillStyle = C_TREE_DARK;
        
        // Layer 1 (Bottom)
        ctx.fillRect(-6*p, 6*p, 12*p, 4*p);
        ctx.fillRect(-5*p, 4*p, 10*p, 2*p);
        
        // Layer 2 (Mid)
        ctx.fillRect(-5*p, 2*p, 10*p, 4*p);
        
        // Layer 3 (Top)
        ctx.fillRect(-3*p, -2*p, 6*p, 4*p);

        // Highlights
        ctx.fillStyle = C_TREE_LIGHT;
        ctx.fillRect(-4*p, 6*p, 2*p, 2*p);
        ctx.fillRect(-3*p, 2*p, 2*p, 2*p);

        ctx.restore();
    }

    function drawSnowflake(x, y, size) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.fillRect(x, y, size, size);
    }

    // Initialization
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        canvas.width = width;
        canvas.height = height;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        
        // Generate a slope perspective
        const rows = 15;
        
        for(let i=0; i<rows; i++) {
            let rowIdx = rows - i; 
            
            // Simple perspective math
            let y = height - (rowIdx * (height/rows)) - 50; 
            y += Math.sin(rowIdx * 0.5) * 30; // Uneven terrain
            
            let scale = 1 + (rowIdx * 0.2); // Trees get bigger closer to camera
            
            let numTrees = Math.floor(Math.random() * 4) + 1;
            for(let j=0; j<numTrees; j++) {
                let x = Math.random() * width;
                trees.push({x, y, scale, z: rowIdx});
            }
        }
        
        // Sort by Z depth (draw back to front)
        trees.sort((a, b) => a.z - b.z);

        // Generate Snow Particles
        snowParticles = [];
        for(let i=0; i<80; i++) {
            snowParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speed: Math.random() * 3 + 1,
                size: Math.random() * 4 + 2
            });
        }
    }

    function drawBackground() {
        // Sky - Solid Cyan Blue
        ctx.fillStyle = C_SKY;
        ctx.fillRect(0, 0, width, height);

        // Snowy Slope (Bottom half)
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.lineTo(0, height * 0.4);
        ctx.bezierCurveTo(width * 0.3, height * 0.3, width * 0.7, height * 0.5, width, height * 0.4);
        ctx.lineTo(width, height);
        ctx.fillStyle = C_SNOW;
        ctx.fill();

        // Slope shading (Right side)
        ctx.beginPath();
        ctx.moveTo(width * 0.7, height * 0.5);
        ctx.lineTo(width, height * 0.4);
        ctx.lineTo(width, height);
        ctx.lineTo(width * 0.7, height);
        ctx.fillStyle = C_SNOW_SHADOW;
        ctx.fill();
    }

    function drawMountains() {
        // Simple jagged mountains in background
        ctx.fillStyle = C_MTN;
        ctx.beginPath();
        ctx.moveTo(0, height * 0.45);
        ctx.lineTo(width * 0.15, height * 0.3);
        ctx.lineTo(width * 0.3, height * 0.4);
        ctx.lineTo(width * 0.45, height * 0.25);
        ctx.lineTo(width * 0.6, height * 0.35);
        ctx.lineTo(width * 0.8, height * 0.2);
        ctx.lineTo(width, height * 0.4);
        ctx.lineTo(width, height * 0.5);
        ctx.lineTo(0, height * 0.5);
        ctx.fill();
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        drawBackground();
        drawMountains();

        // Draw Trees
        trees.forEach(tree => {
            drawTree(tree.x, tree.y, tree.scale);
        });

        // CRITIQUE FIX: Asset Integration & Depth
        // Position the skier to be the visual anchor.
        // The Title is roughly centered (50% height).
        // We place the skier slightly higher (45% Y) so the title appears "behind" his head.
        const skierX = width / 2;
        const skierY = height * 0.42; 
        
        // Draw a shadow under the skier to ground him
        ctx.fillStyle = C_SNOW_SHADOW;
        ctx.beginPath();
        ctx.ellipse(skierX, skierY + 100, 25, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        // Draw Skier (Hero Element)
        drawPixelSkier(skierX, skierY, PIXEL_SIZE * 3); // Make him big

        // Draw Snow Particles (Foreground)
        snowParticles.forEach(p => {
            p.y += p.speed;
            p.x -= 1.5; // Wind blowing left
            if (p.y > height) p.y = 0;
            if (p.x < 0) p.x = width;
            drawSnowflake(p.x, p.y, p.size);
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);
    
    document.getElementById('startBtn').addEventListener('click', function() {
        this.innerText = "LOADING...";
        this.style.background = "#fff";
        setTimeout(() => {
            alert("Game Start! (This is a visual demo)");
            this.innerText = "START GAME";
            this.style.background = "var(--btn-yellow)";
        }, 500);
    });

    // Init
    resize();
    animate();

</script>
</body>
</html>
