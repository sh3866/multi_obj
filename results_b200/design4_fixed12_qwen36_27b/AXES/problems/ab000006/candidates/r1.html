<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        :root {
            --bg-sky-top: #6fa8dc;
            --bg-sky-bot: #cde6f7;
            --snow-light: #ffffff;
            --snow-shadow: #dce8f0;
            --pine-dark: #1b5e20;
            --pine-light: #4caf50;
            --ui-text: #ffffff;
            --ui-stroke: #000000;
            --btn-face: #f4d03f;
            --btn-light: #fff176;
            --btn-dark: #c49f1b;
            --font-pixel: "Courier New", Courier, monospace; /* System fallback for pixel look */
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: var(--font-pixel);
        }

        /* CRT Scanline Effect Overlay */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.03), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Main Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* CRITIQUE FIX: Center Vertically */
        }

        /* The Canvas World */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: pixelated; /* Key for retro look */
        }

        /* UI Layer - CRITIQUE FIX: Floating, No Container Box */
        .ui-layer {
            position: relative;
            z-index: 5;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            /* No background color, no shadow, no border on the container itself */
        }

        /* Typography Overhaul */
        h1 {
            margin: 0;
            font-size: 5rem; /* Tripled size approx */
            text-transform: uppercase;
            color: var(--ui-text);
            /* Hard black outline for readability */
            text-shadow: 
                -4px -4px 0 var(--ui-stroke),
                4px -4px 0 var(--ui-stroke),
                -4px 4px 0 var(--ui-stroke),
                4px 4px 0 var(--ui-stroke),
                0px 4px 0 var(--ui-stroke),
                0px -4px 0 var(--ui-stroke),
                4px 0px 0 var(--ui-stroke),
                -4px 0px 0 var(--ui-stroke);
            letter-spacing: 5px;
            line-height: 1;
            font-weight: 900;
            /* Pixel font styling */
            letter-spacing: 2px;
        }

        .instructions {
            color: var(--ui-text);
            font-size: 1.2rem; /* Increased size */
            text-align: center;
            margin-top: 10px;
            line-height: 1.5;
            /* High contrast outline */
            text-shadow: 
                -2px -2px 0 var(--ui-stroke),
                2px -2px 0 var(--ui-stroke),
                -2px 2px 0 var(--ui-stroke),
                2px 2px 0 var(--ui-stroke);
        }

        .instructions kbd {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 2px 8px;
            font-family: inherit;
            box-shadow: 2px 2px 0 #555;
            font-weight: bold;
        }

        /* Button Redesign - 90s Bevel Style */
        .start-btn {
            background: var(--btn-face);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: var(--font-pixel);
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            /* Hard pixelated border with bevel effect */
            border-top: 6px solid var(--btn-light);
            border-left: 6px solid var(--btn-light);
            border-bottom: 6px solid var(--btn-dark);
            border-right: 6px solid var(--btn-dark);
            outline: 4px solid #000;
            transition: transform 0.05s;
            margin-top: 20px;
            min-width: 250px;
        }

        .start-btn:active {
            transform: translate(4px, 4px);
            border-top: 6px solid var(--btn-dark);
            border-left: 6px solid var(--btn-dark);
            border-bottom: 6px solid var(--btn-light);
            border-right: 6px solid var(--btn-light);
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.4) 100%);
            z-index: 4;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas for Procedural Graphics -->
        <canvas id="world"></canvas>
        
        <!-- Post-processing effects -->
        <div class="vignette"></div>
        <div class="crt-overlay"></div>

        <!-- HUD / UI - CRITIQUE FIX: Floating UI, Skier is now in Canvas -->
        <div class="ui-layer">
            <!-- Skier is removed from here and drawn in Canvas above the text -->
            
            <h1>SkiFree</h1>
            
            <div class="instructions">
                Use <kbd>←</kbd> <kbd>→</kbd> to steer.<br>
                Avoid trees. Survive the Yeti.
            </div>
            
            <button class="start-btn" id="startBtn">Start Game</button>
        </div>
    </div>

<script>
    /**
     * VISUAL ENGINE
     * Draws the retro pixel art scene procedurally.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    // Pixel Scale
    const PIXEL_SIZE = 4;
    
    // State
    let width, height;
    let frame = 0;
    let trees = [];
    let snowParticles = [];
    
    // Colors
    const C_SKY_TOP = '#6fa8dc';
    const C_SKY_BOT = '#cde6f7';
    const C_SNOW = '#FFFFFF';
    const C_SNOW_DARK = '#dce8f0';
    const C_TREE_DARK = '#1b5e20';
    const C_TREE_LIGHT = '#4caf50';

    // Assets (Drawn via functions)
    
    function drawPixelSkier(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Skier Palette
        const cSkin = '#FFCC80';
        const cHat = '#D32F2F';
        const cJacket = '#D32F2F';
        const cPants = '#1A237E';
        const cSkis = '#FBC02D';
        const cPoles = '#555555';

        // Bobbing animation
        const bob = Math.sin(frame * 0.2) * 2;
        const lean = Math.sin(frame * 0.1) * 0.05; 

        ctx.translate(0, bob);
        ctx.rotate(lean);

        const p = scale; 

        // Skis (drawn first to be behind)
        ctx.fillStyle = cSkis;
        ctx.fillRect(-4*p, 10*p, p, 14*p); // Left ski
        ctx.fillRect(3*p, 10*p, p, 14*p);  // Right ski

        // Poles
        ctx.fillStyle = cPoles;
        ctx.fillRect(-5*p, 4*p, p, 16*p);
        ctx.fillRect(4*p, 4*p, p, 16*p);

        // Legs
        ctx.fillStyle = cPants;
        ctx.fillRect(-3*p, 8*p, 2*p, 4*p);
        ctx.fillRect(2*p, 8*p, 2*p, 4*p);

        // Body
        ctx.fillStyle = cJacket;
        ctx.fillRect(-3*p, 2*p, 6*p, 7*p);

        // Head
        ctx.fillStyle = cSkin;
        ctx.fillRect(-2*p, -2*p, 4*p, 4*p);
        
        // Hat
        ctx.fillStyle = cHat;
        ctx.fillRect(-2*p, -3*p, 4*p, 2*p);

        ctx.restore();
    }

    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.fillRect(-4*scale, 20*scale, 8*scale, 2*scale);

        const p = scale;
        
        // Trunk
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(-p, 14*p, 2*p, 6*p);

        // Leaves (Simple Triangle-ish shape)
        ctx.fillStyle = C_TREE_DARK;
        
        // Layer 1 (Bottom)
        ctx.fillRect(-6*p, 6*p, 12*p, 4*p);
        ctx.fillRect(-5*p, 4*p, 10*p, 2*p);
        
        // Layer 2 (Mid)
        ctx.fillRect(-5*p, 2*p, 10*p, 4*p);
        
        // Layer 3 (Top)
        ctx.fillRect(-3*p, -2*p, 6*p, 4*p);

        // Highlights (Lighter green pixels)
        ctx.fillStyle = C_TREE_LIGHT;
        ctx.fillRect(-4*p, 6*p, 2*p, 2*p);
        ctx.fillRect(-3*p, 2*p, 2*p, 2*p);

        ctx.restore();
    }

    function drawSnowflake(x, y, size) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.fillRect(x, y, size, size);
    }

    // Initialization
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        canvas.width = width;
        canvas.height = height;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        
        const rows = 20;
        const spacingX = 100;
        
        for(let i=0; i<rows; i++) {
            let depth = i / rows;
            let rowIdx = rows - i; 
            
            let perspective = 1 - (rowIdx * 0.04);
            
            let y = height - (rowIdx * (height/rows)) - 50; 
            y += Math.sin(rowIdx * 0.5) * 20;
            
            let scale = 1 + (rowIdx * 0.15);
            
            let numTrees = Math.floor(Math.random() * 3) + 1;
            for(let j=0; j<numTrees; j++) {
                let x = Math.random() * width;
                trees.push({x, y, scale, z: rowIdx});
            }
        }
        
        trees.sort((a, b) => a.z - b.z);

        snowParticles = [];
        for(let i=0; i<100; i++) {
            snowParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speed: Math.random() * 2 + 1,
                size: Math.random() * 3 + 1
            });
        }
    }

    function drawBackground() {
        // Sky Gradient
        let grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, C_SKY_TOP);
        grad.addColorStop(1, C_SKY_BOT);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Snowy Slope (Bottom half)
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.lineTo(0, height * 0.4);
        ctx.bezierCurveTo(width * 0.3, height * 0.3, width * 0.7, height * 0.5, width, height * 0.4);
        ctx.lineTo(width, height);
        ctx.fillStyle = C_SNOW;
        ctx.fill();

        // Slope shading
        ctx.beginPath();
        ctx.moveTo(width * 0.7, height * 0.5);
        ctx.lineTo(width, height * 0.4);
        ctx.lineTo(width, height);
        ctx.lineTo(width * 0.7, height);
        ctx.fillStyle = C_SNOW_DARK;
        ctx.globalAlpha = 0.5;
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }

    function drawMountains() {
        ctx.fillStyle = '#B0BEC5'; // Distant mountains
        ctx.beginPath();
        ctx.moveTo(0, height * 0.5);
        ctx.lineTo(100, height * 0.35);
        ctx.lineTo(200, height * 0.45);
        ctx.lineTo(350, height * 0.25);
        ctx.lineTo(500, height * 0.4);
        ctx.lineTo(width, height * 0.3);
        ctx.lineTo(width, height * 0.5);
        ctx.lineTo(0, height * 0.5);
        ctx.fill();
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        drawBackground();
        drawMountains();

        // Draw Trees
        trees.forEach(tree => {
            drawTree(tree.x, tree.y, tree.scale);
        });

        // CRITIQUE FIX: Integrate Skier
        // Positioned visually above the Title text (approx 40% up from bottom)
        // The Title is centered (50%), so placing skier at 45% height puts him just above the text.
        const skierX = width / 2;
        const skierY = height * 0.45; 
        
        // Draw a shadow under the skier to ground him
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(skierX, skierY + 100, 20, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        drawPixelSkier(skierX, skierY, PIXEL_SIZE * 2.5); // Make him big (Hero element)

        // Draw Snow Particles
        snowParticles.forEach(p => {
            p.y += p.speed;
            p.x -= 1; // Wind blowing left
            if (p.y > height) p.y = 0;
            if (p.x < 0) p.x = width;
            drawSnowflake(p.x, p.y, p.size);
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);
    
    document.getElementById('startBtn').addEventListener('click', function() {
        this.innerText = "LOADING...";
        this.style.background = "#fff";
        setTimeout(() => {
            alert("Game Start! (This is a visual demo)");
            this.innerText = "START GAME";
            this.style.background = "var(--btn-face)";
        }, 500);
    });

    // Init
    resize();
    animate();

</script>
</body>
</html>
