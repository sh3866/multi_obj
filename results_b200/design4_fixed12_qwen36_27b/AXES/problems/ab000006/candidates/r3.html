<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        /* CRITIQUE FIX 1: Establish Unified Retro Aesthetic */
        :root {
            --bg-slate: #2b4a6e; /* Flat Slate Blue */
            --snow-white: #ffffff;
            --snow-shadow: #c4dce8;
            --pine-dark: #1b4d3e;
            --pine-light: #2e8b57;
            --ui-cream: #fdf6e3;
            --ui-wood: #cd853f;
            --ui-wood-dark: #8b4513;
            --ui-accent: #ff6b6b;
            
            /* CRITIQUE FIX 2: Typography Overhaul */
            --font-pixel: 'Courier New', Courier, monospace; 
        }

        * {
            box-sizing: border-box;
            user-select: none;
            /* CRITIQUE FIX 1: Global Pixelated Rendering */
            image-rendering: pixelated; 
            -ms-interpolation-mode: nearest-neighbor;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-slate);
            font-family: var(--font-pixel);
        }

        /* The World Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Layer - CRITIQUE FIX 3: Layout & Z-Index Reconstruction */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            pointer-events: none; /* Let clicks pass through to canvas where needed */
        }

        /* Top Third: Title & Instructions */
        .header-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 8vh;
        }

        h1 {
            margin: 0;
            font-size: 4rem;
            text-transform: uppercase;
            color: var(--snow-white);
            /* CRITIQUE FIX 2: Hard, Stepped Pixel Outline */
            text-shadow: 
                4px 4px 0px #000000,
                -2px -2px 0px #000000,
                2px -2px 0px #000000,
                -2px 2px 0px #000000,
                2px 2px 0px #000000;
            letter-spacing: 4px;
            line-height: 1;
            font-weight: 900;
            z-index: 20; /* Above background, below skier */
        }

        /* CRITIQUE FIX 2: Instruction Text Styling */
        .instructions {
            margin-top: 20px;
            background-color: rgba(0, 0, 0, 0.6); /* Dark box for readability */
            color: var(--snow-white);
            font-size: 1.1rem;
            padding: 10px 20px;
            border: 2px solid #000;
            text-align: center;
            line-height: 1.6;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            max-width: 90%;
            z-index: 20;
        }

        .instructions kbd {
            background: var(--snow-white);
            color: #000;
            border: 2px solid #000;
            padding: 2px 6px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9em;
            margin: 0 2px;
        }

        /* Lower Third: Start Button */
        .footer-section {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 10vh;
            z-index: 30; /* Highest Z-Index */
        }

        /* CRITIQUE FIX 4: Refine UI Elements (Arcade Button) */
        .start-btn {
            pointer-events: auto;
            background: var(--ui-cream);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: var(--font-pixel);
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            
            /* Retro 3D Block Effect */
            border-top: 4px solid #fff;
            border-left: 4px solid #fff;
            border-bottom: 4px solid #888;
            border-right: 4px solid #888;
            outline: 3px solid #000;
            
            transition: transform 0.05s, border-width 0.05s;
        }

        .start-btn:hover {
            background: #fff;
        }

        .start-btn:active {
            transform: translate(4px, 4px);
            border-top: 4px solid #888;
            border-left: 4px solid #888;
            border-bottom: 4px solid #fff;
            border-right: 4px solid #fff;
            outline-offset: -2px;
        }

        /* CRT Scanline Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }
        
        /* Subtle vignette to focus center */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.4) 100%);
            z-index: 90;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas for Procedural Graphics -->
        <canvas id="world"></canvas>
        
        <!-- Visual Overlays -->
        <div class="vignette"></div>
        <div class="scanlines"></div>

        <!-- HUD / UI Layer -->
        <div class="ui-layer">
            
            <!-- Upper Third -->
            <div class="header-section">
                <h1>SkiFree</h1>
                <div class="instructions">
                    Use <kbd>←</kbd> <kbd>→</kbd> to steer<br>
                    Avoid trees. Survive the Yeti.
                </div>
            </div>

            <!-- Middle Ground (Empty for Skier) -->
            <!-- The Skier is drawn on Canvas, but visually appears here -->

            <!-- Lower Third -->
            <div class="footer-section">
                <button class="start-btn" id="startBtn">START GAME</button>
            </div>

        </div>
    </div>

<script>
    /**
     * VISUAL ENGINE
     * Draws the retro pixel art scene procedurally.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    // Pixel Scale
    const PIXEL_SIZE = 4;
    
    // State
    let width, height;
    let frame = 0;
    let trees = [];
    let snowParticles = [];
    
    // CRITIQUE FIX 1: Palette Update (Unified Retro)
    const C_BG = '#2b4a6e'; // Slate Blue
    const C_SNOW = '#ffffff';
    const C_SNOW_SHADOW = '#c4dce8';
    const C_TREE_DARK = '#1b4d3e';
    const C_TREE_LIGHT = '#2e8b57';
    const C_MTN = '#3d6591'; // Darker mountains for slate sky

    // Assets (Drawn via functions)
    
    function drawPixelSkier(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Skier Palette (Classic)
        const cSkin = '#ffcc99';
        const cHat = '#d32f2f';
        const cJacket = '#d32f2f';
        const cPants = '#1a237e';
        const cSkis = '#fbc02d';
        const cPoles = '#9e9e9e';

        // Bobbing animation
        const bob = Math.sin(frame * 0.15) * 4;
        const lean = Math.sin(frame * 0.1) * 0.08; 

        ctx.translate(0, bob);
        ctx.rotate(lean);

        const p = scale; 

        // Skis (drawn first to be behind)
        ctx.fillStyle = cSkis;
        ctx.fillRect(-5*p, 10*p, p, 16*p); // Left ski
        ctx.fillRect(4*p, 10*p, p, 16*p);  // Right ski

        // Poles
        ctx.fillStyle = cPoles;
        ctx.fillRect(-6*p, 5*p, p, 18*p);
        ctx.fillRect(5*p, 5*p, p, 18*p);

        // Legs
        ctx.fillStyle = cPants;
        ctx.fillRect(-4*p, 8*p, 3*p, 5*p);
        ctx.fillRect(2*p, 8*p, 3*p, 5*p);

        // Body
        ctx.fillStyle = cJacket;
        ctx.fillRect(-4*p, 2*p, 8*p, 7*p);

        // Head
        ctx.fillStyle = cSkin;
        ctx.fillRect(-3*p, -3*p, 6*p, 5*p);
        
        // Hat
        ctx.fillStyle = cHat;
        ctx.fillRect(-3*p, -5*p, 6*p, 3*p);
        ctx.fillRect(-3*p, -5*p, 8*p, 2*p); // Brim

        ctx.restore();
    }

    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Shadow
        ctx.fillStyle = C_SNOW_SHADOW;
        ctx.fillRect(-5*scale, 22*scale, 10*scale, 3*scale);

        const p = scale;
        
        // Trunk
        ctx.fillStyle = '#5d4037';
        ctx.fillRect(-p, 16*p, 2*p, 6*p);

        // Leaves (Simple Triangle-ish shape)
        ctx.fillStyle = C_TREE_DARK;
        
        // Layer 1 (Bottom)
        ctx.fillRect(-7*p, 8*p, 14*p, 5*p);
        ctx.fillRect(-6*p, 5*p, 12*p, 3*p);
        
        // Layer 2 (Mid)
        ctx.fillRect(-6*p, 2*p, 12*p, 5*p);
        
        // Layer 3 (Top)
        ctx.fillRect(-4*p, -3*p, 8*p, 6*p);

        // Highlights
        ctx.fillStyle = C_TREE_LIGHT;
        ctx.fillRect(-5*p, 9*p, 3*p, 3*p);
        ctx.fillRect(-4*p, 3*p, 3*p, 3*p);
        ctx.fillRect(-2*p, -1*p, 2*p, 2*p);

        ctx.restore();
    }

    function drawSnowflake(x, y, size) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.fillRect(x, y, size, size);
    }

    // Initialization
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        canvas.width = width;
        canvas.height = height;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        
        // CRITIQUE FIX 5: Balance Composition (Fill bottom void)
        // Generate a slope perspective that fills the screen better
        const rows = 25;
        
        for(let i=0; i<rows; i++) {
            let rowIdx = rows - i; 
            
            // Simple perspective math
            let y = height - (rowIdx * (height/rows)) - 20; 
            y += Math.sin(rowIdx * 0.5) * 40; // Uneven terrain
            
            let scale = 0.8 + (rowIdx * 0.25); // Trees get bigger closer to camera
            
            let numTrees = Math.floor(Math.random() * 3) + 1;
            for(let j=0; j<numTrees; j++) {
                let x = Math.random() * width;
                trees.push({x, y, scale, z: rowIdx});
            }
        }
        
        // Sort by Z depth (draw back to front)
        trees.sort((a, b) => a.z - b.z);

        // Generate Snow Particles
        snowParticles = [];
        for(let i=0; i<100; i++) {
            snowParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speed: Math.random() * 4 + 2,
                size: Math.random() * 4 + 2
            });
        }
    }

    function drawBackground() {
        // Sky - Solid Slate Blue (CRITIQUE FIX 1)
        ctx.fillStyle = C_BG;
        ctx.fillRect(0, 0, width, height);

        // Snowy Slope (Bottom 60%)
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.lineTo(0, height * 0.35);
        ctx.bezierCurveTo(width * 0.3, height * 0.25, width * 0.7, height * 0.45, width, height * 0.35);
        ctx.lineTo(width, height);
        ctx.fillStyle = C_SNOW;
        ctx.fill();

        // Slope shading (Right side)
        ctx.beginPath();
        ctx.moveTo(width * 0.7, height * 0.45);
        ctx.lineTo(width, height * 0.35);
        ctx.lineTo(width, height);
        ctx.lineTo(width * 0.7, height);
        ctx.fillStyle = C_SNOW_SHADOW;
        ctx.fill();
    }

    function drawMountains() {
        // Simple jagged mountains in background
        ctx.fillStyle = C_MTN;
        ctx.beginPath();
        ctx.moveTo(0, height * 0.45);
        ctx.lineTo(width * 0.15, height * 0.25);
        ctx.lineTo(width * 0.3, height * 0.35);
        ctx.lineTo(width * 0.45, height * 0.15);
        ctx.lineTo(width * 0.6, height * 0.3);
        ctx.lineTo(width * 0.8, height * 0.15);
        ctx.lineTo(width, height * 0.35);
        ctx.lineTo(width, height * 0.5);
        ctx.lineTo(0, height * 0.5);
        ctx.fill();
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        drawBackground();
        drawMountains();

        // Draw Trees (Background)
        trees.forEach(tree => {
            // CRITIQUE FIX 3: Ensure trees don't overlap the button area too aggressively if possible,
            // but mostly we just want density.
            drawTree(tree.x, tree.y, tree.scale);
        });

        // CRITIQUE FIX 3: Reconstruct Layout & Z-Index
        // Move Skier to Foreground relative to title
        // Title is roughly at 8vh from top.
        // We place Skier at roughly 45% height.
        const skierX = width / 2;
        const skierY = height * 0.45; 
        
        // Draw a shadow under the skier to ground him
        ctx.fillStyle = C_SNOW_SHADOW;
        ctx.beginPath();
        ctx.ellipse(skierX, skierY + 110, 30, 15, 0, 0, Math.PI * 2);
        ctx.fill();

        // Draw Skier (Hero Element)
        drawPixelSkier(skierX, skierY, PIXEL_SIZE * 3); // Make him big

        // Draw Snow Particles (Foreground)
        snowParticles.forEach(p => {
            p.y += p.speed;
            p.x -= 2; // Wind blowing left
            if (p.y > height) p.y = 0;
            if (p.x < 0) p.x = width;
            drawSnowflake(p.x, p.y, p.size);
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);
    
    document.getElementById('startBtn').addEventListener('click', function() {
        this.innerText = "LOADING...";
        this.style.background = "#fff";
        setTimeout(() => {
            alert("Game Start! (This is a visual demo)");
            this.innerText = "START GAME";
            this.style.background = "var(--ui-cream)";
        }, 500);
    });

    // Init
    resize();
    animate();

</script>
</body>
</html>
