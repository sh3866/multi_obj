<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        /* 
           DESIGN CRITIQUE IMPLEMENTATION:
           1. Typography: Using 'Press Start 2P' style (simulated via system fonts) 
              and 'VT323' style (monospace) fallbacks since no external networks.
           2. Layout: 'Sandwich' composition. Top (Title) -> Mid (Skier) -> Bottom (Button).
           3. UI: Flat design, thick borders, high contrast. No skeuomorphism.
           4. Texture: CRT Scanlines + Vignette.
        */

        :root {
            /* Retro Palette */
            --c-sky: #5c94fc;       /* Classic bright blue */
            --c-snow: #f0f8ff;      /* Snow white */
            --c-shadow: #8ba6c8;    /* Blue-ish shadow for snow */
            --c-text: #ffffff;
            --c-text-stroke: #000000;
            
            /* Button Colors - High Contrast */
            --c-btn-bg: #ffcc00;    /* Retro Yellow */
            --c-btn-border: #000000;
            --c-btn-text: #000000;
            
            /* UI Constants */
            --ui-padding: 20px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            /* CRITICAL: Force pixelated rendering for all elements */
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--c-sky);
            /* CRITIQUE FIX 1: Typography - System Pixel Fonts */
            font-family: 'Courier New', Courier, monospace; 
        }

        /* The World Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Sandwich Layout */
            align-items: center;
            pointer-events: none; /* Let clicks pass through to canvas if needed */
            padding: var(--ui-padding);
        }

        /* --- TOP SECTION: Title & Instructions --- */
        .header-section {
            margin-top: 5vh; /* Push down slightly from top edge */
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            z-index: 20;
        }

        h1 {
            margin: 0;
            font-family: 'Courier New', Courier, monospace; /* Fallback for Press Start 2P */
            font-weight: 900;
            font-size: clamp(3rem, 10vw, 7rem);
            text-transform: uppercase;
            color: var(--c-text);
            line-height: 0.9;
            
            /* CRITIQUE FIX 1: Hard solid stroke (Outline) instead of soft shadow */
            /* Using text-shadow hack to create a 4-direction outline */
            text-shadow: 
                4px 4px 0px var(--c-text-stroke),
                -2px -2px 0px var(--c-text-stroke),
                2px -2px 0px var(--c-text-stroke),
                -2px 2px 0px var(--c-text-stroke),
                2px 2px 0px var(--c-text-stroke),
                0px 4px 0px var(--c-text-stroke),
                4px 0px 0px var(--c-text-stroke),
                -4px 0px 0px var(--c-text-stroke),
                0px -4px 0px var(--c-text-stroke);
            
            letter-spacing: -0.02em;
        }

        .instructions {
            margin-top: 1rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            color: var(--c-text);
            text-align: center;
            line-height: 1.5;
            text-transform: uppercase;
            
            /* CRITIQUE FIX 1: Readable stroke */
            text-shadow: 
                2px 2px 0px #000,
                -1px -1px 0px #000,
                1px -1px 0px #000,
                -1px 1px 0px #000,
                1px 1px 0px #000;
        }

        /* --- BOTTOM SECTION: Button --- */
        .action-section {
            margin-bottom: 3vh; /* Resting on the snow area */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            pointer-events: auto; /* Enable clicking */
        }

        /* CRITIQUE FIX 3: Button Redesign (Flat, Pixel Perfect) */
        .start-btn {
            background: var(--c-btn-bg);
            color: var(--c-btn-text);
            border: 4px solid var(--c-btn-border);
            padding: 16px 48px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            
            /* Hard blocky shadow (no blur) */
            box-shadow: 6px 6px 0px #000000;
            
            transition: transform 0.05s, box-shadow 0.05s;
            letter-spacing: 0.05em;
        }

        .start-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px #000000;
            background-color: #ffe066;
        }

        .start-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000000;
        }

        /* --- OVERLAYS --- */
        /* CRITIQUE FIX 4: Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(0,0,0,0.15) 2px,
                rgba(0,0,0,0.15) 4px
            );
            z-index: 100;
            pointer-events: none;
        }
        
        /* Subtle Vignette for CRT curve illusion */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.4) 100%);
            z-index: 90;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas for Procedural Graphics -->
        <canvas id="world"></canvas>
        
        <!-- Visual Overlays -->
        <div class="vignette"></div>
        <div class="scanlines"></div>

        <!-- HUD / UI Layer -->
        <div class="ui-layer">
            
            <!-- Header: Title & Instructions (TOP) -->
            <div class="header-section">
                <h1>SkiFree</h1>
                <div class="instructions">
                    Use Arrow Keys to Ski.<br>
                    Avoid Trees. Run from Yeti.
                </div>
            </div>

            <!-- Middle: (Skier is drawn on Canvas here) -->
            <!-- Spacer div purely for flex layout structure if needed, but flex handles it -->

            <!-- Action: Button (BOTTOM) -->
            <div class="action-section">
                <button class="start-btn" id="startBtn">START GAME</button>
            </div>

        </div>
    </div>

<script>
    /**
     * VISUAL ENGINE
     * Draws the retro pixel art scene procedurally.
     * CRITIQUE FIX 4: Saturated colors, flat shading.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimize

    // State
    let width, height;
    let frame = 0;
    let trees = [];
    let snowParticles = [];
    
    // Palette - CRITIQUE FIX 4: Increased Saturation
    const C_SKY = '#5c94fc';       // Brighter Blue
    const C_SNOW = '#f0f8ff';      // Snow
    const C_SNOW_SHADOW = '#a4c5e2'; // Shadow
    const C_TREE_DARK = '#005a4b';   // Darker, Saturated Green
    const C_TREE_LIGHT = '#009688';  // Brighter Green Highlight
    const C_MTN = '#2c3e50';        // Dark Blue-Grey Mountains

    // Assets
    
    function drawPixelSkier(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Skier Palette
        const cSkin = '#ffcc99';
        const cHat = '#d32f2f';
        const cJacket = '#d32f2f';
        const cPants = '#1a237e';
        const cSkis = '#fbc02d';
        const cPoles = '#9e9e9e';

        // Bobbing animation
        const bob = Math.sin(frame * 0.15) * 4;
        const lean = Math.sin(frame * 0.1) * 0.05; 

        ctx.translate(0, bob);
        ctx.rotate(lean);

        const p = scale; 

        // Skis
        ctx.fillStyle = cSkis;
        ctx.fillRect(-6*p, 10*p, 2*p, 16*p); 
        ctx.fillRect(4*p, 10*p, 2*p, 16*p);  

        // Poles
        ctx.fillStyle = cPoles;
        ctx.fillRect(-7*p, 6*p, p, 16*p);
        ctx.fillRect(6*p, 6*p, p, 16*p);

        // Legs
        ctx.fillStyle = cPants;
        ctx.fillRect(-4*p, 8*p, 3*p, 5*p);
        ctx.fillRect(2*p, 8*p, 3*p, 5*p);

        // Body
        ctx.fillStyle = cJacket;
        ctx.fillRect(-4*p, 2*p, 8*p, 7*p);
        // Jacket detail
        ctx.fillStyle = '#b71c1c'; 
        ctx.fillRect(-4*p, 5*p, 8*p, 2*p);

        // Head
        ctx.fillStyle = cSkin;
        ctx.fillRect(-3*p, -3*p, 6*p, 5*p);
        
        // Hat
        ctx.fillStyle = cHat;
        ctx.fillRect(-3*p, -5*p, 6*p, 3*p);
        ctx.fillRect(-3*p, -5*p, 8*p, 2*p); // Brim

        ctx.restore();
    }

    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        const p = scale;
        
        // Trunk
        ctx.fillStyle = '#3e2723';
        ctx.fillRect(-p, 16*p, 2*p, 6*p);

        // Leaves
        ctx.fillStyle = C_TREE_DARK;
        
        // Layer 1
        ctx.fillRect(-7*p, 8*p, 14*p, 5*p);
        ctx.fillRect(-6*p, 5*p, 12*p, 3*p);
        
        // Layer 2
        ctx.fillRect(-6*p, 2*p, 12*p, 5*p);
        
        // Layer 3
        ctx.fillRect(-4*p, -3*p, 8*p, 6*p);

        // Highlights (Saturated Green)
        ctx.fillStyle = C_TREE_LIGHT;
        ctx.fillRect(-5*p, 9*p, 2*p, 3*p);
        ctx.fillRect(-4*p, 3*p, 2*p, 3*p);
        ctx.fillRect(-2*p, -1*p, 2*p, 2*p);

        ctx.restore();
    }

    function drawSnowflake(x, y, size) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.fillRect(Math.floor(x), Math.floor(y), size, size);
    }

    // Initialization
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        canvas.width = width;
        canvas.height = height;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        
        // CRITIQUE FIX: Layout Balance
        // We need trees to frame the skier nicely.
        const rows = 30;
        
        for(let i=0; i<rows; i++) {
            let rowIdx = rows - i; 
            
            // Slope geometry
            let y = height - (rowIdx * (height/rows)) - 20; 
            y += Math.sin(rowIdx * 0.5) * 50; 
            
            let scale = 0.8 + (rowIdx * 0.3); 
            
            // Density
            let numTrees = Math.floor(Math.random() * 3) + 1;
            if(rowIdx > 10 && rowIdx < 20) numTrees += 2;

            for(let j=0; j<numTrees; j++) {
                // CRITIQUE FIX: Keep center relatively clear for Skier
                let x = Math.random() * width;
                // If in the "Skier Zone" (middle vertical), bias X away from center
                if (y > height * 0.3 && y < height * 0.6) {
                    if (x > width * 0.3 && x < width * 0.7) {
                        // 50% chance to move it out of the way
                        if(Math.random() > 0.5) x = Math.random() < 0.5 ? Math.random() * width * 0.2 : width * 0.8 + Math.random() * width * 0.2;
                    }
                }
                
                trees.push({x, y, scale, z: rowIdx});
            }
        }
        
        // Sort by Z depth
        trees.sort((a, b) => a.z - b.z);

        // Snow Particles
        snowParticles = [];
        for(let i=0; i<150; i++) {
            snowParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speed: Math.random() * 4 + 2,
                size: Math.random() * 4 + 2
            });
        }
    }

    function drawBackground() {
        // Sky
        ctx.fillStyle = C_SKY;
        ctx.fillRect(0, 0, width, height);

        // Snowy Slope
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.lineTo(0, height * 0.35);
        // Jagged horizon
        ctx.lineTo(width * 0.2, height * 0.30);
        ctx.lineTo(width * 0.4, height * 0.40);
        ctx.lineTo(width * 0.6, height * 0.35);
        ctx.lineTo(width * 0.8, height * 0.42);
        ctx.lineTo(width, height * 0.35);
        ctx.lineTo(width, height);
        ctx.fillStyle = C_SNOW;
        ctx.fill();

        // Slope shading (Right side)
        ctx.beginPath();
        ctx.moveTo(width * 0.7, height * 0.38);
        ctx.lineTo(width, height * 0.35);
        ctx.lineTo(width, height);
        ctx.lineTo(width * 0.7, height);
        ctx.fillStyle = C_SNOW_SHADOW;
        ctx.fill();
    }

    function drawMountains() {
        // Mountains
        ctx.fillStyle = C_MTN;
        ctx.beginPath();
        ctx.moveTo(0, height * 0.45);
        ctx.lineTo(width * 0.15, height * 0.25);
        ctx.lineTo(width * 0.3, height * 0.35);
        ctx.lineTo(width * 0.45, height * 0.15);
        ctx.lineTo(width * 0.6, height * 0.3);
        ctx.lineTo(width * 0.8, height * 0.15);
        ctx.lineTo(width, height * 0.35);
        ctx.lineTo(width, height * 0.5);
        ctx.lineTo(0, height * 0.5);
        ctx.fill();
        
        // Snow caps
        ctx.fillStyle = '#ecf0f1';
        ctx.beginPath();
        ctx.moveTo(width * 0.42, height * 0.19);
        ctx.lineTo(width * 0.45, height * 0.15);
        ctx.lineTo(width * 0.48, height * 0.19);
        ctx.fill();
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        drawBackground();
        drawMountains();

        // Draw Trees (Background)
        trees.forEach(tree => {
            drawTree(tree.x, tree.y, tree.scale);
        });

        // Skier Logic
        // CRITIQUE FIX 3: Layout - Skier in the "breathing room"
        const skierX = width / 2;
        const skierY = height * 0.45; 
        
        // Draw a shadow under the skier to ground him
        ctx.fillStyle = C_SNOW_SHADOW;
        ctx.beginPath();
        ctx.ellipse(skierX, skierY + 110, 30, 15, 0, 0, Math.PI * 2);
        ctx.fill();

        // Draw Skier
        drawPixelSkier(skierX, skierY, 4 * 3); // PIXEL_SIZE * 3

        // Draw Snow Particles
        snowParticles.forEach(p => {
            p.y += p.speed;
            p.x -= 2; // Wind blowing left
            if (p.y > height) p.y = 0;
            if (p.x < 0) p.x = width;
            drawSnowflake(p.x, p.y, p.size);
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);
    
    document.getElementById('startBtn').addEventListener('click', function() {
        this.innerText = "LOADING...";
        this.style.background = "#fff";
        setTimeout(() => {
            alert("Game Start! (This is a visual demo)");
            this.innerText = "START GAME";
            this.style.background = "var(--c-btn-bg)";
        }, 500);
    });

    // Init
    resize();
    animate();

</script>
</body>
</html>
