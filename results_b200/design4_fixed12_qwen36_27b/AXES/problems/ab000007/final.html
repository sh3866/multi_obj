<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina: Capture & Collection</title>
<style>
  :root {
    /* Palette */
    --bg-deep: #050510;
    --bg-accent: #1a103c;
    
    --accent-cyan: #00f2ff;
    --accent-glow: rgba(0, 242, 255, 0.6);
    
    --text-primary: #ffffff;
    
    /* UI Elements */
    --ui-bg: rgba(5, 5, 15, 0.75);
    --ui-border: 1px solid rgba(0, 242, 255, 0.3);
    --ui-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: var(--text-primary);
    /* System font stack fallback, but heavily styled to look like a display font */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* --- Atmosphere & Background --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    /* Deep, rich radial gradient for depth */
    background: radial-gradient(circle at 50% 30%, var(--bg-accent) 0%, var(--bg-deep) 80%);
  }

  /* Noise Texture Overlay (SVG Data URI for offline reliability) */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.07;
    pointer-events: none;
    z-index: 1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Ambient Glows */
  .ambient-light {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    z-index: 0;
    animation: breathe 15s infinite alternate ease-in-out;
  }
  .light-1 { width: 600px; height: 600px; top: -10%; left: -10%; background: #2e1065; }
  .light-2 { width: 500px; height: 500px; bottom: -10%; right: -10%; background: #0f172a; animation-delay: -7s; }

  @keyframes breathe {
    0% { transform: scale(1); opacity: 0.3; }
    100% { transform: scale(1.15); opacity: 0.5; }
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none; /* Hide default cursor */
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    padding: 48px; /* 8pt Grid strict spacing */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Header & Title (Left Aligned Column) */
  .header {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    pointer-events: auto;
    /* Align left edges strictly */
    position: relative;
  }

  h1 {
    /* Stylized, Rounded Display Font feel using system fonts */
    font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
    font-weight: 900;
    font-size: 4.5rem;
    line-height: 1;
    margin: 0;
    letter-spacing: -0.02em; /* Tight tracking for display look */
    color: #fff;
    text-transform: uppercase;
    /* Pop effect */
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.4), 0 4px 0px rgba(0,0,0,0.5);
    border-radius: 20px; /* Soften the font rendering */
  }

  .subtitle {
    /* Removed per critique */
    display: none; 
  }

  /* HUD Panel (Solid, High Contrast) */
  .hud-panel {
    /* Solid dark background, distinct from glass */
    background: var(--ui-bg);
    /* Bright border */
    border: var(--ui-border);
    padding: 16px 24px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: var(--ui-shadow);
    margin-top: 32px; /* Increased gap from title */
    min-width: 180px;
    backdrop-filter: blur(4px); /* Slight blur only for legibility */
  }

  .stat-icon {
    width: 28px; height: 28px;
    fill: var(--accent-cyan);
    filter: drop-shadow(0 0 5px var(--accent-cyan));
  }

  .stat-value {
    font-size: 2.5rem; 
    font-weight: 800;
    color: white;
    line-height: 1;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }

  .stat-label {
    font-size: 0.75rem;
    color: var(--accent-cyan);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
    margin-top: 4px;
  }

  /* Footer & Button (Moved to Left, below HUD) */
  .footer {
    display: flex;
    justify-content: flex-start; /* Left Align */
    align-items: flex-start;
    pointer-events: auto;
    margin-top: 24px; /* Spacing from HUD */
  }

  .btn-main {
    /* Distinct CTA Styling */
    background: rgba(0, 242, 255, 0.1);
    border: 1px solid var(--accent-cyan);
    color: #fff;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 800;
    padding: 16px 32px;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.2s ease;
    box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
    position: relative;
    overflow: hidden;
    width: 100%; /* Match HUD width visually */
    max-width: 180px;
  }

  .btn-main:hover {
    background: rgba(0, 242, 255, 0.25);
    box-shadow: 0 0 25px rgba(0, 242, 255, 0.5);
    transform: translateY(-2px);
    text-shadow: 0 0 8px rgba(255,255,255,0.8);
  }
  
  .btn-main:active {
    transform: scale(0.96);
    background: rgba(0, 242, 255, 0.4);
  }

  /* Toast Notification */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0, 0, 0, 0.8);
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    padding: 16px 32px;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: 0.15em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile adjustments */
  @media (max-width: 768px) {
    .ui-layer { padding: 24px; }
    h1 { font-size: 3rem; }
    .hud-panel { margin-top: 24px; }
    .footer { margin-top: 16px; }
    .stat-value { font-size: 2rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Atmosphere -->
  <div class="noise-overlay"></div>
  <div class="ambient-light light-1"></div>
  <div class="ambient-light light-2"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <!-- Left Column: Title, HUD, Button -->
    <div class="header">
      <h1>Lumina</h1>
      <div class="subtitle">Capture & Collection</div> <!-- Hidden via CSS -->
      
      <!-- HUD Panel -->
      <div class="hud-panel">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" />
        </svg>
        <div>
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Collected</div>
        </div>
      </div>

      <!-- Button (Moved to left, below HUD) -->
      <div class="footer">
        <button class="btn-main" onclick="resetGame()">New Collection</button>
      </div>
    </div>

    <div id="toast" class="toast">Specimen Captured</div>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Focus: Bioluminescence, Diagonal Flow, and Player Anchor.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let frameCount = 0;

  // Configuration
  const CREATURE_COUNT = 7;
  
  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    // Re-init creatures on resize to maintain composition
    if(creatures.length > 0) init();
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  window.addEventListener('touchmove', e => {
    e.preventDefault(); 
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.025 + 0.015;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.90; // Drag
      this.vy *= 0.90;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor(index) {
      this.reset(index);
      // Initial random placement for variety on load
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    }

    reset(index) {
      // Design Critique: Arrange in a loose diagonal flow from Top-Right to Bottom-Left
      // Avoiding the Top-Left corner (UI)
      
      // Create a diagonal spread
      const flowFactor = (index / CREATURE_COUNT); 
      
      // Target X: High (Right) to Low (Left)
      const targetX = (width * 0.9) - (flowFactor * (width * 0.7));
      // Target Y: Low (Top) to High (Bottom)
      const targetY = (height * 0.1) + (flowFactor * (height * 0.8));

      // Add randomness around the target flow
      this.x = targetX + (Math.random() - 0.5) * 150;
      this.y = targetY + (Math.random() - 0.5) * 150;

      // Ensure we don't spawn strictly in the UI zone (Top Left)
      if (this.x < 250 && this.y < 300) {
          this.x += 300;
          this.y += 300;
      }

      this.vx = (Math.random() - 0.5) * 0.8;
      this.vy = (Math.random() - 0.5) * 0.8;
      this.baseRadius = Math.random() * 15 + 25; 
      
      // Visual properties - Bioluminescent
      const hue = Math.random() * 360;
      this.color1 = `hsl(${hue}, 80%, 60%)`; 
      this.color2 = `hsl(${(hue + 40) % 360}, 90%, 40%)`;
      this.glowColor = `hsl(${hue}, 100%, 60%)`;
      
      // Organic movement props
      this.angle = 0;
      this.wobbleSpeed = Math.random() * 0.03 + 0.005;
      this.wobble = Math.random() * Math.PI * 2;
      
      this.isCaught = false;
    }

    update() {
      if (this.isCaught) return;

      this.x += this.vx;
      this.y += this.vy;
      this.wobble += this.wobbleSpeed;
      
      // Organic drift
      this.vx += Math.sin(this.wobble) * 0.01;
      this.vy += Math.cos(this.wobble) * 0.01;

      // Soft bounce boundaries
      if (this.x < -50) this.vx = Math.abs(this.vx);
      if (this.x > width + 50) this.vx = -Math.abs(this.vx);
      if (this.y < -50) this.vy = Math.abs(this.vy);
      if (this.y > height + 50) this.vy = -Math.abs(this.vy);

      // Avoid Net (Fear Factor)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 220) {
        const force = (220 - dist) / 220;
        this.vx += (dx / dist) * force * 2.0;
        this.vy += (dy / dist) * force * 2.0;
      }

      // Limit speed
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 5) {
        this.vx = (this.vx / speed) * 5;
        this.vy = (this.vy / speed) * 5;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Rotate slightly based on movement
      const rot = Math.atan2(this.vy, this.vx) + Math.PI/2;
      ctx.rotate(rot);

      const r = this.baseRadius;
      
      // Design Critique: CSS box-shadow equivalent in Canvas (Bioluminescent Glow)
      ctx.shadowBlur = 50; 
      ctx.shadowColor = this.glowColor;

      // Organic Blob Shape using Bezier curves
      ctx.beginPath();
      const points = 6;
      for (let i = 0; i <= points; i++) {
        const angle = (i / points) * Math.PI * 2;
        // Add wobble to radius for organic feel
        const wobbleR = r + Math.sin(angle * 3 + this.wobble * 5) * (r * 0.3);
        const px = Math.cos(angle) * wobbleR;
        const py = Math.sin(angle) * wobbleR;
        
        if (i === 0) ctx.moveTo(px, py);
        else ctx.quadraticCurveTo(px, py, px, py); 
      }
      ctx.closePath();

      // Fill with Duotone Gradient
      const grad = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r);
      grad.addColorStop(0, this.color1);
      grad.addColorStop(1, this.color2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Inner Highlight (Glass effect)
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fill();

      // Eye / Core (Character)
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#fff';
      ctx.beginPath();
      ctx.arc(0, -r * 0.2, r * 0.25, 0, Math.PI * 2);
      ctx.fill();
      
      // Pupil
      ctx.fillStyle = '#000';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(0, -r * 0.2, r * 0.08, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature(i));
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 70; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<30; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color1));
    }

    // Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1200);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 2000);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    if (mouse.x < 0) return; // Don't draw if off screen

    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Outer Ring (Glowing Cyan)
    ctx.shadowBlur = 20;
    ctx.shadowColor = 'rgba(0, 242, 255, 0.6)';
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    
    const pulse = Math.sin(frameCount * 0.15) * 4;
    ctx.arc(0, 0, 65 + pulse, 0, Math.PI * 2);
    ctx.stroke();

    // Net Inner Web (Crosshair - Player Anchor)
    ctx.shadowBlur = 10;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-85, 0); ctx.lineTo(-25, 0);
    ctx.moveTo(85, 0); ctx.lineTo(25, 0);
    ctx.moveTo(0, -85); ctx.lineTo(0, -25);
    ctx.moveTo(0, 85); ctx.lineTo(0, 25);
    ctx.stroke();

    // Capture Zone Indicator (if held)
    if (isMouseDown) {
      ctx.fillStyle = 'rgba(0, 242, 255, 0.2)';
      ctx.shadowColor = 'rgba(0, 242, 255, 0.5)';
      ctx.shadowBlur = 30;
      ctx.beginPath();
      ctx.arc(0, 0, 70, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function loop() {
    frameCount++;
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net (Always on top of creatures)
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
