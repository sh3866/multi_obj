<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Planet Defense - Tactical Interface</title>
<style>
    /* 
     * DESIGN SYSTEM & RESET 
     * Focus: Deep Navy, Electric Cyan, Tactical Monospace
     */
    :root {
        --c-bg-deep: #050a14;
        --c-bg-panel: rgba(5, 10, 20, 0.85);
        
        --c-primary: #00f0ff; /* Electric Cyan */
        --c-primary-dim: rgba(0, 240, 255, 0.15);
        --c-primary-glow: rgba(0, 240, 255, 0.6);
        
        --c-accent: #ff0055; /* Alert Red/Magenta */
        --c-accent-dim: rgba(255, 0, 85, 0.2);
        
        --c-text-main: #e2e8f0;
        --c-text-muted: #8b9bb4;
        
        --font-display: 'Orbitron', 'Segoe UI', sans-serif;
        --font-terminal: 'Share Tech Mono', 'Consolas', 'Courier New', monospace;
        
        --grid-width: 800px;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background-color: var(--c-bg-deep);
        color: var(--c-text-main);
        font-family: var(--font-display);
        display: flex;
        flex-direction: column;
        user-select: none;
    }

    /* --- ATMOSPHERE & LAYERS --- */
    .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    
    /* 1. Canvas Background */
    #bgCanvas { z-index: 0; opacity: 0.4; }
    
    /* 2. Vignette (Focus center) */
    .vignette {
        z-index: 1;
        background: radial-gradient(circle at center, transparent 30%, #02040a 100%);
    }

    /* 3. CRT Scanlines (Diegetic UI) */
    .scanlines {
        z-index: 100;
        background: repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 2px,
            rgba(0, 0, 0, 0.25) 3px,
            rgba(0, 0, 0, 0.25) 4px
        );
        pointer-events: none;
        mix-blend-mode: overlay;
    }

    /* --- HUD HEADER --- */
    header.hud {
        position: relative;
        z-index: 10;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
        border-bottom: 1px solid var(--c-primary-dim);
        background: linear-gradient(180deg, rgba(5, 10, 20, 0.95) 0%, rgba(5, 10, 20, 0.4) 100%);
    }

    .hud-group { display: flex; gap: 40px; }

    .hud-item { display: flex; flex-direction: column; }

    .hud-label {
        font-family: var(--font-display);
        font-size: 0.65rem;
        letter-spacing: 0.2em;
        color: var(--c-primary);
        opacity: 0.8;
        text-transform: uppercase;
        margin-bottom: 4px;
        text-shadow: 0 0 5px var(--c-primary-dim);
    }

    .hud-value {
        font-family: var(--font-terminal);
        font-size: 1.4rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: #fff;
        text-shadow: 0 0 8px rgba(255,255,255,0.3);
    }
    
    .hud-value.accent { color: var(--c-accent); text-shadow: 0 0 8px var(--c-accent-dim); }

    /* --- MAIN CONTENT LAYOUT --- */
    .main-container {
        position: relative;
        z-index: 10;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center; /* Vertically Center */
        align-items: center;
        padding: 20px;
        width: 100%;
        max-width: var(--grid-width);
        margin: 0 auto;
    }

    /* 1. TITLE BLOCK */
    .title-block {
        text-align: center;
        margin-bottom: 24px;
        position: relative;
    }

    h1.game-title {
        font-size: 3.5rem;
        line-height: 1.1;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: #fff;
        text-shadow: 0 0 15px var(--c-primary-dim);
        position: relative;
    }

    /* Subtle Glitch Effect */
    h1.game-title::before, h1.game-title::after {
        content: "PLANET DEFENSE";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.5;
    }
    h1.game-title::before {
        color: var(--c-accent);
        z-index: -1;
        clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%);
        transform: translate(-2px, 0);
        animation: glitch-anim 4s infinite linear alternate-reverse;
    }
    h1.game-title::after {
        color: var(--c-primary);
        z-index: -2;
        clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
        transform: translate(2px, 0);
        animation: glitch-anim 3s infinite linear alternate-reverse;
    }

    /* 2. BRIEFING PANEL (Unified Container) */
    .briefing-panel {
        width: 100%;
        background: var(--c-bg-panel);
        border: 1px solid var(--c-primary-dim);
        border-left: 4px solid var(--c-primary);
        padding: 20px;
        margin-bottom: 24px;
        position: relative;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    /* Decorative corner markers */
    .briefing-panel::after {
        content: '';
        position: absolute;
        top: -1px; right: -1px;
        width: 10px; height: 10px;
        border-top: 2px solid var(--c-primary);
        border-right: 2px solid var(--c-primary);
    }

    .panel-header {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding-bottom: 8px;
    }

    .blink-dot {
        width: 6px; height: 6px;
        background: var(--c-primary);
        margin-right: 12px;
        box-shadow: 0 0 8px var(--c-primary);
        animation: pulse 1s infinite;
    }

    .panel-title {
        font-family: var(--font-display);
        font-size: 0.8rem;
        letter-spacing: 0.15em;
        color: var(--c-primary);
        font-weight: 700;
        text-transform: uppercase;
    }

    .briefing-text {
        font-family: var(--font-terminal);
        font-size: 1rem;
        line-height: 1.6;
        color: var(--c-text-muted);
        text-shadow: 0 0 2px rgba(0,0,0,0.8);
    }

    /* 3. UPGRADE OPTIONS (Unified Container) */
    .upgrades-container {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 40px;
    }

    .upgrade-card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 16px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
    }

    /* Hover State: Tactile & Glowing */
    .upgrade-card:hover {
        background: rgba(0, 240, 255, 0.05);
        border-color: var(--c-primary);
        box-shadow: 0 0 15px var(--c-primary-dim);
        transform: translateY(-2px);
    }

    .upgrade-card:active {
        transform: translateY(1px);
        background: var(--c-primary-dim);
    }

    .u-icon {
        margin-bottom: 10px;
        width: 32px; height: 32px;
        stroke: var(--c-text-main);
        stroke-width: 1.5;
        fill: none;
        transition: stroke 0.2s;
    }
    
    .upgrade-card:hover .u-icon { stroke: var(--c-primary); filter: drop-shadow(0 0 5px var(--c-primary)); }

    .u-name {
        font-family: var(--font-display);
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 6px;
        color: #fff;
    }

    .u-cost {
        font-family: var(--font-terminal);
        font-size: 0.9rem;
        color: var(--c-primary);
        font-weight: bold;
    }

    /* 4. START BUTTON (Tactile Switch) */
    .start-zone {
        width: 100%;
        display: flex;
        justify-content: center;
    }

    .btn-start {
        width: 100%;
        padding: 18px 0;
        background: rgba(0, 0, 0, 0.4);
        border: 2px solid var(--c-primary);
        color: var(--c-primary);
        font-family: var(--font-display);
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        cursor: pointer;
        position: relative;
        transition: all 0.3s ease;
        
        /* Tactile Bevel/Glow */
        box-shadow: 
            inset 0 0 20px rgba(0, 240, 255, 0.1),
            0 0 10px rgba(0, 240, 255, 0.2);
        
        /* Angled Corners for Sci-Fi look */
        clip-path: polygon(
            10px 0, 100% 0, 
            100% calc(100% - 10px), calc(100% - 10px) 100%, 
            0 100%, 0 10px
        );
    }

    .btn-start:hover {
        background: var(--c-primary);
        color: #000;
        box-shadow: 0 0 30px var(--c-primary-glow);
        text-shadow: none;
    }

    /* --- ANIMATIONS --- */
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    
    @keyframes glitch-anim {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
        100% { transform: translate(0); }
    }

    /* Responsive */
    @media (max-width: 600px) {
        .upgrades-container { grid-template-columns: 1fr; gap: 10px; }
        h1.game-title { font-size: 2rem; }
        .hud-group { gap: 15px; }
        .hud-label { font-size: 0.5rem; }
        .hud-value { font-size: 1rem; }
        header.hud { padding: 15px 20px; }
    }
</style>
</head>
<body>

    <!-- VISUAL LAYERS -->
    <canvas id="bgCanvas" class="layer"></canvas>
    <div class="layer vignette"></div>
    <div class="layer scanlines"></div>

    <!-- HUD HEADER -->
    <header class="hud">
        <div class="hud-group">
            <div class="hud-item">
                <span class="hud-label">Wave Seq</span>
                <span class="hud-value">001</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Shield Int.</span>
                <span class="hud-value" style="color: var(--c-primary)">100%</span>
            </div>
        </div>
        <div class="hud-group">
            <div class="hud-item" style="text-align: right;">
                <span class="hud-label">Credits</span>
                <span class="hud-value accent">500 CR</span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT (VERTICAL STACK) -->
    <main class="main-container">
        
        <!-- 1. Title -->
        <div class="title-block">
            <h1 class="game-title">PLANET DEFENSE</h1>
        </div>

        <!-- 2. Briefing Panel -->
        <div class="briefing-panel">
            <div class="panel-header">
                <div class="blink-dot"></div>
                <div class="panel-title">Incoming Transmission</div>
            </div>
            <div class="briefing-text">
                CMDR: Sensors detect hostile swarm approaching Sector 4. Orbital cannons are online. Calibrate turret systems immediately.
            </div>
        </div>

        <!-- 3. Upgrade Options -->
        <div class="upgrades-container">
            <!-- Card 1 -->
            <div class="upgrade-card" onclick="flashCard(this)">
                <svg class="u-icon" viewBox="0 0 24 24">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                </svg>
                <div class="u-name">Damage</div>
                <div class="u-cost">150 CR</div>
            </div>
            <!-- Card 2 -->
            <div class="upgrade-card" onclick="flashCard(this)">
                <svg class="u-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <div class="u-name">Fire Rate</div>
                <div class="u-cost">200 CR</div>
            </div>
            <!-- Card 3 -->
            <div class="upgrade-card" onclick="flashCard(this)">
                <svg class="u-icon" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
                <div class="u-name">Speed</div>
                <div class="u-cost">100 CR</div>
            </div>
        </div>

        <!-- 4. Start Button -->
        <div class="start-zone">
            <button class="btn-start" onclick="startGame()">INITIALIZE DEFENSE</button>
        </div>

    </main>

    <script>
        // --- BACKGROUND PLANET SURFACE ANIMATION ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        function drawPlanetGrid() {
            ctx.clearRect(0, 0, width, height);
            
            const centerX = width / 2;
            const centerY = height * 0.6; // Horizon line
            const gridColor = 'rgba(0, 240, 255, 0.15)'; // Cyan
            
            ctx.strokeStyle = gridColor;
            ctx.lineWidth = 1;

            // 1. Horizontal Lines (Curved for Planet Surface feel)
            // We draw lines that get closer together as they go up (perspective)
            const lineCount = 20;
            const speed = 0.5;
            
            for (let i = 0; i < lineCount; i++) {
                // Calculate Y position with exponential spacing
                let yBase = (i * i * 4) + (time * speed); 
                
                // Wrap around
                if (yBase > height + 500) yBase -= (lineCount * lineCount * 4);

                // Draw line with curve
                ctx.beginPath();
                // Quadratic curve to simulate sphere curvature
                // Control point is higher in the middle to bow the line
                ctx.moveTo(0, yBase);
                ctx.quadraticCurveTo(centerX, yBase - (i * 5), width, yBase);
                ctx.stroke();
            }

            // 2. Vertical Lines (Fan out from center)
            const rayCount = 20;
            for (let i = -rayCount; i <= rayCount; i++) {
                ctx.beginPath();
                // Start at vanishing point (center top-ish)
                const startX = centerX + (i * 10); 
                const startY = -100;
                
                // End at bottom spread
                const endX = centerX + (i * 80);
                const endY = height + 100;
                
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            }

            time++;
            requestAnimationFrame(drawPlanetGrid);
        }

        drawPlanetGrid();

        // --- INTERACTIVITY ---
        function flashCard(element) {
            element.style.borderColor = '#fff';
            element.style.background = 'rgba(255, 255, 255, 0.1)';
            
            setTimeout(() => {
                element.style.borderColor = '';
                element.style.background = '';
            }, 150);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = "CALIBRATING...";
            btn.style.background = "var(--c-primary)";
            btn.style.color = "#000";
            btn.style.boxShadow = "0 0 40px var(--c-primary)";
            
            // Flash effect
            setTimeout(() => {
                document.body.style.transition = "filter 0.1s ease";
                document.body.style.filter = "brightness(3) contrast(1.5)";
                
                setTimeout(() => {
                    alert("GAME ENGINE INITIALIZED");
                    document.body.style.filter = "none";
                    btn.innerHTML = originalText;
                    btn.style.background = "";
                    btn.style.color = "";
                    btn.style.boxShadow = "";
                }, 300);
            }, 800);
        }
    </script>
</body>
</html>
