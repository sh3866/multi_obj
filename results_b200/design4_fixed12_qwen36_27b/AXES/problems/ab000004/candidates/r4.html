<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Planet Defense - Tactical Interface</title>
<style>
    /* 
     * DESIGN SYSTEM & RESET 
     * Identity: Terminal / Sci-Fi / Tactical
     */
    :root {
        --c-bg-deep: #000000;
        --c-bg-navy: #050a14;
        
        --c-primary: #00f0ff; /* Electric Cyan */
        --c-primary-dim: rgba(0, 240, 255, 0.15);
        --c-primary-glow: rgba(0, 240, 255, 0.6);
        
        --c-accent: #ff0055; /* Alert Red/Magenta */
        
        --c-text-main: #e2e8f0;
        --c-text-muted: #8b9bb4;

        /* Typography: System Fonts Only */
        --font-display: 'Impact', 'Arial Black', sans-serif;
        --font-terminal: 'Consolas', 'Lucida Console', 'Courier New', monospace;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background-color: var(--c-bg-deep);
        color: var(--c-text-main);
        font-family: var(--font-terminal); /* Terminal aesthetic everywhere */
        display: flex;
        flex-direction: column;
        user-select: none;
    }

    /* --- ATMOSPHERE & LAYERS --- */
    .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    
    /* 1. The Void (Radial Gradient) */
    .bg-void {
        z-index: 0;
        background: radial-gradient(circle at 50% 50%, #1a253a 0%, #050a14 40%, #000000 100%);
    }

    /* 2. The Planet (CSS Circle) */
    .bg-planet {
        z-index: 1;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -40%);
        width: 60vw;
        height: 60vw;
        max-width: 700px;
        max-height: 700px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(0, 240, 255, 0.05) 0%, transparent 60%);
        box-shadow: 
            inset 20px 0 80px rgba(0,0,0,0.8), /* Shadow side */
            inset -10px 0 40px rgba(0, 240, 255, 0.1), /* Rim light */
            0 0 50px rgba(0, 240, 255, 0.05); /* Atmosphere */
        border: 1px solid rgba(0, 240, 255, 0.1);
    }

    /* 3. Scanlines (Diegetic UI) */
    .scanlines {
        z-index: 100;
        background: repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 2px,
            rgba(0, 0, 0, 0.3) 3px,
            rgba(0, 0, 0, 0.3) 4px
        );
        pointer-events: none;
        mix-blend-mode: multiply;
    }

    /* --- HUD HEADER --- */
    /* Anchored to extreme corners, not centered */
    header.hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 80px;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 30px 40px;
        pointer-events: none; /* Let clicks pass through empty space */
    }

    .hud-group { 
        display: flex; 
        gap: 40px; 
        pointer-events: auto;
    }

    .hud-item { display: flex; flex-direction: column; }

    .hud-label {
        font-family: var(--font-terminal);
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        color: var(--c-primary);
        opacity: 0.7;
        text-transform: uppercase;
        margin-bottom: 4px;
    }

    .hud-value {
        font-family: var(--font-terminal);
        font-size: 1.5rem;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 0 5px rgba(255,255,255,0.3);
    }
    
    .hud-value.accent { color: var(--c-accent); text-shadow: 0 0 8px var(--c-accent); }

    /* --- MAIN CONTENT LAYOUT --- */
    .main-container {
        position: relative;
        z-index: 10;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center; 
        align-items: center;
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        padding: 0 20px;
    }

    /* 1. TITLE BLOCK */
    .title-block {
        text-align: center;
        margin-bottom: 40px;
        position: relative;
    }

    h1.game-title {
        font-family: var(--font-display);
        font-size: 4.5rem;
        line-height: 1;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.1em; /* Geometric spacing */
        color: #fff;
        /* Subtle Glow, No Glitch */
        text-shadow: 0 0 20px var(--c-primary-dim), 0 0 40px rgba(0, 240, 255, 0.2);
    }

    /* 2. BRIEFING PANEL */
    /* Moved left-aligned (visually balanced with right HUD) or reduced width */
    .briefing-panel {
        width: 60%; /* Reduced width */
        max-width: 600px;
        background: rgba(5, 10, 20, 0.6);
        border-left: 2px solid var(--c-primary);
        border-right: 1px solid rgba(255,255,255,0.1);
        border-top: 1px solid rgba(255,255,255,0.1);
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding: 20px 24px;
        margin-bottom: 30px;
        position: relative;
        backdrop-filter: blur(4px);
    }

    .panel-header {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
    }

    .blink-dot {
        width: 8px; height: 8px;
        background: var(--c-primary);
        margin-right: 12px;
        box-shadow: 0 0 8px var(--c-primary);
        animation: pulse 2s infinite;
    }

    .panel-title {
        font-family: var(--font-terminal);
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        color: var(--c-primary);
        font-weight: bold;
        text-transform: uppercase;
    }

    .briefing-text {
        font-family: var(--font-terminal);
        font-size: 0.95rem;
        line-height: 1.6;
        color: var(--c-text-muted);
    }

    /* 3. UPGRADE OPTIONS (Unified Container) */
    .upgrades-container {
        width: 60%; /* Match briefing width */
        max-width: 600px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 40px;
    }

    .upgrade-card {
        background: rgba(0, 255, 255, 0.05); /* Semi-transparent fill */
        border: 1px solid var(--c-primary); /* Solid border */
        padding: 20px 10px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
    }

    .upgrade-card:hover {
        background: rgba(0, 240, 255, 0.15);
        box-shadow: 0 0 20px var(--c-primary-dim);
        transform: translateY(-2px);
    }

    .upgrade-card:active {
        transform: translateY(1px);
        background: var(--c-primary-dim);
    }

    .u-icon {
        margin-bottom: 10px;
        width: 28px; height: 28px;
        stroke: var(--c-primary);
        stroke-width: 2;
        fill: none;
    }
    
    .u-name {
        font-family: var(--font-terminal);
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 6px;
        color: #fff;
        font-weight: bold;
    }

    .u-cost {
        font-family: var(--font-terminal);
        font-size: 0.9rem;
        color: var(--c-primary);
    }

    /* 4. START BUTTON */
    /* Reduced width to match upgrades (approx 60-70%) */
    .start-zone {
        width: 60%;
        max-width: 600px;
        display: flex;
        justify-content: center;
    }

    .btn-start {
        width: 100%;
        padding: 20px 0;
        background: var(--c-primary); /* Solid Cyan */
        color: #000; /* Dark Text */
        font-family: var(--font-display); /* Geometric */
        font-size: 1.2rem;
        font-weight: 900;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        cursor: pointer;
        border: none;
        position: relative;
        transition: all 0.3s ease;
        box-shadow: 0 0 15px var(--c-primary-glow);
    }

    .btn-start:hover {
        background: #fff;
        box-shadow: 0 0 30px var(--c-primary);
    }

    .btn-start:active {
        transform: scale(0.98);
    }

    /* --- ANIMATIONS --- */
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    /* Responsive */
    @media (max-width: 768px) {
        .upgrades-container, .briefing-panel, .start-zone { width: 90%; }
        h1.game-title { font-size: 3rem; }
        .hud-group { gap: 15px; }
        .hud-value { font-size: 1.1rem; }
        header.hud { padding: 20px; }
        .bg-planet { width: 90vw; height: 90vw; }
    }
</style>
</head>
<body>

    <!-- VISUAL LAYERS -->
    <div class="layer bg-void"></div>
    <div class="layer bg-planet"></div>
    <div class="layer scanlines"></div>

    <!-- HUD HEADER (Corners) -->
    <header class="hud">
        <div class="hud-group">
            <div class="hud-item">
                <span class="hud-label">Wave Seq</span>
                <span class="hud-value">001</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Shield Int.</span>
                <span class="hud-value" style="color: var(--c-primary)">100%</span>
            </div>
        </div>
        <div class="hud-group">
            <div class="hud-item" style="text-align: right;">
                <span class="hud-label">Credits</span>
                <span class="hud-value accent">500 CR</span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-container">
        
        <!-- 1. Title -->
        <div class="title-block">
            <h1 class="game-title">PLANET DEFENSE</h1>
        </div>

        <!-- 2. Briefing Panel (Left-aligned visual weight, reduced width) -->
        <div class="briefing-panel">
            <div class="panel-header">
                <div class="blink-dot"></div>
                <div class="panel-title">Incoming Transmission</div>
            </div>
            <div class="briefing-text">
                CMDR: Sensors detect hostile swarm approaching Sector 4. Orbital cannons are online. Calibrate turret systems immediately.
            </div>
        </div>

        <!-- 3. Upgrade Options (Grouped Row) -->
        <div class="upgrades-container">
            <!-- Card 1 -->
            <div class="upgrade-card" onclick="flashCard(this)">
                <svg class="u-icon" viewBox="0 0 24 24">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                </svg>
                <div class="u-name">Damage</div>
                <div class="u-cost">150 CR</div>
            </div>
            <!-- Card 2 -->
            <div class="upgrade-card" onclick="flashCard(this)">
                <svg class="u-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <div class="u-name">Fire Rate</div>
                <div class="u-cost">200 CR</div>
            </div>
            <!-- Card 3 -->
            <div class="upgrade-card" onclick="flashCard(this)">
                <svg class="u-icon" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
                <div class="u-name">Speed</div>
                <div class="u-cost">100 CR</div>
            </div>
        </div>

        <!-- 4. Start Button (Solid, Anchored, Matched Width) -->
        <div class="start-zone">
            <button class="btn-start" onclick="startGame()">INITIALIZE DEFENSE</button>
        </div>

    </main>

    <script>
        // --- INTERACTIVITY ---
        function flashCard(element) {
            element.style.borderColor = '#fff';
            element.style.background = 'rgba(255, 255, 255, 0.2)';
            
            setTimeout(() => {
                element.style.borderColor = '';
                element.style.background = '';
            }, 150);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = "CALIBRATING...";
            
            // Visual feedback
            setTimeout(() => {
                document.body.style.transition = "filter 0.1s ease";
                document.body.style.filter = "brightness(2) contrast(1.2)";
                
                setTimeout(() => {
                    alert("GAME ENGINE INITIALIZED");
                    document.body.style.filter = "none";
                    btn.innerHTML = originalText;
                }, 300);
            }, 800);
        }
    </script>
</body>
</html>
