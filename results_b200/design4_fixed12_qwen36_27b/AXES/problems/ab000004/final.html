<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Planet Defense - Tactical Interface</title>
<style>
    /* 
     * DESIGN SYSTEM & RESET 
     * Identity: Military-Industrial Sci-Fi / Tactical HUD
     */
    :root {
        /* Palette */
        --c-bg-deep: #030508;
        --c-bg-grid: #0a101a;
        
        --c-primary: #00f0ff; /* Cyan - Primary UI */
        --c-primary-dim: rgba(0, 240, 255, 0.15);
        --c-primary-glow: rgba(0, 240, 255, 0.4);
        
        --c-accent: #ffb300; /* Amber - Credits/Alerts */
        --c-accent-dim: rgba(255, 179, 0, 0.15);
        
        --c-text-main: #e2e8f0;
        --c-text-muted: #8b9bb4;
        
        /* Typography */
        --font-display: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif; /* Geometric/Clean */
        --font-terminal: 'Courier New', Courier, monospace; /* Monospace */
        
        /* UI Shapes */
        --clip-chamfer: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        --clip-panel: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background-color: var(--c-bg-deep);
        color: var(--c-text-main);
        font-family: var(--font-terminal);
        display: flex;
        flex-direction: column;
        user-select: none;
    }

    /* --- ATMOSPHERE & LAYERS --- */
    .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    
    /* 1. The Void & Grid Pattern */
    .bg-void {
        z-index: 0;
        background: radial-gradient(circle at 50% 50%, #111a2e 0%, #030508 70%);
    }
    
    .bg-grid {
        z-index: 1;
        background-image: 
            linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
    }

    /* 2. The Planet (CSS Circle) */
    .bg-planet {
        z-index: 1;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -40%);
        width: 50vw;
        height: 50vw;
        max-width: 600px;
        max-height: 600px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(0, 240, 255, 0.02) 0%, transparent 60%);
        box-shadow: 
            inset 20px 0 60px rgba(0,0,0,0.9), 
            inset -10px 0 40px rgba(0, 240, 255, 0.05),
            0 0 100px rgba(0, 240, 255, 0.05);
        border: 1px solid rgba(0, 240, 255, 0.05);
    }

    /* 3. Scanlines */
    .scanlines {
        z-index: 100;
        background: repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 2px,
            rgba(0, 0, 0, 0.2) 3px,
            rgba(0, 0, 0, 0.2) 4px
        );
        pointer-events: none;
        mix-blend-mode: multiply;
    }

    /* --- HUD HEADER --- */
    header.hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100px;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 30px 50px;
        pointer-events: none;
    }

    .hud-group { 
        display: flex; 
        gap: 40px; 
        pointer-events: auto;
    }

    .hud-item { display: flex; flex-direction: column; }

    .hud-label {
        font-family: var(--font-terminal);
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        color: var(--c-primary);
        opacity: 0.8;
        text-transform: uppercase;
        margin-bottom: 6px;
    }

    .hud-value {
        font-family: var(--font-display);
        font-size: 1.8rem;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 0 10px rgba(255,255,255,0.2);
        letter-spacing: 0.05em;
    }
    
    /* Amber Accent for Credits */
    .hud-value.accent { 
        color: var(--c-accent); 
        text-shadow: 0 0 12px var(--c-accent-dim); 
    }

    /* --- MAIN LAYOUT (SPLIT) --- */
    .main-container {
        position: relative;
        z-index: 10;
        flex: 1;
        display: flex;
        width: 100%;
        height: 100%;
        padding-top: 80px; /* Offset for HUD */
    }

    /* 1. LEFT COLUMN: BRIEFING (15% width) */
    .col-left {
        width: 15%;
        padding: 0 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-right: 1px solid rgba(255,255,255,0.05);
    }

    .briefing-block {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .panel-header {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .blink-dot {
        width: 8px; height: 8px;
        background: var(--c-primary);
        box-shadow: 0 0 10px var(--c-primary);
        animation: pulse 2s infinite;
    }

    .panel-title {
        font-family: var(--font-terminal);
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        color: var(--c-primary);
        font-weight: bold;
        text-transform: uppercase;
    }

    .briefing-text {
        font-family: var(--font-terminal);
        font-size: 0.8rem;
        line-height: 1.6;
        color: var(--c-text-muted);
        text-align: justify;
        border-left: 2px solid var(--c-primary-dim);
        padding-left: 15px;
    }

    /* 2. CENTER COLUMN: GAMEPLAY UI */
    .col-center {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 40px;
    }

    /* TITLE */
    h1.game-title {
        font-family: var(--font-display);
        font-size: 5rem;
        line-height: 1;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: #fff;
        text-shadow: 0 0 30px var(--c-primary-dim), 0 0 60px rgba(0, 240, 255, 0.1);
        transform: skewX(-10deg); /* Slight aggressive tilt */
    }

    /* UPGRADES GRID */
    .upgrades-container {
        width: 70%;
        max-width: 800px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .upgrade-card {
        background: rgba(5, 10, 20, 0.6);
        border: 1px solid var(--c-primary);
        padding: 25px 15px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        
        /* Chamfered Shape */
        clip-path: var(--clip-chamfer);
        
        /* Flex centering */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .upgrade-card:hover {
        background: rgba(0, 240, 255, 0.1);
        box-shadow: 0 0 25px var(--c-primary-dim);
        transform: translateY(-3px);
    }

    .upgrade-card:active {
        transform: scale(0.98);
    }

    /* Specific styling for Damage card (Amber accent) */
    .upgrade-card.damage-card {
        border-color: var(--c-accent);
    }
    .upgrade-card.damage-card .u-icon, 
    .upgrade-card.damage-card .u-cost {
        stroke: var(--c-accent);
        color: var(--c-accent);
    }
    .upgrade-card.damage-card:hover {
        background: var(--c-accent-dim);
        box-shadow: 0 0 25px rgba(255, 179, 0, 0.2);
    }

    .u-icon {
        width: 32px; height: 32px;
        stroke: var(--c-primary);
        stroke-width: 2;
        fill: none;
    }
    
    .u-name {
        font-family: var(--font-display);
        font-size: 0.9rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #fff;
        font-weight: 600;
    }

    .u-cost {
        font-family: var(--font-terminal);
        font-size: 0.9rem;
        color: var(--c-primary);
        font-weight: bold;
    }

    /* START BUTTON */
    .btn-start {
        width: 50%;
        max-width: 400px;
        padding: 25px 0;
        background: transparent;
        color: #fff;
        font-family: var(--font-display);
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        cursor: pointer;
        border: 2px solid var(--c-primary);
        position: relative;
        transition: all 0.3s ease;
        
        /* Chamfered Shape */
        clip-path: var(--clip-chamfer);
    }

    .btn-start:hover {
        background: rgba(0, 240, 255, 0.1);
        box-shadow: 0 0 30px var(--c-primary-dim), inset 0 0 20px var(--c-primary-dim);
        border-color: #fff;
        text-shadow: 0 0 8px #fff;
    }

    .btn-start:active {
        transform: scale(0.98);
    }

    /* --- ANIMATIONS --- */
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    /* Responsive */
    @media (max-width: 1024px) {
        .col-left { width: 20%; padding: 0 20px; }
        h1.game-title { font-size: 3.5rem; }
    }

    @media (max-width: 768px) {
        /* Stack layout on mobile */
        .main-container { flex-direction: column; padding-top: 100px; overflow-y: auto; }
        .col-left { 
            width: 100%; 
            border-right: none; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        .briefing-text { display: none; } /* Hide long text on mobile */
        .col-center { padding-bottom: 40px; }
        .upgrades-container { width: 90%; }
        h1.game-title { font-size: 2.5rem; }
        header.hud { padding: 20px; }
        .hud-value { font-size: 1.2rem; }
    }
</style>
</head>
<body>

    <!-- VISUAL LAYERS -->
    <div class="layer bg-void"></div>
    <div class="layer bg-grid"></div>
    <div class="layer bg-planet"></div>
    <div class="layer scanlines"></div>

    <!-- HUD HEADER (Anchored Edges) -->
    <header class="hud">
        <div class="hud-group">
            <div class="hud-item">
                <span class="hud-label">Wave Seq</span>
                <span class="hud-value">001</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Shield Int.</span>
                <span class="hud-value" style="color: var(--c-primary)">100%</span>
            </div>
        </div>
        <div class="hud-group">
            <div class="hud-item" style="text-align: right;">
                <span class="hud-label" style="color: var(--c-accent)">Credits</span>
                <span class="hud-value accent">500 CR</span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT (Split Layout) -->
    <main class="main-container">
        
        <!-- LEFT: Context/Briefing -->
        <aside class="col-left">
            <div class="briefing-block">
                <div class="panel-header">
                    <div class="blink-dot"></div>
                    <div class="panel-title">Transmission</div>
                </div>
                <div class="briefing-text">
                    CMDR: Sensors detect hostile swarm approaching Sector 4. Orbital cannons are online. Calibrate turret systems immediately.
                </div>
            </div>
        </aside>

        <!-- CENTER: Interactive UI -->
        <section class="col-center">
            
            <!-- 1. Title -->
            <h1 class="game-title">PLANET<br>DEFENSE</h1>

            <!-- 2. Upgrade Options (Chamfered) -->
            <div class="upgrades-container">
                <!-- Card 1: Damage (Amber Accent) -->
                <div class="upgrade-card damage-card" onclick="flashCard(this)">
                    <svg class="u-icon" viewBox="0 0 24 24">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                    </svg>
                    <div class="u-name">Damage</div>
                    <div class="u-cost">150 CR</div>
                </div>
                
                <!-- Card 2: Fire Rate -->
                <div class="upgrade-card" onclick="flashCard(this)">
                    <svg class="u-icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <div class="u-name">Fire Rate</div>
                    <div class="u-cost">200 CR</div>
                </div>
                
                <!-- Card 3: Speed -->
                <div class="upgrade-card" onclick="flashCard(this)">
                    <svg class="u-icon" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                    <div class="u-name">Speed</div>
                    <div class="u-cost">100 CR</div>
                </div>
            </div>

            <!-- 3. Start Button (Outline Style, Chamfered) -->
            <button class="btn-start" onclick="startGame()">INITIALIZE DEFENSE</button>

        </section>

    </main>

    <script>
        // --- INTERACTIVITY ---
        function flashCard(element) {
            const originalBg = getComputedStyle(element).background;
            
            // Visual feedback
            element.style.background = 'rgba(255, 255, 255, 0.3)';
            
            setTimeout(() => {
                element.style.background = '';
            }, 150);
        }

        function startGame() {
            const btn = document.querySelector('.btn-start');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = "CALIBRATING...";
            btn.style.borderColor = "var(--c-accent)";
            btn.style.color = "var(--c-accent)";
            
            // Visual feedback
            setTimeout(() => {
                document.body.style.transition = "filter 0.1s ease";
                document.body.style.filter = "brightness(1.5) contrast(1.2)";
                
                setTimeout(() => {
                    // Simulate game start
                    alert("GAME ENGINE INITIALIZED");
                    document.body.style.filter = "none";
                    btn.innerHTML = originalText;
                    btn.style.borderColor = "";
                    btn.style.color = "";
                }, 300);
            }, 800);
        }
    </script>
</body>
</html>
