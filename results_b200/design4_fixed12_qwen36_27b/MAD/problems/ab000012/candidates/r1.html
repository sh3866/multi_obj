<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #000000;
        --bg-center: #1a1a2e;
        --gold-primary: #d4af37;
        --gold-light: #fcf6ba;
        --gold-dark: #aa7c11;
        --violet-primary: #8a2be2;
        --violet-glow: rgba(138, 43, 226, 0.4);
        --glass-bg: rgba(20, 20, 30, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        
        /* System Font Stack for Geometric Sans */
        --font-body: 'Inter', 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
        --font-display: 'Cinzel', 'Times New Roman', serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
    }

    /* --- 1. Atmosphere & Background --- */
    .bg-gradient {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, var(--bg-center) 0%, var(--bg-deep) 100%);
        z-index: 0;
    }

    .noise-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.07;
        pointer-events: none;
        z-index: 1;
        /* CSS Noise generation without external images */
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Canvas for particles */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
    }

    /* --- Layout Structure --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center; /* Center vertically */
        padding: 2rem;
    }

    /* --- 6. Currency UI --- */
    .currency-anchor {
        position: absolute;
        top: 32px;
        right: 32px;
        z-index: 20;
    }

    .currency-pill {
        background: linear-gradient(135deg, rgba(20,20,30,0.9), rgba(10,10,15,0.95));
        border: 1px solid var(--gold-dark);
        border-radius: 8px; /* Slightly less round for "artifact" feel */
        padding: 0.6rem 1.2rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
        backdrop-filter: blur(8px);
    }

    .coin-icon {
        width: 22px;
        height: 22px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 4px var(--gold-dark));
    }

    .currency-amount {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 1.1rem;
        color: var(--gold-light);
        letter-spacing: 0.5px;
    }

    /* --- Typography & Hero --- */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        margin-bottom: -60px; /* Negative margin to pull cards up into the orb */
        z-index: 5;
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 4.5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.2rem;
        /* 5. Rich Multi-stop Gold Gradient */
        background: linear-gradient(to bottom, #fcf6ba 0%, #d4af37 50%, #aa7c11 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));
        position: relative;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-muted);
        /* 5. Tighten letter spacing */
        letter-spacing: 0.1em; 
        text-transform: uppercase;
        margin-bottom: 2rem;
        opacity: 0.9;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* --- 2. Hero Element (The Orb) --- */
    .orb-container {
        position: relative;
        width: 320px; /* Enlarged significantly */
        height: 320px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 4rem; /* Space for cards to overlap */
    }

    /* The Glowing Aura */
    .orb-aura {
        position: absolute;
        width: 140%;
        height: 140%;
        border-radius: 50%;
        background: radial-gradient(circle, var(--violet-glow) 0%, transparent 70%);
        animation: pulse-aura 6s ease-in-out infinite;
        z-index: -1;
        filter: blur(20px);
    }

    /* The Orb Graphic */
    .orb-svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 15px var(--violet-primary));
        animation: float 8s ease-in-out infinite;
    }

    /* --- 3. Layout & Hierarchy (Cards) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        /* Positioned to overlap the orb's bottom glow */
        margin-top: -80px; 
        z-index: 10;
    }

    /* --- 4. Menu Cards Design --- */
    .menu-card {
        background: linear-gradient(180deg, rgba(30, 30, 45, 0.7) 0%, rgba(15, 15, 25, 0.8) 100%);
        border: 1px solid var(--glass-border);
        border-top: 1px solid rgba(255, 255, 255, 0.15); /* Top highlight */
        border-radius: 16px;
        padding: 2rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        overflow: hidden;
    }

    /* Artifact Shine Effect */
    .menu-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 50%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
        transform: skewX(-25deg);
        transition: 0.5s;
    }

    .menu-card:hover {
        transform: translateY(-8px) scale(1.02);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }

    .menu-card:hover::after {
        left: 150%;
        transition: 0.7s;
    }

    .menu-card:active {
        transform: translateY(-4px);
    }

    /* Special 'Summon' Card Styling */
    .menu-card.summon {
        background: linear-gradient(180deg, rgba(45, 30, 60, 0.8) 0%, rgba(20, 15, 30, 0.9) 100%);
        border: 1px solid rgba(138, 43, 226, 0.3);
        box-shadow: 0 0 25px rgba(138, 43, 226, 0.15);
    }
    
    .menu-card.summon:hover {
        border-color: var(--violet-primary);
        box-shadow: 0 0 35px rgba(138, 43, 226, 0.3);
    }

    .card-icon {
        width: 42px;
        height: 42px;
        fill: var(--text-muted);
        transition: fill 0.3s, filter 0.3s, transform 0.3s;
    }

    .menu-card:hover .card-icon {
        fill: var(--text-main);
        filter: drop-shadow(0 0 6px rgba(255,255,255,0.3));
        transform: scale(1.1);
    }

    .menu-card.summon .card-icon {
        fill: var(--violet-primary);
    }

    .menu-card.summon:hover .card-icon {
        fill: #b366ff;
        filter: drop-shadow(0 0 8px var(--violet-primary));
    }

    .card-label {
        font-family: var(--font-body);
        font-size: 1rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
        font-weight: 600;
        text-transform: uppercase;
    }

    .menu-card.summon .card-label {
        color: #d8b4fe;
        text-shadow: 0 0 10px rgba(138, 43, 226, 0.4);
    }

    /* --- Animations --- */
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
    }

    @keyframes pulse-aura {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.05); }
    }

    /* --- Responsive --- */
    @media (max-width: 800px) {
        .game-title { font-size: 3rem; }
        .orb-container { width: 240px; height: 240px; margin-bottom: 2rem; }
        .menu-grid { grid-template-columns: repeat(2, 1fr); margin-top: -40px; }
        .currency-anchor { top: 20px; right: 20px; }
    }
</style>
</head>
<body>

    <!-- 1. Background Elements -->
    <div class="bg-gradient"></div>
    <div class="noise-overlay"></div>
    <canvas id="canvas-bg"></canvas>

    <div class="app-container">
        
        <!-- 6. Currency UI -->
        <div class="currency-anchor">
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.86 0 .53-.43 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.09 1.73 1.27 2.72 2.85 3.05V19h2.15v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.46-3.42z"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </div>

        <!-- Hero Section -->
        <section class="hero-section">
            <!-- 5. Typography -->
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <!-- 2. The Orb -->
            <div class="orb-container">
                <div class="orb-aura"></div>
                <!-- Procedural Orb SVG (Violet/Indigo) -->
                <svg class="orb-svg" viewBox="0 0 200 200">
                    <defs>
                        <radialGradient id="orbGrad" cx="40%" cy="40%" r="60%" fx="30%" fy="30%">
                            <stop offset="0%" style="stop-color:#d8b4fe;stop-opacity:1" />
                            <stop offset="40%" style="stop-color:#8a2be2;stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:#240046;stop-opacity:0.9" />
                        </radialGradient>
                        <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:#fff;stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
                        </radialGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <!-- Outer Ring -->
                    <circle cx="100" cy="100" r="90" stroke="rgba(138, 43, 226, 0.3)" stroke-width="1" fill="none">
                        <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="30s" repeatCount="indefinite" />
                    </circle>
                    <!-- Main Orb -->
                    <circle cx="100" cy="100" r="70" fill="url(#orbGrad)" filter="url(#glow)">
                        <animate attributeName="r" values="68;72;68" dur="5s" repeatCount="indefinite" />
                    </circle>
                    <!-- Inner Core -->
                    <circle cx="100" cy="100" r="20" fill="url(#innerGlow)" opacity="0.6">
                        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite" />
                    </circle>
                    <!-- Magic Rings -->
                    <ellipse cx="100" cy="100" rx="95" ry="30" stroke="rgba(138, 43, 226, 0.5)" stroke-width="1.5" fill="none" transform="rotate(45 100 100)">
                        <animateTransform attributeName="transform" type="rotate" from="45 100 100" to="405 100 100" dur="15s" repeatCount="indefinite" />
                    </ellipse>
                    <ellipse cx="100" cy="100" rx="95" ry="30" stroke="rgba(138, 43, 226, 0.5)" stroke-width="1.5" fill="none" transform="rotate(-45 100 100)">
                        <animateTransform attributeName="transform" type="rotate" from="-45 100 100" to="-405 100 100" dur="15s" repeatCount="indefinite" />
                    </ellipse>
                </svg>
            </div>
        </section>

        <!-- 3. Layout & 4. Menu Cards -->
        <nav class="menu-grid">
            <!-- Summon -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                <span class="card-label">Summon</span>
            </div>

            <!-- Roster -->
            <div class="menu-card" onclick="interact('Roster')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card" onclick="interact('Battle')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M19.5 9.5L12 2l-7.5 7.5L4 11l8 8 8-8-1.5-1.5zm-9.4 2.9l-2.3-2.3L12 6.5l4.2 4.2-2.3 2.3-2.3-2.3z"/>
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card" onclick="interact('Grind')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2l-5.5 9h11L12 2zm0 3.84L13.93 9h-3.87L12 5.84zM17.5 13c-2.49 0-4.5 2.01-4.5 4.5s2.01 4.5 4.5 4.5 4.5-2.01 4.5-4.5-2.01-4.5-4.5-4.5zm0 7c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5zM3 13c-2.49 0-4.5 2.01-4.5 4.5S.51 22 3 22s4.5-2.01 4.5-4.5S5.49 13 3 13zm0 7c-1.38 0-2.5-1.12-2.5-2.5S1.62 15 3 15s2.5 1.12 2.5 2.5S4.38 20 3 20z"/>
                </svg>
                <span class="card-label">Grind</span>
            </div>
        </nav>

    </div>

<script>
    // --- Background Particle System (Mystical Dust) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.2; // Very slow horizontal drift
            this.vy = (Math.random() - 0.5) * 0.2; // Very slow vertical drift
            this.size = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.5;
            this.fadeSpeed = Math.random() * 0.005 + 0.001;
            this.growing = Math.random() > 0.5;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;

            // Twinkle effect
            if (this.growing) {
                this.alpha += this.fadeSpeed;
                if (this.alpha >= 0.6) this.growing = false;
            } else {
                this.alpha -= this.fadeSpeed;
                if (this.alpha <= 0.1) this.growing = true;
            }

            // Wrap around screen
            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            // Use violet/white mix for dust
            ctx.fillStyle = `rgba(200, 200, 255, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // High density for "atmosphere"
        const count = Math.floor((width * height) / 8000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        // Simple visual feedback
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
