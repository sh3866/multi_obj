<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* 4. Color & Atmosphere: Deepened Indigo Background */
        --bg-deep: #050510; 
        --bg-center: #121225;
        
        /* Metallic Gold Palette */
        --gold-primary: #e6c27a;
        --gold-light: #fff2cd;
        --gold-dark: #9e7c38;
        
        /* Deep Violet (Orb Match) */
        --violet-primary: #8a2be2;
        --violet-deep: #240046;
        --violet-glow: rgba(138, 43, 226, 0.5);
        
        /* Glassmorphism */
        --glass-bg: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.08);
        
        /* Typography Colors */
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        
        /* 3. Typography: Geometric Sans */
        --font-body: 'Montserrat', 'Rajdhani', 'Segoe UI', sans-serif;
        --font-display: 'Cinzel', 'Times New Roman', serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
    }

    /* --- 1. Atmosphere & Background --- */
    .bg-gradient {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 30%, var(--bg-center) 0%, var(--bg-deep) 80%);
        z-index: 0;
    }

    .noise-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.05;
        pointer-events: none;
        z-index: 1;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
    }

    /* --- Layout Structure --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1100px;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* 1. Layout Fix: Shift content up */
        justify-content: flex-start; 
        padding-top: 8vh; 
    }

    /* --- Currency UI --- */
    .currency-anchor {
        position: absolute;
        top: 32px;
        right: 32px;
        z-index: 20;
    }

    .currency-pill {
        background: linear-gradient(135deg, rgba(10,10,15,0.85), rgba(5,5,10,0.95));
        border: 1px solid rgba(230, 194, 122, 0.3);
        border-radius: 12px;
        padding: 0.5rem 1.2rem;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        backdrop-filter: blur(8px);
    }

    .coin-icon {
        width: 20px;
        height: 20px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 2px var(--gold-dark));
    }

    .currency-amount {
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 1rem;
        color: var(--gold-light);
        letter-spacing: 0.05em;
    }

    /* --- Typography & Hero --- */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        z-index: 5;
        /* 1. Layout Fix: Pull menu UP into the orb */
        margin-bottom: -70px; 
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 4.5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.2rem;
        /* 4. Color: Metallic Gold Gradient */
        background: linear-gradient(180deg, #fff2cd 0%, #e6c27a 40%, #9e7c38 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 15px rgba(0,0,0,0.9));
        position: relative;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 1.1rem; /* 3. Typography: Increased size */
        font-weight: 600;
        color: #d8b4fe;
        letter-spacing: 0.2em; 
        text-transform: uppercase;
        margin-bottom: 2.5rem;
        /* 3. Typography: Glow/Legibility */
        text-shadow: 0 0 15px rgba(138, 43, 226, 0.6), 0 2px 4px rgba(0,0,0,1);
    }

    /* --- 2. Hero Element (The Orb) --- */
    .orb-container {
        position: relative;
        width: 300px;
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1; /* Behind text, behind cards */
    }

    .orb-aura {
        position: absolute;
        width: 150%;
        height: 150%;
        border-radius: 50%;
        background: radial-gradient(circle, var(--violet-glow) 0%, transparent 60%);
        animation: pulse-aura 6s ease-in-out infinite;
        z-index: -1;
        filter: blur(25px);
    }

    .orb-svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 20px rgba(138, 43, 226, 0.4));
        animation: float 8s ease-in-out infinite;
    }

    /* --- 2. Menu Hierarchy (Cards) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr 1fr; /* 2. Summon is 20% wider */
        gap: 1.2rem;
        width: 100%;
        padding: 0 2rem;
        /* 1. Layout Fix: Overlap orb */
        margin-top: 0; 
        z-index: 20; /* Above orb */
    }

    /* Base Card Styling */
    .menu-card {
        border-radius: 16px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    /* 2. Menu Hierarchy: Glassmorphism for secondary cards */
    .menu-card.secondary {
        background: rgba(20, 20, 30, 0.4);
        border: 1px solid var(--glass-border);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .menu-card.secondary:hover {
        background: rgba(40, 40, 60, 0.5);
        transform: translateY(-5px);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    /* 2. Menu Hierarchy: Distinct 'Deep Violet' for Summon */
    .menu-card.summon {
        background: linear-gradient(180deg, rgba(138, 43, 226, 0.3) 0%, rgba(36, 0, 70, 0.6) 100%);
        border: 1px solid rgba(138, 43, 226, 0.4);
        box-shadow: 0 10px 40px rgba(138, 43, 226, 0.2), inset 0 0 20px rgba(138, 43, 226, 0.1);
    }

    .menu-card.summon:hover {
        background: linear-gradient(180deg, rgba(138, 43, 226, 0.5) 0%, rgba(36, 0, 70, 0.8) 100%);
        transform: translateY(-8px);
        border-color: rgba(180, 100, 255, 0.6);
        box-shadow: 0 15px 50px rgba(138, 43, 226, 0.4), inset 0 0 30px rgba(138, 43, 226, 0.2);
    }

    /* Shine Effect */
    .menu-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
        transform: skewX(-25deg);
        transition: 0.6s;
        pointer-events: none;
    }

    .menu-card:hover::after {
        left: 150%;
    }

    /* Icons */
    .card-icon {
        width: 36px;
        height: 36px;
        fill: var(--text-muted);
        transition: all 0.3s ease;
    }

    .menu-card:hover .card-icon {
        transform: scale(1.1);
        fill: var(--text-main);
    }

    /* 2. Menu Hierarchy: Summon Icon Styling */
    .menu-card.summon .card-icon {
        fill: #e0b0ff;
        filter: drop-shadow(0 0 8px rgba(138, 43, 226, 0.6));
    }

    .menu-card.summon:hover .card-icon {
        fill: #fff;
        filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.8));
    }

    /* 3. Typography: Menu Labels */
    .card-label {
        font-family: var(--font-body);
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-main);
        opacity: 0.9;
    }

    .menu-card.summon .card-label {
        color: #fff;
        text-shadow: 0 0 10px rgba(138, 43, 226, 0.8);
        font-size: 1rem;
    }

    /* --- Animations --- */
    @keyframes float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-10px) scale(1.02); }
    }

    @keyframes pulse-aura {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.1); }
    }

    /* --- Responsive --- */
    @media (max-width: 850px) {
        .game-title { font-size: 3rem; }
        .orb-container { width: 220px; height: 220px; }
        .menu-grid { 
            grid-template-columns: repeat(2, 1fr); 
            gap: 1rem;
            margin-top: -30px;
        }
        /* On mobile, keep Summon distinct or just first */
        .menu-card.summon { grid-column: span 1; } 
    }
</style>
</head>
<body>

    <!-- 1. Background Elements -->
    <div class="bg-gradient"></div>
    <div class="noise-overlay"></div>
    <canvas id="canvas-bg"></canvas>

    <div class="app-container">
        
        <!-- 6. Currency UI -->
        <div class="currency-anchor">
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.86 0 .53-.43 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.09 1.73 1.27 2.72 2.85 3.05V19h2.15v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.46-3.42z"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </div>

        <!-- Hero Section -->
        <section class="hero-section">
            <!-- 3. Typography: Geometric & Serif Contrast -->
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <!-- 2. The Orb (Anchored visually) -->
            <div class="orb-container">
                <div class="orb-aura"></div>
                <!-- Procedural Orb SVG (Deep Violet) -->
                <svg class="orb-svg" viewBox="0 0 200 200">
                    <defs>
                        <radialGradient id="orbGrad" cx="35%" cy="35%" r="65%" fx="30%" fy="30%">
                            <stop offset="0%" style="stop-color:#d8b4fe;stop-opacity:1" />
                            <stop offset="40%" style="stop-color:#8a2be2;stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:#240046;stop-opacity:0.95" />
                        </radialGradient>
                        <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:#fff;stop-opacity:0.9" />
                            <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
                        </radialGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <!-- Outer Ring -->
                    <circle cx="100" cy="100" r="90" stroke="rgba(138, 43, 226, 0.2)" stroke-width="1" fill="none">
                        <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="40s" repeatCount="indefinite" />
                    </circle>
                    <!-- Main Orb -->
                    <circle cx="100" cy="100" r="70" fill="url(#orbGrad)" filter="url(#glow)">
                        <animate attributeName="r" values="68;73;68" dur="6s" repeatCount="indefinite" />
                    </circle>
                    <!-- Inner Core -->
                    <circle cx="100" cy="100" r="18" fill="url(#innerGlow)" opacity="0.7">
                        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite" />
                    </circle>
                    <!-- Magic Rings -->
                    <ellipse cx="100" cy="100" rx="95" ry="28" stroke="rgba(200, 180, 255, 0.3)" stroke-width="1.5" fill="none" transform="rotate(45 100 100)">
                        <animateTransform attributeName="transform" type="rotate" from="45 100 100" to="405 100 100" dur="20s" repeatCount="indefinite" />
                    </ellipse>
                    <ellipse cx="100" cy="100" rx="95" ry="28" stroke="rgba(200, 180, 255, 0.3)" stroke-width="1.5" fill="none" transform="rotate(-45 100 100)">
                        <animateTransform attributeName="transform" type="rotate" from="-45 100 100" to="-405 100 100" dur="20s" repeatCount="indefinite" />
                    </ellipse>
                </svg>
            </div>
        </section>

        <!-- 3. Layout & Hierarchy (Cards) -->
        <nav class="menu-grid">
            <!-- 2. Menu Hierarchy: Summon is distinct (Deep Violet) -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                <span class="card-label">Summon</span>
            </div>

            <!-- 2. Menu Hierarchy: Glassmorphism Secondary Cards -->
            <div class="menu-card secondary" onclick="interact('Roster')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <div class="menu-card secondary" onclick="interact('Battle')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M19.5 9.5L12 2l-7.5 7.5L4 11l8 8 8-8-1.5-1.5zm-9.4 2.9l-2.3-2.3L12 6.5l4.2 4.2-2.3 2.3-2.3-2.3z"/>
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <div class="menu-card secondary" onclick="interact('Grind')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2l-5.5 9h11L12 2zm0 3.84L13.93 9h-3.87L12 5.84zM17.5 13c-2.49 0-4.5 2.01-4.5 4.5s2.01 4.5 4.5 4.5 4.5-2.01 4.5-4.5-2.01-4.5-4.5-4.5zm0 7c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5zM3 13c-2.49 0-4.5 2.01-4.5 4.5S.51 22 3 22s4.5-2.01 4.5-4.5S5.49 13 3 13zm0 7c-1.38 0-2.5-1.12-2.5-2.5S1.62 15 3 15s2.5 1.12 2.5 2.5S4.38 20 3 20z"/>
                </svg>
                <span class="card-label">Grind</span>
            </div>
        </nav>

    </div>

<script>
    // --- Background Particle System (Mystical Dust) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.15;
            this.vy = (Math.random() - 0.5) * 0.15;
            this.size = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.5;
            this.fadeSpeed = Math.random() * 0.003 + 0.001;
            this.growing = Math.random() > 0.5;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;

            // Twinkle effect
            if (this.growing) {
                this.alpha += this.fadeSpeed;
                if (this.alpha >= 0.6) this.growing = false;
            } else {
                this.alpha -= this.fadeSpeed;
                if (this.alpha <= 0.1) this.growing = true;
            }

            // Wrap around screen
            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            // Violet/White mix for dust
            ctx.fillStyle = `rgba(200, 200, 255, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // High density for "atmosphere"
        const count = Math.floor((width * height) / 10000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
