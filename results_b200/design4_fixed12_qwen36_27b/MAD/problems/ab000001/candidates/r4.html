<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Palette: Crisp, Playful, High Contrast --- */
            --bg-page: #FDFBF7; /* Crisp off-white */
            --bg-body-pattern: #F4F1EA;
            
            /* Board Colors */
            --board-frame: #4A6fa5; /* Deep Blue/Teal for frame */
            --board-frame-shadow: #2c4266;
            --tile-base: #FFFDF5; /* Clean paper/wood base */
            --tile-shadow: #EAE5D9;
            --path-color: #2A9D8F; /* Saturated Teal */
            --path-glow: rgba(42, 157, 143, 0.4);
            
            /* Typography & Accents */
            --text-main: #264653;
            --text-muted: #6D8A96;
            --accent-star: #FFB703;
            --accent-star-glow: #FFD166;
            
            /* UI Buttons */
            --btn-primary: #FB8500; /* Vibrant Orange */
            --btn-primary-shadow: #D66800;
            --btn-secondary: #E9ECEF;
            --btn-secondary-text: #495057;
            
            /* Dimensions */
            --board-size: min(92vw, 580px);
            --tile-size: calc(var(--board-size) / 6);
            --gap: 4px;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-page);
            /* Subtle geometric pattern */
            background-image: radial-gradient(var(--bg-body-pattern) 1px, transparent 1px);
            background-size: 24px 24px;
            
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Vertically Center Everything */
            overflow: hidden;
            position: relative;
        }

        /* --- Header & Mascot (Top Left) --- */
        header {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            pointer-events: none; /* Let clicks pass through if needed */
        }

        .mascot-frame {
            width: 80px;
            height: 80px;
            margin-bottom: 0.5rem;
            animation: floatMascot 4s ease-in-out infinite;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        @keyframes floatMascot {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(2deg); }
        }

        .title-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        h1 {
            font-family: 'Arial Black', 'Impact', 'Segoe UI Black', sans-serif;
            font-weight: 900;
            font-size: 2.8rem;
            line-height: 0.9;
            margin: 0;
            color: var(--text-main);
            letter-spacing: -1px;
            /* Playful stroke */
            -webkit-text-stroke: 1px rgba(255,255,255,0.8);
            text-shadow: 2px 2px 0px var(--btn-primary);
        }

        .level-pill {
            margin-top: 8px;
            font-weight: 800;
            font-size: 0.95rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.8);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.05);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- The Board --- */
        .game-container {
            width: var(--board-size);
            height: var(--board-size);
            background: var(--board-frame);
            border-radius: 16px;
            padding: 12px;
            
            /* Clean, floating shadow */
            box-shadow: 
                0 20px 40px rgba(42, 70, 83, 0.15),
                0 10px 10px rgba(42, 70, 83, 0.1),
                inset 0 2px 0 rgba(255,255,255,0.2);
            
            position: relative;
            z-index: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100%;
            height: 100%;
            gap: var(--gap);
            background: var(--board-frame); /* Gap color matches frame */
            border-radius: 8px;
            overflow: hidden;
        }

        .tile {
            position: relative;
            background-color: var(--tile-base);
            cursor: pointer;
            
            /* Subtle bevel for tactile feel */
            box-shadow: 
                inset 0 -3px 0 var(--tile-shadow),
                inset 0 1px 0 #fff;
            
            transition: background-color 0.2s;
        }

        .tile:active {
            background-color: #F0F0E8;
        }

        /* The Paths (High Contrast) */
        .tile svg {
            width: 100%;
            height: 100%;
            stroke: var(--path-color);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            
            /* Clean look, no heavy drop shadows */
            opacity: 0.85;
            transition: stroke 0.3s, filter 0.3s, opacity 0.3s;
        }

        /* Active State (Run Path) */
        .tile.active {
            background-color: #F0FFFD; /* Very subtle teal tint */
        }
        
        .tile.active svg {
            stroke: var(--btn-primary); /* Change path color to orange on run */
            opacity: 1;
            filter: drop-shadow(0 0 4px var(--path-glow));
            stroke-width: 14; /* Slightly thicker */
        }

        /* --- Tokens Layer --- */
        .token-layer {
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px; /* Match padding */
            pointer-events: none;
            z-index: 20;
        }

        /* The Cub Token */
        .cub-token {
            position: absolute;
            width: 85%;
            height: 85%;
            transform: translate(-50%, -50%);
            transition: top 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
        }

        /* The Star Marker */
        .star-marker {
            position: absolute;
            width: 70%;
            height: 70%;
            transform: translate(-50%, -50%);
            color: var(--accent-star);
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.15));
            animation: pulseStar 2s infinite ease-in-out;
        }

        @keyframes pulseStar {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.15) rotate(10deg); }
        }

        /* --- Footer Controls --- */
        footer {
            margin-top: 3rem; /* Increased whitespace */
            width: var(--board-size);
            display: flex;
            justify-content: center;
            
            /* Constrain width to 65% of grid */
            max-width: 65%; 
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            width: 100%;
        }

        button {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.1s;
            
            /* Tactile 3D effect */
            box-shadow: 
                0 4px 0 rgba(0,0,0,0.15);
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-reset {
            background: var(--btn-secondary);
            color: var(--btn-secondary-text);
            flex: 1;
            padding: 16px 0;
            box-shadow: 0 4px 0 #D3D6D8;
        }
        .btn-reset:active { box-shadow: none; }

        .btn-run {
            background: var(--btn-primary);
            color: #fff;
            flex: 1.5; /* Slightly wider */
            padding: 16px 0;
            box-shadow: 0 4px 0 var(--btn-primary-shadow);
            font-size: 1.1rem;
        }
        .btn-run:active { box-shadow: none; }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(253, 251, 247, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-family: 'Arial Black', sans-serif;
            font-size: 4rem;
            color: var(--btn-primary);
            margin: 0;
            transform: rotate(-5deg);
            text-shadow: 3px 3px 0 var(--accent-star);
        }
        .overlay p {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2rem;
        }

        /* Responsive */
        @media (max-width: 600px) {
            :root { --board-size: 94vw; }
            header { top: 1rem; left: 1rem; }
            .mascot-frame { width: 50px; height: 50px; }
            h1 { font-size: 2rem; }
            .level-pill { font-size: 0.75rem; }
            footer { margin-top: 2rem; max-width: 80%; }
            button { padding: 14px 0; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <!-- Mascot SVG -->
        <div class="mascot-frame">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <!-- Ears -->
                <circle cx="25" cy="30" r="14" fill="#8D6E63"/>
                <circle cx="75" cy="30" r="14" fill="#8D6E63"/>
                <circle cx="25" cy="30" r="6" fill="#D7CCC8"/>
                <circle cx="75" cy="30" r="6" fill="#D7CCC8"/>
                <!-- Head -->
                <circle cx="50" cy="60" r="35" fill="#8D6E63"/>
                <!-- Snout -->
                <ellipse cx="50" cy="68" rx="18" ry="14" fill="#FFF"/>
                <!-- Eyes -->
                <circle cx="38" cy="55" r="4" fill="#3E2723"/>
                <circle cx="62" cy="55" r="4" fill="#3E2723"/>
                <circle cx="39" cy="54" r="1.5" fill="#fff"/>
                <circle cx="63" cy="54" r="1.5" fill="#fff"/>
                <!-- Nose -->
                <ellipse cx="50" cy="64" rx="6" ry="4" fill="#3E2723"/>
                <!-- Mouth -->
                <path d="M45 72 Q50 76 55 72" stroke="#3E2723" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
        </div>

        <div class="title-group">
            <h1>Cub n Pup</h1>
            <div class="level-pill">Level 1: The Garden</div>
        </div>
    </header>

    <div class="game-container">
        <div class="grid" id="grid"></div>
        
        <div class="token-layer">
            <!-- Cub Token (Player) -->
            <div class="cub-token" id="cub">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <circle cx="25" cy="30" r="14" fill="#8D6E63"/>
                    <circle cx="75" cy="30" r="14" fill="#8D6E63"/>
                    <circle cx="25" cy="30" r="6" fill="#D7CCC8"/>
                    <circle cx="75" cy="30" r="6" fill="#D7CCC8"/>
                    <circle cx="50" cy="60" r="35" fill="#8D6E63"/>
                    <ellipse cx="50" cy="68" rx="18" ry="14" fill="#FFF"/>
                    <circle cx="38" cy="55" r="4" fill="#3E2723"/>
                    <circle cx="62" cy="55" r="4" fill="#3E2723"/>
                    <circle cx="39" cy="54" r="1.5" fill="#fff"/>
                    <circle cx="63" cy="54" r="1.5" fill="#fff"/>
                    <ellipse cx="50" cy="64" rx="6" ry="4" fill="#3E2723"/>
                    <path d="M45 72 Q50 76 55 72" stroke="#3E2723" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            
            <!-- Star Marker (Goal) -->
            <div class="star-marker" id="star">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                </svg>
            </div>
        </div>
    </div>

    <footer>
        <div class="btn-group">
            <button class="btn-reset" onclick="game.reset()">Reset</button>
            <button class="btn-run" onclick="game.run()">Run Path</button>
        </div>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        const GRID_SIZE = 6;
        
        // SVG Paths for the tiles (Standardized 100x100 viewBox)
        const TILE_TYPES = {
            EMPTY: { paths: [] },
            LINE: { paths: ['M50 0 V100'] }, 
            LINE_H: { paths: ['M0 50 H100'] }, 
            CORNER_TR: { paths: ['M50 0 V50 H100'] },
            CORNER_BR: { paths: ['M100 50 V100 H50'] },
            CORNER_BL: { paths: ['M0 50 V100 H50'] },
            CORNER_TL: { paths: ['M50 0 V50 H0'] },
            T_UP: { paths: ['M0 50 H100 M50 50 V100'] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'] },
            T_LEFT: { paths: ['M0 50 H100 M50 50 V0'] }
        };

        // 6x6 Puzzle Layout
        const PUZZLE_MAP = [
            ['C_TL', 'L', 'C_TR', 'L', 'C_TL', 'L'],
            ['L', 'C_BR', 'L', 'C_TL', 'L', 'L'],
            ['L', 'L', 'C_BL', 'C_BR', 'C_BL', 'C_BR'],
            ['L', 'C_TL', 'L', 'L', 'C_BL', 'L'],
            ['C_TR', 'L', 'C_BL', 'C_BR', 'L', 'L'],
            ['L', 'L', 'L', 'L', 'L', 'L']
        ];

        function createSVG(paths) {
            let svgContent = paths.map(p => `<path d="${p}" />`).join('');
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svgContent}</svg>`;
        }

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 4}; 
                this.cubPos = {x: 0, y: 0};
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const tileType = this.getTileType(x, y);
                        const div = document.createElement('div');
                        div.className = 'tile';
                        div.innerHTML = createSVG(tileType.paths);
                        
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            getTileType(x, y) {
                const layout = PUZZLE_MAP;
                const key = layout[y][x];
                
                const map = {
                    'L': TILE_TYPES.LINE,
                    'L_H': TILE_TYPES.LINE_H,
                    'C_TL': TILE_TYPES.CORNER_TL,
                    'C_TR': TILE_TYPES.CORNER_TR,
                    'C_BL': TILE_TYPES.CORNER_BL,
                    'C_BR': TILE_TYPES.CORNER_BR,
                };
                
                return map[key] || TILE_TYPES.EMPTY;
            }

            updateTokenPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.cubPos = {x: 0, y: 0};
                this.updateTokenPosition(0, 0);
            }

            async run() {
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:4, y:4}, {x:4, y:3}, 
                    {x:5, y:3}, {x:5, y:4} // Star
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    const tile = this.cells[step.y][step.x];
                    
                    tile.classList.add('active');
                    this.updateTokenPosition(step.x, step.y);
                    
                    await new Promise(r => setTimeout(r, 250));
                }

                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 300);
            }
        }

        const game = new Game();

    </script>
</body>
</html>
