<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* --- Palette: Warm Earth & Storybook --- */
            --bg-page: #F7F3E8; /* Creamy Paper */
            
            /* Wood Tones */
            --wood-base: #D7B68D;
            --wood-shadow: #B89363;
            --wood-highlight: #E6D0B3;
            --wood-carved: #7A5638; /* Dark chocolate inset */
            
            /* Ink & Text */
            --ink-dark: #3E2723;
            --ink-soft: #6D4C41;
            
            /* Accents */
            --accent-star: #FFC107;
            --accent-star-glow: #FFECB3;
            
            /* UI Buttons */
            --btn-terracotta: #E06B53;
            --btn-terracotta-dark: #C2523C;
            
            --btn-secondary: #F0EBE0;
            --btn-secondary-text: #8D6E63;
            
            /* Dimensions */
            --board-size: min(90vw, 540px);
            --tile-size: calc(var(--board-size) / 6);
            --gap: 6px;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-page);
            /* Subtle paper noise texture */
            background-image: radial-gradient(var(--ink-soft) 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            opacity: 1;
            
            font-family: 'Baloo 2', 'Fredoka One', 'Nunito', 'Comic Sans MS', sans-serif;
            color: var(--ink-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* Push footer down */
            overflow: hidden;
            padding: 2rem 0 3rem 0;
        }

        /* --- Header & Layout --- */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            max-width: 600px;
            padding: 0 1rem;
            z-index: 10;
            margin-bottom: 2rem; /* Tighter gap */
        }

        /* Mascot Framing */
        .mascot-frame {
            position: absolute;
            left: -10px;
            top: -20px;
            width: 100px;
            height: 100px;
            filter: drop-shadow(4px 6px 4px rgba(62, 39, 35, 0.15));
            z-index: 1;
            animation: breathe 4s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03) rotate(2deg); }
        }

        .title-group {
            text-align: center;
            z-index: 2;
            position: relative;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            line-height: 1;
            color: var(--ink-dark);
            /* Storybook Text Shadow */
            text-shadow: 3px 3px 0px rgba(224, 107, 83, 0.2);
            letter-spacing: -1px;
        }

        .level-pill {
            display: inline-block;
            background: #fff;
            color: var(--ink-soft);
            font-family: 'Segoe UI', 'Roboto', sans-serif; /* Geometric sans for info */
            font-weight: 800;
            font-size: 0.9rem;
            padding: 6px 16px;
            border-radius: 30px;
            margin-top: 8px;
            border: 2px solid rgba(215, 204, 200, 0.5);
            box-shadow: 0 2px 0 rgba(0,0,0,0.05);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* --- The Board (Wooden Aesthetic) --- */
        .game-container {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            background: #5D4037; /* Dark wood frame color */
            border-radius: 12px;
            padding: 12px;
            
            /* 3D Frame Shadow */
            box-shadow: 
                0 15px 35px rgba(62, 39, 35, 0.25),
                inset 0 2px 5px rgba(255,255,255,0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100%;
            height: 100%;
            gap: var(--gap);
            background: rgba(0,0,0,0.1); /* Shadow between tiles */
            border-radius: 6px;
            overflow: hidden;
        }

        .tile {
            position: relative;
            cursor: pointer;
            
            /* The Wooden Block Look */
            background-color: var(--wood-base);
            /* Inner Bevel for raised look */
            box-shadow: 
                inset 2px 2px 0px rgba(255,255,255,0.3), /* Top-Left Highlight */
                inset -2px -2px 0px rgba(0,0,0,0.15); /* Bottom-Right Shadow */
            
            transition: transform 0.1s;
        }

        .tile:active {
            transform: scale(0.98);
        }

        /* Carved Path Lines */
        .tile svg {
            width: 100%;
            height: 100%;
            stroke: var(--wood-carved); /* Dark chocolate */
            stroke-width: 14;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            
            /* The "Carved" Inset Effect */
            filter: drop-shadow(0px 1px 0px rgba(255,255,255,0.25)); 
            transition: stroke 0.3s ease, filter 0.3s ease;
        }

        /* Active/Run State: Glowing Ember */
        .tile.active svg {
            stroke: var(--btn-terracotta);
            filter: drop-shadow(0px 0px 6px rgba(224, 107, 83, 0.6));
        }

        /* --- Tokens Layer --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
            padding: 12px; /* Match container padding */
        }

        /* The Cub Token */
        .cub-token {
            position: absolute;
            width: 80%;
            height: 80%;
            transform: translate(-50%, -50%);
            transition: top 0.3s cubic-bezier(0.25, 1, 0.5, 1), 
                        left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            filter: drop-shadow(0 6px 8px rgba(62, 39, 35, 0.3));
        }

        .cub-token svg {
            width: 100%;
            height: 100%;
        }

        /* The Star Marker */
        .star-marker {
            position: absolute;
            width: 60%;
            height: 60%;
            transform: translate(-50%, -50%);
            color: var(--accent-star);
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
            animation: floatStar 3s infinite ease-in-out;
        }

        @keyframes floatStar {
            0%, 100% { transform: translate(-50%, -50%) translateY(0) rotate(0deg); }
            50% { transform: translate(-50%, -50%) translateY(-8px) rotate(10deg); }
        }

        /* --- Footer Controls --- */
        footer {
            width: var(--board-size);
            display: flex;
            gap: 1rem;
            justify-content: space-between;
            padding: 0 12px;
        }

        button {
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif; /* Geometric Sans */
            font-weight: 800;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            transition: all 0.1s;
            
            /* Tactile Button Base */
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.3),
                0 4px 0 rgba(0,0,0,0.1);
        }

        button:active {
            transform: translateY(3px);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-reset {
            background: var(--btn-secondary);
            color: var(--btn-secondary-text);
            padding: 14px 20px;
            flex: 1;
        }
        .btn-reset:hover { background: #fff; }

        .btn-run {
            background: var(--btn-terracotta);
            color: #fff;
            padding: 14px 20px;
            flex: 2;
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.3),
                0 4px 0 var(--btn-terracotta-dark);
        }
        .btn-run:hover { background: #E87B65; }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(247, 243, 232, 0.9);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-size: 5rem;
            color: var(--btn-terracotta);
            margin: 0;
            transform: rotate(-5deg);
            text-shadow: 4px 4px 0 var(--wood-base);
        }
        .overlay p {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--ink-soft);
            margin-bottom: 2rem;
        }

        /* Responsive */
        @media (max-width: 600px) {
            :root { --board-size: 92vw; }
            h1 { font-size: 2.8rem; }
            .mascot-frame { width: 70px; height: 70px; left: -5px; top: -10px; }
            footer { gap: 0.5rem; }
            button { font-size: 0.9rem; padding: 12px; }
        }
    </style>
</head>
<body>

    <header>
        <!-- Mascot SVG -->
        <div class="mascot-frame">
            <svg viewBox="0 0 100 100">
                <!-- Ears -->
                <circle cx="25" cy="30" r="14" fill="#8D6E63"/>
                <circle cx="75" cy="30" r="14" fill="#8D6E63"/>
                <circle cx="25" cy="30" r="6" fill="#D7CCC8"/>
                <circle cx="75" cy="30" r="6" fill="#D7CCC8"/>
                <!-- Head -->
                <circle cx="50" cy="60" r="35" fill="#8D6E63"/>
                <!-- Snout -->
                <ellipse cx="50" cy="68" rx="18" ry="14" fill="#F5F5F5"/>
                <!-- Eyes -->
                <circle cx="38" cy="55" r="4" fill="#3E2723"/>
                <circle cx="62" cy="55" r="4" fill="#3E2723"/>
                <circle cx="39" cy="54" r="1.5" fill="#fff"/>
                <circle cx="63" cy="54" r="1.5" fill="#fff"/>
                <!-- Nose -->
                <ellipse cx="50" cy="64" rx="6" ry="4" fill="#3E2723"/>
                <!-- Mouth -->
                <path d="M45 72 Q50 76 55 72" stroke="#3E2723" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
        </div>

        <div class="title-group">
            <h1>Cub n Pup</h1>
            <div class="level-pill">Level 1: The Garden</div>
        </div>
    </header>

    <div class="game-container">
        <div class="grid" id="grid"></div>
        
        <div class="token-layer">
            <!-- Cub Token (Player) -->
            <div class="cub-token" id="cub">
                <svg viewBox="0 0 100 100">
                    <circle cx="25" cy="30" r="14" fill="#8D6E63"/>
                    <circle cx="75" cy="30" r="14" fill="#8D6E63"/>
                    <circle cx="25" cy="30" r="6" fill="#D7CCC8"/>
                    <circle cx="75" cy="30" r="6" fill="#D7CCC8"/>
                    <circle cx="50" cy="60" r="35" fill="#8D6E63"/>
                    <ellipse cx="50" cy="68" rx="18" ry="14" fill="#F5F5F5"/>
                    <circle cx="38" cy="55" r="4" fill="#3E2723"/>
                    <circle cx="62" cy="55" r="4" fill="#3E2723"/>
                    <circle cx="39" cy="54" r="1.5" fill="#fff"/>
                    <circle cx="63" cy="54" r="1.5" fill="#fff"/>
                    <ellipse cx="50" cy="64" rx="6" ry="4" fill="#3E2723"/>
                    <path d="M45 72 Q50 76 55 72" stroke="#3E2723" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            
            <!-- Star Marker (Goal) -->
            <div class="star-marker" id="star">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                </svg>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run Path</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        const GRID_SIZE = 6;
        
        // SVG Paths for the wooden tiles
        const TILE_TYPES = {
            EMPTY: { paths: [] },
            LINE: { paths: ['M50 0 V100'] }, 
            LINE_H: { paths: ['M0 50 H100'] }, 
            CORNER_TR: { paths: ['M50 0 V50 H100'] },
            CORNER_BR: { paths: ['M100 50 V100 H50'] },
            CORNER_BL: { paths: ['M0 50 V100 H50'] },
            CORNER_TL: { paths: ['M50 0 V50 H0'] },
            T_UP: { paths: ['M0 50 H100 M50 50 V100'] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'] },
            T_LEFT: { paths: ['M0 50 H100 M50 50 V0'] }
        };

        // 6x6 Puzzle Layout
        const PUZZLE_MAP = [
            ['C_TL', 'L', 'C_TR', 'L', 'C_TL', 'L'],
            ['L', 'C_BR', 'L', 'C_TL', 'L', 'L'],
            ['L', 'L', 'C_BL', 'C_BR', 'C_BL', 'C_BR'],
            ['L', 'C_TL', 'L', 'L', 'C_BL', 'L'],
            ['C_TR', 'L', 'C_BL', 'C_BR', 'L', 'L'],
            ['L', 'L', 'L', 'L', 'L', 'L']
        ];

        function createSVG(paths) {
            let svgContent = paths.map(p => `<path d="${p}" />`).join('');
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svgContent}</svg>`;
        }

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 4}; 
                this.cubPos = {x: 0, y: 0};
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const tileType = this.getTileType(x, y);
                        const div = document.createElement('div');
                        div.className = 'tile';
                        div.innerHTML = createSVG(tileType.paths);
                        
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            getTileType(x, y) {
                const layout = PUZZLE_MAP;
                const key = layout[y][x];
                
                const map = {
                    'L': TILE_TYPES.LINE,
                    'L_H': TILE_TYPES.LINE_H,
                    'C_TL': TILE_TYPES.CORNER_TL,
                    'C_TR': TILE_TYPES.CORNER_TR,
                    'C_BL': TILE_TYPES.CORNER_BL,
                    'C_BR': TILE_TYPES.CORNER_BR,
                };
                
                return map[key] || TILE_TYPES.EMPTY;
            }

            updateTokenPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.cubPos = {x: 0, y: 0};
                this.updateTokenPosition(0, 0);
            }

            async run() {
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:4, y:4}, {x:4, y:3}, 
                    {x:5, y:3}, {x:5, y:4} // Star
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    const tile = this.cells[step.y][step.x];
                    
                    tile.classList.add('active');
                    this.updateTokenPosition(step.x, step.y);
                    
                    await new Promise(r => setTimeout(r, 250));
                }

                setTimeout(() => {
                    this.overlay.classList.add('active');
                }, 300);
            }
        }

        const game = new Game();

    </script>
</body>
</html>
