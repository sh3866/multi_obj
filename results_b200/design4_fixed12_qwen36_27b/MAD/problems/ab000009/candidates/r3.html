<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* Palette - Per Critique: Deep Charcoal & Crisp Warm Off-White */
            --bg-body: #1a1a1a;       /* Dark Canvas */
            --bg-panel: #242424;      /* Slightly lighter for panels */
            
            --board-dark: #2c2c2c;    /* Deep Charcoal */
            --board-light: #f0f0f0;   /* Crisp Warm Off-White */
            
            /* UI Colors */
            --accent-gold: #D4AF37;   /* Elegant Gold */
            --accent-gold-hover: #E5C14D;
            --text-main: #F0F0F0;
            --text-muted: #999999;
            
            /* Dimensions & Spacing */
            --gap-main: 32px;         /* Requested 32px gutter */
            --pad-panel: 24px;
            --radius: 4px;            /* Sharper corners for a more classic look */
            --board-size: 640px;
            
            /* Typography */
            --font-ui: "Georgia", "Times New Roman", serif; /* Requested Serif */
            --font-mono: "Menlo", "Consolas", "Monaco", monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
        }

        /* Layout Container */
        .app-container {
            display: flex;
            gap: var(--gap-main);
            align-items: flex-start;
        }

        /* --- Board Section --- */
        .board-wrapper {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            background: var(--bg-panel);
            padding: 12px; /* Frame */
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            flex-shrink: 0;
            border: 1px solid #333;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            user-select: none;
            position: relative;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Palette Application */
        .square.light { background-color: var(--board-light); color: var(--board-dark); }
        .square.dark { background-color: var(--board-dark); color: var(--board-light); }
        
        /* Highlighting - Subtle Gold Tint */
        .square.selected { 
            background-color: rgba(212, 175, 55, 0.4) !important; 
        }
        .square.possible-move::after {
            content: '';
            width: 20%;
            height: 20%;
            background: rgba(0,0,0,0.2);
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
        }

        /* Coordinates - Serif, Crisp, High Contrast */
        .coord {
            position: absolute;
            font-size: 14px; 
            font-weight: 700;
            pointer-events: none;
            font-family: var(--font-ui);
            z-index: 1;
            opacity: 0.8;
        }
        /* Alignment & Margins */
        .coord.rank { top: 4px; left: 4px; }
        .coord.file { bottom: 4px; right: 4px; }

        /* Pieces - Solid Fills, No Outlines */
        .piece {
            width: 85%;
            height: 85%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            cursor: grab;
            z-index: 2;
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            /* Subtle drop shadow for depth against high contrast board */
            filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.4)); 
        }
        .piece:active { cursor: grabbing; transform: scale(1.1); }

        /* --- Side Panel --- */
        /* Unify Sidebar Layout: Single column, unified background */
        .sidebar {
            width: 320px;
            height: var(--board-size);
            display: flex;
            flex-direction: column;
            background: var(--bg-panel); /* Unified background */
            border-radius: var(--radius);
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* Header / Status & Controls - Re-anchored to top */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--pad-panel);
            background: var(--bg-panel); /* Matches panel bg */
            border-bottom: 1px solid #333; /* Subtle divider */
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .turn-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #555;
            transition: background-color 0.3s;
        }
        .turn-dot.white { background-color: #fff; }
        .turn-dot.black { background-color: #111; border-color: #666; }

        .status-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.02em;
        }
        .timer {
            font-family: var(--font-mono);
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            background: #1a1a1a;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #333;
        }

        /* Move History - Fills remaining space */
        .history-container {
            flex: 1; /* Fills remaining vertical space */
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            position: relative;
        }
        
        .history-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            padding: 16px var(--pad-panel) 8px var(--pad-panel);
            font-weight: 700;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            line-height: 1.8;
            color: #ccc;
            padding: 0 var(--pad-panel) var(--pad-panel) var(--pad-panel);
        }
        
        /* Scrollbar styling */
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

        .move-row {
            display: flex;
            padding: 2px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .move-row:last-child { border-bottom: none; }
        
        .move-num {
            width: 30px;
            color: #666;
            text-align: right;
            padding-right: 12px;
            flex-shrink: 0;
            font-size: 0.85rem;
        }
        .move-white, .move-black {
            flex: 1;
            padding: 0 4px;
            cursor: pointer;
        }
        .move-white:hover, .move-black:hover { color: var(--accent-gold); }

        /* Placeholder for empty history */
        .history-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #555;
            font-style: italic;
            font-size: 0.9rem;
            text-align: center;
            pointer-events: none;
        }

        /* SVG Icons */
        .icon { width: 18px; height: 18px; fill: currentColor; }

        /* Responsive */
        @media (max-width: 1050px) {
            .app-container {
                flex-direction: column;
                align-items: center;
                gap: 24px;
                padding: 20px;
            }
            body { overflow-y: auto; height: auto; }
            .board-wrapper { 
                width: 100%; 
                max-width: 500px; 
                height: auto; 
                aspect-ratio: 1/1; 
            }
            .sidebar { width: 100%; max-width: 500px; height: 300px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Left: Board -->
    <div class="board-wrapper">
        <div class="board" id="chessboard">
            <!-- Generated by JS -->
        </div>
    </div>

    <!-- Right: Sidebar (Unified Column) -->
    <div class="sidebar">
        
        <!-- Header (Top) - Contains Status AND Primary Action -->
        <div class="game-header">
            <div class="status-indicator">
                <div class="turn-dot white" id="turnDot"></div>
                <div>
                    <span class="status-text" id="statusText">White to Move</span>
                </div>
            </div>
            <div class="timer">10:00</div>
        </div>

        <!-- Move History (Middle - Fills Space) -->
        <div class="history-container">
            <div class="history-title">Move History</div>
            <div class="history-list" id="moveHistory">
                <!-- Placeholder Text -->
                <div class="history-placeholder" id="historyPlaceholder">No moves yet</div>
            </div>
        </div>

        <!-- Footer Controls (Bottom) -->
        <div style="padding: 16px 24px; border-top: 1px solid #333; background: var(--bg-panel);">
            <button class="btn-primary" onclick="resetGame()">
                New Game
            </button>
        </div>
    </div>
</div>

        bP: `<svg viewBox="0 0 45 45" xmlns="http://www.w3.org/2000/svg"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="#222"/></svg>`,
        bN: `<svg viewBox="0 0 45 45" xmlns="http://www.w3.org/2000/svg"><path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21" fill="#222"/><path d="M24 18c.38 2.32-4.68 1.97-5 0 3.45-3.18 3.86-6.8 1-10-2.83 3.2-2.34 6.56-1 10" fill="#222"/><path d="M9.5 25.5A4.5 4.5 0 1 1 5 21a4.5 4.5 0 0 1 4.5 4.5z" fill="#222"/><path d="M15 15.5c-1.61 2.59-2.75 5.61-2.75 8.5" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M35 18c1.25 2.16.5 6.25-2.5 9.5" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 25.5A4.5 4.5 0 1 1 5 21a4.5 4.5 0 0 1 4.5 4.5z" fill="#222"/></svg>`,

    };

    // --- State ---
    const initialBoard = [
        ['bR', 'bN', 'bB', 'bQ', 'bK', 'bB', 'bN', 'bR'],
        ['bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP'],
        ['wR', 'wN', 'wB', 'wQ', 'wK', 'wB', 'wN', 'wR']
    ];

    let board = JSON.parse(JSON.stringify(initialBoard));
    let turn = 'w'; // 'w' or 'b'
    let selectedSquare = null;

    // --- Rendering ---
    const boardEl = document.getElementById('chessboard');
    const moveHistoryEl = document.getElementById('moveHistory');
    const statusText = document.getElementById('statusText');
    const turnDot = document.getElementById('turnDot');
    const historyPlaceholder = document.getElementById('historyPlaceholder');

    function renderBoard() {
        boardEl.innerHTML = '';
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.dataset.row = r;
                square.dataset.col = c;
                square.onclick = () => handleSquareClick(r, c);

                // Coordinates
                if (c === 0) {
                    const rank = document.createElement('span');
                    rank.className = 'coord rank';
                    rank.innerText = 8 - r;
                    square.appendChild(rank);
                }
                if (r === 7) {
                    const file = document.createElement('span');
                    file.className = 'coord file';
                    file.innerText = String.fromCharCode(97 + c);
                    square.appendChild(file);
                }

                // Piece
                const pieceCode = board[r][c];
                if (pieceCode) {
                    const piece = document.createElement('div');
                    piece.className = 'piece';
                    piece.innerHTML = SVG_PIECES[pieceCode];
                    square.appendChild(piece);
                }

                // Selection highlight
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    square.classList.add('selected');
                }

                boardEl.appendChild(square);
            }
        }
    }

    function updateStatus() {
        const player = turn === 'w' ? 'White' : 'Black';
        statusText.innerText = `${player} to Move`;
        turnDot.className = `turn-dot ${turn === 'w' ? 'white' : 'black'}`;
    }

    // --- Interaction ---
    function handleSquareClick(r, c) {
        const piece = board[r][c];
        const isOwnPiece = piece && piece.startsWith(turn);

        if (isOwnPiece) {
            // Select piece
            selectedSquare = { r, c };
            renderBoard();
        } else if (selectedSquare) {
            // Move piece (Visual only for this demo)
            movePiece(selectedSquare.r, selectedSquare.c, r, c);
        }
    }

    function movePiece(fromR, fromC, toR, toC) {
        const piece = board[fromR][fromC];
        
        // Update board state
        board[toR][toC] = piece;
        board[fromR][fromC] = '';
        
        // Add fake move to history
        addMoveToHistory(piece, fromR, fromC, toR, toC);

        // Switch turn
        turn = turn === 'w' ? 'b' : 'w';
        selectedSquare = null;
        
        renderBoard();
        updateStatus();
    }

    function addMoveToHistory(piece, fromR, fromC, toR, toC) {
        // Hide placeholder on first move
        if(historyPlaceholder) historyPlaceholder.style.display = 'none';

        const files = 'abcdefgh';
        const ranks = '87654321';
        
        const notation = (piece[1] === 'P' ? '' : piece[1].toUpperCase()) + 
                         files[toC] + ranks[toR];

        if (turn === 'b') { // White just moved (since turn switched to b)
            const moveNum = Math.ceil((moveHistoryEl.children.length) / 2);
            const row = document.createElement('div');
            row.className = 'move-row';
            row.innerHTML = `
                <div class="move-num">${moveNum}.</div>
                <div class="move-white">${notation}</div>
                <div class="move-black"></div>
            `;
            moveHistoryEl.appendChild(row);
        } else { // Black just moved
            const lastRow = moveHistoryEl.lastElementChild;
            if (lastRow) {
                lastRow.querySelector('.move-black').innerText = notation;
            }
        }
        
        // Auto scroll
        moveHistoryEl.scrollTop = moveHistoryEl.scrollHeight;
    }

    function resetGame() {
        board = JSON.parse(JSON.stringify(initialBoard));
        turn = 'w';
        selectedSquare = null;
        moveHistoryEl.innerHTML = '';
        
        // Restore placeholder
        if(historyPlaceholder) {
            historyPlaceholder.style.display = 'block';
            moveHistoryEl.appendChild(historyPlaceholder);
        }
        
        renderBoard();
        updateStatus();
    }

    // --- Init ---
    renderBoard();
    updateStatus();

</script>
</body>
</html>
