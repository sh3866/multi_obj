<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess</title>
    <style>
        :root {
            /* 1. Refined Board Palette & Contrast */
            --board-dark: #4b7399;      /* Slate Blue */
            --board-light: #e8edf9;     /* Warm Cream */
            --board-frame: #2c3e50;     /* Dark Blue-Grey Frame */
            
            /* UI Palette */
            --bg-body: #f0f2f5;         /* Light Neutral Background */
            --bg-panel: #ffffff;        /* White Panel */
            --bg-panel-accent: #f8fafc; /* Very Light Blue-Grey */
            
            --text-main: #2d3748;       /* Dark Slate */
            --text-muted: #718096;      /* Muted Grey */
            
            --accent: #4b7399;          /* Matches Dark Squares */
            --accent-hover: #3b5e82;
            
            --highlight: rgba(255, 255, 0, 0.25);
            --last-move: rgba(155, 199, 0, 0.2);
            
            /* 5. Spacing & Rhythm */
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            
            --board-size: 640px;
            --radius-md: 8px;
            --radius-lg: 12px;

            /* Typography - Geometric Sans-Serif */
            --font-stack: "DM Sans", "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
            --font-mono: "SF Mono", "Roboto Mono", "Consolas", monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
        }

        /* Layout Container - Unified Dashboard */
        .app-container {
            display: flex;
            gap: 24px; /* Tightened gap */
            align-items: flex-start;
            max-width: 1200px;
        }

        /* --- Board Section --- */
        .board-wrapper {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            background: var(--board-frame);
            padding: 12px; /* Tighter frame */
            border-radius: var(--radius-md);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); /* Softer shadow */
            flex-shrink: 0;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            user-select: none;
            position: relative;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Palette Application */
        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        
        /* Highlighting */
        .square.selected { background-color: var(--highlight) !important; }
        .square.last-move { background-color: var(--last-move) !important; }

        /* 3. Coordinate Labels - Integrated */
        .coord-label {
            position: absolute;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            pointer-events: none;
            opacity: 0.7;
        }
        
        /* Color logic for labels to ensure contrast */
        .square.light .coord-label { color: var(--board-dark); }
        .square.dark .coord-label { color: var(--board-light); }

        .coord-file { bottom: 2px; right: 4px; }
        .coord-rank { top: 4px; left: 4px; }

        /* 2. Piece Polish - Filled SVGs */
        .piece {
            width: 85%;
            height: 85%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            cursor: grab;
            z-index: 2;
            transition: transform 0.1s ease;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3)); /* Better depth */
        }
        .piece:active { cursor: grabbing; transform: scale(1.1); }

        /* --- Side Panel --- */
        .sidebar {
            width: 320px;
            height: var(--board-size);
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        /* 4. Side Panel Hierarchy - Controls */
        .panel-header {
            padding: var(--spacing-md);
            background: var(--bg-panel);
            border-bottom: 1px solid #edf2f7;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-xs) 0;
            transition: color 0.2s;
            color: var(--text-muted);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: #edf2f7;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        
        .player-name {
            font-weight: 600;
            font-size: 0.95rem;
        }
        
        .player-timer {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            padding: 4px 8px;
            border-radius: 4px;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        
        /* Active State Styling */
        .active-turn { color: var(--text-main); }
        .active-turn .avatar { 
            background: var(--board-dark); 
            color: #fff; 
            box-shadow: 0 2px 5px rgba(75, 115, 153, 0.4);
        }
        .active-turn .player-timer {
            background: var(--bg-body);
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: var(--spacing-xs);
            margin-top: var(--spacing-md); /* Increased breathing room */
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-stack);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Muted, sophisticated New Game button */
        .btn-primary {
            background-color: var(--board-dark);
            color: #fff;
        }
        .btn-primary:hover { background-color: var(--accent-hover); }

        /* Subtle outline Flip button */
        .btn-secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid #cbd5e0;
        }
        .btn-secondary:hover { 
            background-color: #edf2f7; 
            color: var(--text-main);
            border-color: #a0aec0;
        }

        /* 5. Move History Container */
        .history-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-panel-accent);
            position: relative;
        }
        
        .history-header {
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-weight: 600; /* Lighter weight */
            border-bottom: 1px solid #e2e8f0;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-status {
            font-size: 0.7rem;
            background: #edf2f7;
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-muted);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            padding: 0;
        }
        
        /* Scrollbar styling */
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 2px; }

        .move-row {
            display: flex;
            padding: 6px var(--spacing-md);
            border-bottom: 1px solid rgba(0,0,0,0.03);
            transition: background 0.1s;
        }
        .move-row:hover { background-color: #fff; }
        
        .move-num {
            width: 24px;
            color: var(--text-muted);
            font-size: 0.8rem;
            opacity: 0.6;
            padding-top: 2px;
        }
        .move-cell {
            flex: 1;
            padding: 0 4px;
            cursor: pointer;
            color: var(--text-main);
        }
        .move-cell:hover { color: var(--board-dark); text-decoration: underline; }

        .history-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #a0aec0;
            font-style: italic;
            font-size: 0.85rem;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 1050px) {
            .app-container {
                flex-direction: column;
                align-items: center;
                gap: 24px;
                padding: 20px;
            }
            body { overflow-y: auto; height: auto; }
            .board-wrapper { 
                width: 100%; 
                max-width: 500px; 
                height: auto; 
                aspect-ratio: 1/1; 
            }
            .sidebar { width: 100%; max-width: 500px; height: 400px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Left: Board with Integrated Coordinates -->
    <div class="board-wrapper">
        <div class="board" id="chessboard"></div>
    </div>

    <!-- Right: Sidebar (Unified Column) -->
    <div class="sidebar">
        
        <!-- Header (Top) - Controls Anchored Here -->
        <div class="panel-header">
            <div class="player-row" id="row-black">
                <div class="player-info">
                    <div class="avatar">♚</div>
                    <div class="player-name">Black</div>
                </div>
                <div class="player-timer">10:00</div>
            </div>
            
            <div class="player-row active-turn" id="row-white">
                <div class="player-info">
                    <div class="avatar">♔</div>
                    <div class="player-name">White</div>
                </div>
                <div class="player-timer">10:00</div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="resetGame()">New Game</button>
                <button class="btn btn-secondary" onclick="alert('Flip not implemented in demo')">Flip</button>
            </div>
        </div>

        <!-- Move History (Middle - Fills Space) -->
        <div class="history-container">
            <div class="history-header">
                <span>Move History</span>
                <span class="game-status" id="statusText">White to move</span>
            </div>
            <div class="history-list" id="moveHistory">
                <div class="history-placeholder" id="historyPlaceholder">Game started</div>
            </div>
        </div>
    </div>
</div>

        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP'],
        ['wR', 'wN', 'wB', 'wQ', 'wK', 'wB', 'wN', 'wR']
    ];

    let board = JSON.parse(JSON.stringify(initialBoard));
    let turn = 'w'; // 'w' or 'b'
    let selectedSquare = null;

    // --- Rendering ---
    const boardEl = document.getElementById('chessboard');
    const moveHistoryEl = document.getElementById('moveHistory');
    const historyPlaceholder = document.getElementById('historyPlaceholder');
    const rowWhite = document.getElementById('row-white');
    const rowBlack = document.getElementById('row-black');
    const statusText = document.getElementById('statusText');

    // 3. Coordinate Labels
    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];

    function renderBoard() {
        boardEl.innerHTML = '';
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.dataset.row = r;
                square.dataset.col = c;
                square.onclick = () => handleSquareClick(r, c);

                // Piece
                const pieceCode = board[r][c];
                if (pieceCode) {
                    const piece = document.createElement('div');
                    piece.className = 'piece';
                    piece.innerHTML = SVG_PIECES[pieceCode];
                    square.appendChild(piece);
                }

                // Selection highlight
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    square.classList.add('selected');
                }

                // Integrated Coordinates
                // Bottom Rank (1)
                if (r === 7) {
                    const fileLabel = document.createElement('div');
                    fileLabel.className = 'coord-label coord-file';
                    fileLabel.innerText = files[c];
                    square.appendChild(fileLabel);
                }
                // Left File (a)
                if (c === 0) {
                    const rankLabel = document.createElement('div');
                    rankLabel.className = 'coord-label coord-rank';
                    rankLabel.innerText = ranks[r];
                    square.appendChild(rankLabel);
                }

                boardEl.appendChild(square);
            }
        }
    }

    function updateStatus() {
        if (turn === 'w') {
            rowWhite.classList.add('active-turn');
            rowBlack.classList.remove('active-turn');
            statusText.innerText = "White to move";
        } else {
            rowBlack.classList.add('active-turn');
            rowWhite.classList.remove('active-turn');
            statusText.innerText = "Black to move";
        }
    }

    // --- Interaction ---
    function handleSquareClick(r, c) {
        const piece = board[r][c];
        const isOwnPiece = piece && piece.startsWith(turn);

        if (isOwnPiece) {
            // Select piece
            selectedSquare = { r, c };
            renderBoard();
        } else if (selectedSquare) {
            // Move piece (Visual only for this demo)
            movePiece(selectedSquare.r, selectedSquare.c, r, c);
        }
    }

    function movePiece(fromR, fromC, toR, toC) {
        const piece = board[fromR][fromC];
        
        // Update board state
        board[toR][toC] = piece;
        board[fromR][fromC] = '';
        
        // Add fake move to history
        addMoveToHistory(piece, fromR, fromC, toR, toC);

        // Switch turn
        turn = turn === 'w' ? 'b' : 'w';
        selectedSquare = null;
        
        renderBoard();
        updateStatus();
    }

    function addMoveToHistory(piece, fromR, fromC, toR, toC) {
        // Hide placeholder on first move
        if(historyPlaceholder) historyPlaceholder.style.display = 'none';

        const files = 'abcdefgh';
        const ranks = '87654321';
        
        const notation = (piece[1] === 'P' ? '' : piece[1].toUpperCase()) + 
                         files[toC] + ranks[toR];

        if (turn === 'b') { // White just moved (since turn switched to b)
            const moveNum = Math.ceil((moveHistoryEl.children.length) / 2);
            const row = document.createElement('div');
            row.className = 'move-row';
            row.innerHTML = `
                <div class="move-num">${moveNum}.</div>
                <div class="move-cell move-white">${notation}</div>
                <div class="move-cell move-black"></div>
            `;
            moveHistoryEl.appendChild(row);
        } else { // Black just moved
            const lastRow = moveHistoryEl.lastElementChild;
            if (lastRow) {
                lastRow.querySelector('.move-black').innerText = notation;
            }
        }
        
        // Auto scroll
        moveHistoryEl.scrollTop = moveHistoryEl.scrollHeight;
    }

    function resetGame() {
        board = JSON.parse(JSON.stringify(initialBoard));
        turn = 'w';
        selectedSquare = null;
        moveHistoryEl.innerHTML = '';
        
        // Restore placeholder
        if(historyPlaceholder) {
            historyPlaceholder.style.display = 'block';
            moveHistoryEl.appendChild(historyPlaceholder);
        }
        
        renderBoard();
        updateStatus();
    }

    // --- Init ---
    renderBoard();
    updateStatus();

</script>
</body>
</html>
