<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* 1. Board Palette & Contrast - Premium Colors */
            --board-dark: #302E2B;      /* Deep Charcoal */
            --board-light: #EFECD6;     /* Warm Cream */
            --highlight: rgba(255, 255, 0, 0.35);
            --last-move: rgba(155, 199, 0, 0.41);
            
            /* UI Palette */
            --bg-body: #1E1E1E;
            --bg-panel: #282828;
            --bg-panel-secondary: #323232;
            
            --text-main: #E0E0E0;
            --text-muted: #888888;
            --accent: #D4AF37;          /* Gold Accent */
            --accent-hover: #E5C14D;
            
            /* 5. Spacing & Rhythm - 8pt Grid System */
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            
            --board-size: 640px;
            --radius-sm: 4px;
            --radius-md: 8px;

            /* 3. Typography - Unified Sans-Serif */
            --font-stack: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "Roboto Mono", "Menlo", "Consolas", monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-stack);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
        }

        /* Layout Container */
        .app-container {
            display: flex;
            gap: var(--spacing-lg); /* 32px gap */
            align-items: flex-start;
        }

        /* --- Board Section --- */
        .board-wrapper {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            background: var(--bg-panel);
            padding: var(--spacing-sm); /* 16px frame */
            border-radius: var(--radius-sm);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            user-select: none;
            position: relative;
            border: 2px solid #1a1a1a;
        }

        .square {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Palette Application */
        .square.light { background-color: var(--board-light); color: var(--board-dark); }
        .square.dark { background-color: var(--board-dark); color: var(--board-light); }
        
        /* Highlighting */
        .square.selected { background-color: var(--highlight) !important; }
        .square.last-move { background-color: var(--last-move) !important; }

        .square.possible-move::after {
            content: '';
            width: 24%;
            height: 24%;
            background: rgba(0,0,0,0.15);
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
        }
        .square.dark.possible-move::after { background: rgba(0,0,0,0.2); }

        /* 2. Coordinate System - Outer Frame */
        .coords-top, .coords-bottom {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: var(--board-size);
            height: 20px;
        }
        .coords-left, .coords-right {
            display: grid;
            grid-template-rows: repeat(8, 1fr);
            height: var(--board-size);
            width: 20px;
        }

        .coord-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            opacity: 0.7;
        }
        .coords-bottom .coord-label { justify-content: center; margin-top: 4px; }
        .coords-top .coord-label { justify-content: center; margin-bottom: 4px; }
        .coords-left .coord-label { align-items: center; margin-right: 4px; }
        .coords-right .coord-label { align-items: center; margin-left: 4px; }

        /* 6. Piece Polish */
        .piece {
            width: 85%;
            height: 85%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            cursor: grab;
            z-index: 2;
            transition: transform 0.1s ease;
            /* Removed heavy drop shadows */
        }
        .piece:active { cursor: grabbing; transform: scale(1.05); }

        /* --- Side Panel --- */
        .sidebar {
            width: 320px;
            height: var(--board-size);
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            border-radius: var(--radius-md);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            border: 1px solid #333;
        }

        /* 4. Side Panel Hierarchy - Controls at Top */
        .panel-header {
            padding: var(--spacing-md);
            background: var(--bg-panel);
            border-bottom: 1px solid #333;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-sm);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background: #444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        .player-name {
            font-weight: 600;
            font-size: 1rem;
        }
        
        .player-timer {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            background: #1a1a1a;
            padding: 6px 12px;
            border-radius: 4px;
            color: var(--text-main);
        }
        
        .active-turn .player-name { color: var(--accent); }
        .active-turn .avatar { border: 2px solid var(--accent); }

        .controls {
            display: flex;
            gap: var(--spacing-xs);
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font-stack);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #1a1a1a;
        }
        .btn-primary:hover { background-color: var(--accent-hover); }

        .btn-secondary {
            background-color: var(--bg-panel-secondary);
            color: var(--text-main);
            border: 1px solid #444;
        }
        .btn-secondary:hover { background-color: #444; }

        /* Move History */
        .history-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            overflow: hidden;
        }
        
        .history-header {
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 700;
            border-bottom: 1px solid #333;
            background: var(--bg-panel-secondary);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            padding: var(--spacing-sm) 0;
        }
        
        /* Scrollbar styling */
        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        .move-row {
            display: flex;
            padding: 4px var(--spacing-md);
            transition: background 0.1s;
        }
        .move-row:hover { background-color: #333; }
        
        .move-num {
            width: 32px;
            color: #666;
            font-size: 0.85rem;
            padding-top: 2px;
        }
        .move-cell {
            flex: 1;
            padding: 0 8px;
            cursor: pointer;
            color: #ccc;
        }
        .move-cell:hover { color: var(--accent); }

        .history-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #555;
            font-style: italic;
            font-size: 0.9rem;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 1050px) {
            .app-container {
                flex-direction: column;
                align-items: center;
                gap: 24px;
                padding: 20px;
            }
            body { overflow-y: auto; height: auto; }
            .board-wrapper { 
                width: 100%; 
                max-width: 500px; 
                height: auto; 
                aspect-ratio: 1/1; 
            }
            .coords-top, .coords-bottom { width: 100%; max-width: 500px; }
            .coords-left, .coords-right { height: auto; aspect-ratio: 1/1; }
            .sidebar { width: 100%; max-width: 500px; height: 400px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Left: Board with Outer Coordinates -->
    <div>
        <div class="coords-top" id="coordsTop"></div>
        <div style="display: flex;">
            <div class="coords-left" id="coordsLeft"></div>
            <div class="board-wrapper">
                <div class="board" id="chessboard"></div>
            </div>
            <div class="coords-right" id="coordsRight"></div>
        </div>
        <div class="coords-bottom" id="coordsBottom"></div>
    </div>

    <!-- Right: Sidebar (Unified Column) -->
    <div class="sidebar">
        
        <!-- Header (Top) - Controls Anchored Here -->
        <div class="panel-header">
            <div class="player-row" id="row-black">
                <div class="player-info">
                    <div class="avatar">♚</div>
                    <div class="player-name">Black</div>
                </div>
                <div class="player-timer">10:00</div>
            </div>
            
            <div class="player-row active-turn" id="row-white">
                <div class="player-info">
                    <div class="avatar">♔</div>
                    <div class="player-name">White</div>
                </div>
                <div class="player-timer">10:00</div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="resetGame()">New Game</button>
                <button class="btn btn-secondary" onclick="alert('Flip not implemented in demo')">Flip</button>
            </div>
        </div>

        <!-- Move History (Middle - Fills Space) -->
        <div class="history-container">
            <div class="history-header">Move History</div>
            <div class="history-list" id="moveHistory">
                <div class="history-placeholder" id="historyPlaceholder">Game started</div>
            </div>
        </div>
    </div>
</div>

    const moveHistoryEl = document.getElementById('moveHistory');

    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];

    function initCoordinates() {
        const top = document.getElementById('coordsTop');
        const bottom = document.getElementById('coordsBottom');
        const left = document.getElementById('coordsLeft');
        const right = document.getElementById('coordsRight');

        files.forEach(f => {
            top.innerHTML += `<div class="coord-label">${f}</div>`;
            bottom.innerHTML += `<div class="coord-label">${f}</div>`;
        });
        ranks.forEach(r => {
            left.innerHTML += `<div class="coord-label">${r}</div>`;
            right.innerHTML += `<div class="coord-label">${r}</div>`;
        });
    }
    initCoordinates();

    function renderBoard() {
        boardEl.innerHTML = '';

            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.dataset.row = r;
                square.dataset.col = c;
                square.onclick = () => handleSquareClick(r, c);

                // Piece
                const pieceCode = board[r][c];
                if (pieceCode) {
                    const piece = document.createElement('div');
                    piece.className = 'piece';
                    piece.innerHTML = SVG_PIECES[pieceCode];
                    square.appendChild(piece);
                }

                // Selection highlight
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    square.classList.add('selected');
                }

                boardEl.appendChild(square);
            }
        }
    }

    function updateStatus() {
        if (turn === 'w') {
            rowWhite.classList.add('active-turn');
            rowBlack.classList.remove('active-turn');
        } else {
            rowBlack.classList.add('active-turn');
            rowWhite.classList.remove('active-turn');
        }
    }

    // --- Interaction ---
    function handleSquareClick(r, c) {
        const piece = board[r][c];
        const isOwnPiece = piece && piece.startsWith(turn);

        if (isOwnPiece) {
            // Select piece
            selectedSquare = { r, c };
            renderBoard();
        } else if (selectedSquare) {
            // Move piece (Visual only for this demo)
            movePiece(selectedSquare.r, selectedSquare.c, r, c);
        }
    }

    function movePiece(fromR, fromC, toR, toC) {
        const piece = board[fromR][fromC];
        
        // Update board state
        board[toR][toC] = piece;
        board[fromR][fromC] = '';
        
        // Add fake move to history
        addMoveToHistory(piece, fromR, fromC, toR, toC);

        // Switch turn
        turn = turn === 'w' ? 'b' : 'w';
        selectedSquare = null;
        
        renderBoard();
        updateStatus();
    }

    function addMoveToHistory(piece, fromR, fromC, toR, toC) {
        // Hide placeholder on first move
        if(historyPlaceholder) historyPlaceholder.style.display = 'none';

        const files = 'abcdefgh';
        const ranks = '87654321';
        
        const notation = (piece[1] === 'P' ? '' : piece[1].toUpperCase()) + 
                         files[toC] + ranks[toR];

        if (turn === 'b') { // White just moved (since turn switched to b)
            const moveNum = Math.ceil((moveHistoryEl.children.length) / 2);
            const row = document.createElement('div');
            row.className = 'move-row';
            row.innerHTML = `
                <div class="move-num">${moveNum}.</div>
                <div class="move-cell move-white">${notation}</div>
                <div class="move-cell move-black"></div>
            `;
            moveHistoryEl.appendChild(row);
        } else { // Black just moved
            const lastRow = moveHistoryEl.lastElementChild;
            if (lastRow) {
                lastRow.querySelector('.move-black').innerText = notation;
            }
        }
        
        // Auto scroll
        moveHistoryEl.scrollTop = moveHistoryEl.scrollHeight;
    }

    function resetGame() {
        board = JSON.parse(JSON.stringify(initialBoard));
        turn = 'w';
        selectedSquare = null;
        moveHistoryEl.innerHTML = '';
        
        // Restore placeholder
        if(historyPlaceholder) {
            historyPlaceholder.style.display = 'block';
            moveHistoryEl.appendChild(historyPlaceholder);
        }
        
        renderBoard();
        updateStatus();
    }

    // --- Init ---
    renderBoard();
    updateStatus();

</script>
</body>
</html>
