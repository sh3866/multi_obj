<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aether Catch</title>
<style>
  :root {
    /* Palette - Refined for depth */
    --bg-deep: #05050a;
    --bg-violet: #120b29;
    --bg-indigo: #1a1542;
    
    --accent-teal: #00f2ff;
    --accent-lavender: #d9a0ff;
    --accent-amber: #ffaa00;
    
    --text-main: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.6);
    
    /* Dimensions - Critique 3: Strict 48px Outer Margin */
    --ui-margin: 48px;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: var(--text-main);
    /* Critique 4: Playful Rounded Font (System Fallbacks) */
    font-family: 'Fredoka', 'Nunito', 'Varela Round', 'Quicksand', 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  /* --- Background Atmosphere --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    /* Critique 6: Subtle radial gradient for depth */
    background: radial-gradient(circle at 50% 50%, var(--bg-indigo) 0%, var(--bg-violet) 50%, var(--bg-deep) 100%);
    overflow: hidden;
  }

  /* Noise Texture Overlay */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.06;
    pointer-events: none;
    z-index: 1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none; /* Custom Net Cursor */
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    /* Critique 3: 48px Margin applied to frame content */
    padding: var(--ui-margin); 
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start; /* Critique 3: Vertically aligned top axis */
    pointer-events: auto;
    width: 100%;
    /* Critique 1: Diagonal flow - Title Left, HUD Right */
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Critique 4: Refined Typography */
  h1 {
    /* Rounded, playful display font stack */
    font-family: 'Fredoka', 'Nunito', 'Varela Round', sans-serif; 
    font-size: 4.5rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
    line-height: 1;
    color: white;
    /* Subtle texture */
    background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .subtitle {
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    /* Critique 4: Soft Lavender/White instead of low-contrast cyan */
    color: var(--accent-lavender);
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    text-shadow: 0 0 15px rgba(217, 160, 255, 0.3);
  }

  /* HUD */
  .hud-container {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0;
  }

  .hud-panel {
    /* Critique 5: Glass-morphism effect */
    background: rgba(10, 10, 25, 0.4);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 12px 24px;
    border-radius: 50px; /* Pill shape */
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    transition: transform 0.2s ease;
  }
  
  .hud-panel:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 255, 255, 0.3);
  }

  .stat-icon {
    width: 20px; height: 20px;
    fill: var(--accent-amber);
    filter: drop-shadow(0 0 6px var(--accent-amber));
  }

  .stat-value {
    font-family: 'Fredoka', 'Nunito', sans-serif;
    font-size: 1.8rem;
    color: white;
    font-weight: 700;
    line-height: 1;
    min-width: 40px;
    text-align: right;
  }

  .stat-label {
    font-family: 'Nunito', sans-serif;
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
  }

  /* Footer */
  .footer {
    display: flex;
    /* Critique 1: Button Bottom-Right */
    justify-content: flex-end;
    width: 100%;
    pointer-events: auto;
  }

  /* Critique 5 & 4: Enhanced Button */
  .btn-main {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: var(--text-main);
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    padding: 16px 40px;
    border-radius: 50px; /* Pill shape */
    cursor: pointer;
    text-transform: uppercase;
    /* Critique 4: Removed excessive letter-spacing */
    letter-spacing: 0.05em; 
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }

  .btn-main:hover {
    background: rgba(217, 160, 255, 0.15);
    border-color: var(--accent-lavender);
    box-shadow: 0 0 25px rgba(217, 160, 255, 0.2);
    color: var(--accent-lavender);
    transform: translateY(-2px);
  }

  .btn-main:active {
    transform: scale(0.98);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    border: 1px solid var(--accent-amber);
    color: var(--accent-amber);
    padding: 1rem 2.5rem;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(255, 170, 0, 0.15);
    text-align: center;
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    :root { --ui-margin: 24px; }
    h1 { font-size: 3rem; }
    .btn-main { padding: 14px 28px; font-size: 0.9rem; width: auto; }
    .hud-panel { padding: 8px 16px; }
    .stat-value { font-size: 1.4rem; }
    .subtitle { font-size: 0.9rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="noise-overlay"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <!-- Critique 1: Title Top-Left -->
      <div class="brand">
        <h1>Aether</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      
      <!-- Critique 1: HUD Top-Right -->
      <div class="hud-container">
        <div class="hud-panel">
          <svg class="stat-icon" viewBox="0 0 24 24">
            <!-- Hexagon Icon -->
            <path d="M12 2L20.66 7V17L12 22L3.34 17V7L12 2Z" />
          </svg>
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Specimens</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured</div>

    <!-- Critique 1: Button Bottom-Right -->
    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;

  const PALETTE = {
    teal: { main: '#00f2ff', light: '#ccfcff' },
    lavender: { main: '#d9a0ff', light: '#f3daff' },
    amber: { main: '#ffaa00', light: '#ffdd88' }
  };

  // Increased count for "Populated Play Field"
  const CREATURE_COUNT = 9;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, colorObj) {
      this.x = x;
      this.y = y;
      this.color = colorObj.main;
      this.lightColor = colorObj.light;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.015;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.94; 
      this.vy *= 0.94;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.lightColor;
      ctx.shadowBlur = 8;
      ctx.shadowColor = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.type = Math.floor(Math.random() * 2);
      this.colorKey = Object.keys(PALETTE)[Math.floor(Math.random() * 3)];
      this.color = PALETTE[this.colorKey];
      this.reset();
    }

    reset() {
      // Critique 2: Reposition to center/right initially
      // Biasing spawn towards the right side (width * 0.5 to width)
      const bias = Math.random() > 0.3 ? 0.5 : 0; 
      
      this.x = Math.random() * (width * 0.8) + (width * bias) - (width * 0.2);
      this.y = Math.random() * height;
      
      // Ensure we don't spawn exactly on top of UI if possible (though they are transparent)
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.baseRadius = Math.random() * 15 + 20;
      this.time = Math.random() * 100;
      this.isCaught = false;
      this.rotation = Math.random() * Math.PI * 2;
      this.rotSpeed = (Math.random() - 0.5) * 0.02;
    }

    update() {
      if (this.isCaught) return;

      this.time += 0.04;
      this.rotation += this.rotSpeed;

      // Movement
      this.x += this.vx;
      this.y += this.vy;

      // Organic drift
      this.x += Math.sin(this.time * 0.5) * 0.8;
      this.y += Math.cos(this.time * 0.3) * 0.8;

      // Bounce off walls
      if (this.x < -50) this.vx = Math.abs(this.vx);
      if (this.x > width + 50) this.vx = -Math.abs(this.vx);
      if (this.y < -50) this.vy = Math.abs(this.vy);
      if (this.y > height + 50) this.vy = -Math.abs(this.vy);

      // Avoid Mouse (Net)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 200) {
        const force = (200 - dist) / 200;
        this.vx += (dx / dist) * force * 0.8;
        this.vy += (dy / dist) * force * 0.8;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 4) {
        this.vx = (this.vx / speed) * 4;
        this.vy = (this.vy / speed) * 4;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);

      // Common Glow
      ctx.shadowBlur = 25;
      ctx.shadowColor = this.color.main;

      if (this.type === 0) {
        // --- Type 0: Bioluminescent Spore ---
        const r = this.baseRadius;
        const breath = Math.sin(this.time * 2) * 0.15 + 1;
        
        ctx.scale(breath, breath);

        // Soft gradient cloud
        const grad = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r);
        grad.addColorStop(0, 'rgba(255,255,255,0.9)');
        grad.addColorStop(0.3, this.color.light);
        grad.addColorStop(0.7, this.color.main);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        
        // Inner core
        ctx.fillStyle = 'white';
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2);
        ctx.fill();

      } else {
        // --- Type 1: Organic Jelly ---
        const r = this.baseRadius;
        
        // Head (Soft blob)
        ctx.fillStyle = this.color.main;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        
        // Inner translucent core
        ctx.fillStyle = this.color.light;
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;

        // Tentacles
        ctx.strokeStyle = this.color.light;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        
        const tentacles = 4;
        for(let i=0; i<tentacles; i++) {
            const angle = (i/tentacles) * Math.PI * 2;
            const startX = Math.cos(angle) * r * 0.8;
            const startY = Math.sin(angle) * r * 0.8;
            
            const wave = Math.sin(this.time * 4 + i) * 15;
            const endX = startX + Math.cos(angle) * 30 + wave;
            const endY = startY + Math.sin(angle) * 30 + wave;

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(startX + (endX-startX)/2, startY + 20, endX, endY);
            ctx.stroke();
        }
        
        // Eyes
        ctx.fillStyle = 'black';
        ctx.beginPath();
        ctx.arc(-r*0.3, -r*0.1, r*0.08, 0, Math.PI*2);
        ctx.arc(r*0.3, -r*0.1, r*0.08, 0, Math.PI*2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 80; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<25; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1000);

    // Respawn logic
    setTimeout(() => {
      creature.reset();
    }, 2500);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(0, 242, 255, 0.5)';
    
    const time = Date.now() * 0.002;
    const rotation = Math.sin(time) * 0.1;
    
    ctx.rotate(rotation);
    
    // Outer Ring
    ctx.strokeStyle = isMouseDown ? '#ffffff' : 'rgba(0, 242, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2;
        const r = 70;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i===0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.stroke();
    
    // Inner Targeting Lines
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-80, 0); ctx.lineTo(-20, 0);
    ctx.moveTo(20, 0); ctx.lineTo(80, 0);
    ctx.moveTo(0, -80); ctx.lineTo(0, -20);
    ctx.moveTo(0, 20); ctx.lineTo(0, 80);
    ctx.stroke();

    // "Sucking" effect if held down
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 40, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    ctx.clearRect(0, 0, width, height);

    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    drawNet();

    requestAnimationFrame(loop);
  }

  init();
  loop();

</script>
</body>
</html>
