<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina Catch</title>
<style>
  :root {
    /* Palette from Critique */
    --bg-deep: #0f172a;
    --bg-violet: #1e1b4b;
    --accent-cyan: #00f0ff;
    --accent-magenta: #ff0055;
    --accent-lime: #ccff00;
    --accent-purple: #bd00ff;
    
    /* UI Colors */
    --text-main: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.7);
    
    /* Dimensions */
    --ui-margin: 64px;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  /* --- Background Atmosphere --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    /* Critique: Deep Atmospheric Gradient */
    background: radial-gradient(circle at 50% 30%, var(--bg-violet) 0%, var(--bg-deep) 80%);
    overflow: hidden;
  }

  /* Critique: Vignette */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 40%, #000000 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* Subtle floating particles in background (CSS only) */
  .bg-particles {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
    opacity: 0.4;
    pointer-events: none;
    background-image: 
      radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
      radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
      radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
    background-size: 550px 550px, 350px 350px, 250px 250px;
    background-position: 0 0, 40px 60px, 130px 270px;
    animation: drift 60s linear infinite;
  }

  @keyframes drift {
    from { transform: translateY(0); }
    to { transform: translateY(-100px); }
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none; 
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    /* Critique: 64px Global Margin */
    padding: var(--ui-margin); 
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }

  /* Critique: Custom Typography */
  h1 {
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: 3.5rem;
    margin: 0;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    line-height: 0.9;
    /* Metallic Gradient */
    background: linear-gradient(to bottom, #ffffff 0%, #a5b4fc 50%, #4f46e5 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }

  .subtitle {
    font-size: 0.9rem;
    color: var(--accent-cyan);
    /* Critique: Tight tracking, bold weight */
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    margin-top: 0.25rem;
  }

  /* HUD */
  .hud-panel {
    /* Critique: Glassmorphism */
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 0.75rem 1.5rem;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 
      0 4px 20px rgba(0,0,0,0.2),
      inset 0 1px 0 rgba(255,255,255,0.15);
    min-width: 140px;
  }

  .stat-icon {
    width: 28px; height: 28px;
    fill: var(--accent-magenta);
    filter: drop-shadow(0 0 8px var(--accent-magenta));
  }

  .stat-value {
    font-family: 'Impact', sans-serif;
    font-size: 1.8rem;
    color: white;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }

  /* Footer */
  .footer {
    display: flex;
    justify-content: center;
    width: 100%;
    pointer-events: auto;
    /* Critique: Bottom margin handled by padding on container */
  }

  /* Critique: Glassmorphism Button with Glow */
  .btn-main {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
    font-family: 'Impact', sans-serif;
    font-size: 1.5rem;
    padding: 1rem 3.5rem;
    border-radius: 50px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    /* Gradient Border/Glow effect */
    background-image: linear-gradient(rgba(255,255,255,0.05), rgba(255,255,255,0.05)), 
                      linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
    background-origin: border-box;
    background-clip: padding-box, border-box;
    border: transparent;
  }

  .btn-main:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.4), 0 10px 40px rgba(0,0,0,0.4);
    background-color: rgba(255, 255, 255, 0.1);
  }

  .btn-main:active {
    transform: scale(0.98);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0,0,0,0.7);
    border: 1px solid var(--accent-lime);
    color: var(--accent-lime);
    padding: 1.2rem 2.5rem;
    border-radius: 4px;
    font-family: 'Impact', sans-serif;
    letter-spacing: 0.1em;
    font-size: 1.5rem;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(204, 255, 0, 0.3);
    text-align: center;
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    :root { --ui-margin: 32px; }
    h1 { font-size: 2.5rem; }
    .btn-main { padding: 0.8rem 2rem; font-size: 1.2rem; width: 100%; }
    .hud-panel { padding: 0.5rem 1rem; min-width: auto; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="bg-particles"></div>
  <div class="vignette"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Lumina</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-panel">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <!-- Star Icon -->
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" />
        </svg>
        <div>
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Specimens</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Focus: Organic shapes, breathing animations, and cohesive visual identity.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;

  // Configuration
  const COLORS = ['#00f0ff', '#ff0055', '#ccff00', '#bd00ff'];
  const CREATURE_COUNT = 7;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 4 + 2;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.95; // Friction
      this.vy *= 0.95;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset();
      // Random initial positions
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    }

    reset() {
      // Spawn outside view
      this.x = Math.random() < 0.5 ? -100 : width + 100;
      this.y = Math.random() * height;
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.radius = Math.random() * 15 + 20;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.time = Math.random() * 100;
      this.isCaught = false;
      
      // Tentacle configuration
      this.tentacles = [];
      const tentacleCount = Math.floor(Math.random() * 3) + 3;
      for(let i=0; i<tentacleCount; i++) {
        this.tentacles.push({
          offset: (i / tentacleCount) * Math.PI * 2,
          length: Math.random() * 20 + 10,
          speed: Math.random() * 0.1 + 0.05
        });
      }
    }

    update() {
      if (this.isCaught) return;

      this.time += 0.05;

      // Movement
      this.x += this.vx;
      this.y += this.vy;

      // Organic drift (Perlin-ish noise approximation using sine sums)
      this.x += Math.sin(this.time * 0.5) * 0.5;
      this.y += Math.cos(this.time * 0.3) * 0.5;

      // Bounce off walls (soft turn)
      if (this.x < -50) this.vx = Math.abs(this.vx);
      if (this.x > width + 50) this.vx = -Math.abs(this.vx);
      if (this.y < -50) this.vy = Math.abs(this.vy);
      if (this.y > height + 50) this.vy = -Math.abs(this.vy);

      // Avoid Mouse (Net)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 200) {
        // Flee behavior
        const force = (200 - dist) / 200;
        this.vx += (dx / dist) * force * 0.8;
        this.vy += (dy / dist) * force * 0.8;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 5) {
        this.vx = (this.vx / speed) * 5;
        this.vy = (this.vy / speed) * 5;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Breathing Animation (Scale pulse)
      const breath = Math.sin(this.time * 2) * 0.05 + 1;
      ctx.scale(breath, breath);

      // Glow
      ctx.shadowBlur = 30;
      ctx.shadowColor = this.color;
      
      // Draw Tentacles (Jellyfish style)
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      
      this.tentacles.forEach(t => {
        ctx.beginPath();
        const startX = Math.cos(t.offset) * (this.radius * 0.5);
        const startY = this.radius * 0.8;
        const endX = startX + Math.sin(this.time * 5 + t.offset) * 15;
        const endY = startY + t.length;
        
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(startX, startY + t.length/2, endX, endY);
        ctx.stroke();
      });

      // Draw Body (Organic Blob)
      ctx.fillStyle = this.color;
      ctx.beginPath();
      const r = this.radius;
      // Draw a pulsating blob shape
      for (let i = 0; i <= Math.PI * 2; i += 0.1) {
        const wobble = Math.sin(i * 5 + this.time * 3) * (r * 0.1);
        const x = Math.cos(i) * (r + wobble);
        const y = Math.sin(i) * (r + wobble);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();

      // Inner Core (Bioluminescence)
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.beginPath();
      ctx.arc(0, -r * 0.2, r * 0.25, 0, Math.PI * 2);
      ctx.fill();

      // Eyes (Simple dots for personality)
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-r * 0.3, -r * 0.2, r * 0.08, 0, Math.PI * 2);
      ctx.arc(r * 0.3, -r * 0.2, r * 0.08, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 70; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<25; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1000);

    // Respawn logic
    setTimeout(() => {
      creature.reset();
    }, 2500);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    // Draw the player's net/cursor
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f0ff';
    
    // Net Shape (Futuristic Reticle)
    const time = Date.now() * 0.005;
    const rotation = Math.sin(time) * 0.2;
    
    ctx.rotate(rotation);
    
    // Outer Ring
    ctx.strokeStyle = isMouseDown ? '#ffffff' : '#00f0ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 70, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner Arcs
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 50, 0, Math.PI * 1.5);
    ctx.stroke();

    // Crosshair
    ctx.beginPath();
    ctx.moveTo(-15, 0); ctx.lineTo(15, 0);
    ctx.moveTo(0, -15); ctx.lineTo(0, 15);
    ctx.stroke();

    // "Sucking" effect if held down
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      for(let i=0; i<3; i++) {
        ctx.beginPath();
        ctx.arc(0, 0, 90 + (i*10), 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function loop() {
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
