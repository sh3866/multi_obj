<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aether Catch</title>
<style>
  :root {
    /* Palette */
    --bg-deep: #05050a;
    --bg-violet: #120b29;
    --bg-indigo: #1a1542;
    
    --accent-teal: #00f2ff;
    --accent-lavender: #d9a0ff;
    --accent-amber: #ffaa00;
    
    --text-main: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.5);
    
    /* Dimensions */
    --ui-margin: 64px;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: var(--text-main);
    /* System font stack, but styled to look premium */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  /* --- Background Atmosphere --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    /* Critique 3: Deep, rich indigo/violet gradient */
    background: radial-gradient(ellipse at 50% 10%, var(--bg-indigo) 0%, var(--bg-violet) 50%, var(--bg-deep) 100%);
    overflow: hidden;
  }

  /* Critique 3: Noise Texture Overlay */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.07;
    pointer-events: none;
    z-index: 1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Critique 3: Subtle radial glow behind title */
  .title-glow {
    position: absolute;
    top: 0; left: 0;
    width: 600px; height: 400px;
    background: radial-gradient(circle, rgba(217, 160, 255, 0.15) 0%, transparent 70%);
    pointer-events: none;
    z-index: 1;
    transform: translate(0, -100px);
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none; /* Hide default cursor, we draw a net */
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    /* Critique 1: Strict 64px Margin */
    padding: var(--ui-margin); 
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
    /* Critique 1: Align top edge exactly */
    padding-top: 0; 
  }

  .brand {
    display: flex;
    flex-direction: column;
    /* Critique 2: Increase vertical gap to 16px */
    gap: 16px;
  }

  /* Critique 2: Distinct wide display typeface using system fonts */
  h1 {
    font-family: "Impact", "Haettenschweiler", "Arial Black", sans-serif;
    font-size: 4rem;
    font-weight: 900;
    margin: 0;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    line-height: 0.9;
    color: white;
    /* Subtle texture to text instead of heavy drop shadow */
    background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-family: "Arial Black", "Helvetica Neue", sans-serif;
    font-size: 0.9rem;
    color: var(--accent-teal);
    /* Critique 2: Increased weight, reduced tracking */
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    text-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
  }

  /* HUD */
  .hud-container {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0; /* Rhythmic spacing handled internally */
  }

  .hud-panel {
    /* Critique 5: Glassmorphism finish */
    background: rgba(10, 10, 25, 0.4);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 12px 24px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    /* Critique 5: Standardize internal spacing (8px gaps) */
    gap: 8px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.2);
  }

  .stat-icon {
    width: 24px; height: 24px;
    fill: var(--accent-amber);
    filter: drop-shadow(0 0 5px var(--accent-amber));
  }

  .stat-value {
    font-family: "Arial Black", sans-serif;
    font-size: 1.5rem;
    color: white;
    font-weight: 700;
    line-height: 1;
    min-width: 30px;
    text-align: right;
  }

  .stat-label {
    font-family: "Arial", sans-serif;
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }

  /* Footer */
  .footer {
    display: flex;
    /* Critique 1: Button Bottom-Center */
    justify-content: center;
    width: 100%;
    pointer-events: auto;
  }

  /* Critique 5: Premium Button Styling */
  .btn-main {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: var(--text-main);
    font-family: "Arial Black", sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 16px 48px;
    border-radius: 100px; /* Pill shape for modern premium feel */
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 0 rgba(0, 242, 255, 0);
  }

  /* Glowing neon edge on hover */
  .btn-main:hover {
    background: rgba(0, 242, 255, 0.1);
    border-color: var(--accent-teal);
    box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
    color: var(--accent-teal);
    transform: translateY(-2px);
  }

  .btn-main:active {
    transform: scale(0.98);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    border: 1px solid var(--accent-amber);
    color: var(--accent-amber);
    padding: 1rem 2.5rem;
    border-radius: 4px;
    font-family: "Arial Black", sans-serif;
    letter-spacing: 0.05em;
    font-size: 1rem;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(255, 170, 0, 0.15);
    text-align: center;
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    :root { --ui-margin: 32px; }
    h1 { font-size: 2.5rem; }
    .btn-main { padding: 14px 32px; font-size: 0.8rem; width: 100%; }
    .hud-panel { padding: 8px 16px; }
    .stat-value { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="noise-overlay"></div>
  <div class="title-glow"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Aether</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-container">
        <div class="hud-panel">
          <svg class="stat-icon" viewBox="0 0 24 24">
            <!-- Hexagon Icon -->
            <path d="M12 2L20.66 7V17L12 22L3.34 17V7L12 2Z" />
          </svg>
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Specimens</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Focus: Cohesive Bioluminescent Creatures (Critique 4), Organic Movement.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;

  // Critique 5: Cohesive Bioluminescent Palette
  const PALETTE = {
    teal: { main: '#00f2ff', light: '#ccfcff' },
    lavender: { main: '#d9a0ff', light: '#f3daff' },
    amber: { main: '#ffaa00', light: '#ffdd88' }
  };

  const CREATURE_COUNT = 7;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, colorObj) {
      this.x = x;
      this.y = y;
      this.color = colorObj.main;
      this.lightColor = colorObj.light;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.015;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.94; 
      this.vy *= 0.94;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.lightColor;
      ctx.shadowBlur = 8;
      ctx.shadowColor = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1.0;
    }
  }

  // Critique 4: Redesign creatures as cohesive, organic, bioluminescent entities
  class Creature {
    constructor() {
      this.type = Math.floor(Math.random() * 2); // 0: Spore, 1: Jelly
      this.colorKey = Object.keys(PALETTE)[Math.floor(Math.random() * 3)];
      this.color = PALETTE[this.colorKey];
      this.reset();
      // Random initial positions
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    }

    reset() {
      // Spawn outside view
      this.x = Math.random() < 0.5 ? -100 : width + 100;
      this.y = Math.random() * height;
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.baseRadius = Math.random() * 15 + 20;
      this.time = Math.random() * 100;
      this.isCaught = false;
      this.rotation = Math.random() * Math.PI * 2;
      this.rotSpeed = (Math.random() - 0.5) * 0.02;
    }

    update() {
      if (this.isCaught) return;

      this.time += 0.04;
      this.rotation += this.rotSpeed;

      // Movement
      this.x += this.vx;
      this.y += this.vy;

      // Organic drift (Sinusoidal)
      this.x += Math.sin(this.time * 0.5) * 0.8;
      this.y += Math.cos(this.time * 0.3) * 0.8;

      // Bounce off walls (soft boundaries)
      if (this.x < -50) this.vx = Math.abs(this.vx);
      if (this.x > width + 50) this.vx = -Math.abs(this.vx);
      if (this.y < -50) this.vy = Math.abs(this.vy);
      if (this.y > height + 50) this.vy = -Math.abs(this.vy);

      // Avoid Mouse (Net)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 200) {
        const force = (200 - dist) / 200;
        this.vx += (dx / dist) * force * 0.8;
        this.vy += (dy / dist) * force * 0.8;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 4) {
        this.vx = (this.vx / speed) * 4;
        this.vy = (this.vy / speed) * 4;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);

      // Common Glow
      ctx.shadowBlur = 25;
      ctx.shadowColor = this.color.main;

      if (this.type === 0) {
        // --- Type 0: Bioluminescent Spore ---
        const r = this.baseRadius;
        const breath = Math.sin(this.time * 2) * 0.15 + 1;
        
        ctx.scale(breath, breath);

        // Soft gradient cloud
        const grad = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r);
        grad.addColorStop(0, 'rgba(255,255,255,0.9)');
        grad.addColorStop(0.3, this.color.light);
        grad.addColorStop(0.7, this.color.main);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        
        // Inner core
        ctx.fillStyle = 'white';
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2);
        ctx.fill();

      } else {
        // --- Type 1: Organic Jelly ---
        const r = this.baseRadius;
        
        // Head (Soft blob)
        ctx.fillStyle = this.color.main;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        
        // Inner translucent core
        ctx.fillStyle = this.color.light;
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;

        // Tentacles (Flowing curves)
        ctx.strokeStyle = this.color.light;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        
        const tentacles = 4;
        for(let i=0; i<tentacles; i++) {
            const angle = (i/tentacles) * Math.PI * 2;
            // Offset start position to be on the edge
            const startX = Math.cos(angle) * r * 0.8;
            const startY = Math.sin(angle) * r * 0.8;
            
            // Wavy motion
            const wave = Math.sin(this.time * 4 + i) * 15;
            const endX = startX + Math.cos(angle) * 30 + wave;
            const endY = startY + Math.sin(angle) * 30 + wave;

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(startX + (endX-startX)/2, startY + 20, endX, endY);
            ctx.stroke();
        }
        
        // Eyes (Simple organic dots)
        ctx.fillStyle = 'black';
        ctx.beginPath();
        ctx.arc(-r*0.3, -r*0.1, r*0.08, 0, Math.PI*2);
        ctx.arc(r*0.3, -r*0.1, r*0.08, 0, Math.PI*2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 80; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<25; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1000);

    // Respawn logic
    setTimeout(() => {
      creature.reset();
    }, 2500);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    // Draw the player's net/cursor
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(0, 242, 255, 0.5)';
    
    // Net Shape (Futuristic Geometric Reticle)
    const time = Date.now() * 0.002;
    const rotation = Math.sin(time) * 0.1;
    
    ctx.rotate(rotation);
    
    // Outer Ring
    ctx.strokeStyle = isMouseDown ? '#ffffff' : 'rgba(0, 242, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    // Hexagon shape for net
    for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2;
        const r = 70;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i===0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.stroke();
    
    // Inner Targeting Lines
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-80, 0); ctx.lineTo(-20, 0);
    ctx.moveTo(20, 0); ctx.lineTo(80, 0);
    ctx.moveTo(0, -80); ctx.lineTo(0, -20);
    ctx.moveTo(0, 20); ctx.lineTo(0, 80);
    ctx.stroke();

    // "Sucking" effect if held down
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 40, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
