<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Clean - Artisanal Care</title>
    <style>
        :root {
            /* Palette: Warm, Organic, High Contrast */
            --bg-color: #F2EFE8; /* Warm stone */
            --text-main: #2D2D2D; /* Deep Charcoal (Critique #1) */
            --text-muted: #5A5A5A; /* Darker Grey (Critique #1) */
            --accent-terracotta: #C06C50;
            
            /* Typography */
            --font-serif: "Playfair Display", "Didot", "Georgia", serif;
            --font-sans: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
        }

        /* Layout Container */
        .container {
            display: grid;
            grid-template-columns: 440px 1fr; /* Slightly wider text col for breathing room */
            width: 100%;
            height: 100vh;
            max-width: 1920px;
            margin: 0 auto;
            box-shadow: 0 0 120px rgba(0,0,0,0.05);
        }

        /* Left Panel: UI & Typography */
        .sidebar {
            padding: 96px 60px; /* 96 = 24*4, 60 = 24*2.5 (Critique #5) */
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #F7F5F0; /* Slightly lighter for contrast */
            border-right: 1px solid rgba(0,0,0,0.05);
            z-index: 10;
            position: relative;
        }

        .brand {
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-terracotta);
            margin-bottom: 96px; /* 24*4 */
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 12px;
            height: 12px;
            background: var(--accent-terracotta);
            border-radius: 50%;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 64px; /* Larger */
            line-height: 1.05;
            color: var(--text-main);
            margin: 0 0 48px 0; /* 24*2 (Critique #1 & #5) */
            font-weight: 700; /* Bold/High Contrast (Critique #1) */
            letter-spacing: -1px;
        }

        h1 em {
            font-style: italic;
            font-weight: 800; /* Extra bold emphasis */
            color: var(--accent-terracotta);
        }

        p {
            font-family: var(--font-sans);
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-main); /* Darker for legibility (Critique #1) */
            margin-bottom: 48px; /* 24*2 (Critique #5) */
            max-width: 360px;
            font-weight: 500; /* Medium weight (Critique #1) */
        }

        .stats {
            display: flex;
            gap: 64px; /* 24*2.66 -> aligns to grid roughly */
            padding-top: 48px; /* 24*2 */
            border-top: 1px solid rgba(0,0,0,0.08);
        }

        .stat-item h3 {
            font-family: var(--font-serif);
            font-size: 42px;
            margin: 0;
            color: var(--text-main);
            font-weight: 700;
            line-height: 1;
        }

        .stat-item span {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 12px;
            display: block;
            font-weight: 600;
        }

        .cta-button {
            background-color: var(--accent-terracotta);
            color: #fff;
            border: none;
            padding: 24px 48px; /* 24px vertical rhythm (Critique #5) */
            font-size: 16px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: fit-content;
            margin-top: 72px; /* 24*3 (Critique #5) */
            letter-spacing: 0.5px;
            box-shadow: 0 10px 30px rgba(192, 108, 80, 0.25);
            /* Critique #1: Aligns with left edge of headline */
        }

        .cta-button:hover {
            background-color: #A85A42;
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(192, 108, 80, 0.35);
        }

        /* Right Panel: The Scene */
        .scene-container {
            position: relative;
            background-color: var(--bg-color);
            overflow: hidden;
            display: flex;
            align-items: center; /* Centered vertically */
            justify-content: flex-end; /* Shifted right (Critique #5) */
            padding-right: 80px; /* Breathing room */
        }

        /* SVG Styling */
        svg {
            width: 100%;
            height: 100%;
            max-width: 1100px; /* Scaled up (Critique #2) */
            max-height: 900px;
            display: block;
        }

        /* Animations */
        @keyframes sway {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(2deg); }
            100% { transform: rotate(0deg); }
        }

        .mop-group {
            /* Critique #2: Handle originates top-center */
            transform-origin: 550px 0px; 
            animation: sway 6s infinite ease-in-out;
        }

        /* Responsive adjustments */
        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
            .sidebar { padding: 40px; border-right: none; border-bottom: 1px solid #eee; height: auto; }
            h1 { font-size: 42px; }
            .scene-container { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="brand">Lumina Clean</div>
        
        <h1>Pure clarity,<br>in <em>every corner.</em></h1>
        
        <p>Experience the difference of a meticulous deep clean. We restore the natural warmth of your home using organic solutions and artisanal care.</p>
        
        <div class="stats">
            <div class="stat-item">
                <h3>99%</h3>
                <span>Purity</span>
            </div>
            <div class="stat-item">
                <h3>100%</h3>
                <span>Organic</span>
            </div>
        </div>

        <button class="cta-button">Book a Clean</button>
    </div>

    <!-- Right Visual Scene -->
    <div class="scene-container">
        <!-- Main SVG Graphic -->
        <svg viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- Critique #4: Real floor texture (Wood Grain) -->
                <filter id="woodTexture" x="0%" y="0%" width="100%" height="100%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.005 0.06" numOctaves="3" result="noise"/>
                    <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.9 0 0 0  0 0.8 0 0 0  0 0 0 0.1 0" in="noise" result="coloredNoise"/>
                    <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply" />
                </filter>

                <!-- Critique #2 & #4: Anchor shadow -->
                <filter id="groundShadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
                    <feOffset dx="10" dy="25" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.12"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <!-- Critique #3: Translucent glossy amber gradient -->
                <radialGradient id="spillGrad" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" style="stop-color:#FFD54F;stop-opacity:0.95" /> <!-- Bright wet center -->
                    <stop offset="60%" style="stop-color:#F57C00;stop-opacity:0.85" /> <!-- Deep amber -->
                    <stop offset="100%" style="stop-color:#E65100;stop-opacity:0.7" /> <!-- Dark grime edge -->
                </radialGradient>

                <!-- Critique #2: Fibrous Mop Gradient -->
                <linearGradient id="mopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#E8E4D9;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#D6D0C4;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#B8B0A3;stop-opacity:1" />
                </linearGradient>

                <!-- Wood Handle Gradient -->
                <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#5D4037;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#795548;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#4E342E;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- Background / Floor -->
            <rect width="100%" height="100%" fill="#F0EBE0" />
            <rect width="100%" height="100%" fill="#F0EBE0" filter="url(#woodTexture)" opacity="0.8" />

            <!-- Scene Elements Group -->
            <g transform="translate(100, 150)"> <!-- Repositioned for balance -->
                
                <!-- Critique #3: The Spill - Realistic mess -->
                <g transform="translate(250, 500)" filter="url(#groundShadow)">
                    <!-- Main puddle body -->
                    <path d="M0,0 C80,-40 200,-30 260,20 C320,70 280,160 180,170 C80,180 -50,140 -90,70 C-130,0 -80,-40 0,0 Z" 
                          fill="url(#spillGrad)" />
                    
                    <!-- Specular highlights (wetness) -->
                    <path d="M30,30 C90,-10 170,-5 210,30 C250,65 220,130 140,140 C60,150 -20,110 -50,60 C-80,10 -40,-10 30,30 Z" 
                          fill="#FFF" opacity="0.15" />
                          
                    <!-- Darker grime accents (Critique #3) -->
                    <path d="M10,10 C70,-20 150,-15 200,15" stroke="#BF360C" stroke-width="2" fill="none" opacity="0.3" filter="blur(2px)"/>
                    
                    <!-- Splatters -->
                    <circle cx="280" cy="10" r="10" fill="#F57C00" opacity="0.8" />
                    <circle cx="300" cy="-15" r="5" fill="#F57C00" opacity="0.7" />
                    <circle cx="-100" cy="90" r="12" fill="#E65100" opacity="0.8" />
                    <circle cx="-80" cy="120" r="6" fill="#E65100" opacity="0.6" />
                    
                    <!-- Sharp Reflection -->
                    <path d="M50,50 Q100,40 150,70" stroke="white" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4" />
                </g>

                <!-- Critique #2: The Mop - Dynamic Vector -->
                <g class="mop-group" filter="url(#groundShadow)">
                    <!-- Handle: Top-center origin (550,0) angling to mop head -->
                    <line x1="550" y1="0" x2="450" y2="500" stroke="url(#handleGrad)" stroke-width="18" stroke-linecap="round" />
                    
                    <!-- Connection Joint -->
                    <path d="M440,490 Q450,510 460,490" fill="none" stroke="#3E2723" stroke-width="5" />
                    <circle cx="450" cy="500" r="15" fill="#3E2723" />

                    <!-- Mop Head: Fibrous and wet (Critique #2) -->
                    <!-- Using many overlapping paths for texture -->
                    <g fill="none" stroke-linecap="round" filter="url(#groundShadow)">
                        <!-- Back fibers (Darker/Wetter) -->
                        <g stroke="#8D8070" stroke-width="5" opacity="0.9">
                            <path d="M450,500 Q430,580 380,650" />
                            <path d="M450,500 Q440,590 360,660" />
                            <path d="M450,500 Q460,580 480,650" />
                            <path d="M450,500 Q470,590 520,660" />
                            <path d="M450,500 Q455,600 420,670" />
                        </g>
                        
                        <!-- Front fibers (Lighter/Dryer) -->
                        <g stroke="url(#mopGrad)" stroke-width="7" opacity="0.95">
                            <path d="M450,500 Q435,570 390,640" />
                            <path d="M450,500 Q450,580 400,650" />
                            <path d="M450,500 Q465,570 460,640" />
                            <path d="M450,500 Q480,580 500,650" />
                            <path d="M450,500 Q445,610 440,680" />
                        </g>
                    </g>

                    <!-- Wet spots on mop head where it touches spill -->
                    <circle cx="400" cy="620" r="20" fill="#F57C00" opacity="0.4" filter="blur(8px)" />
                    <circle cx="480" cy="630" r="15" fill="#F57C00" opacity="0.4" filter="blur(8px)" />
                </g>

            </g>

            <!-- Decorative Elements: Bubbles -->
            <g fill="none" stroke="#FFF" stroke-width="1.5" opacity="0.6">
                <circle cx="400" cy="450" r="8" />
                <circle cx="500" cy="400" r="12" />
                <circle cx="450" cy="420" r="5" />
                <circle cx="350" cy="550" r="4" />
            </g>
            
            <!-- Warm Light Flare -->
            <circle cx="850" cy="100" r="400" fill="#FFF" opacity="0.3" filter="blur(80px)" />

        </svg>
    </div>
</div>

</body>
</html>
