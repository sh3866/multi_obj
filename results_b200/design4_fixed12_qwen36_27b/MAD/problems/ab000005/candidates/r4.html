<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Clean - Artisanal Care</title>
    <style>
        :root {
            /* Palette: Deeper, Richer Warmth */
            --bg-color: #F2EFE8;
            --sidebar-bg: #F7F5F0;
            --text-main: #1A1A1A; /* Darker for contrast */
            --text-muted: #4A4A4A;
            --accent-terracotta: #C06C50;
            
            /* Typography: Modern Sans-Serif */
            --font-sans: "Inter", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
        }

        /* Layout Container */
        .container {
            display: grid;
            grid-template-columns: 520px 1fr; /* Wider text column */
            width: 100%;
            height: 100vh;
            max-width: 1920px;
            margin: 0 auto;
        }

        /* Left Panel: UI & Typography */
        .sidebar {
            padding: 0 64px; /* Consistent margin as requested */
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--sidebar-bg);
            border-right: 1px solid rgba(0,0,0,0.04);
            z-index: 10;
            position: relative;
            height: 100%;
        }

        .brand {
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-terracotta);
            margin-bottom: 80px; /* More breathing room */
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 10px;
            height: 10px;
            background: var(--accent-terracotta);
            border-radius: 50%;
        }

        h1 {
            font-family: var(--font-sans); /* Critique #1: Modern Sans */
            font-size: 56px;
            line-height: 1.1;
            color: var(--text-main);
            margin: 0 0 32px 0; /* Vertical rhythm */
            font-weight: 600; /* Clean weight */
            letter-spacing: -0.02em;
        }

        h1 em {
            font-style: italic;
            font-family: "Georgia", serif; /* Elegant contrast for emphasis */
            font-weight: 400;
            color: var(--accent-terracotta);
        }

        p {
            font-family: var(--font-sans);
            font-size: 17px;
            line-height: 1.6; /* Critique #1: Readability */
            color: var(--text-muted);
            margin: 0 0 80px 0; /* Critique #2: Gap between body and stats */
            max-width: 400px;
            font-weight: 400;
        }

        .stats {
            display: flex;
            gap: 64px;
            /* No border top, using spacing for separation */
            margin-bottom: 64px; /* Critique #2: Whitespace before button */
        }

        .stat-item h3 {
            font-family: var(--font-sans);
            font-size: 48px;
            margin: 0;
            color: var(--text-main);
            font-weight: 400; /* Critique #1: Lighter weight */
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .stat-item span {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px; /* Critique #1: Airy feel */
            margin-top: 12px;
            display: block;
            font-weight: 500;
        }

        .cta-button {
            background-color: var(--accent-terracotta);
            color: #fff;
            border: none;
            padding: 22px 52px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: fit-content;
            letter-spacing: 0.3px;
            box-shadow: 0 10px 30px rgba(192, 108, 80, 0.3);
        }

        .cta-button:hover {
            background-color: #A85A42;
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(192, 108, 80, 0.4);
        }

        /* Right Panel: The Scene */
        .scene-container {
            position: relative;
            background-color: var(--bg-color);
            overflow: hidden;
            display: flex;
            align-items: flex-end; /* Critique #3: Align to floor */
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="brand">Lumina Clean</div>
        
        <h1>Pure clarity,<br>in <em>every corner.</em></h1>
        
        <p>Experience the difference of a meticulous deep clean. We restore the natural warmth of your home using organic solutions and artisanal care.</p>
        
        <div class="stats">
            <div class="stat-item">
                <h3>99%</h3>
                <span>Purity</span>
            </div>
            <div class="stat-item">
                <h3>100%</h3>
                <span>Organic</span>
            </div>
        </div>

        <button class="cta-button">Book a Clean</button>
    </div>

    <!-- Right Visual Scene -->
    <div class="scene-container">
        <!-- Main SVG Graphic -->
        <svg viewBox="0 0 1000 900" preserveAspectRatio="xMidYMax slice">
            <defs>
                <!-- Critique #4: Richer floor texture -->
                <filter id="floorTexture" x="0%" y="0%" width="100%" height="100%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.005 0.05" numOctaves="3" result="noise"/>
                    <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.95 0 0 0  0 0.85 0 0 0  0 0 0 0.1 0" in="noise" result="coloredNoise"/>
                    <feGaussianBlur in="coloredNoise" stdDeviation="3" result="blurredNoise"/>
                    <feBlend in="SourceGraphic" in2="blurredNoise" mode="multiply" />
                </filter>

                <!-- Complex Drop Shadow -->
                <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
                    <feOffset dx="0" dy="20" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.15"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <!-- Critique #4: Complex Liquid Gradient (Burnt Orange to Deep Amber) -->
                <radialGradient id="spillGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#FFB300;stop-opacity:0.95" /> 
                    <stop offset="60%" style="stop-color:#F57C00;stop-opacity:0.9" /> 
                    <stop offset="90%" style="stop-color:#BF360C;stop-opacity:0.85" /> 
                    <stop offset="100%" style="stop-color:#870000;stop-opacity:0.7" /> 
                </radialGradient>
            </defs>

            <!-- Floor Base -->
            <rect width="100%" height="100%" fill="#E6DFD3" />
            <!-- Floor Texture -->
            <rect width="100%" height="100%" fill="#E6DFD3" filter="url(#floorTexture)" />

            <!-- Scene Elements Group -->
            <!-- Critique #3: Repositioned lower to rest on floor -->
            <g transform="translate(0, 50)"> 
                
                <!-- The Spill -->
                <g transform="translate(500, 720)" filter="url(#softShadow)">
                    <!-- Main puddle body (Organic shape) -->
                    <path d="M0,0 C120,-60 280,-50 350,20 C420,90 380,200 250,210 C120,220 -50,180 -120,90 C-190,0 -150,-60 0,0 Z" 
                          fill="url(#spillGrad)" />
                    
                    <!-- Critique #4: Darker Rim for volume -->
                    <path d="M0,0 C120,-60 280,-50 350,20 C420,90 380,200 250,210 C120,220 -50,180 -120,90 C-190,0 -150,-60 0,0 Z" 
                          stroke="#870000" stroke-width="6" fill="none" opacity="0.6" filter="blur(2px)"/>

                    <!-- Critique #4: Wet Sheen (Glossy reflection) -->
                    <path d="M60,50 C140,20 240,30 280,70 C320,110 280,160 200,160 C120,160 40,120 10,70 C-20,20 20,20 60,50 Z" 
                          fill="#FFF" opacity="0.15" />
                          
                    <!-- Sharp Highlight (The "Wet" look) -->
                    <path d="M100,100 Q180,90 240,120" stroke="white" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7" filter="blur(1px)"/>
                    
                    <!-- Splatters -->
                    <path d="M360,20 Q380,10 385,30 Q370,40 360,20" fill="#BF360C" opacity="0.9" />
                    <path d="M-140,120 Q-160,110 -155,130 Q-140,140 -140,120" fill="#BF360C" opacity="0.9" />
                    <circle cx="390" cy="-10" r="5" fill="#F57C00" opacity="0.8" />
                    <circle cx="-170" cy="60" r="7" fill="#BF360C" opacity="0.7" />
                </g>

                <!-- The Mop -->
                <g class="mop-group" filter="url(#softShadow)">
                    <!-- Handle: Fully visible, Wood Grain effect -->
                    <g transform="rotate(-12, 500, 0)">
                        <!-- Main Handle -->
                        <line x1="500" y1="-300" x2="460" y2="650" stroke="#5D4037" stroke-width="18" stroke-linecap="round" />
                        <!-- Highlight -->
                        <line x1="500" y1="-300" x2="460" y2="650" stroke="#8D6E63" stroke-width="4" stroke-linecap="round" opacity="0.5" />
                        <!-- Shadow -->
                        <line x1="500" y1="-300" x2="460" y2="650" stroke="#3E2723" stroke-width="18" stroke-dasharray="2 60" opacity="0.4" transform="translate(2,0)"/>
                        
                        <!-- Metal Joint -->
                        <rect x="440" y="630" width="35" height="45" fill="#9E9E9E" rx="4" transform="rotate(-12, 460, 655)" />
                        <circle cx="460" cy="655" r="14" fill="#616161" />
                        <circle cx="460" cy="655" r="6" fill="#212121" />
                    </g>

                    <!-- Critique #4: Mop Head - Varied strokes, irregularities -->
                    <g transform="translate(460, 660) rotate(-12)">
                        <!-- Shadow of mop head on floor -->
                        <ellipse cx="0" cy="40" rx="90" ry="25" fill="#000" opacity="0.15" filter="blur(6px)"/>

                        <!-- Back fibers (Darker/Wetter) -->
                        <g stroke="#8D6E63" stroke-width="7" stroke-linecap="round" opacity="0.9">
                            <path d="M-10,0 Q-40,80 -80,130" />
                            <path d="M10,0 Q40,80 80,130" />
                            <path d="M0,0 Q-10,90 -20,140" />
                            <path d="M0,0 Q10,90 20,140" />
                        </g>
                        
                        <!-- Front fibers (Lighter/Cleaner - Textured) -->
                        <g stroke="#E0E0E0" stroke-width="9" stroke-linecap="round">
                            <path d="M-15,0 Q-50,70 -100,110" />
                            <path d="M-5,0 Q-25,80 -50,130" />
                            <path d="M5,0 Q25,80 50,130" />
                            <path d="M15,0 Q50,70 100,110" />
                            <path d="M0,0 Q0,90 0,140" />
                        </g>

                        <!-- Cross texture for fabric look -->
                        <g stroke="#BDBDBD" stroke-width="2" stroke-linecap="round" opacity="0.6">
                            <path d="M-20,30 Q-50,70 -80,100" />
                            <path d="M20,30 Q50,70 80,100" />
                            <path d="M-10,40 Q-10,90 -10,120" />
                            <path d="M10,40 Q10,90 10,120" />
                        </g>
                    </g>
                </g>

            </g>

            <!-- Ambient Lighting / Vignette -->
            <circle cx="800" cy="100" r="300" fill="#FFF" opacity="0.05" filter="blur(80px)" />
            <rect width="100%" height="100%" fill="url(#vignette)" opacity="0.4" pointer-events="none"/>

        </svg>
    </div>
</div>

</body>
</html>
