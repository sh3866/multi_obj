<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Clean - Artisanal Care</title>
    <style>
        :root {
            /* Palette: Warm, Organic, High Contrast */
            --bg-color: #F2EFE8; /* Warm stone */
            --text-main: #2D2D2D; /* Deep Charcoal */
            --text-muted: #5A5A5A;
            --accent-terracotta: #C06C50;
            
            /* Typography */
            /* Using System Serifs for offline reliability: Didot/Georgia */
            --font-serif: "Didot", "Playfair Display", "Georgia", serif;
            --font-sans: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
        }

        /* Layout Container */
        .container {
            display: grid;
            grid-template-columns: 480px 1fr; /* Increased text column width for padding */
            width: 100%;
            height: 100vh;
            max-width: 1920px;
            margin: 0 auto;
        }

        /* Left Panel: UI & Typography */
        .sidebar {
            /* Critique #3: Left padding increased to 80px */
            padding: 80px 60px 80px 80px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #F7F5F0;
            border-right: 1px solid rgba(0,0,0,0.05);
            z-index: 10;
            position: relative;
        }

        .brand {
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-terracotta);
            margin-bottom: 64px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 12px;
            height: 12px;
            background: var(--accent-terracotta);
            border-radius: 50%;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 64px;
            line-height: 1.1;
            color: var(--text-main);
            /* Critique #3: Tighter gap (24px) between headline and body */
            margin: 0 0 24px 0; 
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Critique #3: No script font, just italic serif */
        h1 em {
            font-style: italic;
            font-weight: 400; /* Elegant serif italic */
            color: var(--accent-terracotta);
        }

        p {
            font-family: var(--font-sans);
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-muted);
            /* Critique #3: Larger gap (48px) between body and stats */
            margin-bottom: 48px;
            max-width: 360px;
            font-weight: 400;
        }

        .stats {
            display: flex;
            gap: 64px;
            /* Critique #2: Stats aligned to baseline of the floor/mop head */
            /* We will visually align this via grid or flex, but bottom border helps */
            padding-top: 48px;
            border-top: 1px solid rgba(0,0,0,0.08);
            margin-top: auto; /* Push to bottom of flex container */
        }

        .stat-item h3 {
            font-family: var(--font-serif);
            font-size: 42px;
            margin: 0;
            color: var(--text-main);
            font-weight: 700;
            line-height: 1;
        }

        .stat-item span {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 8px;
            display: block;
            font-weight: 600;
        }

        .cta-button {
            background-color: var(--accent-terracotta);
            color: #fff;
            border: none;
            padding: 20px 48px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: fit-content;
            margin-top: 32px;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 30px rgba(192, 108, 80, 0.25);
        }

        .cta-button:hover {
            background-color: #A85A42;
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(192, 108, 80, 0.35);
        }

        /* Right Panel: The Scene */
        .scene-container {
            position: relative;
            background-color: var(--bg-color);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="brand">Lumina Clean</div>
        
        <h1>Pure clarity,<br>in <em>every corner.</em></h1>
        
        <p>Experience the difference of a meticulous deep clean. We restore the natural warmth of your home using organic solutions and artisanal care.</p>
        
        <div class="stats">
            <div class="stat-item">
                <h3>99%</h3>
                <span>Purity</span>
            </div>
            <div class="stat-item">
                <h3>100%</h3>
                <span>Organic</span>
            </div>
        </div>

        <button class="cta-button">Book a Clean</button>
    </div>

    <!-- Right Visual Scene -->
    <div class="scene-container">
        <!-- Main SVG Graphic -->
        <!-- Critique #1 & #2: Scene re-engineered for realism and composition -->
        <svg viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Critique #1: Real floor texture (Wood Grain) -->
                <filter id="woodTexture" x="0%" y="0%" width="100%" height="100%">
                    <!-- Turbulence for grain -->
                    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.08" numOctaves="4" result="noise"/>
                    <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.9 0 0 0  0 0.8 0 0 0  0 0 0 0.15 0" in="noise" result="coloredNoise"/>
                    <!-- Soften slightly for floor realism -->
                    <feGaussianBlur in="coloredNoise" stdDeviation="2" result="blurredNoise"/>
                    <feBlend in="SourceGraphic" in2="blurredNoise" mode="multiply" />
                </filter>

                <!-- Critique #1: Realistic shadow for mop -->
                <filter id="groundShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
                    <feOffset dx="5" dy="15" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.15"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <!-- Critique #1: Viscous Liquid Gradient (Amber/Burnt Sienna) -->
                <radialGradient id="spillGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#FFC107;stop-opacity:0.9" /> 
                    <stop offset="70%" style="stop-color:#FF8F00;stop-opacity:0.8" /> 
                    <stop offset="100%" style="stop-color:#E65100;stop-opacity:0.6" /> 
                </radialGradient>

                <!-- Wood Handle Gradient -->
                <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#5D4037;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#8D6E63;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#4E342E;stop-opacity:1" />
                </linearGradient>

                <!-- Mop Head Texture -->
                <linearGradient id="mopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#F5F5F5;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#E0E0E0;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#BDBDBD;stop-opacity:1" />
                </linearGradient>
                
                <!-- Clip path for floor planks to give structure -->
                <pattern id="planks" width="1000" height="200" patternUnits="userSpaceOnUse">
                    <rect width="1000" height="200" fill="transparent"/>
                    <path d="M0,200 L1000,200" stroke="#000" stroke-width="1" opacity="0.05"/>
                </pattern>
            </defs>

            <!-- Background / Floor -->
            <rect width="100%" height="100%" fill="#E6DFD3" />
            <!-- Apply Planks structure -->
            <rect width="100%" height="100%" fill="url(#planks)" />
            <!-- Apply Grain Texture -->
            <rect width="100%" height="100%" fill="#E6DFD3" filter="url(#woodTexture)" opacity="0.6" />

            <!-- Scene Elements Group -->
            <!-- Critique #2: Shifted Up (Y-150) and Left (X-150) to center composition -->
            <g transform="translate(-150, -150)"> 
                
                <!-- Critique #1: The Spill - Viscous and Wicking -->
                <g transform="translate(450, 600)" filter="url(#groundShadow)">
                    <!-- Main puddle body -->
                    <path d="M0,0 C100,-50 250,-40 320,20 C400,80 350,180 220,190 C100,200 -60,160 -120,80 C-180,0 -120,-50 0,0 Z" 
                          fill="url(#spillGrad)" />
                    
                    <!-- Wicking edges (darkness) -->
                    <path d="M0,0 C100,-50 250,-40 320,20 C400,80 350,180 220,190 C100,200 -60,160 -120,80 C-180,0 -120,-50 0,0 Z" 
                          stroke="#BF360C" stroke-width="3" fill="none" opacity="0.4" filter="blur(4px)"/>

                    <!-- Internal reflections (wetness) -->
                    <path d="M50,40 C120,10 220,20 260,60 C300,100 260,150 180,150 C100,150 20,110 -10,60 C-40,10 0,10 50,40 Z" 
                          fill="#FFF" opacity="0.1" />
                          
                    <!-- Sharp highlight -->
                    <path d="M80,80 Q150,70 200,100" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5" filter="blur(1px)"/>
                    
                    <!-- Splatters (viscous drops) -->
                    <path d="M330,10 Q345,0 350,15 Q340,25 330,10" fill="#FF8F00" opacity="0.8" />
                    <path d="M-130,100 Q-150,90 -145,110 Q-130,120 -130,100" fill="#E65100" opacity="0.8" />
                    <circle cx="360" cy="-10" r="4" fill="#FF8F00" opacity="0.7" />
                    <circle cx="-160" cy="50" r="6" fill="#E65100" opacity="0.6" />
                </g>

                <!-- Critique #1: The Mop - Material Depth -->
                <g class="mop-group" filter="url(#groundShadow)">
                    <!-- Handle: Wood Grain effect -->
                    <g transform="rotate(-15, 550, 0)">
                        <line x1="550" y1="-200" x2="450" y2="650" stroke="url(#handleGrad)" stroke-width="16" stroke-linecap="round" />
                        <!-- Wood grain detail on handle -->
                        <line x1="550" y1="-200" x2="450" y2="650" stroke="#3E2723" stroke-width="16" stroke-dasharray="2 40" opacity="0.3" />
                        
                        <!-- Metal Joint -->
                        <rect x="435" y="640" width="30" height="40" fill="#757575" rx="4" transform="rotate(-15, 450, 660)" />
                        <circle cx="450" cy="660" r="12" fill="#424242" />
                    </g>

                    <!-- Mop Head: Fabric texture -->
                    <!-- Group rotated to match handle angle -->
                    <g transform="translate(450, 660) rotate(-15)">
                        
                        <!-- Shadow of mop head on floor -->
                        <ellipse cx="0" cy="40" rx="80" ry="20" fill="#000" opacity="0.15" filter="blur(5px)"/>

                        <!-- Back fibers (Darker/Wetter) -->
                        <g stroke="#A1887F" stroke-width="6" stroke-linecap="round" opacity="0.8">
                            <path d="M0,0 Q-30,80 -70,120" />
                            <path d="M0,0 Q30,80 70,120" />
                            <path d="M0,0 Q-10,90 -20,130" />
                            <path d="M0,0 Q10,90 20,130" />
                        </g>
                        
                        <!-- Front fibers (Lighter/Dryer - Textured) -->
                        <g stroke="url(#mopGrad)" stroke-width="8" stroke-linecap="round">
                            <path d="M0,0 Q-40,70 -90,110" />
                            <path d="M0,0 Q-20,80 -40,120" />
                            <path d="M0,0 Q0,90 0,130" />
                            <path d="M0,0 Q20,80 40,120" />
                            <path d="M0,0 Q40,70 90,110" />
                            
                            <!-- Cross texture for fabric look -->
                            <path d="M-10,20 Q-40,60 -70,90" stroke="#BDBDBD" stroke-width="2" opacity="0.5" />
                            <path d="M10,20 Q40,60 70,90" stroke="#BDBDBD" stroke-width="2" opacity="0.5" />
                        </g>
                    </g>
                </g>

            </g>

            <!-- Ambient Lighting -->
            <circle cx="800" cy="100" r="300" fill="#FFF" opacity="0.1" filter="blur(60px)" />

        </svg>
    </div>
</div>

</body>
</html>
