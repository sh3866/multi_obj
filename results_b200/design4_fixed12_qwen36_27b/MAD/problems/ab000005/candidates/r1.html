<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Clean - Artisanal Care</title>
    <style>
        :root {
            /* Palette: Warm, Organic, High Contrast */
            --bg-color: #F5F2EB; /* Warm textured cream */
            --text-main: #2B2623; /* Deep charcoal/brown */
            --text-muted: #7D756F; /* Warm grey */
            --accent-terracotta: #C06C50; /* Earthy, eco-friendly warm red */
            --accent-olive: #6B705C;
            
            /* Typography */
            --font-serif: "Playfair Display", "Didot", "Times New Roman", serif;
            --font-sans: "DM Sans", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
        }

        /* Layout Container */
        .container {
            display: grid;
            grid-template-columns: 400px 1fr;
            width: 100%;
            height: 100vh;
            max-width: 1800px;
            margin: 0 auto;
            box-shadow: 0 0 100px rgba(0,0,0,0.03);
        }

        /* Left Panel: UI & Typography */
        .sidebar {
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #FBFAF6; /* Slightly lighter than bg for contrast */
            border-right: 1px solid rgba(0,0,0,0.04);
            z-index: 10;
            position: relative;
        }

        .brand {
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent-terracotta);
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 10px;
            height: 10px;
            background: var(--accent-terracotta);
            border-radius: 50%;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 56px;
            line-height: 1.05;
            color: var(--text-main);
            margin: 0 0 40px 0; /* Increased vertical spacing */
            font-weight: 400; /* Elegant, not heavy */
            letter-spacing: -0.5px;
        }

        h1 em {
            font-style: italic;
            color: var(--accent-terracotta);
        }

        p {
            font-family: var(--font-sans);
            font-size: 17px;
            line-height: 1.7;
            color: var(--text-muted);
            margin-bottom: 16px; /* Tightened gap to stats */
            max-width: 340px;
            font-weight: 400;
        }

        .stats {
            display: flex;
            gap: 50px;
            padding-top: 16px; /* Grouped with body copy */
            border-top: 1px solid rgba(0,0,0,0.06);
        }

        .stat-item h3 {
            font-family: var(--font-serif);
            font-size: 36px;
            margin: 0;
            color: var(--text-main);
            font-weight: 400;
        }

        .stat-item span {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            display: block;
        }

        .cta-button {
            background-color: var(--accent-terracotta);
            color: #fff;
            border: none;
            padding: 20px 36px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 2px; /* Slightly sharper for elegance */
            cursor: pointer;
            transition: all 0.3s ease;
            width: fit-content;
            margin-top: 60px; /* Breathe from the stats */
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(192, 108, 80, 0.2);
        }

        .cta-button:hover {
            background-color: #A85A42;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(192, 108, 80, 0.3);
        }

        /* Right Panel: The Scene */
        .scene-container {
            position: relative;
            background-color: var(--bg-color);
            overflow: hidden;
            display: flex;
            align-items: flex-end; /* Align bottom for composition fix */
            justify-content: center;
            padding-bottom: 10%; /* Resolve dead void */
        }

        /* SVG Styling */
        svg {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 900px;
            display: block;
        }

        /* Animations */
        @keyframes sway {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(3deg); }
            100% { transform: rotate(0deg); }
        }

        .mop-group {
            transform-origin: 600px 200px;
            animation: sway 6s infinite ease-in-out;
        }

        /* Responsive adjustments */
        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
            .sidebar { padding: 40px; border-right: none; border-bottom: 1px solid #eee; height: auto; }
            h1 { font-size: 42px; }
            .scene-container { display: none; } /* Simplified for mobile in this specific constraint */
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="brand">Lumina Clean</div>
        
        <h1>Pure clarity,<br>in <em>every corner.</em></h1>
        
        <p>Experience the difference of a meticulous deep clean. We restore the natural warmth of your home using organic solutions and artisanal care.</p>
        
        <div class="stats">
            <div class="stat-item">
                <h3>99%</h3>
                <span>Purity</span>
            </div>
            <div class="stat-item">
                <h3>100%</h3>
                <span>Organic</span>
            </div>
        </div>

        <button class="cta-button">Book a Clean</button>
    </div>

    <!-- Right Visual Scene -->
    <div class="scene-container">
        <!-- Main SVG Graphic -->
        <svg viewBox="0 0 800 800" preserveAspectRatio="xMidYMax slice">
            <defs>
                <!-- Floor Texture Filter -->
                <filter id="floorTexture" x="0%" y="0%" width="100%" height="100%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise"/>
                    <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.95 0 0 0  0 0.85 0 0 0  0 0 0 0.15 0" in="noise" result="coloredNoise"/>
                    <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply" />
                </filter>

                <!-- Drop Shadow for Depth -->
                <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
                    <feOffset dx="0" dy="15" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.15"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <!-- Spill Gradient: Amber to Deep Gold (Translucent) -->
                <radialGradient id="spillGrad" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
                    <stop offset="0%" style="stop-color:#F9D768;stop-opacity:0.9" />
                    <stop offset="50%" style="stop-color:#E8A635;stop-opacity:0.85" />
                    <stop offset="100%" style="stop-color:#B87333;stop-opacity:0.7" />
                </radialGradient>

                <!-- Mop Head Gradient: Organic Cotton/Linen -->
                <linearGradient id="mopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#E8E4D9;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#D6D0C4;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#B8B0A3;stop-opacity:1" />
                </linearGradient>

                <!-- Wood Handle Gradient -->
                <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#5D4037;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#795548;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#4E342E;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- Background / Floor -->
            <!-- Base warm cream color -->
            <rect width="100%" height="100%" fill="#F0EBE0" />
            <!-- Texture overlay -->
            <rect width="100%" height="100%" fill="#F0EBE0" filter="url(#floorTexture)" opacity="0.8" />

            <!-- Scene Elements Group -->
            <g transform="translate(0, 100)"> <!-- Shifted down to resolve void -->
                
                <!-- Spilled Mess: Organic, irregular shape -->
                <g transform="translate(350, 480)" filter="url(#softShadow)">
                    <!-- Main puddle body -->
                    <path d="M0,0 C60,-30 160,-20 200,20 C240,60 220,130 140,140 C60,150 -40,120 -70,60 C-100,0 -60,-30 0,0 Z" 
                          fill="url(#spillGrad)" />
                    
                    <!-- Inner highlights for wetness -->
                    <path d="M20,20 C70,-10 140,-5 170,25 C200,55 180,110 110,120 C40,130 -20,100 -40,50 C-60,0 -30,-10 20,20 Z" 
                          fill="#FFF" opacity="0.1" />
                          
                    <!-- Splatters (dynamic narrative) -->
                    <circle cx="220" cy="10" r="8" fill="#E8A635" opacity="0.8" />
                    <circle cx="240" cy="-10" r="4" fill="#E8A635" opacity="0.7" />
                    <circle cx="-80" cy="80" r="10" fill="#B87333" opacity="0.8" />
                    <circle cx="-60" cy="110" r="5" fill="#B87333" opacity="0.6" />
                    
                    <!-- Reflection highlight -->
                    <path d="M40,40 Q80,30 120,60" stroke="white" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.3" />
                </g>

                <!-- The Mop: Dynamic, organic fibers -->
                <g class="mop-group" filter="url(#softShadow)">
                    <!-- Handle -->
                    <line x1="600" y1="100" x2="380" y2="450" stroke="url(#handleGrad)" stroke-width="14" stroke-linecap="round" />
                    
                    <!-- Connection Joint -->
                    <path d="M370,440 Q380,460 390,440" fill="none" stroke="#3E2723" stroke-width="4" />
                    <circle cx="380" cy="450" r="12" fill="#3E2723" />

                    <!-- Mop Head: Layered paths to simulate fibers, not stiff lines -->
                    <g fill="none" stroke="url(#mopGrad)" stroke-linecap="round">
                        <!-- Back layer (lighter) -->
                        <g stroke-width="6" opacity="0.8">
                            <path d="M380,450 Q360,520 320,580" />
                            <path d="M380,450 Q390,530 350,590" />
                            <path d="M380,450 Q410,520 430,580" />
                            <path d="M380,450 Q400,540 450,590" />
                        </g>
                        
                        <!-- Front layer (darker/wetter look) -->
                        <g stroke-width="8" opacity="0.9" stroke="#C8C0B3">
                            <path d="M380,450 Q370,510 340,560" />
                            <path d="M380,450 Q385,510 370,570" />
                            <path d="M380,450 Q400,510 410,560" />
                            <path d="M380,450 Q395,510 430,570" />
                        </g>

                        <!-- Wet spots on mop head where it touches spill -->
                        <circle cx="350" cy="560" r="15" fill="#E8A635" opacity="0.3" filter="blur(5px)" />
                        <circle cx="420" cy="550" r="12" fill="#E8A635" opacity="0.3" filter="blur(5px)" />
                    </g>
                </g>

            </g>

            <!-- Decorative Elements: Bubbles/Particles -->
            <g fill="none" stroke="#FFF" stroke-width="1.5" opacity="0.5">
                <circle cx="300" cy="400" r="6" />
                <circle cx="450" cy="350" r="10" />
                <circle cx="380" cy="380" r="4" />
            </g>
            
            <!-- Warm Light Flare (Top Right) -->
            <circle cx="750" cy="50" r="300" fill="#FFF" opacity="0.4" filter="blur(60px)" />
            <circle cx="750" cy="50" r="150" fill="#E3C100" opacity="0.1" filter="blur(30px)" />

        </svg>
    </div>
</div>

</body>
</html>
