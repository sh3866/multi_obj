<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Clean - Artisanal Care</title>
    <style>
        :root {
            /* Palette: Refined per critique */
            --bg-color: #F5F3EF;
            --sidebar-bg: #F9F8F6;
            
            /* Typography Colors */
            --text-headline: #2D2420; /* Deep Warm Charcoal */
            --text-body: #4A5568;     /* Crisp Slate-Grey */
            --text-accent: #D97757;   /* Saturated Terracotta */
            
            /* Typography */
            --font-sans: "Inter", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            color: var(--text-headline);
        }

        /* Layout Container */
        .container {
            display: grid;
            grid-template-columns: 560px 1fr; /* Slightly wider text column for better balance */
            width: 100%;
            height: 100vh;
            max-width: 1920px;
            margin: 0 auto;
        }

        /* Left Panel: UI & Typography */
        .sidebar {
            /* Critique #4: Increased left padding by 24px (was 64, now 88) */
            padding: 0 88px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--sidebar-bg);
            border-right: 1px solid rgba(0,0,0,0.03);
            z-index: 10;
            position: relative;
            height: 100%;
        }

        .brand {
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-accent);
            margin-bottom: 80px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand::before {
            content: '';
            display: block;
            width: 10px;
            height: 10px;
            background: var(--text-accent);
            border-radius: 50%;
        }

        h1 {
            font-family: var(--font-sans);
            font-size: 56px;
            line-height: 1.1;
            /* Critique #3: Deep Warm Charcoal */
            color: var(--text-headline);
            /* Critique #3: Increased Weight */
            font-weight: 800; 
            letter-spacing: -0.03em;
            margin: 0 0 32px 0; /* Critique #4: 32px gap */
        }

        h1 em {
            font-style: italic;
            font-family: "Georgia", serif;
            font-weight: 400;
            color: var(--text-accent);
        }

        p {
            font-family: var(--font-sans);
            font-size: 17px;
            line-height: 1.6;
            /* Critique #3: Slate Grey */
            color: var(--text-body);
            /* Critique #4: 48px gap between body and stats */
            margin: 0 0 48px 0;
            max-width: 420px;
            font-weight: 400;
        }

        .stats {
            display: flex;
            gap: 64px;
            margin-bottom: 56px;
        }

        .stat-item h3 {
            font-family: var(--font-sans);
            font-size: 48px;
            margin: 0;
            color: var(--text-headline);
            font-weight: 400;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .stat-item span {
            font-size: 13px;
            color: var(--text-body);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 12px;
            display: block;
            font-weight: 600;
        }

        /* Critique #4: Button Indented */
        .cta-wrapper {
            padding-left: 24px;
        }

        .cta-button {
            /* Critique #3: Bright Terracotta */
            background-color: var(--text-accent);
            color: #fff;
            border: none;
            padding: 22px 52px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: fit-content;
            letter-spacing: 0.3px;
            box-shadow: 0 10px 30px rgba(217, 119, 87, 0.25);
        }

        .cta-button:hover {
            background-color: #C06C50;
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(217, 119, 87, 0.4);
        }

        /* Right Panel: The Scene */
        .scene-container {
            position: relative;
            background-color: var(--bg-color);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="brand">Lumina Clean</div>
        
        <h1>Pure clarity,<br>in <em>every corner.</em></h1>
        
        <p>Experience the difference of a meticulous deep clean. We restore the natural warmth of your home using organic solutions and artisanal care.</p>
        
        <div class="stats">
            <div class="stat-item">
                <h3>99%</h3>
                <span>Purity</span>
            </div>
            <div class="stat-item">
                <h3>100%</h3>
                <span>Organic</span>
            </div>
        </div>

        <!-- Indented Button Wrapper -->
        <div class="cta-wrapper">
            <button class="cta-button">Book a Clean</button>
        </div>
    </div>

    <!-- Right Visual Scene -->
    <div class="scene-container">
        <!-- Main SVG Graphic -->
        <svg viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Critique #2: Low opacity wood grain texture -->
                <filter id="woodGrain" x="0%" y="0%" width="100%" height="100%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.002 0.04" numOctaves="4" result="noise"/>
                    <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.9 0 0 0  0 0.8 0 0 0  0 0 0 0.05 0" in="noise" result="coloredNoise"/>
                    <feGaussianBlur in="coloredNoise" stdDeviation="1" result="blurredNoise"/>
                    <feBlend in="SourceGraphic" in2="blurredNoise" mode="multiply" />
                </filter>

                <!-- Complex Drop Shadow -->
                <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
                    <feOffset dx="0" dy="20" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.12"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <!-- Critique #2: Viscous Liquid Gradient -->
                <radialGradient id="spillGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#FFC107;stop-opacity:0.95" /> 
                    <stop offset="40%" style="stop-color:#FF9800;stop-opacity:0.9" /> 
                    <stop offset="85%" style="stop-color:#E65100;stop-opacity:0.85" /> 
                    <stop offset="100%" style="stop-color:#BF360C;stop-opacity:0.7" /> 
                </radialGradient>
                
                <!-- Wet Spot Gradient -->
                <radialGradient id="wetSpot" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#000;stop-opacity:0.08" />
                    <stop offset="100%" style="stop-color:#000;stop-opacity:0" />
                </radialGradient>
            </defs>

            <!-- Floor Base -->
            <rect width="100%" height="100%" fill="#EBE6DF" />
            <!-- Floor Texture Overlay -->
            <rect width="100%" height="100%" fill="#EBE6DF" filter="url(#woodGrain)" />

            <!-- Scene Elements Group -->
            <!-- Critique #1: Repositioned to center vertically (Y: -100 moves it up) -->
            <g transform="translate(0, -100)"> 
                
                <!-- The Spill Cluster -->
                <g transform="translate(520, 600)">
                    
                    <!-- Critique #2: Darker 'wet spot' underneath -->
                    <ellipse cx="0" cy="20" rx="320" ry="160" fill="url(#wetSpot)" />

                    <!-- Main puddle body -->
                    <path d="M0,0 C100,-80 250,-60 320,10 C400,80 350,220 220,230 C100,240 -80,200 -150,100 C-220,0 -180,-80 0,0 Z" 
                          fill="url(#spillGrad)" filter="url(#softShadow)"/>

                    <!-- Critique #2: Darker Rim for volume/viscosity -->
                    <path d="M0,0 C100,-80 250,-60 320,10 C400,80 350,220 220,230 C100,240 -80,200 -150,100 C-220,0 -180,-80 0,0 Z" 
                          stroke="#BF360C" stroke-width="4" fill="none" opacity="0.5" filter="blur(3px)"/>

                    <!-- Critique #2: Specular Highlights (Wet Sheen) -->
                    <path d="M50,40 C120,10 220,20 260,60 C300,100 260,160 180,160 C100,160 20,120 -10,70 C-40,20 0,20 50,40 Z" 
                          fill="#FFF" opacity="0.25" filter="blur(2px)"/>
                          
                    <!-- Sharp Specular Highlight -->
                    <path d="M90,110 Q160,100 220,130" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8" filter="blur(1px)"/>
                    <path d="M-120,130 Q-100,140 -80,130" stroke="white" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" filter="blur(1px)"/>
                    
                    <!-- Splatters -->
                    <path d="M330,20 Q350,10 355,30 Q340,40 330,20" fill="#E65100" opacity="0.9" />
                    <path d="M-160,130 Q-180,120 -175,140 Q-160,150 -160,130" fill="#E65100" opacity="0.9" />
                    <circle cx="380" cy="-10" r="6" fill="#FF9800" opacity="0.8" />
                    <circle cx="-190" cy="70" r="8" fill="#E65100" opacity="0.7" />
                </g>

                <!-- The Mop -->
                <g class="mop-group">
                    <!-- Handle: Fully visible, Wood Grain effect -->
                    <g transform="rotate(-12, 520, 0)">
                        <!-- Main Handle -->
                        <line x1="520" y1="-350" x2="480" y2="600" stroke="#5D4037" stroke-width="18" stroke-linecap="round" filter="url(#softShadow)" />
                        <!-- Highlight -->
                        <line x1="520" y1="-350" x2="480" y2="600" stroke="#8D6E63" stroke-width="4" stroke-linecap="round" opacity="0.6" />
                        <!-- Shadow -->
                        <line x1="520" y1="-350" x2="480" y2="600" stroke="#3E2723" stroke-width="18" stroke-dasharray="2 60" opacity="0.3" transform="translate(2,0)"/>
                        
                        <!-- Metal Joint -->
                        <rect x="460" y="580" width="35" height="45" fill="#9E9E9E" rx="4" transform="rotate(-12, 480, 605)" />
                        <circle cx="480" cy="605" r="14" fill="#616161" />
                        <circle cx="480" cy="605" r="6" fill="#212121" />
                    </g>

                    <!-- Critique #2: Mop Head - Textured fibers/cotton strands -->
                    <!-- Overlaps the liquid spill -->
                    <g transform="translate(480, 610) rotate(-12)">
                        <!-- Shadow of mop head on floor -->
                        <ellipse cx="0" cy="40" rx="100" ry="30" fill="#000" opacity="0.15" filter="blur(6px)"/>

                        <!-- Back fibers (Darker/Wetter) -->
                        <g stroke="#A1887F" stroke-width="8" stroke-linecap="round" opacity="0.9">
                            <path d="M-10,0 Q-40,80 -80,130" />
                            <path d="M10,0 Q40,80 80,130" />
                            <path d="M0,0 Q-10,90 -20,140" />
                            <path d="M0,0 Q10,90 20,140" />
                            <path d="M-20,0 Q-60,80 -110,120" />
                            <path d="M20,0 Q60,80 110,120" />
                        </g>
                        
                        <!-- Front fibers (Lighter/Cleaner - Textured) -->
                        <g stroke="#F5F5F5" stroke-width="10" stroke-linecap="round">
                            <path d="M-15,0 Q-50,70 -100,110" />
                            <path d="M-5,0 Q-25,80 -50,130" />
                            <path d="M5,0 Q25,80 50,130" />
                            <path d="M15,0 Q50,70 100,110" />
                            <path d="M0,0 Q0,90 0,140" />
                        </g>

                        <!-- Cross texture for fabric look -->
                        <g stroke="#E0E0E0" stroke-width="2" stroke-linecap="round" opacity="0.8">
                            <path d="M-20,30 Q-50,70 -80,100" />
                            <path d="M20,30 Q50,70 80,100" />
                            <path d="M-10,40 Q-10,90 -10,120" />
                            <path d="M10,40 Q10,90 10,120" />
                        </g>
                    </g>
                </g>

            </g>

            <!-- Ambient Lighting / Vignette -->
            <circle cx="800" cy="100" r="300" fill="#FFF" opacity="0.05" filter="blur(80px)" />
            <rect width="100%" height="100%" fill="url(#vignette)" opacity="0.4" pointer-events="none"/>

        </svg>
    </div>
</div>

</body>
</html>
