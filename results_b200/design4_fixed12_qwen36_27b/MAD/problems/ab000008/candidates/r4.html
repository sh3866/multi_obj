<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM PROTOCOL</title>
    <style>
        /* 
           DESIGN SYSTEM: RETRO SYNTHWAVE / ARCADE
           Revised based on critique:
           - Pixel typography for identity
           - 3D Perspective Highway
           - Stronger Hierarchy & Anchoring
           - CRT Grit & Texture
        */

        :root {
            /* Palette */
            --c-bg-top: #050014;
            --c-bg-mid: #180033;
            --c-bg-bot: #0a0a1a;
            
            --c-grid: #00f0ff; /* Cyan */
            --c-grid-dim: rgba(0, 240, 255, 0.15); /* Desaturated Grid */
            --c-accent: #ff0055; /* Magenta */
            --c-accent-glow: rgba(255, 0, 85, 0.6);
            
            --c-text: #ffffff;
            --c-ui-bg: #080012; /* Deep Violet/Black */
            --c-ui-border: #00f0ff;
            
            /* Typography */
            /* Using Press Start 2P as primary pixel font, falling back to monospace */
            --font-pixel: 'Press Start 2P', 'Courier New', monospace;
            /* Using Orbitron/Rajdhani style system fonts for subtitle */
            --font-geo: 'Orbitron', 'Rajdhani', 'Segoe UI', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none; /* Keep edges sharp for pixel feel */
        }

        body {
            background-color: var(--c-bg-top);
            color: var(--c-text);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: var(--font-pixel);
        }

        /* --- BACKGROUND & ATMOSPHERE --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* CRT Scanline & Noise Overlay */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 50;
            pointer-events: none;
            background: 
                /* Scanlines */
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.15) 1px,
                    transparent 1px,
                    transparent 2px
                ),
                /* Noise/Texture */
                radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
            opacity: 0.9;
        }

        /* --- UI LAYOUT --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding-top: 6vh;
            justify-content: flex-start; /* Start from top, flow down */
        }

        /* --- TYPOGRAPHY: TITLE --- */
        .title-group {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
            z-index: 20;
        }

        h1 {
            font-family: var(--font-pixel);
            font-size: clamp(2.5rem, 7vw, 6rem);
            font-weight: 400; /* Pixel fonts usually don't have 900 weight, 400 is blocky */
            text-transform: uppercase;
            line-height: 1.1;
            color: var(--c-text);
            letter-spacing: -2px;
            margin: 0;
            
            /* Retro 3D Shadow */
            text-shadow: 
                4px 4px 0px var(--c-accent),
                8px 8px 0px rgba(0,0,0,0.3);
            
            animation: float 4s ease-in-out infinite;
        }

        .subtitle {
            font-family: var(--font-geo);
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            font-weight: 600;
            color: var(--c-grid);
            text-transform: uppercase;
            letter-spacing: 0.5em;
            margin-top: 12px;
            text-shadow: 0 0 8px var(--c-grid);
            opacity: 0.9;
        }

        /* --- HIGHWAY PREVIEW (3D PERSPECTIVE) --- */
        .highway-wrapper {
            position: relative;
            width: 80%; /* Wider base */
            max-width: 900px;
            height: 200px;
            margin-bottom: 0; /* Anchored to buttons below */
            perspective: 800px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .highway-container {
            width: 100%;
            height: 100%;
            background: rgba(5, 0, 15, 0.85);
            /* 3D Transform to sit on floor */
            transform: rotateX(55deg) scale(1.1); 
            transform-origin: bottom center;
            border: 2px solid var(--c-grid-dim);
            border-bottom: 4px solid var(--c-grid);
            box-shadow: 
                0 0 20px var(--c-grid-dim),
                inset 0 0 40px rgba(0,0,0,0.8);
            display: flex;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(2px);
        }

        /* Lane Dividers */
        .lane {
            flex: 1;
            height: 100%;
            border-right: 1px solid var(--c-grid-dim);
            position: relative;
            /* Subtle gradient to simulate depth */
            background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0, 240, 255, 0.05));
        }
        .lane:last-child { border-right: none; }

        /* The "Hit Line" at the bottom */
        .hit-line {
            position: absolute;
            bottom: 0px; /* Flush with bottom */
            left: 0;
            width: 100%;
            height: 4px;
            background: #fff;
            box-shadow: 
                0 0 10px #fff, 
                0 0 20px var(--c-accent),
                0 0 40px var(--c-accent);
            z-index: 2;
        }

        /* Notes */
        .note {
            position: absolute;
            width: 60%; /* Chunky notes */
            height: 20px;
            left: 20%;
            z-index: 1;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 0 10px currentColor;
        }

        /* --- BUTTONS: HIERARCHY & ANCHORING --- */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px; /* Precise gap */
            z-index: 10;
            width: 100%;
            /* Push buttons down to align with highway perspective end */
            margin-top: 24px; 
            margin-bottom: 4vh;
        }

        .btn {
            font-family: var(--font-pixel);
            text-transform: uppercase;
            border: none;
            background: var(--c-ui-bg);
            color: var(--c-text);
            cursor: pointer;
            transition: all 0.1s ease;
            position: relative;
            
            /* Neon Border Aesthetic */
            border: 2px solid var(--c-ui-border);
            box-shadow: 
                0 0 10px var(--c-ui-border),
                inset 0 0 20px rgba(0, 240, 255, 0.1);
            
            outline: none;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #12002a;
            color: #fff;
            box-shadow: 
                0 0 20px var(--c-ui-border),
                inset 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 0 5px var(--c-ui-border);
        }

        /* Primary Button: Wide, Anchored */
        .btn-primary {
            width: 80%;
            max-width: 900px;
            height: 64px;
            font-size: 1.2rem;
            border-color: var(--c-accent);
            color: var(--c-accent);
            box-shadow: 
                0 0 15px var(--c-accent-glow),
                inset 0 0 20px rgba(255, 0, 85, 0.1);
        }
        
        .btn-primary:hover {
            border-color: #ff55aa;
            box-shadow: 0 0 30px var(--c-accent-glow);
            color: #fff;
        }

        /* Secondary Button: Narrower, Dimmer */
        .btn-secondary {
            width: 40%;
            max-width: 450px;
            height: 48px;
            font-size: 0.9rem;
            opacity: 0.7;
            border-color: var(--c-grid);
        }

        .btn-secondary:hover {
            opacity: 1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .highway-wrapper { width: 90%; }
            .btn-primary { width: 90%; }
            .btn-secondary { width: 60%; }
        }
    </style>
</head>
<body>

    <!-- Background Rendering -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- CRT/Texture Overlay -->
    <div class="crt-overlay"></div>

    <div class="ui-layer">
        
        <!-- Title Lockup -->
        <div class="title-group">
            <h1>PIXEL<br>DANCE</h1>
            <div class="subtitle">Rhythm Protocol</div>
        </div>

        <!-- 3D Perspective Highway -->
        <div class="highway-wrapper">
            <div class="highway-container">
                <div class="lane" id="l1"></div>
                <div class="lane" id="l2"></div>
                <div class="lane" id="l3"></div>
                <div class="lane" id="l4"></div>
                <div class="hit-line"></div>
            </div>
        </div>

        <!-- Anchored Controls -->
        <div class="controls">
            <button class="btn btn-primary" onclick="alert('SYSTEM START...')">START GAME</button>
            <button class="btn btn-secondary">OPTIONS</button>
        </div>

    </div>

    <script>
        /**
         * VISUAL ENGINE
         * 1. Background Grid & Sun (Canvas)
         * 2. Note Animation (DOM)
         */

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // State
        let time = 0;
        let gridOffset = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Configuration
        const HORIZON_Y_RATIO = 0.45; // Horizon line position

        function drawBackground() {
            // Clear
            ctx.clearRect(0, 0, width, height);

            // 1. Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#020014');
            grad.addColorStop(0.5, '#1a0033');
            grad.addColorStop(1, '#0a0a1a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const horizonY = height * HORIZON_Y_RATIO;

            // 2. The Sun (Synthwave)
            const cx = width / 2;
            const cy = horizonY - (height * 0.1); // Centered relative to sky area
            const r = Math.min(width, height) * 0.2;

            const sunGrad = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
            sunGrad.addColorStop(0, '#ff00ff');
            sunGrad.addColorStop(0.5, '#ff5500');
            sunGrad.addColorStop(1, '#ffcc00');

            ctx.save();
            ctx.translate(cx, cy);
            
            // Glow
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#ff00ff';
            
            // Sun Body
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = sunGrad;
            ctx.fill();
            
            // Cutout stripes
            ctx.globalCompositeOperation = 'destination-out';
            for(let i=0; i<8; i++) {
                let y = (i * (r/4)) + (r*0.3); 
                let h = i * 3 + 4;
                ctx.fillRect(-r*1.5, y, r*3, h);
            }
            ctx.restore();

            // 3. Stars (Pixelated)
            ctx.fillStyle = 'white';
            ctx.shadowBlur = 0;
            ctx.globalCompositeOperation = 'lighter';
            for(let i=0; i<50; i++) {
                const sx = (Math.sin(i * 123.45) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 67.89) * 0.5 + 0.5) * horizonY;
                const alpha = (Math.sin(time * 0.05 + i) + 1) / 2;
                ctx.globalAlpha = alpha * 0.8;
                ctx.fillRect(sx, sy, 2, 2);
            }
            ctx.globalAlpha = 1.0;
            ctx.globalCompositeOperation = 'source-over';

            // 4. Perspective Grid (Desaturated Cyan per critique)
            const vanishX = width / 2;
            
            // Update offset
            gridOffset = (gridOffset + 2.5) % 100; 

            // Use Desaturated Cyan for grid to push back
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.25)'; 
            ctx.lineWidth = 2;
            ctx.shadowBlur = 0; // No heavy glow on grid lines to keep it background
            
            ctx.beginPath();

            // Vertical Lines (Fan out)
            const numLines = 16;
            for (let i = -numLines; i <= numLines; i++) {
                let x1 = vanishX + (i * 4); 
                let x2 = vanishX + (i * width * 0.3); 
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
            }

            // Horizontal Lines (Moving towards viewer)
            let zStart = 100 - gridOffset; 
            let zStep = 10;
            
            for (let i = 0; i < 30; i++) {
                let z = zStart + (i * zStep);
                if (z <= 0) continue;

                // Perspective formula
                let p = 100 / z; 
                if (p >= 1) continue;

                let y = horizonY + (height - horizonY) * (1 - p);
                
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            
            ctx.stroke();
        }

        // --- NOTE SPAWNER LOGIC ---
        const lanes = [
            document.getElementById('l1'),
            document.getElementById('l2'),
            document.getElementById('l3'),
            document.getElementById('l4')
        ];
        // Colors: Magenta, Cyan, Yellow, White
        const colors = ['#ff0055', '#00f0ff', '#ffff00', '#ffffff'];

        function spawnNote() {
            const laneIdx = Math.floor(Math.random() * 4);
            const lane = lanes[laneIdx];
            
            const note = document.createElement('div');
            note.className = 'note';
            note.style.backgroundColor = colors[laneIdx];
            note.style.color = colors[laneIdx]; // For box-shadow currentColor
            
            // Start position (Top of the container)
            note.style.top = '-30px';
            lane.appendChild(note);

            // Animate falling down
            // Duration varies slightly for rhythm feel
            const duration = 1200 + Math.random() * 400;
            
            const anim = note.animate([
                { top: '-30px', opacity: 1 },
                { top: 'calc(100% - 20px)', opacity: 1 } 
            ], {
                duration: duration,
                easing: 'linear',
                fill: 'forwards'
            });

            anim.onfinish = () => {
                note.remove();
            };
        }

        // Main Loop
        function loop() {
            time++;
            drawBackground();
            
            // Spawn notes randomly (approx 1 every 0.5s)
            if (Math.random() < 0.03) {
                spawnNote();
            }

            requestAnimationFrame(loop);
        }

        // Start
        loop();

    </script>
</body>
</html>
