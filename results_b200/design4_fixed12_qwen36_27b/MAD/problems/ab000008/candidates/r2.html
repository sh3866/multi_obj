<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE</title>
    <style>
        /* 
           DESIGN SYSTEM: RETRO SYNTHWAVE 
           Constraints: 8pt Grid, Pixel Aesthetics, High Contrast
        */

        :root {
            --c-bg-top: #050014;
            --c-bg-bot: #1a0033;
            --c-grid: #00ffff;
            --c-sun-top: #ff00ff;
            --c-sun-bot: #ffcc00;
            --c-accent: #ff00ff;
            --c-text: #ffffff;
            --c-ui-dark: #0a001a;
            
            --font-pixel: 'Courier New', Courier, monospace; /* Offline Safe Pixel Font */
            
            /* 8pt Grid System */
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 32px;
            --spacing-xl: 64px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none; /* Keep text sharp/pixelated */
        }

        body {
            background-color: var(--c-bg-top);
            color: var(--c-text);
            font-family: var(--font-pixel);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- LAYOUT & HIERARCHY --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding-top: 40px; /* Push title higher into negative space */
        }

        /* --- TYPOGRAPHY --- */
        .title-group {
            text-align: center;
            margin-bottom: var(--spacing-lg);
            /* Ensure text sits above the sun horizon visually */
            margin-top: 5vh; 
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1;
            color: var(--c-text);
            letter-spacing: -2px;
            /* Pixelated Hard Shadow */
            text-shadow: 
                4px 4px 0px var(--c-accent),
                -2px -2px 0px var(--c-grid);
            margin-bottom: 24px; /* Increased breathing room */
            animation: float 4s ease-in-out infinite;
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--c-grid);
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 2px 2px 0px #000;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            display: inline-block;
            border: 1px solid var(--c-grid);
        }

        /* --- HIGHWAY PRESENTATION --- */
        .highway-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 220px;
            margin-bottom: var(--spacing-xl);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Dark Backing Box: Isolate from background */
        .highway-container {
            width: 100%;
            height: 100%;
            background-color: rgba(5, 0, 20, 0.95); /* Dark, semi-transparent backing */
            border: 2px solid var(--c-grid);
            box-shadow: 
                0 0 0 4px #000, 
                0 0 20px var(--c-grid); /* Heavy drop shadow/glow */
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .lane {
            flex: 1;
            height: 100%;
            border-right: 1px dashed rgba(0, 255, 255, 0.2);
            position: relative;
        }
        .lane:last-child { border-right: none; }

        /* Hit Line */
        .hit-line {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 4px;
            background: #fff;
            box-shadow: 0 0 10px #fff, 0 0 20px var(--c-accent);
            z-index: 2;
        }

        /* Falling Notes */
        .note {
            position: absolute;
            width: 80%;
            height: 20px;
            left: 10%;
            /* Pixel Art Shape */
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.5); 
            z-index: 1;
        }

        /* --- BUTTONS --- */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 32px; /* Strict spacing per critique */
            z-index: 10;
            width: 100%;
            max-width: 300px;
        }

        .btn {
            font-family: var(--font-pixel);
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 16px 0; /* Substantial padding */
            border: 4px solid var(--c-text); /* Orthogonal */
            background: var(--c-ui-dark);
            color: var(--c-text); /* White text per critique */
            cursor: pointer;
            position: relative;
            transition: transform 0.1s;
            
            /* Heavy colored drop shadow */
            box-shadow: 6px 6px 0px var(--c-accent);
            text-shadow: 2px 2px 0px #000;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
        }

        .btn:hover {
            background: var(--c-text);
            color: #000;
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px var(--c-accent);
            text-shadow: none;
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--c-accent);
        }

        /* --- BACKGROUND CANVAS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- CRT OVERLAY --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            z-index: 20;
            pointer-events: none;
            opacity: 0.6;
            /* Subtle noise grain via SVG filter if possible, else simple opacity */
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

    </style>
</head>
<body>

    <!-- Background Rendering -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- CRT Scanline Overlay -->
    <div class="scanlines"></div>

    <div class="ui-layer">
        
        <div class="title-group">
            <h1>PIXEL<br>DANCE</h1>
            <div class="subtitle">RHYTHM PROTOCOL</div>
        </div>

        <!-- The Isolated Highway Preview -->
        <div class="highway-wrapper">
            <div class="highway-container">
                <div class="lane" id="l1"></div>
                <div class="lane" id="l2"></div>
                <div class="lane" id="l3"></div>
                <div class="lane" id="l4"></div>
                <div class="hit-line"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="alert('INITIATING SEQUENCE...')">START GAME</button>
            <button class="btn">OPTIONS</button>
        </div>

    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Draws the Synthwave Grid & Sun with lowered opacity for grid lines.
         * Manages falling notes in the HTML highway.
         */

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // State
        let time = 0;
        let gridOffset = 0;

        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Configuration
        const HORIZON_Y_RATIO = 0.45; 
        
        function drawBackground() {
            // Clear
            ctx.clearRect(0, 0, width, height);

            // 1. Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#050014');
            grad.addColorStop(0.5, '#1a0033');
            grad.addColorStop(1, '#2a0a4a'); 
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const horizonY = height * HORIZON_Y_RATIO;

            // 2. The Sun
            const cx = width / 2;
            const cy = horizonY - (height * 0.1); // Moved up slightly
            const r = Math.min(width, height) * 0.22;

            const sunGrad = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
            sunGrad.addColorStop(0, '#ff00ff');
            sunGrad.addColorStop(1, '#ffcc00');

            ctx.save();
            ctx.translate(cx, cy);
            
            // Glow
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#ff00ff';
            
            // Sun Body
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = sunGrad;
            ctx.fill();
            
            // Cutout stripes (Retro Sun)
            ctx.globalCompositeOperation = 'destination-out';
            for(let i=0; i<12; i++) {
                let y = (i * (r/6)) + (r*0.2); 
                let h = i * 1.5 + 2;
                ctx.fillRect(-r*1.5, y, r*3, h);
            }
            ctx.restore();

            // 3. Stars (Pixelated)
            ctx.fillStyle = 'white';
            ctx.shadowBlur = 0;
            for(let i=0; i<50; i++) {
                const sx = (Math.sin(i * 123.45) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 67.89) * 0.5 + 0.5) * horizonY;
                // Twinkle
                const alpha = (Math.sin(time * 0.1 + i) + 1) / 2;
                ctx.globalAlpha = alpha;
                ctx.fillRect(sx, sy, 2, 2);
            }
            ctx.globalAlpha = 1.0;

            // 4. Perspective Grid (Lowered Opacity)
            const vanishX = width / 2;
            
            // Update offset
            gridOffset = (gridOffset + 3) % 100;

            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 1; // Thinner lines
            ctx.shadowBlur = 5;
            ctx.shadowColor = '#00ffff';
            
            ctx.beginPath();

            // Vertical Lines
            for (let i = -10; i <= 10; i++) {
                let x1 = vanishX + (i * 10); 
                let x2 = vanishX + (i * width * 0.25); 
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
            }

            // Horizontal Lines (Moving)
            let zStart = 100 - gridOffset; 
            let zStep = 10;
            
            for (let i = 0; i < 30; i++) {
                let z = zStart + (i * zStep);
                if (z <= 0) continue;

                let p = 100 / z; 
                if (p >= 1) continue;

                let y = horizonY + (height - horizonY) * (1 - p);
                
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            
            // CRITICAL: Apply 40-50% opacity to the entire grid stroke
            ctx.globalAlpha = 0.45; 
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }

        // --- NOTE SPAWNER LOGIC ---
        const lanes = [
            document.getElementById('l1'),
            document.getElementById('l2'),
            document.getElementById('l3'),
            document.getElementById('l4')
        ];
        // Colors: Magenta, Cyan, Yellow, Magenta
        const colors = ['#ff00ff', '#00ffff', '#ffff00', '#ff00ff'];

        function spawnNote() {
            const laneIdx = Math.floor(Math.random() * 4);
            const lane = lanes[laneIdx];
            
            const note = document.createElement('div');
            note.className = 'note';
            note.style.backgroundColor = colors[laneIdx];
            
            // Start position (top of the highway container)
            note.style.top = '-20px';
            lane.appendChild(note);

            const anim = note.animate([
                { top: '-20px' },
                { top: 'calc(100% - 20px)' } // Stop at hit line
            ], {
                duration: 1200,
                easing: 'linear',
                fill: 'forwards'
            });

            anim.onfinish = () => {
                note.remove();
            };
        }

        // Main Loop
        function loop() {
            time++;
            drawBackground();
            
            // Spawn notes randomly
            if (Math.random() < 0.05) {
                spawnNote();
            }

            requestAnimationFrame(loop);
        }

        // Start
        loop();

    </script>
</body>
</html>
