<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM PROTOCOL</title>
    <style>
        /* 
           DESIGN SYSTEM: REVISED SYNTHWAVE
           Changes applied:
           1. Typography: Pixel font for title, mono for subtitle.
           2. Layout: Title above sun, sun on horizon.
           3. Mechanics: Grid replaces platform, dashed lanes.
           4. UI: Chunky arcade buttons with bevels.
           5. Atmo: Saturated grid, scanlines.
        */

        :root {
            /* Palette - Higher Saturation */
            --c-bg-top: #050014;
            --c-bg-mid: #2a004d;
            --c-bg-bot: #000000;
            
            --c-grid: #00ffff; /* Bright Cyan */
            --c-grid-dim: rgba(0, 255, 255, 0.15);
            --c-accent: #ff0055; /* Magenta */
            --c-accent-dark: #990033;
            
            --c-text: #ffffff;
            --c-text-shadow: #ff0055; /* Hard offset shadow */
            
            /* Typography */
            /* Using Press Start 2P as primary pixel font */
            --font-pixel: 'Press Start 2P', 'Courier New', monospace; 
            /* Using system monospace for technical subtitle */
            --font-mono: 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none; /* Sharp edges */
        }

        body {
            background-color: var(--c-bg-top);
            color: var(--c-text);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: var(--font-pixel);
        }

        /* --- BACKGROUND & ATMOSPHERE --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* CRT Scanline Overlay */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            pointer-events: none;
            background: 
                /* Scanlines */
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.2),
                    rgba(0, 0, 0, 0.2) 1px,
                    transparent 2px,
                    transparent 4px
                ),
                /* Vignette */
                radial-gradient(circle at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            opacity: 0.8;
            mix-blend-mode: hard-light;
        }

        /* --- UI LAYOUT --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding-top: 5vh;
        }

        /* --- TYPOGRAPHY: TITLE --- */
        .title-group {
            text-align: center;
            margin-bottom: 10px;
            z-index: 20;
            /* Ensure title sits clearly above the sun */
            margin-top: 2vh; 
        }

        h1 {
            font-family: var(--font-pixel);
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 400;
            text-transform: uppercase;
            line-height: 1.1;
            color: var(--c-text);
            letter-spacing: -2px;
            margin: 0;
            
            /* CRITIQUE: Solid white fill, hard offset drop-shadow (magenta) */
            text-shadow: 
                6px 6px 0px var(--c-accent),
                12px 12px 0px rgba(0,0,0,0.4);
            
            /* Subtle breathing animation */
            animation: float 4s ease-in-out infinite;
        }

        .subtitle {
            font-family: var(--font-mono); /* CRITIQUE: Monospaced technical font */
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            font-weight: 700;
            color: var(--c-grid);
            text-transform: uppercase;
            letter-spacing: 0.6em;
            margin-top: 16px;
            text-shadow: 0 0 10px var(--c-grid);
            opacity: 0.9;
            border-top: 1px solid var(--c-grid);
            border-bottom: 1px solid var(--c-grid);
            padding: 4px 0;
            display: inline-block;
        }

        /* --- HIGHWAY PREVIEW (The Floor Grid) --- */
        .highway-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px; /* Constrain width for gameplay feel */
            height: 300px;
            margin-top: auto; /* Push to bottom of available space */
            margin-bottom: 12vh; /* Space above buttons */
            perspective: 600px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 5;
        }

        .highway-container {
            width: 100%;
            height: 100%;
            /* CRITIQUE: Remove solid platform, let grid flow */
            background: transparent; 
            /* 3D Transform to sit on floor */
            transform: rotateX(60deg) scale(1.2); 
            transform-origin: bottom center;
            border-top: 2px solid var(--c-grid);
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.2);
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Lane Dividers */
        .lane {
            flex: 1;
            height: 100%;
            position: relative;
            /* CRITIQUE: Distinct vertical dashed lines */
            border-right: 2px dashed rgba(0, 255, 255, 0.4);
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0, 255, 255, 0.1));
        }
        .lane:last-child { 
            border-right: 2px dashed rgba(0, 255, 255, 0.4); 
        }
        .lane:first-child { 
            border-left: 2px dashed rgba(0, 255, 255, 0.4); 
        }

        /* The "Hit Line" */
        .hit-line {
            position: absolute;
            bottom: 0px; 
            left: -10%;
            width: 120%; /* Slightly wider than container */
            height: 6px;
            background: #ffffff;
            box-shadow: 
                0 0 15px #fff, 
                0 0 30px var(--c-grid),
                0 0 60px var(--c-grid);
            z-index: 10;
        }

        /* Notes */
        .note {
            position: absolute;
            width: 50%; /* Chunky notes */
            height: 24px;
            left: 25%;
            z-index: 5;
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 0 10px currentColor;
        }

        /* --- BUTTONS: CHUNKY ARCADE STYLE --- */
        .controls {
            position: absolute;
            bottom: 5vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 30;
            width: 100%;
            /* CRITIQUE: Gap equal to height of options button */
            gap: 50px; 
        }

        .btn {
            font-family: var(--font-pixel);
            text-transform: uppercase;
            border: none;
            color: var(--c-text);
            cursor: pointer;
            transition: all 0.1s ease;
            position: relative;
            outline: none;
            letter-spacing: 2px;
            
            /* CRITIQUE: Chunky, tactile, thick borders, inner shadows */
            border: 4px solid #fff;
            box-shadow: 
                inset 4px 4px 0px rgba(255,255,255,0.5), /* Highlight */
                inset -4px -4px 0px rgba(0,0,0,0.5),     /* Shadow */
                4px 4px 0px rgba(0,0,0,0.8);             /* Drop shadow */
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #fff;
            color: #000;
            box-shadow: 
                inset 4px 4px 0px rgba(0,0,0,0.1),
                inset -4px -4px 0px rgba(255,255,255,0.5),
                6px 6px 0px rgba(0,0,0,0.8);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 
                inset 4px 4px 0px rgba(0,0,0,0.5),
                inset -4px -4px 0px rgba(255,255,255,0.2),
                0px 0px 0px rgba(0,0,0,0.8);
        }

        /* Primary Button: START GAME */
        .btn-primary {
            width: 280px;
            height: 72px; /* ~1.5x secondary */
            font-size: 1.2rem;
            background-color: var(--c-accent);
            border-color: #ff99cc; /* Lighter border for bevel */
            box-shadow: 
                inset 4px 4px 0px #ff99cc,
                inset -4px -4px 0px var(--c-accent-dark),
                6px 6px 0px rgba(0,0,0,0.5);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }
        
        .btn-primary:hover {
            background-color: #ff55aa;
            color: #fff;
        }

        /* Secondary Button: OPTIONS */
        .btn-secondary {
            width: 200px;
            height: 50px; /* Base height */
            font-size: 0.9rem;
            background-color: #222;
            border-color: var(--c-grid);
            box-shadow: 
                inset 4px 4px 0px rgba(0, 255, 255, 0.5),
                inset -4px -4px 0px rgba(0, 0, 0, 0.5),
                6px 6px 0px rgba(0,0,0,0.5);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .highway-wrapper { width: 90%; }
            .controls { bottom: 2vh; gap: 40px; }
            .btn-primary { width: 240px; height: 60px; }
            .btn-secondary { width: 160px; height: 40px; }
        }
    </style>
</head>
<body>

    <!-- Background Rendering -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- CRT/Texture Overlay -->
    <div class="crt-overlay"></div>

    <div class="ui-layer">
        
        <!-- Title Lockup -->
        <div class="title-group">
            <h1>PIXEL<br>DANCE</h1>
            <div class="subtitle">Rhythm Protocol</div>
        </div>

        <!-- 3D Perspective Highway (Floor Grid) -->
        <div class="highway-wrapper">
            <div class="highway-container">
                <div class="lane" id="l1"></div>
                <div class="lane" id="l2"></div>
                <div class="lane" id="l3"></div>
                <div class="lane" id="l4"></div>
                <div class="hit-line"></div>
            </div>
        </div>

        <!-- Anchored Controls -->
        <div class="controls">
            <button class="btn btn-primary" onclick="alert('SYSTEM START...')">START GAME</button>
            <button class="btn btn-secondary">OPTIONS</button>
        </div>

    </div>

    <script>
        /**
         * VISUAL ENGINE
         */

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // State
        let time = 0;
        let gridOffset = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Configuration
        // CRITIQUE: Sun sits on the horizon line
        const HORIZON_Y_RATIO = 0.45; 

        function drawBackground() {
            // Clear
            ctx.clearRect(0, 0, width, height);

            // 1. Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#020014');
            grad.addColorStop(0.6, '#1a0033');
            grad.addColorStop(1, '#050014');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const horizonY = height * HORIZON_Y_RATIO;

            // 2. The Sun (Synthwave)
            // CRITIQUE: Lowered sun to horizon
            const cx = width / 2;
            const cy = horizonY; 
            const r = Math.min(width, height) * 0.25;

            const sunGrad = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
            sunGrad.addColorStop(0, '#ff00ff');
            sunGrad.addColorStop(0.4, '#ff5500');
            sunGrad.addColorStop(1, '#ffcc00');

            ctx.save();
            ctx.translate(cx, cy);
            
            // Glow
            ctx.shadowBlur = 60;
            ctx.shadowColor = '#ff00ff';
            
            // Sun Body
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = sunGrad;
            ctx.fill();
            
            // Cutout stripes
            ctx.globalCompositeOperation = 'destination-out';
            // Make stripes thicker for retro feel
            for(let i=0; i<10; i++) {
                let y = (i * (r/4)) + (r*0.2); 
                let h = i * 4 + 6;
                ctx.fillRect(-r*1.5, y, r*3, h);
            }
            ctx.restore();

            // 3. Stars (Pixelated)
            ctx.fillStyle = 'white';
            ctx.shadowBlur = 0;
            ctx.globalCompositeOperation = 'lighter';
            for(let i=0; i<60; i++) {
                const sx = (Math.sin(i * 123.45) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 67.89) * 0.5 + 0.5) * (horizonY - 20); // Keep stars above horizon
                const alpha = (Math.sin(time * 0.05 + i) + 1) / 2;
                ctx.globalAlpha = alpha * 0.9;
                ctx.fillRect(sx, sy, 2, 2);
            }
            ctx.globalAlpha = 1.0;
            ctx.globalCompositeOperation = 'source-over';

            // 4. Perspective Grid
            // CRITIQUE: Flow continuously from bottom to horizon, higher saturation
            const vanishX = width / 2;
            
            // Update offset (Speed)
            gridOffset = (gridOffset + 3.5) % 100; 

            // CRITIQUE: Bright Cyan
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.6)'; 
            ctx.lineWidth = 2;
            
            ctx.beginPath();

            // Vertical Lines (Fan out)
            const numLines = 20;
            for (let i = -numLines; i <= numLines; i++) {
                let x1 = vanishX + (i * 5); 
                let x2 = vanishX + (i * width * 0.4); 
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
            }

            // Horizontal Lines (Moving towards viewer)
            let zStart = 100 - gridOffset; 
            let zStep = 8;
            
            for (let i = 0; i < 40; i++) {
                let z = zStart + (i * zStep);
                if (z <= 0) continue;

                // Perspective formula
                let p = 100 / z; 
                if (p >= 1) continue;

                let y = horizonY + (height - horizonY) * (1 - p);
                
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            
            ctx.stroke();
        }

        // --- NOTE SPAWNER LOGIC ---
        const lanes = [
            document.getElementById('l1'),
            document.getElementById('l2'),
            document.getElementById('l3'),
            document.getElementById('l4')
        ];
        // Colors: Magenta, Cyan, Yellow, White
        const colors = ['#ff0055', '#00ffff', '#ffff00', '#ffffff'];

        function spawnNote() {
            const laneIdx = Math.floor(Math.random() * 4);
            const lane = lanes[laneIdx];
            
            const note = document.createElement('div');
            note.className = 'note';
            note.style.backgroundColor = colors[laneIdx];
            note.style.color = colors[laneIdx]; 
            
            // Start position (Top of the container)
            note.style.top = '-30px';
            lane.appendChild(note);

            // Animate falling down
            const duration = 1400 + Math.random() * 200;
            
            const anim = note.animate([
                { top: '-30px', opacity: 1 },
                { top: 'calc(100% - 24px)', opacity: 1 } 
            ], {
                duration: duration,
                easing: 'linear',
                fill: 'forwards'
            });

            anim.onfinish = () => {
                note.remove();
            };
        }

        // Main Loop
        function loop() {
            time++;
            drawBackground();
            
            // Spawn notes randomly
            if (Math.random() < 0.04) {
                spawnNote();
            }

            requestAnimationFrame(loop);
        }

        // Start
        loop();

    </script>
</body>
</html>
