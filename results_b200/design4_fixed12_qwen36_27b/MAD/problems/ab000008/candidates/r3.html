<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM PROTOCOL</title>
    <style>
        /* 
           DESIGN SYSTEM: RETRO SYNTHWAVE / ARCADE
           Constraints: 8pt Grid, Pixel Aesthetics, High Contrast
           Fonts: System fallbacks designed to look pixelated/blocky
        */

        :root {
            --c-bg-top: #020014;
            --c-bg-mid: #1a0033;
            --c-bg-bot: #0a0a1a;
            
            --c-grid: #00f0ff; /* Neon Cyan */
            --c-accent: #ff0055; /* Neon Magenta */
            --c-sun-top: #ff00ff;
            --c-sun-bot: #ffcc00;
            
            --c-text: #ffffff;
            --c-ui-base: #110022;
            --c-ui-border: #ffffff;
            
            /* Typography Stack: Monospace for Title, Wide Sans for Buttons */
            --font-pixel: 'Courier New', 'Lucida Console', monospace;
            --font-ui: 'Arial Black', 'Impact', 'Helvetica Neue', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body {
            background-color: var(--c-bg-top);
            color: var(--c-text);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: var(--font-pixel);
        }

        /* --- BACKGROUND & ATMOSPHERE --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* CRT Scanline Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            z-index: 50;
            pointer-events: none;
            opacity: 0.8;
        }
        
        /* Vignette for depth */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            z-index: 49;
            pointer-events: none;
        }

        /* --- UI LAYOUT --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding-top: 8vh; /* Space from top */
        }

        /* --- TYPOGRAPHY: TITLE --- */
        .title-group {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 20;
        }

        h1 {
            font-family: var(--font-pixel);
            font-size: clamp(3.5rem, 9vw, 8rem);
            font-weight: 900;
            text-transform: uppercase;
            line-height: 0.85;
            color: var(--c-text);
            letter-spacing: -4px;
            margin: 0;
            
            /* Hard Directional Shadow - No RGB Split */
            text-shadow: 
                6px 6px 0px var(--c-accent),
                12px 12px 0px rgba(0,0,0,0.4);
            
            /* Subtle breathing animation */
            animation: float 4s ease-in-out infinite;
        }

        .subtitle {
            font-family: var(--font-pixel);
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--c-grid);
            text-transform: uppercase;
            letter-spacing: 0.6em; /* Wide tracking */
            margin-top: 16px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 24px;
            display: inline-block;
            border: 1px solid var(--c-grid);
            box-shadow: 0 0 10px var(--c-grid);
            text-shadow: 0 0 5px var(--c-grid);
        }

        /* --- HIGHWAY PREVIEW --- */
        .highway-wrapper {
            position: relative;
            width: 80%; /* Expanded width */
            max-width: 800px;
            height: 260px;
            margin-bottom: 20px; /* Tighter spacing */
            perspective: 600px; /* 3D perspective */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .highway-container {
            width: 100%;
            height: 100%;
            background-color: rgba(5, 0, 20, 0.9);
            border: 2px solid var(--c-grid);
            box-shadow: 
                0 0 0 4px #000, 
                0 0 30px rgba(0, 240, 255, 0.3);
            display: flex;
            position: relative;
            overflow: hidden;
            /* Tilt back slightly to match floor */
            transform: rotateX(10deg) scale(0.95);
            transform-origin: bottom center;
        }

        .lane {
            flex: 1;
            height: 100%;
            border-right: 1px solid rgba(0, 240, 255, 0.15);
            position: relative;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0, 240, 255, 0.05));
        }
        .lane:last-child { border-right: none; }

        .hit-line {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            height: 6px;
            background: #fff;
            box-shadow: 0 0 15px #fff, 0 0 30px var(--c-accent);
            z-index: 2;
        }

        .note {
            position: absolute;
            width: 80%;
            height: 24px;
            left: 10%;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.6); 
            z-index: 1;
        }

        /* --- BUTTONS: ARCADE STYLE --- */
        .controls {
            display: flex;
            flex-direction: row; /* Group horizontally or vertically? Brief says cluster. Let's do tight vertical stack centered */
            flex-direction: column;
            gap: 16px;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            margin-top: auto; /* Push down slightly */
            margin-bottom: 8vh; /* Generous bottom margin */
        }

        .btn {
            font-family: var(--font-ui);
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 18px 0;
            border: none;
            background: var(--c-ui-base);
            color: var(--c-text);
            cursor: pointer;
            position: relative;
            transition: all 0.1s cubic-bezier(0,0,0,1);
            
            /* Arcade Button Look: Chunky, 3D, Beveled */
            border-top: 4px solid rgba(255,255,255,0.8);
            border-left: 4px solid rgba(255,255,255,0.4);
            border-right: 4px solid rgba(0,0,0,0.6);
            border-bottom: 4px solid rgba(0,0,0,0.8);
            background: linear-gradient(180deg, #2a004d 0%, #110022 100%);
            
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 2px;
            outline: none;
            
            /* Glow effect */
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
        }

        .btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(180deg, #3a006d 0%, #1a0033 100%);
            border-top-color: #fff;
            color: var(--c-grid);
            text-shadow: 0 0 8px var(--c-grid);
        }

        .btn:active {
            transform: translateY(4px);
            border-top: 2px solid rgba(255,255,255,0.4);
            border-bottom: 6px solid rgba(0,0,0,0.8);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .btn-primary {
            border-bottom: 6px solid var(--c-accent);
        }
        .btn-primary:hover {
            border-bottom-color: #ff0055;
            box-shadow: 0 0 20px var(--c-accent);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

    </style>
</head>
<body>

    <!-- Background Rendering -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- Visual Overlays -->
    <div class="vignette"></div>
    <div class="scanlines"></div>

    <div class="ui-layer">
        
        <!-- Title Lockup -->
        <div class="title-group">
            <h1>PIXEL<br>DANCE</h1>
            <div class="subtitle">RHYTHM PROTOCOL</div>
        </div>

        <!-- Expanded Highway Preview -->
        <div class="highway-wrapper">
            <div class="highway-container">
                <div class="lane" id="l1"></div>
                <div class="lane" id="l2"></div>
                <div class="lane" id="l3"></div>
                <div class="lane" id="l4"></div>
                <div class="hit-line"></div>
            </div>
        </div>

        <!-- Arcade UI Cluster -->
        <div class="controls">
            <button class="btn btn-primary" onclick="alert('INITIATING SEQUENCE...')">START GAME</button>
            <button class="btn">OPTIONS</button>
        </div>

    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Draws Synthwave Grid & Sun.
         * Manages falling notes.
         */

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // State
        let time = 0;
        let gridOffset = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Configuration
        const HORIZON_Y_RATIO = 0.35; // Sun sits lower to give room for title
        
        function drawBackground() {
            // Clear
            ctx.clearRect(0, 0, width, height);

            // 1. Sky Gradient (Deep Midnight Blue to Violet)
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#020014');
            grad.addColorStop(0.5, '#1a0033');
            grad.addColorStop(1, '#0a0a1a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const horizonY = height * HORIZON_Y_RATIO;

            // 2. The Sun (Synthwave style)
            const cx = width / 2;
            const cy = horizonY - (height * 0.05); // Slightly below horizon line visually
            const r = Math.min(width, height) * 0.25;

            const sunGrad = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
            sunGrad.addColorStop(0, '#ff00ff');
            sunGrad.addColorStop(1, '#ffcc00');

            ctx.save();
            ctx.translate(cx, cy);
            
            // Glow
            ctx.shadowBlur = 50;
            ctx.shadowColor = '#ff00ff';
            
            // Sun Body
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = sunGrad;
            ctx.fill();
            
            // Cutout stripes (Retro Sun)
            ctx.globalCompositeOperation = 'destination-out';
            for(let i=0; i<10; i++) {
                let y = (i * (r/5)) + (r*0.25); 
                let h = i * 2 + 3;
                ctx.fillRect(-r*1.5, y, r*3, h);
            }
            ctx.restore();

            // 3. Stars (Pixelated)
            ctx.fillStyle = 'white';
            ctx.shadowBlur = 0;
            ctx.globalCompositeOperation = 'lighter'; // Additive blending for stars
            for(let i=0; i<60; i++) {
                const sx = (Math.sin(i * 123.45) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 67.89) * 0.5 + 0.5) * horizonY;
                // Twinkle
                const alpha = (Math.sin(time * 0.05 + i) + 1) / 2;
                ctx.globalAlpha = alpha;
                ctx.fillRect(sx, sy, 2, 2);
            }
            ctx.globalAlpha = 1.0;
            ctx.globalCompositeOperation = 'source-over';

            // 4. Perspective Grid (High Saturation Neon)
            const vanishX = width / 2;
            
            // Update offset
            gridOffset = (gridOffset + 4) % 100; // Faster movement

            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 2; // Thicker lines for "chunky" feel
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00f0ff';
            
            ctx.beginPath();

            // Vertical Lines
            // Create a fan shape
            const numLines = 20;
            for (let i = -numLines; i <= numLines; i++) {
                // Exponential spacing for perspective
                let x1 = vanishX + (i * 5); 
                let x2 = vanishX + (i * width * 0.35); 
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
            }

            // Horizontal Lines (Moving)
            let zStart = 100 - gridOffset; 
            let zStep = 8;
            
            for (let i = 0; i < 40; i++) {
                let z = zStart + (i * zStep);
                if (z <= 0) continue;

                // Perspective math: y = horizon + (height * (1 - 1/z))
                // Adjusted for visual curve
                let p = 100 / z; 
                if (p >= 1) continue;

                let y = horizonY + (height - horizonY) * (1 - p);
                
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            
            // Apply stroke with alpha
            ctx.globalAlpha = 0.6; 
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }

        // --- NOTE SPAWNER LOGIC ---
        const lanes = [
            document.getElementById('l1'),
            document.getElementById('l2'),
            document.getElementById('l3'),
            document.getElementById('l4')
        ];
        // Colors: Magenta, Cyan, Yellow, White
        const colors = ['#ff0055', '#00f0ff', '#ffff00', '#ffffff'];

        function spawnNote() {
            const laneIdx = Math.floor(Math.random() * 4);
            const lane = lanes[laneIdx];
            
            const note = document.createElement('div');
            note.className = 'note';
            note.style.backgroundColor = colors[laneIdx];
            note.style.boxShadow = `0 0 10px ${colors[laneIdx]}`;
            
            // Start position
            note.style.top = '-24px';
            lane.appendChild(note);

            const anim = note.animate([
                { top: '-24px' },
                { top: 'calc(100% - 60px)' } // Stop at hit line
            ], {
                duration: 1000,
                easing: 'linear',
                fill: 'forwards'
            });

            anim.onfinish = () => {
                note.remove();
            };
        }

        // Main Loop
        function loop() {
            time++;
            drawBackground();
            
            // Spawn notes randomly
            if (Math.random() < 0.08) {
                spawnNote();
            }

            requestAnimationFrame(loop);
        }

        // Start
        loop();

    </script>
</body>
</html>
