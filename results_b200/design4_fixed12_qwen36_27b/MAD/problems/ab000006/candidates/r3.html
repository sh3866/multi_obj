<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        /* 
           DESIGN SYSTEM: PURE RETRO 8-BIT
           Critique Response:
           1. Unify Visual Identity: Removed all gradients. Using solid hex codes.
           2. Typography: Using 'Press Start 2P' fallback stack for chunky pixel text.
           3. UI Container: Bottom-center dark box, 8pt grid alignment.
        */

        :root {
            /* Palette - Limited & Retro */
            --sky-color: #3377CC;     /* Solid retro blue */
            --snow-color: #E0E8F0;    /* Flat pale blue/white */
            --mountain-color: #6688AA; /* Distant mountains */
            --ui-bg: rgba(20, 20, 20, 0.85); /* Dark semi-transparent container */
            --ui-border: #FFFFFF;
            --text-color: #FFFFFF;
            --btn-color: #DD3333;
            --btn-shadow: #880000;
            
            /* Typography */
            --font-pixel: "Press Start 2P", "Courier New", monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: var(--font-pixel);
        }

        /* 
           LAYOUT STRUCTURE
           The container holds the UI elements.
           Canvas is the background.
        */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* CRITICAL: Keeps pixel art crisp when scaled */
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        /* UI LAYER */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas if needed */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* TITLE */
        .ui-title {
            margin-top: 10vh;
            text-align: center;
            pointer-events: auto;
        }

        h1 {
            margin: 0;
            font-size: clamp(3rem, 8vw, 6rem);
            color: var(--text-color);
            text-transform: uppercase;
            line-height: 1;
            /* Hard Block Outline - No Blur */
            text-shadow: 
                4px 4px 0 #000,
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                2px 2px 0 #000;
        }

        /* BOTTOM CONTAINER (Critique Point 3) */
        .ui-bottom-container {
            pointer-events: auto;
            width: 100%;
            display: flex;
            justify-content: center;
            padding-bottom: 5vh;
        }

        .ui-box {
            background: var(--ui-bg);
            border: 4px solid var(--ui-border);
            padding: 40px 60px; /* Generous padding */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px; /* Vertical spacing */
            /* 8pt grid alignment visual */
            box-shadow: 8px 8px 0 rgba(0,0,0,0.5); 
        }

        .instructions {
            text-align: center;
            color: var(--text-color);
            font-size: 1.2rem;
            line-height: 1.6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* FLAT PIXEL BUTTON (Critique Point 2) */
        .start-btn {
            background-color: var(--btn-color);
            color: #fff;
            font-family: var(--font-pixel);
            font-size: 1.2rem;
            padding: 16px 32px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            position: relative;
            
            /* Flat 3D Bevel (No Gradients) */
            box-shadow: 
                inset -4px -4px 0px 0px var(--btn-shadow),
                inset 4px 4px 0px 0px rgba(255,255,255,0.4),
                4px 4px 0px 0px #000;
            
            transition: transform 0.1s;
        }

        .start-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 
                inset -4px -4px 0px 0px var(--btn-shadow),
                inset 4px 4px 0px 0px rgba(255,255,255,0.4);
        }

        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Scanline overlay for retro texture */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            z-index: 20;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="world"></canvas>
        <div class="scanlines"></div>

        <div class="ui-layer">
            <!-- TITLE -->
            <div class="ui-title">
                <h1>SKIFREE</h1>
            </div>

            <!-- BOTTOM UI CONTAINER -->
            <div class="ui-bottom-container">
                <div class="ui-box">
                    <div class="instructions">
                        Use [ARROWS] to Ski<br>
                        Avoid Trees. Survive.
                    </div>
                    <button class="start-btn" id="startBtn">
                        <span class="blink">PRESS START</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

<script>
    /**
     * PIXEL ART ENGINE
     * Renders to a low-resolution buffer (320x240) and scales up via CSS.
     * This creates the authentic chunky pixel look requested.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    // Retro Resolution (SNES-ish low res)
    const GAME_WIDTH = 320;
    const GAME_HEIGHT = 240;

    let scale = 1;
    let trees = [];
    let snow = [];
    let skierFrame = 0;

    // Palette (Hex codes)
    const C_SKY = '#3377CC';
    const C_MOUNTAIN = '#6688AA';
    const C_SNOW = '#E0E8F0';
    const C_SNOW_SHADE = '#C0C8D8';
    
    // Tree Palette (Critique Point 4: Multi-shade)
    const C_TRUNK = '#4A3322';
    const C_LEAF_DARK = '#004400';
    const C_LEAF_MID = '#008800';
    const C_LEAF_LIGHT = '#00AA00';

    // Skier Palette
    const C_SKI_RED = '#DD0000';
    const C_SKI_BLUE = '#0000DD';
    const C_SKI_SKIN = '#FFCCAA';
    const C_SKI_SKI = '#111111';

    function resize() {
        // Keep internal resolution low for pixel look
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        
        // Center the canvas visually if the window is larger
        // But for full screen retro, we usually stretch or fill. 
        // The CSS handles the stretching with image-rendering: pixelated;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        snow = [];

        // Generate Trees with perspective
        // Horizon is at y=100 (approx)
        const horizon = 100;
        
        for(let i=0; i<80; i++) {
            // Random Y between horizon and bottom
            let y = horizon + Math.random() * (GAME_HEIGHT - horizon);
            
            // Scale based on Y (closer = bigger)
            let scale = (y - horizon) / (GAME_HEIGHT - horizon);
            let size = 0.5 + (scale * 1.5);
            
            let x = Math.random() * GAME_WIDTH;
            
            // Keep center clear for skier (Critique Point 3: Skier visibility)
            // Skier is roughly at x=160, y=200
            let distToSkier = Math.hypot(x - 160, y - 200);
            if(distToSkier < 60) {
                x += (x > 160) ? 70 : -70;
            }

            trees.push({x, y, size});
        }

        // Sort trees by Y so they draw back-to-front
        trees.sort((a, b) => a.y - b.y);

        // Generate Snow particles
        for(let i=0; i<40; i++) {
            snow.push({
                x: Math.random() * GAME_WIDTH,
                y: Math.random() * GAME_HEIGHT,
                speed: 0.5 + Math.random() * 1.5
            });
        }
    }

    // --- Drawing Primitives ---

    function drawRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
    }

    function drawTree(x, y, s) {
        // Shadow
        drawRect(x - 6*s, y, 12*s, 2*s, 'rgba(0,0,0,0.2)');
        
        // Trunk
        drawRect(x - 1*s, y - 8*s, 2*s, 8*s, C_TRUNK);
        
        // Leaves - Bottom Tier (Darkest)
        drawRect(x - 7*s, y - 8*s, 14*s, 6*s, C_LEAF_DARK);
        // Mid Tier (Mid)
        drawRect(x - 5*s, y - 14*s, 10*s, 6*s, C_LEAF_MID);
        // Top Tier (Lightest)
        drawRect(x - 3*s, y - 19*s, 6*s, 5*s, C_LEAF_LIGHT);
        
        // Highlights (Specular)
        drawRect(x - 5*s, y - 12*s, 1*s, 1*s, '#FFFFFF');
        drawRect(x - 2*s, y - 17*s, 1*s, 1*s, '#FFFFFF');
    }

    function drawSkier(x, y) {
        // Simple animation loop
        const legOffset = (Math.floor(skierFrame / 10) % 2 === 0) ? 1 : -1;
        const armOffset = -legOffset;

        // Skis (Background)
        drawRect(x - 6, y + 8, 2, 14, C_SKI_SKI);
        drawRect(x + 4, y + 8, 2, 14, C_SKI_SKI);

        // Legs (Blue)
        drawRect(x - 3, y + 6 + (legOffset), 2, 4, C_SKI_BLUE);
        drawRect(x + 1, y + 6 - (legOffset), 2, 4, C_SKI_BLUE);

        // Body (Red Jacket)
        drawRect(x - 3, y - 2, 6, 8, C_SKI_RED);
        // Jacket Stripes
        drawRect(x - 3, y + 0, 6, 1, '#FFFFFF');
        drawRect(x - 3, y + 3, 6, 1, '#FFFFFF');

        // Arms
        drawRect(x - 5, y - 1 + (armOffset), 1, 6, C_SKI_RED);
        drawRect(x + 4, y - 1 - (armOffset), 1, 6, C_SKI_RED);

        // Head
        drawRect(x - 2, y - 6, 4, 4, C_SKI_SKIN);
        // Hat
        drawRect(x - 2, y - 8, 4, 2, C_SKI_RED);
    }

    function drawBackground() {
        // 1. Sky (Solid Color - Critique Point 1)
        drawRect(0, 0, GAME_WIDTH, GAME_HEIGHT, C_SKY);

        // 2. Mountains (Pixelated Silhouette - Critique Point 1)
        // Hard edges, no gradients
        ctx.fillStyle = C_MOUNTAIN;
        ctx.beginPath();
        ctx.moveTo(0, 100);
        ctx.lineTo(40, 70);
        ctx.lineTo(80, 90);
        ctx.lineTo(120, 50); // Peak
        ctx.lineTo(160, 80);
        ctx.lineTo(200, 40); // Peak
        ctx.lineTo(240, 90);
        ctx.lineTo(280, 60);
        ctx.lineTo(320, 100);
        ctx.lineTo(320, 120);
        ctx.lineTo(0, 120);
        ctx.fill();

        // 3. Snow Slope (Solid Color)
        // Horizon Line is hard at Y=100
        drawRect(0, 100, GAME_WIDTH, 140, C_SNOW);
        
        // Subtle shading on the bottom half of the snow
        drawRect(0, 180, GAME_WIDTH, 60, C_SNOW_SHADE);
    }

    function animate() {
        // Clear
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        drawBackground();

        // Draw Trees
        trees.forEach(t => drawTree(t.x, t.y, t.size));

        // Draw Skier (Center X, Lower Y)
        // Add a slight bobbing motion
        const bob = Math.sin(Date.now() / 100) * 2;
        drawSkier(160, 200 + bob);

        // Draw Snow Particles (Foreground)
        ctx.fillStyle = '#FFFFFF';
        snow.forEach(p => {
            p.y += p.speed;
            p.x -= 0.5; // Wind
            
            if(p.y > GAME_HEIGHT) p.y = 0;
            if(p.x < 0) p.x = GAME_WIDTH;

            // Draw 1x1 or 2x2 pixel
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 1, 1);
        });

        skierFrame++;
        requestAnimationFrame(animate);
    }

    // --- Init ---
    window.addEventListener('resize', resize);
    
    // Button Interaction
    document.getElementById('startBtn').addEventListener('click', () => {
        const span = document.querySelector('.blink');
        span.classList.remove('blink');
        span.innerText = "SKIING...";
        // Fade out UI
        setTimeout(() => {
            document.querySelector('.ui-layer').style.opacity = '0';
            document.querySelector('.ui-layer').style.transition = 'opacity 1s';
        }, 500);
    });

    // Boot
    resize();
    animate();

</script>
</body>
</html>
