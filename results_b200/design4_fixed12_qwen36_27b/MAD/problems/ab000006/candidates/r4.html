<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        /* 
           DESIGN SYSTEM: HIGH-CONTRAST RETRO
           Critique Response:
           1. Typography: Using 'Press Start 2P' stack. Hard strokes.
           2. UI Container: 'HUD' style, semi-transparent, thick white border.
           3. Button: Flat red, pixelated, no gradients.
           4. Layout: Tight spacing, vertical alignment.
           5. Palette: Azure sky, crisp white snow, vibrant greens.
        */

        :root {
            /* Palette - Adjusted for contrast & vibrancy */
            --sky-color: #1E90FF;     /* Richer Azure */
            --snow-color: #F0F8FF;    /* Crisp, bright white/blue */
            --ui-bg: rgba(10, 20, 30, 0.85); /* Deep semi-transparent HUD */
            --ui-border: #FFFFFF;
            --text-color: #FFFFFF;
            --btn-color: #FF2222;     /* Vibrant solid red */
            --btn-text: #FFFFFF;
            
            /* Typography */
            --font-pixel: "Press Start 2P", "Courier New", monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none; /* Keep fonts crisp */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: var(--font-pixel);
        }

        /* 
           LAYOUT STRUCTURE
        */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* CRITICAL: Keeps pixel art crisp when scaled */
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }

        /* UI LAYER */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* TITLE */
        .ui-title {
            margin-top: 12vh;
            text-align: center;
            pointer-events: auto;
            z-index: 20;
        }

        h1 {
            margin: 0;
            font-size: clamp(3rem, 9vw, 7rem);
            color: var(--text-color);
            text-transform: uppercase;
            line-height: 1;
            /* Hard Block Outline - The "Crisp Black Stroke" requested */
            text-shadow: 
                5px 5px 0 #000,
                -3px -3px 0 #000,
                3px -3px 0 #000,
                -3px 3px 0 #000,
                3px 3px 0 #000;
            letter-spacing: -4px;
        }

        /* BOTTOM CONTAINER (The HUD) */
        .ui-bottom-container {
            pointer-events: auto;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 8vh; /* Positioned in lower-middle/bottom */
            z-index: 20;
        }

        .ui-box {
            /* HUD Styling: Semi-transparent dark blue/black */
            background: var(--ui-bg);
            /* Thick, white pixelated border */
            border: 6px solid var(--ui-border);
            padding: 24px 48px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Tight vertical spacing (approx 16px gap) */
            gap: 16px; 
            /* No soft shadows, just hard edges */
            box-shadow: 12px 12px 0 rgba(0,0,0,0.4); 
            max-width: 90%;
        }

        .instructions {
            text-align: center;
            color: var(--text-color);
            /* Geometric pixel font size */
            font-size: 1rem; 
            line-height: 1.6;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 #000;
        }

        /* FLAT PIXEL BUTTON */
        .start-btn {
            background-color: var(--btn-color);
            color: var(--btn-text);
            font-family: var(--font-pixel);
            font-size: 1rem;
            padding: 14px 24px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            position: relative;
            
            /* Flat design with simple black outline (border) */
            border: 4px solid #000;
            
            /* Width matches instruction text roughly via min-width or auto */
            width: 100%;
            min-width: 240px;
            
            transition: transform 0.05s;
        }

        .start-btn:active {
            transform: translate(4px, 4px);
        }

        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* CRT Scanline overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
            z-index: 30;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="world"></canvas>
        <div class="scanlines"></div>

        <div class="ui-layer">
            <!-- TITLE -->
            <div class="ui-title">
                <h1>SKIFREE</h1>
            </div>

            <!-- BOTTOM UI CONTAINER (HUD) -->
            <div class="ui-bottom-container">
                <div class="ui-box">
                    <div class="instructions">
                        Use [ARROWS] to Ski<br>
                        Avoid Trees. Survive.
                    </div>
                    <button class="start-btn" id="startBtn">
                        <span class="blink">PRESS START</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

<script>
    /**
     * PIXEL ART ENGINE
     * Renders to a low-resolution buffer (320x240) and scales up via CSS.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    // Retro Resolution
    const GAME_WIDTH = 320;
    const GAME_HEIGHT = 240;

    let trees = [];
    let snow = [];
    let skierFrame = 0;

    // Palette (Hex codes) - Adjusted for better contrast
    const C_SKY = '#1E90FF';     /* Azure */
    const C_MOUNTAIN = '#507090'; /* Darker mountains for contrast */
    const C_SNOW = '#F0F8FF';    /* Crisp White */
    const C_SNOW_SHADE = '#D0E0F0'; /* Subtle shadow */
    
    // Tree Palette (Vibrant Greens)
    const C_TRUNK = '#4A3322';
    const C_LEAF_DARK = '#005500';
    const C_LEAF_MID = '#00AA00';
    const C_LEAF_LIGHT = '#00FF00';

    // Skier Palette
    const C_SKI_RED = '#FF0000';
    const C_SKI_BLUE = '#0000AA';
    const C_SKI_SKIN = '#FFCCAA';
    const C_SKI_SKI = '#111111';

    function resize() {
        // Keep internal resolution low for pixel look
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        initWorld();
    }

    function initWorld() {
        trees = [];
        snow = [];

        // Generate Trees
        const horizon = 90;
        
        for(let i=0; i<60; i++) {
            // Random Y between horizon and bottom
            let y = horizon + Math.random() * (GAME_HEIGHT - horizon);
            
            // Scale based on Y (closer = bigger)
            let scale = (y - horizon) / (GAME_HEIGHT - horizon);
            let size = 0.4 + (scale * 1.8); // Slightly larger trees
            
            let x = Math.random() * GAME_WIDTH;
            
            // Clear path for skier (center bottom)
            let distToSkier = Math.hypot(x - 160, y - 200);
            if(distToSkier < 70) {
                x += (x > 160) ? 80 : -80;
            }

            trees.push({x, y, size});
        }

        // Sort trees by Y (Painter's Algorithm)
        trees.sort((a, b) => a.y - b.y);

        // Generate Snow particles
        for(let i=0; i<50; i++) {
            snow.push({
                x: Math.random() * GAME_WIDTH,
                y: Math.random() * GAME_HEIGHT,
                speed: 0.5 + Math.random() * 2.0,
                size: Math.random() > 0.8 ? 2 : 1
            });
        }
    }

    // --- Drawing Primitives ---

    function drawRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
    }

    function drawTree(x, y, s) {
        // Shadow (elongated left)
        drawRect(x - 10*s, y, 14*s, 3*s, 'rgba(0,0,0,0.15)');
        
        // Trunk
        drawRect(x - 1*s, y - 8*s, 2*s, 8*s, C_TRUNK);
        
        // Leaves - Tiered structure
        // Bottom Tier (Darkest)
        drawRect(x - 8*s, y - 8*s, 16*s, 6*s, C_LEAF_DARK);
        // Mid Tier (Mid)
        drawRect(x - 6*s, y - 14*s, 12*s, 6*s, C_LEAF_MID);
        // Top Tier (Lightest)
        drawRect(x - 4*s, y - 19*s, 8*s, 5*s, C_LEAF_LIGHT);
        
        // Highlights (Specular - White pixels)
        drawRect(x - 6*s, y - 10*s, 2*s, 1*s, '#FFFFFF');
        drawRect(x - 3*s, y - 16*s, 2*s, 1*s, '#FFFFFF');
    }

    function drawSkier(x, y) {
        // Animation
        const legOffset = (Math.floor(skierFrame / 8) % 2 === 0) ? 1 : -1;
        const armOffset = -legOffset;

        // Skis (Background)
        drawRect(x - 6, y + 8, 2, 16, C_SKI_SKI);
        drawRect(x + 4, y + 8, 2, 16, C_SKI_SKI);

        // Legs (Blue)
        drawRect(x - 3, y + 6 + (legOffset), 2, 4, C_SKI_BLUE);
        drawRect(x + 1, y + 6 - (legOffset), 2, 4, C_SKI_BLUE);

        // Body (Red Jacket)
        drawRect(x - 3, y - 2, 6, 8, C_SKI_RED);
        // Jacket Stripes
        drawRect(x - 3, y + 0, 6, 1, '#FFFFFF');
        drawRect(x - 3, y + 3, 6, 1, '#FFFFFF');

        // Arms
        drawRect(x - 5, y - 1 + (armOffset), 1, 6, C_SKI_RED);
        drawRect(x + 4, y - 1 - (armOffset), 1, 6, C_SKI_RED);

        // Head
        drawRect(x - 2, y - 6, 4, 4, C_SKI_SKIN);
        // Hat
        drawRect(x - 2, y - 8, 4, 2, C_SKI_RED);
        // Hat Pom-Pom
        drawRect(x, y - 10, 2, 2, '#FFFFFF');
    }

    function drawBackground() {
        // 1. Sky (Azure)
        drawRect(0, 0, GAME_WIDTH, GAME_HEIGHT, C_SKY);

        // 2. Mountains (Pixelated Silhouette)
        ctx.fillStyle = C_MOUNTAIN;
        ctx.beginPath();
        ctx.moveTo(0, 100);
        ctx.lineTo(30, 80);
        ctx.lineTo(60, 95);
        ctx.lineTo(100, 60); // Peak 1
        ctx.lineTo(140, 85);
        ctx.lineTo(180, 50); // Peak 2
        ctx.lineTo(220, 90);
        ctx.lineTo(260, 65); // Peak 3
        ctx.lineTo(320, 100);
        ctx.lineTo(320, 120);
        ctx.lineTo(0, 120);
        ctx.fill();

        // 3. Snow Slope (Crisp White)
        // Horizon Line is hard at Y=90
        drawRect(0, 90, GAME_WIDTH, 150, C_SNOW);
        
        // Subtle shading on the bottom half to give depth
        drawRect(0, 180, GAME_WIDTH, 60, C_SNOW_SHADE);
    }

    function animate() {
        // Clear
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        drawBackground();

        // Draw Trees
        trees.forEach(t => drawTree(t.x, t.y, t.size));

        // Draw Skier (Center X, Lower Y)
        // Add a slight bobbing motion
        const bob = Math.sin(Date.now() / 100) * 2;
        drawSkier(160, 200 + bob);

        // Draw Snow Particles (Foreground)
        ctx.fillStyle = '#FFFFFF';
        snow.forEach(p => {
            p.y += p.speed;
            p.x -= 0.5; // Wind effect
            
            if(p.y > GAME_HEIGHT) p.y = 0;
            if(p.x < 0) p.x = GAME_WIDTH;

            // Draw 1x1 or 2x2 pixel
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
        });

        skierFrame++;
        requestAnimationFrame(animate);
    }

    // --- Init ---
    window.addEventListener('resize', resize);
    
    // Button Interaction
    document.getElementById('startBtn').addEventListener('click', () => {
        const span = document.querySelector('.blink');
        span.classList.remove('blink');
        span.innerText = "SKIING...";
        
        // Fade out UI
        setTimeout(() => {
            document.querySelector('.ui-layer').style.opacity = '0';
            document.querySelector('.ui-layer').style.transition = 'opacity 0.5s';
        }, 500);
    });

    // Boot
    resize();
    animate();

</script>
</body>
</html>
