<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        /* 
           DESIGN SYSTEM: RETRO PIXEL AESTHETIC
           Palette: High contrast arcade colors.
           Typography: System Monospace (Courier) styled to look 8-bit.
           Layout: Vertical hierarchy (Top -> Hero -> Bottom).
        */

        :root {
            --sky-top: #5c94fc;      /* Classic SNES/GB Blue */
            --sky-bot: #85b9fc;      /* Stepped gradient color */
            --snow-bright: #ffffff;
            --snow-shadow: #d0e0f0;  /* Lighter, cleaner snow */
            --pine-dark: #005500;
            --pine-light: #008800;
            
            --ui-red: #d32f2f;       /* Retro Arcade Red */
            --ui-red-dark: #8a1c1c;  /* 3D Shadow */
            --ui-red-light: #ff6659; /* 3D Highlight */
            --ui-black: #000000;
            --ui-white: #ffffff;
            
            --font-pixel: "Courier New", "Lucida Console", "Consolas", monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none; /* Keep fonts crisp */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: var(--font-pixel);
        }

        /* 
           LAYOUT STRUCTURE
           Absolute positioning to establish vertical hierarchy.
        */

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* World Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: pixelated; /* Essential for retro look */
        }

        /* UI Elements */
        
        /* ZONE 1: TOP (0-20%) */
        .ui-title {
            position: absolute;
            top: 8%; /* Positioned in top zone */
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }

        h1 {
            margin: 0;
            font-size: clamp(3rem, 10vw, 7rem); /* Responsive massive font */
            color: var(--ui-white);
            text-transform: uppercase;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -2px;
            
            /* Hard Black Outline + 3D Drop Shadow */
            text-shadow: 
                -4px -4px 0 #000,
                 4px -4px 0 #000,
                -4px  4px 0 #000,
                 4px  4px 0 #000,
                 8px  8px 0 #000; 
        }

        /* ZONE 3: BOTTOM (70-100%) */
        .ui-bottom-zone {
            position: absolute;
            bottom: 5%; /* Anchored to bottom */
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            width: 90%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            pointer-events: none; /* Let clicks pass through empty space */
        }

        .ui-instructions {
            text-align: center;
            pointer-events: auto;
        }

        .instructions-text {
            display: block;
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--ui-white);
            font-weight: bold;
            text-transform: uppercase;
            line-height: 1.8; /* Increased spacing */
            
            /* Thick black stroke for legibility */
            text-shadow: 
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 4px  4px 0 rgba(0,0,0,0.8);
        }

        .kbd {
            display: inline-block;
            background: #333;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 4px;
            padding: 2px 6px;
            margin: 0 4px;
            box-shadow: 2px 2px 0 #000;
            font-family: var(--font-pixel);
            font-size: 0.9em;
        }

        /* BUTTON REDESIGN: RETRO UI */
        .start-btn {
            pointer-events: auto;
            background: var(--ui-red);
            color: var(--ui-white);
            border: none;
            padding: 15px 50px;
            font-family: var(--font-pixel);
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            
            /* Pixelated 3D Bevel Border (Top/Left Light, Bottom/Right Dark) */
            border-top: 6px solid var(--ui-red-light);
            border-left: 6px solid var(--ui-red-light);
            border-bottom: 6px solid var(--ui-red-dark);
            border-right: 6px solid var(--ui-red-dark);
            
            /* Outer Shadow */
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
        }

        .start-btn:hover {
            background: #e53935;
            transform: translateY(-2px);
            box-shadow: 0 14px 24px rgba(0,0,0,0.6);
        }

        /* Mechanical Press Effect */
        .start-btn:active {
            transform: translateY(4px);
            /* Invert borders to simulate pressed state */
            border-top: 6px solid var(--ui-red-dark);
            border-left: 6px solid var(--ui-red-dark);
            border-bottom: 6px solid var(--ui-red-light);
            border-right: 6px solid var(--ui-red-light);
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        /* Blink Animation */
        .blink {
            animation: blinker 1.2s linear infinite;
        }

        @keyframes blinker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Subtle CRT Vignette (Scanlines removed per critique) */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.4) 100%);
            z-index: 4;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- Procedural World -->
        <canvas id="world"></canvas>
        
        <!-- Post-processing -->
        <div class="vignette"></div>

        <!-- UI HIERARCHY -->
        
        <!-- 1. Top Zone: Title -->
        <div class="ui-title">
            <h1>SkiFree</h1>
        </div>

        <!-- 2. Middle Zone: Empty (Canvas draws Skier here) -->
        
        <!-- 3. Bottom Zone: Instructions & Button -->
        <div class="ui-bottom-zone">
            <div class="ui-instructions">
                <span class="instructions-text">
                    Use <span class="kbd">←</span> <span class="kbd">→</span> to steer.<br>
                    Avoid trees. Survive the Yeti.
                </span>
            </div>
            <button class="start-btn" id="startBtn">
                <span class="blink">PRESS START</span>
            </button>
        </div>
    </div>

<script>
    /**
     * PROCEDURAL ART ENGINE
     * Draws the snowy landscape, trees, and skier using HTML5 Canvas.
     * Logic updated to create a "Negative Space" zone around the skier.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    // Configuration
    const PIXEL_SIZE = 4; // Base unit for sprites
    let width, height;
    let frame = 0;
    let trees = [];
    let snowParticles = [];
    
    // Colors
    const C_SKY_TOP = '#5c94fc';
    const C_SKY_BOT = '#85b9fc'; // Brighter blue
    const C_SNOW = '#ffffff';
    const C_SNOW_DARK = '#d0e0f0';
    const C_TREE_DARK = '#005500';
    const C_TREE_LIGHT = '#008800';

    // --- Sprite Drawing Functions ---

    function drawPixelSkier(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Animation vars
        const bob = Math.sin(frame * 0.15) * 4;
        const lean = Math.sin(frame * 0.1) * 0.05; // Subtle lean
        
        ctx.translate(0, bob);
        ctx.rotate(lean);

        const p = scale * PIXEL_SIZE;

        // Palette
        const cSkin = '#ffccaa';
        const cHat = '#E70000';
        const cJacket = '#E70000';
        const cPants = '#0000E7';
        const cSkis = '#222222'; 

        // Skis (Behind)
        ctx.fillStyle = cSkis;
        ctx.fillRect(-5*p, 10*p, p, 20*p); // Left
        ctx.fillRect(4*p, 10*p, p, 20*p);  // Right

        // Legs
        ctx.fillStyle = cPants;
        ctx.fillRect(-4*p, 8*p, 3*p, 4*p);
        ctx.fillRect(2*p, 8*p, 3*p, 4*p);

        // Body
        ctx.fillStyle = cJacket;
        ctx.fillRect(-4*p, 1*p, 8*p, 8*p);
        
        // Stripes on jacket
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-4*p, 3*p, 8*p, p);
        ctx.fillRect(-4*p, 5*p, 8*p, p);

        // Head
        ctx.fillStyle = cSkin;
        ctx.fillRect(-2*p, -3*p, 4*p, 4*p);
        
        // Hat
        ctx.fillStyle = cHat;
        ctx.fillRect(-3*p, -4*p, 6*p, 2*p);

        // Arms/Poles
        ctx.fillStyle = '#555';
        ctx.fillRect(-6*p, 2*p, p, 12*p); // Left pole
        ctx.fillRect(5*p, 2*p, p, 12*p);  // Right pole

        ctx.restore();
    }

    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        const p = scale * PIXEL_SIZE;
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.1)'; // Softer shadow
        ctx.beginPath();
        ctx.ellipse(0, 24*p, 6*p, 2*p, 0, 0, Math.PI*2);
        ctx.fill();

        // Trunk
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(-p, 18*p, 2*p, 6*p);

        // Leaves (Procedural pixel triangle)
        ctx.fillStyle = C_TREE_DARK;
        
        // Bottom Layer
        ctx.fillRect(-8*p, 10*p, 16*p, 8*p);
        ctx.fillRect(-6*p, 6*p, 12*p, 4*p);
        
        // Mid Layer
        ctx.fillRect(-5*p, 2*p, 10*p, 4*p);
        
        // Top Layer
        ctx.fillRect(-3*p, -2*p, 6*p, 4*p);

        // Highlights (The "Retro" shine)
        ctx.fillStyle = C_TREE_LIGHT;
        ctx.fillRect(-6*p, 10*p, 2*p, 2*p);
        ctx.fillRect(-4*p, 6*p, 2*p, 2*p);
        ctx.fillRect(-2*p, 2*p, 2*p, 2*p);

        ctx.restore();
    }

    // --- World Logic ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        // Set canvas resolution to match screen
        canvas.width = width;
        canvas.height = height;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        
        // Define the "Hero Zone" (where the skier is)
        // Skier is roughly at 75% height
        const skierY = height * 0.75;
        const safeRadius = 150; // 150px clear space around skier

        const rows = 30; 
        
        for(let i=0; i<rows; i++) {
            let rowIdx = rows - i; 
            
            // Perspective scaling
            let scale = 0.4 + (rowIdx / rows) * 2.0;
            
            // Y Position: Start from horizon (0.3 height) to bottom
            let y = (height * 0.3) + (rowIdx * (height * 0.7 / rows));
            
            // Generate X
            let x = Math.random() * width;
            
            // CRITICAL: Check distance from Skier position
            // If it's within the safe radius, shift it horizontally
            let dx = x - (width / 2);
            let dy = y - skierY;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < safeRadius) {
                // Push tree away
                x = (x > width/2) ? x + safeRadius : x - safeRadius;
                // Ensure it stays on screen
                if (x < 0) x += width;
                if (x > width) x -= width;
            }

            trees.push({x, y, scale, z: rowIdx});
        }
        
        // Sort by Z (bottom-up drawing order)
        trees.sort((a, b) => a.z - b.z);

        // Generate Snow Particles
        snowParticles = [];
        for(let i=0; i<100; i++) {
            snowParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speed: Math.random() * 4 + 1,
                size: Math.random() * 3 + 1
            });
        }
    }

    function drawBackground() {
        // Sky Gradient (Stepped look via CSS/Canvas)
        let grad = ctx.createLinearGradient(0, 0, 0, height * 0.4);
        grad.addColorStop(0, C_SKY_TOP);
        grad.addColorStop(1, C_SKY_BOT);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Mountains (Silhouette)
        ctx.fillStyle = '#9fc5e8'; // Lighter mountain color
        ctx.beginPath();
        ctx.moveTo(0, height * 0.35);
        ctx.lineTo(width * 0.2, height * 0.2);
        ctx.lineTo(width * 0.4, height * 0.3);
        ctx.lineTo(width * 0.6, height * 0.15);
        ctx.lineTo(width * 0.8, height * 0.25);
        ctx.lineTo(width, height * 0.35);
        ctx.lineTo(width, height * 0.5);
        ctx.lineTo(0, height * 0.5);
        ctx.fill();

        // Snow Slope Base
        ctx.fillStyle = C_SNOW;
        ctx.fillRect(0, height * 0.35, width, height * 0.65);
        
        // Slope Shading (Subtle)
        let snowGrad = ctx.createLinearGradient(0, height*0.35, 0, height);
        snowGrad.addColorStop(0, 'rgba(0,0,0,0.02)');
        snowGrad.addColorStop(1, 'rgba(0,0,0,0.05)');
        ctx.fillStyle = snowGrad;
        ctx.fillRect(0, height * 0.35, width, height * 0.65);
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        drawBackground();

        // Draw Trees
        trees.forEach(tree => {
            drawTree(tree.x, tree.y, tree.scale);
        });

        // Draw Skier
        // Position: Center X, 75% Y
        const skierX = width / 2;
        const skierY = height * 0.75;
        drawPixelSkier(skierX, skierY, 1.2); // Slightly larger

        // Draw Snow Particles (Foreground)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        snowParticles.forEach(p => {
            p.y += p.speed;
            p.x -= 2; // Wind blowing left
            
            // Wrap around
            if (p.y > height) p.y = 0;
            if (p.x < 0) p.x = width;
            
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // --- Initialization ---

    window.addEventListener('resize', resize);
    
    document.getElementById('startBtn').addEventListener('click', function() {
        // Simple interaction feedback
        const btnText = this.querySelector('span');
        btnText.classList.remove('blink');
        btnText.innerText = "LOADING...";
        
        setTimeout(() => {
            alert("Game Start! (Visual Demo Only)");
            btnText.innerText = "PRESS START";
            btnText.classList.add('blink');
        }, 500);
    });

    // Boot
    resize();
    animate();

</script>
</body>
</html>
