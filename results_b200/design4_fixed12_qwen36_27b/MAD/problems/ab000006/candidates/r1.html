<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        /* 
           DESIGN SYSTEM: RETRO PIXEL AESTHETIC
           Palette: High contrast arcade colors.
           Typography: System Monospace (Courier) styled to look 8-bit.
           Layout: Vertical hierarchy without heavy containers.
        */

        :root {
            --sky-top: #5c94fc;      /* Classic SNES/GB Blue */
            --sky-bot: #9bbc0f;      /* Transition color */
            --snow-bright: #ffffff;
            --snow-shadow: #c0d8ff;
            --pine-dark: #0f380f;
            --pine-light: #306230;
            
            --ui-red: #E70000;       /* Arcade Red */
            --ui-black: #000000;
            --ui-white: #ffffff;
            
            --font-pixel: "Courier New", "Lucida Console", monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none; /* Keep fonts crisp */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: var(--font-pixel);
        }

        /* 
           LAYOUT STRUCTURE
           Absolute positioning to establish vertical hierarchy.
        */

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* World Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: pixelated; /* Essential for retro look */
        }

        /* UI Elements */
        .ui-title {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }

        h1 {
            margin: 0;
            font-size: clamp(3rem, 8vw, 6rem); /* Responsive massive font */
            color: var(--ui-white);
            text-transform: uppercase;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -4px;
            
            /* Hard Pixel Stroke via text-shadow hack */
            text-shadow: 
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 4px  4px 0 #000; /* 3D depth */
        }

        .ui-instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            width: 90%;
            max-width: 600px;
            text-align: center;
            pointer-events: none;
        }

        .instructions-text {
            display: block;
            font-size: clamp(1rem, 2vw, 1.5rem);
            color: var(--ui-white);
            font-weight: bold;
            text-transform: uppercase;
            
            /* Hard Shadow for legibility against busy background */
            text-shadow: 
                2px 2px 0 #000,
                4px 4px 0 rgba(0,0,0,0.5);
            line-height: 1.6;
        }

        .kbd {
            display: inline-block;
            background: rgba(0,0,0,0.6);
            border: 2px solid #fff;
            padding: 2px 6px;
            margin: 0 4px;
            border-radius: 4px;
            box-shadow: 2px 2px 0 #000;
        }

        .ui-button-container {
            position: absolute;
            bottom: 15%; /* Resting visually on snow */
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
        }

        /* 
           DIEGETIC BUTTON DESIGN
           Beveled, mechanical arcade style.
        */
        .start-btn {
            background: var(--ui-red);
            color: var(--ui-white);
            border: none;
            padding: 20px 60px;
            font-family: var(--font-pixel);
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            
            /* 3D Bevel Border (Top/Left White, Bottom/Right Black) */
            border-top: 4px solid var(--ui-white);
            border-left: 4px solid var(--ui-white);
            border-bottom: 4px solid var(--ui-black);
            border-right: 4px solid var(--ui-black);
            
            /* Shadow to lift it off the snow */
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
        }

        .start-btn:hover {
            background: #ff1a1a;
            transform: translateY(-2px);
            box-shadow: 0 14px 24px rgba(0,0,0,0.4);
        }

        /* Mechanical Press Effect */
        .start-btn:active {
            transform: translateY(2px);
            /* Invert borders to simulate pressed state */
            border-top: 4px solid var(--ui-black);
            border-left: 4px solid var(--ui-black);
            border-bottom: 4px solid var(--ui-white);
            border-right: 4px solid var(--ui-white);
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        /* 
           ATMOSPHERE
           CRT Scanlines & Vignette
        */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            
            /* Scanlines + RGB Shift simulation */
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.7) 100%);
            z-index: 9;
            pointer-events: none;
        }

        /* Blink Animation for Start Text */
        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- Procedural World -->
        <canvas id="world"></canvas>
        
        <!-- Post-processing -->
        <div class="vignette"></div>
        <div class="crt-overlay"></div>

        <!-- UI Hierarchy -->
        
        <!-- 1. Title (Top 15%) -->
        <div class="ui-title">
            <h1>SkiFree</h1>
        </div>

        <!-- 2. Instructions (Vertical Center) -->
        <div class="ui-instructions">
            <span class="instructions-text">
                Use <span class="kbd">←</span> <span class="kbd">→</span> to steer.<br>
                Avoid trees. Survive the Yeti.
            </span>
        </div>

        <!-- 3. Button (Lower Center) -->
        <div class="ui-button-container">
            <button class="start-btn" id="startBtn">
                <span class="blink">PRESS START</span>
            </button>
        </div>
    </div>

<script>
    /**
     * PROCEDURAL ART ENGINE
     * Draws the snowy landscape, trees, and skier using HTML5 Canvas.
     * Designed to match the "Crisp Pixel" aesthetic.
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    // Configuration
    const PIXEL_SIZE = 4; // Base unit for sprites
    let width, height;
    let frame = 0;
    let trees = [];
    let snowParticles = [];
    
    // Colors
    const C_SKY_TOP = '#5c94fc';
    const C_SKY_BOT = '#9bbc0f'; // Slightly yellowish-green for retro sky
    const C_SNOW = '#FFFFFF';
    const C_SNOW_DARK = '#c0d8ff';
    const C_TREE_DARK = '#0f380f';
    const C_TREE_LIGHT = '#306230';

    // --- Sprite Drawing Functions ---

    function drawPixelSkier(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Animation vars
        const bob = Math.sin(frame * 0.2) * 4;
        const lean = Math.sin(frame * 0.1) * 0.1;
        
        ctx.translate(0, bob);
        ctx.rotate(lean);

        const p = scale * PIXEL_SIZE;

        // Palette
        const cSkin = '#ffccaa';
        const cHat = '#E70000';
        const cJacket = '#E70000';
        const cPants = '#0000E7';
        const cSkis = '#0f380f'; // Dark green skis

        // Skis (Behind)
        ctx.fillStyle = cSkis;
        ctx.fillRect(-5*p, 10*p, p, 18*p); // Left
        ctx.fillRect(4*p, 10*p, p, 18*p);  // Right

        // Legs
        ctx.fillStyle = cPants;
        ctx.fillRect(-4*p, 8*p, 3*p, 4*p);
        ctx.fillRect(2*p, 8*p, 3*p, 4*p);

        // Body
        ctx.fillStyle = cJacket;
        ctx.fillRect(-4*p, 1*p, 8*p, 8*p);
        
        // Stripes on jacket
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-4*p, 3*p, 8*p, p);
        ctx.fillRect(-4*p, 5*p, 8*p, p);

        // Head
        ctx.fillStyle = cSkin;
        ctx.fillRect(-2*p, -3*p, 4*p, 4*p);
        
        // Hat
        ctx.fillStyle = cHat;
        ctx.fillRect(-3*p, -4*p, 6*p, 2*p);

        // Arms/Poles
        ctx.fillStyle = '#555';
        ctx.fillRect(-6*p, 2*p, p, 12*p); // Left pole
        ctx.fillRect(5*p, 2*p, p, 12*p);  // Right pole

        ctx.restore();
    }

    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        const p = scale * PIXEL_SIZE;
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(-4*p, 24*p, 8*p, 2*p);

        // Trunk
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(-p, 18*p, 2*p, 6*p);

        // Leaves (Procedural pixel triangle)
        ctx.fillStyle = C_TREE_DARK;
        
        // Bottom Layer
        ctx.fillRect(-8*p, 10*p, 16*p, 8*p);
        ctx.fillRect(-6*p, 6*p, 12*p, 4*p);
        
        // Mid Layer
        ctx.fillRect(-5*p, 2*p, 10*p, 4*p);
        
        // Top Layer
        ctx.fillRect(-3*p, -2*p, 6*p, 4*p);

        // Highlights (The "Retro" shine)
        ctx.fillStyle = C_TREE_LIGHT;
        // Randomize highlight positions slightly for variety? No, keep it static for pixel feel.
        ctx.fillRect(-6*p, 10*p, 2*p, 2*p);
        ctx.fillRect(-4*p, 6*p, 2*p, 2*p);
        ctx.fillRect(-2*p, 2*p, 2*p, 2*p);

        ctx.restore();
    }

    // --- World Logic ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        // Set canvas resolution to match screen, but we draw "blocky" shapes
        canvas.width = width;
        canvas.height = height;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        
        // Generate Trees with perspective
        // 0 = far (top), 1 = near (bottom)
        const rows = 25; 
        
        for(let i=0; i<rows; i++) {
            // Invert loop so we draw back to front
            let rowIdx = rows - i; 
            
            // Perspective scaling
            // Far trees are small, near trees are huge
            let scale = 0.5 + (rowIdx / rows) * 2.5;
            
            // Y Position: Top of screen to bottom
            // Using a curve to simulate a slope
            let y = (height * 0.2) + (rowIdx * (height * 0.8 / rows));
            
            // Add some random scatter
            let x = Math.random() * width;
            
            trees.push({x, y, scale, z: rowIdx});
        }
        
        // Sort by Z (bottom-up drawing order)
        trees.sort((a, b) => a.z - b.z);

        // Generate Snow Particles
        snowParticles = [];
        for(let i=0; i<150; i++) {
            snowParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speed: Math.random() * 3 + 0.5,
                size: Math.random() * 2 + 1
            });
        }
    }

    function drawBackground() {
        // Sky Gradient
        let grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, C_SKY_TOP);
        grad.addColorStop(1, C_SKY_BOT);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Mountains (Silhouette)
        ctx.fillStyle = '#8faadc'; // Distant mountain color
        ctx.beginPath();
        ctx.moveTo(0, height * 0.4);
        ctx.lineTo(width * 0.15, height * 0.25);
        ctx.lineTo(width * 0.3, height * 0.35);
        ctx.lineTo(width * 0.5, height * 0.15);
        ctx.lineTo(width * 0.7, height * 0.3);
        ctx.lineTo(width * 0.85, height * 0.2);
        ctx.lineTo(width, height * 0.4);
        ctx.lineTo(width, height * 0.5);
        ctx.lineTo(0, height * 0.5);
        ctx.fill();

        // Snow Slope Base
        ctx.fillStyle = C_SNOW;
        ctx.fillRect(0, height * 0.35, width, height * 0.65);
        
        // Slope Shading (Simple gradient overlay)
        let snowGrad = ctx.createLinearGradient(0, height*0.35, 0, height);
        snowGrad.addColorStop(0, 'rgba(0,0,0,0.05)');
        snowGrad.addColorStop(1, 'rgba(0,0,0,0.1)');
        ctx.fillStyle = snowGrad;
        ctx.fillRect(0, height * 0.35, width, height * 0.65);
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        drawBackground();

        // Draw Trees
        trees.forEach(tree => {
            drawTree(tree.x, tree.y, tree.scale);
        });

        // Draw Skier
        // Position: Center X, slightly above the button area
        const skierX = width / 2;
        const skierY = height - 250; 
        drawPixelSkier(skierX, skierY, 1);

        // Draw Snow Particles (Foreground)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        snowParticles.forEach(p => {
            p.y += p.speed;
            p.x -= 1.5; // Wind blowing left
            
            // Wrap around
            if (p.y > height) p.y = 0;
            if (p.x < 0) p.x = width;
            
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // --- Initialization ---

    window.addEventListener('resize', resize);
    
    document.getElementById('startBtn').addEventListener('click', function() {
        // Simple interaction feedback
        const btnText = this.querySelector('span');
        btnText.classList.remove('blink');
        btnText.innerText = "LOADING...";
        
        setTimeout(() => {
            alert("Game Start! (Visual Demo Only)");
            btnText.innerText = "PRESS START";
            btnText.classList.add('blink');
        }, 500);
    });

    // Boot
    resize();
    animate();

</script>
</body>
</html>
