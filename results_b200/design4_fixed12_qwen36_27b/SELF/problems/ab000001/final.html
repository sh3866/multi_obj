<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Refined Storybook */
            --bg-color: #FDFBF7;
            --bg-accent: #F2EBE5;
            
            /* Typography Colors */
            --text-main: #3E2723;
            --text-muted: #8D6E63;
            
            /* Frame Materials */
            --frame-outer: #795548;
            --frame-inner: #5D4037;
            --frame-highlight: #8D6E63;
            
            /* Board Surface */
            --board-bg: #EFEBE9;
            --tile-bg: #FFFFFF;
            --tile-shadow: #D7CCC8;
            
            /* Path Colors */
            --path-color: #D7CCC8;
            --path-active: #FF7043;
            --path-glow: rgba(255, 112, 67, 0.4);
            
            /* UI Elements */
            --btn-primary: #FF7043;
            --btn-primary-shadow: #E64A19;
            --btn-secondary: #FFFFFF;
            --btn-secondary-shadow: #D7CCC8;
            
            /* Dimensions */
            --board-width: min(85vw, 600px);
            --grid-gap: 6px;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: var(--bg-color);
            /* Subtle, high-quality dot pattern */
            background-image: radial-gradient(var(--bg-accent) 1.5px, transparent 1.5px);
            background-size: 32px 32px;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            z-index: 10;
            animation: fadeInDown 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            color: var(--text-main);
            letter-spacing: -1.5px;
            line-height: 1;
            font-weight: 900;
            /* Slight texture to text */
            text-shadow: 2px 2px 0px rgba(0,0,0,0.03);
        }

        h1 span {
            display: inline-block;
            transform: rotate(-2deg);
        }

        .subtitle {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 16px;
            display: inline-block;
            font-weight: 700;
            background: rgba(255,255,255,0.6);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* --- Game Board --- */
        .game-wrapper {
            position: relative;
            width: var(--board-width);
            /* Sophisticated Layered Shadows */
            filter: drop-shadow(0 30px 20px rgba(78, 52, 46, 0.25));
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* The thick wooden frame */
        .board-frame {
            background: var(--frame-outer);
            padding: 16px;
            border-radius: 24px;
            /* 3D bevel effect */
            box-shadow: 
                inset 0 4px 0 rgba(255,255,255,0.15),
                inset 0 -4px 0 rgba(0,0,0,0.2);
            position: relative;
        }

        /* Inner lip of the frame */
        .board-frame::before {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 2px solid rgba(0,0,0,0.1);
            border-radius: 18px;
            pointer-events: none;
        }

        .board-surface {
            background-color: var(--board-bg);
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            padding: 12px;
            position: relative;
            /* Inner depth */
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.05);
            overflow: hidden; /* Clips the paths nicely */
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(7, 1fr);
            width: 100%;
            height: 100%;
            gap: var(--grid-gap);
        }

        .tile {
            background: var(--tile-bg);
            border-radius: 8px;
            position: relative;
            /* Physical tile look */
            box-shadow: 0 4px 0 var(--tile-shadow);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
            /* Subtle paper texture */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
        }

        .tile:hover {
            transform: translateY(-2px);
        }

        /* Paths inside tiles */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            stroke: var(--path-color);
            stroke-width: 16;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.3s ease;
        }

        /* Active Path State */
        .tile.active svg {
            stroke: var(--path-active);
            filter: drop-shadow(0 0 8px var(--path-glow));
            /* Slight pulse animation */
            animation: pulsePath 1s infinite alternate;
        }
        
        .tile.active {
            background: #FFFDF9;
            z-index: 2;
        }

        @keyframes pulsePath {
            from { stroke-width: 16; }
            to { stroke-width: 18; }
        }

        /* --- Token Layer (Cub & Star) --- */
        .token-layer {
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px; /* Match board padding */
            pointer-events: none;
            z-index: 20;
        }

        /* The Cub Character */
        .cub {
            position: absolute;
            width: 60%;
            height: 60%;
            transform: translate(-50%, -50%);
            /* Rich 3D Gradient */
            background: radial-gradient(circle at 30% 30%, #FFE0B2, #FF9800 50%, #E65100 100%);
            border-radius: 50%;
            box-shadow: 
                0 12px 24px rgba(0,0,0,0.25),
                inset -4px -4px 10px rgba(0,0,0,0.15),
                inset 4px 4px 10px rgba(255,255,255,0.5);
            border: 2px solid #FFF;
            transition: top 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        left 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Face Details */
        .cub::before {
            /* Eyes */
            content: '';
            position: absolute;
            top: 35%; left: 28%;
            width: 10%; height: 10%;
            background: #3E2723;
            border-radius: 50%;
            box-shadow: 24px 0 0 #3E2723; /* Spacing for right eye */
            animation: blink 4s infinite;
        }
        .cub::after {
            /* Nose */
            content: '';
            position: absolute;
            top: 52%; left: 42%;
            width: 16%; height: 12%;
            background: #3E2723;
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        /* The Star Goal */
        .star {
            position: absolute;
            width: 65%;
            height: 65%;
            transform: translate(-50%, -50%);
            color: #FFCA28;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.15));
            animation: floatStar 3s infinite ease-in-out;
        }

        @keyframes floatStar {
            0%, 100% { transform: translate(-50%, -50%) translateY(0) rotate(0deg); }
            50% { transform: translate(-50%, -50%) translateY(-10px) rotate(5deg); }
        }

        /* --- Footer Controls --- */
        footer {
            margin-top: 3rem;
            display: flex;
            gap: 1.5rem;
            z-index: 10;
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s backwards;
        }

        button {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: 0.95rem;
            padding: 18px 44px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.15s ease;
            position: relative;
            top: 0;
            outline: none;
            /* Subtle texture on buttons */
            background-image: linear-gradient(to bottom, rgba(255,255,255,0.1), rgba(0,0,0,0.05));
        }

        button:active {
            top: 6px;
            box-shadow: 0 0px 0 transparent !important;
        }

        .btn-reset {
            background: var(--btn-secondary);
            color: var(--text-muted);
            box-shadow: 0 8px 0 var(--btn-secondary-shadow);
        }
        .btn-reset:hover {
            color: var(--text-main);
            background: #FAFAFA;
        }

        .btn-run {
            background: var(--btn-primary);
            color: white;
            box-shadow: 0 8px 0 var(--btn-primary-shadow);
        }
        .btn-run:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(253, 251, 247, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-size: 5rem;
            color: var(--btn-primary);
            margin: 0;
            transform: rotate(-5deg);
            text-shadow: 4px 4px 0px rgba(0,0,0,0.08);
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .overlay p {
            font-size: 1.4rem;
            color: var(--text-main);
            margin-top: 15px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
        }

        /* --- Animations --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes bounceIn {
            0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
            60% { transform: scale(1.15) rotate(-5deg); opacity: 1; }
            100% { transform: scale(1) rotate(-5deg); opacity: 1; }
        }

        /* Mobile Tweaks */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            :root { --board-width: 94vw; }
            footer { gap: 1rem; }
            button { padding: 16px 28px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1><span>Cub</span> <span style="transform: rotate(2deg); font-size: 0.6em; vertical-align: middle; margin: 0 5px;">n</span> <span>Pup</span></h1>
        <div class="subtitle">Level 1: The Garden</div>
    </header>

    <div class="game-wrapper">
        <div class="board-frame">
            <div class="board-surface">
                <div class="grid" id="grid"></div>
                
                <!-- Token Layer -->
                <div class="token-layer">
                    <div class="cub" id="cub"></div>
                    <div class="star" id="star">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run Path</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" style="margin-top: 30px;" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        // --- Game Logic & Visuals ---

        const GRID_SIZE = 7;
        
        // SVG Path Generators
        // Viewbox is 100x100. Center is 50,50.
        // We use 'fill' on the paths to ensure they look like solid pipes, not just lines.
        // stroke-linecap="round" handles the ends.
        const PATHS = {
            EMPTY: [],
            LINE_V: ['M50 0 V100'],
            LINE_H: ['M0 50 H100'],
            CORNER_TL: ['M50 0 V50 H0'],
            CORNER_TR: ['M50 0 V50 H100'],
            CORNER_BL: ['M0 50 V100 H50'],
            CORNER_BR: ['M100 50 V100 H50'],
            T_DOWN: ['M50 0 V100 M0 50 H100'],
            T_UP: ['M50 100 V0 M0 50 H100'],
            T_LEFT: ['M100 50 H0 M50 50 V100'],
            T_RIGHT: ['M0 50 H100 M50 50 V0'],
            CROSS: ['M50 0 V100 M0 50 H100']
        };

        // A solvable 7x7 puzzle layout
        const PUZZLE_MAP = [
            ['C_TL', 'L_V',    'C_TR', 'L_V',    'C_TL', 'L_V',    'C_TR'],
            ['L_V',    'C_BR', 'L_V',    'C_TL', 'L_V',    'C_BR', 'L_V'],
            ['L_V',    'L_V',    'C_BL', 'C_BR', 'C_BL', 'L_V',    'L_V'],
            ['L_V',    'C_TL', 'L_V',    'L_V',    'L_V',    'C_TL', 'L_V'],
            ['C_TR', 'L_V',    'C_BL', 'C_BR', 'C_BL', 'L_V',    'L_V'],
            ['L_V',    'L_V',    'L_V',    'L_V',    'L_V',    'C_BL', 'C_BR'],
            ['L_V',    'C_TL', 'L_V',    'C_BL', 'C_BR', 'L_V',    'L_V']
        ];

        function createSVG(paths) {
            if (!paths || paths.length === 0) return '';
            let svgContent = paths.map(p => `<path d="${p}" />`).join('');
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svgContent}</svg>`;
        }

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 6, y: 6}; 
                this.cubPos = {x: 0, y: 0};
                this.isRunning = false;
                
                this.init();
            }

            init() {
                this.renderBoard();
                // Small delay for animation
                setTimeout(() => {
                    this.updateTokenPosition(0, 0);
                    this.updateStarPosition(this.endPos.x, this.endPos.y);
                }, 100);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const tileType = this.getTileType(x, y);
                        const div = document.createElement('div');
                        div.className = 'tile';
                        div.innerHTML = createSVG(tileType.paths);
                        
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            getTileType(x, y) {
                const key = PUZZLE_MAP[y][x];
                const map = {
                    'L_V': PATHS.LINE_V,
                    'L_H': PATHS.LINE_H,
                    'C_TL': PATHS.CORNER_TL,
                    'C_TR': PATHS.CORNER_TR,
                    'C_BL': PATHS.CORNER_BL,
                    'C_BR': PATHS.CORNER_BR,
                    'T_DOWN': PATHS.T_DOWN,
                    'T_UP': PATHS.T_UP,
                    'T_LEFT': PATHS.T_LEFT,
                    'T_RIGHT': PATHS.T_RIGHT,
                    'X': PATHS.CROSS
                };
                return { paths: map[key] || PATHS.EMPTY };
            }

            updateTokenPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                this.isRunning = false;
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.cubPos = {x: 0, y: 0};
                this.updateTokenPosition(0, 0);
            }

            async run() {
                if (this.isRunning) return;
                this.isRunning = true;

                // Hardcoded path for the demo layout
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5}, {x:0, y:6},
                    {x:1, y:6}, {x:2, y:6}, {x:3, y:6}, {x:4, y:6}, {x:5, y:6}, {x:6, y:6}
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    const tile = this.cells[step.y][step.x];
                    
                    tile.classList.add('active');
                    this.updateTokenPosition(step.x, step.y);
                    
                    await new Promise(r => setTimeout(r, 300));
                }

                setTimeout(() => {
                    this.overlay.classList.add('active');
                    this.isRunning = false;
                }, 400);
            }
        }

        const game = new Game();
    </script>
</body>
</html>
