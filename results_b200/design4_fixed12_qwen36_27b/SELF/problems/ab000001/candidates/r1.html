<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Palette: Refined Storybook */
            --bg-paper: #FDFCF8;
            --bg-pattern: #F0EBE5;
            --ink-main: #2C3E50;
            --ink-light: #7F8C8D;
            --accent-orange: #E67E22;
            --accent-orange-dark: #D35400;
            --accent-gold: #F1C40F;
            --accent-wood: #8D6E63;
            --accent-wood-shadow: #5D4037;
            --tile-bg: #F9F7F2;
            --path-inactive: #D7CCC8; /* Subtle groove */
            --path-active: #E67E22;   /* Glowing path */
            
            /* Dimensions */
            --board-size: min(85vw, 560px);
            --tile-size: calc(var(--board-size) / 6);
            --radius-lg: 16px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-paper);
            /* Finer dot grid texture */
            background-image: radial-gradient(var(--bg-pattern) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: var(--ink-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        /* --- Typography & Header --- */
        header {
            text-align: center;
            margin-bottom: 1.5rem;
            z-index: 2;
            position: relative;
        }

        h1 {
            font-size: 3.8rem;
            margin: 0;
            letter-spacing: -2px;
            color: var(--ink-main);
            /* Hand-drawn feel using subtle transform */
            transform: rotate(-1deg); 
            text-shadow: 3px 3px 0px rgba(0,0,0,0.03);
            font-weight: 900;
            line-height: 1;
        }

        .subtitle {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: var(--ink-light);
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-top: 0.8rem;
            background: #fff;
            display: inline-block;
            padding: 6px 16px;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            font-weight: 700;
        }

        /* --- The Game Board --- */
        .game-container {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            /* Wood Frame Construction */
            background: var(--accent-wood);
            border-radius: var(--radius-lg);
            padding: 12px;
            box-shadow: 
                0 20px 40px -10px rgba(0,0,0,0.15),
                0 10px 20px -5px rgba(0,0,0,0.1),
                inset 0 2px 4px rgba(255,255,255,0.2),
                inset 0 -2px 4px rgba(0,0,0,0.2);
            transform: scale(1);
            transition: transform 0.3s ease;
        }

        /* Inner board surface */
        .board-inner {
            background: #fff;
            width: 100%;
            height: 100%;
            border-radius: 6px;
            padding: 6px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100%;
            height: 100%;
            gap: 0; /* Seamless grid */
        }

        .tile {
            background-color: var(--tile-bg);
            position: relative;
            cursor: pointer;
            /* Subtle tile separation */
            border: 1px solid rgba(0,0,0,0.02);
        }

        .tile:hover {
            background-color: #fff;
            z-index: 2;
        }

        /* SVG Paths inside tiles */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            stroke: var(--path-inactive);
            stroke-width: 10;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.4s ease;
        }

        /* Active state for path */
        .tile.active svg {
            stroke: var(--path-active);
            filter: drop-shadow(0 0 2px rgba(230, 126, 34, 0.4));
        }

        /* --- Tokens (Cub & Star) --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* The Cub */
        .cub-token {
            position: absolute;
            width: calc(var(--tile-size) * 0.65);
            height: calc(var(--tile-size) * 0.65);
            background: radial-gradient(circle at 35% 35%, #FFCC80, #D84315);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 
                0 8px 15px rgba(0,0,0,0.2),
                inset -3px -3px 8px rgba(0,0,0,0.15),
                inset 3px 3px 8px rgba(255,255,255,0.4);
            transition: top 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid #fff;
        }

        /* Face for the Cub */
        .cub-token::before {
            content: '';
            position: absolute;
            top: 38%; left: 28%; width: 8%; height: 8%;
            background: #3E2723;
            border-radius: 50%;
            box-shadow: 24px 0 0 #3E2723; /* Right eye */
        }
        .cub-token::after {
            content: '';
            position: absolute;
            top: 55%; left: 45%; width: 10%; height: 5%;
            background: #3E2723;
            border-radius: 50%;
        }

        /* The Star */
        .star-marker {
            position: absolute;
            width: calc(var(--tile-size) * 0.6);
            height: calc(var(--tile-size) * 0.6);
            transform: translate(-50%, -50%);
            color: var(--accent-gold);
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.15));
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-4px); }
        }

        /* --- Footer Controls --- */
        footer {
            margin-top: 2.5rem;
            display: flex;
            gap: 1.5rem;
            z-index: 2;
        }

        button {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            font-size: 1.1rem;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            top: 0;
            outline: none;
        }

        button:active {
            top: 3px;
            box-shadow: none !important;
        }

        .btn-reset {
            background: #fff;
            color: var(--ink-light);
            border: 1px solid rgba(0,0,0,0.1);
            box-shadow: 0 6px 0 #E0E0E0;
        }
        .btn-reset:hover {
            background: #FAFAFA;
            color: var(--ink-main);
        }
        .btn-reset:active {
            box-shadow: none !important;
        }

        .btn-run {
            background: var(--accent-orange);
            color: #fff;
            border: 1px solid var(--accent-orange-dark);
            box-shadow: 0 6px 0 var(--accent-orange-dark);
        }
        .btn-run:hover {
            background: #F39C12;
        }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-size: 5rem;
            color: var(--accent-orange);
            margin: 0;
            transform: rotate(-5deg);
            text-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .overlay p {
            font-size: 1.5rem;
            color: var(--ink-light);
            margin-top: 10px;
            font-weight: bold;
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-10deg); }
            100% { transform: scale(1) rotate(-5deg); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            :root { --board-size: 92vw; }
            h1 { font-size: 3rem; }
            footer { gap: 1rem; }
            button { padding: 12px 20px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 1: The Garden</div>
    </header>

    <div class="game-container">
        <div class="board-inner">
            <div class="grid" id="grid"></div>
        </div>
        
        <!-- Tokens Layer -->
        <div class="token-layer">
            <div class="cub-token" id="cub"></div>
            <div class="star-marker" id="star">
                <!-- Custom Star Shape -->
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run Path</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        // --- Game Logic & Drawing ---

        const GRID_SIZE = 6;
        
        // Tile Definitions (SVG Paths)
        // Coordinates are 0-100. Center is 50,50.
        const TILE_TYPES = {
            EMPTY: { paths: [] },
            LINE_V: { paths: ['M50 0 V100'], con: [1,0,1,0] }, 
            LINE_H: { paths: ['M0 50 H100'], con: [0,1,0,1] }, 
            CORNER_TR: { paths: ['M50 0 V50 H100'], con: [1,1,0,0] },
            CORNER_BR: { paths: ['M100 50 V100 H50'], con: [0,1,1,0] },
            CORNER_BL: { paths: ['M0 50 V100 H50'], con: [0,0,1,1] },
            CORNER_TL: { paths: ['M50 0 V50 H0'], con: [1,0,0,1] },
            T_DOWN: { paths: ['M50 0 V100 M0 50 H100'], con: [1,1,1,1] }, // Visual T, logic handles connection
            T_UP: { paths: ['M0 50 H100 M50 50 V100'], con: [0,1,1,1] },
            T_RIGHT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,0,1,1] },
            T_LEFT: { paths: ['M0 50 H100 M50 50 V0'], con: [1,1,1,0] }
        };

        // Layout Map
        // Visual representation of the board structure
        const PUZZLE_MAP = [
            ['C_TL', 'L', 'C_TR', 'L', 'C_TL', 'L'],
            ['L', 'C_BR', 'L', 'C_TL', 'L', 'L'],
            ['L', 'L', 'C_BL', 'C_BR', 'C_BL', 'C_BR'],
            ['L', 'C_TL', 'L', 'L', 'C_BL', 'L'],
            ['C_TR', 'L', 'C_BL', 'C_BR', 'L', 'L'],
            ['L', 'L', 'L', 'L', 'L', 'L']
        ];

        function createSVG(paths) {
            let svgContent = paths.map(p => `<path d="${p}" />`).join('');
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svgContent}</svg>`;
        }

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 5, y: 4}; 
                this.cubPos = {x: 0, y: 0};
                this.isRunning = false;
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const tileType = this.getTileType(x, y);
                        const div = document.createElement('div');
                        div.className = 'tile';
                        div.innerHTML = createSVG(tileType.paths);
                        
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            getTileType(x, y) {
                const key = PUZZLE_MAP[y][x];
                const map = {
                    'L': TILE_TYPES.LINE_V, // Defaulting to vertical for visual simplicity in this specific map layout
                    'C_TL': TILE_TYPES.CORNER_TL,
                    'C_TR': TILE_TYPES.CORNER_TR,
                    'C_BL': TILE_TYPES.CORNER_BL,
                    'C_BR': TILE_TYPES.CORNER_BR,
                    'C': TILE_TYPES.CORNER_TL 
                };
                return map[key] || TILE_TYPES.EMPTY;
            }

            updateTokenPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                this.isRunning = false;
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.cubPos = {x: 0, y: 0};
                this.updateTokenPosition(0, 0);
            }

            async run() {
                if (this.isRunning) return;
                this.isRunning = true;

                // Hardcoded path for the demo layout
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5},
                    {x:1, y:5}, {x:2, y:5}, {x:3, y:5}, {x:4, y:5}, {x:4, y:4}, {x:4, y:3}, 
                    {x:5, y:3}, {x:5, y:4} // Star
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    const tile = this.cells[step.y][step.x];
                    
                    tile.classList.add('active');
                    this.updateTokenPosition(step.x, step.y);
                    
                    await new Promise(r => setTimeout(r, 350));
                }

                setTimeout(() => {
                    this.overlay.classList.add('active');
                    this.isRunning = false;
                }, 300);
            }
        }

        const game = new Game();
    </script>
</body>
</html>
