<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cub n Pup</title>
    <style>
        :root {
            /* Refined Storybook Palette */
            --bg-paper: #F9F7F2;
            --bg-paper-texture: #E8E4D9;
            --wood-dark: #5D4037;
            --wood-light: #8D6E63;
            --wood-shadow: #3E2723;
            --ink-main: #2C3E50;
            --ink-muted: #78909C;
            
            /* Game Elements */
            --tile-bg: #FFFFFF;
            --path-empty: #D7CCC8; /* Soft groove color */
            --path-active: #FF7043; /* Warm Orange */
            --path-glow: rgba(255, 112, 67, 0.4);
            --star-color: #FFCA28;
            
            /* Dimensions */
            --board-size: min(90vw, 580px);
            --tile-size: calc(var(--board-size) / 7);
            --frame-thickness: 18px;
            
            /* Typography */
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-ui: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background-color: var(--bg-paper);
            /* Dot grid texture for storybook feel */
            background-image: radial-gradient(var(--bg-paper-texture) 2px, transparent 2px);
            background-size: 32px 32px;
            font-family: var(--font-display);
            color: var(--ink-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            color: var(--ink-main);
            letter-spacing: -1px;
            line-height: 1;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.05);
            font-weight: 900;
        }

        .subtitle {
            font-family: var(--font-ui);
            font-size: 0.9rem;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 10px;
            background: rgba(255,255,255,0.8);
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-block;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        /* --- Game Board Container --- */
        .game-wrapper {
            position: relative;
            width: var(--board-size);
            padding: var(--frame-thickness);
            background: linear-gradient(135deg, var(--wood-light), var(--wood-dark));
            border-radius: 24px;
            /* Multi-layered shadow for depth */
            box-shadow: 
                0 30px 60px -12px rgba(0,0,0,0.25),
                0 10px 20px -5px rgba(0,0,0,0.2),
                inset 0 2px 4px rgba(255,255,255,0.2),
                inset 0 -2px 4px rgba(0,0,0,0.3);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* The inner surface (paper/wood texture) */
        .board-surface {
            background-color: #F5F1E8;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            padding: 12px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }

        /* The Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(7, 1fr);
            width: 100%;
            height: 100%;
            gap: 4px;
        }

        /* Individual Tile */
        .tile {
            background: var(--tile-bg);
            border-radius: 6px;
            position: relative;
            box-shadow: 
                0 2px 0 #E0E0E0,
                0 4px 4px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s ease, background 0.3s ease;
        }

        .tile:hover {
            transform: translateY(-1px);
            background: #FFFDF9;
        }

        /* Paths inside tiles */
        .tile svg {
            width: 100%;
            height: 100%;
            display: block;
            stroke: var(--path-empty);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.4s ease, filter 0.4s ease;
        }

        /* Active State (Solved Path) */
        .tile.active svg {
            stroke: var(--path-active);
            filter: drop-shadow(0 0 4px var(--path-glow));
        }
        
        /* Make active tiles feel slightly "pressed" or highlighted */
        .tile.active {
            background: #FFF8F5;
        }

        /* --- Token Layer --- */
        .token-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
            padding: 12px; /* Match board-surface padding */
        }

        /* The Cub Character */
        .cub {
            position: absolute;
            width: 60%;
            height: 60%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at 30% 30%, #FFCC80, #E65100);
            border-radius: 50%;
            box-shadow: 
                0 8px 16px rgba(0,0,0,0.25),
                inset -4px -4px 10px rgba(0,0,0,0.15),
                inset 4px 4px 10px rgba(255,255,255,0.5);
            border: 3px solid #FFF;
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Cub Face Details */
        .cub::before {
            /* Eyes */
            content: '';
            position: absolute;
            top: 35%; left: 30%;
            width: 6%; height: 6%;
            background: #3E2723;
            border-radius: 50%;
            box-shadow: 18px 0 0 #3E2723; /* Right eye */
        }
        .cub::after {
            /* Nose/Mouth */
            content: '';
            position: absolute;
            top: 50%; left: 42%;
            width: 16%; height: 8%;
            background: #3E2723;
            border-radius: 50%;
        }

        /* The Star Goal */
        .star {
            position: absolute;
            width: 60%;
            height: 60%;
            transform: translate(-50%, -50%);
            color: var(--star-color);
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.15));
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0) scale(1); }
            50% { transform: translate(-50%, -50%) translateY(-6px) scale(1.05); }
        }

        /* --- Footer Controls --- */
        footer {
            margin-top: 3rem;
            display: flex;
            gap: 2rem;
            z-index: 10;
        }

        button {
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 1.1rem;
            padding: 14px 36px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.1s ease;
            position: relative;
            top: 0;
        }

        button:active {
            top: 4px;
        }

        .btn-reset {
            background: #fff;
            color: var(--ink-muted);
            box-shadow: 0 6px 0 #E0E0E0;
        }
        .btn-reset:hover {
            color: var(--ink-main);
            background: #FAFAFA;
        }

        .btn-run {
            background: linear-gradient(to bottom, #FF8A50, #E65100);
            color: white;
            box-shadow: 0 6px 0 #BF360C;
        }
        .btn-run:hover {
            filter: brightness(1.1);
        }

        /* --- Victory Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .overlay h2 {
            font-size: 4rem;
            color: var(--path-active);
            margin: 0;
            transform: rotate(-5deg);
            text-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }
        .overlay p {
            font-size: 1.2rem;
            color: var(--ink-main);
            margin-top: 10px;
            font-weight: bold;
        }

        /* Mobile Tweaks */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            :root { --board-size: 94vw; }
            footer { gap: 1rem; }
            button { padding: 12px 24px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cub n Pup</h1>
        <div class="subtitle">Level 1: The Garden</div>
    </header>

    <div class="game-wrapper">
        <div class="board-surface">
            <div class="grid" id="grid"></div>
            
            <!-- Overlay for moving parts -->
            <div class="token-layer">
                <div class="cub" id="cub"></div>
                <div class="star" id="star">
                    <!-- SVG Star -->
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <button class="btn-reset" onclick="game.reset()">Reset</button>
        <button class="btn-run" onclick="game.run()">Run Path</button>
    </footer>

    <div class="overlay" id="winOverlay">
        <h2>Woof!</h2>
        <p>Cub found the star.</p>
        <button class="btn-run" style="margin-top: 20px;" onclick="game.reset()">Play Again</button>
    </div>

    <script>
        // --- Game Logic & Visuals ---

        const GRID_SIZE = 7;
        
        // SVG Path Generators (Standardized 100x100 viewBox)
        // We use paths that extend to the edges for seamless connection
        const PATHS = {
            EMPTY: [],
            LINE_V: ['M50 0 V100'],
            LINE_H: ['M0 50 H100'],
            CORNER_TL: ['M50 0 V50 H0'],
            CORNER_TR: ['M50 0 V50 H100'],
            CORNER_BL: ['M0 50 V100 H50'],
            CORNER_BR: ['M100 50 V100 H50'],
            T_DOWN: ['M50 0 V100 M0 50 H100'],
            T_UP: ['M50 100 V0 M0 50 H100'],
            T_LEFT: ['M100 50 H0 M50 50 V100'], // T pointing left
            T_RIGHT: ['M0 50 H100 M50 50 V0'], // T pointing right
            CROSS: ['M50 0 V100 M0 50 H100']
        };

        // A solvable 7x7 puzzle layout
        // 0: Empty, L: Line, C: Corner, T: Tee, X: Cross
        // Visual representation of the grid structure
        const PUZZLE_MAP = [
            ['C_TL', 'L',    'C_TR', 'L',    'C_TL', 'L',    'C_TR'],
            ['L',    'C_BR', 'L',    'C_TL', 'L',    'C_BR', 'L'],
            ['L',    'L',    'C_BL', 'C_BR', 'C_BL', 'L',    'L'],
            ['L',    'C_TL', 'L',    'L',    'L',    'C_TL', 'L'],
            ['C_TR', 'L',    'C_BL', 'C_BR', 'C_BL', 'L',    'L'],
            ['L',    'L',    'L',    'L',    'L',    'C_BL', 'C_BR'],
            ['L',    'C_TL', 'L',    'C_BL', 'C_BR', 'L',    'L']
        ];

        function createSVG(paths) {
            if (!paths || paths.length === 0) return '';
            let svgContent = paths.map(p => `<path d="${p}" />`).join('');
            return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${svgContent}</svg>`;
        }

        class Game {
            constructor() {
                this.gridEl = document.getElementById('grid');
                this.cubEl = document.getElementById('cub');
                this.starEl = document.getElementById('star');
                this.overlay = document.getElementById('winOverlay');
                this.cells = []; 
                
                // Start at top-left (0,0), End at bottom-rightish (6,6)
                this.startPos = {x: 0, y: 0};
                this.endPos = {x: 6, y: 6}; 
                this.cubPos = {x: 0, y: 0};
                this.isRunning = false;
                
                this.init();
            }

            init() {
                this.renderBoard();
                this.updateTokenPosition(0, 0);
                this.updateStarPosition(this.endPos.x, this.endPos.y);
            }

            renderBoard() {
                this.gridEl.innerHTML = '';
                this.cells = [];

                for(let y=0; y<GRID_SIZE; y++) {
                    let row = [];
                    for(let x=0; x<GRID_SIZE; x++) {
                        const tileType = this.getTileType(x, y);
                        const div = document.createElement('div');
                        div.className = 'tile';
                        div.innerHTML = createSVG(tileType.paths);
                        
                        div.dataset.x = x;
                        div.dataset.y = y;
                        
                        this.gridEl.appendChild(div);
                        row.push(div);
                    }
                    this.cells.push(row);
                }
            }

            getTileType(x, y) {
                const key = PUZZLE_MAP[y][x];
                // Map string keys to actual path definitions
                const map = {
                    'L': PATHS.LINE_V, // Defaulting to V for demo map simplicity
                    'C_TL': PATHS.CORNER_TL,
                    'C_TR': PATHS.CORNER_TR,
                    'C_BL': PATHS.CORNER_BL,
                    'C_BR': PATHS.CORNER_BR,
                    'T_DOWN': PATHS.T_DOWN,
                    'T_UP': PATHS.T_UP,
                    'T_LEFT': PATHS.T_LEFT,
                    'T_RIGHT': PATHS.T_RIGHT,
                    'X': PATHS.CROSS
                };
                return { paths: map[key] || PATHS.EMPTY };
            }

            updateTokenPosition(x, y) {
                const p = 100 / GRID_SIZE;
                // Center of the tile
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.cubEl.style.left = `${left}%`;
                this.cubEl.style.top = `${top}%`;
            }

            updateStarPosition(x, y) {
                const p = 100 / GRID_SIZE;
                const left = (x * p) + (p / 2);
                const top = (y * p) + (p / 2);
                this.starEl.style.left = `${left}%`;
                this.starEl.style.top = `${top}%`;
            }

            reset() {
                this.overlay.classList.remove('active');
                this.isRunning = false;
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                this.cubPos = {x: 0, y: 0};
                this.updateTokenPosition(0, 0);
            }

            async run() {
                if (this.isRunning) return;
                this.isRunning = true;

                // Hardcoded path for the demo layout (Spiral-ish)
                // Note: In a real app, this would be a pathfinding algorithm (BFS/A*)
                const pathToStar = [
                    {x:0, y:0}, {x:0, y:1}, {x:0, y:2}, {x:0, y:3}, {x:0, y:4}, {x:0, y:5}, {x:0, y:6},
                    {x:1, y:6}, {x:2, y:6}, {x:3, y:6}, {x:4, y:6}, {x:5, y:6}, {x:6, y:6}
                ];

                for (let i = 0; i < pathToStar.length; i++) {
                    const step = pathToStar[i];
                    const tile = this.cells[step.y][step.x];
                    
                    tile.classList.add('active');
                    this.updateTokenPosition(step.x, step.y);
                    
                    await new Promise(r => setTimeout(r, 300));
                }

                setTimeout(() => {
                    this.overlay.classList.add('active');
                    this.isRunning = false;
                }, 400);
            }
        }

        const game = new Game();
    </script>
</body>
</html>
