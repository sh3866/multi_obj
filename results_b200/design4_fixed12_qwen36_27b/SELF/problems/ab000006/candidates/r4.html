<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #c0c0c0;
            --panel-light: #ffffff;
            --panel-dark: #808080;
            --panel-darker: #000000;
            --accent: #ff3333;
            --accent-dark: #990000;
            --accent-light: #ff9999;
            --text-color: #000000;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: "Courier New", Courier, monospace;
        }

        /* The Game World Container */
        #world-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        /* The Canvas - Rendered small, scaled up for pixel art look */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            z-index: 1;
        }

        /* The UI Container - Centered */
        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through empty areas */
        }

        /* The Retro Window */
        .retro-window {
            pointer-events: auto;
            background: var(--panel-bg);
            padding: 3px;
            border-top: 3px solid var(--panel-light);
            border-left: 3px solid var(--panel-light);
            border-right: 3px solid var(--panel-darker);
            border-bottom: 3px solid var(--panel-darker);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 480px;
            animation: dropIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Title Bar */
        .title-bar {
            background: #000080; /* Classic Win95 Blue */
            color: white;
            padding: 4px 6px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .title-bar-controls span {
            display: inline-block;
            width: 16px;
            height: 14px;
            background: var(--panel-bg);
            border-top: 2px solid var(--panel-light);
            border-left: 2px solid var(--panel-light);
            border-right: 2px solid var(--panel-darker);
            border-bottom: 2px solid var(--panel-darker);
            text-align: center;
            line-height: 10px;
            font-size: 10px;
            color: black;
            cursor: pointer;
            margin-left: 2px;
        }

        /* Window Content Area */
        .window-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Typography */
        h1 {
            margin: 0;
            font-size: 3.5rem;
            line-height: 1;
            text-transform: uppercase;
            color: var(--text-color);
            text-shadow: 2px 2px 0px #888;
            font-weight: 900;
            letter-spacing: -2px;
            font-family: "Impact", "Arial Black", sans-serif; /* Fallback for heavy look */
        }

        .instructions {
            text-align: center;
            font-size: 14px;
            color: #333;
            line-height: 1.5;
            border: 2px solid #808080;
            border-right-color: #fff;
            border-bottom-color: #fff;
            padding: 10px;
            background: #e0e0e0;
            width: 100%;
            box-shadow: inset 1px 1px 0px #000;
        }

        .keys {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 8px 0;
        }

        .key {
            background: #ddd;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #555;
            border-bottom: 2px solid #555;
            padding: 4px 10px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 1px 1px 0px #000;
        }

        /* Start Button */
        .start-btn {
            background: var(--panel-bg);
            color: black;
            font-family: "Courier New", monospace;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
            padding: 12px 24px;
            width: 100%;
            cursor: pointer;
            outline: none;
            border-top: 3px solid var(--panel-light);
            border-left: 3px solid var(--panel-light);
            border-right: 3px solid var(--panel-darker);
            border-bottom: 3px solid var(--panel-darker);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            transition: all 0.1s;
            position: relative;
        }

        .start-btn:hover {
            background: #d0d0d0;
        }

        .start-btn:active {
            border-top: 3px solid var(--panel-darker);
            border-left: 3px solid var(--panel-darker);
            border-right: 3px solid var(--panel-light);
            border-bottom: 3px solid var(--panel-light);
            transform: translate(2px, 2px);
            box-shadow: none;
            padding: 14px 24px; /* Adjust for border flip */
            padding-top: 10px;
            padding-left: 22px;
        }

        .blink {
            animation: blinker 1s linear infinite;
        }

        /* CRT Overlay Effects */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 21;
        }

        /* Animations */
        @keyframes blinker { 50% { opacity: 0; } }
        @keyframes dropIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

    </style>
</head>
<body>

    <div id="world-container">
        <canvas id="gameCanvas"></canvas>
        <div class="scanlines"></div>
        <div class="vignette"></div>

        <div class="ui-layer">
            <div class="retro-window">
                <div class="title-bar">
                    <span>SKIFREE.EXE</span>
                    <div class="title-bar-controls">
                        <span>_</span>
                        <span>x</span>
                    </div>
                </div>
                <div class="window-content">
                    <h1>SkiFree</h1>
                    
                    <div class="instructions">
                        <div>USE ARROWS TO STEER</div>
                        <div class="keys">
                            <div class="key">←</div>
                            <div class="key">→</div>
                        </div>
                        <div style="font-size: 0.8em; color: #555; margin-top:4px;">AVOID TREES. SURVIVE THE YETI.</div>
                    </div>

                    <button class="start-btn" id="startBtn">
                        START GAME <span class="blink">_</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

<script>
    /**
     * VISUAL ENGINE
     * Procedural Pixel Art Rendering
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // Internal Resolution (Low res for pixel look)
    const GAME_WIDTH = 320;
    const GAME_HEIGHT = 240;

    // Configuration
    const CONFIG = {
        colors: {
            skyTop: '#204060',
            skyBot: '#80A0C0',
            snow: '#E0E8F0',
            snowDark: '#C0C8D0',
            treeDark: '#103020',
            treeLight: '#184830',
            treeSnow: '#FFFFFF',
            trunk: '#402010',
            shadow: 'rgba(0,0,0,0.15)'
        },
        speed: 2,
        treeDensity: 0.04
    };

    let width, height;
    let frame = 0;
    let trees = [];
    let snowParticles = [];
    let mountains = [];

    // --- Setup ---

    function resize() {
        // Keep internal resolution fixed, scale via CSS
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        width = GAME_WIDTH;
        height = GAME_HEIGHT;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        snowParticles = [];
        mountains = [];

        // Generate Mountains
        for(let i=0; i<6; i++) {
            mountains.push({
                x: (width / 6) * i + (Math.random() * 40),
                h: 40 + Math.random() * 30,
                w: 60 + Math.random() * 40,
                c: Math.random() > 0.5 ? '#6080A0' : '#507090'
            });
        }

        // Pre-fill trees
        for(let i=0; i<15; i++) {
            spawnTree(true);
        }

        // Pre-fill snow
        for(let i=0; i<60; i++) {
            snowParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                s: Math.random() * 2 + 1,
                speed: Math.random() * 1 + 0.5
            });
        }
    }

    function spawnTree(randomY = false) {
        trees.push({
            x: Math.random() * width,
            y: randomY ? Math.random() * height : -20,
            scale: 0.5 + Math.random() * 1.0, // Parallax depth
            type: Math.random() > 0.8 ? 1 : 0 // Variation
        });
    }

    // --- Drawing Primitives ---

    function drawRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
    }

    function drawPixelTree(x, y, scale) {
        const p = Math.max(1, Math.floor(4 * scale)); // Pixel unit
        const h = 16 * scale; // Height
        
        // Shadow
        ctx.fillStyle = CONFIG.colors.shadow;
        ctx.beginPath();
        ctx.ellipse(x, y, 6*p, 2*p, 0, 0, Math.PI*2);
        ctx.fill();

        // Trunk
        drawRect(x - p, y - 4*p, 2*p, 4*p, CONFIG.colors.trunk);

        // Leaves (Staggered blocks)
        drawRect(x - 6*p, y - 8*p, 12*p, 4*p, CONFIG.colors.treeDark); // Bottom
        drawRect(x - 4*p, y - 12*p, 8*p, 4*p, CONFIG.colors.treeLight); // Mid
        drawRect(x - 2*p, y - 16*p, 4*p, 4*p, CONFIG.colors.treeDark); // Top

        // Snow Accents
        drawRect(x - 3*p, y - 12*p, 2*p, p, CONFIG.colors.treeSnow);
        drawRect(x + 2*p, y - 8*p, 2*p, p, CONFIG.colors.treeSnow);
    }

    function drawPixelSkier(x, y) {
        const p = 2; // Skier pixel unit
        const bob = Math.sin(frame * 0.2) * 2;
        
        ctx.save();
        ctx.translate(x, y + bob);

        // Skis (Gold)
        drawRect(-5*p, 10*p, 2*p, 12*p, '#D4AF37'); 
        drawRect(3*p, 10*p, 2*p, 12*p, '#D4AF37');

        // Legs (Blue)
        drawRect(-4*p, 8*p, 2*p, 4*p, '#00008B');
        drawRect(2*p, 8*p, 2*p, 4*p, '#00008B');

        // Body (Red)
        drawRect(-3*p, 2*p, 6*p, 6*p, '#D32F2F');
        // Zipper
        drawRect(-1*p, 2*p, 2*p, 6*p, '#8B0000');

        // Head (Skin)
        drawRect(-2*p, -2*p, 4*p, 4*p, '#FFCCB6');
        // Goggles
        drawRect(-2*p, 0, 4*p, 2*p, '#000');

        // Scarf (Yellow) - Waving
        const wave = Math.sin(frame * 0.4) * 2;
        drawRect(2*p, -1*p, 4*p + wave, 2*p, '#FFFF00');

        // Poles
        drawRect(-7*p, 0, p, 14*p, '#888');
        drawRect(6*p, 0, p, 14*p, '#888');

        ctx.restore();
    }

    // --- Main Loop ---

    function drawBackground() {
        // Sky
        const grad = ctx.createLinearGradient(0, 0, 0, height * 0.6);
        grad.addColorStop(0, CONFIG.colors.skyTop);
        grad.addColorStop(1, CONFIG.colors.skyBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Ground
        ctx.fillStyle = CONFIG.colors.snow;
        ctx.fillRect(0, height * 0.6, width, height * 0.4);

        // Horizon Line
        drawRect(0, height * 0.6, width, 1, '#A0B0C0');

        // Mountains
        mountains.forEach(m => {
            ctx.fillStyle = m.c;
            ctx.beginPath();
            ctx.moveTo(m.x - m.w/2, height * 0.6);
            ctx.lineTo(m.x, height * 0.6 - m.h);
            ctx.lineTo(m.x + m.w/2, height * 0.6);
            ctx.fill();
            
            // Snow cap
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.moveTo(m.x - m.w/6, height * 0.6 - m.h * 0.7);
            ctx.lineTo(m.x, height * 0.6 - m.h);
            ctx.lineTo(m.x + m.w/6, height * 0.6 - m.h * 0.7);
            ctx.fill();
        });
    }

    function animate() {
        // Clear
        ctx.clearRect(0, 0, width, height);

        drawBackground();

        // Spawn Trees
        if (Math.random() < CONFIG.treeDensity) spawnTree();

        // Update & Draw Trees
        for (let i = trees.length - 1; i >= 0; i--) {
            let t = trees[i];
            // Parallax speed based on scale
            t.y += CONFIG.speed * (t.scale * 0.8);
            
            if (t.y > height + 20) {
                trees.splice(i, 1);
            } else {
                drawPixelTree(t.x, t.y, t.scale);
            }
        }

        // Draw Skier (Center)
        drawPixelSkier(width / 2, height * 0.8);

        // Draw Snow Particles
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        snowParticles.forEach(p => {
            p.y += p.speed + CONFIG.speed * 0.5;
            p.x += Math.sin(frame * 0.01 + p.x) * 0.2; // Wind
            
            if (p.y > height) {
                p.y = -5;
                p.x = Math.random() * width;
            }
            
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), Math.floor(p.s), Math.floor(p.s));
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // --- Interaction ---

    window.addEventListener('resize', resize);

    const startBtn = document.getElementById('startBtn');
    startBtn.addEventListener('click', () => {
        startBtn.innerHTML = "LOADING...";
        startBtn.style.background = "#fff";
        
        setTimeout(() => {
            // Visual flash
            const flash = document.createElement('div');
            flash.style.position = 'fixed';
            flash.style.top = '0';
            flash.style.left = '0';
            flash.style.width = '100%';
            flash.style.height = '100%';
            flash.style.background = '#fff';
            flash.style.zIndex = '100';
            document.body.appendChild(flash);
            
            setTimeout(() => {
                flash.style.transition = 'opacity 0.5s';
                flash.style.opacity = '0';
                setTimeout(() => flash.remove(), 500);
                
                // Reset Button
                startBtn.innerHTML = "START GAME <span class='blink'>_</span>";
                startBtn.style.background = "";
                alert("GAME STARTED!\n(This is a visual demo)");
            }, 100);
        }, 800);
    });

    // Start
    resize();
    animate();

</script>
</body>
</html>
