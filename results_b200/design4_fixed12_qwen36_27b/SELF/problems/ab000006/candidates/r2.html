<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Retro Edition</title>
    <style>
        :root {
            --ui-bg: #1a1a1a;
            --ui-border: #e0e0e0;
            --ui-accent: #ff2a2a;
            --ui-accent-dark: #cc0000;
            --ui-text: #ffffff;
            --ui-text-dim: #aaaaaa;
            --font-retro: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: var(--font-retro);
        }

        /* App Container */
        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 8vh;
        }

        /* The Game Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Critical for retro look: forces nearest-neighbor scaling */
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* CRT Overlay Effects */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            background: 
                /* Scanlines */
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                /* Vignette */
                radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.6) 100%);
            background-size: 100% 4px, 100% 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        /* UI Layer */
        .ui-panel {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 480px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: bootUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* The Menu Box - Windows 3.1 Style */
        .menu-box {
            background: var(--ui-bg);
            border: 4px solid var(--ui-border);
            border-right-color: #555;
            border-bottom-color: #555;
            padding: 32px 24px;
            width: 100%;
            text-align: center;
            box-shadow: 12px 12px 0px rgba(0,0,0,0.6);
            position: relative;
        }

        /* Title Typography */
        h1 {
            margin: 0 0 20px 0;
            font-size: 4rem;
            color: var(--ui-text);
            text-transform: uppercase;
            letter-spacing: -3px;
            line-height: 1;
            /* Pixel Shadow effect */
            text-shadow: 
                4px 4px 0px #444,
                6px 6px 0px #000;
        }

        .subtitle {
            color: var(--ui-text-dim);
            font-size: 1rem;
            margin-bottom: 32px;
            line-height: 1.6;
            text-shadow: 1px 1px 0 #000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .key {
            display: inline-block;
            background: #888;
            color: #fff;
            padding: 2px 6px;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #444;
            border-bottom: 2px solid #444;
            font-weight: bold;
            font-size: 0.9rem;
            margin: 0 4px;
        }

        /* Start Button - Windows 3.1 Style */
        .start-btn {
            background: var(--ui-accent);
            color: #fff;
            border: none;
            padding: 16px 32px;
            font-family: var(--font-retro);
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            position: relative;
            
            /* Bevel Effect */
            border: 4px solid #fff;
            border-right-color: var(--ui-accent-dark);
            border-bottom-color: var(--ui-accent-dark);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.4);
            
            transition: all 0.1s;
        }

        .start-btn:hover {
            background: #ff4d4d;
        }

        .start-btn:active {
            /* Inverted Bevel on Click */
            border: 4px solid var(--ui-accent-dark);
            border-right-color: #fff;
            border-bottom-color: #fff;
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        /* Blinking Cursor */
        .blink {
            animation: blinker 1s step-end infinite;
        }

        /* Animations */
        @keyframes bootUp {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

    </style>
</head>
<body>

    <div id="app-container">
        <canvas id="world"></canvas>
        <div class="crt-overlay"></div>
        
        <div class="ui-panel">
            <div class="menu-box">
                <h1>SkiFree</h1>
                <div class="subtitle">
                    Use <span class="key">&larr;</span> <span class="key">&rarr;</span> to steer.<br>
                    Avoid trees. Survive the Yeti.
                </div>
                <button class="start-btn" id="startBtn">Start Game <span class="blink">_</span></button>
            </div>
        </div>
    </div>

<script>
    /**
     * VISUAL ENGINE
     * Procedural Retro Graphics
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    // Configuration
    const CONFIG = {
        pixelSize: 5, // Slightly larger base pixel for bold look
        snowSpeed: 2,
        colors: {
            skyTop: '#5D9ECC',
            skyBot: '#C6E2F0',
            snow: '#F0F8FF',
            snowShadow: '#D6EAF8',
            treeDark: '#1E5631',
            treeLight: '#2E8B57',
            trunk: '#654321',
            skier: {
                skin: '#FFCCB6',
                hat: '#D32F2F',
                jacket: '#D32F2F',
                pants: '#1A237E',
                skis: '#FFD700',
                poles: '#777777'
            }
        }
    };

    let width, height;
    let frame = 0;
    let trees = [];
    let particles = [];
    let mountains = [];

    // --- Drawing Functions ---

    // Helper to draw a crisp pixel rect
    function drawRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
    }

    // Procedural Skier Drawing
    function drawSkier(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        
        // Bobbing animation
        const bob = Math.sin(frame * 0.15) * 4;
        // Slight lean
        const lean = Math.sin(frame * 0.05) * 0.1;
        
        ctx.translate(0, bob);
        ctx.rotate(lean);
        
        const p = scale; // pixel unit
        const c = CONFIG.colors.skier;

        // Skis
        drawRect(-5*p, 14*p, 2*p, 16*p, c.skis); 
        drawRect(3*p, 14*p, 2*p, 16*p, c.skis);  

        // Poles
        drawRect(-7*p, 8*p, p, 20*p, c.poles); 
        drawRect(6*p, 8*p, p, 20*p, c.poles); 

        // Legs
        drawRect(-3*p, 12*p, 2*p, 4*p, c.pants);
        drawRect(2*p, 12*p, 2*p, 4*p, c.pants);

        // Body
        drawRect(-3*p, 4*p, 6*p, 8*p, c.jacket);
        // Zipper
        drawRect(-1*p, 4*p, 2*p, 8*p, '#A00000');

        // Head
        drawRect(-2*p, -2*p, 4*p, 6*p, c.skin);
        
        // Hat
        drawRect(-2*p, -4*p, 4*p, 2*p, c.hat);
        drawRect(-3*p, -2*p, 6*p, 2*p, c.hat); // Brim

        // Scarf (animated)
        const scarfFlap = Math.sin(frame * 0.3) * 2;
        drawRect(1*p, -1*p, 4*p + scarfFlap, 2*p, '#FFD700');

        ctx.restore();
    }

    // Procedural Tree Drawing
    function drawTree(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        const p = scale;
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(0, 22*p, 7*p, 3*p, 0, 0, Math.PI*2);
        ctx.fill();

        // Trunk
        drawRect(-p, 14*p, 2*p, 8*p, CONFIG.colors.trunk);

        // Leaves (Layers) - Classic Pine Shape
        // Bottom
        drawRect(-7*p, 6*p, 14*p, 6*p, CONFIG.colors.treeDark);
        drawRect(-6*p, 4*p, 12*p, 2*p, CONFIG.colors.treeDark);
        
        // Mid
        drawRect(-6*p, 2*p, 12*p, 6*p, CONFIG.colors.treeDark);
        
        // Top
        drawRect(-4*p, -2*p, 8*p, 6*p, CONFIG.colors.treeDark);

        // Highlights (Snow on branches)
        drawRect(-5*p, 2*p, 2*p, 2*p, '#FFF');
        drawRect(3*p, -1*p, 2*p, 2*p, '#FFF');

        ctx.restore();
    }

    function drawSnowflake(x, y, size) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.fillRect(x, y, size, size);
    }

    // --- World Generation ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        // Set canvas internal resolution to match screen for crisp pixels
        // For true retro feel, we could set this to width/4, but 1:1 is cleaner for UI
        canvas.width = width;
        canvas.height = height;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        particles = [];
        mountains = [];

        // Generate Mountains
        const mountainCount = 4;
        for(let i=0; i<mountainCount; i++) {
            mountains.push({
                x: (width / (mountainCount-1)) * i - 100 + Math.random()*100,
                h: height * (0.15 + Math.random() * 0.15),
                w: width * (0.4 + Math.random() * 0.2),
                color: Math.random() > 0.5 ? '#B0C4DE' : '#A9CCE3'
            });
        }

        // Generate Trees
        const rows = 40;
        
        for (let i = 0; i < rows; i++) {
            const depth = i / rows; // 0 to 1
            
            // Perspective: Exponential curve
            const scale = Math.pow(depth, 1.8) * 8 + 2; 
            
            // Y position: Logarithmic distribution
            const horizonY = height * 0.35;
            const bottomY = height;
            const y = horizonY + (bottomY - horizonY) * Math.pow(depth, 1.2);

            // X position: Wider spread as we get closer
            const spread = width * (0.2 + depth * 0.8);
            const centerX = width / 2;

            // Random trees per row
            const treesInRow = Math.floor(Math.random() * (2 + depth * 8)) + 1;
            
            for (let j = 0; j < treesInRow; j++) {
                // Avoid center path initially for visual clarity
                let x = centerX + (Math.random() - 0.5) * spread * 2;
                trees.push({ x, y, scale, z: depth });
            }
        }

        // Sort by Z (depth) - Painter's Algorithm
        trees.sort((a, b) => a.z - b.z);

        // Snow Particles
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speed: Math.random() * 2 + 0.5,
                size: Math.random() > 0.8 ? 4 : 2,
                drift: Math.random() * 1 - 0.5
            });
        }
    }

    // --- Main Loop ---

    function drawBackground() {
        // Sky Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, CONFIG.colors.skyTop);
        grad.addColorStop(1, CONFIG.colors.skyBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Draw Mountains
        mountains.forEach(m => {
            ctx.fillStyle = m.color;
            ctx.beginPath();
            ctx.moveTo(m.x - m.w/2, height * 0.35);
            ctx.lineTo(m.x, height * 0.35 - m.h);
            ctx.lineTo(m.x + m.w/2, height * 0.35);
            ctx.fill();
            
            // Snow cap
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.moveTo(m.x - m.w*0.15, height * 0.35 - m.h + m.h*0.2);
            ctx.lineTo(m.x, height * 0.35 - m.h);
            ctx.lineTo(m.x + m.w*0.15, height * 0.35 - m.h + m.h*0.2);
            ctx.fill();
        });

        // The Slope
        ctx.fillStyle = CONFIG.colors.snow;
        ctx.fillRect(0, height * 0.35, width, height * 0.65);

        // Slope Texture/Shading
        ctx.fillStyle = CONFIG.colors.snowShadow;
        ctx.fillRect(0, height * 0.35, width, 10); // Horizon line shadow
        
        // Add some random subtle texture to the ground
        for(let i=0; i<50; i++) {
             // We don't animate these, just static noise
             // To keep it performant and clean, we rely on the trees for depth
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        drawBackground();

        // Draw Trees
        trees.forEach(tree => {
            // Simple parallax/movement effect for trees to simulate skiing forward
            // We move them down based on depth
            const speed = 1 + (tree.z * 5);
            tree.y += speed;
            
            // Reset if off screen
            if (tree.y > height + 50) {
                tree.y = height * 0.35;
                tree.x = width/2 + (Math.random() - 0.5) * width;
            }

            drawTree(tree.x, tree.y, tree.scale);
        });

        // Draw Skier (Fixed position, bobbing)
        const skierY = height - 250;
        const skierX = width / 2;
        drawSkier(skierX, skierY, CONFIG.pixelSize);

        // Draw Snow Particles
        particles.forEach(p => {
            p.y += p.speed + 2; // Move down faster than trees to create depth
            p.x += p.drift;
            
            if (p.y > height) {
                p.y = 0;
                p.x = Math.random() * width;
            }
            if (p.x > width) p.x = 0;
            if (p.x < 0) p.x = width;

            drawSnowflake(p.x, p.y, p.size);
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // --- Interaction ---

    window.addEventListener('resize', resize);

    document.getElementById('startBtn').addEventListener('click', function() {
        this.innerHTML = "LOADING...";
        this.style.background = "#fff";
        this.style.color = "#000";
        this.style.borderColor = "#000";
        
        // Fake loading delay
        setTimeout(() => {
            alert("GAME START! \n(This is a visual demo of the start screen)");
            this.innerHTML = "START GAME <span class='blink'>_</span>";
            this.style.background = "var(--ui-accent)";
            this.style.color = "#fff";
            this.style.borderColor = "#fff";
        }, 800);
    });

    // Initialize
    resize();
    animate();

</script>
</body>
</html>
