<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - The Ultimate Skiing Challenge</title>
    <style>
        :root {
            --crt-flicker: 0.02;
            --bg-color: #121212;
            --panel-bg: #2b2b2b;
            --panel-border-light: #ffffff;
            --panel-border-dark: #555555;
            --panel-border-shadow: #111111;
            --accent: #ff3333;
            --accent-dark: #cc0000;
            --text-main: #e0e0e0;
            --text-dim: #888888;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace; /* Fallback for retro feel */
        }

        /* Container */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Retro Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* CRT / Retro Monitor Effects */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.8) 100%);
            background-size: 100% 4px, 100% 100%;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.7);
            animation: flicker 0.15s infinite;
        }

        /* UI Layer */
        .ui-wrapper {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 520px;
            padding: 20px;
            display: flex;
            justify-content: center;
            animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Windows 3.1 / Retro Panel Style */
        .retro-panel {
            background: var(--panel-bg);
            padding: 4px;
            border-top: 4px solid var(--panel-border-light);
            border-left: 4px solid var(--panel-border-light);
            border-right: 4px solid var(--panel-border-dark);
            border-bottom: 4px solid var(--panel-border-dark);
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
            width: 100%;
            text-align: center;
        }

        /* Inner bevel for title bar */
        .panel-content {
            padding: 24px 32px 32px;
            background: #1a1a1a;
            border: 2px solid var(--panel-border-dark);
            border-right-color: var(--panel-border-light);
            border-bottom-color: var(--panel-border-light);
        }

        /* Typography */
        h1 {
            margin: 0 0 16px;
            font-size: 3.5rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 0.9;
            text-shadow: 
                3px 3px 0px #555,
                5px 5px 0px #000;
            font-weight: 900;
        }

        .instructions {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 32px;
            line-height: 1.6;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        /* Keycaps */
        .key-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        
        .key {
            background: #ccc;
            color: #000;
            font-weight: bold;
            padding: 2px 8px;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #444;
            border-bottom: 2px solid #444;
            font-size: 0.8rem;
            min-width: 24px;
            display: inline-block;
        }

        /* Start Button */
        .start-btn {
            background: var(--accent);
            color: #fff;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 16px 40px;
            cursor: pointer;
            width: 100%;
            border: none;
            
            /* 3D Bevel */
            border-top: 4px solid #ff9999;
            border-left: 4px solid #ff9999;
            border-right: 4px solid #990000;
            border-bottom: 4px solid #990000;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            
            transition: all 0.1s;
            position: relative;
            overflow: hidden;
        }

        .start-btn:hover {
            background: #ff4d4d;
        }

        .start-btn:active {
            border-top: 4px solid #990000;
            border-left: 4px solid #990000;
            border-right: 4px solid #ff9999;
            border-bottom: 4px solid #ff9999;
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        /* Blinking Cursor */
        .cursor {
            animation: blink 1s step-end infinite;
        }

        /* Animations */
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.95; }
            10% { opacity: 0.9; }
            15% { opacity: 0.95; }
            100% { opacity: 0.97; }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="world"></canvas>
        <div class="crt-overlay"></div>
        
        <div class="ui-wrapper">
            <div class="retro-panel">
                <div class="panel-content">
                    <h1>SkiFree</h1>
                    <div class="instructions">
                        <div>
                            <span class="key">←</span> <span class="key">→</span> TO STEER
                        </div>
                        <div style="margin-top: 4px; font-size: 0.8em;">
                            AVOID TREES. SURVIVE THE YETI.
                        </div>
                    </div>
                    <button class="start-btn" id="startBtn">Start Game <span class="cursor">_</span></button>
                </div>
            </div>
        </div>
    </div>

<script>
    /**
     * VISUAL ENGINE
     * Enhanced Procedural Retro Graphics
     */
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency

    // Configuration
    const CONFIG = {
        colors: {
            skyTop: '#3A5F7A',
            skyBot: '#8FA5B8',
            snow: '#E8F0F5',
            snowShadow: '#D0DCE6',
            treeDark: '#143620',
            treeLight: '#1E5230',
            treeSnow: '#FFFFFF',
            trunk: '#3D2010'
        },
        speed: 3,
        treeSpawnRate: 0.05
    };

    let width, height;
    let frame = 0;
    let trees = [];
    let particles = [];
    let mountains = [];
    let skierBob = 0;

    // --- Helper Functions ---

    function drawRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
    }

    // --- Drawing Assets ---

    function drawMountain(x, y, size, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x - size, y);
        ctx.lineTo(x, y - size * 0.6);
        ctx.lineTo(x + size, y);
        ctx.fill();

        // Snow Cap
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.moveTo(x - size * 0.2, y - size * 0.45);
        ctx.lineTo(x, y - size * 0.6);
        ctx.lineTo(x + size * 0.2, y - size * 0.45);
        ctx.lineTo(x + size * 0.1, y - size * 0.35); // Jagged edge
        ctx.lineTo(x - size * 0.1, y - size * 0.4); // Jagged edge
        ctx.fill();
    }

    function drawTree(x, y, scale) {
        const p = scale; // Pixel unit
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(x, y + 2*p, 8*p, 2*p, 0, 0, Math.PI*2);
        ctx.fill();

        // Trunk
        drawRect(x - 1*p, y - 6*p, 2*p, 6*p, CONFIG.colors.trunk);

        // Leaves - Bottom
        drawRect(x - 8*p, y - 10*p, 16*p, 5*p, CONFIG.colors.treeDark);
        // Leaves - Mid
        drawRect(x - 6*p, y - 15*p, 12*p, 5*p, CONFIG.colors.treeDark);
        // Leaves - Top
        drawRect(x - 4*p, y - 20*p, 8*p, 5*p, CONFIG.colors.treeDark);

        // Snow details (Procedural white pixels)
        drawRect(x - 6*p, y - 10*p, 2*p, 1*p, CONFIG.colors.treeSnow);
        drawRect(x + 4*p, y - 10*p, 2*p, 1*p, CONFIG.colors.treeSnow);
        drawRect(x - 3*p, y - 15*p, 2*p, 1*p, CONFIG.colors.treeSnow);
        drawRect(x + 1*p, y - 20*p, 2*p, 1*p, CONFIG.colors.treeSnow);
    }

    function drawSkier(x, y) {
        ctx.save();
        ctx.translate(x, y);
        
        // Animation
        const bob = Math.sin(frame * 0.2) * 4;
        const lean = Math.sin(frame * 0.05) * 0.15;
        
        ctx.translate(0, bob);
        ctx.rotate(lean);

        const p = 4; // Skier pixel scale

        // Skis
        drawRect(-6*p, 14*p, 2*p, 14*p, '#D4AF37'); // Gold
        drawRect(4*p, 14*p, 2*p, 14*p, '#D4AF37');

        // Poles
        drawRect(-8*p, 6*p, p, 18*p, '#777');
        drawRect(7*p, 6*p, p, 18*p, '#777');

        // Legs
        drawRect(-4*p, 12*p, 3*p, 4*p, '#00008B'); // Dark Blue
        drawRect(1*p, 12*p, 3*p, 4*p, '#00008B');

        // Body
        drawRect(-3*p, 4*p, 6*p, 8*p, '#D32F2F'); // Red Jacket
        drawRect(-1*p, 4*p, 2*p, 8*p, '#8B0000'); // Zipper

        // Head
        drawRect(-2*p, -2*p, 4*p, 5*p, '#FFCCB6'); // Skin
        drawRect(-2*p, -2*p, 4*p, 2*p, '#000'); // Goggles

        // Hat
        drawRect(-2*p, -4*p, 4*p, 2*p, '#D32F2F');
        drawRect(-3*p, -2*p, 6*p, 2*p, '#D32F2F'); // Brim

        // Scarf
        const scarf = Math.sin(frame * 0.4) * 2;
        drawRect(1*p, 0, 4*p + scarf, 2*p, '#FFFF00');

        ctx.restore();
    }

    // --- World Management ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        
        // Internal resolution for crisp pixels (scaled up by CSS)
        canvas.width = width;
        canvas.height = height;
        
        initWorld();
    }

    function initWorld() {
        trees = [];
        particles = [];
        mountains = [];

        // Mountains
        for(let i=0; i<5; i++) {
            mountains.push({
                x: (width / 4) * i - 50,
                size: height * (0.2 + Math.random() * 0.15),
                color: Math.random() > 0.5 ? '#7A96B0' : '#6B859E'
            });
        }

        // Pre-populate trees
        for(let i=0; i<30; i++) {
            spawnTree(true);
        }

        // Snow Particles
        for (let i = 0; i < 150; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                speed: Math.random() * 4 + 2,
                size: Math.random() > 0.9 ? 4 : 2,
                drift: Math.random() * 2 - 1
            });
        }
    }

    function spawnTree(randomY = false) {
        const scale = 4 + Math.random() * 4; // Varying sizes
        
        trees.push({
            x: Math.random() * width,
            y: randomY ? Math.random() * height : -100,
            scale: scale,
            z: 1 // Depth factor
        });
    }

    // --- Main Loop ---

    function drawBackground() {
        // Sky Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, CONFIG.colors.skyTop);
        grad.addColorStop(0.5, CONFIG.colors.skyBot);
        grad.addColorStop(0.5, CONFIG.colors.snow); // Horizon
        grad.addColorStop(1, CONFIG.colors.snowShadow);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Horizon Line
        drawRect(0, height * 0.45, width, 2, 'rgba(0,0,0,0.1)');

        // Mountains
        mountains.forEach(m => drawMountain(m.x, height * 0.45, m.size, m.color));
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);

        drawBackground();

        // Spawn new trees
        if (Math.random() < CONFIG.treeSpawnRate) spawnTree();

        // Update & Draw Trees
        for (let i = trees.length - 1; i >= 0; i--) {
            let t = trees[i];
            
            // Parallax movement (closer trees move faster)
            t.y += CONFIG.speed * (t.scale / 4);
            
            // Reset if off screen
            if (t.y > height + 100) {
                trees.splice(i, 1);
                continue;
            }

            drawTree(t.x, t.y, t.scale);
        }

        // Draw Skier (Center Screen)
        const skierY = height - 180;
        const skierX = width / 2;
        drawSkier(skierX, skierY);

        // Draw Snow Particles
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        particles.forEach(p => {
            p.y += p.speed + (CONFIG.speed * 0.5); // Snow moves with slope
            p.x += p.drift;
            
            if (p.y > height) {
                p.y = -10;
                p.x = Math.random() * width;
            }
            
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // --- Interaction ---

    window.addEventListener('resize', resize);

    document.getElementById('startBtn').addEventListener('click', function(e) {
        // Visual feedback
        this.innerHTML = "LOADING...";
        this.style.background = "#fff";
        this.style.color = "#000";
        this.style.borderColor = "#000";
        
        // Simulate boot up
        setTimeout(() => {
            // In a real game, we'd switch scenes here
            // For this demo, we just flash the screen
            const overlay = document.querySelector('.crt-overlay');
            overlay.style.background = "#fff";
            setTimeout(() => {
                overlay.style.background = ""; // Revert to CSS
                this.innerHTML = "START GAME <span class='cursor'>_</span>";
                this.style.background = "var(--accent)";
                this.style.color = "#fff";
                this.style.borderColor = "transparent"; // Let CSS handle borders
                alert("GAME START!\n(This is a visual demo of the start screen)");
            }, 100);
        }, 600);
    });

    // Initialize
    resize();
    animate();

</script>
</body>
</html>
