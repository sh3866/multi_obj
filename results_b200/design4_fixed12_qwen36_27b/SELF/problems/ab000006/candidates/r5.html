<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkiFree - Classic Edition</title>
    <style>
        :root {
            --win-gray: #c0c0c0;
            --win-dark: #808080;
            --win-darker: #404040;
            --win-light: #ffffff;
            --win-blue: #000080;
            --win-text: #000000;
            --accent: #ff3333;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: "Courier New", Courier, monospace;
        }

        /* --- Layout Layers --- */
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 1. The Game World Background */
        #game-world {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* This canvas will be scaled via CSS to look pixelated */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* 2. The UI Overlay */
        #ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            animation: bootUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-origin: center;
        }

        /* --- Retro Window Design --- */
        .window {
            background: var(--win-gray);
            /* Classic 3D Bevel */
            border-top: 2px solid var(--win-light);
            border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-darker);
            border-bottom: 2px solid var(--win-darker);
            box-shadow: 
                inset 1px 1px 0 var(--win-light), 
                inset -1px -1px 0 var(--win-dark),
                4px 4px 0px rgba(0,0,0,0.3); /* Drop shadow */
            display: flex;
            flex-direction: column;
        }

        /* Title Bar */
        .title-bar {
            background: linear-gradient(90deg, var(--win-blue), #1084d0);
            padding: 4px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .title-text {
            color: white;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .window-controls {
            display: flex;
            gap: 2px;
        }

        .control-btn {
            width: 16px;
            height: 14px;
            background: var(--win-gray);
            border-top: 1px solid var(--win-light);
            border-left: 1px solid var(--win-light);
            border-right: 1px solid var(--win-darker);
            border-bottom: 1px solid var(--win-darker);
            font-size: 10px;
            line-height: 10px;
            text-align: center;
            color: black;
            cursor: default;
            box-shadow: inset -1px -1px 0 var(--win-dark);
        }
        
        .control-btn:active {
            border-top: 1px solid var(--win-darker);
            border-left: 1px solid var(--win-darker);
            border-right: 1px solid var(--win-light);
            border-bottom: 1px solid var(--win-light);
            padding-top: 1px;
            padding-left: 1px;
        }

        /* Window Body */
        .window-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Typography */
        h1 {
            margin: 0;
            font-family: "Arial Black", "Impact", sans-serif;
            font-size: 3.5rem;
            line-height: 0.9;
            color: var(--win-text);
            text-transform: uppercase;
            /* Retro Text Shadow */
            text-shadow: 4px 4px 0px rgba(0,0,0,0.15), 
                         2px 2px 0px #fff;
            letter-spacing: -1px;
            transform: skewX(-5deg);
        }

        /* Instructions Box */
        .instructions-box {
            width: 100%;
            background: #e0e0e0;
            border-top: 2px solid var(--win-dark);
            border-left: 2px solid var(--win-dark);
            border-right: 2px solid var(--win-light);
            border-bottom: 2px solid var(--win-light);
            padding: 12px;
            box-shadow: inset 1px 1px 0 #000;
            text-align: center;
        }

        .instruction-text {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .key-display {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .key {
            width: 32px;
            height: 32px;
            background: #ddd;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #555;
            border-bottom: 2px solid #555;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 1px 1px 0 #000;
        }

        .sub-text {
            margin-top: 8px;
            font-size: 11px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Action Button */
        .action-btn {
            background: var(--win-gray);
            color: black;
            font-family: "Courier New", monospace;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
            padding: 10px 30px;
            width: 100%;
            cursor: pointer;
            outline: none;
            border-top: 2px solid var(--win-light);
            border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-darker);
            border-bottom: 2px solid var(--win-darker);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            transition: all 0.1s;
            position: relative;
        }

        .action-btn:hover {
            background: #d0d0d0;
        }

        .action-btn:active {
            border-top: 2px solid var(--win-darker);
            border-left: 2px solid var(--win-darker);
            border-right: 2px solid var(--win-light);
            border-bottom: 2px solid var(--win-light);
            transform: translate(2px, 2px);
            box-shadow: none;
            padding-top: 12px;
            padding-left: 32px;
        }

        .cursor-blink {
            animation: blink 1s step-end infinite;
        }

        /* --- CRT Effects --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
            opacity: 0.6;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 998;
        }

        /* Animations */
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes bootUp {
            0% { transform: scale(0.9) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

    </style>
</head>
<body>

    <div id="app">
        <!-- Background Layer -->
        <div id="game-world">
            <canvas id="worldCanvas"></canvas>
        </div>

        <!-- UI Layer -->
        <div id="ui-layer">
            <div class="window">
                <div class="title-bar">
                    <div class="title-text">
                        <span>❄️</span> SKIFREE.EXE
                    </div>
                    <div class="window-controls">
                        <div class="control-btn">_</div>
                        <div class="control-btn">×</div>
                    </div>
                </div>
                
                <div class="window-body">
                    <h1>SkiFree</h1>
                    
                    <div class="instructions-box">
                        <div class="instruction-text">USE ARROWS TO STEER</div>
                        <div class="key-display">
                            <div class="key">←</div>
                            <div class="key">→</div>
                        </div>
                        <div class="sub-text">Avoid Trees. Survive the Yeti.</div>
                    </div>

                    <button class="action-btn" id="startBtn">
                        START GAME <span class="cursor-blink">_</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Effects -->
        <div class="scanlines"></div>
        <div class="vignette"></div>
    </div>

<script>
    /**
     * VISUAL ENGINE
     * Procedural Pixel Art Rendering
     */
    const canvas = document.getElementById('worldCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // Internal Resolution (Low res for pixel look)
    const GAME_WIDTH = 320;
    const GAME_HEIGHT = 240;

    // Configuration
    const CONFIG = {
        colors: {
            skyTop: '#102040',     // Deep blue
            skyBot: '#6080A0',     // Light blue
            snow: '#E0E8F0',       // Snow white
            snowShade: '#B0B8C0',  // Shadow snow
            treeDark: '#0A2015',   // Dark pine
            treeLight: '#153020',  // Light pine
            treeSnow: '#FFFFFF',   // Snow on tree
            trunk: '#402010',      // Brown
            skierJacket: '#D32F2F', // Red
            skierPants: '#00008B',  // Blue
            skierSkin: '#FFCCB6',  // Peach
            skierGoggles: '#111',
            skierScarf: '#FFFF00'  // Yellow
        },
        speed: 2.5,
        treeDensity: 0.05
    };

    let width, height;
    let frame = 0;
    let trees = [];
    let snowParticles = [];
    let mountains = [];

    // --- Setup ---

    function resize() {
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        width = GAME_WIDTH;
        height = GAME_HEIGHT;
        initWorld();
    }

    function initWorld() {
        trees = [];
        snowParticles = [];
        mountains = [];

        // Generate Mountains (Background layer)
        for(let i=0; i<5; i++) {
            mountains.push({
                x: (width / 5) * i + (Math.random() * 30 - 15),
                h: 30 + Math.random() * 20,
                w: 50 + Math.random() * 30,
                c: Math.random() > 0.5 ? '#406080' : '#305070'
            });
        }

        // Pre-fill trees
        for(let i=0; i<20; i++) {
            spawnTree(true);
        }

        // Pre-fill snow
        for(let i=0; i<80; i++) {
            snowParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                s: Math.random() * 2 + 1,
                speed: Math.random() * 1.5 + 0.5
            });
        }
    }

    function spawnTree(randomY = false) {
        trees.push({
            x: Math.random() * width,
            y: randomY ? Math.random() * height : -30,
            scale: 0.6 + Math.random() * 0.8, // Parallax depth
            type: Math.random() > 0.5 ? 1 : 0 // Variation
        });
    }

    // --- Drawing Primitives ---

    // Helper to draw crisp rectangles
    function drawRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
    }

    // Draw a pixelated pine tree
    function drawPixelTree(x, y, scale) {
        const p = Math.max(1, Math.floor(4 * scale)); // Pixel unit
        const h = 16 * scale; // Height
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(x, y, 6*p, 2*p, 0, 0, Math.PI*2);
        ctx.fill();

        // Trunk
        drawRect(x - p, y - 4*p, 2*p, 4*p, CONFIG.colors.trunk);

        // Leaves (Staggered blocks for pixel look)
        drawRect(x - 6*p, y - 8*p, 12*p, 4*p, CONFIG.colors.treeDark); // Bottom
        drawRect(x - 4*p, y - 12*p, 8*p, 4*p, CONFIG.colors.treeLight); // Mid
        drawRect(x - 2*p, y - 16*p, 4*p, 4*p, CONFIG.colors.treeDark); // Top

        // Snow Accents (White blocks on top of green)
        drawRect(x - 3*p, y - 12*p, 2*p, p, CONFIG.colors.treeSnow);
        drawRect(x + 2*p, y - 8*p, 2*p, p, CONFIG.colors.treeSnow);
        drawRect(x - 1*p, y - 16*p, 2*p, p, CONFIG.colors.treeSnow);
    }

    // Draw the Skier
    function drawPixelSkier(x, y) {
        const p = 2; // Skier pixel unit
        const bob = Math.sin(frame * 0.2) * 2; // Animation bob
        
        ctx.save();
        ctx.translate(x, y + bob);

        // Skis (Gold)
        drawRect(-6*p, 10*p, 2*p, 12*p, '#D4AF37'); 
        drawRect(4*p, 10*p, 2*p, 12*p, '#D4AF37');

        // Legs (Blue)
        drawRect(-5*p, 8*p, 2*p, 4*p, CONFIG.colors.skierPants);
        drawRect(3*p, 8*p, 2*p, 4*p, CONFIG.colors.skierPants);

        // Body (Red)
        drawRect(-3*p, 2*p, 6*p, 6*p, CONFIG.colors.skierJacket);
        // Zipper
        drawRect(-1*p, 2*p, 2*p, 6*p, '#8B0000');

        // Head (Skin)
        drawRect(-2*p, -2*p, 4*p, 4*p, CONFIG.colors.skierSkin);
        // Goggles
        drawRect(-2*p, 0, 4*p, 2*p, CONFIG.colors.skierGoggles);

        // Scarf (Yellow) - Waving
        const wave = Math.sin(frame * 0.4) * 2;
        drawRect(2*p, -1*p, 4*p + wave, 2*p, CONFIG.colors.skierScarf);

        // Poles
        drawRect(-7*p, 0, p, 14*p, '#888');
        drawRect(6*p, 0, p, 14*p, '#888');

        ctx.restore();
    }

    // --- Main Loop ---

    function drawBackground() {
        // Sky Gradient
        const grad = ctx.createLinearGradient(0, 0, 0, height * 0.6);
        grad.addColorStop(0, CONFIG.colors.skyTop);
        grad.addColorStop(1, CONFIG.colors.skyBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Ground (Snow)
        ctx.fillStyle = CONFIG.colors.snow;
        ctx.fillRect(0, height * 0.6, width, height * 0.4);

        // Horizon Line
        drawRect(0, height * 0.6, width, 1, '#A0B0C0');

        // Mountains
        mountains.forEach(m => {
            ctx.fillStyle = m.c;
            ctx.beginPath();
            ctx.moveTo(m.x - m.w/2, height * 0.6);
            ctx.lineTo(m.x, height * 0.6 - m.h);
            ctx.lineTo(m.x + m.w/2, height * 0.6);
            ctx.fill();
            
            // Snow cap
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.moveTo(m.x - m.w/6, height * 0.6 - m.h * 0.7);
            ctx.lineTo(m.x, height * 0.6 - m.h);
            ctx.lineTo(m.x + m.w/6, height * 0.6 - m.h * 0.7);
            ctx.fill();
        });
    }

    function animate() {
        // Clear
        ctx.clearRect(0, 0, width, height);

        drawBackground();

        // Spawn Trees
        if (Math.random() < CONFIG.treeDensity) spawnTree();

        // Update & Draw Trees
        // Sort by Y so lower trees draw on top of higher trees (Depth)
        trees.sort((a, b) => a.y - b.y);

        for (let i = trees.length - 1; i >= 0; i--) {
            let t = trees[i];
            // Parallax speed based on scale (closer = faster)
            t.y += CONFIG.speed * (t.scale * 0.8);
            
            if (t.y > height + 20) {
                trees.splice(i, 1);
            } else {
                drawPixelTree(t.x, t.y, t.scale);
            }
        }

        // Draw Skier (Center)
        // The skier stays at a fixed Y, world moves around
        drawPixelSkier(width / 2, height * 0.8);

        // Draw Snow Particles
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        snowParticles.forEach(p => {
            p.y += p.speed + CONFIG.speed * 0.5;
            p.x += Math.sin(frame * 0.01 + p.x) * 0.2; // Wind drift
            
            if (p.y > height) {
                p.y = -5;
                p.x = Math.random() * width;
            }
            
            ctx.fillRect(Math.floor(p.x), Math.floor(p.y), Math.floor(p.s), Math.floor(p.s));
        });

        frame++;
        requestAnimationFrame(animate);
    }

    // --- Interaction ---

    window.addEventListener('resize', resize);

    const startBtn = document.getElementById('startBtn');
    startBtn.addEventListener('click', () => {
        startBtn.innerHTML = "LOADING...";
        startBtn.style.background = "#fff";
        
        setTimeout(() => {
            // Visual flash effect
            const flash = document.createElement('div');
            flash.style.position = 'fixed';
            flash.style.top = '0';
            flash.style.left = '0';
            flash.style.width = '100%';
            flash.style.height = '100%';
            flash.style.background = '#fff';
            flash.style.zIndex = '1000';
            document.body.appendChild(flash);
            
            setTimeout(() => {
                flash.style.transition = 'opacity 0.5s';
                flash.style.opacity = '0';
                setTimeout(() => flash.remove(), 500);
                
                // Reset Button
                startBtn.innerHTML = "START GAME <span class='cursor-blink'>_</span>";
                startBtn.style.background = "";
                alert("GAME STARTED!\n(This is a visual demo)");
            }, 100);
        }, 800);
    });

    // Start
    resize();
    animate();

</script>
</body>
</html>
