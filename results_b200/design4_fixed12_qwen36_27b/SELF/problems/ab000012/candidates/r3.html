<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette */
        --bg-deep: #05070a;
        --bg-panel: rgba(15, 23, 42, 0.6);
        --bg-panel-hover: rgba(20, 35, 60, 0.8);
        
        --gold-primary: #c5a059;
        --gold-bright: #e8d5a3;
        --gold-dark: #7a5c28;
        --gold-gradient: linear-gradient(135deg, #e8d5a3 0%, #c5a059 50%, #7a5c28 100%);
        
        --cyan-primary: #5eead4;
        --cyan-dim: #115e59;
        --cyan-glow: rgba(94, 234, 212, 0.5);
        
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        
        /* Typography */
        --font-heading: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
        --font-body: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'Courier New', monospace;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* --- Background Layers --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
        pointer-events: none;
        background: 
            radial-gradient(circle at center, transparent 0%, rgba(5, 7, 10, 0.6) 50%, rgba(5, 7, 10, 0.95) 100%),
            linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.8));
    }
    
    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.07;
        z-index: 2;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1200px;
        height: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        padding: 1.5rem 2rem;
    }

    /* --- Header --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
    }

    .currency-pill {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(197, 160, 89, 0.3);
        border-radius: 2px;
        padding: 0.4rem 1.2rem;
        display: flex;
        align-items: center;
        gap: 12px;
        backdrop-filter: blur(8px);
        position: relative;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }
    
    .currency-pill::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(232, 213, 163, 0.1), transparent);
        pointer-events: none;
    }

    .coin-icon {
        width: 20px;
        height: 20px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 2px rgba(197, 160, 89, 0.6));
    }

    .currency-amount {
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-bright);
        letter-spacing: 0.05em;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        padding-bottom: 1rem;
        perspective: 1000px;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 5rem;
        text-transform: uppercase;
        letter-spacing: 0.4em;
        margin-bottom: 0.2rem;
        background: var(--gold-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
        position: relative;
        z-index: 2;
        text-indent: 0.4em; /* Compensate for letter spacing in centering */
        line-height: 1;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.85rem;
        color: var(--cyan-primary);
        letter-spacing: 0.6em;
        text-transform: uppercase;
        margin-bottom: 3rem;
        opacity: 0.9;
        text-shadow: 0 0 10px var(--cyan-glow);
        text-indent: 0.6em;
    }

    /* --- The Orb --- */
    .orb-container {
        position: relative;
        width: 300px;
        height: 300px;
        margin-bottom: 2rem;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .orb-svg {
        width: 100%;
        height: 100%;
        animation: float 6s ease-in-out infinite;
        filter: drop-shadow(0 0 30px rgba(94, 234, 212, 0.2));
    }

    /* --- Menu Grid --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 960px;
        margin: 0 auto 1rem auto;
        padding: 0 1rem;
    }

    .menu-card {
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.5), rgba(15, 23, 42, 0.9));
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
    }

    .menu-card:hover {
        transform: translateY(-5px);
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.95));
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        border-color: rgba(255, 255, 255, 0.2);
    }
    
    /* Subtle shine on hover */
    .menu-card::before {
        content: '';
        position: absolute;
        top: 0; left: -100%; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
        transform: skewX(-20deg);
        transition: 0.5s;
    }
    .menu-card:hover::before {
        left: 100%;
    }

    .card-icon {
        width: 36px;
        height: 36px;
        fill: var(--text-muted);
        transition: all 0.3s ease;
    }

    .menu-card:hover .card-icon {
        fill: var(--text-main);
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
        transform: scale(1.1);
    }

    .card-label {
        font-family: var(--font-heading);
        font-size: 1.2rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
        font-weight: 600;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Special Summon Card */
    .menu-card.summon {
        background: linear-gradient(180deg, rgba(40, 30, 10, 0.6), rgba(20, 15, 5, 0.9));
        border: 1px solid rgba(197, 160, 89, 0.4);
        box-shadow: 0 0 15px rgba(197, 160, 89, 0.05);
    }
    
    .menu-card.summon:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 0 25px rgba(197, 160, 89, 0.15);
        background: linear-gradient(180deg, rgba(60, 45, 15, 0.7), rgba(20, 15, 5, 0.95));
    }
    
    .menu-card.summon .card-label {
        color: var(--gold-bright);
    }
    
    .menu-card.summon .card-icon {
        fill: var(--gold-primary);
    }
    
    .menu-card.summon:hover .card-icon {
        fill: #fff;
        filter: drop-shadow(0 0 10px var(--gold-primary));
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.75rem;
        opacity: 0.5;
        margin-top: auto;
        letter-spacing: 0.15em;
        font-family: var(--font-mono);
        padding-bottom: 0.5rem;
    }

    /* --- Animations --- */
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
    }

    /* --- Responsive --- */
    @media (max-width: 850px) {
        .game-title { font-size: 3.5rem; letter-spacing: 0.2em; }
        .menu-grid { grid-template-columns: repeat(2, 1fr); }
        .orb-container { width: 220px; height: 220px; }
    }
    @media (max-width: 480px) {
        .game-title { font-size: 2.5rem; }
        .game-subtitle { font-size: 0.7rem; letter-spacing: 0.3em; }
        .app-container { padding: 1rem; }
        header { justify-content: center; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>
    <div class="grain"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div style="width: 120px;"></div> <!-- Spacer for balance -->
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <div class="orb-container">
                <svg class="orb-svg" viewBox="0 0 200 200">
                    <defs>
                        <!-- Gradients -->
                        <radialGradient id="orbCore" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
                            <stop offset="15%" stop-color="#5eead4" stop-opacity="0.9"/>
                            <stop offset="50%" stop-color="#0f766e" stop-opacity="0.3"/>
                            <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
                        </radialGradient>
                        
                        <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#5eead4" stop-opacity="0.4"/>
                            <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
                        </radialGradient>

                        <!-- Filters -->
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="5" result="blur"/>
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    
                    <!-- Outer Ring (Slow, Solid) -->
                    <circle cx="100" cy="100" r="92" stroke="rgba(94, 234, 212, 0.1)" stroke-width="1" fill="none">
                        <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="60s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Middle Ring (Dashed, Reverse) -->
                    <circle cx="100" cy="100" r="82" stroke="rgba(94, 234, 212, 0.25)" stroke-width="1.5" fill="none" stroke-dasharray="20 10 5 10">
                        <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="40s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Inner Ring (Fast, Segmented) -->
                    <circle cx="100" cy="100" r="70" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" fill="none" stroke-dasharray="2 12">
                        <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite" />
                    </circle>

                    <!-- Ambient Glow -->
                    <circle cx="100" cy="100" r="60" fill="url(#orbGlow)">
                        <animate attributeName="r" values="58;62;58" dur="4s" repeatCount="indefinite" />
                    </circle>

                    <!-- The Core -->
                    <circle cx="100" cy="100" r="45" fill="url(#orbCore)" filter="url(#glow)">
                        <animate attributeName="r" values="43;47;43" dur="3s" repeatCount="indefinite" />
                        <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Crosshairs -->
                    <path d="M100 5 L100 195 M5 100 L195 100" stroke="rgba(94, 234, 212, 0.05)" stroke-width="1" />
                </svg>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z" fill="currentColor"/>
                </svg>
                <span class="card-label">Summon</span>
            </div>

            <!-- Roster -->
            <div class="menu-card" onclick="interact('Roster')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill="currentColor"/>
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card" onclick="interact('Battle')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z" fill="currentColor"/>
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card" onclick="interact('Grind')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.35 0-.64.22-.69.52l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.05.29.34.51.69.51h4c.35 0 .64-.22.69-.52l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z" fill="currentColor"/>
                </svg>
                <span class="card-label">Grind</span>
            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 • Offline Mode
        </footer>
    </div>

<script>
    // --- Background Particle System ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.vx = (Math.random() - 0.5) * 0.15;
            this.vy = -(Math.random() * 0.3 + 0.05);
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.4;
            // 10% Gold, 90% Cyan
            this.color = Math.random() > 0.9 ? '197, 160, 89' : '94, 234, 212'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.0003;

            if (this.alpha <= 0 || this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 18000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        ctx.lineWidth = 0.5;
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
            
            // Connect particles
            if (particles[i].color.includes('94')) { // Only connect cyan
                for (let j = i + 1; j < particles.length; j++) {
                    if (particles[j].color.includes('94')) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(94, 234, 212, ${0.05 - dist/2400})`;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
            }
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
