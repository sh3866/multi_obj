<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #030305;
        --bg-panel: rgba(20, 25, 35, 0.4);
        --bg-panel-hover: rgba(30, 40, 60, 0.6);
        --gold-primary: #c5a059;
        --gold-highlight: #f3e5ab;
        --gold-shadow: #7a6020;
        --accent-cyan: #88e0d6;
        --accent-cyan-dim: #3a7a74;
        --text-main: #f0f4f8;
        --text-muted: #8b9bb4;
        --font-heading: 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* Subtle noise texture overlay using CSS gradients */
        background-image: 
            radial-gradient(circle at 50% 30%, rgba(20, 30, 50, 0.4) 0%, transparent 60%),
            radial-gradient(circle at 50% 100%, rgba(10, 15, 25, 0.8) 0%, transparent 50%);
    }

    /* --- Background Atmosphere --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: 0.5;
        pointer-events: none;
    }

    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, transparent 40%, var(--bg-deep) 100%);
        z-index: 1;
        pointer-events: none;
    }

    /* --- Main Container --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 1.5rem 2rem;
    }

    /* --- Header --- */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 1rem;
        padding: 0 1rem;
    }

    .currency-pill {
        background: rgba(10, 10, 15, 0.7);
        border: 1px solid var(--gold-shadow);
        border-radius: 4px;
        padding: 0.6rem 1.8rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
        backdrop-filter: blur(8px);
        position: relative;
        overflow: hidden;
    }
    
    /* Gold trim on pill */
    .currency-pill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold-highlight), transparent);
    }

    .coin-icon {
        width: 26px;
        height: 26px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 2px var(--gold-shadow));
    }

    .currency-amount {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.3rem;
        color: var(--gold-highlight);
        letter-spacing: 0.5px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        padding-bottom: 2rem;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 3.8rem;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        margin-bottom: 0.2rem;
        background: linear-gradient(to bottom, var(--gold-highlight) 30%, var(--gold-primary) 80%, var(--gold-shadow) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(197, 160, 89, 0.25));
        position: relative;
        z-index: 2;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.9rem;
        color: var(--accent-cyan);
        letter-spacing: 0.6em;
        text-transform: uppercase;
        margin-bottom: 3.5rem;
        opacity: 0.9;
        text-shadow: 0 0 10px rgba(136, 224, 214, 0.3);
    }

    /* The Summoning Orb */
    .orb-container {
        position: relative;
        width: 200px;
        height: 200px;
        margin-bottom: 1rem;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
    }

    .orb-svg {
        width: 100%;
        height: 100%;
        animation: float 6s ease-in-out infinite;
        transform-style: preserve-3d;
    }

    /* --- Menu Grid --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        padding: 0 1rem;
    }

    .menu-card {
        background: var(--bg-panel);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 1.5rem 0.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
    }

    /* Inner glow for cards */
    .menu-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.05) 0%, transparent 60%);
        opacity: 0;
        transition: opacity 0.3s;
    }

    .menu-card:hover {
        transform: translateY(-6px);
        background: var(--bg-panel-hover);
        box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        border-color: rgba(255, 255, 255, 0.15);
    }

    .menu-card:hover::before {
        opacity: 1;
    }

    .menu-card:active {
        transform: translateY(-2px);
    }

    .card-icon {
        width: 44px;
        height: 44px;
        fill: var(--text-muted);
        transition: fill 0.3s, filter 0.3s, transform 0.3s;
    }

    .menu-card:hover .card-icon {
        fill: var(--text-main);
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
        transform: scale(1.1);
    }

    .card-label {
        font-family: var(--font-heading);
        font-size: 1.1rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
        font-weight: 600;
        z-index: 1;
    }

    /* Special styling for Summon Button */
    .menu-card.summon {
        background: linear-gradient(180deg, rgba(40, 40, 50, 0.8), rgba(20, 20, 28, 0.95));
        border: 1px solid var(--gold-shadow);
        box-shadow: 0 0 20px rgba(197, 160, 89, 0.1);
    }
    
    .menu-card.summon:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 0 30px rgba(197, 160, 89, 0.2);
    }
    
    .menu-card.summon .card-label {
        color: var(--gold-primary);
    }
    
    .menu-card.summon:hover .card-icon {
        fill: var(--gold-highlight);
        filter: drop-shadow(0 0 10px var(--gold-shadow));
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.85rem;
        opacity: 0.5;
        margin-top: 2rem;
        font-weight: 300;
        letter-spacing: 0.05em;
    }

    /* --- Animations --- */
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
    }

    @keyframes pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.05); }
    }

    @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 2.5rem; }
        .menu-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
        .app-container { padding: 1rem; }
        .orb-container { width: 140px; height: 140px; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1"/>
                    <path d="M12 8v8M9 12h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <div class="orb-container">
                <!-- Procedural Orb SVG -->
                <svg class="orb-svg" viewBox="0 0 100 100">
                    <defs>
                        <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="0%" style="stop-color:#88e0d6;stop-opacity:0.9" />
                            <stop offset="60%" style="stop-color:#3a7a74;stop-opacity:0.5" />
                            <stop offset="100%" style="stop-color:#030305;stop-opacity:0" />
                        </radialGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    
                    <!-- Outer Ring -->
                    <circle cx="50" cy="50" r="46" stroke="rgba(136, 224, 214, 0.1)" stroke-width="0.5" fill="none">
                        <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="30s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Inner Ring -->
                    <circle cx="50" cy="50" r="40" stroke="rgba(136, 224, 214, 0.2)" stroke-width="0.5" fill="none" stroke-dasharray="4 4">
                        <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="20s" repeatCount="indefinite" />
                    </circle>

                    <!-- The Core -->
                    <circle cx="50" cy="50" r="32" fill="url(#orbGrad)" filter="url(#glow)">
                        <animate attributeName="r" values="31;33;31" dur="4s" repeatCount="indefinite" />
                        <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Crosshairs -->
                    <path d="M50 10 L50 90 M10 50 L90 50" stroke="rgba(136, 224, 214, 0.15)" stroke-width="0.5" />
                </svg>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                </svg>
                <span class="card-label">Summon</span>
            </div>

            <!-- Roster -->
            <div class="menu-card" onclick="interact('Roster')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card" onclick="interact('Battle')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card" onclick="interact('Grind')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.35 0-.64.22-.7.55l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.06.33.35.55.7.55h4c.35 0 .64-.22.7-.55l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                </svg>
                <span class="card-label">Grind</span>
            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline Mode
        </footer>
    </div>

<script>
    // --- Background Particle System ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.vx = (Math.random() - 0.5) * 0.3;
            this.vy = -(Math.random() * 0.8 + 0.2); // Move upwards slowly
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.4;
            this.life = Math.random() * 0.5 + 0.5;
            // Mix of gold and cyan particles
            this.color = Math.random() > 0.7 ? '197, 160, 89' : '136, 224, 214'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.001;

            if (this.alpha <= 0 || this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 12000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        // Draw subtle connecting lines
        ctx.lineWidth = 0.5;
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
            
            // Connect close particles (only cyan ones for magic feel)
            if (particles[i].color.includes('136')) {
                for (let j = i + 1; j < particles.length; j++) {
                    if (particles[j].color.includes('136')) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < 80) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(136, 224, 214, ${0.05 - dist/1600})`;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
            }
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
