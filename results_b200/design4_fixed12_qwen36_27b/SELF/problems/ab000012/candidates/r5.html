<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #020408;
        --bg-panel: rgba(8, 12, 24, 0.7);
        --bg-panel-hover: rgba(15, 20, 40, 0.9);
        
        --gold-primary: #eebb66;
        --gold-bright: #ffdeb8;
        --gold-dark: #8a5a19;
        --gold-gradient: linear-gradient(180deg, #eebb66 0%, #d49a46 100%);
        --gold-text-gradient: linear-gradient(180deg, #ffffff 0%, #eebb66 50%, #aa7733 100%);
        
        --cyan-primary: #5eead4;
        --cyan-dim: #0d4f4a;
        --cyan-glow: rgba(94, 234, 212, 0.4);
        
        --text-main: #e2e8f0;
        --text-muted: #64748b;
        
        --font-heading: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
        --font-body: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'Courier New', monospace;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* --- Background Layers --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
        pointer-events: none;
        background: 
            radial-gradient(circle at center, transparent 0%, rgba(2, 4, 8, 0.7) 60%, rgba(2, 4, 8, 1) 100%),
            linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0.9));
    }
    
    .grain {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.06;
        z-index: 2;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1200px;
        height: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        padding: 2rem 2rem 1rem 2rem;
    }

    /* --- Header --- */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 1rem;
    }

    .currency-pill {
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(238, 187, 102, 0.3);
        border-right: 1px solid rgba(238, 187, 102, 0.6);
        border-left: 1px solid rgba(238, 187, 102, 0.6);
        padding: 0.5rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 14px;
        backdrop-filter: blur(8px);
        position: relative;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    }
    
    .currency-pill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(238, 187, 102, 0.1), transparent);
        pointer-events: none;
    }

    .coin-icon {
        width: 22px;
        height: 22px;
        fill: url(#coinGrad);
        filter: drop-shadow(0 0 4px rgba(238, 187, 102, 0.5));
    }

    .currency-amount {
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 1.15rem;
        color: var(--gold-bright);
        letter-spacing: 0.05em;
        text-shadow: 0 2px 4px rgba(0,0,0,1);
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        padding-bottom: 1.5rem;
        perspective: 1200px;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 5.5rem;
        text-transform: uppercase;
        letter-spacing: 0.5em;
        margin-bottom: 0.2rem;
        background: var(--gold-text-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 1px rgba(0,0,0,0.8)) drop-shadow(0 6px 12px rgba(0,0,0,0.6));
        position: relative;
        z-index: 2;
        text-indent: 0.5em;
        line-height: 1;
        font-weight: 400;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.8rem;
        color: var(--cyan-primary);
        letter-spacing: 0.8em;
        text-transform: uppercase;
        margin-bottom: 2.5rem;
        opacity: 0.85;
        text-shadow: 0 0 12px var(--cyan-glow);
        text-indent: 0.8em;
        font-weight: 600;
    }

    /* --- The Orb --- */
    .orb-container {
        position: relative;
        width: 320px;
        height: 320px;
        margin-bottom: 2rem;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .orb-svg {
        width: 100%;
        height: 100%;
        animation: float 6s ease-in-out infinite;
        filter: drop-shadow(0 0 40px rgba(94, 234, 212, 0.15));
    }

    /* --- Menu Grid --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 1000px;
        margin: 0 auto 1.5rem auto;
        padding: 0 0.5rem;
    }

    .menu-card {
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.6), rgba(8, 15, 30, 0.9));
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(12px);
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .menu-card:hover {
        transform: translateY(-6px);
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.95));
        box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        border-color: rgba(255, 255, 255, 0.2);
    }
    
    /* Shine sweep */
    .menu-card::before {
        content: '';
        position: absolute;
        top: 0; left: -150%; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
        transform: skewX(-20deg);
        transition: 0.6s;
    }
    .menu-card:hover::before {
        left: 150%;
    }

    .card-icon {
        width: 32px;
        height: 32px;
        fill: var(--text-muted);
        transition: all 0.3s ease;
    }

    .menu-card:hover .card-icon {
        fill: var(--text-main);
        filter: drop-shadow(0 0 6px rgba(255,255,255,0.4));
        transform: scale(1.1);
    }

    .card-label {
        font-family: var(--font-heading);
        font-size: 1.1rem;
        color: var(--text-main);
        letter-spacing: 0.08em;
        font-weight: 600;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Special Summon Card */
    .menu-card.summon {
        background: linear-gradient(180deg, rgba(60, 40, 10, 0.6), rgba(30, 20, 5, 0.9));
        border: 1px solid rgba(238, 187, 102, 0.3);
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    
    .menu-card.summon:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 0 25px rgba(238, 187, 102, 0.15), 0 15px 30px rgba(0,0,0,0.6);
        background: linear-gradient(180deg, rgba(80, 60, 20, 0.7), rgba(30, 20, 5, 0.95));
    }
    
    .menu-card.summon .card-label {
        color: var(--gold-bright);
    }
    
    .menu-card.summon .card-icon {
        fill: var(--gold-primary);
    }
    
    .menu-card.summon:hover .card-icon {
        fill: #fff;
        filter: drop-shadow(0 0 10px var(--gold-primary));
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.7rem;
        opacity: 0.6;
        margin-top: auto;
        letter-spacing: 0.2em;
        font-family: var(--font-mono);
        padding-bottom: 0.5rem;
        text-transform: uppercase;
    }

    /* --- Animations --- */
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
    }

    /* --- Responsive --- */
    @media (max-width: 850px) {
        .game-title { font-size: 3.5rem; letter-spacing: 0.2em; }
        .menu-grid { grid-template-columns: repeat(2, 1fr); }
        .orb-container { width: 240px; height: 240px; }
        .app-container { padding: 1rem; }
    }
    @media (max-width: 480px) {
        .game-title { font-size: 2.2rem; }
        .game-subtitle { font-size: 0.65rem; letter-spacing: 0.4em; text-indent: 0.4em; }
        header { justify-content: center; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>
    <div class="grain"></div>

    <!-- SVG Defs for Gradients/Icons -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fff" />
                <stop offset="40%" stop-color="#eebb66" />
                <stop offset="100%" stop-color="#8a5a19" />
            </linearGradient>
        </defs>
    </svg>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <!-- Gold Coin Icon -->
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <div class="orb-container">
                <svg class="orb-svg" viewBox="0 0 200 200">
                    <defs>
                        <!-- Core Gradient: Bright center to deep teal -->
                        <radialGradient id="orbCore" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
                            <stop offset="10%" stop-color="#ccfbf1" stop-opacity="0.9"/>
                            <stop offset="40%" stop-color="#5eead4" stop-opacity="0.6"/>
                            <stop offset="80%" stop-color="#0f766e" stop-opacity="0.2"/>
                            <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
                        </radialGradient>
                        
                        <!-- Outer Glow -->
                        <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#5eead4" stop-opacity="0.5"/>
                            <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
                        </radialGradient>

                        <!-- Filters -->
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="8" result="blur"/>
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    
                    <!-- Outer Ring (Slow, Solid) -->
                    <circle cx="100" cy="100" r="95" stroke="rgba(94, 234, 212, 0.05)" stroke-width="1" fill="none">
                        <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="80s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Middle Ring (Dashed, Reverse) -->
                    <circle cx="100" cy="100" r="85" stroke="rgba(94, 234, 212, 0.3)" stroke-width="1" fill="none" stroke-dasharray="40 10 5 10">
                        <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="45s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Inner Ring (Fast, Segmented) -->
                    <circle cx="100" cy="100" r="72" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" fill="none" stroke-dasharray="1 15">
                        <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="25s" repeatCount="indefinite" />
                    </circle>

                    <!-- Ambient Glow -->
                    <circle cx="100" cy="100" r="65" fill="url(#orbGlow)">
                        <animate attributeName="r" values="60;68;60" dur="4s" repeatCount="indefinite" />
                        <animate attributeName="opacity" values="0.6;0.9;0.6" dur="4s" repeatCount="indefinite" />
                    </circle>

                    <!-- The Core -->
                    <circle cx="100" cy="100" r="48" fill="url(#orbCore)" filter="url(#glow)">
                        <animate attributeName="r" values="45;50;45" dur="3s" repeatCount="indefinite" />
                        <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Crosshairs (Subtle) -->
                    <path d="M100 2 L100 198 M2 100 L198 100" stroke="rgba(94, 234, 212, 0.08)" stroke-width="1" />
                </svg>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Star Icon -->
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="currentColor"/>
                </svg>
                <span class="card-label">Summon</span>
            </div>

            <!-- Roster -->
            <div class="menu-card" onclick="interact('Roster')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Users Icon -->
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill="currentColor"/>
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card" onclick="interact('Battle')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Lightning Icon -->
                    <path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z" fill="currentColor"/>
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card" onclick="interact('Grind')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Settings/Gear Icon -->
                    <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.35 0-.64.22-.69.52l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.05.29.34.51.69.51h4c.35 0 .64-.22.69-.52l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z" fill="currentColor"/>
                </svg>
                <span class="card-label">Grind</span>
            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 • Offline Mode
        </footer>
    </div>

<script>
    // --- Background Particle System ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.vx = (Math.random() - 0.5) * 0.1;
            this.vy = -(Math.random() * 0.2 + 0.02);
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.5;
            // 15% Gold, 85% Cyan
            this.color = Math.random() > 0.85 ? '238, 187, 102' : '94, 234, 212'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.0005;

            if (this.alpha <= 0 || this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 20000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        ctx.lineWidth = 0.5;
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
            
            // Connect particles (only cyan ones for visual clarity)
            if (particles[i].color.includes('94')) {
                for (let j = i + 1; j < particles.length; j++) {
                    if (particles[j].color.includes('94')) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < 100) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(94, 234, 212, ${0.03 - dist/3000})`;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
            }
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
