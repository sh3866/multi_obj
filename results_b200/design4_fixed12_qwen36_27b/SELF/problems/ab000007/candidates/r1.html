<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina: Deep Dive</title>
<style>
  :root {
    --bg-deep: #020408;
    --bg-panel: rgba(12, 16, 24, 0.75);
    --accent-primary: #00f0ff;
    --accent-secondary: #7000ff;
    --accent-tertiary: #ccff00;
    --text-main: #ffffff;
    --text-muted: #8da2b5;
    
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Roboto Mono", "Consolas", monospace;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Atmosphere & Environment --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Animated Deep Water Gradient */
  .bg-gradient {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 120%, #0a1526 0%, #020408 60%, #000000 100%);
    z-index: 0;
    pointer-events: none;
  }

  /* Perspective Grid Floor */
  .grid-floor {
    position: absolute;
    bottom: -50%; left: -50%; width: 200%; height: 100%;
    background-image: 
      linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(400px) rotateX(60deg);
    z-index: 1;
    pointer-events: none;
    mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, transparent 80%);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, transparent 80%);
  }

  /* Floating Particles Background */
  .dust-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
    z-index: 1;
    opacity: 0.4;
    pointer-events: none;
  }

  /* --- Canvas --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
    cursor: none;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(1.5rem, 4vw, 3rem);
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(2rem, 5vw, 3.5rem);
    margin: 0;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: white;
    text-shadow: 0 0 20px rgba(255,255,255,0.2);
  }

  .subtitle {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--accent-primary);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    opacity: 0.9;
    margin-top: 0.25rem;
  }

  /* HUD Panel */
  .hud-panel {
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-left: 3px solid var(--accent-primary);
    padding: 0.8rem 1.5rem;
    border-radius: 0 12px 12px 0;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transform: skewX(-5deg);
  }

  .hud-content {
    transform: skewX(5deg); /* Counter skew text */
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2rem;
    line-height: 1;
    color: white;
    letter-spacing: 0.05em;
  }

  .stat-label {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  /* Footer */
  .footer {
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    padding-bottom: 1rem;
  }

  .btn-main {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: white;
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 1rem;
    padding: 1rem 3rem;
    border-radius: 100px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .btn-main:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: var(--accent-primary);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    transform: translateY(-2px);
  }

  .btn-main:active {
    transform: scale(0.98);
  }

  /* Toast Notification */
  .toast {
    position: absolute;
    top: 20%; left: 50%;
    transform: translate(-50%, 20px);
    background: rgba(0, 0, 0, 0.8);
    border: 1px solid var(--accent-tertiary);
    color: var(--accent-tertiary);
    padding: 0.8rem 2rem;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(204, 255, 0, 0.15);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* Scanline overlay for texture */
  .scanlines {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 100;
    opacity: 0.3;
  }

</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="bg-gradient"></div>
  <div class="grid-floor"></div>
  <div class="dust-layer"></div>
  <div class="scanlines"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Lumina</h1>
        <div class="subtitle">Deep Sea Collection</div>
      </div>
      <div class="hud-panel">
        <div class="hud-content">
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Specimens</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">
      <span style="font-size: 1.2em">●</span> Specimen Secured
    </div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">Reset Dive</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Optimized for visual fidelity and smooth 60fps.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let time = 0;

  // Configuration
  const COLORS = [
    { main: '#00f0ff', glow: 'rgba(0, 240, 255, 0.6)', name: 'Cyan' },   // Electric Blue
    { main: '#7000ff', glow: 'rgba(112, 0, 255, 0.6)', name: 'Violet' },  // Deep Violet
    { main: '#ccff00', glow: 'rgba(204, 255, 0, 0.6)', name: 'Lime' },    // Toxic Lime
    { main: '#ff0055', glow: 'rgba(255, 0, 85, 0.6)', name: 'Rose' }      // Neon Rose
  ];
  
  const CREATURE_COUNT = 7;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault(); 
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 4 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.95; // Friction
      this.vy *= 0.95;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset(true);
    }

    reset(initial = false) {
      // Spawn logic
      if (initial) {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
      } else {
        this.x = Math.random() < 0.5 ? -50 : width + 50;
        this.y = Math.random() * height;
      }
      
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.radius = Math.random() * 15 + 18;
      this.colorObj = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = 0;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.03 + 0.01;
      this.isCaught = false;
      
      // Eye position offset
      this.eyeOffset = { x: 0, y: 0 };
    }

    update() {
      if (this.isCaught) return;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.wobble += this.wobbleSpeed;
      
      // Sine wave drift
      this.x += Math.sin(this.wobble) * 0.3;

      // Bounce off walls gently
      if (this.x < -100) this.vx = Math.abs(this.vx);
      if (this.x > width + 100) this.vx = -Math.abs(this.vx);
      if (this.y < -100) this.vy = Math.abs(this.vy);
      if (this.y > height + 100) this.vy = -Math.abs(this.vy);

      // Avoid Mouse (Net) - "Spooked" behavior
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 180) {
        const force = (180 - dist) / 180;
        const angle = Math.atan2(dy, dx);
        this.vx += Math.cos(angle) * force * 0.8;
        this.vy += Math.sin(angle) * force * 0.8;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 4) {
        this.vx = (this.vx / speed) * 4;
        this.vy = (this.vy / speed) * 4;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Rotate slightly based on movement
      const moveAngle = Math.atan2(this.vy, this.vx);
      // Smooth rotation
      this.angle = this.angle * 0.9 + moveAngle * 0.1;
      ctx.rotate(this.angle + Math.PI/2);

      // Glow effect
      ctx.shadowBlur = 25;
      ctx.shadowColor = this.colorObj.glow;
      
      // Body (Organic shape)
      ctx.fillStyle = this.colorObj.main;
      ctx.beginPath();
      const r = this.radius;
      const wobbleAmt = Math.sin(this.wobble * 3) * 4;
      
      // Draw "Jellyfish" or "Blob" shape
      ctx.moveTo(r + wobbleAmt, 0);
      ctx.bezierCurveTo(r, r, 0, r + wobbleAmt, -r - wobbleAmt, 0);
      ctx.bezierCurveTo(-r, -r, 0, -r - wobbleAmt, r + wobbleAmt, 0);
      ctx.fill();

      // Inner translucent core
      ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.5, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, -r * 0.2, r * 0.2, 0, Math.PI * 2);
      ctx.fill();
      
      // Pupil (looks at mouse)
      const eyeDx = mouse.x - this.x;
      const eyeDy = mouse.y - this.y;
      const eyeAngle = Math.atan2(eyeDy, eyeDx);
      const pupilDist = r * 0.1;
      const px = Math.cos(eyeAngle + this.angle + Math.PI/2) * pupilDist;
      const py = Math.sin(eyeAngle + this.angle + Math.PI/2) * pupilDist;

      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(px, py - r*0.2, r * 0.08, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    // Collision detection
    const catchRadius = 70; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Explosion of particles
    for(let i=0; i<20; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.colorObj.main));
    }

    // Toast Notification
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1500);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 1500);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    // Draw the player's net/cursor
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Pulsing effect
    const pulse = Math.sin(time * 5) * 2;

    // Outer Ring
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(0, 240, 255, 0.5)';
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 60 + pulse, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner Crosshairs
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-15, 0); ctx.lineTo(-5, 0);
    ctx.moveTo(15, 0); ctx.lineTo(5, 0);
    ctx.moveTo(0, -15); ctx.lineTo(0, -5);
    ctx.moveTo(0, 15); ctx.lineTo(0, 5);
    ctx.stroke();

    // Center Dot
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath();
    ctx.arc(0, 0, 2, 0, Math.PI * 2);
    ctx.fill();

    // Capture Zone (Active)
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.arc(0, 0, 70, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();
  }

  function loop() {
    time += 0.01;
    
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
