<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Planet Defense</title>
<style>
    :root {
        --c-bg: #030406;
        --c-grid: #00e5ff;
        --c-primary: #00f3ff; /* Neon Cyan */
        --c-primary-dim: rgba(0, 243, 255, 0.15);
        --c-danger: #ff0055;
        --c-gold: #ffd700;
        --c-text: #e0f7fa;
        --c-text-dim: #8899a6;
        --font-display: 'Trebuchet MS', 'Segoe UI', sans-serif; /* Fallback for futuristic look */
        --font-tech: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--c-bg);
        color: var(--c-text);
        font-family: var(--font-display);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* --- BACKGROUND SYSTEMS --- */
    #canvas-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 0;
    }

    .overlay-gradient {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 30%, rgba(0, 243, 255, 0.08) 0%, transparent 60%),
                    linear-gradient(to bottom, rgba(0,0,0,0) 0%, var(--c-bg) 90%);
        z-index: 1;
        pointer-events: none;
    }

    .vignette {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: radial-gradient(circle, transparent 50%, #000 100%);
        z-index: 2;
        pointer-events: none;
    }

    /* --- UI LAYER --- */
    .ui-layer {
        position: relative;
        z-index: 10;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 0 20px;
    }

    /* --- HUD HEADER --- */
    .hud-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 30px 40px;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        border-bottom: 1px solid rgba(0, 243, 255, 0.2);
        position: relative;
    }

    .hud-top::after {
        content: '';
        position: absolute;
        bottom: -1px; left: 0;
        width: 150px; height: 1px;
        background: var(--c-primary);
        box-shadow: 0 0 10px var(--c-primary);
    }

    .hud-stat {
        display: flex;
        flex-direction: column;
    }

    .hud-label {
        font-family: var(--font-tech);
        font-size: 0.7rem;
        letter-spacing: 3px;
        color: var(--c-primary);
        margin-bottom: 5px;
        text-transform: uppercase;
        opacity: 0.8;
    }

    .hud-val {
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: 1px;
        text-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        font-family: var(--font-tech);
    }

    .hud-val.gold { color: var(--c-gold); text-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
    .hud-val.danger { color: var(--c-danger); text-shadow: 0 0 15px rgba(255, 0, 85, 0.4); }

    /* --- MAIN CONTENT --- */
    .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 25px;
        max-width: 900px;
        margin: 0 auto;
        width: 100%;
    }

    /* --- TITLE --- */
    .title-wrapper {
        text-align: center;
        margin-bottom: 10px;
        position: relative;
    }

    h1 {
        font-size: 4.5rem;
        line-height: 0.9;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: #fff;
        font-weight: 900;
        text-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
        position: relative;
        z-index: 2;
    }

    h1 span {
        color: var(--c-primary);
        text-shadow: 0 0 40px var(--c-primary);
    }

    /* Glitch Effect on Title */
    .glitch-text {
        position: relative;
    }
    .glitch-text::before, .glitch-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: var(--c-bg);
    }
    .glitch-text::before {
        left: 2px; text-shadow: -1px 0 var(--c-danger);
        clip: rect(24px, 550px, 90px, 0);
        animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
    }
    .glitch-text::after {
        left: -2px; text-shadow: -1px 0 var(--c-primary);
        clip: rect(85px, 550px, 140px, 0);
        animation: glitch-anim-2 3s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim-1 {
        0% { clip: rect(20px, 9999px, 10px, 0); }
        20% { clip: rect(60px, 9999px, 80px, 0); }
        40% { clip: rect(10px, 9999px, 50px, 0); }
        60% { clip: rect(90px, 9999px, 100px, 0); }
        80% { clip: rect(30px, 9999px, 10px, 0); }
        100% { clip: rect(50px, 9999px, 90px, 0); }
    }
    @keyframes glitch-anim-2 {
        0% { clip: rect(100px, 9999px, 140px, 0); }
        20% { clip: rect(10px, 9999px, 30px, 0); }
        40% { clip: rect(80px, 9999px, 20px, 0); }
        60% { clip: rect(30px, 9999px, 90px, 0); }
        80% { clip: rect(120px, 9999px, 10px, 0); }
        100% { clip: rect(40px, 9999px, 60px, 0); }
    }

    /* --- BRIEFING --- */
    .briefing {
        background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0, 243, 255, 0.05) 20%, rgba(0, 243, 255, 0.05) 80%, rgba(0,0,0,0) 100%);
        border-top: 1px solid var(--c-primary-dim);
        border-bottom: 1px solid var(--c-primary-dim);
        padding: 20px 40px;
        max-width: 700px;
        text-align: center;
        position: relative;
    }
    
    .briefing::before {
        content: 'INCOMING TRANSMISSION';
        position: absolute;
        top: -10px; left: 50%;
        transform: translateX(-50%);
        background: var(--c-bg);
        padding: 0 15px;
        color: var(--c-primary);
        font-family: var(--font-tech);
        font-size: 0.75rem;
        letter-spacing: 2px;
        border: 1px solid var(--c-primary-dim);
        box-shadow: 0 0 10px var(--c-primary-dim);
    }

    .briefing p {
        font-size: 1rem;
        line-height: 1.6;
        color: var(--c-text-dim);
        margin: 0;
        font-weight: 300;
    }

    /* --- UPGRADES --- */
    .upgrade-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        width: 100%;
        max-width: 800px;
        margin: 10px 0;
    }

    .upgrade-btn {
        background: rgba(10, 15, 25, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 20px 10px;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    .upgrade-btn:hover {
        border-color: var(--c-primary);
        background: rgba(0, 243, 255, 0.1);
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(0, 243, 255, 0.2);
    }

    .upgrade-btn svg {
        width: 32px;
        height: 32px;
        stroke: var(--c-primary);
        fill: none;
        stroke-width: 1.5;
        transition: transform 0.3s;
    }

    .upgrade-btn:hover svg { transform: scale(1.1); }

    .u-name {
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .u-cost {
        font-family: var(--font-tech);
        font-size: 0.75rem;
        color: var(--c-gold);
    }

    /* --- START BUTTON --- */
    .btn-launch {
        margin-top: 20px;
        background: transparent;
        color: var(--c-primary);
        border: none;
        padding: 25px 80px;
        font-family: var(--font-tech);
        font-size: 1.5rem;
        font-weight: bold;
        letter-spacing: 6px;
        cursor: pointer;
        position: relative;
        text-transform: uppercase;
        transition: all 0.3s ease;
    }

    .btn-launch::before, .btn-launch::after {
        content: '';
        position: absolute;
        background: var(--c-primary);
        transition: all 0.3s ease;
    }

    /* Top/Bottom lines */
    .btn-launch::before {
        top: 0; left: 0; width: 100%; height: 2px;
        box-shadow: 0 0 10px var(--c-primary);
    }
    .btn-launch::after {
        bottom: 0; left: 0; width: 100%; height: 2px;
        box-shadow: 0 0 10px var(--c-primary);
    }

    /* Side brackets */
    .btn-launch .bracket {
        position: absolute;
        width: 10px; height: 20px;
        background: var(--c-primary);
        transition: all 0.3s ease;
    }
    .btn-launch .b-tl { top: -5px; left: -5px; border-right: 2px solid var(--c-primary); background: transparent; }
    .btn-launch .b-bl { bottom: -5px; left: -5px; border-right: 2px solid var(--c-primary); background: transparent; }
    .btn-launch .b-tr { top: -5px; right: -5px; border-left: 2px solid var(--c-primary); background: transparent; }
    .btn-launch .b-br { bottom: -5px; right: -5px; border-left: 2px solid var(--c-primary); background: transparent; }

    .btn-launch:hover {
        color: #fff;
        text-shadow: 0 0 10px var(--c-primary);
        background: rgba(0, 243, 255, 0.1);
    }
    
    .btn-launch:hover::before, .btn-launch:hover::after {
        height: 4px;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
        h1 { font-size: 2.5rem; }
        .hud-top { flex-direction: column; gap: 20px; align-items: center; }
        .upgrade-grid { grid-template-columns: 1fr; gap: 10px; }
        .btn-launch { padding: 20px 40px; font-size: 1.2rem; }
    }
</style>
</head>
<body>

    <!-- Backgrounds -->
    <canvas id="canvas-layer"></canvas>
    <div class="overlay-gradient"></div>
    <div class="vignette"></div>

    <!-- UI -->
    <div class="ui-layer">
        
        <header class="hud-top">
            <div class="hud-stat">
                <span class="hud-label">Wave Status</span>
                <span class="hud-val">001</span>
            </div>
            <div class="hud-stat">
                <span class="hud-label">Shield Integrity</span>
                <span class="hud-val danger">100%</span>
            </div>
            <div class="hud-stat" style="text-align: right;">
                <span class="hud-label">Credits</span>
                <span class="hud-val gold">500</span>
            </div>
        </header>

        <main class="main-content">
            
            <div class="title-wrapper">
                <h1 class="glitch-text" data-text="JS PLANET DEFENSE">JS <span>PLANET</span> DEFENSE</h1>
            </div>

            <div class="briefing">
                <p>Commander, sensors detect a massive swarm approaching the sector. Orbital cannons are online but require manual calibration. Optimize your turret systems before the first wave breaches the perimeter.</p>
            </div>

            <div class="upgrade-grid">
                <button class="upgrade-btn" onclick="flashBtn(this)">
                    <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <div class="u-name">Damage Output</div>
                    <div class="u-cost">150 Credits</div>
                </button>
                <button class="upgrade-btn" onclick="flashBtn(this)">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <div class="u-name">Fire Rate</div>
                    <div class="u-cost">200 Credits</div>
                </button>
                <button class="upgrade-btn" onclick="flashBtn(this)">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    <div class="u-name">Projectile Speed</div>
                    <div class="u-cost">100 Credits</div>
                </button>
            </div>

            <button class="btn-launch" onclick="startGame()">
                <span class="bracket b-tl"></span>
                <span class="bracket b-tr"></span>
                <span class="bracket b-bl"></span>
                <span class="bracket b-br"></span>
                Initialize Defense
            </button>

        </main>
    </div>

    <script>
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- STARFIELD ---
        const stars = [];
        for(let i=0; i<200; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                alpha: Math.random(),
                speed: Math.random() * 0.5 + 0.1
            });
        }

        // --- ANIMATION LOOP ---
        let time = 0;
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // 1. Draw Stars
            ctx.fillStyle = '#fff';
            stars.forEach(star => {
                ctx.globalAlpha = Math.abs(Math.sin(time * 0.01 + star.x)) * star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                // Move stars slightly
                star.y -= star.speed;
                if(star.y < 0) star.y = height;
            });

            // 2. Draw Perspective Grid
            ctx.globalAlpha = 1;
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
            ctx.lineWidth = 1;
            ctx.beginPath();

            const horizon = height * 0.35; // Horizon line position
            const centerX = width / 2;
            const gridSpeed = (time * 1.5) % 40;
            
            // Vertical lines radiating from center
            for(let i = -20; i <= 20; i++) {
                const xTop = centerX + (i * 10);
                const xBottom = centerX + (i * 150);
                ctx.moveTo(xTop, 0);
                ctx.lineTo(xBottom, height);
            }

            // Horizontal lines moving towards camera
            for(let i = 0; i < 30; i++) {
                // Exponential spacing for 3D effect
                let y = horizon + Math.pow(i, 2.5) + gridSpeed;
                if(y > height) continue;
                
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            ctx.stroke();

            // 3. Draw Planet Silhouette (Background element)
            // Positioned behind the text
            ctx.save();
            ctx.translate(width/2, height/2 + 50);
            
            // Atmosphere Glow
            const gradient = ctx.createRadialGradient(0, 0, height*0.1, 0, 0, height*0.4);
            gradient.addColorStop(0, 'rgba(0, 243, 255, 0.1)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, height*0.4, 0, Math.PI*2);
            ctx.fill();

            // Planet Body
            ctx.beginPath();
            ctx.arc(0, height*0.15, height*0.35, 0, Math.PI*2);
            ctx.fillStyle = '#020305'; // Very dark, almost black
            ctx.fill();
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Grid lines on planet (longitude/latitude)
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
            ctx.beginPath();
            ctx.ellipse(0, height*0.15, height*0.35, height*0.1, 0, 0, Math.PI*2);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(0, height*0.15, height*0.1, height*0.35, 0, 0, Math.PI*2);
            ctx.stroke();

            ctx.restore();

            time++;
            requestAnimationFrame(animate);
        }
        animate();

        // --- INTERACTIVITY ---
        function flashBtn(el) {
            const originalBorder = el.style.borderColor;
            el.style.borderColor = '#fff';
            el.style.boxShadow = '0 0 15px rgba(255,255,255,0.5)';
            setTimeout(() => {
                el.style.borderColor = '';
                el.style.boxShadow = '';
            }, 200);
        }

        function startGame() {
            const btn = document.querySelector('.btn-launch');
            const originalText = btn.innerText;
            
            // Sequence
            btn.innerHTML = 'CALIBRATING SYSTEMS...';
            btn.style.color = '#fff';
            
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.5s';
                document.body.style.opacity = '0';
                setTimeout(() => {
                    alert("Game Initialized");
                    document.body.style.opacity = '1';
                    btn.innerHTML = originalText;
                }, 500);
            }, 1000);
        }
    </script>
</body>
</html>
