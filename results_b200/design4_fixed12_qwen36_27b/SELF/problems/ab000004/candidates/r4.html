<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Planet Defense</title>
<style>
    :root {
        --c-bg: #05070a;
        --c-primary: #00f3ff;
        --c-primary-dim: rgba(0, 243, 255, 0.15);
        --c-primary-glow: rgba(0, 243, 255, 0.6);
        --c-danger: #ff2a5f;
        --c-gold: #ffcc00;
        --c-text: #e0f7fa;
        --c-text-dim: #8899a6;
        --font-display: 'Trebuchet MS', 'Segoe UI', sans-serif;
        --font-tech: 'Courier New', Courier, monospace;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
        margin: 0; padding: 0;
        background-color: var(--c-bg);
        color: var(--c-text);
        font-family: var(--font-display);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* --- BACKGROUND SYSTEMS --- */
    #canvas-layer {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 0;
    }

    .overlay-gradient {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 30%, rgba(0, 243, 255, 0.15) 0%, transparent 60%),
                    linear-gradient(to bottom, rgba(5,7,10,0.4) 0%, var(--c-bg) 100%);
        z-index: 1;
        pointer-events: none;
    }

    .vignette {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        background: radial-gradient(circle, transparent 50%, #000 100%);
        z-index: 2;
        pointer-events: none;
    }

    .scanlines {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        background: linear-gradient(to bottom, rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%);
        background-size: 100% 4px;
        z-index: 3;
        pointer-events: none;
        opacity: 0.25;
    }

    /* --- UI LAYER --- */
    .ui-layer {
        position: relative;
        z-index: 10;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 0 20px;
    }

    /* --- HUD HEADER --- */
    .hud-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 40px 60px 20px 60px;
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        border-bottom: 1px solid var(--c-primary-dim);
        position: relative;
    }

    .hud-top::after {
        content: '';
        position: absolute;
        bottom: -1px; left: 0;
        width: 150px; height: 1px;
        background: var(--c-primary);
        box-shadow: 0 0 10px var(--c-primary);
    }

    .hud-stat {
        display: flex;
        flex-direction: column;
        position: relative;
    }

    .hud-label {
        font-family: var(--font-tech);
        font-size: 0.7rem;
        letter-spacing: 3px;
        color: var(--c-primary);
        margin-bottom: 6px;
        text-transform: uppercase;
        opacity: 0.8;
        text-shadow: 0 0 5px var(--c-primary-dim);
    }

    .hud-val {
        font-size: 2.2rem;
        font-weight: 700;
        letter-spacing: 1px;
        font-family: var(--font-tech);
        text-shadow: 0 0 15px var(--c-primary-dim);
        line-height: 1;
    }

    .hud-val.gold { color: var(--c-gold); text-shadow: 0 0 15px rgba(255, 204, 0, 0.5); }
    .hud-val.danger { color: var(--c-danger); text-shadow: 0 0 15px rgba(255, 42, 95, 0.5); }

    /* --- MAIN CONTENT --- */
    .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 25px;
        max-width: 1000px;
        margin: 0 auto;
        width: 100%;
        position: relative;
        padding-bottom: 40px;
    }

    /* --- TITLE --- */
    .title-wrapper {
        text-align: center;
        margin-bottom: 10px;
        position: relative;
        filter: drop-shadow(0 0 20px rgba(0, 243, 255, 0.2));
    }

    h1 {
        font-size: 4.5rem;
        line-height: 0.95;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: #fff;
        font-weight: 900;
        font-style: italic;
        position: relative;
        z-index: 2;
    }

    h1 span {
        color: var(--c-primary);
        text-shadow: 0 0 30px var(--c-primary);
    }

    /* Glitch Effect */
    .glitch-text {
        position: relative;
        display: inline-block;
    }
    .glitch-text::before, .glitch-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: var(--c-bg);
    }
    .glitch-text::before {
        left: 2px; text-shadow: -2px 0 var(--c-danger);
        clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
        animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
    }
    .glitch-text::after {
        left: -2px; text-shadow: -2px 0 var(--c-primary);
        clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
        animation: glitch-anim-2 3s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim-1 {
        0% { clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%); transform: translate(-2px, 0); }
        20% { clip-path: polygon(0 20%, 100% 20%, 100% 60%, 0 60%); transform: translate(2px, 0); }
        40% { clip-path: polygon(0 10%, 100% 10%, 100% 50%, 0 50%); transform: translate(-2px, 0); }
        60% { clip-path: polygon(0 80%, 100% 80%, 100% 100%, 0 100%); transform: translate(2px, 0); }
        80% { clip-path: polygon(0 30%, 100% 30%, 100% 70%, 0 70%); transform: translate(-2px, 0); }
        100% { clip-path: polygon(0 50%, 100% 50%, 100% 90%, 0 90%); transform: translate(2px, 0); }
    }
    @keyframes glitch-anim-2 {
        0% { clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%); transform: translate(2px, 0); }
        20% { clip-path: polygon(0 10%, 100% 10%, 100% 30%, 0 30%); transform: translate(-2px, 0); }
        40% { clip-path: polygon(0 80%, 100% 80%, 100% 100%, 0 100%); transform: translate(2px, 0); }
        60% { clip-path: polygon(0 40%, 100% 40%, 100% 80%, 0 80%); transform: translate(-2px, 0); }
        80% { clip-path: polygon(0 20%, 100% 20%, 100% 60%, 0 60%); transform: translate(2px, 0); }
        100% { clip-path: polygon(0 70%, 100% 70%, 100% 100%, 0 100%); transform: translate(-2px, 0); }
    }

    /* --- BRIEFING --- */
    .briefing {
        background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0, 243, 255, 0.03) 20%, rgba(0, 243, 255, 0.03) 80%, rgba(0,0,0,0) 100%);
        border-top: 1px solid var(--c-primary-dim);
        border-bottom: 1px solid var(--c-primary-dim);
        padding: 30px 50px;
        max-width: 800px;
        text-align: center;
        position: relative;
        backdrop-filter: blur(2px);
    }
    
    .briefing::before {
        content: 'INCOMING TRANSMISSION';
        position: absolute;
        top: -12px; left: 50%;
        transform: translateX(-50%);
        background: var(--c-bg);
        padding: 0 20px;
        color: var(--c-primary);
        font-family: var(--font-tech);
        font-size: 0.75rem;
        letter-spacing: 3px;
        border: 1px solid var(--c-primary-dim);
        box-shadow: 0 0 10px var(--c-primary-dim);
    }

    .briefing p {
        font-size: 1.1rem;
        line-height: 1.8;
        color: var(--c-text-dim);
        margin: 0;
        font-weight: 300;
        letter-spacing: 0.5px;
    }

    /* --- UPGRADES --- */
    .upgrade-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        width: 100%;
        max-width: 900px;
        margin: 20px 0;
    }

    .upgrade-btn {
        background: rgba(10, 15, 25, 0.8);
        border: 1px solid rgba(0, 243, 255, 0.2);
        padding: 25px 15px;
        cursor: pointer;
        transition: all 0.3s var(--ease-out);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
    }

    .upgrade-btn::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(180deg, rgba(0, 243, 255, 0.1) 0%, transparent 100%);
        opacity: 0;
        transition: opacity 0.3s;
    }

    .upgrade-btn:hover {
        border-color: var(--c-primary);
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(0, 243, 255, 0.2);
    }

    .upgrade-btn:hover::before { opacity: 1; }

    .upgrade-btn svg {
        width: 40px;
        height: 40px;
        stroke: var(--c-primary);
        fill: none;
        stroke-width: 1.5;
        transition: transform 0.3s var(--ease-out);
        filter: drop-shadow(0 0 5px var(--c-primary));
    }

    .upgrade-btn:hover svg { transform: scale(1.2); }

    .u-name {
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #fff;
    }

    .u-cost {
        font-family: var(--font-tech);
        font-size: 0.9rem;
        color: var(--c-gold);
        text-shadow: 0 0 5px rgba(255, 204, 0, 0.4);
    }

    /* --- START BUTTON --- */
    .btn-launch {
        margin-top: 20px;
        background: transparent;
        color: var(--c-primary);
        border: 2px solid var(--c-primary);
        padding: 25px 80px;
        font-family: var(--font-tech);
        font-size: 1.6rem;
        font-weight: bold;
        letter-spacing: 6px;
        cursor: pointer;
        position: relative;
        text-transform: uppercase;
        transition: all 0.3s var(--ease-out);
        clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
    }

    .btn-launch::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: var(--c-primary);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.3s var(--ease-out);
        z-index: -1;
    }

    .btn-launch:hover {
        color: #000;
        text-shadow: none;
        box-shadow: 0 0 30px var(--c-primary-glow);
    }

    .btn-launch:hover::before {
        transform: scaleX(1);
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
        h1 { font-size: 3rem; }
        .hud-top { flex-direction: column; gap: 25px; align-items: center; padding: 20px; }
        .upgrade-grid { grid-template-columns: 1fr; gap: 15px; }
        .btn-launch { padding: 20px 50px; font-size: 1.2rem; letter-spacing: 4px; }
        .title-wrapper { transform: none; }
        .briefing { padding: 20px; }
        .briefing p { font-size: 1rem; }
    }
</style>
</head>
<body>

    <!-- Backgrounds -->
    <canvas id="canvas-layer"></canvas>
    <div class="overlay-gradient"></div>
    <div class="vignette"></div>
    <div class="scanlines"></div>

    <!-- UI -->
    <div class="ui-layer">
        
        <header class="hud-top">
            <div class="hud-stat">
                <span class="hud-label">Wave Status</span>
                <span class="hud-val">001</span>
            </div>
            <div class="hud-stat">
                <span class="hud-label">Shield Integrity</span>
                <span class="hud-val danger">100%</span>
            </div>
            <div class="hud-stat" style="text-align: right;">
                <span class="hud-label">Credits</span>
                <span class="hud-val gold">500</span>
            </div>
        </header>

        <main class="main-content">
            
            <div class="title-wrapper">
                <h1 class="glitch-text" data-text="JS PLANET DEFENSE">JS <span>PLANET</span><br>DEFENSE</h1>
            </div>

            <div class="briefing">
                <p>Commander, sensors detect a massive swarm approaching the sector. Orbital cannons are online but require manual calibration. Optimize your turret systems before the first wave breaches the perimeter.</p>
            </div>

            <div class="upgrade-grid">
                <button class="upgrade-btn" onclick="flashBtn(this)">
                    <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <div class="u-name">Damage Output</div>
                    <div class="u-cost">150 Credits</div>
                </button>
                <button class="upgrade-btn" onclick="flashBtn(this)">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <div class="u-name">Fire Rate</div>
                    <div class="u-cost">200 Credits</div>
                </button>
                <button class="upgrade-btn" onclick="flashBtn(this)">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    <div class="u-name">Projectile Speed</div>
                    <div class="u-cost">100 Credits</div>
                </button>
            </div>

            <button class="btn-launch" onclick="startGame()">
                Initialize Defense
            </button>

        </main>
    </div>

    <script>
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- STARFIELD ---
        const stars = [];
        for(let i=0; i<300; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2,
                alpha: Math.random(),
                speed: Math.random() * 0.5 + 0.1
            });
        }

        // --- ANIMATION LOOP ---
        let time = 0;
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // 1. Draw Stars
            ctx.fillStyle = '#fff';
            stars.forEach(star => {
                ctx.globalAlpha = Math.abs(Math.sin(time * 0.01 + star.x)) * star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                // Move stars slightly
                star.y -= star.speed;
                if(star.y < 0) star.y = height;
            });

            // 2. Draw Perspective Grid
            ctx.globalAlpha = 1;
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
            ctx.lineWidth = 1;
            ctx.beginPath();

            const horizon = height * 0.45; // Horizon line position
            const centerX = width / 2;
            const gridSpeed = (time * 2) % 50;
            
            // Vertical lines radiating from center
            for(let i = -25; i <= 25; i++) {
                const xTop = centerX + (i * 10);
                const xBottom = centerX + (i * 200);
                ctx.moveTo(xTop, 0);
                ctx.lineTo(xBottom, height);
            }

            // Horizontal lines moving towards camera
            for(let i = 0; i < 30; i++) {
                // Exponential spacing for 3D effect
                let y = horizon + Math.pow(i, 2.5) + gridSpeed;
                if(y > height) continue;
                
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            ctx.stroke();

            // 3. Draw Planet Silhouette (Background element)
            // Positioned behind the text
            ctx.save();
            ctx.translate(width/2, height/2 + 100);
            
            // Atmosphere Glow
            const gradient = ctx.createRadialGradient(0, 0, height*0.1, 0, 0, height*0.5);
            gradient.addColorStop(0, 'rgba(0, 243, 255, 0.15)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, height*0.5, 0, Math.PI*2);
            ctx.fill();

            // Planet Body
            ctx.beginPath();
            ctx.arc(0, height*0.2, height*0.45, 0, Math.PI*2);
            ctx.fillStyle = '#010204'; // Very dark, almost black
            ctx.fill();
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Grid lines on planet (longitude/latitude)
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.08)';
            ctx.beginPath();
            ctx.ellipse(0, height*0.2, height*0.45, height*0.15, 0, 0, Math.PI*2);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(0, height*0.2, height*0.15, height*0.45, 0, 0, Math.PI*2);
            ctx.stroke();

            ctx.restore();

            time++;
            requestAnimationFrame(animate);
        }
        animate();

        // --- INTERACTIVITY ---
        function flashBtn(el) {
            const originalBorder = el.style.borderColor;
            el.style.borderColor = '#fff';
            el.style.boxShadow = '0 0 20px rgba(255,255,255,0.8)';
            setTimeout(() => {
                el.style.borderColor = '';
                el.style.boxShadow = '';
            }, 200);
        }

        function startGame() {
            const btn = document.querySelector('.btn-launch');
            const originalText = btn.innerText;
            
            // Sequence
            btn.innerHTML = 'CALIBRATING SYSTEMS...';
            btn.style.color = '#fff';
            
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.5s';
                document.body.style.opacity = '0';
                setTimeout(() => {
                    alert("Game Initialized");
                    document.body.style.opacity = '1';
                    btn.innerHTML = originalText;
                }, 500);
            }, 1000);
        }
    </script>
</body>
</html>
