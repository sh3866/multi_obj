<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless - Premium Cleaning</title>
    <style>
        :root {
            --bg-color: #F3F0EB;
            --panel-bg: #FFFFFF;
            --text-dark: #1A1C1E;
            --text-muted: #6B7076;
            --accent-primary: #2C3E50;
            --accent-secondary: #D4A373;
            --accent-highlight: #E8B923;
            --accent-blue: #264653;
            
            --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-stack);
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
        }

        /* Layout */
        .wrapper {
            display: grid;
            grid-template-columns: 450px 1fr;
            width: 100%;
            height: 100vh;
        }

        /* Left Panel - Content */
        .content-panel {
            background: var(--panel-bg);
            padding: 80px 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 10;
            box-shadow: 4px 0 40px rgba(0,0,0,0.04);
        }

        .brand {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-blue);
            margin-bottom: 70px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-highlight);
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(232, 185, 35, 0.2);
        }

        h1 {
            font-size: 64px;
            line-height: 1.05;
            color: var(--text-dark);
            margin: 0 0 40px 0;
            font-weight: 800;
            letter-spacing: -2px;
        }

        p {
            font-size: 19px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 60px;
            max-width: 380px;
            font-weight: 400;
        }

        .stats-row {
            display: flex;
            gap: 60px;
            margin-bottom: auto;
            padding-top: 30px;
            border-top: 1px solid rgba(0,0,0,0.08);
        }

        .stat-item h3 {
            font-size: 42px;
            margin: 0;
            color: var(--text-dark);
            font-weight: 700;
            letter-spacing: -1px;
        }

        .stat-item span {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-top: 8px;
            display: block;
        }

        .cta-btn {
            background-color: var(--text-dark);
            color: #fff;
            border: none;
            padding: 22px 45px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            width: fit-content;
            margin-top: 60px;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .cta-btn:hover {
            background-color: var(--accent-blue);
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(38, 70, 83, 0.25);
        }

        /* Right Panel - The Scene */
        .scene-panel {
            position: relative;
            background-color: var(--bg-color);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG Scene Styling */
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Animations */
        @keyframes floatBubble {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
        }

        .bubble {
            animation: floatBubble 4s infinite ease-in;
        }
        .bubble:nth-child(2) { animation-duration: 5s; animation-delay: 1.2s; }
        .bubble:nth-child(3) { animation-duration: 3.5s; animation-delay: 0.5s; }
        .bubble:nth-child(4) { animation-duration: 6s; animation-delay: 2.5s; }
        .bubble:nth-child(5) { animation-duration: 4.5s; animation-delay: 1.8s; }

    </style>
</head>
<body>

<div class="wrapper">
    <!-- Left Sidebar -->
    <div class="content-panel">
        <div class="brand">
            <div class="brand-dot"></div>
            Spotless Co.
        </div>
        
        <h1>Clarity in<br>every corner.</h1>
        
        <p>Experience the difference of a deep clean. We restore the natural warmth of your home with eco-friendly solutions and meticulous care.</p>
        
        <div class="stats-row">
            <div class="stat-item">
                <h3>99%</h3>
                <span>Efficiency</span>
            </div>
            <div class="stat-item">
                <h3>100%</h3>
                <span>Eco-Friendly</span>
            </div>
        </div>

        <button class="cta-btn">Book a Clean</button>
    </div>

    <!-- Right Visual Scene -->
    <div class="scene-panel">
        <svg viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Filters -->
                <filter id="shadowBlur" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
                    <feOffset dx="15" dy="25" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.15"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <!-- Gradients -->
                <!-- Floor Gradient: Subtle radial -->
                <radialGradient id="floorGrad" cx="50%" cy="50%" r="80%" fx="50%" fy="50%">
                    <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#EBE7E0;stop-opacity:1" />
                </radialGradient>

                <!-- Liquid Gradient: Rich, viscous look -->
                <radialGradient id="liquidGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
                    <stop offset="0%" style="stop-color:#F4D03F;stop-opacity:1" /> 
                    <stop offset="60%" style="stop-color:#D4AC0D;stop-opacity:1" /> 
                    <stop offset="100%" style="stop-color:#9A7D0A;stop-opacity:1" /> 
                </radialGradient>

                <!-- Mop Handle: Metallic -->
                <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
                    <stop offset="40%" style="stop-color:#5D6D7E;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#17202A;stop-opacity:1" />
                </linearGradient>

                <!-- Mop Head: White/Cotton -->
                <linearGradient id="mopHeadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#BDC3C7;stop-opacity:1" />
                </linearGradient>
                
                <!-- Mop Head Shadow -->
                <filter id="mopShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
                    <feOffset dx="2" dy="4" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.2"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <!-- Noise Pattern for Floor Texture -->
                <filter id="noiseFilter">
                    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
                </filter>
            </defs>

            <!-- 1. Background Floor -->
            <rect width="100%" height="100%" fill="url(#floorGrad)" />
            <!-- Texture Overlay -->
            <rect width="100%" height="100%" filter="url(#noiseFilter)" opacity="0.03" pointer-events="none" />

            <!-- 2. The Spilled Mess (Coffee/Oil) -->
            <g transform="translate(550, 500)">
                <!-- Shadow under liquid (Deep depth) -->
                <ellipse cx="20" cy="20" rx="160" ry="65" fill="#000" opacity="0.15" filter="blur(15px)" />
                
                <!-- Main Puddle -->
                <!-- More organic shape -->
                <path d="M0,0 C50,-70 180,-50 220,0 C260,50 180,110 100,100 C20,90 -50,50 -60,0 C-70,-50 -30,-60 0,0 Z" 
                      fill="url(#liquidGrad)" filter="url(#shadowBlur)"/>
                
                <!-- Inner Detail: Surface Tension / Ripples -->
                <path d="M-20,20 C20,-10 100,-10 140,20 C180,50 140,80 80,70 C20,60 -40,40 -20,20 Z" 
                      fill="none" stroke="#FFF" stroke-width="3" opacity="0.3" filter="blur(1px)"/>
                
                <!-- Specular Highlight (Glossy) -->
                <ellipse cx="100" cy="20" rx="50" ry="15" fill="#FFF" opacity="0.5" transform="rotate(-15 100 20)" filter="blur(3px)" />
                
                <!-- Splatter Drops -->
                <circle cx="240" cy="10" r="6" fill="#D4AC0D" />
                <circle cx="260" cy="30" r="3" fill="#D4AC0D" />
                <circle cx="-80" cy="50" r="8" fill="#D4AC0D" />
                <circle cx="-100" cy="30" r="4" fill="#D4AC0D" />
                <circle cx="180" cy="80" r="2" fill="#B7950B" />
            </g>

            <!-- 3. The Mop -->
            <!-- Adjusted position to look like it's actively mopping -->
            <g transform="translate(50, 50) rotate(-35 600 200)">
                
                <!-- Handle Shadow (on floor) -->
                <line x1="600" y1="200" x2="850" y2="800" stroke="#000" stroke-width="12" opacity="0.1" filter="blur(8px)" transform="translate(30, 40)" />

                <!-- The Handle -->
                <line x1="600" y1="200" x2="850" y2="800" stroke="url(#handleGrad)" stroke-width="16" stroke-linecap="round" filter="url(#shadowBlur)" />
                
                <!-- Connection Joint -->
                <g transform="translate(600, 200)">
                    <circle cx="0" cy="0" r="22" fill="#34495E" filter="url(#shadowBlur)"/>
                    <circle cx="0" cy="0" r="14" fill="#1A252F" />
                </g>

                <!-- Mop Head (The Cotton Part) -->
                <g transform="translate(600, 200)">
                    <!-- Base Plate (Metal) -->
                    <ellipse cx="0" cy="25" rx="65" ry="22" fill="#95A5A6" filter="url(#shadowBlur)" />
                    <ellipse cx="0" cy="25" rx="65" ry="22" fill="none" stroke="#7F8C8D" stroke-width="2" />
                    
                    <!-- The Strands (Paths) -->
                    <!-- More strands, varied lengths for realism -->
                    <g stroke="url(#mopHeadGrad)" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#mopShadow)">
                        <!-- Left Side -->
                        <path d="M-40,25 Q-60,120 -90,180" />
                        <path d="M-30,25 Q-50,130 -70,200" />
                        <path d="M-20,25 Q-40,140 -50,220" />
                        
                        <!-- Center -->
                        <path d="M-10,25 Q-20,150 -30,240" />
                        <path d="M0,25 Q10,160 10,250" />
                        <path d="M10,25 Q20,150 30,240" />
                        
                        <!-- Right Side -->
                        <path d="M20,25 Q40,140 50,220" />
                        <path d="M30,25 Q50,130 70,200" />
                        <path d="M40,25 Q60,120 90,180" />
                    </g>
                </g>
            </g>

            <!-- 4. Soap Bubbles / Magic -->
            <g transform="translate(520, 380)">
                <circle cx="0" cy="0" r="14" fill="rgba(255,255,255,0.3)" stroke="#FFF" stroke-width="2" class="bubble" />
                <circle cx="40" cy="-30" r="10" fill="rgba(255,255,255,0.3)" stroke="#FFF" stroke-width="2" class="bubble" />
                <circle cx="-20" cy="-50" r="22" fill="rgba(255,255,255,0.2)" stroke="#FFF" stroke-width="2" class="bubble" />
                <circle cx="60" cy="10" r="8" fill="rgba(255,255,255,0.3)" stroke="#FFF" stroke-width="2" class="bubble" />
                <circle cx="20" cy="-70" r="12" fill="rgba(255,255,255,0.2)" stroke="#FFF" stroke-width="2" class="bubble" />
            </g>

            <!-- 5. Ambient Light / Vignette -->
            <!-- Top Right Warm Glow -->
            <circle cx="900" cy="-100" r="400" fill="#E9C46A" opacity="0.1" filter="blur(100px)" pointer-events="none" />
            <!-- Bottom Left Cool Shadow -->
            <circle cx="0" cy="900" r="500" fill="#264653" opacity="0.05" filter="blur(120px)" pointer-events="none" />

        </svg>
    </div>
</div>

</body>
</html>
