<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless - Premium Cleaning</title>
    <style>
        :root {
            --bg-body: #F9F8F6; /* Warmer, stone-like background */
            --bg-panel: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --text-tertiary: #999999;
            --accent: #D4AF37; /* Gold/Mustard */
            --accent-dark: #AA8C2C;
            --surface-wood: #E6DCC8;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-serif: "Georgia", serif; /* For a touch of elegance */
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-body);
            font-family: var(--font-main);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        .wrapper {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* --- Left Panel: Refined Typography & Layout --- */
        .content-panel {
            width: 40%;
            min-width: 450px;
            background: var(--bg-panel);
            padding: 80px 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 10;
            box-shadow: 10px 0 60px rgba(0,0,0,0.03);
            border-right: 1px solid rgba(0,0,0,0.02);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-primary);
            margin-bottom: 80px;
        }

        .brand-icon {
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.2);
        }

        h1 {
            font-size: 64px;
            line-height: 1.05;
            font-weight: 700;
            letter-spacing: -0.04em;
            margin: 0 0 16px 0;
            color: var(--text-primary);
        }

        .sub-headline {
            font-family: var(--font-serif);
            font-size: 42px;
            color: var(--text-secondary);
            font-weight: 400;
            font-style: italic;
            opacity: 0.8;
            margin-bottom: 40px;
            display: block;
        }

        .description {
            font-size: 17px;
            line-height: 1.7;
            color: var(--text-secondary);
            margin-bottom: 60px;
            max-width: 380px;
            font-weight: 400;
        }

        .cta-group {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .cta-button {
            background: var(--text-primary);
            color: #fff;
            border: none;
            padding: 22px 44px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.02em;
            position: relative;
            overflow: hidden;
        }

        .cta-button::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: translateX(-100%);
            transition: 0.5s;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            background: #000;
        }
        
        .cta-button:hover::after {
            transform: translateX(100%);
        }

        .stats-container {
            display: flex;
            gap: 80px;
            margin-top: auto;
            padding-top: 60px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .stat h3 {
            font-size: 36px;
            margin: 0;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            font-family: var(--font-serif);
        }

        .stat p {
            font-size: 11px;
            margin: 8px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-tertiary);
            font-weight: 600;
        }

        /* --- Right Panel: The Art --- */
        .scene-panel {
            flex-grow: 1;
            position: relative;
            background-color: var(--bg-body);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Subtle Grain Overlay */
        .scene-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 2;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Animations */
        @keyframes floatBubble {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            15% { opacity: 0.6; }
            100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
        }

        .bubble {
            animation: floatBubble 5s infinite ease-in;
            fill: rgba(255, 255, 255, 0.3);
            stroke: rgba(255, 255, 255, 0.8);
            stroke-width: 1;
        }

        .b1 { animation-delay: 0.2s; }
        .b2 { animation-delay: 1.8s; }
        .b3 { animation-delay: 3.2s; }
        .b4 { animation-delay: 0.8s; }

        @keyframes subtleBob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(0.5deg); }
        }

        .floating-group {
            animation: subtleBob 10s ease-in-out infinite;
            transform-origin: center;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Left Content -->
    <div class="content-panel">
        <div class="brand">
            <div class="brand-icon"></div>
            Spotless Co.
        </div>
        
        <h1>Clarity in<br>every corner.</h1>
        <span class="sub-headline">Premium deep cleaning.</span>
        
        <p class="description">
            Experience the difference of a true deep clean. We restore the natural warmth of your home with eco-friendly solutions and meticulous care.
        </p>

        <div class="cta-group">
            <button class="cta-button">Book a Clean</button>
        </div>

        <div class="stats-container">
            <div class="stat">
                <h3>99%</h3>
                <p>Efficiency</p>
            </div>
            <div class="stat">
                <h3>100%</h3>
                <p>Eco-Friendly</p>
            </div>
        </div>
    </div>

    <!-- Right Visual Scene -->
    <div class="scene-panel">
        <svg viewBox="0 0 1200 1000" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Wood Floor Texture -->
                <pattern id="woodFloor" width="400" height="100" patternUnits="userSpaceOnUse">
                    <rect width="400" height="100" fill="#E6DCC8" />
                    <!-- Wood Grain lines -->
                    <path d="M0,20 Q100,25 200,20 T400,20" stroke="#DCCBAA" stroke-width="1" fill="none" opacity="0.5"/>
                    <path d="M0,60 Q150,55 250,65 T400,60" stroke="#DCCBAA" stroke-width="1" fill="none" opacity="0.5"/>
                    <!-- Plank separation -->
                    <line x1="0" y1="0" x2="400" y2="0" stroke="#D4C5A9" stroke-width="2" />
                </pattern>

                <!-- Lighting -->
                <filter id="heavyBlur" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="40" />
                </filter>
                
                <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="6" />
                </filter>

                <!-- The Mess Gradients (Coffee/Latte) -->
                <radialGradient id="spillGrad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#F4D03F" />
                    <stop offset="40%" stop-color="#D4AC0D" />
                    <stop offset="80%" stop-color="#9A7D0A" />
                    <stop offset="100%" stop-color="#7D6608" />
                </radialGradient>

                <!-- Specular Highlight for Mess -->
                <linearGradient id="spillHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FFF" stop-opacity="0.7"/>
                    <stop offset="100%" stop-color="#FFF" stop-opacity="0"/>
                </linearGradient>

                <!-- Mop Handle: Matte Aluminum -->
                <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#95A5A6"/>
                    <stop offset="40%" stop-color="#ECF0F1"/>
                    <stop offset="60%" stop-color="#BDC3C7"/>
                    <stop offset="100%" stop-color="#7F8C8D"/>
                </linearGradient>

                <!-- Mop Head Plate -->
                <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FFFFFF"/>
                    <stop offset="100%" stop-color="#D5DBDB"/>
                </linearGradient>

                <!-- Mop Head: Textured Cotton -->
                <linearGradient id="cottonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#FFFFFF"/>
                    <stop offset="100%" stop-color="#E5E7E9"/>
                </linearGradient>

                <!-- Background Vignette -->
                <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
                    <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
                    <stop offset="100%" stop-color="#EBE7E0" stop-opacity="0.8"/>
                </radialGradient>
            </defs>

            <!-- 1. Background Lighting -->
            <rect width="100%" height="100%" fill="url(#woodFloor)" />
            <rect width="100%" height="100%" fill="url(#bgGlow)" opacity="0.5" pointer-events="none"/>
            
            <!-- Warm Top-Right Light Source -->
            <circle cx="1000" cy="-100" r="600" fill="#E9C46A" opacity="0.12" filter="url(#heavyBlur)" pointer-events="none"/>

            <g class="floating-group">
                <!-- 2. The Mess (Spilled Coffee) -->
                <!-- Positioned slightly right-center -->
                <g transform="translate(780, 580)">
                    
                    <!-- The Puddle Base (Organic Shape) -->
                    <path d="M0,0 C40,-100 200,-80 260,10 C320,100 220,180 120,170 C-20,160 -80,100 -50,20 C-40,-30 0,-10 0,0 Z" 
                          fill="url(#spillGrad)" filter="url(#softBlur)" opacity="0.9"/>
                    
                    <!-- Inner Detail/Texture -->
                    <path d="M20,10 C60,-80 180,-60 220,10 C260,80 180,150 100,140 C-10,130 -40,80 -20,20 C-10,-10 0,-5 20,10 Z" 
                          fill="none" stroke="#FFF" stroke-width="8" opacity="0.1" filter="blur(2px)"/>
                    
                    <!-- Main Specular Highlight (Glossy Wet Look) -->
                    <ellipse cx="150" cy="40" rx="70" ry="30" fill="url(#spillHighlight)" transform="rotate(-15 150 40)" filter="blur(6px)" />
                    
                    <!-- Splatter Drops -->
                    <g fill="#D4AC0D" filter="url(#softBlur)">
                        <circle cx="300" cy="10" r="12" opacity="0.8"/>
                        <circle cx="330" cy="40" r="6" opacity="0.6"/>
                        <circle cx="-60" cy="80" r="15" opacity="0.7"/>
                        <circle cx="-90" cy="50" r="8" opacity="0.5"/>
                        <circle cx="280" cy="120" r="5" opacity="0.6"/>
                    </g>
                </g>

                <!-- 3. The Mop (Isometric/Top-Down Hybrid) -->
                <!-- Positioned entering from Top Right, cleaning the mess -->
                <g transform="translate(350, 250) rotate(45)">
                    
                    <!-- Handle (Long pole) -->
                    <rect x="200" y="-100" width="32" height="1200" rx="16" fill="url(#handleGrad)" filter="url(#softBlur)" transform="rotate(10 215 400)"/>

                    <!-- Mop Head Assembly -->
                    <g transform="translate(215, 400) rotate(10)">
                        
                        <!-- Metal Plate Shadow -->
                        <ellipse cx="10" cy="10" rx="100" ry="40" fill="rgba(0,0,0,0.1)" filter="blur(5px)"/>

                        <!-- Metal Plate -->
                        <ellipse cx="0" cy="0" rx="100" ry="40" fill="url(#plateGrad)" />
                        <ellipse cx="0" cy="0" rx="100" ry="40" fill="none" stroke="#BDC3C7" stroke-width="2" />
                        
                        <!-- The Cotton Strands (More organic paths) -->
                        <g stroke="url(#cottonGrad)" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#softBlur)">
                            <!-- Left -->
                            <path d="M-70,0 Q-80,120 -100,180" />
                            <path d="M-50,0 Q-60,130 -80,200" />
                            <path d="M-30,0 Q-30,140 -50,220" />
                            
                            <!-- Center -->
                            <path d="M-10,0 Q-5,150 -10,240" />
                            <path d="M10,0 Q15,150 10,240" />
                            
                            <!-- Right -->
                            <path d="M30,0 Q30,140 50,220" />
                            <path d="M50,0 Q60,130 80,200" />
                            <path d="M70,0 Q80,120 100,180" />
                        </g>
                    </g>
                </g>

                <!-- 4. Soap Bubbles (Magical/Fresh Element) -->
                <g transform="translate(650, 480)">
                    <circle cx="0" cy="0" r="20" class="bubble b1" />
                    <circle cx="40" cy="-50" r="12" class="bubble b2" />
                    <circle cx="-30" cy="-80" r="28" class="bubble b3" />
                    <circle cx="60" cy="30" r="10" class="bubble b4" />
                    <circle cx="20" cy="-100" r="16" class="bubble b1" style="animation-delay: 2.5s;" />
                </g>
            </g>
        </svg>
    </div>
</div>

</body>
</html>
