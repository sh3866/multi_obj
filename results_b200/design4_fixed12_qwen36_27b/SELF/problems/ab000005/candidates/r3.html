<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless - Premium Cleaning</title>
    <style>
        :root {
            --bg-body: #F7F5F2;
            --bg-panel: #FFFFFF;
            --text-primary: #181A1B;
            --text-secondary: #666B70;
            --accent: #2B3A42;
            --accent-highlight: #E0A828;
            --shadow-soft: 0 20px 40px -10px rgba(0,0,0,0.08);
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-body);
            font-family: var(--font-main);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        .wrapper {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* Left Panel - Typography & Content */
        .content-panel {
            width: 40%;
            min-width: 450px;
            background: var(--bg-panel);
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 2;
            border-right: 1px solid rgba(0,0,0,0.03);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 80px;
            opacity: 0.9;
        }

        .brand-icon {
            width: 12px;
            height: 12px;
            background: var(--accent-highlight);
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(224, 168, 40, 0.15);
        }

        h1 {
            font-size: 64px;
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin: 0 0 32px 0;
            color: var(--text-primary);
        }

        h1 span {
            color: var(--text-secondary);
            opacity: 0.4;
            font-weight: 400;
            display: block;
            margin-top: 10px;
        }

        .description {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 60px;
            max-width: 380px;
            font-weight: 400;
        }

        .stats-container {
            display: flex;
            gap: 50px;
            margin-top: auto;
            padding-top: 40px;
            border-top: 1px solid rgba(0,0,0,0.06);
        }

        .stat h3 {
            font-size: 36px;
            margin: 0;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat p {
            font-size: 12px;
            margin: 8px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .cta-button {
            margin-top: 60px;
            background: var(--text-primary);
            color: #fff;
            border: none;
            padding: 18px 36px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: fit-content;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        /* Right Panel - The Art */
        .scene-panel {
            flex-grow: 1;
            position: relative;
            background-color: var(--bg-body);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Subtle Texture Overlay */
        .scene-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Animations */
        @keyframes floatBubble {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 0.7; }
            100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
        }

        .bubble {
            animation: floatBubble 5s infinite ease-in-out;
            fill: rgba(255, 255, 255, 0.3);
            stroke: #fff;
            stroke-width: 1.5;
        }

        .b1 { animation-delay: 0.5s; }
        .b2 { animation-delay: 2.1s; }
        .b3 { animation-delay: 1.2s; }
        .b4 { animation-delay: 3.5s; }

    </style>
</head>
<body>

<div class="wrapper">
    <!-- Left Content -->
    <div class="content-panel">
        <div class="brand">
            <div class="brand-icon"></div>
            Spotless Co.
        </div>
        
        <h1>
            Clarity in<br>
            every corner.
            <span>Premium deep cleaning.</span>
        </h1>
        
        <p class="description">
            Experience the difference of a deep clean. We restore the natural warmth of your home with eco-friendly solutions and meticulous care.
        </p>

        <button class="cta-button">Book a Clean</button>

        <div class="stats-container">
            <div class="stat">
                <h3>99%</h3>
                <p>Efficiency</p>
            </div>
            <div class="stat">
                <h3>100%</h3>
                <p>Eco-Friendly</p>
            </div>
        </div>
    </div>

    <!-- Right Visual Scene -->
    <div class="scene-panel">
        <svg viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Filters -->
                <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
                    <feOffset dx="10" dy="30" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.15"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
                    <feOffset dx="5" dy="10" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.1"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <!-- Gradients -->
                
                <!-- The Mess: Coffee/Oil Spill -->
                <radialGradient id="spillGrad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#F4D03F" />
                    <stop offset="40%" stop-color="#D4AC0D" />
                    <stop offset="85%" stop-color="#9A7D0A" />
                    <stop offset="100%" stop-color="#7D6608" />
                </radialGradient>

                <!-- Specular Highlight for Mess -->
                <linearGradient id="spillHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FFF" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#FFF" stop-opacity="0"/>
                </linearGradient>

                <!-- Mop Handle: Matte Dark Metal -->
                <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#34495E"/>
                    <stop offset="50%" stop-color="#5D6D7E"/>
                    <stop offset="100%" stop-color="#2C3E50"/>
                </linearGradient>

                <!-- Mop Head: Textured Cotton -->
                <linearGradient id="cottonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#FFFFFF"/>
                    <stop offset="100%" stop-color="#E5E7E9"/>
                </linearGradient>

                <!-- Background Vignette -->
                <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
                    <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
                    <stop offset="100%" stop-color="#EBE7E0" stop-opacity="1"/>
                </radialGradient>
            </defs>

            <!-- 1. Background Lighting -->
            <rect width="100%" height="100%" fill="url(#bgGlow)" opacity="0.5"/>
            
            <!-- Warm Top-Right Light Source -->
            <circle cx="900" cy="-100" r="600" fill="#E9C46A" opacity="0.05" filter="blur(80px)" pointer-events="none"/>

            <!-- 2. The Mess (Spilled Coffee) -->
            <!-- Positioned slightly right-center -->
            <g transform="translate(550, 520)" filter="url(#dropShadow)">
                <!-- The Puddle Base -->
                <path d="M0,0 C20,-80 150,-60 200,0 C250,60 160,130 80,120 C-20,110 -60,60 -40,0 C-30,-50 0,-40 0,0 Z" 
                      fill="url(#spillGrad)" />
                
                <!-- Surface Texture / Ripples -->
                <path d="M-20,20 C20,-10 120,-10 160,20 C200,50 150,90 80,80 C10,70 -30,50 -20,20 Z" 
                      fill="none" stroke="#FFF" stroke-width="4" opacity="0.2" filter="blur(2px)"/>
                
                <!-- Main Specular Highlight (Glossy Wet Look) -->
                <ellipse cx="120" cy="30" rx="60" ry="25" fill="url(#spillHighlight)" transform="rotate(-15 120 30)" filter="blur(4px)" />
                
                <!-- Splatter Drops -->
                <circle cx="230" cy="20" r="8" fill="#D4AC0D" />
                <circle cx="250" cy="40" r="4" fill="#D4AC0D" />
                <circle cx="-60" cy="60" r="10" fill="#D4AC0D" />
                <circle cx="-80" cy="40" r="5" fill="#D4AC0D" />
                <circle cx="180" cy="90" r="3" fill="#B7950B" />
            </g>

            <!-- 3. The Mop (Isometric/Top-Down Hybrid) -->
            <!-- Positioned entering from Top Right, cleaning the mess -->
            <g transform="translate(300, 200) rotate(35)">
                
                <!-- Handle (Long pole) -->
                <rect x="200" y="0" width="24" height="800" rx="12" fill="url(#handleGrad)" filter="url(#dropShadow)" transform="rotate(15 212 400)"/>

                <!-- Mop Head Assembly -->
                <g transform="translate(212, 400) rotate(15)">
                    
                    <!-- Metal Plate -->
                    <ellipse cx="0" cy="0" rx="90" ry="35" fill="#BDC3C7" filter="url(#dropShadow)" />
                    <ellipse cx="0" cy="0" rx="90" ry="35" fill="none" stroke="#95A5A6" stroke-width="3" />
                    
                    <!-- The Cotton Strands (More organic paths) -->
                    <g stroke="url(#cottonGrad)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#softShadow)">
                        <!-- Left -->
                        <path d="M-60,0 Q-70,100 -90,160" />
                        <path d="M-45,0 Q-50,110 -70,180" />
                        <path d="M-30,0 Q-30,120 -50,200" />
                        
                        <!-- Center -->
                        <path d="M-15,0 Q-10,130 -20,220" />
                        <path d="M0,0 Q10,140 0,230" />
                        <path d="M15,0 Q20,130 20,220" />
                        
                        <!-- Right -->
                        <path d="M30,0 Q30,120 50,200" />
                        <path d="M45,0 Q50,110 70,180" />
                        <path d="M60,0 Q70,100 90,160" />
                    </g>
                </g>
            </g>

            <!-- 4. Soap Bubbles (Magical/Fresh Element) -->
            <g transform="translate(480, 400)">
                <circle cx="0" cy="0" r="16" class="bubble b1" />
                <circle cx="30" cy="-40" r="10" class="bubble b2" />
                <circle cx="-20" cy="-60" r="24" class="bubble b3" />
                <circle cx="50" cy="20" r="8" class="bubble b4" />
                <circle cx="15" cy="-80" r="14" class="bubble b1" style="animation-delay: 4s;" />
            </g>

        </svg>
    </div>
</div>

</body>
</html>
