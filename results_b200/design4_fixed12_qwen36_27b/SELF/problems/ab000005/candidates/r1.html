<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotless - Premium Cleaning</title>
    <style>
        :root {
            --bg-color: #F4F1EB; /* Warmer, creamier off-white */
            --panel-bg: #FFFFFF;
            --text-dark: #1A1C1E;
            --text-muted: #585D63;
            --accent-primary: #2B2F33;
            --accent-secondary: #D4A373; /* Warm wood tone */
            --accent-highlight: #E9C46A; /* Bright gold/yellow for liquid */
            --accent-blue: #264653; /* Deep teal for contrast */
            
            --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font-stack);
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
        }

        /* Layout */
        .wrapper {
            display: grid;
            grid-template-columns: 420px 1fr;
            width: 100%;
            height: 100vh;
        }

        /* Left Panel - Content */
        .content-panel {
            background: var(--panel-bg);
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 5px 0 30px rgba(0,0,0,0.03);
            z-index: 10;
            position: relative;
        }

        .brand {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--accent-blue);
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-highlight);
            border-radius: 50%;
        }

        h1 {
            font-size: 56px;
            line-height: 1.05;
            color: var(--text-dark);
            margin: 0 0 32px 0;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 50px;
            max-width: 340px;
            font-weight: 400;
        }

        .stats-row {
            display: flex;
            gap: 50px;
            margin-bottom: auto;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.06);
        }

        .stat-item h3 {
            font-size: 36px;
            margin: 0;
            color: var(--text-dark);
            font-weight: 700;
        }

        .stat-item span {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
            margin-top: 4px;
            display: block;
        }

        .cta-btn {
            background-color: var(--text-dark);
            color: #fff;
            border: none;
            padding: 20px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: fit-content;
            margin-top: 60px;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .cta-btn:hover {
            background-color: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(38, 70, 83, 0.2);
        }

        /* Right Panel - The Scene */
        .scene-panel {
            position: relative;
            background-color: var(--bg-color);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG Scene Styling */
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Animations */
        @keyframes floatBubble {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-60px) scale(1.2); opacity: 0; }
        }

        @keyframes drip {
            0% { transform: translateY(0); opacity: 0.9; }
            100% { transform: translateY(30px); opacity: 0; }
        }

        .bubble {
            animation: floatBubble 4s infinite ease-in;
        }
        .bubble:nth-child(2) { animation-duration: 5s; animation-delay: 1s; }
        .bubble:nth-child(3) { animation-duration: 3.5s; animation-delay: 2s; }
        .bubble:nth-child(4) { animation-duration: 6s; animation-delay: 0.5s; }

        .drip {
            animation: drip 1.5s infinite ease-in;
        }

    </style>
</head>
<body>

<div class="wrapper">
    <!-- Left Sidebar -->
    <div class="content-panel">
        <div class="brand">
            <div class="brand-dot"></div>
            Spotless Co.
        </div>
        
        <h1>Clarity in<br>every corner.</h1>
        
        <p>Experience the difference of a deep clean. We restore the natural warmth of your home with eco-friendly solutions and meticulous care.</p>
        
        <div class="stats-row">
            <div class="stat-item">
                <h3>99%</h3>
                <span>Efficiency</span>
            </div>
            <div class="stat-item">
                <h3>100%</h3>
                <span>Eco-Friendly</span>
            </div>
        </div>

        <button class="cta-btn">Book a Clean</button>
    </div>

    <!-- Right Visual Scene -->
    <div class="scene-panel">
        <svg viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Filters -->
                <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
                    <feOffset dx="10" dy="25" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.15"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <filter id="wetShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
                    <feOffset dx="0" dy="2" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.3"/>
                    </feComponentTransfer>
                    <feMerge> 
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/> 
                    </feMerge>
                </filter>

                <!-- Gradients -->
                <!-- Floor Gradient: Subtle radial to give depth -->
                <radialGradient id="floorGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
                    <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#EBE7E0;stop-opacity:1" />
                </radialGradient>

                <!-- Liquid Gradient: Rich, viscous look -->
                <radialGradient id="liquidGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                    <stop offset="0%" style="stop-color:#F4D03F;stop-opacity:1" /> <!-- Light center -->
                    <stop offset="70%" style="stop-color:#D4AC0D;stop-opacity:1" /> <!-- Darker edge -->
                    <stop offset="100%" style="stop-color:#B7950B;stop-opacity:1" /> <!-- Rim -->
                </radialGradient>

                <!-- Mop Handle: Metallic/Wood -->
                <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#5D6D7E;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#17202A;stop-opacity:1" />
                </linearGradient>

                <!-- Mop Head: White/Cotton -->
                <linearGradient id="mopHeadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#FDFEFE;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#E5E7E9;stop-opacity:1" />
                </linearGradient>

                <!-- Noise Pattern for Floor Texture -->
                <filter id="noiseFilter">
                    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
                </filter>
            </defs>

            <!-- 1. Background Floor -->
            <rect width="100%" height="100%" fill="url(#floorGrad)" />
            <!-- Texture Overlay -->
            <rect width="100%" height="100%" filter="url(#noiseFilter)" opacity="0.04" pointer-events="none" />

            <!-- 2. The Spilled Mess (Coffee/Oil) -->
            <g transform="translate(550, 500)">
                <!-- Shadow under liquid -->
                <ellipse cx="0" cy="15" rx="180" ry="60" fill="#000" opacity="0.1" filter="blur(10px)" />
                
                <!-- Main Puddle -->
                <path d="M0,0 C40,-60 160,-40 200,10 C240,60 180,100 100,90 C20,80 -60,40 -80,-10 C-100,-60 -40,-60 0,0 Z" 
                      fill="url(#liquidGrad)" filter="url(#shadowBlur)"/>
                
                <!-- Inner Detail: Liquid Surface Tension / Ripples -->
                <path d="M-40,10 C0,-20 80,-20 120,10 C160,40 120,70 60,60 C0,50 -60,30 -40,10 Z" 
                      fill="none" stroke="#F9E79F" stroke-width="2" opacity="0.6" filter="blur(1px)"/>
                
                <!-- Highlight/Reflection -->
                <ellipse cx="80" cy="20" rx="40" ry="15" fill="#FFF" opacity="0.4" transform="rotate(-15 80 20)" filter="blur(2px)" />
                
                <!-- Splatter Drops -->
                <circle cx="210" cy="10" r="6" fill="#D4AC0D" />
                <circle cx="230" cy="30" r="3" fill="#D4AC0D" />
                <circle cx="-90" cy="50" r="8" fill="#D4AC0D" />
                <circle cx="-110" cy="30" r="4" fill="#D4AC0D" />
                <circle cx="180" cy="80" r="2" fill="#B7950B" />
            </g>

            <!-- 3. The Mop -->
            <g transform="rotate(-15 400 100)">
                
                <!-- Handle Shadow (on floor) -->
                <line x1="400" y1="100" x2="650" y2="700" stroke="#000" stroke-width="10" opacity="0.1" filter="blur(6px)" transform="translate(20, 30)" />

                <!-- The Handle -->
                <line x1="400" y1="100" x2="650" y2="700" stroke="url(#handleGrad)" stroke-width="14" stroke-linecap="round" filter="url(#shadowBlur)" />
                
                <!-- Connection Joint -->
                <g transform="translate(400, 100)">
                    <circle cx="0" cy="0" r="18" fill="#34495E" filter="url(#shadowBlur)"/>
                    <circle cx="0" cy="0" r="10" fill="#1A252F" />
                </g>

                <!-- Mop Head (The Cotton Part) -->
                <g transform="translate(400, 100)">
                    <!-- Base Plate -->
                    <ellipse cx="0" cy="25" rx="55" ry="18" fill="#95A5A6" filter="url(#shadowBlur)" />
                    
                    <!-- The Strands (Paths) -->
                    <g stroke="url(#mopHeadGrad)" stroke-width="5" stroke-linecap="round" fill="none">
                        <!-- Left Side -->
                        <path d="M-20,25 Q-40,100 -60,160" />
                        <path d="M-10,25 Q-20,120 -30,180" />
                        <path d="M-30,25 Q-60,90 -80,140" />
                        <path d="M-15,25 Q-10,130 -15,190" />
                        
                        <!-- Center -->
                        <path d="M0,25 Q10,120 20,170" />
                        <path d="M5,25 Q5,130 5,180" />
                        <path d="M-5,25 Q-15,110 -25,160" />
                        
                        <!-- Right Side -->
                        <path d="M20,25 Q40,100 60,160" />
                        <path d="M30,25 Q60,90 80,140" />
                        <path d="M10,25 Q20,120 30,180" />
                    </g>
                    
                    <!-- Wet/Darker tips of mop (showing it's doing work) -->
                    <g stroke="#AAB7B8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.5">
                         <path d="M-60,160 Q-65,170 -70,165" />
                         <path d="M20,170 Q25,180 30,175" />
                         <path d="M5,180 Q0,190 -5,185" />
                    </g>
                </g>
            </g>

            <!-- 4. Soap Bubbles / Magic -->
            <g transform="translate(500, 350)">
                <circle cx="0" cy="0" r="12" fill="rgba(255,255,255,0.4)" stroke="#FFF" stroke-width="1.5" class="bubble" />
                <circle cx="30" cy="-20" r="8" fill="rgba(255,255,255,0.4)" stroke="#FFF" stroke-width="1.5" class="bubble" />
                <circle cx="-15" cy="-40" r="18" fill="rgba(255,255,255,0.3)" stroke="#FFF" stroke-width="1.5" class="bubble" />
                <circle cx="50" cy="10" r="6" fill="rgba(255,255,255,0.4)" stroke="#FFF" stroke-width="1.5" class="bubble" />
            </g>

            <!-- 5. Ambient Light / Vignette -->
            <!-- Top Right Warm Glow -->
            <circle cx="900" cy="-100" r="400" fill="#E9C46A" opacity="0.15" filter="blur(80px)" pointer-events="none" />
            <!-- Bottom Left Cool Shadow -->
            <circle cx="0" cy="900" r="500" fill="#264653" opacity="0.05" filter="blur(100px)" pointer-events="none" />

        </svg>
    </div>
</div>

</body>
</html>
