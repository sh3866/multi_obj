<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess Interface</title>
    <style>
        :root {
            /* Palette: Deep Charcoal & Slate with "Royal" Accents */
            --bg-app: #090a0c;
            --bg-surface: #141619;
            --bg-surface-2: #1c1f24;
            --bg-hover: #262a30;
            
            --text-primary: #ececec;
            --text-secondary: #8b949e;
            --text-dim: #4b5363;
            
            --accent-primary: #eab308; /* Muted Gold */
            --accent-glow: rgba(234, 179, 8, 0.2);
            
            /* Board Palette: Refined "Classic" */
            --board-light: #ebecd0;
            --board-dark: #739953;
            
            /* Interaction */
            --highlight-move: rgba(234, 179, 8, 0.4);
            --highlight-last: rgba(234, 179, 8, 0.25);
            --highlight-check: radial-gradient(circle, rgba(255, 80, 80, 0.8) 0%, transparent 70%);
            
            /* Fonts */
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            /* Subtle texture overlay */
            background-image: radial-gradient(circle at 50% 0%, #1f2329 0%, var(--bg-app) 60%);
        }

        /* Layout */
        .app-container {
            display: flex;
            gap: 48px;
            padding: 40px;
            max-width: 1200px;
            width: 100%;
            align-items: stretch;
            justify-content: center;
        }

        /* --- Left: The Board --- */
        .board-container {
            position: relative;
            width: 700px;
            height: 700px;
            border-radius: 4px;
            /* Sophisticated shadow stack */
            box-shadow: 
                0 0 0 1px rgba(255,255,255,0.05),
                0 20px 60px rgba(0,0,0,0.6),
                0 0 120px rgba(0,0,0,0.3);
            background: var(--bg-surface);
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            user-select: none;
            position: relative;
            z-index: 2;
        }

        .square {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }

        /* Coordinates - Refined */
        .coord {
            position: absolute;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            font-family: var(--font-ui);
            pointer-events: none;
            opacity: 0.8;
        }
        .coord.rank { top: 4px; left: 5px; }
        .coord.file { bottom: 3px; right: 5px; }
        
        .square.light .coord { color: var(--board-dark); }
        .square.dark .coord { color: var(--board-light); }

        /* Highlights */
        .square.selected {
            background-color: rgba(255, 255, 255, 0.3) !important;
            box-shadow: inset 0 0 0 2px var(--accent-primary);
        }
        
        .square.last-move {
            background-color: var(--highlight-last);
        }
        
        /* Move Hints */
        .hint-move {
            width: 24%;
            height: 24%;
            background: rgba(0,0,0,0.15);
            border-radius: 50%;
            pointer-events: none;
        }
        .hint-capture {
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 0 4px rgba(0,0,0,0.15);
            position: absolute;
            pointer-events: none;
        }

        /* Pieces */
        .piece {
            width: 85%;
            height: 85%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            /* Soft drop shadow for depth */
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.3));
        }
        .piece:hover { transform: scale(1.08) translateY(-2px); }
        .piece:active { transform: scale(0.95); cursor: grabbing; }

        /* --- Right: Sidebar --- */
        .sidebar {
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .panel {
            background: var(--bg-surface);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        /* Header / Status */
        .game-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .turn-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 0 2px rgba(0,0,0,0.2);
            transition: background 0.3s ease;
        }
        .turn-indicator.black { background: #222; box-shadow: 0 0 0 2px rgba(255,255,255,0.1); }
        
        .status-text {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        
        .timer-display {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--bg-app);
            padding: 8px 14px;
            border-radius: 8px;
            color: var(--text-primary);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        /* History */
        .history-panel {
            flex: 1;
            min-height: 300px;
        }

        .panel-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
        }

        .move-list {
            flex: 1;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            /* Custom Scrollbar */
            scrollbar-width: thin;
            scrollbar-color: var(--bg-surface-2) transparent;
        }
        .move-list::-webkit-scrollbar { width: 4px; }
        .move-list::-webkit-scrollbar-thumb { background: var(--bg-surface-2); border-radius: 2px; }

        .move-row {
            display: flex;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .move-row:last-child { border-bottom: none; }
        
        .move-num {
            width: 32px;
            color: var(--text-dim);
            font-size: 0.85rem;
        }
        .move-cell {
            flex: 1;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .move-cell:hover { background: var(--bg-hover); color: #fff; }

        /* Controls */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-secondary);
            padding: 12px;
            border-radius: 8px;
            font-family: var(--font-ui);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--bg-surface-2);
            border-color: rgba(255,255,255,0.2);
            color: var(--text-primary);
        }

        .btn-primary {
            background: var(--accent-primary);
            color: #000;
            border: none;
            font-weight: 700;
            grid-column: span 2;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .btn-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        /* SVG Icons */
        .icon { width: 16px; height: 16px; fill: currentColor; }

        /* Responsive */
        @media (max-width: 1100px) {
            .app-container { flex-direction: column; align-items: center; padding: 20px; gap: 30px; }
            .board-container { width: 100%; max-width: 500px; height: auto; aspect-ratio: 1/1; }
            .sidebar { width: 100%; max-width: 500px; }
            body { overflow-y: auto; height: auto; }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- Left: Board -->
    <div class="board-container">
        <div class="board" id="chessboard"></div>
    </div>

    <!-- Right: Sidebar -->
    <div class="sidebar">
        
        <!-- Status Header -->
        <div class="panel">
            <div class="game-status">
                <div class="player-info">
                    <div class="turn-indicator" id="turnDot"></div>
                    <div>
                        <div class="status-text" id="statusText">White to Move</div>
                        <div style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px;">Classical • 10+0</div>
                    </div>
                </div>
                <div class="timer-display">10:00</div>
            </div>
        </div>

        <!-- History -->
        <div class="panel history-panel">
            <div class="panel-label">
                <span>Move History</span>
                <span style="opacity: 0.5;">PGN</span>
            </div>
            <div class="move-list" id="moveHistory">
                <!-- Moves injected here -->
            </div>
        </div>

        <!-- Controls -->
        <div class="panel" style="padding: 16px;">
            <div class="controls-grid">
                <button class="btn" onclick="resetGame()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                    Reset
                </button>
                <button class="btn">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                    Edit
                </button>
                <button class="btn btn-primary">New Game</button>
            </div>
        </div>
    </div>
</div>

    let turn = 'w'; 
    let selectedSquare = null;
    let lastMove = null; 

    // --- DOM Elements ---
    const boardEl = document.getElementById('chessboard');
    const moveHistoryEl = document.getElementById('moveHistory');
    const statusText = document.getElementById('statusText');
    const turnDot = document.getElementById('turnDot');

    // --- Rendering ---
    function renderBoard() {
        boardEl.innerHTML = '';
        
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                const isLight = (r + c) % 2 === 0;
                square.className = `square ${isLight ? 'light' : 'dark'}`;
                square.dataset.row = r;
                square.dataset.col = c;
                square.onclick = () => handleSquareClick(r, c);

                // Coordinates
                if (c === 0) {
                    const rank = document.createElement('span');
                    rank.className = 'coord rank';
                    rank.innerText = 8 - r;
                    square.appendChild(rank);
                }
                if (r === 7) {
                    const file = document.createElement('span');
                    file.className = 'coord file';
                    file.innerText = String.fromCharCode(97 + c);
                    square.appendChild(file);
                }

                // Last Move Highlight
                if (lastMove) {
                    if ((lastMove.fromR === r && lastMove.fromC === c) || 
                        (lastMove.toR === r && lastMove.toC === c)) {
                        square.classList.add('last-move');
                    }
                }

                // Piece
                const pieceCode = board[r][c];
                if (pieceCode) {
                    const piece = document.createElement('div');
                    piece.className = 'piece';
                    piece.innerHTML = SVG_PIECES[pieceCode];
                    square.appendChild(piece);
                }

                // Selection
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    square.classList.add('selected');
                }

                boardEl.appendChild(square);
            }
        }
    }

    function updateStatus() {
        const player = turn === 'w' ? 'White' : 'Black';
        statusText.innerText = `${player} to Move`;
        turnDot.className = `turn-indicator ${turn === 'w' ? 'white' : 'black'}`;
    }

    // --- Interaction ---
    function handleSquareClick(r, c) {
        const piece = board[r][c];
        const isOwnPiece = piece && piece.startsWith(turn);

        if (isOwnPiece) {
            selectedSquare = { r, c };
            renderBoard();
        } else if (selectedSquare) {
            movePiece(selectedSquare.r, selectedSquare.c, r, c);
        }
    }

    function movePiece(fromR, fromC, toR, toC) {
        const piece = board[fromR][fromC];
        
        // Update board state
        board[toR][toC] = piece;
        board[fromR][fromC] = '';
        
        // Update Last Move
        lastMove = { fromR, fromC, toR, toC };
        
        // Add move to history
        addMoveToHistory(piece, fromR, fromC, toR, toC);

        // Switch turn
        turn = turn === 'w' ? 'b' : 'w';
        selectedSquare = null;
        
        renderBoard();
        updateStatus();
    }

    function addMoveToHistory(piece, fromR, fromC, toR, toC) {
        const files = 'abcdefgh';
        const ranks = '87654321';
        
        // Simple notation generation
        const pieceChar = piece[1] === 'P' ? '' : piece[1].toUpperCase();
        const captureChar = board[toR][toC] !== '' ? 'x' : ''; // Note: board state already updated, simplistic check
        const notation = pieceChar + files[toC] + ranks[toR];

        const moveCount = Math.ceil((moveHistoryEl.children.length + 1) / 2);
        
        if (turn === 'b') { // White just moved (turn variable is already toggled in movePiece, so checking turn == b means White just played)
             // Create new row
            const row = document.createElement('div');
            row.className = 'move-row';
            row.innerHTML = `
                <div class="move-num">${moveCount}.</div>
                <div class="move-cell move-white">${notation}</div>
                <div class="move-cell move-black"></div>
            `;
            moveHistoryEl.appendChild(row);
        } else { // Black just moved
            const lastRow = moveHistoryEl.lastElementChild;
            if (lastRow) {
                lastRow.querySelector('.move-black').innerText = notation;
            }
        }
        
        moveHistoryEl.scrollTop = moveHistoryEl.scrollHeight;
    }

    function resetGame() {
        board = JSON.parse(JSON.stringify(initialBoard));
        turn = 'w';
        selectedSquare = null;
        lastMove = null;
        moveHistoryEl.innerHTML = '';
        renderBoard();
        updateStatus();
    }

    // --- Init ---
    renderBoard();
    updateStatus();

</script>
</body>
</html>
