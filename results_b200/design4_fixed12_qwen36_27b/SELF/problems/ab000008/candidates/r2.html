<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM EDITION</title>
    <style>
        :root {
            --c-bg: #05000a;
            --c-primary: #ff00ff;
            --c-secondary: #00ffff;
            --c-accent: #ffe600;
            --c-sun-top: #ffaa00;
            --c-sun-bot: #ff00ff;
            --c-hit: #ffffff;
            --font-main: 'Courier New', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--c-bg);
            color: white;
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- BACKGROUND CANVAS --- */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --- CRT & VIGNETTE --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            background: 
                /* Scanlines */
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                /* Vignette */
                radial-gradient(circle at center, transparent 60%, black 100%);
            background-size: 100% 4px, 100% 100%;
        }

        /* --- MAIN STAGE --- */
        .main-stage {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        /* --- TITLE --- */
        .title-container {
            text-align: center;
            margin-bottom: 40px;
            transform: translateZ(100px);
            position: relative;
            filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.5));
        }

        h1 {
            font-size: 6rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -4px;
            line-height: 0.9;
            color: #fff;
            position: relative;
            /* Improved Neon Look */
            text-shadow: 
                4px 4px 0px var(--c-primary),
                -2px -2px 0px var(--c-secondary),
                0 0 20px rgba(255, 255, 255, 0.8);
            animation: titleFloat 6s ease-in-out infinite;
        }

        /* Glitch effect pseudo-elements */
        h1::before, h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.8;
        }
        h1::before {
            color: var(--c-primary);
            z-index: -1;
            transform: translate(-3px, -2px);
            clip-path: inset(0 0 0 0);
            animation: glitch1 4s infinite linear alternate-reverse;
        }
        h1::after {
            color: var(--c-secondary);
            z-index: -2;
            transform: translate(3px, 2px);
            clip-path: inset(0 0 0 0);
            animation: glitch2 3.5s infinite linear alternate-reverse;
        }

        .subtitle {
            display: block;
            font-size: 1.8rem;
            letter-spacing: 0.8em;
            color: var(--c-secondary);
            text-shadow: 0 0 10px var(--c-secondary);
            margin-top: 10px;
            background: rgba(0,0,0,0.8);
            padding: 8px 20px;
            border: 1px solid var(--c-secondary);
            box-shadow: 0 0 15px var(--c-secondary), inset 0 0 15px rgba(0, 255, 255, 0.2);
            transform: skewX(-15deg);
        }

        /* --- HIGHWAY PREVIEW --- */
        .highway-wrapper {
            position: relative;
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            perspective: 800px;
            margin-bottom: 80px;
        }

        .highway {
            position: relative;
            width: 320px;
            height: 250px;
            /* The 3D tilt - adjusted for better visibility */
            transform: rotateX(60deg) rotateZ(-15deg);
            transform-origin: bottom center;
            background: rgba(10, 0, 20, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 30px var(--c-primary), inset 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            backdrop-filter: blur(2px);
        }

        .lane {
            flex: 1;
            height: 100%;
            border-right: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }
        .lane:last-child { border-right: none; }

        /* Moving Grid Lines within Highway */
        .lane::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 200%;
            background-image: linear-gradient(to bottom, transparent 50%, rgba(0, 255, 255, 0.2) 50%);
            background-size: 100% 50px;
            animation: laneScroll 0.8s linear infinite;
        }

        .hit-line {
            position: absolute;
            bottom: 20px;
            left: -5px; width: calc(100% + 10px);
            height: 6px;
            background: white;
            box-shadow: 0 0 20px 5px white;
            z-index: 10;
        }

        /* Notes */
        .note {
            position: absolute;
            width: 80%;
            height: 30px;
            left: 10%;
            border-radius: 4px;
            box-shadow: 0 0 15px currentColor;
            opacity: 0.95;
            animation: noteFall 2s linear forwards;
            border: 1px solid white;
        }

        /* --- CONTROLS --- */
        .controls {
            display: flex;
            gap: 40px;
            transform: translateZ(50px);
        }

        .btn {
            background: rgba(0,0,0,0.6);
            border: 2px solid white;
            color: white;
            padding: 18px 60px;
            font-family: var(--font-main);
            font-size: 1.4rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            /* Retro angled cut corners */
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }

        .btn:hover {
            background: white;
            color: black;
            box-shadow: 0 0 25px white;
            transform: scale(1.05);
        }

        .btn-start {
            border-color: var(--c-primary);
            color: var(--c-primary);
            box-shadow: 0 0 15px var(--c-primary);
            background: rgba(50, 0, 50, 0.6);
        }
        .btn-start:hover {
            background: var(--c-primary);
            color: white;
            box-shadow: 0 0 40px var(--c-primary);
        }

        /* --- ANIMATIONS --- */
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes laneScroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(50%); }
        }

        @keyframes noteFall {
            0% { top: -40px; opacity: 0; transform: scale(0.8); }
            10% { opacity: 1; transform: scale(1); }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; transform: scale(1.1); }
        }

        @keyframes glitch1 {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            40% { clip-path: inset(10% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(30% 0 20% 0); }
            100% { clip-path: inset(50% 0 30% 0); }
        }
        @keyframes glitch2 {
            0% { clip-path: inset(10% 0 60% 0); }
            20% { clip-path: inset(30% 0 20% 0); }
            40% { clip-path: inset(80% 0 5% 0); }
            60% { clip-path: inset(10% 0 80% 0); }
            80% { clip-path: inset(50% 0 10% 0); }
            100% { clip-path: inset(0% 0 70% 0); }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            .highway-wrapper { transform: scale(0.8); margin-bottom: 40px; }
            .controls { flex-direction: column; gap: 20px; }
            .subtitle { font-size: 1.2rem; letter-spacing: 0.4em; }
        }
    </style>
</head>
<body>

    <!-- Background rendering -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- CRT Scanline & Vignette Overlay -->
    <div class="overlay"></div>

    <div class="main-stage">
        <div class="title-container">
            <h1 data-text="PIXEL DANCE">PIXEL<br>DANCE</h1>
            <span class="subtitle">RHYTHM EDITION</span>
        </div>

        <!-- The 3D Highway Preview -->
        <div class="highway-wrapper">
            <div class="highway" id="highway">
                <div class="lane" id="l1"></div>
                <div class="lane" id="l2"></div>
                <div class="lane" id="l3"></div>
                <div class="lane" id="l4"></div>
                <div class="hit-line"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-start" onclick="startGame()">START GAME</button>
            <button class="btn">OPTIONS</button>
        </div>
    </div>

    <script>
        /**
         * VISUAL ENGINE
         * High-performance Canvas rendering for the Synthwave background
         */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // State
        let time = 0;
        const gridSpeed = 3.0;

        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Colors
        const COL_BG_TOP = '#05000a';
        const COL_BG_BOT = '#2a003b';
        const COL_SUN_TOP = '#ffaa00';
        const COL_SUN_BOT = '#ff00ff';
        const COL_GRID = '#ff00ff';

        function drawBackground() {
            // 1. Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, COL_BG_TOP);
            grad.addColorStop(0.5, '#1a0033');
            grad.addColorStop(1, COL_BG_BOT);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. The Sun (Retro Style)
            const cx = width / 2;
            const cy = height * 0.35;
            const r = Math.min(width, height) * 0.25;

            // Sun Glow
            ctx.save();
            ctx.shadowBlur = 80;
            ctx.shadowColor = COL_SUN_BOT;
            
            const sunGrad = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
            sunGrad.addColorStop(0, COL_SUN_TOP);
            sunGrad.addColorStop(1, COL_SUN_BOT);

            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = sunGrad;
            ctx.fill();
            ctx.restore();

            // Sun Stripes (The Cutout Effect)
            ctx.save();
            ctx.beginPath();
            // Draw stripes below the sun
            ctx.fillStyle = '#1a0033'; // Match the sky color roughly to "cut out"
            // We use a clip path to only draw stripes inside the sun
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();
            
            // Draw horizontal lines with varying thickness
            for(let i = 0; i < 20; i++) {
                let y = cy + (i * 6) + 30;
                let h = 2 + (i * 0.8);
                ctx.fillRect(cx - r, y, r * 2, h);
            }
            ctx.restore();

            // 3. Stars
            ctx.fillStyle = 'white';
            for(let i=0; i<100; i++) {
                const sx = (Math.sin(i * 123.45) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 67.89) * 0.5 + 0.5) * (height * 0.5);
                const size = (i % 3 === 0) ? 2 : 1;
                const alpha = Math.abs(Math.sin(time * 0.02 + i));
                ctx.globalAlpha = alpha;
                ctx.fillRect(sx, sy, size, size);
            }
            ctx.globalAlpha = 1.0;

            // 4. Perspective Grid (Floor)
            const horizonY = height * 0.5;
            const vanishX = width / 2;
            
            ctx.strokeStyle = COL_GRID;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 15;
            ctx.shadowColor = COL_GRID;
            
            ctx.beginPath();

            // Vertical Perspective Lines
            const numLines = 25;
            for (let i = -numLines; i <= numLines; i++) {
                // Calculate x position at the horizon (compressed) and bottom (expanded)
                let x1 = vanishX + (i * 10); 
                let x2 = vanishX + (i * (width / numLines)); 
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
            }

            // Horizontal Moving Lines
            const offset = (time * gridSpeed) % 40;
            
            for (let i = 0; i < 25; i++) {
                let z = (i * 20) - offset;
                
                if (z > 0) {
                    // Exponential curve for depth perception
                    let perspectiveY = horizonY + (height - horizonY) * Math.pow(z / 400, 2.2);

                    if (perspectiveY > horizonY && perspectiveY < height) {
                        ctx.moveTo(0, perspectiveY);
                        ctx.lineTo(width, perspectiveY);
                    }
                }
            }
            ctx.stroke();
        }

        // --- NOTE SPAWNER LOGIC ---
        const lanes = [
            document.getElementById('l1'),
            document.getElementById('l2'),
            document.getElementById('l3'),
            document.getElementById('l4')
        ];
        const colors = ['#ff00ff', '#00ffff', '#ffe600', '#ff00ff'];

        function spawnNote() {
            const laneIdx = Math.floor(Math.random() * 4);
            const lane = lanes[laneIdx];
            
            const note = document.createElement('div');
            note.className = 'note';
            note.style.backgroundColor = colors[laneIdx];
            note.style.color = colors[laneIdx]; 
            
            lane.appendChild(note);

            // Cleanup after animation
            setTimeout(() => {
                if(note.parentNode) note.remove();
            }, 2000);
        }

        // Main Loop
        function loop() {
            time++;
            drawBackground();
            
            // Random note spawning with rhythm
            if (Math.random() < 0.06) {
                spawnNote();
            }

            requestAnimationFrame(loop);
        }

        function startGame() {
            // Visual feedback for click
            document.body.style.cursor = 'wait';
            // In a real app, this would transition to the game state
            const btn = document.querySelector('.btn-start');
            btn.innerHTML = "LOADING...";
            setTimeout(() => {
                alert("INITIALIZING SEQUENCE...");
                btn.innerHTML = "START GAME";
                document.body.style.cursor = 'default';
            }, 300);
        }

        // Start
        loop();

    </script>
</body>
</html>
