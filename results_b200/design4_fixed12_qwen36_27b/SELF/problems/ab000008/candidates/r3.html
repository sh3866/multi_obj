<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM EDITION</title>
    <style>
        :root {
            --c-bg-top: #050010;
            --c-bg-bot: #2a003b;
            --c-magenta: #ff00ff;
            --c-cyan: #00ffff;
            --c-yellow: #ffea00;
            --c-white: #ffffff;
            --c-dark: #0a0a0a;
            
            --font-pixel: 'Courier New', Courier, monospace; /* Fallback, but we use pixel-art rendering */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

        body {
            background-color: var(--c-bg-top);
            color: var(--c-white);
            font-family: var(--font-pixel);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- CANVAS LAYERS --- */
        #bg-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        #note-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none; /* Let clicks pass through to buttons */
        }

        /* --- UI OVERLAY --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allow clicks to pass to interactive elements */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 0 80px 0;
        }

        /* --- HEADER / TITLE --- */
        .header {
            text-align: center;
            margin-top: 20px;
            pointer-events: auto;
            position: relative;
        }

        .title-group {
            position: relative;
            display: inline-block;
        }

        h1 {
            font-size: 5rem;
            line-height: 1;
            text-transform: uppercase;
            color: var(--c-white);
            letter-spacing: -2px;
            /* Hard shadow for pixel look */
            text-shadow: 
                4px 4px 0px var(--c-magenta),
                -2px -2px 0px var(--c-cyan);
            /* Neon Glow */
            filter: drop-shadow(0 0 15px rgba(255, 0, 255, 0.6));
            animation: titlePulse 4s ease-in-out infinite;
            margin: 0;
        }

        .subtitle {
            display: block;
            font-size: 1.5rem;
            letter-spacing: 0.5em;
            color: var(--c-cyan);
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 24px;
            border: 1px solid var(--c-cyan);
            box-shadow: 0 0 10px var(--c-cyan), inset 0 0 10px rgba(0, 255, 255, 0.2);
            transform: skewX(-15deg);
            display: inline-block;
            text-shadow: 0 0 5px var(--c-cyan);
        }

        /* Decorative glitch lines */
        .glitch-line {
            position: absolute;
            background: var(--c-magenta);
            height: 4px;
            width: 100px;
            top: 50%;
            left: -120px;
            box-shadow: 0 0 10px var(--c-magenta);
            animation: glitchWidth 3s infinite;
        }
        .glitch-line.right {
            left: auto;
            right: -120px;
            background: var(--c-cyan);
            box-shadow: 0 0 10px var(--c-cyan);
            animation-delay: 1.5s;
        }

        /* --- BUTTONS --- */
        .controls {
            display: flex;
            gap: 30px;
            pointer-events: auto;
            z-index: 20;
            margin-bottom: 40px;
        }

        .btn {
            background: rgba(0, 0, 0, 0.8);
            color: var(--c-white);
            font-family: var(--font-pixel);
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 15px 40px;
            border: 2px solid var(--c-white);
            cursor: pointer;
            position: relative;
            transition: all 0.1s ease;
            /* Cut corners */
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .btn-start {
            border-color: var(--c-magenta);
            color: var(--c-magenta);
            box-shadow: 0 0 15px var(--c-magenta), inset 0 0 15px rgba(255, 0, 255, 0.2);
        }

        .btn-start:hover {
            background: var(--c-magenta);
            color: var(--c-white);
            box-shadow: 0 0 30px var(--c-magenta);
            transform: translateY(-2px);
        }

        .btn-options:hover {
            background: var(--c-white);
            color: var(--c-black);
            box-shadow: 0 0 20px var(--c-white);
        }

        /* --- CRT & VIGNETTE --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            pointer-events: none;
            background: 
                /* Scanlines */
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%),
                /* Vignette */
                radial-gradient(circle at center, transparent 50%, black 120%);
            background-size: 100% 4px, 100% 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        /* --- ANIMATIONS --- */
        @keyframes titlePulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 0, 255, 0.6)); }
            50% { transform: scale(1.02); filter: drop-shadow(0 0 25px rgba(255, 0, 255, 0.9)); }
        }

        @keyframes glitchWidth {
            0%, 100% { width: 100px; opacity: 1; }
            50% { width: 120px; opacity: 0.8; }
            51% { width: 90px; opacity: 0.2; }
            52% { width: 100px; opacity: 1; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .controls { flex-direction: column; width: 80%; }
            .btn { width: 100%; }
            .subtitle { font-size: 1rem; letter-spacing: 0.2em; }
        }
    </style>
</head>
<body>

    <!-- Visuals -->
    <canvas id="bg-canvas"></canvas>
    <canvas id="note-canvas"></canvas>
    <div class="overlay"></div>

    <!-- UI -->
    <div class="ui-layer">
        <div class="header">
            <div class="title-group">
                <div class="glitch-line"></div>
                <div class="glitch-line right"></div>
                <h1>PIXEL<br>DANCE</h1>
                <div class="subtitle">RHYTHM EDITION</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-start" onclick="startGame()">START GAME</button>
            <button class="btn btn-options" onclick="showOptions()">OPTIONS</button>
        </div>
    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Handles the Synthwave background and the 3D Highway notes
         */
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        
        const noteCanvas = document.getElementById('note-canvas');
        const noteCtx = noteCanvas.getContext('2d');
        
        let width, height;
        let time = 0;
        const gridSpeed = 2.0;
        const horizonYRatio = 0.45; // Horizon is at 45% of screen height

        // Note Logic
        const notes = [];
        const colors = ['#ff00ff', '#00ffff', '#ffea00', '#ff00ff']; // Magenta, Cyan, Yellow, Magenta

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            
            // High DPI scaling
            const dpr = window.devicePixelRatio || 1;
            
            bgCanvas.width = width * dpr;
            bgCanvas.height = height * dpr;
            bgCtx.scale(dpr, dpr);
            
            noteCanvas.width = width * dpr;
            noteCanvas.height = height * dpr;
            noteCtx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        // --- DRAW BACKGROUND (Sun, Stars, Grid) ---
        function drawBackground() {
            // 1. Sky Gradient
            const grad = bgCtx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#050010');
            grad.addColorStop(0.5, '#1a0033');
            grad.addColorStop(1, '#2a003b');
            bgCtx.fillStyle = grad;
            bgCtx.fillRect(0, 0, width, height);

            // 2. The Sun
            const cx = width / 2;
            const cy = height * horizonYRatio;
            const r = Math.min(width, height) * 0.22;

            // Sun Glow
            bgCtx.save();
            bgCtx.shadowBlur = 60;
            bgCtx.shadowColor = '#ff00ff';
            
            const sunGrad = bgCtx.createLinearGradient(cx, cy - r, cx, cy + r);
            sunGrad.addColorStop(0, '#ffea00');
            sunGrad.addColorStop(1, '#ff00ff');

            bgCtx.beginPath();
            bgCtx.arc(cx, cy, r, 0, Math.PI * 2);
            bgCtx.fillStyle = sunGrad;
            bgCtx.fill();
            bgCtx.restore();

            // Sun Stripes (Cutout effect)
            bgCtx.save();
            bgCtx.beginPath();
            bgCtx.arc(cx, cy, r, 0, Math.PI * 2);
            bgCtx.clip();
            
            // Draw lines matching the sky color to create "cuts"
            bgCtx.fillStyle = '#1a0033'; // Sky color at horizon
            // Thicker lines at bottom, thinner at top
            for(let i = 0; i < 25; i++) {
                // Quadratic curve to position lines further apart at bottom
                let progress = i / 25; 
                let y = cy + (progress * r * 0.8) + 10;
                let h = 2 + (progress * 8); 
                bgCtx.fillRect(cx - r, y, r * 2, h);
            }
            bgCtx.restore();

            // 3. Stars
            bgCtx.fillStyle = 'white';
            for(let i=0; i<150; i++) {
                const sx = (Math.sin(i * 123.45) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 67.89) * 0.5 + 0.5) * (height * horizonYRatio);
                const size = (i % 3 === 0) ? 2 : 1;
                const alpha = Math.abs(Math.sin(time * 0.05 + i));
                bgCtx.globalAlpha = alpha;
                bgCtx.fillRect(sx, sy, size, size);
            }
            bgCtx.globalAlpha = 1.0;

            // 4. Perspective Grid (Floor)
            const horizonY = height * horizonYRatio;
            const vanishX = width / 2;
            
            bgCtx.strokeStyle = '#ff00ff';
            bgCtx.lineWidth = 2;
            bgCtx.shadowBlur = 10;
            bgCtx.shadowColor = '#ff00ff';
            
            bgCtx.beginPath();

            // Vertical Perspective Lines
            // We draw more lines near center, fewer at edges
            const numLines = 30;
            for (let i = -numLines; i <= numLines; i++) {
                // Use a sine curve to spread lines wider at bottom
                let x1 = vanishX + (i * 15); 
                let x2 = vanishX + (i * (width / (numLines/2))); 
                bgCtx.moveTo(x1, horizonY);
                bgCtx.lineTo(x2, height);
            }

            // Horizontal Moving Lines
            // We need to simulate Z-depth. Lines get closer together as they approach horizon.
            const offset = (time * gridSpeed) % 100;
            
            for (let i = 0; i < 30; i++) {
                // Map linear index to exponential depth
                let z = (i * 10) - offset;
                if (z < 0) continue; // Behind horizon
                
                // Simple perspective formula
                // y = horizon + (height - horizon) * (1 - 1/(z + constant))
                // Adjusting constants for visual fit
                let perspectiveY = horizonY + (height - horizonY) * (z / (z + 50));

                if (perspectiveY > horizonY && perspectiveY < height) {
                    bgCtx.moveTo(0, perspectiveY);
                    bgCtx.lineTo(width, perspectiveY);
                }
            }
            bgCtx.stroke();
        }

        // --- DRAW 3D HIGHWAY & NOTES ---
        function drawHighway() {
            noteCtx.clearRect(0, 0, width, height);

            const horizonY = height * horizonYRatio;
            const vanishX = width / 2;
            const highwayWidth = width * 0.4; // Width at bottom
            const highwayStartY = height;
            const highwayEndY = horizonY + 20; // Slightly above horizon

            // Highway Colors
            const laneColor = 'rgba(10, 0, 20, 0.85)';
            const borderColor = 'rgba(255, 255, 255, 0.5)';
            const hitLineColor = '#ffffff';

            // --- 1. Draw The Highway Floor ---
            noteCtx.save();
            
            // Define the 4 lanes
            // We calculate X coordinates at bottom (y=height) and top (y=horizon)
            // Bottom: spread out. Top: converge at vanishX.
            
            const lanes = 4;
            const laneWidthBot = highwayWidth / lanes;
            
            // Draw background of the highway
            noteCtx.fillStyle = laneColor;
            noteCtx.beginPath();
            noteCtx.moveTo(vanishX - 5, highwayEndY); // Top Left
            noteCtx.lineTo(vanishX + 5, highwayEndY); // Top Right
            noteCtx.lineTo(vanishX + highwayWidth/2, highwayStartY); // Bottom Right
            noteCtx.lineTo(vanishX - highwayWidth/2, highwayStartY); // Bottom Left
            noteCtx.closePath();
            noteCtx.fill();

            // Draw Lane Dividers
            noteCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            noteCtx.lineWidth = 2;
            noteCtx.beginPath();
            
            for(let i=1; i<lanes; i++) {
                // Calculate X at bottom
                let xBot = (vanishX - highwayWidth/2) + (i * laneWidthBot);
                // Calculate X at top (converge slightly)
                let xTop = vanishX + ((xBot - vanishX) * 0.1); // 0.1 is the convergence factor

                noteCtx.moveTo(xBot, highwayStartY);
                noteCtx.lineTo(xTop, highwayEndY);
            }
            noteCtx.stroke();

            // Draw Side Borders
            noteCtx.strokeStyle = borderColor;
            noteCtx.lineWidth = 4;
            noteCtx.shadowBlur = 15;
            noteCtx.shadowColor = '#00ffff';
            noteCtx.beginPath();
            // Left
            noteCtx.moveTo(vanishX - highwayWidth/2, highwayStartY);
            noteCtx.lineTo(vanishX - 5, highwayEndY);
            // Right
            noteCtx.moveTo(vanishX + highwayWidth/2, highwayStartY);
            noteCtx.lineTo(vanishX + 5, highwayEndY);
            noteCtx.stroke();
            
            // Draw Hit Line
            noteCtx.strokeStyle = hitLineColor;
            noteCtx.lineWidth = 6;
            noteCtx.shadowColor = '#ffffff';
            noteCtx.shadowBlur = 20;
            
            // Hit line is at a specific Y (e.g., 85% down the screen)
            const hitLineY = height * 0.85;
            noteCtx.beginPath();
            
            // Calculate width of highway at hitLineY
            // Interpolate between bot and top
            const t = (hitLineY - highwayEndY) / (highwayStartY - highwayEndY); // 0 at top, 1 at bottom
            // Actually, we want inverse t for perspective scaling usually, but let's just interpolate points
            
            // Simple linear interpolation of X based on Y
            const getHighwayHalfWidth = (y) => {
                const percent = (y - highwayEndY) / (highwayStartY - highwayEndY);
                return 5 + (percent * (highwayWidth/2 - 5));
            };
            
            const currentHalfWidth = getHighwayHalfWidth(hitLineY);
            
            noteCtx.moveTo(vanishX - currentHalfWidth, hitLineY);
            noteCtx.lineTo(vanishX + currentHalfWidth, hitLineY);
            noteCtx.stroke();

            noteCtx.restore();

            // --- 2. Draw Notes ---
            // Notes need to be drawn from furthest (top) to closest (bottom)
            // Sort by Z (0 = top, 1 = bottom)
            notes.sort((a, b) => a.z - b.z);

            notes.forEach(note => {
                // Calculate Note Position
                // Y position
                note.y = highwayEndY + (note.z * (highwayStartY - highwayEndY));
                
                // X position (interpolate width)
                const currentHalfWidth = getHighwayHalfWidth(note.y);
                const totalWidth = currentHalfWidth * 2;
                const laneWidth = totalWidth / lanes;
                
                // Center of the lane
                const laneCenter = (vanishX - currentHalfWidth) + (note.lane * laneWidth) + (laneWidth / 2);
                
                // Note Dimensions (scale with Z)
                const noteH = 15 + (note.z * 35); // Height grows as it gets closer
                const noteW = laneWidth * 0.8;
                
                // Draw Note
                noteCtx.fillStyle = note.color;
                noteCtx.shadowBlur = 15;
                noteCtx.shadowColor = note.color;
                
                // Pixel-art style note: simple rectangle with a lighter center
                noteCtx.fillRect(laneCenter - noteW/2, note.y - noteH/2, noteW, noteH);
                
                // Inner detail
                noteCtx.fillStyle = 'rgba(255,255,255,0.6)';
                noteCtx.shadowBlur = 0;
                noteCtx.fillRect(laneCenter - noteW/4, note.y - noteH/4, noteW/2, noteH/2);
            });
        }

        // --- NOTE SPAWNER ---
        function spawnNote() {
            const lane = Math.floor(Math.random() * 4);
            notes.push({
                lane: lane,
                z: 0, // Starts at horizon (0)
                color: colors[lane],
                active: true
            });
        }

        // --- MAIN LOOP ---
        function loop() {
            time++;
            
            drawBackground();
            drawHighway();

            // Update Notes
            // Move notes from z=0 (horizon) to z=1 (bottom)
            // Speed increases as z increases (perspective acceleration)
            for (let i = notes.length - 1; i >= 0; i--) {
                let n = notes[i];
                // Accelerate: delta = base_speed * (1 + z^2)
                n.z += 0.005 * (1 + n.z * n.z * 2); 
                
                if (n.z > 1.2) {
                    notes.splice(i, 1);
                }
            }

            // Spawn Logic (Rhythmic)
            // Simple beat: every ~40 frames (approx 600ms at 60fps)
            if (time % 40 === 0) {
                spawnNote();
                // Chance for double note
                if (Math.random() > 0.7) spawnNote();
            }

            requestAnimationFrame(loop);
        }

        // --- INTERACTION ---
        function startGame() {
            const btn = document.querySelector('.btn-start');
            btn.innerHTML = "LOADING...";
            // Simulate loading
            setTimeout(() => {
                alert("SYSTEM READY. INSERT COIN.");
                btn.innerHTML = "START GAME";
            }, 500);
        }

        function showOptions() {
            alert("MUSIC VOL: MAX\nSFX VOL: MAX\nDIFFICULTY: INSANE");
        }

        // Start
        loop();

    </script>
</body>
</html>
