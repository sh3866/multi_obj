<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL DANCE - RHYTHM EDITION</title>
    <style>
        :root {
            --c-bg-top: #02000a;
            --c-bg-bot: #1a0020;
            --c-magenta: #ff00ff;
            --c-cyan: #00ffff;
            --c-yellow: #ffea00;
            --c-white: #ffffff;
            --c-dark: #000000;
            
            /* Using a stack of system fonts that look closest to a pixel font */
            --font-stack: 'Courier New', 'Lucida Console', 'Courier', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

        body {
            background-color: var(--c-bg-top);
            color: var(--c-white);
            font-family: var(--font-stack);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- CANVAS LAYERS --- */
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        #bg-canvas { z-index: 1; }
        #note-canvas { z-index: 2; }

        /* --- UI OVERLAY --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 60px 0 80px 0;
            pointer-events: none; /* Let clicks pass through empty space */
        }

        /* --- HEADER / TITLE --- */
        .header {
            text-align: center;
            pointer-events: auto;
            position: relative;
            margin-top: 5vh;
        }

        h1 {
            font-size: 6rem;
            line-height: 0.9;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--c-white);
            letter-spacing: -4px;
            position: relative;
            /* The "Pixel" Look via CSS */
            text-shadow: 
                4px 4px 0px var(--c-magenta),
                -2px -2px 0px var(--c-cyan);
            animation: titleFloat 6s ease-in-out infinite;
        }

        /* Glitch Effect on Text */
        h1::before, h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--c-bg-top); /* Match bg to hide main text where glitch is */
            overflow: hidden;
            clip-path: inset(0 0 0 0);
        }
        
        h1::before {
            left: 2px;
            text-shadow: -2px 0 var(--c-magenta);
            animation: glitch-anim-1 3s infinite linear alternate-reverse;
            opacity: 0.7;
        }
        
        h1::after {
            left: -2px;
            text-shadow: -2px 0 var(--c-cyan);
            animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
            opacity: 0.7;
        }

        .subtitle {
            display: block;
            font-size: 1.2rem;
            letter-spacing: 0.6em;
            color: var(--c-cyan);
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 30px;
            border: 2px solid var(--c-cyan);
            box-shadow: 0 0 15px var(--c-cyan), inset 0 0 10px rgba(0, 255, 255, 0.3);
            transform: skewX(-20deg);
            text-shadow: 0 0 5px var(--c-cyan);
            font-weight: bold;
        }

        /* --- BUTTONS --- */
        .controls {
            display: flex;
            gap: 40px;
            pointer-events: auto;
            z-index: 20;
            margin-bottom: 20px;
        }

        .btn {
            background: rgba(0, 0, 0, 0.9);
            color: var(--c-white);
            font-family: var(--font-stack);
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            padding: 20px 50px;
            border: 2px solid var(--c-white);
            cursor: pointer;
            position: relative;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Sci-fi Cut Corners */
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .btn-start {
            border-color: var(--c-magenta);
            color: var(--c-magenta);
            text-shadow: 0 0 5px var(--c-magenta);
            box-shadow: 0 0 15px var(--c-magenta), inset 0 0 10px rgba(255, 0, 255, 0.2);
        }

        .btn-start:hover {
            background: var(--c-magenta);
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 40px var(--c-magenta);
            transform: scale(1.05);
        }

        .btn-options {
            border-color: var(--c-white);
            color: var(--c-white);
        }

        .btn-options:hover {
            background: var(--c-white);
            color: #000;
            box-shadow: 0 0 30px var(--c-white);
            transform: scale(1.05);
        }

        /* --- CRT OVERLAYS --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            pointer-events: none;
            background: 
                /* Scanlines */
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.15) 1px,
                    transparent 1px,
                    transparent 3px
                ),
                /* Vignette */
                radial-gradient(circle at center, transparent 40%, black 100%);
            box-shadow: inset 0 0 150px rgba(0,0,0,0.8);
        }

        /* --- ANIMATIONS --- */
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            40% { clip-path: inset(10% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(30% 0 40% 0); }
            100% { clip-path: inset(50% 0 30% 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); }
            20% { clip-path: inset(30% 0 20% 0); }
            40% { clip-path: inset(70% 0 10% 0); }
            60% { clip-path: inset(20% 0 50% 0); }
            80% { clip-path: inset(50% 0 30% 0); }
            100% { clip-path: inset(0% 0 80% 0); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; letter-spacing: -1px; }
            .controls { flex-direction: column; width: 80%; gap: 20px; }
            .btn { width: 100%; padding: 15px; }
            .subtitle { font-size: 0.9rem; letter-spacing: 0.3em; }
        }
    </style>
</head>
<body>

    <!-- Visuals -->
    <canvas id="bg-canvas"></canvas>
    <canvas id="note-canvas"></canvas>
    <div class="overlay"></div>

    <!-- UI -->
    <div class="ui-layer">
        <div class="header">
            <div class="title-group">
                <h1 data-text="PIXEL DANCE">PIXEL<br>DANCE</h1>
                <div class="subtitle">RHYTHM EDITION</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-start" onclick="startGame()">START GAME</button>
            <button class="btn btn-options" onclick="showOptions()">OPTIONS</button>
        </div>
    </div>

    <script>
        /**
         * VISUAL ENGINE
         * Handles the Synthwave background and the 3D Highway notes
         */
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        
        const noteCanvas = document.getElementById('note-canvas');
        const noteCtx = noteCanvas.getContext('2d');
        
        let width, height;
        let time = 0;
        const gridSpeed = 3.5; // Faster grid for more energy
        const horizonYRatio = 0.45; 

        // Note Logic
        const notes = [];
        const colors = ['#ff00ff', '#00ffff', '#ffea00', '#ff00ff']; // Magenta, Cyan, Yellow, Magenta

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            
            // High DPI scaling
            const dpr = window.devicePixelRatio || 1;
            
            bgCanvas.width = width * dpr;
            bgCanvas.height = height * dpr;
            bgCtx.scale(dpr, dpr);
            
            noteCanvas.width = width * dpr;
            noteCanvas.height = height * dpr;
            noteCtx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        // --- DRAW BACKGROUND (Sun, Stars, Grid) ---
        function drawBackground() {
            // 1. Sky Gradient (Darker, richer)
            const grad = bgCtx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#02000a');
            grad.addColorStop(0.4, '#1a0033');
            grad.addColorStop(1, '#2a003b');
            bgCtx.fillStyle = grad;
            bgCtx.fillRect(0, 0, width, height);

            // 2. The Sun (More detailed)
            const cx = width / 2;
            const cy = height * horizonYRatio;
            const r = Math.min(width, height) * 0.25;

            // Sun Glow
            bgCtx.save();
            bgCtx.shadowBlur = 80;
            bgCtx.shadowColor = '#ff00ff';
            
            const sunGrad = bgCtx.createLinearGradient(cx, cy - r, cx, cy + r);
            sunGrad.addColorStop(0, '#ffea00');
            sunGrad.addColorStop(0.4, '#ff00ff');
            sunGrad.addColorStop(1, '#aa00aa');

            bgCtx.beginPath();
            bgCtx.arc(cx, cy, r, 0, Math.PI * 2);
            bgCtx.fillStyle = sunGrad;
            bgCtx.fill();
            bgCtx.restore();

            // Sun Stripes (Cutout effect)
            bgCtx.save();
            bgCtx.beginPath();
            bgCtx.arc(cx, cy, r, 0, Math.PI * 2);
            bgCtx.clip();
            
            // Draw lines matching the sky color to create "cuts"
            bgCtx.fillStyle = '#1a0033'; // Sky color at horizon
            for(let i = 0; i < 20; i++) {
                let progress = i / 20; 
                // Curved spacing for retro look
                let y = cy + (progress * r * 0.7) + 5;
                let h = 3 + (progress * 12); 
                bgCtx.fillRect(cx - r, y, r * 2, h);
            }
            bgCtx.restore();

            // 3. Stars (Twinkling)
            bgCtx.fillStyle = 'white';
            for(let i=0; i<100; i++) {
                const sx = (Math.sin(i * 123.45) * 0.5 + 0.5) * width;
                const sy = (Math.cos(i * 67.89) * 0.5 + 0.5) * (height * horizonYRatio * 0.8);
                const size = (i % 5 === 0) ? 2 : 1;
                // Twinkle effect
                const alpha = Math.abs(Math.sin(time * 0.05 + i));
                bgCtx.globalAlpha = alpha;
                bgCtx.fillRect(sx, sy, size, size);
            }
            bgCtx.globalAlpha = 1.0;

            // 4. Perspective Grid (Floor)
            const horizonY = height * horizonYRatio;
            const vanishX = width / 2;
            
            bgCtx.strokeStyle = '#ff00ff';
            bgCtx.lineWidth = 2;
            // Stronger neon glow
            bgCtx.shadowBlur = 15;
            bgCtx.shadowColor = '#ff00ff';
            
            bgCtx.beginPath();

            // Vertical Perspective Lines
            // Use a curve to spread them out
            const numLines = 40;
            for (let i = -numLines; i <= numLines; i++) {
                let x1 = vanishX + (i * 5); 
                // Spread out wildly at bottom
                let x2 = vanishX + (i * (width / 15)); 
                bgCtx.moveTo(x1, horizonY);
                bgCtx.lineTo(x2, height);
            }

            // Horizontal Moving Lines
            // Exponential spacing for depth
            const offset = (time * gridSpeed) % 100;
            
            for (let i = 0; i < 40; i++) {
                let z = (i * 10) - offset;
                if (z < 0) continue; 
                
                // Perspective math: y = h + (H-h) * (z / (z + k))
                // k controls the "depth" feel
                let perspectiveY = horizonY + (height - horizonY) * (z / (z + 40));

                if (perspectiveY > horizonY && perspectiveY < height) {
                    bgCtx.moveTo(0, perspectiveY);
                    bgCtx.lineTo(width, perspectiveY);
                }
            }
            bgCtx.stroke();
        }

        // --- DRAW 3D HIGHWAY & NOTES ---
        function drawHighway() {
            noteCtx.clearRect(0, 0, width, height);

            const horizonY = height * horizonYRatio;
            const vanishX = width / 2;
            const highwayWidth = width * 0.5; // Wider highway
            const highwayStartY = height;
            const highwayEndY = horizonY + 10; // Meet horizon

            // --- 1. Draw The Highway Floor ---
            noteCtx.save();
            
            const lanes = 4;
            const laneWidthBot = highwayWidth / lanes;
            
            // Draw background of the highway (Dark, semi-transparent)
            noteCtx.fillStyle = 'rgba(5, 0, 15, 0.85)';
            noteCtx.beginPath();
            noteCtx.moveTo(vanishX - 2, highwayEndY); // Top Left (pinch)
            noteCtx.lineTo(vanishX + 2, highwayEndY); // Top Right (pinch)
            noteCtx.lineTo(vanishX + highwayWidth/2, highwayStartY); // Bottom Right
            noteCtx.lineTo(vanishX - highwayWidth/2, highwayStartY); // Bottom Left
            noteCtx.closePath();
            noteCtx.fill();

            // Draw Lane Dividers
            noteCtx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            noteCtx.lineWidth = 2;
            noteCtx.shadowBlur = 0;
            noteCtx.beginPath();
            
            for(let i=1; i<lanes; i++) {
                // Calculate X at bottom
                let xBot = (vanishX - highwayWidth/2) + (i * laneWidthBot);
                // Calculate X at top (converge)
                let xTop = vanishX + ((xBot - vanishX) * 0.05); 

                noteCtx.moveTo(xBot, highwayStartY);
                noteCtx.lineTo(xTop, highwayEndY);
            }
            noteCtx.stroke();

            // Draw Side Borders (Glowing)
            noteCtx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            noteCtx.lineWidth = 4;
            noteCtx.shadowBlur = 20;
            noteCtx.shadowColor = '#00ffff';
            noteCtx.beginPath();
            // Left
            noteCtx.moveTo(vanishX - highwayWidth/2, highwayStartY);
            noteCtx.lineTo(vanishX - 2, highwayEndY);
            // Right
            noteCtx.moveTo(vanishX + highwayWidth/2, highwayStartY);
            noteCtx.lineTo(vanishX + 2, highwayEndY);
            noteCtx.stroke();
            
            // Draw Hit Line (The "Target")
            const hitLineY = height * 0.85;
            noteCtx.strokeStyle = '#ffffff';
            noteCtx.lineWidth = 6;
            noteCtx.shadowColor = '#ffffff';
            noteCtx.shadowBlur = 25;
            
            noteCtx.beginPath();
            
            // Calculate width of highway at hitLineY
            // Linear interpolation of width based on Y position
            const getHighwayHalfWidth = (y) => {
                // t goes from 0 (top) to 1 (bottom)
                const t = (y - highwayEndY) / (highwayStartY - highwayEndY);
                // Width goes from ~0 to highwayWidth/2
                return 2 + (t * (highwayWidth/2 - 2));
            };
            
            const currentHalfWidth = getHighwayHalfWidth(hitLineY);
            
            noteCtx.moveTo(vanishX - currentHalfWidth, hitLineY);
            noteCtx.lineTo(vanishX + currentHalfWidth, hitLineY);
            noteCtx.stroke();

            noteCtx.restore();

            // --- 2. Draw Notes ---
            // Sort by Z (furthest first)
            notes.sort((a, b) => a.z - b.z);

            notes.forEach(note => {
                // Calculate Note Position
                note.y = highwayEndY + (note.z * (highwayStartY - highwayEndY));
                
                const currentHalfWidth = getHighwayHalfWidth(note.y);
                const totalWidth = currentHalfWidth * 2;
                const laneWidth = totalWidth / lanes;
                
                // Center of the lane
                const laneCenter = (vanishX - currentHalfWidth) + (note.lane * laneWidth) + (laneWidth / 2);
                
                // Note Dimensions (scale with Z)
                const noteH = 10 + (note.z * 40); 
                const noteW = laneWidth * 0.7;
                
                // Draw Note (Pixel Style)
                noteCtx.fillStyle = note.color;
                noteCtx.shadowBlur = 20;
                noteCtx.shadowColor = note.color;
                
                // Main block
                noteCtx.fillRect(laneCenter - noteW/2, note.y - noteH/2, noteW, noteH);
                
                // Inner "Pixel" highlight
                noteCtx.fillStyle = 'rgba(255,255,255,0.8)';
                noteCtx.shadowBlur = 0;
                noteCtx.fillRect(laneCenter - noteW/4, note.y - noteH/4, noteW/2, noteH/2);
            });
        }

        // --- NOTE SPAWNER ---
        function spawnNote() {
            const lane = Math.floor(Math.random() * 4);
            notes.push({
                lane: lane,
                z: 0, // Starts at horizon (0)
                color: colors[lane],
                active: true
            });
        }

        // --- MAIN LOOP ---
        function loop() {
            time++;
            
            drawBackground();
            drawHighway();

            // Update Notes
            for (let i = notes.length - 1; i >= 0; i--) {
                let n = notes[i];
                // Accelerate: delta = base_speed * (1 + z^2)
                // This creates the illusion of depth
                n.z += 0.006 * (1 + n.z * n.z * 2.5); 
                
                if (n.z > 1.2) {
                    notes.splice(i, 1);
                }
            }

            // Spawn Logic
            // Create a beat pattern (e.g., every 30 frames)
            if (time % 30 === 0) {
                spawnNote();
                // Occasional double note
                if (Math.random() > 0.8) spawnNote();
            }

            requestAnimationFrame(loop);
        }

        // --- INTERACTION ---
        function startGame() {
            const btn = document.querySelector('.btn-start');
            btn.innerHTML = "INITIALIZING...";
            // Visual flair: flash screen
            const overlay = document.querySelector('.overlay');
            overlay.style.background = 'white';
            setTimeout(() => {
                overlay.style.background = ''; // revert to CSS
                alert("SYSTEM READY. INSERT COIN.");
                btn.innerHTML = "START GAME";
            }, 100);
        }

        function showOptions() {
            alert("MUSIC VOL: MAX\nSFX VOL: MAX\nDIFFICULTY: INSANE");
        }

        // Start
        loop();

    </script>
</body>
</html>
