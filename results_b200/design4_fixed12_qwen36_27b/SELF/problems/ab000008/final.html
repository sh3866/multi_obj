<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIXEL DANCE: RHYTHM EDITION</title>
    <style>
        :root {
            --c-magenta: #ff00ff;
            --c-cyan: #00ffff;
            --c-yellow: #ffe600;
            --c-purple: #bd00ff;
            --c-dark: #05000a;
            --c-grid: rgba(255, 0, 255, 0.4);
            --c-highway-bg: rgba(0, 0, 0, 0.85);
            --c-hit-line: #ffffff;
            
            /* Use a stack that favors pixelated/system fonts */
            --font-main: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

        body {
            background-color: var(--c-dark);
            color: #fff;
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            /* Force pixelated rendering for crisp edges */
            image-rendering: pixelated; 
        }

        /* --- LAYERS --- */
        #game-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            pointer-events: none; /* Allow clicks to pass to canvas if needed, but buttons catch them */
        }

        /* --- CRT OVERLAY --- */
        #crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999;
            pointer-events: none;
            background: 
                /* Scanlines */
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.15) 1px,
                    transparent 1px,
                    transparent 2px
                ),
                /* Vignette */
                radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.8) 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        /* --- HEADER --- */
        .header {
            margin-top: 15vh;
            text-align: center;
            position: relative;
            z-index: 20;
            filter: drop-shadow(0 0 10px rgba(255, 0, 255, 0.5));
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            line-height: 0.9;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            letter-spacing: -2px;
            position: relative;
            /* Chromatic Aberration / Glitch Style */
            text-shadow: 
                4px 4px 0px var(--c-magenta),
                -2px -2px 0px var(--c-cyan);
            animation: floatTitle 4s ease-in-out infinite;
        }

        /* Subtitle Box */
        .subtitle-box {
            margin-top: 10px;
            display: inline-block;
            position: relative;
            padding: 8px 30px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--c-cyan);
            color: var(--c-cyan);
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            letter-spacing: 0.4em;
            font-weight: bold;
            transform: skewX(-15deg);
            box-shadow: 
                0 0 10px var(--c-cyan), 
                inset 0 0 10px rgba(0, 255, 255, 0.2);
            text-shadow: 0 0 5px var(--c-cyan);
        }
        
        /* Decorative corners for subtitle */
        .subtitle-box::before, .subtitle-box::after {
            content: ''; position: absolute; width: 6px; height: 6px; background: var(--c-cyan);
        }
        .subtitle-box::before { top: -4px; left: -4px; box-shadow: 4px 0 var(--c-cyan); }
        .subtitle-box::after { bottom: -4px; right: -4px; box-shadow: -4px 0 var(--c-cyan); }

        /* --- CONTROLS --- */
        .controls {
            margin-bottom: 12vh;
            display: flex;
            gap: 30px;
            pointer-events: auto;
            z-index: 30;
        }

        .btn {
            background: rgba(10, 10, 10, 0.9);
            color: #fff;
            font-family: var(--font-main);
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            padding: 18px 40px;
            border: 2px solid #fff;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            /* Cyberpunk Clip Path */
            clip-path: polygon(
                15px 0, 100% 0, 
                100% calc(100% - 15px), calc(100% - 15px) 100%, 
                0 100%, 0 15px
            );
        }

        .btn-primary {
            border-color: var(--c-magenta);
            color: var(--c-magenta);
            text-shadow: 0 0 8px var(--c-magenta);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
        }

        .btn-primary:hover {
            background: var(--c-magenta);
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 40px var(--c-magenta);
            transform: translateY(-2px);
        }

        .btn-secondary {
            border-color: var(--c-cyan);
            color: var(--c-cyan);
            text-shadow: 0 0 8px var(--c-cyan);
        }

        .btn-secondary:hover {
            background: var(--c-cyan);
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 30px var(--c-cyan);
            transform: translateY(-2px);
        }

        /* --- ANIMATIONS --- */
        @keyframes floatTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Glitch Keyframes */
        @keyframes glitch-anim {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
            80% { clip-path: inset(10% 0 60% 0); transform: translate(-1px, 1px); }
            100% { clip-path: inset(30% 0 30% 0); transform: translate(1px, -1px); }
        }

        /* Glitch Pseudo-element for Title */
        h1::before {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            color: rgba(255, 255, 255, 0.8);
            background: var(--c-dark);
            opacity: 0.5;
            z-index: -1;
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        @media (max-width: 600px) {
            .controls { flex-direction: column; width: 80%; }
            .btn { width: 100%; }
            .header { margin-top: 10vh; }
            .controls { margin-bottom: 15vh; }
        }
    </style>
</head>
<body>

    <!-- CRT Overlay -->
    <div id="crt-overlay"></div>

    <!-- Main Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer">
        <div class="header">
            <h1 data-text="PIXEL DANCE">PIXEL<br>DANCE</h1>
            <div class="subtitle-box">RHYTHM EDITION</div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="startGame()">START GAME</button>
            <button class="btn btn-secondary" onclick="showOptions()">OPTIONS</button>
        </div>
    </div>

    <script>
        /**
         * PIXEL DANCE VISUAL ENGINE
         * A high-performance 2D canvas renderer for the Synthwave aesthetic.
         */
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on base

        // Configuration
        const CONFIG = {
            horizonY: 0.45, // Horizon at 45% height
            gridSpeed: 2.5,
            highwayWidth: 0.6, // Width relative to screen width
            lanes: 4,
            colors: {
                magenta: '#ff00ff',
                cyan: '#00ffff',
                yellow: '#ffe600',
                white: '#ffffff',
                purple: '#bd00ff'
            },
            noteColors: ['#ff00ff', '#00ffff', '#ffe600', '#00ffff'] // L, M, M, R
        };

        let width, height, dpr;
        let time = 0;
        let notes = [];

        // --- RESIZE HANDLER ---
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            dpr = Math.min(window.devicePixelRatio || 1, 2); // Cap DPR for performance

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        // --- DRAWING HELPERS ---
        
        function drawBackground() {
            // 1. Deep Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#02000a');
            grad.addColorStop(0.5, '#110022');
            grad.addColorStop(1, '#2a003b');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. Stars
            ctx.fillStyle = '#fff';
            for(let i=0; i<80; i++) {
                // Pseudo-random deterministic star positions
                const x = (Math.sin(i * 133.7) * 0.5 + 0.5) * width;
                const y = (Math.cos(i * 242.1) * 0.5 + 0.5) * (height * CONFIG.horizonY);
                const size = (i % 3 === 0) ? 2 : 1;
                // Twinkle
                const alpha = 0.5 + 0.5 * Math.sin(time * 0.05 + i);
                ctx.globalAlpha = alpha;
                ctx.fillRect(x, y, size, size);
            }
            ctx.globalAlpha = 1.0;

            // 3. The Synthwave Sun
            const cx = width / 2;
            const cy = height * CONFIG.horizonY;
            const r = Math.min(width, height) * 0.22;

            ctx.save();
            // Glow
            ctx.shadowBlur = 60;
            ctx.shadowColor = CONFIG.colors.magenta;
            
            // Sun Gradient
            const sunGrad = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
            sunGrad.addColorStop(0, CONFIG.colors.yellow);
            sunGrad.addColorStop(0.4, CONFIG.colors.magenta);
            sunGrad.addColorStop(1, CONFIG.colors.purple);

            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = sunGrad;
            ctx.fill();
            ctx.restore();

            // Sun Stripes (The "Blinds" effect)
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip(); // Only draw inside sun
            
            ctx.fillStyle = '#110022'; // Match sky color at horizon
            for(let i = 0; i < 15; i++) {
                // Curved spacing
                const yStart = cy + (i * (r / 8)) + 10;
                const h = 2 + (i * 1.5);
                if(yStart < cy + r) {
                    ctx.fillRect(cx - r, yStart, r * 2, h);
                }
            }
            ctx.restore();
        }

        function drawGrid() {
            const horizonY = height * CONFIG.horizonY;
            const vanishX = width / 2;

            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = CONFIG.colors.magenta;
            ctx.strokeStyle = CONFIG.colors.magenta;
            ctx.lineWidth = 2;
            
            // 1. Horizontal Moving Lines
            // Exponential Z spacing for perspective
            const offset = (time * CONFIG.gridSpeed) % 100;
            
            ctx.beginPath();
            for(let i = 0; i < 30; i++) {
                const z = (i * 20) - offset;
                if (z <= 0) continue;
                
                // Perspective projection: y = h + (H-h) * (z / (z + k))
                // We invert logic: closer objects (larger Z) are lower on screen
                // Let's use a simpler approach: Y moves from horizonY to height
                // We want lines to get further apart as they go down.
                
                // Map z (0 to infinity) to y (horizonY to height)
                // y = horizonY + (height - horizonY) * (z / (z + 100))
                // Actually, let's just move the grid "down" by offset
                // To make it look like we are moving forward.
                
                // Standard Synthwave Grid Math:
                // y = horizon + (height - horizon) * (z / (z + focalLength))
                // If we increment z, y goes down.
                
                // Let's use a simpler visual trick: 
                // y = horizon + (height - horizon) * ( (z + offset) / (z + offset + 100) ) -- this is complex.
                
                // Simple approach:
                // y = horizon + (height - horizon) * ( 1 - 1/(z + offset) )
                
                const focalLength = 150;
                const zVal = (i * 40) + offset;
                const y = horizonY + (height - horizonY) * (1 - (focalLength / (zVal + focalLength)));
                
                if (y > height) continue;

                // Fade out near horizon
                const alpha = Math.min(1, (y - horizonY) / (height * 0.3));
                ctx.globalAlpha = alpha;

                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            ctx.stroke();

            // 2. Vertical Perspective Lines
            // Fan out from vanish point
            ctx.beginPath();
            const numLines = 20;
            for(let i = -numLines; i <= numLines; i++) {
                const x1 = vanishX + (i * 2); // Top is tight
                const x2 = vanishX + (i * (width / 8)); // Bottom is wide
                ctx.moveTo(x1, horizonY);
                ctx.lineTo(x2, height);
            }
            ctx.stroke();
            ctx.restore();
        }

        function drawHighway() {
            const horizonY = height * CONFIG.horizonY;
            const vanishX = width / 2;
            const totalHighwayWidth = width * CONFIG.highwayWidth;
            
            // Highway Geometry
            // Top (Horizon)
            const topX = vanishX;
            const topY = horizonY;
            const topW = 2; // Pinch point

            // Bottom (Screen edge)
            const botX = vanishX;
            const botY = height;
            const botW = totalHighwayWidth;

            ctx.save();

            // 1. Highway Floor (Dark)
            ctx.fillStyle = CONFIG.colors.highway_bg;
            ctx.beginPath();
            ctx.moveTo(topX - topW, topY);
            ctx.lineTo(topX + topW, topY);
            ctx.lineTo(botX + botW, botY);
            ctx.lineTo(botX - botW, botY);
            ctx.closePath();
            ctx.fill();

            // 2. Lane Dividers
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 0;
            
            const lanes = CONFIG.lanes;
            for(let i = 1; i < lanes; i++) {
                // Interpolate X positions
                // Top X
                const tx = (topX - topW) + (i * (topW * 2 / lanes));
                // Bottom X
                const bx = (botX - botW) + (i * (botW * 2 / lanes));
                
                ctx.beginPath();
                ctx.moveTo(tx, topY);
                ctx.lineTo(bx, botY);
                ctx.stroke();
            }

            // 3. Side Borders (Neon)
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = CONFIG.colors.cyan;
            ctx.strokeStyle = CONFIG.colors.cyan;
            
            ctx.beginPath();
            // Left Edge
            ctx.moveTo(topX - topW, topY);
            ctx.lineTo(botX - botW, botY);
            // Right Edge
            ctx.moveTo(topX + topW, topY);
            ctx.lineTo(botX + botW, botY);
            ctx.stroke();

            // 4. Hit Line (The Target)
            // Position it at ~80% down the screen
            const hitLineY = height * 0.85;
            
            // Calculate width of highway at hitLineY using linear interpolation
            // t = 0 at top, t = 1 at bottom
            const t = (hitLineY - topY) / (botY - topY);
            const currentW = topW + (botW - topW) * t;

            ctx.strokeStyle = CONFIG.colors.white;
            ctx.shadowColor = CONFIG.colors.white;
            ctx.shadowBlur = 20;
            ctx.lineWidth = 6;
            
            ctx.beginPath();
            ctx.moveTo(botX - currentW, hitLineY);
            ctx.lineTo(botX + currentW, hitLineY);
            ctx.stroke();

            ctx.restore();

            // 5. Draw Notes
            // Sort by Z (furthest first) so closer notes draw on top
            notes.sort((a, b) => a.z - b.z);

            notes.forEach(note => {
                // Map Z (0 to 1) to Y (topY to botY)
                // Use non-linear mapping for "depth" feel (exponential)
                // y = topY + (botY - topY) * (z^2) ... or similar
                
                // Let's use a simpler linear for gameplay clarity, but accelerated movement in logic
                const noteY = topY + (botY - topY) * note.z;
                
                // Calculate width at this Y
                const noteT = (noteY - topY) / (botY - topY);
                const laneTotalWidth = topW + (botW - topW) * noteT;
                const laneWidth = laneTotalWidth / lanes;
                
                // Calculate X center for this lane
                // Lane 0 is leftmost.
                const laneCenterX = (botX - laneTotalWidth) + (note.lane * laneWidth) + (laneWidth / 2);
                
                // Note Dimensions (Scale with Z)
                // Make them look like blocks
                const noteH = 10 + (noteT * 40); // Height grows
                const noteW = laneWidth * 0.6;   // Width is fraction of lane

                // Draw Note
                ctx.save();
                ctx.fillStyle = CONFIG.noteColors[note.lane];
                ctx.shadowBlur = 15;
                ctx.shadowColor = CONFIG.noteColors[note.lane];
                
                // Main block
                ctx.fillRect(laneCenterX - noteW/2, noteY - noteH/2, noteW, noteH);
                
                // Inner "Pixel" Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.shadowBlur = 0;
                ctx.fillRect(laneCenterX - noteW/4, noteY - noteH/4, noteW/2, noteH/2);
                
                ctx.restore();
            });
        }

        // --- LOGIC ---

        function spawnNote() {
            const lane = Math.floor(Math.random() * CONFIG.lanes);
            notes.push({
                lane: lane,
                z: 0, // 0 = horizon, 1 = bottom
                active: true
            });
        }

        function updateNotes() {
            // Remove off-screen notes
            for (let i = notes.length - 1; i >= 0; i--) {
                if (notes[i].z > 1.1) {
                    notes.splice(i, 1);
                }
            }

            // Move notes
            // Speed increases as they get closer (z approaches 1)
            const speedBase = 0.005;
            notes.forEach(n => {
                // Acceleration curve
                const speed = speedBase * (1 + n.z * n.z * 5);
                n.z += speed;
            });
        }

        function loop() {
            time++;
            
            // Clear
            ctx.clearRect(0, 0, width, height);

            // Draw Layers
            drawBackground();
            drawGrid();
            drawHighway();

            // Logic
            updateNotes();
            
            // Spawn Logic (Simple beat pattern)
            // Spawn every ~40 frames, random lanes
            if (time % 45 === 0) {
                spawnNote();
                // Double note chance
                if (Math.random() > 0.7) spawnNote();
            }

            requestAnimationFrame(loop);
        }

        // --- INTERACTION ---
        function startGame() {
            const btn = document.querySelector('.btn-primary');
            btn.innerHTML = "INITIALIZING...";
            
            // Simple flash effect
            const overlay = document.getElementById('crt-overlay');
            const originalBg = overlay.style.background;
            overlay.style.background = 'white';
            
            setTimeout(() => {
                overlay.style.background = originalBg;
                // In a real game, this would switch scenes. 
                // For the demo, we just show an alert or reset text.
                btn.innerHTML = "READY?";
                setTimeout(() => { btn.innerHTML = "START GAME"; }, 1000);
            }, 150);
        }

        function showOptions() {
            alert("VOLUME: MAX\nDIFFICULTY: INSANE\nFPS: 60");
        }

        // Start Loop
        loop();

    </script>
</body>
</html>
