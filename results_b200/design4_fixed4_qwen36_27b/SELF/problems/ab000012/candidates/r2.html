<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #020408;
        --bg-panel: rgba(12, 20, 35, 0.6);
        --bg-panel-hover: rgba(20, 35, 60, 0.8);
        
        --gold-primary: #d4af37;
        --gold-bright: #fcf6ba;
        --gold-dark: #8a6e2f;
        
        --cyan-primary: #40e0d0;
        --cyan-glow: rgba(64, 224, 208, 0.4);
        
        --text-main: #e6f1ff;
        --text-muted: #7a8ba3;
        
        --font-heading: 'Cinzel', 'Palatino Linotype', serif;
        --font-body: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --font-mono: 'Courier New', monospace;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        position: relative;
    }

    /* --- Advanced Background --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: 0.6;
        pointer-events: none;
    }

    /* Vignette & Noise */
    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
        background: 
            radial-gradient(circle at center, transparent 0%, var(--bg-deep) 90%),
            linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.8));
    }
    
    .noise {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.04;
        z-index: 2;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Layout Container --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1100px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem 2rem 1.5rem;
    }

    /* --- Top Bar --- */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 1rem;
    }

    .currency-pill {
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 4px;
        padding: 0.5rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        backdrop-filter: blur(5px);
        position: relative;
    }
    
    /* Metallic trim */
    .currency-pill::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    }

    .coin-icon {
        width: 24px;
        height: 24px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
    }

    .currency-amount {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 1.1rem;
        color: var(--gold-bright);
        letter-spacing: 1px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        padding-bottom: 2rem;
        margin-top: -2rem; /* Visual balance */
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 4.5rem;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        margin-bottom: 0.5rem;
        background: linear-gradient(to bottom, var(--gold-bright) 20%, var(--gold-primary) 50%, var(--gold-dark) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.2));
        position: relative;
        z-index: 2;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.95rem;
        color: var(--cyan-primary);
        letter-spacing: 0.8em;
        text-transform: uppercase;
        margin-bottom: 4rem;
        opacity: 0.9;
        text-shadow: 0 0 15px var(--cyan-glow);
        text-align: center;
    }

    /* The Summoning Orb Container */
    .orb-container {
        position: relative;
        width: 240px;
        height: 240px;
        margin-bottom: 2rem;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
    }

    .orb-svg {
        width: 100%;
        height: 100%;
        animation: float 8s ease-in-out infinite;
    }

    /* --- Menu Grid --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2rem;
        width: 100%;
        max-width: 900px;
        margin: 0 auto 1rem auto;
        padding: 0 1rem;
    }

    .menu-card {
        background: linear-gradient(180deg, rgba(20, 30, 45, 0.5), rgba(10, 15, 25, 0.8));
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(12px);
    }

    /* Card Shine Effect */
    .menu-card::after {
        content: '';
        position: absolute;
        top: 0; left: -100%; width: 50%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
        transform: skewX(-25deg);
        transition: 0.5s;
    }

    .menu-card:hover {
        transform: translateY(-8px);
        background: linear-gradient(180deg, rgba(30, 45, 70, 0.7), rgba(15, 25, 40, 0.9));
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border-color: rgba(255, 255, 255, 0.2);
    }

    .menu-card:hover::after {
        left: 150%;
        transition: 0.7s ease-in-out;
    }

    .menu-card:active {
        transform: translateY(-4px);
    }

    .card-icon {
        width: 40px;
        height: 40px;
        fill: var(--text-muted);
        transition: fill 0.3s, filter 0.3s;
    }

    .menu-card:hover .card-icon {
        fill: var(--text-main);
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
    }

    .card-label {
        font-family: var(--font-heading);
        font-size: 1.1rem;
        color: var(--text-main);
        letter-spacing: 0.08em;
        font-weight: 600;
        z-index: 1;
    }

    /* --- Summon Card Special Styling --- */
    .menu-card.summon {
        background: linear-gradient(180deg, rgba(60, 50, 20, 0.6), rgba(20, 15, 5, 0.9));
        border: 1px solid rgba(212, 175, 55, 0.4);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.05);
    }
    
    .menu-card.summon:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
    }
    
    .menu-card.summon .card-label {
        color: var(--gold-primary);
    }
    
    .menu-card.summon .card-icon {
        fill: var(--gold-primary);
    }
    
    .menu-card.summon:hover .card-icon {
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 8px var(--gold-dark));
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.75rem;
        opacity: 0.6;
        margin-top: auto;
        letter-spacing: 0.1em;
        font-family: var(--font-mono);
    }

    /* --- Animations --- */
    @keyframes float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-15px) scale(1.02); }
    }

    @keyframes rotate-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 3rem; letter-spacing: 0.15em; }
        .menu-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
        .app-container { padding: 1rem; }
        .orb-container { width: 180px; height: 180px; margin-bottom: 1rem; }
        .game-subtitle { margin-bottom: 2rem; font-size: 0.8rem; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="overlay"></div>
    <div class="noise"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <!-- Gold Coin SVG -->
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" fill="currentColor"/>
                    <circle cx="12" cy="12" r="8" fill="#020408"/>
                    <path d="M12 8v8M9 12h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <div class="orb-container">
                <!-- Complex Procedural Orb SVG -->
                <svg class="orb-svg" viewBox="0 0 200 200">
                    <defs>
                        <!-- Core Gradient -->
                        <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                            <stop offset="20%" style="stop-color:#40e0d0;stop-opacity:0.9" />
                            <stop offset="60%" style="stop-color:#1a6b66;stop-opacity:0.4" />
                            <stop offset="100%" style="stop-color:#020408;stop-opacity:0" />
                        </radialGradient>
                        
                        <!-- Outer Glow -->
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    
                    <!-- Background Ring (Slow) -->
                    <circle cx="100" cy="100" r="90" stroke="rgba(64, 224, 208, 0.1)" stroke-width="1" fill="none">
                        <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="40s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Dashed Ring (Medium) -->
                    <circle cx="100" cy="100" r="80" stroke="rgba(64, 224, 208, 0.3)" stroke-width="1" fill="none" stroke-dasharray="10 15">
                        <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="25s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Inner Ring (Fast) -->
                    <circle cx="100" cy="100" r="65" stroke="rgba(255, 255, 255, 0.15)" stroke-width="0.5" fill="none" stroke-dasharray="4 8">
                        <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="15s" repeatCount="indefinite" />
                    </circle>

                    <!-- The Core -->
                    <circle cx="100" cy="100" r="50" fill="url(#orbGrad)" filter="url(#glow)">
                        <animate attributeName="r" values="48;52;48" dur="4s" repeatCount="indefinite" />
                        <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Crosshairs -->
                    <path d="M100 5 L100 195 M5 100 L195 100" stroke="rgba(64, 224, 208, 0.1)" stroke-width="1" />
                </svg>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <!-- Star/Summon Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z" fill="currentColor" fill-rule="evenodd" stroke="none"/>
                </svg>
                <span class="card-label">Summon</span>
            </div>

            <!-- Roster -->
            <div class="menu-card" onclick="interact('Roster')">
                <!-- Users/Roster Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill="currentColor"/>
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card" onclick="interact('Battle')">
                <!-- Lightning/Battle Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z" fill="currentColor"/>
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card" onclick="interact('Grind')">
                <!-- Gear/Grind Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="currentColor"/>
                </svg>
                <span class="card-label">Grind</span>
            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 • Offline Mode
        </footer>
    </div>

<script>
    // --- Background Particle System ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.vx = (Math.random() - 0.5) * 0.2; // Slower horizontal drift
            this.vy = -(Math.random() * 0.5 + 0.1); // Slower vertical rise
            this.size = Math.random() * 2;
            this.alpha = Math.random() * 0.5;
            // Mix of gold and cyan particles
            this.color = Math.random() > 0.8 ? '212, 175, 55' : '64, 224, 208'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.0005; // Slower fade

            if (this.alpha <= 0 || this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // Adjust particle density based on screen size
        const count = Math.floor((width * height) / 15000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        ctx.lineWidth = 0.5;
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
            
            // Connect particles (only cyan for magic network effect)
            if (particles[i].color.includes('64')) {
                for (let j = i + 1; j < particles.length; j++) {
                    if (particles[j].color.includes('64')) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < 100) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(64, 224, 208, ${0.08 - dist/1250})`;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
            }
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        // Simple visual feedback logic
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.95)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
