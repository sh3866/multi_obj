<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archon's Ascension - Skill Tree</title>
<style>
    :root {
        --bg-deep: #030406;
        --bg-panel: rgba(8, 10, 14, 0.85);
        --accent-primary: #fbbf24; /* Amber 400 */
        --accent-secondary: #b45309; /* Amber 700 */
        --accent-glow: rgba(251, 191, 36, 0.4);
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --text-dim: #475569;
        --border-subtle: rgba(255, 255, 255, 0.08);
        
        --font-display: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        /* Refined Noise Texture */
        background-image: 
            radial-gradient(circle at 50% 0%, #0f172a 0%, transparent 60%),
            radial-gradient(circle at 80% 80%, #2a1a00 0%, transparent 40%),
            url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    }

    /* --- Header --- */
    header {
        height: 70px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        text-align: center;
        position: relative;
        background: linear-gradient(to bottom, rgba(3,4,6,1) 0%, rgba(3,4,6,0) 100%);
    }
    
    header::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 200px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
        opacity: 0.5;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 1.6rem;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        margin-bottom: 2px;
        font-weight: 400;
    }

    .subtitle {
        font-size: 0.7rem;
        color: var(--accent-primary);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        font-weight: 600;
        opacity: 0.9;
    }

    /* --- Main Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
    }

    /* --- Sidebar --- */
    aside {
        width: 340px;
        height: 100%;
        background: linear-gradient(90deg, rgba(5,5,5,0.95) 0%, rgba(5,5,5,0.8) 100%);
        border-right: 1px solid var(--border-subtle);
        padding: 40px 30px;
        display: flex;
        flex-direction: column;
        gap: 40px;
        z-index: 20;
        box-shadow: 10px 0 40px rgba(0,0,0,0.6);
        backdrop-filter: blur(8px);
    }

    /* Level Section */
    .level-section {
        display: flex;
        align-items: baseline;
        gap: 12px;
    }

    .level-num {
        font-family: var(--font-display);
        font-size: 4rem;
        line-height: 1;
        color: #fff;
        font-weight: 400;
    }

    .level-text {
        font-size: 0.9rem;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.15em;
        font-weight: 600;
    }

    /* XP Bar */
    .xp-container {
        margin-top: 10px;
    }

    .xp-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-bottom: 8px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .xp-track {
        height: 2px;
        background: rgba(255,255,255,0.1);
        position: relative;
    }

    .xp-fill {
        height: 100%;
        width: 65%;
        background: var(--accent-primary);
        box-shadow: 0 0 8px var(--accent-primary);
        position: relative;
    }
    
    /* XP Bar Highlight Tip */
    .xp-fill::after {
        content: '';
        position: absolute;
        right: 0;
        top: -2px;
        width: 6px;
        height: 6px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 5px #fff;
    }

    /* Points Card */
    .points-card {
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(251, 191, 36, 0.2);
        padding: 30px 20px;
        text-align: center;
        position: relative;
        transition: all 0.3s;
        cursor: default;
        /* Subtle gold gradient border effect */
        background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                          linear-gradient(135deg, rgba(251, 191, 36, 0.1), transparent);
        background-size: 100% 100%;
    }

    .points-val {
        font-family: var(--font-display);
        font-size: 3.5rem;
        color: var(--accent-primary);
        line-height: 1;
        display: block;
        text-shadow: 0 0 15px var(--accent-glow);
        margin-bottom: 8px;
    }

    .points-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-muted);
        display: block;
        font-weight: 600;
    }

    /* Stats */
    .stats-section {
        margin-top: auto;
        border-top: 1px solid var(--border-subtle);
        padding-top: 30px;
    }

    .char-header {
        margin-bottom: 25px;
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.5rem;
        color: #fff;
        display: block;
        letter-spacing: 0.02em;
    }

    .char-class {
        font-size: 0.8rem;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        margin-top: 4px;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 14px;
        font-size: 0.85rem;
        color: var(--text-muted);
        align-items: center;
        padding: 4px 0;
        transition: color 0.2s;
    }

    .stat-row:hover {
        color: var(--text-main);
    }

    .stat-val {
        color: var(--text-main);
        font-weight: 700;
        font-family: var(--font-display);
        font-size: 1.1rem;
    }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, rgba(15, 23, 42, 0.2) 0%, transparent 70%);
    }

    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1600px;
        height: 1400px;
        transform-origin: center center;
    }

    /* SVG Lines */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    .connection-line {
        stroke: #1e293b;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        transition: all 0.5s ease;
        opacity: 0.4;
    }

    .connection-line.active {
        stroke: var(--accent-primary);
        stroke-width: 3;
        filter: drop-shadow(0 0 4px var(--accent-glow));
        opacity: 1;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        width: 70px;
        height: 70px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .node:hover {
        z-index: 10;
        transform: translate(-50%, -50%) scale(1.15);
    }

    .node-shape {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #0f172a;
        border: 1px solid #334155;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }

    /* Outer decorative ring */
    .node-shape::before {
        content: '';
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.05);
        transition: border-color 0.3s, inset 0.3s;
    }

    /* Inner decorative ring */
    .node-shape::after {
        content: '';
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        border: 1px solid rgba(0,0,0,0.8);
        background: radial-gradient(circle, rgba(255,255,255,0.02) 0%, transparent 70%);
    }

    .node-icon {
        width: 28px;
        height: 28px;
        fill: var(--text-dim);
        transition: all 0.3s ease;
        z-index: 2;
        opacity: 0.6;
    }

    /* States */
    .node.unlocked .node-shape {
        border-color: var(--accent-primary);
        background: radial-gradient(circle at 50% 50%, #1e1b14, #0f172a);
        box-shadow: 0 0 20px var(--accent-glow), inset 0 0 10px rgba(0,0,0,0.9);
    }

    .node.unlocked .node-shape::before {
        border-color: rgba(251, 191, 36, 0.5);
        inset: -8px;
    }

    .node.unlocked .node-icon {
        fill: #fff;
        filter: drop-shadow(0 0 5px var(--accent-primary));
        opacity: 1;
    }

    .node.available .node-shape {
        border-color: #64748b;
        background: #1e293b;
    }

    .node.available .node-icon {
        fill: #e2e8f0;
        opacity: 0.8;
    }
    
    .node.available:hover .node-shape {
        border-color: #fff;
        box-shadow: 0 0 15px rgba(255,255,255,0.1);
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(8, 10, 14, 0.96);
        border: 1px solid var(--accent-primary);
        padding: 24px;
        width: 300px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        backdrop-filter: blur(12px);
    }

    /* Corner Accents */
    .tooltip::before, .tooltip::after {
        content: '';
        position: absolute;
        width: 10px;
        height: 10px;
        border: 1px solid var(--accent-primary);
    }
    .tooltip::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .tooltip::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        color: var(--accent-primary);
        font-family: var(--font-display);
        margin-bottom: 6px;
        font-size: 1.3rem;
        letter-spacing: 0.05em;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 10px;
    }

    .tooltip .type {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 14px;
        letter-spacing: 0.15em;
        font-weight: 700;
        background: rgba(255,255,255,0.05);
        display: inline-block;
        padding: 2px 6px;
        border-radius: 2px;
    }

    .tooltip p {
        font-size: 0.85rem;
        line-height: 1.6;
        color: #cbd5e1;
        font-weight: 300;
    }

    .tooltip .req {
        margin-top: 16px;
        font-size: 0.75rem;
        color: #ef4444;
        display: none;
        font-style: italic;
        background: rgba(239, 68, 68, 0.1);
        padding: 8px;
        border-radius: 2px;
        border-left: 2px solid #ef4444;
    }

    .tooltip.locked {
        border-color: #475569;
    }
    .tooltip.locked h3 { color: #94a3b8; border-color: rgba(255,255,255,0.05); }
    .tooltip.locked .req { display: block; }
    .tooltip.locked::before, .tooltip.locked::after { border-color: #475569; }

</style>
</head>
<body>

    <header>
        <h1>Archon's Ascension</h1>
        <div class="subtitle">Class: Void Walker</div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="level-section">
                <span class="level-num">42</span>
                <span class="level-text">Level</span>
            </div>

            <div class="xp-container">
                <div class="xp-labels">
                    <span>XP Progress</span>
                    <span>12,450 / 20,000</span>
                </div>
                <div class="xp-track">
                    <div class="xp-fill"></div>
                </div>
            </div>

            <div class="points-card">
                <span class="points-val">3</span>
                <span class="points-label">Skill Points Available</span>
            </div>

            <div class="stats-section">
                <div class="char-header">
                    <span class="char-name">Kaelen Thorne</span>
                    <span class="char-class">Duelist / Arcanist</span>
                </div>
                <div class="stat-row"><span>Strength</span><span class="stat-val">14</span></div>
                <div class="stat-row"><span>Dexterity</span><span class="stat-val">28</span></div>
                <div class="stat-row"><span>Intelligence</span><span class="stat-val">35</span></div>
                <div class="stat-row"><span>Vitality</span><span class="stat-val">12</span></div>
            </div>
        </aside>

        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <!-- SVG Lines injected by JS -->
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected by JS -->
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data ---
    const skills = [
        // Root
        { id: 'root', x: 800, y: 100, name: "Archon's Spark", type: "Passive", desc: "The origin of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Tier 1
        { id: 'str1', x: 400, y: 300, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'dex1', x: 1200, y: 300, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: true, req: 'root' },
        { id: 'int1', x: 800, y: 350, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", unlocked: false, req: 'root' },
        
        // Tier 2
        { id: 'str2', x: 200, y: 500, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str3', x: 500, y: 550, name: "Iron Skin", type: "Passive", desc: "Reduces physical damage taken by 10%.", unlocked: false, req: 'str1' },
        
        { id: 'dex2', x: 1350, y: 500, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 1000, y: 550, name: "Shadow Step", type: "Active", desc: "Become invisible for 3 seconds.", unlocked: false, req: 'dex1' },

        // Tier 3
        { id: 'str4', x: 100, y: 750, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        { id: 'int2', x: 650, y: 700, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 900, y: 700, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        
        { id: 'dex4', x: 1450, y: 750, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },

        // Tier 4
        { id: 'hybrid', x: 800, y: 950, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows to target location.", unlocked: false, req: 'dex3' },
        { id: 'hybrid2', x: 450, y: 900, name: "Blood Pact", type: "Passive", desc: "Heal for 5% of damage dealt.", unlocked: false, req: 'str4' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const ww = 1600;
        const wh = 1400;
        
        // Initial center
        updateTransform(cw/2 - ww/2, ch/2 - wh/2, 1);

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Determine Icon
            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawLines();
    }

    function drawLines() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        
        // Positioning
        const x = e.clientX;
        const y = e.clientY;
        
        // Prevent overflow
        const ttW = 300;
        const ttH = 200;
        const finalX = (x + ttW + 20 > window.innerWidth) ? x - ttW - 20 : x + 20;
        const finalY = (y + ttH > window.innerHeight) ? y - ttH : y;

        tooltip.style.left = `${finalX}px`;
        tooltip.style.top = `${finalY}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        // Logic: Can only unlock if parent is unlocked and we have points
        // For this demo, we just toggle visual state if parent is met
        if (!skill.unlocked) {
             const parent = skills.find(s => s.id === skill.req);
             if (!skill.req || (parent && parent.unlocked)) {
                 skill.unlocked = true;
                 updateVisuals();
             }
        }
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            if (s.unlocked) {
                el.classList.add('unlocked');
                el.classList.remove('available');
            } else {
                el.classList.remove('unlocked');
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) el.classList.add('available');
                else el.classList.remove('available');
            }
        });
        drawLines();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = container.clientWidth/2 - 800;
    let panY = container.clientHeight/2 - 700;
    let scale = 1;

    function updateTransform(x, y, s) {
        panX = x;
        panY = y;
        scale = s;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform(panX, panY, scale);
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.4, scale + delta), 2.5);
        
        // Zoom towards mouse pointer
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        updateTransform(panX, panY, newScale);
    });

    init();
