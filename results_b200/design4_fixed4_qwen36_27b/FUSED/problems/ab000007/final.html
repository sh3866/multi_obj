<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ABYSSAL: Specimen Hunter</title>
<style>
  :root {
    --bg-deep: #050810;
    --bg-panel: rgba(12, 18, 30, 0.65);
    --accent-cyan: #00f3ff;
    --accent-magenta: #ff0055;
    --accent-lime: #aaff00;
    --accent-gold: #ffcc00;
    --text-main: #eef2f5;
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-tech: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Scene Container --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    cursor: none; /* Hide default cursor */
  }

  /* --- Background Environment (Atmosphere) --- */
  .atmosphere {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    /* Deep sea / void gradient */
    background: 
      radial-gradient(circle at 50% 30%, rgba(20, 40, 80, 0.4) 0%, transparent 60%),
      radial-gradient(circle at 50% 100%, rgba(0, 20, 40, 0.6) 0%, var(--bg-deep) 100%);
  }

  /* Grid Overlay for depth */
  .grid-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 1;
    pointer-events: none;
    /* Mask to fade grid at edges */
    mask-image: radial-gradient(circle at center, black 30%, transparent 85%);
    -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 85%);
  }

  /* Vignette for depth */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.85) 100%);
    z-index: 2;
    pointer-events: none;
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 3;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(1.5rem, 3vw, 3rem);
  }

  /* --- HUD Frame (Top) --- */
  .hud-frame {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    /* Visor style top bar */
    background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
    padding: 1rem 0 3rem 0;
    border-bottom: 1px solid rgba(0, 243, 255, 0.1);
  }

  .brand {
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(1.5rem, 2.5vw, 2.2rem);
    margin: 0;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
  }

  .brand-sub {
    font-family: var(--font-tech);
    font-size: 0.7rem;
    color: var(--accent-cyan);
    letter-spacing: 0.1em;
    margin-top: 4px;
    opacity: 0.8;
  }

  /* --- HUD Stats --- */
  .hud-stats {
    display: flex;
    gap: 2rem;
    background: rgba(0, 10, 20, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 0.8rem 2rem;
    border-radius: 4px;
    border: 1px solid rgba(0, 243, 255, 0.2);
    border-top: 2px solid var(--accent-cyan);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .stat-box {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    min-width: 80px;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2.5rem;
    color: #fff;
    line-height: 1;
    letter-spacing: -0.02em;
    text-shadow: 0 0 15px var(--accent-cyan);
  }

  .stat-label {
    font-family: var(--font-tech);
    font-size: 0.6rem;
    color: var(--accent-cyan);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-top: 4px;
  }

  /* --- Footer / Action Button --- */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    margin-bottom: 1rem;
  }

  .btn-main {
    background: rgba(0, 20, 40, 0.6);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    border: 1px solid rgba(0, 243, 255, 0.3);
    color: var(--accent-cyan);
    font-family: var(--font-tech);
    font-size: 0.8rem;
    font-weight: 700;
    padding: 1rem 3rem;
    border-radius: 2px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
  }

  .btn-main::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.2), transparent);
    transition: left 0.5s ease;
  }

  .btn-main:hover {
    background: rgba(0, 243, 255, 0.1);
    border-color: var(--accent-cyan);
    color: #fff;
    box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
    transform: translateY(-2px);
  }

  .btn-main:hover::before {
    left: 100%;
  }

  /* --- Toast Notification --- */
  .toast {
    position: absolute;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0, 0, 0, 0.9);
    border: 1px solid var(--accent-lime);
    color: var(--accent-lime);
    padding: 0.8rem 2rem;
    border-radius: 4px;
    font-family: var(--font-tech);
    font-weight: 700;
    letter-spacing: 0.15em;
    font-size: 0.9rem;
    opacity: 0;
    pointer-events: none;
    transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 40px rgba(170, 255, 0, 0.2);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Instructions */
  .instructions {
    position: absolute;
    bottom: 12%; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.4);
    font-family: var(--font-tech);
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    pointer-events: none;
    transition: opacity 1s ease;
    text-transform: uppercase;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 8px 16px;
    background: rgba(0,0,0,0.4);
    border-radius: 20px;
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    .hud-frame { flex-direction: column; gap: 1rem; align-items: flex-start; }
    .hud-stats { width: 100%; justify-content: space-between; }
    .stat-box { align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="atmosphere"></div>
  <div class="grid-overlay"></div>
  <div class="vignette"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="hud-frame">
      <div class="brand">
        <h1>Abyssal</h1>
        <span class="brand-sub">Zone 4 // Bio-Hazard</span>
      </div>
      
      <!-- HUD Panel -->
      <div class="hud-stats">
        <div class="stat-box">
          <div class="stat-value" id="scoreDisplay">00</div>
          <div class="stat-label">Specimens</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" style="font-size: 1.5rem; color: var(--accent-gold);">A+</div>
          <div class="stat-label">Purity</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      <span>Specimen Secured</span>
    </div>
    
    <div id="instructions" class="instructions">Hold Click to Deploy Net</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">View Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Focus: Organic Creatures, Player Entity (Net), Atmosphere
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');
  const instrEl = document.getElementById('instructions');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let netRadius = 0;
  let targetNetRadius = 0;
  let time = 0;

  // Configuration
  const CREATURE_COUNT = 14;
  const COLORS = ['#00f3ff', '#ff0055', '#aaff00', '#bd00ff', '#ffcc00'];

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => {
    isMouseDown = true;
    targetNetRadius = 140; 
    instrEl.style.opacity = 0;
  });
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    targetNetRadius = 0;
    checkCatch();
  });

  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
    targetNetRadius = 140;
    instrEl.style.opacity = 0;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    targetNetRadius = 0;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.025 + 0.015;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.92; 
      this.vy *= 0.92;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset(true);
    }

    reset(initial = false) {
      if (initial) {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
      } else {
        // Respawn at random edge
        const edge = Math.floor(Math.random() * 4);
        if (edge === 0) { this.x = Math.random() * width; this.y = -150; }
        else if (edge === 1) { this.x = width + 150; this.y = Math.random() * height; }
        else if (edge === 2) { this.x = Math.random() * width; this.y = height + 150; }
        else { this.x = -150; this.y = Math.random() * height; }
      }

      // 3 Distinct Types
      this.type = Math.floor(Math.random() * 3); 
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.radius = Math.random() * 10 + 25;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = 0;
      this.rotSpeed = (Math.random() - 0.5) * 0.04;
      this.wobble = Math.random() * Math.PI * 2;
      this.isCaught = false;
      this.scale = 0;
      this.targetScale = 1;
      this.pulse = 0;
    }

    update() {
      this.scale += (this.targetScale - this.scale) * 0.1;
      this.pulse += 0.06;

      if (this.isCaught) return;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.angle += this.rotSpeed;
      this.wobble += 0.03;
      
      // Organic drift
      this.x += Math.sin(this.wobble) * 0.5;
      this.y += Math.cos(this.wobble * 0.8) * 0.3;

      // Bounce boundaries
      if (this.x < -200 || this.x > width + 200) this.vx *= -1;
      if (this.y < -200 || this.y > height + 200) this.vy *= -1;

      // Avoid Mouse (Net) - Repulsion
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 180 && !isMouseDown) {
        const force = (180 - dist) / 180;
        this.vx += (dx / dist) * force * 0.8;
        this.vy += (dy / dist) * force * 0.8;
      } 
      // Attract if net is active
      else if (isMouseDown && dist < 400) {
         const force = (400 - dist) / 400;
         this.vx -= (dx / dist) * force * 2.0;
         this.vy -= (dy / dist) * force * 2.0;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 5) {
        this.vx = (this.vx / speed) * 5;
        this.vy = (this.vy / speed) * 5;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.scale(this.scale, this.scale);

      // Glow
      ctx.shadowBlur = 25;
      ctx.shadowColor = this.color;
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; // Dark silhouette body
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2.5;

      ctx.beginPath();

      if (this.type === 0) {
        // Type 0: The Jelly (Organic Blob)
        const r = this.radius;
        const p = Math.sin(this.pulse) * 4;
        // Draw a squishy circle
        ctx.moveTo(r + p, 0);
        for (let i = 1; i <= 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          const rMod = r + Math.sin(a * 3 + this.pulse) * (p * 0.5);
          ctx.lineTo(Math.cos(a) * rMod, Math.sin(a) * rMod);
        }
        ctx.closePath();
        
        // Draw Eyes
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(r*0.3, -r*0.3, r*0.15, 0, Math.PI*2);
        ctx.arc(r*0.3, r*0.3, r*0.15, 0, Math.PI*2);
        ctx.fill();

      } else if (this.type === 1) {
        // Type 1: The Shard (Geometric)
        const r = this.radius;
        const p = Math.sin(this.pulse) * 3;
        ctx.moveTo(0, -r - p);
        ctx.lineTo(r*0.8, 0);
        ctx.lineTo(0, r + p);
        ctx.lineTo(-r*0.8, 0);
        ctx.closePath();
        
        // Inner detail
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.3;
        ctx.fill();
        ctx.globalAlpha = 1.0;

      } else {
        // Type 2: The Spore (Complex Hexagon)
        const r = this.radius;
        for (let i = 0; i < 6; i++) {
          const angle = (i * Math.PI) / 3;
          const rMod = i % 2 === 0 ? r : r * 0.7;
          const x = Math.cos(angle) * rMod;
          const y = Math.sin(angle) * rMod;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();

        // Eye
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI*2);
        ctx.fill();
      }

      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    updateScoreUI();
  }

  function updateScoreUI() {
    scoreEl.innerText = score.toString().padStart(2, '0');
  }

  function checkCatch() {
    const catchRadius = 90; 
    let caughtCount = 0;

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
        caughtCount++;
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    updateScoreUI();
    
    // Visual FX
    for(let i=0; i<30; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    if (window.toastTimeout) clearTimeout(window.toastTimeout);
    window.toastTimeout = setTimeout(() => toastEl.classList.remove('active'), 1500);

    // Respawn logic
    setTimeout(() => {
      creature.reset();
    }, 3000);
  }

  function resetGame() {
    init();
    particles = [];
  }

  function drawNet() {
    // Smoothly animate net size
    netRadius += (targetNetRadius - netRadius) * 0.15;

    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Player Entity: The Net
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f3ff';
    
    // Main Ring
    ctx.strokeStyle = isMouseDown ? '#fff' : '#00f3ff';
    ctx.lineWidth = 2;
    
    ctx.beginPath();
    ctx.arc(0, 0, 40 + netRadius, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner Tech Ring (Rotating Dashed)
    ctx.setLineDash([8, 8]);
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.rotate(time * 0.05);
    ctx.arc(0, 0, 20 + netRadius * 0.6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Crosshair (Cleaner)
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-12, 0); ctx.lineTo(-4, 0);
    ctx.moveTo(12, 0); ctx.lineTo(4, 0);
    ctx.moveTo(0, -12); ctx.lineTo(0, -4);
    ctx.moveTo(0, 12); ctx.lineTo(0, 4);
    ctx.stroke();

    // "Sucking" effect lines if held down
    if (isMouseDown) {
      ctx.globalAlpha = 0.15;
      ctx.fillStyle = '#00f3ff';
      ctx.beginPath();
      ctx.arc(0, 0, 140, 0, Math.PI * 2);
      ctx.fill();
      
      // Draw suction lines
      ctx.globalAlpha = 0.3;
      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 1;
      for(let i=0; i<8; i++) {
        const a = (i/8) * Math.PI * 2 + time * 0.1;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*20, Math.sin(a)*20);
        ctx.lineTo(Math.cos(a)*(140 - Math.random()*20), Math.sin(a)*(140 - Math.random()*20));
        ctx.stroke();
      }
      ctx.globalAlpha = 1.0;
    }

    ctx.restore();
  }

  function loop() {
    time++;
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
