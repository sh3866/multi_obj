<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aether: Bio-Capture</title>
<style>
  :root {
    --bg-deep: #030305;
    --bg-panel: rgba(15, 15, 20, 0.65);
    --accent-cyan: #00f0ff;
    --accent-magenta: #ff0055;
    --accent-gold: #ffcc00;
    --accent-lime: #ccff00;
    --border-glass: rgba(255, 255, 255, 0.08);
    --border-highlight: rgba(0, 240, 255, 0.3);
    --font-display: 'Impact', 'Arial Black', 'Helvetica Neue', sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: #fff;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Scene Container --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    cursor: crosshair;
  }

  /* --- Background: Atmosphere --- */
  .atmosphere {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Abstract Depth Grid */
  .grid-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      radial-gradient(circle at 50% 50%, transparent 0%, var(--bg-deep) 120%),
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
    mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
    opacity: 0.6;
  }

  /* Floating Dust/Noise */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
    opacity: 0.4;
    z-index: 1;
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(1.5rem, 4vw, 3rem);
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    margin: 0;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    line-height: 0.9;
    background: linear-gradient(to bottom, #fff 20%, #a0a0a0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.1));
  }

  .subtitle {
    font-size: clamp(0.6rem, 1vw, 0.8rem);
    color: var(--accent-cyan);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    font-weight: 600;
    margin-left: 0.2rem;
    opacity: 0.9;
  }

  /* HUD Panel */
  .hud-panel {
    background: var(--bg-panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-glass);
    border-left: 4px solid var(--accent-cyan);
    padding: 0.8rem 1.5rem;
    border-radius: 0 12px 12px 0;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
  }

  .hud-panel:hover {
    background: rgba(20, 20, 30, 0.8);
    border-left-color: #fff;
  }

  .stat-icon {
    width: 24px; height: 24px;
    fill: var(--accent-gold);
    filter: drop-shadow(0 0 5px var(--accent-gold));
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2.2rem;
    color: white;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .stat-label {
    font-size: 0.6rem;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    display: block;
    margin-top: 2px;
  }

  /* Footer / Actions */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    margin-bottom: 1rem;
  }

  .btn-main {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border-glass);
    color: rgba(255,255,255,0.7);
    font-family: var(--font-ui);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 1rem 3rem;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
  }

  .btn-main::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 4px; height: 100%;
    background: var(--accent-cyan);
    opacity: 0.5;
    transition: width 0.3s;
  }

  .btn-main:hover {
    background: rgba(0, 240, 255, 0.1);
    border-color: var(--accent-cyan);
    color: #fff;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
    transform: translateY(-2px);
  }

  .btn-main:hover::before {
    width: 100%;
    opacity: 0.1;
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 35%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0, 0, 0, 0.85);
    border: 1px solid var(--accent-lime);
    color: var(--accent-lime);
    padding: 0.8rem 2rem;
    border-radius: 2px;
    font-family: var(--font-ui);
    font-weight: 700;
    letter-spacing: 0.1em;
    font-size: 0.9rem;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(204, 255, 0, 0.15);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast-icon {
    width: 16px; height: 16px;
    fill: currentColor;
  }

  /* Instructions overlay */
  .instructions {
    position: absolute;
    bottom: 15%; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.3);
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    pointer-events: none;
    transition: opacity 1.5s ease;
    text-transform: uppercase;
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    .header { flex-direction: column; align-items: center; gap: 1.5rem; }
    .hud-panel { margin-top: 0.5rem; border-left: none; border-top: 4px solid var(--accent-cyan); border-radius: 0 0 12px 12px; }
    .btn-main { width: 100%; padding: 1rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="atmosphere">
    <div class="grid-bg"></div>
    <div class="noise-overlay"></div>
  </div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Aether</h1>
        <div class="subtitle">Bio-Capture Protocol</div>
      </div>
      <div class="hud-panel">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" />
        </svg>
        <div>
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Specimens</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">
      <svg class="toast-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      <span>Specimen Captured</span>
    </div>
    
    <div id="instructions" class="instructions">Hold Click to Deploy Net</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">Reset Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Focus: Visual Polish, Organic Movement, Atmosphere
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');
  const instrEl = document.getElementById('instructions');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let netRadius = 0;
  let targetNetRadius = 0;
  let time = 0;

  // Configuration
  const CREATURE_COUNT = 8;
  const COLORS = ['#00f0ff', '#ff0055', '#ccff00', '#bd00ff', '#ffcc00'];

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => {
    isMouseDown = true;
    targetNetRadius = 90; // Expanded radius
    instrEl.style.opacity = 0;
  });
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    targetNetRadius = 0;
    // Snap back effect handled in loop
  });

  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
    targetNetRadius = 90;
    instrEl.style.opacity = 0;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    targetNetRadius = 0;
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.025 + 0.01;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.92; // Friction
      this.vy *= 0.92;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  // Distinct Creature Types
  class Creature {
    constructor() {
      this.reset(true);
    }

    reset(initial = false) {
      if (initial) {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
      } else {
        // Spawn logic
        const edge = Math.floor(Math.random() * 4);
        if (edge === 0) { this.x = Math.random() * width; this.y = -50; }
        else if (edge === 1) { this.x = width + 50; this.y = Math.random() * height; }
        else if (edge === 2) { this.x = Math.random() * width; this.y = height + 50; }
        else { this.x = -50; this.y = Math.random() * height; }
      }

      this.type = Math.floor(Math.random() * 3); 
      this.vx = (Math.random() - 0.5) * 1.2;
      this.vy = (Math.random() - 0.5) * 1.2;
      this.radius = Math.random() * 10 + 18;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = 0;
      this.rotSpeed = (Math.random() - 0.5) * 0.03;
      this.wobble = Math.random() * Math.PI * 2;
      this.isCaught = false;
      this.scale = 0; // For spawn animation
      this.targetScale = 1;
    }

    update() {
      // Spawn animation
      this.scale += (this.targetScale - this.scale) * 0.1;

      if (this.isCaught) return;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.angle += this.rotSpeed;
      this.wobble += 0.04;
      
      // Organic drift (Sine wave)
      this.x += Math.sin(this.wobble) * 0.4;
      this.y += Math.cos(this.wobble * 0.8) * 0.2;

      // Bounce boundaries
      if (this.x < -100 || this.x > width + 100) this.vx *= -1;
      if (this.y < -100 || this.y > height + 100) this.vy *= -1;

      // Avoid Mouse (Net) - Repulsion
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      // Repel only if not caught and close
      if (dist < 150 && !isMouseDown) {
        const force = (150 - dist) / 150;
        this.vx += (dx / dist) * force * 0.5;
        this.vy += (dy / dist) * force * 0.5;
      } 
      // Attract if net is active (MouseDown)
      else if (isMouseDown && dist < 300) {
         const force = (300 - dist) / 300;
         this.vx -= (dx / dist) * force * 0.8;
         this.vy -= (dy / dist) * force * 0.8;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 4) {
        this.vx = (this.vx / speed) * 4;
        this.vy = (this.vy / speed) * 4;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.scale(this.scale, this.scale);

      // Glow
      ctx.shadowBlur = 20;
      ctx.shadowColor = this.color;
      ctx.fillStyle = this.color;
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 1.5;

      ctx.beginPath();

      if (this.type === 0) {
        // Type 0: The Shard (Triangle)
        const r = this.radius;
        ctx.moveTo(0, -r);
        ctx.lineTo(r * 0.866, r * 0.5);
        ctx.lineTo(-r * 0.866, r * 0.5);
        ctx.closePath();
      } else if (this.type === 1) {
        // Type 1: The Eye (Diamond)
        const r = this.radius;
        ctx.moveTo(0, -r);
        ctx.quadraticCurveTo(r, 0, 0, r);
        ctx.quadraticCurveTo(-r, 0, 0, -r);
      } else {
        // Type 2: The Geode (Hexagon)
        const r = this.radius;
        for (let i = 0; i < 6; i++) {
          const angle = (i * Math.PI) / 3;
          const x = Math.cos(angle) * r;
          const y = Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
      }

      ctx.fill();
      ctx.stroke();

      // Inner Detail (Core)
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * 0.15, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    // Catch logic happens on mouse UP
    // We check if any creature is within the "Catch Zone" (smaller than repel zone)
    const catchRadius = 60; 

    let caughtCount = 0;

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
        caughtCount++;
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<25; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    // Reset toast timeout if already active
    if (window.toastTimeout) clearTimeout(window.toastTimeout);
    window.toastTimeout = setTimeout(() => toastEl.classList.remove('active'), 1000);

    // Respawn logic
    setTimeout(() => {
      creature.reset();
    }, 1000);
  }

  function resetGame() {
    init();
    // Clear particles
    particles = [];
  }

  function drawNet() {
    // Smoothly animate net size
    netRadius += (targetNetRadius - netRadius) * 0.15;

    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Glow
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#00f0ff';
    
    // Net Shape (Circle with dashed rim)
    ctx.strokeStyle = isMouseDown ? '#fff' : '#00f0ff';
    ctx.lineWidth = 2;
    
    // Main Ring
    ctx.beginPath();
    ctx.arc(0, 0, 40 + netRadius, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner Tech Ring (Dashed)
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    // Rotating dashed ring
    ctx.rotate(time * 0.02);
    ctx.arc(0, 0, 25 + netRadius * 0.6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Crosshair
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.9)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-10, 0); ctx.lineTo(-3, 0);
    ctx.moveTo(10, 0); ctx.lineTo(3, 0);
    ctx.moveTo(0, -10); ctx.lineTo(0, -3);
    ctx.moveTo(0, 10); ctx.lineTo(0, 3);
    ctx.stroke();

    // "Sucking" effect lines if held down
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.beginPath();
      ctx.arc(0, 0, 120 + Math.random()*5, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    time++;
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
