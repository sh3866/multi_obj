<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AETHER: Bio-Capture</title>
<style>
  :root {
    --bg-deep: #020305;
    --bg-panel: rgba(10, 12, 18, 0.6);
    --accent-cyan: #00f0ff;
    --accent-glow: rgba(0, 240, 255, 0.4);
    --accent-lime: #ccff00;
    --text-main: #e0e6ed;
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-tech: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Scene Container --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    cursor: none;
  }

  /* --- Background Environment --- */
  .atmosphere {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    background: 
      radial-gradient(circle at 50% 50%, rgba(10, 20, 40, 0.8) 0%, var(--bg-deep) 80%);
  }

  /* Grid Overlay */
  .grid-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 1;
    pointer-events: none;
    mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
    -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
  }

  /* Vignette */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.9) 100%);
    z-index: 2;
    pointer-events: none;
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 3;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(1rem, 2vw, 2rem);
  }

  /* --- Header / Branding (Redesigned) --- */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
    padding: 1rem 0;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 1rem;
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(1.2rem, 2vw, 1.8rem);
    margin: 0;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #fff;
    opacity: 0.9;
  }

  .version-tag {
    font-family: var(--font-tech);
    font-size: 0.7rem;
    color: var(--accent-cyan);
    border: 1px solid var(--accent-cyan);
    padding: 2px 6px;
    border-radius: 2px;
    opacity: 0.8;
  }

  /* --- HUD (Redesigned) --- */
  .hud-panel {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    background: var(--bg-panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 0.8rem 1.5rem;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .hud-item {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2.2rem;
    color: #fff;
    line-height: 1;
    letter-spacing: -0.02em;
    text-shadow: 0 0 15px var(--accent-glow);
  }

  .stat-label {
    font-family: var(--font-tech);
    font-size: 0.6rem;
    color: var(--accent-cyan);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  /* --- Footer / Action Button --- */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    margin-bottom: 1rem;
  }

  .btn-main {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.8);
    font-family: var(--font-tech);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 0.8rem 2rem;
    border-radius: 2px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-main:hover {
    background: rgba(0, 240, 255, 0.1);
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
    box-shadow: 0 0 20px var(--accent-glow);
  }

  /* --- Toast Notification --- */
  .toast {
    position: absolute;
    top: 35%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0, 0, 0, 0.85);
    border: 1px solid var(--accent-lime);
    color: var(--accent-lime);
    padding: 0.6rem 1.5rem;
    border-radius: 2px;
    font-family: var(--font-tech);
    font-weight: 700;
    letter-spacing: 0.1em;
    font-size: 0.8rem;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(204, 255, 0, 0.15);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Instructions */
  .instructions {
    position: absolute;
    bottom: 15%; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.3);
    font-family: var(--font-tech);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    pointer-events: none;
    transition: opacity 1s ease;
    text-transform: uppercase;
    text-align: center;
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    .header { flex-direction: row; padding-top: 0.5rem; }
    .hud-panel { padding: 0.6rem 1rem; gap: 1rem; }
    .stat-value { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="atmosphere"></div>
  <div class="grid-overlay"></div>
  <div class="vignette"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Aether</h1>
        <span class="version-tag">v0.9.2</span>
      </div>
      
      <!-- Cleaned up HUD -->
      <div class="hud-panel">
        <div class="hud-item">
          <div class="stat-value" id="scoreDisplay">00</div>
          <div class="stat-label">Collected</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      <span>Specimen Secured</span>
    </div>
    
    <div id="instructions" class="instructions">Hold Click to Deploy Net</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">View Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Focus: Stylized Creatures, Net Mechanics, Atmosphere
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');
  const instrEl = document.getElementById('instructions');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let netRadius = 0;
  let targetNetRadius = 0;
  let time = 0;

  // Configuration
  const CREATURE_COUNT = 12;
  const COLORS = ['#00f0ff', '#ff0055', '#ccff00', '#bd00ff', '#ffcc00'];

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => {
    isMouseDown = true;
    targetNetRadius = 130; 
    instrEl.style.opacity = 0;
  });
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    targetNetRadius = 0;
    checkCatch();
  });

  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
    targetNetRadius = 130;
    instrEl.style.opacity = 0;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    targetNetRadius = 0;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.025 + 0.015;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.92; 
      this.vy *= 0.92;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset(true);
    }

    reset(initial = false) {
      if (initial) {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
      } else {
        const edge = Math.floor(Math.random() * 4);
        if (edge === 0) { this.x = Math.random() * width; this.y = -100; }
        else if (edge === 1) { this.x = width + 100; this.y = Math.random() * height; }
        else if (edge === 2) { this.x = Math.random() * width; this.y = height + 100; }
        else { this.x = -100; this.y = Math.random() * height; }
      }

      // 3 Distinct Types: Jelly, Shard, Spore
      this.type = Math.floor(Math.random() * 3); 
      this.vx = (Math.random() - 0.5) * 1.2;
      this.vy = (Math.random() - 0.5) * 1.2;
      this.radius = Math.random() * 10 + 20;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = 0;
      this.rotSpeed = (Math.random() - 0.5) * 0.03;
      this.wobble = Math.random() * Math.PI * 2;
      this.isCaught = false;
      this.scale = 0;
      this.targetScale = 1;
      this.pulse = 0;
    }

    update() {
      this.scale += (this.targetScale - this.scale) * 0.1;
      this.pulse += 0.05;

      if (this.isCaught) return;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.angle += this.rotSpeed;
      this.wobble += 0.04;
      
      // Organic drift
      this.x += Math.sin(this.wobble) * 0.4;
      this.y += Math.cos(this.wobble * 0.8) * 0.2;

      // Bounce boundaries
      if (this.x < -150 || this.x > width + 150) this.vx *= -1;
      if (this.y < -150 || this.y > height + 150) this.vy *= -1;

      // Avoid Mouse (Net) - Repulsion
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 150 && !isMouseDown) {
        const force = (150 - dist) / 150;
        this.vx += (dx / dist) * force * 0.5;
        this.vy += (dy / dist) * force * 0.5;
      } 
      // Attract if net is active
      else if (isMouseDown && dist < 350) {
         const force = (350 - dist) / 350;
         this.vx -= (dx / dist) * force * 1.5;
         this.vy -= (dy / dist) * force * 1.5;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 4) {
        this.vx = (this.vx / speed) * 4;
        this.vy = (this.vy / speed) * 4;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.scale(this.scale, this.scale);

      // Glow
      ctx.shadowBlur = 20;
      ctx.shadowColor = this.color;
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; // Silhouette feel
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2;

      ctx.beginPath();

      if (this.type === 0) {
        // Type 0: The Jelly (Organic Blob)
        const r = this.radius;
        const p = Math.sin(this.pulse) * 3;
        ctx.moveTo(r + p, 0);
        ctx.bezierCurveTo(r + p, r*0.6, r*0.6, r + p, 0, r + p);
        ctx.bezierCurveTo(-r*0.6, r + p, -r - p, r*0.6, -r - p, 0);
        ctx.bezierCurveTo(-r - p, -r*0.6, -r*0.6, -r - p, 0, -r - p);
        ctx.bezierCurveTo(r*0.6, -r - p, r + p, -r*0.6, r + p, 0);
      } else if (this.type === 1) {
        // Type 1: The Shard (Geometric)
        const r = this.radius;
        const p = Math.sin(this.pulse) * 2;
        ctx.moveTo(0, -r - p);
        ctx.lineTo(r*0.8, 0);
        ctx.lineTo(0, r + p);
        ctx.lineTo(-r*0.8, 0);
        ctx.closePath();
      } else {
        // Type 2: The Spore (Complex Hexagon)
        const r = this.radius;
        for (let i = 0; i < 6; i++) {
          const angle = (i * Math.PI) / 3;
          const rMod = i % 2 === 0 ? r : r * 0.6;
          const x = Math.cos(angle) * rMod;
          const y = Math.sin(angle) * rMod;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
      }

      ctx.fill();
      ctx.stroke();

      // Inner Core (Pupil)
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    updateScoreUI();
  }

  function updateScoreUI() {
    scoreEl.innerText = score.toString().padStart(2, '0');
  }

  function checkCatch() {
    const catchRadius = 80; 
    let caughtCount = 0;

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
        caughtCount++;
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    updateScoreUI();
    
    // Visual FX
    for(let i=0; i<25; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    if (window.toastTimeout) clearTimeout(window.toastTimeout);
    window.toastTimeout = setTimeout(() => toastEl.classList.remove('active'), 1200);

    // Respawn logic
    setTimeout(() => {
      creature.reset();
    }, 2500);
  }

  function resetGame() {
    init();
    particles = [];
  }

  function drawNet() {
    // Smoothly animate net size
    netRadius += (targetNetRadius - netRadius) * 0.15;

    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Glow
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#00f0ff';
    
    // Net Shape (Tech Circle)
    ctx.strokeStyle = isMouseDown ? '#fff' : '#00f0ff';
    ctx.lineWidth = 1.5;
    
    // Main Ring
    ctx.beginPath();
    ctx.arc(0, 0, 30 + netRadius, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner Tech Ring (Rotating Dashed)
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.rotate(time * 0.04);
    ctx.arc(0, 0, 15 + netRadius * 0.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Crosshair (Cleaner)
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-8, 0); ctx.lineTo(-3, 0);
    ctx.moveTo(8, 0); ctx.lineTo(3, 0);
    ctx.moveTo(0, -8); ctx.lineTo(0, -3);
    ctx.moveTo(0, 8); ctx.lineTo(0, 3);
    ctx.stroke();

    // "Sucking" effect lines if held down
    if (isMouseDown) {
      ctx.globalAlpha = 0.1;
      ctx.fillStyle = '#00f0ff';
      ctx.beginPath();
      ctx.arc(0, 0, 130, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }

    ctx.restore();
  }

  function loop() {
    time++;
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
