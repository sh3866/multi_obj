<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AETHER: Bio-Capture</title>
<style>
  :root {
    --bg-deep: #020204;
    --accent-cyan: #00f0ff;
    --accent-magenta: #ff0055;
    --accent-lime: #ccff00;
    --glass-panel: rgba(10, 15, 30, 0.4);
    --glass-border: rgba(255, 255, 255, 0.08);
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-tech: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: #fff;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Scene Container --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    cursor: none; /* Hide default cursor */
  }

  /* --- Background Environment --- */
  .atmosphere {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    /* Deep Nebula Gradient */
    background: 
      radial-gradient(circle at 20% 30%, rgba(20, 0, 50, 0.8) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(0, 20, 60, 0.6) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, #050a14 0%, #020204 100%);
  }

  /* Film Grain Overlay */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.07'/%3E%3C/svg%3E");
    opacity: 0.5;
    z-index: 1;
    mix-blend-mode: overlay;
  }

  /* Vignette */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.8) 100%);
    z-index: 2;
    pointer-events: none;
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 3;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(1.5rem, 4vw, 3rem);
  }

  /* --- Header / Branding --- */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
    text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(3rem, 6vw, 5rem);
    margin: 0;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 0.9;
    /* Metallic / Holographic Text Effect */
    background: linear-gradient(to bottom, #fff 0%, #d0d0d0 40%, #808080 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 1px rgba(255,255,255,0.5));
    position: relative;
  }

  /* Custom Ligature/Tech feel on subtitle */
  .subtitle {
    font-family: var(--font-tech);
    font-size: clamp(0.5rem, 0.8vw, 0.75rem);
    color: var(--accent-cyan);
    letter-spacing: 0.6em;
    text-transform: uppercase;
    font-weight: 700;
    margin-left: 0.15rem;
    opacity: 0.8;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .subtitle::before {
    content: '';
    display: block;
    width: 8px;
    height: 8px;
    background-color: var(--accent-cyan);
    box-shadow: 0 0 10px var(--accent-cyan);
  }

  /* --- Diegetic HUD (Scanner Style) --- */
  .hud-panel {
    /* No box background, just tech elements */
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.2rem;
    border: none;
    box-shadow: none;
  }

  .hud-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.5) 100%);
    padding: 0.5rem 1rem;
    border-left: 2px solid var(--accent-cyan);
    border-radius: 0 4px 4px 0;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2rem;
    color: white;
    line-height: 1;
    letter-spacing: -0.02em;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }

  .stat-label {
    font-family: var(--font-tech);
    font-size: 0.6rem;
    color: var(--accent-cyan);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    opacity: 0.8;
  }

  .bio-bar {
    width: 120px;
    height: 4px;
    background: rgba(255,255,255,0.1);
    margin-top: 5px;
    position: relative;
    overflow: hidden;
  }
  
  .bio-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    background: var(--accent-cyan);
    width: 0%;
    box-shadow: 0 0 10px var(--accent-cyan);
    transition: width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* --- Footer / Action Button --- */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    margin-bottom: 1rem;
    align-items: center;
    gap: 1.5rem;
  }

  .btn-main {
    background: rgba(255, 255, 255, 0.02);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.9);
    font-family: var(--font-tech);
    font-size: 0.8rem;
    font-weight: 700;
    padding: 1rem 2.5rem;
    border-radius: 2px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }

  .btn-main:hover {
    background: rgba(0, 240, 255, 0.15);
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
    transform: translateY(-2px);
  }

  .btn-main:active {
    transform: scale(0.98);
  }

  /* --- Toast Notification --- */
  .toast {
    position: absolute;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0, 0, 0, 0.8);
    border: 1px solid var(--accent-lime);
    color: var(--accent-lime);
    padding: 0.8rem 2rem;
    border-radius: 4px;
    font-family: var(--font-tech);
    font-weight: 700;
    letter-spacing: 0.15em;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 40px rgba(204, 255, 0, 0.1);
    display: flex;
    align-items: center;
    gap: 12px;
    backdrop-filter: blur(5px);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Instructions */
  .instructions {
    position: absolute;
    bottom: 20%; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.4);
    font-family: var(--font-tech);
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    pointer-events: none;
    transition: opacity 1.5s ease;
    text-transform: uppercase;
    text-align: center;
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    .header { flex-direction: column; align-items: center; gap: 1rem; }
    .hud-row { border-left: none; border-top: 2px solid var(--accent-cyan); background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%); width: 100%; justify-content: center;}
    .stat-label { writing-mode: horizontal-tb; transform: none; }
    .btn-main { width: 100%; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="atmosphere"></div>
  <div class="noise-overlay"></div>
  <div class="vignette"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Aether</h1>
        <div class="subtitle">Bio-Capture Protocol</div>
      </div>
      <div class="hud-panel">
        <div class="hud-row">
          <div>
            <div class="stat-value" id="scoreDisplay">00</div>
            <div style="font-size: 0.6rem; color: #aaa; letter-spacing: 0.1em; font-family: var(--font-tech);">CAPTURED</div>
          </div>
          <div class="stat-label">BIO-MASS</div>
        </div>
        <div class="bio-bar"><div class="bio-fill" id="bioFill"></div></div>
      </div>
    </header>

    <div id="toast" class="toast">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      <span>Specimen Secured</span>
    </div>
    
    <div id="instructions" class="instructions">Hold Click to Deploy Net</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">View Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Focus: Organic Movement, Visual Polish, Player Interaction
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const bioFillEl = document.getElementById('bioFill');
  const toastEl = document.getElementById('toast');
  const instrEl = document.getElementById('instructions');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let netRadius = 0;
  let targetNetRadius = 0;
  let time = 0;

  // Configuration
  const CREATURE_COUNT = 10;
  const COLORS = ['#00f0ff', '#ff0055', '#ccff00', '#bd00ff', '#ffcc00'];

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => {
    isMouseDown = true;
    targetNetRadius = 120; // Expanded radius
    instrEl.style.opacity = 0;
  });
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    targetNetRadius = 0;
    checkCatch();
  });

  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
    targetNetRadius = 120;
    instrEl.style.opacity = 0;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    targetNetRadius = 0;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 4 + 2;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.94; 
      this.vy *= 0.94;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset(true);
    }

    reset(initial = false) {
      if (initial) {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
      } else {
        // Spawn logic (edges)
        const edge = Math.floor(Math.random() * 4);
        if (edge === 0) { this.x = Math.random() * width; this.y = -100; }
        else if (edge === 1) { this.x = width + 100; this.y = Math.random() * height; }
        else if (edge === 2) { this.x = Math.random() * width; this.y = height + 100; }
        else { this.x = -100; this.y = Math.random() * height; }
      }

      this.type = Math.floor(Math.random() * 3); 
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.radius = Math.random() * 15 + 20;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = 0;
      this.rotSpeed = (Math.random() - 0.5) * 0.04;
      this.wobble = Math.random() * Math.PI * 2;
      this.isCaught = false;
      this.scale = 0;
      this.targetScale = 1;
      this.trail = []; // For movement trails
    }

    update() {
      // Spawn animation
      this.scale += (this.targetScale - this.scale) * 0.1;

      if (this.isCaught) return;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.angle += this.rotSpeed;
      this.wobble += 0.05;
      
      // Organic drift
      this.x += Math.sin(this.wobble) * 0.5;
      this.y += Math.cos(this.wobble * 0.8) * 0.3;

      // Trail logic
      if (time % 5 === 0) {
        this.trail.push({x: this.x, y: this.y, alpha: 0.5});
        if (this.trail.length > 10) this.trail.shift();
      }
      // Update trail fade
      this.trail.forEach(t => t.alpha -= 0.01);

      // Bounce boundaries
      if (this.x < -150 || this.x > width + 150) this.vx *= -1;
      if (this.y < -150 || this.y > height + 150) this.vy *= -1;

      // Avoid Mouse (Net) - Repulsion
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      // Repel only if not caught and close
      if (dist < 180 && !isMouseDown) {
        const force = (180 - dist) / 180;
        this.vx += (dx / dist) * force * 0.8;
        this.vy += (dy / dist) * force * 0.8;
      } 
      // Attract if net is active (MouseDown)
      else if (isMouseDown && dist < 400) {
         const force = (400 - dist) / 400;
         this.vx -= (dx / dist) * force * 1.2;
         this.vy -= (dy / dist) * force * 1.2;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 5) {
        this.vx = (this.vx / speed) * 5;
        this.vy = (this.vy / speed) * 5;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.scale(this.scale, this.scale);

      // Draw Trail
      ctx.restore(); // Reset transform for trail to stay static-ish
      ctx.save();
      this.trail.forEach(t => {
        ctx.globalAlpha = t.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(t.x, t.y, this.radius * 0.3, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.scale(this.scale, this.scale);

      // Glow
      ctx.shadowBlur = 25;
      ctx.shadowColor = this.color;
      ctx.fillStyle = this.color;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 2;

      ctx.beginPath();

      if (this.type === 0) {
        // Type 0: The Jelly (Blob)
        const r = this.radius;
        ctx.moveTo(r, 0);
        ctx.bezierCurveTo(r, r*0.5, r*0.5, r, 0, r);
        ctx.bezierCurveTo(-r*0.5, r, -r, r*0.5, -r, 0);
        ctx.bezierCurveTo(-r, -r*0.5, -r*0.5, -r, 0, -r);
        ctx.bezierCurveTo(r*0.5, -r, r, -r*0.5, r, 0);
      } else if (this.type === 1) {
        // Type 1: The Eye (Diamond)
        const r = this.radius;
        ctx.moveTo(0, -r);
        ctx.quadraticCurveTo(r, 0, 0, r);
        ctx.quadraticCurveTo(-r, 0, 0, -r);
      } else {
        // Type 2: The Geode (Hexagon)
        const r = this.radius;
        for (let i = 0; i < 6; i++) {
          const angle = (i * Math.PI) / 3;
          const x = Math.cos(angle) * r;
          const y = Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
      }

      ctx.fill();
      ctx.stroke();

      // Inner Detail (Pupil/Core)
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * 0.2, 0, Math.PI * 2);
      ctx.fill();
      
      // Eye reflection
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.arc(-this.radius * 0.05, -this.radius * 0.05, this.radius * 0.08, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    updateScoreUI();
  }

  function updateScoreUI() {
    scoreEl.innerText = score.toString().padStart(2, '0');
    // Simple bio-mass bar calculation
    const percent = Math.min((score / 20) * 100, 100);
    bioFillEl.style.width = `${percent}%`;
  }

  function checkCatch() {
    // Catch logic happens on mouse UP
    const catchRadius = 70; 

    let caughtCount = 0;

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
        caughtCount++;
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    updateScoreUI();
    
    // Visual FX
    for(let i=0; i<30; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    if (window.toastTimeout) clearTimeout(window.toastTimeout);
    window.toastTimeout = setTimeout(() => toastEl.classList.remove('active'), 1200);

    // Respawn logic
    setTimeout(() => {
      creature.reset();
    }, 2000);
  }

  function resetGame() {
    init();
    particles = [];
  }

  function drawNet() {
    // Smoothly animate net size
    netRadius += (targetNetRadius - netRadius) * 0.15;

    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f0ff';
    
    // Net Shape (Tech Circle)
    ctx.strokeStyle = isMouseDown ? '#fff' : '#00f0ff';
    ctx.lineWidth = 2;
    
    // Main Ring
    ctx.beginPath();
    ctx.arc(0, 0, 40 + netRadius, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner Tech Ring (Dashed)
    ctx.setLineDash([4, 8]);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    // Rotating dashed ring
    ctx.rotate(time * 0.03);
    ctx.arc(0, 0, 25 + netRadius * 0.6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Crosshair
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.9)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-15, 0); ctx.lineTo(-5, 0);
    ctx.moveTo(15, 0); ctx.lineTo(5, 0);
    ctx.moveTo(0, -15); ctx.lineTo(0, -5);
    ctx.moveTo(0, 15); ctx.lineTo(0, 5);
    ctx.stroke();

    // "Sucking" effect lines if held down
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.beginPath();
      ctx.arc(0, 0, 120 + Math.random()*5, 0, Math.PI * 2);
      ctx.stroke();
      
      // Particle streams towards center
      ctx.globalAlpha = 0.3;
      ctx.strokeStyle = '#00f0ff';
      for(let i=0; i<8; i++) {
        ctx.beginPath();
        const angle = (time * 0.1) + (i * (Math.PI*2)/8);
        ctx.arc(0, 0, 80 + Math.random()*40, angle, angle + 0.5);
        ctx.stroke();
      }
      ctx.globalAlpha = 1.0;
    }

    ctx.restore();
  }

  function loop() {
    time++;
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
