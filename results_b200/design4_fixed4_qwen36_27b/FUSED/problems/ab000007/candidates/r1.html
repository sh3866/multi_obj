<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina: Capture & Collection</title>
<style>
  :root {
    --bg-deep: #050508;
    --bg-mid: #0a0f1e;
    --accent-cyan: #00f3ff;
    --accent-purple: #bd00ff;
    --accent-lime: #ccff00;
    --accent-pink: #ff0055;
    --glass-surface: rgba(10, 15, 30, 0.6);
    --glass-border: rgba(255, 255, 255, 0.15);
    --font-display: 'Impact', 'Arial Black', 'Helvetica Neue', sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Scene Container --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* --- Background: Atmosphere & Grid --- */
  .atmosphere {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* The Grid: Stylized as a fading neon floor */
  .grid-bg {
    position: absolute;
    top: 50%; left: 50%;
    width: 200%; height: 200%;
    background-image: 
      linear-gradient(var(--glass-border) 1px, transparent 1px),
      linear-gradient(90deg, var(--glass-border) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: translate(-50%, -50%) perspective(600px) rotateX(60deg);
    opacity: 0.15;
    mask-image: linear-gradient(to bottom, transparent 10%, black 50%, transparent 90%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 10%, black 50%, transparent 90%);
    animation: gridMove 20s linear infinite;
  }

  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 60px; }
  }

  /* Fog / Vignette */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 30%, var(--bg-deep) 85%);
    z-index: 1;
  }

  .fog-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(180deg, rgba(5,5,8,0.8) 0%, rgba(5,5,8,0.2) 50%, rgba(5,5,8,0.9) 100%);
    z-index: 1;
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(1.5rem, 4vw, 3rem);
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(3rem, 6vw, 5rem);
    margin: 0;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    line-height: 0.9;
    background: linear-gradient(to bottom, #fff 30%, #a0a0a0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(0, 243, 255, 0.3));
  }

  .subtitle {
    font-size: clamp(0.7rem, 1.2vw, 0.9rem);
    color: var(--accent-cyan);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 600;
    text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    margin-left: 0.2rem;
  }

  /* HUD */
  .hud-panel {
    background: var(--glass-surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    padding: 0.5rem 1.5rem;
    border-radius: 100px;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    transition: transform 0.2s;
  }

  .hud-panel:hover {
    transform: scale(1.05);
    border-color: var(--accent-cyan);
  }

  .stat-icon {
    width: 28px; height: 28px;
    fill: var(--accent-lime);
    filter: drop-shadow(0 0 8px var(--accent-lime));
    animation: pulse 2s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2rem;
    color: white;
    letter-spacing: -0.05em;
  }

  .stat-label {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    display: block;
    text-align: right;
  }

  /* Footer / Actions */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    margin-bottom: 1rem;
  }

  .btn-main {
    background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    color: white;
    font-family: var(--font-display);
    font-size: 1.2rem;
    padding: 1.2rem 4rem;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 0 rgba(0, 243, 255, 0);
  }

  .btn-main::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }

  .btn-main:hover {
    background: rgba(0, 243, 255, 0.15);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 30px rgba(0, 243, 255, 0.3), inset 0 0 20px rgba(0, 243, 255, 0.1);
    transform: translateY(-3px);
    text-shadow: 0 0 8px white;
  }

  .btn-main:hover::after {
    transform: translateX(100%);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0, 0, 0, 0.9);
    border: 1px solid var(--accent-lime);
    color: var(--accent-lime);
    padding: 1rem 2.5rem;
    border-radius: 2px;
    font-family: var(--font-display);
    letter-spacing: 0.15em;
    font-size: 1.2rem;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 50px rgba(204, 255, 0, 0.2);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Instructions overlay (fades out) */
  .instructions {
    position: absolute;
    bottom: 20%; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.4);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    pointer-events: none;
    transition: opacity 1s;
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    .header { flex-direction: column; align-items: center; gap: 1rem; }
    .hud-panel { margin-top: 1rem; }
    .btn-main { width: 100%; padding: 1rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="atmosphere">
    <div class="grid-bg"></div>
    <div class="fog-overlay"></div>
  </div>
  <div class="vignette"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Lumina</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-panel">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" />
        </svg>
        <div>
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Captured</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured!</div>
    <div id="instructions" class="instructions">Click to Deploy Net</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Focus: Visual Polish, Distinct Creature Shapes, Atmosphere
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');
  const instrEl = document.getElementById('instructions');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let netRadius = 0; // For animation
  let targetNetRadius = 0;

  // Configuration
  const CREATURE_COUNT = 7;
  const COLORS = ['#00f0ff', '#ff0055', '#ccff00', '#bd00ff'];

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => {
    isMouseDown = true;
    targetNetRadius = 70;
    instrEl.style.opacity = 0;
  });
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    targetNetRadius = 0;
    checkCatch();
  });

  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
    targetNetRadius = 70;
    instrEl.style.opacity = 0;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    targetNetRadius = 0;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.015;
      this.size = Math.random() * 4 + 2;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.95; // Friction
      this.vy *= 0.95;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  // Distinct Creature Types
  class Creature {
    constructor() {
      this.reset(true);
    }

    reset(initial = false) {
      // Spawn logic
      if (initial) {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
      } else {
        // Spawn off screen or edges
        if (Math.random() < 0.5) {
          this.x = Math.random() < 0.5 ? -50 : width + 50;
          this.y = Math.random() * height;
        } else {
          this.x = Math.random() * width;
          this.y = Math.random() < 0.5 ? -50 : height + 50;
        }
      }

      this.type = Math.floor(Math.random() * 3); // 0: Shard, 1: Eye, 2: Geode
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.radius = Math.random() * 15 + 20;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = 0;
      this.rotSpeed = (Math.random() - 0.5) * 0.02;
      this.wobble = Math.random() * Math.PI * 2;
      this.isCaught = false;
      this.scale = 1;
    }

    update() {
      if (this.isCaught) return;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.angle += this.rotSpeed;
      this.wobble += 0.03;
      
      // Organic drift
      this.x += Math.sin(this.wobble) * 0.3;

      // Bounce
      if (this.x < -100 || this.x > width + 100) this.vx *= -1;
      if (this.y < -100 || this.y > height + 100) this.vy *= -1;

      // Avoid Mouse (Net) - stronger repulsion
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 200) {
        const force = (200 - dist) / 200;
        this.vx += (dx / dist) * force * 0.8;
        this.vy += (dy / dist) * force * 0.8;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 3) {
        this.vx = (this.vx / speed) * 3;
        this.vy = (this.vy / speed) * 3;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      // Glow
      ctx.shadowBlur = 25;
      ctx.shadowColor = this.color;
      ctx.fillStyle = this.color;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;

      ctx.beginPath();

      // Distinct Shapes
      if (this.type === 0) {
        // Type 0: The Shard (Triangle)
        const r = this.radius;
        ctx.moveTo(0, -r);
        ctx.lineTo(r * 0.866, r * 0.5);
        ctx.lineTo(-r * 0.866, r * 0.5);
        ctx.closePath();
      } else if (this.type === 1) {
        // Type 1: The Eye (Diamond)
        const r = this.radius;
        ctx.moveTo(0, -r);
        ctx.quadraticCurveTo(r, 0, 0, r);
        ctx.quadraticCurveTo(-r, 0, 0, -r);
      } else {
        // Type 2: The Geode (Hexagon)
        const r = this.radius;
        for (let i = 0; i < 6; i++) {
          const angle = (i * Math.PI) / 3;
          const x = Math.cos(angle) * r;
          const y = Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
      }

      // Fill & Stroke
      ctx.fill();
      ctx.stroke();

      // Inner Detail (Core)
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    // Catch logic happens on mouse UP
    const catchRadius = 80; // Generous radius

    let caughtCount = 0;

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
        caughtCount++;
      }
    });

    if (caughtCount > 0) {
      // Shake effect or extra flair could go here
    }
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<20; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 800);

    // Respawn logic
    setTimeout(() => {
      creature.reset();
    }, 1500);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    // Smoothly animate net size
    netRadius += (targetNetRadius - netRadius) * 0.2;

    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f3ff';
    
    // Net Shape (Circle with dashed rim)
    ctx.strokeStyle = isMouseDown ? '#fff' : '#00f3ff';
    ctx.lineWidth = 2;
    
    // Main Ring
    ctx.beginPath();
    ctx.arc(0, 0, 50 + netRadius, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner Tech Ring (Dashed)
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.6)';
    ctx.beginPath();
    ctx.arc(0, 0, 35 + netRadius * 0.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Crosshair
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.8)';
    ctx.beginPath();
    ctx.moveTo(-15, 0); ctx.lineTo(-5, 0);
    ctx.moveTo(15, 0); ctx.lineTo(5, 0);
    ctx.moveTo(0, -15); ctx.lineTo(0, -5);
    ctx.moveTo(0, 15); ctx.lineTo(0, 5);
    ctx.stroke();

    // "Sucking" effect lines if held down
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.beginPath();
      ctx.arc(0, 0, 100 + Math.random()*10, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
