<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Ascension - Skill Matrix</title>
<style>
    :root {
        /* Palette: Deep Void & Arcane Gold */
        --bg-deep: #030305;
        --bg-panel: rgba(15, 16, 22, 0.9);
        --bg-panel-border: rgba(255, 255, 255, 0.08);
        
        --primary: #fbbf24; /* Amber/Gold */
        --primary-dim: #78350f;
        --primary-glow: rgba(251, 191, 36, 0.6);
        
        --secondary: #818cf8; /* Indigo */
        --secondary-glow: rgba(129, 140, 248, 0.5);
        
        --locked: #0f1115;
        --locked-border: #2a2d38;
        
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --text-highlight: #ffffff;

        /* Typography */
        --font-display: 'Times New Roman', 'Georgia', serif;
        --font-ui: 'Segoe UI', system-ui, sans-serif;
        
        /* Layout */
        --sidebar-width: 280px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Atmosphere & Background --- */
    .bg-atmosphere {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: 
            radial-gradient(circle at 50% 50%, rgba(30, 27, 75, 0.3) 0%, transparent 60%),
            radial-gradient(circle at 50% 0%, rgba(251, 191, 36, 0.03) 0%, transparent 40%),
            linear-gradient(to bottom, #020203, #0a0a12);
    }

    /* Fog Effect */
    .fog-layer {
        position: absolute;
        inset: 0;
        z-index: 1;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        opacity: 0.4;
        pointer-events: none;
        animation: fogDrift 60s linear infinite;
    }

    @keyframes fogDrift {
        0% { background-position: 0 0; }
        100% { background-position: 100px 100px; }
    }

    /* --- Top Header Bar (Replaces Heavy Sidebar) --- */
    header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 70px;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        pointer-events: none; /* Let clicks pass to map */
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 20px;
        pointer-events: auto;
    }

    .char-avatar {
        width: 50px;
        height: 50px;
        border-radius: 4px;
        background: #1a1a22;
        border: 1px solid var(--primary);
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 1.5rem;
        color: var(--primary);
    }

    .char-info {
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.2rem;
        color: #fff;
        letter-spacing: 0.05em;
        line-height: 1;
    }

    .char-class {
        font-size: 0.65rem;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-weight: 700;
        margin-top: 4px;
    }

    .header-center {
        flex: 1;
        max-width: 400px;
        pointer-events: auto;
    }

    .xp-container {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .xp-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.6rem;
        color: var(--text-muted);
        font-weight: 600;
        letter-spacing: 0.05em;
    }

    .xp-track {
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 3px;
        overflow: hidden;
        position: relative;
    }

    .xp-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--primary-dim), var(--primary));
        box-shadow: 0 0 10px var(--primary-glow);
        position: relative;
    }

    .xp-fill::after {
        content: '';
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 20px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6));
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 20px;
        pointer-events: auto;
    }

    .level-badge {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.6);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 4px 12px;
        border-radius: 4px;
    }
    .level-label { font-size: 0.5rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
    .level-val { font-size: 1.2rem; font-weight: 700; color: #fff; }

    .points-display {
        display: flex;
        align-items: center;
        gap: 10px;
        background: linear-gradient(90deg, rgba(129, 140, 248, 0.1), rgba(129, 140, 248, 0.05));
        border: 1px solid rgba(129, 140, 248, 0.3);
        padding: 6px 16px;
        border-radius: 4px;
        box-shadow: 0 0 15px rgba(129, 140, 248, 0.1);
    }
    
    .pts-icon {
        width: 20px;
        height: 20px;
        fill: var(--secondary);
        filter: drop-shadow(0 0 5px var(--secondary-glow));
    }

    .pts-val {
        font-size: 1.4rem;
        font-weight: 800;
        color: #fff;
        font-family: var(--font-display);
        text-shadow: 0 0 10px var(--secondary-glow);
    }

    /* --- Sidebar (Attributes Only) --- */
    aside {
        position: absolute;
        top: 90px;
        left: 20px;
        bottom: 20px;
        width: var(--sidebar-width);
        z-index: 50;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .panel {
        background: var(--bg-panel);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--bg-panel-border);
        border-radius: 6px;
        padding: 16px;
        pointer-events: auto;
        box-shadow: 0 10px 30px -10px rgba(0,0,0,0.8);
        position: relative;
        overflow: hidden;
    }

    .panel-title {
        font-size: 0.6rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 12px;
        font-weight: 700;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding-bottom: 8px;
        display: flex;
        justify-content: space-between;
    }

    .stats-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .stat-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.03);
        border-radius: 4px;
        transition: all 0.2s;
    }
    
    .stat-item:hover {
        background: rgba(255,255,255,0.06);
        border-color: rgba(255,255,255,0.1);
        transform: translateX(4px);
    }

    .stat-name {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-weight: 600;
        letter-spacing: 0.05em;
    }

    .stat-val {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--text-highlight);
        font-family: var(--font-ui);
        text-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    /* --- Main Canvas Area --- */
    .tree-container {
        position: absolute;
        inset: 0;
        z-index: 10;
        overflow: hidden;
        cursor: grab;
        /* Radial vignette to focus on center */
        background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.6) 100%);
    }
    
    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 0;
        left: 0;
        width: 2400px;
        height: 1800px;
        transform-origin: center center;
    }

    /* --- SVG Connections (Thematic) --- */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: visible;
    }

    /* Angular Path Style */
    .connection-path {
        fill: none;
        stroke-width: 2;
        stroke-linejoin: miter;
        stroke-linecap: square;
        transition: all 0.6s ease;
    }

    .path-locked {
        stroke: rgba(255, 255, 255, 0.08);
        stroke-dasharray: 8, 8;
    }

    .path-active {
        stroke: var(--primary);
        stroke-width: 3;
        filter: drop-shadow(0 0 8px var(--primary-glow));
    }

    /* Rune flow effect */
    .path-flow {
        fill: none;
        stroke: #fff;
        stroke-width: 1;
        opacity: 0.6;
        stroke-dasharray: 2, 12;
        animation: runeFlow 4s linear infinite;
    }

    @keyframes runeFlow {
        to { stroke-dashoffset: -28; }
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        z-index: 5;
        transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .node:hover {
        z-index: 100;
        transform: translate(-50%, -50%) scale(1.15);
    }

    /* Node Shape - Hexagon */
    .node-shape {
        width: 72px;
        height: 72px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .node-hex {
        position: absolute;
        inset: 0;
        background: #0a0a0e;
        clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        transition: all 0.3s ease;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
    }
    
    /* Border trick */
    .node-hex-border {
        position: absolute;
        inset: 0;
        background: linear-gradient(var(--locked-border), var(--locked-border)) padding-box,
                    linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.05)) border-box;
        clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        border: 1px solid transparent;
        z-index: 1;
        transition: all 0.3s ease;
    }

    .node-icon {
        width: 32px;
        height: 32px;
        fill: var(--text-muted);
        opacity: 0.3;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        transition: all 0.3s ease;
        z-index: 2;
    }

    .node-label {
        margin-top: 10px;
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        opacity: 0;
        transform: translateY(-5px);
        transition: all 0.2s ease;
        pointer-events: none;
        text-shadow: 0 2px 4px rgba(0,0,0,1);
        white-space: nowrap;
    }

    .node:hover .node-label {
        opacity: 1;
        transform: translateY(0);
        color: var(--text-highlight);
    }

    /* --- Node States --- */
    
    /* Unlocked / Active */
    .node.unlocked .node-hex {
        background: radial-gradient(circle at 50% 50%, #3a3018, #1a1508);
        box-shadow: 0 0 25px var(--primary-glow);
    }
    
    .node.unlocked .node-hex-border {
        background: linear-gradient(135deg, var(--primary), #b45309) border-box;
        border: 1px solid var(--primary);
    }
    
    .node.unlocked .node-icon {
        fill: var(--primary);
        filter: drop-shadow(0 0 8px var(--primary));
        opacity: 1;
    }

    /* Available (Ready to unlock) */
    .node.available .node-hex-border {
        border-color: rgba(255,255,255,0.5);
        background: rgba(255,255,255,0.15) border-box;
        animation: pulseBorder 2s infinite;
    }
    
    .node.available .node-icon {
        fill: #fff;
        opacity: 0.9;
    }

    @keyframes pulseBorder {
        0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.2); }
        70% { box-shadow: 0 0 0 6px rgba(255,255,255,0); }
        100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        width: 300px;
        background: rgba(10, 10, 14, 0.95);
        border: 1px solid rgba(255,255,255,0.1);
        border-left: 4px solid var(--primary);
        padding: 0;
        pointer-events: none;
        opacity: 0;
        transform: translate(20px, 20px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 200;
        box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        backdrop-filter: blur(12px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translate(0, 0);
    }

    .tooltip-content {
        padding: 20px;
    }

    .tooltip h3 {
        color: var(--text-highlight);
        font-family: var(--font-display);
        margin-bottom: 2px;
        font-size: 1.4rem;
        letter-spacing: 0.02em;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 8px;
        margin-bottom: 8px;
    }

    .tooltip .type {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--primary);
        letter-spacing: 0.2em;
        font-weight: 800;
        margin-bottom: 12px;
        display: block;
    }

    .tooltip p {
        font-size: 0.9rem;
        line-height: 1.6;
        color: #cbd5e1;
        margin-bottom: 12px;
        font-weight: 400;
    }

    .tooltip .req {
        font-size: 0.75rem;
        color: #fca5a5;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(220, 38, 38, 0.1);
        padding: 10px;
        border: 1px solid rgba(220, 38, 38, 0.2);
        border-radius: 4px;
        margin-top: 8px;
    }
    
    .tooltip.unlocked .req { display: none; }
    .tooltip.unlocked { border-left-color: var(--primary); }

    /* --- Responsive tweaks --- */
    @media (max-width: 1024px) {
        aside { display: none; } /* Hide sidebar on smaller screens, maybe move to modal */
    }

</style>
</head>

        { id: 't4_cross1', x: 550, y: 1200, name: "Battle Cry", type: "Ultimate", desc: "Increases party damage by 20%.", unlocked: false, req: 't3_str1' },
        { id: 't4_cross2', x: 1800, y: 1200, name: "Entropy", type: "Ultimate", desc: "Decay all life in area over time.", unlocked: false, req: 't3_dex2' },
        { id: 't4_cross3', x: 1100, y: 1300, name: "Void Walker", type: "Ultimate", desc: "Teleport anywhere on the map.", unlocked: false, req: 't3_int2' },
        
        // --- FILLER FOR DENSITY ---
        { id: 'fill1', x: 250, y: 800, name: "Iron Skin", type: "Passive", desc: "Reduce physical damage by 10%.", unlocked: false, req: 't2_str1' },
        { id: 'fill2', x: 2050, y: 800, name: "Quick Hands", type: "Passive", desc: "Reduces cooldowns by 5%.", unlocked: false, req: 't2_dex1' },
        { id: 'fill3', x: 850, y: 1200, name: "Lava Flow", type: "Passive", desc: "Fireball leaves burning trails.", unlocked: false, req: 't3_int1' },
        { id: 'fill4', x: 1550, y: 1300, name: "Absolute Zero", type: "Ultimate", desc: "Time stops for enemies for 1s.", unlocked: false, req: 't3_int3' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z",
        origin: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const ww = 2400;
        const wh = 1800;
        
        // Center the world initially
        const panX = cw/2 - ww/2;
        const panY = ch/2 - wh/2;
        
        world.style.transform = `translate(${panX}px, ${panY}px) scale(1)`;
        updatePanState(panX, panY, 1);

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.type === 'Origin') iconPath = icons.origin;

            node.innerHTML = `
                <div class="node-shape">
                    <div class="node-hex-border"></div>
                    <div class="node-hex"></div>
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
                <div class="node-label">${skill.name}</div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawConnections();
    }

    // --- Drawing Lines (Angular / Thematic) ---
    function drawConnections() {
        // Keep the defs, remove paths
        const defs = svg.querySelector('defs');
        svg.innerHTML = '';
        svg.appendChild(defs);

        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    
                    // --- New Connection Style: Angular / Stepped ---
                    // Instead of Bezier, we use orthogonal lines (Manhattan distance style)
                    // Start at Parent, go halfway in one axis, then the other axis.
                    const x1 = parent.x;
                    const y1 = parent.y;
                    const x2 = skill.x;
                    const y2 = skill.y;

                    // Determine midpoint for the "step"
                    // We prioritize the axis with greater distance for the first segment
                    const dx = Math.abs(x2 - x1);
                    const dy = Math.abs(y2 - y1);
                    
                    let mx, my;
                    if (dx > dy) {
                        mx = (x1 + x2) / 2;
                        my = y1;
                    } else {
                        mx = x1;
                        my = (y1 + y2) / 2;
                    }

                    const d = `M ${x1} ${y1} L ${mx} ${my} L ${x2} ${y2}`;
                    
                    path.setAttribute('d', d);
                    path.classList.add('connection-path');
                    
                    // Logic: Active path if node is unlocked
                    if (skill.unlocked) {
                        path.classList.add('path-active');
                        path.setAttribute('filter', 'url(#glow)');
                        
                        // Add animated flow line on top
                        const flowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        flowPath.setAttribute('d', d);
                        flowPath.classList.add('path-flow');
                        svg.appendChild(flowPath);
                    } else {
                        path.classList.add('path-locked');
                    }
                    
                    svg.appendChild(path);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.add('unlocked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.remove('unlocked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg><span>Requires: ${reqSkill ? reqSkill.name : 'Unknown'}</span>`;
            ttReq.style.display = 'flex';
        }

        tooltip.classList.add('visible');
        positionTooltip(e.clientX, e.clientY);
    }

    function positionTooltip(x, y) {
        const ttWidth = 300;
        const ttHeight = 200;
        const winWidth = window.innerWidth;
        const winHeight = window.innerHeight;

        let left = x + 20;
        let top = y + 20;

        if (left + ttWidth > winWidth) left = x - ttWidth - 20;
        if (top + ttHeight > winHeight) top = y - ttHeight - 20;

        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        // Logic: Can unlock if not unlocked, has parent unlocked, and has points
        if (!skill.unlocked) {
            const parent = skills.find(s => s.id === skill.req);
            if (!skill.req || (parent && parent.unlocked)) {
                // Simulate point cost
                const spBadge = document.getElementById('pointsCounter');
                let currentPoints = parseInt(spBadge.innerText);
                
                if(currentPoints > 0) {
                    skill.unlocked = true;
                    spBadge.innerText = currentPoints - 1;
                    updateVisuals();
                }
            }
        }
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            
            // Reset classes
            el.className = 'node';
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                // Check availability
                if (!s.req) {
                    el.classList.add('available');
                } else {
                    const parent = skills.find(sk => sk.id === s.req);
                    if (parent && parent.unlocked) {
                        el.classList.add('available');
                    }
                }
            }
        });
        drawConnections();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0, panY = 0, scale = 1;

    function updatePanState(px, py, sc) {
        panX = px; panY = py; scale = sc;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updatePanState(panX, panY, scale);
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.3, scale + delta), 2.0);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        // Zoom towards mouse
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        updatePanState(panX, panY, newScale);
    });

    init();

</script>
</body>
</html>
