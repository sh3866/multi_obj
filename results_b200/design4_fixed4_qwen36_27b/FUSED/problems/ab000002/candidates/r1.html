<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Ascension - Skill Matrix</title>
<style>
    :root {
        --bg-deep: #050508;
        --bg-panel: rgba(18, 20, 28, 0.7);
        --bg-panel-border: rgba(255, 255, 255, 0.08);
        
        --primary: #0ea5e9; /* Cyan */
        --primary-glow: rgba(14, 165, 233, 0.5);
        --secondary: #6366f1; /* Indigo */
        --secondary-glow: rgba(99, 102, 241, 0.5);
        --locked: #334155;
        --locked-border: #475569;
        
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        
        --font-display: 'Georgia', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background Effects --- */
    .bg-effects {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: 
            radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.08) 0%, transparent 60%),
            radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
            url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    }
    
    .scanlines {
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%);
        background-size: 100% 4px;
        z-index: 1;
        pointer-events: none;
        opacity: 0.3;
    }

    /* --- Header --- */
    header {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 20;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        background: linear-gradient(to bottom, rgba(5,5,8,0.9), transparent);
    }

    .header-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 1.8rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 0 15px var(--primary-glow);
        margin: 0;
    }

    .subtitle {
        font-size: 0.75rem;
        color: var(--primary);
        letter-spacing: 0.4em;
        text-transform: uppercase;
        margin-top: 2px;
        text-shadow: 0 0 8px var(--primary-glow);
    }

    /* --- Main Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        z-index: 10;
        overflow: hidden;
    }

    /* --- Sidebar (Refined) --- */
    aside {
        width: 280px;
        background: var(--bg-panel);
        border-right: 1px solid var(--bg-panel-border);
        backdrop-filter: blur(12px);
        display: flex;
        flex-direction: column;
        padding: 25px;
        z-index: 5;
        box-shadow: 5px 0 30px rgba(0,0,0,0.6);
        transition: width 0.3s ease;
    }

    .stat-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 20px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 15px;
    }

    .char-info h2 {
        font-family: var(--font-display);
        font-size: 1.4rem;
        color: var(--text-main);
        margin-bottom: 2px;
    }
    
    .char-info span {
        font-size: 0.8rem;
        color: var(--secondary);
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    .level-badge {
        background: rgba(0,0,0,0.4);
        border: 1px solid var(--primary);
        padding: 5px 10px;
        border-radius: 4px;
        text-align: center;
        box-shadow: 0 0 10px rgba(14, 165, 233, 0.2);
    }
    
    .level-badge .lvl {
        display: block;
        font-size: 1.5rem;
        font-weight: bold;
        line-height: 1;
        color: var(--primary);
    }
    
    .level-badge .lbl {
        font-size: 0.6rem;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    /* Skill Points Floating */
    .sp-badge {
        margin: -10px auto 20px auto;
        position: relative;
        z-index: 20;
        background: linear-gradient(135deg, #1e293b, #0f172a);
        border: 2px solid var(--primary);
        width: 70px;
        height: 70px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        box-shadow: 0 0 20px var(--primary-glow);
        animation: pulse 3s infinite ease-in-out;
    }
    
    .sp-val {
        font-size: 1.8rem;
        font-weight: bold;
        color: #fff;
        line-height: 1;
    }
    
    .sp-lbl {
        font-size: 0.6rem;
        text-transform: uppercase;
        color: var(--primary);
        letter-spacing: 0.05em;
    }

    .xp-section {
        margin-bottom: 25px;
    }
    
    .xp-bar-container {
        height: 6px;
        background: #0f172a;
        border-radius: 3px;
        overflow: hidden;
        margin-top: 8px;
        border: 1px solid rgba(255,255,255,0.05);
    }
    
    .xp-fill {
        height: 100%;
        width: 65%;
        background: var(--secondary);
        box-shadow: 0 0 10px var(--secondary-glow);
        position: relative;
    }
    
    .xp-fill::after {
        content: '';
        position: absolute;
        top:0; left:0; bottom:0; right:0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        transform: translateX(-100%);
        animation: shimmer 2s infinite;
    }

    .stat-list {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        padding: 5px 0;
        border-bottom: 1px dashed rgba(255,255,255,0.05);
    }
    
    .stat-name { color: var(--text-muted); }
    .stat-val { color: var(--text-main); font-family: var(--font-display); }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, rgba(20,20,30,0) 0%, rgba(0,0,0,0.4) 100%);
    }
    
    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1400px;
        height: 1200px;
        transform-origin: center center;
        /* Will be set by JS */
    }

    /* SVG Lines */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    .connection-path {
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        transition: stroke 0.5s ease, filter 0.5s ease, stroke-width 0.5s ease;
    }

    .path-locked {
        stroke: rgba(71, 85, 105, 0.3);
        stroke-dasharray: 5, 5;
    }

    .path-active {
        stroke: var(--primary);
        filter: drop-shadow(0 0 4px var(--primary));
        stroke-width: 3;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        z-index: 2;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .node:hover {
        z-index: 100;
        transform: translate(-50%, -50%) scale(1.15);
    }

    .node-shape {
        width: 64px;
        height: 64px;
        background: #0f172a;
        border: 2px solid var(--locked-border);
        border-radius: 50%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        transition: all 0.3s ease;
    }

    /* Inner Tech Ring */
    .node-shape::before {
        content: '';
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        border: 1px dashed rgba(255,255,255,0.1);
    }

    .node-icon {
        width: 28px;
        height: 28px;
        fill: var(--text-muted);
        opacity: 0.6;
        transition: all 0.3s ease;
    }

    .node-label {
        margin-top: 8px;
        font-size: 0.7rem;
        color: var(--text-muted);
        background: rgba(0,0,0,0.8);
        padding: 2px 6px;
        border-radius: 2px;
        white-space: nowrap;
        opacity: 0;
        transform: translateY(-5px);
        transition: all 0.2s ease;
        pointer-events: none;
    }

    .node:hover .node-label {
        opacity: 1;
        transform: translateY(0);
    }

    /* Node States */
    
    /* Unlocked / Active */
    .node.unlocked .node-shape {
        background: radial-gradient(circle at 30% 30%, rgba(14, 165, 233, 0.2), #0f172a);
        border-color: var(--primary);
        box-shadow: 0 0 20px var(--primary-glow), inset 0 0 10px rgba(14, 165, 233, 0.2);
    }
    
    .node.unlocked .node-icon {
        fill: #fff;
        filter: drop-shadow(0 0 5px var(--primary));
        opacity: 1;
    }
    
    .node.unlocked .node-label {
        color: var(--primary);
        border: 1px solid rgba(14, 165, 233, 0.3);
    }

    /* Available (Parent Unlocked) */
    .node.available .node-shape {
        border-color: var(--text-main);
        background: #1e293b;
    }
    
    .node.available .node-icon {
        fill: var(--text-main);
        opacity: 0.8;
    }
    
    .node.available .node-shape::after {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.2);
        animation: spin 10s linear infinite;
        border-top-color: transparent;
        border-bottom-color: transparent;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        width: 300px;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid var(--bg-panel-border);
        border-left: 3px solid var(--locked-border);
        padding: 20px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transform: translate(20px, 20px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 200;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        backdrop-filter: blur(8px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translate(0, 0);
    }

    .tooltip.unlocked {
        border-left-color: var(--primary);
        box-shadow: 0 0 30px rgba(14, 165, 233, 0.1);
    }

    .tooltip h3 {
        color: var(--text-main);
        font-family: var(--font-display);
        margin-bottom: 5px;
        font-size: 1.2rem;
    }

    .tooltip .type {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--primary);
        margin-bottom: 12px;
        letter-spacing: 0.1em;
        font-weight: bold;
    }

    .tooltip p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #cbd5e1;
        margin-bottom: 15px;
    }

    .tooltip .req {
        font-size: 0.75rem;
        color: #ef4444;
        display: flex;
        align-items: center;
        gap: 5px;
        background: rgba(239, 68, 68, 0.1);
        padding: 5px 10px;
        border-radius: 2px;
    }
    
    .tooltip.unlocked .req { display: none; }

    /* --- Animations --- */
    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }
    
    @keyframes pulse {
        0%, 100% { box-shadow: 0 0 15px var(--primary-glow); }
        50% { box-shadow: 0 0 25px var(--primary-glow), 0 0 10px #fff; }
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

</style>
</head>
<body>

    <div class="bg-effects"></div>
    <div class="scanlines"></div>

    <header>
        <div class="header-content">
            <h1>Archon's Ascension</h1>
            <div class="subtitle">Class: Void Walker</div>
        </div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="stat-header">
                <div class="char-info">
                    <h2>Kaelen Thorne</h2>
                    <span>Duelist / Arcanist</span>
                </div>
                <div class="level-badge">
                    <span class="lvl">42</span>
                    <span class="lbl">LVL</span>
                </div>
            </div>

            <!-- Floating Skill Points -->
            <div class="sp-badge">
                <span class="sp-val">3</span>
                <span class="sp-lbl">PTS</span>
            </div>

            <div class="xp-section">
                <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-muted); margin-bottom:4px;">
                    <span>XP Progress</span>
                    <span>12.4k / 20k</span>
                </div>
                <div class="xp-bar-container">
                    <div class="xp-fill"></div>
                </div>
            </div>

            <div class="stat-list">
                <div class="stat-row"><span class="stat-name">Strength</span><span class="stat-val">14</span></div>
                <div class="stat-row"><span class="stat-name">Dexterity</span><span class="stat-val">28</span></div>
                <div class="stat-row"><span class="stat-name">Intelligence</span><span class="stat-val">35</span></div>
                <div class="stat-row"><span class="stat-name">Vitality</span><span class="stat-val">12</span></div>
                <div class="stat-row"><span class="stat-name">Crit Chance</span><span class="stat-val">18%</span></div>
                <div class="stat-row"><span class="stat-name">Mana Regen</span><span class="stat-val">4.2</span></div>
            </div>
        </aside>

        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes Injected Here -->
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description text goes here.</p>
        <div class="req" id="tt-req">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span>Requires: [Skill Name]</span>
        </div>
    </div>

<script>
    // --- Data ---
    const skills = [
        { id: 'root', x: 700, y: 100, name: "Archon's Spark", type: "Origin", desc: "The origin of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Str Branch
        { id: 'str1', x: 450, y: 250, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'str2', x: 300, y: 400, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str3', x: 150, y: 550, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        { id: 'str4', x: 100, y: 750, name: "Siegebreaker", type: "Ultimate", desc: "Breaks enemy armor completely.", unlocked: false, req: 'str3' },
        
        // Dex Branch
        { id: 'dex1', x: 950, y: 250, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: true, req: 'root' },
        { id: 'dex2', x: 1100, y: 400, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 1250, y: 550, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1200, y: 750, name: "Phantom Step", type: "Active", desc: "Dash through shadows.", unlocked: false, req: 'dex3' },

        // Int Branch
        { id: 'int1', x: 700, y: 350, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", unlocked: false, req: 'root' },
        { id: 'int2', x: 550, y: 500, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 850, y: 500, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        { id: 'int4', x: 700, y: 650, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows.", unlocked: false, req: 'int2' },
        
        // Hybrid
        { id: 'hybrid1', x: 450, y: 700, name: "Blood Pact", type: "Passive", desc: "Heal for 5% of damage dealt.", unlocked: false, req: 'str3' },
        { id: 'hybrid2', x: 950, y: 900, name: "Entropy", type: "Ultimate", desc: "Decay all life in area.", unlocked: false, req: 'int4' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z",
        origin: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const ww = 1400;
        const wh = 1200;
        
        // Center the world
        const panX = cw/2 - ww/2;
        const panY = ch/2 - wh/2 + 50; // Slight offset up
        
        world.style.transform = `translate(${panX}px, ${panY}px) scale(1)`;
        updatePanState(panX, panY, 1);

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.type === 'Origin') iconPath = icons.origin;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
                <div class="node-label">${skill.name}</div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawConnections();
    }

    // --- Drawing Lines ---
    function drawConnections() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    
                    // Curved path logic (Cubic Bezier)
                    // Control points create a smooth S-curve
                    const deltaX = skill.x - parent.x;
                    const deltaY = skill.y - parent.y;
                    
                    // Simple vertical/horizontal bias for cleaner lines
                    let cx1, cy1, cx2, cy2;
                    if(Math.abs(deltaY) > Math.abs(deltaX)) {
                        cx1 = parent.x; cy1 = parent.y + deltaY * 0.5;
                        cx2 = skill.x; cy2 = skill.y - deltaY * 0.5;
                    } else {
                        cx1 = parent.x + deltaX * 0.5; cy1 = parent.y;
                        cx2 = skill.x - deltaX * 0.5; cy2 = skill.y;
                    }

                    const d = `M ${parent.x} ${parent.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${skill.x} ${skill.y}`;
                    
                    path.setAttribute('d', d);
                    path.classList.add('connection-path');
                    
                    // If skill is unlocked, path is active. 
                    // If parent is unlocked but child is not, path is "available" (solid but dim)
                    if (skill.unlocked) {
                        path.classList.add('path-active');
                    } else {
                        path.classList.add('path-locked');
                    }
                    
                    svg.appendChild(path);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.add('unlocked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.remove('unlocked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg><span>Requires: ${reqSkill ? reqSkill.name : 'Unknown'}</span>`;
            ttReq.style.display = 'flex';
        }

        tooltip.classList.add('visible');
        positionTooltip(e.clientX, e.clientY);
    }

    function positionTooltip(x, y) {
        // Keep tooltip on screen
        const ttWidth = 300;
        const ttHeight = 200;
        const winWidth = window.innerWidth;
        const winHeight = window.innerHeight;

        let left = x + 20;
        let top = y + 20;

        if (left + ttWidth > winWidth) left = x - ttWidth - 20;
        if (top + ttHeight > winHeight) top = y - ttHeight - 20;

        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        // Logic: Can unlock if not unlocked, has parent unlocked, and has points
        if (!skill.unlocked) {
            const parent = skills.find(s => s.id === skill.req);
            if (!skill.req || (parent && parent.unlocked)) {
                // Simulate point cost
                const spBadge = document.querySelector('.sp-val');
                let currentPoints = parseInt(spBadge.innerText);
                
                if(currentPoints > 0) {
                    skill.unlocked = true;
                    spBadge.innerText = currentPoints - 1;
                    updateVisuals();
                }
            }
        }
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            
            // Reset classes
            el.className = 'node';
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                // Check availability
                if (!s.req) {
                    el.classList.add('available'); // Root node
                } else {
                    const parent = skills.find(sk => sk.id === s.req);
                    if (parent && parent.unlocked) {
                        el.classList.add('available');
                    }
                }
            }
        });
        drawConnections();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0, panY = 0, scale = 1;

    function updatePanState(px, py, sc) {
        panX = px; panY = py; scale = sc;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updatePanState(panX, panY, scale);
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        // Zoom towards mouse
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        updatePanState(panX, panY, newScale);
    });

    init();

</script>
</body>
</html>
