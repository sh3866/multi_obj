<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Ascension - Skill Matrix</title>
<style>
    :root {
        /* Palette - Void Theme */
        --bg-deep: #030005;
        --bg-panel: rgba(16, 12, 28, 0.65);
        --bg-panel-border: rgba(139, 92, 246, 0.2);
        
        --primary: #8b5cf6; /* Violet */
        --primary-glow: rgba(139, 92, 246, 0.6);
        --secondary: #ec4899; /* Magenta */
        --secondary-glow: rgba(236, 72, 153, 0.5);
        
        --locked: #1e1b2e;
        --locked-border: #3f3b55;
        
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-bright: #e2e8f0;

        --font-display: 'Georgia', serif;
        --font-body: 'Segoe UI', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background Texture & Atmosphere --- */
    .bg-canvas {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: radial-gradient(circle at 50% 50%, #1a1028 0%, #030005 100%);
    }
    
    /* CSS Noise Texture */
    .noise-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0.07;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Subtle Vignette */
    .vignette {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
    }

    /* --- Floating Sidebar (Refined) --- */
    aside {
        position: absolute;
        top: 30px;
        left: 30px;
        bottom: 30px;
        width: 280px;
        z-index: 50;
        display: flex;
        flex-direction: column;
        gap: 20px;
        pointer-events: none; /* Let clicks pass through gaps */
    }

    .panel {
        background: var(--bg-panel);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--bg-panel-border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 40px -10px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
        pointer-events: auto;
        transition: transform 0.2s ease, border-color 0.2s;
    }

    .panel:hover {
        border-color: rgba(139, 92, 246, 0.4);
        transform: translateY(-2px);
    }

    /* Header Card */
    .char-header {
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    .char-header::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 4px;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        box-shadow: 0 0 15px var(--primary-glow);
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.4rem;
        margin-bottom: 4px;
        letter-spacing: 0.05em;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .char-class {
        font-size: 0.75rem;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-weight: 600;
        margin-bottom: 15px;
    }

    .level-display {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        margin-bottom: 15px;
    }

    .level-circle {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 2px solid var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        font-weight: bold;
        background: rgba(0,0,0,0.3);
        box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        position: relative;
    }
    
    /* Decorative ring around level */
    .level-circle::after {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 1px dashed var(--primary);
        opacity: 0.5;
        animation: spin 20s linear infinite;
    }

    /* XP Bar */
    .xp-container {
        margin-bottom: 5px;
    }
    
    .xp-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-bottom: 6px;
    }

    .xp-track {
        height: 8px;
        background: rgba(0,0,0,0.6);
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
    }

    .xp-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        box-shadow: 0 0 10px var(--secondary-glow);
        position: relative;
    }
    
    /* Shimmer effect */
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        transform: translateX(-100%);
        animation: shimmer 2.5s infinite;
    }

    /* Skill Points Orb */
    .points-orb {
        background: linear-gradient(135deg, #1e1b2e, #0f0d17);
        border: 1px solid var(--primary);
        width: 80px;
        height: 80px;
        border-radius: 50%;
        margin: 10px auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px var(--primary-glow), inset 0 0 10px rgba(139, 92, 246, 0.2);
        animation: pulse-orb 4s infinite ease-in-out;
    }

    .pts-val {
        font-size: 2rem;
        font-weight: 800;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 10px var(--primary);
    }

    .pts-label {
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--primary);
        margin-top: 2px;
    }

    /* Stats List */
    .stats-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .stat-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 8px;
        background: rgba(255,255,255,0.02);
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.03);
    }

    .stat-name {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .stat-val {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-bright);
    }
    
    /* SVG Icons for stats */
    .stat-icon { width: 12px; height: 12px; fill: currentColor; opacity: 0.7; }

    /* --- Main Canvas Area --- */
    .tree-container {
        position: absolute;
        inset: 0;
        z-index: 10;
        overflow: hidden;
        cursor: grab;
        /* Center visual focus */
        background: radial-gradient(circle at center, rgba(139, 92, 246, 0.03) 0%, transparent 60%);
    }
    
    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1600px;
        height: 1200px;
        transform-origin: center center;
    }

    /* --- SVG Connections --- */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        filter: drop-shadow(0 0 2px rgba(0,0,0,0.8));
    }

    .connection-path {
        fill: none;
        stroke-width: 3;
        stroke-linecap: round;
        transition: all 0.5s ease;
    }

    /* Locked Path */
    .path-locked {
        stroke: rgba(63, 59, 85, 0.3);
        stroke-dasharray: 8, 8;
    }

    /* Active Path */
    .path-active {
        stroke: url(#gradient-active);
        filter: drop-shadow(0 0 6px var(--primary-glow));
    }
    
    /* Core Energy Flow Animation */
    .path-flow {
        fill: none;
        stroke: #fff;
        stroke-width: 1;
        opacity: 0.5;
        stroke-dasharray: 10, 10;
        animation: flow 1s linear infinite;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        z-index: 5;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .node:hover {
        z-index: 100;
        transform: translate(-50%, -50%) scale(1.2);
    }

    /* Node Shape */
    .node-shape {
        width: 80px;
        height: 80px;
        background: #151020;
        border: 2px solid var(--locked-border);
        border-radius: 50%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        transition: all 0.3s ease;
    }

    /* Tech Ring */
    .node-shape::before {
        content: '';
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.05);
    }

    /* Outer Glow Ring */
    .node-shape::after {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 1px solid transparent;
        transition: all 0.3s ease;
    }

    .node-icon {
        width: 36px;
        height: 36px;
        fill: var(--text-muted);
        opacity: 0.4;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        transition: all 0.3s ease;
    }

    .node-label {
        margin-top: 12px;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
        background: rgba(3, 0, 5, 0.8);
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid rgba(255,255,255,0.05);
        white-space: nowrap;
        opacity: 0;
        transform: translateY(-10px);
        transition: all 0.2s ease;
        pointer-events: none;
        letter-spacing: 0.05em;
    }

    .node:hover .node-label {
        opacity: 1;
        transform: translateY(0);
        background: rgba(15, 10, 30, 0.95);
        border-color: var(--primary);
        color: #fff;
    }

    /* --- Node States --- */
    
    /* Unlocked / Active */
    .node.unlocked .node-shape {
        background: radial-gradient(circle at 30% 30%, rgba(139, 92, 246, 0.3), #151020);
        border-color: var(--primary);
        box-shadow: 0 0 25px var(--primary-glow), inset 0 0 15px rgba(139, 92, 246, 0.1);
    }
    
    .node.unlocked .node-shape::after {
        border-color: rgba(139, 92, 246, 0.3);
        animation: pulse-ring 3s infinite;
    }
    
    .node.unlocked .node-icon {
        fill: #fff;
        filter: drop-shadow(0 0 8px var(--primary));
        opacity: 1;
    }

    /* Available (Parent Unlocked) */
    .node.available .node-shape {
        border-color: #64748b;
        background: #1e1b2e;
        box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }
    
    .node.available .node-icon {
        fill: #cbd5e1;
        opacity: 0.8;
    }
    
    .node.available:hover .node-shape {
        border-color: #fff;
        box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        width: 320px;
        background: rgba(10, 8, 18, 0.95);
        border: 1px solid var(--bg-panel-border);
        border-left: 4px solid var(--locked-border);
        padding: 24px;
        border-radius: 8px;
        pointer-events: none;
        opacity: 0;
        transform: translate(20px, 20px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 200;
        box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        backdrop-filter: blur(12px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translate(0, 0);
    }

    .tooltip.unlocked {
        border-left-color: var(--primary);
        box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
    }

    .tooltip h3 {
        color: var(--text-bright);
        font-family: var(--font-display);
        margin-bottom: 6px;
        font-size: 1.3rem;
        letter-spacing: 0.02em;
    }

    .tooltip .type {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--primary);
        margin-bottom: 16px;
        letter-spacing: 0.15em;
        font-weight: bold;
        display: inline-block;
        padding: 2px 6px;
        background: rgba(139, 92, 246, 0.1);
        border-radius: 4px;
    }

    .tooltip p {
        font-size: 0.9rem;
        line-height: 1.6;
        color: #cbd5e1;
        margin-bottom: 16px;
        font-weight: 300;
    }

    .tooltip .req {
        font-size: 0.75rem;
        color: #f87171;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(248, 113, 113, 0.1);
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid rgba(248, 113, 113, 0.1);
    }
    
    .tooltip.unlocked .req { display: none; }

    /* --- Animations --- */
    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }
    
    @keyframes pulse-orb {
        0%, 100% { box-shadow: 0 0 20px var(--primary-glow); transform: scale(1); }
        50% { box-shadow: 0 0 35px var(--primary-glow), 0 0 10px #fff; transform: scale(1.05); }
    }
    
    @keyframes pulse-ring {
        0% { transform: scale(1); opacity: 0.5; }
        100% { transform: scale(1.3); opacity: 0; }
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    
    @keyframes flow {
        to { stroke-dashoffset: -20; }
    }

</style>
</head>
<body>

    <!-- Background Layers -->
    <div class="bg-canvas"></div>
    <div class="noise-overlay"></div>
    <div class="vignette"></div>

    <!-- Floating Sidebar -->
    <aside>
        <!-- Identity Card -->
        <div class="panel char-header">
            <div class="char-name">Kaelen Thorne</div>
            <div class="char-class">Void Walker</div>
            
            <div class="level-display">
                <div class="level-circle">42</div>
            </div>

            <div class="xp-container">
                <div class="xp-label">
                    <span>XP Progress</span>
                    <span>12.4k / 20k</span>
                </div>
                <div class="xp-track">
                    <div class="xp-fill"></div>
                </div>
            </div>
        </div>

        <!-- Points Orb -->
        <div class="panel" style="text-align: center; padding: 15px;">
            <div class="points-orb">
                <span class="pts-val">3</span>
                <span class="pts-label">Points</span>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="panel">
            <div class="stats-list">
                <div class="stat-item">
                    <span class="stat-name">
                        <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z"/></svg>
                        STR
                    </span>
                    <span class="stat-val">14</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">
                        <svg class="stat-icon" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                        DEX
                    </span>
                    <span class="stat-val">28</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">
                        <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/></svg>
                        INT
                    </span>
                    <span class="stat-val">35</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">
                        <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        VIT
                    </span>
                    <span class="stat-val">12</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Skill Tree Canvas -->
    <div class="tree-container" id="treeContainer">
        <div class="tree-world" id="treeWorld">
            <!-- SVG Connections Layer -->
            <svg class="connections" id="svgConnections">
                <defs>
                    <linearGradient id="gradient-active" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:var(--primary);stop-opacity:1" />
                        <stop offset="100%" style="stop-color:var(--secondary);stop-opacity:1" />
                    </linearGradient>
                </defs>
            </svg>
            <!-- Nodes Injected via JS -->
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description text goes here.</p>
        <div class="req" id="tt-req">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span>Requires: [Skill Name]</span>
        </div>
    </div>

<script>
    // --- Data ---
    // Expanded tree layout for better visuals
    const skills = [
        { id: 'root', x: 800, y: 100, name: "Archon's Spark", type: "Origin", desc: "The origin of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Str Branch (Left)
        { id: 'str1', x: 500, y: 280, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'str2', x: 300, y: 450, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str3', x: 150, y: 650, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        { id: 'str4', x: 150, y: 850, name: "Siegebreaker", type: "Ultimate", desc: "Breaks enemy armor completely.", unlocked: false, req: 'str3' },
        
        // Dex Branch (Right)
        { id: 'dex1', x: 1100, y: 280, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: true, req: 'root' },
        { id: 'dex2', x: 1300, y: 450, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 1450, y: 650, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1450, y: 850, name: "Phantom Step", type: "Active", desc: "Dash through shadows.", unlocked: false, req: 'dex3' },

        // Int Branch (Center)
        { id: 'int1', x: 800, y: 450, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", unlocked: false, req: 'root' },
        { id: 'int2', x: 600, y: 600, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 1000, y: 600, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        { id: 'int4', x: 800, y: 800, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows.", unlocked: false, req: 'int2' },
        
        // Hybrid / Bottom
        { id: 'hybrid1', x: 300, y: 1000, name: "Blood Pact", type: "Passive", desc: "Heal for 5% of damage dealt.", unlocked: false, req: 'str4' },
        { id: 'hybrid2', x: 1300, y: 1000, name: "Entropy", type: "Ultimate", desc: "Decay all life in area.", unlocked: false, req: 'dex4' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z",
        origin: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const ww = 1600;
        const wh = 1200;
        
        // Center the world initially
        const panX = cw/2 - ww/2;
        const panY = ch/2 - wh/2 + 50;
        
        world.style.transform = `translate(${panX}px, ${panY}px) scale(1)`;
        updatePanState(panX, panY, 1);

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.type === 'Origin') iconPath = icons.origin;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
                <div class="node-label">${skill.name}</div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawConnections();
    }

    // --- Drawing Lines ---
    function drawConnections() {
        // Keep the defs, remove paths
        const defs = svg.querySelector('defs');
        svg.innerHTML = '';
        svg.appendChild(defs);

        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    
                    // Curved path logic (Cubic Bezier)
                    const deltaX = skill.x - parent.x;
                    const deltaY = skill.y - parent.y;
                    
                    // Control points create a smooth S-curve
                    let cx1, cy1, cx2, cy2;
                    if(Math.abs(deltaY) > Math.abs(deltaX)) {
                        cx1 = parent.x; cy1 = parent.y + deltaY * 0.5;
                        cx2 = skill.x; cy2 = skill.y - deltaY * 0.5;
                    } else {
                        cx1 = parent.x + deltaX * 0.5; cy1 = parent.y;
                        cx2 = skill.x - deltaX * 0.5; cy2 = skill.y;
                    }

                    const d = `M ${parent.x} ${parent.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${skill.x} ${skill.y}`;
                    
                    path.setAttribute('d', d);
                    path.classList.add('connection-path');
                    
                    // Logic: Active path if node is unlocked
                    if (skill.unlocked) {
                        path.classList.add('path-active');
                        // Add animated flow line on top
                        const flowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        flowPath.setAttribute('d', d);
                        flowPath.classList.add('path-flow');
                        svg.appendChild(flowPath);
                    } else {
                        path.classList.add('path-locked');
                    }
                    
                    svg.appendChild(path);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.add('unlocked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.remove('unlocked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg><span>Requires: ${reqSkill ? reqSkill.name : 'Unknown'}</span>`;
            ttReq.style.display = 'flex';
        }

        tooltip.classList.add('visible');
        positionTooltip(e.clientX, e.clientY);
    }

    function positionTooltip(x, y) {
        const ttWidth = 320;
        const ttHeight = 200;
        const winWidth = window.innerWidth;
        const winHeight = window.innerHeight;

        let left = x + 20;
        let top = y + 20;

        if (left + ttWidth > winWidth) left = x - ttWidth - 20;
        if (top + ttHeight > winHeight) top = y - ttHeight - 20;

        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        // Logic: Can unlock if not unlocked, has parent unlocked, and has points
        if (!skill.unlocked) {
            const parent = skills.find(s => s.id === skill.req);
            if (!skill.req || (parent && parent.unlocked)) {
                // Simulate point cost
                const spBadge = document.querySelector('.pts-val');
                let currentPoints = parseInt(spBadge.innerText);
                
                if(currentPoints > 0) {
                    skill.unlocked = true;
                    spBadge.innerText = currentPoints - 1;
                    updateVisuals();
                }
            }
        }
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            
            // Reset classes
            el.className = 'node';
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                // Check availability
                if (!s.req) {
                    el.classList.add('available');
                } else {
                    const parent = skills.find(sk => sk.id === s.req);
                    if (parent && parent.unlocked) {
                        el.classList.add('available');
                    }
                }
            }
        });
        drawConnections();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0, panY = 0, scale = 1;

    function updatePanState(px, py, sc) {
        panX = px; panY = py; scale = sc;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updatePanState(panX, panY, scale);
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.4, scale + delta), 2.5);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        // Zoom towards mouse
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        updatePanState(panX, panY, newScale);
    });

    init();

</script>
</body>
</html>
