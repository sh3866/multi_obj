<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Ascension - Skill Matrix</title>
<style>
    :root {
        /* Palette: Deep Void & Arcane Gold */
        --bg-deep: #050508;
        --bg-panel: rgba(10, 12, 18, 0.85);
        --bg-panel-border: rgba(255, 255, 255, 0.06);
        
        --primary: #fbbf24; /* Amber/Gold */
        --primary-dim: #78350f;
        --primary-glow: rgba(251, 191, 36, 0.5);
        
        --secondary: #818cf8; /* Indigo */
        --secondary-glow: rgba(129, 140, 248, 0.4);
        
        --locked: #1c1c24;
        --locked-border: #333340;
        
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --text-highlight: #ffffff;

        /* Typography */
        --font-display: 'Times New Roman', 'Georgia', serif;
        --font-ui: 'Segoe UI', system-ui, sans-serif;
        
        /* Layout */
        --sidebar-width: 260px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background --- */
    .bg-atmosphere {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: 
            radial-gradient(circle at 50% 50%, rgba(30, 27, 75, 0.4) 0%, transparent 60%),
            radial-gradient(circle at 50% 0%, rgba(251, 191, 36, 0.05) 0%, transparent 40%),
            linear-gradient(to bottom, #020203, #0a0a12);
    }

    /* Subtle Grid */
    .grid-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        background-image: 
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        mask-image: radial-gradient(circle at center, black 30%, transparent 85%);
        -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 85%);
    }

    /* --- Sidebar (Condensed & Sleek) --- */
    aside {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: var(--sidebar-width);
        z-index: 50;
        display: flex;
        flex-direction: column;
        padding: 20px;
        pointer-events: none; /* Let clicks pass through to canvas if missed */
    }

    .panel {
        background: var(--bg-panel);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--bg-panel-border);
        border-left: 1px solid rgba(255,255,255,0.1); /* Subtle highlight */
        border-radius: 8px;
        padding: 16px;
        box-shadow: 0 10px 30px -10px rgba(0,0,0,0.8);
        pointer-events: auto;
        margin-bottom: 16px;
        transition: transform 0.2s ease, border-color 0.2s;
        position: relative;
        overflow: hidden;
    }

    .panel::after {
        /* Subtle inner light */
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    }

    /* Character Header */
    .char-header {
        text-align: center;
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.6rem;
        font-weight: 400;
        margin-bottom: 2px;
        letter-spacing: 0.05em;
        color: var(--text-highlight);
        text-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
        line-height: 1.1;
    }

    .char-class {
        font-size: 0.65rem;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.25em;
        font-weight: 700;
        margin-bottom: 16px;
        display: block;
        opacity: 0.9;
    }

    /* Level Ring */
    .level-container {
        position: relative;
        width: 64px;
        height: 64px;
        margin: 0 auto 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
    }

    .level-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.1);
        border-top-color: var(--primary);
        border-right-color: var(--primary);
        transform: rotate(45deg);
    }

    .level-val {
        font-size: 1.5rem;
        font-weight: 700;
        font-family: var(--font-ui); /* Modern number */
        color: #fff;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* XP Bar */
    .xp-container {
        margin-top: 4px;
    }
    
    .xp-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.6rem;
        color: var(--text-muted);
        margin-bottom: 6px;
        font-weight: 600;
        letter-spacing: 0.05em;
    }

    .xp-track {
        height: 3px;
        background: rgba(0,0,0,0.6);
        border-radius: 2px;
        overflow: hidden;
    }

    .xp-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--primary), #fcd34d);
        box-shadow: 0 0 8px var(--primary-glow);
    }

    /* Skill Points */
    .points-panel {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.8));
        border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .pts-info {
        display: flex;
        flex-direction: column;
    }

    .pts-label {
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--secondary);
        font-weight: 700;
    }
    
    .pts-sub {
        font-size: 0.55rem;
        color: var(--text-muted);
        margin-top: 2px;
    }

    .pts-val {
        font-size: 1.8rem;
        font-weight: 800;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 10px var(--secondary-glow);
        font-family: var(--font-display);
    }

    /* Stats Grid - Compact */
    .stats-panel {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
    }
    
    .panel-title {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 10px;
        font-weight: 700;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding-bottom: 4px;
    }

    .stats-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .stat-item {
        display: flex;
        flex-direction: column;
        padding: 8px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.03);
        border-radius: 4px;
        transition: background 0.2s;
    }
    
    .stat-item:hover {
        background: rgba(255,255,255,0.06);
        border-color: rgba(255,255,255,0.1);
    }

    .stat-name {
        font-size: 0.55rem;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        font-weight: 700;
    }

    .stat-val {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-highlight);
        font-family: var(--font-ui);
        margin-top: 2px;
    }

    /* --- Main Canvas Area --- */
    .tree-container {
        position: absolute;
        inset: 0;
        z-index: 10;
        overflow: hidden;
        cursor: grab;
    }
    
    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 2000px;
        height: 1600px;
        transform-origin: center center;
    }

    /* --- SVG Connections --- */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: visible;
    }

    .connection-path {
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        transition: all 0.6s ease;
    }

    .path-locked {
        stroke: rgba(255, 255, 255, 0.06);
        stroke-dasharray: 5, 5;
    }

    .path-active {
        stroke: var(--primary);
        stroke-width: 2.5;
        filter: drop-shadow(0 0 6px var(--primary-glow));
    }
    
    .path-flow {
        fill: none;
        stroke: #fff;
        stroke-width: 1;
        opacity: 0.5;
        stroke-dasharray: 10, 20;
        animation: flow 2s linear infinite;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        z-index: 5;
        transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .node:hover {
        z-index: 100;
        transform: translate(-50%, -50%) scale(1.1);
    }

    /* Node Shape - Octagon */
    .node-shape {
        width: 64px;
        height: 64px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .node-oct {
        position: absolute;
        inset: 0;
        background: #0f0f13;
        /* Octagon Clip Path */
        clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
        transition: all 0.3s ease;
        box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    }
    
    /* Border trick for clip-path */
    .node-oct-border {
        position: absolute;
        inset: 0;
        background: linear-gradient(var(--locked-border), var(--locked-border)) padding-box,
                    linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05)) border-box;
        clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
        border: 1px solid transparent;
        z-index: 1;
    }

    .node-icon {
        width: 28px;
        height: 28px;
        fill: var(--text-muted);
        opacity: 0.4;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        transition: all 0.3s ease;
        z-index: 2;
    }

    .node-label {
        margin-top: 12px;
        font-size: 0.65rem;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        opacity: 0;
        transform: translateY(-5px);
        transition: all 0.2s ease;
        pointer-events: none;
        text-shadow: 0 2px 4px rgba(0,0,0,1);
        white-space: nowrap;
    }

    .node:hover .node-label {
        opacity: 1;
        transform: translateY(0);
        color: var(--text-highlight);
    }

    /* --- Node States --- */
    
    /* Unlocked / Active */
    .node.unlocked .node-oct {
        background: radial-gradient(circle at 50% 30%, #2a2a35, #1a1a22);
        box-shadow: 0 0 20px var(--primary-glow), inset 0 0 10px rgba(0,0,0,0.5);
    }
    
    .node.unlocked .node-oct-border {
        background: linear-gradient(135deg, var(--primary), var(--primary-dim)) border-box;
        border: 1px solid var(--primary);
    }
    
    .node.unlocked .node-icon {
        fill: var(--primary);
        filter: drop-shadow(0 0 5px var(--primary));
        opacity: 1;
    }

    /* Available (Ready to unlock) */
    .node.available .node-oct-border {
        border-color: rgba(255,255,255,0.4);
        background: rgba(255,255,255,0.1) border-box;
    }
    
    .node.available .node-icon {
        fill: #fff;
        opacity: 0.9;
    }
    
    .node.available:hover .node-oct {
        background: rgba(255,255,255,0.15);
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        width: 320px;
        background: rgba(8, 8, 12, 0.95);
        border: 1px solid rgba(255,255,255,0.1);
        border-left: 3px solid var(--primary);
        padding: 0;
        pointer-events: none;
        opacity: 0;
        transform: translate(20px, 20px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 200;
        box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        backdrop-filter: blur(8px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translate(0, 0);
    }

    .tooltip-content {
        padding: 20px;
    }

    .tooltip h3 {
        color: var(--text-highlight);
        font-family: var(--font-display);
        margin-bottom: 4px;
        font-size: 1.3rem;
        letter-spacing: 0.02em;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 8px;
        margin-bottom: 10px;
    }

    .tooltip .type {
        font-size: 0.6rem;
        text-transform: uppercase;
        color: var(--primary);
        letter-spacing: 0.2em;
        font-weight: 800;
        margin-bottom: 10px;
        display: block;
    }

    .tooltip p {
        font-size: 0.85rem;
        line-height: 1.5;
        color: #cbd5e1;
        margin-bottom: 12px;
        font-weight: 300;
    }

    .tooltip .req {
        font-size: 0.7rem;
        color: #fca5a5;
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(220, 38, 38, 0.1);
        padding: 8px;
        border: 1px solid rgba(220, 38, 38, 0.2);
        border-radius: 4px;
        margin-top: 8px;
    }
    
    .tooltip.unlocked .req { display: none; }
    .tooltip.unlocked { border-left-color: var(--primary); }

    /* --- Animations --- */
    @keyframes flow {
        to { stroke-dashoffset: -30; }
    }

    /* Responsive tweaks */
    @media (max-width: 768px) {
        aside {
            width: 100%;
            height: auto;
            top: auto;
            bottom: 0;
            flex-direction: row;
            padding: 10px;
            overflow-x: auto;
        }
        .panel { min-width: 200px; margin-bottom: 0; margin-right: 10px; }
        .tree-world { top: 20%; }
    }

</style>
</head>
<body>

    <!-- Background Layers -->
    <div class="bg-atmosphere"></div>
    <div class="grid-overlay"></div>

    <!-- Floating Sidebar -->
    <aside>
        <!-- Identity Card -->
        <div class="panel char-header">
            <div class="char-name">Kaelen Thorne</div>
            <div class="char-class">Void Walker</div>
            
            <div class="level-container">
                <div class="level-ring"></div>
                <div class="level-val">42</div>
            </div>

            <div class="xp-container">
                <div class="xp-label">
                    <span>XP</span>
                    <span>12.4k / 20k</span>
                </div>
                <div class="xp-track">
                    <div class="xp-fill"></div>
                </div>
            </div>
        </div>

        <!-- Points Orb -->
        <div class="panel points-panel">
            <div class="pts-info">
                <span class="pts-label">Skill Points</span>
                <span class="pts-sub">Available to spend</span>
            </div>
            <span class="pts-val">3</span>
        </div>

        <!-- Stats Grid -->
        <div class="panel stats-panel">
            <div class="panel-title">Attributes</div>
            <div class="stats-list">
                <div class="stat-item">
                    <span class="stat-name">STR</span>
                    <span class="stat-val">14</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">DEX</span>
                    <span class="stat-val">28</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">INT</span>
                    <span class="stat-val">35</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">VIT</span>
                    <span class="stat-val">12</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Skill Tree Canvas -->
    <div class="tree-container" id="treeContainer">
        <div class="tree-world" id="treeWorld">
            <!-- SVG Connections Layer -->
            <svg class="connections" id="svgConnections">
                <defs>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
            </svg>
            <!-- Nodes Injected via JS -->
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <div class="tooltip-content">
            <h3 id="tt-title">Skill Name</h3>
            <span class="type" id="tt-type">Passive</span>
            <p id="tt-desc">Description text goes here.</p>
            <div class="req" id="tt-req">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                <span>Requires: [Skill Name]</span>
            </div>
        </div>
    </div>

<script>
    // --- Data ---
    // A sprawling layout centered around 1000, 800
    const skills = [
        { id: 'root', x: 1000, y: 300, name: "Archon's Spark", type: "Origin", desc: "The genesis of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Str Branch (Left Wing)
        { id: 'str1', x: 700, y: 500, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'str2', x: 400, y: 700, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str3', x: 200, y: 900, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        { id: 'str4', x: 200, y: 1100, name: "Siegebreaker", type: "Ultimate", desc: "Breaks enemy armor completely.", unlocked: false, req: 'str3' },
        
        // Dex Branch (Right Wing)
        { id: 'dex1', x: 1300, y: 500, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: true, req: 'root' },
        { id: 'dex2', x: 1600, y: 700, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 1800, y: 900, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1800, y: 1100, name: "Phantom Step", type: "Active", desc: "Dash through shadows.", unlocked: false, req: 'dex3' },

        // Int Branch (Center / Down)
        { id: 'int1', x: 1000, y: 600, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", unlocked: false, req: 'root' },
        { id: 'int2', x: 800, y: 850, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 1200, y: 850, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        { id: 'int4', x: 1000, y: 1100, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows.", unlocked: false, req: 'int2' },
        
        // Cross-links
        { id: 'link1', x: 500, y: 1250, name: "Blood Pact", type: "Passive", desc: "Heal for 5% of damage dealt.", unlocked: false, req: 'str4' },
        { id: 'link2', x: 1500, y: 1250, name: "Entropy", type: "Ultimate", desc: "Decay all life in area.", unlocked: false, req: 'dex4' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z",
        origin: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const ww = 2000;
        const wh = 1600;
        
        // Center the world initially
        const panX = cw/2 - ww/2;
        const panY = ch/2 - wh/2;
        
        world.style.transform = `translate(${panX}px, ${panY}px) scale(1)`;
        updatePanState(panX, panY, 1);

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.type === 'Origin') iconPath = icons.origin;

            node.innerHTML = `
                <div class="node-shape">
                    <div class="node-oct-border"></div>
                    <div class="node-oct"></div>
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
                <div class="node-label">${skill.name}</div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawConnections();
    }

    // --- Drawing Lines ---
    function drawConnections() {
        // Keep the defs, remove paths
        const defs = svg.querySelector('defs');
        svg.innerHTML = '';
        svg.appendChild(defs);

        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    
                    // Curved path logic (Cubic Bezier)
                    const deltaX = skill.x - parent.x;
                    const deltaY = skill.y - parent.y;
                    
                    // Control points create a smooth S-curve
                    let cx1, cy1, cx2, cy2;
                    if(Math.abs(deltaY) > Math.abs(deltaX)) {
                        cx1 = parent.x; cy1 = parent.y + deltaY * 0.5;
                        cx2 = skill.x; cy2 = skill.y - deltaY * 0.5;
                    } else {
                        cx1 = parent.x + deltaX * 0.5; cy1 = parent.y;
                        cx2 = skill.x - deltaX * 0.5; cy2 = skill.y;
                    }

                    const d = `M ${parent.x} ${parent.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${skill.x} ${skill.y}`;
                    
                    path.setAttribute('d', d);
                    path.classList.add('connection-path');
                    
                    // Logic: Active path if node is unlocked
                    if (skill.unlocked) {
                        path.classList.add('path-active');
                        path.setAttribute('filter', 'url(#glow)');
                        
                        // Add animated flow line on top
                        const flowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        flowPath.setAttribute('d', d);
                        flowPath.classList.add('path-flow');
                        svg.appendChild(flowPath);
                    } else {
                        path.classList.add('path-locked');
                    }
                    
                    svg.appendChild(path);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.add('unlocked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.remove('unlocked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg><span>Requires: ${reqSkill ? reqSkill.name : 'Unknown'}</span>`;
            ttReq.style.display = 'flex';
        }

        tooltip.classList.add('visible');
        positionTooltip(e.clientX, e.clientY);
    }

    function positionTooltip(x, y) {
        const ttWidth = 320;
        const ttHeight = 200;
        const winWidth = window.innerWidth;
        const winHeight = window.innerHeight;

        let left = x + 20;
        let top = y + 20;

        if (left + ttWidth > winWidth) left = x - ttWidth - 20;
        if (top + ttHeight > winHeight) top = y - ttHeight - 20;

        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        // Logic: Can unlock if not unlocked, has parent unlocked, and has points
        if (!skill.unlocked) {
            const parent = skills.find(s => s.id === skill.req);
            if (!skill.req || (parent && parent.unlocked)) {
                // Simulate point cost
                const spBadge = document.querySelector('.pts-val');
                let currentPoints = parseInt(spBadge.innerText);
                
                if(currentPoints > 0) {
                    skill.unlocked = true;
                    spBadge.innerText = currentPoints - 1;
                    updateVisuals();
                }
            }
        }
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            
            // Reset classes
            el.className = 'node';
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                // Check availability
                if (!s.req) {
                    el.classList.add('available');
                } else {
                    const parent = skills.find(sk => sk.id === s.req);
                    if (parent && parent.unlocked) {
                        el.classList.add('available');
                    }
                }
            }
        });
        drawConnections();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0, panY = 0, scale = 1;

    function updatePanState(px, py, sc) {
        panX = px; panY = py; scale = sc;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updatePanState(panX, panY, scale);
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.3, scale + delta), 2.0);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        // Zoom towards mouse
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        updatePanState(panX, panY, newScale);
    });

    init();

</script>
</body>
</html>
