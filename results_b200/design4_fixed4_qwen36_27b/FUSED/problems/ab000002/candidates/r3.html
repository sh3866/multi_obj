<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Ascension - Skill Matrix</title>
<style>
    :root {
        /* Palette: Ethereal Gold & Deep Void */
        --bg-deep: #050508;
        --bg-panel: rgba(12, 12, 18, 0.75);
        --bg-panel-border: rgba(255, 255, 255, 0.08);
        
        --primary: #eab308; /* Gold */
        --primary-dim: #a16207;
        --primary-glow: rgba(234, 179, 8, 0.4);
        
        --secondary: #3b82f6; /* Celestial Blue */
        --secondary-glow: rgba(59, 130, 246, 0.4);
        
        --locked: #16161e;
        --locked-border: #2d2d3a;
        
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --text-highlight: #fff;

        --font-display: 'Georgia', serif;
        --font-body: 'Segoe UI', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background Atmosphere --- */
    .bg-atmosphere {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: 
            radial-gradient(circle at 50% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
            radial-gradient(circle at 20% 80%, rgba(234, 179, 8, 0.05) 0%, transparent 40%),
            linear-gradient(to bottom, #020203, #0a0a12);
    }
    
    /* Subtle Grid */
    .grid-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        background-image: 
            linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none;
        mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
    }

    /* --- Sidebar --- */
    aside {
        position: absolute;
        top: 40px;
        left: 40px;
        bottom: 40px;
        width: 300px;
        z-index: 50;
        display: flex;
        flex-direction: column;
        gap: 24px;
        pointer-events: none;
    }

    .panel {
        background: var(--bg-panel);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--bg-panel-border);
        border-left: 2px solid var(--primary);
        border-radius: 4px;
        padding: 24px;
        box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6);
        pointer-events: auto;
        position: relative;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .panel::before {
        /* Corner accent */
        content: '';
        position: absolute;
        top: -1px; right: -1px;
        width: 10px; height: 10px;
        border-top: 2px solid var(--primary);
        border-right: 2px solid var(--primary);
    }

    .panel:hover {
        transform: translateY(-2px);
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
        border-color: rgba(255, 255, 255, 0.15);
    }

    /* Character Header */
    .char-header {
        text-align: center;
        border-left: 2px solid var(--primary);
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.8rem;
        font-weight: 400;
        margin-bottom: 2px;
        letter-spacing: 0.05em;
        color: #fff;
        text-shadow: 0 0 20px rgba(234, 179, 8, 0.3);
    }

    .char-class {
        font-size: 0.7rem;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-weight: 700;
        margin-bottom: 24px;
        display: inline-block;
        border-bottom: 1px solid rgba(234, 179, 8, 0.3);
        padding-bottom: 4px;
    }

    /* Level Ring */
    .level-container {
        position: relative;
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .level-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.1);
        border-top-color: var(--primary);
        animation: spin 8s linear infinite;
    }

    .level-val {
        font-size: 1.8rem;
        font-weight: 700;
        font-family: var(--font-display);
        color: #fff;
    }

    /* XP Bar */
    .xp-container {
        margin-top: 10px;
    }
    
    .xp-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-bottom: 8px;
        font-weight: 600;
        letter-spacing: 0.05em;
    }

    .xp-track {
        height: 4px;
        background: rgba(0,0,0,0.5);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
    }

    .xp-fill {
        height: 100%;
        width: 65%;
        background: var(--primary);
        box-shadow: 0 0 10px var(--primary-glow);
        position: relative;
    }

    /* Skill Points Orb */
    .points-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-left: 2px solid var(--secondary);
    }

    .points-orb {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #1e293b, #0f172a);
        border: 1px solid var(--secondary);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 25px var(--secondary-glow), inset 0 0 15px rgba(59, 130, 246, 0.1);
        margin-bottom: 10px;
        position: relative;
    }

    .points-orb::after {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 1px dashed rgba(59, 130, 246, 0.4);
        animation: spin 20s linear infinite reverse;
    }

    .pts-val {
        font-size: 2.2rem;
        font-weight: 800;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 10px var(--secondary);
    }

    .pts-label {
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--secondary);
        margin-top: 4px;
        font-weight: 700;
    }

    /* Stats Grid */
    .stats-panel {
        border-left: 2px solid var(--text-muted);
    }

    .stats-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    .stat-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 2px;
        transition: background 0.2s;
    }
    
    .stat-item:hover {
        background: rgba(255,255,255,0.05);
    }

    .stat-name {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .stat-val {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-highlight);
        font-family: var(--font-display);
    }
    
    .stat-icon { width: 10px; height: 10px; fill: var(--primary); opacity: 0.8; }

    /* --- Main Canvas Area --- */
    .tree-container {
        position: absolute;
        inset: 0;
        z-index: 10;
        overflow: hidden;
        cursor: grab;
    }
    
    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1800px;
        height: 1400px;
        transform-origin: center center;
    }

    /* --- SVG Connections --- */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    .connection-path {
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        transition: all 0.5s ease;
    }

    .path-locked {
        stroke: rgba(255, 255, 255, 0.05);
    }

    .path-active {
        stroke: var(--primary);
        filter: drop-shadow(0 0 5px var(--primary-glow));
    }
    
    .path-flow {
        fill: none;
        stroke: #fff;
        stroke-width: 1;
        opacity: 0.6;
        stroke-dasharray: 15, 15;
        animation: flow 1.5s linear infinite;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        z-index: 5;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .node:hover {
        z-index: 100;
        transform: translate(-50%, -50%) scale(1.15);
    }

    /* Node Shape - Hexagon */
    .node-shape {
        width: 70px;
        height: 70px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    .node-hex {
        position: absolute;
        inset: 0;
        background: #111116;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        border: 1px solid transparent; /* Fallback */
        transition: all 0.3s ease;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }
    
    /* Border trick for clip-path */
    .node-hex-border {
        position: absolute;
        inset: 0;
        background: linear-gradient(var(--locked-border), var(--locked-border)) padding-box,
                    linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05)) border-box;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        border: 1px solid transparent;
    }

    .node-icon {
        width: 30px;
        height: 30px;
        fill: var(--text-muted);
        opacity: 0.3;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        transition: all 0.3s ease;
        z-index: 2;
    }

    .node-label {
        margin-top: 16px;
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        opacity: 0;
        transform: translateY(-10px);
        transition: all 0.2s ease;
        pointer-events: none;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .node:hover .node-label {
        opacity: 1;
        transform: translateY(0);
        color: #fff;
    }

    /* --- Node States --- */
    
    /* Unlocked / Active */
    .node.unlocked .node-hex {
        background: linear-gradient(135deg, #2a2a35, #1a1a22);
        box-shadow: 0 0 20px var(--primary-glow);
    }
    
    .node.unlocked .node-hex-border {
        background: linear-gradient(135deg, var(--primary), var(--primary-dim)) border-box;
        border: 1px solid var(--primary);
    }
    
    .node.unlocked .node-icon {
        fill: var(--primary);
        filter: drop-shadow(0 0 8px var(--primary));
        opacity: 1;
    }

    /* Available */
    .node.available .node-hex-border {
        border-color: rgba(255,255,255,0.3);
        background: rgba(255,255,255,0.1) border-box;
    }
    
    .node.available .node-icon {
        fill: #fff;
        opacity: 0.8;
    }
    
    .node.available:hover .node-hex {
        background: rgba(255,255,255,0.1);
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        width: 340px;
        background: rgba(10, 10, 15, 0.95);
        border: 1px solid rgba(255,255,255,0.1);
        border-top: 3px solid var(--primary);
        padding: 0;
        pointer-events: none;
        opacity: 0;
        transform: translate(20px, 20px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 200;
        box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        backdrop-filter: blur(10px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translate(0, 0);
    }

    .tooltip-content {
        padding: 24px;
    }

    .tooltip h3 {
        color: var(--text-highlight);
        font-family: var(--font-display);
        margin-bottom: 6px;
        font-size: 1.4rem;
        letter-spacing: 0.02em;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 10px;
        margin-bottom: 12px;
    }

    .tooltip .type {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--primary);
        letter-spacing: 0.2em;
        font-weight: 800;
        margin-bottom: 12px;
        display: block;
    }

    .tooltip p {
        font-size: 0.9rem;
        line-height: 1.6;
        color: #cbd5e1;
        margin-bottom: 16px;
        font-weight: 300;
    }

    .tooltip .req {
        font-size: 0.75rem;
        color: #f87171;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(248, 113, 113, 0.1);
        padding: 10px;
        border: 1px solid rgba(248, 113, 113, 0.2);
        margin-top: 10px;
    }
    
    .tooltip.unlocked .req { display: none; }
    .tooltip.unlocked { border-top-color: var(--primary); }

    /* --- Animations --- */
    @keyframes flow {
        to { stroke-dashoffset: -30; }
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }

</style>
</head>
<body>

    <!-- Background Layers -->
    <div class="bg-atmosphere"></div>
    <div class="grid-overlay"></div>

    <!-- Floating Sidebar -->
    <aside>
        <!-- Identity Card -->
        <div class="panel char-header">
            <div class="char-name">Kaelen Thorne</div>
            <div class="char-class">Void Walker</div>
            
            <div class="level-container">
                <div class="level-ring"></div>
                <div class="level-val">42</div>
            </div>

            <div class="xp-container">
                <div class="xp-label">
                    <span>XP PROGRESS</span>
                    <span>12.4k / 20k</span>
                </div>
                <div class="xp-track">
                    <div class="xp-fill"></div>
                </div>
            </div>
        </div>

        <!-- Points Orb -->
        <div class="panel points-panel">
            <div class="points-orb">
                <span class="pts-val">3</span>
            </div>
            <span class="pts-label">Available Points</span>
        </div>

        <!-- Stats Grid -->
        <div class="panel stats-panel">
            <div class="stats-list">
                <div class="stat-item">
                    <span class="stat-name">
                        <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z"/></svg>
                        STR
                    </span>
                    <span class="stat-val">14</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">
                        <svg class="stat-icon" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                        DEX
                    </span>
                    <span class="stat-val">28</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">
                        <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/></svg>
                        INT
                    </span>
                    <span class="stat-val">35</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">
                        <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        VIT
                    </span>
                    <span class="stat-val">12</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Skill Tree Canvas -->
    <div class="tree-container" id="treeContainer">
        <div class="tree-world" id="treeWorld">
            <!-- SVG Connections Layer -->
            <svg class="connections" id="svgConnections">
                <defs>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
            </svg>
            <!-- Nodes Injected via JS -->
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <div class="tooltip-content">
            <h3 id="tt-title">Skill Name</h3>
            <span class="type" id="tt-type">Passive</span>
            <p id="tt-desc">Description text goes here.</p>
            <div class="req" id="tt-req">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                <span>Requires: [Skill Name]</span>
            </div>
        </div>
    </div>

<script>
    // --- Data ---
    const skills = [
        { id: 'root', x: 900, y: 150, name: "Archon's Spark", type: "Origin", desc: "The genesis of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Str Branch (Left)
        { id: 'str1', x: 600, y: 350, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'str2', x: 350, y: 550, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str3', x: 150, y: 750, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        { id: 'str4', x: 150, y: 950, name: "Siegebreaker", type: "Ultimate", desc: "Breaks enemy armor completely.", unlocked: false, req: 'str3' },
        
        // Dex Branch (Right)
        { id: 'dex1', x: 1200, y: 350, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: true, req: 'root' },
        { id: 'dex2', x: 1450, y: 550, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 1650, y: 750, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1650, y: 950, name: "Phantom Step", type: "Active", desc: "Dash through shadows.", unlocked: false, req: 'dex3' },

        // Int Branch (Center)
        { id: 'int1', x: 900, y: 550, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", unlocked: false, req: 'root' },
        { id: 'int2', x: 700, y: 750, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 1100, y: 750, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        { id: 'int4', x: 900, y: 950, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows.", unlocked: false, req: 'int2' },
        
        // Hybrid / Bottom
        { id: 'hybrid1', x: 350, y: 1150, name: "Blood Pact", type: "Passive", desc: "Heal for 5% of damage dealt.", unlocked: false, req: 'str4' },
        { id: 'hybrid2', x: 1450, y: 1150, name: "Entropy", type: "Ultimate", desc: "Decay all life in area.", unlocked: false, req: 'dex4' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z",
        origin: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const ww = 1800;
        const wh = 1400;
        
        // Center the world initially
        const panX = cw/2 - ww/2;
        const panY = ch/2 - wh/2;
        
        world.style.transform = `translate(${panX}px, ${panY}px) scale(1)`;
        updatePanState(panX, panY, 1);

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.type === 'Origin') iconPath = icons.origin;

            node.innerHTML = `
                <div class="node-shape">
                    <div class="node-hex-border"></div>
                    <div class="node-hex"></div>
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
                <div class="node-label">${skill.name}</div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawConnections();
    }

    // --- Drawing Lines ---
    function drawConnections() {
        // Keep the defs, remove paths
        const defs = svg.querySelector('defs');
        svg.innerHTML = '';
        svg.appendChild(defs);

        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    
                    // Curved path logic (Cubic Bezier)
                    const deltaX = skill.x - parent.x;
                    const deltaY = skill.y - parent.y;
                    
                    // Control points create a smooth S-curve
                    let cx1, cy1, cx2, cy2;
                    if(Math.abs(deltaY) > Math.abs(deltaX)) {
                        cx1 = parent.x; cy1 = parent.y + deltaY * 0.5;
                        cx2 = skill.x; cy2 = skill.y - deltaY * 0.5;
                    } else {
                        cx1 = parent.x + deltaX * 0.5; cy1 = parent.y;
                        cx2 = skill.x - deltaX * 0.5; cy2 = skill.y;
                    }

                    const d = `M ${parent.x} ${parent.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${skill.x} ${skill.y}`;
                    
                    path.setAttribute('d', d);
                    path.classList.add('connection-path');
                    
                    // Logic: Active path if node is unlocked
                    if (skill.unlocked) {
                        path.classList.add('path-active');
                        path.setAttribute('filter', 'url(#glow)');
                        
                        // Add animated flow line on top
                        const flowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        flowPath.setAttribute('d', d);
                        flowPath.classList.add('path-flow');
                        svg.appendChild(flowPath);
                    } else {
                        path.classList.add('path-locked');
                    }
                    
                    svg.appendChild(path);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.add('unlocked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.remove('unlocked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg><span>Requires: ${reqSkill ? reqSkill.name : 'Unknown'}</span>`;
            ttReq.style.display = 'flex';
        }

        tooltip.classList.add('visible');
        positionTooltip(e.clientX, e.clientY);
    }

    function positionTooltip(x, y) {
        const ttWidth = 340;
        const ttHeight = 220;
        const winWidth = window.innerWidth;
        const winHeight = window.innerHeight;

        let left = x + 20;
        let top = y + 20;

        if (left + ttWidth > winWidth) left = x - ttWidth - 20;
        if (top + ttHeight > winHeight) top = y - ttHeight - 20;

        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        // Logic: Can unlock if not unlocked, has parent unlocked, and has points
        if (!skill.unlocked) {
            const parent = skills.find(s => s.id === skill.req);
            if (!skill.req || (parent && parent.unlocked)) {
                // Simulate point cost
                const spBadge = document.querySelector('.pts-val');
                let currentPoints = parseInt(spBadge.innerText);
                
                if(currentPoints > 0) {
                    skill.unlocked = true;
                    spBadge.innerText = currentPoints - 1;
                    updateVisuals();
                }
            }
        }
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            
            // Reset classes
            el.className = 'node';
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                // Check availability
                if (!s.req) {
                    el.classList.add('available');
                } else {
                    const parent = skills.find(sk => sk.id === s.req);
                    if (parent && parent.unlocked) {
                        el.classList.add('available');
                    }
                }
            }
        });
        drawConnections();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0, panY = 0, scale = 1;

    function updatePanState(px, py, sc) {
        panX = px; panY = py; scale = sc;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updatePanState(panX, panY, scale);
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.4, scale + delta), 2.5);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        // Zoom towards mouse
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        updatePanState(panX, panY, newScale);
    });

    init();

</script>
</body>
</html>
