<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Topology: Life</title>
<style>
  :root {
    /* Core Palette - Deep Space & Neon */
    --bg-deep: #030305;
    --bg-panel: rgba(12, 12, 16, 0.85);
    --bg-panel-border: rgba(255, 255, 255, 0.08);
    
    /* Accent - Unified Electric Blue */
    --accent: #00e5ff;
    --accent-dim: rgba(0, 229, 255, 0.15);
    --accent-glow: rgba(0, 229, 255, 0.4);
    
    /* Text */
    --text-primary: #ffffff;
    --text-secondary: #8b9bb4;
    
    /* Typography */
    --font-display: "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    --font-mono: "SF Mono", "Roboto Mono", "Menlo", Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--font-display);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    position: relative;
  }

  /* Canvas Container */
  #canvas-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Layer */
  #ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* --- Header --- */
  .header {
    position: relative;
    z-index: 20;
    pointer-events: auto;
    display: flex;
    align-items: baseline;
    gap: 1rem;
    max-width: 400px;
  }

  h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--text-primary);
    line-height: 1;
    text-shadow: 0 0 30px rgba(255,255,255,0.1);
  }
  
  h1 span { color: var(--accent); }

  .subtitle {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    border: 1px solid var(--bg-panel-border);
    padding: 0.25rem 0.5rem;
    border-radius: 2px;
    background: rgba(0,0,0,0.3);
  }

  /* --- Control Panel --- */
  .panel {
    pointer-events: auto;
    width: 320px;
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--bg-panel-border);
    border-radius: 12px;
    padding: 1.5rem;
    position: relative;
    /* Floating Dock Position */
    align-self: flex-end;
    margin-bottom: 1rem;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .panel-header {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .status-dot {
    width: 6px; height: 6px;
    background-color: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

  /* Stats Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--bg-panel-border);
  }

  .stat-item { display: flex; flex-direction: column; gap: 0.25rem; }
  
  .stat-label {
    font-size: 0.7rem;
    color: var(--text-secondary);
    font-family: var(--font-display);
  }
  
  .stat-value {
    font-family: var(--font-mono);
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1;
  }

  /* Controls */
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }

  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--bg-panel-border);
    color: var(--text-primary);
    padding: 0.75rem;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.3);
  }

  button:active { transform: translateY(1px); }

  /* Primary Button */
  button.primary {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
  }
  button.primary:hover {
    background: var(--accent);
    color: #000;
    box-shadow: 0 0 25px var(--accent-glow);
  }

  /* Slider */
  .slider-container {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-top: 0.5rem;
  }
  
  .slider-label {
    font-size: 0.7rem;
    color: var(--text-secondary);
    min-width: 60px;
  }

  input[type=range] {
    -webkit-appearance: none;
    flex-grow: 1;
    height: 2px;
    background: rgba(255,255,255,0.1);
    outline: none;
    cursor: pointer;
    border-radius: 2px;
  }
  
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    background: var(--text-primary);
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.1s;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

  /* Footer Instructions */
  .footer {
    position: relative;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
  }

  .instruction {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--text-secondary);
    opacity: 0.6;
    display: flex;
    gap: 1rem;
  }
  .instruction span { display: flex; align-items: center; gap: 0.5rem; }
  .key {
    border: 1px solid var(--text-secondary);
    padding: 0 4px;
    border-radius: 3px;
    font-size: 0.6rem;
  }

</style>
</head>
<body>

  <!-- Canvas -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Header -->
    <div class="header">
      <h1>CONWAY <span>::</span> SPHERE</h1>
      <div class="subtitle">TOPOLOGICAL AUTOMATA</div>
    </div>

    <!-- Footer / Instructions -->
    <div class="footer">
      <div class="instruction">
        <span><span class="key">LMB</span> ROTATE</span>
        <span><span class="key">SC</span> ZOOM</span>
      </div>
    </div>

    <!-- Control Panel (Floating Dock) -->
    <div class="panel">
      
      <div class="panel-header">
        <span>System Control</span>
        <div class="status-dot"></div>
      </div>

      <!-- Telemetry -->
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-label">Generation</span>
          <span class="stat-value" id="gen-count">0000</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Population</span>
          <span class="stat-value" id="pop-count">0000</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="control-group">
        <div class="btn-row">
          <button id="btn-pause" class="primary">Pause</button>
          <button id="btn-reset">Randomize</button>
        </div>
        
        <div class="slider-container">
          <span class="slider-label">Speed</span>
          <input type="range" id="speed-slider" min="1" max="60" value="20">
          <span class="slider-label" id="speed-val" style="min-width: 30px; text-align:right; color:var(--accent)">20Hz</span>
        </div>
      </div>
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life - Design Revision
 * 
 * Visual Strategy:
 * 1. Lighting: Added simulated hemisphere lighting to give the sphere volume.
 * 2. Palette: Shifted to a unified Electric Blue/Cyan/Magenta scheme with high contrast.
 * 3. UI: Cleaned up the panel to a modern "Floating Dock" style with a single accent color.
 * 4. Typography: Hierarchy improved with sans-serif headers and mono data.
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 4500, 
  sphereRadius: 300,
  baseCellSize: 2.2,
  rotationSpeed: 0.001,
  // Palette
  colors: {
    born: 190,  // Cyan
    young: 280, // Magenta
    old: 320    // Deep Pink
  }
};

// --- State ---
let state = {
  cells: [], 
  generation: 0,
  isRunning: true,
  speed: 20, 
  lastFrameTime: 0,
  rotation: { x: 0.2, y: 0.5 },
  zoom: 1.1,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  // Handle High DPI screens for crisp text/lines
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  distSq: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return dx*dx + dy*dy + dz*dz;
  }
};

// Fibonacci Lattice
function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5)); 
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y); 
    const theta = goldenAngle * i; 
    
    points.push({
      x: Math.cos(theta) * radiusAtY * radius,
      y: y * radius,
      z: Math.sin(theta) * radiusAtY * radius,
      idx: i
    });
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Neighbor calculation
  // Threshold for connectivity on the sphere surface
  // Adjusted slightly for visual density
  const thresholdSq = Math.pow((2 * Math.PI * CONFIG.sphereRadius) / Math.sqrt(CONFIG.cellCount) * 0.65, 2);
  
  state.cells = points.map((p, i) => {
    const neighbors = [];
    // Optimization: check indices near i (spatial locality in Fibonacci lattice)
    const range = 15; 
    for (let j = i - range; j <= i + range; j++) {
      if (j < 0 || j >= points.length || i === j) continue;
      if (Vec3.distSq(p, points[j]) < thresholdSq) {
        neighbors.push(j);
      }
    }
    
    return {
      pos: p,
      idx: i,
      neighbors: neighbors,
      alive: Math.random() > 0.55, // 45% density
      age: 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  const nextStates = state.cells.map(cell => {
    const neighborCount = cell.neighbors.reduce((acc, idx) => acc + (state.cells[idx].alive ? 1 : 0), 0);
    
    let nextAlive = false;
    let isBorn = false;

    if (cell.alive) {
      if (neighborCount === 2 || neighborCount === 3) nextAlive = true;
    } else {
      if (neighborCount === 3) {
        nextAlive = true;
        isBorn = true;
      }
    }
    
    return {
      alive: nextAlive,
      age: nextAlive ? (isBorn ? 0 : cell.age + 1) : 0
    };
  });

  state.cells.forEach((cell, i) => {
    cell.alive = nextStates[i].alive;
    cell.age = nextStates[i].age;
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 1000 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // 1. Clear with deep background
  ctx.fillStyle = '#030305'; 
  ctx.fillRect(0, 0, width, height);

  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;

  // 2. Ambient Glow (Atmosphere)
  // Subtle blue glow behind the sphere
  const grad = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r * 2.5);
  grad.addColorStop(0, 'rgba(0, 229, 255, 0.05)'); 
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,width,height);

  // 3. Project and Sort
  const projectedCells = state.cells.map(cell => {
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    return { cell, proj };
  });
  
  // Painter's Algorithm (Sort by Z depth)
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // 4. Draw Surface Structure (Wireframe/Glow Ring)
  // Define the silhouette of the sphere
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
  ctx.lineWidth = 1;
  ctx.stroke();
  
  // 5. Draw Cells
  // Use 'lighter' for additive blending (neon effect)
  ctx.globalCompositeOperation = 'lighter';

  projectedCells.forEach(({ cell, proj }) => {
    const size = CONFIG.baseCellSize * proj.scale;
    // Normalized Z: 1.0 (front) to -1.0 (back)
    const zNorm = -proj.z / CONFIG.sphereRadius; 
    
    // LIGHTING CALCULATION
    // Simulate a light source coming from the top-left-front
    // Dot product approximation: x is right, y is up, z is depth (out)
    // Light vector roughly (-0.5, -0.5, 1.0)
    // We use the projected coordinates relative to center for x/y, and raw z for depth
    const xNorm = (proj.x - cx) / r;
    const yNorm = (proj.y - cy) / r;
    
    // Simple hemisphere lighting factor (0 to 1)
    // Brighter on the front-left-top
    let light = 0.3 + (0.4 * zNorm) - (0.2 * xNorm) - (0.2 * yNorm);
    light = Math.max(0.1, Math.min(1, light));

    if (cell.alive) {
      // COLOR LOGIC
      // Born (Cyan) -> Young (Magenta) -> Old (Pink)
      let hue, saturation, lightness;
      
      if (cell.age < 4) {
        hue = CONFIG.colors.born; // Cyan
        lightness = 60;
      } else if (cell.age < 12) {
        hue = CONFIG.colors.young; // Magenta
        lightness = 55;
      } else {
        hue = CONFIG.colors.old; // Pink
        lightness = 65;
      }
      saturation = 100;

      // DEPTH FOG
      // Fade out significantly at the back
      const alpha = 0.1 + (Math.max(0, zNorm) * 0.8); 
      
      // Apply lighting to lightness
      const finalLight = lightness * light;
      
      ctx.fillStyle = `hsla(${hue}, ${saturation}%, ${finalLight}%, ${alpha})`;
      
      // BLOOM
      // Only glow if facing camera
      if (zNorm > 0.1 && size > 1.2) {
        ctx.shadowBlur = 10 * proj.scale;
        ctx.shadowColor = `hsla(${hue}, 100%, 50%, 0.6)`;
      } else {
        ctx.shadowBlur = 0;
      }

    } else {
      // DEAD CELLS: The "Grid"
      // Monochromatic, subtle, structural
      // Brighter at front to give volume
      const alpha = 0.02 + (Math.max(0, zNorm) * 0.15);
      // Apply lighting to dead cells too for 3D effect
      const deadBright = 20 * light; 
      ctx.fillStyle = `rgba(${deadBright+20}, ${deadBright+20}, ${deadBright+40}, ${alpha})`;
      ctx.shadowBlur = 0;
    }
    
    ctx.beginPath();
    // Draw circles
    ctx.arc(proj.x, proj.y, Math.max(0.5, size), 0, Math.PI * 2);
    ctx.fill();
    
    // Add a tiny stroke to active cells for crispness
    if (cell.alive && zNorm > 0.2) {
        ctx.strokeStyle = `rgba(255, 255, 255, ${zNorm * 0.6 * light})`;
        ctx.lineWidth = 0.5 * proj.scale;
        ctx.stroke();
    }
  });
  
  ctx.globalCompositeOperation = 'source-over'; // Reset
  ctx.shadowBlur = 0;
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    state.rotation.y += CONFIG.rotationSpeed;
    
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  // Pad numbers for monospace look
  const g = state.generation.toString().padStart(4, '0');
  const p = state.cells.filter(c => c.alive).length.toString().padStart(4, '0');
  
  document.getElementById('gen-count').innerText = g;
  document.getElementById('pop-count').innerText = p;
}

// Controls
const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', (e) => {
  state.isRunning = !state.isRunning;
  e.target.innerText = state.isRunning ? "Pause" : "Resume";
  if(state.isRunning) {
      e.target.classList.add('primary');
  } else {
      e.target.classList.remove('primary');
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
  document.getElementById('speed-val').innerText = `${state.speed}Hz`;
});

// Mouse Drag
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.6, Math.min(2.5, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
