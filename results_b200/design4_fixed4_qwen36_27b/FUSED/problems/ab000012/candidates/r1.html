<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #050508;
        --bg-gradient: linear-gradient(to bottom, #0f1016, #050508);
        --gold-primary: #cfb53b;
        --gold-highlight: #ffe680;
        --gold-shadow: #755d1e;
        --accent-cyan: #4fd1c5;
        --accent-glow: rgba(79, 209, 197, 0.4);
        --text-main: #e2e8f0;
        --text-muted: #8b9bb4;
        --font-heading: 'Times New Roman', 'Georgia', serif;
        --font-body: 'Segoe UI', 'Helvetica Neue', sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* --- Background Atmosphere --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    /* Fog texture overlay */
    .fog-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.07'/%3E%3C/svg%3E");
        z-index: 1;
        pointer-events: none;
        opacity: 0.6;
    }

    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 40%, transparent 20%, var(--bg-deep) 95%);
        z-index: 2;
        pointer-events: none;
    }

    /* --- Main Container --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem;
    }

    /* --- Header --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
    }

    /* Refined Currency: Gold Ingot */
    .currency-ingot {
        position: relative;
        display: flex;
        align-items: center;
        padding: 6px 16px 6px 6px;
        background: linear-gradient(180deg, #2a2a2a 0%, #111 100%);
        border: 1px solid #444;
        border-radius: 4px;
        box-shadow: 
            inset 0 1px 0 rgba(255,255,255,0.1),
            0 5px 15px rgba(0,0,0,0.8);
        transform: skewX(-10deg);
    }

    .ingot-icon {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, var(--gold-highlight) 0%, var(--gold-primary) 50%, var(--gold-shadow) 100%);
        border-radius: 3px;
        box-shadow: 0 0 10px var(--gold-shadow);
        display: flex;
        align-items: center;
        justify-content: center;
        transform: skewX(10deg); /* Counter skew */
        margin-right: 12px;
        border: 1px solid rgba(255,255,255,0.3);
    }

    .ingot-icon svg {
        width: 18px;
        height: 18px;
        fill: #4a3b00;
    }

    .currency-amount {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-highlight);
        text-shadow: 0 1px 2px black;
        transform: skewX(10deg); /* Counter skew */
        letter-spacing: 0.5px;
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 4rem;
        text-transform: uppercase;
        letter-spacing: 0.15em; /* Tightened */
        margin-bottom: 0.2rem;
        background: linear-gradient(to bottom, #fff 0%, var(--gold-highlight) 40%, var(--gold-primary) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(212, 175, 55, 0.3));
        position: relative;
        margin-top: 2rem;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.9rem;
        color: var(--accent-cyan);
        letter-spacing: 0.6em;
        text-transform: uppercase;
        margin-bottom: 2rem;
        opacity: 0.9;
        text-shadow: 0 0 10px var(--accent-glow);
        border-top: 1px solid rgba(79, 209, 197, 0.3);
        padding-top: 0.5rem;
    }

    /* The Summoning Orb (Enhanced) */
    .orb-container {
        position: relative;
        width: 220px;
        height: 220px;
        margin-bottom: 2rem;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .orb-svg {
        width: 100%;
        height: 100%;
        animation: float 6s ease-in-out infinite;
        filter: drop-shadow(0 0 20px rgba(79, 209, 197, 0.4));
    }

    /* --- Menu Grid --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        margin-bottom: 2rem;
        perspective: 1000px;
    }

    /* Artifact Card Design */
    .menu-card {
        background: linear-gradient(160deg, #1a1a24 0%, #0b0b10 100%);
        border: 1px solid #333;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem 0.5rem;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        transform-style: preserve-3d;
        box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        overflow: hidden;
    }

    /* Ornate Corners via Pseudo-elements */
    .menu-card::before, .menu-card::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        border: 1px solid var(--gold-shadow);
        transition: all 0.3s ease;
        pointer-events: none;
    }
    
    .menu-card::before {
        top: 5px; left: 5px;
        border-right: none; border-bottom: none;
    }
    
    .menu-card::after {
        bottom: 5px; right: 5px;
        border-left: none; border-top: none;
    }

    /* Inner glow border */
    .menu-card-inner-border {
        position: absolute;
        top: 2px; left: 2px; right: 2px; bottom: 2px;
        border: 1px solid rgba(255,255,255,0.05);
        pointer-events: none;
    }

    .menu-card:hover {
        transform: translateY(-8px) scale(1.02);
        background: linear-gradient(160deg, #22222e 0%, #111 100%);
        border-color: var(--gold-primary);
        box-shadow: 0 15px 30px rgba(0,0,0,0.8), 0 0 15px rgba(212, 175, 55, 0.1);
    }

    .menu-card:hover::before, .menu-card:hover::after {
        width: 30px;
        height: 30px;
        border-color: var(--gold-highlight);
        box-shadow: 0 0 5px var(--gold-shadow);
    }

    .menu-card:active {
        transform: translateY(-4px) scale(0.98);
    }

    .card-icon {
        width: 40px;
        height: 40px;
        fill: var(--text-muted);
        margin-bottom: 12px;
        transition: all 0.3s ease;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .menu-card:hover .card-icon {
        fill: var(--gold-highlight);
        transform: translateY(-2px);
        filter: drop-shadow(0 0 8px var(--gold-shadow));
    }

    .card-label {
        font-family: var(--font-heading);
        font-size: 1rem;
        color: var(--text-main);
        letter-spacing: 0.08em;
        font-weight: 600;
        text-transform: uppercase;
        z-index: 2;
    }

    /* Special styling for Summon Button */
    .menu-card.summon {
        border-color: var(--gold-shadow);
        background: linear-gradient(160deg, #2a2518 0%, #0f0f0f 100%);
    }
    
    .menu-card.summon .card-icon {
        fill: var(--gold-primary);
    }

    .menu-card.summon:hover {
        box-shadow: 0 15px 30px rgba(0,0,0,0.8), 0 0 20px rgba(212, 175, 55, 0.2);
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.75rem;
        opacity: 0.4;
        padding-top: 1rem;
        letter-spacing: 1px;
    }

    /* --- Animations --- */
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
    }

    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 2.5rem; }
        .menu-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
        .app-container { padding: 1rem; }
        .orb-container { width: 160px; height: 160px; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="fog-layer"></div>
    <div class="vignette"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-ingot">
                <div class="ingot-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                    </svg>
                </div>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <div class="orb-container">
                <!-- Procedural Orb SVG with Complex Layers -->
                <svg class="orb-svg" viewBox="0 0 200 200">
                    <defs>
                        <!-- Core Gradient -->
                        <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="0%" style="stop-color:#fff;stop-opacity:0.9" />
                            <stop offset="20%" style="stop-color:#4fd1c5;stop-opacity:0.8" />
                            <stop offset="70%" style="stop-color:#2c5261;stop-opacity:0.4" />
                            <stop offset="100%" style="stop-color:#050508;stop-opacity:0" />
                        </radialGradient>
                        
                        <!-- Outer Aura -->
                        <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:#4fd1c5;stop-opacity:0.3" />
                            <stop offset="100%" style="stop-color:#050508;stop-opacity:0" />
                        </radialGradient>

                        <!-- Glow Filter -->
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>

                    <!-- Aura -->
                    <circle cx="100" cy="100" r="90" fill="url(#auraGrad)">
                        <animate attributeName="r" values="85;95;85" dur="4s" repeatCount="indefinite" />
                    </circle>

                    <!-- Rotating Runes/Rings -->
                    <g opacity="0.6">
                        <circle cx="100" cy="100" r="65" stroke="rgba(79, 209, 197, 0.3)" stroke-width="1" stroke-dasharray="4 8" fill="none">
                            <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="25s" repeatCount="indefinite" />
                        </circle>
                        <circle cx="100" cy="100" r="75" stroke="rgba(255, 255, 255, 0.1)" stroke-width="0.5" fill="none">
                            <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="40s" repeatCount="indefinite" />
                        </circle>
                    </g>

                    <!-- Core Sphere -->
                    <circle cx="100" cy="100" r="45" fill="url(#orbGrad)" filter="url(#glow)">
                        <animate attributeName="r" values="44;46;44" dur="3s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Inner Light -->
                    <circle cx="100" cy="100" r="15" fill="white" opacity="0.8" filter="url(#glow)">
                        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite" />
                    </circle>
                </svg>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <div class="menu-card-inner-border"></div>
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Flame/Diamond Icon -->
                    <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                </svg>
                <span class="card-label">Summon</span>
            </div>

            <!-- Roster -->
            <div class="menu-card" onclick="interact('Roster')">
                <div class="menu-card-inner-border"></div>
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- People/Roster Icon -->
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card" onclick="interact('Battle')">
                <div class="menu-card-inner-border"></div>
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Sword/Battle Icon -->
                    <path d="M6 2l12 12-2 2-4-4-6 6V2z" />
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card" onclick="interact('Grind')">
                <div class="menu-card-inner-border"></div>
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Gear/Grind Icon -->
                    <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.35 0-.64.22-.7.55l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.06.33.35.55.7.55h4c.35 0 .64-.22.7-.55l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                </svg>
                <span class="card-label">Grind</span>
            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline Mode
        </footer>
    </div>

<script>
    // --- Background Particle System ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.vx = (Math.random() - 0.5) * 0.3;
            this.vy = -(Math.random() * 1.5 + 0.5); // Move upwards
            this.size = Math.random() * 2.5;
            this.alpha = Math.random() * 0.6;
            this.life = Math.random() * 0.5 + 0.5;
            // Color variation: mostly cyan, some white, some gold
            const rand = Math.random();
            if (rand > 0.9) {
                this.color = '212, 175, 55'; // Gold
            } else if (rand > 0.7) {
                this.color = '255, 255, 255'; // White
            } else {
                this.color = '79, 209, 197'; // Cyan
            }
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.001;

            if (this.alpha <= 0 || this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 12000); // Increased density
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        // Draw subtle connecting lines for "magic" feel
        ctx.lineWidth = 0.5;
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
            
            // Connect close particles (only for performance on larger screens)
            if (width > 768) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(79, 209, 197, ${0.15 - dist/800})`;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        // Visual feedback for buttons
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
