<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette: Unified Mystic System */
        --bg-deep: #050508;
        --bg-panel: #0e0e16;
        
        --gold-primary: #d4af37;
        --gold-glow: #ffe066;
        --gold-dim: #5c4b1e;
        
        --silver-primary: #e0e6ed;
        --silver-glow: #ffffff;
        --silver-dim: #4a5568;

        --crimson-primary: #dc2626; /* Darker, mystical red */
        --crimson-glow: #ff4d4d;
        --crimson-dim: #5c1010;

        --deep-blue-primary: #60a5fa;
        --deep-blue-glow: #93c5fd;
        --deep-blue-dim: #1e3a8a;

        --purple-primary: #a855f7;
        --purple-glow: #d8b4fe;
        --purple-dim: #4c1d95;

        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        
        --font-heading: 'Georgia', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Helvetica Neue', sans-serif;
        --font-rune: 'Georgia', serif; /* Fallback for stylized look */
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* --- Background Atmosphere --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    .atmosphere-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
            radial-gradient(circle at 50% 40%, rgba(20, 30, 60, 0.4) 0%, rgba(5, 5, 8, 0.98) 75%),
            linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.8) 100%);
        z-index: 1;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1200px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 1.5rem;
        justify-content: space-between;
    }

    /* --- Header: Currency --- */
    header {
        display: flex;
        justify-content: flex-end;
        padding-top: 0.5rem;
        z-index: 20;
    }

    .currency-container {
        display: flex;
        align-items: center;
        background: rgba(10, 10, 15, 0.6);
        padding: 8px 24px 8px 12px;
        border-radius: 4px; /* Sharp corners */
        border: 1px solid var(--gold-dim);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.1), inset 0 0 10px rgba(0,0,0,0.5);
        cursor: pointer;
        transition: all 0.3s ease;
        backdrop-filter: blur(8px);
        position: relative;
    }

    /* Decorative corners for currency */
    .currency-container::before, .currency-container::after {
        content: '';
        position: absolute;
        width: 6px;
        height: 6px;
        border: 1px solid var(--gold-primary);
        transition: all 0.3s ease;
    }
    .currency-container::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .currency-container::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

    .currency-container:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
    }

    .coin-visual {
        width: 24px;
        height: 24px;
        background: radial-gradient(circle at 30% 30%, var(--gold-glow), var(--gold-primary), var(--gold-dim));
        border-radius: 50%;
        border: 1px solid #fff;
        box-shadow: 0 0 10px var(--gold-primary);
        margin-right: 12px;
        position: relative;
    }
    
    .coin-visual::after {
        content: '';
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        border: 1px dashed var(--gold-dim);
    }

    .currency-value {
        font-family: var(--font-heading);
        font-size: 1.2rem;
        font-weight: bold;
        color: var(--gold-glow);
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        letter-spacing: 1px;
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: 1rem;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 5rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 0;
        background: linear-gradient(to bottom, #fff 20%, var(--gold-primary) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.9));
        z-index: 10;
        font-weight: normal;
        text-align: center;
        margin-top: -60px;
        position: relative;
    }
    
    .game-title::after {
        content: 'AETHERBOUND';
        position: absolute;
        left: 0; top: 0; width: 100%;
        color: transparent;
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.1);
        z-index: -1;
        transform: translateY(4px);
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.9rem;
        color: var(--silver-primary);
        letter-spacing: 0.6em;
        text-transform: uppercase;
        margin-bottom: 2rem;
        opacity: 0.9;
        text-shadow: 0 0 10px rgba(255,255,255,0.3);
        z-index: 10;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 8px;
    }

    /* The Artifact (Summoning Circle) */
    .artifact-container {
        position: relative;
        width: 350px;
        height: 350px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: float 6s ease-in-out infinite;
        z-index: 5;
    }

    @keyframes float {
        0% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-15px) scale(1.02); }
        100% { transform: translateY(0px) scale(1); }
    }

    .artifact-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 0 40px rgba(96, 165, 250, 0.15));
    }

    /* --- Menu Grid: Arcane Sigils --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding-bottom: 1rem;
    }

    /* Sigil Button Design */
    .menu-card {
        position: relative;
        height: 200px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        background: transparent;
        perspective: 800px;
    }

    /* The "Crystal/Stone" Face */
    .sigil-face {
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, rgba(20,20,30,0.8) 0%, rgba(10,10,15,0.9) 100%);
        /* Diamond/Cut shape */
        clip-path: polygon(50% 0%, 100% 15%, 100% 85%, 50% 100%, 0% 85%, 0% 15%);
        border: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        transition: all 0.4s ease;
    }

    /* Border Glow (Pseudo-element behind clip-path is tricky, so we use a wrapper trick or inset borders) */
    .sigil-border-glow {
        position: absolute;
        inset: 0;
        background: transparent;
        clip-path: polygon(50% 0%, 100% 15%, 100% 85%, 50% 100%, 0% 85%, 0% 15%);
        z-index: -1;
        transition: all 0.4s ease;
    }

    /* Texture */
    .sigil-face::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='2.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        pointer-events: none;
        mix-blend-mode: overlay;
    }

    /* Hover State */
    .menu-card:hover {
        transform: translateY(-10px);
    }
    
    .menu-card:hover .sigil-face {
        background: linear-gradient(180deg, rgba(30,30,45,0.95) 0%, rgba(15,15,25,0.95) 100%);
    }

    /* --- Icon Styles --- */
    .card-icon {
        width: 56px;
        height: 56px;
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        margin-bottom: 1.2rem;
        transition: all 0.4s ease;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        z-index: 2;
    }

    .card-label {
        font-family: var(--font-heading);
        font-size: 1rem;
        color: var(--text-muted);
        letter-spacing: 0.25em;
        text-transform: uppercase;
        font-weight: bold;
        text-shadow: 0 2px 4px rgba(0,0,0,1);
        transition: color 0.3s ease;
        z-index: 2;
    }

    /* --- Specific Card Theming --- */

    /* SUMMON - Gold */
    .menu-card.summon .sigil-face { border: 1px solid rgba(212, 175, 55, 0.2); }
    .menu-card.summon .card-icon { stroke: var(--gold-primary); }
    .menu-card.summon:hover .sigil-face {
        border-color: var(--gold-primary);
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.15), inset 0 0 20px rgba(212, 175, 55, 0.05);
    }
    .menu-card.summon:hover .card-icon {
        stroke: var(--gold-glow);
        filter: drop-shadow(0 0 10px var(--gold-primary));
        transform: scale(1.1);
    }
    .menu-card.summon:hover .card-label { color: var(--gold-glow); }

    /* ROSTER - Silver/White */
    .menu-card.roster .sigil-face { border: 1px solid rgba(224, 230, 237, 0.2); }
    .menu-card.roster .card-icon { stroke: var(--silver-primary); }
    .menu-card.roster:hover .sigil-face {
        border-color: var(--silver-primary);
        box-shadow: 0 0 30px rgba(224, 230, 237, 0.15), inset 0 0 20px rgba(224, 230, 237, 0.05);
    }
    .menu-card.roster:hover .card-icon {
        stroke: var(--silver-glow);
        filter: drop-shadow(0 0 10px var(--silver-primary));
        transform: scale(1.1);
    }
    .menu-card.roster:hover .card-label { color: var(--silver-glow); }

    /* BATTLE - Crimson */
    .menu-card.battle .sigil-face { border: 1px solid rgba(220, 38, 38, 0.2); }
    .menu-card.battle .card-icon { stroke: var(--crimson-primary); }
    .menu-card.battle:hover .sigil-face {
        border-color: var(--crimson-primary);
        box-shadow: 0 0 30px rgba(220, 38, 38, 0.15), inset 0 0 20px rgba(220, 38, 38, 0.05);
    }
    .menu-card.battle:hover .card-icon {
        stroke: var(--crimson-glow);
        filter: drop-shadow(0 0 10px var(--crimson-primary));
        transform: scale(1.1);
    }
    .menu-card.battle:hover .card-label { color: var(--crimson-glow); }

    /* GRIND - Deep Blue/Purple */
    .menu-card.grind .sigil-face { border: 1px solid rgba(96, 165, 250, 0.2); }
    .menu-card.grind .card-icon { stroke: var(--deep-blue-primary); }
    .menu-card.grind:hover .sigil-face {
        border-color: var(--deep-blue-primary);
        box-shadow: 0 0 30px rgba(96, 165, 250, 0.15), inset 0 0 20px rgba(96, 165, 250, 0.05);
    }
    .menu-card.grind:hover .card-icon {
        stroke: var(--deep-blue-glow);
        filter: drop-shadow(0 0 10px var(--deep-blue-primary));
        transform: scale(1.1);
    }
    .menu-card.grind:hover .card-label { color: var(--deep-blue-glow); }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.65rem;
        opacity: 0.4;
        padding-top: 1rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-family: var(--font-heading);
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 3rem; margin-top: -20px; }
        .artifact-container { width: 260px; height: 260px; margin: -20px 0; }
        .menu-grid { 
            grid-template-columns: repeat(2, 1fr); 
            gap: 1rem; 
            margin-top: 2rem;
        }
        .app-container { padding: 1rem; }
        .menu-card { height: 160px; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="atmosphere-overlay"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-container">
                <div class="coin-visual"></div>
                <span class="currency-value">12,450</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <!-- The Artifact / Summoning Circle -->
            <div class="artifact-container">
                <svg class="artifact-svg" viewBox="0 0 400 400">
                    <defs>
                        <!-- Filters -->
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        <filter id="spiritGlow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        
                        <!-- Gradients -->
                        <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
                            <stop offset="30%" style="stop-color:#60a5fa;stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:#050508;stop-opacity:0" />
                        </radialGradient>
                        
                        <linearGradient id="runeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#a855f7;stop-opacity:0.5" />
                            <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
                        </linearGradient>
                    </defs>

                    <!-- Base Pedestal -->
                    <ellipse cx="200" cy="340" rx="100" ry="15" fill="rgba(0,0,0,0.8)" filter="url(#glow)"/>

                    <!-- Outer Stone Ring -->
                    <g transform="translate(200, 200)">
                        <!-- Thick stone border -->
                        <circle r="150" fill="none" stroke="#1a1a20" stroke-width="10" />
                        <circle r="150" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="2 4" />
                        
                        <!-- Rotating Runes (Outer) -->
                        <g filter="url(#glow)">
                            <circle r="135" stroke="url(#runeGrad)" stroke-width="2" stroke-dasharray="10 20" fill="none" opacity="0.8">
                                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="50s" repeatCount="indefinite" />
                            </circle>
                            <!-- Rune Symbols (Dashed lines) -->
                            <circle r="125" stroke="#fff" stroke-width="2" stroke-dasharray="2 40" fill="none" opacity="0.4">
                                <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="80s" repeatCount="indefinite" />
                            </circle>
                        </g>

                        <!-- Middle Geometry (Interlocking Triangles) -->
                        <g opacity="0.6" filter="url(#glow)">
                            <!-- Top Triangle -->
                            <polygon points="0,-100 86.6,50 -86.6,50" fill="none" stroke="rgba(96, 165, 250, 0.5)" stroke-width="1">
                                <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite" />
                            </polygon>
                            <!-- Bottom Triangle -->
                            <polygon points="0,100 -86.6,-50 86.6,-50" fill="none" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1">
                                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="45s" repeatCount="indefinite" />
                            </polygon>
                        </g>
                        
                        <!-- Inner Core Aura -->
                        <circle r="50" fill="url(#coreGrad)" filter="url(#spiritGlow)">
                            <animate attributeName="r" values="48;55;48" dur="4s" repeatCount="indefinite" />
                            <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" />
                        </circle>
                        
                        <!-- The Spirit Silhouette (Ghostly) -->
                        <g transform="translate(0, -10)">
                            <path d="M0,-35 C12,-35 20,-22 20,-5 C20,12 12,20 0,35 C-12,20 -20,12 -20,-5 C-20,-22 -12,-35 0,-35 Z" fill="rgba(255,255,255,0.9)" filter="url(#glow)">
                                 <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite" />
                                 <animateTransform attributeName="transform" type="scale" values="1; 1.05; 1" dur="3s" repeatCount="indefinite" />
                            </path>
                        </g>

                        <!-- Center Eye/Orb -->
                        <circle r="8" fill="#fff" filter="url(#glow)">
                             <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
                        </circle>
                    </g>
                </svg>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <div class="sigil-face">
                    <!-- Icon: Mystic Flame/Orb -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12 2c0 0-7 7-7 13a7 7 0 0 0 14 0c0-6-7-13-7-13z" />
                        <path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" fill="currentColor" opacity="0.5"/>
                    </svg>
                    <span class="card-label">Summon</span>
                </div>
            </div>

            <!-- Roster -->
            <div class="menu-card roster" onclick="interact('Roster')">
                <div class="sigil-face">
                    <!-- Icon: Constellation (Stars connected) -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12 2l2 7h7l-5.5 4 2 7L12 16l-5.5 4 2-7L3 9h7z" opacity="0.2" fill="currentColor"/>
                        <path d="M8 12l2 2 4-4 4 4" />
                        <circle cx="8" cy="12" r="1.5" fill="currentColor" stroke="none"/>
                        <circle cx="14" cy="10" r="1.5" fill="currentColor" stroke="none"/>
                        <circle cx="16" cy="14" r="1.5" fill="currentColor" stroke="none"/>
                    </svg>
                    <span class="card-label">Roster</span>
                </div>
            </div>

            <!-- Battle -->
            <div class="menu-card battle" onclick="interact('Battle')">
                <div class="sigil-face">
                    <!-- Icon: Mystical Blade (Crimson) -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                        <path d="M13 19l6-6" />
                        <path d="M16 16l4 4" />
                        <path d="M19 21l2-2" />
                        <path d="M10 14l-3 3" />
                        <path d="M3 6l9 9" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
                    </svg>
                    <span class="card-label">Battle</span>
                </div>
            </div>

            <!-- Grind -->
            <div class="menu-card grind" onclick="interact('Grind')">
                <div class="sigil-face">
                    <!-- Icon: Dungeon Gate / Anvil Hybrid -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M4 20h16" />
                        <path d="M6 20v-8a6 6 0 0 1 12 0v8" />
                        <path d="M12 12v-4" />
                        <path d="M9 8l3-3 3 3" />
                        <circle cx="12" cy="15" r="1.5" fill="currentColor" stroke="none"/>
                    </svg>
                    <span class="card-label">Grind</span>
                </div>
            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline
        </footer>
    </div>

<script>
    // --- Background Particle System (Ethereal Mist/Stars) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            // Slow drifting
            this.vx = (Math.random() - 0.5) * 0.15;
            this.vy = (Math.random() - 0.5) * 0.15;
            this.size = Math.random() * 1.5 + 0.5;
            this.baseAlpha = Math.random() * 0.5 + 0.1;
            this.alpha = this.baseAlpha;
            this.life = Math.random() * 100;
            
            // Palette: Gold, Silver, Blue, Purple
            const rand = Math.random();
            if (rand > 0.96) {
                this.color = '212, 175, 55'; // Gold
            } else if (rand > 0.90) {
                this.color = '96, 165, 250'; // Blue
            } else if (rand > 0.85) {
                this.color = '168, 85, 247'; // Purple
            } else {
                this.color = '224, 230, 237'; // Silver
            }
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life++;
            
            // Twinkle effect
            this.alpha = this.baseAlpha + Math.sin(this.life * 0.03) * 0.15;

            // Wrap around screen
            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${Math.max(0, this.alpha)})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 10000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        // Add a subtle pulse effect via JS if needed, but CSS active state handles the click
        console.log(`Interacting with: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
