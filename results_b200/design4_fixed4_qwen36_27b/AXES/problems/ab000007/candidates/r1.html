<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina: Capture & Collection</title>
<style>
  :root {
    --bg-deep: #020205;
    --bg-gradient-inner: #120f26;
    --bg-gradient-outer: #000000;
    
    --accent-cyan: #4facfe;
    --accent-magenta: #f093fb;
    --accent-lime: #43e97b;
    --accent-gold: #fa709a;
    
    --glass-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-blur: 16px;
    
    --font-ui: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Atmosphere & Background --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(circle at 50% 50%, var(--bg-gradient-inner), var(--bg-gradient-outer) 85%);
  }

  /* Noise Texture Overlay */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.07;
    pointer-events: none;
    z-index: 1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Ambient Glows */
  .ambient-light {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    z-index: 0;
    animation: breathe 8s infinite alternate ease-in-out;
  }
  .light-1 { width: 400px; height: 400px; top: -10%; left: -10%; background: var(--accent-cyan); }
  .light-2 { width: 500px; height: 500px; bottom: -10%; right: -10%; background: var(--accent-magenta); animation-delay: -4s; }

  @keyframes breathe {
    0% { transform: scale(1); opacity: 0.3; }
    100% { transform: scale(1.1); opacity: 0.5; }
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center; /* Center alignment for Title */
  }

  /* Header & Title (Top Center) */
  .header {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 1rem;
    pointer-events: auto;
  }

  h1 {
    font-size: 3.5rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    background: linear-gradient(135deg, #fff 0%, #e0e0e0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    position: relative;
  }

  .subtitle {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 0.5rem;
  }

  /* HUD (Glassmorphism) */
  .hud-panel {
    margin-top: 1.5rem;
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--glass-border);
    padding: 0.6rem 1.8rem;
    border-radius: 100px;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    box-shadow: 0 4px 30px rgba(0,0,0,0.1);
    transition: transform 0.3s ease;
  }

  .stat-icon {
    width: 20px; height: 20px;
    fill: var(--accent-lime);
    filter: drop-shadow(0 0 5px var(--accent-lime));
  }

  .stat-value {
    font-size: 1.4rem;
    font-weight: 600;
    color: white;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-left: 0.2rem;
  }

  /* Footer & Button (Bottom Right) */
  .footer {
    margin-top: auto;
    margin-bottom: 1rem;
    margin-right: 0;
    width: 100%;
    display: flex;
    justify-content: flex-end; /* Push to right */
    pointer-events: auto;
    align-items: flex-end;
  }

  .btn-main {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: white;
    font-family: var(--font-ui);
    font-size: 1rem;
    font-weight: 600;
    padding: 1rem 2.5rem;
    border-radius: 12px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    position: relative;
    overflow: hidden;
  }

  .btn-main:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.4);
    transform: translateY(-2px);
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
  }
  
  .btn-main:active {
    transform: scale(0.98);
  }

  /* Toast Notification */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(5px);
    border: 1px solid var(--accent-lime);
    color: var(--accent-lime);
    padding: 1rem 2rem;
    border-radius: 8px;
    font-weight: 600;
    letter-spacing: 0.05em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 40px rgba(67, 233, 123, 0.15);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    h1 { font-size: 2.5rem; }
    .ui-layer { padding: 1.5rem; }
    .footer { justify-content: center; }
    .btn-main { width: 100%; text-align: center; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Atmosphere -->
  <div class="noise-overlay"></div>
  <div class="ambient-light light-1"></div>
  <div class="ambient-light light-2"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <h1>Lumina</h1>
      <div class="subtitle">Capture & Collection</div>
      
      <!-- HUD Panel -->
      <div class="hud-panel">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" />
        </svg>
        <div>
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Specimens</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Enhanced visual rendering with organic shapes and trails.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let frameCount = 0;

  // Configuration
  const CREATURE_COUNT = 8;
  
  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  window.addEventListener('touchmove', e => {
    e.preventDefault(); 
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.015;
      this.size = Math.random() * 4 + 2;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.95; // Friction
      this.vy *= 0.95;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset();
      // Start random
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    }

    reset() {
      this.x = Math.random() < 0.5 ? -100 : width + 100;
      this.y = Math.random() * height;
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.baseRadius = Math.random() * 15 + 18;
      
      // Visual properties
      const hue = Math.random() * 360;
      this.color1 = `hsl(${hue}, 80%, 60%)`;
      this.color2 = `hsl(${(hue + 40) % 360}, 90%, 70%)`;
      this.eyeColor = '#fff';
      
      // Organic movement props
      this.angle = 0;
      this.wobbleSpeed = Math.random() * 0.03 + 0.01;
      this.wobble = Math.random() * Math.PI * 2;
      
      // Shape variation (0-3)
      this.shapeType = Math.floor(Math.random() * 3);
      
      this.isCaught = false;
    }

    update() {
      if (this.isCaught) return;

      this.x += this.vx;
      this.y += this.vy;
      this.wobble += this.wobbleSpeed;
      
      // Organic drift
      this.vx += Math.sin(this.wobble) * 0.02;
      this.vy += Math.cos(this.wobble) * 0.02;

      // Soft bounce
      if (this.x < -50) this.vx = Math.abs(this.vx);
      if (this.x > width + 50) this.vx = -Math.abs(this.vx);
      if (this.y < -50) this.vy = Math.abs(this.vy);
      if (this.y > height + 50) this.vy = -Math.abs(this.vy);

      // Avoid Net
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 180) {
        const force = (180 - dist) / 180;
        this.vx += (dx / dist) * force * 0.8;
        this.vy += (dy / dist) * force * 0.8;
      }

      // Limit speed
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 5) {
        this.vx = (this.vx / speed) * 5;
        this.vy = (this.vy / speed) * 5;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Rotate slightly based on movement
      const rot = Math.atan2(this.vy, this.vx) + Math.PI/2;
      ctx.rotate(rot);

      const r = this.baseRadius;
      
      // Outer Glow
      ctx.shadowBlur = 25;
      ctx.shadowColor = this.color1;

      // Organic Blob Shape
      ctx.beginPath();
      
      // Dynamic shape drawing using bezier curves and sine waves
      const points = 6;
      for (let i = 0; i <= points; i++) {
        const angle = (i / points) * Math.PI * 2;
        // Add wobble to radius
        const wobbleR = r + Math.sin(angle * 3 + this.wobble * 5) * (r * 0.2);
        const px = Math.cos(angle) * wobbleR;
        const py = Math.sin(angle) * wobbleR;
        
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();

      // Fill with Duotone Gradient
      const grad = ctx.createLinearGradient(-r, -r, r, r);
      grad.addColorStop(0, this.color1);
      grad.addColorStop(1, this.color2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Inner Highlight (Glass effect)
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fill();

      // Eye / Core
      ctx.fillStyle = this.eyeColor;
      ctx.shadowBlur = 5;
      ctx.shadowColor = '#fff';
      ctx.beginPath();
      ctx.arc(0, -r * 0.2, r * 0.25, 0, Math.PI * 2);
      ctx.fill();
      
      // Pupil
      ctx.fillStyle = '#000';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(0, -r * 0.2, r * 0.1, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 70; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<20; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color1));
    }

    // Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1200);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 3000);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    if (mouse.x < 0) return; // Don't draw if off screen

    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Outer Ring
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(79, 172, 254, 0.5)';
    ctx.strokeStyle = 'rgba(79, 172, 254, 0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    
    const pulse = Math.sin(frameCount * 0.1) * 5;
    ctx.arc(0, 0, 60 + pulse, 0, Math.PI * 2);
    ctx.stroke();

    // Net Inner Web
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, 40 + pulse, 0, Math.PI * 2);
    ctx.stroke();

    // Crosshairs
    ctx.beginPath();
    ctx.moveTo(-80, 0); ctx.lineTo(-20, 0);
    ctx.moveTo(80, 0); ctx.lineTo(20, 0);
    ctx.moveTo(0, -80); ctx.lineTo(0, -20);
    ctx.moveTo(0, 80); ctx.lineTo(0, 20);
    ctx.stroke();

    // Capture Zone Indicator (if held)
    if (isMouseDown) {
      ctx.fillStyle = 'rgba(79, 172, 254, 0.1)';
      ctx.beginPath();
      ctx.arc(0, 0, 70, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function loop() {
    frameCount++;
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
