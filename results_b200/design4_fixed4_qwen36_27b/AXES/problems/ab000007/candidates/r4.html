<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina: Capture & Collection</title>
<style>
  :root {
    /* Palette */
    --bg-deep: #020617; /* Slate 950 */
    --bg-center: #1e1b4b; /* Indigo 950 */
    
    --accent-cyan: #22d3ee;
    --accent-lime: #a3e635;
    --accent-magenta: #e879f9;
    
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8; /* Slate 400 */
    
    /* Glassmorphism */
    --glass-surface: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-highlight: rgba(255, 255, 255, 0.2);
    
    /* Typography */
    --font-stack: 'Montserrat', 'Exo 2', 'Arial Black', sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--font-stack);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* --- Atmosphere & Background --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    /* Deep Radial Gradient for depth */
    background: radial-gradient(circle at 50% 50%, var(--bg-center) 0%, var(--bg-deep) 100%);
  }

  /* Noise Texture Overlay (SVG Data URI for offline reliability) */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.05;
    pointer-events: none;
    z-index: 1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Ambient Glows */
  .ambient-light {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.3;
    z-index: 0;
    animation: breathe 20s infinite alternate ease-in-out;
  }
  .light-1 { width: 500px; height: 500px; top: -10%; left: -10%; background: #312e81; }
  .light-2 { width: 800px; height: 800px; bottom: -20%; right: -10%; background: #172554; animation-delay: -10s; }

  @keyframes breathe {
    0% { transform: scale(1); opacity: 0.2; }
    100% { transform: scale(1.1); opacity: 0.35; }
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none; /* Hide default cursor */
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    /* STRICT 48px MARGIN GRID */
    padding: 48px; 
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Header & Title (Left Aligned Column) */
  .header {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    pointer-events: auto;
  }

  h1 {
    /* Geometric Sans-Serif, Wide Tracking */
    font-size: 4.5rem;
    font-weight: 800; /* Extra Bold */
    margin: 0;
    letter-spacing: 0.1em; /* Wide tracking per critique */
    text-transform: uppercase;
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
    /* Gradient Text */
    background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 1.1rem;
    /* Muted Slate-Blue */
    color: var(--text-secondary); 
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 12px;
    font-weight: 600; /* Semi-Bold */
    margin-bottom: 24px;
  }

  /* HUD (Glassmorphism Pill) */
  .hud-panel {
    background: var(--glass-surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    padding: 16px 28px;
    border-radius: 16px; /* Slightly rounded square for HUD, distinct from button */
    display: flex;
    align-items: baseline;
    gap: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    transition: transform 0.3s ease, border-color 0.3s ease;
    min-width: 160px;
  }

  .hud-panel:hover {
    border-color: var(--glass-highlight);
  }

  .stat-icon {
    width: 24px; height: 24px;
    fill: var(--accent-cyan);
    filter: drop-shadow(0 0 8px var(--accent-cyan));
  }

  .stat-value {
    /* Significantly Larger & Bolder */
    font-size: 2rem; 
    font-weight: 800;
    color: white;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .stat-label {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }

  /* Footer & Button (Bottom Right) */
  .footer {
    display: flex;
    justify-content: flex-end;
    align-items: flex-end;
    pointer-events: auto;
  }

  .btn-main {
    /* Glass-morphism Button */
    background: var(--glass-surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    color: #fff;
    font-family: var(--font-stack);
    font-size: 0.9rem;
    font-weight: 600;
    padding: 18px 36px;
    border-radius: 12px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    position: relative;
    overflow: hidden;
  }

  /* Subtle Hover Glow */
  .btn-main:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.4);
    transform: translateY(-2px);
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
  }
  
  .btn-main:active {
    transform: scale(0.98);
  }

  /* Toast Notification */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(2, 6, 23, 0.8);
    backdrop-filter: blur(8px);
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    padding: 16px 32px;
    border-radius: 8px;
    font-weight: 700;
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 50px rgba(34, 211, 238, 0.2);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile adjustments */
  @media (max-width: 768px) {
    .ui-layer { padding: 32px; } /* Reduced padding for mobile but keeping grid concept */
    h1 { font-size: 3rem; letter-spacing: 0.05em; }
    .subtitle { font-size: 0.9rem; }
    .stat-value { font-size: 1.75rem; }
    .btn-main { padding: 16px 24px; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Atmosphere -->
  <div class="noise-overlay"></div>
  <div class="ambient-light light-1"></div>
  <div class="ambient-light light-2"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <h1>Lumina</h1>
      <div class="subtitle">Capture & Collection</div>
      
      <!-- HUD Panel -->
      <div class="hud-panel">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" />
        </svg>
        <div>
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Specimens</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Focus: Organic Shapes, Bioluminescence, and "Living Scene" movement.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let frameCount = 0;

  // Configuration
  const CREATURE_COUNT = 6;
  
  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  window.addEventListener('touchmove', e => {
    e.preventDefault(); 
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.015;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.92; // Drag
      this.vy *= 0.92;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor(index) {
      this.reset(index);
      // Start random to avoid clumping on load
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    }

    reset(index) {
      // Design Critique: Redistribute creatures to guide eye across screen
      
      if (index % 2 === 0) {
        // Top Right Cluster
        this.x = (width * 0.5) + (Math.random() * (width * 0.4));
        this.y = (height * 0.1) + (Math.random() * (height * 0.3));
      } else {
        // Bottom Right / Left Cluster
        this.x = (Math.random() * (width * 0.6));
        this.y = (height * 0.6) + (Math.random() * (height * 0.3));
      }

      this.vx = (Math.random() - 0.5) * 0.5;
      this.vy = (Math.random() - 0.5) * 0.5;
      this.baseRadius = Math.random() * 15 + 25; 
      
      // Visual properties - Tone down saturation, increase bloom
      const hue = Math.random() * 360;
      this.color1 = `hsl(${hue}, 60%, 65%)`; 
      this.color2 = `hsl(${(hue + 40) % 360}, 70%, 45%)`;
      this.glowColor = `hsl(${hue}, 90%, 70%)`;
      
      // Organic movement props
      this.angle = 0;
      this.wobbleSpeed = Math.random() * 0.02 + 0.005;
      this.wobble = Math.random() * Math.PI * 2;
      
      this.isCaught = false;
    }

    update() {
      if (this.isCaught) return;

      this.x += this.vx;
      this.y += this.vy;
      this.wobble += this.wobbleSpeed;
      
      // Organic drift
      this.vx += Math.sin(this.wobble) * 0.01;
      this.vy += Math.cos(this.wobble) * 0.01;

      // Soft bounce
      if (this.x < -100) this.vx = Math.abs(this.vx);
      if (this.x > width + 100) this.vx = -Math.abs(this.vx);
      if (this.y < -100) this.vy = Math.abs(this.vy);
      if (this.y > height + 100) this.vy = -Math.abs(this.vy);

      // Avoid Net (Fear Factor)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 200) {
        const force = (200 - dist) / 200;
        this.vx += (dx / dist) * force * 1.5;
        this.vy += (dy / dist) * force * 1.5;
      }

      // Limit speed
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 4) {
        this.vx = (this.vx / speed) * 4;
        this.vy = (this.vy / speed) * 4;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Rotate slightly based on movement
      const rot = Math.atan2(this.vy, this.vx) + Math.PI/2;
      ctx.rotate(rot);

      const r = this.baseRadius;
      
      // Design Critique: CSS box-shadow equivalent in Canvas
      ctx.shadowBlur = 40; 
      ctx.shadowColor = this.glowColor;

      // Organic Blob Shape using Bezier curves
      ctx.beginPath();
      const points = 6;
      for (let i = 0; i <= points; i++) {
        const angle = (i / points) * Math.PI * 2;
        // Add wobble to radius for organic feel
        const wobbleR = r + Math.sin(angle * 3 + this.wobble * 5) * (r * 0.25);
        const px = Math.cos(angle) * wobbleR;
        const py = Math.sin(angle) * wobbleR;
        
        if (i === 0) ctx.moveTo(px, py);
        else ctx.quadraticCurveTo(px, py, px, py); 
      }
      ctx.closePath();

      // Fill with Duotone Gradient
      const grad = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r);
      grad.addColorStop(0, this.color1);
      grad.addColorStop(1, this.color2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Inner Highlight (Glass effect)
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fill();

      // Eye / Core (Character)
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#fff';
      ctx.beginPath();
      ctx.arc(0, -r * 0.2, r * 0.25, 0, Math.PI * 2);
      ctx.fill();
      
      // Pupil
      ctx.fillStyle = '#000';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(0, -r * 0.2, r * 0.08, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature(i));
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 60; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<25; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color1));
    }

    // Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1200);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 2500);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    if (mouse.x < 0) return; // Don't draw if off screen

    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Outer Ring (Glowing)
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(34, 211, 238, 0.5)';
    ctx.strokeStyle = 'rgba(34, 211, 238, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    
    const pulse = Math.sin(frameCount * 0.1) * 3;
    ctx.arc(0, 0, 65 + pulse, 0, Math.PI * 2);
    ctx.stroke();

    // Net Inner Web (Crosshair)
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-85, 0); ctx.lineTo(-25, 0);
    ctx.moveTo(85, 0); ctx.lineTo(25, 0);
    ctx.moveTo(0, -85); ctx.lineTo(0, -25);
    ctx.moveTo(0, 85); ctx.lineTo(0, 25);
    ctx.stroke();

    // Capture Zone Indicator (if held)
    if (isMouseDown) {
      ctx.fillStyle = 'rgba(34, 211, 238, 0.15)';
      ctx.beginPath();
      ctx.arc(0, 0, 70, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function loop() {
    frameCount++;
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
