<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway Sphere</title>
<style>
  :root {
    --bg-color: #050508;
    /* Panel Colors */
    --panel-bg: rgba(26, 26, 46, 0.65); /* #1a1a2e with opacity */
    --panel-border: rgba(255, 255, 255, 0.12);
    --panel-highlight: rgba(255, 255, 255, 0.25);
    
    /* Palette */
    --accent-blue: #00d2ff; /* Electric Blue */
    --accent-pink: #ff0055;
    --accent-violet: #7b2cbf;
    
    /* Text */
    --text-main: #ffffff;
    --text-muted: #94a3b8;
    
    /* Typography */
    --font-display: 'Syne', 'Arial Black', sans-serif;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }

  body {
    background-color: var(--bg-color);
    /* Deep space vignette */
    background-image: radial-gradient(circle at 50% 50%, #0a0a12 0%, #020203 100%);
    color: var(--text-main);
    font-family: var(--font-ui);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Canvas Layer */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Layer */
  #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    padding: 24px; /* 8pt grid padding */
  }

  /* Glassmorphism Panel */
  .panel {
    pointer-events: auto;
    width: 320px; /* Denser width */
    background: var(--panel-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--panel-border);
    border-top: 1px solid var(--panel-highlight);
    border-radius: 12px;
    padding: 24px; /* 8pt grid padding */
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
    gap: 24px; /* 8pt grid vertical rhythm */
  }

  /* Header */
  .panel-header {
    display: flex;
    flex-direction: column;
    gap: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 16px;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #fff;
    margin: 0;
    line-height: 1;
    text-transform: uppercase;
    background: linear-gradient(90deg, #fff, #a5b4fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  /* Stats Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .panel-label {
    font-size: 0.65rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .stat-value {
    font-family: var(--font-mono);
    font-size: 1.1rem;
    font-weight: 700; /* Increased weight */
    color: var(--text-main);
    letter-spacing: -0.02em;
  }

  /* Controls */
  .controls-area {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Slider */
  .slider-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
    transition: background 0.2s;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent-blue);
    cursor: pointer;
    border: 2px solid #000;
    box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    margin-top: -6px;
    transition: transform 0.1s;
  }
  
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.1);
  }

  /* Buttons */
  .btn-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px; /* Tighter gap */
  }

  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    padding: 10px 12px;
    border-radius: 6px;
    font-family: var(--font-ui);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.3);
  }

  button:active {
    transform: translateY(1px);
  }

  button.primary {
    background: rgba(0, 210, 255, 0.15);
    border-color: rgba(0, 210, 255, 0.4);
    color: var(--accent-blue);
  }
  
  button.primary:hover {
    background: var(--accent-blue);
    color: #000;
    box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
    border-color: var(--accent-blue);
  }

  button.danger {
    color: var(--accent-pink);
    border-color: rgba(255, 0, 85, 0.3);
  }

  button.danger:hover {
    background: var(--accent-pink);
    color: #fff;
    box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
    border-color: var(--accent-pink);
  }
  
  button.secondary {
    width: 100%;
    margin-top: 4px;
  }

  /* Hint */
  .interaction-hint {
    position: absolute;
    bottom: 24px;
    right: 24px;
    font-size: 0.65rem;
    color: var(--text-muted);
    opacity: 0.5;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    pointer-events: none;
  }

</style>
</head>
<body>

  <!-- Canvas -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Control Panel (Top Left) -->
    <div class="panel">
      
      <div class="panel-header">
        <h1>Conway Sphere</h1>
        <div class="subtitle">Algorithmic Life Simulation</div>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-item">
          <span class="panel-label">Generation</span>
          <span class="stat-value" id="gen-count">0000</span>
        </div>
        <div class="stat-item">
          <span class="panel-label">Population</span>
          <span class="stat-value" id="pop-count">0000</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-area">
        
        <div class="slider-container">
          <div class="slider-header">
            <span class="panel-label">Sim Speed</span>
            <span class="panel-label" id="speed-val" style="color: var(--accent-blue);">15 FPS</span>
          </div>
          <input type="range" id="speed-slider" min="1" max="60" value="15">
        </div>

        <div class="btn-grid">
          <button id="btn-pause" class="primary">Pause</button>
          <button id="btn-reset" class="danger">Randomize</button>
        </div>
        
        <button id="btn-step" class="secondary">Step Frame</button>
      </div>

    </div>

    <div class="interaction-hint">
      Drag to Rotate &bull; Scroll to Zoom
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life - Visual Revision
 * 
 * Design Implementation:
 * 1. 3D Sphere Mesh: True 3D projection with perspective.
 * 2. Palette: Multi-stop gradient (Deep Violet -> Electric Blue -> Hot Pink) based on age.
 * 3. Glow: Additive blending ('lighter') for bloom.
 * 4. UI: Glassmorphism panel, top-left placement, strict 8pt grid.
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 4000, // High density for rich texture
  sphereRadius: 250,
  cellSizeBase: 2.8,
  rotationSpeed: 0.001,
  colors: {
    bg: '#050508'
  }
};

// --- State ---
let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 15,
  lastFrameTime: 0,
  rotation: { x: 0.2, y: 0 }, // Slight initial tilt
  zoom: 1.0,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  dist: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return Math.sqrt(dx*dx + dy*dy + dz*dz);
  }
};

// --- Initialization ---

function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2;
    const radiusAtY = Math.sqrt(1 - y * y);
    const theta = goldenAngle * i;
    points.push({
      x: Math.cos(theta) * radiusAtY * radius,
      y: y * radius,
      z: Math.sin(theta) * radiusAtY * radius,
      idx: i
    });
  }
  return points;
}

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Neighbor search
  const area = 4 * Math.PI * CONFIG.sphereRadius * CONFIG.sphereRadius;
  // Threshold slightly larger than average spacing to ensure connectivity
  const threshold = Math.sqrt(area / CONFIG.cellCount) * 1.15; 

  state.cells = points.map((p, i) => {
    const neighbors = [];
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      // Optimization: Check Y distance first (cheap)
      if (Math.abs(p.y - points[j].y) > threshold) continue;
      
      const d = Vec3.dist(p, points[j]);
      if (d < threshold) {
        neighbors.push(j);
      }
    }
    
    return {
      pos: p,
      idx: i,
      neighbors: neighbors,
      alive: Math.random() > 0.6, // 40% alive start
      age: 0,
      bornGen: 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

// --- Game Logic ---

function stepGame() {
  const currentAlive = state.cells.map(c => c.alive);
  
  state.cells.forEach((cell, i) => {
    let aliveNeighbors = 0;
    for (let k = 0; k < cell.neighbors.length; k++) {
      if (currentAlive[cell.neighbors[k]]) aliveNeighbors++;
    }

    const isAlive = cell.alive;
    let nextAlive = false;

    // Standard Conway Rules
    if (isAlive) {
      if (aliveNeighbors === 2 || aliveNeighbors === 3) nextAlive = true;
    } else {
      if (aliveNeighbors === 3) nextAlive = true;
    }

    cell.alive = nextAlive;
    
    if (nextAlive) {
      if (!isAlive) {
        cell.age = 0; // Born
        cell.bornGen = state.generation;
      } else {
        cell.age++; // Survived
      }
    } else {
      cell.age = 0; // Died
    }
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotation Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotation X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 1000;
  const scale = (fov / (fov + zFinal)) * zoom;
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // 1. Clear Background
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0, 0, width, height);

  // 2. Project & Sort
  const projectedCells = state.cells.map(cell => {
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    return { cell, proj };
  });
  
  // Painter's Algorithm: Back to Front
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // 3. Sphere Atmosphere (Glow)
  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;
  
  // Outer Glow
  const grad = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r * 1.6);
  grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  grad.addColorStop(0.6, 'rgba(20, 30, 60, 0.1)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.6, 0, Math.PI * 2);
  ctx.fill();
  
  // Subtle inner sphere wireframe/base to give volume
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();

  // 4. Draw Cells
  // 'lighter' creates the additive glow effect
  ctx.globalCompositeOperation = 'lighter';

  projectedCells.forEach(({ cell, proj }) => {
    const isBack = proj.z > 0; // Behind the sphere center relative to camera
    
    // Draw dead cells faintly? No, keep it clean. Only alive cells.
    if (!cell.alive) return;

    const size = CONFIG.cellSizeBase * proj.scale;
    
    // COLOR LOGIC: Multi-stop Gradient based on Age
    // New (Age 0-5): Hot Pink (#FF0055)
    // Mid (Age 5-20): Electric Blue (#00D2FF)
    // Old (Age 20+): Deep Violet (#7B2CBF)
    
    let hue, sat, light, alpha;
    const age = cell.age;
    
    if (age < 5) {
      // Pink to Blue transition
      const t = age / 5;
      // Interpolate HSL roughly
      hue = 340 - (t * 100); // 340 (Pink) -> 240 (Blue)
      sat = 100;
      light = 60;
    } else if (age < 25) {
      // Blue to Violet transition
      const t = (age - 5) / 20;
      hue = 240 - (t * 40); // 240 (Blue) -> 200 (Cyan/Blue mix) then shift? 
      // Actually, let's go Blue -> Violet
      hue = 240 - (t * 60); // 240 -> 180? No.
      // Let's do Pink(340) -> Blue(200) -> Violet(270)
      // Simpler:
      // 0-10: Pink/Orange
      // 10-30: Electric Blue
      // 30+: Violet
      
      hue = 200; // Electric Blue base
      sat = 100;
      light = 60;
    } else {
      // Violet
      hue = 270; 
      sat = 80;
      light = 50;
    }
    
    // Refined Color Logic for the prompt:
    // Deep Violet -> Electric Blue -> Hot Pink
    // Let's map Age to Hue directly.
    // 0 (New) = Hot Pink (330)
    // 15 (Mid) = Electric Blue (190)
    // 40 (Old) = Deep Violet (270)
    
    if (age < 15) {
      // Pink -> Blue
      const t = age / 15;
      hue = 330 - (t * 140); // 330 -> 190
      sat = 100;
      light = 60;
    } else {
      // Blue -> Violet
      const t = Math.min((age - 15) / 25, 1);
      hue = 190 + (t * 80); // 190 -> 270
      sat = 90;
      light = 50 - (t * 10); // Darken slightly as it gets very old
    }

    // Depth fog
    alpha = isBack ? 0.15 : 1.0; // Back cells very dim
    
    ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;
    
    // Glow effect (Outer ring)
    if (!isBack && size > 1.5) {
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, size * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha * 0.25})`;
      ctx.fill();
    }

    // Main cell core
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.globalCompositeOperation = 'source-over';
}

// --- Main Loop ---

function loop(timestamp) {
  // Rotation
  if (state.isRunning && !state.isDragging) {
    state.rotation.y += CONFIG.rotationSpeed;
  }
  
  // Simulation Step Throttle
  if (state.isRunning) {
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('gen-count').innerText = state.generation.toString().padStart(4, '0');
  document.getElementById('pop-count').innerText = pop.toString().padStart(4, '0');
}

document.getElementById('btn-pause').addEventListener('click', (e) => {
  state.isRunning = !state.isRunning;
  e.target.innerText = state.isRunning ? "Pause" : "Resume";
  e.target.classList.toggle('primary');
  e.target.classList.toggle('danger');
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  const btn = document.getElementById('btn-pause');
  btn.innerText = "Resume";
  btn.classList.remove('primary');
  btn.classList.add('danger');
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
  document.getElementById('speed-val').innerText = state.speed + " FPS";
});

const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(2.5, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
