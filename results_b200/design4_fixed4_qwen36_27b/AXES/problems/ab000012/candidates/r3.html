<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether - Spirit Summoning</title>
<style>
    /* 
     * DESIGN REVISION:
     * 1. Composition: Unified Vertical Axis (Center Stack).
     * 2. Hierarchy: Pyramid Menu (1 Wide Primary, 3 Small Secondary).
     * 3. Thematic: Spirit Core (Violet/Gold) replacing Planet.
     * 4. Texture: Obsidian Cards (Dark, Glassy, Gold Border).
     * 5. Typography: Cinzel/Trajan (Serif) + Modern Sans.
     */

    :root {
        --bg-deep: #05020a;
        --bg-panel: #0a0812;
        --gold-primary: #d4af37;
        --gold-highlight: #fff4cc;
        --gold-shadow: #5c4812;
        --spirit-core: #b08dff;
        --spirit-glow: #6b21a8;
        --text-main: #f0f0f0;
        --text-muted: #8b8b9e;
        
        /* System Fonts mimicking Trajan/Cinzel */
        --font-heading: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        /* Deep Void Gradient */
        background: radial-gradient(circle at 50% 40%, #180f29 0%, #090510 50%, #000000 100%);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* --- Canvas Background --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
    }

    /* --- Main Layout Container (The Center Stack) --- */
    .app-stack {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 800px; /* Constrain width for better hierarchy */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        padding: 2rem;
    }

    /* --- Header --- */
    header {
        text-align: center;
        margin-bottom: 1rem;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 4rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        line-height: 1;
        /* Metallic Gold Gradient */
        background: linear-gradient(to bottom, #fffdf5 0%, var(--gold-primary) 40%, var(--gold-shadow) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 20px rgba(180, 140, 60, 0.3));
        margin-bottom: 0.2rem;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.8rem;
        color: var(--text-muted);
        letter-spacing: 0.5em;
        text-transform: uppercase;
        opacity: 0.8;
    }

    /* --- Hero: The Spirit Core --- */
    .hero-zone {
        width: 100%;
        height: 280px; /* Fixed height for the orb area */
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .orb-container {
        width: 220px;
        height: 220px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: floatOrb 6s ease-in-out infinite;
    }

    /* The Spirit Core (Violet/Gold) */
    .spirit-core {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        /* Ethereal Gradient */
        background: radial-gradient(circle at 30% 30%, #fff 0%, var(--spirit-core) 40%, #2e0249 90%);
        box-shadow: 
            0 0 30px var(--spirit-glow),
            0 0 60px rgba(176, 141, 255, 0.3),
            inset 0 0 15px rgba(255, 255, 255, 0.5);
        position: relative;
        z-index: 2;
    }

    /* Inner pulsating energy */
    .spirit-core::after {
        content: '';
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 60%);
        opacity: 0.5;
        animation: pulseCore 3s infinite alternate;
    }

    /* Mystical Rings */
    .ritual-ring {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        box-shadow: 0 0 10px rgba(176, 141, 255, 0.1);
    }

    /* Ring 1: Thin, Gold, Dashed */
    .ring-1 {
        width: 140px; height: 140px;
        border: 1px dashed var(--gold-primary);
        opacity: 0.6;
        animation: spinSlow 15s linear infinite;
    }

    /* Ring 2: Thick, Violet, Dotted */
    .ring-2 {
        width: 200px; height: 200px;
        border: 2px dotted rgba(176, 141, 255, 0.3);
        animation: spinReverse 25s linear infinite;
    }

    /* Ring 3: Outer faint glow */
    .ring-3 {
        width: 260px; height: 260px;
        border: 1px solid rgba(212, 175, 55, 0.1);
        animation: spinSlow 40s linear infinite reverse;
    }

    /* --- Menu: Pyramid Layout --- */
    .menu-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
    }

    /* Currency Pill (Floating above menu) */
    .currency-pill {
        background: linear-gradient(90deg, rgba(0,0,0,0), rgba(212, 175, 55, 0.15), rgba(0,0,0,0));
        padding: 0.4rem 2rem;
        display: flex;
        align-items: center;
        gap: 12px;
        border-radius: 20px;
        margin-bottom: 0.5rem;
        border-top: 1px solid rgba(212, 175, 55, 0.2);
        border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    .currency-pill svg {
        fill: var(--gold-primary);
        width: 20px;
        height: 20px;
        filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.5));
    }

    .currency-text {
        font-family: var(--font-heading);
        color: var(--gold-highlight);
        font-size: 1.2rem;
        letter-spacing: 0.05em;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }

    /* Primary Card (Summon) */
    .menu-card.primary {
        width: 100%;
        padding: 1.5rem;
        background: linear-gradient(180deg, #1c1505 0%, #0d0a03 100%);
        border: 1px solid var(--gold-primary);
        border-radius: 6px;
        position: relative;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        box-shadow: 
            inset 0 0 20px rgba(0,0,0,0.8), /* Inner Shadow */
            0 0 15px rgba(212, 175, 55, 0.15); /* Outer Glow */
    }

    /* Secondary Cards Row (Roster, Battle, Grind) */
    .secondary-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 1rem;
        width: 100%;
    }

    .menu-card.secondary {
        padding: 1.2rem;
        background: linear-gradient(160deg, rgba(20, 18, 25, 0.85), rgba(10, 8, 12, 0.95));
        /* Subtle Noise Texture via CSS Pattern */
        background-image: 
            linear-gradient(160deg, rgba(20, 18, 25, 0.85), rgba(10, 8, 12, 0.95)),
            url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        position: relative;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }

    /* Hover States */
    .menu-card:hover {
        transform: translateY(-4px);
    }

    .menu-card.primary:hover {
        background: linear-gradient(180deg, #2c2008 0%, #151005 100%);
        box-shadow: 
            inset 0 0 20px rgba(0,0,0,0.8),
            0 0 25px rgba(212, 175, 55, 0.4);
        border-color: var(--gold-highlight);
    }

    .menu-card.secondary:hover {
        border-color: rgba(255, 255, 255, 0.4);
        background: linear-gradient(160deg, rgba(30, 28, 35, 0.9), rgba(15, 12, 18, 0.98));
        box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }

    /* Icons */
    .card-icon {
        width: 28px;
        height: 28px;
        fill: var(--text-muted);
        transition: fill 0.3s ease;
    }
    
    .primary .card-icon {
        width: 32px;
        height: 32px;
        fill: var(--gold-primary);
    }

    .menu-card:hover .card-icon {
        fill: var(--gold-highlight);
    }

    .card-label {
        font-family: var(--font-body);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-muted);
        font-weight: 600;
    }

    .primary .card-label {
        font-size: 1.1rem;
        font-family: var(--font-heading);
        color: var(--gold-primary);
    }

    .menu-card:hover .card-label {
        color: #fff;
    }

    /* --- Animations --- */
    @keyframes floatOrb {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
    }

    @keyframes pulseCore {
        0% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.8); }
        100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.2); }
    }

    @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
    }

    /* --- Responsive Design --- */
    @media (max-width: 700px) {
        .app-stack {
            gap: 1.5rem;
        }
        .game-title { font-size: 3rem; }
        
        /* Reduce Orb Size on Mobile */
        .hero-zone { height: 180px; }
        .orb-container { width: 160px; height: 160px; }
        .ring-1 { width: 100px; height: 100px; }
        .ring-2 { width: 140px; height: 140px; }
        .ring-3 { width: 180px; height: 180px; }
        
        /* Stack Menu on Mobile */
        .secondary-row {
            grid-template-columns: 1fr;
            gap: 0.8rem;
        }
        .menu-card.secondary {
            flex-direction: row;
            padding: 1rem;
        }
    }
</style>
</head>
<body>

    <!-- Background Canvas for Particles -->
    <canvas id="canvas-bg"></canvas>

    <div class="app-stack">
        
        <!-- Header -->
        <header>
            <h1 class="game-title">Aether</h1>
            <p class="game-subtitle">Spirit Summoning</p>
        </header>

        <!-- Hero: The Spirit Core -->
        <div class="hero-zone">
            <div class="orb-container">
                <!-- CSS Constructed Spirit Core -->
                <div class="spirit-core"></div>
                <div class="ritual-ring ring-1"></div>
                <div class="ritual-ring ring-2"></div>
                <div class="ritual-ring ring-3"></div>
            </div>
        </div>

        <!-- Menu: Pyramid Layout -->
        <div class="menu-container">
            
            <!-- Currency Indicator -->
            <div class="currency-pill">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-text">12,450</span>
            </div>

            <!-- Primary Action (Top of Pyramid) -->
            <div class="menu-card primary" onclick="interact('Summon')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                </svg>
                <span class="card-label">Summon Spirit</span>
            </div>

            <!-- Secondary Actions (Bottom of Pyramid) -->
            <div class="secondary-row">
                
                <div class="menu-card secondary" onclick="interact('Roster')">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                    </svg>
                    <span class="card-label">Roster</span>
                </div>

                <div class="menu-card secondary" onclick="interact('Battle')">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
                    </svg>
                    <span class="card-label">Battle</span>
                </div>

                <div class="menu-card secondary" onclick="interact('Grind')">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.35 0-.64.22-.7.55l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.06.33.35.55.7.55h4c.35 0 .64-.22.7-.55l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                    </svg>
                    <span class="card-label">Grind</span>
                </div>

            </div>
        </div>

    </div>

<script>
    // --- Background Particle System (Spirit Dust) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
            // Start at random Y to fill screen immediately
            this.y = Math.random() * height; 
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 20;
            this.vx = (Math.random() - 0.5) * 0.1;
            this.vy = -(Math.random() * 0.3 + 0.1); // Slow upward drift
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.4 + 0.1; 
            // Mix of Gold and Spirit Violet
            this.color = Math.random() > 0.6 ? '212, 175, 55' : '176, 141, 255'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            // Subtle horizontal drift
            this.vx += (Math.random() - 0.5) * 0.005;
            this.vx *= 0.99;

            // Fade out near top
            if (this.y < height * 0.3) {
                this.alpha -= 0.002;
            }

            // Reset if off screen or invisible
            if (this.alpha <= 0 || this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
            
            // Add glow
            if(this.size > 1) {
                ctx.shadowBlur = 4;
                ctx.shadowColor = `rgba(${this.color}, ${this.alpha})`;
            } else {
                ctx.shadowBlur = 0;
            }
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 12000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        
        // Button Press Effect
        btn.style.transform = 'scale(0.96)';
        
        // Create flash
        const flash = document.createElement('div');
        flash.style.position = 'absolute';
        flash.style.top = '0'; flash.style.left = '0';
        flash.style.width = '100%'; flash.style.height = '100%';
        flash.style.background = 'rgba(255,255,255,0.15)';
        flash.style.pointerEvents = 'none';
        flash.style.borderRadius = '6px';
        btn.appendChild(flash);
        
        setTimeout(() => {
            btn.style.transform = '';
            flash.remove();
        }, 150);
        
        console.log(`Navigating to: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
