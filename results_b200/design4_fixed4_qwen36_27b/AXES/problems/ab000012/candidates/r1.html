<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #05070A;
        --bg-panel: #0a0c10;
        --gold-primary: #d4af37;
        --gold-highlight: #fff2b2;
        --gold-shadow: #5c4008;
        --accent-teal: #88c4c4;
        --text-main: #e2e8f0;
        --text-muted: #8b9bb4;
        --font-heading: 'Times New Roman', 'Cinzel', serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 40%, #11151f 0%, var(--bg-deep) 70%);
    }

    /* --- Noise Texture Overlay --- */
    .noise-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
        opacity: 0.07;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Main Container --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 2rem;
    }

    /* --- Header & Currency (Top Left) --- */
    header {
        display: flex;
        justify-content: flex-start; /* Moved to Left */
        align-items: flex-start;
        padding-top: 1rem;
    }

    .currency-pill {
        background: linear-gradient(135deg, rgba(20,20,25,0.9), rgba(10,10,15,0.95));
        border: 1px solid var(--gold-shadow);
        border-left: 3px solid var(--gold-primary); /* Artifact edge */
        padding: 0.6rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        transform: skewX(-5deg); /* Slight angle for style */
    }

    .currency-pill span {
        transform: skewX(5deg); /* Un-skew text */
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .coin-icon {
        width: 22px;
        height: 22px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 4px var(--gold-shadow));
    }

    .currency-amount {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-highlight);
        letter-spacing: 0.05em;
    }

    /* --- Hero Section (Title) --- */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 5vh;
        z-index: 20;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 4rem;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: -0.02em; /* Tightened tracking */
        margin-bottom: 0.5rem;
        background: linear-gradient(to bottom, var(--gold-highlight) 0%, var(--gold-primary) 40%, var(--gold-shadow) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(212, 175, 55, 0.25));
        position: relative;
    }
    
    /* Metallic shine effect on text */
    .game-title::after {
        content: "AETHERBOUND";
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 20%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        opacity: 0.3;
        mix-blend-mode: overlay;
    }

    .game-subtitle {
        font-family: var(--font-heading); /* Refined Serif */
        font-size: 1rem;
        color: var(--text-muted);
        letter-spacing: 0.3em;
        text-transform: small-caps; /* Small caps */
        font-weight: 400;
        opacity: 0.9;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 5px;
    }

    /* --- The Control Panel Zone --- */
    .control-panel {
        position: relative;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-top: auto;
        margin-bottom: 2rem;
        padding-bottom: 2rem;
    }

    /* The Summoning Orb (Backdrop) */
    .orb-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -60%); /* Positioned behind cards */
        width: 300px;
        height: 300px;
        z-index: 1; /* Behind cards */
        pointer-events: none;
    }

    .orb-svg {
        width: 100%;
        height: 100%;
        animation: float 6s ease-in-out infinite;
    }

    /* --- Menu Grid --- */
    .menu-grid {
        position: relative;
        z-index: 5; /* In front of orb */
        display: grid;
        /* Columns: Standard, Primary (1.5x), Standard, Standard */
        grid-template-columns: 1fr 1.5fr 1fr 1fr; 
        gap: 1.5rem;
        width: 100%;
        max-width: 900px;
        perspective: 1000px;
    }

    /* --- Artifact Card Styling --- */
    .menu-card {
        background: linear-gradient(180deg, rgba(25, 30, 40, 0.95), rgba(10, 12, 16, 0.98));
        /* Ornate Borders */
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        border-bottom: 4px solid var(--gold-shadow);
        /* Sharp corners with slight bevel feel */
        border-radius: 2px;
        
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
        
        /* Texture overlay on card */
        background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.2));
    }

    /* Metallic corner accents */
    .menu-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border: 1px solid transparent;
        border-image: linear-gradient(to bottom, var(--gold-primary), transparent) 1;
        opacity: 0.3;
        pointer-events: none;
    }

    .menu-card:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 15px 40px rgba(0,0,0,0.7), 0 0 15px rgba(212, 175, 55, 0.1);
        border-color: var(--gold-shadow);
        background: linear-gradient(180deg, rgba(35, 40, 55, 0.95), rgba(15, 18, 24, 0.98));
    }

    .menu-card:active {
        transform: translateY(-4px);
    }

    .card-icon {
        width: 40px;
        height: 40px;
        fill: var(--accent-teal); /* Muted Teal/Silver */
        transition: all 0.3s ease;
        filter: drop-shadow(0 0 2px rgba(136, 196, 196, 0.2));
    }

    .menu-card:hover .card-icon {
        fill: var(--gold-highlight);
        filter: drop-shadow(0 0 10px var(--gold-shadow));
        transform: scale(1.1);
    }

    .card-label {
        font-family: var(--font-heading);
        font-size: 1rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
        font-weight: 600; /* Semi-bold */
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* --- Special Primary Styling (Summon) --- */
    .menu-card.summon {
        height: auto; /* Allow it to grow */
        min-height: 200px; /* Taller than others */
        border: 1px solid var(--gold-shadow);
        border-top: 2px solid var(--gold-primary);
        background: linear-gradient(180deg, rgba(40, 35, 20, 0.95), rgba(15, 12, 5, 0.98));
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.15), inset 0 0 20px rgba(0,0,0,0.6);
    }

    .menu-card.summon .card-icon {
        width: 56px;
        height: 56px;
        fill: var(--gold-primary);
    }

    .menu-card.summon .card-label {
        color: var(--gold-highlight);
        font-size: 1.3rem;
        letter-spacing: 0.1em;
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.75rem;
        opacity: 0.5;
        letter-spacing: 0.1em;
        margin-top: 1rem;
    }

    /* --- Animations --- */
    @keyframes float {
        0%, 100% { transform: translate(-50%, -60%) translateY(0); }
        50% { transform: translate(-50%, -60%) translateY(-15px); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 2.5rem; }
        .menu-grid { 
            grid-template-columns: 1fr 1fr; 
            gap: 1rem;
        }
        /* Make Summon span full width on mobile */
        .menu-card.summon {
            grid-column: span 2;
            min-height: 120px;
        }
        .orb-container {
            width: 200px;
            height: 200px;
        }
        .app-container { padding: 1rem; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <div class="noise-overlay"></div>
    <canvas id="canvas-bg"></canvas>

    <div class="app-container">
        
        <!-- Header (Currency Top Left) -->
        <header>
            <div class="currency-pill">
                <span>
                    <svg class="coin-icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/>
                        <path d="M12 6v12M9 10l3-3 3 3M9 14l3 3 3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="currency-amount">12,450</span>
                </span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>
        </section>

        <!-- The Control Panel (Orb + Menu) -->
        <div class="control-panel">
            
            <!-- The Orb (Backdrop for controls) -->
            <div class="orb-container">
                <!-- Procedural Orb SVG -->
                <svg class="orb-svg" viewBox="0 0 100 100">
                    <defs>
                        <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="0%" style="stop-color:#88c4c4;stop-opacity:0.9" />
                            <stop offset="50%" style="stop-color:#2c5261;stop-opacity:0.5" />
                            <stop offset="100%" style="stop-color:#05070A;stop-opacity:0" />
                        </radialGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <!-- Main Orb Body -->
                    <circle cx="50" cy="50" r="30" fill="url(#orbGrad)" filter="url(#glow)">
                        <animate attributeName="r" values="29;31;29" dur="4s" repeatCount="indefinite" />
                    </circle>
                    <!-- Inner Core -->
                    <circle cx="50" cy="50" r="10" fill="#fff" opacity="0.8" filter="url(#glow)">
                        <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite" />
                    </circle>
                    <!-- Rotating Rings -->
                    <g opacity="0.6">
                        <circle cx="50" cy="50" r="42" stroke="rgba(136, 196, 196, 0.4)" stroke-width="0.5" stroke-dasharray="4 4" fill="none">
                            <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="15s" repeatCount="indefinite" />
                        </circle>
                        <circle cx="50" cy="50" r="46" stroke="rgba(136, 196, 196, 0.2)" stroke-width="1" stroke-dasharray="10 20" fill="none">
                            <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="25s" repeatCount="indefinite" />
                        </circle>
                    </g>
                </svg>
            </div>

            <!-- Menu Grid (Overlapping Orb) -->
            <nav class="menu-grid">
                
                <!-- Roster -->
                <div class="menu-card" onclick="interact('Roster')">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                    </svg>
                    <span class="card-label">Roster</span>
                </div>

                <!-- Summon (Primary - Center, 1.5x size) -->
                <div class="menu-card summon" onclick="interact('Summon')">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                    </svg>
                    <span class="card-label">Summon</span>
                </div>

                <!-- Battle -->
                <div class="menu-card" onclick="interact('Battle')">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
                    </svg>
                    <span class="card-label">Battle</span>
                </div>

                <!-- Grind -->
                <div class="menu-card" onclick="interact('Grind')">
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.35 0-.64.22-.7.55l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.06.33.35.55.7.55h4c.35 0 .64-.22.7-.55l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                    </svg>
                    <span class="card-label">Grind</span>
                </div>

            </nav>
        </div>

        <footer>
            AETHERBOUND &bull; SPIRIT SUMMONING &bull; V1.0
        </footer>
    </div>

<script>
    // --- Background Particle System ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.vx = (Math.random() - 0.5) * 0.3;
            this.vy = -(Math.random() * 0.8 + 0.2); // Move upwards slowly
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.4;
            this.life = Math.random() * 0.5 + 0.5;
            // Silver/Teal mix
            this.color = Math.random() > 0.7 ? '136, 196, 196' : '200, 200, 210'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            // Fade in/out
            if (this.y < height * 0.2) {
                this.alpha -= 0.002;
            } else if (this.y > height * 0.8) {
                this.alpha += 0.002;
            }

            if (this.alpha <= 0 || this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 12000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        // Draw subtle connecting lines for "magic" feel
        ctx.lineWidth = 0.5;
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
            
            // Connect close particles (only if close to center or each other)
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 80) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(136, 196, 196, ${0.05 - dist/1600})`;
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        // Visual feedback for buttons
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.96)';
        
        // Create a small ripple effect or flash
        const flash = document.createElement('div');
        flash.style.position = 'absolute';
        flash.style.top = '0';
        flash.style.left = '0';
        flash.style.width = '100%';
        flash.style.height = '100%';
        flash.style.background = 'rgba(255,255,255,0.1)';
        flash.style.pointerEvents = 'none';
        btn.appendChild(flash);
        
        setTimeout(() => {
            btn.style.transform = '';
            flash.remove();
        }, 150);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
