<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archon's Ascension - Void Walker</title>
<style>
    :root {
        /* Palette: Deep Void & Arcane Gold */
        --bg-void: #050507;
        --bg-void-light: #101015;
        --bg-panel: rgba(15, 15, 20, 0.85);
        
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-gold: rgba(255, 215, 0, 0.3);
        
        --accent-violet: #9d4edd;
        --accent-violet-dim: #240046;
        --accent-violet-glow: rgba(157, 78, 221, 0.5);
        
        --accent-gold: #FFD700;
        --accent-gold-dim: #8a7000;
        --accent-glow: rgba(255, 215, 0, 0.4);

        --text-primary: #f0f0f0;
        --text-secondary: #a0a0a0;
        --text-muted: #505050;

        /* Typography - System Fonts */
        /* Geometric Sans for UI */
        --font-ui: 'Rajdhani', 'Montserrat', 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
        /* Strong Serif for Title (Cinzel fallback) */
        --font-display: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-void);
        /* Deep radial gradient + faint dot pattern */
        background-image: 
            radial-gradient(circle at 50% 30%, #1a1a2e 0%, #050507 100%),
            radial-gradient(circle, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 100% 100%, 40px 40px;
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
    }

    /* --- Layout: Sidebar & Main --- */
    .sidebar {
        width: 380px;
        height: 100%;
        background: linear-gradient(90deg, #0a0a10 90%, rgba(10, 10, 16, 0.6) 100%);
        border-right: 1px solid var(--border-subtle);
        position: relative;
        z-index: 20;
        display: flex;
        flex-direction: column;
        padding: 48px 40px;
        box-shadow: 20px 0 60px rgba(0,0,0,0.9);
    }

    /* 3. Deepen Background & Texture: Noise Overlay */
    .sidebar::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        opacity: 0.4;
        pointer-events: none;
        mix-blend-mode: overlay;
        z-index: 0;
    }

    /* Decorative side accent - Gold */
    .sidebar::after {
        content: '';
        position: absolute;
        top: 0; bottom: 0; left: 0;
        width: 2px;
        background: linear-gradient(to bottom, var(--accent-gold), transparent 80%);
        box-shadow: 0 0 10px var(--accent-gold);
        z-index: 1;
    }

    .main-area {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        /* Subtle dot pattern background for the world */
        background-image: radial-gradient(circle, rgba(255,255,255,0.01) 1px, transparent 1px);
        background-size: 60px 60px;
    }
    .main-area:active { cursor: grabbing; }

    /* --- Sidebar Header (Identity Block) --- */
    .sidebar-header {
        margin-bottom: 48px; /* 8pt rhythm */
        position: relative;
        z-index: 1;
        padding-bottom: 32px;
        border-bottom: 1px solid var(--border-subtle);
    }

    .title-group {
        margin-bottom: 16px;
    }

    /* 2. Refine Typography: Metallic Gold Gradient */
    h1 {
        font-family: var(--font-display);
        font-size: 2.2rem;
        line-height: 1.1;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-weight: 700;
        background: linear-gradient(to bottom, #fff 20%, var(--accent-gold) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }

    .identity-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .class-badge {
        font-family: var(--font-ui);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-secondary);
        background: rgba(255, 255, 255, 0.03);
        padding: 6px 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 2px;
    }

    /* 2. Metallic Gold Level Badge */
    .level-badge {
        font-family: var(--font-ui);
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        background: linear-gradient(to bottom, var(--accent-gold), #b8860b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
    }

    /* --- Sidebar Stats (Resources) --- */
    .resource-block {
        display: flex;
        flex-direction: column;
        gap: 32px; /* Strict 32px gap */
        margin-bottom: 48px;
        position: relative;
        z-index: 1;
    }

    /* Level Display */
    .level-row {
        display: flex;
        align-items: baseline;
        justify-content: flex-start;
        gap: 12px;
    }

    .level-val {
        font-family: var(--font-ui);
        font-size: 3.5rem;
        font-weight: 700;
        color: var(--text-primary);
        line-height: 0.8;
        letter-spacing: -1px;
        /* 2. Metallic Gold Gradient */
        background: linear-gradient(to bottom, #fff, #ccc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .level-label {
        font-size: 0.8rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 600;
    }

    /* XP Bar - Sleek */
    .xp-container {
        width: 100%;
    }

    .xp-info {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-bottom: 8px;
        font-weight: 600;
        letter-spacing: 0.05em;
    }

    .xp-track {
        width: 100%;
        height: 6px;
        background: #1a1a24;
        border-radius: 3px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
        border: 1px solid rgba(255,255,255,0.05);
    }

    .xp-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--accent-violet-dim), var(--accent-violet));
        position: relative;
        box-shadow: 0 0 10px var(--accent-violet-glow);
        border-radius: 3px;
    }
    
    /* Shine effect */
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        transform: translateX(-100%);
        animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }

    /* Skill Points */
    .points-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
    }

    .points-val {
        font-family: var(--font-ui);
        font-size: 2.5rem;
        color: var(--accent-gold);
        text-shadow: 0 0 15px var(--accent-glow);
        line-height: 1;
        font-weight: 700;
    }

    .points-label {
        font-size: 0.8rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.05em;
        line-height: 1.2;
    }

    /* --- Sidebar Stats (Character) --- */
    .divider {
        height: 1px;
        background: linear-gradient(90deg, var(--border-subtle), transparent);
        margin-bottom: 32px;
        margin-top: 10px;
        position: relative;
        z-index: 1;
    }

    .char-header {
        margin-bottom: 24px;
        position: relative;
        z-index: 1;
    }

    .char-name {
        font-family: var(--font-ui);
        font-size: 1.2rem;
        color: var(--text-primary);
        letter-spacing: 0.05em;
        font-weight: 600;
        text-transform: uppercase;
    }

    /* 5. Standardize Sidebar Spacing: 8pt scale, aligned values */
    .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px 24px; /* Increased vertical gap */
        position: relative;
        z-index: 1;
    }

    .stat-item {
        display: flex;
        justify-content: space-between;
        align-items: center; /* Vertically center */
        padding-bottom: 12px; /* 8pt scale padding */
        border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .stat-name {
        font-size: 0.75rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
    }

    .stat-val {
        font-size: 1rem;
        font-weight: 700;
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
        text-align: right; /* Align right */
    }

    /* --- Skill Tree Area --- */
    .tree-world {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
    }

    /* 1. Establish Visual Connectivity: SVG Layer */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: visible;
    }

    .connection-path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: all 0.5s ease;
    }

    /* Base dark line (Locked) */
    .path-bg {
        stroke: #1e1e2e; 
        stroke-width: 4px;
        opacity: 0.5;
    }

    /* Active glowing core line (Unlocked) */
    .path-core {
        stroke: var(--accent-violet);
        stroke-width: 2px;
        filter: drop-shadow(0 0 6px var(--accent-violet));
        opacity: 0;
        transition: opacity 0.5s ease;
    }

    .connection-group.active .path-core {
        opacity: 1;
        animation: pulse-line 4s infinite alternate;
    }
    
    .connection-group.active .path-bg {
        stroke: #2a2a3e;
        opacity: 1;
    }

    @keyframes pulse-line {
        0% { stroke-opacity: 0.6; filter: drop-shadow(0 0 4px var(--accent-violet)); }
        100% { stroke-opacity: 1; filter: drop-shadow(0 0 12px var(--accent-violet)); }
    }

    /* --- Nodes (Hexagons) --- */
    .node {
        position: absolute;
        width: 84px;
        height: 96px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .node:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }

    /* Hexagon Container */
    .hex-shape {
        width: 100%;
        height: 100%;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    /* Outer Rim */
    .hex-border {
        position: absolute;
        inset: 0;
        background: #1e1e2e;
        transition: background 0.3s ease, box-shadow 0.3s ease;
        z-index: 1;
        /* Add a subtle gradient to border */
        background: linear-gradient(135deg, #2a2a3e 0%, #151520 100%);
    }

    /* Inner Core */
    .hex-core {
        position: absolute;
        inset: 3px; 
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        background: #0b0b10;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.3s ease;
        z-index: 2;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    .node-icon {
        width: 32px;
        height: 32px;
        fill: var(--text-muted);
        opacity: 0.4;
        transition: all 0.3s ease;
        z-index: 3;
    }

    /* 4. Polish Node Design: Differentiate Active/Locked */
    
    /* Unlocked / Active */
    .node.unlocked .hex-border {
        background: var(--accent-violet);
        box-shadow: 0 0 25px var(--accent-violet-glow);
        border: none; /* Handled by clip path */
    }

    .node.unlocked .hex-core {
        background: #1a0b2e; 
        box-shadow: inset 0 0 15px rgba(138, 43, 226, 0.4); 
    }

    .node.unlocked .node-icon {
        fill: #fff;
        opacity: 1;
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
    }

    /* Available (Hoverable) */
    .node.available .hex-border {
        background: #333345;
    }
    
    .node.available:hover .hex-border {
        background: #4a4a60;
        box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
    }

    .node.available .node-icon {
        fill: #a0a0b0;
        opacity: 0.8;
    }

    /* Locked */
    .node.locked .hex-border {
        background: #151520;
        opacity: 0.7;
    }
    
    .node.locked .hex-core {
        background: #050508;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(12, 12, 18, 0.95);
        border: 1px solid var(--border-subtle);
        border-left: 3px solid var(--text-muted);
        padding: 24px;
        width: 340px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s, border-color 0.2s;
        z-index: 100;
        box-shadow: 0 10px 50px rgba(0,0,0,1);
        backdrop-filter: blur(12px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip.active {
        border-left-color: var(--accent-violet);
        box-shadow: 0 0 30px rgba(138, 43, 226, 0.2);
    }

    .tooltip h3 {
        color: var(--text-primary);
        font-family: var(--font-ui);
        margin-bottom: 6px;
        font-size: 1.4rem;
        letter-spacing: 0.02em;
        font-weight: 700;
        text-transform: uppercase;
    }

    .tooltip .type {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--accent-violet);
        margin-bottom: 14px;
        letter-spacing: 0.15em;
        font-weight: 700;
    }

    .tooltip p {
        font-size: 0.9rem;
        line-height: 1.6;
        color: #cbd5e1;
        font-weight: 400;
    }

    .tooltip .req {
        margin-top: 16px;
        font-size: 0.75rem;
        color: #fca5a5; 
        display: none;
        font-weight: 600;
        background: rgba(220, 38, 38, 0.05);
        padding: 8px 10px;
        border-radius: 2px;
        border: 1px solid rgba(220, 38, 38, 0.1);
    }

    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-secondary); }

</style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <!-- Identity Block: Title, Class, Level grouped -->
        <div class="sidebar-header">
            <div class="title-group">
                <h1>Archon's<br>Ascension</h1>
            </div>
            <div class="identity-row">
                <div class="class-badge">Void Walker</div>
                <div class="level-badge">LVL 42</div>
            </div>
        </div>

        <!-- Resources Block: Strict 32px gaps -->
        <div class="resource-block">
            <!-- Level -->
            <div class="level-row">
                <div class="level-val">42</div>
                <div class="level-label">Character<br>Level</div>
            </div>
            
            <!-- XP -->
            <div class="xp-container">
                <div class="xp-info">
                    <span>Experience</span>
                    <span>12,450 / 20,000</span>
                </div>
                <div class="xp-track">
                    <div class="xp-fill"></div>
                </div>
            </div>

            <!-- Skill Points: Deconstructed (No box) -->
            <div class="points-row">
                <span class="points-val">3</span>
                <span class="points-label">Skill Points<br>Available</span>
            </div>
        </div>

        <!-- Character Stats Block -->
        <div class="divider"></div>
        
        <div class="char-header">
            <h2 class="char-name">Kaelen Thorne</h2>
        </div>

        <div class="stat-grid">
            <div class="stat-item"><span class="stat-name">Strength</span><span class="stat-val">14</span></div>
            <div class="stat-item"><span class="stat-name">Dexterity</span><span class="stat-val">28</span></div>
            <div class="stat-item"><span class="stat-name">Intelligence</span><span class="stat-val">35</span></div>
            <div class="stat-item"><span class="stat-name">Vitality</span><span class="stat-val">12</span></div>
            <div class="stat-item"><span class="stat-name">Crit. Chance</span><span class="stat-val">18%</span></div>
            <div class="stat-item"><span class="stat-name">Resilience</span><span class="stat-val">45</span></div>
        </div>
    </aside>

    <!-- Main Skill Tree Area -->
    <div class="main-area" id="treeContainer">
        <div class="tree-world" id="treeWorld">
            <!-- SVG Connections Layer -->
            <svg class="connections" id="svgConnections"></svg>
            <!-- Nodes Layer (Generated by JS) -->
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data Configuration ---
    // Coordinate system: 1200px width, approx 900px height
    const skills = [
        // Row 1: Root
        { id: 'root', x: 600, y: 100, name: "Archon's Spark", type: "Passive", desc: "The origin of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Row 2: Branching
        { id: 'str1', x: 400, y: 280, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'dex1', x: 800, y: 280, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: true, req: 'root' },
        
        // Row 3: Mid-tier
        { id: 'int1', x: 600, y: 460, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", unlocked: false, req: 'root' },
        { id: 'str2', x: 200, y: 460, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'dex2', x: 1000, y: 460, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: true, req: 'dex1' },
        
        // Row 4: Specialization
        { id: 'str3', x: 100, y: 640, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        { id: 'dex3', x: 900, y: 640, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1100, y: 640, name: "Dual Wield", type: "Passive", desc: "Unlock ability to hold two weapons.", unlocked: false, req: 'dex2' },
        { id: 'int2', x: 450, y: 640, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 750, y: 640, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        
        // Row 5: Ultimate
        { id: 'hybrid', x: 600, y: 820, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows.", unlocked: false, req: 'int3' },
        { id: 'hybrid2', x: 300, y: 820, name: "Blood Pact", type: "Passive", desc: "Heal for 5% of damage dealt.", unlocked: false, req: 'str3' }
    ];

    // --- SVG Icons (Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z", // Star
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z", // Bolt
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z", // Eye/Circle
        dagger: "M19 3L5 17l-2-2 14-14 2 2zm-1.7 1.3L6.3 15.6l2.1 2.1L19.4 6.4 17.3 4.3z", // Dagger
        rune: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z" // Rune
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Initial Centering
        const initialPanX = (cw / 2) - 600;
        const initialPanY = (ch / 2) - 450;
        
        world.style.transform = `translate(${initialPanX}px, ${initialPanY}px) scale(1)`;
        
        // Global Pan Variables
        window.panX = initialPanX;
        window.panY = initialPanY;
        window.scale = 1;

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Determine Icon
            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;

            node.innerHTML = `
                <div class="hex-shape">
                    <div class="hex-border"></div>
                    <div class="hex-core">
                        <svg class="node-icon" viewBox="0 0 24 24">
                            <path d="${iconPath}" />
                        </svg>
                    </div>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('mousemove', moveTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        // Draw Connections
        drawConnections();
    }

    function drawConnections() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    g.classList.add('connection-group');
                    if (skill.unlocked) g.classList.add('active');

                    // Create a slightly curved path
                    const dx = skill.x - parent.x;
                    const dy = skill.y - parent.y;
                    const cx = (parent.x + skill.x) / 2;
                    const cy = (parent.y + skill.y) / 2 + (Math.abs(dx) * 0.1);

                    const pathD = `M ${parent.x} ${parent.y} Q ${cx} ${cy} ${skill.x} ${skill.y}`;

                    // Background Track
                    const bgPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    bgPath.setAttribute('d', pathD);
                    bgPath.classList.add('connection-path', 'path-bg');
                    
                    // Active Core
                    const corePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    corePath.setAttribute('d', pathD);
                    corePath.classList.add('connection-path', 'path-core');

                    g.appendChild(bgPath);
                    g.appendChild(corePath);
                    svg.appendChild(g);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            tooltip.classList.add('active');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            tooltip.classList.remove('active');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        moveTooltip(e);
    }

    function moveTooltip(e) {
        const x = e.clientX;
        const y = e.clientY;
        
        const ttWidth = 340;
        const ttHeight = 180;
        
        let left = x + 20;
        let top = y - 20;
        
        // Boundary checks
        if (left + ttWidth > window.innerWidth) left = x - ttWidth - 20;
        if (top + ttHeight > window.innerHeight) top = y - ttHeight;

        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        // Unlock Logic
        if (!skill.unlocked) {
            // Check if parent is unlocked
            if (!skill.req || skills.find(s => s.id === skill.req).unlocked) {
                skill.unlocked = true;
                updateVisuals();
            }
        }
    }

    function updateVisuals() {
        // Update Nodes
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            
            // Reset classes
            el.classList.remove('unlocked', 'available', 'locked');
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) {
                    el.classList.add('available');
                } else {
                    el.classList.add('locked');
                }
            }
        });

        // Update Lines
        drawConnections();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - window.panX;
        startY = e.clientY - window.panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        window.panX = e.clientX - startX;
        window.panY = e.clientY - startY;
        world.style.transform = `translate(${window.panX}px, ${window.panY}px) scale(${window.scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, window.scale + delta), 2);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - window.scale;
        window.panX -= mouseX * scaleChange;
        window.panY -= mouseY * scaleChange;
        
        window.scale = newScale;
        world.style.transform = `translate(${window.panX}px, ${window.panY}px) scale(${window.scale})`;
    });

    // Start
    init();

</script>
</body>
</html>
