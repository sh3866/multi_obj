<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette */
        --bg-deep: #050510;
        --bg-center: #121225;
        
        /* Metallic Gold */
        --gold-primary: #e6c27a;
        --gold-light: #fff2cd;
        --gold-dark: #9e7c38;
        
        /* Deep Violet (Orb Match) */
        --violet-primary: #8a2be2;
        --violet-deep: #240046;
        --violet-glow: rgba(138, 43, 226, 0.6);
        --violet-light: #d8b4fe;
        
        /* Stone/Parchment Tones for Sigils */
        --stone-dark: #1a1a24;
        --stone-mid: #2d2d40;
        --stone-light: #4a4a60;
        --stone-border: #6b6b85;

        /* Typography */
        --font-body: 'Rajdhani', 'Segoe UI', sans-serif;
        --font-display: 'Cinzel', 'Times New Roman', serif;
        --text-main: #e2e8f0;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
    }

    /* --- 1. Atmosphere & Background --- */
    .bg-gradient {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(ellipse at 50% 40%, var(--bg-center) 0%, var(--bg-deep) 85%);
        z-index: 0;
    }

    .noise-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.04;
        pointer-events: none;
        z-index: 1;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
    }

    /* --- Layout Structure --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1200px;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* 1. Layout Fix: Ground the screen. Push content down slightly, but keep title top 15% */
        padding-top: 6vh; 
    }

    /* --- Currency UI --- */
    .currency-anchor {
        position: absolute;
        top: 32px;
        right: 32px;
        z-index: 20;
    }

    .currency-pill {
        background: linear-gradient(135deg, rgba(10,10,15,0.8), rgba(20,20,30,0.9));
        border: 1px solid rgba(230, 194, 122, 0.3);
        border-radius: 4px; /* Sharper corners */
        padding: 0.6rem 1.4rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        /* Stone texture overlay on currency */
        background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.1'/%3E%3C/svg%3E");
    }

    .coin-icon {
        width: 22px;
        height: 22px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 3px var(--gold-dark));
    }

    .currency-amount {
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-light);
        letter-spacing: 0.05em;
    }

    /* --- Typography & Hero --- */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        z-index: 5;
        /* 1. Layout: Title in top 15% */
        margin-bottom: 0; 
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 0.1rem;
        /* 4. Color: Luminous Gold Gradient with White Highlight */
        background: linear-gradient(180deg, #ffffff 0%, #fff2cd 30%, #e6c27a 60%, #9e7c38 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 15px rgba(0,0,0,0.8));
        position: relative;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--violet-light);
        letter-spacing: 0.4em; 
        text-transform: uppercase;
        margin-bottom: 1rem;
        text-shadow: 0 0 20px rgba(138, 43, 226, 0.8), 0 2px 4px rgba(0,0,0,1);
    }

    /* --- 2. Hero Element (The Orb) --- */
    .orb-container {
        position: relative;
        width: 320px;
        height: 320px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1; /* Behind text, behind cards */
        /* 1. Layout: Move Orb down to visual center */
        margin-top: -20px; 
        margin-bottom: -80px; /* Negative margin to pull menu up into it */
    }

    .orb-aura {
        position: absolute;
        width: 160%;
        height: 160%;
        border-radius: 50%;
        background: radial-gradient(circle, var(--violet-glow) 0%, transparent 60%);
        animation: pulse-aura 6s ease-in-out infinite;
        z-index: -1;
        filter: blur(30px);
        pointer-events: none;
    }

    .orb-svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 25px rgba(138, 43, 226, 0.5));
        animation: float 8s ease-in-out infinite;
    }

    /* --- 2. Menu Structure (The 'Altar' Layout) --- */
    .altar-container {
        position: relative;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        /* 1. Layout: Bottom 25% */
        margin-top: auto; 
        padding-bottom: 5vh;
        z-index: 20; /* Above Orb */
    }

    .altar-grid {
        display: grid;
        /* 2. Menu Structure: Summon is wider (1.5x) */
        grid-template-columns: 0.9fr 1.35fr 0.9fr; 
        grid-template-rows: 1fr 1fr;
        gap: 1.5rem;
        width: 100%;
        max-width: 750px;
        /* This layout places:
           Roster (Left), Battle (Right)
           Grind (Left), Summon (Center - Spans 2 rows), Empty (Right)
        */
    }

    /* --- 3. Visual Style (Diegetic UI / Sigils) --- */
    .sigil {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        background: linear-gradient(160deg, var(--stone-mid), var(--stone-dark));
        /* 3. Visual Style: Stone Texture Overlay */
        background-image: 
            linear-gradient(160deg, var(--stone-mid), var(--stone-dark)),
            url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
        border: 1px solid var(--stone-border);
        box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
        padding: 1.5rem;
        /* 3. Visual Style: Hexagonal Clip Path */
        clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0% 50%);
    }

    /* Inner bevel effect for Sigils */
    .sigil::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 50%, rgba(0,0,0,0.2) 100%);
        pointer-events: none;
        z-index: 1;
    }

    .sigil:hover {
        transform: translateY(-5px) scale(1.02);
        box-shadow: 0 15px 30px rgba(0,0,0,0.6), inset 0 0 15px rgba(138, 43, 226, 0.1);
        border-color: #8a2be2;
    }

    /* 2. Menu Structure: Summon Focal Point */
    .sigil.summon {
        grid-column: 2;
        grid-row: 1 / span 2; /* Spans both rows */
        background: linear-gradient(160deg, #3d1e5e, #1a0b2e);
        border: 1px solid var(--violet-primary);
        box-shadow: 0 0 30px rgba(138, 43, 226, 0.2), inset 0 0 20px rgba(138, 43, 226, 0.1);
        z-index: 2; /* Sits on top */
        padding: 2rem;
    }

    .sigil.summon:hover {
        background: linear-gradient(160deg, #4d2b75, #2a1040);
        box-shadow: 0 0 50px rgba(138, 43, 226, 0.4), inset 0 0 30px rgba(138, 43, 226, 0.2);
    }

    /* Positioning Secondary Buttons */
    .sigil.roster { grid-column: 1; grid-row: 1; }
    .sigil.battle { grid-column: 3; grid-row: 1; }
    .sigil.grind  { grid-column: 1; grid-row: 2; }
    /* Right bottom is empty to balance the layout */

    /* 4. Typography & Color: Icons */
    .sigil-icon {
        width: 32px;
        height: 32px;
        fill: var(--violet-light); /* 4. Color: Match orb energy */
        stroke: var(--violet-light);
        stroke-width: 0.5;
        filter: drop-shadow(0 0 5px rgba(138, 43, 226, 0.4));
        margin-bottom: 0.8rem;
        z-index: 2;
        transition: all 0.3s ease;
    }

    .sigil:hover .sigil-icon {
        fill: #fff;
        stroke: #fff;
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.6));
        transform: scale(1.1);
    }

    .sigil.summon .sigil-icon {
        width: 48px;
        height: 48px;
    }

    /* 4. Typography: Labels */
    .sigil-label {
        font-family: var(--font-body);
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.15em; /* 4. Typography: Increased tracking */
        text-transform: uppercase;
        color: var(--text-main);
        z-index: 2;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .sigil.summon .sigil-label {
        font-size: 1.2rem;
        color: #fff;
        letter-spacing: 0.2em;
    }

    /* --- Animations --- */
    @keyframes float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-12px) scale(1.02); }
    }

    @keyframes pulse-aura {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.15); }
    }

    /* --- Responsive --- */
    @media (max-width: 800px) {
        .game-title { font-size: 3.5rem; }
        .orb-container { width: 250px; height: 250px; margin-bottom: -50px; }
        
        /* Stack layout for mobile */
        .altar-grid {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto;
            gap: 1rem;
        }
        .sigil.summon {
            grid-column: 1 / span 2;
            grid-row: auto;
            width: 100%;
        }
        .sigil {
            aspect-ratio: 1.5 / 1; /* Keep shape consistent */
        }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <div class="bg-gradient"></div>
    <div class="noise-overlay"></div>
    <canvas id="canvas-bg"></canvas>

    <div class="app-container">
        
        <!-- Currency UI -->
        <div class="currency-anchor">
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.86 0 .53-.43 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.09 1.73 1.27 2.72 2.85 3.05V19h2.15v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.46-3.42z"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </div>

        <!-- Hero Section -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <!-- The Orb (Anchored visually) -->
            <div class="orb-container">
                <div class="orb-aura"></div>
                <!-- Procedural Orb SVG -->
                <svg class="orb-svg" viewBox="0 0 200 200">
                    <defs>
                        <radialGradient id="orbGrad" cx="35%" cy="35%" r="65%" fx="30%" fy="30%">
                            <stop offset="0%" style="stop-color:#d8b4fe;stop-opacity:1" />
                            <stop offset="40%" style="stop-color:#8a2be2;stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:#240046;stop-opacity:0.95" />
                        </radialGradient>
                        <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:#fff;stop-opacity:0.9" />
                            <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
                        </radialGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <!-- Outer Ring -->
                    <circle cx="100" cy="100" r="90" stroke="rgba(138, 43, 226, 0.2)" stroke-width="1" fill="none">
                        <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="40s" repeatCount="indefinite" />
                    </circle>
                    <!-- Main Orb -->
                    <circle cx="100" cy="100" r="70" fill="url(#orbGrad)" filter="url(#glow)">
                        <animate attributeName="r" values="68;73;68" dur="6s" repeatCount="indefinite" />
                    </circle>
                    <!-- Inner Core -->
                    <circle cx="100" cy="100" r="18" fill="url(#innerGlow)" opacity="0.7">
                        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite" />
                    </circle>
                    <!-- Magic Rings -->
                    <ellipse cx="100" cy="100" rx="95" ry="28" stroke="rgba(200, 180, 255, 0.3)" stroke-width="1.5" fill="none" transform="rotate(45 100 100)">
                        <animateTransform attributeName="transform" type="rotate" from="45 100 100" to="405 100 100" dur="20s" repeatCount="indefinite" />
                    </ellipse>
                    <ellipse cx="100" cy="100" rx="95" ry="28" stroke="rgba(200, 180, 255, 0.3)" stroke-width="1.5" fill="none" transform="rotate(-45 100 100)">
                        <animateTransform attributeName="transform" type="rotate" from="-45 100 100" to="-405 100 100" dur="20s" repeatCount="indefinite" />
                    </ellipse>
                </svg>
            </div>
        </section>

        <!-- 2. Menu Structure (The Altar Layout) -->
        <div class="altar-container">
            <div class="altar-grid">
                
                <!-- Secondary: Roster -->
                <div class="sigil roster" onclick="interact('Roster')">
                    <svg class="sigil-icon" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <span class="sigil-label">Roster</span>
                </div>

                <!-- Primary: Summon (Dominant Focal Point) -->
                <div class="sigil summon" onclick="interact('Summon')">
                    <svg class="sigil-icon" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                    </svg>
                    <span class="sigil-label">Summon</span>
                </div>

                <!-- Secondary: Battle -->
                <div class="sigil battle" onclick="interact('Battle')">
                    <svg class="sigil-icon" viewBox="0 0 24 24">
                        <path d="M19.5 9.5L12 2l-7.5 7.5L4 11l8 8 8-8-1.5-1.5zm-9.4 2.9l-2.3-2.3L12 6.5l4.2 4.2-2.3 2.3-2.3-2.3z"/>
                    </svg>
                    <span class="sigil-label">Battle</span>
                </div>

                <!-- Secondary: Grind -->
                <div class="sigil grind" onclick="interact('Grind')">
                    <svg class="sigil-icon" viewBox="0 0 24 24">
                        <path d="M12 2l-5.5 9h11L12 2zm0 3.84L13.93 9h-3.87L12 5.84zM17.5 13c-2.49 0-4.5 2.01-4.5 4.5s2.01 4.5 4.5 4.5 4.5-2.01 4.5-4.5-2.01-4.5-4.5-4.5zm0 7c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5zM3 13c-2.49 0-4.5 2.01-4.5 4.5S.51 22 3 22s4.5-2.01 4.5-4.5S5.49 13 3 13zm0 7c-1.38 0-2.5-1.12-2.5-2.5S1.62 15 3 15s2.5 1.12 2.5 2.5S4.38 20 3 20z"/>
                    </svg>
                    <span class="sigil-label">Grind</span>
                </div>

            </div>
        </div>

    </div>

<script>
    // --- Background Particle System (Mystical Dust) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.15;
            this.vy = (Math.random() - 0.5) * 0.15;
            this.size = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.5;
            this.fadeSpeed = Math.random() * 0.003 + 0.001;
            this.growing = Math.random() > 0.5;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;

            // Twinkle effect
            if (this.growing) {
                this.alpha += this.fadeSpeed;
                if (this.alpha >= 0.6) this.growing = false;
            } else {
                this.alpha -= this.fadeSpeed;
                if (this.alpha <= 0.1) this.growing = true;
            }

            // Wrap around screen
            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            // Violet/White mix for dust
            ctx.fillStyle = `rgba(200, 200, 255, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // High density for "atmosphere"
        const count = Math.floor((width * height) / 12000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        // Visual feedback handled by CSS :active, but we can add a slight scale via JS if needed
        // The CSS hover/active states handle the bulk of the "feel"
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
