<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    /* 
       DESIGN REVIEW IMPLEMENTATION 
       1. Symmetrical Grid Layout
       2. Tight Vertical Rhythm (No voids)
       3. Glassmorphism UI Finish
       4. Typography: Cinzel (Title) / Orbitron (UI)
       5. Atmospheric Depth: Deep Indigo + Noise
    */

    :root {
        /* Palette: Deep Indigo / Midnight Blue */
        --bg-deep: #05050a;
        --bg-indigo: #0a0a1a;
        --bg-radial: radial-gradient(circle at 50% 40%, #1a1a3a 0%, #05050a 70%);
        
        /* Metallic Gold */
        --gold-primary: #e6c27a;
        --gold-light: #fffdf0;
        --gold-dark: #b88a44;
        --gold-gradient: linear-gradient(180deg, #fffdf0 0%, #e6c27a 50%, #b88a44 100%);
        
        /* Mystical Violet */
        --violet-primary: #9d4edd;
        --violet-glow: rgba(157, 78, 221, 0.6);
        --violet-tint: rgba(157, 78, 221, 0.15);
        
        /* Typography Fallbacks */
        /* Requested: Cinzel, Trajan -> System: Georgia/Serif */
        --font-display: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
        /* Requested: Orbitron, Rajdhani -> System: Segoe UI, Helvetica Neue (Geometric) */
        --font-body: 'Orbitron', 'Rajdhani', 'Segoe UI', 'Helvetica Neue', sans-serif;
        
        --text-main: #e2e8f0;
        --glass-border: rgba(255, 255, 255, 0.15);
        --glass-bg: rgba(10, 10, 20, 0.4);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        background-image: var(--bg-radial);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
    }

    /* --- 5. Atmospheric Depth: Noise Overlay --- */
    .noise-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.07;
        pointer-events: none;
        z-index: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    #canvas-bg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
        pointer-events: none;
    }

    /* --- Layout Structure --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 3vh; /* Tighter top padding */
    }

    /* --- Currency UI (Glassmorphism) --- */
    .currency-anchor {
        position: absolute;
        top: 24px;
        right: 24px;
        z-index: 20;
    }

    .currency-pill {
        /* 3. Glassmorphism Finish */
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-radius: 4px;
        padding: 0.5rem 1.2rem;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .coin-icon {
        width: 20px;
        height: 20px;
        fill: url(#goldGradient);
        filter: drop-shadow(0 0 2px var(--gold-dark));
    }

    .currency-amount {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 1rem;
        color: var(--gold-light);
        letter-spacing: 0.05em;
    }

    /* --- 4. Typography: Hero & Title --- */
    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        z-index: 5;
        /* 2. Tighten Rhythm: Reduced margins */
        margin-bottom: 0; 
        flex-shrink: 0;
    }

    .game-title {
        font-family: var(--font-display);
        font-size: 4.5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em; /* Increased tracking */
        margin-bottom: 0.2rem;
        line-height: 1;
        /* Gold Gradient Text */
        background: var(--gold-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 10px rgba(0,0,0,0.8));
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.9rem;
        font-weight: 600;
        color: rgba(255,255,255,0.7);
        letter-spacing: 0.5em; 
        text-transform: uppercase;
        margin-bottom: 1.5rem;
        text-shadow: 0 0 15px rgba(157, 78, 221, 0.5);
    }

    /* --- Hero Element (The Orb) --- */
    .orb-container {
        position: relative;
        width: 240px; /* Slightly smaller to fit tight rhythm */
        height: 240px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1; 
        /* 2. Tighten Rhythm: Minimal spacing */
        margin-bottom: 2rem; 
    }

    .orb-aura {
        position: absolute;
        width: 150%;
        height: 150%;
        border-radius: 50%;
        background: radial-gradient(circle, var(--violet-glow) 0%, transparent 65%);
        animation: pulse-aura 5s ease-in-out infinite;
        z-index: -1;
        filter: blur(20px);
        pointer-events: none;
    }

    .orb-svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 20px rgba(157, 78, 221, 0.4));
        animation: float 6s ease-in-out infinite;
    }

    /* --- 1. Restructure Layout: Symmetrical Grid --- */
    .altar-container {
        position: relative;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 20;
        flex-grow: 1; /* Fills remaining space */
        padding-bottom: 3vh;
    }

    .altar-grid {
        display: grid;
        /* Symmetrical 3-column layout */
        grid-template-columns: 1fr 1.4fr 1fr; 
        grid-template-rows: 1fr 1fr;
        gap: 1rem;
        width: 100%;
        max-width: 700px;
        aspect-ratio: 1.5 / 1; /* Maintain square-ish proportions */
    }

    /* --- 3. Refine UI Finish: Glassmorphism Cards --- */
    .sigil {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        
        /* Glass Base */
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        
        /* Gradient Border */
        border: 1px solid var(--glass-border);
        border-image: linear-gradient(to bottom, rgba(255,255,255,0.4), rgba(157, 78, 221, 0.1)) 1;
        /* Note: border-image doesn't work with border-radius, using pseudo-element for complex shapes if needed, 
           but here we use simple rounded corners for 'Artifact' feel */
        border-radius: 8px;
        
        box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
        padding: 1rem;
    }

    /* Inner Glow / Artifact Detail */
    .sigil::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border-radius: 8px;
        background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 40%);
        pointer-events: none;
        z-index: 1;
    }

    .sigil:hover {
        transform: translateY(-4px);
        background: rgba(20, 20, 40, 0.6);
        border-color: rgba(157, 78, 221, 0.6);
        box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 15px rgba(157, 78, 221, 0.2);
    }

    /* --- 1. Layout: Primary Focus on Summon --- */
    .sigil.summon {
        grid-column: 2;
        grid-row: 1 / span 2; /* Spans full height in center */
        background: rgba(30, 20, 50, 0.5);
        border: 1px solid rgba(230, 194, 122, 0.3); /* Gold tint border */
        box-shadow: 0 0 30px rgba(157, 78, 221, 0.15), inset 0 0 20px rgba(157, 78, 221, 0.1);
        z-index: 2;
    }

    .sigil.summon:hover {
        background: rgba(40, 25, 70, 0.6);
        border-color: var(--gold-primary);
        box-shadow: 0 0 50px rgba(157, 78, 221, 0.3), inset 0 0 20px rgba(230, 194, 122, 0.2);
    }

    /* Positioning Secondary Buttons (Symmetrical) */
    .sigil.roster { grid-column: 1; grid-row: 1; }
    .sigil.battle { grid-column: 3; grid-row: 1; }
    .sigil.grind  { grid-column: 1 / span 3; grid-row: 2; } /* Full width bottom anchor */

    /* --- 4. Typography & Hierarchy: Icons & Text --- */
    .sigil-icon {
        width: 28px;
        height: 28px;
        fill: rgba(255,255,255,0.8);
        stroke: rgba(255,255,255,0.8);
        stroke-width: 0.5;
        filter: drop-shadow(0 0 4px rgba(157, 78, 221, 0.4));
        margin-bottom: 0.6rem;
        z-index: 2;
        transition: all 0.3s ease;
    }

    .sigil:hover .sigil-icon {
        fill: #fff;
        stroke: #fff;
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
        transform: scale(1.1);
    }

    /* Summon Icon is larger */
    .sigil.summon .sigil-icon {
        width: 42px;
        height: 42px;
        margin-bottom: 1rem;
    }

    .sigil-label {
        font-family: var(--font-body);
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.9);
        z-index: 2;
    }

    /* Summon Label is larger and gold */
    .sigil.summon .sigil-label {
        font-size: 1.1rem;
        color: var(--gold-light);
        letter-spacing: 0.25em;
        text-shadow: 0 0 10px rgba(230, 194, 122, 0.5);
    }

    /* --- Animations --- */
    @keyframes float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-8px) scale(1.02); }
    }

    @keyframes pulse-aura {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.1); }
    }

    /* --- Responsive --- */
    @media (max-width: 600px) {
        .game-title { font-size: 3rem; }
        .orb-container { width: 180px; height: 180px; margin-bottom: 1.5rem; }
        
        /* Stack layout for mobile but keep symmetry */
        .altar-grid {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto;
            max-width: 400px;
        }
        .sigil.summon {
            grid-column: 1 / span 2;
            grid-row: auto;
            height: 80px;
        }
        .sigil { height: 80px; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <div class="noise-overlay"></div>
    <canvas id="canvas-bg"></canvas>

    <div class="app-container">
        
        <!-- Currency UI -->
        <div class="currency-anchor">
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <defs>
                        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#fffdf0;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#e6c27a;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#b88a44;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.86 0 .53-.43 1.37-2.08 1.37-1.6 0-2.23-.72-2.32-1.64H8.04c.09 1.73 1.27 2.72 2.85 3.05V19h2.15v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.46-3.42z"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </div>

        <!-- Hero Section -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <!-- The Orb (Anchored visually) -->
            <div class="orb-container">
                <div class="orb-aura"></div>
                <!-- Procedural Orb SVG -->
                <svg class="orb-svg" viewBox="0 0 200 200">
                    <defs>
                        <radialGradient id="orbGrad" cx="35%" cy="35%" r="65%" fx="30%" fy="30%">
                            <stop offset="0%" style="stop-color:#e0c3fc;stop-opacity:1" />
                            <stop offset="40%" style="stop-color:#8a2be2;stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:#240046;stop-opacity:0.95" />
                        </radialGradient>
                        <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:#fff;stop-opacity:0.9" />
                            <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
                        </radialGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <!-- Outer Ring -->
                    <circle cx="100" cy="100" r="90" stroke="rgba(157, 78, 221, 0.2)" stroke-width="1" fill="none">
                        <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="40s" repeatCount="indefinite" />
                    </circle>
                    <!-- Main Orb -->
                    <circle cx="100" cy="100" r="70" fill="url(#orbGrad)" filter="url(#glow)">
                        <animate attributeName="r" values="68;73;68" dur="6s" repeatCount="indefinite" />
                    </circle>
                    <!-- Inner Core -->
                    <circle cx="100" cy="100" r="18" fill="url(#innerGlow)" opacity="0.7">
                        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite" />
                    </circle>
                    <!-- Magic Rings -->
                    <ellipse cx="100" cy="100" rx="95" ry="28" stroke="rgba(224, 195, 252, 0.3)" stroke-width="1.5" fill="none" transform="rotate(45 100 100)">
                        <animateTransform attributeName="transform" type="rotate" from="45 100 100" to="405 100 100" dur="20s" repeatCount="indefinite" />
                    </ellipse>
                    <ellipse cx="100" cy="100" rx="95" ry="28" stroke="rgba(224, 195, 252, 0.3)" stroke-width="1.5" fill="none" transform="rotate(-45 100 100)">
                        <animateTransform attributeName="transform" type="rotate" from="-45 100 100" to="-405 100 100" dur="20s" repeatCount="indefinite" />
                    </ellipse>
                </svg>
            </div>
        </section>

        <!-- 1. Symmetrical Grid Layout -->
        <div class="altar-container">
            <div class="altar-grid">
                
                <!-- Secondary: Roster -->
                <div class="sigil roster" onclick="interact('Roster')">
                    <svg class="sigil-icon" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <span class="sigil-label">Roster</span>
                </div>

                <!-- Primary: Summon (Dominant Focal Point) -->
                <div class="sigil summon" onclick="interact('Summon')">
                    <svg class="sigil-icon" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                    </svg>
                    <span class="sigil-label">Summon</span>
                </div>

                <!-- Secondary: Battle -->
                <div class="sigil battle" onclick="interact('Battle')">
                    <svg class="sigil-icon" viewBox="0 0 24 24">
                        <path d="M19.5 9.5L12 2l-7.5 7.5L4 11l8 8 8-8-1.5-1.5zm-9.4 2.9l-2.3-2.3L12 6.5l4.2 4.2-2.3 2.3-2.3-2.3z"/>
                    </svg>
                    <span class="sigil-label">Battle</span>
                </div>

                <!-- Secondary: Grind (Bottom Anchor) -->
                <div class="sigil grind" onclick="interact('Grind')">
                    <svg class="sigil-icon" viewBox="0 0 24 24">
                        <path d="M12 2l-5.5 9h11L12 2zm0 3.84L13.93 9h-3.87L12 5.84zM17.5 13c-2.49 0-4.5 2.01-4.5 4.5s2.01 4.5 4.5 4.5 4.5-2.01 4.5-4.5-2.01-4.5-4.5-4.5zm0 7c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5zM3 13c-2.49 0-4.5 2.01-4.5 4.5S.51 22 3 22s4.5-2.01 4.5-4.5S5.49 13 3 13zm0 7c-1.38 0-2.5-1.12-2.5-2.5S1.62 15 3 15s2.5 1.12 2.5 2.5S4.38 20 3 20z"/>
                    </svg>
                    <span class="sigil-label">Grind</span>
                </div>

            </div>
        </div>

    </div>

<script>
    // --- Background Particle System (Mystical Dust) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.2;
            this.vy = (Math.random() - 0.5) * 0.2;
            this.size = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.5;
            this.fadeSpeed = Math.random() * 0.003 + 0.001;
            this.growing = Math.random() > 0.5;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;

            // Twinkle effect
            if (this.growing) {
                this.alpha += this.fadeSpeed;
                if (this.alpha >= 0.6) this.growing = false;
            } else {
                this.alpha -= this.fadeSpeed;
                if (this.alpha <= 0.1) this.growing = true;
            }

            // Wrap around screen
            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            // Violet/White mix for dust
            ctx.fillStyle = `rgba(200, 200, 255, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // High density for "atmosphere"
        const count = Math.floor((width * height) / 15000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
