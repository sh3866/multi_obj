<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway Sphere | Geometric Evolution</title>
<style>
  :root {
    /* Typography */
    --font-heading: 'Montserrat', system-ui, -apple-system, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'JetBrains Mono', 'Roboto Mono', 'Consolas', monospace;

    /* Spacing */
    --g-1: 8px;
    --g-2: 16px;
    --g-3: 24px;

    /* Colors */
    --bg-deep: #050508;
    --bg-slate: #0f172a;
    --accent: #d946ef; /* Magenta/Pink */
    --accent-glow: rgba(217, 70, 239, 0.5);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;

    /* Glassmorphism */
    --glass-bg: rgba(15, 23, 42, 0.6);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-blur: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }

  /* --- Background Grain --- */
  body::before {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  /* --- Canvas Layer --- */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* --- UI Layer --- */
  #ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: var(--g-3);
  }

  /* --- Typography: Top Center Header --- */
  .header {
    margin-top: var(--g-2);
    text-align: center;
    pointer-events: auto;
    mix-blend-mode: exclusion;
  }

  h1 {
    font-family: var(--font-heading);
    font-size: 2rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 4px;
    text-shadow: 0 0 20px rgba(255,255,255,0.1);
  }

  .subtitle {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.9;
  }

  /* --- Control Panel (Bottom Center) --- */
  .controls-wrapper {
    margin-bottom: var(--g-2);
    pointer-events: auto;
    width: 100%;
    max-width: 480px;
  }

  .control-panel {
    /* Glassmorphism */
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: var(--g-3); /* 24px padding */
    
    display: flex;
    flex-direction: column;
    gap: var(--g-3); /* 24px vertical gap */
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  /* --- Panel Layout --- */
  .panel-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .panel-bottom {
    display: flex;
    align-items: center;
    gap: var(--g-2);
  }

  /* --- Stats --- */
  .stat-group {
    display: flex;
    gap: var(--g-3);
  }

  .stat-item {
    display: flex;
    flex-direction: column;
  }

  .data-label {
    font-family: var(--font-ui);
    font-size: 0.65rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }

  .data-value {
    font-family: var(--font-mono);
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    line-height: 1;
  }

  /* --- Buttons --- */
  .btn-group {
    display: flex;
    gap: var(--g-1);
  }

  .hud-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    width: 40px;
    height: 40px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .hud-btn:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.3);
  }

  .hud-btn:active {
    transform: scale(0.95);
  }

  .hud-btn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .hud-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 15px var(--accent-glow);
  }

  /* --- Slider --- */
  .slider-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    margin-top: -5px;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
    transition: transform 0.1s;
  }
  
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
    background: var(--accent);
  }

  /* --- Footer Hint --- */
  .footer-hint {
    position: absolute;
    bottom: 12px;
    width: 100%;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.6rem;
    color: var(--text-muted);
    opacity: 0.4;
    letter-spacing: 0.1em;
    pointer-events: none;
  }

</style>
</head>
<body>

  <!-- Canvas Layer -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Header (Top Center) -->
    <div class="header">
      <h1>Conway Sphere</h1>
      <div class="subtitle">Algorithmic Evolution</div>
    </div>

    <!-- Control Panel (Bottom Center) -->
    <div class="controls-wrapper">
      <div class="control-panel">
        
        <!-- Top Row: Stats & Main Controls -->
        <div class="panel-top">
          <div class="stat-group">
            <div class="stat-item">
              <div class="data-label">Generation</div>
              <div class="data-value" id="gen-count">0000</div>
            </div>
            <div class="stat-item">
              <div class="data-label">Population</div>
              <div class="data-value" id="pop-count">0000</div>
            </div>
          </div>

          <div class="btn-group">
            <button id="btn-pause" class="hud-btn active" title="Play/Pause">
              <svg id="icon-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
              <svg id="icon-play" viewBox="0 0 24 24" style="display:none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </button>
            <button id="btn-reset" class="hud-btn" title="Randomize">
              <svg viewBox="0 0 24 24"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
            </button>
          </div>
        </div>

        <!-- Bottom Row: Speed & Step -->
        <div class="panel-bottom">
          <div class="slider-wrapper">
            <div class="slider-header">
              <span class="data-label">Speed</span>
              <span class="data-label" style="color: #fff; font-family: var(--font-mono);" id="speed-val">15</span>
            </div>
            <input type="range" id="speed-slider" min="1" max="60" value="15">
          </div>
          <button id="btn-step" class="hud-btn" style="width: auto; padding: 0 16px; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.05em;" title="Step Once">
            STEP
          </button>
        </div>

      </div>
    </div>

    <!-- Footer Hint -->
    <div class="footer-hint">DRAG TO ROTATE &bull; SCROLL TO ZOOM</div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life - Design Revision
 * 
 * Visual Changes:
 * - Deep Navy/Slate Dead Color (#0f172a)
 * - Magenta/Teal Accent Palette
 * - Glassmorphism UI
 * - Bloom effects
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 4000, 
  sphereRadius: 280,
  cellSize: 2.2,   // Base size
  rotationSpeed: 0.0005,
  bloomStrength: 12,
  colorPalette: {
    // Palette: Magenta -> Teal -> Deep Blue
    newborn: { h: 320, s: 100, l: 70 }, // Magenta
    young:   { h: 180, s: 100, l: 60 }, // Teal/Cyan
    mature:  { h: 240, s: 80, l: 50 },  // Blue
    old:     { h: 260, s: 60, l: 40 }   // Indigo
  },
  deadColor: 'rgba(15, 23, 42, 0.4)' // Deep Slate/Navy
};

// --- State ---
let state = {
  cells: [], 
  generation: 0,
  isRunning: true,
  speed: 15, 
  lastFrameTime: 0,
  rotation: { x: 0.2, y: 0 }, 
  zoom: 1,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  dist: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return Math.sqrt(dx*dx + dy*dy + dz*dz);
  }
};

// Fibonacci Lattice Sphere Generation
function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5)); 
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y); 
    const theta = goldenAngle * i; 
    
    points.push({
      x: Math.cos(theta) * radiusAtY * radius,
      y: y * radius,
      z: Math.sin(theta) * radiusAtY * radius,
      idx: i
    });
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Determine neighbor distance threshold based on density
  const threshold = (2 * Math.PI * CONFIG.sphereRadius) / Math.sqrt(CONFIG.cellCount); 
  
  state.cells = points.map((p, i) => {
    const neighbors = [];
    // Optimization: Simple distance check
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      const d = Vec3.dist(p, points[j]);
      if (d < threshold * 1.25) { 
        neighbors.push(j);
      }
    }
    
    return {
      pos: p,
      idx: i,
      neighbors: neighbors,
      alive: Math.random() > 0.55, 
      age: 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  const nextStates = state.cells.map(cell => {
    const neighborCount = cell.neighbors.reduce((acc, idx) => acc + (state.cells[idx].alive ? 1 : 0), 0);
    
    let nextAlive = false;
    let isBorn = false;

    if (cell.alive) {
      if (neighborCount === 2 || neighborCount === 3) nextAlive = true;
    } else {
      if (neighborCount === 3) {
        nextAlive = true;
        isBorn = true;
      }
    }
    
    return {
      alive: nextAlive,
      age: nextAlive ? (isBorn ? 0 : cell.age + 1) : 0
    };
  });

  state.cells.forEach((cell, i) => {
    cell.alive = nextStates[i].alive;
    cell.age = nextStates[i].age;
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotation Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotation X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 800 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // Clear with Deep Space Background
  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, width, height);
  
  // Background Atmosphere (Subtle Gradient)
  const grad = ctx.createRadialGradient(width/2, height/2, width*0.1, width/2, height/2, width*0.8);
  grad.addColorStop(0, '#0a0a15'); 
  grad.addColorStop(1, '#050508');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);

  // Project and Sort
  const projectedCells = state.cells.map(cell => {
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    return { cell, proj };
  });
  
  // Sort back-to-front
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  projectedCells.forEach(({ cell, proj }) => {
    // Cull back faces slightly
    if (proj.z > CONFIG.sphereRadius * 0.8) return; 
    
    // Depth of Field / Fog
    const depthAlpha = 0.1 + 0.9 * ((CONFIG.sphereRadius - proj.z) / (2 * CONFIG.sphereRadius));
    
    // Size Attenuation
    const size = CONFIG.cellSize * proj.scale;

    if (cell.alive) {
      // COLOR LOGIC: Age-based Gradient
      let c1, c2, t;
      
      if (cell.age < 5) {
        c1 = CONFIG.colorPalette.newborn;
        c2 = CONFIG.colorPalette.young;
        t = cell.age / 5;
      } else if (cell.age < 15) {
        c1 = CONFIG.colorPalette.young;
        c2 = CONFIG.colorPalette.mature;
        t = (cell.age - 5) / 10;
      } else {
        c1 = CONFIG.colorPalette.mature;
        c2 = CONFIG.colorPalette.old;
        t = Math.min(1, (cell.age - 15) / 15);
      }
      
      // Interpolate HSL
      const h = c1.h + (c2.h - c1.h) * t;
      const s = c1.s + (c2.s - c1.s) * t;
      const l = c1.l + (c2.l - c1.l) * t;

      ctx.fillStyle = `hsla(${h}, ${s}%, ${l}%, ${depthAlpha})`;
      
      // Bloom for front cells
      if (proj.z < -CONFIG.sphereRadius * 0.3 && size > 1.5) {
        ctx.shadowBlur = CONFIG.bloomStrength * proj.scale;
        ctx.shadowColor = `hsla(${h}, 100%, 60%, 0.6)`;
      } else {
        ctx.shadowBlur = 0;
      }
    } else {
      // Dead cells: Deep Navy/Slate
      ctx.fillStyle = `rgba(15, 23, 42, ${depthAlpha * 0.8})`;
      ctx.shadowBlur = 0;
    }
    
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  ctx.shadowBlur = 0; // Reset
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    state.rotation.y += CONFIG.rotationSpeed;
    
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction & UI ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation.toString().padStart(4, '0');
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop.toString().padStart(4, '0');
}

document.getElementById('btn-pause').addEventListener('click', (e) => {
  state.isRunning = !state.isRunning;
  const btn = e.currentTarget;
  const iconPlay = document.getElementById('icon-play');
  const iconPause = document.getElementById('icon-pause');
  
  if (state.isRunning) {
    btn.classList.add('active');
    iconPause.style.display = 'block';
    iconPlay.style.display = 'none';
  } else {
    btn.classList.remove('active');
    iconPause.style.display = 'none';
    iconPlay.style.display = 'block';
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  const btn = document.getElementById('btn-pause');
  btn.classList.remove('active');
  document.getElementById('icon-pause').style.display = 'none';
  document.getElementById('icon-play').style.display = 'block';
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
  document.getElementById('speed-val').innerText = state.speed;
});

// Mouse Drag
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(2.5, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
