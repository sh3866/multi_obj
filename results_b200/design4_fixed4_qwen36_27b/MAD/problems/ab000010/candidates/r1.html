<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway Sphere | Visual Simulation</title>
<style>
  :root {
    --bg-dark: #050508;
    --glass-bg: rgba(20, 20, 25, 0.6);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-highlight: rgba(255, 255, 255, 0.05);
    --accent-primary: #00f0ff; /* Cyan */
    --accent-secondary: #ff0055; /* Magenta */
    --accent-tertiary: #7000ff; /* Violet */
    --text-main: #ffffff;
    --text-muted: #94a3b8;
    
    /* 8pt Grid Spacing */
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 16px;
    --space-lg: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* --- Background Atmosphere --- */
  .bg-atmosphere {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background: 
      radial-gradient(circle at 50% 40%, #1a1a2e 0%, #050508 75%),
      linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(0, 240, 255, 0.03) 100%);
    pointer-events: none;
  }

  /* --- Canvas Layer --- */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* --- UI Layer --- */
  #ui-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    pointer-events: none; /* Pass through to canvas */
    padding-bottom: var(--space-lg);
  }

  /* --- Header --- */
  .header {
    margin-top: 40px;
    text-align: center;
    pointer-events: auto;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: var(--space-xs);
    text-transform: uppercase;
    background: linear-gradient(180deg, #fff 0%, #b0b0b0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  /* --- Control Panel (Bottom Center) --- */
  .panel {
    pointer-events: auto;
    width: 420px;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: var(--space-lg);
    box-shadow: 
      0 20px 40px rgba(0,0,0,0.4),
      inset 0 1px 0 var(--glass-highlight);
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
    transition: transform 0.3s ease;
  }
  
  .panel:hover {
    transform: translateY(-2px);
    box-shadow: 
      0 24px 48px rgba(0,0,0,0.5),
      inset 0 1px 0 var(--glass-highlight);
  }

  .panel-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-lg);
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
  }

  .panel-label {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  /* Stats Typography */
  .stat-group {
    display: flex;
    gap: var(--space-md);
  }
  
  .stat-item {
    display: flex;
    flex-direction: column;
  }

  .stat-value {
    font-family: 'Courier New', Courier, monospace;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1;
  }
  
  .stat-value.highlight {
    color: var(--accent-primary);
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
  }

  /* Sliders */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    outline: none;
    transition: background 0.2s;
  }
  input[type=range]:hover {
    background: rgba(255,255,255,0.2);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255,255,255,0.6);
    border: 2px solid var(--bg-dark);
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.1);
  }

  /* Buttons */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-md);
  }
  
  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--glass-border);
    color: var(--text-main);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.3);
    transform: translateY(-1px);
  }
  
  button:active {
    transform: translateY(1px);
  }

  button.primary {
    background: rgba(0, 240, 255, 0.1);
    border-color: var(--accent-primary);
    color: var(--accent-primary);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
  }
  button.primary:hover {
    background: var(--accent-primary);
    color: #000;
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
  }
  
  button.secondary {
    border-color: var(--accent-secondary);
    color: var(--accent-secondary);
  }
  button.secondary:hover {
    background: var(--accent-secondary);
    color: #fff;
    box-shadow: 0 0 25px rgba(255, 0, 85, 0.4);
  }

  .footer-hint {
    position: absolute;
    bottom: 20px;
    right: 20px;
    font-size: 0.7rem;
    color: var(--text-muted);
    opacity: 0.4;
    pointer-events: none;
  }

</style>
</head>
<body>

  <!-- Background Atmosphere -->
  <div class="bg-atmosphere"></div>

  <!-- Canvas for the Sphere -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Header (Top Center) -->
    <div class="header">
      <h1>Conway Sphere</h1>
      <div class="subtitle">Algorithmic Life Simulation</div>
    </div>

    <!-- Control Panel (Bottom Center) -->
    <div class="panel">
      
      <!-- Top Row: Stats -->
      <div class="panel-row">
        <div class="stat-group">
          <div class="stat-item">
            <span class="panel-label">Generation</span>
            <span class="stat-value highlight" id="gen-count">0</span>
          </div>
          <div class="stat-item">
            <span class="panel-label">Population</span>
            <span class="stat-value" id="pop-count">0</span>
          </div>
        </div>
        
        <!-- Bottom Row: Controls -->
        <div class="btn-group">
          <button id="btn-pause" class="primary">
            <span>&#9632;</span> Pause
          </button>
          <button id="btn-reset" class="secondary">
            <span>&#8635;</span> Randomize
          </button>
        </div>
      </div>

      <!-- Middle Row: Speed -->
      <div class="panel-section">
        <div class="panel-row">
           <span class="panel-label">Simulation Speed</span>
           <span class="panel-label" style="color: var(--accent-primary)" id="speed-val">10 fps</span>
        </div>
        <input type="range" id="speed-slider" min="1" max="60" value="15">
      </div>

      <!-- Step Button (Full Width) -->
      <button id="btn-step" style="width: 100%; opacity: 0.7;">Step Once</button>
    </div>

  </div>

  <div class="footer-hint">DRAG TO ROTATE &bull; SCROLL TO ZOOM</div>

<script>
/**
 * Spherical Conway's Game of Life
 * 
 * Design Implementation:
 * - Multicolor Palette: Age-based HSL color mapping.
 * - Bloom: Canvas shadowBlur for neon effect.
 * - Atmosphere: Subtle grid lines + radial gradients.
 * - 3D Math: Fibonacci Lattice + Orthographic/Perspective Projection.
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 4000, // Higher density for "lots of small cells"
  sphereRadius: 280,
  cellSize: 3.5,   // Smaller cells
  rotationSpeed: 0.001,
  gridOpacity: 0.08,
  bloomStrength: 15
};

// --- State ---
let state = {
  cells: [], 
  generation: 0,
  isRunning: true,
  speed: 15, 
  lastFrameTime: 0,
  rotation: { x: 0.2, y: 0 }, // Slight tilt by default
  zoom: 1,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  add: (v1, v2) => ({ x: v1.x + v2.x, y: v1.y + v2.y, z: v1.z + v2.z }),
  sub: (v1, v2) => ({ x: v1.x - v2.x, y: v1.y - v2.y, z: v1.z - v2.z }),
  dot: (v1, v2) => v1.x * v2.x + v1.y * v2.y + v1.z * v2.z,
  len: (v) => Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z),
  normalize: (v) => {
    const l = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z);
    return l > 0 ? { x: v.x/l, y: v.y/l, z: v.z/l } : {x:0,y:0,z:0};
  },
  scale: (v, s) => ({ x: v.x * s, y: v.y * s, z: v.z * s }),
  dist: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return Math.sqrt(dx*dx + dy*dy + dz*dz);
  }
};

// Fibonacci Lattice Sphere Generation
function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5)); 
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y); 
    const theta = goldenAngle * i; 
    
    const x = Math.cos(theta) * radiusAtY;
    const z = Math.sin(theta) * radiusAtY;
    
    points.push({
      x: x * radius,
      y: y * radius,
      z: z * radius,
      idx: i
    });
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Calculate average distance to neighbors to determine threshold
  // For a Fibonacci sphere, the area per point is 4*pi*r^2 / N
  // Approx distance is sqrt(Area)
  const threshold = (2 * Math.PI * CONFIG.sphereRadius) / Math.sqrt(CONFIG.cellCount); 
  
  state.cells = points.map((p, i) => {
    const neighbors = [];
    // Optimization: Only check points within a reasonable index range or use spatial hash
    // For < 5000 points, O(N^2) is acceptable for init only.
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      const d = Vec3.dist(p, points[j]);
      // Neighbors are those within 1.3x the average spacing
      if (d < threshold * 1.35) { 
        neighbors.push(j);
      }
    }
    
    return {
      pos: p,
      idx: i,
      neighbors: neighbors,
      alive: Math.random() > 0.65, // Higher density start
      bornGen: 0, 
      age: 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  const nextStates = state.cells.map(cell => {
    const neighborCount = cell.neighbors.reduce((acc, idx) => acc + (state.cells[idx].alive ? 1 : 0), 0);
    
    let nextAlive = false;
    let isBorn = false;

    if (cell.alive) {
      if (neighborCount === 2 || neighborCount === 3) nextAlive = true;
    } else {
      if (neighborCount === 3) {
        nextAlive = true;
        isBorn = true;
      }
    }
    
    return {
      alive: nextAlive,
      bornGen: isBorn ? state.generation : cell.bornGen,
      age: nextAlive ? (cell.alive ? cell.age + 1 : 0) : 0
    };
  });

  state.cells.forEach((cell, i) => {
    cell.alive = nextStates[i].alive;
    cell.bornGen = nextStates[i].bornGen;
    cell.age = nextStates[i].age;
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotation Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotation X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 900 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function drawGrid() {
  // Draw a faint wireframe sphere for atmosphere
  ctx.beginPath();
  ctx.strokeStyle = `rgba(100, 100, 255, ${CONFIG.gridOpacity})`;
  ctx.lineWidth = 1;
  
  // Simple wireframe approximation (Meridians)
  const segments = 24;
  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;
  
  // We don't rotate the grid to keep it "grounded" or we can rotate it.
  // Let's draw a static faint halo behind it.
  const grad = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r * 1.5);
  grad.addColorStop(0, 'rgba(0, 240, 255, 0.05)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  
  ctx.fillStyle = grad;
  ctx.arc(cx, cy, r * 1.5, 0, Math.PI * 2);
  ctx.fill();
}

function draw() {
  // Clear with trail effect
  ctx.fillStyle = 'rgba(5, 5, 8, 0.3)'; // Longer trails
  ctx.fillRect(0, 0, width, height);

  drawGrid();

  // Project and Sort
  const projectedCells = state.cells.map(cell => {
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    return { cell, proj };
  });
  
  // Sort back-to-front
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  projectedCells.forEach(({ cell, proj }) => {
    // Cull back faces slightly to save perf and add depth
    if (proj.z > CONFIG.sphereRadius * 0.95) return; 
    
    const size = CONFIG.cellSize * proj.scale;
    
    // Depth dimming (fog)
    // z goes from -R (front) to R (back). 
    // Map -R -> 1.0 alpha, R -> 0.2 alpha
    const depthAlpha = 0.2 + 0.8 * ((CONFIG.sphereRadius - proj.z) / (2 * CONFIG.sphereRadius));

    if (cell.alive) {
      // COLOR LOGIC:
      // Hue based on Age + Generation.
      // New cells: Magenta/Hot Pink (approx 320-340)
      // Old cells: Indigo/Violet (approx 260-280)
      // Active/Hot: Cyan (approx 180-200)
      
      // Base hue cycle
      const baseHue = (state.generation * 0.5) % 360;
      
      // Age gradient: 
      // Age 0 (New): 330 (Magenta)
      // Age 10+: 260 (Violet)
      // Age 20+: 200 (Cyan/Blue)
      
      let hue;
      if (cell.age < 5) {
        // New cells: Hot Pink to Magenta
        hue = 320 + (cell.age * 4); 
      } else {
        // Older cells: Shift towards Indigo/Cyan
        hue = 260 + ((cell.age - 5) * 2);
      }

      // Ensure hue wraps
      hue = hue % 360;

      const lightness = 60;
      const saturation = 90;

      ctx.fillStyle = `hsla(${hue}, ${saturation}%, ${lightness}%, ${depthAlpha})`;
      
      // Bloom Effect
      if (size > 1.5) {
        ctx.shadowBlur = CONFIG.bloomStrength * proj.scale;
        ctx.shadowColor = `hsla(${hue}, 100%, 50%, 0.8)`;
      } else {
        ctx.shadowBlur = 0;
      }
    } else {
      // Dead cells: Subtle grid
      ctx.fillStyle = `rgba(40, 50, 70, ${depthAlpha * 0.3})`;
      ctx.shadowBlur = 0;
    }
    
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  ctx.shadowBlur = 0; // Reset
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    state.rotation.y += CONFIG.rotationSpeed;
    
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation;
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop;
}

document.getElementById('btn-pause').addEventListener('click', (e) => {
  state.isRunning = !state.isRunning;
  const btn = e.currentTarget;
  if (state.isRunning) {
    btn.innerHTML = '<span>&#9632;</span> Pause';
    btn.classList.add('primary');
    btn.classList.remove('secondary');
  } else {
    btn.innerHTML = '<span>&#9658;</span> Resume';
    btn.classList.remove('primary');
    btn.classList.add('secondary');
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  const btn = document.getElementById('btn-pause');
  btn.innerHTML = '<span>&#9658;</span> Resume';
  btn.classList.remove('primary');
  btn.classList.add('secondary');
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
  document.getElementById('speed-val').innerText = state.speed + " fps";
});

// Mouse Drag
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(2.5, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
