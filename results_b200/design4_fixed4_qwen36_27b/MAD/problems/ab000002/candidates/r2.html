<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascension Protocol</title>
<style>
    :root {
        /* Palette: Deep Indigo & Neon Gold */
        --bg-deep: #050508;
        --bg-panel: rgba(10, 12, 18, 0.85);
        --bg-grid: rgba(255, 255, 255, 0.03);
        
        --accent-gold: #FFC107;
        --accent-gold-dim: #b38f00;
        --accent-glow: rgba(255, 193, 7, 0.4);
        --accent-glow-intense: rgba(255, 193, 7, 0.8);
        
        --text-main: #e2e8f0;
        --text-muted: #64748b;
        --text-bright: #ffffff;
        
        /* Typography */
        --font-display: 'Orbitron', 'Rajdhani', 'Segoe UI Black', sans-serif;
        --font-mono: 'Roboto Mono', 'Courier New', monospace;
        
        /* Dimensions */
        --sidebar-width: 320px;
    }

    /* Base Reset & Layout */
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }

    body {
        background-color: var(--bg-deep);
        /* Deep Indigo Radial + Subtle Grid Pattern */
        background-image: 
            radial-gradient(circle at 15% 15%, #161b22 0%, #050508 70%),
            linear-gradient(var(--bg-grid) 1px, transparent 1px),
            linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
        background-size: 100% 100%, 100px 100px, 100px 100px; /* 100px Grid */
        color: var(--text-main);
        font-family: var(--font-mono);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Header (Unified with Sidebar) --- */
    header {
        height: 80px;
        width: var(--sidebar-width);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 25px;
        position: relative;
        z-index: 20;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        background: rgba(5, 5, 8, 0.95);
        backdrop-filter: blur(5px);
    }

    h1 {
        font-family: var(--font-display);
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-bright);
        margin: 0;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .subtitle {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--accent-gold);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        opacity: 0.8;
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    
    .subtitle::before {
        content: '';
        display: block;
        width: 6px;
        height: 6px;
        background: var(--accent-gold);
        box-shadow: 0 0 5px var(--accent-gold);
    }

    /* --- Layout Grid --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
    }

    /* --- Sidebar (Unified Container) --- */
    aside {
        width: var(--sidebar-width);
        flex-shrink: 0;
        background: var(--bg-panel);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        padding: 0;
        display: flex;
        flex-direction: column;
        z-index: 10;
        box-shadow: 5px 0 30px rgba(0,0,0,0.5);
    }

    /* Status Card */
    .status-card {
        padding: 25px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        background: linear-gradient(to bottom, rgba(255,255,255,0.02), transparent);
    }

    .level-display {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        margin-bottom: 15px;
    }

    .level-num {
        font-family: var(--font-display);
        font-size: 4rem;
        line-height: 0.8;
        color: var(--text-bright);
        font-weight: 700;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .level-label {
        font-size: 0.9rem;
        font-family: var(--font-display);
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 10px;
        letter-spacing: 0.1em;
    }

    /* XP Bar */
    .xp-container {
        margin-bottom: 20px;
    }

    .xp-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        font-family: var(--font-mono);
        color: var(--text-muted);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .xp-bar-bg {
        height: 8px;
        background: #1e293b;
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
        position: relative;
    }

    .xp-bar-fill {
        height: 100%;
        width: 65%;
        background: var(--accent-gold);
        box-shadow: 0 0 10px var(--accent-glow);
        position: relative;
    }
    
    /* Points Section */
    .points-display {
        background: rgba(255, 193, 7, 0.05);
        padding: 15px;
        border: 1px solid rgba(255, 193, 7, 0.2);
        border-left: 4px solid var(--accent-gold);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .points-info {
        display: flex;
        flex-direction: column;
    }

    .points-label {
        font-size: 0.7rem;
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-muted);
    }

    .points-val {
        font-size: 1.8rem;
        font-family: var(--font-display);
        font-weight: 700;
        color: var(--accent-gold);
        line-height: 1;
        text-shadow: 0 0 8px var(--accent-glow);
    }

    /* Character Stats */
    .character-details {
        padding: 25px;
        flex: 1;
        overflow-y: auto;
    }
    
    .char-header {
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text-bright);
        letter-spacing: 0.05em;
        margin-bottom: 4px;
    }
    
    .char-class {
        color: var(--accent-gold-dim);
        font-size: 0.75rem;
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    /* Stat Rows */
    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        font-size: 0.85rem;
        position: relative;
    }
    
    .stat-row span:first-child { 
        color: var(--text-muted); 
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    
    .stat-row span:last-child { 
        font-weight: 700; 
        color: var(--text-bright);
        font-family: var(--font-display);
        font-size: 1rem;
    }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at 50% 50%, rgba(20,30,40,0.15), transparent 70%);
    }

    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 0;
        left: 0;
        width: 2000px; /* Expanded Canvas */
        height: 1600px;
        transform-origin: 0 0;
        transition: transform 0.1s linear;
    }

    /* --- Connections (Circuit Board Style) --- */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    /* Circuit Path Styling */
    .connection-line {
        fill: none;
        stroke: rgba(255, 255, 255, 0.1);
        stroke-width: 2;
        transition: stroke 0.4s ease, stroke-width 0.4s ease, filter 0.4s ease;
    }

    .connection-line.active {
        stroke: var(--accent-gold);
        stroke-width: 2;
        filter: drop-shadow(0 0 4px var(--accent-glow));
        stroke-dasharray: 0;
    }
    
    /* Pulse animation for active lines */
    .connection-line.active::after {
        /* We can't animate pseudo elements on SVG easily, so we rely on JS or CSS animations on the path if needed */
    }

    /* --- Nodes (Hexagons) --- */
    .node {
        position: absolute;
        width: 80px; /* Slightly larger */
        height: 80px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* The Hexagon Shape */
    .node-shape {
        width: 100%;
        height: 100%;
        background: #0f131a;
        /* Hexagon Clip Path */
        clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        /* Bevel effect via shadow inside clip path is hard, so we use pseudo layers */
    }

    /* Inner Bevel/Border */
    .node-shape::before {
        content: '';
        position: absolute;
        inset: 2px;
        background: #0a0c10;
        clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        z-index: 1;
        transition: background 0.3s ease;
    }
    
    /* Outer Glow Border Layer */
    .node-shape::after {
        content: '';
        position: absolute;
        inset: 0;
        background: #334155; /* Default Grey Border */
        clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        z-index: 0;
        transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .node-icon {
        width: 32px;
        height: 32px;
        fill: var(--text-muted);
        opacity: 0.5;
        position: relative;
        z-index: 2;
        transition: all 0.3s ease;
    }

    /* --- Node States --- */
    
    /* Active/Unlocked: Neon Gold */
    .node.unlocked .node-shape::after {
        background: var(--accent-gold);
        box-shadow: 0 0 15px var(--accent-glow-intense); /* Glow leaks out of clip path slightly in some browsers, but mostly contained */
    }
    
    .node.unlocked .node-shape {
        background: #2a2205; /* Warm dark bg */
        box-shadow: 0 0 25px var(--accent-glow);
    }

    .node.unlocked .node-shape::before {
        background: #1a1500;
    }

    .node.unlocked .node-icon {
        fill: #fff;
        filter: drop-shadow(0 0 3px var(--accent-gold));
        opacity: 1;
    }
    
    /* Available (Hoverable) */
    .node.available .node-shape::after {
        background: #475569;
    }
    
    .node.available:hover {
        transform: translate(-50%, -50%) scale(1.1);
        z-index: 10;
    }
    
    .node.available:hover .node-shape {
        background: #1e293b;
    }

    .node.available:hover .node-shape::after {
        background: var(--text-main);
    }
    
    .node.available:hover .node-icon {
        fill: var(--text-main);
        opacity: 0.9;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(8, 10, 15, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-left: 3px solid rgba(255, 255, 255, 0.1);
        padding: 20px;
        width: 320px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s, border-color 0.2s;
        z-index: 100;
        box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        backdrop-filter: blur(12px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip.active-style {
        border-left-color: var(--accent-gold);
        border-color: rgba(255, 193, 7, 0.2);
    }

    .tooltip h3 {
        color: var(--text-bright);
        font-family: var(--font-display);
        margin-bottom: 6px;
        font-size: 1.3rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .tooltip .type {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--accent-gold);
        margin-bottom: 12px;
        letter-spacing: 0.15em;
        font-weight: 700;
        display: inline-block;
        background: rgba(255, 193, 7, 0.1);
        padding: 2px 6px;
    }

    .tooltip p {
        font-size: 0.85rem;
        line-height: 1.6;
        color: #cbd5e1;
        font-family: var(--font-mono);
    }

    .tooltip .req {
        margin-top: 15px;
        font-size: 0.75rem;
        color: #ef4444;
        font-family: var(--font-mono);
        text-transform: uppercase;
        display: none;
        padding-top: 10px;
        border-top: 1px solid rgba(255,255,255,0.1);
    }

    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-muted); }

</style>
</head>
<body>

    <header>
        <h1>Ascension Protocol</h1>
        <div class="subtitle">System Online</div>
    </header>

    <div class="main-layout">
        <!-- Sidebar -->
        <aside>
            <!-- Status Card -->
            <div class="status-card">
                <div class="level-display">
                    <span class="level-num">42</span>
                    <span class="level-label">Level</span>
                </div>
                <div class="xp-container">
                    <div class="xp-labels">
                        <span>XP Progress</span>
                        <span>12,450 / 20,000</span>
                    </div>
                    <div class="xp-bar-bg">
                        <div class="xp-bar-fill"></div>
                    </div>
                </div>

                <div class="points-display">
                    <div class="points-info">
                        <span class="points-label">Available Points</span>
                    </div>
                    <span class="points-val">3</span>
                </div>
            </div>

            <!-- Character Details -->
            <div class="character-details">
                <div class="char-header">
                    <h2 class="char-name">Kaelen Thorne</h2>
                    <div class="char-class">Duelist / Arcanist</div>
                </div>
                
                <div class="stat-row"><span>Strength</span><span>14</span></div>
                <div class="stat-row"><span>Dexterity</span><span>28</span></div>
                <div class="stat-row"><span>Intelligence</span><span>35</span></div>
                <div class="stat-row"><span>Vitality</span><span>12</span></div>
                <div class="stat-row"><span>Willpower</span><span>19</span></div>
                <div class="stat-row"><span>Perception</span><span>11</span></div>
            </div>
        </aside>

        <!-- Tree Canvas -->
        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected via JS -->
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data (Expanded Grid) ---
    const skills = [
        // Root
        { id: 'root', x: 1000, y: 100, name: "Archon's Spark", type: "Passive", desc: "The origin of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Tier 1
        { id: 'str1', x: 700, y: 300, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'int1', x: 1000, y: 300, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", unlocked: true, req: 'root' },
        { id: 'dex1', x: 1300, y: 300, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: false, req: 'root' },
        
        // Tier 2
        { id: 'str2', x: 500, y: 500, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str2b', x: 800, y: 500, name: "Iron Skin", type: "Passive", desc: "Reduces physical damage taken by 10%.", unlocked: true, req: 'str1' },
        { id: 'int2', x: 1000, y: 500, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: true, req: 'int1' },
        { id: 'dex2', x: 1200, y: 500, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: false, req: 'dex1' },
        { id: 'dex2b', x: 1500, y: 500, name: "Shadow Step", type: "Active", desc: "Teleport 5 meters behind target.", unlocked: false, req: 'dex1' },

        // Tier 3
        { id: 'str3', x: 300, y: 700, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        { id: 'hybrid', x: 900, y: 700, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows dealing damage.", unlocked: false, req: 'int2' },
        { id: 'dex3', x: 1400, y: 700, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        
        // Tier 4 (Deep)
        { id: 'str4', x: 300, y: 900, name: "Titan's Rage", type: "Ultimate", desc: "Double damage for 5 seconds.", unlocked: false, req: 'str3' },
        { id: 'int4', x: 1000, y: 900, name: "Meteor Swarm", type: "Ultimate", desc: "Call down meteors on an area.", unlocked: false, req: 'hybrid' },
        { id: 'dex4', x: 1500, y: 900, name: "Assassin", type: "Passive", desc: "Crit chance +20%.", unlocked: false, req: 'dex3' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z", // Star
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z", // Lightning
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z" // Eye/Orb
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Center the world initially (Offset slightly for sidebar)
        // Sidebar is 320px. Center of remaining space.
        const startX = (cw / 2) - 1000 + 160; 
        const startY = (ch / 2) - 500;

        panX = startX;
        panY = startY;
        updateTransform();

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawLines();
    }

    // --- Circuit Board Line Drawing ---
    function drawLines() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    // Create a path with a 45-degree angle (Manhattan-ish routing)
                    const midX = parent.x;
                    const midY = skill.y;
                    
                    // Path: Start -> Vertical -> Horizontal -> Vertical -> End
                    // This creates a distinct geometric look
                    const pathD = `M ${parent.x} ${parent.y} L ${parent.x} ${(parent.y + skill.y)/2} L ${skill.x} ${(parent.y + skill.y)/2} L ${skill.x} ${skill.y}`;
                    
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', pathD);
                    path.classList.add('connection-line');
                    
                    if (skill.unlocked) {
                        path.classList.add('active');
                    }
                    
                    svg.appendChild(path);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            tooltip.classList.add('active-style');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            tooltip.classList.remove('active-style');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        
        const x = e.clientX;
        const y = e.clientY;
        
        let left = x + 20;
        let top = y - 20;
        
        if (left + 320 > window.innerWidth) left = x - 340;
        if (top + 150 > window.innerHeight) top = y - 150;

        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        if (!skill.unlocked) {
             const parent = skills.find(s => s.id === skill.req);
             if (parent && parent.unlocked) {
                 skill.unlocked = true;
                 updateVisuals();
             }
        }
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            if (s.unlocked) {
                el.classList.add('unlocked');
                el.classList.remove('available');
            } else {
                el.classList.remove('unlocked');
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) {
                    el.classList.add('available');
                } else {
                    el.classList.remove('available');
                }
            }
        });
        drawLines();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0, panY = 0;
    let scale = 1;

    function updateTransform() {
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        updateTransform();
    });

    init();

</script>
</body>
</html>
