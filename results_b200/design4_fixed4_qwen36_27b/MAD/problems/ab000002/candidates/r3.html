<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascension Protocol // REVISED</title>
<style>
    :root {
        /* Palette: Cyber Amber & Deep Charcoal */
        --bg-deep: #0a0a0c;
        --bg-panel: #111214;
        --bg-panel-gradient: linear-gradient(180deg, #161719 0%, #0d0e10 100%);
        
        --accent-gold: #ffb300; /* Cyber Amber */
        --accent-gold-dim: #6d5200;
        --accent-glow: rgba(255, 179, 0, 0.5);
        --accent-glow-intense: rgba(255, 179, 0, 0.9);
        
        --text-main: #e0e6ed;
        --text-muted: #6c7a89;
        --text-bright: #ffffff;
        --text-dim: #3b444e;
        
        /* Typography - System Stack to simulate Tech/Fantasy */
        --font-display: 'Orbitron', 'Segoe UI Black', 'Impact', sans-serif;
        --font-mono: 'Roboto Mono', 'Consolas', 'Courier New', monospace;
        
        /* Dimensions */
        --sidebar-width: 300px;
        --spacing-unit: 8px;
    }

    /* Base Reset & Layout */
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-mono);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Header --- */
    header {
        height: 60px;
        width: var(--sidebar-width);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 24px;
        background: var(--bg-panel);
        border-right: 1px solid rgba(255,255,255,0.05);
        border-bottom: 1px solid rgba(255,255,255,0.05);
        z-index: 20;
        flex-shrink: 0;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-bright);
        margin: 0;
    }

    .subtitle {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        color: var(--accent-gold);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        opacity: 0.8;
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    
    .subtitle::before {
        content: '';
        display: block;
        width: 4px;
        height: 4px;
        background: var(--accent-gold);
        box-shadow: 0 0 4px var(--accent-gold);
    }

    /* --- Layout Grid --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
    }

    /* --- Sidebar --- */
    aside {
        width: var(--sidebar-width);
        flex-shrink: 0;
        background: var(--bg-panel-gradient);
        /* Grid Texture */
        background-image: 
            linear-gradient(var(--bg-panel-gradient), var(--bg-panel-gradient)),
            linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 100% 100%, 16px 16px, 16px 16px;
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        flex-direction: column;
        z-index: 10;
        box-shadow: 10px 0 40px rgba(0,0,0,0.6);
    }

    /* Status Card (Level/XP) */
    .status-card {
        padding: 32px 24px; /* 8pt Grid: 32px top */
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .level-display {
        display: flex;
        align-items: baseline; /* Align bottom */
        gap: 8px;
        margin-bottom: 16px;
    }

    .level-num {
        font-family: var(--font-display);
        font-size: 2.5rem; /* Reduced from 4rem */
        line-height: 1;
        color: var(--text-bright);
        font-weight: 700;
        letter-spacing: -0.02em;
    }

    .level-label {
        font-size: 0.8rem;
        font-family: var(--font-display);
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.1em;
    }

    /* XP Bar */
    .xp-container {
        margin-bottom: 32px; /* 8pt Grid spacing */
    }

    .xp-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        font-family: var(--font-mono);
        color: var(--text-muted);
        margin-bottom: 6px;
        text-transform: uppercase;
    }

    .xp-bar-bg {
        height: 6px;
        background: #000;
        border: 1px solid rgba(255,255,255,0.1);
        position: relative;
        /* Chamfered corners via clip-path */
        clip-path: polygon(0 0, 100% 0, 100% 70%, calc(100% - 4px) 100%, 0 100%);
    }

    .xp-bar-fill {
        height: 100%;
        width: 65%;
        background: var(--accent-gold);
        box-shadow: 0 0 8px var(--accent-glow);
        position: relative;
    }

    /* Points Section (Reduced Visual Weight) */
    .points-display {
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .points-label {
        font-size: 0.7rem;
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-muted);
    }

    .points-val {
        font-size: 1.5rem;
        font-family: var(--font-display);
        font-weight: 700;
        color: var(--accent-gold);
        line-height: 1;
    }

    /* Character Stats */
    .character-details {
        padding: 32px 24px; /* Consistent 32px gap */
        flex: 1;
        overflow-y: auto;
    }
    
    .char-header {
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-bright);
        letter-spacing: 0.05em;
        margin-bottom: 4px;
    }
    
    .char-class {
        color: var(--accent-gold-dim);
        font-size: 0.7rem;
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    /* Stat Rows */
    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        font-size: 0.8rem;
        position: relative;
    }
    
    .stat-row span:first-child { 
        color: var(--text-muted); 
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    
    .stat-row span:last-child { 
        font-weight: 700; 
        color: var(--text-bright);
        font-family: var(--font-display);
        font-size: 1.1rem;
    }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background-color: var(--bg-deep);
        /* Subtle Vignette */
        background-image: radial-gradient(circle at center, transparent 0%, #000000 120%);
    }

    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%; 
        height: 100%;
        transform-origin: 0 0;
        /* No transition for smooth panning */
    }

    /* --- Connections (Energy Conduits) --- */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    .connection-line {
        fill: none;
        stroke: #2a2d35;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: stroke 0.5s ease, stroke-width 0.5s ease;
    }

    .connection-line.active {
        stroke: var(--accent-gold);
        stroke-width: 2;
        /* Glow filter is defined in SVG defs */
        filter: url(#glow);
    }

    /* --- Nodes (Chamfered Glass) --- */
    .node {
        position: absolute;
        width: 70px;
        height: 70px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* The Chamfered Shape (Octagon-ish) */
    .node-shape {
        width: 100%;
        height: 100%;
        background: rgba(15, 17, 22, 0.8);
        /* Glassy gradient */
        background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
        /* Chamfered corners */
        clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        transition: all 0.3s ease;
    }

    /* Inner Bevel Layer */
    .node-shape::before {
        content: '';
        position: absolute;
        inset: 2px;
        background: #0a0c10;
        clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
        z-index: 1;
        transition: background 0.3s ease;
    }
    
    /* Icon */
    .node-icon {
        width: 28px;
        height: 28px;
        fill: var(--text-dim);
        opacity: 0.4;
        position: relative;
        z-index: 2;
        transition: all 0.3s ease;
    }

    /* --- Node States --- */
    
    /* Active/Unlocked: Cyber Amber Glow */
    .node.unlocked .node-shape {
        background: linear-gradient(135deg, rgba(255, 179, 0, 0.15) 0%, rgba(255, 179, 0, 0.05) 100%);
        border: 1px solid var(--accent-gold);
        box-shadow: 0 0 15px var(--accent-glow), inset 0 0 10px var(--accent-glow);
    }
    
    .node.unlocked .node-shape::before {
        background: #1a1500; /* Dark amber tint */
    }

    .node.unlocked .node-icon {
        fill: #fff;
        filter: drop-shadow(0 0 2px var(--accent-gold));
        opacity: 1;
    }
    
    /* Available (Hoverable) */
    .node.available .node-shape {
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .node.available:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }
    
    .node.available:hover .node-shape {
        background: rgba(255,255,255,0.1);
        box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }
    
    .node.available:hover .node-shape::before {
        background: #1e293b;
    }

    .node.available:hover .node-icon {
        fill: var(--text-bright);
        opacity: 1;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(10, 12, 16, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-left: 3px solid rgba(255, 255, 255, 0.1);
        padding: 20px;
        width: 300px;
        /* Chamfered Tooltip */
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
        pointer-events: none;
        opacity: 0;
        transform: translateY(5px);
        transition: opacity 0.2s, transform 0.2s, border-color 0.2s;
        z-index: 100;
        box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        backdrop-filter: blur(8px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip.active-style {
        border-left-color: var(--accent-gold);
        border-color: rgba(255, 179, 0, 0.2);
    }

    .tooltip h3 {
        color: var(--text-bright);
        font-family: var(--font-display);
        margin-bottom: 6px;
        font-size: 1.1rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .tooltip .type {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--accent-gold);
        margin-bottom: 12px;
        letter-spacing: 0.15em;
        font-weight: 700;
        display: inline-block;
        background: rgba(255, 179, 0, 0.1);
        padding: 2px 6px;
    }

    .tooltip p {
        font-size: 0.8rem;
        line-height: 1.6;
        color: #cbd5e1;
        font-family: var(--font-mono);
    }

    .tooltip .req {
        margin-top: 12px;
        font-size: 0.7rem;
        color: #ef4444;
        font-family: var(--font-mono);
        text-transform: uppercase;
        display: none;
        padding-top: 8px;
        border-top: 1px solid rgba(255,255,255,0.05);
    }

    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-muted); }

</style>
</head>
<body>

    <header>
        <h1>Ascension</h1>
        <div class="subtitle">System Online</div>
    </header>

    <div class="main-layout">
        <!-- Sidebar -->
        <aside>
            <!-- Status Card -->
            <div class="status-card">
                <div class="level-display">
                    <span class="level-num">42</span>
                    <span class="level-label">LVL</span>
                </div>
                <div class="xp-container">
                    <div class="xp-labels">
                        <span>XP</span>
                        <span>62%</span>
                    </div>
                    <div class="xp-bar-bg">
                        <div class="xp-bar-fill"></div>
                    </div>
                </div>

                <div class="points-display">
                    <span class="points-label">Points</span>
                    <span class="points-val">3</span>
                </div>
            </div>

            <!-- Character Details -->
            <div class="character-details">
                <div class="char-header">
                    <h2 class="char-name">Kaelen Thorne</h2>
                    <div class="char-class">Duelist / Arcanist</div>
                </div>
                
                <div class="stat-row"><span>Strength</span><span>14</span></div>
                <div class="stat-row"><span>Dexterity</span><span>28</span></div>
                <div class="stat-row"><span>Intelligence</span><span>35</span></div>
                <div class="stat-row"><span>Vitality</span><span>12</span></div>
                <div class="stat-row"><span>Willpower</span><span>19</span></div>
                <div class="stat-row"><span>Perception</span><span>11</span></div>
            </div>
        </aside>

        <!-- Tree Canvas -->
        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <!-- SVG Definitions for Glow -->
                <svg style="position:absolute; width:0; height:0;">
                    <defs>
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                </svg>
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected via JS -->
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data (Expanded Grid) ---
    const skills = [
        // Root
        { id: 'root', x: 0, y: 0, name: "Archon's Spark", type: "Passive", desc: "The origin of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Tier 1
        { id: 'str1', x: -240, y: 240, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'int1', x: 0, y: 240, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", unlocked: true, req: 'root' },
        { id: 'dex1', x: 240, y: 240, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: false, req: 'root' },
        
        // Tier 2
        { id: 'str2', x: -480, y: 480, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str2b', x: -240, y: 480, name: "Iron Skin", type: "Passive", desc: "Reduces physical damage taken by 10%.", unlocked: true, req: 'str1' },
        { id: 'int2', x: 0, y: 480, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: true, req: 'int1' },
        { id: 'dex2', x: 240, y: 480, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: false, req: 'dex1' },
        { id: 'dex2b', x: 480, y: 480, name: "Shadow Step", type: "Active", desc: "Teleport 5 meters behind target.", unlocked: false, req: 'dex1' },

        // Tier 3
        { id: 'str3', x: -480, y: 720, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        { id: 'hybrid', x: 0, y: 720, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows dealing damage.", unlocked: false, req: 'int2' },
        { id: 'dex3', x: 480, y: 720, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        
        // Tier 4 (Deep)
        { id: 'str4', x: -720, y: 960, name: "Titan's Rage", type: "Ultimate", desc: "Double damage for 5 seconds.", unlocked: false, req: 'str3' },
        { id: 'int4', x: 0, y: 960, name: "Meteor Swarm", type: "Ultimate", desc: "Call down meteors on an area.", unlocked: false, req: 'hybrid' },
        { id: 'dex4', x: 720, y: 960, name: "Assassin", type: "Passive", desc: "Crit chance +20%.", unlocked: false, req: 'dex3' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Center the world initially
        // We want the root node (0,0) to be at the top center of the canvas
        panX = cw / 2;
        panY = 100;
        updateTransform();

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawLines();
    }

    // --- Circuit Board Line Drawing ---
    function drawLines() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    // Create a path with a 45-degree angle (Manhattan-ish routing)
                    const pathD = `M ${parent.x} ${parent.y} L ${parent.x} ${(parent.y + skill.y)/2} L ${skill.x} ${(parent.y + skill.y)/2} L ${skill.x} ${skill.y}`;
                    
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', pathD);
                    path.classList.add('connection-line');
                    
                    if (skill.unlocked) {
                        path.classList.add('active');
                    }
                    
                    svg.appendChild(path);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            tooltip.classList.add('active-style');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            tooltip.classList.remove('active-style');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        
        const x = e.clientX;
        const y = e.clientY;
        
        let left = x + 20;
        let top = y - 20;
        
        if (left + 300 > window.innerWidth) left = x - 320;
        if (top + 150 > window.innerHeight) top = y - 150;

        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        if (!skill.unlocked) {
             const parent = skills.find(s => s.id === skill.req);
             if (parent && parent.unlocked) {
                 skill.unlocked = true;
                 updateVisuals();
             }
        }
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            if (s.unlocked) {
                el.classList.add('unlocked');
                el.classList.remove('available');
            } else {
                el.classList.remove('unlocked');
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) {
                    el.classList.add('available');
                } else {
                    el.classList.remove('available');
                }
            }
        });
        drawLines();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0, panY = 0;
    let scale = 1;

    function updateTransform() {
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        updateTransform();
    });

    init();

</script>
</body>
</html>
