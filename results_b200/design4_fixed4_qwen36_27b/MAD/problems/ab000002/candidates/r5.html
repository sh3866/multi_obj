<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascension Protocol // REVISED</title>
<style>
    :root {
        /* Palette: Deep Slate & Celestial Gold */
        --bg-deep: #050505;
        --bg-panel: #111111;
        --bg-panel-gradient: linear-gradient(180deg, #161616 0%, #0a0a0a 100%);
        
        --accent-gold: #FFD700;
        --accent-gold-dim: #8a6d0b;
        --accent-gold-glow: rgba(255, 215, 0, 0.4);
        
        --text-main: #c4c9d4;
        --text-muted: #6b7280;
        --text-bright: #ffffff;
        
        /* Typography */
        /* Display: Serif (Trajan/Cinzel style) */
        --font-display: 'Cinzel', 'Trajan Pro', 'Palatino Linotype', 'Times New Roman', serif;
        /* Body: Geometric Sans (Exo 2/Rajdhani style) */
        --font-body: 'Rajdhani', 'Exo 2', 'Segoe UI', 'Arial', sans-serif;
        
        /* Dimensions */
        --sidebar-width: 250px; /* Reduced by ~30% */
        --node-size: 72px;
        --grid-gap: 120px; /* Rigid grid spacing */
    }

    /* Base Reset & Layout */
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }

    body {
        background-color: var(--bg-deep);
        /* Radial Gradient Background */
        background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #050505 100%);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* Noise Texture Overlay */
    .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 999;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Header --- */
    header {
        height: 80px;
        width: var(--sidebar-width);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 20px;
        background: var(--bg-panel);
        border-right: 1px solid rgba(255,255,255,0.05);
        border-bottom: 1px solid rgba(255,255,255,0.05);
        z-index: 20;
        flex-shrink: 0;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 1.4rem;
        font-weight: 400;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-bright);
        margin: 0;
    }

    .subtitle {
        font-family: var(--font-body);
        font-size: 0.65rem;
        font-weight: 600;
        color: var(--accent-gold);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.8;
        margin-top: 4px;
    }

    /* --- Layout Grid --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
    }

    /* --- Sidebar --- */
    aside {
        width: var(--sidebar-width);
        flex-shrink: 0;
        background: var(--bg-panel-gradient);
        border-right: 1px solid rgba(255,255,255,0.08);
        display: flex;
        flex-direction: column;
        z-index: 10;
        box-shadow: 5px 0 30px rgba(0,0,0,0.5);
    }

    /* Status Card (Level/XP/Points) */
    .status-card {
        padding: 32px 24px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(0,0,0,0.3);
        display: flex;
        flex-direction: column;
        gap: 24px; /* 8pt scale gap */
    }

    .level-display {
        display: flex;
        align-items: baseline;
        gap: 16px;
        margin: 0;
    }

    .level-num {
        font-family: var(--font-display);
        font-size: 48px; /* Significantly larger */
        line-height: 1;
        color: var(--text-bright);
        font-weight: 700;
        letter-spacing: -0.02em;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    .level-label {
        font-family: var(--font-body);
        font-size: 0.8rem;
        text-transform: uppercase;
        color: var(--accent-gold);
        letter-spacing: 0.15em;
        font-weight: 600;
        border: 1px solid var(--accent-gold-dim);
        padding: 2px 6px;
        border-radius: 2px;
    }

    /* XP Bar */
    .xp-container {
        margin: 0;
    }

    .xp-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        font-family: var(--font-body);
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .xp-bar-bg {
        height: 6px;
        background: #050507;
        border: 1px solid rgba(255,255,255,0.1);
        position: relative;
        border-radius: 2px;
        overflow: hidden;
        box-shadow: inset 0 1px 3px #000;
    }

    .xp-bar-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
        box-shadow: 0 0 10px var(--accent-gold-glow);
    }

    /* Points Section */
    .points-display {
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .points-label {
        font-size: 0.7rem;
        font-family: var(--font-body);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-muted);
        font-weight: 600;
    }

    .points-val {
        font-size: 24px;
        font-family: var(--font-display);
        font-weight: 700;
        color: var(--accent-gold);
        line-height: 1;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    /* Character Stats */
    .character-details {
        padding: 32px 24px;
        flex: 1;
        overflow-y: auto;
    }
    
    .char-header {
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-bright);
        letter-spacing: 0.02em;
        margin-bottom: 4px;
    }
    
    .char-class {
        color: var(--text-muted);
        font-size: 0.7rem;
        font-family: var(--font-body);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 600;
    }

    /* Stat Rows */
    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px; /* Fixed gap */
        font-size: 0.85rem;
        line-height: 24px; /* Fixed height */
    }
    
    .stat-row span:first-child { 
        color: var(--text-muted); 
        font-family: var(--font-body);
        text-transform: uppercase;
        letter-spacing: 0.02em;
        font-weight: 500; /* Medium weight */
    }
    
    .stat-row span:last-child { 
        font-weight: 700; 
        color: var(--text-bright);
        font-family: var(--font-body);
        font-size: 1rem;
        letter-spacing: 0.05em;
    }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background-color: var(--bg-deep);
    }

    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%; 
        height: 100%;
        transform-origin: 0 0;
    }

    /* --- Connections (Energy Conduits) --- */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: visible;
    }

    .connection-line {
        fill: none;
        stroke: #333; /* Inactive: Darker */
        stroke-width: 1px;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: stroke 0.5s ease, stroke-width 0.5s ease;
        opacity: 0.2; /* Inactive: 20% opacity */
    }

    .connection-line.active {
        stroke: var(--accent-gold);
        stroke-width: 2px;
        opacity: 1; /* Active: 100% opacity */
        filter: drop-shadow(0 0 3px var(--accent-gold));
    }

    /* --- Nodes (Tangible Objects) --- */
    .node {
        position: absolute;
        width: var(--node-size);
        height: var(--node-size);
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* The Shape (Octagon) */
    .node-shape {
        width: 100%;
        height: 100%;
        background: #111;
        /* Subtle Gradient for depth */
        background: linear-gradient(135deg, #2a2a2a 0%, #0a0a0a 100%);
        /* Chamfered corners */
        clip-path: polygon(15% 0%, 85% 0%, 100% 15%, 100% 85%, 85% 100%, 15% 100%, 0% 85%, 0% 15%);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #333;
        transition: all 0.3s ease;
    }

    /* Inner Bevel Layer (Creates the 3D rim) */
    .node-shape::before {
        content: '';
        position: absolute;
        inset: 2px;
        background: #000;
        clip-path: polygon(15% 0%, 85% 0%, 100% 15%, 100% 85%, 85% 100%, 15% 100%, 0% 85%, 0% 15%);
        z-index: 1;
        box-shadow: inset 0 0 10px #000;
        transition: background 0.3s ease;
    }
    
    /* Icon */
    .node-icon {
        width: 28px;
        height: 28px;
        fill: #444;
        opacity: 0.6;
        position: relative;
        z-index: 2;
        transition: all 0.3s ease;
    }

    /* --- Node States --- */
    
    /* Active/Unlocked: Luminous Gold */
    .node.unlocked .node-shape {
        background: linear-gradient(135deg, #2a2500 0%, #0a0a00 100%);
        border: 1px solid var(--accent-gold);
        /* Multi-layered bloom effect */
        box-shadow: 0 0 15px var(--accent-gold-glow), 0 0 30px rgba(255, 215, 0, 0.1);
    }
    
    .node.unlocked .node-shape::before {
        background: #1a1500;
        box-shadow: inset 0 0 5px rgba(255,215,0,0.2);
    }

    .node.unlocked .node-icon {
        fill: #fff;
        filter: drop-shadow(0 0 2px var(--accent-gold));
        opacity: 1;
    }
    
    /* Available (Hoverable) */
    .node.available .node-shape {
        border: 1px solid #555;
        background: linear-gradient(135deg, #333 0%, #111 100%);
    }
    
    .node.available:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }
    
    .node.available:hover .node-shape {
        border-color: #fff;
        background: rgba(255,255,255,0.08);
        box-shadow: 0 0 15px rgba(255,255,255,0.1);
    }
    
    .node.available:hover .node-shape::before {
        background: #1a1a1a;
    }

    .node.available:hover .node-icon {
        fill: var(--text-bright);
        opacity: 1;
    }

    /* Locked (Dimmed) */
    .node.locked .node-shape {
        opacity: 0.4;
        border-color: #1a1a1a;
    }
    .node.locked .node-icon {
        opacity: 0.3;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(15, 15, 19, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-left: 3px solid rgba(255, 255, 255, 0.1);
        padding: 24px;
        width: 300px;
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s, border-color 0.2s;
        z-index: 100;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        backdrop-filter: blur(8px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip.active-style {
        border-left-color: var(--accent-gold);
        border-color: rgba(255, 215, 0, 0.2);
    }

    .tooltip h3 {
        color: var(--text-bright);
        font-family: var(--font-display);
        margin-bottom: 8px;
        font-size: 1.1rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .tooltip .type {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--accent-gold);
        margin-bottom: 16px;
        letter-spacing: 0.15em;
        font-weight: 700;
        display: inline-block;
        background: rgba(255, 215, 0, 0.1);
        padding: 4px 8px;
        border-radius: 2px;
    }

    .tooltip p {
        font-size: 0.85rem;
        line-height: 1.6;
        color: #cbd5e1;
        font-family: var(--font-body);
        font-weight: 400;
    }

    .tooltip .req {
        margin-top: 16px;
        font-size: 0.7rem;
        color: #ef4444;
        font-family: var(--font-body);
        text-transform: uppercase;
        display: none;
        padding-top: 12px;
        border-top: 1px solid rgba(255,255,255,0.05);
        font-weight: 600;
    }

    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-muted); }

</style>
</head>
<body>

    <!-- Noise Texture Overlay -->
    <div class="noise-overlay"></div>

    <header>
        <h1>Ascension</h1>
        <div class="subtitle">Protocol Active</div>
    </header>

    <div class="main-layout">
        <!-- Sidebar -->
        <aside>
            <!-- Status Card (Top Block) -->
            <div class="status-card">
                <div class="level-display">
                    <span class="level-num">42</span>
                    <span class="level-label">Level</span>
                </div>
                <div class="xp-container">
                    <div class="xp-labels">
                        <span>Experience</span>
                        <span>62%</span>
                    </div>
                    <div class="xp-bar-bg">
                        <div class="xp-bar-fill"></div>
                    </div>
                </div>

                <div class="points-display">
                    <span class="points-label">Skill Points</span>
                    <span class="points-val">3</span>
                </div>
            </div>

            <!-- Character Details (Bottom Block) -->
            <div class="character-details">
                <div class="char-header">
                    <h2 class="char-name">Kaelen Thorne</h2>
                    <div class="char-class">Duelist / Arcanist</div>
                </div>
                
                <div class="stat-row"><span>Strength</span><span>14</span></div>
                <div class="stat-row"><span>Dexterity</span><span>28</span></div>
                <div class="stat-row"><span>Intelligence</span><span>35</span></div>
                <div class="stat-row"><span>Vitality</span><span>12</span></div>
                <div class="stat-row"><span>Willpower</span><span>19</span></div>
                <div class="stat-row"><span>Perception</span><span>11</span></div>
            </div>
        </aside>

        <!-- Tree Canvas -->
        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected via JS -->
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data (Expanded Grid for Balance) ---
    // Using a consistent 120px grid spacing
    const skills = [
        // Root
        { id: 'root', x: 0, y: 0, name: "Archon's Spark", type: "Passive", desc: "The origin of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Tier 1
        { id: 'str1', x: -360, y: 360, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'int1', x: 0, y: 360, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", unlocked: true, req: 'root' },
        { id: 'dex1', x: 360, y: 360, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: false, req: 'root' },
        
        // Tier 2
        { id: 'str2', x: -720, y: 720, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str2b', x: -360, y: 720, name: "Iron Skin", type: "Passive", desc: "Reduces physical damage taken by 10%.", unlocked: true, req: 'str1' },
        { id: 'int2', x: 0, y: 720, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: true, req: 'int1' },
        { id: 'dex2', x: 360, y: 720, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: false, req: 'dex1' },
        { id: 'dex2b', x: 720, y: 720, name: "Shadow Step", type: "Active", desc: "Teleport 5 meters behind target.", unlocked: false, req: 'dex1' },

        // Tier 3
        { id: 'str3', x: -720, y: 1080, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        { id: 'hybrid', x: 0, y: 1080, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows dealing damage.", unlocked: false, req: 'int2' },
        { id: 'dex3', x: 720, y: 1080, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        
        // Tier 4 (Deep)
        { id: 'str4', x: -1080, y: 1440, name: "Titan's Rage", type: "Ultimate", desc: "Double damage for 5 seconds.", unlocked: false, req: 'str3' },
        { id: 'int4', x: 0, y: 1440, name: "Meteor Swarm", type: "Ultimate", desc: "Call down meteors on an area.", unlocked: false, req: 'hybrid' },
        { id: 'dex4', x: 1080, y: 1440, name: "Assassin", type: "Passive", desc: "Crit chance +20%.", unlocked: false, req: 'dex3' },

        // --- Placeholders to Balance Layout (Right Side) ---
        { id: 'ph1', x: 1080, y: 360, name: "Uncharted", type: "Locked", desc: "Path not yet discovered.", unlocked: false, req: null, placeholder: true },
        { id: 'ph2', x: 1440, y: 720, name: "Uncharted", type: "Locked", desc: "Path not yet discovered.", unlocked: false, req: null, placeholder: true },
        { id: 'ph3', x: 1440, y: 1080, name: "Uncharted", type: "Locked", desc: "Path not yet discovered.", unlocked: false, req: null, placeholder: true }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z",
        placeholder: "M12 17m-2 0a2 2 0 1 0 4 0 2 2 0 1 0-4 0M12 9v4"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Center the world initially
        // Offset X slightly left to account for sidebar, but focus on tree center
        panX = cw / 2 - 100; 
        panY = 150;
        updateTransform();

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            
            let stateClass = 'locked';
            if (skill.unlocked) stateClass = 'unlocked';
            else if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent && parent.unlocked) stateClass = 'available';
            }

            node.className = `node ${stateClass}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.placeholder) iconPath = icons.placeholder;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawLines();
    }

    // --- Connection Line Drawing ---
    // Adjusted to terminate at the outer edge of the node borders
    function drawLines() {
        svg.innerHTML = '';
        const halfNodeSize = 36; // var(--node-size) / 2

        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    // Calculate start and end points relative to node centers
                    const startX = parent.x;
                    const startY = parent.y;
                    const endX = skill.x;
                    const endY = skill.y;

                    // Calculate the midpoint
                    const midY = (startY + endY) / 2;

                    // Adjust start and end points to be at the edge of the octagon
                    // Since our lines are Manhattan style (Vertical -> Horizontal -> Vertical),
                    // we adjust the vertical segments.
                    
                    // Start point (Bottom of parent)
                    const lineStartY = startY + halfNodeSize;
                    
                    // End point (Top of child)
                    const lineEndY = endY - halfNodeSize;
                    
                    // Midpoint Y needs to be adjusted based on the new endpoints if we want the bend exactly halfway between edges
                    const lineMidY = (lineStartY + lineEndY) / 2;

                    // Create a path with a 45-degree angle (Manhattan-ish routing)
                    // M StartX StartY -> L StartX MidY -> L EndX MidY -> L EndX EndY
                    const pathD = `M ${startX} ${lineStartY} L ${startX} ${lineMidY} L ${endX} ${lineMidY} L ${endX} ${lineEndY}`;
                    
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', pathD);
                    path.classList.add('connection-line');
                    
                    if (skill.unlocked) {
                        path.classList.add('active');
                    }
                    
                    svg.appendChild(path);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            tooltip.classList.add('active-style');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            tooltip.classList.remove('active-style');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = reqSkill ? `Requires: ${reqSkill.name}` : "Locked Path";
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        
        const x = e.clientX;
        const y = e.clientY;
        
        let left = x + 20;
        let top = y - 20;
        
        if (left + 320 > window.innerWidth) left = x - 340;
        if (top + 200 > window.innerHeight) top = y - 200;

        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        if (!skill.unlocked && !skill.placeholder) {
             const parent = skills.find(s => s.id === skill.req);
             if (parent && parent.unlocked) {
                 skill.unlocked = true;
                 updateVisuals();
             }
        }
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            if (s.unlocked) {
                el.classList.add('unlocked');
                el.classList.remove('available', 'locked');
            } else {
                el.classList.remove('unlocked');
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) {
                    el.classList.add('available');
                    el.classList.remove('locked');
                } else {
                    el.classList.remove('available');
                    el.classList.add('locked');
                }
            }
        });
        drawLines();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0, panY = 0;
    let scale = 1;

    function updateTransform() {
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        updateTransform();
    });

    init();

</script>
</body>
</html>
