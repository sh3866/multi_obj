<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascension Protocol</title>
<style>
    :root {
        /* Palette: Midnight & Burnt Amber */
        --bg-deep: #05070a;
        --bg-panel: rgba(12, 16, 24, 0.92);
        --border-steel: rgba(100, 116, 139, 0.4);
        
        --accent-amber: #FFB300;
        --accent-amber-dim: #b37b00;
        --accent-glow: rgba(255, 179, 0, 0.35);
        
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        
        /* Typography */
        --font-display: 'Oswald', 'Teko', 'Segoe UI Black', sans-serif;
        --font-body: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        
        /* Dimensions */
        --sidebar-width: 280px;
    }

    /* Base Reset & Layout */
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        /* Deep Charcoal/Midnight Radial + Noise Texture */
        background-image: 
            radial-gradient(circle at 50% 30%, #1e293b 0%, #020406 85%),
            url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Header --- */
    header {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 10;
        background: linear-gradient(to bottom, rgba(5,7,10,0.9), transparent);
        pointer-events: none; /* Let clicks pass through to canvas */
    }

    h1 {
        font-family: var(--font-display);
        font-size: 2.2rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        margin: 0;
    }

    .subtitle {
        font-family: var(--font-display);
        font-size: 1rem;
        color: var(--accent-amber);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.9;
        margin-top: -5px;
    }

    /* --- Layout Grid --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
    }

    /* --- Sidebar (Rail Strategy: 280px) --- */
    aside {
        width: var(--sidebar-width);
        flex-shrink: 0;
        background: var(--bg-panel);
        border-right: 1px solid var(--border-steel);
        padding: 25px;
        display: flex;
        flex-direction: column;
        gap: 25px;
        backdrop-filter: blur(12px);
        z-index: 5;
        box-shadow: 4px 0 25px rgba(0,0,0,0.6);
    }

    /* Stat Blocks */
    .level-display {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        margin-bottom: 5px;
    }

    .level-num {
        font-family: var(--font-display);
        font-size: 3.5rem;
        line-height: 1;
        color: var(--text-main);
        font-weight: 700;
    }

    .level-label {
        font-size: 1rem;
        font-family: var(--font-display);
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 8px;
        letter-spacing: 0.05em;
    }

    /* XP Bar */
    .xp-container {
        margin-top: 5px;
    }

    .xp-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        font-family: var(--font-display);
        color: var(--text-muted);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .xp-bar-bg {
        height: 6px;
        background: #1e293b;
        border-radius: 2px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
    }

    .xp-bar-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--accent-amber-dim), var(--accent-amber));
        box-shadow: 0 0 8px var(--accent-glow);
        position: relative;
    }
    
    /* Shimmer Animation */
    .xp-bar-fill::after {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
        width: 100%;
        transform: translateX(-100%);
        animation: shimmer 3s infinite;
    }

    /* Available Points */
    .points-display {
        background: rgba(0,0,0,0.4);
        padding: 15px;
        border: 1px solid var(--border-steel);
        border-left: 3px solid var(--accent-amber);
        text-align: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .points-val {
        font-size: 2.5rem;
        font-family: var(--font-display);
        font-weight: 700;
        color: var(--accent-amber);
        display: block;
        line-height: 1;
    }

    .points-label {
        font-size: 0.7rem;
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-muted);
        margin-top: 4px;
    }

    /* Character Stats Table */
    .character-details {
        margin-top: auto;
        border-top: 1px solid var(--border-steel);
        padding-top: 20px;
    }
    
    .char-name {
        font-family: var(--font-display);
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin-bottom: 2px;
    }
    
    .char-class {
        color: var(--accent-amber-dim);
        font-size: 0.8rem;
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 20px;
    }

    /* Tabular Stat Layout */
    .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 0.9rem;
        align-items: baseline;
    }
    
    .stat-row span:first-child { 
        color: var(--text-muted); 
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
    }
    
    .stat-row span:last-child { 
        font-weight: 700; 
        color: var(--text-main);
        font-family: var(--font-display);
        font-size: 1.1rem;
    }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, rgba(20,30,40,0.3), transparent 70%);
    }

    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 0;
        left: 0;
        width: 1400px; /* Wide canvas */
        height: 1200px;
        transform-origin: center center;
        transition: transform 0.1s linear;
    }

    /* --- Connections (SVG) --- */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    .connection-line {
        stroke: var(--border-steel);
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        transition: stroke 0.3s ease, filter 0.3s ease, stroke-dashoffset 0.5s ease;
    }

    .connection-line.active {
        stroke: var(--accent-amber);
        filter: drop-shadow(0 0 4px var(--accent-amber));
        stroke-width: 3;
    }

    /* --- Nodes (Sigils) --- */
    .node {
        position: absolute;
        width: 70px;
        height: 70px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* The Hexagon Shape */
    .node-shape {
        width: 100%;
        height: 100%;
        background: #11151c;
        /* CSS Clip Path for Hexagon */
        clip-path: polygon(30% 0%, 70% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* Inner border simulation via pseudo-element inside clipped area */
    .node-shape::before {
        content: '';
        position: absolute;
        inset: 3px;
        background: #0a0d12;
        clip-path: polygon(30% 0%, 70% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%);
        z-index: 1;
    }
    
    /* Border Color Layer */
    .node-shape::after {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--border-steel);
        clip-path: polygon(30% 0%, 70% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%);
        z-index: 0;
        transition: background 0.3s ease;
    }

    .node-icon {
        width: 28px;
        height: 28px;
        fill: var(--text-muted);
        opacity: 0.4;
        position: relative;
        z-index: 2;
        transition: all 0.3s ease;
    }

    /* --- Node States --- */
    
    /* Active/Unlocked: Burnt Amber Glow */
    .node.unlocked .node-shape::after {
        background: var(--accent-amber);
    }
    
    .node.unlocked .node-shape {
        background: radial-gradient(circle at center, #452a05, #2c1e0a);
        box-shadow: 0 0 20px var(--accent-glow);
    }

    .node.unlocked .node-icon {
        fill: #fff;
        filter: drop-shadow(0 0 2px var(--accent-amber));
        opacity: 1;
    }
    
    /* Available (Hoverable) */
    .node.available .node-shape::after {
        background: #475569; /* Steel Grey */
    }
    
    .node.available:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }
    
    .node.available:hover .node-shape {
        background: #1e293b;
    }

    .node.available:hover .node-shape::after {
        background: var(--text-muted);
    }
    
    .node.available:hover .node-icon {
        fill: var(--text-main);
        opacity: 0.8;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(10, 14, 20, 0.95);
        border: 1px solid var(--border-steel);
        border-left: 3px solid var(--border-steel);
        padding: 16px;
        width: 300px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s, border-color 0.2s;
        z-index: 100;
        box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        backdrop-filter: blur(8px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip.active-style {
        border-left-color: var(--accent-amber);
    }

    .tooltip h3 {
        color: var(--text-main);
        font-family: var(--font-display);
        margin-bottom: 4px;
        font-size: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 0.02em;
    }

    .tooltip .type {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--accent-amber);
        margin-bottom: 12px;
        letter-spacing: 0.1em;
        font-weight: 700;
    }

    .tooltip p {
        font-size: 0.85rem;
        line-height: 1.5;
        color: #cbd5e1;
    }

    .tooltip .req {
        margin-top: 12px;
        font-size: 0.75rem;
        color: #ef4444;
        font-family: var(--font-display);
        text-transform: uppercase;
        display: none;
        padding-top: 8px;
        border-top: 1px solid rgba(255,255,255,0.1);
    }

    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-muted); }

    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }
</style>
</head>
<body>

    <header>
        <div>
            <h1>Ascension Protocol</h1>
            <div class="subtitle">Class: Void Walker</div>
        </div>
    </header>

    <div class="main-layout">
        <!-- Sidebar -->
        <aside>
            <div class="stat-block">
                <div class="level-display">
                    <span class="level-num">42</span>
                    <span class="level-label">Level</span>
                </div>
                <div class="xp-container">
                    <div class="xp-labels">
                        <span>XP Progress</span>
                        <span>12,450 / 20,000</span>
                    </div>
                    <div class="xp-bar-bg">
                        <div class="xp-bar-fill"></div>
                    </div>
                </div>
            </div>

            <div class="points-display">
                <span class="points-val">3</span>
                <span class="points-label">Skill Points</span>
            </div>

            <div class="character-details">
                <h2 class="char-name">Kaelen Thorne</h2>
                <div class="char-class">Duelist / Arcanist</div>
                
                <!-- Tabular Stats -->
                <div class="stat-row"><span>Strength</span><span>14</span></div>
                <div class="stat-row"><span>Dexterity</span><span>28</span></div>
                <div class="stat-row"><span>Intelligence</span><span>35</span></div>
                <div class="stat-row"><span>Vitality</span><span>12</span></div>
                <div class="stat-row"><span>Willpower</span><span>19</span></div>
            </div>
        </aside>

        <!-- Tree Canvas -->
        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected via JS -->
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data ---
    const skills = [
        { id: 'root', x: 700, y: 100, name: "Archon's Spark", type: "Passive", desc: "The origin of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Tier 1
        { id: 'str1', x: 500, y: 280, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'dex1', x: 900, y: 280, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: true, req: 'root' },
        { id: 'int1', x: 700, y: 280, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", unlocked: false, req: 'root' },
        
        // Tier 2
        { id: 'str2', x: 350, y: 450, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'int2', x: 600, y: 450, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: false, req: 'int1' },
        { id: 'dex2', x: 1050, y: 450, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: true, req: 'dex1' },
        
        // Tier 3
        { id: 'str3', x: 200, y: 620, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        { id: 'hybrid', x: 700, y: 620, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows.", unlocked: false, req: 'int2' },
        { id: 'dex3', x: 1200, y: 620, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z", // Star
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z", // Lightning
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z" // Eye/Orb
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        // Center the world initially
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Initial transform to center the 1400x1200 world
        // Offset slightly to account for sidebar
        const startX = (cw / 2) - 700; 
        const startY = (ch / 2) - 600;

        // Apply initial pan
        panX = startX;
        panY = startY;
        updateTransform();

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Determine Icon
            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawLines();
    }

    function drawLines() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            tooltip.classList.add('active-style');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            tooltip.classList.remove('active-style');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        
        // Positioning (keep within screen)
        const x = e.clientX;
        const y = e.clientY;
        
        let left = x + 20;
        let top = y - 20;
        
        if (left + 300 > window.innerWidth) left = x - 320;
        if (top + 150 > window.innerHeight) top = y - 150;

        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        // Unlock logic
        if (!skill.unlocked) {
             const parent = skills.find(s => s.id === skill.req);
             if (parent && parent.unlocked) {
                 skill.unlocked = true;
                 updateVisuals();
             }
        }
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            if (s.unlocked) {
                el.classList.add('unlocked');
                el.classList.remove('available');
            } else {
                el.classList.remove('unlocked');
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) {
                    el.classList.add('available');
                } else {
                    el.classList.remove('available');
                }
            }
        });
        drawLines();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0, panY = 0;
    let scale = 1;

    function updateTransform() {
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        // Zoom towards mouse pointer
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        updateTransform();
    });

    // Handle resize to keep centered roughly
    window.addEventListener('resize', () => {
        // Optional: re-center logic could go here
    });

    init();

</script>
</body>
</html>
