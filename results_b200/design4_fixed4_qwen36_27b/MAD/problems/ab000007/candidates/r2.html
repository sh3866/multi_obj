<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aether Catch</title>
<style>
  :root {
    /* Critique Palette: Deep Violet, Midnight Blue, Bioluminescent accents */
    --bg-deep: #050510;
    --bg-violet: #1a103c;
    --bg-midnight: #0f172a;
    
    /* Bioluminescent Palette */
    --accent-teal: #00f2ff;
    --accent-lavender: #d9a0ff;
    --accent-amber: #ffaa00;
    
    /* UI Colors */
    --text-main: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.6);
    --glass-bg: rgba(10, 10, 25, 0.65);
    --glass-border: rgba(255, 255, 255, 0.12);
    
    /* Dimensions */
    --ui-margin: 32px;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  /* --- Background Atmosphere --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    /* Critique 4: Deep Violet-to-Midnight Blue Radial Gradient */
    background: radial-gradient(circle at 50% 20%, var(--bg-violet) 0%, var(--bg-midnight) 60%, var(--bg-deep) 100%);
    overflow: hidden;
  }

  /* Critique 4: Noise Texture Overlay */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.05;
    pointer-events: none;
    z-index: 1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Nebula/Cloud effects */
  .nebula {
    position: absolute;
    width: 120%; height: 120%;
    top: -10%; left: -10%;
    background: 
      radial-gradient(circle at 20% 30%, rgba(217, 160, 255, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0, 242, 255, 0.1) 0%, transparent 40%);
    z-index: 1;
    pointer-events: none;
    animation: pulseNebula 15s ease-in-out infinite alternate;
  }

  @keyframes pulseNebula {
    0% { opacity: 0.6; transform: scale(1); }
    100% { opacity: 1; transform: scale(1.05); }
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    /* Critique 1: Strict 32px Margin */
    padding: var(--ui-margin); 
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  /* Critique 3: Stylized Geometric Typography */
  h1 {
    font-family: "Orbitron", "Exo 2", "Impact", sans-serif;
    font-size: 3.5rem;
    font-weight: 800;
    margin: 0;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    line-height: 0.9;
    color: white;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
  }

  .subtitle {
    font-family: "Orbitron", sans-serif;
    font-size: 0.85rem;
    color: var(--accent-teal);
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-top: 0.5rem;
    text-shadow: 0 0 10px rgba(0, 242, 255, 0.6);
  }

  /* Critique 6: HUD Styling with Glassmorphism & Accent Line */
  .hud-container {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .hud-accent-line {
    width: 40px;
    height: 2px;
    background: var(--accent-teal);
    box-shadow: 0 0 8px var(--accent-teal);
    margin-bottom: 4px;
  }

  .hud-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    padding: 0.6rem 1.2rem;
    border-radius: 8px; /* Slightly sharper corners for sci-fi feel */
    display: flex;
    align-items: center;
    gap: 0.8rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    min-width: 120px;
  }

  .stat-icon {
    width: 24px; height: 24px;
    fill: var(--accent-amber);
    filter: drop-shadow(0 0 4px var(--accent-amber));
  }

  .stat-value {
    font-family: "Orbitron", monospace;
    font-size: 1.6rem;
    color: white;
    font-weight: 700;
    line-height: 1;
  }

  .stat-label {
    font-family: "Orbitron", sans-serif;
    font-size: 0.6rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 3px;
  }

  /* Footer */
  .footer {
    display: flex;
    /* Critique 2: Relocate Button to Bottom-Right */
    justify-content: flex-end;
    width: 100%;
    pointer-events: auto;
  }

  /* Critique 3 & 6: Premium Button Styling */
  .btn-main {
    background: rgba(0, 242, 255, 0.05);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(0, 242, 255, 0.3);
    color: var(--accent-teal);
    font-family: "Orbitron", sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 1rem 2.5rem;
    border-radius: 4px; /* Sharper corners */
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
  }

  .btn-main::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 4px; height: 100%;
    background: var(--accent-teal);
    box-shadow: 0 0 10px var(--accent-teal);
  }

  .btn-main:hover {
    background: rgba(0, 242, 255, 0.15);
    border-color: var(--accent-teal);
    box-shadow: 0 0 25px rgba(0, 242, 255, 0.3);
    color: white;
    text-shadow: 0 0 8px var(--accent-teal);
  }

  .btn-main:active {
    transform: scale(0.98);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0,0,0,0.8);
    border: 1px solid var(--accent-amber);
    color: var(--accent-amber);
    padding: 1rem 2rem;
    border-radius: 2px;
    font-family: "Orbitron", sans-serif;
    letter-spacing: 0.15em;
    font-size: 1.2rem;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(255, 170, 0, 0.2);
    text-align: center;
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    :root { --ui-margin: 24px; }
    h1 { font-size: 2.2rem; }
    .btn-main { padding: 0.8rem 1.5rem; font-size: 0.75rem; width: auto; }
    .hud-panel { padding: 0.5rem 1rem; min-width: 100px; }
    .stat-value { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="noise-overlay"></div>
  <div class="nebula"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Aether</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-container">
        <!-- Critique 6: Visual Link Accent -->
        <div class="hud-accent-line"></div>
        <div class="hud-panel">
          <svg class="stat-icon" viewBox="0 0 24 24">
            <!-- Hexagon Icon -->
            <path d="M12 2L20.66 7V17L12 22L3.34 17V7L12 2Z" />
          </svg>
          <div>
            <div class="stat-value" id="scoreDisplay">0</div>
            <div class="stat-label">Specimens</div>
          </div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Focus: Distinct Creature Types (Critique 5), Bioluminescence, Organic Movement.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;

  // Critique 5: Cohesive Bioluminescent Palette
  const PALETTE = {
    teal: { main: '#00f2ff', light: '#ccfcff' },
    lavender: { main: '#d9a0ff', light: '#f3daff' },
    amber: { main: '#ffaa00', light: '#ffdd88' }
  };

  const CREATURE_COUNT = 8;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, colorObj) {
      this.x = x;
      this.y = y;
      this.color = colorObj.main;
      this.lightColor = colorObj.light;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.92; // Friction
      this.vy *= 0.92;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.lightColor;
      ctx.shadowBlur = 10;
      ctx.shadowColor = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1.0;
    }
  }

  // Critique 5: Differentiate Creature Assets
  class Creature {
    constructor() {
      this.type = Math.floor(Math.random() * 3); // 0: Crystalline, 1: Gaseous, 2: Organic
      this.colorKey = Object.keys(PALETTE)[Math.floor(Math.random() * 3)];
      this.color = PALETTE[this.colorKey];
      this.reset();
      // Random initial positions
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    }

    reset() {
      // Spawn outside view
      this.x = Math.random() < 0.5 ? -100 : width + 100;
      this.y = Math.random() * height;
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.baseRadius = Math.random() * 15 + 20;
      this.time = Math.random() * 100;
      this.isCaught = false;
      this.rotation = Math.random() * Math.PI * 2;
      this.rotSpeed = (Math.random() - 0.5) * 0.02;
    }

    update() {
      if (this.isCaught) return;

      this.time += 0.05;
      this.rotation += this.rotSpeed;

      // Movement
      this.x += this.vx;
      this.y += this.vy;

      // Organic drift
      this.x += Math.sin(this.time * 0.5) * 0.8;
      this.y += Math.cos(this.time * 0.3) * 0.8;

      // Bounce off walls
      if (this.x < -50) this.vx = Math.abs(this.vx);
      if (this.x > width + 50) this.vx = -Math.abs(this.vx);
      if (this.y < -50) this.vy = Math.abs(this.vy);
      if (this.y > height + 50) this.vy = -Math.abs(this.vy);

      // Avoid Mouse (Net)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 200) {
        const force = (200 - dist) / 200;
        this.vx += (dx / dist) * force * 0.5;
        this.vy += (dy / dist) * force * 0.5;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 4) {
        this.vx = (this.vx / speed) * 4;
        this.vy = (this.vy / speed) * 4;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);

      // Common Glow
      ctx.shadowBlur = 20;
      ctx.shadowColor = this.color.main;

      if (this.type === 0) {
        // --- Type 0: Crystalline ---
        ctx.fillStyle = this.color.main;
        ctx.strokeStyle = this.color.light;
        ctx.lineWidth = 2;
        
        const sides = 6;
        const r = this.baseRadius;
        const pulse = Math.sin(this.time * 3) * 2;
        
        ctx.beginPath();
        for (let i = 0; i <= sides; i++) {
          const angle = (i / sides) * Math.PI * 2;
          const rad = r + pulse;
          const px = Math.cos(angle) * rad;
          const py = Math.sin(angle) * rad;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Inner facets
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(r*0.5, -r*0.5);
        ctx.lineTo(r*0.5, r*0.5);
        ctx.closePath();
        ctx.fillStyle = this.color.light;
        ctx.globalAlpha = 0.4;
        ctx.fill();

      } else if (this.type === 1) {
        // --- Type 1: Gaseous / Nebula ---
        const r = this.baseRadius;
        const breath = Math.sin(this.time * 2) * 0.1 + 1;
        ctx.scale(breath, breath);

        // Soft gradient cloud
        const grad = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r);
        grad.addColorStop(0, this.color.light);
        grad.addColorStop(0.4, this.color.main);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        // Irregular cloud shape
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        
        // Wisp particles inside
        ctx.fillStyle = 'white';
        for(let i=0; i<3; i++) {
            const ox = Math.sin(this.time + i) * (r*0.3);
            const oy = Math.cos(this.time * 1.3 + i) * (r*0.3);
            ctx.beginPath();
            ctx.arc(ox, oy, 2, 0, Math.PI*2);
            ctx.fill();
        }

      } else {
        // --- Type 2: Organic / Jellyfish ---
        const r = this.baseRadius;
        ctx.fillStyle = this.color.main;
        
        // Head
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        // Tentacles
        ctx.strokeStyle = this.color.main;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        
        for(let i=0; i<4; i++) {
            const angle = (i/4) * Math.PI * 2 + this.time;
            const startX = Math.cos(angle) * r * 0.8;
            const startY = Math.sin(angle) * r * 0.8;
            
            const endX = startX + Math.sin(this.time * 5 + i) * 15;
            const endY = startY + Math.cos(this.time * 5 + i) * 15 + 20;

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(startX + (endX-startX)/2, startY + 10, endX, endY);
            ctx.stroke();
        }
        
        // Eyes
        ctx.fillStyle = 'black';
        ctx.beginPath();
        ctx.arc(-r*0.3, -r*0.2, r*0.1, 0, Math.PI*2);
        ctx.arc(r*0.3, -r*0.2, r*0.1, 0, Math.PI*2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 80; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<30; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1000);

    // Respawn logic
    setTimeout(() => {
      creature.reset();
    }, 2500);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    // Draw the player's net/cursor
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Glow
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#00f2ff';
    
    // Net Shape (Futuristic Geometric Reticle)
    const time = Date.now() * 0.002;
    const rotation = Math.sin(time) * 0.1;
    
    ctx.rotate(rotation);
    
    // Outer Ring
    ctx.strokeStyle = isMouseDown ? '#ffffff' : 'rgba(0, 242, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    // Hexagon shape for net
    for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2;
        const r = 70;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i===0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.stroke();
    
    // Inner Targeting Lines
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-80, 0); ctx.lineTo(-20, 0);
    ctx.moveTo(20, 0); ctx.lineTo(80, 0);
    ctx.moveTo(0, -80); ctx.lineTo(0, -20);
    ctx.moveTo(0, 20); ctx.lineTo(0, 80);
    ctx.stroke();

    // "Sucking" effect if held down
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 40, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
