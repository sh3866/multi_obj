<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aether: Capture & Collection</title>
<style>
  :root {
    /* Palette - Refined for Depth & Contrast */
    --bg-deep: #030108; /* Near-black violet */
    --bg-violet: #140924;
    --bg-indigo: #23134a;
    
    --accent-cyan: #00f3ff; /* High contrast CTA */
    --accent-purple: #bc13fe;
    --accent-amber: #ffaa00;
    
    --text-main: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.6);
    
    /* Dimensions - Critique 5: Strict 24px Global Margin */
    --ui-margin: 24px; 
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: var(--text-main);
    overflow: hidden;
    /* Critique 1: Technical/System fonts for UI, Serif for Title */
    font-family: 'Courier New', Courier, monospace;
  }

  /* --- Background Atmosphere --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    /* Critique 4: Deep Radial Gradient */
    background: radial-gradient(circle at 60% 40%, var(--bg-indigo) 0%, var(--bg-violet) 40%, var(--bg-deep) 100%);
    overflow: hidden;
  }

  /* Noise Texture Overlay */
  .noise-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.07;
    pointer-events: none;
    z-index: 1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none; /* Custom Net Cursor */
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    /* Critique 5: 24px Safe Zone */
    padding: var(--ui-margin); 
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  /* Critique 1: Distinct High-Contrast Serif Title */
  h1 {
    font-family: 'Playfair Display', 'Cinzel', 'Times New Roman', serif;
    font-size: 4rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
    line-height: 1;
    color: white;
    text-shadow: 0 0 20px rgba(188, 19, 254, 0.4);
  }

  /* Critique 1: Tracked-out Monospace Subtitle */
  .subtitle {
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.85rem;
    color: var(--accent-cyan);
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  /* HUD */
  .hud-container {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0;
  }

  .hud-panel {
    /* Glass-morphism */
    background: rgba(5, 2, 15, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 10px 20px;
    border-radius: 4px; /* Sharper corners for technical feel */
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .stat-icon {
    width: 18px; height: 18px;
    fill: var(--accent-amber);
    filter: drop-shadow(0 0 4px var(--accent-amber));
  }

  .stat-value {
    font-family: 'Courier New', monospace;
    font-size: 1.5rem;
    color: white;
    font-weight: 700;
    line-height: 1;
    min-width: 30px;
    text-align: right;
  }

  .stat-label {
    font-family: 'Courier New', monospace;
    font-size: 0.65rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
  }

  /* Footer */
  .footer {
    display: flex;
    /* Critique 2: Button Bottom-Center to anchor weight */
    justify-content: center;
    width: 100%;
    pointer-events: auto;
  }

  /* Critique 5: Solid High-Contrast CTA Button */
  .btn-main {
    background: var(--accent-cyan);
    color: #000;
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    font-weight: 900;
    padding: 14px 48px;
    border: none;
    border-radius: 2px; /* Sharp/Technical */
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.15em; 
    transition: all 0.2s ease;
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
    position: relative;
  }

  .btn-main:hover {
    background: #fff;
    box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
    transform: translateY(-2px);
  }

  .btn-main:active {
    transform: scale(0.98);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0,0,0,0.7);
    border: 1px solid var(--accent-amber);
    color: var(--accent-amber);
    padding: 0.8rem 2rem;
    border-radius: 0px;
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    box-shadow: 0 0 30px rgba(255, 170, 0, 0.1);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    h1 { font-size: 2.8rem; }
    .btn-main { padding: 12px 32px; font-size: 0.8rem; }
    .hud-panel { padding: 8px 14px; }
    .stat-value { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="noise-overlay"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <!-- Critique 1: Title Top-Left -->
      <div class="brand">
        <h1>Aether</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      
      <!-- Critique 1: HUD Top-Right -->
      <div class="hud-container">
        <div class="hud-panel">
          <svg class="stat-icon" viewBox="0 0 24 24">
            <!-- Hexagon Icon -->
            <path d="M12 2L20.66 7V17L12 22L3.34 17V7L12 2Z" />
          </svg>
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Specimens</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured</div>

    <!-- Critique 2: Button Bottom-Center -->
    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let stars = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;

  const PALETTE = {
    teal: { main: '#00f2ff', light: '#ccfcff', glow: 'rgba(0, 242, 255, 0.6)' },
    purple: { main: '#bc13fe', light: '#f3daff', glow: 'rgba(188, 19, 254, 0.6)' },
    amber: { main: '#ffaa00', light: '#ffdd88', glow: 'rgba(255, 170, 0, 0.6)' }
  };

  const CREATURE_COUNT = 7;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initStars();
  }
  window.addEventListener('resize', resize);

  // --- Starfield Background ---
  function initStars() {
    stars = [];
    for(let i=0; i<80; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 1.5,
        alpha: Math.random(),
        speed: Math.random() * 0.05 + 0.01
      });
    }
  }

  function drawStars() {
    ctx.fillStyle = 'white';
    stars.forEach(star => {
      star.alpha += star.speed;
      ctx.globalAlpha = Math.abs(Math.sin(star.alpha));
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1.0;
  }

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, colorObj) {
      this.x = x;
      this.y = y;
      this.color = colorObj.main;
      this.lightColor = colorObj.light;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.015;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.94; 
      this.vy *= 0.94;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.lightColor;
      ctx.shadowBlur = 10;
      ctx.shadowColor = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor(index, total) {
      // Critique 3: Distinct Biological Taxonomy
      this.type = index % 3; // Cycle through types for variety
      
      // Assign colors based on type for visual cohesion
      if(this.type === 0) this.color = PALETTE.teal;
      else if(this.type === 1) this.color = PALETTE.purple;
      else this.color = PALETTE.amber;

      // Critique 2: Diagonal Flow Initialization
      // Spread them from top-left to bottom-right
      const progress = index / total;
      const margin = 100;
      
      this.x = margin + (width - margin*2) * progress + (Math.random() * 100 - 50);
      this.y = margin + (height - margin*2) * progress + (Math.random() * 100 - 50);
      
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      
      // Varying sizes for depth (Critique 3)
      this.baseRadius = Math.random() * 15 + 20; 
      this.time = Math.random() * 100;
      this.isCaught = false;
      this.rotation = Math.random() * Math.PI * 2;
      this.rotSpeed = (Math.random() - 0.5) * 0.02;
    }

    reset() {
      // Respawn at a random position but keep the organic feel
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.isCaught = false;
    }

    update() {
      if (this.isCaught) return;

      this.time += 0.04;
      this.rotation += this.rotSpeed;

      // Movement
      this.x += this.vx;
      this.y += this.vy;

      // Organic drift
      this.x += Math.sin(this.time * 0.5) * 0.8;
      this.y += Math.cos(this.time * 0.3) * 0.8;

      // Bounce off walls (with padding)
      const pad = 50;
      if (this.x < -pad) this.vx = Math.abs(this.vx);
      if (this.x > width + pad) this.vx = -Math.abs(this.vx);
      if (this.y < -pad) this.vy = Math.abs(this.vy);
      if (this.y > height + pad) this.vy = -Math.abs(this.vy);

      // Avoid Mouse (Net)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 200) {
        const force = (200 - dist) / 200;
        this.vx += (dx / dist) * force * 0.8;
        this.vy += (dy / dist) * force * 0.8;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 4) {
        this.vx = (this.vx / speed) * 4;
        this.vy = (this.vy / speed) * 4;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);

      // Critique 3: Stylized Geometric/Fluid Forms
      
      if (this.type === 0) {
        // --- Type 0: Floating Crystal (Geometric) ---
        const r = this.baseRadius;
        const breath = Math.sin(this.time * 2) * 0.1 + 1;
        ctx.scale(breath, breath);
        
        ctx.shadowBlur = 20;
        ctx.shadowColor = this.color.glow;
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.strokeStyle = this.color.main;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(0, -r);
        ctx.lineTo(r * 0.7, 0);
        ctx.lineTo(0, r);
        ctx.lineTo(-r * 0.7, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        // Inner core
        ctx.fillStyle = this.color.light;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
        ctx.fill();

      } else if (this.type === 1) {
        // --- Type 1: Nebula Orbs (Fluid) ---
        const r = this.baseRadius;
        const breath = Math.sin(this.time * 1.5) * 0.2 + 1;
        
        ctx.scale(breath, breath);

        // Soft gradient cloud
        const grad = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r);
        grad.addColorStop(0, 'rgba(255,255,255,0.9)');
        grad.addColorStop(0.4, this.color.light);
        grad.addColorStop(0.8, this.color.main);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        ctx.fillStyle = grad;
        ctx.shadowBlur = 25;
        ctx.shadowColor = this.color.glow;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

      } else {
        // --- Type 2: Ring Entity (Abstract) ---
        const r = this.baseRadius;
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color.glow;
        ctx.strokeStyle = this.color.main;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';

        // Rotating ring
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 1.5);
        ctx.stroke();
        
        // Orbiting dot
        const orbitX = Math.cos(this.time * 3) * r;
        const orbitY = Math.sin(this.time * 3) * r;
        
        ctx.fillStyle = this.color.light;
        ctx.beginPath();
        ctx.arc(orbitX, orbitY, 6, 0, Math.PI * 2);
        ctx.fill();
        
        // Center eye
        ctx.fillStyle = 'black';
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI*2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature(i, CREATURE_COUNT));
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 80; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<25; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1000);

    // Respawn logic
    setTimeout(() => {
      creature.reset();
    }, 2500);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(0, 242, 255, 0.5)';
    
    const time = Date.now() * 0.002;
    const rotation = Math.sin(time) * 0.1;
    
    ctx.rotate(rotation);
    
    // Outer Ring
    ctx.strokeStyle = isMouseDown ? '#ffffff' : 'rgba(0, 242, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2;
        const r = 70;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i===0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.stroke();
    
    // Inner Targeting Lines
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-80, 0); ctx.lineTo(-20, 0);
    ctx.moveTo(20, 0); ctx.lineTo(80, 0);
    ctx.moveTo(0, -80); ctx.lineTo(0, -20);
    ctx.moveTo(0, 20); ctx.lineTo(0, 80);
    ctx.stroke();

    // "Sucking" effect if held down
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 40, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    ctx.clearRect(0, 0, width, height);

    drawStars();

    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    drawNet();

    requestAnimationFrame(loop);
  }

  // Initial setup
  resize();
  init();
  loop();

</script>
</body>
</html>
