<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Ascendant | Skill Matrix</title>
<style>
    :root {
        /* Palette: Deep Space & Ethereal Magic */
        --bg-deep: #030407;
        --bg-panel: #0a0c12;
        --bg-panel-gradient: linear-gradient(180deg, rgba(20, 25, 40, 0.9) 0%, rgba(10, 12, 18, 0.95) 100%);
        
        --accent-primary: #6366f1; /* Indigo */
        --accent-secondary: #a855f7; /* Purple */
        --accent-glow: #818cf8;
        
        --gold: #fbbf24;
        --gold-dim: #78350f;
        
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --text-dark: #475569;

        --border-light: rgba(255, 255, 255, 0.08);
        --border-accent: rgba(99, 102, 241, 0.5);
        
        --node-locked: #1e293b;
        --node-locked-border: #334155;
        --node-ready: #334155;
        --node-ready-border: #94a3b8;
        
        --font-display: 'Trajan Pro', 'Cinzel', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background Texture --- */
    .bg-fx {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: 
            radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 60%),
            radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.05) 0%, transparent 40%);
        pointer-events: none;
    }
    .bg-fx::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
        opacity: 0.6;
    }

    /* --- Header --- */
    header {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        background: rgba(3, 4, 7, 0.8);
        border-bottom: 1px solid var(--border-light);
        backdrop-filter: blur(10px);
        z-index: 100;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .brand-logo {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
    }

    .brand-text h1 {
        font-family: var(--font-display);
        font-size: 1.25rem;
        letter-spacing: 0.05em;
        font-weight: 400;
        text-transform: uppercase;
    }

    .brand-text span {
        font-size: 0.7rem;
        color: var(--text-muted);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        display: block;
        margin-top: -2px;
    }

    .header-actions {
        display: flex;
        gap: 15px;
    }

    .btn {
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--border-light);
        color: var(--text-muted);
        padding: 8px 16px;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        transition: all 0.2s;
        font-family: var(--font-ui);
    }
    .btn:hover {
        background: rgba(255,255,255,0.1);
        color: var(--text-main);
        border-color: rgba(255,255,255,0.2);
    }

    /* --- Layout --- */
    .main-wrapper {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
    }

    /* --- Sidebar --- */
    aside {
        width: 300px;
        background: var(--bg-panel);
        border-right: 1px solid var(--border-light);
        display: flex;
        flex-direction: column;
        padding: 30px;
        gap: 30px;
        z-index: 10;
        box-shadow: 10px 0 40px rgba(0,0,0,0.4);
        backdrop-filter: blur(5px);
    }

    /* Profile Card */
    .profile-card {
        text-align: center;
        margin-bottom: 10px;
    }
    
    .avatar-frame {
        width: 80px;
        height: 80px;
        margin: 0 auto 15px;
        border-radius: 50%;
        border: 2px solid var(--border-light);
        padding: 4px;
        background: linear-gradient(180deg, var(--accent-primary), transparent);
        position: relative;
    }
    
    .avatar-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #1e293b;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 1.8rem;
        color: var(--text-main);
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.4rem;
        margin-bottom: 4px;
    }
    
    .char-class {
        color: var(--accent-primary);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-weight: 600;
    }

    /* Stats */
    .stat-section {
        border-top: 1px solid var(--border-light);
        padding-top: 20px;
    }

    .stat-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 10px;
    }

    .level-badge {
        font-family: var(--font-display);
        font-size: 2rem;
        color: var(--text-main);
        line-height: 1;
    }
    
    .level-text {
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    /* XP Bar */
    .xp-wrapper {
        margin-top: 10px;
    }
    .xp-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-bottom: 4px;
    }
    .xp-track {
        height: 6px;
        background: #0f172a;
        border-radius: 3px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
    }
    .xp-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        box-shadow: 0 0 8px var(--accent-primary);
        position: relative;
    }
    /* Shimmer effect */
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        transform: translateX(-100%);
        animation: shimmer 2.5s infinite;
    }

    /* Skill Points */
    .points-card {
        background: rgba(251, 191, 36, 0.05);
        border: 1px solid rgba(251, 191, 36, 0.2);
        padding: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 4px;
    }
    .points-info {
        display: flex;
        flex-direction: column;
    }
    .points-val {
        font-family: var(--font-display);
        font-size: 1.8rem;
        color: var(--gold);
        line-height: 1;
    }
    .points-label {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
    }
    .points-icon {
        width: 24px;
        height: 24px;
        fill: var(--gold);
        opacity: 0.8;
    }

    /* Base Stats List */
    .base-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }
    .b-stat {
        background: rgba(0,0,0,0.2);
        padding: 8px 10px;
        border-radius: 4px;
        border: 1px solid var(--border-light);
    }
    .b-stat span { display: block; }
    .b-stat .label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
    .b-stat .val { font-size: 0.9rem; color: var(--text-main); font-weight: 600; }

    /* --- Tree Area --- */
    .tree-viewport {
        flex: 1;
        position: relative;
        background-color: #05070a;
        overflow: hidden;
        cursor: grab;
        /* Grid Pattern */
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
    }
    .tree-viewport:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 0; left: 0;
        width: 1600px;
        height: 1200px;
        transform-origin: 0 0;
        will-change: transform;
    }

    /* Connections */
    svg.connections {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 1;
    }

    .conn-line {
        stroke: var(--node-locked-border);
        stroke-width: 2;
        fill: none;
        transition: stroke 0.5s ease, stroke-width 0.3s ease;
    }
    
    .conn-line.active {
        stroke: var(--accent-primary);
        stroke-width: 3;
        filter: drop-shadow(0 0 4px var(--accent-primary));
    }

    .conn-line.available {
        stroke: #475569;
        stroke-dasharray: 5, 5;
    }

    /* Nodes */
    .node {
        position: absolute;
        width: 64px;
        height: 64px;
        transform: translate(-50%, -50%);
        z-index: 2;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .node:hover {
        z-index: 10;
        transform: translate(-50%, -50%) scale(1.15);
    }

    /* Hexagon Shape via Clip Path */
    .node-hex {
        width: 100%;
        height: 100%;
        background: #1e293b;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        border: 2px solid transparent; /* Border handled by pseudo-element for clip-path compat */
    }
    
    /* Border trick for clip-path */
    .node-hex::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--node-locked-border);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        z-index: -1;
        transition: background 0.3s ease;
    }
    
    .node-hex::after {
        content: '';
        position: absolute;
        inset: 2px;
        background: #0f172a;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        z-index: -1;
    }

    .node-icon {
        width: 28px;
        height: 28px;
        fill: var(--text-muted);
        opacity: 0.4;
        transition: all 0.3s ease;
    }

    /* States */
    .node.active .node-hex::before { background: var(--accent-primary); }
    .node.active .node-icon { fill: #fff; opacity: 1; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
    .node.active { filter: drop-shadow(0 0 10px var(--accent-primary)); }

    .node.available .node-hex::before { background: var(--node-ready-border); }
    .node.available .node-icon { fill: var(--text-main); opacity: 0.8; }
    .node.available:hover .node-hex::after { background: #334155; }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        width: 300px;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid var(--border-light);
        border-left: 3px solid var(--accent-primary);
        padding: 20px;
        border-radius: 0 8px 8px 0;
        pointer-events: none;
        opacity: 0;
        transform: translateX(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 1000;
        box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        backdrop-filter: blur(8px);
    }
    .tooltip.visible { opacity: 1; transform: translateX(0); }

    .tt-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 8px;
    }
    .tt-title { font-family: var(--font-display); font-size: 1.1rem; color: var(--text-main); }
    .tt-type { font-size: 0.65rem; text-transform: uppercase; color: var(--accent-primary); letter-spacing: 0.1em; }
    
    .tt-desc { font-size: 0.9rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 12px; }
    
    .tt-footer {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        color: var(--text-muted);
    }
    .tt-req { color: #ef4444; display: none; }
    .tooltip.locked .tt-req { display: block; }
    .tooltip.locked { border-left-color: #475569; }

    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }

    /* --- Controls Hint --- */
    .controls-hint {
        position: absolute;
        bottom: 20px;
        right: 20px;
        background: rgba(0,0,0,0.5);
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 0.7rem;
        color: var(--text-muted);
        pointer-events: none;
        z-index: 50;
    }

</style>
</head>
<body>

    <div class="bg-fx"></div>

    <header>
        <div class="brand">
            <div class="brand-logo"></div>
            <div class="brand-text">
                <h1>Aether Ascendant</h1>
                <span>Character Progression</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn">Reset Build</button>
            <button class="btn" style="background: var(--accent-primary); color: #fff; border-color: var(--accent-primary);">Save</button>
        </div>
    </header>

    <div class="main-wrapper">
        <aside>
            <div class="profile-card">
                <div class="avatar-frame">
                    <div class="avatar-inner">K</div>
                </div>
                <h2 class="char-name">Kaelen Thorne</h2>
                <div class="char-class">Void Walker</div>
            </div>

            <div class="stat-section">
                <div class="stat-header">
                    <span class="level-text">Level</span>
                    <span class="level-badge">42</span>
                </div>
                <div class="xp-wrapper">
                    <div class="xp-labels">
                        <span>XP Progress</span>
                        <span>12,450 / 20,000</span>
                    </div>
                    <div class="xp-track">
                        <div class="xp-fill"></div>
                    </div>
                </div>
            </div>

            <div class="points-card">
                <div class="points-info">
                    <span class="points-val">3</span>
                    <span class="points-label">Skill Points</span>
                </div>
                <svg class="points-icon" viewBox="0 0 24 24">
                    <path d="M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z"/>
                </svg>
            </div>

            <div class="stat-section">
                <div class="base-stats">
                    <div class="b-stat"><span class="label">Strength</span><span class="val">14</span></div>
                    <div class="b-stat"><span class="label">Dexterity</span><span class="val">28</span></div>
                    <div class="b-stat"><span class="label">Intelligence</span><span class="val">35</span></div>
                    <div class="b-stat"><span class="label">Vitality</span><span class="val">12</span></div>
                </div>
            </div>
        </aside>

        <div class="tree-viewport" id="viewport">
            <div class="tree-world" id="world">
                <svg class="connections" id="svgLines"></svg>
                <!-- Nodes injected via JS -->
            </div>
            <div class="controls-hint">Scroll to Zoom • Drag to Pan</div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <div class="tt-header">
            <div class="tt-title" id="tt-title">Skill Name</div>
            <div class="tt-type" id="tt-type">Passive</div>
        </div>
        <div class="tt-desc" id="tt-desc">Skill description goes here.</div>
        <div class="tt-footer">
            <span id="tt-status">Unlocked</span>
            <span class="tt-req" id="tt-req">Req: Root Node</span>
        </div>
    </div>

<script>
    /* --- Data Configuration --- */
    const skills = [
        { id: 'root', x: 800, y: 100, name: "Void Spark", type: "Origin", desc: "The genesis of your power. Increases all damage by 5%.", unlocked: true, req: null },
        
        // Tier 1
        { id: 'str1', x: 600, y: 280, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4 and weapon damage.", unlocked: true, req: 'root' },
        { id: 'dex1', x: 1000, y: 280, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5% and dodge chance.", unlocked: true, req: 'root' },
        
        // Tier 2
        { id: 'str2', x: 450, y: 450, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'int1', x: 800, y: 450, name: "Arcane Mind", type: "Passive", desc: "Mana Regen +10%. Spells cost 5% less.", unlocked: false, req: 'root' },
        { id: 'dex2', x: 1150, y: 450, name: "Evasion", type: "Passive", desc: "15% chance to dodge melee attacks.", unlocked: true, req: 'dex1' },

        // Tier 3
        { id: 'str3', x: 300, y: 650, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back or stunned.", unlocked: false, req: 'str2' },
        { id: 'hyb1', x: 600, y: 650, name: "Shadow Step", type: "Active", desc: "Teleport 10 meters instantly.", unlocked: false, req: 'int1' },
        { id: 'dex3', x: 1000, y: 650, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1300, y: 650, name: "Dual Wield", type: "Passive", desc: "Unlock ability to hold two weapons.", unlocked: false, req: 'dex2' },

        // Tier 4
        { id: 'ult1', x: 800, y: 850, name: "Astral Form", type: "Ultimate", desc: "Become invulnerable for 5 seconds.", unlocked: false, req: 'hyb1' }
    ];

    // SVG Paths for Icons
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        origin: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z",
        ultimate: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"
    };

    /* --- DOM Elements --- */
    const world = document.getElementById('world');
    const svg = document.getElementById('svgLines');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');
    const ttStatus = document.getElementById('tt-status');

    /* --- Initialization --- */
    function init() {
        // Center the world initially
        const vp = document.getElementById('viewport');
        const vw = vp.clientWidth;
        const vh = vp.clientHeight;
        
        // Start centered
        panX = vw/2 - 800;
        panY = vh/2 - 600;
        updateTransform();

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'active' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Icon Selection
            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Origin' || skill.type === 'Ultimate') iconPath = icons.ultimate;

            node.innerHTML = `
                <div class="node-hex">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawLines();
    }

    /* --- Line Drawing --- */
    function drawLines() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    } else if (parent.unlocked) {
                        line.classList.add('available');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    /* --- Logic --- */
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttStatus.textContent = "Unlocked";
            ttStatus.style.color = "var(--accent-primary)";
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttStatus.textContent = "Locked";
            ttStatus.style.color = "var(--text-muted)";
            if(reqSkill) ttReq.textContent = `Requires: ${reqSkill.name}`;
        }

        tooltip.classList.add('visible');
        moveTooltip(e.clientX, e.clientY);
    }

    function moveTooltip(x, y) {
        const ttW = 300;
        let left = x + 20;
        let top = y - 20;
        
        if (left + ttW > window.innerWidth) left = x - ttW - 20;
        if (top + 200 > window.innerHeight) top = window.innerHeight - 220;
        
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        // Logic: Can only unlock if available (parent unlocked) and not already unlocked
        if (!skill.unlocked) {
            const parent = skills.find(s => s.id === skill.req);
            if (parent && parent.unlocked) {
                skill.unlocked = true;
                updateVisuals();
            }
        } else {
            // Optional: Allow unlocking? For this demo, we only allow upgrading.
            // To allow unlocking, we'd need to check if no children depend on this node.
        }
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            el.classList.remove('active', 'available');
            
            if (s.unlocked) {
                el.classList.add('active');
            } else {
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) el.classList.add('available');
            }
        });
        drawLines();
    }

    /* --- Pan & Zoom Engine --- */
    const viewport = document.getElementById('viewport');
    let isPanning = false;
    let startX, startY;
    let panX = 0, panY = 0;
    let scale = 1;

    function updateTransform() {
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    viewport.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        viewport.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        viewport.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (isPanning) {
            e.preventDefault();
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        }
        // Move tooltip if visible
        if (tooltip.classList.contains('visible')) {
            moveTooltip(e.clientX, e.clientY);
        }
    });

    viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.4, scale + delta), 1.5);
        
        // Zoom towards mouse
        const rect = viewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        updateTransform();
    });

    // Start
    init();

</script>
</body>
</html>
