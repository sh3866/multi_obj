<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Ascendant | Skill Matrix</title>
<style>
    :root {
        /* Palette: Deep Void & Arcane Gold */
        --bg-deep: #050508;
        --bg-panel: rgba(15, 17, 26, 0.6);
        
        --accent-primary: #8b5cf6; /* Vivid Violet */
        --accent-glow: #c4b5fd;
        --accent-dim: #4c1d95;
        
        --gold: #fcd34d;
        --gold-glow: rgba(252, 211, 77, 0.4);
        
        --text-main: #f8fafc;
        --text-muted: #cbd5e1; /* Lightened for contrast */
        --text-dim: #64748b;

        --border-light: rgba(255, 255, 255, 0.1);
        --border-gold: rgba(252, 211, 77, 0.2);
        
        --node-bg: #0f172a;
        --node-border: #334155;
        
        --font-display: 'Trajan Pro', 'Cinzel', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-font-smoothing: antialiased; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background & Depth (Critique: Add Background Depth) --- */
    .bg-fx {
        position: fixed;
        inset: 0;
        z-index: -2;
        background: 
            radial-gradient(circle at 50% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
            radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
            linear-gradient(180deg, #020205 0%, #050508 100%);
        pointer-events: none;
    }
    
    /* Matrix Grid Overlay */
    .grid-overlay {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        mask-image: radial-gradient(circle at center, black 0%, transparent 80%);
        -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 80%);
        pointer-events: none;
    }

    /* --- Header --- */
    header {
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        /* Critique: Unify Backgrounds - subtle gradient instead of hard block */
        background: linear-gradient(180deg, rgba(5, 5, 8, 0.95) 0%, rgba(5, 5, 8, 0.8) 100%);
        border-bottom: 1px solid var(--border-light);
        z-index: 100;
        backdrop-filter: blur(8px);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .brand-logo {
        width: 24px;
        height: 24px;
        background: var(--accent-primary);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        box-shadow: 0 0 10px var(--accent-primary);
    }

    .brand-text h1 {
        font-family: var(--font-display);
        font-size: 1.1rem;
        letter-spacing: 0.05em;
        font-weight: 400;
        text-transform: uppercase;
        color: #fff;
    }

    .brand-text span {
        font-size: 0.65rem;
        color: var(--accent-primary);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        display: block;
        font-weight: 600;
    }

    .header-actions {
        display: flex;
        gap: 12px;
    }

    .btn {
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--border-light);
        color: var(--text-muted);
        padding: 6px 14px;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition: all 0.2s;
        font-family: var(--font-ui);
        border-radius: 2px;
    }
    .btn:hover {
        background: rgba(255,255,255,0.1);
        color: #fff;
        border-color: var(--accent-primary);
    }
    .btn-primary {
        background: rgba(139, 92, 246, 0.15);
        border-color: var(--accent-primary);
        color: var(--accent-glow);
    }
    .btn-primary:hover {
        background: var(--accent-primary);
        color: #fff;
        box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
    }

    /* --- Layout --- */
    .main-wrapper {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
    }

    /* --- Sidebar (Critique: Unify Backgrounds & Fix Stats Contrast) --- */
    aside {
        width: 280px;
        /* Changed from solid color to semi-transparent gradient to blend with background */
        background: linear-gradient(90deg, rgba(5, 5, 8, 0.95) 0%, rgba(5, 5, 8, 0.8) 100%);
        border-right: 1px solid var(--border-light);
        display: flex;
        flex-direction: column;
        padding: 24px;
        gap: 24px;
        z-index: 10;
        /* Removed heavy drop shadow to look cleaner */
        backdrop-filter: blur(4px);
    }

    /* Profile */
    .profile-card {
        text-align: center;
        position: relative;
    }
    
    .avatar-frame {
        width: 70px;
        height: 70px;
        margin: 0 auto 12px;
        border-radius: 50%;
        border: 2px solid var(--accent-primary);
        padding: 3px;
        background: linear-gradient(180deg, var(--accent-primary), var(--accent-dim));
        box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
    }
    
    .avatar-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 1.6rem;
        color: #fff;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.25rem;
        margin-bottom: 2px;
        color: #fff;
    }
    
    .char-class {
        color: var(--accent-primary);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-weight: 600;
        margin-bottom: 15px;
        display: inline-block;
        background: rgba(139, 92, 246, 0.1);
        padding: 2px 8px;
        border-radius: 10px;
        border: 1px solid rgba(139, 92, 246, 0.2);
    }

    /* Level & XP */
    .stat-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 8px;
        border-bottom: 1px solid var(--border-light);
        padding-bottom: 10px;
    }

    .level-badge {
        font-family: var(--font-display);
        font-size: 2.2rem;
        color: #fff;
        line-height: 1;
        text-shadow: 0 0 10px rgba(255,255,255,0.2);
    }
    
    .level-text {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    .xp-track {
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
    }
    .xp-fill {
        height: 100%;
        width: 65%;
        background: var(--accent-primary);
        box-shadow: 0 0 10px var(--accent-primary);
        position: relative;
    }
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
        transform: translateX(-100%);
        animation: shimmer 3s infinite;
    }

    /* Skill Points (Critique: Refine Accent Color) */
    .points-card {
        /* Replaced border with subtle background glow */
        background: linear-gradient(135deg, rgba(252, 211, 77, 0.05) 0%, rgba(0,0,0,0) 100%);
        border: 1px solid rgba(252, 211, 77, 0.15);
        padding: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 4px;
        position: relative;
        overflow: hidden;
    }
    
    /* Gold accent bar instead of full border */
    .points-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 3px; height: 100%;
        background: var(--gold);
        box-shadow: 0 0 10px var(--gold);
    }

    .points-info {
        display: flex;
        flex-direction: column;
    }
    .points-val {
        font-family: var(--font-display);
        font-size: 2rem;
        color: var(--gold);
        line-height: 1;
        text-shadow: 0 0 10px var(--gold-glow);
    }
    .points-label {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }
    .points-icon {
        width: 28px;
        height: 28px;
        fill: var(--gold);
        filter: drop-shadow(0 0 5px var(--gold));
    }

    /* Base Stats Grid (Critique: Fix Stats Contrast) */
    .base-stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }
    
    .b-stat {
        /* Slightly lighter background */
        background: rgba(255,255,255,0.03);
        padding: 12px;
        border-radius: 4px;
        border: 1px solid transparent;
        transition: border-color 0.2s;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .b-stat:hover {
        border-color: var(--border-light);
        background: rgba(255,255,255,0.05);
    }

    .b-stat .label-row {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .b-stat .label { 
        font-size: 0.65rem; 
        /* Increased brightness */
        color: var(--text-muted); 
        text-transform: uppercase; 
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        gap: 5px;
    }
    
    .stat-icon {
        width: 14px;
        height: 14px;
        opacity: 1; /* Increased opacity */
    }

    .b-stat .val { 
        font-size: 1.25rem; 
        /* Increased brightness */
        color: #fff; 
        font-weight: 700;
        font-family: var(--font-display);
    }

    /* --- Tree Area --- */
    .tree-viewport {
        flex: 1;
        position: relative;
        background-color: transparent; /* Allow background fx to show through */
        overflow: hidden;
        cursor: grab;
    }
    .tree-viewport:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 0; left: 0;
        width: 1600px;
        height: 1200px;
        transform-origin: 0 0;
        will-change: transform;
    }

    /* Connections (Critique: Implement Node Connections) */
    svg.connections {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: visible;
    }

    .conn-line {
        stroke: #1e293b; /* Dark base */
        stroke-width: 3;
        fill: none;
        transition: stroke 0.5s ease, filter 0.5s ease;
    }
    
    /* Active Line Style (Brightens when active) */
    .conn-line.active {
        stroke: var(--accent-primary);
        stroke-width: 4;
        filter: drop-shadow(0 0 8px var(--accent-primary));
        stroke-linecap: round;
    }
    
    /* Locked/Available Line Style (Dashed) */
    .conn-line.available {
        stroke: #475569;
        stroke-width: 2;
        stroke-dasharray: 8, 8;
        opacity: 0.6;
    }

    /* Nodes */
    .node {
        position: absolute;
        width: 60px;
        height: 60px;
        transform: translate(-50%, -50%);
        z-index: 2;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .node:hover {
        z-index: 10;
        transform: translate(-50%, -50%) scale(1.2);
    }

    /* Hexagon Shape */
    .node-hex {
        width: 100%;
        height: 100%;
        background: var(--node-bg);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }
    
    /* Border trick for clip-path */
    .node-hex::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--node-border);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        z-index: -1;
        transition: background 0.3s ease;
    }
    
    .node-hex::after {
        content: '';
        position: absolute;
        inset: 3px;
        background: #0f172a;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        z-index: -1;
        transition: background 0.3s;
    }

    .node-icon {
        width: 26px;
        height: 26px;
        fill: var(--text-dim);
        opacity: 0.5;
        transition: all 0.3s ease;
    }

    /* Active State */
    .node.active .node-hex::before { 
        background: var(--accent-primary);
        box-shadow: 0 0 15px var(--accent-primary);
    }
    .node.active .node-hex::after {
        background: var(--accent-dim);
    }
    .node.active .node-icon { 
        fill: #fff; 
        opacity: 1; 
        filter: drop-shadow(0 0 6px rgba(255,255,255,0.8)); 
    }
    .node.active { 
        filter: drop-shadow(0 0 12px var(--accent-primary)); 
    }

    /* Available State */
    .node.available .node-hex::before { background: var(--text-muted); }
    .node.available .node-icon { fill: #fff; opacity: 0.9; }
    .node.available:hover .node-hex::after { background: #1e293b; }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        width: 280px;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid var(--border-light);
        border-left: 3px solid var(--accent-primary);
        padding: 16px;
        border-radius: 0 6px 6px 0;
        pointer-events: none;
        opacity: 0;
        transform: translateX(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 1000;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        backdrop-filter: blur(8px);
    }
    .tooltip.visible { opacity: 1; transform: translateX(0); }

    .tt-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 8px;
    }
    .tt-title { font-family: var(--font-display); font-size: 1.1rem; color: #fff; }
    .tt-type { font-size: 0.6rem; text-transform: uppercase; color: var(--accent-primary); letter-spacing: 0.1em; font-weight: 700; }
    
    .tt-desc { font-size: 0.85rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 12px; font-weight: 300; }
    
    .tt-footer {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--text-muted);
        border-top: 1px solid rgba(255,255,255,0.05);
        padding-top: 8px;
    }
    .tt-req { color: #ef4444; display: none; font-weight: 600; }
    .tooltip.locked .tt-req { display: block; }
    .tooltip.locked { border-left-color: #475569; }

    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }

    /* --- Controls Hint --- */
    .controls-hint {
        position: absolute;
        bottom: 20px;
        right: 20px;
        background: rgba(0,0,0,0.6);
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 0.65rem;
        color: var(--text-muted);
        pointer-events: none;
        z-index: 50;
        border: 1px solid rgba(255,255,255,0.1);
        backdrop-filter: blur(4px);
    }

</style>
</head>

        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        origin: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z",
        ultimate: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"
    };

    /* --- DOM Elements --- */
    const world = document.getElementById('world');
    const svg = document.getElementById('svgLines');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');
    const ttStatus = document.getElementById('tt-status');

    /* --- Initialization --- */
    function init() {
        // Center the world initially
        const vp = document.getElementById('viewport');
        const vw = vp.clientWidth;
        const vh = vp.clientHeight;
        
        // Start centered
        panX = vw/2 - 800;
        panY = vh/2 - 600;
        updateTransform();

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'active' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Icon Selection
            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Origin' || skill.type === 'Ultimate') iconPath = icons.ultimate;

            node.innerHTML = `
                <div class="node-hex">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawLines();
    }

    /* --- Line Drawing (Critique: Implement Node Connections) --- */
    function drawLines() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    // Logic to determine line style
                    if (skill.unlocked) {
                        line.classList.add('active');
                    } else if (parent.unlocked) {
                        // If parent is unlocked but this one isn't, it's available
                        line.classList.add('available');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    /* --- Logic --- */
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttStatus.textContent = "Active";
            ttStatus.style.color = "var(--accent-primary)";
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttStatus.textContent = "Locked";
            ttStatus.style.color = "var(--text-muted)";
            if(reqSkill) ttReq.textContent = `Requires: ${reqSkill.name}`;
        }

        tooltip.classList.add('visible');
        moveTooltip(e.clientX, e.clientY);
    }

    function moveTooltip(x, y) {
        const ttW = 280;
        let left = x + 20;
        let top = y - 20;
        
        if (left + ttW > window.innerWidth) left = x - ttW - 20;
        if (top + 200 > window.innerHeight) top = window.innerHeight - 220;
        
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        // Logic: Can only unlock if available (parent unlocked) and not already unlocked
        if (!skill.unlocked) {
            const parent = skills.find(s => s.id === skill.req);
            if (parent && parent.unlocked) {
                skill.unlocked = true;
                updateVisuals();
            }
        } else {
            // Optional: Unlocking logic could go here
        }
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            el.classList.remove('active', 'available');
            
            if (s.unlocked) {
                el.classList.add('active');
            } else {
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) el.classList.add('available');
            }
        });
        drawLines();
    }

    /* --- Pan & Zoom Engine --- */
    const viewport = document.getElementById('viewport');
    let isPanning = false;
    let startX, startY;
    let panX = 0, panY = 0;
    let scale = 1;

    function updateTransform() {
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    viewport.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        viewport.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        viewport.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (isPanning) {
            e.preventDefault();
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        }
        // Move tooltip if visible
        if (tooltip.classList.contains('visible')) {
            moveTooltip(e.clientX, e.clientY);
        }
    });

    viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.4, scale + delta), 1.5);
        
        // Zoom towards mouse
        const rect = viewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        updateTransform();
    });

    // Start
    init();

</script>
