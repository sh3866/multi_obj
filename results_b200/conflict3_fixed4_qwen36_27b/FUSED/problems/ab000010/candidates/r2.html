<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway Sphere: Neon Life</title>
<style>
  :root {
    --bg-deep: #020204;
    --bg-gradient: radial-gradient(circle at 50% 50%, #11111a 0%, #020204 70%);
    
    /* Glass Panel */
    --glass-bg: rgba(10, 10, 15, 0.65);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.12);
    
    /* Palette */
    --neon-cyan: #00f3ff;
    --neon-magenta: #ff00ff;
    --neon-purple: #bc13fe;
    --neon-yellow: #fff200;
    
    --text-main: #ffffff;
    --text-muted: #8892b0;
    
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background: var(--bg-deep);
    background-image: var(--bg-gradient);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Subtle Grid */
  .bg-grid {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 50px 50px;
    z-index: 0;
    pointer-events: none;
    mask-image: radial-gradient(circle, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle, black 30%, transparent 80%);
  }

  /* Canvas Layer */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Layer */
  #ui-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Header - Refined Typography */
  .header {
    pointer-events: auto;
    max-width: 300px;
    opacity: 0.9;
  }

  h1 {
    font-size: 1.4rem; /* Reduced size per critique */
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 0.4rem;
    color: #fff;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
  }

  .subtitle {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--neon-cyan);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  /* Control Panel - Unified & Polished */
  .panel-wrapper {
    align-self: flex-end;
    pointer-events: auto;
    width: 300px;
    transform: translateY(10px);
  }

  .panel {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight);
    border-radius: 16px;
    padding: 1.25rem;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .panel-label {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  /* Stats */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  .stat-item { display: flex; flex-direction: column; }
  .stat-value {
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .stat-value.highlight { color: var(--neon-magenta); }

  /* Sliders */
  .slider-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .slider-val {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-main);
    width: 24px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--neon-cyan);
    cursor: pointer;
    box-shadow: 0 0 8px var(--neon-cyan);
    margin-top: -5px;
  }

  /* Buttons - Unified Styles */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
  }

  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    padding: 0.7rem;
    border-radius: 6px; /* Unified radius */
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-family: var(--font-stack);
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.3);
  }

  button:active { transform: translateY(1px); }

  /* Primary Button (Pause/Resume) */
  button.primary {
    background: rgba(0, 243, 255, 0.1);
    border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan);
  }
  button.primary:hover {
    background: var(--neon-cyan);
    color: #000;
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
  }

  /* Secondary Button (Reset) */
  button.secondary {
    border-color: rgba(255,255,255,0.2);
  }
  button.secondary:hover {
    border-color: rgba(255,255,255,0.5);
  }

  /* Step Once - High Contrast Action */
  button.action-step {
    margin-top: 0.6rem;
    width: 100%;
    background: var(--neon-purple);
    color: #fff;
    border: none;
    box-shadow: 0 4px 15px rgba(188, 19, 254, 0.3);
  }
  button.action-step:hover {
    background: #d04aff;
    box-shadow: 0 4px 20px rgba(188, 19, 254, 0.5);
    transform: translateY(-1px);
  }

  .footer {
    position: absolute;
    bottom: 1.5rem;
    left: 2rem;
    font-size: 0.65rem;
    color: var(--text-muted);
    opacity: 0.5;
    pointer-events: auto;
    letter-spacing: 0.05em;
  }

  @media (max-width: 768px) {
    #ui-layer { padding: 1.5rem; }
    .panel-wrapper { width: 100%; align-self: center; margin-top: auto; }
  }
</style>
</head>
<body>

  <div class="bg-grid"></div>

  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <div id="ui-layer">
    
    <div class="header">
      <h1>Conway Sphere</h1>
      <div class="subtitle">Algorithmic Life</div>
    </div>

    <div class="footer">
      DRAG TO ROTATE &bull; SCROLL TO ZOOM
    </div>

    <div class="panel-wrapper">
      <div class="panel">
        
        <div class="panel-section">
          <div class="stat-grid">
            <div class="stat-item">
              <span class="panel-label">Generation</span>
              <span class="stat-value" id="gen-count">0</span>
            </div>
            <div class="stat-item">
              <span class="panel-label">Population</span>
              <span class="stat-value highlight" id="pop-count">0</span>
            </div>
          </div>
        </div>

        <div class="panel-section">
          <div class="panel-label">Simulation Speed</div>
          <div class="slider-container">
            <input type="range" id="speed-slider" min="1" max="60" value="25">
            <span class="slider-val" id="speed-val">25</span>
          </div>
        </div>

        <div class="panel-section">
          <div class="btn-group">
            <button id="btn-pause" class="primary">Pause</button>
            <button id="btn-reset" class="secondary">Reset</button>
          </div>
          <button id="btn-step" class="action-step">Step Once</button>
        </div>

      </div>
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life - Visual Revision
 * 
 * Key Changes:
 * 1. True Multicolor Mapping: Uses a custom HSL mapping logic based on age.
 * 2. Enhanced 3D Volume: Added "Rim Lighting" (glow on edges) and "Depth Fog" (fade into center).
 * 3. Unified UI: Standardized border-radius, unified button heights, high-contrast "Step" button.
 * 4. Refined Typography: Smaller, cleaner header.
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 5500, // High density
  sphereRadius: 280,
  cellSize: 3.2,
  rotationSpeed: 0.001,
  colors: {
    // Multicolor Spectrum:
    // 0-5 gens: Yellow (Newborns)
    // 5-15 gens: Cyan (Adults)
    // 15-30 gens: Magenta (Elders)
    // 30+ gens: Purple/Dim (Ancients)
  }
};

// --- State ---
let state = {
  cells: [], 
  generation: 0,
  isRunning: true,
  speed: 25, 
  lastFrameTime: 0,
  rotation: { x: 0.2, y: 0 },
  zoom: 1,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  distSq: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return dx*dx + dy*dy + dz*dz;
  }
};

// Fibonacci Lattice Generation
function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5)); 
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y); 
    const theta = goldenAngle * i; 
    
    points.push({
      x: Math.cos(theta) * radiusAtY * radius,
      y: y * radius,
      z: Math.sin(theta) * radiusAtY * radius,
      idx: i
    });
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Neighbor calculation (O(N^2) is acceptable for 5500 points once at init)
  const avgDist = (2 * Math.PI * CONFIG.sphereRadius) / Math.sqrt(CONFIG.cellCount); 
  const thresholdSq = (avgDist * 1.1) ** 2; 

  state.cells = points.map((p, i) => {
    const neighbors = [];
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      if (Vec3.distSq(p, points[j]) < thresholdSq) {
        neighbors.push(j);
      }
    }
    
    return {
      pos: p,
      idx: i,
      neighbors: neighbors,
      alive: Math.random() > 0.55, 
      age: 0 
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  const nextStates = new Uint8Array(state.cells.length);
  const nextAges = new Uint16Array(state.cells.length);
  
  for (let i = 0; i < state.cells.length; i++) {
    const cell = state.cells[i];
    let neighborCount = 0;
    
    for (let k = 0; k < cell.neighbors.length; k++) {
      if (state.cells[cell.neighbors[k]].alive) neighborCount++;
    }
    
    let isAlive = false;
    let newAge = 0;

    if (cell.alive) {
      if (neighborCount === 2 || neighborCount === 3) {
        isAlive = true;
        newAge = cell.age + 1;
      }
    } else {
      if (neighborCount === 3) {
        isAlive = true;
        newAge = 0; // Born
      }
    }
    
    nextStates[i] = isAlive ? 1 : 0;
    nextAges[i] = newAge;
  }

  for (let i = 0; i < state.cells.length; i++) {
    state.cells[i].alive = nextStates[i] === 1;
    state.cells[i].age = nextAges[i];
  }

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  const cosY = Math.cos(rotY);
  const sinY = Math.sin(rotY);
  let x = p.x * cosY - p.z * sinY;
  let z = p.z * cosY + p.x * sinY;
  
  // Rotate X
  const cosX = Math.cos(rotX);
  const sinX = Math.sin(rotX);
  let y = p.y * cosX - z * sinX;
  let zFinal = z * cosX + p.y * sinX;
  
  // Perspective
  const fov = 1200 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal 
  };
}

function draw() {
  ctx.clearRect(0, 0, width, height);

  // 1. Sort cells by Z depth
  const projected = [];
  for(let i=0; i<state.cells.length; i++) {
    const cell = state.cells[i];
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    projected.push({ cell, proj });
  }
  
  // Sort: Back to Front (High Z to Low Z)
  // Note: In this projection, positive Z is 'into' the screen (further away)
  projected.sort((a, b) => b.proj.z - a.proj.z);

  // 2. Sphere Atmosphere (Inner Glow)
  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;
  
  // Inner glow to emphasize volume
  const glow = ctx.createRadialGradient(cx, cy, r * 0.7, cx, cy, r * 1.05);
  glow.addColorStop(0, 'rgba(0, 0, 0, 0)');
  glow.addColorStop(0.8, 'rgba(0, 20, 40, 0.2)');
  glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.1, 0, Math.PI * 2);
  ctx.fill();

  // 3. Draw Cells
  ctx.globalCompositeOperation = 'lighter';

  for (const { cell, proj } of projected) {
    if (!cell.alive) continue;

    const size = CONFIG.cellSize * proj.scale;
    
    // --- CRITICAL CHANGE: Multicolor Mapping ---
    // Map Age to Hue for a rich neon palette
    // 0-5: Yellow (45) -> 5-15: Cyan (180) -> 15-30: Magenta (300) -> 30+: Purple (270)
    let hue;
    if (cell.age < 5) {
        // Yellow to Cyan
        hue = 45 + (cell.age / 5) * (180 - 45);
    } else if (cell.age < 15) {
        // Cyan to Magenta
        hue = 180 + ((cell.age - 5) / 10) * (300 - 180);
    } else if (cell.age < 30) {
        // Magenta to Deep Purple
        hue = 300 + ((cell.age - 15) / 15) * (270 - 300 + 360); // Wrap around logic if needed, but let's keep it simple
        // Actually let's just fade to deep purple
        hue = 300 - ((cell.age - 15) / 15) * 50; 
    } else {
        hue = 250; // Ancient
    }
    
    // --- CRITICAL CHANGE: Enhanced 3D Volume ---
    // Depth Fog: Cells at the back (High Z) get darker/dimmer
    // Normalize Z roughly. Radius is ~280.
    // proj.z is roughly -280 (front) to +280 (back) relative to camera origin before perspective
    // However, our Z calculation puts +Z "into" screen.
    // Let's estimate depth factor 0 (front) to 1 (back)
    // Using scale is a good proxy, but let's use raw Z for fog if possible.
    // Since we sort by Z, we know High Z is back.
    // Let's approximate based on Scale. Scale 1.0 = center. Scale < 1 = back.
    
    const depthFactor = Math.max(0, (1.5 - proj.scale) * 2); // 0 at front, 1 at back
    
    // Rim Lighting: Cells on the silhouette (extreme Y relative to sphere center) should glow more?
    // Or simply: Front cells bright, Back cells dim.
    const alpha = Math.max(0.2, 1.0 - depthFactor * 0.9);
    
    // Saturation boost for neon look
    const saturation = 100;
    // Lightness: Front is bright (70%), Back is dim (30%)
    const lightness = 70 - (depthFactor * 40);

    ctx.fillStyle = `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`;
    
    // Glow logic
    if (size > 2.0) {
      ctx.shadowBlur = size * 2.5;
      ctx.shadowColor = `hsla(${hue}, 100%, 60%, 0.5)`;
    } else {
      ctx.shadowBlur = 0;
    }

    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
  }

  // 4. Rim Light Overlay (The Sphere Edge)
  // Draws a subtle bright ring to define the volume boundary
  ctx.globalCompositeOperation = 'screen';
  const rimGlow = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r * 1.02);
  rimGlow.addColorStop(0, 'rgba(0, 243, 255, 0)');
  rimGlow.addColorStop(0.7, 'rgba(0, 243, 255, 0.05)');
  rimGlow.addColorStop(1, 'rgba(0, 243, 255, 0)');
  
  ctx.fillStyle = rimGlow;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.1, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0;
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    state.rotation.y += CONFIG.rotationSpeed;
    
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation.toLocaleString();
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop.toLocaleString();
}

document.getElementById('btn-pause').addEventListener('click', (e) => {
  state.isRunning = !state.isRunning;
  e.target.innerText = state.isRunning ? "Pause" : "Resume";
  // Toggle styles for visual feedback
  if(state.isRunning) {
    e.target.style.borderColor = 'var(--neon-cyan)';
    e.target.style.color = 'var(--neon-cyan)';
  } else {
    e.target.style.borderColor = 'var(--neon-magenta)';
    e.target.style.color = 'var(--neon-magenta)';
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
  state.rotation.y = 0;
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  const btn = document.getElementById('btn-pause');
  btn.innerText = "Resume";
  btn.style.borderColor = 'var(--neon-magenta)';
  btn.style.color = 'var(--neon-magenta)';
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
  document.getElementById('speed-val').innerText = state.speed;
});

const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(2.0, state.zoom));
}, { passive: false });

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
