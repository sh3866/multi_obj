<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Sphere: Conway's Life</title>
<style>
  :root {
    --bg-deep: #030305;
    --bg-gradient: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #030305 80%);
    --glass-bg: rgba(20, 20, 30, 0.4);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.15);
    --text-main: #ffffff;
    --text-muted: #94a3b8;
    
    /* Neon Palette */
    --neon-cyan: #00f3ff;
    --neon-magenta: #ff00ff;
    --neon-purple: #bc13fe;
    --neon-blue: #4d4dff;
    
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background: var(--bg-deep);
    background-image: var(--bg-gradient);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Background Grid Pattern for "Tech" feel */
  .bg-grid {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
    pointer-events: none;
  }

  /* Canvas Container */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
    /* Vignette */
    box-shadow: inset 0 0 150px rgba(0,0,0,0.8);
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Overlay - Positioned for better composition */
  #ui-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Header */
  .header {
    pointer-events: auto;
    max-width: 400px;
  }

  h1 {
    font-size: 2.5rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
  }

  .subtitle {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border-left: 2px solid var(--neon-magenta);
    padding-left: 10px;
  }

  /* Control Panel - Glassmorphism Upgrade */
  .panel-wrapper {
    align-self: flex-end; /* Push to right */
    pointer-events: auto;
    width: 320px;
  }

  .panel {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight);
    border-radius: 20px;
    padding: 1.5rem;
    box-shadow: 
      0 20px 50px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.05) inset;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    padding-bottom: 1.2rem;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .panel-section:last-child { border-bottom: none; padding-bottom: 0; }

  .panel-label {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 0.2rem;
  }

  /* Stats */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  .stat-item {
    display: flex;
    flex-direction: column;
  }
  .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 10px rgba(255,255,255,0.2);
  }
  .stat-value.highlight { color: var(--neon-cyan); }

  /* Sliders */
  .slider-container {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .slider-val {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--neon-cyan);
    width: 30px;
    text-align: right;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    outline: none;
    transition: background 0.3s;
  }
  input[type=range]:hover { background: rgba(255,255,255,0.2); }
  
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255,255,255,0.8);
    border: 2px solid var(--neon-purple);
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

  /* Buttons */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  
  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    padding: 0.8rem;
    border-radius: 10px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    position: relative;
    overflow: hidden;
  }

  button:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.3);
    transform: translateY(-1px);
  }

  button:active { transform: translateY(1px); }

  button.primary {
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
    color: #000;
    border: none;
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
  }
  button.primary:hover {
    box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
    filter: brightness(1.1);
  }
  
  button.secondary {
    border-color: var(--neon-magenta);
    color: var(--neon-magenta);
    background: rgba(255, 0, 255, 0.05);
  }
  button.secondary:hover {
    background: var(--neon-magenta);
    color: #fff;
    box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
  }

  .footer {
    position: absolute;
    bottom: 2rem;
    left: 2rem;
    font-size: 0.7rem;
    color: var(--text-muted);
    opacity: 0.6;
    pointer-events: auto;
    background: rgba(0,0,0,0.3);
    padding: 4px 8px;
    border-radius: 4px;
    backdrop-filter: blur(4px);
  }

  /* Responsive adjustments */
  @media (max-width: 768px) {
    #ui-layer { padding: 1rem; }
    .header { max-width: 100%; }
    h1 { font-size: 1.8rem; }
    .panel-wrapper { width: 100%; align-self: center; margin-top: auto; }
  }
</style>
</head>
<body>

  <!-- Background Grid -->
  <div class="bg-grid"></div>

  <!-- Canvas for the Sphere -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Header -->
    <div class="header">
      <h1>Conway Sphere</h1>
      <div class="subtitle">Algorithmic Life in 3D Space</div>
    </div>

    <!-- Footer Instructions -->
    <div class="footer">
      DRAG TO ROTATE &bull; SCROLL TO ZOOM
    </div>

    <!-- Control Panel -->
    <div class="panel-wrapper">
      <div class="panel">
        
        <div class="panel-section">
          <div class="panel-label">Simulation Stats</div>
          <div class="stat-grid">
            <div class="stat-item">
              <span class="panel-label" style="margin:0;">Gen</span>
              <span class="stat-value" id="gen-count">0</span>
            </div>
            <div class="stat-item">
              <span class="panel-label" style="margin:0;">Pop</span>
              <span class="stat-value highlight" id="pop-count">0</span>
            </div>
          </div>
        </div>

        <div class="panel-section">
          <div class="panel-label">Evolution Speed</div>
          <div class="slider-container">
            <input type="range" id="speed-slider" min="1" max="60" value="20">
            <span class="slider-val" id="speed-val">20</span>
          </div>
        </div>

        <div class="panel-section">
          <div class="panel-label">Controls</div>
          <div class="btn-group">
            <button id="btn-pause" class="primary">Pause</button>
            <button id="btn-reset" class="secondary">Reset</button>
          </div>
          <button id="btn-step" style="margin-top: 0.75rem; width: 100%;">Step Once</button>
        </div>

      </div>
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life - Visual Upgrade
 * 
 * Features:
 * 1. High-density Fibonacci Lattice (5000 cells)
 * 2. Neon Color Palette mapped to Cell Age
 * 3. Pseudo-3D rendering with Z-sorting and Depth of Field
 * 4. Glassmorphism UI
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 5000, // Increased density
  sphereRadius: 280,
  cellSize: 3.5,   // Smaller cells
  rotationSpeed: 0.0015,
  colors: {
    // Neon Palette: Magenta -> Purple -> Cyan
    // We will map Age to Hue (280 -> 180)
    hueStart: 280, // Magenta/Purple
    hueEnd: 180,   // Cyan
  }
};

// --- State ---
let state = {
  cells: [], 
  generation: 0,
  isRunning: true,
  speed: 20, 
  lastFrameTime: 0,
  rotation: { x: 0.2, y: 0 }, // Start slightly tilted
  zoom: 1,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  distSq: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return dx*dx + dy*dy + dz*dz;
  }
};

// Fibonacci Lattice Sphere Generation
function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5)); 
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y); 
    const theta = goldenAngle * i; 
    
    points.push({
      x: Math.cos(theta) * radiusAtY * radius,
      y: y * radius,
      z: Math.sin(theta) * radiusAtY * radius,
      idx: i
    });
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Optimization: 
  // Calculating neighbors for 5000 points is O(N^2) -> 25M ops. 
  // It's fast enough for JS on modern machines for a one-time init.
  
  const avgDist = (2 * Math.PI * CONFIG.sphereRadius) / Math.sqrt(CONFIG.cellCount); 
  const thresholdSq = (avgDist * 1.15) ** 2; // Slightly larger radius for connectivity

  state.cells = points.map((p, i) => {
    const neighbors = [];
    // Brute force neighbor search
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      if (Vec3.distSq(p, points[j]) < thresholdSq) {
        neighbors.push(j);
      }
    }
    
    return {
      pos: p,
      idx: i,
      neighbors: neighbors,
      alive: Math.random() > 0.6, // 40% density
      age: 0, // How many generations it has been alive
      stateChangeGen: 0 // When did it last change state?
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  // Standard B3/S23 Rules
  const nextStates = new Uint8Array(state.cells.length); // 0 or 1
  const nextAges = new Uint16Array(state.cells.length);
  
  for (let i = 0; i < state.cells.length; i++) {
    const cell = state.cells[i];
    let neighborCount = 0;
    
    for (let k = 0; k < cell.neighbors.length; k++) {
      if (state.cells[cell.neighbors[k]].alive) neighborCount++;
    }
    
    let isAlive = false;
    let newAge = 0;

    if (cell.alive) {
      if (neighborCount === 2 || neighborCount === 3) {
        isAlive = true;
        newAge = cell.age + 1;
      }
    } else {
      if (neighborCount === 3) {
        isAlive = true;
        newAge = 1; // Born
      }
    }
    
    nextStates[i] = isAlive ? 1 : 0;
    nextAges[i] = newAge;
  }

  // Apply batch update
  for (let i = 0; i < state.cells.length; i++) {
    state.cells[i].alive = nextStates[i] === 1;
    state.cells[i].age = nextAges[i];
  }

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  const cosY = Math.cos(rotY);
  const sinY = Math.sin(rotY);
  let x = p.x * cosY - p.z * sinY;
  let z = p.z * cosY + p.x * sinY;
  
  // Rotate X
  const cosX = Math.cos(rotX);
  const sinX = Math.sin(rotX);
  let y = p.y * cosX - z * sinX;
  let zFinal = z * cosX + p.y * sinX;
  
  // Perspective
  const fov = 1000 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal 
  };
}

function draw() {
  // Clear with slight fade for motion blur trails? 
  // No, clean clear looks sharper for this neon style.
  ctx.clearRect(0, 0, width, height);

  // 1. Sort cells by Z depth (Painter's Algorithm)
  // We create a temporary array of indices to sort to avoid moving object references constantly
  const projected = [];
  for(let i=0; i<state.cells.length; i++) {
    const cell = state.cells[i];
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    projected.push({ cell, proj });
  }
  
  // Sort: Back to Front (High Z to Low Z)
  projected.sort((a, b) => b.proj.z - a.proj.z);

  // 2. Render Sphere Atmosphere (Back Glow)
  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;
  
  const glow = ctx.createRadialGradient(cx, cy, r * 0.8, cx, cy, r * 1.3);
  glow.addColorStop(0, 'rgba(0, 0, 0, 0)');
  glow.addColorStop(0.5, 'rgba(77, 77, 255, 0.1)'); // Blueish tint
  glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.3, 0, Math.PI * 2);
  ctx.fill();

  // 3. Draw Cells
  // We iterate from back to front.
  // We use 'lighter' composite operation for that neon additive glow effect
  ctx.globalCompositeOperation = 'lighter';

  for (const { cell, proj } of projected) {
    if (!cell.alive) continue; // Don't draw dead cells (or draw them very faintly)

    // Size attenuation based on depth
    const size = CONFIG.cellSize * proj.scale;
    
    // Color Logic: 
    // Hue shifts based on Age.
    // Young cells = Magenta, Old cells = Cyan.
    // We clamp age to keep colors cycling nicely.
    const ageFactor = Math.min(cell.age, 20) / 20; 
    const hue = CONFIG.colors.hueStart - (ageFactor * (CONFIG.colors.hueStart - CONFIG.colors.hueEnd));
    
    // Lighting effect: Brighter at front (low z), darker at back (high z)
    // Normalize Z roughly -R to R. 
    const depthLight = (proj.z + CONFIG.sphereRadius) / (2 * CONFIG.sphereRadius); // 0 (front) to 1 (back)
    // Actually Z is positive in front in this projection math? 
    // Let's check: zFinal = z*cosX + y*sinX. 
    // In standard camera, Z increases away.
    // Let's just use scale for brightness, it's correlated.
    
    const alpha = Math.min(1, proj.scale * 0.8 + 0.2);
    const lightness = 50 + (1 - depthLight) * 30; // Brighter in front

    ctx.fillStyle = `hsla(${hue}, 100%, ${lightness}%, ${alpha})`;
    
    // Glow effect for larger/nearer cells
    if (size > 2.5) {
      ctx.shadowBlur = size * 2;
      ctx.shadowColor = `hsla(${hue}, 100%, 50%, 0.6)`;
    } else {
      ctx.shadowBlur = 0;
    }

    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
  }

  // Reset composite
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0;

  // 4. Draw Subtle Wireframe/Edge for the Sphere (Optional, adds structure)
  // We draw a faint circle at the silhouette
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    // Auto rotation
    state.rotation.y += CONFIG.rotationSpeed;
    
    // Throttle logic updates
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation.toLocaleString();
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop.toLocaleString();
}

// Controls
document.getElementById('btn-pause').addEventListener('click', (e) => {
  state.isRunning = !state.isRunning;
  e.target.innerText = state.isRunning ? "Pause" : "Resume";
  if(state.isRunning) {
    e.target.classList.remove('secondary');
    e.target.classList.add('primary');
  } else {
    e.target.classList.remove('primary');
    e.target.classList.add('secondary');
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
  // Reset view slightly
  state.rotation.y = Math.random() * Math.PI;
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  document.getElementById('btn-pause').innerText = "Resume";
  document.getElementById('btn-pause').classList.remove('primary');
  document.getElementById('btn-pause').classList.add('secondary');
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
  document.getElementById('speed-val').innerText = state.speed;
});

// Mouse Drag Rotation
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.4, Math.min(2.5, state.zoom));
}, { passive: false });

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
