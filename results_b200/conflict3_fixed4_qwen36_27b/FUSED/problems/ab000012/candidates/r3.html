<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #05020a;
        --bg-purple: #180b2e;
        --gold-primary: #d4af37;
        --gold-dim: #7a5e1e;
        --gold-bright: #ffea99;
        --purple-accent: #9d4edd;
        --glass-bg: rgba(12, 5, 25, 0.65);
        --glass-border: rgba(255, 255, 255, 0.08);
        --text-main: #f0f0f5;
        --text-muted: #9ca3af;
        
        --font-heading: 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    /* --- Background Atmosphere --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
    }

    /* Deep Purple/Gold Radial Gradient Overlay */
    .atmosphere-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
            radial-gradient(circle at 50% 40%, rgba(100, 40, 150, 0.35) 0%, transparent 60%),
            radial-gradient(circle at 50% 40%, rgba(212, 175, 55, 0.15) 20%, transparent 70%);
        z-index: 1;
        pointer-events: none;
    }

    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, transparent 40%, var(--bg-deep) 95%);
        z-index: 2;
        pointer-events: none;
    }

    /* Noise Texture */
    .noise-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.06;
        pointer-events: none;
        z-index: 3;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Main Container --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 1.5rem;
    }

    /* --- Header --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 1rem;
    }

    /* --- Refined Currency --- */
    .currency-container {
        display: flex;
        align-items: center;
        gap: 12px;
        background: linear-gradient(135deg, rgba(20,10,30,0.9), rgba(40,20,60,0.8));
        padding: 6px 16px 6px 8px;
        border-radius: 50px;
        border: 1px solid var(--gold-dim);
        box-shadow: 0 0 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(212, 175, 55, 0.15);
        backdrop-filter: blur(5px);
    }

    .currency-icon-wrapper {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .currency-icon-wrapper svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 3px var(--gold-primary));
    }

    .currency-details {
        display: flex;
        flex-direction: column;
    }

    .currency-label {
        font-size: 0.6rem;
        text-transform: uppercase;
        color: var(--gold-primary);
        letter-spacing: 1px;
        font-weight: 700;
        opacity: 0.8;
    }

    .currency-amount {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-bright);
        text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        letter-spacing: 0.5px;
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        margin-bottom: 2rem;
        min-height: 200px;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 4.5rem;
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 0.5rem;
        /* Rich Metallic Gradient */
        background: linear-gradient(to bottom, #fff 0%, var(--gold-bright) 40%, var(--gold-primary) 80%, var(--gold-dim) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.9));
        position: relative;
        z-index: 2;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.85rem;
        color: var(--purple-accent);
        letter-spacing: 0.5em;
        text-transform: uppercase;
        border-bottom: 1px solid var(--gold-dim);
        padding-bottom: 0.5rem;
        margin-bottom: 1rem;
        text-shadow: 0 0 10px rgba(157, 78, 221, 0.4);
    }

    /* Complex Hero Seal / Magic Circle */
    .seal-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 550px;
        height: 550px;
        pointer-events: none;
        z-index: 0;
        opacity: 0.6;
        mix-blend-mode: screen;
    }

    /* --- Menu Grid (Differentiated Hierarchy) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: 1fr; /* Single column stack for hierarchy */
        gap: 1.5rem;
        width: 100%;
        align-items: center;
    }

    /* Primary Action: Summon */
    .primary-action-container {
        width: 100%;
        display: flex;
        justify-content: center;
        margin-bottom: 1rem;
    }

    .menu-card {
        position: relative;
        /* Glassmorphism */
        background: linear-gradient(160deg, rgba(30, 20, 50, 0.7) 0%, rgba(10, 5, 15, 0.8) 100%);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        overflow: hidden;
        box-shadow: 
            0 10px 30px rgba(0,0,0,0.5), 
            inset 0 0 20px rgba(0,0,0,0.5);
    }

    /* Secondary Grid */
    .secondary-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
        width: 100%;
    }

    /* Primary Card Specifics (Summon) */
    .menu-card.primary {
        width: 100%;
        max-width: 350px;
        height: 160px;
        border: 1px solid var(--gold-dim);
        box-shadow: 
            0 0 25px rgba(100, 40, 150, 0.2),
            0 10px 40px rgba(0,0,0,0.6),
            inset 0 0 15px rgba(212, 175, 55, 0.1);
    }

    .menu-card.primary::before {
        content: '';
        position: absolute;
        top: -50%; left: -50%; width: 200%; height: 200%;
        background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 60%);
        opacity: 0.5;
        pointer-events: none;
        animation: pulse-bg 4s infinite ease-in-out;
    }

    /* Secondary Card Specifics */
    .menu-card.secondary {
        height: 140px;
        padding: 1.5rem;
    }

    .menu-card.secondary:hover {
        background: rgba(30, 20, 50, 0.9);
        border-color: var(--text-muted);
        transform: translateY(-5px);
    }

    /* Primary Hover */
    .menu-card.primary:hover {
        transform: translateY(-5px) scale(1.02);
        border-color: var(--gold-bright);
        box-shadow: 
            0 0 40px rgba(212, 175, 55, 0.3),
            0 20px 50px rgba(0,0,0,0.8);
    }

    /* Ornate Corners for Primary */
    .card-corner {
        position: absolute;
        width: 20px;
        height: 20px;
        border: 2px solid var(--gold-dim);
        transition: all 0.4s ease;
        opacity: 0.6;
    }
    .primary .card-corner { width: 30px; height: 30px; }
    
    .top-left { top: 6px; left: 6px; border-right: none; border-bottom: none; }
    .top-right { top: 6px; right: 6px; border-left: none; border-bottom: none; }
    .bottom-left { bottom: 6px; left: 6px; border-right: none; border-top: none; }
    .bottom-right { bottom: 6px; right: 6px; border-left: none; border-top: none; }

    .menu-card.primary:hover .card-corner {
        border-color: var(--gold-bright);
        opacity: 1;
        width: 100%; height: 100%;
        border-width: 1px;
        box-shadow: inset 0 0 10px var(--gold-dim);
    }

    /* Icons */
    .card-icon {
        width: 64px;
        height: 64px;
        stroke: var(--text-muted);
        stroke-width: 1.5;
        fill: none;
        transition: all 0.4s ease;
        margin-bottom: 1rem;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* Primary Icon Styling (Gold) */
    .menu-card.primary .card-icon {
        width: 80px;
        height: 80px;
        stroke: var(--gold-primary);
        filter: drop-shadow(0 0 8px var(--gold-dim));
    }

    .menu-card.primary:hover .card-icon {
        stroke: var(--gold-bright);
        filter: drop-shadow(0 0 15px var(--gold-primary));
        transform: scale(1.1);
    }

    /* Secondary Icon Styling (White/Purple) */
    .menu-card.secondary:hover .card-icon {
        stroke: var(--text-main);
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
        transform: scale(1.1);
    }

    .card-label {
        font-family: var(--font-heading);
        font-size: 1.2rem;
        color: var(--text-main);
        letter-spacing: 0.15em;
        font-weight: 600;
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        transition: color 0.3s;
        z-index: 2;
    }

    .menu-card.primary .card-label {
        font-size: 1.5rem;
        color: var(--gold-bright);
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }

    .menu-card.primary:hover .card-label {
        color: #fff;
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.7rem;
        opacity: 0.3;
        padding-top: 1.5rem;
        letter-spacing: 1px;
        margin-top: auto;
    }

    /* --- Animations --- */
    @keyframes spin-slow { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    @keyframes pulse-bg { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.05); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 3rem; }
        .seal-container { width: 300px; height: 300px; }
        .secondary-grid { grid-template-columns: 1fr; gap: 1rem; }
        .menu-card.secondary { height: 80px; flex-direction: row; justify-content: flex-start; padding: 0 2rem; gap: 1.5rem; }
        .menu-card.secondary .card-icon { width: 32px; height: 32px; margin-bottom: 0; }
        .app-container { padding: 1rem; }
        .currency-amount { font-size: 1rem; }
        .primary-action-container { margin-bottom: 0.5rem; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="atmosphere-overlay"></div>
    <div class="vignette"></div>
    <div class="noise-overlay"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div style="flex:1"></div> 
            
            <!-- Currency Indicator -->
            <div class="currency-container">
                <div class="currency-icon-wrapper">
                    <!-- Hexagonal Gem Icon -->
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 9L12 22L22 9L12 2Z" fill="url(#gemGradient)" stroke="var(--gold-primary)" stroke-width="1.5" stroke-linejoin="round"/>
                        <path d="M12 2V22" stroke="var(--gold-dim)" stroke-width="1" opacity="0.5"/>
                        <path d="M2 9L22 9" stroke="var(--gold-dim)" stroke-width="1" opacity="0.5"/>
                        <path d="M2 9L12 14L22 9" stroke="var(--gold-dim)" stroke-width="1" opacity="0.5"/>
                        <defs>
                            <linearGradient id="gemGradient" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#fff" stop-opacity="0.9"/>
                                <stop offset="1" stop-color="#d4af37" stop-opacity="0.4"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="currency-details">
                    <span class="currency-label">Gold</span>
                    <span class="currency-amount">12,450</span>
                </div>
            </div>
        </header>

        <!-- Hero Section -->
        <section class="hero-section">
            <!-- Deep Hero Atmosphere / Magic Circle -->
            <div class="seal-container">
                <svg class="seal-svg" viewBox="0 0 200 200">
                    <defs>
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="3" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <!-- Outer Magic Circle -->
                    <circle cx="100" cy="100" r="95" stroke="var(--gold-dim)" stroke-width="1" stroke-dasharray="4 8" class="spin-slow" style="transform-origin: center; animation-duration: 40s;" />
                    <circle cx="100" cy="100" r="88" stroke="var(--purple-accent)" stroke-width="0.5" stroke-dasharray="10 5" class="spin-reverse" style="transform-origin: center; animation-duration: 60s; opacity: 0.5;" />
                    
                    <!-- Inner Geometric Seal (Spirit Silhouette approximation) -->
                    <g class="spin-reverse" style="transform-origin: center; animation-duration: 80s;">
                        <polygon points="100,15 185,100 100,185 15,100" stroke="var(--gold-dim)" stroke-width="1" fill="none" opacity="0.4"/>
                        <polygon points="100,30 170,100 100,170 30,100" stroke="var(--purple-accent)" stroke-width="1" fill="none" opacity="0.3" />
                    </g>
                    
                    <!-- Floating Runes/Stars -->
                    <g opacity="0.8" filter="url(#glow)">
                        <circle cx="100" cy="5" r="2" fill="var(--gold-bright)" class="pulse-glow" />
                        <circle cx="195" cy="100" r="2" fill="var(--gold-bright)" class="pulse-glow" style="animation-delay: 1s;" />
                        <circle cx="100" cy="195" r="2" fill="var(--gold-bright)" class="pulse-glow" style="animation-delay: 2s;" />
                        <circle cx="5" cy="100" r="2" fill="var(--gold-bright)" class="pulse-glow" style="animation-delay: 3s;" />
                    </g>
                </svg>
            </div>

            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            
            <!-- Primary Action: Summon (Differentiated) -->
            <div class="primary-action-container">
                <div class="menu-card primary" onclick="interact('Summon')">
                    <div class="card-corner top-left"></div>
                    <div class="card-corner top-right"></div>
                    <div class="card-corner bottom-left"></div>
                    <div class="card-corner bottom-right"></div>
                    
                    <!-- Icon: Summoning Orb -->
                    <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="7" stroke-opacity="0.9"/>
                        <circle cx="12" cy="12" r="3" stroke="var(--gold-bright)" stroke-width="2"/>
                        <path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12" stroke-width="1.5" opacity="0.7"/>
                    </svg>
                    <span class="card-label">Summon</span>
                </div>
            </div>

            <!-- Secondary Grid: Roster, Battle, Grind -->
            <div class="secondary-grid">
                
                <!-- Roster Card -->
                <div class="menu-card secondary" onclick="interact('Roster')">
                    <div class="card-corner top-left"></div>
                    <div class="card-corner top-right"></div>
                    <div class="card-corner bottom-left"></div>
                    <div class="card-corner bottom-right"></div>
                    
                    <!-- Icon: Tome/Scroll -->
                    <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                        <path d="M8 7h8M8 11h6" stroke-opacity="0.6"/>
                    </svg>
                    <span class="card-label">Roster</span>
                </div>

                <!-- Battle Card -->
                <div class="menu-card secondary" onclick="interact('Battle')">
                    <div class="card-corner top-left"></div>
                    <div class="card-corner top-right"></div>
                    <div class="card-corner bottom-left"></div>
                    <div class="card-corner bottom-right"></div>
                    
                    <!-- Icon: Crossed Swords -->
                    <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                        <path d="M13 19l6-6" />
                        <path d="M16 16l4 4" />
                        <path d="M19 21l2-2" />
                        <path d="M19 5L5 19" stroke-opacity="0.6"/>
                    </svg>
                    <span class="card-label">Battle</span>
                </div>

                <!-- Grind Card -->
                <div class="menu-card secondary" onclick="interact('Grind')">
                    <div class="card-corner top-left"></div>
                    <div class="card-corner top-right"></div>
                    <div class="card-corner bottom-left"></div>
                    <div class="card-corner bottom-right"></div>
                    
                    <!-- Icon: Anvil/Forge -->
                    <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 19h12v-2H6v2z" />
                        <path d="M8 17V9l4-4 4 4v8" />
                        <path d="M12 5v12" stroke-opacity="0.4"/>
                        <path d="M9 12h6" stroke-opacity="0.4"/>
                    </svg>
                    <span class="card-label">Grind</span>
                </div>

            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline Mode
        </footer>
    </div>

<script>
    // --- Particle System (Refined for Atmosphere) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.2; 
            this.vy = (Math.random() - 0.5) * 0.2;
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.5;
            
            // Gold and Purple palette
            const rand = Math.random();
            if (rand > 0.8) {
                this.color = `212, 175, 55`; // Gold
            } else if (rand > 0.5) {
                this.color = `157, 78, 221`; // Purple
            } else {
                this.color = `255, 255, 255`; // White
            }
            
            this.life = 0;
            this.maxLife = Math.random() * 500 + 200;
            this.pulseSpeed = Math.random() * 0.02 + 0.01;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life++;
            
            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
            
            const lifeRatio = this.life / this.maxLife;
            if (lifeRatio > 0.8) {
                this.alpha = 0.5 * (1 - lifeRatio) * 5; 
            } else if (lifeRatio < 0.1) {
                this.alpha = 0.5 * lifeRatio * 10; 
            } else {
                this.alpha = 0.5 * (0.5 + Math.sin(this.life * this.pulseSpeed) * 0.5);
            }

            if (this.life >= this.maxLife) this.reset();
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 12000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        
        // Visual feedback
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
        
        // Flash effect
        const flash = document.createElement('div');
        flash.style.position = 'absolute';
        flash.style.top = '0'; flash.style.left = '0'; flash.style.width = '100%'; flash.style.height = '100%';
        flash.style.background = action === 'Summon' ? 'rgba(212, 175, 55, 0.3)' : 'rgba(255, 255, 255, 0.1)';
        flash.style.pointerEvents = 'none';
        flash.style.borderRadius = '12px';
        btn.appendChild(flash);
        
        setTimeout(() => {
            flash.style.opacity = '0';
            flash.style.transition = 'opacity 0.3s';
            setTimeout(() => flash.remove(), 300);
        }, 50);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
