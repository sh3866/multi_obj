<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #050508;
        --gold-primary: #d4af37;
        --gold-dim: #8a6e18;
        --gold-bright: #fcf6ba;
        --stone-dark: #111114;
        --stone-light: #1e1e24;
        --glass-bg: rgba(15, 15, 20, 0.65);
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        
        /* Unified Palette */
        --icon-stroke: #e2e8f0;
        --icon-glow: rgba(212, 175, 55, 0.6);
        
        --font-heading: 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background: var(--bg-deep);
        background-image: radial-gradient(circle at 50% 30%, #1a1a24 0%, #050508 80%);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* --- Background Atmosphere --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: 0.5;
        pointer-events: none;
    }

    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, transparent 20%, var(--bg-deep) 95%);
        z-index: 1;
        pointer-events: none;
    }

    /* Noise Texture Overlay */
    .noise-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.04;
        pointer-events: none;
        z-index: 2;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Main Container --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1100px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem;
    }

    /* --- Header --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 1rem;
    }

    /* --- Refined Currency (Critique 4) --- */
    .currency-container {
        display: flex;
        align-items: center;
        gap: 12px;
        background: linear-gradient(135deg, rgba(10,10,10,0.9), rgba(30,30,35,0.8));
        padding: 8px 16px 8px 8px;
        border-radius: 50px;
        border: 1px solid var(--gold-dim);
        box-shadow: 0 0 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(212, 175, 55, 0.1);
        position: relative;
    }

    /* The Gem/Coin Visual */
    .currency-icon-wrapper {
        width: 40px;
        height: 40px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .currency-icon-wrapper svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 4px var(--gold-primary));
    }

    .currency-details {
        display: flex;
        flex-direction: column;
    }

    .currency-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--gold-dim);
        letter-spacing: 1px;
        font-weight: 700;
    }

    .currency-amount {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.25rem;
        color: var(--gold-bright);
        text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        letter-spacing: 0.5px;
    }

    /* --- Hero Section (Critique 3) --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        margin-bottom: 2rem;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 5rem;
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.5rem;
        /* Metallic Gradient Text */
        background: linear-gradient(to bottom, #fff 0%, var(--gold-bright) 30%, var(--gold-primary) 70%, var(--gold-dim) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8));
        position: relative;
        z-index: 2;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.9rem;
        color: var(--text-muted);
        letter-spacing: 0.4em;
        text-transform: uppercase;
        border-bottom: 1px solid var(--gold-dim);
        padding-bottom: 0.5rem;
        margin-bottom: 2rem;
    }

    /* Complex Hero Seal */
    .seal-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 600px;
        height: 600px;
        pointer-events: none;
        z-index: 0;
        opacity: 0.4;
        mix-blend-mode: screen;
    }

    .seal-svg {
        width: 100%;
        height: 100%;
    }

    /* --- Menu Grid (Critique 1 & 2) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        padding: 0 1rem;
    }

    /* Crafted Card Design */
    .menu-card {
        position: relative;
        background: var(--glass-bg);
        /* Double border effect for ornate feel */
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 2.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* Inner "Stone" Texture/Gradient */
    .menu-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.05) 0%, transparent 60%);
        pointer-events: none;
    }

    /* Ornate Corner Accents */
    .card-corner {
        position: absolute;
        width: 10px;
        height: 10px;
        border: 1px solid var(--gold-dim);
        transition: all 0.4s ease;
    }
    .top-left { top: 4px; left: 4px; border-right: none; border-bottom: none; }
    .top-right { top: 4px; right: 4px; border-left: none; border-bottom: none; }
    .bottom-left { bottom: 4px; left: 4px; border-right: none; border-top: none; }
    .bottom-right { bottom: 4px; right: 4px; border-left: none; border-top: none; }

    /* Hover State */
    .menu-card:hover {
        transform: translateY(-8px);
        background: rgba(25, 25, 30, 0.8);
        border-color: var(--gold-primary);
        box-shadow: 0 15px 40px rgba(0,0,0,0.5), 0 0 20px rgba(212, 175, 55, 0.15);
    }

    .menu-card:hover .card-corner {
        border-color: var(--gold-bright);
        width: 100%;
        height: 100%;
        opacity: 0.1; /* Fill the card with faint border color */
    }

    /* Unified Iconography (Critique 2) */
    .card-icon {
        width: 64px;
        height: 64px;
        stroke: var(--icon-stroke);
        stroke-width: 1.5;
        fill: none;
        transition: all 0.4s ease;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .menu-card:hover .card-icon {
        stroke: var(--gold-bright);
        filter: drop-shadow(0 0 8px var(--icon-glow));
        transform: scale(1.1);
    }

    .card-label {
        font-family: var(--font-heading);
        font-size: 1.3rem;
        color: var(--text-main);
        letter-spacing: 0.1em;
        font-weight: 600;
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        transition: color 0.3s;
    }

    .menu-card:hover .card-label {
        color: var(--gold-bright);
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.75rem;
        opacity: 0.4;
        padding-top: 1.5rem;
        letter-spacing: 1px;
    }

    /* --- Animations --- */
    @keyframes spin-slow { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    @keyframes pulse-glow { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 3.5rem; }
        .seal-container { width: 350px; height: 350px; }
        .menu-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
        .app-container { padding: 1rem; }
        .currency-amount { font-size: 1rem; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>
    <div class="noise-overlay"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <!-- Spacer to push currency to right or balance layout -->
            <div style="flex:1"></div> 
            
            <!-- Currency Indicator -->
            <div class="currency-container">
                <div class="currency-icon-wrapper">
                    <!-- Hexagonal Gem Icon -->
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 9L12 22L22 9L12 2Z" fill="url(#gemGradient)" stroke="var(--gold-primary)" stroke-width="1.5" stroke-linejoin="round"/>
                        <path d="M12 2V22" stroke="var(--gold-dim)" stroke-width="1" opacity="0.5"/>
                        <path d="M2 9L22 9" stroke="var(--gold-dim)" stroke-width="1" opacity="0.5"/>
                        <path d="M2 9L12 14L22 9" stroke="var(--gold-dim)" stroke-width="1" opacity="0.5"/>
                        <defs>
                            <linearGradient id="gemGradient" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#fff" stop-opacity="0.8"/>
                                <stop offset="1" stop-color="#d4af37" stop-opacity="0.2"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="currency-details">
                    <span class="currency-label">Gold</span>
                    <span class="currency-amount">12,450</span>
                </div>
            </div>
        </header>

        <!-- Hero Section -->
        <section class="hero-section">
            <!-- Deep Hero Atmosphere -->
            <div class="seal-container">
                <svg class="seal-svg" viewBox="0 0 200 200">
                    <defs>
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="2" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <!-- Outer Magic Circle -->
                    <circle cx="100" cy="100" r="95" stroke="var(--gold-dim)" stroke-width="1" stroke-dasharray="2 4" class="spin-slow" style="transform-origin: center; animation-duration: 60s;" />
                    <circle cx="100" cy="100" r="90" stroke="var(--gold-dim)" stroke-width="0.5" opacity="0.5" />
                    
                    <!-- Inner Geometric Seal -->
                    <g class="spin-reverse" style="transform-origin: center; animation-duration: 40s;">
                        <polygon points="100,10 190,100 100,190 10,100" stroke="var(--gold-dim)" stroke-width="1" fill="none" opacity="0.6"/>
                        <polygon points="100,20 180,100 100,180 20,100" stroke="var(--gold-primary)" stroke-width="0.5" fill="none" opacity="0.3" />
                    </g>
                    
                    <!-- Floating Runes/Stars -->
                    <g opacity="0.7" filter="url(#glow)">
                        <circle cx="100" cy="10" r="2" fill="var(--gold-bright)" class="pulse-glow" />
                        <circle cx="190" cy="100" r="2" fill="var(--gold-bright)" class="pulse-glow" style="animation-delay: 1s;" />
                        <circle cx="100" cy="190" r="2" fill="var(--gold-bright)" class="pulse-glow" style="animation-delay: 2s;" />
                        <circle cx="10" cy="100" r="2" fill="var(--gold-bright)" class="pulse-glow" style="animation-delay: 3s;" />
                    </g>
                </svg>
            </div>

            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            
            <!-- Summon Card -->
            <div class="menu-card" onclick="interact('Summon')">
                <div class="card-corner top-left"></div>
                <div class="card-corner top-right"></div>
                <div class="card-corner bottom-left"></div>
                <div class="card-corner bottom-right"></div>
                
                <!-- Icon: Summoning Orb -->
                <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5" stroke-opacity="0.8"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke-width="1" opacity="0.6"/>
                    <path d="M12 8v8M9 12h6" stroke-width="1.5" stroke="var(--gold-primary)"/>
                </svg>
                <span class="card-label">Summon</span>
            </div>

            <!-- Roster Card -->
            <div class="menu-card" onclick="interact('Roster')">
                <div class="card-corner top-left"></div>
                <div class="card-corner top-right"></div>
                <div class="card-corner bottom-left"></div>
                <div class="card-corner bottom-right"></div>
                
                <!-- Icon: Tome/Scroll -->
                <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                    <path d="M8 7h8M8 11h6" stroke-opacity="0.5"/>
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle Card -->
            <div class="menu-card" onclick="interact('Battle')">
                <div class="card-corner top-left"></div>
                <div class="card-corner top-right"></div>
                <div class="card-corner bottom-left"></div>
                <div class="card-corner bottom-right"></div>
                
                <!-- Icon: Crossed Swords -->
                <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                    <path d="M13 19l6-6" />
                    <path d="M16 16l4 4" />
                    <path d="M19 21l2-2" />
                    <path d="M19 5L5 19" stroke-opacity="0.6"/>
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind Card -->
            <div class="menu-card" onclick="interact('Grind')">
                <div class="card-corner top-left"></div>
                <div class="card-corner top-right"></div>
                <div class="card-corner bottom-left"></div>
                <div class="card-corner bottom-right"></div>
                
                <!-- Icon: Anvil/Forge -->
                <svg class="card-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 19h12v-2H6v2z" />
                    <path d="M8 17V9l4-4 4 4v8" />
                    <path d="M12 5v12" stroke-opacity="0.4"/>
                    <path d="M9 12h6" stroke-opacity="0.4"/>
                </svg>
                <span class="card-label">Grind</span>
            </div>

        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline Mode
        </footer>
    </div>

<script>
    // --- Particle System (Refined for Atmosphere) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.15; // Slower, more ethereal
            this.vy = (Math.random() - 0.5) * 0.15;
            this.size = Math.random() * 2;
            this.alpha = Math.random() * 0.4;
            
            // Gold and White palette
            const isGold = Math.random() > 0.6;
            this.color = isGold ? `212, 175, 55` : `255, 255, 255`;
            
            // Life cycle
            this.life = 0;
            this.maxLife = Math.random() * 500 + 200;
            this.pulseSpeed = Math.random() * 0.02 + 0.01;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life++;
            
            // Wrap around
            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
            
            // Fade in and out
            const lifeRatio = this.life / this.maxLife;
            if (lifeRatio > 0.8) {
                this.alpha = 0.4 * (1 - lifeRatio) * 5; // Fade out
            } else if (lifeRatio < 0.1) {
                this.alpha = 0.4 * lifeRatio * 10; // Fade in
            } else {
                // Pulse
                this.alpha = 0.4 * (0.5 + Math.sin(this.life * this.pulseSpeed) * 0.5);
            }

            if (this.life >= this.maxLife) this.reset();
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // Density calculation
        const count = Math.floor((width * height) / 15000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        
        // Visual feedback
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
        
        // Flash effect
        const flash = document.createElement('div');
        flash.style.position = 'absolute';
        flash.style.top = '0'; flash.style.left = '0'; flash.style.width = '100%'; flash.style.height = '100%';
        flash.style.background = 'rgba(212, 175, 55, 0.2)';
        flash.style.pointerEvents = 'none';
        btn.appendChild(flash);
        
        setTimeout(() => {
            flash.style.opacity = '0';
            flash.style.transition = 'opacity 0.3s';
            setTimeout(() => flash.remove(), 300);
        }, 50);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
