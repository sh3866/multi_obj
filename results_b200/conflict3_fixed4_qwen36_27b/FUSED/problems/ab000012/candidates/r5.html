<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette - Refined for Mystical Cohesion */
        --bg-deep: #020105;
        --bg-purple-dark: #110522;
        --bg-purple-light: #2a104a;
        
        /* Unified Gold Theme */
        --gold-primary: #d4af37;
        --gold-dim: #6b5215;
        --gold-bright: #ffe699;
        --gold-glow: rgba(212, 175, 55, 0.5);
        
        /* Accent - Deep Purple (Replaces primary colors) */
        --accent-purple: #9d4edd;
        --accent-purple-dim: #5a189a;

        --text-main: #f0f0f5;
        --text-muted: #a0a0a0;

        /* Typography - Fantasy System Stack */
        --font-heading: 'Cinzel', 'Times New Roman', 'Palatino Linotype', serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    /* --- Layered Background --- */
    
    /* 1. Canvas Particles */
    #canvas-bg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0;
        pointer-events: none;
    }

    /* 2. Atmosphere & Hero Spotlight (Critique Point #2) */
    .atmosphere-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: 
            /* High contrast radial spotlight for the Hero */
            radial-gradient(circle at 50% 35%, rgba(70, 20, 120, 0.55) 0%, transparent 45%),
            /* Deep ambient fog */
            radial-gradient(circle at 50% 100%, rgba(15, 5, 30, 0.9) 0%, transparent 60%);
        z-index: 1;
        pointer-events: none;
    }

    /* 3. Noise Texture */
    .noise-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.08;
        pointer-events: none;
        z-index: 2;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* 4. Vignette */
    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, transparent 40%, var(--bg-deep) 100%);
        z-index: 2;
        pointer-events: none;
    }

    /* --- Main Container --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1200px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem;
    }

    /* --- Header & Currency --- */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
        margin-bottom: 1rem;
        position: relative;
        z-index: 20;
    }

    .currency-container {
        display: flex;
        align-items: center;
        gap: 12px;
        background: linear-gradient(135deg, rgba(20,10,30,0.85), rgba(10,5,15,0.95));
        padding: 8px 20px 8px 10px;
        border-radius: 4px;
        /* Unified Gold Border */
        border: 1px solid var(--gold-dim);
        box-shadow: 0 4px 20px rgba(0,0,0,0.6), inset 0 0 15px rgba(212, 175, 55, 0.1);
        backdrop-filter: blur(8px);
        transition: transform 0.3s ease;
    }
    
    .currency-container:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(0,0,0,0.7), inset 0 0 20px rgba(212, 175, 55, 0.2);
        border-color: var(--gold-primary);
    }

    .currency-icon-wrapper {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .currency-icon-wrapper svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 5px var(--gold-primary));
    }

    .currency-details {
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .currency-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--gold-primary);
        letter-spacing: 1.5px;
        font-weight: 700;
        opacity: 0.9;
        line-height: 1;
    }

    .currency-amount {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.2rem;
        color: var(--gold-bright);
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
        letter-spacing: 0.5px;
        line-height: 1.2;
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        padding-top: 2rem;
        margin-bottom: 3rem;
        min-height: 180px;
    }

    /* The Ritual Circle Background */
    .seal-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 600px;
        height: 600px;
        pointer-events: none;
        z-index: 0;
        opacity: 0.8; /* Increased opacity per critique */
        mix-blend-mode: screen;
        filter: blur(1px);
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 5rem;
        line-height: 0.9;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.5rem;
        position: relative;
        z-index: 2;
        /* Metallic Gold Gradient */
        background: linear-gradient(to bottom, #fff 0%, var(--gold-bright) 30%, var(--gold-primary) 70%, var(--gold-dim) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 15px rgba(0,0,0,0.9));
    }

    .game-subtitle {
        font-family: var(--font-heading); /* Unified Font */
        font-size: 0.9rem;
        color: var(--gold-primary); /* Unified Color */
        letter-spacing: 0.6em;
        text-transform: uppercase;
        font-weight: 400;
        margin-top: 0.5rem;
        text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        position: relative;
        z-index: 2;
        opacity: 0.9;
    }

    /* --- Menu Grid --- */
    .menu-grid {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        position: relative;
        z-index: 5;
    }

    /* --- Primary Action: Summon (Portal Shape) --- */
    .primary-action-container {
        width: 100%;
        display: flex;
        justify-content: center;
        margin-bottom: 3rem;
    }

    .portal-btn {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #2a104a, #05020a);
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border: 2px solid var(--gold-dim);
        box-shadow: 
            0 0 30px rgba(157, 78, 221, 0.2),
            0 0 60px rgba(0,0,0,0.8),
            inset 0 0 40px rgba(0,0,0,0.9);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        overflow: hidden;
    }

    /* Portal Rings Animation */
    .portal-btn::before, .portal-btn::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        border: 1px solid transparent;
        pointer-events: none;
    }
    
    .portal-btn::before {
        width: 100%; height: 100%;
        border-top: 2px solid var(--gold-primary);
        border-bottom: 2px solid var(--gold-primary);
        opacity: 0.5;
        animation: spin-slow 10s linear infinite;
    }
    
    .portal-btn::after {
        width: 80%; height: 80%;
        border-left: 2px solid var(--accent-purple);
        border-right: 2px solid var(--accent-purple);
        opacity: 0.7;
        animation: spin-reverse 15s linear infinite;
    }

    .portal-btn:hover {
        transform: scale(1.05);
        border-color: var(--gold-bright);
        box-shadow: 
            0 0 50px rgba(212, 175, 55, 0.3),
            0 0 80px rgba(0,0,0,0.9);
    }

    .portal-icon {
        width: 80px;
        height: 80px;
        fill: none;
        stroke: var(--gold-bright);
        stroke-width: 1.5;
        filter: drop-shadow(0 0 10px var(--gold-primary));
        z-index: 2;
        transition: all 0.4s ease;
        margin-bottom: 5px;
    }
    
    .portal-btn:hover .portal-icon {
        transform: scale(1.1);
        filter: drop-shadow(0 0 20px var(--gold-bright));
    }

    .portal-label {
        font-family: var(--font-heading);
        font-size: 1.2rem;
        color: var(--gold-bright);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,1);
        z-index: 2;
    }

    /* --- Secondary Grid (Utility) --- */
    .secondary-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2rem;
        width: 100%;
        max-width: 900px;
    }

    .menu-card {
        position: relative;
        height: 180px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.4s ease;
        
        /* Critique Point 1: Unified Glass Artifact Look */
        background: linear-gradient(160deg, rgba(30, 15, 50, 0.6) 0%, rgba(5, 2, 10, 0.8) 100%);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--gold-dim);
        border-top: 1px solid rgba(212, 175, 55, 0.3);
        border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        border-radius: 12px;
        
        box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
        overflow: hidden;
    }

    /* Decorative Corner Runes for Cards */
    .menu-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: 
            linear-gradient(to right, var(--gold-dim) 2px, transparent 2px),
            linear-gradient(to bottom, var(--gold-dim) 2px, transparent 2px),
            linear-gradient(to left, var(--gold-dim) 2px, transparent 2px),
            linear-gradient(to bottom, var(--gold-dim) 2px, transparent 2px);
        background-size: 10px 10px;
        background-position: top left, top right, bottom left, bottom right;
        background-repeat: no-repeat;
        opacity: 0.3;
        pointer-events: none;
        transition: opacity 0.3s;
    }

    /* Unified Hover State (No distinct primary colors) */
    .menu-card:hover {
        transform: translateY(-5px);
        border-color: var(--gold-primary);
        box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 20px rgba(212, 175, 55, 0.2);
        background: linear-gradient(160deg, rgba(50, 25, 80, 0.7) 0%, rgba(10, 5, 20, 0.9) 100%);
    }
    
    .menu-card:hover::before {
        opacity: 0.6;
    }

    /* Critique Point 3: Refined Iconography */
    .card-icon {
        width: 56px;
        height: 56px;
        stroke: var(--gold-primary);
        stroke-width: 1.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        margin-bottom: 1rem;
        transition: all 0.4s ease;
        filter: drop-shadow(0 0 4px rgba(212, 175, 55, 0.3));
    }

    .menu-card:hover .card-icon {
        transform: scale(1.1);
        stroke: var(--gold-bright);
        filter: drop-shadow(0 0 12px var(--gold-primary));
    }

    /* Critique Point 4: Typography Consistency */
    .card-label {
        font-family: var(--font-heading);
        font-size: 1.1rem;
        color: var(--text-main);
        letter-spacing: 0.2em;
        font-weight: 600;
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        transition: color 0.3s;
    }

    .menu-card:hover .card-label {
        color: var(--gold-bright);
        text-shadow: 0 0 10px var(--gold-glow);
    }

    /* --- Animations --- */
    @keyframes spin-slow { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    @keyframes pulse-glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 3rem; }
        .seal-container { width: 350px; height: 350px; }
        
        .primary-action-container { margin-bottom: 2rem; }
        .portal-btn { width: 180px; height: 180px; }
        
        .secondary-grid { 
            grid-template-columns: 1fr; 
            gap: 1rem; 
            max-width: 400px;
        }
        .menu-card { 
            height: 80px; 
            flex-direction: row; 
            justify-content: flex-start; 
            padding-left: 2rem; 
            gap: 1.5rem; 
        }
        .menu-card .card-icon { margin-bottom: 0; width: 32px; height: 32px; }
        .app-container { padding: 1.5rem; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="atmosphere-overlay"></div>
    <div class="vignette"></div>
    <div class="noise-overlay"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <!-- Currency Indicator -->
            <div class="currency-container">
                <div class="currency-icon-wrapper">
                    <!-- Custom Gem Icon -->
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 9L12 22L22 9L12 2Z" fill="url(#gemGradient)" stroke="var(--gold-primary)" stroke-width="1.5" stroke-linejoin="round"/>
                        <path d="M12 2V22" stroke="var(--gold-dim)" stroke-width="1" opacity="0.5"/>
                        <path d="M2 9L22 9" stroke="var(--gold-dim)" stroke-width="1" opacity="0.5"/>
                        <path d="M2 9L12 14L22 9" stroke="var(--gold-dim)" stroke-width="1" opacity="0.5"/>
                        <defs>
                            <linearGradient id="gemGradient" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#fff" stop-opacity="0.9"/>
                                <stop offset="1" stop-color="#d4af37" stop-opacity="0.4"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="currency-details">
                    <span class="currency-label">Gold</span>
                    <span class="currency-amount">12,450</span>
                </div>
            </div>
        </header>

        <!-- Hero Section -->
        <section class="hero-section">
            <!-- Deep Hero Atmosphere / Ritual Circle -->
            <div class="seal-container">
                <svg class="seal-svg" viewBox="0 0 200 200" width="100%" height="100%">
                    <defs>
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="2" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    
                    <!-- Layer 1: Outer Dashed Ring -->
                    <circle cx="100" cy="100" r="96" stroke="var(--gold-dim)" stroke-width="0.5" stroke-dasharray="2 6" fill="none" opacity="0.6" class="spin-slow" style="transform-origin: center; animation-duration: 60s;" />
                    
                    <!-- Layer 2: Inner Complex Ring -->
                    <circle cx="100" cy="100" r="88" stroke="var(--accent-purple)" stroke-width="1" stroke-dasharray="15 10 5 10" fill="none" opacity="0.4" class="spin-reverse" style="transform-origin: center; animation-duration: 40s;" />
                    
                    <!-- Layer 3: Geometric Hexagram/Seal -->
                    <g class="spin-slow" style="transform-origin: center; animation-duration: 100s; opacity: 0.3;">
                        <polygon points="100,10 180,60 180,140 100,190 20,140 20,60" stroke="var(--gold-primary)" stroke-width="1" fill="none"/>
                        <polygon points="100,10 100,190 180,140 180,60 20,60 20,140" stroke="var(--gold-primary)" stroke-width="1" fill="none" transform="rotate(30 100 100)"/>
                    </g>
                    
                    <!-- Layer 4: Center Focus -->
                    <circle cx="100" cy="100" r="40" stroke="var(--accent-purple)" stroke-width="0.5" fill="none" opacity="0.2" filter="url(#glow)"/>
                    
                    <!-- Floating Runes/Stars -->
                    <g opacity="0.8" filter="url(#glow)">
                        <circle cx="100" cy="4" r="2" fill="var(--gold-bright)" class="pulse-glow" />
                        <circle cx="196" cy="100" r="2" fill="var(--gold-bright)" class="pulse-glow" style="animation-delay: 1s;" />
                        <circle cx="100" cy="196" r="2" fill="var(--gold-bright)" class="pulse-glow" style="animation-delay: 2s;" />
                        <circle cx="4" cy="100" r="2" fill="var(--gold-bright)" class="pulse-glow" style="animation-delay: 3s;" />
                    </g>
                </svg>
            </div>

            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            
            <!-- Primary Action: Summon (Portal Shape) -->
            <div class="primary-action-container">
                <div class="portal-btn" onclick="interact('Summon')">
                    <!-- Summon Icon: Eye/Third Eye -->
                    <svg class="portal-icon" viewBox="0 0 24 24">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                    <span class="portal-label">Summon</span>
                </div>
            </div>

            <!-- Secondary Grid: Roster, Battle, Grind -->
            <div class="secondary-grid">
                
                <!-- Roster Card -->
                <div class="menu-card" onclick="interact('Roster')">
                    <!-- Icon: Spirit Silhouette -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M12 2c-4 0-8 4-8 9 0 3 2 5 4 6.5V22h8v-4.5c2-1.5 4-3.5 4-6.5 0-5-4-9-8-9z"/>
                        <path d="M9 22h6" stroke-opacity="0.5"/>
                    </svg>
                    <span class="card-label">Roster</span>
                </div>

                <!-- Battle Card -->
                <div class="menu-card" onclick="interact('Battle')">
                    <!-- Icon: Rune Dagger/Blade -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                        <path d="M13 19l6-6" />
                        <path d="M16 16l4 4" />
                        <path d="M19 21l2-2" />
                        <path d="M19 5L5 19" stroke-opacity="0.5"/>
                    </svg>
                    <span class="card-label">Battle</span>
                </div>

                <!-- Grind Card -->
                <div class="menu-card" onclick="interact('Grind')">
                    <!-- CRITIQUE FIX: Replaced Wrench with Hourglass (Time/Gathering) -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M5 22h14" />
                        <path d="M5 2h14" />
                        <path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22" />
                        <path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2" />
                    </svg>
                    <span class="card-label">Grind</span>
                </div>

            </div>
        </nav>

        <footer style="margin-top: auto; padding-top: 2rem; color: var(--text-muted); font-size: 0.7rem; opacity: 0.4; letter-spacing: 1px;">
            Aetherbound v1.0.4 &bull; Offline Mode
        </footer>
    </div>

<script>
    // --- Particle System (Refined for Atmosphere) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.15; // Slower drift
            this.vy = (Math.random() - 0.5) * 0.15;
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.5;
            
            // Gold and Purple palette
            const rand = Math.random();
            if (rand > 0.85) {
                this.color = `212, 175, 55`; // Gold
            } else if (rand > 0.7) {
                this.color = `157, 78, 221`; // Purple
            } else {
                this.color = `255, 255, 255`; // White
            }
            
            this.life = 0;
            this.maxLife = Math.random() * 600 + 200;
            this.pulseSpeed = Math.random() * 0.02 + 0.01;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life++;
            
            // Wrap around screen
            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
            
            const lifeRatio = this.life / this.maxLife;
            if (lifeRatio > 0.8) {
                this.alpha = 0.5 * (1 - lifeRatio) * 5; 
            } else if (lifeRatio < 0.1) {
                this.alpha = 0.5 * lifeRatio * 10; 
            } else {
                this.alpha = 0.5 * (0.5 + Math.sin(this.life * this.pulseSpeed) * 0.5);
            }

            if (this.life >= this.maxLife) this.reset();
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 15000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        
        // Visual feedback
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
        
        // Flash effect
        const flash = document.createElement('div');
        flash.style.position = 'absolute';
        flash.style.top = '0'; flash.style.left = '0'; flash.style.width = '100%'; flash.style.height = '100%';
        flash.style.background = action === 'Summon' ? 'rgba(212, 175, 55, 0.3)' : 'rgba(255, 255, 255, 0.1)';
        flash.style.pointerEvents = 'none';
        flash.style.borderRadius = '50%'; // Match portal
        if(action !== 'Summon') flash.style.borderRadius = '12px'; // Match cards
        btn.appendChild(flash);
        
        setTimeout(() => {
            flash.style.opacity = '0';
            flash.style.transition = 'opacity 0.3s';
            setTimeout(() => flash.remove(), 300);
        }, 50);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
