<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #050508;
        --bg-gradient: radial-gradient(circle at 50% 30%, #1a1a24 0%, #050508 70%);
        --gold-primary: #d4af37;
        --gold-highlight: #fcf6ba;
        --gold-shadow: #8a6e18;
        --glass-bg: rgba(20, 20, 28, 0.4);
        --glass-border: rgba(212, 175, 55, 0.3);
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        
        /* Semantic Accents */
        --accent-summon: #f6e05e;
        --accent-roster: #63b3ed;
        --accent-battle: #fc8181;
        --accent-grind: #9ae6b4;
        
        --font-heading: 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background: var(--bg-deep);
        background-image: var(--bg-gradient);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* --- Background Atmosphere --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: 0.4;
        pointer-events: none;
    }

    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, transparent 40%, var(--bg-deep) 95%);
        z-index: 1;
        pointer-events: none;
    }

    /* --- Main Container --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem;
    }

    /* --- Header --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        position: relative;
    }

    /* Integrated Currency */
    .header-group {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .currency-pill {
        background: linear-gradient(90deg, rgba(10,10,15,0.9), rgba(30,30,40,0.6));
        border: 1px solid var(--gold-shadow);
        border-left: 3px solid var(--gold-primary);
        border-radius: 0 8px 8px 0;
        padding: 0.4rem 1.2rem 0.4rem 0.8rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        backdrop-filter: blur(4px);
        margin-left: -1rem; /* Pull left for visual balance */
    }

    .coin-icon {
        width: 20px;
        height: 20px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 2px var(--gold-shadow));
    }

    .currency-amount {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-highlight);
        letter-spacing: 0.5px;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        margin-bottom: 2rem;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 4.5rem;
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 0.5rem;
        background: linear-gradient(to bottom, #fff 0%, var(--gold-highlight) 40%, var(--gold-primary) 80%, var(--gold-shadow) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 15px rgba(212, 175, 55, 0.4));
        position: relative;
        z-index: 2;
    }

    .game-subtitle {
        font-family: var(--font-heading);
        font-size: 1.1rem;
        color: var(--text-muted);
        letter-spacing: 0.6em;
        text-transform: uppercase;
        margin-bottom: 2.5rem;
        opacity: 0.9;
        border-bottom: 1px solid var(--gold-shadow);
        padding-bottom: 0.5rem;
    }

    /* The Summoning Rune Circle (Atmosphere) */
    .rune-circle-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -60%);
        width: 400px;
        height: 400px;
        pointer-events: none;
        z-index: 0;
        opacity: 0.6;
        animation: breathe 8s ease-in-out infinite;
    }

    .rune-svg {
        width: 100%;
        height: 100%;
        fill: none;
        stroke: var(--gold-shadow);
        stroke-width: 1;
    }

    .rune-rotating {
        animation: spin 40s linear infinite;
        transform-origin: center;
    }
    
    .rune-reverse {
        animation: spin-reverse 60s linear infinite;
        transform-origin: center;
    }

    /* --- Menu Grid --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        padding: 0 1rem;
    }

    /* Glassmorphism Card */
    .menu-card {
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        padding: 2rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    /* Gold border unification on hover */
    .menu-card:hover {
        transform: translateY(-8px);
        background: rgba(30, 30, 40, 0.6);
        border-color: var(--gold-primary);
        box-shadow: 0 15px 35px rgba(0,0,0,0.4), 0 0 15px rgba(212, 175, 55, 0.1);
    }

    .card-icon {
        width: 56px;
        height: 56px;
        stroke: var(--text-muted);
        stroke-width: 1.5;
        fill: none;
        transition: all 0.3s ease;
    }

    .card-label {
        font-family: var(--font-heading);
        font-size: 1.2rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
        font-weight: 600;
        text-transform: uppercase;
        transition: color 0.3s;
    }

    /* --- Semantic Styling (Variety) --- */
    
    /* Summon - Gold/Yellow */
    .menu-card[data-type="summon"] .card-icon { stroke: var(--accent-summon); filter: drop-shadow(0 0 0px transparent); }
    .menu-card[data-type="summon"]:hover .card-icon { filter: drop-shadow(0 0 10px var(--accent-summon)); stroke: #fff; }
    .menu-card[data-type="summon"]:hover { box-shadow: 0 10px 30px rgba(246, 224, 94, 0.15); }

    /* Roster - Blue */
    .menu-card[data-type="roster"] .card-icon { stroke: var(--accent-roster); }
    .menu-card[data-type="roster"]:hover .card-icon { filter: drop-shadow(0 0 10px var(--accent-roster)); stroke: #fff; }
    .menu-card[data-type="roster"]:hover { box-shadow: 0 10px 30px rgba(99, 179, 237, 0.15); border-color: var(--accent-roster); }

    /* Battle - Red */
    .menu-card[data-type="battle"] .card-icon { stroke: var(--accent-battle); }
    .menu-card[data-type="battle"]:hover .card-icon { filter: drop-shadow(0 0 10px var(--accent-battle)); stroke: #fff; }
    .menu-card[data-type="battle"]:hover { box-shadow: 0 10px 30px rgba(252, 129, 129, 0.15); border-color: var(--accent-battle); }

    /* Grind - Green */
    .menu-card[data-type="grind"] .card-icon { stroke: var(--accent-grind); }
    .menu-card[data-type="grind"]:hover .card-icon { filter: drop-shadow(0 0 10px var(--accent-grind)); stroke: #fff; }
    .menu-card[data-type="grind"]:hover { box-shadow: 0 10px 30px rgba(154, 230, 180, 0.15); border-color: var(--accent-grind); }


    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.75rem;
        opacity: 0.5;
        padding-top: 1rem;
        letter-spacing: 1px;
    }

    /* --- Animations --- */
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    @keyframes breathe { 0%, 100% { transform: translate(-50%, -60%) scale(1); opacity: 0.6; } 50% { transform: translate(-50%, -60%) scale(1.05); opacity: 0.8; } }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 3rem; }
        .rune-circle-container { width: 300px; height: 300px; }
        .menu-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
        .app-container { padding: 1rem; }
        .header-group { width: 100%; justify-content: flex-end; }
        .currency-pill { margin-left: 0; }
        header { margin-bottom: 0.5rem; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div style="flex:1"></div> <!-- Spacer -->
            <div class="header-group">
                <div class="currency-pill">
                    <!-- Detailed Gold Coin SVG -->
                    <svg class="coin-icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/>
                        <circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="1" opacity="0.5" fill="none"/>
                        <path d="M12 8v8M9 12h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span class="currency-amount">12,450</span>
                </div>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <!-- Atmospheric Background Rune -->
            <div class="rune-circle-container">
                <svg class="rune-svg" viewBox="0 0 200 200">
                    <!-- Outer dashed ring -->
                    <circle cx="100" cy="100" r="90" stroke-dasharray="4 8" class="rune-rotating" />
                    <!-- Inner solid ring -->
                    <circle cx="100" cy="100" r="80" opacity="0.3" />
                    <!-- Geometric accents -->
                    <g class="rune-reverse">
                        <path d="M100 10 L100 190 M10 100 L190 100" stroke-width="0.5" opacity="0.5"/>
                        <path d="M30 30 L170 170 M30 170 L170 30" stroke-width="0.5" opacity="0.5"/>
                        <polygon points="100,20 180,100 100,180 20,100" stroke-dasharray="10 5" opacity="0.4"/>
                    </g>
                </svg>
            </div>

            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon -->
            <div class="menu-card" data-type="summon" onclick="interact('Summon')">
                <!-- Thematic Icon: Crystal/Orb -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2l-5.5 9h11z" stroke-linejoin="round"/>
                    <path d="M12 22l5.5-9h-11z" stroke-linejoin="round"/>
                    <path d="M12 2v20" opacity="0.3"/>
                    <path d="M6.5 11h11" opacity="0.3"/>
                </svg>
                <span class="card-label">Summon</span>
            </div>

            <!-- Roster -->
            <div class="menu-card" data-type="roster" onclick="interact('Roster')">
                <!-- Thematic Icon: Scroll -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M8 21h12a2 2 0 0 0 2-2v-2H10v2a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v3h4" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M10 2h10v12H10z" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card" data-type="battle" onclick="interact('Battle')">
                <!-- Thematic Icon: Crossed Swords -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M13 19l6-6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 16l4 4" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M19 21l2-2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M10 13l-1.5 1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M13 10l-1.5 1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M19 5L5 19" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card" data-type="grind" onclick="interact('Grind')">
                <!-- Thematic Icon: Anvil/Hammer -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M6 19h12" stroke-linecap="round"/>
                    <path d="M6 19v-2h12v2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M8 17V9l4-4 4 4v8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 5v12" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
                </svg>
                <span class="card-label">Grind</span>
            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline Mode
        </footer>
    </div>

<script>
    // --- Background Particle System (Refined for Atmosphere) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.2; // Slower drift
            this.vy = (Math.random() - 0.5) * 0.2;
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.5;
            // More magical colors: Gold and White
            const isGold = Math.random() > 0.7;
            this.color = isGold ? `212, 175, 55` : `255, 255, 255`;
            this.pulse = Math.random() * Math.PI;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.pulse += 0.02;
            
            // Wrap around screen
            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
        }

        draw() {
            const currentAlpha = this.alpha * (0.5 + Math.sin(this.pulse) * 0.5);
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${currentAlpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // Slightly lower density for cleaner look
        const count = Math.floor((width * height) / 25000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        // Visual feedback for buttons
        const btn = event.currentTarget;
        // Reset transform to allow re-triggering animation if needed
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
        
        // Add a temporary flash effect
        const originalBg = btn.style.background;
        btn.style.background = 'rgba(255,255,255,0.1)';
        setTimeout(() => {
            btn.style.background = '';
        }, 100);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
