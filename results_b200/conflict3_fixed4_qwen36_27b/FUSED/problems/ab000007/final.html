<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEBULA CAUGHT // Bio-Sector 9</title>
<style>
  :root {
    --bg-deep: #020204;
    --bg-panel: rgba(10, 14, 22, 0.6);
    --accent-cyan: #00f0ff;
    --accent-gold: #ffcc00;
    --accent-pink: #ff0055;
    --accent-purple: #bd00ff;
    --accent-green: #00ff9d;
    --glass-border: rgba(255, 255, 255, 0.1);
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "Courier New", Courier, monospace;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Scene & Environment --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  /* 1. Atmospheric Background Layers */
  .nebula-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    background: 
      radial-gradient(circle at 20% 30%, rgba(189, 0, 255, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0, 240, 255, 0.1) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0) 0%, var(--bg-deep) 100%);
    pointer-events: none;
  }

  /* 2. The Grid - Enhanced depth */
  .grid-bg {
    position: absolute;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background-image: 
      linear-gradient(rgba(0, 240, 255, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.07) 1px, transparent 1px);
    background-size: 100px 100px;
    transform-origin: 50% 0%;
    transform: perspective(600px) rotateX(60deg) translateY(-150px);
    mask-image: linear-gradient(to bottom, transparent 30%, black 70%, transparent 90%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 30%, black 70%, transparent 90%);
    z-index: 1;
    pointer-events: none;
    animation: gridDrift 20s linear infinite;
  }

  @keyframes gridDrift {
    0% { background-position: 0 0; }
    100% { background-position: 0 100px; }
  }

  /* Vignette & Scanlines */
  .overlay-fx {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.8) 100%);
    box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
  }
  
  /* CRT Scanline effect */
  .overlay-fx::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.2) 3px
    );
    opacity: 0.3;
  }

  /* Canvas Layer */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none; 
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 4rem;
    margin: 0;
    line-height: 0.85;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: white;
    text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
    font-style: italic;
    background: linear-gradient(to bottom, #fff 40%, #a0a0a0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--accent-cyan);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.8;
    margin-top: 5px;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
  }

  /* HUD Panel */
  .hud-panel {
    background: var(--bg-panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    padding: 0.8rem 1.2rem;
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    border-left: 3px solid var(--accent-cyan);
    position: relative;
    overflow: hidden;
    transform: skewX(-12deg);
  }

  .stat-container {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    transform: skewX(12deg); /* Counter-skew text */
  }

  .stat-label {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: bold;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2.5rem;
    font-weight: normal;
    color: white;
    line-height: 1;
    text-shadow: 0 0 15px var(--accent-cyan);
    font-style: italic;
  }

  /* Footer / Actions */
  .footer {
    display: flex;
    justify-content: flex-end;
    align-items: flex-end;
    pointer-events: auto;
    width: 100%;
    margin-bottom: 1rem;
  }

  /* 3. Refined Button: Glowing Outline */
  .fab-btn {
    background: rgba(0, 240, 255, 0.05);
    color: var(--accent-cyan);
    font-family: var(--font-mono);
    font-size: 1rem;
    font-weight: bold;
    padding: 1rem 2.5rem;
    border-radius: 2px;
    border: 1px solid var(--accent-cyan);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.05);
    position: relative;
    overflow: hidden;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }

  .fab-btn:hover {
    background: rgba(0, 240, 255, 0.2);
    color: white;
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.5), inset 0 0 10px rgba(0, 240, 255, 0.2);
    text-shadow: 0 0 8px white;
    transform: translateY(-2px);
  }

  .fab-btn:active {
    transform: scale(0.98);
    background: var(--accent-cyan);
    color: #000;
  }

  /* Toast */
  .toast {
    position: absolute;
    top: 20%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(5, 5, 8, 0.9);
    border: 1px solid var(--accent-gold);
    color: var(--accent-gold);
    padding: 0.8rem 2rem;
    border-radius: 2px;
    font-family: var(--font-mono);
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(255, 204, 0, 0.2);
    display: flex;
    align-items: center;
    gap: 10px;
    backdrop-filter: blur(4px);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    h1 { font-size: 2.5rem; }
    .ui-layer { padding: 1.5rem; }
    .footer { justify-content: center; }
    .fab-btn { width: 100%; text-align: center; }
    .hud-panel { border-left: none; border-bottom: 3px solid var(--accent-cyan); transform: skewX(0); width: 100%; justify-content: center;}
    .stat-container { transform: skewX(0); align-items: center; flex-direction: row; gap: 1rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- 1. Atmospheric Layers -->
  <div class="nebula-bg"></div>
  <div class="grid-bg"></div>
  <div class="overlay-fx"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Capture</h1>
        <div class="subtitle">Bio-Sector 9 // Drifting</div>
      </div>
      <div class="hud-panel">
        <div class="stat-container">
          <div class="stat-label">Collection</div>
          <div class="stat-value" id="scoreDisplay">00</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z"/></svg>
      <span>Specimen Secured</span>
    </div>

    <footer class="footer">
      <button class="fab-btn" onclick="resetGame()">
        <span>View Collection</span>
      </button>
    </footer>
  </div>
</div>

<script>
  /**
   * VISUAL DESIGN OVERHAUL
   * - 1. Player/Net: Distinct drone avatar with banking and rotating arms.
   * - 2. Scene: Nebula gradients, dust particles, perspective grid.
   * - 3. Creatures: Biological details (eyes, pulsing cores, trails).
   * - 4. Button: Glowing outline, glassmorphism.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = []; // Explosion particles
  let dustParticles = []; // Background atmosphere
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let prevMouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let frame = 0;

  // Configuration
  const CREATURE_COUNT = 10;
  const DUST_COUNT = 100;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initDust();
  }
  window.addEventListener('resize', resize);

  // Input Handling
  window.addEventListener('mousemove', e => {
    prevMouse.x = mouse.x;
    prevMouse.y = mouse.y;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    prevMouse.x = mouse.x;
    prevMouse.y = mouse.y;
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    prevMouse.x = mouse.x;
    prevMouse.y = mouse.y;
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  // Background Dust for Atmosphere
  class Dust {
    constructor() {
      this.reset();
    }
    reset() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.size = Math.random() * 1.5;
      this.speed = Math.random() * 0.2 + 0.05;
      this.opacity = Math.random() * 0.5;
      this.drift = (Math.random() - 0.5) * 0.2;
    }
    update() {
      this.y -= this.speed;
      this.x += this.drift;
      if (this.y < 0) this.y = height;
      if (this.x < 0) this.x = width;
      if (this.x > width) this.x = 0;
    }
    draw(ctx) {
      ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.92;
      this.vy *= 0.92;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset(true);
    }

    reset(initial = false) {
      this.x = initial ? Math.random() * width : (Math.random() < 0.5 ? -50 : width + 50);
      this.y = initial ? Math.random() * height : Math.random() * height;
      
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      
      this.radius = Math.random() * 12 + 15;
      this.shapeType = Math.floor(Math.random() * 3); // 0: Sphere, 1: Hex, 2: Shard
      this.color = this.getColor();
      this.rotation = Math.random() * Math.PI * 2;
      this.rotationSpeed = (Math.random() - 0.5) * 0.02;
      this.wobble = Math.random() * 100;
      this.isCaught = false;
      this.history = [];
    }

    getColor() {
      const colors = ['#00f0ff', '#ff0055', '#ffcc00', '#bd00ff', '#00ff9d'];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    update() {
      if (this.isCaught) return;

      // Trail logic
      this.history.push({x: this.x, y: this.y});
      if (this.history.length > 15) this.history.shift();

      this.x += this.vx;
      this.y += this.vy;
      this.rotation += this.rotationSpeed;
      this.wobble += 0.03;

      // Organic drift
      this.x += Math.sin(this.wobble) * 0.1;
      this.y += Math.cos(this.wobble * 0.8) * 0.1;

      // Boundaries
      if (this.x < -80) this.x = width + 80;
      if (this.x > width + 80) this.x = -80;
      if (this.y < -80) this.y = height + 80;
      if (this.y > height + 80) this.y = -80;

      // Mouse Repulsion
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 200) {
        const force = (200 - dist) / 200;
        this.vx += (dx / dist) * force * 0.6;
        this.vy += (dy / dist) * force * 0.6;
      }

      // Speed Cap
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 4) {
        this.vx = (this.vx / speed) * 4;
        this.vy = (this.vy / speed) * 4;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      // Draw Trail
      if (this.history.length > 1) {
        ctx.beginPath();
        ctx.moveTo(this.history[0].x, this.history[0].y);
        for (let i = 1; i < this.history.length; i++) {
          ctx.lineTo(this.history[i].x, this.history[i].y);
        }
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.2;
        ctx.stroke();
        ctx.globalAlpha = 1.0;
      }

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);

      // Glow
      ctx.shadowBlur = 20;
      ctx.shadowColor = this.color;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2;

      // Shape
      ctx.beginPath();
      if (this.shapeType === 0) {
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
      } else if (this.shapeType === 1) {
        for (let i = 0; i < 6; i++) {
          ctx.lineTo(this.radius * Math.cos(i * Math.PI / 3), this.radius * Math.sin(i * Math.PI / 3));
        }
        ctx.closePath();
      } else {
        // Shard
        ctx.moveTo(0, -this.radius);
        ctx.lineTo(this.radius * 0.7, 0);
        ctx.lineTo(0, this.radius);
        ctx.lineTo(-this.radius * 0.7, 0);
        ctx.closePath();
      }
      
      ctx.fill();
      ctx.stroke();

      // --- Internal Biological Details ---
      ctx.shadowBlur = 0; 
      
      // 1. Pulsing Core
      const pulse = Math.sin(frame * 0.15) * 0.2 + 0.8;
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = 0.7 * pulse;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * 0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;

      // 2. "Eye" (Asymmetrical detail)
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.radius * 0.3, -this.radius * 0.3, this.radius * 0.15, 0, Math.PI * 2);
      ctx.fill();
      
      // Pupil
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(this.radius * 0.35, -this.radius * 0.3, this.radius * 0.05, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function initDust() {
    dustParticles = [];
    for(let i=0; i<DUST_COUNT; i++) {
      dustParticles.push(new Dust());
    }
  }

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    updateScore();
  }

  function updateScore() {
    scoreEl.innerText = score < 10 ? '0' + score : score;
  }

  function checkCatch() {
    const catchRadius = 80;
    let caughtAny = false;

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
        caughtAny = true;
      }
    });
    
    if (caughtAny) {
      toastEl.classList.add('active');
      setTimeout(() => toastEl.classList.remove('active'), 1500);
    }
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    updateScore();
    
    for(let i=0; i<25; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    setTimeout(() => {
      creature.reset();
    }, 1000);
  }

  function resetGame() {
    init();
  }

  // 1. Distinct Player Avatar (Drone)
  function drawPlayerAvatar() {
    const dx = mouse.x - prevMouse.x;
    const dy = mouse.y - prevMouse.y;
    const velocity = Math.sqrt(dx*dx + dy*dy);
    const angle = Math.atan2(dy, dx);
    
    // Banking effect
    const bank = Math.min(Math.max(velocity * 0.04, -0.4), 0.4);

    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    ctx.rotate(angle + Math.PI/2 + bank);

    // --- Drone Design ---
    // 1. Core
    ctx.fillStyle = '#050508';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ffffff';
    
    ctx.beginPath();
    ctx.rect(-6, -10, 12, 20);
    ctx.fill();
    ctx.stroke();

    // 2. Arms
    ctx.rotate(-angle - Math.PI/2 - bank); 
    ctx.rotate(frame * 0.15); // Spin

    const armLen = 45;
    ctx.strokeStyle = isMouseDown ? '#ffcc00' : '#00f0ff';
    ctx.lineWidth = 2;
    ctx.shadowColor = ctx.strokeStyle;

    for(let i=0; i<3; i++) {
      ctx.rotate((Math.PI * 2) / 3);
      
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -armLen);
      ctx.stroke();

      // Net Node
      ctx.beginPath();
      ctx.arc(0, -armLen, 6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fill();
      ctx.stroke();
    }

    // 3. The "Net" Area (Visual feedback)
    if (isMouseDown) {
      ctx.globalAlpha = 0.15 + Math.sin(frame * 0.5) * 0.05;
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath();
      ctx.arc(0, 0, 75, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.globalAlpha = 0.6;
      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 75, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 50, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    frame++;
    ctx.clearRect(0, 0, width, height);

    // Atmosphere
    dustParticles.forEach(d => {
      d.update();
      d.draw(ctx);
    });

    // Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Player
    drawPlayerAvatar();

    requestAnimationFrame(loop);
  }

  // Start
  resize();
  init();
  loop();

</script>
</body>
</html>
