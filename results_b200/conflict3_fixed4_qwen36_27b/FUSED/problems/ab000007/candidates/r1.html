<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Drift & Collect</title>
<style>
  :root {
    --bg-deep: #050508;
    --bg-panel: rgba(10, 12, 20, 0.75);
    --accent-cyan: #00f3ff;
    --accent-gold: #ffcc00;
    --accent-pink: #ff0055;
    --accent-purple: #bd00ff;
    --glass-border: rgba(255, 255, 255, 0.15);
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "Courier New", Courier, monospace;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Scene & Environment --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  /* The 3D Grid */
  .grid-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 120%; /* Taller for perspective */
    bottom: -20%;
    background-image: 
      linear-gradient(rgba(0, 243, 255, 0.3) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 243, 255, 0.3) 1px, transparent 1px);
    background-size: 60px 60px;
    transform-origin: 50% 0%;
    transform: perspective(400px) rotateX(50deg) translateY(-50px);
    mask-image: linear-gradient(to bottom, transparent 0%, black 40%, black 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 40%, black 100%);
    z-index: 0;
    pointer-events: none;
    animation: gridScroll 20s linear infinite;
  }

  @keyframes gridScroll {
    0% { background-position: 0 0; }
    100% { background-position: 0 60px; }
  }

  /* Atmospheric Fog */
  .fog-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 40%, transparent 0%, var(--bg-deep) 80%);
    z-index: 1;
    pointer-events: none;
  }

  /* Canvas Layer */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 3rem;
    margin: 0;
    line-height: 1;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: white;
    text-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
  }

  .subtitle {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--accent-cyan);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.9;
  }

  /* HUD Panel */
  .hud-panel {
    background: var(--bg-panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border);
    padding: 0.5rem 1.25rem;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border-left: 4px solid var(--accent-cyan);
  }

  .stat-value {
    font-family: var(--font-mono);
    font-size: 2rem;
    font-weight: bold;
    color: white;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    letter-spacing: 0.1em;
  }

  /* Footer / Actions */
  .footer {
    display: flex;
    justify-content: flex-end; /* Right aligned */
    align-items: flex-end;
    pointer-events: auto;
    width: 100%;
    margin-bottom: 1rem;
    margin-right: 0;
  }

  .fab-btn {
    background: var(--accent-cyan);
    color: #000;
    font-family: var(--font-display);
    font-size: 1rem;
    padding: 1rem 2.5rem;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    transition: all 0.2s ease;
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .fab-btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
    background: #fff;
  }

  .fab-btn:active {
    transform: scale(0.95);
  }

  /* Player Avatar UI Element (Static visual anchor) */
  .player-anchor {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 20px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px 20px 0 0;
    pointer-events: none;
    z-index: 5;
    display: flex;
    justify-content: center;
    align-items: flex-end;
  }
  
  .player-anchor::after {
    content: '';
    width: 10px;
    height: 10px;
    background: var(--accent-cyan);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent-cyan);
    margin-bottom: -5px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { opacity: 0.5; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
    100% { opacity: 0.5; transform: scale(0.8); }
  }

  /* Toast */
  .toast {
    position: absolute;
    top: 20%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0,0,0,0.8);
    border: 1px solid var(--accent-gold);
    color: var(--accent-gold);
    padding: 0.8rem 1.5rem;
    border-radius: 4px;
    font-family: var(--font-mono);
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(255, 204, 0, 0.2);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    h1 { font-size: 2rem; }
    .ui-layer { padding: 1.5rem; }
    .footer { justify-content: center; }
    .fab-btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Environment -->
  <div class="grid-bg"></div>
  <div class="fog-layer"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Player Anchor (Visual only) -->
  <div class="player-anchor"></div>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Drift</h1>
        <div class="subtitle">Sector 7 // Collection</div>
      </div>
      <div class="hud-panel">
        <div class="stat-value" id="scoreDisplay">0</div>
        <div class="stat-label">Specimens</div>
      </div>
    </header>

    <div id="toast" class="toast">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z"/></svg>
      <span>Acquired!</span>
    </div>

    <footer class="footer">
      <button class="fab-btn" onclick="resetGame()">
        <span>New Collection</span>
      </button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Enhanced for distinct shapes and visual polish.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let frame = 0;

  // Configuration
  const CREATURE_COUNT = 7;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 4 + 2;
      this.gravity = 0.05;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += this.gravity;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset(true);
    }

    reset(initial = false) {
      // Spawn logic
      this.x = initial ? Math.random() * width : (Math.random() < 0.5 ? -50 : width + 50);
      this.y = initial ? Math.random() * height : Math.random() * height;
      
      // Physics
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      
      // Appearance
      this.radius = Math.random() * 15 + 15;
      this.shapeType = Math.floor(Math.random() * 3); // 0: Sphere, 1: Cube, 2: Shard
      this.color = this.getColor();
      this.rotation = Math.random() * Math.PI * 2;
      this.rotationSpeed = (Math.random() - 0.5) * 0.05;
      this.wobble = Math.random() * 100;
      this.isCaught = false;
    }

    getColor() {
      const colors = ['#00f3ff', '#ff0055', '#ffcc00', '#bd00ff'];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    update() {
      if (this.isCaught) return;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.rotation += this.rotationSpeed;
      this.wobble += 0.05;

      // Organic drift
      this.x += Math.sin(this.wobble) * 0.3;
      this.y += Math.cos(this.wobble * 0.8) * 0.3;

      // Bounce boundaries
      if (this.x < 0 || this.x > width) this.vx *= -1;
      if (this.y < 0 || this.y > height) this.vy *= -1;

      // Mouse Interaction (Flee)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 180) {
        const force = (180 - dist) / 180;
        this.vx += (dx / dist) * force * 0.8;
        this.vy += (dy / dist) * force * 0.8;
      }

      // Max Speed Cap
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 5) {
        this.vx = (this.vx / speed) * 5;
        this.vy = (this.vy / speed) * 5;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);

      // Glow Effect
      ctx.shadowBlur = 15;
      ctx.shadowColor = this.color;
      ctx.fillStyle = this.color;
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 2;

      // Shape Drawing
      ctx.beginPath();
      if (this.shapeType === 0) {
        // Sphere
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
      } else if (this.shapeType === 1) {
        // Cube
        ctx.rect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
      } else {
        // Jagged Shard
        ctx.moveTo(this.radius, 0);
        ctx.lineTo(this.radius * 0.5, this.radius * 0.5);
        ctx.lineTo(0, this.radius);
        ctx.lineTo(-this.radius * 0.5, this.radius * 0.5);
        ctx.lineTo(-this.radius, 0);
        ctx.lineTo(-this.radius * 0.5, -this.radius * 0.5);
        ctx.lineTo(0, -this.radius);
        ctx.lineTo(this.radius * 0.5, -this.radius * 0.5);
      }
      
      ctx.fill();
      ctx.stroke();

      // Inner Detail
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 50;

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Explosion FX
    for(let i=0; i<20; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1200);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 1500);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    // Drone/Net Visual
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Outer Ring
    ctx.strokeStyle = isMouseDown ? '#fff' : 'var(--accent-cyan)';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'var(--accent-cyan)';
    
    // Animated ring
    const ringSize = isMouseDown ? 65 : 50;
    ctx.beginPath();
    ctx.arc(0, 0, ringSize, 0, Math.PI * 2);
    ctx.stroke();

    // Crosshair
    ctx.beginPath();
    ctx.moveTo(-15, 0); ctx.lineTo(15, 0);
    ctx.moveTo(0, -15); ctx.lineTo(0, 15);
    ctx.stroke();

    // Center Dot
    ctx.fillStyle = isMouseDown ? '#fff' : 'var(--accent-cyan)';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    // Connection line to player anchor (bottom center)
    if (!isMouseDown) {
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.1)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, height - 50); // Connect to bottom
        ctx.stroke();
    }

    ctx.restore();
  }

  // Background Floating Dust
  function drawDust() {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for(let i=0; i<10; i++) {
        // Deterministic pseudo-random positions based on time
        let x = (Math.sin(frame * 0.01 + i) * width/2) + width/2;
        let y = (Math.cos(frame * 0.005 + i * 2) * height/2) + height/2;
        ctx.beginPath();
        ctx.arc(x, y, 1, 0, Math.PI*2);
        ctx.fill();
    }
  }

  function loop() {
    frame++;
    ctx.clearRect(0, 0, width, height);

    drawDust();

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
