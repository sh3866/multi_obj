<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Capture // Sector 7</title>
<style>
  :root {
    --bg-deep: #030305;
    --bg-panel: rgba(10, 12, 20, 0.85);
    --accent-cyan: #00f3ff;
    --accent-gold: #ffcc00;
    --accent-pink: #ff0055;
    --accent-purple: #bd00ff;
    --accent-orange: #ff6600;
    --glass-border: rgba(255, 255, 255, 0.15);
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "Courier New", Courier, monospace;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Scene & Environment --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  /* The 3D Grid - Enhanced for depth */
  .grid-bg {
    position: absolute;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background-image: 
      linear-gradient(rgba(0, 243, 255, 0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 243, 255, 0.15) 1px, transparent 1px);
    background-size: 80px 80px;
    transform-origin: 50% 0%;
    transform: perspective(500px) rotateX(75deg) translateY(-100px);
    mask-image: linear-gradient(to bottom, transparent 20%, black 60%, transparent 95%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 20%, black 60%, transparent 95%);
    z-index: 0;
    pointer-events: none;
    animation: gridScroll 15s linear infinite;
  }

  @keyframes gridScroll {
    0% { background-position: 0 0; }
    100% { background-position: 0 80px; }
  }

  /* Atmospheric Horizon & Fog */
  .atmosphere {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  
  /* Horizon Glow */
  .atmosphere::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 50%;
    background: radial-gradient(ellipse at 50% 0%, rgba(0, 243, 255, 0.08) 0%, transparent 60%);
  }

  /* Strong Vignette */
  .atmosphere::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 40%, var(--bg-deep) 90%);
    box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
  }

  /* Canvas Layer */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none; 
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 3.5rem;
    margin: 0;
    line-height: 0.9;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: white;
    /* Softened neon glow per critique */
    text-shadow: 0 0 20px rgba(0, 243, 255, 0.4), 0 0 40px rgba(0, 243, 255, 0.1);
    font-style: italic;
    background: linear-gradient(to bottom, #fff, #e0e0e0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--accent-cyan);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.9;
    margin-top: 5px;
    text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
  }

  /* HUD Panel - Polished & Horizontal */
  .hud-panel {
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    padding: 0.5rem 0.5rem 0.5rem 1.5rem;
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    border-left: 4px solid var(--accent-cyan);
    position: relative;
    overflow: hidden;
    transform: skewX(-10deg);
  }

  /* HUD Scanline effect */
  .hud-panel::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 2px;
    background: rgba(255,255,255,0.2);
    animation: scan 4s linear infinite;
  }

  @keyframes scan {
    0% { top: 0; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }

  .stat-container {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    transform: skewX(10deg); /* Counter-skew text */
  }

  .stat-label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: bold;
  }

  .stat-value {
    font-family: var(--font-mono);
    font-size: 2.2rem;
    font-weight: bold;
    color: white;
    line-height: 1;
    text-shadow: 0 0 10px var(--accent-cyan);
    min-width: 2ch;
    text-align: right;
  }

  /* Footer / Actions */
  .footer {
    display: flex;
    justify-content: flex-end;
    align-items: flex-end;
    pointer-events: auto;
    width: 100%;
    margin-bottom: 1rem;
  }

  /* Clarified Button */
  .fab-btn {
    background: var(--accent-cyan); /* Solid fill */
    color: #000;
    font-family: var(--font-display);
    font-size: 1.2rem;
    padding: 1rem 3rem;
    border-radius: 2px;
    border: 1px solid var(--accent-cyan);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    position: relative;
    overflow: hidden;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }

  .fab-btn:hover {
    background: white;
    color: #000;
    box-shadow: 0 0 30px rgba(0, 243, 255, 0.8);
    transform: translateY(-2px);
  }

  .fab-btn:active {
    transform: scale(0.98);
  }

  /* Toast */
  .toast {
    position: absolute;
    top: 25%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(5, 5, 8, 0.95);
    border: 1px solid var(--accent-gold);
    color: var(--accent-gold);
    padding: 1rem 2.5rem;
    border-radius: 2px;
    font-family: var(--font-mono);
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 25px rgba(255, 204, 0, 0.3);
    display: flex;
    align-items: center;
    gap: 12px;
    border-left: 4px solid var(--accent-gold);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    h1 { font-size: 2.5rem; }
    .ui-layer { padding: 1.5rem; }
    .footer { justify-content: center; }
    .fab-btn { width: 100%; justify-content: center; }
    .hud-panel { border-left: none; border-bottom: 4px solid var(--accent-cyan); transform: skewX(0); width: 100%; justify-content: center;}
    .stat-container { transform: skewX(0); justify-content: center; width: 100%; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Environment -->
  <div class="grid-bg"></div>
  <div class="atmosphere"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Capture</h1>
        <div class="subtitle">Sector 7 // Bio-Drift</div>
      </div>
      <div class="hud-panel">
        <div class="stat-container">
          <div class="stat-label">Specimens</div>
          <div class="stat-value" id="scoreDisplay">00</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z"/></svg>
      <span>Specimen Acquired</span>
    </div>

    <footer class="footer">
      <button class="fab-btn" onclick="resetGame()">
        <span>View Collection</span>
      </button>
    </footer>
  </div>
</div>

<script>
  /**
   * Enhanced Game Logic
   * - Distinct Player Avatar (Drone)
   * - Complex Creatures (Pulsing cores, trails, eyes)
   * - Atmospheric Depth
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = []; // Explosion particles
  let dustParticles = []; // Background atmosphere
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let prevMouse = { x: -1000, y: -1000 }; // For calculating velocity
  let isMouseDown = false;
  let frame = 0;

  // Configuration
  const CREATURE_COUNT = 12;
  const DUST_COUNT = 80;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initDust();
  }
  window.addEventListener('resize', resize);

  // Input Handling
  window.addEventListener('mousemove', e => {
    prevMouse.x = mouse.x;
    prevMouse.y = mouse.y;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    prevMouse.x = mouse.x;
    prevMouse.y = mouse.y;
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    prevMouse.x = mouse.x;
    prevMouse.y = mouse.y;
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  // Background Dust for Atmosphere
  class Dust {
    constructor() {
      this.reset();
    }
    reset() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.size = Math.random() * 2;
      this.speed = Math.random() * 0.3 + 0.05;
      this.opacity = Math.random() * 0.4;
      this.drift = (Math.random() - 0.5) * 0.5;
    }
    update() {
      this.y -= this.speed;
      this.x += this.drift;
      if (this.y < 0) this.y = height;
      if (this.x < 0) this.x = width;
      if (this.x > width) this.x = 0;
    }
    draw(ctx) {
      ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 8 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.015;
      this.size = Math.random() * 4 + 2;
      this.type = Math.random() > 0.5 ? 'circle' : 'rect';
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.94; // Friction
      this.vy *= 0.94;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      if (this.type === 'circle') {
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      } else {
        ctx.rect(this.x, this.y, this.size, this.size);
      }
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset(true);
    }

    reset(initial = false) {
      // Spawn logic
      this.x = initial ? Math.random() * width : (Math.random() < 0.5 ? -50 : width + 50);
      this.y = initial ? Math.random() * height : Math.random() * height;
      
      // Physics
      this.vx = (Math.random() - 0.5) * 1.2;
      this.vy = (Math.random() - 0.5) * 1.2;
      
      // Appearance
      this.radius = Math.random() * 15 + 18;
      this.shapeType = Math.floor(Math.random() * 4); // 0: Sphere, 1: Hex, 2: Shard, 3: Triangle
      this.color = this.getColor();
      this.rotation = Math.random() * Math.PI * 2;
      this.rotationSpeed = (Math.random() - 0.5) * 0.03;
      this.wobble = Math.random() * 100;
      this.isCaught = false;
      
      // Trail history
      this.history = [];
    }

    getColor() {
      const colors = ['#00f3ff', '#ff0055', '#ffcc00', '#bd00ff', '#ff6600'];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    update() {
      if (this.isCaught) return;

      // Trail logic
      this.history.push({x: this.x, y: this.y});
      if (this.history.length > 12) this.history.shift();

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.rotation += this.rotationSpeed;
      this.wobble += 0.04;

      // Organic drift (Sine wave movement)
      this.x += Math.sin(this.wobble) * 0.15;
      this.y += Math.cos(this.wobble * 0.8) * 0.15;

      // Bounce boundaries
      if (this.x < -60 || this.x > width + 60) this.vx *= -1;
      if (this.y < -60 || this.y > height + 60) this.vy *= -1;

      // Mouse Interaction (Flee)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 220) {
        const force = (220 - dist) / 220;
        this.vx += (dx / dist) * force * 0.8;
        this.vy += (dy / dist) * force * 0.8;
      }

      // Max Speed Cap
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 5) {
        this.vx = (this.vx / speed) * 5;
        this.vy = (this.vy / speed) * 5;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      // Draw Trail (Thinner, fading)
      if (this.history.length > 1) {
        ctx.beginPath();
        ctx.moveTo(this.history[0].x, this.history[0].y);
        for (let i = 1; i < this.history.length; i++) {
          // Smooth curve
          const p = this.history[i];
          ctx.lineTo(p.x, p.y);
        }
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.3;
        ctx.stroke();
        ctx.globalAlpha = 1.0;
      }

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);

      // Glow Effect
      ctx.shadowBlur = 15;
      ctx.shadowColor = this.color;
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; // Darker core
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2;

      // Shape Drawing
      ctx.beginPath();
      if (this.shapeType === 0) {
        // Sphere
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
      } else if (this.shapeType === 1) {
        // Hexagon
        for (let i = 0; i < 6; i++) {
          ctx.lineTo(this.radius * Math.cos(i * Math.PI / 3), this.radius * Math.sin(i * Math.PI / 3));
        }
        ctx.closePath();
      } else if (this.shapeType === 2) {
        // Triangle
        ctx.moveTo(this.radius, 0);
        ctx.lineTo(-this.radius * 0.7, this.radius * 0.7);
        ctx.lineTo(-this.radius * 0.7, -this.radius * 0.7);
        ctx.closePath();
      } else {
        // Shard (Diamond)
        ctx.moveTo(0, -this.radius);
        ctx.lineTo(this.radius * 0.6, 0);
        ctx.lineTo(0, this.radius);
        ctx.lineTo(-this.radius * 0.6, 0);
        ctx.closePath();
      }
      
      ctx.fill();
      ctx.stroke();

      // --- Internal Complexity (Biology) ---
      
      // 1. Pulsing Core
      const pulse = Math.sin(frame * 0.1) * 0.2 + 0.8;
      ctx.shadowBlur = 0; // Reset shadow for inner details
      
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = 0.6 * pulse;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;

      // 2. Asymmetrical "Eye" or Detail
      // Calculate eye position based on rotation to look "forward" or fixed relative to shape
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.radius * 0.4, -this.radius * 0.2, this.radius * 0.2, 0, Math.PI * 2);
      ctx.fill();
      
      // Pupil
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(this.radius * 0.45, -this.radius * 0.2, this.radius * 0.08, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function initDust() {
    dustParticles = [];
    for(let i=0; i<DUST_COUNT; i++) {
      dustParticles.push(new Dust());
    }
  }

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    updateScore();
  }

  function updateScore() {
    scoreEl.innerText = score < 10 ? '0' + score : score;
  }

  function checkCatch() {
    const catchRadius = 70; // Hit area

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    updateScore();
    
    // Explosion FX
    for(let i=0; i<30; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1500);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 1500);
  }

  function resetGame() {
    init();
  }

  function drawPlayerAvatar() {
    // Calculate movement vector for banking effect
    const dx = mouse.x - prevMouse.x;
    const dy = mouse.y - prevMouse.y;
    const velocity = Math.sqrt(dx*dx + dy*dy);
    const angle = Math.atan2(dy, dx);
    
    // Banking effect (tilt based on speed)
    const bank = Math.min(Math.max(velocity * 0.05, -0.5), 0.5);

    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    ctx.rotate(angle + Math.PI/2 + bank); // Rotate to face movement direction + tilt

    // --- Drone Design ---
    // 1. Central Core (Player)
    ctx.fillStyle = '#050508';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#ffffff';
    
    ctx.beginPath();
    ctx.rect(-6, -10, 12, 20); // Boxy center
    ctx.fill();
    ctx.stroke();

    // 2. Rotating Arms / Net
    ctx.rotate(-angle - Math.PI/2 - bank); // Counter-rotate arms so they spin independently
    ctx.rotate(frame * 0.1); // Spin

    const armLen = 40;
    ctx.strokeStyle = isMouseDown ? '#ffcc00' : '#00f3ff';
    ctx.lineWidth = 2;
    ctx.shadowColor = ctx.strokeStyle;

    // Draw 3 Arms
    for(let i=0; i<3; i++) {
      ctx.rotate((Math.PI * 2) / 3);
      
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -armLen);
      ctx.stroke();

      // End effector (Net part)
      ctx.beginPath();
      ctx.arc(0, -armLen, 8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fill();
      ctx.stroke();
      
      // Small light on arm
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, -armLen, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    // 3. The "Net" Area (Visual feedback for catch zone)
    if (isMouseDown) {
      ctx.globalAlpha = 0.2 + Math.sin(frame * 0.5) * 0.1;
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath();
      ctx.arc(0, 0, 65, 0, Math.PI * 2);
      ctx.fill();
      
      // Grid pattern in net
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 65, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 45, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    frame++;
    ctx.clearRect(0, 0, width, height);

    // Draw Atmosphere
    dustParticles.forEach(d => {
      d.update();
      d.draw(ctx);
    });

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player
    drawPlayerAvatar();

    requestAnimationFrame(loop);
  }

  // Start
  resize();
  init();
  loop();

</script>
