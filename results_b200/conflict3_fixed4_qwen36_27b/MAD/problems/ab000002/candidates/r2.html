<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascension - Skill Matrix</title>
<style>
    :root {
        /* Palette: Deep Void & Arcane Gold */
        --bg-deep: #05070a;
        --bg-panel: #0a0f14;
        --bg-metal: #11161d;
        
        --border-dim: rgba(255, 255, 255, 0.08);
        --border-gold: rgba(234, 179, 8, 0.5);
        
        --accent-gold: #eab308;
        --accent-gold-dim: #854d0e;
        --accent-glow: rgba(234, 179, 8, 0.6);
        
        --accent-blue: #3b82f6; /* Passive/Utility distinction */
        --accent-blue-dim: #1e3a8a;
        
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --text-dark: #475569;

        --font-display: 'Cinzel', 'Georgia', serif;
        --font-ui: 'Segoe UI', 'Roboto', sans-serif;

        /* Node Sizing */
        --node-s: 48px;
        --node-m: 64px;
        --node-l: 96px; /* Capstone */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Header: Integrated Status --- */
    header {
        height: 70px;
        display: flex;
        align-items: center;
        padding: 0 30px;
        position: relative;
        z-index: 20;
        background: linear-gradient(to bottom, #020408 0%, rgba(2,4,8,0) 100%);
        border-bottom: 1px solid var(--border-dim);
        justify-content: space-between;
    }

    .brand {
        display: flex;
        flex-direction: column;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 1.2rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .subtitle {
        font-size: 0.65rem;
        color: var(--accent-gold);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.8;
    }

    /* Player Status Block */
    .status-block {
        display: flex;
        align-items: center;
        gap: 25px;
        background: rgba(15, 23, 42, 0.6);
        padding: 8px 20px;
        border-radius: 4px;
        border: 1px solid var(--border-dim);
        backdrop-filter: blur(4px);
    }

    .level-badge {
        display: flex;
        align-items: baseline;
        gap: 8px;
    }

    .lvl-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .lvl-num { font-family: var(--font-display); font-size: 1.8rem; color: #fff; }

    .xp-pill {
        width: 120px;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .xp-text {
        font-size: 0.65rem;
        color: var(--text-muted);
        display: flex;
        justify-content: space-between;
    }

    .xp-track {
        height: 4px;
        background: #1e293b;
        border-radius: 2px;
        overflow: hidden;
    }
    .xp-fill {
        height: 100%;
        width: 68%;
        background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
        box-shadow: 0 0 8px var(--accent-gold);
    }

    .points-badge {
        display: flex;
        align-items: center;
        gap: 10px;
        border-left: 1px solid var(--border-dim);
        padding-left: 20px;
    }

    .points-icon {
        width: 24px;
        height: 24px;
        background: radial-gradient(circle at 30% 30%, #fff, var(--accent-gold));
        border-radius: 50%;
        box-shadow: 0 0 10px var(--accent-gold);
        animation: pulse 3s infinite ease-in-out;
    }

    .points-count {
        font-size: 1.2rem;
        font-weight: bold;
        color: var(--accent-gold);
    }

    /* --- Main Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
    }

    /* --- Sidebar: Metallic/Textured --- */
    aside {
        width: 280px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 24px;
        z-index: 10;
        /* Metallic finish */
        background: 
            repeating-linear-gradient(
                45deg,
                rgba(255,255,255,0.01) 0px,
                rgba(255,255,255,0.01) 2px,
                transparent 2px,
                transparent 4px
            ),
            linear-gradient(to right, #080b10, #11161d);
        border-right: 1px solid var(--border-dim);
        box-shadow: 5px 0 20px rgba(0,0,0,0.5);
    }

    .char-profile {
        margin-bottom: 30px;
        text-align: center;
        border-bottom: 1px solid var(--border-dim);
        padding-bottom: 20px;
    }

    .char-avatar {
        width: 80px;
        height: 80px;
        margin: 0 auto 12px;
        border-radius: 50%;
        background: #1e293b;
        border: 2px solid var(--accent-gold);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 2rem;
        color: var(--text-muted);
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .char-name { font-family: var(--font-display); font-size: 1.1rem; color: #fff; margin-bottom: 4px; }
    .char-class { font-size: 0.75rem; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 0.1em; }

    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 10px;
    }

    .stat-item {
        background: rgba(0,0,0,0.3);
        padding: 8px;
        border-radius: 4px;
        border: 1px solid var(--border-dim);
        text-align: center;
    }
    .stat-name { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 2px; }
    .stat-val { font-size: 1rem; color: var(--text-main); font-weight: 600; }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background-color: var(--bg-deep);
        /* Subtle grid pattern */
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 50px 50px;
    }

    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 0;
        left: 0;
        width: 1400px;
        height: 1200px;
        transform-origin: center;
    }

    /* SVG Connections */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
    }

    .path-line {
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        transition: all 0.5s ease;
    }

    /* Locked Path */
    .path-line.locked {
        stroke: #1e293b; /* Very dark blue/gray */
        stroke-dasharray: 6 4; /* Dashed for progression flow */
    }

    /* Active Path */
    .path-line.active {
        stroke: var(--accent-gold);
        stroke-width: 3;
        filter: drop-shadow(0 0 6px var(--accent-gold));
        stroke-dasharray: none;
    }

    /* --- Nodes: Standardized Hexagons --- */
    .node {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
        transform: translate(-50%, -50%); /* Center on coordinate */
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        cursor: pointer;
    }

    .hex {
        position: relative;
        background: var(--bg-metal);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    /* Sizing */
    .node[data-tier="1"] .hex { width: var(--node-l); height: var(--node-l); } /* Capstone */
    .node[data-tier="2"] .hex { width: var(--node-m); height: var(--node-m); } /* Major */
    .node[data-tier="3"] .hex { width: var(--node-s); height: var(--node-s); } /* Standard */

    /* Border Simulation via Pseudo-element (since clip-path cuts borders) */
    .hex::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--border-dim);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        z-index: -1;
        transform: scale(1.05); /* Expand to create border width */
    }

    .node-icon {
        width: 40%;
        height: 40%;
        fill: var(--text-dark);
        opacity: 0.5;
        transition: all 0.3s ease;
    }

    /* --- States --- */

    /* Locked State */
    .node.locked .hex {
        background: #0f1218;
    }
    .node.locked .hex::before {
        background: #1e293b;
    }

    /* Unlocked State */
    .node.unlocked .hex {
        background: radial-gradient(circle at 50% 50%, #2a2a2a, #111);
    }
    
    /* Color Differentiation */
    .node.unlocked[data-type="Ultimate"] .hex::before { background: var(--accent-gold); }
    .node.unlocked[data-type="Ultimate"] .node-icon { fill: var(--accent-gold); opacity: 1; filter: drop-shadow(0 0 5px var(--accent-gold)); }
    
    .node.unlocked[data-type="Passive"] .hex::before { background: var(--accent-blue); }
    .node.unlocked[data-type="Passive"] .node-icon { fill: var(--accent-blue); opacity: 1; filter: drop-shadow(0 0 5px var(--accent-blue)); }

    /* Capstone Specifics */
    .node[data-tier="1"].unlocked .hex::before {
        background: #fff;
        box-shadow: 0 0 20px var(--accent-gold);
    }

    /* Hover */
    .node:hover {
        z-index: 10;
        transform: translate(-50%, -50%) scale(1.1);
    }
    .node:not(.unlocked):hover .hex {
        background: #1e293b;
    }
    .node:not(.unlocked):hover .hex::before {
        background: #475569;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        width: 280px;
        background: rgba(10, 15, 20, 0.95);
        border: 1px solid var(--border-dim);
        border-left: 4px solid var(--text-dark);
        padding: 16px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        backdrop-filter: blur(10px);
    }

    .tooltip.show { opacity: 1; transform: translateY(0); }
    
    .tooltip.t-type-Ultimate { border-left-color: var(--accent-gold); }
    .tooltip.t-type-Passive { border-left-color: var(--accent-blue); }

    .tt-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
    .tt-title { font-family: var(--font-display); font-size: 1.1rem; color: #fff; }
    .tt-tier { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    
    .tt-desc { font-size: 0.85rem; line-height: 1.5; color: #cbd5e1; margin-bottom: 12px; }
    
    .tt-req { 
        font-size: 0.75rem; 
        color: #ef4444; 
        background: rgba(239, 68, 68, 0.1); 
        padding: 6px; 
        border-radius: 2px;
        display: none;
    }
    .tooltip.locked .tt-req { display: block; }
    .tooltip.locked .tt-title { color: var(--text-muted); }

    @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
        100% { transform: scale(1); opacity: 1; }
    }

</style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>Ascension Matrix</h1>
            <div class="subtitle">Class: Void Walker</div>
        </div>

        <div class="status-block">
            <div class="level-badge">
                <span class="lvl-label">Lvl</span>
                <span class="lvl-num">42</span>
            </div>
            
            <div class="xp-pill">
                <div class="xp-text">
                    <span>XP</span>
                    <span>68%</span>
                </div>
                <div class="xp-track">
                    <div class="xp-fill"></div>
                </div>
            </div>

            <div class="points-badge">
                <div class="points-icon"></div>
                <div style="display:flex; flex-direction:column;">
                    <span class="lvl-label">Skill Points</span>
                    <span class="points-count">3 Available</span>
                </div>
            </div>
        </div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="char-profile">
                <div class="char-avatar">K</div>
                <div class="char-name">Kaelen Thorne</div>
                <div class="char-class">Duelist / Arcanist</div>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-name">STR</span>
                    <span class="stat-val">14</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">DEX</span>
                    <span class="stat-val">28</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">INT</span>
                    <span class="stat-val">35</span>
                </div>
                <div class="stat-item">
                    <span class="stat-name">VIT</span>
                    <span class="stat-val">12</span>
                </div>
            </div>
        </aside>

        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected via JS -->
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <div class="tt-header">
            <span class="tt-title" id="tt-title">Skill</span>
            <span class="tt-tier" id="tt-type">Passive</span>
        </div>
        <p class="tt-desc" id="tt-desc">Description</p>
        <div class="tt-req" id="tt-req">Requires: [Skill Name]</div>
    </div>

<script>
    // --- Data Structure ---
    const skills = [
        // Capstone (Top)
        { id: 'cap', x: 700, y: 100, name: "Void Monarch", type: "Ultimate", tier: 1, desc: "Unleash the full potential of the void. All damage +50%.", unlocked: true, req: null },
        
        // Tier 2 (Major Branches)
        { id: 'maj_phys', x: 500, y: 280, name: "Titan's Will", type: "Passive", tier: 2, desc: "Master of physical combat. STR +10.", unlocked: true, req: 'cap' },
        { id: 'mag_arc', x: 900, y: 280, name: "Arcane Surge", type: "Passive", tier: 2, desc: "Master of the arcane. INT +10.", unlocked: true, req: 'cap' },

        // Tier 3 (Standard)
        // Phys Branch
        { id: 'phys_1', x: 350, y: 450, name: "Heavy Strike", type: "Passive", tier: 3, desc: "Melee attacks deal 15% more damage.", unlocked: true, req: 'maj_phys' },
        { id: 'phys_2', x: 650, y: 450, name: "Unstoppable", type: "Passive", tier: 3, desc: "Cannot be knocked back by enemies.", unlocked: false, req: 'maj_phys' },
        
        // Mag Branch
        { id: 'mag_1', x: 750, y: 450, name: "Fireball", type: "Passive", tier: 3, desc: "Unlock Fireball ability.", unlocked: true, req: 'mag_arc' },
        { id: 'mag_2', x: 1050, y: 450, name: "Mana Flow", type: "Passive", tier: 3, desc: "Mana regen increased by 20%.", unlocked: false, req: 'mag_arc' },

        // Tier 4 (End Nodes)
        { id: 'phys_end', x: 200, y: 650, name: "Execution", type: "Ultimate", tier: 3, desc: "Instantly kill enemies below 10% HP.", unlocked: false, req: 'phys_1' },
        { id: 'mag_end', x: 1200, y: 650, name: "Nova", type: "Ultimate", tier: 3, desc: "Explode mana pool for AoE damage.", unlocked: false, req: 'mag_2' }
    ];

    // SVG Icons
    const icons = {
        ultimate: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
        passive: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"
    };

    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Init ---
    function init() {
        const container = document.getElementById('treeContainer');
        // Center view
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        panX = (cw - 1400) / 2;
        panY = (ch - 1200) / 2 + 50;
        updateTransform();

        // Render Lines
        drawConnections();

        // Render Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : 'locked'}`;
            node.dataset.id = skill.id;
            node.dataset.type = skill.type;
            node.dataset.tier = skill.tier;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;

            const iconPath = skill.type === 'Ultimate' ? icons.ultimate : icons.passive;

            node.innerHTML = `
                <div class="hex">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });
    }

    function drawConnections() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    // Visual logic: If child is unlocked, line is active. 
                    // If parent is unlocked but child is not, line is "dashed/ready".
                    // If parent locked, line is dim.
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    } else {
                        line.classList.add('locked');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        // Reset classes
        tooltip.className = 'tooltip show';
        if (skill.type === 'Ultimate') tooltip.classList.add('t-type-Ultimate');
        else tooltip.classList.add('t-type-Passive');

        if (!skill.unlocked) {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'N/A'}`;
        } else {
            tooltip.classList.remove('locked');
        }

        // Position
        let x = e.clientX + 20;
        let y = e.clientY - 20;
        if (x + 280 > window.innerWidth) x = e.clientX - 300;
        if (y + 150 > window.innerHeight) y = e.clientY - 150;

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('show');
    }

    function toggleSkill(id) {
        // Simple toggle logic for demo
        const skill = skills.find(s => s.id === id);
        if (skill.unlocked) return; // Can't toggle off in this demo
        
        const parent = skills.find(s => s.id === skill.req);
        if (parent && parent.unlocked) {
            skill.unlocked = true;
            updateVisuals();
        } else {
            // Shake animation or red flash could go here
        }
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            if (s.unlocked) {
                el.classList.add('unlocked');
                el.classList.remove('locked');
            } else {
                el.classList.remove('unlocked');
                el.classList.add('locked');
            }
        });
        drawConnections();
    }

    // --- Pan/Zoom ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0, panY = 0, scale = 1;

    function updateTransform() {
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = -e.deltaY * 0.001;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        updateTransform();
    });

    init();
</script>
</body>
</html>
