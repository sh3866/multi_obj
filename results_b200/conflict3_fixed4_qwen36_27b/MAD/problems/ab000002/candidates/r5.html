<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether Ascension - Skill Matrix</title>
<style>
    :root {
        /* Palette: Void & Neon Cyan */
        --bg-deep: #05070a;
        --bg-panel: #0d1117;
        --bg-panel-border: #1e2530;
        
        --accent-primary: #00f0ff; /* Cyan */
        --accent-primary-dim: #005f63;
        --accent-glow: rgba(0, 240, 255, 0.6);
        
        --accent-secondary: #7000ff; /* Epic/Purple */
        --accent-secondary-glow: rgba(112, 0, 255, 0.6);

        --text-main: #e6edf3;
        --text-muted: #8b949e;
        --text-dark: #30363d;

        /* Typography */
        --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

        /* Hexagon Geometry */
        /* Hex width/height relationship: Height = Width * 1.1547 */
        --hex-s: 36px; 
        --hex-m: 52px;
        --hex-l: 76px; /* Capstone */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Header --- */
    header {
        height: 70px;
        display: flex;
        align-items: center;
        padding: 0 40px;
        position: relative;
        z-index: 20;
        background: linear-gradient(to bottom, var(--bg-deep) 0%, rgba(5,7,10,0.8) 100%);
        border-bottom: 1px solid var(--bg-panel-border);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .logo-shape {
        width: 32px;
        height: 32px;
        background: var(--accent-primary);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        box-shadow: 0 0 15px var(--accent-glow);
    }

    h1 {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-main);
    }

    .subtitle {
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--accent-primary);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-left: 20px;
        padding-left: 20px;
        border-left: 1px solid var(--bg-panel-border);
        opacity: 0.9;
    }

    /* --- Main Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
    }

    /* --- Sidebar: Sharp, Angular, Integrated --- */
    aside {
        width: 340px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 0;
        z-index: 10;
        background: var(--bg-panel);
        border-right: 1px solid var(--bg-panel-border);
        box-shadow: 10px 0 50px rgba(0,0,0,0.5);
        position: relative;
    }

    /* Angular Cutout Effect for Sidebar Sections */
    .panel-section {
        padding: 30px;
        border-bottom: 1px solid var(--bg-panel-border);
        position: relative;
    }
    
    /* Decorative corner marks */
    .panel-section::after {
        content: '';
        position: absolute;
        bottom: -1px;
        right: 0;
        width: 20px;
        height: 20px;
        background: linear-gradient(135deg, transparent 50%, var(--bg-panel-border) 50%);
    }

    /* Character Profile */
    .char-profile {
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .char-avatar {
        width: 60px;
        height: 60px;
        background: #161b22;
        /* Sharp Hexagon Avatar */
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        color: var(--accent-primary);
        font-weight: 700;
        border: 2px solid var(--text-dark);
        position: relative;
    }
    /* Border fix for clip-path */
    .char-avatar::before {
        content: '';
        position: absolute;
        inset: -2px;
        background: var(--accent-primary);
        z-index: -1;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }

    .char-info {
        display: flex;
        flex-direction: column;
    }

    .char-name { font-size: 1.1rem; font-weight: 700; color: var(--text-main); letter-spacing: 0.02em; }
    .char-class { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }

    /* --- Level & XP --- */
    .progress-section {
        padding-top: 10px;
    }

    .level-display {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 15px;
    }

    .lvl-label { 
        font-size: 0.75rem; 
        color: var(--text-muted); 
        text-transform: uppercase; 
        font-weight: 700; 
        letter-spacing: 0.05em;
    }

    .lvl-num { 
        font-size: 3rem; 
        font-weight: 800; 
        color: var(--text-main); 
        line-height: 1;
        letter-spacing: -0.02em;
        text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    .xp-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .xp-info {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
    }

    .xp-track {
        height: 8px;
        background: #161b22;
        /* Sharp angular bar */
        clip-path: polygon(0 0, 100% 0, 95% 100%, 0% 100%);
        position: relative;
        border: 1px solid var(--bg-panel-border);
    }

    .xp-fill {
        height: 100%;
        width: 68%;
        background: var(--accent-primary);
        box-shadow: 0 0 10px var(--accent-glow);
        position: relative;
    }

    /* --- Skill Points: Unified Geometry --- */
    .points-section {
        background: rgba(255,255,255,0.02);
        padding: 25px 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
    }

    /* Hexagon background decoration for points */
    .points-section::before {
        content: '';
        position: absolute;
        top: 50%; left: 50%;
        width: 200px; height: 200px;
        background: radial-gradient(circle, rgba(0, 240, 255, 0.05) 0%, transparent 70%);
        transform: translate(-50%, -50%);
        pointer-events: none;
    }

    .points-text {
        display: flex;
        flex-direction: column;
        z-index: 2;
    }

    .points-label {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
    }

    .points-desc {
        font-size: 0.85rem;
        color: var(--text-main);
        font-weight: 500;
    }

    .points-badge {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 60px;
        height: 60px;
        /* Hexagon Badge */
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        background: #161b22;
        position: relative;
        z-index: 2;
    }

    /* Inner Hexagon for border effect */
    .points-badge::after {
        content: '';
        position: absolute;
        inset: 2px;
        background: var(--bg-panel);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }

    .points-count {
        position: relative;
        z-index: 3;
        font-size: 1.4rem;
        font-weight: 800;
        color: var(--accent-primary);
        text-shadow: 0 0 10px var(--accent-glow);
    }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background-color: var(--bg-deep);
        /* Subtle Tech Grid */
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 40px 40px;
    }

    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 0;
        left: 0;
        width: 1800px;
        height: 1200px;
        transform-origin: center;
    }

    /* SVG Connections */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        overflow: visible;
    }

    /* Path Lines */
    .path-line {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .path-line.locked {
        stroke: #21262d;
        stroke-width: 2;
        stroke-dasharray: 4 4;
        opacity: 0.6;
    }

    .path-line.active {
        stroke: var(--accent-primary);
        stroke-width: 2;
        opacity: 0.8;
        filter: drop-shadow(0 0 4px var(--accent-glow));
    }
    
    /* Epic Line */
    .path-line.active-epic {
        stroke: var(--accent-secondary);
        stroke-width: 3;
        filter: drop-shadow(0 0 6px var(--accent-secondary-glow));
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
        transform: translate(-50%, -50%);
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        cursor: pointer;
    }

    /* Hex Container */
    .hex {
        position: relative;
        background: #161b22;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    /* Sizing */
    .node[data-tier="1"] .hex { width: var(--hex-l); height: calc(var(--hex-l) * 1.1547); } /* Root */
    .node[data-tier="2"] .hex { width: var(--hex-m); height: calc(var(--hex-m) * 1.1547); } /* Branch */
    .node[data-tier="3"] .hex { width: var(--hex-s); height: calc(var(--hex-s) * 1.1547); } /* Leaf */

    /* Inner Border Simulation */
    .hex::before {
        content: '';
        position: absolute;
        inset: 0;
        background: #30363d;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        z-index: -1;
        transform: scale(1.08);
    }

    .node-icon {
        width: 40%;
        height: 40%;
        fill: var(--text-dark);
        opacity: 0.6;
        transition: all 0.3s ease;
    }

    /* --- States & Hierarchy --- */

    /* Locked State */
    .node.locked .hex { background: #0d1117; }
    .node.locked .hex::before { background: #161b22; }

    /* Unlocked State (Standard) */
    .node.unlocked .hex {
        background: #0d1117;
        box-shadow: 0 0 15px var(--accent-glow);
    }
    
    .node.unlocked .hex::before { 
        background: var(--accent-primary);
        transform: scale(1.06);
    }
    
    .node.unlocked .node-icon { 
        fill: #fff; 
        opacity: 1; 
        filter: drop-shadow(0 0 2px var(--accent-primary));
    }

    /* Epic/Capstone State */
    .node.unlocked[data-type="Epic"] .hex {
        box-shadow: 0 0 25px var(--accent-secondary-glow);
    }
    
    .node.unlocked[data-type="Epic"] .hex::before { 
        background: var(--accent-secondary);
    }
    
    .node.unlocked[data-type="Epic"] .node-icon { 
        filter: drop-shadow(0 0 4px var(--accent-secondary));
    }

    /* Hover */
    .node:hover {
        z-index: 10;
        transform: translate(-50%, -50%) scale(1.1);
    }
    .node:not(.unlocked):hover .hex {
        background: #21262d;
    }
    .node:not(.unlocked):hover .hex::before {
        background: #484f58;
    }
    .node:not(.unlocked):hover .node-icon {
        opacity: 1;
        fill: var(--text-muted);
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        width: 280px;
        background: rgba(13, 17, 23, 0.95);
        border: 1px solid var(--bg-panel-border);
        border-left: 3px solid var(--text-dark);
        padding: 20px;
        /* Angular Tooltip */
        clip-path: polygon(0 0, 100% 0, 100% 85%, 95% 100%, 0 100%);
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        backdrop-filter: blur(8px);
    }

    .tooltip.show { opacity: 1; transform: translateY(0); }
    
    .tooltip.t-type-Epic { border-left-color: var(--accent-secondary); }
    .tooltip.t-type-Passive { border-left-color: var(--accent-primary); }

    .tt-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; border-bottom: 1px solid var(--bg-panel-border); padding-bottom: 10px; }
    .tt-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); letter-spacing: 0.02em; }
    .tt-tier { font-size: 0.6rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; background: rgba(255,255,255,0.05); padding: 2px 6px; clip-path: polygon(0 0, 100% 0, 90% 100%, 0% 100%); }
    
    .tt-desc { font-size: 0.8rem; line-height: 1.5; color: #8b949e; margin-bottom: 15px; font-weight: 400; }
    
    .tt-stats {
        display: flex;
        gap: 10px;
        font-size: 0.7rem;
        color: var(--text-muted);
        background: rgba(0,0,0,0.3);
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid rgba(255,255,255,0.05);
    }
    .tt-stat span { color: var(--accent-primary); font-weight: 700; }

    .tt-req { 
        font-size: 0.7rem; 
        color: #f87171; 
        background: rgba(239, 68, 68, 0.1); 
        padding: 8px;
        display: none;
        border: 1px solid rgba(239, 68, 68, 0.1);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 5% 100%, 0 90%);
    }
    .tooltip.locked .tt-req { display: block; }
    .tooltip.locked .tt-title { color: var(--text-muted); }

</style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="logo-shape"></div>
            <h1>Aether Ascension</h1>
        </div>
        <div class="subtitle">Class: Void Walker</div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="panel-section">
                <div class="char-profile">
                    <div class="char-avatar">K</div>
                    <div class="char-info">
                        <div class="char-name">Kaelen Thorne</div>
                        <div class="char-class">Duelist / Arcanist</div>
                    </div>
                </div>
            </div>

            <div class="panel-section progress-section">
                <div class="level-display">
                    <span class="lvl-label">Level</span>
                    <span class="lvl-num">42</span>
                </div>
                <div class="xp-container">
                    <div class="xp-info">
                        <span>Experience</span>
                        <span>68%</span>
                    </div>
                    <div class="xp-track">
                        <div class="xp-fill"></div>
                    </div>
                </div>
            </div>

            <div class="points-section">
                <div class="points-text">
                    <span class="points-label">Available</span>
                    <span class="points-desc">Skill Points</span>
                </div>
                <div class="points-badge">
                    <span class="points-count">3</span>
                </div>
            </div>
        </aside>

        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected via JS -->
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <div class="tt-header">
            <span class="tt-title" id="tt-title">Skill</span>
            <span class="tt-tier" id="tt-type">Passive</span>
        </div>
        <p class="tt-desc" id="tt-desc">Description</p>
        <div class="tt-stats" id="tt-stats">
            <!-- Dynamic stats -->
        </div>
        <div class="tt-req" id="tt-req">Requires: [Skill Name]</div>
    </div>

<script>
    // --- Data Structure: Increased Density ---
    const skills = [
        // Capstone (Root)
        { id: 'cap', x: 900, y: 100, name: "Void Monarch", type: "Epic", tier: 1, desc: "Unleash the full potential of the void. You become the storm.", unlocked: true, req: null, stats: ["Dmg +50%", "AoE +20%"] },
        
        // Tier 2 (Major Branches)
        { id: 'maj_phys', x: 600, y: 300, name: "Titan's Will", type: "Passive", tier: 2, desc: "Master of physical combat. Increases physical damage output.", unlocked: true, req: 'cap', stats: ["STR +10", "Crit +5%"] },
        { id: 'mag_arc', x: 1200, y: 300, name: "Arcane Surge", type: "Passive", tier: 2, desc: "Master of the arcane. Amplifies magical potency.", unlocked: true, req: 'cap', stats: ["INT +10", "Mana +15%"] },
        { id: 'maj_tech', x: 900, y: 300, name: "Cybernetic Core", type: "Passive", tier: 2, desc: "Integrate machinery with soul. Tech damage increased.", unlocked: false, req: 'cap', stats: ["Tech Dmg +20%"] },

        // Tier 3 (Branching Out)
        // Phys Left
        { id: 'phys_1', x: 400, y: 500, name: "Heavy Strike", type: "Passive", tier: 3, desc: "Melee attacks deal 15% more damage and have a chance to stun.", unlocked: true, req: 'maj_phys', stats: ["Dmg +15%", "Stun 10%"] },
        { id: 'phys_1b', x: 500, y: 500, name: "Iron Skin", type: "Passive", tier: 3, desc: "Increases armor rating significantly.", unlocked: false, req: 'maj_phys', stats: ["Armor +50"] },
        
        // Mag Right
        { id: 'mag_1', x: 1100, y: 500, name: "Fireball", type: "Passive", tier: 3, desc: "Unlock Fireball ability. Increases fire resistance.", unlocked: true, req: 'mag_arc', stats: ["Unlock Skill", "Fire Res +20"] },
        { id: 'mag_1b', x: 1300, y: 500, name: "Frost Nova", type: "Passive", tier: 3, desc: "Freeze enemies around you.", unlocked: false, req: 'mag_arc', stats: ["Slow 50%"] },

        // Tech Middle
        { id: 'tech_1', x: 800, y: 500, name: "Shield Gen", type: "Passive", tier: 3, desc: "Deploy energy shields.", unlocked: false, req: 'maj_tech', stats: ["Shield +100"] },
        { id: 'tech_1b', x: 1000, y: 500, name: "Overclock", type: "Passive", tier: 3, desc: "Speed up all cooldowns.", unlocked: false, req: 'maj_tech', stats: ["CD -15%"] },

        // Tier 4 (Deep Leaves - Left)
        { id: 'phys_end', x: 250, y: 750, name: "Execution", type: "Epic", tier: 3, desc: "Instantly kill enemies below 10% HP.", unlocked: false, req: 'phys_1', stats: ["Insta Kill <10%"] },
        { id: 'phys_mid', x: 350, y: 750, name: "Berserker", type: "Passive", tier: 3, desc: "Gain attack speed as health drops.", unlocked: false, req: 'phys_1', stats: ["AS +20% @ 30% HP"] },
        { id: 'phys_1b_end', x: 500, y: 750, name: "Fortress", type: "Passive", tier: 3, desc: "Immobilize yourself to gain massive defense.", unlocked: false, req: 'phys_1b', stats: ["Def +200%"] },

        // Tier 4 (Deep Leaves - Right)
        { id: 'mag_end', x: 1450, y: 750, name: "Nova", type: "Epic", tier: 3, desc: "Explode mana pool for massive AoE damage.", unlocked: false, req: 'mag_1b', stats: ["AoE Dmg 500%"] },
        { id: 'mag_mid', x: 1100, y: 750, name: "Shield", type: "Passive", tier: 3, desc: "Generate a shield based on max mana.", unlocked: false, req: 'mag_1', stats: ["Shield +200"] },
        { id: 'mag_1b_end', x: 1300, y: 750, name: "Glacial Heart", type: "Passive", tier: 3, desc: "Immunity to slow effects.", unlocked: false, req: 'mag_1b', stats: ["Immunity"] },

        // Tier 4 (Deep Leaves - Center)
        { id: 'tech_end', x: 900, y: 750, name: "Singularity", type: "Epic", tier: 3, desc: "Create a black hole.", unlocked: false, req: 'tech_1', stats: ["Pull + Dmg"] },
        { id: 'tech_mid', x: 1000, y: 750, name: "Rapid Fire", type: "Passive", tier: 3, desc: "Triple shot capability.", unlocked: false, req: 'tech_1b', stats: ["Proj x3"] },
    ];

    // SVG Icons
    const icons = {
        epic: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
        passive: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"
    };

    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttStats = document.getElementById('tt-stats');
    const ttReq = document.getElementById('tt-req');

    // --- Init ---
    function init() {
        const container = document.getElementById('treeContainer');
        // Center view slightly lower to emphasize root
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        panX = (cw - 1800) / 2;
        panY = (ch - 1200) / 2 + 100;
        updateTransform();

        // Render Lines
        drawConnections();

        // Render Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : 'locked'}`;
            if (skill.unlocked) node.classList.add('aura');
            node.dataset.id = skill.id;
            node.dataset.type = skill.type;
            node.dataset.tier = skill.tier;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;

            const iconPath = skill.type === 'Epic' ? icons.epic : icons.passive;

            node.innerHTML = `
                <div class="hex">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });
    }

    function drawConnections() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    // Visual logic
                    if (skill.unlocked) {
                        line.classList.add('active');
                        if (skill.type === 'Epic') line.classList.add('active-epic');
                    } else {
                        line.classList.add('locked');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        // Stats
        ttStats.innerHTML = '';
        if (skill.stats) {
            skill.stats.forEach(s => {
                const span = document.createElement('div');
                span.className = 'tt-stat';
                span.innerHTML = `<span>+</span> ${s}`;
                ttStats.appendChild(span);
            });
        } else {
            ttStats.style.display = 'none';
        }

        // Reset classes
        tooltip.className = 'tooltip show';
        if (skill.type === 'Epic') tooltip.classList.add('t-type-Epic');
        else tooltip.classList.add('t-type-Passive');

        if (!skill.unlocked) {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'N/A'}`;
        } else {
            tooltip.classList.remove('locked');
        }

        // Position
        let x = e.clientX + 20;
        let y = e.clientY - 20;
        if (x + 300 > window.innerWidth) x = e.clientX - 320;
        if (y + 200 > window.innerHeight) y = e.clientY - 200;

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('show');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        if (skill.unlocked) return; // Can't toggle off
        
        const parent = skills.find(s => s.id === skill.req);
        if (parent && parent.unlocked) {
            skill.unlocked = true;
            updateVisuals();
        } else {
            // Simple feedback could go here
        }
    }

    function updateVisuals() {
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            if (s.unlocked) {
                el.classList.add('unlocked', 'aura');
                el.classList.remove('locked');
            } else {
                el.classList.remove('unlocked', 'aura');
                el.classList.add('locked');
            }
        });
        drawConnections();
    }

    // --- Pan/Zoom ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0, panY = 0, scale = 1;

    function updateTransform() {
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = -e.deltaY * 0.001;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        updateTransform();
    });

    init();
</script>
</body>
</html>
