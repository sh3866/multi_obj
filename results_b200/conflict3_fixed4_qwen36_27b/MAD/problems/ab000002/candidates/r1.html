<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archon's Ascension - Revised</title>
<style>
    :root {
        --bg-dark: #020408;
        --bg-panel: rgba(10, 15, 25, 0.6);
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-active: rgba(245, 158, 11, 0.6);
        
        --accent-gold: #fbbf24;
        --accent-orange: #d97706;
        --accent-glow: rgba(251, 191, 36, 0.5);
        
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --text-dim: #475569;
        
        --node-size-std: 48px;
        --node-size-major: 72px;
        
        --font-display: 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-dark);
        /* Deep atmospheric radial gradient */
        background-image: radial-gradient(circle at 20% 30%, #1e293b 0%, #020408 70%);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Header --- */
    header {
        height: 60px;
        display: flex;
        align-items: center;
        padding-left: 270px; /* Align with content area */
        position: relative;
        z-index: 10;
        border-bottom: 1px solid var(--border-subtle);
        background: rgba(2, 4, 8, 0.8);
        backdrop-filter: blur(5px);
    }

    .title-group {
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 1.4rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
        text-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
        line-height: 1;
    }

    .subtitle {
        font-size: 0.7rem;
        color: var(--accent-gold);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.8;
    }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
    }

    /* --- Sidebar --- */
    aside {
        width: 250px;
        height: 100%;
        /* Seamless background, no hard border */
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        z-index: 5;
        /* Subtle gradient to distinguish from canvas slightly */
        background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 100%);
    }

    .stat-block {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .level-display {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        margin-bottom: 8px;
    }

    .level-num {
        font-family: var(--font-display);
        font-size: 3.5rem;
        line-height: 1;
        color: var(--text-main);
        background: linear-gradient(to bottom, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .level-label {
        font-size: 0.9rem;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        margin-bottom: 8px;
    }

    .xp-container {
        margin-top: 5px;
    }

    .xp-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-bottom: 6px;
        font-family: var(--font-body);
    }

    .xp-bar-bg {
        height: 6px;
        background: rgba(255,255,255,0.05);
        border-radius: 2px;
        overflow: hidden;
    }

    .xp-bar-fill {
        height: 100%;
        width: 65%;
        background: var(--accent-gold);
        box-shadow: 0 0 10px var(--accent-glow);
        position: relative;
    }

    /* The Glowing Orb for Skill Points */
    .points-display {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-top: 10px;
    }

    .orb-container {
        position: relative;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .orb {
        width: 24px;
        height: 24px;
        background: radial-gradient(circle at 30% 30%, #fff, var(--accent-gold), var(--accent-orange));
        border-radius: 50%;
        box-shadow: 0 0 15px var(--accent-gold), 0 0 30px rgba(217, 119, 6, 0.4);
        animation: float 4s ease-in-out infinite;
    }

    .points-text {
        display: flex;
        flex-direction: column;
    }

    .points-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-muted);
    }

    .character-details {
        margin-top: auto;
        border-top: 1px solid var(--border-subtle);
        padding-top: 20px;
    }
    
    .char-name {
        font-size: 1.2rem;
        font-family: var(--font-display);
        color: var(--text-main);
        margin-bottom: 4px;
    }
    
    .char-class {
        color: var(--accent-gold);
        font-size: 0.8rem;
        margin-bottom: 20px;
        opacity: 0.9;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 0.85rem;
        font-family: var(--font-body);
    }
    .stat-row span:first-child { color: var(--text-muted); }
    .stat-row span:last-child { font-weight: 600; color: var(--text-main); }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        /* Background grid for the void feel */
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
    }

    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 0;
        left: 0;
        width: 1200px;
        height: 1000px;
        /* Centering handled by JS */
    }

    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    .connection-line {
        stroke: #334155; /* Dark gray for locked */
        stroke-width: 2;
        fill: none;
        transition: stroke 0.5s ease, stroke-width 0.5s ease;
    }

    .connection-line.active {
        stroke: var(--accent-gold);
        stroke-width: 3;
        filter: drop-shadow(0 0 4px var(--accent-gold));
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Standard Node (Circle) */
    .node-shape {
        width: var(--node-size-std);
        height: var(--node-size-std);
        background: #0f172a;
        border: 2px solid #334155;
        border-radius: 50%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* Major/Archon Node (Hexagon) */
    .node.major .node-shape {
        width: var(--node-size-major);
        height: var(--node-size-major);
        border-radius: 12px; /* Softened Hex/Square look */
        border-width: 3px;
        /* Hexagon clip path */
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        background: #1e293b;
    }

    .node-icon {
        width: 50%;
        height: 50%;
        fill: var(--text-dim);
        opacity: 0.6;
        transition: all 0.3s ease;
    }

    /* --- Node States --- */
    
    /* Locked */
    .node.locked {
        opacity: 0.7;
        transform: scale(0.9);
    }
    .node.locked .node-shape {
        border-color: #1e293b;
        background: #020617;
    }

    /* Active/Unlocked */
    .node.unlocked {
        transform: scale(1.1);
        z-index: 5;
    }
    
    .node.unlocked .node-shape {
        border-color: var(--accent-gold);
        background: radial-gradient(circle at 30% 30%, #fef3c7, #78350f);
        box-shadow: 0 0 20px var(--accent-glow), inset 0 0 10px rgba(255,255,255,0.2);
    }

    .node.unlocked .node-icon {
        fill: #fff;
        opacity: 1;
        filter: drop-shadow(0 0 2px rgba(0,0,0,0.5));
    }

    /* Hover Effects */
    .node:hover {
        z-index: 10;
        transform: scale(1.2);
    }
    .node.major:hover {
        transform: scale(1.15);
    }
    
    .node:not(.unlocked):hover .node-shape {
        border-color: #64748b;
        background: #1e293b;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid var(--border-subtle);
        padding: 16px;
        width: 260px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        backdrop-filter: blur(8px);
        border-left: 3px solid var(--text-muted);
    }

    .tooltip.unlocked-state {
        border-left-color: var(--accent-gold);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        color: var(--text-main);
        font-family: var(--font-display);
        margin-bottom: 4px;
        font-size: 1.1rem;
    }

    .tooltip .type {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 12px;
        letter-spacing: 0.1em;
        font-weight: 700;
    }

    .tooltip p {
        font-size: 0.85rem;
        line-height: 1.5;
        color: #cbd5e1;
    }

    .tooltip .req {
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px solid var(--border-subtle);
        font-size: 0.75rem;
        color: #ef4444;
        display: none;
    }

    .tooltip.locked-state .req { display: block; }
    .tooltip.locked-state h3 { color: var(--text-muted); }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
    }

</style>
</head>
<body>

    <header>
        <div class="title-group">
            <h1>Archon's Ascension</h1>
            <div class="subtitle">Class: Void Walker</div>
        </div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="stat-block">
                <div class="level-display">
                    <span class="level-num">42</span>
                    <span class="level-label">Level</span>
                </div>
                <div class="xp-container">
                    <div class="xp-labels">
                        <span>XP Progress</span>
                        <span>12,450 / 20,000</span>
                    </div>
                    <div class="xp-bar-bg">
                        <div class="xp-bar-fill"></div>
                    </div>
                </div>
            </div>

            <div class="points-display">
                <div class="orb-container">
                    <div class="orb"></div>
                </div>
                <div class="points-text">
                    <span class="points-label">Skill Points</span>
                </div>
            </div>

            <div class="character-details">
                <h2 class="char-name">Kaelen Thorne</h2>
                <div class="char-class">Duelist / Arcanist</div>
                <div class="stat-row"><span>Strength</span><span>14</span></div>
                <div class="stat-row"><span>Dexterity</span><span>28</span></div>
                <div class="stat-row"><span>Intelligence</span><span>35</span></div>
                <div class="stat-row"><span>Vitality</span><span>12</span></div>
            </div>
        </aside>

        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <svg class="connections" id="svgConnections"></svg>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data ---
    const skills = [
        // Tier 1
        { id: 'root', x: 600, y: 100, name: "Archon's Spark", type: "Passive", desc: "The origin of your power. Increases all damage by 5%.", unlocked: true, req: null, isMajor: true },
        
        // Tier 2
        { id: 'str1', x: 450, y: 250, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'dex1', x: 750, y: 250, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: true, req: 'root' },
        { id: 'int1', x: 600, y: 350, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", unlocked: false, req: 'root' },
        
        // Tier 3
        { id: 'str2', x: 350, y: 400, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'dex2', x: 850, y: 400, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: true, req: 'dex1' },
        
        // Tier 4
        { id: 'str3', x: 250, y: 550, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        { id: 'dex3', x: 950, y: 550, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 800, y: 550, name: "Dual Wield", type: "Passive", desc: "Unlock ability to hold two weapons.", unlocked: false, req: 'dex2' },
        { id: 'int2', x: 500, y: 500, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 700, y: 500, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        
        // Tier 5 (Ultimates)
        { id: 'hybrid', x: 725, y: 700, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows.", unlocked: false, req: 'dex3', isMajor: true },
        { id: 'hybrid2', x: 375, y: 700, name: "Blood Pact", type: "Passive", desc: "Heal for 5% of damage dealt.", unlocked: false, req: 'str3', isMajor: true }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Center the tree initially
        panX = (cw - 1200) / 2;
        panY = (ch - 1000) / 2 + 50; // slightly offset up
        updateTransform();

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : 'locked'} ${skill.isMajor ? 'major' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Determine Icon
            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawLines();
    }

    function drawLines() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    // If the child is unlocked, the line is active
                    if (skill.unlocked) {
                        line.classList.add('active');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked-state');
            tooltip.classList.add('unlocked-state');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.remove('unlocked-state');
            tooltip.classList.add('locked-state');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'None'}`;
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        
        // Positioning
        const x = e.clientX;
        const y = e.clientY;
        
        // Prevent off-screen
        const ttW = tooltip.offsetWidth;
        const ttH = tooltip.offsetHeight;
        let finalX = x + 20;
        let finalY = y - 20;

        if (x + 20 + ttW > window.innerWidth) finalX = x - ttW - 20;
        if (y + 20 + ttH > window.innerHeight) finalY = y - ttH;

        tooltip.style.left = `${finalX}px`;
        tooltip.style.top = `${finalY}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        // If locked, check requirements
        if (!skill.unlocked) {
            const parent = skills.find(s => s.id === skill.req);
            if (parent && parent.unlocked) {
                skill.unlocked = true;
                // Remove 'locked' class logic handled by updateVisuals
            } else {
                // Visual feedback for locked?
                return; 
            }
        } else {
            // Toggle off? (Optional mechanic, usually trees don't let you toggle off main nodes)
            // For this demo, we only allow toggling ON.
            return;
        }
        
        updateVisuals();
    }

    function updateVisuals() {
        // Update Nodes
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            if (s.unlocked) {
                el.classList.add('unlocked');
                el.classList.remove('locked');
            } else {
                el.classList.remove('unlocked');
                el.classList.add('locked');
            }
        });

        drawLines();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0;
    let panY = 0;
    let scale = 1;

    function updateTransform() {
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        // Zoom towards mouse pointer
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        updateTransform();
    });

    init();

</script>
</body>
</html>
