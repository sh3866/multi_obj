<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina: Deep Capture</title>
<style>
  :root {
    --bg-deep: #050508;
    --bg-atmosphere: #0b101f;
    --glass-surface: rgba(10, 15, 30, 0.4);
    --glass-border: rgba(255, 255, 255, 0.08);
    --accent-cyan: #00f0ff;
    --accent-magenta: #ff0055;
    --accent-lime: #ccff00;
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Environment & Atmosphere --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    /* Deep moody radial gradient (Critique Fix #2) */
    background: radial-gradient(ellipse at center, #1a233a 0%, #090d18 60%, #020205 100%);
  }

  /* Subtle Grid for spatial reference */
  .grid-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(var(--glass-border) 1px, transparent 1px),
      linear-gradient(90deg, var(--glass-border) 1px, transparent 1px);
    background-size: 80px 80px;
    opacity: 0.1;
    z-index: 0;
    pointer-events: none;
    mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
    -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
  }

  /* Canvas Layer */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none; /* Hide default cursor */
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3rem;
  }

  /* Header - Glassmorphism (Critique Fix #5) */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    background: var(--glass-surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 1.2rem 2rem;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    animation: fadeInDown 0.8s ease-out;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 3rem;
    margin: 0;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    background: linear-gradient(to bottom, #ffffff 0%, #d0d0d0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,0.3));
  }

  /* Typography Hierarchy (Critique Fix #3) */
  .subtitle {
    font-family: var(--font-ui);
    font-size: 1.1rem; /* Increased size */
    font-weight: 700;  /* Increased weight */
    color: var(--accent-cyan);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.9;
    text-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
  }

  /* HUD Panel */
  .hud-panel {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 12px;
    padding: 0.6rem 1.2rem;
    border: 1px solid rgba(255,255,255,0.05);
  }
  
  .stat-icon {
    width: 24px; height: 24px;
    fill: var(--accent-cyan);
    filter: drop-shadow(0 0 5px var(--accent-cyan));
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 1.8rem;
    color: white;
    line-height: 1;
    letter-spacing: 0.05em;
  }

  .stat-label {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  /* Footer / Actions */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    margin-bottom: 1rem;
    animation: fadeInUp 0.8s ease-out;
  }

  /* Button Styling */
  .btn-main {
    background: linear-gradient(135deg, var(--accent-cyan) 0%, #0088ff 100%);
    border: none;
    color: #020205;
    font-family: var(--font-ui);
    font-weight: 800;
    font-size: 1rem;
    padding: 1.2rem 4rem;
    border-radius: 50px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), 0 10px 30px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
  }

  .btn-main:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.5), 0 15px 35px rgba(0,0,0,0.4);
  }
  
  .btn-main:active {
    transform: translateY(1px);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 35%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    border: 1px solid var(--accent-magenta);
    color: white;
    padding: 1rem 2rem;
    border-radius: 8px;
    font-family: var(--font-ui);
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    box-shadow: 0 0 30px rgba(255, 0, 85, 0.2);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -70%) scale(1);
  }

  /* Animations */
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Mobile adjustments */
  @media (max-width: 768px) {
    .ui-layer { padding: 1.5rem; }
    .header { flex-direction: column; gap: 1rem; align-items: center; text-align: center; padding: 1.5rem; }
    h1 { font-size: 2.5rem; }
    .brand { align-items: center; }
    .subtitle { font-size: 0.9rem; }
    .btn-main { padding: 1rem 3rem; font-size: 0.9rem; width: 100%; max-width: 300px; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Background Grid -->
  <div class="grid-bg"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Lumina</h1>
        <!-- Critique Fix #4: Refined Terminology & Weight -->
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-panel">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" />
        </svg>
        <div>
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Collected</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">
      <span style="color:var(--accent-magenta)">●</span> Specimen Captured
    </div>

    <footer class="footer">
      <!-- Critique Fix #4: Renamed Button -->
      <button class="btn-main" onclick="resetGame()">Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Visual Design Focus: Warm accents, organic movement, atmospheric depth.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let dustMotes = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;

  // Critique Fix #3: Differentiate Palette (Warm Accents)
  const COLORS = ['#ffb700', '#ff4d4d', '#ff00aa']; // Amber, Red, Magenta
  const CREATURE_COUNT = 6;
  const DUST_COUNT = 50;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initDust();
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class DustMote {
    constructor() {
      this.reset();
      this.y = Math.random() * height;
    }
    reset() {
      this.x = Math.random() * width;
      this.y = height + 10;
      this.size = Math.random() * 1.5 + 0.5;
      this.speed = Math.random() * 0.3 + 0.1;
      this.opacity = Math.random() * 0.3;
      this.wobble = Math.random() * Math.PI * 2;
    }
    update() {
      this.y -= this.speed;
      this.wobble += 0.005;
      this.x += Math.sin(this.wobble) * 0.1;
      if (this.y < -10) this.reset();
    }
    draw(ctx) {
      ctx.fillStyle = `rgba(200, 220, 255, ${this.opacity})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 4 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.95; // Friction
      this.vy *= 0.95;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset(true);
    }

    reset(initial = false) {
      // Spawn logic
      if (initial) {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
      } else {
        const edge = Math.floor(Math.random() * 4);
        if(edge === 0) { this.x = Math.random() * width; this.y = -100; }
        else if(edge === 1) { this.x = width + 100; this.y = Math.random() * height; }
        else if(edge === 2) { this.x = Math.random() * width; this.y = height + 100; }
        else { this.x = -100; this.y = Math.random() * height; }
      }

      this.vx = (Math.random() - 0.5) * 1;
      this.vy = (Math.random() - 0.5) * 1;
      this.radius = Math.random() * 12 + 12;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = Math.random() * Math.PI * 2;
      this.rotationSpeed = (Math.random() - 0.5) * 0.02;
      
      // Z-Depth
      this.z = Math.random() * 0.8 + 0.4; 
      this.speedMult = this.z;
      
      this.isCaught = false;
    }

    update() {
      if (this.isCaught) return;

      // Organic Movement
      this.x += this.vx * this.speedMult;
      this.y += this.vy * this.speedMult;
      this.angle += this.rotationSpeed;

      // Wrap around
      if (this.x < -150) this.x = width + 150;
      if (this.x > width + 150) this.x = -150;
      if (this.y < -150) this.y = height + 150;
      if (this.y > height + 150) this.y = -150;

      // Avoid Mouse
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 220 * this.z) {
        const force = (220 - dist) / 220;
        this.vx += (dx / dist) * force * 0.08;
        this.vy += (dy / dist) * force * 0.08;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 2.5) {
        this.vx = (this.vx / speed) * 2.5;
        this.vy = (this.vy / speed) * 2.5;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.scale(this.z, this.z);
      ctx.rotate(this.angle);
      
      ctx.globalAlpha = 0.6 + (this.z * 0.4);
      
      // Stronger Glow for warm colors against dark bg
      ctx.shadowBlur = 30;
      ctx.shadowColor = this.color;
      
      ctx.fillStyle = this.color;
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 2;

      ctx.beginPath();
      
      // Critique Fix #1: Geometric Shapes
      if (this.color === COLORS[0]) { 
        // Amber Orb
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        // Specular highlight
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(-this.radius*0.3, -this.radius*0.3, this.radius*0.25, 0, Math.PI*2);
        ctx.fill();
      } 
      else if (this.color === COLORS[1]) {
        // Red Triangle/Shard
        const r = this.radius;
        ctx.moveTo(0, -r);
        ctx.lineTo(r, r);
        ctx.lineTo(-r, r);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } 
      else {
        // Magenta Diamond
        const r = this.radius;
        ctx.moveTo(0, -r);
        ctx.lineTo(r * 0.6, 0);
        ctx.lineTo(0, r);
        ctx.lineTo(-r * 0.6, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      ctx.restore();
    }
  }

  function initDust() {
    dustMotes = [];
    for(let i=0; i<DUST_COUNT; i++) {
      dustMotes.push(new DustMote());
    }
  }

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 80; 

    for (let i = creatures.length - 1; i >= 0; i--) {
      let c = creatures[i];
      if (c.isCaught) continue;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius * c.z) {
        catchCreature(c);
      }
    }
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Explosion FX
    for(let i=0; i<25; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1200);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 2000);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    const time = Date.now() * 0.005;
    const pulse = Math.sin(time) * 5;
    const baseRadius = 65;
    
    // Net Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = isMouseDown ? '#ffffff' : '#00f0ff';
    
    // Outer Ring
    ctx.strokeStyle = isMouseDown ? '#ffffff' : 'rgba(0, 240, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.setLineDash([12, 12]);
    ctx.lineDashOffset = -time * 15; 
    ctx.beginPath();
    ctx.arc(0, 0, baseRadius + pulse, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Ring
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, baseRadius * 0.6 + pulse * 0.5, 0, Math.PI * 2);
    ctx.stroke();

    // Center Dot
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    // Suction Lines
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 1;
      for(let i=0; i<8; i++) {
        ctx.beginPath();
        const angle = (i / 8) * Math.PI * 2 + time;
        ctx.moveTo(Math.cos(angle) * 25, Math.sin(angle) * 25);
        ctx.lineTo(Math.cos(angle) * (baseRadius + pulse), Math.sin(angle) * (baseRadius + pulse));
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function loop() {
    ctx.clearRect(0, 0, width, height);

    // Draw Atmosphere
    dustMotes.forEach(d => {
      d.update();
      d.draw(ctx);
    });

    // Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
