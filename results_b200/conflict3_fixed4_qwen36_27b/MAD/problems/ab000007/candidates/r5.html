<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina: Deep Capture</title>
<style>
  :root {
    --bg-deep: #050508;
    --bg-atmosphere: #0b101f;
    --glass-surface: rgba(12, 18, 35, 0.4);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.15);
    --accent-cyan: #00f0ff;
    --accent-glow: rgba(0, 240, 255, 0.4);
    --font-display: 'Impact', 'Arial Black', 'Segoe UI Black', system-ui, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Environment --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    /* Deep space gradient */
    background: radial-gradient(ellipse at 50% 20%, #151f38 0%, #09101c 60%, #020205 100%);
  }

  /* Vignette */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 30%, #000000 100%);
    pointer-events: none;
    z-index: 1;
  }

  /* Canvas */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none; /* Hide default cursor */
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none; /* Let clicks pass through to canvas */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3rem 4rem;
  }

  /* --- Header --- */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    animation: fadeInDown 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 5rem;
    margin: 0;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    /* Metallic/Chromatic Text */
    background: linear-gradient(180deg, #ffffff 0%, #b0c4de 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.2));
    line-height: 0.9;
  }

  /* Critique Fix #2: Unified Typography */
  .subtitle {
    font-family: var(--font-display); /* Same family as title */
    font-weight: 400; /* Lighter weight */
    font-size: 1.1rem;
    color: var(--accent-cyan);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.8;
    margin-left: 4px;
    text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
  }

  /* --- HUD Panel --- */
  /* Critique Fix #3: Unified Geometry & Glassmorphism */
  .hud-panel {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    background: var(--glass-surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 16px; /* Unified radius */
    padding: 0.8rem 1.5rem;
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    transition: transform 0.3s ease;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2.2rem;
    color: white;
    line-height: 1;
    letter-spacing: 0.05em;
  }

  .stat-label {
    font-family: var(--font-ui);
    font-size: 0.65rem;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-top: 4px;
    margin-left: 2px;
  }

  /* --- Footer / Actions --- */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* Critique Fix #3: Unified Button Style */
  .btn-main {
    background: var(--glass-surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 16px; /* Unified radius */
    color: white;
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 0.95rem;
    padding: 1rem 3rem;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    transition: all 0.3s ease;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    position: relative;
    overflow: hidden;
  }

  .btn-main:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
    transform: translateY(-2px);
  }
  
  .btn-main:active {
    transform: translateY(1px);
    background: rgba(0, 240, 255, 0.1);
  }

  /* --- Animations --- */
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Mobile Adjustments */
  @media (max-width: 768px) {
    .ui-layer { padding: 1.5rem; }
    h1 { font-size: 3.5rem; }
    .hud-panel { padding: 0.6rem 1rem; border-radius: 12px; }
    .btn-main { width: 100%; border-radius: 12px; }
    .stat-value { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <div class="vignette"></div>
  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Lumina</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-panel">
        <div>
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Collected</div>
        </div>
        <!-- Simple Star Icon -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 5px var(--accent-cyan));">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2"></polygon>
        </svg>
      </div>
    </header>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * VISUAL DESIGN IMPLEMENTATION
   * Focus: Cohesive identity, glowing aesthetics, depth.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let dustMotes = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let time = 0;

  // --- Configuration ---
  const COLORS = ['#ffb700', '#ff4d4d', '#ff00aa', '#00ffaa']; 
  const CREATURE_COUNT = 12; // More life in the field
  const DUST_COUNT = 100;    // More atmosphere

  // Resize
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initDust();
  }
  window.addEventListener('resize', resize);
  resize();

  // Input
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  // Atmospheric Particles
  class DustMote {
    constructor() {
      this.reset(true);
    }
    reset(initial = false) {
      this.x = Math.random() * width;
      this.y = initial ? Math.random() * height : height + 10;
      this.size = Math.random() * 2 + 0.5;
      this.speed = Math.random() * 0.3 + 0.1;
      this.opacity = Math.random() * 0.3;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.02;
    }
    update() {
      this.y -= this.speed;
      this.wobble += this.wobbleSpeed;
      this.x += Math.sin(this.wobble) * 0.1;
      if (this.y < -10) this.reset();
    }
    draw(ctx) {
      ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Explosion Particles
  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 8 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.015;
      this.size = Math.random() * 4 + 2;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.92;
      this.vy *= 0.92;
      this.life -= this.decay;
    }
    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.shadowBlur = 15;
      ctx.shadowColor = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1.0;
    }
  }

  // The Drifting Creatures
  class Creature {
    constructor() {
      this.reset(true);
    }
    reset(initial = false) {
      // Spawn logic
      if (initial) {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
      } else {
        const edge = Math.floor(Math.random() * 4);
        if(edge === 0) { this.x = Math.random() * width; this.y = -100; }
        else if(edge === 1) { this.x = width + 100; this.y = Math.random() * height; }
        else if(edge === 2) { this.x = Math.random() * width; this.y = height + 100; }
        else { this.x = -100; this.y = Math.random() * height; }
      }

      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = (Math.random() - 0.5) * 0.3;
      this.radius = Math.random() * 8 + 8;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = Math.random() * Math.PI * 2;
      this.rotationSpeed = (Math.random() - 0.5) * 0.02;
      
      // Depth Logic
      this.z = Math.random() * 0.6 + 0.4; // 0.4 to 1.0
      this.speedMult = this.z * 1.2;
      
      this.isCaught = false;
      this.pulseOffset = Math.random() * 100;
    }

    update() {
      if (this.isCaught) return;

      this.x += this.vx * this.speedMult;
      this.y += this.vy * this.speedMult;
      this.angle += this.rotationSpeed;

      // Wrap
      if (this.x < -150) this.x = width + 150;
      if (this.x > width + 150) this.x = -150;
      if (this.y < -150) this.y = height + 150;
      if (this.y > height + 150) this.y = -150;

      // Repulsion (Avoid Net)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 200 * this.z) {
        const force = (200 - dist) / 200;
        this.vx += (dx / dist) * force * 0.05;
        this.vy += (dy / dist) * force * 0.05;
      }

      // Cap speed
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 2) {
        this.vx = (this.vx / speed) * 2;
        this.vy = (this.vy / speed) * 2;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.scale(this.z, this.z);
      ctx.rotate(this.angle);
      
      ctx.globalAlpha = 0.5 + (this.z * 0.5);
      
      // Pulse
      const pulse = Math.sin((time * 0.003) + this.pulseOffset) * 3;
      const r = this.radius + pulse;

      // Glow (Critique Fix #4: Cyan tint in shadow for cohesion)
      // We mix the creature color with a bit of cyan for the glow
      ctx.shadowBlur = 25 * this.z;
      ctx.shadowColor = this.color; 
      
      ctx.fillStyle = this.color;
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 2;

      ctx.beginPath();
      
      // Shape Logic
      if (this.color === COLORS[0]) { // Amber Orb
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        // Core
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(0, 0, r*0.3, 0, Math.PI*2);
        ctx.fill();
      } 
      else if (this.color === COLORS[1]) { // Red Crystal
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2;
          const px = Math.cos(a) * r;
          const py = Math.sin(a) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } 
      else if (this.color === COLORS[2]) { // Magenta Diamond
        ctx.moveTo(0, -r * 1.5);
        ctx.lineTo(r, 0);
        ctx.lineTo(0, r * 1.5);
        ctx.lineTo(-r, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      else { // Lime Cross
        const s = r * 0.7;
        ctx.rect(-s, -s, s*2, s*2);
        ctx.fill();
        ctx.stroke();
      }

      ctx.restore();
    }
  }

  function initDust() {
    dustMotes = [];
    for(let i=0; i<DUST_COUNT; i++) {
      dustMotes.push(new DustMote());
    }
  }

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 100; 

    for (let i = creatures.length - 1; i >= 0; i--) {
      let c = creatures[i];
      if (c.isCaught) continue;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius * c.z) {
        catchCreature(c);
      }
    }
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // FX
    for(let i=0; i<25; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }
    
    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 1000);
  }

  function resetGame() {
    init();
  }

  // --- Player Avatar (The Net) ---
  function drawNet() {
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    const pulse = Math.sin(time * 0.01) * 5;
    const baseRadius = 80;
    
    // Critique Fix #4: Cyan Accent Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = isMouseDown ? '#ffffff' : 'var(--accent-cyan)';
    
    // Outer Ring
    ctx.strokeStyle = isMouseDown ? 'rgba(255,255,255,0.9)' : 'rgba(0, 240, 255, 0.6)';
    ctx.lineWidth = 2;
    
    // Rotating Dashed Line
    ctx.setLineDash([10, 15]);
    ctx.lineDashOffset = -time * 0.5; 
    ctx.beginPath();
    ctx.arc(0, 0, baseRadius + pulse, 0, Math.PI * 2);
    ctx.stroke();

    // Inner solid ring
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, baseRadius * 0.4 + pulse, 0, Math.PI * 2);
    ctx.stroke();

    // Center Dot
    ctx.fillStyle = 'var(--accent-cyan)';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();

    // Suction Lines (When Active)
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 1;
      for(let i=0; i<6; i++) {
        ctx.beginPath();
        const angle = (i / 6) * Math.PI * 2 + (time * 0.01);
        ctx.moveTo(Math.cos(angle) * 15, Math.sin(angle) * 15);
        ctx.lineTo(Math.cos(angle) * (baseRadius + pulse), Math.sin(angle) * (baseRadius + pulse));
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function loop() {
    time++;
    ctx.clearRect(0, 0, width, height);

    // 1. Atmosphere (Background)
    dustMotes.forEach(d => {
      d.update();
      d.draw(ctx);
    });

    // 2. Creatures (Sorted by Z)
    creatures.sort((a, b) => a.z - b.z);
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // 3. Particles (Foreground FX)
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // 4. Player Net (Top Layer)
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
