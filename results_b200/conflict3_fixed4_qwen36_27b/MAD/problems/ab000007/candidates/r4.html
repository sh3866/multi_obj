<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina: Deep Capture</title>
<style>
  :root {
    --bg-deep: #050508;
    --bg-atmosphere: #0b101f;
    --glass-surface: rgba(10, 15, 30, 0.15);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-highlight: rgba(255, 255, 255, 0.25);
    --accent-cyan: #00f0ff;
    --accent-magenta: #ff0055;
    --accent-lime: #ccff00;
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Environment & Atmosphere --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    /* Critique Fix #3: Atmospheric radial gradient */
    background: radial-gradient(circle at 50% 40%, #1b2745 0%, #09101c 50%, #020205 100%);
  }

  /* Subtle Vignette for depth */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 40%, #000000 120%);
    pointer-events: none;
    z-index: 1;
  }

  /* Canvas Layer */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none; 
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 4rem 3rem; /* Increased padding for breathing room */
  }

  /* Header - Floating (Critique Fix #2) */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    /* Removed boxy background, border, and shadow */
    background: transparent;
    backdrop-filter: none;
    border: none;
    box-shadow: none;
    animation: fadeInDown 1s ease-out;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
    text-shadow: 0 0 40px rgba(0,0,0,0.8); /* Ensure readability */
  }

  h1 {
    font-family: var(--font-display);
    font-size: 4.5rem; /* Critique Fix #4: Increased visual weight */
    margin: 0;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    /* Metallic gradient text */
    background: linear-gradient(180deg, #ffffff 20%, #a0a0a0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    /* Added subtle stroke for sharpness */
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
    line-height: 0.9;
  }

  .subtitle {
    font-family: var(--font-ui);
    font-size: 1rem;
    font-weight: 400;
    color: var(--accent-cyan);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    opacity: 0.8;
    margin-left: 2px;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
  }

  /* HUD Panel - Glassmorphism */
  .hud-panel {
    display: flex;
    align-items: center;
    gap: 1rem;
    /* Glass effect */
    background: rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 50px; /* Pill shape */
    padding: 0.5rem 1.5rem 0.5rem 0.8rem;
    border: 1px solid var(--glass-border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  
  .stat-icon {
    width: 20px; height: 20px;
    fill: var(--accent-cyan);
    filter: drop-shadow(0 0 5px var(--accent-cyan));
    margin-left: 0.5rem;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2rem;
    color: white;
    line-height: 1;
    letter-spacing: 0.05em;
  }

  .stat-label {
    font-size: 0.6rem;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-top: 4px;
    margin-left: 0.5rem;
  }

  /* Footer / Actions */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    margin-bottom: 1rem;
    animation: fadeInUp 1s ease-out;
  }

  /* Button Styling - Glass/Outlined (Critique Fix #4) */
  .btn-main {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--glass-highlight);
    color: white;
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 0.9rem;
    padding: 1rem 3.5rem;
    border-radius: 50px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    position: relative;
    overflow: hidden;
  }

  .btn-main:hover {
    background: rgba(0, 240, 255, 0.15);
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
  }
  
  .btn-main:active {
    transform: translateY(1px);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 30%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    border: 1px solid var(--accent-magenta);
    color: white;
    padding: 0.8rem 1.5rem;
    border-radius: 4px;
    font-family: var(--font-ui);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.175, 0.8, 0.32, 1.275);
    z-index: 20;
    box-shadow: 0 0 30px rgba(255, 0, 85, 0.1);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -80%) scale(1);
  }

  /* Animations */
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Mobile adjustments */
  @media (max-width: 768px) {
    .ui-layer { padding: 2rem 1.5rem; }
    .header { flex-direction: row; align-items: center; gap: 1rem; }
    h1 { font-size: 3rem; }
    .btn-main { width: 100%; padding: 1rem 0; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Vignette Overlay -->
  <div class="vignette"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Lumina</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-panel">
        <div>
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Collected</div>
        </div>
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" />
        </svg>
      </div>
    </header>

    <div id="toast" class="toast">
      <span style="color:var(--accent-magenta)">●</span> Specimen Captured
    </div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Critique Fix #1: Populated field with distinct entities and depth.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let dustMotes = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let time = 0;

  const COLORS = ['#ffb700', '#ff4d4d', '#ff00aa', '#00ffaa']; // Amber, Red, Magenta, Lime
  const CREATURE_COUNT = 8; // Increased count
  const DUST_COUNT = 80; // Increased atmosphere

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initDust();
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class DustMote {
    constructor() {
      this.reset();
      this.y = Math.random() * height;
    }
    reset() {
      this.x = Math.random() * width;
      this.y = height + 10;
      this.size = Math.random() * 2 + 0.5;
      this.speed = Math.random() * 0.5 + 0.2;
      this.opacity = Math.random() * 0.4;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.02;
    }
    update() {
      this.y -= this.speed;
      this.wobble += this.wobbleSpeed;
      this.x += Math.sin(this.wobble) * 0.2;
      if (this.y < -10) this.reset();
    }
    draw(ctx) {
      ctx.fillStyle = `rgba(200, 220, 255, ${this.opacity})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 4 + 2;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.94;
      this.vy *= 0.94;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset(true);
    }

    reset(initial = false) {
      if (initial) {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
      } else {
        const edge = Math.floor(Math.random() * 4);
        if(edge === 0) { this.x = Math.random() * width; this.y = -100; }
        else if(edge === 1) { this.x = width + 100; this.y = Math.random() * height; }
        else if(edge === 2) { this.x = Math.random() * width; this.y = height + 100; }
        else { this.x = -100; this.y = Math.random() * height; }
      }

      this.vx = (Math.random() - 0.5) * 0.5;
      this.vy = (Math.random() - 0.5) * 0.5;
      this.radius = Math.random() * 10 + 10;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = Math.random() * Math.PI * 2;
      this.rotationSpeed = (Math.random() - 0.5) * 0.03;
      
      // Z-Depth Logic (Critique Fix #3)
      // 0.3 = far background, 1.0 = foreground
      this.z = Math.random() * 0.7 + 0.3; 
      // Speed correlates with depth
      this.speedMult = this.z * 1.5;
      
      this.isCaught = false;
      this.pulseOffset = Math.random() * 100;
    }

    update() {
      if (this.isCaught) return;

      // Organic drift
      this.x += this.vx * this.speedMult;
      this.y += this.vy * this.speedMult;
      this.angle += this.rotationSpeed;

      // Wrap around
      if (this.x < -150) this.x = width + 150;
      if (this.x > width + 150) this.x = -150;
      if (this.y < -150) this.y = height + 150;
      if (this.y > height + 150) this.y = -150;

      // Avoid Mouse (Physics)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 250 * this.z) {
        const force = (250 - dist) / 250;
        this.vx += (dx / dist) * force * 0.1;
        this.vy += (dy / dist) * force * 0.1;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 3) {
        this.vx = (this.vx / speed) * 3;
        this.vy = (this.vy / speed) * 3;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Scale by Z-depth
      const scale = this.z;
      ctx.scale(scale, scale);
      
      // Rotate
      ctx.rotate(this.angle);
      
      // Opacity by depth (further = dimmer)
      ctx.globalAlpha = 0.4 + (this.z * 0.6);
      
      // Pulse effect
      const pulse = Math.sin((time * 0.002) + this.pulseOffset) * 2;
      const r = this.radius + pulse;

      // Glow
      ctx.shadowBlur = 20 * scale;
      ctx.shadowColor = this.color;
      
      ctx.fillStyle = this.color;
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 2;

      ctx.beginPath();
      
      // Distinct Shapes based on Color
      if (this.color === COLORS[0]) { 
        // Amber: Soft Orb
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        // Inner core
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.arc(0, 0, r*0.4, 0, Math.PI*2);
        ctx.fill();
      } 
      else if (this.color === COLORS[1]) {
        // Red: Hexagon/Crystal
        for (let i = 0; i < 6; i++) {
          const angle = (i / 6) * Math.PI * 2;
          const px = Math.cos(angle) * r;
          const py = Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } 
      else if (this.color === COLORS[2]) {
        // Magenta: Diamond
        ctx.moveTo(0, -r * 1.2);
        ctx.lineTo(r * 0.6, 0);
        ctx.lineTo(0, r * 1.2);
        ctx.lineTo(-r * 0.6, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      else {
        // Lime: Square/Cross
        const s = r * 0.8;
        ctx.rect(-s, -s, s*2, s*2);
        ctx.fill();
        ctx.stroke();
      }

      ctx.restore();
    }
  }

  function initDust() {
    dustMotes = [];
    for(let i=0; i<DUST_COUNT; i++) {
      dustMotes.push(new DustMote());
    }
  }

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 90; 

    for (let i = creatures.length - 1; i >= 0; i--) {
      let c = creatures[i];
      if (c.isCaught) continue;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius * c.z) {
        catchCreature(c);
      }
    }
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Explosion FX
    for(let i=0; i<30; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1200);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 1500);
  }

  function resetGame() {
    init();
  }

  // Critique Fix #1: Draw Player Avatar (Net)
  function drawNet() {
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    const pulse = Math.sin(time * 0.01) * 4;
    const baseRadius = 70;
    
    // Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = isMouseDown ? '#ffffff' : 'var(--accent-cyan)';
    
    // Outer Ring
    ctx.strokeStyle = isMouseDown ? 'rgba(255,255,255,0.9)' : 'rgba(0, 240, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([15, 15]);
    ctx.lineDashOffset = -time * 0.15; 
    ctx.beginPath();
    ctx.arc(0, 0, baseRadius + pulse, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Ring (Solid)
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, baseRadius * 0.5 + pulse, 0, Math.PI * 2);
    ctx.stroke();

    // Center Crosshair/Dot
    ctx.fillStyle = 'var(--accent-cyan)';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();

    // Suction Lines (When active)
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.lineWidth = 1.5;
      for(let i=0; i<8; i++) {
        ctx.beginPath();
        const angle = (i / 8) * Math.PI * 2 + (time * 0.005);
        ctx.moveTo(Math.cos(angle) * 20, Math.sin(angle) * 20);
        ctx.lineTo(Math.cos(angle) * (baseRadius + pulse), Math.sin(angle) * (baseRadius + pulse));
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function loop() {
    time++;
    ctx.clearRect(0, 0, width, height);

    // Draw Atmosphere
    dustMotes.forEach(d => {
      d.update();
      d.draw(ctx);
    });

    // Draw Creatures (Sort by Z for proper depth layering)
    creatures.sort((a, b) => a.z - b.z);
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net (Always on top of creatures)
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
