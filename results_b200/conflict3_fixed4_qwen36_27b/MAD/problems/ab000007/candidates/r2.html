<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina: Deep Capture</title>
<style>
  :root {
    --bg-deep: #020205;
    --bg-atmosphere: #0a0f1c;
    --glass-surface: rgba(10, 15, 30, 0.6); /* Darker for better contrast */
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-highlight: rgba(255, 255, 255, 0.3);
    --accent-cyan: #00f0ff;
    --accent-magenta: #ff0055;
    --accent-lime: #ccff00;
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Environment & Atmosphere --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, var(--bg-atmosphere) 0%, var(--bg-deep) 85%);
  }

  /* Atmospheric Depth Grid */
  .grid-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(var(--glass-border) 1px, transparent 1px),
      linear-gradient(90deg, var(--glass-border) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(800px) rotateX(60deg) translateY(-150px) scale(2);
    opacity: 0.15;
    z-index: 0;
    pointer-events: none;
    mask-image: linear-gradient(to bottom, transparent 10%, black 60%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 10%, black 60%, transparent 100%);
  }

  /* Volumetric Spotlight (Critique Fix #2) */
  .spotlight {
    position: absolute;
    top: 50%; left: 50%;
    width: 80vw; height: 80vh;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(0, 240, 255, 0.08) 0%, rgba(10, 15, 30, 0) 70%);
    z-index: 1;
    pointer-events: none;
  }

  /* Fog Layer */
  .fog-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, transparent 40%, var(--bg-deep) 100%);
    z-index: 3;
    pointer-events: none;
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2.5rem;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    animation: fadeInDown 1s ease-out;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 3.5rem;
    margin: 0;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: linear-gradient(to bottom, #ffffff 20%, #a0a0a0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 15px rgba(255,255,255,0.1));
  }

  /* Typography Fix (Critique Fix #3) */
  .subtitle {
    font-family: var(--font-ui); /* Switch to sans-serif */
    font-size: 0.75rem;
    color: var(--accent-cyan);
    letter-spacing: 0.4em; /* Tracked out */
    text-transform: uppercase;
    opacity: 0.9;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    font-weight: 500;
  }

  /* HUD - Glassmorphism (Critique Fix #5) */
  .hud-panel {
    background: rgba(0, 0, 0, 0.4); /* Low opacity bg */
    backdrop-filter: blur(12px);     /* Blur */
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 0.8rem 1.8rem;
    border-radius: 16px; /* Rounded corners for consistency */
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
    transition: transform 0.2s ease;
  }
  
  .hud-panel:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 255, 255, 0.2);
  }

  .stat-icon {
    width: 28px; height: 28px;
    fill: var(--accent-cyan);
    filter: drop-shadow(0 0 5px var(--accent-cyan));
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 1.8rem;
    color: white;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  /* Footer / Actions */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    margin-bottom: 1rem;
    animation: fadeInUp 1s ease-out;
  }

  /* Button Polish & Gradient (Critique Fix #4) */
  .btn-main {
    background: linear-gradient(90deg, var(--accent-cyan), #0088ff); /* Solid Neon Gradient */
    border: none;
    color: #020205; /* Dark text for contrast */
    font-family: var(--font-ui);
    font-weight: 800;
    font-size: 1rem;
    padding: 1.1rem 3.5rem;
    border-radius: 16px; /* Matches HUD */
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), 0 10px 20px rgba(0,0,0,0.4);
  }

  /* Shine effect */
  .btn-main::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%);
    opacity: 0.6;
  }

  .btn-main:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.6), 0 15px 30px rgba(0,0,0,0.5);
  }
  
  .btn-main:active {
    transform: translateY(1px);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(5px);
    border: 1px solid var(--accent-lime);
    color: var(--accent-lime);
    padding: 0.8rem 1.5rem;
    border-radius: 4px;
    font-family: var(--font-ui);
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(204, 255, 0, 0.2);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -60%) scale(1);
  }

  /* Animations */
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    h1 { font-size: 2.2rem; }
    .ui-layer { padding: 1.5rem; }
    .btn-main { padding: 1rem 2.5rem; font-size: 0.9rem; width: 100%; }
    .hud-panel { padding: 0.6rem 1.2rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="grid-bg"></div>
  <div class="spotlight"></div>
  <div class="fog-layer"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Lumina</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-panel">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" />
        </svg>
        <div>
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Captured</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured!</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   * Pure Canvas implementation for smooth 60fps rendering.
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let dustMotes = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;

  // Configuration
  const COLORS = ['#00f0ff', '#ff0055', '#ccff00'];
  const CREATURE_COUNT = 5;
  const DUST_COUNT = 40;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initDust();
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class DustMote {
    constructor() {
      this.reset();
      this.y = Math.random() * height; // Start anywhere
    }
    reset() {
      this.x = Math.random() * width;
      this.y = height + 10;
      this.size = Math.random() * 2 + 0.5;
      this.speed = Math.random() * 0.5 + 0.1;
      this.opacity = Math.random() * 0.5;
      this.wobble = Math.random() * Math.PI * 2;
    }
    update() {
      this.y -= this.speed;
      this.wobble += 0.01;
      this.x += Math.sin(this.wobble) * 0.2;
      if (this.y < -10) this.reset();
    }
    draw(ctx) {
      ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.03 + 0.01;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset();
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    }

    reset() {
      // Spawn off-screen or edges
      const edge = Math.floor(Math.random() * 4); // 0:top, 1:right, 2:bottom, 3:left
      if(edge === 0) { this.x = Math.random() * width; this.y = -50; }
      else if(edge === 1) { this.x = width + 50; this.y = Math.random() * height; }
      else if(edge === 2) { this.x = Math.random() * width; this.y = height + 50; }
      else { this.x = -50; this.y = Math.random() * height; }

      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.radius = Math.random() * 15 + 15;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = Math.random() * Math.PI * 2;
      this.rotationSpeed = (Math.random() - 0.5) * 0.02;
      
      // Z-Depth simulation (Scale)
      this.z = Math.random() * 0.8 + 0.4; // 0.4 to 1.2 scale
      this.speedMult = this.z;
      
      this.isCaught = false;
    }

    update() {
      if (this.isCaught) return;

      // Movement
      this.x += this.vx * this.speedMult;
      this.y += this.vy * this.speedMult;
      this.angle += this.rotationSpeed;

      // Wrap around screen gently (seamless looping)
      if (this.x < -100) this.x = width + 100;
      if (this.x > width + 100) this.x = -100;
      if (this.y < -100) this.y = height + 100;
      if (this.y > height + 100) this.y = -100;

      // Avoid Mouse (Net) - Only if "close" in z-depth (simulated by scale)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      // Only flee if close enough and mouse is active (simulated)
      if (dist < 200 * this.z) {
        const force = (200 - dist) / 200;
        this.vx += (dx / dist) * force * 0.1;
        this.vy += (dy / dist) * force * 0.1;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 3) {
        this.vx = (this.vx / speed) * 3;
        this.vy = (this.vy / speed) * 3;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.scale(this.z, this.z); // Apply depth scale
      ctx.rotate(this.angle);
      
      // Opacity based on depth
      ctx.globalAlpha = 0.5 + (this.z * 0.5);
      
      // Glow
      ctx.shadowBlur = 25;
      ctx.shadowColor = this.color;
      
      ctx.fillStyle = this.color;
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 2;

      ctx.beginPath();
      
      // Draw Geometric Shapes (Critique Fix #1)
      // 1. Orb (Cyan)
      if (this.color === COLORS[0]) { 
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        // Inner highlight
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-this.radius*0.3, -this.radius*0.3, this.radius*0.2, 0, Math.PI*2);
        ctx.fill();
      } 
      // 2. Shard (Magenta)
      else if (this.color === COLORS[1]) {
        const r = this.radius;
        ctx.moveTo(0, -r);
        ctx.lineTo(r * 0.866, r * 0.5);
        ctx.lineTo(-r * 0.866, r * 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } 
      // 3. Hex (Lime)
      else {
        const r = this.radius;
        for (let i = 0; i < 6; i++) {
          ctx.lineTo(r * Math.cos(i * Math.PI / 3), r * Math.sin(i * Math.PI / 3));
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      ctx.restore();
    }
  }

  function initDust() {
    dustMotes = [];
    for(let i=0; i<DUST_COUNT; i++) {
      dustMotes.push(new DustMote());
    }
  }

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = 70; 

    // Check collision
    for (let i = creatures.length - 1; i >= 0; i--) {
      let c = creatures[i];
      if (c.isCaught) continue;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      // Adjust catch radius by creature depth
      if (dist < catchRadius * c.z) {
        catchCreature(c);
      }
    }
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<20; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1000);

    // Respawn logic (delayed)
    setTimeout(() => {
      creature.reset();
    }, 2500);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    const time = Date.now() * 0.005;
    const pulse = Math.sin(time) * 5;
    const baseRadius = 60;
    
    // Net Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = isMouseDown ? '#fff' : '#00f0ff';
    
    // Outer Ring (Dashed)
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(0, 240, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 15]);
    ctx.lineDashOffset = -time * 10; // Rotate dashes
    ctx.beginPath();
    ctx.arc(0, 0, baseRadius + pulse, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Ring
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, baseRadius * 0.5 + pulse * 0.5, 0, Math.PI * 2);
    ctx.stroke();

    // Crosshair / Center
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();

    // Suction Effect (Lines pulling in)
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 1;
      for(let i=0; i<8; i++) {
        ctx.beginPath();
        const angle = (i / 8) * Math.PI * 2 + time;
        ctx.moveTo(Math.cos(angle) * 20, Math.sin(angle) * 20);
        ctx.lineTo(Math.cos(angle) * (baseRadius + pulse), Math.sin(angle) * (baseRadius + pulse));
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function loop() {
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Draw Background Dust
    dustMotes.forEach(d => {
      d.update();
      d.draw(ctx);
    });

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
