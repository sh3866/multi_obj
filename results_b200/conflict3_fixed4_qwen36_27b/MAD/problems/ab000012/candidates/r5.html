<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette - Deep Mystical & Gold */
        --bg-deep: #020205;
        --bg-gradient-center: #1e152e;
        
        --gold-primary: #eebf51;
        --gold-bright: #fff3c8;
        --gold-dim: #8f7026;
        
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-bg: rgba(10, 12, 20, 0.4);
        --glass-highlight: rgba(255, 255, 255, 0.03);
        
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        
        --magic-purple: #8b5cf6;
        --magic-blue: #3b82f6;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        /* High quality system serif stack for titles, sans for UI */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* --- 1. Atmospheric Background (Noise + Gradient) --- */
    .background-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0;
        /* Deep space gradient */
        background: radial-gradient(circle at 50% 30%, var(--bg-gradient-center) 0%, #05050a 70%, #000000 100%);
    }

    .noise-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
        opacity: 0.07;
        pointer-events: none;
        /* Inline SVG Noise Filter */
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    #canvas-bg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none;
        mix-blend-mode: screen;
    }

    /* Vignette to darken edges */
    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.85) 100%);
        z-index: 3;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 3rem;
        justify-content: space-between;
    }

    /* --- Header & Currency --- */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 1rem;
    }

    .currency-pill {
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(238, 191, 81, 0.3); /* Gold tint border */
        border-radius: 100px;
        padding: 0.5rem 1.4rem;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .currency-pill:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(238, 191, 81, 0.15);
        border-color: rgba(238, 191, 81, 0.6);
    }

    .coin-icon {
        width: 20px;
        height: 20px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 2px var(--gold-dim));
    }

    .currency-amount {
        font-family: 'Segoe UI', sans-serif;
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-bright);
        letter-spacing: 0.02em;
        text-shadow: 0 0 10px rgba(238, 191, 81, 0.5);
    }

    /* --- Hero Section (Rebuilt) --- */
    .hero-section {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        margin-bottom: 2rem;
    }

    /* Typography */
    .game-title {
        /* Serif font for mystical feel */
        font-family: "Times New Roman", Times, serif;
        font-size: 5rem;
        font-weight: normal;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin: 0;
        line-height: 1;
        /* Metallic Gold Gradient Text */
        background: linear-gradient(to bottom, #fff 0%, var(--gold-primary) 40%, var(--gold-dim) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        /* Glowing shadow */
        filter: drop-shadow(0 4px 15px rgba(0,0,0,0.8));
        position: relative;
        z-index: 2;
    }

    .game-subtitle {
        font-family: sans-serif;
        font-size: 0.85rem;
        color: var(--text-muted);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin-top: 0.5rem;
        opacity: 0.8;
        text-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    /* --- 1. Elevated Hero: Summoning Circle --- */
    .portal-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 350px;
        height: 350px;
        z-index: -1; /* Behind text */
        pointer-events: none;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* The Core Rift */
    .rift-core {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle at center, 
            rgba(255, 255, 255, 0.9) 0%, 
            rgba(139, 92, 246, 0.8) 15%, 
            rgba(59, 130, 246, 0.3) 40%, 
            rgba(0, 0, 0, 0) 70%);
        filter: blur(20px);
        opacity: 0.6;
        animation: pulse-rift 6s infinite ease-in-out;
    }

    /* Rotating Magic Rings */
    .magic-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid transparent;
        box-shadow: 0 0 15px rgba(139, 92, 246, 0.1);
    }

    .ring-outer {
        width: 100%; height: 100%;
        border-top: 1px solid rgba(139, 92, 246, 0.3);
        border-bottom: 1px solid rgba(139, 92, 246, 0.3);
        animation: spin 20s linear infinite;
    }

    .ring-inner {
        width: 70%; height: 70%;
        border-left: 2px solid rgba(238, 191, 81, 0.4);
        border-right: 2px solid rgba(238, 191, 81, 0.4);
        animation: spin-reverse 15s linear infinite;
    }

    .ring-dash {
        width: 50%; height: 50%;
        border: 1px dashed rgba(255, 255, 255, 0.2);
        animation: spin 30s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    @keyframes pulse-rift { 
        0%, 100% { transform: scale(0.95); opacity: 0.5; } 
        50% { transform: scale(1.05); opacity: 0.7; } 
    }

    /* --- 3. Hierarchy via Asymmetry (Menu Grid) --- */
    .menu-grid {
        display: grid;
        /* Grid: 2 columns. Top row spans both for Summon. Bottom row split 50/50 */
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;
        gap: 1.5rem;
        width: 100%;
        margin-top: auto; /* Push to bottom */
        padding-bottom: 1rem;
    }

    /* --- 2. Glass & Gold Visual Language (Cards) --- */
    .menu-card {
        /* Glassmorphism Base */
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-top: 1px solid rgba(255,255,255,0.1); /* Top highlight */
        border-radius: 20px;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    /* Typography */
    .card-label {
        font-family: "Times New Roman", Times, serif;
        font-size: 1.5rem;
        letter-spacing: 0.05em;
        z-index: 2;
        margin-top: 1rem;
        transition: color 0.3s ease;
    }

    /* Icons */
    .card-icon {
        width: 48px;
        height: 48px;
        stroke-width: 1.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: all 0.3s ease;
        z-index: 2;
    }

    /* --- Primary Card: SUMMON --- */
    .menu-card.summon {
        grid-column: 1 / -1; /* Spans full width */
        height: 160px;
        /* Rich Gold Gradient Background */
        background: linear-gradient(135deg, rgba(60, 50, 20, 0.6) 0%, rgba(15, 15, 20, 0.8) 100%);
        border: 1px solid rgba(238, 191, 81, 0.4);
        box-shadow: 0 0 30px rgba(238, 191, 81, 0.05);
    }

    .menu-card.summon .card-icon {
        stroke: var(--gold-primary);
        filter: drop-shadow(0 0 8px rgba(238, 191, 81, 0.6));
        width: 56px; height: 56px;
    }
    
    .menu-card.summon .card-label {
        color: var(--gold-bright);
        text-shadow: 0 0 15px rgba(238, 191, 81, 0.4);
        font-size: 2rem;
    }

    /* Summon Hover */
    .menu-card.summon:hover {
        transform: translateY(-5px);
        border-color: var(--gold-primary);
        box-shadow: 0 0 40px rgba(238, 191, 81, 0.2);
        background: linear-gradient(135deg, rgba(80, 65, 25, 0.7) 0%, rgba(20, 20, 30, 0.9) 100%);
    }

    /* Summon Glow Animation */
    .summon-glow {
        position: absolute;
        width: 300px; height: 100px;
        background: radial-gradient(ellipse at center, rgba(238, 191, 81, 0.15) 0%, transparent 70%);
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
        animation: breathe 4s infinite ease-in-out;
    }

    /* --- Secondary Cards: Roster, Battle, Grind --- */
    .menu-card.secondary {
        height: 160px;
        background: linear-gradient(180deg, rgba(30, 35, 50, 0.4) 0%, rgba(10, 10, 15, 0.6) 100%);
        border-color: rgba(148, 163, 184, 0.1);
    }

    .menu-card.secondary .card-icon {
        stroke: var(--text-muted);
    }
    
    .menu-card.secondary .card-label {
        color: var(--text-main);
    }

    /* Secondary Hover */
    .menu-card.secondary:hover {
        transform: translateY(-5px);
        border-color: rgba(255, 255, 255, 0.3);
        background: linear-gradient(180deg, rgba(40, 45, 65, 0.5) 0%, rgba(15, 15, 25, 0.7) 100%);
        box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }
    
    .menu-card.secondary:hover .card-icon {
        stroke: #fff;
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.4));
    }

    @keyframes breathe { 
        0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); } 
        50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 
    }

    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.75rem;
        opacity: 0.4;
        letter-spacing: 0.1em;
        margin-top: 2rem;
        text-transform: uppercase;
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .app-container { padding: 2rem; }
        .game-title { font-size: 3.5rem; }
        
        .portal-container { width: 250px; height: 250px; }

        .menu-grid {
            grid-template-columns: 1fr; /* Stack vertically */
            gap: 1rem;
        }
        
        .menu-card.summon { height: 100px; }
        .menu-card.secondary { height: 80px; flex-direction: row; justify-content: flex-start; gap: 1.5rem; }
        
        .menu-card.secondary .card-icon { width: 32px; height: 32px; margin-top: 0; }
        .menu-card.secondary .card-label { font-size: 1.2rem; margin-top: 0; }
    }
</style>
</head>
<body>

    <!-- Background Layers -->
    <div class="background-layer"></div>
    <div class="noise-overlay"></div>
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/>
                    <text x="12" y="16" font-size="12" text-anchor="middle" fill="currentColor" font-family="serif" font-weight="bold">G</text>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero Section -->
        <section class="hero-section">
            <!-- Portal/Rift Background -->
            <div class="portal-container">
                <div class="rift-core"></div>
                <div class="magic-ring ring-outer"></div>
                <div class="magic-ring ring-inner"></div>
                <div class="magic-ring ring-dash"></div>
            </div>

            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>
        </section>

        <!-- Menu Grid: Asymmetric Layout -->
        <nav class="menu-grid">
            
            <!-- 1. Summon (Primary, Large, Gold) -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <div class="summon-glow"></div>
                <!-- Star/Sparkle Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" />
                </svg>
                <span class="card-label">Summon</span>
            </div>

            <!-- 2. Roster (Secondary) -->
            <div class="menu-card secondary" onclick="interact('Roster')">
                <!-- Scroll/List Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- 3. Battle (Secondary) -->
            <div class="menu-card secondary" onclick="interact('Battle')">
                <!-- Sword Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                    <path d="M13 19l6-6" />
                    <path d="M16 16l4 4" />
                    <path d="M19 21l2-2" />
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- 4. Grind (Secondary) -->
            <div class="menu-card secondary" onclick="interact('Grind')">
                <!-- Cycle/Runes Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 6v6l4 2" />
                </svg>
                <span class="card-label">Grind</span>
            </div>
        </nav>

        <footer>
            Aetherbound v1.3.0 &bull; System Ready
        </footer>
    </div>

<script>
    // --- Background Particle System (Mystical Dust) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
            // Start at random positions initially
            this.y = Math.random() * height;
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + 10; // Start just below screen
            this.vx = (Math.random() - 0.5) * 0.2; // Slow drift
            this.vy = -(Math.random() * 0.5 + 0.1); // Slow rise
            this.size = Math.random() * 1.5 + 0.5;
            this.alpha = 0;
            this.targetAlpha = Math.random() * 0.4 + 0.1;
            this.fadeIn = true;
            // Mix of gold and white
            this.color = Math.random() > 0.8 ? '238, 191, 81' : '255, 255, 255'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            // Twinkle logic
            if (this.fadeIn) {
                this.alpha += 0.005;
                if (this.alpha >= this.targetAlpha) this.fadeIn = false;
            } else {
                this.alpha -= 0.002;
                if (this.alpha <= 0) this.reset();
            }

            // Reset if off top screen
            if (this.y < -10) this.reset();
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // Density calculation
        const count = Math.floor((width * height) / 15000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        // Slight press effect
        btn.style.transform = 'scale(0.98)';
        btn.style.filter = 'brightness(1.2)';
        setTimeout(() => {
            btn.style.transform = '';
            btn.style.filter = '';
        }, 150);
        console.log(`Navigating to: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
