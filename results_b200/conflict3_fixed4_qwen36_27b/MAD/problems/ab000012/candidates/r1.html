<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #050508;
        --bg-indigo: #1a1525;
        --gold-primary: #c5a059;
        --gold-bright: #f2d08b;
        --gold-dark: #7a5c23;
        --magic-cyan: #00f0ff;
        --magic-purple: #bd00ff;
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --font-heading: 'Trajan Pro', 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* Critique 1: Deep mystical environment base */
        background: radial-gradient(ellipse at 50% 20%, var(--bg-indigo) 0%, var(--bg-deep) 80%);
    }

    /* --- Atmospheric Background --- */
    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
        opacity: 0.7;
        mix-blend-mode: screen;
    }

    /* Critique 1: Fog/Dust Overlay */
    .fog-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 200%;
        height: 100%;
        z-index: 2;
        background: 
            radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 60%),
            linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.8) 100%);
        animation: driftFog 60s linear infinite;
        pointer-events: none;
    }

    @keyframes driftFog {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    /* Vignette for depth */
    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, transparent 40%, var(--bg-deep) 100%);
        z-index: 3;
        pointer-events: none;
    }

    /* --- Main Container --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem 3rem;
    }

    /* --- Header & HUD --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
    }

    /* Critique 5: Integrated Currency HUD */
    .currency-pill {
        background: linear-gradient(135deg, rgba(20, 20, 30, 0.9), rgba(10, 10, 15, 0.95));
        border: 1px solid var(--gold-dark);
        border-right: 2px solid var(--gold-primary);
        border-bottom: 2px solid var(--gold-primary);
        border-radius: 4px; /* Sharper corners for artifact feel */
        padding: 0.6rem 1.8rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 
            0 4px 10px rgba(0,0,0,0.8),
            inset 0 0 15px rgba(0,0,0,0.8);
        position: relative;
        overflow: hidden;
    }
    
    /* Artifact texture for HUD */
    .currency-pill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        opacity: 0.5;
        pointer-events: none;
    }

    .coin-icon {
        width: 22px;
        height: 22px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 4px var(--gold-dark));
    }

    .currency-amount {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-bright);
        letter-spacing: 0.05em;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        margin-bottom: 2rem;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 4rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 0.5rem;
        background: linear-gradient(to bottom, var(--gold-bright) 0%, var(--gold-primary) 60%, var(--gold-dark) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(197, 160, 89, 0.25));
        position: relative;
        z-index: 2;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.9rem;
        color: var(--text-muted);
        letter-spacing: 0.4em;
        text-transform: uppercase;
        margin-bottom: 2rem;
        opacity: 0.7;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* The Summoning Orb */
    .orb-container {
        position: relative;
        width: 200px;
        height: 200px;
        margin-bottom: 2rem;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .orb-svg {
        width: 100%;
        height: 100%;
        animation: floatOrb 6s ease-in-out infinite;
        filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.3));
    }

    .orb-glow {
        position: absolute;
        width: 120%;
        height: 120%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 240, 255, 0.15) 0%, transparent 60%);
        animation: pulseOrb 4s infinite ease-in-out;
        z-index: -1;
    }

    @keyframes floatOrb {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-15px) scale(1.02); }
    }

    @keyframes pulseOrb {
        0%, 100% { opacity: 0.5; transform: scale(0.9); }
        50% { opacity: 0.8; transform: scale(1.1); }
    }

    /* --- Menu Grid (Critique 2 & 3) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr 1fr; /* Asymmetric layout */
        grid-template-rows: 1fr 1fr;
        gap: 1.5rem;
        width: 100%;
        height: 320px; /* Fixed height for consistency */
        margin-bottom: 2rem;
    }

    /* Critique 2: Unified Artifact Navigation */
    .menu-card {
        background: linear-gradient(160deg, rgba(30, 30, 40, 0.7), rgba(15, 15, 20, 0.9));
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-bottom: 2px solid var(--gold-dark);
        border-right: 2px solid var(--gold-dark);
        border-radius: 4px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Artifact Texture */
    .menu-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        opacity: 0.6;
        pointer-events: none;
    }

    /* Artifact Border Glow on Hover */
    .menu-card:hover {
        transform: translateY(-4px);
        border-color: var(--gold-primary);
        box-shadow: 
            0 15px 40px rgba(0,0,0,0.6),
            0 0 15px rgba(197, 160, 89, 0.15);
    }

    .menu-card:hover .card-icon {
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 8px var(--gold-primary));
    }

    .card-label {
        font-family: var(--font-heading);
        font-size: 1.2rem;
        color: var(--text-main);
        letter-spacing: 0.1em;
        font-weight: 600;
        text-transform: uppercase;
        z-index: 2;
    }

    /* Critique 4: Thematic Iconography */
    .card-icon {
        width: 48px;
        height: 48px;
        fill: var(--text-muted);
        transition: all 0.4s ease;
        z-index: 2;
    }

    /* Critique 3: Dominant Summon Card */
    .menu-card.summon {
        grid-column: 1 / 2;
        grid-row: 1 / 3; /* Takes full height */
        background: linear-gradient(160deg, rgba(40, 40, 60, 0.8), rgba(20, 20, 30, 0.95));
        border: 1px solid var(--gold-primary);
        box-shadow: 0 0 30px rgba(197, 160, 89, 0.1);
    }

    .menu-card.summon:hover {
        box-shadow: 0 0 50px rgba(197, 160, 89, 0.3);
        border-color: var(--gold-bright);
    }

    /* Critique 3: Pulsing Aura for Summon */
    .menu-card.summon::after {
        content: '';
        position: absolute;
        top: -50%; left: -50%; width: 200%; height: 200%;
        background: conic-gradient(from 0deg, transparent, rgba(197, 160, 89, 0.2), transparent 30%);
        animation: rotateAura 4s linear infinite;
        opacity: 0.5;
        z-index: 1;
    }

    @keyframes rotateAura {
        100% { transform: rotate(360deg); }
    }

    /* Secondary Cards Positioning */
    .menu-card.roster { grid-column: 2 / 3; grid-row: 1 / 2; }
    .menu-card.battle { grid-column: 3 / 4; grid-row: 1 / 2; }
    .menu-card.grind  { grid-column: 2 / 4; grid-row: 2 / 3; } /* Wider bottom card */

    /* Footer */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.75rem;
        opacity: 0.4;
        letter-spacing: 0.1em;
        margin-top: auto;
        padding-bottom: 1rem;
    }

    /* --- Responsive --- */
    @media (max-width: 850px) {
        .app-container { padding: 1.5rem; }
        .game-title { font-size: 2.8rem; }
        
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto;
            height: auto;
        }

        .menu-card.summon {
            grid-column: 1 / -1;
            grid-row: auto;
            flex-direction: row;
            justify-content: flex-start;
            padding: 1.2rem 2rem;
        }
        
        .menu-card.summon .card-label { margin-left: 1rem; }
        
        .menu-card {
            min-height: 120px;
        }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="canvas-bg"></canvas>
    <div class="fog-overlay"></div>
    <div class="vignette"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div style="width: 100px;"></div> <!-- Spacer -->
            
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/>
                    <circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="1" fill="none" opacity="0.5"/>
                    <path d="M12 7v10M9 10l3-3 3 3M9 14l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <div class="orb-container">
                <div class="orb-glow"></div>
                <!-- Procedural Orb SVG -->
                <svg class="orb-svg" viewBox="0 0 100 100">
                    <defs>
                        <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:0.9" />
                            <stop offset="40%" style="stop-color:#2c5261;stop-opacity:0.5" />
                            <stop offset="100%" style="stop-color:#050508;stop-opacity:0" />
                        </radialGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <!-- Outer Rings -->
                    <circle cx="50" cy="50" r="42" stroke="rgba(0, 240, 255, 0.2)" stroke-width="0.5" stroke-dasharray="4 4" fill="none">
                        <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="30s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="50" cy="50" r="38" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" fill="none">
                        <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="20s" repeatCount="indefinite" />
                    </circle>
                    <!-- Core -->
                    <circle cx="50" cy="50" r="25" fill="url(#orbGrad)" filter="url(#glow)">
                        <animate attributeName="r" values="24;26;24" dur="4s" repeatCount="indefinite" />
                    </circle>
                </svg>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon (Dominant) -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <!-- Runic Hex/Star Glyph -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2l2.5 5.5L20 9l-3 5 1 6-6-3-6 3 1-6-3-5 5.5-1.5z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
                    <circle cx="12" cy="12" r="3" fill="currentColor"/>
                </svg>
                <span class="card-label">Summon Spirits</span>
            </div>

            <!-- Roster -->
            <div class="menu-card roster" onclick="interact('Roster')">
                <!-- Shield/Totem Glyph -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                    <path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card battle" onclick="interact('Battle')">
                <!-- Sword/Strike Glyph -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
                    <path d="M13 19l6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M16 16l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M19 21l2-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card grind" onclick="interact('Grind')">
                <!-- Anvil/Cycle Glyph -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/>
                    <path d="M12 3v18M3 12h18" stroke="currentColor" stroke-width="0.5" opacity="0.5"/>
                    <path d="M12 7a5 5 0 0 1 0 10" stroke="currentColor" stroke-width="1.5" fill="none"/>
                </svg>
                <span class="card-label">Grind</span>
            </div>
        </nav>

        <footer>
            Aetherbound v1.1.0 &bull; System Ready
        </footer>
    </div>

<script>
    // --- Background Particle System (Dust/Ash) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.2; // Very slow drift
            this.vy = (Math.random() - 0.5) * 0.2;
            this.size = Math.random() * 2 + 0.5;
            this.alpha = Math.random() * 0.3;
            this.life = Math.random() * 0.5 + 0.5;
            // Gold or White dust
            this.color = Math.random() > 0.9 ? '197, 160, 89' : '255, 255, 255'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            // Subtle pulsing opacity
            this.alpha += (Math.random() - 0.5) * 0.01;
            if(this.alpha < 0.05) this.alpha = 0.05;
            if(this.alpha > 0.4) this.alpha = 0.4;

            // Wrap around screen
            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 12000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        // Visual feedback
        btn.style.transform = 'scale(0.96)';
        btn.style.boxShadow = '0 0 0 rgba(197, 160, 89, 0)';
        
        setTimeout(() => {
            btn.style.transform = '';
            btn.style.boxShadow = '';
        }, 150);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
