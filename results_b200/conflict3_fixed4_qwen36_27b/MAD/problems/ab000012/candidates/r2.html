<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette */
        --bg-deep: #050508;
        --bg-indigo: #130f1c;
        --bg-rift: #2a1b3d;
        
        --gold-primary: #c5a059;
        --gold-bright: #f2d08b;
        --gold-dark: #7a5c23;
        
        --magic-cyan: #00f0ff;
        --magic-purple: #bd00ff;
        
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        
        /* Typography */
        --font-heading: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* --- Critique 1: Atmospheric Background --- */
    .background-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0;
        /* Deep indigo to void black radial gradient */
        background: radial-gradient(ellipse at 50% 30%, var(--bg-rift) 0%, var(--bg-indigo) 40%, var(--bg-deep) 90%);
    }

    /* Noise Texture Overlay */
    .noise-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
        opacity: 0.06;
        pointer-events: none;
        /* SVG Noise Filter */
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Canvas for magical particles */
    #canvas-bg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none;
        mix-blend-mode: screen;
    }

    /* Vignette for depth */
    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
        z-index: 3;
        pointer-events: none;
    }

    /* --- Main Layout Container --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1100px;
        height: 100%;
        max-height: 850px;
        display: flex;
        flex-direction: column;
        padding: 2rem 3rem;
    }

    /* --- Header & HUD (Critique 5) --- */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 1rem;
    }

    .currency-pill {
        /* Glassmorphism */
        background: rgba(10, 10, 15, 0.6);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(197, 160, 89, 0.3);
        border-right: 1px solid rgba(197, 160, 89, 0.6);
        border-bottom: 1px solid rgba(197, 160, 89, 0.6);
        border-radius: 4px;
        padding: 0.5rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .coin-icon {
        width: 20px;
        height: 20px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 3px var(--gold-dark));
    }

    .currency-amount {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1rem;
        color: var(--gold-bright);
        letter-spacing: 0.05em;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        margin-bottom: 2.5rem;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 4.5rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        margin-bottom: 0.2rem;
        /* Metallic Gold Gradient */
        background: linear-gradient(to bottom, var(--gold-bright) 0%, var(--gold-primary) 40%, var(--gold-dark) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));
        position: relative;
        z-index: 2;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.85rem;
        color: var(--text-muted);
        letter-spacing: 0.5em;
        text-transform: uppercase;
        margin-bottom: 2rem;
        opacity: 0.8;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* The Summoning Orb (Visual Anchor) */
    .orb-container {
        position: relative;
        width: 140px;
        height: 140px;
        margin-bottom: 1.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .orb-svg {
        width: 100%;
        height: 100%;
        animation: floatOrb 6s ease-in-out infinite;
        filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.2));
    }

    @keyframes floatOrb {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-10px) scale(1.02); }
    }

    /* --- Navigation Grid (Critique 2 & 3) --- */
    .menu-grid {
        display: grid;
        /* Critique 2: Dominant Left (40%) + Utility Right (60%) */
        grid-template-columns: 1.6fr 1fr 1fr; 
        grid-template-rows: 1fr 1fr;
        gap: 1.2rem;
        width: 100%;
        height: 300px; /* Fixed height for consistency */
    }

    /* Base Card Style (Glassmorphism) */
    .menu-card {
        background: rgba(15, 15, 25, 0.4);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        border-left: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    /* Hover Effect for Cards */
    .menu-card:hover {
        transform: translateY(-4px);
        background: rgba(20, 20, 35, 0.6);
        border-color: rgba(197, 160, 89, 0.4);
        box-shadow: 0 15px 30px rgba(0,0,0,0.5), inset 0 0 10px rgba(197, 160, 89, 0.05);
    }

    /* Typography inside cards */
    .card-label {
        font-family: var(--font-heading);
        font-size: 1.1rem;
        color: var(--text-main);
        letter-spacing: 0.15em;
        font-weight: 600;
        text-transform: uppercase;
        z-index: 2;
        transition: color 0.3s ease;
    }

    /* Critique 4: Iconography Unification */
    .card-icon {
        width: 44px;
        height: 44px;
        stroke: var(--text-muted);
        stroke-width: 1.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: all 0.4s ease;
        z-index: 2;
    }

    .menu-card:hover .card-icon {
        stroke: var(--gold-bright);
        filter: drop-shadow(0 0 5px rgba(197, 160, 89, 0.4));
    }

    /* --- Specific Card Styling --- */

    /* Critique 3: Dominant Summon Card */
    .menu-card.summon {
        grid-column: 1 / 2;
        grid-row: 1 / 3;
        /* Ornate Gold Frame */
        background: linear-gradient(160deg, rgba(30, 25, 40, 0.6), rgba(15, 15, 25, 0.8));
        border: 1px solid var(--gold-primary);
        box-shadow: 0 0 20px rgba(197, 160, 89, 0.1);
        align-items: center;
        justify-content: space-evenly;
    }

    /* Ornate Corners for Summon */
    .menu-card.summon::before, .menu-card.summon::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        border: 2px solid var(--gold-primary);
        transition: all 0.4s ease;
    }
    .menu-card.summon::before { top: 8px; left: 8px; border-right: none; border-bottom: none; }
    .menu-card.summon::after { bottom: 8px; right: 8px; border-left: none; border-top: none; }

    .menu-card.summon:hover {
        border-color: var(--gold-bright);
        box-shadow: 0 0 40px rgba(197, 160, 89, 0.2);
    }
    
    .menu-card.summon:hover::before, .menu-card.summon:hover::after {
        width: 100%; height: 100%;
        border-color: rgba(197, 160, 89, 0.3);
    }

    /* Critique 3: Pulsing Glow for Summon */
    .summon-glow {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 80%; height: 80%;
        background: radial-gradient(circle, rgba(197, 160, 89, 0.15) 0%, transparent 70%);
        animation: pulseAura 4s infinite ease-in-out;
        z-index: 1;
        pointer-events: none;
    }

    @keyframes pulseAura {
        0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.95); }
        50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.05); }
    }

    /* Critique 4: Summon Icon Specifics (Thicker stroke for premium feel) */
    .menu-card.summon .card-icon {
        stroke: var(--gold-primary);
        stroke-width: 1.2; /* Slightly thinner stroke but larger visual weight via design */
        width: 52px;
        height: 52px;
    }
    
    .menu-card.summon .card-label {
        font-size: 1.4rem;
        color: var(--gold-bright);
        margin-top: 1rem;
    }

    /* Utility Cards Grid Positioning */
    .menu-card.roster { grid-column: 2 / 3; grid-row: 1 / 2; }
    .menu-card.battle { grid-column: 3 / 4; grid-row: 1 / 2; }
    .menu-card.grind  { grid-column: 2 / 4; grid-row: 2 / 3; } /* Wide bottom card */

    /* Footer */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.7rem;
        opacity: 0.3;
        letter-spacing: 0.15em;
        margin-top: auto;
        padding-bottom: 1rem;
        text-transform: uppercase;
    }

    /* --- Responsive --- */
    @media (max-width: 850px) {
        .app-container { padding: 1.5rem; }
        .game-title { font-size: 3rem; }
        
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto;
            height: auto;
            gap: 1rem;
        }

        .menu-card.summon {
            grid-column: 1 / -1;
            grid-row: auto;
            flex-direction: row;
            justify-content: flex-start;
            padding: 1.5rem 2rem;
            margin-bottom: 0.5rem;
        }
        
        .menu-card.summon .card-label { margin-left: 1rem; margin-top: 0; }
        .menu-card.summon .summon-glow { display: none; }
        
        .menu-card {
            min-height: 100px;
        }
        
        .menu-card.grind {
            grid-column: 1 / -1;
        }
    }
</style>
</head>
<body>

    <!-- Background Layers -->
    <div class="background-layer"></div>
    <div class="noise-overlay"></div>
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/>
                    <circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="1" fill="none" opacity="0.5"/>
                    <path d="M12 7v10M9 10l3-3 3 3M9 14l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero Section -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <div class="orb-container">
                <!-- Procedural Orb SVG -->
                <svg class="orb-svg" viewBox="0 0 100 100">
                    <defs>
                        <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:0.9" />
                            <stop offset="40%" style="stop-color:#2c5261;stop-opacity:0.5" />
                            <stop offset="100%" style="stop-color:#050508;stop-opacity:0" />
                        </radialGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <!-- Outer Rings -->
                    <circle cx="50" cy="50" r="42" stroke="rgba(0, 240, 255, 0.2)" stroke-width="0.5" stroke-dasharray="4 4" fill="none">
                        <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="30s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="50" cy="50" r="38" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" fill="none">
                        <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="20s" repeatCount="indefinite" />
                    </circle>
                    <!-- Core -->
                    <circle cx="50" cy="50" r="25" fill="url(#orbGrad)" filter="url(#glow)">
                        <animate attributeName="r" values="24;26;24" dur="4s" repeatCount="indefinite" />
                    </circle>
                </svg>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon (Dominant) -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <div class="summon-glow"></div>
                <!-- Critique 4: High-fidelity thin-line star (Premium feel) -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" />
                    <circle cx="12" cy="12" r="2" />
                </svg>
                <span class="card-label">Summon Spirits</span>
            </div>

            <!-- Roster -->
            <div class="menu-card roster" onclick="interact('Roster')">
                <!-- Shield Glyph -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    <path d="M12 8v4M12 16h.01" />
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card battle" onclick="interact('Battle')">
                <!-- Sword Glyph -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                    <path d="M13 19l6-6" />
                    <path d="M16 16l4 4" />
                    <path d="M19 21l2-2" />
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card grind" onclick="interact('Grind')">
                <!-- Cycle Glyph -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M21 12a9 9 0 1 1-9-9" />
                    <path d="M21 3v5h-5" />
                </svg>
                <span class="card-label">Grind</span>
            </div>
        </nav>

        <footer>
            Aetherbound v1.2.0 &bull; System Ready
        </footer>
    </div>

<script>
    // --- Background Particle System (Dust/Ash) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.2; 
            this.vy = (Math.random() - 0.5) * 0.2;
            this.size = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.4;
            // Mix of gold and white dust
            this.color = Math.random() > 0.8 ? '197, 160, 89' : '255, 255, 255'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            // Subtle pulsing opacity
            this.alpha += (Math.random() - 0.5) * 0.01;
            if(this.alpha < 0.1) this.alpha = 0.1;
            if(this.alpha > 0.5) this.alpha = 0.5;

            // Wrap around screen
            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 15000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        // Visual feedback
        btn.style.transform = 'scale(0.98)';
        btn.style.boxShadow = '0 0 0 rgba(197, 160, 89, 0)';
        
        setTimeout(() => {
            btn.style.transform = '';
            btn.style.boxShadow = '';
        }, 150);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
