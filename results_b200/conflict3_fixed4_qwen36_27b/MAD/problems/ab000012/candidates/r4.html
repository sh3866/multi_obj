<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette - Refined */
        --bg-deep: #050508;
        --bg-panel: rgba(16, 18, 28, 0.85);
        
        --gold-primary: #d4af37;
        --gold-glow: #f9e5a8;
        --gold-dim: #8a6e32;
        
        --silver-primary: #94a3b8;
        --silver-glow: #e2e8f0;
        --silver-dim: #475569;
        
        --text-main: #f8fafc;
        --text-muted: #64748b;
        
        /* Magic Accents */
        --magic-purple: #a855f7;
        --magic-blue: #3b82f6;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* --- 1. Atmospheric Background --- */
    .background-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0;
        background: radial-gradient(ellipse at 50% 40%, #1a1525 0%, var(--bg-deep) 80%);
    }

    .noise-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
        opacity: 0.04;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    #canvas-bg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none;
        mix-blend-mode: screen;
    }

    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
        z-index: 3;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1100px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem 3rem;
        justify-content: space-between;
    }

    /* --- 2. Rebuilt Currency Indicator (Flat, Glowing Pill) --- */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 1rem;
    }

    .currency-pill {
        background: rgba(10, 10, 15, 0.7);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 100px;
        padding: 0.4rem 1.2rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 0 15px rgba(0,0,0,0.3), inset 0 0 10px rgba(212, 175, 55, 0.05);
        transition: all 0.3s ease;
    }

    .currency-pill:hover {
        border-color: rgba(212, 175, 55, 0.6);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
    }

    .coin-icon {
        width: 18px;
        height: 18px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 4px var(--gold-dim));
    }

    .currency-amount {
        font-family: 'Segoe UI', sans-serif;
        font-weight: 700;
        font-size: 1rem;
        color: var(--gold-glow);
        letter-spacing: 0.05em;
        text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        margin-bottom: 3rem;
    }

    .game-title {
        font-family: 'Times New Roman', serif;
        font-size: 4rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 0.2rem;
        background: linear-gradient(to bottom, #fff 0%, var(--gold-primary) 50%, var(--gold-dim) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
        position: relative;
        z-index: 2;
    }

    .game-subtitle {
        font-family: sans-serif;
        font-size: 0.9rem;
        color: var(--text-muted);
        letter-spacing: 0.4em;
        text-transform: uppercase;
        opacity: 0.7;
    }

    /* Portal Effect */
    .portal-container {
        position: relative;
        width: 120px;
        height: 120px;
        margin-bottom: 2rem;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
    }

    .portal-core {
        position: absolute;
        width: 40px;
        height: 40px;
        background: radial-gradient(circle, #fff 0%, var(--magic-purple) 40%, transparent 70%);
        border-radius: 50%;
        filter: blur(6px);
        animation: breathe 4s infinite ease-in-out;
        z-index: 1;
    }

    .ring {
        position: absolute;
        border-radius: 50%;
        border-style: dashed;
        border-color: rgba(168, 85, 247, 0.3);
        box-shadow: 0 0 10px rgba(168, 85, 247, 0.1);
    }

    .ring-1 {
        width: 60px; height: 60px;
        border-width: 2px;
        animation: spin 10s linear infinite;
    }

    .ring-2 {
        width: 100px; height: 100px;
        border-width: 1px;
        border-color: rgba(59, 130, 246, 0.2);
        animation: spin-reverse 15s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }

    /* --- 3. Restructured Grid (1x4 Horizontal Row) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr); /* 4 Equal Widths */
        grid-template-rows: 1fr;
        gap: 1.5rem;
        width: 100%;
        height: 220px; /* Fixed height for dashboard feel */
    }

    /* --- 4. Unified Card System --- */
    .menu-card {
        background: linear-gradient(180deg, rgba(25, 25, 40, 0.8) 0%, rgba(10, 10, 15, 0.9) 100%);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(148, 163, 184, 0.15); /* Subtle silver tint */
        border-radius: 12px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
    }

    .menu-card:hover {
        transform: translateY(-4px);
        background: linear-gradient(180deg, rgba(35, 35, 50, 0.9) 0%, rgba(15, 15, 20, 0.95) 100%);
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    /* Typography & Icons */
    .card-label {
        font-family: 'Segoe UI', sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        z-index: 2;
    }

    .card-icon {
        width: 40px;
        height: 40px;
        stroke-width: 1.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: all 0.3s ease;
        z-index: 2;
    }

    /* --- 5. Hierarchy via Color (Summon vs Others) --- */
    
    /* Secondary Cards (Roster, Battle, Grind) */
    .menu-card:not(.summon) .card-icon {
        stroke: var(--silver-primary);
        filter: drop-shadow(0 0 1px rgba(148, 163, 184, 0.3));
    }
    
    .menu-card:not(.summon) .card-label {
        color: var(--silver-primary);
    }

    .menu-card:not(.summon):hover {
        border-color: rgba(148, 163, 184, 0.4);
    }

    .menu-card:not(.summon):hover .card-icon,
    .menu-card:not(.summon):hover .card-label {
        color: var(--silver-glow);
        stroke: var(--silver-glow);
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.3));
    }

    /* Primary Card (Summon) */
    .menu-card.summon {
        border: 1px solid rgba(212, 175, 55, 0.3); /* Gold Tint */
        background: linear-gradient(180deg, rgba(40, 30, 15, 0.8) 0%, rgba(10, 10, 15, 0.9) 100%);
    }

    .menu-card.summon .card-icon {
        stroke: var(--gold-primary);
        filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.4));
    }
    
    .menu-card.summon .card-label {
        color: var(--gold-glow);
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    /* Summon Glow Effect */
    .summon-glow {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 120px; height: 120px;
        background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
        animation: breathe 4s infinite ease-in-out;
        z-index: 1;
    }

    .menu-card.summon:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 0 25px rgba(212, 175, 55, 0.15), inset 0 0 20px rgba(212, 175, 55, 0.05);
    }

    /* --- Responsive --- */
    @media (max-width: 900px) {
        .app-container { padding: 1.5rem; }
        .game-title { font-size: 2.5rem; }
        
        .menu-grid {
            grid-template-columns: 1fr 1fr; /* 2x2 on tablet */
            height: auto;
            gap: 1rem;
        }
        
        .menu-card { min-height: 120px; }
    }

    @media (max-width: 600px) {
        .menu-grid {
            grid-template-columns: 1fr; /* 1x4 on mobile */
        }
        .menu-card { flex-direction: row; justify-content: flex-start; padding-left: 2rem; min-height: 70px; }
        .card-icon { width: 32px; height: 32px; }
    }

    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.7rem;
        opacity: 0.3;
        letter-spacing: 0.2em;
        margin-top: auto;
        padding-top: 1rem;
        text-transform: uppercase;
    }
</style>
</head>
<body>

    <!-- Background Layers -->
    <div class="background-layer"></div>
    <div class="noise-overlay"></div>
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <!-- Flat Coin Icon -->
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-12.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V3H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.86 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V21h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero Section -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <!-- Portal Effect -->
            <div class="portal-container">
                <div class="portal-core"></div>
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
            </div>
        </section>

        <!-- Menu Grid: 1x4 Horizontal Row -->
        <nav class="menu-grid">
            
            <!-- 1. Summon (Primary Gold) -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <div class="summon-glow"></div>
                <!-- Star Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" />
                </svg>
                <span class="card-label">Summon</span>
            </div>

            <!-- 2. Roster (Secondary Silver) -->
            <div class="menu-card roster" onclick="interact('Roster')">
                <!-- Shield Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- 3. Battle (Secondary Silver) -->
            <div class="menu-card battle" onclick="interact('Battle')">
                <!-- Sword Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                    <path d="M13 19l6-6" />
                    <path d="M16 16l4 4" />
                    <path d="M19 21l2-2" />
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- 4. Grind (Secondary Silver) -->
            <div class="menu-card grind" onclick="interact('Grind')">
                <!-- Cycle/Refresh Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M21 12a9 9 0 1 1-9-9" />
                    <path d="M21 3v5h-5" />
                </svg>
                <span class="card-label">Grind</span>
            </div>
        </nav>

        <footer>
            Aetherbound v1.3.0 &bull; System Ready
        </footer>
    </div>

<script>
    // --- Background Particle System (Dust/Ash) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.1; 
            this.vy = (Math.random() - 0.5) * 0.1;
            this.size = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.3;
            // Mix of gold and white particles
            this.color = Math.random() > 0.7 ? '212, 175, 55' : '255, 255, 255'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            // Subtle twinkling
            this.alpha += (Math.random() - 0.5) * 0.01;
            if(this.alpha < 0.05) this.alpha = 0.05;
            if(this.alpha > 0.4) this.alpha = 0.4;

            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // Fewer particles for a cleaner, more elegant look
        const count = Math.floor((width * height) / 25000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        // Slight press effect
        btn.style.transform = 'scale(0.96)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
