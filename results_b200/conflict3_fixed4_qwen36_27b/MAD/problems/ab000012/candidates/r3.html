<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette */
        --bg-deep: #040406;
        --bg-rift: #1a1224;
        
        --gold-primary: #d4af37;
        --gold-highlight: #f9e5a8;
        --gold-shadow: #7a5c23;
        --gold-metal: #8a6e32;
        
        --magic-cyan: #00f0ff;
        --magic-purple: #9d00ff;
        
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        
        /* Typography */
        --font-heading: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* --- 1. Atmospheric Hero Area: Background & Portal --- */
    .background-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 0;
        background: radial-gradient(ellipse at 50% 30%, var(--bg-rift) 0%, var(--bg-deep) 70%);
    }

    .noise-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
        opacity: 0.05;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    #canvas-bg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none;
        mix-blend-mode: screen;
    }

    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.95) 100%);
        z-index: 3;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        max-height: 850px;
        display: flex;
        flex-direction: column;
        padding: 2rem 3rem;
    }

    /* --- 2. Rebuilt Gold Indicator --- */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 1rem;
    }

    .currency-bar {
        /* Metallic Bar Construction */
        background: linear-gradient(180deg, #5c4316 0%, #3d2b10 50%, #2a1d0a 100%);
        border: 1px solid var(--gold-primary);
        border-radius: 4px;
        padding: 0.4rem 1.2rem;
        display: flex;
        align-items: center;
        gap: 10px;
        position: relative;
        /* Inner shadow for depth */
        box-shadow: 
            inset 0 1px 0 rgba(255,255,255,0.3),
            inset 0 -1px 0 rgba(0,0,0,0.5),
            0 4px 10px rgba(0,0,0,0.6);
        transform: skewX(-5deg);
    }

    .currency-bar::after {
        /* Gold Rim Highlight */
        content: '';
        position: absolute;
        top: 1px; left: 1px; right: 1px; bottom: 1px;
        border-top: 1px solid rgba(255, 215, 0, 0.4);
        pointer-events: none;
    }

    .coin-icon {
        width: 24px;
        height: 24px;
        fill: var(--gold-highlight);
        filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
    }

    .currency-amount {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-highlight);
        letter-spacing: 0.05em;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        transform: skewX(5deg); /* Counter-skew text */
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        margin-bottom: 2rem;
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 4.5rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        margin-bottom: 0.2rem;
        background: linear-gradient(to bottom, var(--gold-highlight) 0%, var(--gold-primary) 40%, var(--gold-shadow) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));
        position: relative;
        z-index: 2;
    }

    .game-subtitle {
        font-family: var(--font-body);
        font-size: 0.85rem;
        color: var(--text-muted);
        letter-spacing: 0.6em;
        text-transform: uppercase;
        margin-bottom: 2rem;
        opacity: 0.8;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* 1. Portal Effect Container */
    .portal-container {
        position: relative;
        width: 160px;
        height: 160px;
        margin-bottom: 1.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
    }

    /* Central Glow */
    .portal-core {
        position: absolute;
        width: 60px;
        height: 60px;
        background: radial-gradient(circle, var(--magic-cyan) 0%, rgba(0, 240, 255, 0) 70%);
        border-radius: 50%;
        filter: blur(8px);
        animation: breathe 4s infinite ease-in-out;
        z-index: 1;
    }

    /* Concentric Dashed Rings */
    .ring {
        position: absolute;
        border-radius: 50%;
        border-style: dashed;
        border-color: rgba(0, 240, 255, 0.4);
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .ring-1 {
        width: 80px; height: 80px;
        border-width: 2px;
        animation: spin 12s linear infinite;
    }

    .ring-2 {
        width: 120px; height: 120px;
        border-width: 1px;
        border-color: rgba(157, 0, 255, 0.3);
        animation: spin-reverse 20s linear infinite;
    }

    .ring-3 {
        width: 160px; height: 160px;
        border-width: 1px;
        border-color: rgba(255, 255, 255, 0.1);
        border-style: dotted;
        animation: spin 40s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.2); opacity: 1; } }

    /* --- 3. Standardized Menu Grid --- */
    .menu-grid {
        display: grid;
        /* Grid: 2 columns for secondary items, 1 large column for Summon */
        grid-template-columns: 1.5fr 1fr 1fr; 
        grid-template-rows: 1fr 1fr;
        gap: 1.5rem;
        width: 100%;
        height: 320px; 
    }

    /* 3. Master Card Template */
    .menu-card {
        background: rgba(15, 15, 25, 0.5);
        backdrop-filter: blur(10px);
        /* Unified Border */
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        border-left: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px; /* Slightly sharper corners */
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .menu-card:hover {
        transform: translateY(-2px);
        background: rgba(25, 25, 40, 0.6);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }

    /* Typography & Icons Standardization */
    .card-label {
        font-family: var(--font-heading);
        font-size: 1.1rem; /* Unified size */
        color: var(--text-main);
        letter-spacing: 0.1em;
        font-weight: 600;
        text-transform: uppercase;
        z-index: 2;
    }

    .card-icon {
        width: 48px;
        height: 48px;
        stroke: var(--text-muted);
        stroke-width: 1.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: all 0.3s ease;
        z-index: 2;
    }

    .menu-card:hover .card-icon {
        stroke: var(--text-main);
        filter: drop-shadow(0 0 4px rgba(255,255,255,0.3));
    }

    /* --- 4. Visual Hierarchy: The Summon Card --- */
    .menu-card.summon {
        grid-column: 1 / 2;
        grid-row: 1 / 3;
        /* Distinctive Gold Styling */
        background: linear-gradient(160deg, rgba(40, 30, 15, 0.6), rgba(15, 15, 25, 0.8));
        border: 1px solid var(--gold-primary);
        box-shadow: 0 0 20px rgba(197, 160, 89, 0.05);
    }

    /* Remove unique corner accents (per critique) - replaced by border glow */
    .menu-card.summon:hover {
        border-color: var(--gold-highlight);
        box-shadow: 0 0 30px rgba(197, 160, 89, 0.15);
    }

    .menu-card.summon .card-icon {
        stroke: var(--gold-primary);
        width: 64px; /* Larger icon */
        height: 64px;
    }
    
    .menu-card.summon .card-label {
        color: var(--gold-highlight);
        font-size: 1.2rem;
        margin-top: 0.5rem;
    }

    /* Subtle Pulse behind Summon Icon */
    .summon-pulse {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 100px; height: 100px;
        background: radial-gradient(circle, rgba(197, 160, 89, 0.1) 0%, transparent 70%);
        border-radius: 50%;
        animation: breathe 3s infinite ease-in-out;
        z-index: 1;
    }

    /* Grid positioning for secondary buttons */
    .menu-card.roster { grid-column: 2 / 3; grid-row: 1 / 2; }
    .menu-card.battle { grid-column: 3 / 4; grid-row: 1 / 2; }
    .menu-card.grind  { grid-column: 2 / 4; grid-row: 2 / 3; } /* Wide bottom card */

    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.7rem;
        opacity: 0.4;
        letter-spacing: 0.15em;
        margin-top: auto;
        padding-bottom: 1rem;
        text-transform: uppercase;
    }

    /* --- Responsive --- */
    @media (max-width: 850px) {
        .app-container { padding: 1.5rem; }
        .game-title { font-size: 3rem; }
        
        .menu-grid {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto;
            height: auto;
            gap: 1rem;
        }

        .menu-card.summon {
            grid-column: 1 / -1;
            grid-row: auto;
            flex-direction: row;
            justify-content: flex-start;
            padding: 1.5rem 2rem;
        }
        
        .menu-card.summon .card-label { margin-left: 1rem; margin-top: 0; }
        .menu-card.summon .summon-pulse { display: none; }
        
        .menu-card { min-height: 100px; }
        .menu-card.grind { grid-column: 1 / -1; }
    }
</style>
</head>
<body>

    <!-- Background Layers -->
    <div class="background-layer"></div>
    <div class="noise-overlay"></div>
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-bar">
                <!-- Distinct Coin Icon -->
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-12.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V3H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.86 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V21h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero Section -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <!-- 1. Complex Portal Effect -->
            <div class="portal-container">
                <div class="portal-core"></div>
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon (Dominant) -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <div class="summon-pulse"></div>
                <!-- 5. Standardized Refined Line-Art Icon -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" />
                </svg>
                <span class="card-label">Summon</span>
            </div>

            <!-- Roster -->
            <div class="menu-card roster" onclick="interact('Roster')">
                <!-- Shield Glyph (Standardized) -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                </svg>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card battle" onclick="interact('Battle')">
                <!-- Sword Glyph (Standardized) -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5" />
                    <path d="M13 19l6-6" />
                    <path d="M16 16l4 4" />
                    <path d="M19 21l2-2" />
                </svg>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card grind" onclick="interact('Grind')">
                <!-- Cycle Glyph (Standardized) -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M21 12a9 9 0 1 1-9-9" />
                    <path d="M21 3v5h-5" />
                </svg>
                <span class="card-label">Grind</span>
            </div>
        </nav>

        <footer>
            Aetherbound v1.2.0 &bull; System Ready
        </footer>
    </div>

<script>
    // --- Background Particle System (Dust/Ash) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.15; 
            this.vy = (Math.random() - 0.5) * 0.15;
            this.size = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.4;
            this.color = Math.random() > 0.8 ? '197, 160, 89' : '255, 255, 255'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            this.alpha += (Math.random() - 0.5) * 0.01;
            if(this.alpha < 0.1) this.alpha = 0.1;
            if(this.alpha > 0.5) this.alpha = 0.5;

            if (this.x < 0) this.x = width;
            if (this.x > width) this.x = 0;
            if (this.y < 0) this.y = height;
            if (this.y > height) this.y = 0;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 18000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.98)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
