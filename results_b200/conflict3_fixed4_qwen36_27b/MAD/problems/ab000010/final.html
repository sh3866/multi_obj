<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Life: Nebula</title>
<style>
  :root {
    --bg-color: #050508;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --accent-primary: #06b6d4; /* Cyan */
    --accent-secondary: #8b5cf6; /* Violet */
    --glass-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.15);
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  /* Canvas Layer */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Layer */
  #ui-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3rem;
  }

  /* Header */
  .header {
    pointer-events: auto;
    position: absolute;
    top: 3rem;
    left: 3rem;
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #fff;
    margin-bottom: 0.5rem;
    opacity: 0.9;
  }

  .subtitle {
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 500;
  }
  
  /* Control Panel - Glassmorphism */
  .panel {
    pointer-events: auto;
    width: 320px;
    /* Glass Effect */
    background: var(--glass-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight);
    border-radius: 20px;
    padding: 1.5rem;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    align-self: flex-start;
    margin-bottom: 1rem;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .panel:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.12);
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .panel-label {
    font-size: 0.6rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    display: flex;
    justify-content: space-between;
  }

  /* Stats */
  .stats-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .stat-group {
    display: flex;
    flex-direction: column;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: 600;
    color: #fff;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  
  .stat-value.highlight {
    color: var(--accent-primary); 
  }

  /* Sliders - Refined */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
    transition: background 0.2s;
  }
  input[type=range]:hover {
    background: rgba(255,255,255,0.2);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
    transition: transform 0.1s, box-shadow 0.1s;
    margin-top: -5px;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.1);
    box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.15);
  }

  /* Buttons - Ghost / Outline Style */
  .controls-grid {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.75rem;
    align-items: center;
  }

  button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-main);
    border-radius: 10px;
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: var(--font-stack);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  button:hover {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.4);
    color: #fff;
  }
  
  button:active {
    transform: translateY(1px);
  }

  /* Primary Action - Ghost Style */
  button.primary {
    border-color: var(--accent-primary);
    color: var(--accent-primary);
    padding: 0.75rem 1.25rem;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.6rem;
  }
  
  button.primary:hover {
    background: rgba(6, 182, 212, 0.1); /* Subtle tint */
    border-color: var(--accent-primary);
    box-shadow: 0 0 15px rgba(6, 182, 212, 0.15);
  }

  /* Secondary Actions */
  .secondary-actions {
    display: flex;
    gap: 0.5rem;
  }

  button.secondary {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0;
    border: 1px solid rgba(255,255,255,0.1);
  }
  
  button.secondary:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.3);
    color: #fff;
  }

  button.secondary svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  /* Legend */
  .legend {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.6rem;
    color: var(--text-muted);
    margin-top: 0.25rem;
  }
  
  .gradient-bar {
    flex-grow: 1;
    height: 4px;
    border-radius: 2px;
    /* Cyan -> Purple -> Magenta -> Gold */
    background: linear-gradient(90deg, #06b6d4 0%, #8b5cf6 35%, #ec4899 65%, #f59e0b 100%);
    box-shadow: 0 0 8px rgba(255,255,255,0.1);
  }
  
  .legend span {
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-size: 0.55rem;
    opacity: 0.7;
  }

</style>
</head>
<body>

  <!-- Canvas -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Header -->
    <div class="header">
      <h1>Spherical Life</h1>
      <div class="subtitle">High-Density Simulation</div>
    </div>

    <!-- Control Panel -->
    <div class="panel">
      
      <!-- Stats -->
      <div class="panel-section" style="margin-bottom: 0.25rem;">
        <div class="stats-container">
          <div class="stat-group">
            <span class="panel-label">Generation</span>
            <span class="stat-value highlight" id="gen-count">0</span>
          </div>
          <div class="stat-group" style="text-align: right;">
            <span class="panel-label">Population</span>
            <span class="stat-value" id="pop-count">0</span>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="panel-section">
        <div class="panel-label">
          <span>Simulation Speed</span>
          <span id="speed-val" style="color: #fff;">50%</span>
        </div>
        <input type="range" id="speed-slider" min="1" max="100" value="50">
      </div>

      <!-- Buttons -->
      <div class="controls-grid">
        <button id="btn-pause" class="primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>
          <span>Pause</span>
        </button>
        
        <div class="secondary-actions">
          <button id="btn-step" class="secondary" title="Step Once">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button id="btn-reset" class="secondary" title="Randomize Grid">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          </button>
        </div>
      </div>

      <!-- Legend -->
      <div class="panel-section">
        <span class="panel-label">Cell Age Spectrum</span>
        <div class="legend">
          <span>New</span>
          <div class="gradient-bar"></div>
          <span>Elder</span>
        </div>
      </div>
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life - Visual Revision
 * Focus: High Density, Multi-hue coloring, Clean UI
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 4000, // High density
  sphereRadius: 300,
  cellSize: 2.5, // Base size for active cells
  rotationSpeed: 0.0005,
  // Colors: Cyan (New) -> Purple -> Magenta -> Gold (Elder)
  colors: {
    bg: '#050508',
    c1: { r: 6, g: 182, b: 212 },  // Cyan
    c2: { r: 139, g: 92, b: 246 }, // Purple
    c3: { r: 236, g: 72, b: 153 }, // Magenta
    c4: { r: 245, g: 158, b: 11 }  // Gold
  }
};

// --- State ---
let state = {
  cells: [], 
  generation: 0,
  isRunning: true,
  speed: 50, 
  lastFrameTime: 0,
  rotation: { x: 0.2, y: 0 }, 
  zoom: 1,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  distSq: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return dx*dx + dy*dy + dz*dz;
  }
};

// --- Game Logic ---

function initGame() {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  const r = CONFIG.sphereRadius;
  
  // 1. Generate Points (Fibonacci Lattice)
  for (let i = 0; i < CONFIG.cellCount; i++) {
    const y = 1 - (i / (CONFIG.cellCount - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y); 
    const theta = goldenAngle * i; 
    
    points.push({
      x: Math.cos(theta) * radiusAtY * r,
      y: y * r,
      z: Math.sin(theta) * radiusAtY * r
    });
  }

  // 2. Build Graph (Spatial Hashing optimization could be used, but O(N^2) is acceptable for 4k cells once)
  const surfaceArea = 4 * Math.PI * r * r;
  const avgArea = surfaceArea / CONFIG.cellCount;
  // Neighbor distance threshold
  const neighborDistSq = avgArea * 1.8; 

  state.cells = points.map((p, i) => {
    const neighbors = [];
    
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      if (Vec3.distSq(p, points[j]) < neighborDistSq) {
        neighbors.push(j);
      }
    }
    
    // Sort and trim to keep topology manageable
    if (neighbors.length > 8) {
      neighbors.sort((a, b) => Vec3.distSq(p, points[a]) - Vec3.distSq(p, points[b]));
      neighbors.splice(7); 
    }

    return {
      pos: p,
      idx: i,
      neighbors: neighbors,
      alive: Math.random() > 0.5, // Higher initial density
      age: 0,
      neighborCount: 0
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  const nextAlive = new Uint8Array(CONFIG.cellCount);
  const nextAge = new Int16Array(CONFIG.cellCount);
  
  // 1. Count neighbors
  for (let i = 0; i < CONFIG.cellCount; i++) {
    let count = 0;
    const nList = state.cells[i].neighbors;
    for (let k = 0; k < nList.length; k++) {
      if (state.cells[nList[k]].alive) count++;
    }
    state.cells[i].neighborCount = count;
  }

  // 2. Apply Rules
  for (let i = 0; i < CONFIG.cellCount; i++) {
    const cell = state.cells[i];
    const n = cell.neighborCount;
    
    let isAlive = false;
    if (cell.alive) {
      if (n === 2 || n === 3) isAlive = true;
    } else {
      if (n === 3) isAlive = true;
    }

    nextAlive[i] = isAlive ? 1 : 0;
    
    if (isAlive) {
      nextAge[i] = cell.alive ? cell.age + 1 : 0;
    } else {
      nextAge[i] = 0;
    }
  }

  // 3. Commit
  for (let i = 0; i < CONFIG.cellCount; i++) {
    state.cells[i].alive = nextAlive[i] === 1;
    state.cells[i].age = nextAge[i];
  }

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 1200 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function lerpColor(c1, c2, t) {
  return {
    r: Math.floor(c1.r + (c2.r - c1.r) * t),
    g: Math.floor(c1.g + (c2.g - c1.g) * t),
    b: Math.floor(c1.b + (c2.b - c1.b) * t)
  };
}

function getCellColor(age) {
  // Age mapping:
  // 0-10: Cyan -> Purple
  // 10-30: Purple -> Magenta
  // 30+: Magenta -> Gold
  
  let c1, c2, t;

  if (age < 10) {
    c1 = CONFIG.colors.c1;
    c2 = CONFIG.colors.c2;
    t = age / 10;
  } else if (age < 30) {
    c1 = CONFIG.colors.c2;
    c2 = CONFIG.colors.c3;
    t = (age - 10) / 20;
  } else {
    c1 = CONFIG.colors.c3;
    c2 = CONFIG.colors.c4;
    t = Math.min(1, (age - 30) / 30);
  }

  const col = lerpColor(c1, c2, t);
  return `rgb(${col.r},${col.g},${col.b})`;
}

function draw() {
  // Clear background
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0, 0, width, height);

  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;

  // --- Atmosphere Glow ---
  const grad = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 1.8);
  grad.addColorStop(0, 'rgba(139, 92, 246, 0.08)'); // Purple glow
  grad.addColorStop(0.5, 'rgba(6, 182, 212, 0.02)'); // Cyan fade
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.8, 0, Math.PI * 2);
  ctx.fill();

  // Pre-project
  const projectedCells = [];
  for(let i=0; i<CONFIG.cellCount; i++) {
    const cell = state.cells[i];
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    projectedCells.push({ cell, proj });
  }
  
  // Sort by Z (Painter's Algorithm)
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // Draw Cells
  for (let i = 0; i < projectedCells.length; i++) {
    const { cell, proj } = projectedCells[i];
    
    const isBack = proj.z > 0;
    const size = CONFIG.cellSize * proj.scale;
    
    if (cell.alive) {
      const colorStr = getCellColor(cell.age);
      
      // Depth Fade
      ctx.globalAlpha = isBack ? 0.15 : 0.9;
      
      // Glow for newborns
      if (cell.age < 2 && !isBack) {
         ctx.shadowBlur = 10;
         ctx.shadowColor = colorStr;
      } else {
         ctx.shadowBlur = 0;
      }

      ctx.fillStyle = colorStr;
      
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, Math.max(0.5, size), 0, Math.PI * 2);
      ctx.fill();

    } else {
      // Dead cells: Faint grid dots
      ctx.fillStyle = '#1e293b'; 
      ctx.globalAlpha = isBack ? 0.02 : 0.08;
      ctx.shadowBlur = 0;
      
      ctx.beginPath();
      // Dead cells are smaller dots
      ctx.arc(proj.x, proj.y, Math.max(0.5, size * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  
  ctx.globalAlpha = 1.0;
  ctx.shadowBlur = 0;
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    // Auto rotation
    state.rotation.y += CONFIG.rotationSpeed;
    
    // Update Logic
    // Throttle updates based on speed slider
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation;
  let pop = 0;
  for(let c of state.cells) if(c.alive) pop++;
  document.getElementById('pop-count').innerText = pop;
}

const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', (e) => {
  state.isRunning = !state.isRunning;
  const label = e.target.querySelector('span');
  const icon = e.target.querySelector('svg');
  
  if(!state.isRunning) {
     label.innerText = "Resume";
     icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
     // Ghost style active state handled by CSS hover/active mostly, 
     // but we can change border color via JS if needed.
     e.target.style.borderColor = 'rgba(255,255,255,0.3)';
     e.target.style.color = '#fff';
  } else {
     label.innerText = "Pause";
     icon.innerHTML = '<path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>';
     e.target.style.borderColor = 'var(--accent-primary)';
     e.target.style.color = 'var(--accent-primary)';
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  if(state.isRunning) {
    state.isRunning = false;
    // Update UI manually
    const label = btnPause.querySelector('span');
    const icon = btnPause.querySelector('svg');
    label.innerText = "Resume";
    icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    btnPause.style.borderColor = 'rgba(255,255,255,0.3)';
    btnPause.style.color = '#fff';
  }
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
  document.getElementById('speed-val').innerText = state.speed + '%';
});

// Mouse Drag
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(3, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
