<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Life Simulation</title>
<style>
  :root {
    --bg-color: #050508;
    --panel-bg: rgba(15, 15, 20, 0.65);
    --panel-border: rgba(255, 255, 255, 0.12);
    --accent-primary: #00f0ff; /* Electric Cyan */
    --accent-secondary: #ff0055; /* Magenta */
    --text-main: #ffffff;
    --text-muted: #94a3b8;
    --font-stack: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }

  body {
    background-color: var(--bg-color);
    background-image: radial-gradient(circle at 50% 50%, #12121a 0%, #050508 80%);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  /* Canvas Container */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Overlay */
  #ui-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 2.5rem;
  }

  /* Header */
  .header {
    position: absolute;
    top: 2.5rem;
    left: 2.5rem;
    pointer-events: auto;
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    color: white;
    text-shadow: 0 0 20px rgba(255,255,255,0.2);
  }

  .subtitle {
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* Control Panel - Glassmorphism */
  .panel {
    pointer-events: auto;
    width: 320px;
    background: var(--panel-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 1.75rem;
    box-shadow: 
      0 20px 40px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .panel-label {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 0.25rem;
    display: block;
  }

  /* Stats Typography */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 0.5rem;
  }
  
  .stat-group {
    display: flex;
    flex-direction: column;
  }

  .stat-value {
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--accent-primary);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
  }
  
  .stat-value.pop {
    color: #fff;
    text-shadow: none;
  }

  /* Sliders */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    outline: none;
    transition: background 0.2s;
  }
  input[type=range]:hover {
    background: rgba(255,255,255,0.15);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255,255,255,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
    margin-top: -1px; /* alignment fix */
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
    box-shadow: 0 0 15px rgba(255,255,255,0.6);
  }

  /* Buttons */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  
  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    padding: 0.85rem;
    border-radius: 10px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.3);
    transform: translateY(-1px);
  }
  
  button:active {
    transform: translateY(1px);
  }

  /* Primary Button */
  button.primary {
    background: rgba(0, 240, 255, 0.1);
    border: 1px solid var(--accent-primary);
    color: var(--accent-primary);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
  }
  button.primary:hover {
    background: var(--accent-primary);
    color: #000;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
  }
  
  /* Secondary Actions */
  button.secondary {
    border-color: rgba(255,255,255,0.15);
  }
  button.secondary:hover {
    border-color: rgba(255,255,255,0.4);
    color: #fff;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 2rem;
    left: 2.5rem;
    font-size: 0.7rem;
    color: var(--text-muted);
    opacity: 0.6;
    letter-spacing: 0.05em;
  }
  
  .legend {
    display: flex;
    gap: 1rem;
    margin-top: 0.5rem;
    font-size: 0.7rem;
    color: var(--text-muted);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.dead { background: #1e293b; border: 1px solid #334155; }
  .dot.alive { background: var(--accent-primary); box-shadow: 0 0 5px var(--accent-primary); }
  .dot.hot { background: var(--accent-secondary); box-shadow: 0 0 5px var(--accent-secondary); }

</style>
</head>
<body>

  <!-- Canvas for the Sphere -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Header -->
    <div class="header">
      <h1>Conway Sphere</h1>
      <div class="subtitle">Algorithmic Life in 3D Space</div>
    </div>

    <!-- Control Panel -->
    <div class="panel">
      <div class="panel-section">
        <span class="panel-label">Live Statistics</span>
        <div class="stat-row">
          <div class="stat-group">
            <span class="panel-label" style="margin:0">Generation</span>
            <span class="stat-value" id="gen-count">0</span>
          </div>
          <div class="stat-group" style="text-align: right;">
            <span class="panel-label" style="margin:0">Population</span>
            <span class="stat-value pop" id="pop-count">0</span>
          </div>
        </div>
      </div>

      <div class="panel-section">
        <span class="panel-label">Simulation Speed</span>
        <input type="range" id="speed-slider" min="1" max="60" value="30">
      </div>

      <div class="panel-section">
        <span class="panel-label">Visual Legend</span>
        <div class="legend">
          <div class="legend-item"><div class="dot dead"></div>Dead</div>
          <div class="legend-item"><div class="dot alive"></div>Active</div>
          <div class="legend-item"><div class="dot hot"></div>High Density</div>
        </div>
      </div>

      <div class="panel-section">
        <div class="btn-group">
          <button id="btn-pause" class="primary">Pause</button>
          <button id="btn-reset" class="secondary">Randomize</button>
        </div>
        <button id="btn-step" class="secondary">Step Once</button>
      </div>
    </div>

    <div class="footer">
      DRAG TO ROTATE &bull; SCROLL TO ZOOM
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life - REVISED
 * 
 * Design Changes:
 * 1. Increased Cell Count to 4000 for density.
 * 2. Heatmap Coloring: Indigo (Dead), Cyan (Alive), Magenta (High Density/Age).
 * 3. Glassmorphism UI applied.
 * 4. Optimized rendering loop.
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 4000, // Increased density
  sphereRadius: 280,
  cellSize: 2.8, // Smaller cells to maintain density
  rotationSpeed: 0.0015,
  colors: {
    bg: '#050508',
    dead: '#1e293b', // Deep Indigo/Slate
    alive: '#00f0ff', // Electric Cyan
    hot: '#ff0055'    // Hot Magenta
  }
};

// --- State ---
let state = {
  cells: [], 
  generation: 0,
  isRunning: true,
  speed: 30, 
  lastFrameTime: 0,
  rotation: { x: 0.2, y: 0 }, // Slight tilt
  zoom: 1,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  distSq: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return dx*dx + dy*dy + dz*dz;
  },
  normalize: (v) => {
    const l = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z);
    return l > 0 ? { x: v.x/l, y: v.y/l, z: v.z/l } : {x:0,y:0,z:0};
  }
};

// --- Game Logic ---

function initGame() {
  // 1. Generate Points (Fibonacci Lattice)
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  const r = CONFIG.sphereRadius;
  
  for (let i = 0; i < CONFIG.cellCount; i++) {
    const y = 1 - (i / (CONFIG.cellCount - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y); 
    const theta = goldenAngle * i; 
    
    points.push({
      x: Math.cos(theta) * radiusAtY * r,
      y: y * r,
      z: Math.sin(theta) * radiusAtY * r
    });
  }

  // 2. Build Graph (Find Neighbors)
  // We use a distance threshold based on sphere surface area / count
  // Approximate cell area = 4*pi*r^2 / N. Radius of influence ~ sqrt(Area)
  const surfaceArea = 4 * Math.PI * r * r;
  const avgArea = surfaceArea / CONFIG.cellCount;
  const neighborDistSq = avgArea * 1.5; // Search radius squared

  state.cells = points.map((p, i) => {
    const neighbors = [];
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      if (Vec3.distSq(p, points[j]) < neighborDistSq) {
        neighbors.push(j);
      }
    }
    
    // Limit neighbors to ~6-8 closest for "Hexagonal" behavior if too many found
    if (neighbors.length > 10) {
      neighbors.sort((a, b) => Vec3.distSq(p, points[a]) - Vec3.distSq(p, points[b]));
      neighbors.splice(8);
    }

    return {
      pos: p,
      idx: i,
      neighbors: neighbors,
      alive: Math.random() > 0.75, // 25% density
      age: 0,
      neighborCount: 0 // Cache
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  // Calculate neighbor counts first to avoid race conditions
  const nextAlive = new Uint8Array(CONFIG.cellCount); // 0 or 1
  const nextAge = new Int16Array(CONFIG.cellCount);
  
  // Pre-calculate neighbor counts for current generation
  for (let i = 0; i < CONFIG.cellCount; i++) {
    let count = 0;
    for (let k = 0; k < state.cells[i].neighbors.length; k++) {
      if (state.cells[state.cells[i].neighbors[k]].alive) count++;
    }
    state.cells[i].neighborCount = count;
  }

  // Apply Rules
  for (let i = 0; i < CONFIG.cellCount; i++) {
    const cell = state.cells[i];
    const n = cell.neighborCount;
    
    // Conway's Rules:
    // 1. Underpopulation: < 2 -> dies
    // 2. Survival: 2 or 3 -> lives
    // 3. Overpopulation: > 3 -> dies
    // 4. Reproduction: 3 -> born
    
    let isAlive = false;
    if (cell.alive) {
      if (n === 2 || n === 3) isAlive = true;
    } else {
      if (n === 3) isAlive = true;
    }

    nextAlive[i] = isAlive ? 1 : 0;
    
    if (isAlive) {
      nextAge[i] = cell.alive ? cell.age + 1 : 0;
    } else {
      nextAge[i] = 0;
    }
  }

  // Commit state
  for (let i = 0; i < CONFIG.cellCount; i++) {
    state.cells[i].alive = nextAlive[i] === 1;
    state.cells[i].age = nextAge[i];
  }

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 900 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // Clear with slight trail for motion blur effect (very subtle)
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0, 0, width, height);

  // Pre-project all cells
  const projectedCells = [];
  for(let i=0; i<CONFIG.cellCount; i++) {
    const cell = state.cells[i];
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    projectedCells.push({ cell, proj });
  }
  
  // Sort by Z (Painter's Algorithm)
  // We only need to sort if we use transparency, but for solid circles, 
  // back-to-front helps with depth perception if we add lighting.
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // Draw Sphere Atmosphere (Glow)
  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;
  
  // Outer Glow
  const grad = ctx.createRadialGradient(cx, cy, r * 0.8, cx, cy, r * 1.3);
  grad.addColorStop(0, 'rgba(0, 240, 255, 0)');
  grad.addColorStop(0.7, 'rgba(0, 240, 255, 0.03)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.3, 0, Math.PI * 2);
  ctx.fill();

  // Draw Cells
  // Optimization: Batch drawing by color? 
  // Since colors are dynamic per cell (age), we must draw individually or use complex logic.
  // Given 4000 cells, simple loops are usually fine on modern hardware if we don't use heavy shadowBlur per cell.
  
  // We will use a single global shadowBlur for performance, or none if too heavy.
  // Let's skip shadowBlur per cell for 4000 count to ensure 60fps. 
  // We'll use color intensity for "glow".

  for (let i = 0; i < projectedCells.length; i++) {
    const { cell, proj } = projectedCells[i];
    
    // Cull back faces (optional, but looks cleaner for "solid" sphere)
    // However, seeing through adds to the "ethereal" vibe. Let's keep all but dim back ones.
    const isBack = proj.z > 0;
    
    const size = CONFIG.cellSize * proj.scale;
    
    if (cell.alive) {
      // Heatmap Logic
      // Age 0-5: Cyan
      // Age 6+: Magenta/Hot
      
      if (cell.age < 5) {
        // Cyan
        ctx.fillStyle = CONFIG.colors.alive;
      } else {
        // Hot Magenta (High Density/Old)
        ctx.fillStyle = CONFIG.colors.hot;
      }
      
      // Simple lighting: brighter if facing camera
      // z is negative in front. range roughly -R to R.
      // Normalize to 0.5 (back) to 1.0 (front)
      // Note: proj.z is perspective depth, roughly correlates with surface normal dot view
      
      ctx.globalAlpha = isBack ? 0.4 : 0.9;
      
    } else {
      // Dead cells: Deep Indigo
      ctx.fillStyle = CONFIG.colors.dead;
      ctx.globalAlpha = isBack ? 0.1 : 0.4; // Faint grid
    }
    
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, Math.max(0.5, size), 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.globalAlpha = 1.0;
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    // Auto rotation
    state.rotation.y += CONFIG.rotationSpeed;
    
    // Update Logic based on speed
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation;
  // Count population (expensive? No, simple loop)
  let pop = 0;
  for(let c of state.cells) if(c.alive) pop++;
  document.getElementById('pop-count').innerText = pop;
}

// Controls
const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', (e) => {
  state.isRunning = !state.isRunning;
  e.target.innerText = state.isRunning ? "Pause" : "Resume";
  // Toggle styling if needed, but keeping it simple with primary class logic
  if(!state.isRunning) {
     e.target.classList.remove('primary');
     e.target.classList.add('secondary');
  } else {
     e.target.classList.remove('secondary');
     e.target.classList.add('primary');
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  btnPause.innerText = "Resume";
  btnPause.classList.remove('primary');
  btnPause.classList.add('secondary');
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
});

// Mouse Drag Rotation
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(3, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
