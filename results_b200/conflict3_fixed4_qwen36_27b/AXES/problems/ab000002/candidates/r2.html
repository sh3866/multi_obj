<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcane Architect</title>
<style>
    :root {
        /* Palette: Deep Void & Electric Violet */
        --bg-deep: #050508;
        --bg-panel: rgba(10, 12, 18, 0.7);
        
        --accent-primary: #b026ff; /* Electric Violet */
        --accent-glow: rgba(176, 38, 255, 0.6);
        --accent-dim: rgba(176, 38, 255, 0.1);
        
        --text-main: #eef2ff;
        --text-muted: #94a3b8;
        
        --font-display: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-display);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background --- */
    .bg-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: 
            radial-gradient(circle at 50% 50%, rgba(20, 20, 40, 0.5) 0%, var(--bg-deep) 100%),
            linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 40%),
            repeating-linear-gradient(90deg, transparent 0px, transparent 1px, rgba(255,255,255,0.01) 2px, transparent 3px);
        z-index: -1;
    }

    /* --- Header --- */
    header {
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 10;
        background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
    }

    h1 {
        font-weight: 800;
        font-size: 1.4rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 0 20px var(--accent-glow);
        margin: 0;
        text-align: center;
    }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
    }

    /* --- Sidebar --- */
    aside {
        width: 280px;
        background: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 100%);
        border-right: 1px solid rgba(176, 38, 255, 0.2);
        display: flex;
        flex-direction: column;
        padding: 40px 25px;
        z-index: 5;
        box-shadow: 10px 0 40px rgba(0,0,0,0.8);
        backdrop-filter: blur(5px);
    }

    .sidebar-content {
        display: flex;
        flex-direction: column;
        gap: 40px;
    }

    /* Typography & Hierarchy */
    .label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--text-muted);
        margin-bottom: 8px;
        display: block;
        font-weight: 700;
        text-shadow: 0 0 5px var(--accent-dim);
    }

    /* Level Section */
    .level-section {
        display: flex;
        align-items: center;
        gap: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .level-ring {
        width: 60px;
        height: 60px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .level-ring svg {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        transform: rotate(-90deg);
    }

    .level-ring circle {
        fill: none;
        stroke-width: 3;
        stroke-linecap: round;
    }

    .ring-bg { stroke: rgba(255,255,255,0.1); }
    .ring-fg { 
        stroke: var(--accent-primary); 
        stroke-dasharray: 175; /* 2 * PI * 28 */
        stroke-dashoffset: 50; /* 68% filled */
        filter: drop-shadow(0 0 5px var(--accent-primary));
    }

    .level-val {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--text-main);
        text-shadow: 0 0 10px var(--accent-glow);
    }

    .player-info h2 {
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-main);
        margin-bottom: 4px;
    }
    .player-info span {
        font-size: 0.8rem;
        color: var(--accent-primary);
        text-shadow: 0 0 8px var(--accent-dim);
    }

    /* Skill Points - Dynamic Orb */
    .sp-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
    }

    .sp-orb-container {
        position: relative;
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .sp-orb {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #d8b4fe, var(--accent-primary), #3b0764);
        box-shadow: 0 0 30px var(--accent-glow), inset 0 0 10px rgba(255,255,255,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: 800;
        color: #fff;
        animation: float 4s ease-in-out infinite;
        z-index: 2;
    }

    .sp-ring-anim {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 1px dashed var(--accent-primary);
        opacity: 0.5;
        animation: spin 15s linear infinite;
    }

    .sp-ring-anim::before {
        content: '';
        position: absolute;
        top: -5px; left: -5px; right: -5px; bottom: -5px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.1);
        animation: spin-reverse 10s linear infinite;
    }

    .sp-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--text-muted);
        text-align: center;
        text-shadow: 0 0 5px var(--accent-dim);
    }

    /* Stats - Hexagons */
    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        justify-items: center;
    }

    .stat-hex {
        position: relative;
        width: 70px;
        height: 70px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: transform 0.3s ease;
    }

    .stat-hex:hover {
        transform: scale(1.1);
    }

    .hex-bg {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        background: rgba(20, 25, 40, 0.6);
        border: 1px solid rgba(255,255,255,0.05);
        z-index: -1;
        transition: background 0.3s ease;
    }

    .stat-hex:hover .hex-bg {
        background: rgba(176, 38, 255, 0.2);
        border-color: var(--accent-primary);
    }

    .stat-val {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--text-main);
        text-shadow: 0 0 5px var(--accent-glow);
        margin-bottom: 2px;
    }

    .stat-name {
        font-size: 0.55rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-muted);
        opacity: 0.8;
    }

    /* --- Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, rgba(176, 38, 255, 0.03) 0%, transparent 60%);
    }
    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1400px;
        height: 1200px;
        transform-origin: center center;
        transition: transform 0.1s linear;
    }

    /* SVG Connections */
    svg.connections {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 0;
    }
    
    .connection-line {
        stroke: rgba(255,255,255,0.08);
        stroke-width: 2;
        fill: none;
        transition: all 0.5s ease;
    }
    
    .connection-line.active {
        stroke: var(--accent-primary);
        stroke-width: 3;
        filter: drop-shadow(0 0 6px var(--accent-primary));
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Hexagon Geometry for Nodes */
    .node-shape {
        width: 60px;
        height: 60px;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        background: #0f1115;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    .node-shape::before {
        content: '';
        position: absolute;
        inset: 2px;
        background: #0f1115;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        z-index: -1;
    }

    .node-shape.border {
        position: absolute;
        inset: -2px;
        background: #334155;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        z-index: -2;
        transition: background 0.3s ease;
    }

    .node-icon {
        width: 24px;
        height: 24px;
        fill: #475569;
        transition: fill 0.3s ease, filter 0.3s ease;
        filter: drop-shadow(0 0 0 transparent);
    }

    /* Sizes */
    .node.large .node-shape { width: 80px; height: 80px; }
    .node.large .node-icon { width: 32px; height: 32px; }
    .node.small .node-shape { width: 40px; height: 40px; }
    .node.small .node-icon { width: 16px; height: 16px; }

    /* States */
    .node.unlocked .node-shape::before {
        background: radial-gradient(circle at 30% 30%, rgba(176, 38, 255, 0.3), #1e1b2e);
    }
    .node.unlocked .border {
        background: var(--accent-primary);
        box-shadow: 0 0 15px var(--accent-glow);
    }
    .node.unlocked .node-icon { 
        fill: #fff; 
        filter: drop-shadow(0 0 5px var(--accent-primary));
    }

    .node.available .border {
        background: rgba(255,255,255,0.3);
        animation: pulse-border 2s infinite;
    }
    .node.available:hover .node-shape {
        transform: scale(1.1);
    }
    .node.available:hover .border {
        background: var(--text-main);
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(10, 12, 18, 0.95);
        border: 1px solid var(--accent-primary);
        padding: 20px;
        width: 280px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 20px rgba(176, 38, 255, 0.2);
        clip-path: polygon(0 0, 100% 0, 100% 85%, 90% 100%, 0 100%);
    }
    .tooltip.locked { 
        border-color: #334155; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .tooltip.visible { opacity: 1; transform: translateY(0); }

    .tooltip h3 {
        color: var(--text-main);
        font-size: 1.1rem;
        margin-bottom: 4px;
        font-weight: 700;
        letter-spacing: 0.05em;
    }
    .tooltip .type {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--accent-primary);
        margin-bottom: 12px;
        letter-spacing: 0.15em;
        font-weight: 700;
    }
    .tooltip.locked .type { color: var(--text-muted); }

    .tooltip p {
        font-size: 0.85rem;
        line-height: 1.5;
        color: #cbd5e1;
    }

    .tooltip .req {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(255,255,255,0.1);
        font-size: 0.75rem;
        color: #94a3b8;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    /* Animations */
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    @keyframes pulse-border {
        0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.2); }
        70% { box-shadow: 0 0 0 6px rgba(255,255,255,0); }
        100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }

</style>
</head>
<body>

    <div class="bg-overlay"></div>

    <header>
        <h1>Arcane Architect</h1>
    </header>

    <div class="main-layout">
        <aside>
            <div class="sidebar-content">
                <!-- Level & Identity -->
                <div class="level-section">
                    <div class="level-ring">
                        <svg viewBox="0 0 60 60">
                            <circle class="ring-bg" cx="30" cy="30" r="28"></circle>
                            <circle class="ring-fg" cx="30" cy="30" r="28"></circle>
                        </svg>
                        <span class="level-val">42</span>
                    </div>
                    <div class="player-info">
                        <h2>Kaelen Thorne</h2>
                        <span>Void Walker</span>
                    </div>
                </div>

                <!-- Dynamic Skill Points -->
                <div class="sp-section">
                    <div class="sp-orb-container">
                        <div class="sp-ring-anim"></div>
                        <div class="sp-orb">3</div>
                    </div>
                    <span class="sp-label">Available Points</span>
                </div>

                <!-- Hexagonal Stats -->
                <div>
                    <span class="label">Attributes</span>
                    <div class="stats-grid">
                        <div class="stat-hex">
                            <div class="hex-bg"></div>
                            <span class="stat-val">14</span>
                            <span class="stat-name">Str</span>
                        </div>
                        <div class="stat-hex">
                            <div class="hex-bg"></div>
                            <span class="stat-val">28</span>
                            <span class="stat-name">Dex</span>
                        </div>
                        <div class="stat-hex">
                            <div class="hex-bg"></div>
                            <span class="stat-val">35</span>
                            <span class="stat-name">Int</span>
                        </div>
                        <div class="stat-hex">
                            <div class="hex-bg"></div>
                            <span class="stat-val">12</span>
                            <span class="stat-name">Vit</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected by JS -->
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data: Complex Topology ---
    // Structure: Root -> Branches -> Interconnects -> Ultimate
    const skills = [
        // ROOT
        { id: 'root', x: 700, y: 1000, name: "Void Spark", type: "Origin", desc: "Ignites the core of your soul. +5% Damage.", unlocked: true, req: null, size: 'large' },
        
        // TIER 1 (Primary Paths)
        { id: 't1_left', x: 400, y: 850, name: "Kinetic Flow", type: "Passive", desc: "Movement restores energy.", unlocked: true, req: 'root', size: 'med' },
        { id: 't1_right', x: 1000, y: 850, name: "Mana Siphon", type: "Passive", desc: "Attacks restore mana.", unlocked: true, req: 'root', size: 'med' },
        { id: 't1_mid', x: 700, y: 850, name: "Arcane Shield", type: "Active", desc: "Absorb damage with magic.", unlocked: false, req: 'root', size: 'med' },

        // TIER 2 (Branching Out)
        { id: 't2_ll', x: 200, y: 700, name: "Phase Dash", type: "Active", desc: "Dash through enemies.", unlocked: false, req: 't1_left', size: 'med' },
        { id: 't2_lm', x: 400, y: 700, name: "Void Step", type: "Active", desc: "Teleport short distance.", unlocked: false, req: 't1_left', size: 'med' },
        
        { id: 't2_ml', x: 550, y: 700, name: "Shield Bash", type: "Active", desc: "Stun with shield.", unlocked: false, req: 't1_mid', size: 'med' },
        { id: 't2_mr', x: 850, y: 700, name: "Mana Burst", type: "Active", desc: "Explode shield for damage.", unlocked: false, req: 't1_mid', size: 'med' },

        { id: 't2_rl', x: 1000, y: 700, name: "Shadow Bolt", type: "Active", desc: "Ranged dark damage.", unlocked: false, req: 't1_right', size: 'med' },
        { id: 't2_rr', x: 1200, y: 700, name: "Drain Life", type: "Active", desc: "Steal health on hit.", unlocked: false, req: 't1_right', size: 'med' },

        // TIER 3 (Deep Specialization)
        { id: 't3_l', x: 100, y: 500, name: "Afterimage", type: "Passive", desc: "Leave a clone on dash.", unlocked: false, req: 't2_ll', size: 'small' },
        { id: 't3_lm', x: 300, y: 500, name: "Blink Strike", type: "Active", desc: "Teleport and attack.", unlocked: false, req: 't2_lm', size: 'small' },
        
        { id: 't3_m', x: 700, y: 500, name: "Prismatic Wall", type: "Ultimate", desc: "Create a massive barrier.", unlocked: false, req: 't2_mr', size: 'large' },
        
        { id: 't3_rm', x: 1100, y: 500, name: "Dark Ritual", type: "Active", desc: "Summon shadow minions.", unlocked: false, req: 't2_rl', size: 'small' },
        { id: 't3_r', x: 1300, y: 500, name: "Soul Harvest", type: "Passive", desc: "Kills grant massive XP.", unlocked: false, req: 't2_rr', size: 'small' },

        // TIER 4 (Capstones)
        { id: 't4_l', x: 200, y: 300, name: "Ghost Form", type: "Ultimate", desc: "Become invulnerable briefly.", unlocked: false, req: 't3_l', size: 'large' },
        { id: 't4_r', x: 1200, y: 300, name: "Death Pact", type: "Ultimate", desc: "Trade HP for infinite Mana.", unlocked: false, req: 't3_r', size: 'large' },

        // ULTIMATE CENTER
        { id: 'ult', x: 700, y: 150, name: "World Breaker", type: "Ascension", desc: "Unleash the full void upon the world.", unlocked: false, req: 't3_m', size: 'large', isUlt: true }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        Origin: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        Passive: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z",
        Active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        Ultimate: "M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z",
        Ascension: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"
    };

    // --- DOM ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Logic ---
    function init() {
        // Center Tree
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const ww = 1400;
        const wh = 1200;
        world.style.transform = `translate(${cw/2 - ww/2}px, ${ch/2 - wh/2}px)`;

        // Render Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            let stateClass = skill.unlocked ? 'unlocked' : 'locked';
            let iconPath = icons.Passive;
            
            // Icon Selection
            if(skill.type === 'Active') iconPath = icons.Active;
            if(skill.type === 'Origin') iconPath = icons.Origin;
            if(skill.type === 'Ultimate' || skill.type === 'Ascension') iconPath = icons.Ultimate;

            // Size Class
            if(skill.size === 'large') node.classList.add('large');
            if(skill.size === 'small') node.classList.add('small');
            if(skill.isUlt) node.classList.add('ultimate');

            // Availability Logic
            if (!skill.unlocked) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent && parent.unlocked) stateClass = 'available';
            }

            node.className = `node ${stateClass}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            node.innerHTML = `
                <div class="border"></div>
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));
            world.appendChild(node);
        });

        drawConnections();
    }

    function drawConnections() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    } else {
                        line.style.stroke = 'rgba(255,255,255,0.08)';
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'flex';
        }

        tooltip.classList.add('visible');
        
        // Smart positioning
        let left = e.clientX + 20;
        let top = e.clientY - 20;
        if (left + 300 > window.innerWidth) left = e.clientX - 320;
        if (top + 200 > window.innerHeight) top = window.innerHeight - 220;
        
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        if (!skill.unlocked) {
            const parent = skills.find(s => s.id === skill.req);
            if (parent && parent.unlocked) {
                skill.unlocked = true;
                updateVisuals();
            }
        }
    }

    function updateVisuals() {
        const nodes = document.querySelectorAll('.node');
        nodes.forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            // Reset classes
            el.className = 'node';
            if(s.size === 'large') el.classList.add('large');
            if(s.size === 'small') el.classList.add('small');
            if(s.isUlt) el.classList.add('ultimate');
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                el.classList.add('locked');
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) el.classList.add('available');
            }
        });
        drawConnections();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = container.clientWidth/2 - 700;
    let panY = container.clientHeight/2 - 600;
    let scale = 1;

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    init();

</script>
</body>
</html>
