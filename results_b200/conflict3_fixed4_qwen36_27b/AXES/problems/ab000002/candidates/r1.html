<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcane Architect</title>
<style>
    :root {
        /* Palette: Deep Void & Neon Magic */
        --bg-deep: #030407;
        --bg-panel: #090b10;
        
        --accent-primary: #00f2ff; /* Cyan Neon */
        --accent-secondary: #7000ff; /* Purple Neon */
        --accent-locked: #1e2530;
        
        --text-main: #e2e8f0;
        --text-muted: #64748b;
        
        --glow-primary: rgba(0, 242, 255, 0.5);
        --glow-secondary: rgba(112, 0, 255, 0.5);
        
        --font-display: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        --font-body: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background Texture --- */
    .bg-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: 
            radial-gradient(circle at 50% 50%, rgba(11, 14, 23, 0.4) 0%, var(--bg-deep) 100%),
            repeating-linear-gradient(0deg, transparent 0px, transparent 1px, rgba(255,255,255,0.02) 2px),
            url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        z-index: -1;
        pointer-events: none;
    }

    /* --- Header --- */
    header {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 10;
        background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    h1 {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 1.5rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 0 15px var(--glow-primary);
        margin: 0;
    }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
    }

    /* --- Sidebar (Consolidated & Unified) --- */
    aside {
        width: 300px;
        background: linear-gradient(135deg, rgba(9, 11, 16, 0.95) 0%, rgba(9, 11, 16, 0.8) 100%);
        border-right: 1px solid rgba(255,255,255,0.08);
        display: flex;
        flex-direction: column;
        padding: 40px 30px;
        z-index: 5;
        box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        /* Texture integration */
        background-image: 
            linear-gradient(135deg, rgba(9, 11, 16, 0.95) 0%, rgba(9, 11, 16, 0.8) 100%),
            url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        backdrop-filter: blur(10px);
    }

    .sidebar-content {
        display: flex;
        flex-direction: column;
        gap: 40px; /* Unified spacing */
    }

    /* Level Section */
    .level-section {
        display: flex;
        flex-direction: column;
        gap: 15px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding-bottom: 30px;
    }

    .level-badge {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .level-circle {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: 2px solid var(--accent-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--accent-primary);
        box-shadow: 0 0 15px var(--glow-primary), inset 0 0 10px var(--glow-primary);
        background: rgba(0,0,0,0.3);
    }

    .level-info h2 {
        font-size: 1.1rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-main);
    }
    .level-info span {
        font-size: 0.85rem;
        color: var(--text-muted);
    }

    .xp-bar-container {
        height: 6px;
        background: #1e293b;
        border-radius: 3px;
        overflow: hidden;
        position: relative;
    }
    .xp-bar-fill {
        width: 68%;
        height: 100%;
        background: var(--accent-primary);
        box-shadow: 0 0 10px var(--accent-primary);
        position: relative;
    }
    .xp-bar-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
        transform: translateX(-100%);
        animation: shimmer 2s infinite;
    }

    /* Skill Points (Unified Geometry) */
    .sp-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }
    
    .sp-circle {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(0, 242, 255, 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
    }
    .sp-circle::before {
        content: '';
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        border: 1px dashed rgba(0, 242, 255, 0.3);
        animation: spin 10s linear infinite;
    }
    .sp-value {
        font-size: 2rem;
        font-weight: 700;
        color: var(--accent-primary);
        text-shadow: 0 0 10px var(--glow-primary);
    }
    .sp-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-muted);
    }

    /* Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }
    .stat-item {
        background: rgba(255,255,255,0.03);
        padding: 10px;
        border-radius: 4px;
        border-left: 2px solid var(--accent-secondary);
    }
    .stat-name {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 4px;
    }
    .stat-val {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-main);
    }

    /* --- Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, rgba(112, 0, 255, 0.05) 0%, transparent 70%);
    }
    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1200px;
        height: 1000px;
        transform-origin: center center;
        transition: transform 0.1s linear;
    }

    /* SVG Connections */
    svg.connections {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 0;
    }
    .connection-line {
        stroke: rgba(255,255,255,0.1);
        stroke-width: 2;
        fill: none;
        transition: all 0.5s ease;
    }
    .connection-line.active {
        stroke: var(--accent-primary);
        filter: drop-shadow(0 0 4px var(--accent-primary));
        stroke-width: 3;
    }
    .connection-line.ultimate-path {
        stroke: var(--accent-secondary);
        stroke-dasharray: 5, 5;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Basic Node (Small Circle) */
    .node-shape {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: #0f1115;
        border: 2px solid #334155;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        transition: all 0.3s ease;
    }

    .node-icon {
        width: 20px;
        height: 20px;
        fill: #475569;
        transition: fill 0.3s ease;
    }

    /* Ultimate Node (Larger, Hexagonal-ish) */
    .node.ultimate .node-shape {
        width: 80px;
        height: 80px;
        border-radius: 20px; /* Squircle */
        transform: rotate(45deg);
        border-color: #4c1d95;
        background: #1e1b2e;
    }
    .node.ultimate .node-icon {
        transform: rotate(-45deg); /* Counter rotate icon */
        width: 30px;
        height: 30px;
    }

    /* States */
    .node.unlocked .node-shape {
        border-color: var(--accent-primary);
        background: radial-gradient(circle at 30% 30%, rgba(0, 242, 255, 0.2), #0f1115);
        box-shadow: 0 0 20px var(--glow-primary);
    }
    .node.unlocked .node-icon { fill: var(--accent-primary); }

    .node.ultimate.unlocked .node-shape {
        border-color: var(--accent-secondary);
        background: radial-gradient(circle at 30% 30%, rgba(112, 0, 255, 0.3), #1e1b2e);
        box-shadow: 0 0 30px var(--glow-secondary);
    }
    .node.ultimate.unlocked .node-icon { fill: var(--accent-secondary); }

    /* Locked / Available */
    .node.locked .node-shape {
        opacity: 0.6;
        border-color: #1e293b;
    }
    
    .node.available .node-shape {
        border-color: rgba(255,255,255,0.4);
        animation: pulse 2s infinite;
    }
    .node.available:hover .node-shape {
        transform: scale(1.15);
        border-color: var(--text-main);
        box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }
    .node.ultimate.available .node-shape {
        transform: rotate(45deg) scale(1.15);
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 20px;
        width: 300px;
        border-radius: 8px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border-left: 3px solid var(--accent-primary);
    }
    .tooltip.locked { border-left-color: var(--text-muted); }

    .tooltip.visible { opacity: 1; transform: translateY(0); }

    .tooltip h3 {
        color: var(--text-main);
        font-size: 1.2rem;
        margin-bottom: 5px;
        font-weight: 600;
    }
    .tooltip .type {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--accent-primary);
        margin-bottom: 12px;
        letter-spacing: 0.1em;
        font-weight: 700;
    }
    .tooltip.locked .type { color: var(--text-muted); }

    .tooltip p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #cbd5e1;
    }

    .tooltip .req {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(255,255,255,0.1);
        font-size: 0.8rem;
        color: #94a3b8;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .tooltip .req::before {
        content: '🔒';
        font-size: 0.8rem;
    }

    /* Animations */
    @keyframes shimmer { 100% { transform: translateX(100%); } }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.1); }
        70% { box-shadow: 0 0 0 10px rgba(255,255,255,0); }
        100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }

</style>
</head>
<body>

    <div class="bg-overlay"></div>

    <header>
        <h1>Arcane Architect</h1>
    </header>

    <div class="main-layout">
        <aside>
            <div class="sidebar-content">
                <!-- Level Block -->
                <div class="level-section">
                    <div class="level-badge">
                        <div class="level-circle">42</div>
                        <div class="level-info">
                            <h2>Kaelen Thorne</h2>
                            <span>Void Walker</span>
                        </div>
                    </div>
                    <div>
                        <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-muted); margin-bottom:5px;">
                            <span>XP Progress</span>
                            <span>12.4k / 18k</span>
                        </div>
                        <div class="xp-bar-container">
                            <div class="xp-bar-fill"></div>
                        </div>
                    </div>
                </div>

                <!-- Skill Points -->
                <div class="sp-section">
                    <div class="sp-circle">
                        <span class="sp-value">3</span>
                    </div>
                    <span class="sp-label">Available Points</span>
                </div>

                <!-- Stats -->
                <div>
                    <h4 style="color:var(--text-muted); text-transform:uppercase; font-size:0.75rem; letter-spacing:0.1em; margin-bottom:15px;">Attributes</h4>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-name">Strength</div>
                            <div class="stat-val">14</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-name">Dexterity</div>
                            <div class="stat-val">28</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-name">Intelligence</div>
                            <div class="stat-val">35</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-name">Vitality</div>
                            <div class="stat-val">12</div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected by JS -->
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data: Structured Topology (Bottom-Up / Center-Out) ---
    const skills = [
        // Root
        { id: 'root', x: 600, y: 850, name: "Void Spark", type: "Passive", desc: "Ignites the core of your soul. +5% Damage.", unlocked: true, req: null },
        
        // Tier 1 (Branching Left/Right)
        { id: 't1_left', x: 400, y: 700, name: "Kinetic Flow", type: "Passive", desc: "Movement restores energy.", unlocked: true, req: 'root' },
        { id: 't1_right', x: 800, y: 700, name: "Mana Siphon", type: "Passive", desc: "Attacks restore mana.", unlocked: true, req: 'root' },
        
        // Tier 2
        { id: 't2_left', x: 250, y: 550, name: "Phase Dash", type: "Active", desc: "Dash through enemies.", unlocked: true, req: 't1_left' },
        { id: 't2_mid', x: 600, y: 550, name: "Arcane Shield", type: "Active", desc: "Absorb damage with magic.", unlocked: false, req: 'root' }, // Branch directly from root
        { id: 't2_right', x: 950, y: 550, name: "Shadow Bolt", type: "Active", desc: "Ranged dark damage.", unlocked: false, req: 't1_right' },

        // Tier 3
        { id: 't3_left', x: 150, y: 400, name: "Afterimage", type: "Passive", desc: "Leave a clone on dash.", unlocked: false, req: 't2_left' },
        { id: 't3_mid', x: 600, y: 400, name: "Mana Burst", type: "Active", desc: "Explode shield for damage.", unlocked: false, req: 't2_mid' },
        { id: 't3_right', x: 1050, y: 400, name: "Dark Ritual", type: "Active", desc: "Summon shadow minions.", unlocked: false, req: 't2_right' },

        // Ultimate Capstone
        { id: 'ult', x: 600, y: 200, name: "World Breaker", type: "Ultimate", desc: "Unleash the full void.", unlocked: false, req: 't3_mid', isUlt: true }
    ];

    // --- Icons ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"
    };

    // --- DOM ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Logic ---
    function init() {
        // Center
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const ww = 1200;
        const wh = 1000;
        world.style.transform = `translate(${cw/2 - ww/2}px, ${ch/2 - wh/2}px)`;

        // Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            let stateClass = skill.unlocked ? 'unlocked' : 'locked';
            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') {
                iconPath = icons.ultimate;
                node.classList.add('ultimate');
            }

            // Check if available (parent unlocked)
            if (!skill.unlocked) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent && parent.unlocked) stateClass = 'available';
            }

            node.className = `node ${stateClass}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));
            world.appendChild(node);
        });

        drawConnections();
    }

    function drawConnections() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    // Style logic
                    if (skill.unlocked) {
                        line.classList.add('active');
                        if(skill.isUlt) line.classList.add('ultimate-path');
                    } else {
                        // Muted lines for locked
                        line.style.stroke = 'rgba(255,255,255,0.05)';
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'flex';
        }

        tooltip.classList.add('visible');
        tooltip.style.left = `${e.clientX + 20}px`;
        tooltip.style.top = `${e.clientY - 20}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        if (!skill.unlocked) {
            // Simulate unlock
            const parent = skills.find(s => s.id === skill.req);
            if (parent && parent.unlocked) {
                skill.unlocked = true;
                updateVisuals();
            }
        }
    }

    function updateVisuals() {
        // Update nodes
        const nodes = document.querySelectorAll('.node');
        nodes.forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            // Reset classes
            el.className = 'node';
            if(s.isUlt) el.classList.add('ultimate');
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                el.classList.add('locked');
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) el.classList.add('available');
            }
        });
        drawConnections();
    }

    // --- Pan & Zoom ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = container.clientWidth/2 - 600;
    let panY = container.clientHeight/2 - 500;
    let scale = 1;

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    init();

</script>
