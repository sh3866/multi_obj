<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcane Architect - Revised</title>
<style>
    :root {
        /* Palette: Deep Void & Electric Violet */
        --bg-deep: #050508;
        --bg-gradient-start: #161025;
        --bg-gradient-end: #0a0a12;
        
        --accent-primary: #a855f7; /* Violet */
        --accent-glow: rgba(168, 85, 247, 0.6);
        --accent-dim: rgba(168, 85, 247, 0.15);
        --accent-bright: #d8b4fe;
        
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-dark: #475569;
        --text-gold: #fbbf24;

        /* Typography */
        --font-stack: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background --- */
    .bg-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        background: radial-gradient(circle at 70% 40%, #1e1b4b 0%, var(--bg-deep) 60%);
    }
    
    canvas.constellation {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        opacity: 0.4;
        pointer-events: none;
    }

    /* --- Header --- */
    header {
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 10;
        background: linear-gradient(180deg, rgba(10,10,15,0.9) 0%, transparent 100%);
        border-bottom: 1px solid rgba(168, 85, 247, 0.1);
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    h1 {
        font-weight: 800;
        font-size: 1.1rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 0 10px var(--accent-glow);
    }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
    }

    /* --- Sidebar (Critique #1 & #2 Applied) --- */
    aside {
        width: 280px;
        /* Deep purple/blue gradient instead of flat black */
        background: linear-gradient(180deg, rgba(22, 16, 37, 0.95) 0%, rgba(10, 10, 18, 0.9) 100%);
        border-right: 1px solid rgba(168, 85, 247, 0.15);
        display: flex;
        flex-direction: column;
        padding: 30px 25px;
        z-index: 5;
        backdrop-filter: blur(16px);
        box-shadow: 5px 0 30px rgba(0,0,0,0.5);
    }

    .sidebar-content {
        display: flex;
        flex-direction: column;
        gap: 35px;
    }

    /* Typography Utilities */
    .label {
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-muted);
        margin-bottom: 10px;
        display: block;
        font-weight: 600;
    }

    /* Level Section */
    .level-section {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .level-header {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .level-ring {
        width: 56px;
        height: 56px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Glow effect on ring */
        filter: drop-shadow(0 0 5px var(--accent-glow));
    }

    .level-ring svg {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        transform: rotate(-90deg);
    }

    .level-ring circle {
        fill: none;
        stroke-width: 3;
        stroke-linecap: round;
    }

    .ring-bg { stroke: rgba(255,255,255,0.05); }
    .ring-fg { 
        stroke: var(--accent-primary); 
        stroke-dasharray: 150; 
        stroke-dashoffset: 40; 
    }

    .level-val {
        font-size: 1.4rem;
        font-weight: 700;
        z-index: 2;
        color: #fff;
    }

    .player-info {
        flex: 1;
        display: flex;
        flex-direction: column;
    }
    .player-info h2 {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin-bottom: 2px;
    }
    .player-info span.class-name {
        font-size: 0.75rem;
        color: var(--accent-bright);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
        margin-bottom: 6px;
    }

    /* XP Bar (Critique #1: Inserted here) */
    .xp-container {
        width: 100%;
    }
    .xp-track {
        width: 100%;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        position: relative;
        overflow: hidden;
    }
    .xp-fill {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 68%;
        background: linear-gradient(90deg, var(--accent-primary), var(--accent-bright));
        box-shadow: 0 0 10px var(--accent-primary);
    }
    .xp-text {
        display: flex;
        justify-content: space-between;
        font-size: 0.6rem;
        color: var(--text-muted);
        margin-top: 4px;
    }

    /* Skill Points - Orb */
    .sp-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
    }

    .sp-orb-container {
        position: relative;
        width: 90px;
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .sp-orb {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #2e1065, #0f0f14);
        border: 1px solid var(--accent-primary);
        box-shadow: 0 0 20px var(--accent-dim), inset 0 0 15px rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--accent-bright);
        z-index: 2;
        transition: all 0.3s ease;
        text-shadow: 0 0 5px var(--accent-primary);
    }
    
    .sp-orb:hover {
        box-shadow: 0 0 30px var(--accent-glow), inset 0 0 10px rgba(168, 85, 247, 0.3);
        transform: scale(1.05);
    }

    .sp-ring-anim {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 1px dashed rgba(168, 85, 247, 0.3);
        animation: spin 40s linear infinite;
    }

    /* Stats - List/Pill (Critique #1: Removed circles) */
    .stats-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding-top: 10px;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        background: rgba(255,255,255,0.03);
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.05);
        transition: all 0.2s ease;
    }
    
    .stat-row:hover {
        background: rgba(255,255,255,0.06);
        border-color: rgba(168, 85, 247, 0.2);
    }

    .stat-name {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
        letter-spacing: 0.05em;
    }

    .stat-val {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--text-main);
    }

    /* Dominant Stat Highlight */
    .stat-row.dominant {
        background: linear-gradient(90deg, rgba(168, 85, 247, 0.1), rgba(0,0,0,0));
        border-color: rgba(168, 85, 247, 0.3);
        padding-left: 16px;
    }
    .stat-row.dominant .stat-name { color: var(--accent-bright); }
    .stat-row.dominant .stat-val { color: #fff; text-shadow: 0 0 8px var(--accent-primary); }

    /* --- Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
    }
    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 0; left: 0;
        width: 1600px;
        height: 1400px;
        transform-origin: center center;
    }

    /* Connections (Critique #3: Distinct lines) */
    svg.connections {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 0;
    }
    
    .connection-line {
        stroke: rgba(255, 255, 255, 0.08);
        stroke-width: 2;
        fill: none;
        transition: all 0.5s ease;
    }
    
    /* Active Path Styling */
    .connection-line.active {
        stroke: var(--accent-primary);
        stroke-width: 2.5;
        filter: drop-shadow(0 0 5px var(--accent-primary));
        opacity: 0.9;
    }

    /* --- Nodes (Critique #4: Geometry & Scale) --- */
    .node {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .node-shape {
        width: 48px;
        height: 48px;
        background: #0f1014;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        transition: all 0.3s ease;
    }

    /* Shapes */
    /* Circle (Utility/Passive) */
    .node-shape.shape-circle { border-radius: 50%; }
    
    /* Hexagon (Defense) - CSS Clip Path */
    .node-shape.shape-hex {
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        background-color: #1a1a24; /* Clip path cuts border, so we use bg for border effect or inset */
        /* Simulating border with inset box-shadow on parent container or pseudo, 
           but simpler here to use background gradient */
        background: radial-gradient(circle, #2a2a35 0%, #0f1014 100%);
    }
    /* Fake border for hex */
    .node-shape.shape-hex::after {
        content: '';
        position: absolute;
        inset: 1px;
        background: #0f1014;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        z-index: -1;
    }

    /* Diamond (Offense) */
    .node-shape.shape-diamond {
        transform: rotate(45deg);
        border-radius: 4px;
    }
    .node-shape.shape-diamond svg {
        transform: rotate(-45deg); /* Counter rotate icon */
    }

    .node-icon {
        width: 20px;
        height: 20px;
        fill: var(--text-dark);
        transition: fill 0.3s ease;
    }

    /* Labels */
    .node-label {
        margin-top: 8px;
        font-size: 0.65rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        opacity: 0;
        transform: translateY(-5px);
        transition: all 0.3s ease;
        white-space: nowrap;
    }

    .node:hover .node-label, 
    .node.unlocked .node-label,
    .node.available .node-label {
        opacity: 1;
        transform: translateY(0);
    }

    /* Sizing & Selection Focus (Critique #4) */
    .node.large .node-shape { width: 64px; height: 64px; }
    .node.large .node-icon { width: 28px; height: 28px; }
    .node.large .node-label { font-size: 0.75rem; color: var(--text-main); }

    .node.small .node-shape { width: 36px; height: 36px; }
    .node.small .node-icon { width: 14px; height: 14px; }

    /* Selected Node Scale */
    .node.selected {
        transform: translate(-50%, -50%) scale(1.25);
        z-index: 10;
    }

    /* States */
    /* Unlocked (Active) */
    .node.unlocked .node-shape {
        background: radial-gradient(circle at 30% 30%, #3b0764, #000);
        border-color: var(--accent-primary);
        box-shadow: 0 0 15px var(--accent-glow);
    }
    .node.unlocked .node-shape.shape-hex {
        background: radial-gradient(circle, #581c87 0%, #000 100%);
    }
    .node.unlocked .node-icon { 
        fill: #fff; 
        filter: drop-shadow(0 0 3px var(--accent-primary));
    }

    /* Available (Next Step) */
    .node.available .node-shape {
        border-color: rgba(255,255,255,0.4);
        background: rgba(30, 30, 40, 0.9);
        box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }
    .node.available .node-shape.shape-hex {
        background: radial-gradient(circle, #334155 0%, #0f172a 100%);
    }
    .node.available:hover .node-shape {
        transform: scale(1.1);
        border-color: #fff;
        box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }
    .node.available .node-icon { fill: #fff; }

    /* Locked */
    .node.locked .node-shape {
        opacity: 0.4;
        border-color: rgba(255,255,255,0.05);
        background: #050508;
    }
    .node.locked .node-icon { opacity: 0.3; }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(10, 10, 15, 0.95);
        border: 1px solid var(--accent-primary);
        padding: 20px;
        width: 280px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        backdrop-filter: blur(12px);
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        border-radius: 4px;
    }
    .tooltip.locked { 
        border-color: #334155; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .tooltip.visible { opacity: 1; transform: translateY(0); }

    .tooltip h3 {
        color: var(--text-main);
        font-size: 1.1rem;
        margin-bottom: 4px;
        font-weight: 700;
        letter-spacing: 0.02em;
    }
    .tooltip .type {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--accent-primary);
        margin-bottom: 12px;
        letter-spacing: 0.15em;
        font-weight: 700;
    }
    .tooltip.locked .type { color: var(--text-muted); }

    .tooltip p {
        font-size: 0.85rem;
        line-height: 1.5;
        color: #cbd5e1;
    }

    .tooltip .req {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(255,255,255,0.1);
        font-size: 0.75rem;
        color: #94a3b8;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    /* Animations */
    @keyframes spin { 100% { transform: rotate(360deg); } }

</style>
</head>

                <div>
                    <span class="label">Attributes</span>
                    <div class="stats-list">

        <div class="tree-container" id="treeContainer">

    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>

        <div class="req" id="tt-req">Requires: [Previous Skill]</div>

<script>
    // --- Background Constellation Logic ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        drawConstellation();
    }
    
    function drawConstellation() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(168, 85, 247, 0.15)';
        ctx.lineWidth = 1;
        
        const stars = [];
        const numStars = 60;
        
        for(let i=0; i<numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5
            });
        }
        
        ctx.fillStyle = 'rgba(168, 85, 247, 0.5)';
        stars.forEach(star => {
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        
        for(let i=0; i<stars.length; i++) {
            for(let j=i+1; j<stars.length; j++) {
                const dx = stars[i].x - stars[j].x;
                const dy = stars[i].y - stars[j].y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if(dist < 100) {
                    ctx.beginPath();
                    ctx.moveTo(stars[i].x, stars[i].y);
                    ctx.lineTo(stars[j].x, stars[j].y);
                    ctx.stroke();
                }
            }
        }
    }
    
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- Data: Skills ---
    // Updated with 'shape' property
    const skills = [
        // ROOT
        { id: 'root', x: 800, y: 1100, name: "Void Spark", type: "Origin", desc: "Ignites the core of your soul. +5% Damage.", unlocked: true, req: null, size: 'large', shape: 'circle' },
        
        // TIER 1
        { id: 't1_left', x: 550, y: 900, name: "Kinetic Flow", type: "Passive", desc: "Movement restores energy.", unlocked: true, req: 'root', size: 'med', shape: 'circle' },
        { id: 't1_right', x: 1050, y: 900, name: "Mana Siphon", type: "Passive", desc: "Attacks restore mana.", unlocked: true, req: 'root', size: 'med', shape: 'circle' },
        { id: 't1_mid', x: 800, y: 900, name: "Arcane Shield", type: "Active", desc: "Absorb damage with magic.", unlocked: false, req: 'root', size: 'med', shape: 'hex' },

        // TIER 2
        { id: 't2_ll', x: 400, y: 700, name: "Phase Dash", type: "Active", desc: "Dash through enemies.", unlocked: false, req: 't1_left', size: 'med', shape: 'diamond' },
        { id: 't2_lm', x: 600, y: 700, name: "Void Step", type: "Active", desc: "Teleport short distance.", unlocked: false, req: 't1_left', size: 'med', shape: 'diamond' },
        
        { id: 't2_ml', x: 700, y: 700, name: "Shield Bash", type: "Active", desc: "Stun with shield.", unlocked: false, req: 't1_mid', size: 'med', shape: 'hex' },
        { id: 't2_mr', x: 900, y: 700, name: "Mana Burst", type: "Active", desc: "Explode shield for damage.", unlocked: false, req: 't1_mid', size: 'med', shape: 'diamond' },

        { id: 't2_rl', x: 1050, y: 700, name: "Shadow Bolt", type: "Active", desc: "Ranged dark damage.", unlocked: false, req: 't1_right', size: 'med', shape: 'diamond' },
        { id: 't2_rr', x: 1250, y: 700, name: "Drain Life", type: "Active", desc: "Steal health on hit.", unlocked: false, req: 't1_right', size: 'med', shape: 'circle' },

        // TIER 3
        { id: 't3_l', x: 300, y: 500, name: "Afterimage", type: "Passive", desc: "Leave a clone on dash.", unlocked: false, req: 't2_ll', size: 'small', shape: 'circle' },
        { id: 't3_lm', x: 500, y: 500, name: "Blink Strike", type: "Active", desc: "Teleport and attack.", unlocked: false, req: 't2_lm', size: 'small', shape: 'diamond' },
        
        { id: 't3_m', x: 800, y: 500, name: "Prismatic Wall", type: "Ultimate", desc: "Create a massive barrier.", unlocked: false, req: 't2_mr', size: 'large', shape: 'hex' },
        
        { id: 't3_rm', x: 1100, y: 500, name: "Dark Ritual", type: "Active", desc: "Summon shadow minions.", unlocked: false, req: 't2_rl', size: 'small', shape: 'circle' },
        { id: 't3_r', x: 1300, y: 500, name: "Soul Harvest", type: "Passive", desc: "Kills grant massive XP.", unlocked: false, req: 't2_rr', size: 'small', shape: 'circle' },

        // TIER 4

        { id: 't4_r', x: 1200, y: 300, name: "Death Pact", type: "Ultimate", desc: "Trade HP for infinite Mana.", unlocked: false, req: 't3_r', size: 'large', shape: 'diamond' },

        // ULTIMATE CENTER
        { id: 'ult', x: 800, y: 150, name: "World Breaker", type: "Ascension", desc: "Unleash the full void upon the world.", unlocked: false, req: 't3_m', size: 'large', isUlt: true, shape: 'circle' },
        
        // Filler nodes for density
        { id: 'fill1', x: 600, y: 500, name: "Void Affinity", type: "Passive", desc: "Increases void damage.", unlocked: false, req: 't2_lm', size: 'small', shape: 'circle' },
        { id: 'fill2', x: 1000, y: 500, name: "Siphon Mastery", type: "Passive", desc: "Increases siphon effect.", unlocked: false, req: 't2_rl', size: 'small', shape: 'circle' },
        { id: 'fill3', x: 700, y: 300, name: "Echoes", type: "Active", desc: "Project energy waves.", unlocked: false, req: 't3_m', size: 'small', shape: 'diamond' },
        { id: 'fill4', x: 900, y: 300, name: "Entropy", type: "Active", desc: "Decay enemy armor.", unlocked: false, req: 't3_m', size: 'small', shape: 'diamond' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        Origin: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        Passive: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z",
        Active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        Ultimate: "M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z",
        Ascension: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"
    };

    // --- DOM ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Logic ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const ww = 1600;
        const wh = 1400;
        
        // Initial Pan Position
        world.style.transform = `translate(${cw/2 - ww/2}px, ${ch/2 - wh/2}px)`;

        // Render Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            let stateClass = skill.unlocked ? 'unlocked' : 'locked';
            let iconPath = icons.Passive;
            
            // Icon Selection
            if(skill.type === 'Active') iconPath = icons.Active;
            if(skill.type === 'Origin') iconPath = icons.Origin;
            if(skill.type === 'Ultimate' || skill.type === 'Ascension') iconPath = icons.Ultimate;

            // Size Class
            if(skill.size === 'large') node.classList.add('large');
            if(skill.size === 'small') node.classList.add('small');
            if(skill.isUlt) node.classList.add('ultimate');

            // Availability Logic
            if (!skill.unlocked) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent && parent.unlocked) stateClass = 'available';
            }

            node.className = `node ${stateClass}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Structure: Shape + Icon + Label
            // Critique #4: Shape class applied
            node.innerHTML = `
                <div class="node-shape shape-${skill.shape}">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
                <div class="node-label">${skill.name}</div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));
            world.appendChild(node);
        });

        drawConnections();
        
        panX = cw/2 - ww/2;
        panY = ch/2 - wh/2;
    }

    function drawConnections() {
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    // Critique #3: Distinct lines for active path
                    if (skill.unlocked) {
                        line.classList.add('active');
                    } else {
                        line.classList.remove('active');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'flex';
        }

        tooltip.classList.add('visible');
        
        let left = e.clientX + 20;
        let top = e.clientY - 20;
        if (left + 300 > window.innerWidth) left = e.clientX - 310;
        if (top + 200 > window.innerHeight) top = window.innerHeight - 220;
        
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        if (!skill.unlocked) {
            const parent = skills.find(s => s.id === skill.req);
            if (parent && parent.unlocked) {
                skill.unlocked = true;
                updateVisuals();
            }
        } else {
            // Toggle selection visual
            document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
            const nodeEl = document.querySelector(`.node[data-id="${id}"]`);
            if(nodeEl) nodeEl.classList.add('selected');
        }
    }

    function updateVisuals() {
        const nodes = document.querySelectorAll('.node');
        nodes.forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            // Reset classes
            el.className = 'node';
            if(s.size === 'large') el.classList.add('large');
            if(s.size === 'small') el.classList.add('small');
            if(s.isUlt) el.classList.add('ultimate');
            
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                el.classList.add('locked');
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) el.classList.add('available');
            }
        });
        drawConnections();
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = 0;
    let panY = 0;
    let scale = 1;

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    init();

</script>
</body>
</html>
