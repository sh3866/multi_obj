<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Project: AETHER</title>
<style>
  :root {
    --bg-deep: #02040a;
    --bg-mid: #060b14;
    --accent-primary: #00f0ff;
    --accent-secondary: #7000ff;
    --accent-rare: #ff0055;
    --accent-gold: #ffd700;
    --accent-organic: #ccff00;
    --text-main: #ffffff;
    --text-dim: #6b7c93;
    --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-display: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-main);
    overflow: hidden;
  }

  /* --- Scene & Background --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 120%, #0d1b2a 0%, #050a14 50%, #000000 100%);
  }

  /* Depth Hierarchy: Background Mists */
  .mist-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: 
      radial-gradient(circle at 20% 30%, rgba(112, 0, 255, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 60%, rgba(0, 240, 255, 0.05) 0%, transparent 40%);
    z-index: 1;
    pointer-events: none;
    animation: pulseMist 10s ease-in-out infinite alternate;
  }

  @keyframes pulseMist {
    0% { opacity: 0.5; transform: scale(1); }
    100% { opacity: 1; transform: scale(1.05); }
  }

  /* Canvas Layer */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none; /* Hide default cursor */
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none; 
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* --- Header: Unified Chrome --- */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: auto;
    background: rgba(5, 10, 20, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(0, 240, 255, 0.15);
    border-radius: 0 0 24px 24px;
    padding: 1rem 2rem;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
  }

  .brand-group {
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 2.5rem;
    margin: 0;
    line-height: 1;
    letter-spacing: 0.05em;
    color: #fff;
    text-transform: uppercase;
    text-shadow: 0 0 15px rgba(0, 240, 255, 0.6), 0 0 30px rgba(0, 240, 255, 0.3);
  }

  .subtitle {
    font-family: var(--font-display);
    font-size: 0.7rem;
    color: var(--accent-primary);
    letter-spacing: 0.3em;
    opacity: 0.8;
    margin-top: 0.3rem;
    text-transform: uppercase;
  }

  /* HUD Stats & Collection Button */
  .hud-controls {
    display: flex;
    align-items: center;
    gap: 2rem;
  }

  .hud-stats {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    text-align: right;
  }

  .stat-value {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 2.2rem;
    color: #fff;
    line-height: 1;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
  }

  .stat-label {
    font-family: var(--font-display);
    font-size: 0.65rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 4px;
  }

  /* The Missing Collection Button */
  .btn-collection {
    background: rgba(0, 240, 255, 0.1);
    border: 1px solid var(--accent-primary);
    color: var(--accent-primary);
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-collection:hover {
    background: var(--accent-primary);
    color: #000;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
  }

  .btn-icon {
    width: 12px; height: 12px;
    border: 2px solid currentColor;
    border-radius: 50%;
    position: relative;
  }
  .btn-icon::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 4px; height: 4px;
    background: currentColor; border-radius: 50%;
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(2, 4, 10, 0.85);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 1.5rem 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .toast-title {
    font-family: var(--font-display);
    font-size: 0.8rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.2em;
  }

  .toast-name {
    font-family: var(--font-display);
    font-size: 1.8rem;
    font-weight: 900;
    text-shadow: 0 0 15px currentColor;
  }

  @media (max-width: 768px) {
    .header { padding: 1rem; border-radius: 0 0 16px 16px; }
    h1 { font-size: 1.8rem; }
    .hud-controls { gap: 1rem; }
    .btn-collection span { display: none; } /* Hide text on small screens */
    .btn-collection { padding: 0.8rem; border-radius: 50%; width: 44px; height: 44px; justify-content: center;}
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="mist-layer"></div>
  
  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand-group">
        <h1>Aether</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      
      <div class="hud-controls">
        <div class="hud-stats">
          <div class="stat-value" id="scoreDisplay">00</div>
          <div class="stat-label">Specimens</div>
        </div>

        <!-- Collection Button -->
        <button class="btn-collection" onclick="showCollection()">
          <div class="btn-icon"></div>
          <span>Collection</span>
        </button>
      </div>
    </header>

    <div id="toast" class="toast">
      <div class="toast-title">Specimen Secured</div>
      <div class="toast-name" id="toastName">Larva</div>
    </div>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');
  const toastNameEl = document.getElementById('toastName');

  let width, height;
  let score = 0;
  let particles = [];
  let dustParticles = [];
  let creatures = [];
  
  // Player Position (Fixed Avatar at bottom center)
  let player = { x: 0, y: 0 };
  // Mouse Position (The Net)
  let mouse = { x: 0, y: 0 };
  let isMouseDown = false;

  // Configuration
  const CREATURE_TYPES = [
    { name: 'Larva', color: '#00f0ff', rarity: 'common' },
    { name: 'Spore', color: '#ccff00', rarity: 'uncommon' },
    { name: 'Leviathan', color: '#ff0055', rarity: 'rare' }
  ];
  const CREATURE_COUNT = 12;
  const PLAYER_RADIUS = 20;
  const NET_RADIUS = 70;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    // Position player avatar at bottom center
    player.x = width / 2;
    player.y = height - 40; 
    initDust();
  }
  window.addEventListener('resize', resize);

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  function showCollection() {
    toastNameEl.innerText = "Collection Log";
    toastNameEl.style.color = "#fff";
    toastEl.querySelector('.toast-title').innerText = "Status";
    toastEl.classList.add('active');
    setTimeout(() => {
      toastEl.classList.remove('active');
      // Reset text after animation
      setTimeout(() => {
        toastEl.querySelector('.toast-title').innerText = "Specimen Secured";
      }, 500);
    }, 2000);
  }

  // --- Classes ---

  class DustParticle {
    constructor() {
      this.reset();
      this.y = Math.random() * height;
    }

    reset() {
      this.x = Math.random() * width;
      this.y = height + 10;
      this.size = Math.random() * 1.5 + 0.5;
      this.speedY = Math.random() * 0.3 + 0.1;
      this.speedX = (Math.random() - 0.5) * 0.1;
      this.opacity = Math.random() * 0.2 + 0.05;
    }

    update() {
      this.y -= this.speedY;
      this.x += this.speedX;
      if (this.y < -10) this.reset();
    }

    draw(ctx) {
      ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.015;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.92;
      this.vy *= 0.92;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset(true);
    }

    reset(initial = false) {
      // Spawn logic
      this.x = initial ? Math.random() * width : (Math.random() < 0.5 ? -100 : width + 100);
      this.y = initial ? Math.random() * (height - 200) : Math.random() * (height - 250);
      
      // Determine Rarity
      const rand = Math.random();
      let typeData;
      
      if (rand > 0.94) {
        typeData = CREATURE_TYPES[2]; // Rare Leviathan
      } else if (rand > 0.65) {
        typeData = CREATURE_TYPES[1]; // Uncommon Spore
      } else {
        typeData = CREATURE_TYPES[0]; // Common Larva
      }

      this.color = typeData.color;
      this.name = typeData.name;
      this.rarity = typeData.rarity;
      
      // Scale based on rarity (Leviathan is huge)
      let scale = 1;
      if (this.rarity === 'uncommon') scale = 1.3;
      if (this.rarity === 'rare') scale = 2.5; 
      
      this.baseRadius = (Math.random() * 5 + 12) * scale;
      
      // Movement
      this.vx = (Math.random() - 0.5) * 0.5;
      this.vy = (Math.random() - 0.5) * 0.5;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.02 + 0.005;
      
      this.isCaught = false;
      this.pulse = 0;
    }

    update() {
      if (this.isCaught) return;

      // Organic Drift
      this.x += this.vx + Math.sin(this.wobble) * 0.2;
      this.y += this.vy + Math.cos(this.wobble * 0.5) * 0.1;
      
      this.wobble += this.wobbleSpeed;
      this.pulse += 0.05;

      // Boundaries
      if (this.x < -100) this.vx += 0.05;
      if (this.x > width + 100) this.vx -= 0.05;
      if (this.y < -100) this.vy += 0.05;
      if (this.y > height - 150) this.vy -= 0.05;

      // Avoidance Logic
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      const reactionRadius = 200 * (this.rarity === 'rare' ? 1.2 : 1);
      
      if (dist < reactionRadius) {
        const force = (reactionRadius - dist) / reactionRadius;
        // Rare creatures are harder to catch (faster flee)
        const speedMult = this.rarity === 'rare' ? 1.5 : 0.8;
        this.vx += (dx / dist) * force * 0.3 * speedMult;
        this.vy += (dy / dist) * force * 0.3 * speedMult;
      }

      // Friction/Speed Cap
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      const maxSpeed = this.rarity === 'rare' ? 5 : 2.5;
      if (speed > maxSpeed) {
        this.vx = (this.vx / speed) * maxSpeed;
        this.vy = (this.vy / speed) * maxSpeed;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Glow Effect
      const glowSize = this.rarity === 'rare' ? 60 : 25;
      ctx.shadowBlur = glowSize;
      ctx.shadowColor = this.color;
      
      const pulseFactor = 1 + Math.sin(this.pulse) * 0.15;

      if (this.rarity === 'rare') {
        // --- LEVIATHAN (Rare) ---
        // Organic Blob Shape
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.85;
        
        ctx.beginPath();
        const points = 12;
        for (let i = 0; i <= points; i++) {
            const angle = (i / points) * Math.PI * 2;
            // Irregular shape
            const r = this.baseRadius * pulseFactor + Math.sin(angle * 7 + this.wobble) * (this.baseRadius * 0.15);
            const px = Math.cos(angle) * r;
            const py = Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        
        // Inner Core
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.arc(0, 0, this.baseRadius * 0.35, 0, Math.PI * 2);
        ctx.fill();

        // Pupil
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(0, 0, this.baseRadius * 0.12, 0, Math.PI * 2);
        ctx.fill();

        // Tentacles (Flowing lines)
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        for(let i=0; i<6; i++) {
            ctx.beginPath();
            const offset = (i - 2.5) * (this.baseRadius * 0.4);
            ctx.moveTo(offset, this.baseRadius * 0.6);
            ctx.quadraticCurveTo(
                offset + Math.sin(this.wobble + i) * 20, 
                this.baseRadius * 1.6, 
                offset + Math.sin(this.wobble + i) * 40, 
                this.baseRadius * 2.5
            );
            ctx.stroke();
        }

      } else {
        // --- COMMON / UNCOMMON ---
        // Jellyfish / Spore shape
        
        // Fill
        const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.baseRadius);
        gradient.addColorStop(0, this.color);
        gradient.addColorStop(1, 'transparent');
        ctx.fillStyle = gradient;
        ctx.globalAlpha = 0.7;

        // Draw Organic Blob
        ctx.beginPath();
        const points = 8;
        for (let i = 0; i <= points; i++) {
            const angle = (i / points) * Math.PI * 2;
            const r = this.baseRadius * pulseFactor + Math.sin(angle * 4 + this.wobble) * 5;
            const px = Math.cos(angle) * r;
            const py = Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();

        // Eye/Core
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 0.9;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#fff';
        ctx.beginPath();
        ctx.arc(0, -this.baseRadius * 0.1, this.baseRadius * 0.25, 0, Math.PI * 2);
        ctx.fill();
        
        // Stem/Tentacles for Uncommon
        if (this.rarity === 'uncommon') {
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, this.baseRadius);
            ctx.quadraticCurveTo(10, this.baseRadius * 1.5, 0, this.baseRadius * 2);
            ctx.stroke();
        }
      }

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function initDust() {
    dustParticles = [];
    for(let i=0; i<80; i++) dustParticles.push(new DustParticle());
  }

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    updateScoreUI();
  }

  function updateScoreUI() {
    scoreEl.innerText = score < 10 ? '0' + score : score;
  }

  function checkCatch() {
    const catchRadius = NET_RADIUS;

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    updateScoreUI();
    
    // Visual FX
    for(let i=0; i<30; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastNameEl.innerText = creature.name;
    toastNameEl.style.color = creature.color;
    toastEl.style.borderColor = creature.color;
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1200);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 2500);
  }

  function drawPlayerAndNet() {
    // 1. Draw Connection Cable (Bezier curve from Player to Mouse)
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    const cpX = (player.x + mouse.x) / 2;
    const cpY = Math.max(player.y, mouse.y) + 50; 
    ctx.quadraticCurveTo(cpX, cpY, mouse.x, mouse.y);
    
    // Outer Glow of cable
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.1)';
    ctx.lineWidth = 6;
    ctx.stroke();
    
    // Inner Core
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    // 2. Draw Player Avatar (The Harvester Unit)
    // Redesigned: Organic/Neon style to match creatures
    ctx.save();
    ctx.translate(player.x, player.y);
    
    // Base Platform
    ctx.fillStyle = '#02040a';
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f0ff';
    
    ctx.beginPath();
    // Organic pod shape
    ctx.moveTo(-30, 0);
    ctx.quadraticCurveTo(0, 20, 30, 0);
    ctx.quadraticCurveTo(0, -10, -30, 0);
    ctx.fill();
    ctx.stroke();
    
    // Mechanical Body (The arm)
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, -5);
    ctx.quadraticCurveTo(10, -40, 0, -70);
    ctx.stroke();
    
    // Indicator light
    ctx.fillStyle = isMouseDown ? '#ff0055' : '#00f0ff';
    ctx.shadowColor = ctx.fillStyle;
    ctx.beginPath();
    ctx.arc(0, -70, 5, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();

    // 3. Draw Net (At Mouse Position)
    // Redesigned: Glowing Hoop/Mesh
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Outer Ring (Pulsing)
    const pulse = Math.sin(Date.now() * 0.005) * 3;
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(0, 240, 255, 0.6)';
    ctx.lineWidth = isMouseDown ? 3 : 2;
    ctx.shadowBlur = 15;
    ctx.shadowColor = isMouseDown ? '#fff' : '#00f0ff';
    
    ctx.beginPath();
    ctx.arc(0, 0, NET_RADIUS + pulse, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner Grid (Rotating)
    const time = Date.now() * 0.002;
    ctx.rotate(time);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.shadowBlur = 0;
    
    // Crosshairs
    ctx.beginPath();
    ctx.moveTo(-NET_RADIUS, 0); ctx.lineTo(NET_RADIUS, 0);
    ctx.moveTo(0, -NET_RADIUS); ctx.lineTo(0, NET_RADIUS);
    ctx.stroke();
    
    // Rotating Hexagon
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        const ang = (i / 6) * Math.PI * 2;
        const r = NET_RADIUS * 0.6;
        ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
    }
    ctx.closePath();
    ctx.stroke();

    // Suction effect when active
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.setLineDash([5, 10]);
      ctx.beginPath();
      ctx.arc(0, 0, NET_RADIUS + 15, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Draw Dust (Background)
    dustParticles.forEach(p => {
      p.update();
      p.draw(ctx);
    });

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles (Effects)
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player & Net (Foreground)
    drawPlayerAndNet();

    requestAnimationFrame(loop);
  }

  // Start
  resize();
  init();
  loop();

</script>
</body>
</html>
