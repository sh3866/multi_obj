<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Project: AETHER</title>
<style>
  :root {
    --bg-deep: #020205;
    --bg-radial: radial-gradient(circle at 50% 40%, #0a1525 0%, #020205 80%);
    --accent-primary: #00f0ff;
    --accent-rare: #ff0055;
    --accent-gold: #ffd700;
    --accent-organic: #ccff00;
    --glass-bg: rgba(10, 15, 30, 0.4);
    --glass-border: rgba(255, 255, 255, 0.1);
    --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-display: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg-deep);
    background-image: var(--bg-radial);
    color: #fff;
    font-family: var(--font-main);
    overflow: hidden;
  }

  /* --- Environment & Atmosphere --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  /* Subtle Grid Overlay */
  .grid-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
  }

  /* Vignette for depth */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, transparent 40%, #000000 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none; /* Hide default cursor */
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none; /* Let clicks pass through to canvas */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 2rem;
    margin: 0;
    letter-spacing: 0.2em;
    color: #fff;
    text-transform: uppercase;
    text-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
  }

  .subtitle {
    font-family: var(--font-display);
    font-size: 0.7rem;
    color: var(--accent-primary);
    letter-spacing: 0.15em;
    opacity: 0.7;
    margin-top: 0.2rem;
  }

  /* HUD Panel - Glassmorphism */
  .hud-panel {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 20px; /* Cohesive rounded style */
    padding: 0.8rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1.2rem;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    transition: border-color 0.3s;
  }

  .hud-panel:hover {
    border-color: rgba(255, 255, 255, 0.3);
  }

  .hud-count {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .stat-value {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.8rem;
    color: #fff;
    line-height: 1;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
  }

  .stat-label {
    font-family: var(--font-display);
    font-size: 0.6rem;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* Collection Slots */
  .collection-slots {
    display: flex;
    gap: 6px;
  }

  .slot {
    width: 10px; height: 10px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%; /* Cohesive rounded style */
    border: 1px solid rgba(255,255,255,0.2);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .slot.filled {
    background: var(--accent-primary);
    border-color: #fff;
    box-shadow: 0 0 8px var(--accent-primary);
    transform: scale(1.2);
  }

  /* Footer */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    width: 100%;
    padding-bottom: 1rem;
  }

  .btn-main {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: #fff;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.9rem;
    padding: 1rem 3rem;
    border-radius: 50px; /* Cohesive rounded style */
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    transition: all 0.3s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    position: relative;
    overflow: hidden;
    width: 100%;
    max-width: 300px;
    text-align: center;
  }

  .btn-main:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: var(--accent-primary);
    color: var(--accent-primary);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
    transform: translateY(-2px);
  }

  .btn-main:active {
    transform: scale(0.98);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid var(--accent-primary);
    border-radius: 8px;
    color: #fff;
    padding: 0.8rem 2rem;
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    backdrop-filter: blur(4px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  @media (max-width: 600px) {
    h1 { font-size: 1.5rem; }
    .ui-layer { padding: 1.2rem; }
    .stat-value { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="grid-overlay"></div>
  <div class="vignette"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Aether</h1>
        <div class="subtitle">Specimen Collection</div>
      </div>
      <div class="hud-panel">
        <div class="collection-slots" id="slotsContainer">
          <!-- Slots generated by JS -->
          <div class="slot"></div><div class="slot"></div><div class="slot"></div>
          <div class="slot"></div><div class="slot"></div><div class="slot"></div>
        </div>
        <div class="hud-count">
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Collected</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Secured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const slotsContainer = document.getElementById('slotsContainer');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let dustParticles = [];
  let creatures = [];
  
  // Player Position (Fixed Avatar at bottom center)
  let player = { x: 0, y: 0 };
  // Mouse Position (The Net)
  let mouse = { x: 0, y: 0 };
  let isMouseDown = false;

  // Configuration
  const CREATURE_TYPES = [
    { name: 'Larva', color: '#00f0ff', rarity: 'common' },
    { name: 'Spore', color: '#ccff00', rarity: 'uncommon' },
    { name: 'Leviathan', color: '#ff0055', rarity: 'rare' } // The big one
  ];
  const CREATURE_COUNT = 8;
  const PLAYER_RADIUS = 18;
  const NET_RADIUS = 60;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    // Position player avatar at bottom center
    player.x = width / 2;
    player.y = height - 100;
    initDust();
  }
  window.addEventListener('resize', resize);

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class DustParticle {
    constructor() {
      this.reset();
      this.y = Math.random() * height;
    }

    reset() {
      this.x = Math.random() * width;
      this.y = height + 10;
      this.size = Math.random() * 1.5 + 0.5;
      this.speedY = Math.random() * 0.3 + 0.1;
      this.speedX = (Math.random() - 0.5) * 0.1;
      this.opacity = Math.random() * 0.2 + 0.05;
    }

    update() {
      this.y -= this.speedY;
      this.x += this.speedX;
      if (this.y < -10) this.reset();
    }

    draw(ctx) {
      ctx.fillStyle = `rgba(200, 220, 255, ${this.opacity})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.96;
      this.vy *= 0.96;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset(true);
    }

    reset(initial = false) {
      // Spawn logic
      this.x = initial ? Math.random() * width : (Math.random() < 0.5 ? -100 : width + 100);
      this.y = initial ? Math.random() * (height - 200) : Math.random() * (height - 200);
      
      // Determine Rarity
      const rand = Math.random();
      let typeData;
      
      if (rand > 0.9) {
        typeData = CREATURE_TYPES[2]; // Rare Leviathan
      } else if (rand > 0.6) {
        typeData = CREATURE_TYPES[1]; // Uncommon Spore
      } else {
        typeData = CREATURE_TYPES[0]; // Common Larva
      }

      this.color = typeData.color;
      this.name = typeData.name;
      this.rarity = typeData.rarity;
      
      // Scale based on rarity
      let scale = 1;
      if (this.rarity === 'uncommon') scale = 1.3;
      if (this.rarity === 'rare') scale = 2.5; // Significantly larger
      
      this.baseRadius = (Math.random() * 5 + 8) * scale;
      
      // Movement
      this.vx = (Math.random() - 0.5) * 1;
      this.vy = (Math.random() - 0.5) * 1;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.02 + 0.005;
      
      this.isCaught = false;
      this.pulse = 0;
    }

    update() {
      if (this.isCaught) return;

      // Organic Drift
      this.x += this.vx + Math.sin(this.wobble) * 0.2;
      this.y += this.vy + Math.cos(this.wobble * 0.5) * 0.1;
      
      this.wobble += this.wobbleSpeed;
      this.pulse += 0.05;

      // Boundaries (Soft bounce)
      if (this.x < -100) this.vx += 0.05;
      if (this.x > width + 100) this.vx -= 0.05;
      if (this.y < -100) this.vy += 0.05;
      if (this.y > height - 50) this.vy -= 0.05;

      // Avoidance Logic (Run away from net)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      // Larger creatures are slower to react but have more space
      const reactionRadius = 150 * (this.rarity === 'rare' ? 1.5 : 1);
      
      if (dist < reactionRadius) {
        const force = (reactionRadius - dist) / reactionRadius;
        // Rare creatures are harder to catch (faster flee)
        const speedMult = this.rarity === 'rare' ? 1.5 : 1;
        this.vx += (dx / dist) * force * 0.5 * speedMult;
        this.vy += (dy / dist) * force * 0.5 * speedMult;
      }

      // Friction/Speed Cap
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      const maxSpeed = this.rarity === 'rare' ? 3 : 1.5;
      if (speed > maxSpeed) {
        this.vx = (this.vx / speed) * maxSpeed;
        this.vy = (this.vy / speed) * maxSpeed;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Glow Effect
      const glowSize = this.rarity === 'rare' ? 40 : 15;
      ctx.shadowBlur = glowSize;
      ctx.shadowColor = this.color;
      
      const pulseFactor = 1 + Math.sin(this.pulse) * 0.1;

      if (this.rarity === 'rare') {
        // --- LEVIATHAN (Rare) ---
        // Solid, complex, opaque fill
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.9;
        
        // Draw a complex organic shape (Jellyfish-like)
        ctx.beginPath();
        ctx.arc(0, 0, this.baseRadius * pulseFactor, 0, Math.PI * 2);
        ctx.fill();
        
        // Inner detail (Solid white core)
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(0, 0, this.baseRadius * 0.4, 0, Math.PI * 2);
        ctx.fill();

        // Tentacles (Flowing lines)
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        for(let i=0; i<3; i++) {
            ctx.beginPath();
            const offset = (i - 1) * (this.baseRadius * 0.6);
            ctx.moveTo(offset, this.baseRadius * 0.8);
            ctx.quadraticCurveTo(
                offset + Math.sin(this.wobble + i) * 10, 
                this.baseRadius * 1.5, 
                offset + Math.sin(this.wobble + i) * 20, 
                this.baseRadius * 2
            );
            ctx.stroke();
        }

      } else {
        // --- COMMON / UNCOMMON ---
        // Wireframe based, transparent
        ctx.strokeStyle = this.color;
        ctx.lineWidth = this.rarity === 'uncommon' ? 2 : 1;
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.2; // Transparent fill

        // Draw Organic Blob
        ctx.beginPath();
        const points = 6;
        for (let i = 0; i <= points; i++) {
            const angle = (i / points) * Math.PI * 2;
            // Irregular radius for organic feel
            const r = this.baseRadius * pulseFactor + Math.sin(angle * 3 + this.wobble) * 3;
            const px = Math.cos(angle) * r;
            const py = Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Eye/Core
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        ctx.arc(0, 0, this.baseRadius * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function initDust() {
    dustParticles = [];
    for(let i=0; i<80; i++) dustParticles.push(new DustParticle());
  }

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    updateScoreUI();
  }

  function updateScoreUI() {
    scoreEl.innerText = score;
    const slots = document.querySelectorAll('.slot');
    slots.forEach((slot, index) => {
      if (index < score) {
        slot.classList.add('filled');
      } else {
        slot.classList.remove('filled');
      }
    });
  }

  function checkCatch() {
    const catchRadius = NET_RADIUS;

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    updateScoreUI();
    
    // Visual FX
    for(let i=0; i<20; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.innerText = `${creature.name} Secured`;
    toastEl.style.borderColor = creature.color;
    toastEl.style.color = creature.color;
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1000);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 2000);
  }

  function resetGame() {
    init();
  }

  function drawPlayerAndNet() {
    // 1. Draw Connection Cable (Bezier curve from Player to Mouse)
    // This creates the physical link between the avatar and the net
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    // Control point creates a hanging cable effect
    const cpX = (player.x + mouse.x) / 2;
    const cpY = Math.max(player.y, mouse.y) + 50; 
    ctx.quadraticCurveTo(cpX, cpY, mouse.x, mouse.y);
    
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // Inner energy line
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    // 2. Draw Player Avatar (The Harvester Unit)
    // Fixed at bottom center, distinct geometric shape
    ctx.save();
    ctx.translate(player.x, player.y);
    
    // Base
    ctx.fillStyle = '#111';
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(-20, -10, 40, 20, 5);
    ctx.fill();
    ctx.stroke();
    
    // Antenna/Scope pointing up
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.lineTo(0, -25);
    ctx.stroke();
    
    // Indicator light
    ctx.fillStyle = isMouseDown ? '#ff0055' : '#00f0ff';
    ctx.shadowBlur = 5;
    ctx.shadowColor = ctx.fillStyle;
    ctx.beginPath();
    ctx.arc(0, -25, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();

    // 3. Draw Net (At Mouse Position)
    // Stylized as an energy field rather than a mesh
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Outer Ring
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(255, 255, 255, 0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, NET_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner Grid (Rotating)
    const time = Date.now() * 0.001;
    ctx.rotate(time);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
    ctx.lineWidth = 1;
    
    // Crosshairs
    ctx.beginPath();
    ctx.moveTo(-NET_RADIUS, 0); ctx.lineTo(NET_RADIUS, 0);
    ctx.moveTo(0, -NET_RADIUS); ctx.lineTo(0, NET_RADIUS);
    ctx.stroke();
    
    // Rotating Hexagon
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        const ang = (i / 6) * Math.PI * 2;
        const r = NET_RADIUS * 0.6;
        ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
    }
    ctx.closePath();
    ctx.stroke();

    // Suction effect when active
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.arc(0, 0, NET_RADIUS + 10, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Draw Dust (Background)
    dustParticles.forEach(p => {
      p.update();
      p.draw(ctx);
    });

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles (Effects)
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player & Net (Foreground)
    drawPlayerAndNet();

    requestAnimationFrame(loop);
  }

  // Start
  resize();
  init();
  loop();

</script>
</body>
</html>
