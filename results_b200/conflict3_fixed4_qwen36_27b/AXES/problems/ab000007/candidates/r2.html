<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Project: HARVEST</title>
<style>
  :root {
    --bg-deep: #05070a;
    --bg-grid: #0f1420;
    --accent-cyan: #00f0ff;
    --accent-magenta: #ff0055;
    --accent-lime: #ccff00;
    --accent-purple: #bd00ff;
    --ui-bg: rgba(10, 15, 25, 0.85);
    --ui-border: rgba(255, 255, 255, 0.15);
    --font-tech: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: #fff;
    font-family: var(--font-tech);
    overflow: hidden;
  }

  /* --- Background Layers --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  /* Topographic / Grid Background */
  .grid-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    /* Create a complex, angular grid pattern */
    background-image: 
      linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px),
      linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
    opacity: 0.6;
    z-index: 0;
    pointer-events: none;
  }

  /* Vignette & Depth */
  .atmosphere {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, transparent 0%, var(--bg-deep) 85%),
                linear-gradient(to bottom, rgba(5,7,10,0.4) 0%, rgba(5,7,10,0.8) 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1.5rem;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    margin-top: 1rem;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }

  h1 {
    font-family: var(--font-tech);
    font-weight: 900;
    font-size: 1.8rem;
    margin: 0;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    font-style: italic; /* Tech speed feel */
  }

  .subtitle {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--accent-cyan);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  /* HUD Panel - Angular/Chamfered */
  .hud-panel {
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    padding: 0.6rem 1rem;
    /* Chamfered corners effect using clip-path */
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
  }

  .hud-count {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .stat-value {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 1.4rem;
    color: #fff;
    line-height: 1;
  }

  .stat-label {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .collection-slots {
    display: flex;
    gap: 4px;
    padding-right: 10px;
    border-right: 1px solid rgba(255,255,255,0.1);
    margin-right: 5px;
  }

  .slot {
    width: 12px; height: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    transform: skewX(-15deg);
    transition: all 0.3s ease;
  }

  .slot.filled {
    background: var(--accent-cyan);
    border-color: #fff;
    box-shadow: 0 0 5px var(--accent-cyan);
  }

  /* Footer / Actions */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    margin-bottom: 1rem;
    width: 100%;
  }

  .btn-main {
    background: var(--ui-bg);
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.9rem;
    padding: 1rem 3rem;
    /* Angular shape */
    clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    transition: all 0.2s ease;
    position: relative;
    width: 100%;
    max-width: 400px;
  }

  .btn-main:hover {
    background: var(--accent-cyan);
    color: #000;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
  }
  
  .btn-main::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 4px; height: 100%;
    background: #fff;
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 60%; left: 50%;
    transform: translate(-50%, -50%) skewX(-10deg);
    background: rgba(5, 7, 10, 0.9);
    border: 1px solid var(--accent-lime);
    color: var(--accent-lime);
    padding: 0.6rem 2rem;
    font-family: var(--font-mono);
    font-weight: 700;
    letter-spacing: 0.05em;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s;
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 15px rgba(204, 255, 0, 0.2);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) skewX(-10deg) scale(1.05);
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    h1 { font-size: 1.4rem; }
    .ui-layer { padding: 1rem; }
    .hud-panel { padding: 0.5rem 0.8rem; }
    .stat-value { font-size: 1.2rem; }
    .slot { width: 10px; height: 10px; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="grid-bg"></div>
  <div class="atmosphere"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Harvest</h1>
        <div class="subtitle">Bio-Mass Collection</div>
      </div>
      <div class="hud-panel">
        <div class="collection-slots" id="slotsContainer">
          <!-- Slots generated by JS -->
          <div class="slot"></div><div class="slot"></div><div class="slot"></div>
          <div class="slot"></div><div class="slot"></div><div class="slot"></div>
        </div>
        <div class="hud-count">
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Biomass</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Secured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">Access Database</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const slotsContainer = document.getElementById('slotsContainer');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let dustParticles = [];
  let creatures = [];
  
  // Player Position (Avatar)
  let player = { x: 0, y: 0 };
  // Mouse Position (Net Target)
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;

  // Configuration
  const CREATURE_TYPES = [
    { name: 'Drone', color: '#00f0ff', rarity: 'common' },
    { name: 'Wisp', color: '#ff0055', rarity: 'rare' },
    { name: 'Spore', color: '#ccff00', rarity: 'uncommon' },
    { name: 'Nucleus', color: '#bd00ff', rarity: 'legendary' }
  ];
  const CREATURE_COUNT = 7;
  const PLAYER_RADIUS = 20;
  const NET_RADIUS = 55;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    player.x = width / 2;
    player.y = height - 80;
    initDust();
  }
  window.addEventListener('resize', resize);

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault(); // Prevent scrolling
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class DustParticle {
    constructor() {
      this.reset();
      this.y = Math.random() * height; // Initial random spread
    }

    reset() {
      this.x = Math.random() * width;
      this.y = height + 10;
      this.size = Math.random() * 2 + 0.5;
      this.speedY = Math.random() * 0.5 + 0.1;
      this.speedX = (Math.random() - 0.5) * 0.2;
      this.opacity = Math.random() * 0.3 + 0.1;
    }

    update() {
      this.y -= this.speedY;
      this.x += this.speedX;
      if (this.y < -10) this.reset();
    }

    draw(ctx) {
      ctx.fillStyle = `rgba(200, 220, 255, ${this.opacity})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.03 + 0.015;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.95; // Friction
      this.vy *= 0.95;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset(true);
    }

    reset(initial = false) {
      // Spawn logic
      this.x = initial ? Math.random() * width : (Math.random() < 0.5 ? -50 : width + 50);
      this.y = initial ? Math.random() * height : Math.random() * height;
      
      // Stats based on rarity
      const typeIdx = Math.floor(Math.random() * CREATURE_TYPES.length);
      const typeData = CREATURE_TYPES[typeIdx];
      this.color = typeData.color;
      this.name = typeData.name;
      
      // Rarity scaling
      let scale = 1;
      if (typeData.rarity === 'rare') scale = 1.2;
      if (typeData.rarity === 'legendary') scale = 1.5;
      
      this.baseRadius = (Math.random() * 10 + 12) * scale;
      
      // Movement
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      this.angle = 0;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.03 + 0.01;
      
      // Shape
      this.shapeType = Math.random(); // 0-0.4: Hex, 0.4-0.7: Circle, 0.7-1: Diamond
      this.isCaught = false;
    }

    update() {
      if (this.isCaught) return;

      this.x += this.vx;
      this.y += this.vy;
      this.angle += 0.01;
      this.wobble += this.wobbleSpeed;
      
      // Drift
      this.x += Math.sin(this.wobble) * 0.2;

      // Bounce
      if (this.x < -50 || this.x > width + 50) this.vx *= -1;
      if (this.y < -50 || this.y > height + 50) this.vy *= -1;

      // Avoidance
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 150) {
        const force = (150 - dist) / 150;
        this.vx += (dx / dist) * force * 0.8;
        this.vy += (dy / dist) * force * 0.8;
      }

      // Speed cap
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 3.5) {
        this.vx = (this.vx / speed) * 3.5;
        this.vy = (this.vy / speed) * 3.5;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Glow
      ctx.shadowBlur = 20;
      ctx.shadowColor = this.color;
      
      // Style
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; // Semi-transparent body
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2;

      if (this.shapeType < 0.4) {
        // Hexagon (Common/Drone)
        ctx.rotate(this.angle);
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const ang = (i / 6) * Math.PI * 2;
          ctx.lineTo(Math.cos(ang) * this.baseRadius, Math.sin(ang) * this.baseRadius);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // Inner core
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.arc(0, 0, this.baseRadius * 0.4, 0, Math.PI*2);
        ctx.fill();
      } 
      else if (this.shapeType < 0.7) {
        // Diamond/Spade (Uncommon)
        ctx.rotate(this.angle * 0.5);
        ctx.beginPath();
        ctx.moveTo(0, -this.baseRadius);
        ctx.lineTo(this.baseRadius, 0);
        ctx.lineTo(0, this.baseRadius);
        ctx.lineTo(-this.baseRadius, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // Eye
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, Math.PI*2);
        ctx.fill();
      } 
      else {
        // Orb/Ring (Rare/Legendary)
        ctx.beginPath();
        ctx.arc(0, 0, this.baseRadius, 0, Math.PI * 2);
        ctx.stroke();
        
        // Inner detail
        ctx.rotate(-this.angle);
        ctx.beginPath();
        ctx.arc(0, 0, this.baseRadius * 0.6, 0, Math.PI * 2);
        ctx.stroke();
        
        // Core
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI*2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function initDust() {
    dustParticles = [];
    for(let i=0; i<60; i++) dustParticles.push(new DustParticle());
  }

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    updateScoreUI();
  }

  function updateScoreUI() {
    scoreEl.innerText = score;
    const slots = document.querySelectorAll('.slot');
    slots.forEach((slot, index) => {
      if (index < score) {
        slot.classList.add('filled');
      } else {
        slot.classList.remove('filled');
      }
    });
  }

  function checkCatch() {
    const catchRadius = NET_RADIUS;

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    updateScoreUI();
    
    // Visual FX
    for(let i=0; i<15; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.innerText = `${creature.name} Secured`;
    toastEl.style.borderColor = creature.color;
    toastEl.style.color = creature.color;
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1200);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 2500);
  }

  function resetGame() {
    init();
  }

  function drawPlayerAndNet() {
    // 1. Draw Connection Line (Cable) from Player to Net
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(mouse.x, mouse.y);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    // 2. Draw Player Avatar (The Harvester)
    ctx.save();
    ctx.translate(player.x, player.y);
    
    // Matte Body (Trapezoid)
    ctx.fillStyle = '#1a1c23'; // Dark Grey Matte
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1;
    
    ctx.beginPath();
    ctx.moveTo(-15, 15); // Bottom Left
    ctx.lineTo(15, 15);  // Bottom Right
    ctx.lineTo(10, -10); // Top Right
    ctx.lineTo(-10, -10);// Top Left
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Wireframe overlay
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.beginPath();
    ctx.moveTo(-10, -10); ctx.lineTo(10, -10);
    ctx.moveTo(-15, 15); ctx.lineTo(15, 15);
    ctx.stroke();

    ctx.restore();

    // 3. Draw Net (At Mouse Position)
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Mesh (Wireframe Cone representation)
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(0, 240, 255, 0.6)';
    ctx.lineWidth = 1.5;
    
    // Outer boundary
    ctx.beginPath();
    ctx.arc(0, 0, NET_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
    
    // Grid inside net
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, NET_RADIUS * 0.7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-NET_RADIUS, 0); ctx.lineTo(NET_RADIUS, 0);
    ctx.moveTo(0, -NET_RADIUS); ctx.lineTo(0, NET_RADIUS);
    ctx.stroke();

    // "Sucking" effect if held down
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.beginPath();
      ctx.arc(0, 0, NET_RADIUS + 5, 0, Math.PI * 2);
      ctx.setLineDash([2, 4]);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Draw Dust
    dustParticles.forEach(p => {
      p.update();
      p.draw(ctx);
    });

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player & Net (Top layer)
    drawPlayerAndNet();

    requestAnimationFrame(loop);
  }

  // Start
  resize();
  init();
  loop();

</script>
</body>
</html>
