<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina Catch</title>
<style>
  :root {
    --bg-deep: #05070a;
    --bg-mid: #0f1420;
    --accent-cyan: #00f0ff;
    --accent-magenta: #ff0055;
    --accent-lime: #ccff00;
    --glass-surface: rgba(12, 20, 35, 0.4);
    --glass-border: rgba(0, 240, 255, 0.3);
    --font-ui: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Background Atmosphere --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* The "Surface of Light" Grid - Blurred and Faded */
  .grid-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(rgba(0, 240, 255, 0.1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.1) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(400px) rotateX(60deg) translateY(-50px) scale(2.5);
    opacity: 0.4;
    z-index: 0;
    pointer-events: none;
    /* Soften the grid lines */
    filter: blur(1.5px); 
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
  }

  /* Volumetric Fog / Vignette */
  .atmosphere {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: 
      radial-gradient(circle at 50% 50%, transparent 0%, var(--bg-deep) 90%),
      linear-gradient(to bottom, rgba(5,7,10,0.8) 0%, rgba(5,7,10,0.2) 50%, rgba(5,7,10,0.9) 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* --- Canvas Layer --- */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    cursor: none;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  h1 {
    /* Geometric Sans-Serif look using system fonts */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 800;
    font-size: 2.2rem;
    margin: 0;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
  }

  .subtitle {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* HUD Panel - Glassmorphism/Holographic */
  .hud-panel {
    background: var(--glass-surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    padding: 0.8rem 1.5rem;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,255,255,0.05);
    transition: box-shadow 0.3s ease;
  }
  
  .hud-panel:hover {
    box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,255,255,0.1), 0 0 15px rgba(0, 240, 255, 0.2);
  }

  .stat-icon {
    width: 24px; height: 24px;
    fill: var(--accent-cyan);
    filter: drop-shadow(0 0 4px var(--accent-cyan));
  }

  .stat-value {
    font-family: monospace; /* Tech feel for numbers */
    font-weight: 700;
    font-size: 1.5rem;
    color: white;
    letter-spacing: -0.05em;
  }

  .stat-label {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Footer / Actions */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    margin-bottom: 1rem;
  }

  .btn-main {
    background: rgba(0, 240, 255, 0.1);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(0, 240, 255, 0.4);
    color: #fff;
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 1rem;
    padding: 1rem 3rem;
    border-radius: 8px; /* Slightly squarer for modern tech look */
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .btn-main:hover {
    background: rgba(0, 240, 255, 0.2);
    transform: translateY(-2px);
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(5, 7, 10, 0.8);
    border: 1px solid var(--accent-lime);
    color: var(--accent-lime);
    padding: 0.8rem 2rem;
    border-radius: 4px;
    font-family: var(--font-ui);
    font-weight: 700;
    letter-spacing: 0.1em;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s;
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(204, 255, 0, 0.15);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    h1 { font-size: 1.6rem; }
    .ui-layer { padding: 1rem; }
    .btn-main { padding: 0.8rem 2rem; font-size: 0.9rem; width: 100%; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Backgrounds -->
  <div class="grid-bg"></div>
  <div class="atmosphere"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Lumina</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-panel">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" />
        </svg>
        <div>
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Captured</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured!</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">View Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  // Player Position (Avatar)
  let player = { x: 0, y: 0 };
  // Mouse Position (Net Target)
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;

  // Configuration
  const COLORS = ['#00f0ff', '#ff0055', '#ccff00', '#bd00ff'];
  const CREATURE_COUNT = 8;
  const PLAYER_RADIUS = 15;
  const NET_RADIUS = 60;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    // Default player position bottom center
    player.x = width / 2;
    player.y = height - 100;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.03 + 0.01;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.type = Math.floor(Math.random() * 3); // 0: Orb, 1: Shard, 2: Ring
      this.reset();
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    }

    reset() {
      // Spawn logic
      this.x = Math.random() < 0.5 ? -50 : width + 50;
      this.y = Math.random() * height;
      this.vx = (Math.random() - 0.5) * 2;
      this.vy = (Math.random() - 0.5) * 2;
      this.radius = Math.random() * 15 + 15;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.angle = 0;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.05 + 0.02;
      this.isCaught = false;
    }

    update() {
      if (this.isCaught) return;

      // Movement
      this.x += this.vx;
      this.y += this.vy;
      this.angle += 0.02;
      this.wobble += this.wobbleSpeed;
      
      // Organic sine wave drift
      this.x += Math.sin(this.wobble) * 0.3;

      // Bounce off walls
      if (this.x < 0 || this.x > width) this.vx *= -1;
      if (this.y < 0 || this.y > height) this.vy *= -1;

      // Avoid Mouse (Net)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 120) {
        const force = (120 - dist) / 120;
        this.vx += (dx / dist) * force * 0.4;
        this.vy += (dy / dist) * force * 0.4;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 4) {
        this.vx = (this.vx / speed) * 4;
        this.vy = (this.vy / speed) * 4;
      }
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Setup Glow
      ctx.shadowBlur = 15;
      ctx.shadowColor = this.color;
      ctx.fillStyle = this.color;
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 2;

      // Morphology Switch
      if (this.type === 0) { 
        // ORB: Pulsing sphere with core
        const pulse = Math.sin(this.wobble * 2) * 2;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius + pulse, 0, Math.PI * 2);
        ctx.fill();
        
        // Core
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius * 0.3, 0, Math.PI * 2);
        ctx.fill();
      } 
      else if (this.type === 1) {
        // SHARD: Rotating jagged shape
        ctx.rotate(this.angle);
        ctx.beginPath();
        const sides = 4;
        for (let i = 0; i < sides; i++) {
            const ang = (i / sides) * Math.PI * 2;
            const r = (i % 2 === 0) ? this.radius : this.radius * 0.6;
            ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
        }
        ctx.closePath();
        ctx.stroke();
        // Inner fill
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.4;
        ctx.fill();
      } 
      else {
        // RING: Geometric ring with eye
        ctx.rotate(this.angle);
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.stroke();
        
        // Inner detail
        ctx.beginPath();
        ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
        ctx.stroke();
        
        // Eye
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
  }

  function checkCatch() {
    const catchRadius = NET_RADIUS;

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual FX
    for(let i=0; i<20; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    // Show Toast
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1000);

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 2000);
  }

  function resetGame() {
    init();
  }

  function drawPlayerAndNet() {
    // 1. Draw Connection Line (Tether) from Player to Net
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(mouse.x, mouse.y);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.stroke();
    ctx.restore();

    // 2. Draw Player Avatar (Bottom Center)
    ctx.save();
    ctx.translate(player.x, player.y);
    
    // Glow
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#00f0ff';
    
    // Silhouette shape (Triangle/Robot head)
    ctx.fillStyle = '#0f1420';
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2;
    
    ctx.beginPath();
    ctx.moveTo(0, -PLAYER_RADIUS);
    ctx.lineTo(PLAYER_RADIUS, PLAYER_RADIUS);
    ctx.lineTo(-PLAYER_RADIUS, PLAYER_RADIUS);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    // Visor
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 5;
    ctx.fillRect(-8, -2, 16, 4);

    ctx.restore();

    // 3. Draw Net (At Mouse Position)
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f0ff';
    
    // Net Shape (Wireframe Circle)
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(0, 240, 255, 0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, NET_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner Mesh effect
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, NET_RADIUS * 0.6, 0, Math.PI * 2);
    ctx.stroke();
    
    // Rotating crosshair
    ctx.rotate(Date.now() / 500);
    ctx.beginPath();
    ctx.moveTo(-NET_RADIUS * 0.8, 0); ctx.lineTo(-NET_RADIUS * 0.4, 0);
    ctx.moveTo(NET_RADIUS * 0.8, 0); ctx.lineTo(NET_RADIUS * 0.4, 0);
    ctx.moveTo(0, -NET_RADIUS * 0.8); ctx.lineTo(0, -NET_RADIUS * 0.4);
    ctx.moveTo(0, NET_RADIUS * 0.8); ctx.lineTo(0, NET_RADIUS * 0.4);
    ctx.stroke();

    // "Sucking" effect if held down
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.beginPath();
      ctx.arc(0, 0, NET_RADIUS + 10, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    // Clear
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player & Net
    drawPlayerAndNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
