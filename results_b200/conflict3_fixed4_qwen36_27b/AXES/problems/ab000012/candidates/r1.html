<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #050508;
        --bg-panel: #0e0e14;
        --gold-primary: #d4af37;
        --gold-highlight: #f9e689;
        --gold-shadow: #8a6e18;
        --accent-blue: #4fd1c5;
        --accent-blue-dim: #2d6a63;
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --font-heading: 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    /* --- Background Atmosphere (The Void) --- */
    .bg-gradient {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #1a2c33 0%, #050508 70%);
        z-index: 0;
    }

    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, transparent 40%, var(--bg-deep) 100%);
        z-index: 1;
        pointer-events: none;
    }

    #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        opacity: 0.4;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem;
    }

    /* --- Header & Currency --- */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 1rem;
        padding-right: 1rem;
    }

    .currency-pill {
        background: rgba(10, 10, 15, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-right: 2px solid var(--gold-shadow);
        border-radius: 8px 0 0 8px;
        padding: 0.6rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        transition: border-color 0.3s;
    }

    .currency-pill:hover {
        border-color: var(--gold-primary);
    }

    .coin-icon {
        width: 20px;
        height: 20px;
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 2px var(--gold-shadow));
    }

    .currency-amount {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-highlight);
        letter-spacing: 1px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* --- Hero Section: The Summoning Circle --- */
    .hero-section {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        margin-bottom: 3rem;
        position: relative;
        height: 350px; /* Fixed height area */
    }

    /* The Rotating Sigil Background */
    .sigil-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 500px;
        height: 500px;
        opacity: 0.3;
        pointer-events: none;
        z-index: -1;
    }

    .sigil-ring {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        border: 1px solid rgba(79, 209, 197, 0.3);
        border-radius: 50%;
        box-shadow: 0 0 20px rgba(79, 209, 197, 0.1);
    }

    .sigil-ring-1 { animation: spin 60s linear infinite; }
    .sigil-ring-2 { 
        width: 80%; height: 80%; top: 10%; left: 10%; 
        border-style: dashed; 
        animation: spin-reverse 40s linear infinite; 
    }
    .sigil-ring-3 { 
        width: 60%; height: 60%; top: 20%; left: 20%; 
        border: 1px solid rgba(79, 209, 197, 0.5); 
        animation: spin 20s linear infinite; 
    }

    .game-title {
        font-family: var(--font-heading);
        font-size: 4rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        margin-bottom: 0.2rem;
        background: linear-gradient(to bottom, var(--gold-highlight), var(--gold-primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));
        z-index: 2;
    }

    .game-subtitle {
        font-family: var(--font-heading);
        font-size: 1.1rem;
        color: var(--accent-blue);
        letter-spacing: 0.4em;
        text-transform: uppercase;
        opacity: 0.9;
        text-shadow: 0 0 10px rgba(79, 209, 197, 0.4);
        z-index: 2;
    }

    /* --- Menu Hierarchy --- */
    .menu-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
        flex-grow: 1;
    }

    /* Primary Action: Summon */
    .primary-action {
        width: 100%;
        max-width: 600px;
        perspective: 1000px;
    }

    .summon-card {
        background: linear-gradient(160deg, rgba(20, 20, 28, 0.7), rgba(10, 10, 15, 0.8));
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--gold-shadow);
        border-radius: 16px;
        padding: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
    }

    /* Gold Border Effect */
    .summon-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border-radius: 16px;
        padding: 2px;
        background: linear-gradient(45deg, transparent, var(--gold-primary), transparent);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0.5;
        transition: opacity 0.4s;
    }

    .summon-card:hover {
        transform: translateY(-4px) scale(1.01);
        box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 20px rgba(212, 175, 55, 0.2);
        border-color: var(--gold-primary);
    }

    .summon-card:hover::before {
        opacity: 1;
    }

    .summon-icon-wrapper {
        width: 80px;
        height: 80px;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .summon-icon {
        width: 60px;
        height: 60px;
        fill: var(--gold-highlight);
        filter: drop-shadow(0 0 10px var(--gold-shadow));
        animation: float 4s ease-in-out infinite;
    }

    .summon-text-group {
        text-align: left;
    }

    .summon-title {
        font-family: var(--font-heading);
        font-size: 2rem;
        color: var(--gold-highlight);
        letter-spacing: 0.1em;
        margin-bottom: 0.2rem;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .summon-sub {
        font-size: 0.9rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.15em;
    }

    /* Secondary Actions Grid */
    .secondary-actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 700px;
    }

    .artifact-card {
        background: rgba(15, 15, 20, 0.4);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
    }

    .artifact-card:hover {
        background: rgba(30, 30, 40, 0.6);
        transform: translateY(-5px);
        border-color: rgba(79, 209, 197, 0.3);
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .artifact-icon {
        width: 40px;
        height: 40px;
        stroke: var(--accent-blue);
        stroke-width: 1.5;
        fill: none;
        filter: drop-shadow(0 0 5px rgba(79, 209, 197, 0.3));
        transition: all 0.3s;
    }

    .artifact-card:hover .artifact-icon {
        stroke: var(--gold-highlight);
        filter: drop-shadow(0 0 8px var(--gold-primary));
    }

    .artifact-label {
        font-family: var(--font-heading);
        font-size: 1.1rem;
        color: var(--text-main);
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    /* --- Footer --- */
    footer {
        position: absolute;
        bottom: 1rem;
        width: 100%;
        text-align: center;
        color: var(--text-muted);
        font-size: 0.75rem;
        opacity: 0.3;
        pointer-events: none;
    }

    /* --- Animations --- */
    @keyframes spin {
        100% { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
        100% { transform: rotate(-360deg); }
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 2.5rem; }
        .hero-section { height: 250px; }
        .sigil-container { width: 300px; height: 300px; }
        
        .secondary-actions {
            grid-template-columns: 1fr;
            max-width: 300px;
        }
        
        .summon-card {
            padding: 1.5rem;
            flex-direction: column;
            text-align: center;
            gap: 1rem;
        }
        
        .summon-text-group { text-align: center; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <div class="bg-gradient"></div>
    <div class="vignette"></div>
    <canvas id="canvas-bg"></canvas>

    <div class="app-container">
        
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <svg class="coin-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
                    <path d="M12 6v12M8 10l4-4 4 4M8 14l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero: The Summoning Circle -->
        <section class="hero-section">
            <!-- Rotating Sigils -->
            <div class="sigil-container">
                <div class="sigil-ring sigil-ring-1"></div>
                <div class="sigil-ring sigil-ring-2"></div>
                <div class="sigil-ring sigil-ring-3"></div>
            </div>

            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>
        </section>

        <!-- Navigation -->
        <nav class="menu-container">
            
            <!-- Primary Action -->
            <div class="primary-action">
                <div class="summon-card" onclick="interact('Summon')">
                    <div class="summon-icon-wrapper">
                        <!-- Stylized Rune Icon -->
                        <svg class="summon-icon" viewBox="0 0 100 100">
                            <path d="M50 10 L90 90 H10 Z" stroke="currentColor" stroke-width="2" fill="none" opacity="0.5"/>
                            <circle cx="50" cy="55" r="15" fill="currentColor"/>
                            <path d="M50 10 L50 25 M20 80 L35 65 M80 80 L65 65" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </div>
                    <div class="summon-text-group">
                        <div class="summon-title">Summon</div>
                        <div class="summon-sub">Conjure a new spirit</div>
                    </div>
                </div>
            </div>

            <!-- Secondary Actions -->
            <div class="secondary-actions">
                <!-- Roster -->
                <div class="artifact-card" onclick="interact('Roster')">
                    <svg class="artifact-icon" viewBox="0 0 24 24">
                        <path d="M12 2a10 10 0 0 1 10 10h-10V2z" />
                        <path d="M12 12a10 10 0 0 1 0 20V12z" />
                        <path d="M12 2a10 10 0 0 0-10 10h10V2z" />
                        <path d="M12 12a10 10 0 0 0 0 20V12z" />
                    </svg>
                    <span class="artifact-label">Roster</span>
                </div>

                <!-- Battle -->
                <div class="artifact-card" onclick="interact('Battle')">
                    <svg class="artifact-icon" viewBox="0 0 24 24">
                        <path d="M12 2l3 6h6l-5 4 2 6-6-4-6 4 2-6-5-4h6z" />
                    </svg>
                    <span class="artifact-label">Battle</span>
                </div>

                <!-- Grind -->
                <div class="artifact-card" onclick="interact('Grind')">
                    <svg class="artifact-icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9" stroke-dasharray="4 2" />
                        <path d="M12 7v5l3 3" />
                    </svg>
                    <span class="artifact-label">Grind</span>
                </div>
            </div>

        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline Mode
        </footer>
    </div>

<script>
    // --- Background Particle System ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.vx = (Math.random() - 0.5) * 0.3;
            this.vy = -(Math.random() * 1 + 0.2); // Move upwards slowly
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.5;
            this.life = Math.random() * 0.5 + 0.5;
            // Cyan or faint white
            this.color = Math.random() > 0.9 ? '255, 255, 255' : '79, 209, 197'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.001; // Fade out very slowly

            if (this.alpha <= 0 || this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // Fewer particles for a cleaner, more atmospheric look
        const count = Math.floor((width * height) / 25000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        // Simple click feedback
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.98)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
