<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette: Deep Mystical */
        --bg-deep: #040406;
        --bg-panel: #0b0c10;
        
        /* Accents */
        --gold-primary: #d4af37;
        --gold-glow: #ffea70;
        --gold-dim: #8a6e18;
        
        --mystic-blue: #4fd1c5;
        --mystic-dim: #2d6a63;
        
        /* Text */
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        
        /* Typography */
        --font-serif: 'Cinzel', 'Times New Roman', 'Palatino Linotype', serif;
        --font-sans: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-sans);
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    /* --- Layered Background System --- */
    
    /* 1. Base Gradient */
    .bg-base {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 30%, #1a2530 0%, #050508 80%);
        z-index: 0;
    }

    /* 2. Ethereal Glow Behind Title */
    .hero-glow {
        position: absolute;
        top: 15%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 60vw;
        height: 60vw;
        max-width: 800px;
        max-height: 800px;
        background: radial-gradient(circle, rgba(79, 209, 197, 0.12) 0%, rgba(79, 209, 197, 0.02) 40%, transparent 70%);
        pointer-events: none;
        z-index: 1;
    }

    /* 3. Geometric Rune Pattern (CSS Generated) */
    .rune-pattern {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 60px 60px;
        opacity: 0.4;
        mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        z-index: 1;
        pointer-events: none;
    }

    /* 4. Particle Canvas */
    #canvas-bg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 2;
        opacity: 0.6;
        pointer-events: none;
    }

    /* 5. Vignette */
    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, transparent 50%, var(--bg-deep) 100%);
        z-index: 3;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1100px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem;
    }

    /* --- Header & Currency --- */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 1rem;
    }

    /* Critique Fix: Polished Currency Plate */
    .currency-plate {
        background: linear-gradient(135deg, rgba(20, 20, 25, 0.9), rgba(10, 10, 15, 0.95));
        border: 1px solid var(--gold-dim);
        border-radius: 50px; /* Pill shape */
        padding: 0.4rem 0.4rem 0.4rem 1.2rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 
            0 4px 15px rgba(0,0,0,0.5), 
            inset 0 1px 0 rgba(255,255,255,0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .currency-plate:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(212, 175, 55, 0.15), inset 0 1px 0 rgba(255,255,255,0.15);
        border-color: var(--gold-primary);
    }

    .coin-wrapper {
        width: 36px;
        height: 36px;
        background: radial-gradient(circle at 30% 30%, var(--gold-glow), var(--gold-primary), var(--gold-dim));
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        position: relative;
    }

    .coin-wrapper svg {
        width: 20px;
        height: 20px;
        fill: #3e2c00;
        stroke: #3e2c00;
    }

    .currency-value {
        font-family: var(--font-sans); /* Clean Sans-Serif */
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-glow);
        letter-spacing: 0.5px;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        min-width: 60px;
        text-align: right;
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        margin-bottom: 2rem;
        position: relative;
        height: 280px;
    }

    /* Sigils */
    .sigil-container {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 400px; height: 400px;
        opacity: 0.25;
        pointer-events: none;
    }

    .sigil-ring {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        border: 1px solid var(--mystic-blue);
        border-radius: 50%;
        box-shadow: 0 0 15px rgba(79, 209, 197, 0.1);
    }
    .ring-1 { animation: spin 40s linear infinite; border-style: dashed; }
    .ring-2 { width: 80%; height: 80%; top: 10%; left: 10%; animation: spin-reverse 30s linear infinite; border-color: rgba(79, 209, 197, 0.5); }
    .ring-3 { width: 60%; height: 60%; top: 20%; left: 20%; animation: spin 20s linear infinite; border-width: 2px; }

    /* Typography Standardization: Serif for Titles */
    .game-title {
        font-family: var(--font-serif);
        font-size: 4.5rem;
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 0.5rem;
        background: linear-gradient(to bottom, var(--gold-glow), var(--gold-primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.8));
        z-index: 2;
    }

    .game-subtitle {
        font-family: var(--font-sans);
        font-size: 0.9rem;
        color: var(--mystic-blue);
        letter-spacing: 0.4em;
        text-transform: uppercase;
        opacity: 0.9;
        text-shadow: 0 0 10px rgba(79, 209, 197, 0.4);
        z-index: 2;
    }

    /* --- Menu Grid (Unified System) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        flex-grow: 1;
        max-height: 450px;
    }

    /* Base Card Style */
    .menu-card {
        position: relative;
        background: rgba(15, 16, 20, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        overflow: hidden;
    }

    /* Standard Card Hover */
    .menu-card:hover {
        transform: translateY(-5px);
        background: rgba(25, 26, 30, 0.8);
        box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    }

    /* --- Hierarchy: Summon (Hero) Card --- */
    .card-summon {
        /* Gold Border & Glow */
        border: 1px solid var(--gold-primary);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.15), inset 0 0 20px rgba(212, 175, 55, 0.05);
    }

    .card-summon:hover {
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.3), inset 0 0 30px rgba(212, 175, 55, 0.1);
        border-color: var(--gold-glow);
    }

    /* Decorative corner accents for Summon */
    .card-summon::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border: 1px solid transparent;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 20%) no-repeat;
        pointer-events: none;
    }

    /* --- Hierarchy: Secondary Cards --- */
    .card-secondary {
        border-color: rgba(45, 106, 99, 0.4); /* Muted Teal */
    }

    .card-secondary:hover {
        border-color: var(--mystic-blue);
        box-shadow: 0 10px 25px rgba(0,0,0,0.3), 0 0 15px rgba(79, 209, 197, 0.1);
    }

    /* --- Card Content --- */
    
    /* Icons */
    .card-icon {
        width: 48px;
        height: 48px;
        transition: transform 0.4s ease;
    }
    
    .menu-card:hover .card-icon {
        transform: scale(1.1);
    }

    /* Summon specific icon styling */
    .card-summon .card-icon {
        width: 64px;
        height: 64px;
        fill: var(--gold-glow);
        filter: drop-shadow(0 0 8px var(--gold-dim));
        animation: float 4s ease-in-out infinite;
    }

    /* Secondary icon styling */
    .card-secondary .card-icon {
        fill: none;
        stroke: var(--mystic-blue);
        stroke-width: 1.5;
        filter: drop-shadow(0 0 5px rgba(79, 209, 197, 0.3));
    }
    
    .card-secondary:hover .card-icon {
        stroke: var(--text-main);
        filter: drop-shadow(0 0 8px var(--mystic-blue));
    }

    /* Text Styles */
    .card-title {
        font-family: var(--font-serif); /* Unified Serif */
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: var(--text-main);
        text-transform: uppercase;
    }

    .card-summon .card-title {
        color: var(--gold-glow);
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .card-subtitle {
        font-family: var(--font-sans); /* Unified Sans */
        font-size: 0.8rem;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-top: -0.5rem;
    }

    .card-summon .card-subtitle {
        color: #e0c878;
    }

    /* --- Footer --- */
    footer {
        position: absolute;
        bottom: 1.5rem;
        width: 100%;
        text-align: center;
        color: var(--text-muted);
        font-family: var(--font-sans);
        font-size: 0.7rem;
        opacity: 0.4;
        pointer-events: none;
        letter-spacing: 0.1em;
    }

    /* --- Animations --- */
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    @keyframes float { 
        0%, 100% { transform: translateY(0); } 
        50% { transform: translateY(-6px); } 
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 3rem; }
        .hero-section { height: 220px; }
        .sigil-container { width: 300px; height: 300px; }
        
        .menu-grid {
            grid-template-columns: 1fr;
            max-height: none;
            gap: 1rem;
        }
        
        .menu-card {
            flex-direction: row;
            justify-content: flex-start;
            padding: 0 2rem;
            height: 80px;
        }

        .card-icon { width: 32px; height: 32px; }
        .card-summon .card-icon { width: 40px; height: 40px; }
        
        .card-title { font-size: 1.2rem; margin-bottom: 0; }
        .card-subtitle { display: none; } /* Hide subtitle on mobile for cleaner look */
    }
</style>
</head>
<body>

    <!-- Background Layers -->
    <div class="bg-base"></div>
    <div class="hero-glow"></div>
    <div class="rune-pattern"></div>
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="app-container">
        
        <!-- Header -->
        <header>
            <!-- Polished Currency Indicator -->
            <div class="currency-plate">
                <div class="currency-value">12,450</div>
                <div class="coin-wrapper">
                    <!-- Coin Icon -->
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1"/>
                        <path d="M12 7v10M9 10h6M9 14h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>
        </header>

        <!-- Hero: The Summoning Circle -->
        <section class="hero-section">
            <!-- Rotating Sigils -->
            <div class="sigil-container">
                <div class="sigil-ring ring-1"></div>
                <div class="sigil-ring ring-2"></div>
                <div class="sigil-ring ring-3"></div>
            </div>

            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>
        </section>

        <!-- Unified 2x2 Menu Grid -->
        <nav class="menu-grid">
            
            <!-- Primary: Summon (Hero Styling) -->
            <div class="menu-card card-summon" onclick="interact('Summon')">
                <!-- Summon Icon -->
                <svg class="card-icon" viewBox="0 0 100 100">
                    <path d="M50 10 L90 90 H10 Z" stroke="currentColor" stroke-width="2" fill="none" opacity="0.5"/>
                    <circle cx="50" cy="55" r="15" fill="currentColor"/>
                    <path d="M50 10 L50 25 M20 80 L35 65 M80 80 L65 65" stroke="currentColor" stroke-width="2"/>
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Conjure Spirit</div>
            </div>

            <!-- Secondary: Roster -->
            <div class="menu-card card-secondary" onclick="interact('Roster')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2a10 10 0 0 1 10 10h-10V2z" />
                    <path d="M12 12a10 10 0 0 1 0 20V12z" />
                    <path d="M12 2a10 10 0 0 0-10 10h10V2z" />
                    <path d="M12 12a10 10 0 0 0 0 20V12z" />
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Spirit Collection</div>
            </div>

            <!-- Secondary: Battle -->
            <div class="menu-card card-secondary" onclick="interact('Battle')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M12 2l3 6h6l-5 4 2 6-6-4-6 4 2-6-5-4h6z" />
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena & Raids</div>
            </div>

            <!-- Secondary: Grind -->
            <div class="menu-card card-secondary" onclick="interact('Grind')">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke-dasharray="4 2" />
                    <path d="M12 7v5l3 3" />
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>

        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline Mode
        </footer>
    </div>

<script>
    // --- Background Particle System ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.vx = (Math.random() - 0.5) * 0.2;
            this.vy = -(Math.random() * 0.8 + 0.1); 
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.5;
            this.life = Math.random() * 0.5 + 0.5;
            // Mix of Gold and Cyan for atmosphere
            this.color = Math.random() > 0.8 ? '212, 175, 55' : '79, 209, 197'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.001; 

            if (this.alpha <= 0 || this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 20000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        // Simple click feedback
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.97)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
