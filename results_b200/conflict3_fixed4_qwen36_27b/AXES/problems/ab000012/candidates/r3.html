<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette: Deep Mystical Teal */
        --bg-deep: #020608;
        --bg-panel: #050a0c;
        
        /* Accents */
        --teal-primary: #2dd4bf; /* Teal-400 */
        --teal-dark: #0f766e;    /* Teal-700 */
        --teal-glow: rgba(45, 212, 191, 0.4);
        
        --gold-primary: #d4af37;
        --gold-dim: #85681f;
        
        /* Text */
        --text-main: #f0f9ff;
        --text-muted: #94a3b8;
        
        /* Typography */
        --font-serif: 'Cinzel', 'Times New Roman', 'Palatino Linotype', serif;
        --font-sans: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-sans);
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    /* --- Layered Background System --- */
    
    /* 1. Base Gradient: Deep Dark Teal to Black */
    .bg-base {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 30%, #0a2a2a 0%, #020608 80%);
        z-index: 0;
    }

    /* 2. Ethereal Glow / Mystical Fog */
    .hero-glow {
        position: absolute;
        top: 10%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 80vw;
        height: 60vh;
        max-width: 1000px;
        max-height: 600px;
        background: radial-gradient(circle, rgba(45, 212, 191, 0.08) 0%, rgba(45, 212, 191, 0.02) 40%, transparent 70%);
        filter: blur(40px);
        pointer-events: none;
        z-index: 1;
        animation: pulse-glow 8s ease-in-out infinite alternate;
    }

    /* 3. Noise Texture (CSS Generated) */
    .noise-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.04;
        z-index: 2;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* 4. Particle Canvas */
    #canvas-bg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 3;
        opacity: 0.7;
        pointer-events: none;
    }

    /* 5. Vignette */
    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, transparent 40%, var(--bg-deep) 100%);
        z-index: 4;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1100px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem;
    }

    /* --- Header & Currency --- */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 1rem;
    }

    .currency-plate {
        background: linear-gradient(135deg, rgba(20, 20, 25, 0.8), rgba(10, 10, 15, 0.9));
        border: 1px solid var(--gold-dim);
        border-radius: 50px;
        padding: 0.4rem 0.4rem 0.4rem 1.2rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .currency-plate:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(212, 175, 55, 0.15);
        border-color: var(--gold-primary);
    }

    .currency-value {
        font-family: var(--font-sans);
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--gold-primary);
        letter-spacing: 0.5px;
        min-width: 60px;
        text-align: right;
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        margin-bottom: 3rem;
        position: relative;
        height: 260px;
    }

    /* Typography Standardization */
    .game-title {
        font-family: var(--font-serif);
        font-size: 4.5rem;
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 0.5rem;
        /* Gold Gradient Text */
        background: linear-gradient(to bottom, #ffea70, #d4af37);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.8));
        z-index: 2;
    }

    /* CRITIQUE FIX: Muted Subtitle */
    .game-subtitle {
        font-family: var(--font-sans);
        font-size: 0.9rem;
        color: var(--text-main);
        letter-spacing: 0.4em;
        text-transform: uppercase;
        opacity: 0.4; /* Reduced opacity */
        font-weight: 300; /* Reduced weight */
        z-index: 2;
    }

    /* --- Menu Grid (Unified System) --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        flex-grow: 1;
        max-height: 480px;
    }

    /* Base Card Style: Unified Dark Matte */
    .menu-card {
        position: relative;
        background: rgba(10, 15, 18, 0.6); /* Darker, matte base */
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 12px;
        /* CRITIQUE FIX: Unified Teal Border */
        border: 1px solid rgba(45, 212, 191, 0.2); 
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        overflow: hidden;
    }

    /* Standard Card Hover */
    .menu-card:hover {
        transform: translateY(-5px);
        background: rgba(15, 25, 28, 0.8);
        border-color: var(--teal-primary); /* Teal border on hover */
        box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 15px rgba(45, 212, 191, 0.15);
    }

    /* CRITIQUE FIX: No special styling for Summon card, it is unified now */
    .card-summon {
        /* Inherits base styles */
    }

    /* --- Card Content --- */
    
    /* Icons */
    .card-icon {
        width: 48px;
        height: 48px;
        transition: transform 0.4s ease;
    }
    
    .menu-card:hover .card-icon {
        transform: scale(1.1);
    }

    /* CRITIQUE FIX: Unified Iconography (Solid Teal) */
    .menu-card .card-icon {
        fill: var(--teal-primary); /* Solid fill */
        stroke: none;
        filter: drop-shadow(0 0 8px var(--teal-dark));
    }
    
    /* Hover Icon Effect */
    .menu-card:hover .card-icon {
        fill: #fff;
        filter: drop-shadow(0 0 12px var(--teal-primary));
    }

    /* Text Styles */
    .card-title {
        font-family: var(--font-serif);
        font-size: 1.4rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: var(--text-main);
        text-transform: uppercase;
    }

    /* CRITIQUE FIX: Muted Subtitles */
    .card-subtitle {
        font-family: var(--font-sans);
        font-size: 0.75rem;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.5;
        margin-top: -0.2rem;
    }

    /* --- Footer --- */
    footer {
        position: absolute;
        bottom: 1.5rem;
        width: 100%;
        text-align: center;
        color: var(--text-muted);
        font-family: var(--font-sans);
        font-size: 0.7rem;
        opacity: 0.3;
        pointer-events: none;
        letter-spacing: 0.1em;
    }

    /* --- Animations --- */
    @keyframes pulse-glow {
        0% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.05); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 3rem; }
        .hero-section { height: 200px; }
        
        .menu-grid {
            grid-template-columns: 1fr;
            max-height: none;
            gap: 1rem;
        }
        
        .menu-card {
            flex-direction: row;
            justify-content: flex-start;
            padding: 0 2rem;
            height: 70px;
        }

        .card-icon { width: 32px; height: 32px; }
        
        .card-title { font-size: 1.2rem; margin-bottom: 0; }
        .card-subtitle { display: none; }
    }
</style>
</head>
<body>

    <!-- Background Layers -->
    <div class="bg-base"></div>
    <div class="hero-glow"></div>
    <div class="noise-overlay"></div>
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="app-container">
        
        <!-- Header -->
        <header>
            <!-- Polished Currency Indicator -->
            <div class="currency-plate">
                <div class="currency-value">12,450</div>
                <div class="coin-wrapper" style="width: 32px; height: 32px; background: radial-gradient(circle at 30% 30%, #ffea70, #d4af37, #85681f); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.4);">
                    <!-- Coin Icon -->
                    <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: #3e2c00;">
                        <circle cx="12" cy="12" r="8" fill="none" stroke="#3e2c00" stroke-width="1.5"/>
                        <path d="M12 8v8M9 11h6" stroke="#3e2c00" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>
        </header>

        <!-- Hero: The Summoning Circle -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>
        </section>

        <!-- Unified 2x2 Menu Grid -->
        <nav class="menu-grid">
            
            <!-- Primary: Summon (Now Unified) -->
            <div class="menu-card card-summon" onclick="interact('Summon')">
                <!-- CRITIQUE FIX: Solid Teal Glyph -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Stylized Eye/Spirit Glyph -->
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
                <div class="card-title">Summon</div>
                <div class="card-subtitle">Conjure Spirit</div>
            </div>

            <!-- Secondary: Roster -->
            <div class="menu-card" onclick="interact('Roster')">
                <!-- CRITIQUE FIX: Solid Teal Glyph -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Stylized Cards/Deck Glyph -->
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/>
                    <path d="M7 7h4v4H7z"/>
                    <path d="M13 7h4v4h-4z"/>
                    <path d="M7 13h4v4H7z"/>
                    <path d="M13 13h4v4h-4z"/>
                </svg>
                <div class="card-title">Roster</div>
                <div class="card-subtitle">Collection</div>
            </div>

            <!-- Secondary: Battle -->
            <div class="menu-card" onclick="interact('Battle')">
                <!-- CRITIQUE FIX: Solid Teal Glyph -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Stylized Sword Glyph -->
                    <path d="M6 2l12 12-2 2-4-4-4 4-2-2 4-4-4-4z"/>
                    <path d="M2 22l4-4" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
                <div class="card-title">Battle</div>
                <div class="card-subtitle">Arena & Raids</div>
            </div>

            <!-- Secondary: Grind -->
            <div class="menu-card" onclick="interact('Grind')">
                <!-- CRITIQUE FIX: Solid Teal Glyph -->
                <svg class="card-icon" viewBox="0 0 24 24">
                    <!-- Stylized Pickaxe/Resource Glyph -->
                    <path d="M14.7 13.3L12 16l-2.7-2.7 4.2-4.2 1.2 1.2zM7 17l-4 4 1.4 1.4 4-4L7 17zm14-14l-4 4 1.4 1.4 4-4L21 3zM7.3 6.3L11 10l-1.4 1.4-3.7-3.7L7.3 6.3z"/>
                </svg>
                <div class="card-title">Grind</div>
                <div class="card-subtitle">Resources</div>
            </div>

        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline Mode
        </footer>
    </div>

<script>
    // --- Background Particle System ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.vx = (Math.random() - 0.5) * 0.2;
            this.vy = -(Math.random() * 0.8 + 0.1); 
            this.size = Math.random() * 1.5;
            this.alpha = Math.random() * 0.5;
            this.life = Math.random() * 0.5 + 0.5;
            // CRITIQUE FIX: Mostly Teal, occasional Gold
            this.color = Math.random() > 0.9 ? '212, 175, 55' : '45, 212, 191'; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.001; 

            if (this.alpha <= 0 || this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 15000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        // Simple click feedback
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.97)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
