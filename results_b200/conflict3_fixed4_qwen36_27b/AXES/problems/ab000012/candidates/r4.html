<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette: Deep Void & Gold */
        --bg-deep: #030304;
        --bg-panel: #0a0a0c;
        
        /* Accents: Unified Gold/Amber */
        --gold-primary: #d4af37;
        --gold-light: #f3e5ab;
        --gold-dark: #6b5215;
        --gold-dim: #3d3110;
        --gold-glow: rgba(212, 175, 55, 0.4);
        
        /* Text */
        --text-main: #f0f0f0;
        --text-muted: #888890;
        
        /* Typography */
        --font-serif: 'Cinzel', 'Times New Roman', 'Palatino Linotype', serif;
        --font-sans: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-sans);
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    /* --- Background System --- */
    
    /* 1. Base Void */
    .bg-base {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 30%, #101014 0%, #000000 100%);
        z-index: 0;
    }

    /* 2. The Spirit Eye / Rune Focal Point (Behind Title) */
    .spirit-eye {
        position: absolute;
        top: 15%;
        left: 50%;
        transform: translateX(-50%);
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(107, 82, 21, 0.05) 30%, transparent 60%);
        filter: blur(30px);
        pointer-events: none;
        z-index: 1;
        animation: breathe 6s ease-in-out infinite alternate;
    }
    
    /* 3. Noise Texture */
    .noise-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0.07;
        z-index: 2;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* 4. Particle Canvas */
    #canvas-bg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 3;
        opacity: 0.8;
        pointer-events: none;
    }

    /* 5. Vignette */
    .vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, transparent 30%, #000000 100%);
        z-index: 4;
        pointer-events: none;
    }

    /* --- Main Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1000px;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 2rem;
        justify-content: space-between;
    }

    /* --- Header & Currency --- */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
    }

    .currency-plate {
        background: linear-gradient(135deg, rgba(20, 20, 20, 0.9), rgba(10, 10, 10, 0.95));
        border: 1px solid var(--gold-dim);
        border-radius: 4px;
        padding: 0.5rem 0.5rem 0.5rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        transition: all 0.3s ease;
    }

    .currency-plate:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 4px 20px rgba(0,0,0,0.8), 0 0 10px var(--gold-glow);
    }

    .currency-value {
        font-family: var(--font-sans);
        font-weight: 700;
        font-size: 1.2rem;
        color: var(--gold-light);
        letter-spacing: 0.5px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        min-width: 60px;
        text-align: right;
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        margin-top: 2rem;
        margin-bottom: 2rem;
        position: relative;
    }

    .game-title {
        font-family: var(--font-serif);
        font-size: 5rem;
        line-height: 0.9;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.5rem;
        /* Metallic Gold Gradient */
        background: linear-gradient(to bottom, #fff 10%, #d4af37 60%, #85681f 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 1));
        z-index: 2;
    }

    .game-subtitle {
        font-family: var(--font-sans);
        font-size: 0.9rem;
        color: var(--gold-primary);
        letter-spacing: 0.5em;
        text-transform: uppercase;
        opacity: 0.8;
        font-weight: 400;
        z-index: 2;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    /* --- Menu Layout (Broken Grid) --- */
    .menu-container {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        flex-grow: 1;
    }

    /* Primary Row: Summon */
    .row-primary {
        width: 100%;
    }

    /* Secondary Row: Roster, Battle, Grind */
    .row-secondary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
        width: 100%;
    }

    /* --- Card Design (Crafted Artifacts) --- */
    .menu-card {
        position: relative;
        background: linear-gradient(180deg, rgba(20, 20, 22, 0.7) 0%, rgba(10, 10, 12, 0.8) 100%);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-radius: 4px;
        
        /* The "Artifact" Border & Glow */
        border: 1px solid var(--gold-dim);
        box-shadow: 
            inset 0 0 20px rgba(0,0,0,0.8), 
            0 10px 30px rgba(0,0,0,0.5);
        
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        overflow: hidden;
    }

    /* Summon Card Specifics (Wider) */
    .card-summon {
        height: 180px;
        border: 1px solid var(--gold-dark);
        background: linear-gradient(135deg, rgba(30, 25, 15, 0.6) 0%, rgba(10, 10, 12, 0.8) 100%);
    }

    /* Secondary Cards Specifics */
    .card-secondary {
        height: 160px;
    }

    /* Hover States */
    .menu-card:hover {
        transform: translateY(-4px);
        border-color: var(--gold-primary);
        box-shadow: 
            inset 0 0 25px rgba(212, 175, 55, 0.1), 
            0 15px 40px rgba(0,0,0,0.6),
            0 0 15px rgba(212, 175, 55, 0.2);
    }

    /* Card Content */
    .card-icon {
        width: 56px;
        height: 56px;
        margin-bottom: 1rem;
        transition: all 0.4s ease;
    }
    
    /* Unified Gold Iconography */
    .menu-card .card-icon {
        fill: none;
        stroke: var(--gold-primary);
        stroke-width: 1.5;
        filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.3));
    }
    
    .menu-card:hover .card-icon {
        stroke: #fff;
        filter: drop-shadow(0 0 10px var(--gold-primary));
        transform: scale(1.05);
    }

    /* Typography on Cards */
    .card-title {
        font-family: var(--font-serif);
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--gold-light);
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        transition: color 0.3s ease;
    }

    .card-subtitle {
        font-family: var(--font-sans);
        font-size: 0.7rem;
        color: var(--text-muted);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-top: 0.3rem;
        opacity: 0.7;
    }

    .menu-card:hover .card-title {
        color: #fff;
    }

    /* --- Footer --- */
    footer {
        width: 100%;
        text-align: center;
        color: var(--text-muted);
        font-family: var(--font-sans);
        font-size: 0.7rem;
        opacity: 0.3;
        letter-spacing: 0.1em;
        margin-top: 1rem;
    }

    /* --- Animations --- */
    @keyframes breathe {
        0% { opacity: 0.6; transform: translateX(-50%) scale(0.95); }
        100% { opacity: 0.9; transform: translateX(-50%) scale(1.05); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .game-title { font-size: 3.5rem; }
        
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
        }

        .row-secondary {
            grid-template-columns: 1fr; /* Stack on mobile */
            width: 100%;
        }

        .card-summon, .card-secondary {
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            padding: 0 2rem;
            height: 80px;
            width: 100%;
        }

        .card-icon {
            width: 36px;
            height: 36px;
            margin-bottom: 0;
            margin-right: 1.5rem;
        }

        .card-title { font-size: 1.2rem; margin: 0; }
        .card-subtitle { display: none; }
    }
</style>
</head>
<body>

    <!-- Background Layers -->
    <div class="bg-base"></div>
    <div class="spirit-eye"></div> <!-- The Focal Point -->
    <div class="noise-overlay"></div>
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <div class="app-container">
        
        <!-- Header -->
        <header>
            <div class="currency-plate">
                <div class="currency-value">12,450</div>
                <div class="coin-wrapper" style="width: 32px; height: 32px; background: radial-gradient(circle at 30% 30%, #ffea70, #d4af37, #6b5215); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.6); border: 1px solid #85681f;">
                    <!-- Coin Icon -->
                    <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: #3e2c00;">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.86 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z"/>
                    </svg>
                </div>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>
        </section>

        <!-- Menu: Broken Grid -->
        <nav class="menu-container">
            
            <!-- Primary: Summon -->
            <div class="row-primary">
                <div class="menu-card card-summon" onclick="interact('Summon')">
                    <!-- Eye/Spirit Glyph -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="12" cy="12" r="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 12v.01" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <div class="card-title">Summon</div>
                    <div class="card-subtitle">Conjure Spirit</div>
                </div>
            </div>

            <!-- Secondary: Roster, Battle, Grind -->
            <div class="row-secondary">
                
                <div class="menu-card card-secondary" onclick="interact('Roster')">
                    <!-- Cards/Deck Glyph -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <rect x="4" y="4" width="16" height="16" rx="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9 9h6v6H9z" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9 1v3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M15 1v3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9 20v3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M15 20v3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <div class="card-title">Roster</div>
                    <div class="card-subtitle">Collection</div>
                </div>

                <div class="menu-card card-secondary" onclick="interact('Battle')">
                    <!-- Sword Glyph -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M14.5 17.5L3 6V3h3l11.5 11.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M13 19l6-6" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 16l4 4" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M19 21l2-2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <div class="card-title">Battle</div>
                    <div class="card-subtitle">Arena</div>
                </div>

                <div class="menu-card card-secondary" onclick="interact('Grind')">
                    <!-- Pickaxe/Resource Glyph -->
                    <svg class="card-icon" viewBox="0 0 24 24">
                        <path d="M14.7 13.3L12 16l-2.7-2.7 4.2-4.2 1.2 1.2z" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7 17l-4 4 1.4 1.4 4-4L7 17z" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M14 10l7-7" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <div class="card-title">Grind</div>
                    <div class="card-subtitle">Resources</div>
                </div>

            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 &bull; Offline Mode
        </footer>
    </div>

<script>
    // --- Background Particle System (Gold Dust) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.vx = (Math.random() - 0.5) * 0.2;
            this.vy = -(Math.random() * 0.5 + 0.1); // Slow rise
            this.size = Math.random() * 1.5 + 0.5;
            this.alpha = 0;
            this.maxAlpha = Math.random() * 0.6 + 0.2;
            this.fadeIn = true;
            
            // Unified Gold/Amber Palette for particles
            const colors = [
                '212, 175, 55', // Gold
                '243, 229, 171', // Light Gold
                '255, 255, 255'  // White spark
            ];
            this.color = colors[Math.floor(Math.random() * colors.length)];
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            // Fade in and out
            if (this.fadeIn) {
                this.alpha += 0.005;
                if (this.alpha >= this.maxAlpha) this.fadeIn = false;
            } else {
                this.alpha -= 0.002;
            }

            if (this.alpha <= 0 || this.y < -10) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((width * height) / 12000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        // Simple click feedback
        const btn = event.currentTarget;
        btn.style.transform = 'scale(0.98)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 150);
        
        // Optional: Create a burst of particles at click location
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
