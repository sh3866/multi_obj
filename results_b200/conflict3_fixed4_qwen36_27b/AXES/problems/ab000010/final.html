<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Life Simulation</title>
<style>
  :root {
    --bg-color: #030305;
    --panel-bg: rgba(12, 12, 16, 0.75);
    --panel-border: rgba(255, 255, 255, 0.1);
    --accent: #ffffff;
    --text-main: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.4);
    --radius: 8px; /* Unified Geometry */
    --font-stack: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  /* Canvas Container */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Overlay Layer */
  #ui-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3rem;
  }

  /* Top Area */
  .top-area {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
  }

  /* Header */
  .header {
    pointer-events: auto;
    margin-top: -1rem; /* Visual alignment */
  }

  h1 {
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    margin-bottom: 0.5rem;
    color: #fff;
    text-shadow: 0 0 30px rgba(255,255,255,0.1);
  }

  .subtitle {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .subtitle::before {
    content: '';
    display: block;
    width: 6px;
    height: 6px;
    background-color: #00ff88;
    border-radius: 50%;
    box-shadow: 0 0 10px #00ff88;
  }

  /* Control Panel */
  .panel {
    pointer-events: auto;
    width: 260px;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius); /* Unified Radius */
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .panel-label {
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 0.25rem;
  }

  /* Stats */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.25rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .stat-row:last-child { border-bottom: none; }
  
  .stat-name {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  .stat-value {
    font-size: 0.9rem;
    font-weight: 600;
    color: #fff;
    font-variant-numeric: tabular-nums;
    font-family: 'SF Mono', 'Roboto Mono', monospace, var(--font-stack);
  }

  /* Sliders */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    outline: none;
    border-radius: 2px;
    transition: background 0.2s;
  }
  input[type=range]:hover { background: rgba(255,255,255,0.2); }
  
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    background: #fff;
    cursor: pointer;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
  }

  /* Buttons - Unified Ghost Style */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  
  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 0.75rem 0.5rem;
    border-radius: var(--radius); /* Unified Radius */
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: var(--font-stack);
    outline: none;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.4);
    transform: translateY(-1px);
  }
  
  button:active {
    transform: translateY(0);
    background: rgba(255,255,255,0.15);
  }

  /* Active/Pause Button State */
  button.active {
    background: #fff;
    color: #000;
    border-color: #fff;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
  }
  button.active:hover {
    background: #f0f0f0;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    opacity: 0.7;
    pointer-events: none;
    font-weight: 500;
  }

  .footer::before, .footer::after {
    content: '';
    display: block;
    width: 30px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  }

</style>
</head>
<body>

  <!-- Canvas for the Sphere -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <div class="top-area">
      <!-- Header -->
      <div class="header">
        <h1>Conway Sphere</h1>
        <div class="subtitle">Algorithmic Life Simulation</div>
      </div>

      <!-- Control Panel -->
      <div class="panel">
        <div class="panel-section">
          <div class="panel-label">Telemetry</div>
          <div class="stat-row">
            <span class="stat-name">Generation</span>
            <span class="stat-value" id="gen-count">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-name">Population</span>
            <span class="stat-value" id="pop-count">0</span>
          </div>
        </div>

        <div class="panel-section">
          <div class="panel-label">Simulation Speed</div>
          <input type="range" id="speed-slider" min="1" max="60" value="30">
        </div>

        <div class="panel-section">
          <div class="panel-label">Controls</div>
          <div class="btn-group">
            <!-- Ghost Style for Pause/Resume -->
            <button id="btn-pause" class="active">Pause</button>
            <!-- Ghost Style for Randomize (Critique #4) -->
            <button id="btn-reset">Randomize</button>
          </div>
          <button id="btn-step" style="width: 100%; margin-top: 0.5rem;">Step Once</button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      Drag to Rotate &bull; Scroll to Zoom
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life - Design Revision
 * 
 * Changes Applied:
 * 1. DENSITY: Grid resolution increased significantly. Logic ensures 10k+ cells.
 * 2. DEPTH: Added Z-based opacity/size attenuation and a rim-light atmosphere.
 * 3. TYPOGRAPHY: Unified fonts and border-radius (8px).
 * 4. HIERARCHY: Buttons are Ghost style by default; Active states are solid.
 */

// --- Configuration ---
const CONFIG = {
  // Increased resolution for density (approx 200x400 = 80,000 cells)
  // 120x240 = 28,800 cells is a sweet spot for performance vs density
  gridRes: 120, 
  sphereRadius: 250,
  cellBaseSize: 1.8, // Smaller base size, scaled by depth
  rotationSpeed: 0.002,
  // Cyberpunk/Bioluminescent Palette
  colorSpectrum: {
    start: 160, // Cyan/Teal
    end: 320    // Magenta/Purple
  }
};

// --- State ---
let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 30,
  lastFrameTime: 0,
  rotation: { x: 0.3, y: 0.5 },
  zoom: 1,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  distSq: (v1, v2) => (v1.x-v2.x)**2 + (v1.y-v2.y)**2 + (v1.z-v2.z)**2
};

// --- Grid Generation (Latitude/Longitude) ---
function createGridPoints(res, radius) {
  const points = [];
  const latSteps = res; 
  // Longitude steps double to maintain aspect ratio
  const lonSteps = res * 2; 

  for (let i = 1; i < latSteps; i++) {
    const phi = Math.PI * i / latSteps; 
    
    for (let j = 0; j < lonSteps; j++) {
      const theta = 2 * Math.PI * j / lonSteps;
      
      // Spherical Coordinates to Cartesian
      const x = radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.cos(phi);
      const z = radius * Math.sin(phi) * Math.sin(theta);
      
      points.push({ x, y, z });
    }
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createGridPoints(CONFIG.gridRes, CONFIG.sphereRadius);
  
  const cellCount = points.length;
  
  // Determine neighbor radius based on grid density
  // With higher res, points are closer. 
  // We use a fixed threshold distance to find neighbors.
  const threshold = (2 * Math.PI * CONFIG.sphereRadius) / (CONFIG.gridRes * 2.2);
  const thresholdSq = threshold * threshold;

  state.cells = points.map((p, i) => {
    return {
      pos: p,
      neighbors: [],
      // Critique #1: 45% density for immediate life
      alive: Math.random() > 0.55, 
      age: Math.floor(Math.random() * 50), 
      bornGen: 0
    };
  });

  // Neighbor Calculation (Optimized: Only check nearby indices in grid structure if possible, 
  // but for sphere brute force is safest for topology. 
  // Optimization: Only check forward j to avoid duplicates)
  for (let i = 0; i < cellCount; i++) {
    for (let j = i + 1; j < cellCount; j++) {
      const dSq = Vec3.distSq(points[i], points[j]);
      if (dSq < thresholdSq) {
        state.cells[i].neighbors.push(j);
        state.cells[j].neighbors.push(i);
      }
    }
  }

  state.generation = 0;
  updateStats();
}

function stepGame() {
  const cells = state.cells;
  const len = cells.length;
  
  for (let i = 0; i < len; i++) {
    const cell = cells[i];
    
    let neighborsAlive = 0;
    const nLen = cell.neighbors.length;
    for (let k = 0; k < nLen; k++) {
      if (cells[cell.neighbors[k]].alive) neighborsAlive++;
    }
    
    // Standard Conway Rules
    if (cell.alive) {
      if (neighborsAlive < 2 || neighborsAlive > 3) {
        cell.alive = false;
        cell.age = 0;
      } else {
        cell.age++;
      }
    } else {
      if (neighborsAlive === 3) {
        cell.alive = true;
        cell.age = 1;
        cell.bornGen = state.generation;
      }
    }
  }
  
  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  const fov = 900 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // Clear with deep dark background
  ctx.fillStyle = '#030305';
  ctx.fillRect(0, 0, width, height);

  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;

  // --- ATMOSPHERE / RIM LIGHT (Critique #2) ---
  // Inner Glow
  const gradInner = ctx.createRadialGradient(cx, cy, r * 0.4, cx, cy, r * 1.1);
  gradInner.addColorStop(0, 'rgba(10, 10, 20, 0)');
  gradInner.addColorStop(0.8, 'rgba(20, 30, 60, 0.1)');
  gradInner.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = gradInner;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.1, 0, Math.PI * 2);
  ctx.fill();

  // Outer Halo (Faint)
  const gradOuter = ctx.createRadialGradient(cx, cy, r, cx, cy, r * 2.5);
  gradOuter.addColorStop(0, 'rgba(60, 60, 100, 0.1)');
  gradOuter.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = gradOuter;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Project & Sort
  const projectedCells = state.cells.map(cell => {
    return { cell, proj: project(cell.pos, state.rotation.x, state.rotation.y, state.zoom) };
  });
  
  // Sort by Z (Painter's Algorithm) - Back to Front
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // Draw Cells
  projectedCells.forEach(({ cell, proj }) => {
    // Backface Culling: Don't draw cells on the back of the sphere
    // proj.z > 0 means it's behind the center plane (depending on coord system, 
    // here z is depth, so positive z is usually back in standard webgl, 
    // but in our math zFinal = z*cos + y*sin. 
    // If zFinal > 0, it's "behind" the sphere center relative to camera at -Infinity Z)
    if (proj.z > 0) return;

    // --- DEPTH ATTENUATION (Critique #2) ---
    // proj.z ranges from -R (front) to 0 (edge)
    // Normalize depth 0..1 where 1 is front
    const depthNorm = Math.abs(proj.z) / CONFIG.sphereRadius;
    
    // Size attenuation: Farther = smaller
    const size = CONFIG.cellBaseSize * proj.scale * (0.5 + depthNorm * 0.5);
    
    if (cell.alive) {
      // Color Mapping (Critique #2)
      // Map age to hue
      const hueRange = CONFIG.colorSpectrum.end - CONFIG.colorSpectrum.start;
      const hue = (CONFIG.colorSpectrum.start + (cell.age * 2)) % CONFIG.colorSpectrum.end;
      
      // Opacity/Alpha attenuation: Back cells are dimmer
      // 0.2 at edge -> 0.9 at front
      const alpha = 0.2 + (depthNorm * 0.7);
      
      // Brightness attenuation
      const lightness = 40 + (depthNorm * 40); // 40% -> 80%
      
      ctx.fillStyle = `hsla(${hue}, 90%, ${lightness}%, ${alpha})`;
      
      // Glow effect only for close/large cells to save perf and add depth
      if (size > 1.5) {
        ctx.shadowBlur = 10 * proj.scale;
        ctx.shadowColor = `hsla(${hue}, 100%, 60%, ${alpha * 0.5})`;
      } else {
        ctx.shadowBlur = 0;
      }
    } else {
      return; // Don't draw dead cells
    }

    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  ctx.shadowBlur = 0;
  
  // Sharp Rim Light (Critique #2)
  // A very thin, semi-transparent ring at the edge
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    state.rotation.y += CONFIG.rotationSpeed;
    
    // Speed control
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation.toLocaleString();
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop.toLocaleString();
}

// Controls
const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', () => {
  state.isRunning = !state.isRunning;
  if (state.isRunning) {
    btnPause.innerText = "Pause";
    btnPause.classList.add('active');
  } else {
    btnPause.innerText = "Resume";
    btnPause.classList.remove('active');
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  btnPause.innerText = "Resume";
  btnPause.classList.remove('active');
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
});

// Mouse Drag
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(3, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
