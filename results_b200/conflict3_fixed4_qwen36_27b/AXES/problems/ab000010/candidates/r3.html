<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Life Simulation</title>
<style>
  :root {
    --bg-color: #050507;
    --accent-primary: #00f2ff; /* Cyan */
    --accent-secondary: #ff00ff; /* Magenta */
    --accent-tertiary: #7000ff; /* Violet */
    --text-main: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.6);
    --glass-bg: rgba(10, 10, 12, 0.65);
    --glass-border: rgba(255, 255, 255, 0.12);
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Subtle ambient background glow */
    background-image: radial-gradient(circle at 50% 50%, #13131f 0%, #050507 80%);
  }

  /* Canvas Container */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Overlay Layer */
  #ui-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3rem;
  }

  /* Top Area */
  .top-area {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
  }

  /* Header - Critique #3: Gradient Title */
  .header {
    pointer-events: auto;
    margin-bottom: 1rem;
  }

  h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, #ffffff 0%, var(--accent-primary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 15px rgba(0, 242, 255, 0.2));
  }

  .subtitle {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* Control Panel - Critique #2: Glassmorphism & Ghost Buttons */
  .panel {
    pointer-events: auto;
    width: 300px;
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .panel-label {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* Stats */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.25rem 0;
  }
  
  .stat-name {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 400;
  }

  .stat-value {
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 10px rgba(255,255,255,0.1);
  }

  /* Sliders */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    outline: none;
    border-radius: 2px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    background: #fff;
    cursor: pointer;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  /* Buttons - Critique #2: Ghost Buttons */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  
  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--glass-border);
    color: #fff;
    padding: 0.75rem;
    border-radius: 8px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-family: var(--font-stack);
  }

  button:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.3);
    box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
  }

  button.primary {
    border-color: var(--accent-primary);
    color: var(--accent-primary);
    background: rgba(0, 242, 255, 0.05);
  }
  button.primary:hover {
    background: var(--accent-primary);
    color: #000;
    box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
  }

  /* Footer - Critique #4: Bottom Center */
  .footer {
    position: absolute;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 1rem;
    opacity: 0.7;
    pointer-events: none;
  }

  .footer::before, .footer::after {
    content: '';
    display: block;
    width: 30px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
  }

</style>
</head>
<body>

  <!-- Canvas for the Sphere -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <div class="top-area">
      <!-- Header -->
      <div class="header">
        <h1>Conway Sphere</h1>
        <div class="subtitle">Algorithmic Life Simulation</div>
      </div>

      <!-- Control Panel -->
      <div class="panel">
        <div class="panel-section">
          <div class="panel-label">Telemetry</div>
          <div class="stat-row">
            <span class="stat-name">Generation</span>
            <span class="stat-value" id="gen-count">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-name">Population</span>
            <span class="stat-value" id="pop-count">0</span>
          </div>
        </div>

        <div class="panel-section">
          <div class="panel-label">Simulation Speed</div>
          <input type="range" id="speed-slider" min="1" max="60" value="25">
        </div>

        <div class="panel-section">
          <div class="panel-label">Controls</div>
          <div class="btn-group">
            <button id="btn-pause" class="primary">Pause</button>
            <button id="btn-reset" class="primary">Randomize</button>
          </div>
          <button id="btn-step" style="width: 100%; margin-top: 0.5rem;">Step Once</button>
        </div>
      </div>
    </div>

    <!-- Footer (Centered) -->
    <div class="footer">
      Drag to Rotate &bull; Scroll to Zoom
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life - Design Revision
 * 
 * Changes applied based on critique:
 * 1. High Density: Increased grid resolution and init probability.
 * 2. Color: Mapped age to a Cyan -> Magenta -> Violet spectrum.
 * 3. UI: Glassmorphism, rounded corners, ghost buttons.
 * 4. Typography: Unified sans-serif, hierarchy via weight/opacity.
 * 5. Composition: Footer moved to center bottom.
 */

// --- Configuration ---
const CONFIG = {
  gridRes: 120, // Increased resolution for density
  sphereRadius: 260,
  cellSize: 2.5, // Slightly smaller dots for high density
  rotationSpeed: 0.002,
  colors: {
    // Critique #1 & #2: Cyan (180) -> Magenta (300) -> Violet (270)
    hueStart: 180, 
    hueEnd: 310
  }
};

// --- State ---
let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 25,
  lastFrameTime: 0,
  rotation: { x: 0.3, y: 0.1 }, // Tilted initial view
  zoom: 1,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  distSq: (v1, v2) => (v1.x-v2.x)**2 + (v1.y-v2.y)**2 + (v1.z-v2.z)**2
};

// --- Grid Generation (Latitude/Longitude) ---
function createGridPoints(res, radius) {
  const points = [];
  const latSteps = res; 
  const lonSteps = res * 2; 

  for (let i = 1; i < latSteps; i++) {
    const phi = Math.PI * i / latSteps; 
    
    for (let j = 0; j < lonSteps; j++) {
      const theta = 2 * Math.PI * j / lonSteps;
      
      const x = radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.cos(phi);
      const z = radius * Math.sin(phi) * Math.sin(theta);
      
      points.push({ x, y, z });
    }
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createGridPoints(CONFIG.gridRes, CONFIG.sphereRadius);
  
  const cellCount = points.length;
  // Critique #1: Calculate neighbor threshold based on geometry
  const threshold = (2 * Math.PI * CONFIG.sphereRadius) / (CONFIG.gridRes * 2.1);
  const thresholdSq = threshold * threshold;

  state.cells = points.map((p, i) => {
    return {
      pos: p,
      neighbors: [],
      // Critique #1: 45% Initial Population Density
      alive: Math.random() > 0.55, 
      age: Math.floor(Math.random() * 20), // Random initial ages for color variance
      bornGen: 0
    };
  });

  // Neighbor Calculation (Spatial check)
  for (let i = 0; i < cellCount; i++) {
    for (let j = i + 1; j < cellCount; j++) {
      const dSq = Vec3.distSq(points[i], points[j]);
      if (dSq < thresholdSq) {
        state.cells[i].neighbors.push(j);
        state.cells[j].neighbors.push(i);
      }
    }
  }

  state.generation = 0;
  updateStats();
}

function stepGame() {
  const cells = state.cells;
  const len = cells.length;
  
  for (let i = 0; i < len; i++) {
    const cell = cells[i];
    
    let neighborsAlive = 0;
    for (let k = 0; k < cell.neighbors.length; k++) {
      if (cells[cell.neighbors[k]].alive) neighborsAlive++;
    }
    
    if (cell.alive) {
      if (neighborsAlive < 2 || neighborsAlive > 3) {
        cell.alive = false;
        cell.age = 0;
      } else {
        cell.age++;
      }
    } else {
      if (neighborsAlive === 3) {
        cell.alive = true;
        cell.age = 1;
        cell.bornGen = state.generation;
      }
    }
  }
  
  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  const fov = 800 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // Clear
  ctx.fillStyle = '#050507';
  ctx.fillRect(0, 0, width, height);

  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;

  // Ambient Glow
  const gradAtmo = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r * 1.8);
  gradAtmo.addColorStop(0, 'rgba(0, 242, 255, 0.04)'); // Cyan hint
  gradAtmo.addColorStop(0.5, 'rgba(112, 0, 255, 0.02)'); // Violet hint
  gradAtmo.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = gradAtmo;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.8, 0, Math.PI * 2);
  ctx.fill();

  // Draw Solid Sphere Base (Dark Matte)
  // Using a gradient to simulate volume
  const gradSphere = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, r*0.1, cx, cy, r);
  gradSphere.addColorStop(0, 'rgba(25, 25, 35, 0.85)');
  gradSphere.addColorStop(1, 'rgba(5, 5, 10, 0.95)');
  
  ctx.fillStyle = gradSphere;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  // Project & Sort
  const projectedCells = state.cells.map(cell => {
    return { cell, proj: project(cell.pos, state.rotation.x, state.rotation.y, state.zoom) };
  });
  
  // Sort by Z (Painter's Algorithm)
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // Draw Cells
  projectedCells.forEach(({ cell, proj }) => {
    // Cull backface slightly to show the sphere volume
    if (proj.z > CONFIG.sphereRadius * 0.05) return;

    const size = CONFIG.cellSize * proj.scale;
    
    if (cell.alive) {
      // Critique #1 & #2: Dynamic Multicolor Palette
      // Map age to Hue: Cyan (180) -> Magenta (300) -> Violet (270)
      const ageFactor = Math.min(cell.age / 20, 1); 
      const hue = CONFIG.colors.hueStart + (ageFactor * (CONFIG.colors.hueEnd - CONFIG.colors.hueStart));
      
      // Lighting based on depth (Z)
      const depthLight = (proj.z + CONFIG.sphereRadius) / (2 * CONFIG.sphereRadius);
      const lightness = 50 + (1 - depthLight) * 25; // 50% to 75%
      const alpha = 0.7 + (1 - depthLight) * 0.3; // 70% to 100% opacity
      
      ctx.fillStyle = `hsla(${hue}, 100%, ${lightness}%, ${alpha})`;
      
      // Glow effect
      if (size > 1.2) {
        ctx.shadowBlur = 6 * proj.scale;
        ctx.shadowColor = `hsla(${hue}, 100%, 60%, 0.6)`;
      } else {
        ctx.shadowBlur = 0;
      }
    } else {
      // Dead cells: Subtle texture, only visible if not too far back
      if (proj.z < -CONFIG.sphereRadius * 0.1) {
        ctx.fillStyle = 'rgba(40, 40, 50, 0.6)';
        ctx.shadowBlur = 0;
      } else {
        return; 
      }
    }

    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  ctx.shadowBlur = 0;
  
  // Subtle Rim Light
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    state.rotation.y += CONFIG.rotationSpeed;
    
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation.toLocaleString();
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop.toLocaleString();
}

// Controls
const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', () => {
  state.isRunning = !state.isRunning;
  btnPause.innerText = state.isRunning ? "Pause" : "Resume";
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  btnPause.innerText = "Resume";
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
});

// Mouse Drag
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(3, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
