<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Life Simulation</title>
<style>
  :root {
    --bg-color: #050505;
    --panel-bg: #0a0a0a;
    --border-color: #333333;
    --accent-primary: #00ffcc; /* Neon Green/Cyan */
    --accent-secondary: #ff00ff; /* Magenta */
    --text-main: #ffffff;
    --text-muted: #666666;
    --font-stack: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-color);
    /* Critique #6: Ambient glow behind sphere */
    background-image: radial-gradient(circle at 50% 50%, #1a1a20 0%, #050505 70%);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Canvas Container */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Overlay */
  #ui-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 2rem;
  }

  /* Header */
  .header {
    position: absolute;
    top: 2.5rem;
    left: 2.5rem;
    pointer-events: auto;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #fff;
    margin-bottom: 0.25rem;
  }

  .subtitle {
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--accent-primary);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.9;
  }

  /* Control Panel - Critique #3: HUD Aesthetic (Sharp corners, solid bg) */
  .panel {
    pointer-events: auto;
    width: 280px;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 0; /* Sharp corners */
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    margin-top: 0;
    box-shadow: 4px 4px 0px rgba(0,0,0,0.5); /* Hard offset shadow */
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .panel-label {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 0.25rem;
    margin-bottom: 0.5rem;
  }

  /* Stats */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .stat-name {
    font-size: 0.8rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .stat-value {
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }

  /* Sliders */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 2px;
    background: var(--border-color);
    outline: none;
    border-radius: 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    background: var(--accent-primary);
    cursor: pointer;
    border-radius: 0; /* Square thumb */
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  /* Buttons - Critique #5: Visual Hierarchy */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }
  
  button {
    background: transparent;
    border: 1px solid var(--border-color);
    color: #fff;
    padding: 0.75rem;
    border-radius: 0; /* Sharp corners */
    font-size: 0.7rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-family: var(--font-stack);
  }

  /* Primary Buttons (Solid) */
  button.primary {
    background: #fff;
    color: #000;
    border: 1px solid #fff;
  }
  button.primary:hover {
    background: var(--accent-primary);
    border-color: var(--accent-primary);
    color: #000;
  }

  /* Secondary Buttons (Outline) */
  button.secondary:hover {
    background: rgba(255,255,255,0.1);
    border-color: #fff;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 2rem;
    left: 2.5rem;
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  /* Critique #6: Horizontal rule for footer */
  .footer::before {
    content: '';
    display: block;
    width: 40px;
    height: 1px;
    background: var(--border-color);
  }

</style>
</head>
<body>

  <!-- Canvas for the Sphere -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Header -->
    <div class="header">
      <h1>Conway Sphere</h1>
      <div class="subtitle">Algorithmic Life Simulation</div>
    </div>

    <!-- Control Panel -->
    <div class="panel">
      <div class="panel-section">
        <div class="panel-label">Telemetry</div>
        <div class="stat-row">
          <span class="stat-name">Generation</span>
          <span class="stat-value" id="gen-count">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-name">Population</span>
          <span class="stat-value" id="pop-count">0</span>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-label">Simulation Speed</div>
        <input type="range" id="speed-slider" min="1" max="60" value="20">
      </div>

      <div class="panel-section">
        <div class="panel-label">Controls</div>
        <!-- Critique #5: Hierarchy applied -->
        <div class="btn-group">
          <button id="btn-pause" class="primary">Pause</button>
          <button id="btn-reset" class="primary">Randomize</button>
        </div>
        <button id="btn-step" class="secondary" style="width: 100%">Step Once</button>
      </div>
    </div>

    <div class="footer">
      Drag to Rotate &bull; Scroll to Zoom
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life - Visual Revision
 * 
 * Implementation of Design Critique:
 * 1. Density: 40-50% initial population.
 * 2. Palette: Age-based gradient (Neon Green -> Electric Blue -> Hot Pink).
 * 3. UI: HUD style (Sharp corners, solid dark bg, 1px borders).
 * 4. Typography: Unified Geometric Sans-Serif.
 * 5. Hierarchy: Primary (Solid) vs Secondary (Outline) buttons.
 * 6. Composition: Ambient glow, footer rule.
 */

// --- Configuration ---
const CONFIG = {
  gridRes: 100, // High resolution grid (approx 100x200 points)
  sphereRadius: 240,
  cellSize: 2.8, // Size of individual dots
  rotationSpeed: 0.002,
  // Critique #2: Palette Definition
  colors: {
    // Gradient: Neon Green (120) -> Electric Blue (190) -> Hot Pink (300) -> Magenta (320)
    hueStart: 120, 
    hueEnd: 330
  }
};

// --- State ---
let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 20,
  lastFrameTime: 0,
  rotation: { x: 0.4, y: 0.1 }, // Tilted initial view
  zoom: 1,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  len: (v) => Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z),
  distSq: (v1, v2) => (v1.x-v2.x)**2 + (v1.y-v2.y)**2 + (v1.z-v2.z)**2
};

// --- Grid Generation (Latitude/Longitude) ---
function createGridPoints(res, radius) {
  const points = [];
  // Higher density logic
  const latSteps = res; 
  const lonSteps = res * 2; 

  for (let i = 1; i < latSteps; i++) {
    const phi = Math.PI * i / latSteps; 
    
    for (let j = 0; j < lonSteps; j++) {
      const theta = 2 * Math.PI * j / lonSteps;
      
      const x = radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.cos(phi);
      const z = radius * Math.sin(phi) * Math.sin(theta);
      
      points.push({ x, y, z });
    }
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createGridPoints(CONFIG.gridRes, CONFIG.sphereRadius);
  
  const cellCount = points.length;
  // Critique #1: Neighbor threshold calculation
  const threshold = (2 * Math.PI * CONFIG.sphereRadius) / (CONFIG.gridRes * 2.2);
  const thresholdSq = threshold * threshold;

  state.cells = points.map((p, i) => {
    return {
      pos: p,
      neighbors: [],
      // Critique #1: 45% Initial Population Density
      alive: Math.random() > 0.55, 
      age: Math.floor(Math.random() * 10), // Random initial ages for color variance
      bornGen: 0
    };
  });

  // Neighbor Calculation (Spatial check)
  for (let i = 0; i < cellCount; i++) {
    for (let j = i + 1; j < cellCount; j++) {
      const dSq = Vec3.distSq(points[i], points[j]);
      if (dSq < thresholdSq) {
        state.cells[i].neighbors.push(j);
        state.cells[j].neighbors.push(i);
      }
    }
  }

  state.generation = 0;
  updateStats();
}

function stepGame() {
  const cells = state.cells;
  const len = cells.length;
  
  for (let i = 0; i < len; i++) {
    const cell = cells[i];
    
    let neighborsAlive = 0;
    for (let k = 0; k < cell.neighbors.length; k++) {
      if (cells[cell.neighbors[k]].alive) neighborsAlive++;
    }
    
    if (cell.alive) {
      if (neighborsAlive < 2 || neighborsAlive > 3) {
        cell.alive = false;
        cell.age = 0;
      } else {
        cell.age++;
      }
    } else {
      if (neighborsAlive === 3) {
        cell.alive = true;
        cell.age = 1;
        cell.bornGen = state.generation;
      }
    }
  }
  
  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  const fov = 800 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // Clear
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, width, height);

  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;

  // Critique #6: Ambient Glow
  const gradAtmo = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r * 1.6);
  gradAtmo.addColorStop(0, 'rgba(0, 255, 204, 0.03)');
  gradAtmo.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = gradAtmo;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.6, 0, Math.PI * 2);
  ctx.fill();

  // Draw Solid Sphere Base (Dark Matte)
  const gradSphere = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, r*0.1, cx, cy, r);
  gradSphere.addColorStop(0, 'rgba(20, 20, 25, 0.95)');
  gradSphere.addColorStop(1, 'rgba(5, 5, 5, 1)');
  
  ctx.fillStyle = gradSphere;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  // Project & Sort
  const projectedCells = state.cells.map(cell => {
    return { cell, proj: project(cell.pos, state.rotation.x, state.rotation.y, state.zoom) };
  });
  
  // Sort by Z (Painter's Algorithm)
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // Draw Cells
  projectedCells.forEach(({ cell, proj }) => {
    // Cull backface slightly to show the sphere volume
    if (proj.z > CONFIG.sphereRadius * 0.1) return;

    const size = CONFIG.cellSize * proj.scale;
    
    if (cell.alive) {
      // Critique #2: Dynamic Multicolor Palette
      // Map age to Hue
      // Age 0-10: Green -> Blue -> Pink -> Magenta
      const ageFactor = Math.min(cell.age / 15, 1); 
      const hue = CONFIG.colors.hueStart + (ageFactor * (CONFIG.colors.hueEnd - CONFIG.colors.hueStart));
      
      // Lighting based on depth (Z)
      const depthLight = (proj.z + CONFIG.sphereRadius) / (2 * CONFIG.sphereRadius);
      const lightness = 40 + (1 - depthLight) * 30; // 40% to 70%
      const alpha = 0.6 + (1 - depthLight) * 0.4; // 60% to 100% opacity
      
      ctx.fillStyle = `hsla(${hue}, 100%, ${lightness}%, ${alpha})`;
      
      // Glow effect
      if (size > 1.5) {
        ctx.shadowBlur = 8 * proj.scale;
        ctx.shadowColor = `hsla(${hue}, 100%, 60%, 0.8)`;
      } else {
        ctx.shadowBlur = 0;
      }
    } else {
      // Dead cells: Subtle texture
      if (proj.z < -CONFIG.sphereRadius * 0.2) {
        ctx.fillStyle = 'rgba(30, 30, 35, 0.5)';
        ctx.shadowBlur = 0;
      } else {
        return; 
      }
    }

    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  ctx.shadowBlur = 0;
  
  // Rim Light
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    state.rotation.y += CONFIG.rotationSpeed;
    
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation.toLocaleString();
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop.toLocaleString();
}

// Controls
const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', () => {
  state.isRunning = !state.isRunning;
  btnPause.innerText = state.isRunning ? "Pause" : "Resume";
  // Visual toggle handled by CSS classes mostly, but text updates here
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  btnPause.innerText = "Resume";
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
});

// Mouse Drag
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(3, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
