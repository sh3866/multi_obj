<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Life Simulation</title>
<style>
  :root {
    --bg-color: #050508;
    --glass-bg: rgba(15, 20, 30, 0.65);
    --glass-border: rgba(0, 240, 255, 0.15);
    --glass-highlight: rgba(0, 240, 255, 0.3);
    --accent-primary: #00f0ff;
    --accent-secondary: #bd00ff;
    --text-main: #e0e6ed;
    --text-muted: #7b8c9e;
    --font-stack: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-color);
    background-image: 
      radial-gradient(circle at 50% 50%, #0f1219 0%, #050508 80%);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Canvas Container */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Overlay */
  #ui-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 2rem;
  }

  /* Header */
  .header {
    position: absolute;
    top: 2.5rem;
    left: 2.5rem;
    pointer-events: auto;
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
  }

  .subtitle {
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--accent-primary);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  /* Control Panel */
  .panel {
    pointer-events: auto;
    width: 300px;
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 
      0 8px 32px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    gap: 1.75rem;
    margin-top: 2rem;
    transition: border-color 0.3s ease;
  }

  .panel:hover {
    border-color: rgba(0, 240, 255, 0.3);
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .panel-label {
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 0.25rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  
  .panel-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.1);
  }

  /* Stats */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0.25rem 0;
  }
  
  .stat-name {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .stat-value {
    font-size: 1.25rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #fff;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
  }

  /* Sliders */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
    margin-top: 0.5rem;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent-primary);
    cursor: pointer;
    box-shadow: 0 0 10px var(--accent-primary);
    transition: transform 0.1s;
    border: 2px solid #000;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  /* Buttons */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  
  button {
    background: rgba(0, 240, 255, 0.05);
    border: 1px solid var(--glass-border);
    color: var(--accent-primary);
    padding: 0.75rem;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: var(--font-stack);
  }

  button:hover {
    background: rgba(0, 240, 255, 0.15);
    border-color: var(--accent-primary);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    color: #fff;
  }

  button:active {
    transform: translateY(1px);
  }

  /* Ghost button style for secondary actions */
  button.ghost {
    background: transparent;
    border-color: rgba(255,255,255,0.1);
    color: var(--text-muted);
  }
  button.ghost:hover {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.3);
    color: #fff;
    box-shadow: none;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 2rem;
    left: 2.5rem;
    font-size: 0.65rem;
    color: var(--text-muted);
    opacity: 0.6;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  
  .footer span {
    color: var(--accent-primary);
    margin: 0 0.25rem;
  }

</style>
</head>
<body>

  <!-- Canvas for the Sphere -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Header -->
    <div class="header">
      <h1>Conway Sphere</h1>
      <div class="subtitle">Algorithmic Life Simulation</div>
    </div>

    <!-- Control Panel -->
    <div class="panel">
      <div class="panel-section">
        <div class="panel-label">Telemetry</div>
        <div class="stat-row">
          <span class="stat-name">Generation</span>
          <span class="stat-value" id="gen-count">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-name">Population</span>
          <span class="stat-value" id="pop-count">0</span>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-label">Simulation Speed</div>
        <input type="range" id="speed-slider" min="1" max="60" value="20">
      </div>

      <div class="panel-section">
        <div class="panel-label">Controls</div>
        <div class="btn-group">
          <button id="btn-pause">Pause</button>
          <button id="btn-reset">Randomize</button>
        </div>
        <button id="btn-step" class="ghost">Step Once</button>
      </div>
    </div>

    <div class="footer">
      Drag to Rotate <span>&bull;</span> Scroll to Zoom
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life - Revised
 * 
 * Design Improvements:
 * 1. Higher density (80x40 grid) for cellular texture.
 * 2. Solid semi-transparent sphere geometry behind cells.
 * 3. Dynamic HSL color mapping (Age-based).
 * 4. Unified HUD/Glassmorphism UI.
 */

// --- Configuration ---
const CONFIG = {
  gridRes: 120, // Higher resolution for density (approx 120x60 points)
  sphereRadius: 260,
  cellSize: 2.5, // Smaller cells
  rotationSpeed: 0.0015,
  colors: {
    sphereBase: 'rgba(10, 15, 25, 0.85)',
    gridLine: 'rgba(0, 240, 255, 0.05)',
  }
};

// --- State ---
let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 20,
  lastFrameTime: 0,
  rotation: { x: 0.2, y: 0 }, // Slight initial tilt
  zoom: 1,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  len: (v) => Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z),
  normalize: (v) => {
    const l = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z);
    return l > 0 ? { x: v.x/l, y: v.y/l, z: v.z/l } : {x:0,y:0,z:0};
  },
  distSq: (v1, v2) => (v1.x-v2.x)**2 + (v1.y-v2.y)**2 + (v1.z-v2.z)**2
};

// --- Grid Generation (Latitude/Longitude) ---
function createGridPoints(res, radius) {
  const points = [];
  // Use slightly more latitude lines to handle poles better
  const latSteps = res; 
  const lonSteps = res * 2; 

  for (let i = 1; i < latSteps; i++) {
    const phi = Math.PI * i / latSteps; // 0 to PI
    
    for (let j = 0; j < lonSteps; j++) {
      const theta = 2 * Math.PI * j / lonSteps; // 0 to 2PI
      
      const x = radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.cos(phi);
      const z = radius * Math.sin(phi) * Math.sin(theta);
      
      points.push({ x, y, z });
    }
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createGridPoints(CONFIG.gridRes, CONFIG.sphereRadius);
  
  // Pre-calculate neighbors
  // Since it's a regular grid, we can just look at indices, 
  // but let's use distance to be robust for the spherical wrapping.
  // We only need to check nearby indices to avoid O(N^2).
  
  const cellCount = points.length;
  const threshold = (2 * Math.PI * CONFIG.sphereRadius) / (CONFIG.gridRes * 2.5); // Approx neighbor dist
  
  state.cells = points.map((p, i) => {
    const neighbors = [];
    
    // Optimization: Since points are generated in order (lat then lon),
    // neighbors are likely close in index array.
    // However, wrapping at edges makes index math tricky.
    // Brute force distance check is safer, but let's limit search radius.
    // For 120x60 (7200 points), O(N^2) is too slow for JS init.
    
    // Fast Neighbor Search using spatial logic on Grid:
    // A cell at (lat, lon) has neighbors at (lat±1, lon), (lat, lon±1)
    // We need to map 1D index back to 2D coords.
    
    const latIdx = Math.floor(i / CONFIG.gridRes * 2); // Rough approximation
    // Actually, let's just use a simpler approach:
    // Check all points, but break early? No.
    
    // Let's use the property of the loop:
    // Points are ordered by latitude, then longitude.
    // Number of points per latitude band varies (sin(phi)).
    // This makes index math complex.
    
    // Fallback to efficient distance check with a spatial hash or just checking a window?
    // Let's stick to the distance check but optimized.
    
    return {
      pos: p,
      neighbors: [], // Populate below
      alive: Math.random() > 0.75,
      age: 0, // 0 = dead or just born
      bornGen: 0
    };
  });

  // Populate neighbors (Two-pass or one-pass distance check)
  // 7000 points * 7000 checks is ~49M. Might take 1-2 seconds.
  // Let's optimize: Only check points within a small index range?
  // No, let's just do the distance check. It runs once.
  
  const thresholdSq = threshold * threshold;

  for (let i = 0; i < cellCount; i++) {
    for (let j = i + 1; j < cellCount; j++) {
      // Heuristic: if index diff is huge, spatial distance is likely huge (except poles)
      // But let's just run the loop. Modern JS engines are fast.
      
      // Optimization: Skip if index distance is > 10% of total? 
      // No, wrapping.
      
      const dSq = Vec3.distSq(points[i], points[j]);
      if (dSq < thresholdSq) {
        state.cells[i].neighbors.push(j);
        state.cells[j].neighbors.push(i);
      }
    }
  }

  state.generation = 0;
  updateStats();
}

function stepGame() {
  const cells = state.cells;
  const len = cells.length;
  
  // Create next state array to avoid race conditions
  // We only need to store alive status and age updates
  
  for (let i = 0; i < len; i++) {
    const cell = cells[i];
    
    // Count neighbors
    let neighborsAlive = 0;
    for (let k = 0; k < cell.neighbors.length; k++) {
      if (cells[cell.neighbors[k]].alive) neighborsAlive++;
    }
    
    // Rules
    if (cell.alive) {
      if (neighborsAlive < 2 || neighborsAlive > 3) {
        cell.alive = false;
        cell.age = 0;
      } else {
        cell.age++;
      }
    } else {
      if (neighborsAlive === 3) {
        cell.alive = true;
        cell.age = 1;
        cell.bornGen = state.generation;
      }
    }
  }
  
  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotation Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotation X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  const fov = 800 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function draw() {
  // Clear background
  ctx.fillStyle = CONFIG.colors.bg;
  ctx.fillRect(0, 0, width, height);

  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;

  // 1. Draw Atmosphere Glow (Outer)
  const gradAtmo = ctx.createRadialGradient(cx, cy, r * 0.8, cx, cy, r * 1.4);
  gradAtmo.addColorStop(0, 'rgba(0, 240, 255, 0)');
  gradAtmo.addColorStop(0.5, 'rgba(0, 240, 255, 0.03)');
  gradAtmo.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = gradAtmo;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.4, 0, Math.PI * 2);
  ctx.fill();

  // 2. Draw Solid Sphere Base
  // Use a radial gradient to simulate 3D volume lighting
  // Light source coming from top-left
  const gradSphere = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, r*0.1, cx, cy, r);
  gradSphere.addColorStop(0, 'rgba(30, 40, 60, 0.9)');
  gradSphere.addColorStop(0.5, 'rgba(15, 20, 30, 0.95)');
  gradSphere.addColorStop(1, 'rgba(5, 5, 8, 1)');
  
  ctx.fillStyle = gradSphere;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  // 3. Project & Sort Cells
  const projectedCells = state.cells.map(cell => {
    return { cell, proj: project(cell.pos, state.rotation.x, state.rotation.y, state.zoom) };
  });
  
  // Sort by Z (painter's algorithm) - Draw back to front
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // 4. Draw Cells
  projectedCells.forEach(({ cell, proj }) => {
    // Culling: Don't draw if too far back (optional, but looks better if we see "through" slightly)
    // Or strictly cull backface for solid look. Let's cull backface > 10% radius
    if (proj.z > CONFIG.sphereRadius * 0.1) return;

    const size = CONFIG.cellSize * proj.scale;
    
    if (cell.alive) {
      // Dynamic Color Mapping
      // New cells (low age) = Electric Blue/Cyan
      // Older cells = Magenta/Purple
      // Hue: 180 (Cyan) -> 280 (Purple)
      
      const ageFactor = Math.min(cell.age / 10, 1); // Normalize age for color
      const hue = 180 + (ageFactor * 100); 
      
      // Saturation/Lightness based on Z depth (fake lighting)
      // Normalize Z from -R to R -> 0 to 1
      const depthLight = (proj.z + CONFIG.sphereRadius) / (2 * CONFIG.sphereRadius);
      const lightness = 40 + (1 - depthLight) * 30; // Brighter in front
      
      ctx.fillStyle = `hsl(${hue}, 100%, ${lightness}%)`;
      
      // Glow effect for alive cells
      if (size > 1.5) {
        ctx.shadowBlur = 6 * proj.scale;
        ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
      } else {
        ctx.shadowBlur = 0;
      }
    } else {
      // Dead cells: Subtle grid texture
      // Only draw if close to surface (front)
      if (proj.z < -CONFIG.sphereRadius * 0.2) {
        ctx.fillStyle = 'rgba(20, 30, 40, 0.3)';
        ctx.shadowBlur = 0;
      } else {
        return; // Don't draw deep dead cells
      }
    }

    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  // Reset shadow
  ctx.shadowBlur = 0;
  
  // 5. Draw Rim Light (Edge highlight)
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
  ctx.lineWidth = 2 * state.zoom;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    // Auto rotation
    state.rotation.y += CONFIG.rotationSpeed;
    
    // Throttle updates
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation.toLocaleString();
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop.toLocaleString();
}

// Controls
const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', () => {
  state.isRunning = !state.isRunning;
  btnPause.innerText = state.isRunning ? "Pause" : "Resume";
  btnPause.style.borderColor = state.isRunning ? 'var(--glass-border)' : 'var(--accent-primary)';
  btnPause.style.color = state.isRunning ? 'var(--accent-primary)' : '#fff';
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  btnPause.innerText = "Resume";
  btnPause.style.borderColor = 'var(--accent-primary)';
  btnPause.style.color = '#fff';
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
});

// Mouse Drag
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(3, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
