<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Palette: Deep Void, Ethereal Gold, Ghostly Cyan */
        --bg-deep: #030305;
        --bg-surface: #0a0a10;
        --bg-card: #0f1016;
        
        --gold-dim: #8a7328;
        --gold-mid: #c5a059;
        --gold-bright: #ffe68a;
        
        --cyan-dim: #1a3a3a;
        --cyan-mid: #4fd1c5;
        --cyan-glow: #81e6d9;
        
        --text-primary: #f7fafc;
        --text-secondary: #a0aec0;
        
        --font-display: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* --- Background Layers --- */
    #ambient-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: 0.6;
        filter: blur(2px);
    }

    .atmosphere-overlay {
        position: absolute;
        inset: 0;
        background: 
            radial-gradient(circle at 50% 40%, rgba(79, 209, 197, 0.08) 0%, transparent 60%),
            radial-gradient(circle at 50% 100%, rgba(20, 20, 25, 1) 0%, transparent 70%),
            linear-gradient(to bottom, rgba(5,5,5,0) 0%, rgba(5,5,5,0.8) 100%);
        z-index: 1;
        pointer-events: none;
    }

    .noise-overlay {
        position: absolute;
        inset: 0;
        opacity: 0.04;
        z-index: 2;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Layout Container --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1100px;
        height: 100%;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* --- Header --- */
    header {
        display: flex;
        justify-content: flex-end; /* Align right */
        align-items: flex-start;
        padding-top: 1rem;
    }

    .currency-pill {
        background: rgba(10, 10, 15, 0.6);
        border: 1px solid var(--gold-dim);
        border-radius: 4px; /* Sharper corners for "ancient" feel */
        padding: 0.6rem 1.2rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4), inset 0 0 10px rgba(197, 160, 89, 0.05);
        backdrop-filter: blur(8px);
        transition: border-color 0.3s ease;
    }

    .currency-pill:hover {
        border-color: var(--gold-mid);
    }

    .coin-icon {
        width: 20px;
        height: 20px;
        position: relative;
    }
    
    .coin-icon svg {
        fill: var(--gold-mid);
        filter: drop-shadow(0 0 4px var(--gold-dim));
    }

    .currency-amount {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.1rem;
        color: var(--gold-bright);
        letter-spacing: 0.05em;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        margin-bottom: 2rem;
    }

    /* Typography */
    .game-title {
        font-family: var(--font-display);
        font-size: clamp(2.5rem, 5vw, 4.5rem);
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        margin-bottom: 0.5rem;
        background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold-mid) 50%, var(--gold-dim) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(197, 160, 89, 0.2));
        position: relative;
        z-index: 10;
    }

    .game-subtitle {
        font-family: var(--font-ui);
        font-size: 0.9rem;
        color: var(--cyan-mid);
        letter-spacing: 0.6em;
        text-transform: uppercase;
        margin-bottom: 4rem;
        opacity: 0.9;
        text-shadow: 0 0 10px rgba(79, 209, 197, 0.4);
    }

    /* The Summoning Orb */
    .orb-container {
        position: relative;
        width: 220px;
        height: 220px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 2rem;
    }

    .orb-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        animation: orb-float 8s ease-in-out infinite;
    }

    /* --- Menu Grid --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
    }

    .menu-card {
        background: linear-gradient(180deg, rgba(20, 20, 28, 0.7) 0%, rgba(10, 10, 15, 0.8) 100%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    /* Card Shine Effect */
    .menu-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
        transition: left 0.6s ease;
    }

    .menu-card:hover {
        transform: translateY(-8px);
        background: linear-gradient(180deg, rgba(30, 30, 40, 0.9) 0%, rgba(15, 15, 20, 0.95) 100%);
        border-color: rgba(79, 209, 197, 0.3);
        box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 15px rgba(79, 209, 197, 0.1);
    }

    .menu-card:hover::after {
        left: 100%;
    }

    .menu-card:hover .card-icon svg {
        fill: var(--cyan-glow);
        filter: drop-shadow(0 0 8px var(--cyan-mid));
        transform: scale(1.1);
    }

    .menu-card:hover .card-label {
        color: var(--text-primary);
        text-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    .card-icon {
        width: 40px;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card-icon svg {
        width: 100%;
        height: 100%;
        fill: var(--text-secondary);
        transition: all 0.4s ease;
    }

    .card-label {
        font-family: var(--font-display);
        font-size: 1.1rem;
        color: var(--text-secondary);
        letter-spacing: 0.05em;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    /* Special Styling for Summon Button */
    .menu-card.summon {
        background: linear-gradient(180deg, rgba(40, 30, 10, 0.6) 0%, rgba(20, 15, 5, 0.8) 100%);
        border: 1px solid var(--gold-dim);
        box-shadow: 0 0 20px rgba(197, 160, 89, 0.05);
    }
    
    .menu-card.summon .card-icon svg {
        fill: var(--gold-mid);
        filter: drop-shadow(0 0 5px var(--gold-dim));
    }

    .menu-card.summon .card-label {
        color: var(--gold-bright);
    }

    .menu-card.summon:hover {
        border-color: var(--gold-bright);
        box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 20px rgba(197, 160, 89, 0.15);
    }
    
    .menu-card.summon:hover .card-icon svg {
        fill: var(--gold-bright);
        filter: drop-shadow(0 0 10px var(--gold-mid));
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-secondary);
        font-size: 0.75rem;
        opacity: 0.4;
        padding-top: 1.5rem;
        letter-spacing: 0.1em;
    }

    /* --- Animations --- */
    @keyframes orb-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-15px) scale(1.02); }
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
        .app-container { padding: 1rem; }
        .game-title { font-size: 2.5rem; letter-spacing: 0.1em; }
        .game-subtitle { font-size: 0.8rem; letter-spacing: 0.3em; }
        .menu-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
        .orb-container { width: 160px; height: 160px; margin-bottom: 2rem; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="ambient-canvas"></canvas>
    <div class="atmosphere-overlay"></div>
    <div class="noise-overlay"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <div class="coin-icon">
                    <!-- Custom Gold Coin SVG -->
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" />
                        <circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                        <path d="M12 7V17M9 10L12 7L15 10M9 14L12 17L15 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <div class="orb-container">
                <!-- Procedural Orb SVG -->
                <svg class="orb-svg" viewBox="0 0 100 100">
                    <defs>
                        <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="0%" style="stop-color:#81e6d9;stop-opacity:0.9" />
                            <stop offset="40%" style="stop-color:#4fd1c5;stop-opacity:0.5" />
                            <stop offset="100%" style="stop-color:#1a3a3a;stop-opacity:0" />
                        </radialGradient>
                        <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
                        </radialGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    
                    <!-- Core -->
                    <circle cx="50" cy="50" r="30" fill="url(#orbGrad)" filter="url(#glow)">
                        <animate attributeName="r" values="28;32;28" dur="6s" repeatCount="indefinite" />
                        <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Inner bright core -->
                    <circle cx="50" cy="50" r="8" fill="url(#innerGlow)">
                        <animate attributeName="r" values="6;9;6" dur="3s" repeatCount="indefinite" />
                    </circle>

                    <!-- Mystical Rings -->
                    <g stroke="rgba(129, 230, 217, 0.3)" stroke-width="0.5" fill="none">
                        <circle cx="50" cy="50" r="42">
                            <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="40s" repeatCount="indefinite" />
                        </circle>
                        <circle cx="50" cy="50" r="45" stroke-dasharray="4 8">
                            <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="60s" repeatCount="indefinite" />
                        </circle>
                    </g>
                </svg>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <div class="card-icon">
                    <!-- Diamond/Gem Icon -->
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 12l10 10 10-10L12 2zm0 3.5L18.5 12 12 18.5 5.5 12 12 5.5z" /></svg>
                </div>
                <span class="card-label">Summon</span>
            </div>

            <!-- Roster -->
            <div class="menu-card" onclick="interact('Roster')">
                <div class="card-icon">
                    <!-- Group Icon -->
                    <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                </div>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card" onclick="interact('Battle')">
                <div class="card-icon">
                    <!-- Lightning Icon -->
                    <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
                </div>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card" onclick="interact('Grind')">
                <div class="card-icon">
                    <!-- Gear/Work Icon -->
                    <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.35 0-.64.22-.7.55l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.06.33.35.55.7.55h4c.35 0 .64-.22.7-.55l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
                </div>
                <span class="card-label">Grind</span>
            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 • Offline Mode
        </footer>
    </div>

<script>
    // --- Advanced Background Particle System ---
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    let time = 0;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
            // Randomize initial Y so they don't all start at bottom
            this.y = Math.random() * height;
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            // Slower, more ethereal movement
            this.vx = (Math.random() - 0.5) * 0.2;
            this.vy = -(Math.random() * 0.5 + 0.1); 
            this.size = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.3;
            this.fadeSpeed = Math.random() * 0.002 + 0.001;
            
            // 80% Cyan, 20% Gold
            const isGold = Math.random() > 0.8;
            this.color = isGold ? `212, 175, 55` : `129, 230, 217`;
            this.baseAlpha = this.alpha;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            // Gentle pulsing
            this.alpha = this.baseAlpha + Math.sin(time * 0.05 + this.x) * 0.1;

            if (this.y < -10 || this.alpha <= 0) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.shadowBlur = 10;
            ctx.shadowColor = `rgba(${this.color}, ${this.alpha})`;
            ctx.fill();
            ctx.shadowBlur = 0; // Reset for performance
        }
    }

    function initParticles() {
        particles = [];
        // Higher density for better atmosphere
        const count = Math.floor((width * height) / 8000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        time++;
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        // Subtle scale down
        btn.style.transform = 'scale(0.96)';
        // Add a quick flash effect
        const flash = document.createElement('div');
        flash.style.position = 'absolute';
        flash.style.inset = '0';
        flash.style.background = 'rgba(255,255,255,0.1)';
        flash.style.zIndex = '5';
        btn.appendChild(flash);
        
        setTimeout(() => {
            btn.style.transform = '';
            flash.remove();
        }, 150);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
