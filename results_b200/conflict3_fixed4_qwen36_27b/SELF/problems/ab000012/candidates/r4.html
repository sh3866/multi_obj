<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        --bg-deep: #020204;
        --bg-panel: rgba(15, 23, 42, 0.4);
        
        --gold-primary: #cfaa48;
        --gold-highlight: #ffe082;
        --gold-shadow: #8f7324;
        
        --magic-primary: #38bdf8;
        --magic-glow: #7dd3fc;
        --magic-deep: #0284c7;
        
        --text-main: #e2e8f0;
        --text-muted: #64748b;
        
        --font-display: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* --- Background & Atmosphere --- */
    #ambient-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    .atmosphere-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: 
            radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
            radial-gradient(circle at 50% 60%, rgba(207, 170, 72, 0.03) 0%, transparent 40%),
            linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 15%, transparent 75%, rgba(0,0,0,0.9) 100%);
    }

    .noise-overlay {
        position: absolute;
        inset: 0;
        opacity: 0.07;
        z-index: 2;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1200px;
        height: 100%;
        padding: 3rem 4rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* --- Header --- */
    header {
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
        position: relative;
    }

    .currency-pill {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(207, 170, 72, 0.3);
        border-radius: 2px;
        padding: 0.7rem 1.8rem;
        display: flex;
        align-items: center;
        gap: 12px;
        backdrop-filter: blur(12px);
        position: relative;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        transition: all 0.4s ease;
        overflow: hidden;
    }

    .currency-pill::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 2px;
        background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 50%);
        pointer-events: none;
    }

    .currency-pill::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        opacity: 0.5;
    }

    .currency-pill:hover {
        border-color: var(--gold-primary);
        background: rgba(0, 0, 0, 0.6);
        box-shadow: 0 0 20px rgba(207, 170, 72, 0.1);
        transform: translateY(-1px);
    }

    .coin-icon {
        width: 24px;
        height: 24px;
        color: var(--gold-primary);
        filter: drop-shadow(0 0 3px var(--gold-shadow));
    }

    .currency-amount {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.15rem;
        color: var(--gold-highlight);
        letter-spacing: 0.05em;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        padding: 0 2rem;
    }

    .game-title {
        font-family: var(--font-display);
        font-size: clamp(3.5rem, 6vw, 7rem);
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        margin-bottom: 0.2rem;
        /* Metallic Gold Gradient */
        background: linear-gradient(to bottom, var(--gold-highlight) 0%, var(--gold-primary) 50%, var(--gold-shadow) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.7));
        position: relative;
        z-index: 10;
        line-height: 0.9;
    }

    .game-subtitle {
        font-family: var(--font-ui);
        font-size: 0.9rem;
        color: var(--magic-glow);
        letter-spacing: 0.8em;
        text-transform: uppercase;
        margin-bottom: 3rem;
        opacity: 0.9;
        text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        text-indent: 0.8em;
        font-weight: 300;
    }

    /* --- The Orb --- */
    .orb-container {
        position: relative;
        width: 280px;
        height: 280px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: -2rem;
        z-index: 5;
    }

    .orb-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 0 40px rgba(56, 189, 248, 0.2));
    }

    /* --- Menu Grid --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2rem;
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        padding-bottom: 2rem;
    }

    .menu-card {
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.7) 0%, rgba(15, 23, 42, 0.3) 100%);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        backdrop-filter: blur(8px);
    }

    .menu-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 50%);
        pointer-events: none;
    }

    /* Hover Effect */
    .menu-card:hover {
        transform: translateY(-6px);
        background: linear-gradient(180deg, rgba(22, 33, 56, 0.9) 0%, rgba(15, 23, 42, 0.7) 100%);
        border-color: rgba(56, 189, 248, 0.4);
        box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 20px rgba(56, 189, 248, 0.08);
    }

    .menu-card:hover .card-icon svg {
        fill: var(--magic-glow);
        filter: drop-shadow(0 0 8px var(--magic-primary));
        transform: scale(1.15);
    }

    .menu-card:hover .card-label {
        color: var(--text-main);
        text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    /* Icon Styling */
    .card-icon {
        width: 32px;
        height: 32px;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0.8;
    }

    .card-icon svg {
        width: 100%;
        height: 100%;
        fill: var(--text-muted);
        transition: all 0.5s ease;
    }

    .card-label {
        font-family: var(--font-display);
        font-size: 1.1rem;
        color: var(--text-muted);
        letter-spacing: 0.08em;
        font-weight: 600;
        transition: all 0.4s ease;
    }

    /* --- Special Summon Card --- */
    .menu-card.summon {
        background: linear-gradient(180deg, rgba(35, 28, 10, 0.7) 0%, rgba(20, 16, 8, 0.5) 100%);
        border: 1px solid rgba(207, 170, 72, 0.3);
        box-shadow: 0 4px 15px rgba(0,0,0,0.3), inset 0 0 25px rgba(207, 170, 72, 0.03);
    }
    
    .menu-card.summon .card-icon svg {
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 5px var(--gold-shadow));
    }

    .menu-card.summon .card-label {
        color: var(--gold-highlight);
    }

    .menu-card.summon:hover {
        border-color: rgba(207, 170, 72, 0.7);
        background: linear-gradient(180deg, rgba(45, 38, 15, 0.9) 0%, rgba(25, 20, 10, 0.7) 100%);
        box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 20px rgba(207, 170, 72, 0.12);
    }
    
    .menu-card.summon:hover .card-icon svg {
        fill: var(--gold-highlight);
        filter: drop-shadow(0 0 12px var(--gold-primary));
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.8rem;
        opacity: 0.5;
        padding-top: 1.5rem;
        letter-spacing: 0.12em;
        font-family: var(--font-ui);
        font-weight: 300;
    }

    /* --- Animations --- */
    @keyframes float-orb {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-10px) scale(1.02); }
    }
    
    .orb-container {
        animation: float-orb 8s ease-in-out infinite;
    }

    /* --- Responsive --- */
    @media (max-width: 850px) {
        .app-container { padding: 1.5rem; }
        .game-title { font-size: 3rem; letter-spacing: 0.15em; }
        .game-subtitle { font-size: 0.75rem; letter-spacing: 0.4em; text-indent: 0.4em; }
        .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .orb-container { width: 200px; height: 200px; margin-top: -1rem; }
    }

    @media (max-width: 480px) {
        .menu-grid { grid-template-columns: 1fr; gap: 0.8rem; }
        .menu-card { flex-direction: row; padding: 0.8rem 1.2rem; justify-content: flex-start; gap: 1.2rem; }
        .card-icon { width: 24px; height: 24px; }
        .card-label { font-size: 1rem; }
        .currency-pill { padding: 0.5rem 1rem; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="ambient-canvas"></canvas>
    <div class="atmosphere-overlay"></div>
    <div class="noise-overlay"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <div class="coin-icon">
                    <!-- Detailed Coin Icon -->
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20Z" fill="currentColor"/>
                        <path d="M12 6C8.69 6 6 8.69 6 12C6 15.31 8.69 18 12 18C15.31 18 18 15.31 18 12C18 8.69 15.31 6 12 6ZM12 16C9.79 16 8 14.21 8 12C8 9.79 9.79 8 12 8C14.21 8 16 9.79 16 12C16 14.21 14.21 16 12 16Z" fill="currentColor"/>
                        <path d="M11 10H13V14H11V10Z" fill="currentColor"/>
                    </svg>
                </div>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <div class="orb-container">
                <!-- Procedural Orb SVG -->
                <svg class="orb-svg" viewBox="0 0 100 100">
                    <defs>
                        <!-- Orb Body Gradient -->
                        <radialGradient id="orbBody" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="0%" style="stop-color:#7dd3fc;stop-opacity:0.9" />
                            <stop offset="30%" style="stop-color:#0284c7;stop-opacity:0.6" />
                            <stop offset="80%" style="stop-color:#0f172a;stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0" />
                        </radialGradient>
                        <!-- Inner Core Gradient -->
                        <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                            <stop offset="40%" style="stop-color:#bae6fd;stop-opacity:0.6" />
                            <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0" />
                        </radialGradient>
                        <!-- Filter for Glow -->
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    
                    <!-- Ambient Aura -->
                    <circle cx="50" cy="50" r="42" fill="url(#orbBody)" filter="url(#glow)">
                        <animate attributeName="r" values="40;44;40" dur="5s" repeatCount="indefinite" />
                        <animate attributeName="opacity" values="0.8;1;0.8" dur="5s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Intense Core -->
                    <circle cx="50" cy="50" r="10" fill="url(#coreGlow)" filter="url(#glow)">
                        <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite" />
                    </circle>

                    <!-- Mystical Rings -->
                    <g stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.5" fill="none">
                        <!-- Outer Ring -->
                        <circle cx="50" cy="50" r="46">
                            <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="40s" repeatCount="indefinite" />
                        </circle>
                        <!-- Inner Dashed Ring -->
                        <circle cx="50" cy="50" r="48" stroke-dasharray="4 8" stroke="rgba(255,255,255,0.15)">
                            <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="60s" repeatCount="indefinite" />
                        </circle>
                    </g>
                </svg>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <div class="card-icon">
                    <!-- Crystal Icon -->
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 12l10 10 10-10L12 2zm0 3.5L18.5 12 12 18.5 5.5 12 12 5.5z"/></svg>
                </div>
                <span class="card-label">Summon</span>
            </div>

            <!-- Roster -->
            <div class="menu-card" onclick="interact('Roster')">
                <div class="card-icon">
                    <!-- User Group Icon -->
                    <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                </div>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card" onclick="interact('Battle')">
                <div class="card-icon">
                    <!-- Lightning Bolt Icon -->
                    <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
                </div>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card" onclick="interact('Grind')">
                <div class="card-icon">
                    <!-- Settings/Gear Icon -->
                    <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.35 0-.64.22-.7.55l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.06.33.35.55.7.55h4c.35 0 .64-.22.7-.55l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
                </div>
                <span class="card-label">Grind</span>
            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 • Offline Mode
        </footer>
    </div>

<script>
    // --- Advanced Background Particle System ---
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    let time = 0;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
            // Randomize initial Y so they don't all start at bottom
            this.y = Math.random() * height;
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 50;
            // Slower, more ethereal movement
            this.vx = (Math.random() - 0.5) * 0.05;
            this.vy = -(Math.random() * 0.15 + 0.02); 
            this.size = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.3;
            
            // Color Mix: Mostly Cyan/White, Rare Gold
            const isGold = Math.random() > 0.92;
            if (isGold) {
                this.color = `207, 170, 72`; // Gold
            } else {
                // Mix of white and teal
                const r = Math.random() > 0.5 ? 255 : 56;
                const g = Math.random() > 0.5 ? 255 : 189;
                const b = Math.random() > 0.5 ? 255 : 248;
                this.color = `${r}, ${g}, ${b}`;
            }
            this.baseAlpha = this.alpha;
            this.pulseSpeed = Math.random() * 0.02 + 0.005;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            // Gentle pulsing
            this.alpha = this.baseAlpha + Math.sin(time * this.pulseSpeed + this.x) * 0.1;

            if (this.y < -10 || this.alpha <= 0) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${Math.max(0, this.alpha)})`;
            // Only add shadow blur to a few particles for performance
            if (this.size > 1.2) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = `rgba(${this.color}, ${Math.max(0, this.alpha)})`;
            } else {
                ctx.shadowBlur = 0;
            }
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // Density calculation
        const count = Math.floor((width * height) / 15000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        time++;
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        // Subtle scale down
        btn.style.transform = 'scale(0.96)';
        // Add a quick flash effect
        const flash = document.createElement('div');
        flash.style.position = 'absolute';
        flash.style.inset = '0';
        flash.style.background = 'rgba(255,255,255,0.1)';
        flash.style.zIndex = '5';
        flash.style.pointerEvents = 'none';
        flash.style.transition = 'opacity 0.3s';
        btn.appendChild(flash);
        
        setTimeout(() => {
            flash.style.opacity = '0';
        }, 50);
        
        setTimeout(() => {
            btn.style.transform = '';
            flash.remove();
        }, 300);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
