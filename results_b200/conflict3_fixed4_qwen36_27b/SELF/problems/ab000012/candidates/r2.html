<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherbound - Spirit Summoning</title>
<style>
    :root {
        /* Color Palette */
        --bg-deep: #020203;
        --bg-gradient-start: #0a0c10;
        --bg-gradient-end: #020203;
        
        --gold-primary: #d4af37;
        --gold-light: #f3e5ab;
        --gold-dark: #8a6e1c;
        
        --magic-primary: #2dd4bf; /* Teal/Cyan */
        --magic-glow: #5eead4;
        --magic-dim: #0f766e;
        
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        
        --card-bg: rgba(15, 23, 42, 0.6);
        --card-border: rgba(148, 163, 184, 0.1);
        --card-hover-border: rgba(45, 212, 191, 0.4);
        
        --font-display: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
        --font-ui: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* --- Background & Atmosphere --- */
    #ambient-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    /* Vignette & Texture */
    .atmosphere-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: 
            radial-gradient(circle at center, rgba(45, 212, 191, 0.05) 0%, transparent 60%),
            radial-gradient(circle at bottom, rgba(212, 175, 55, 0.03) 0%, transparent 50%),
            radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.85) 100%);
    }

    .noise-overlay {
        position: absolute;
        inset: 0;
        opacity: 0.07;
        z-index: 2;
        pointer-events: none;
        /* High quality noise pattern */
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Layout --- */
    .app-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1200px;
        height: 100%;
        padding: 2rem 3rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* --- Header --- */
    header {
        display: flex;
        justify-content: flex-end;
        padding-bottom: 1rem;
    }

    .currency-pill {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--gold-dark);
        border-radius: 4px;
        padding: 0.5rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 15px rgba(212, 175, 55, 0.05);
        backdrop-filter: blur(10px);
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
    }

    .currency-pill::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        opacity: 0.5;
    }

    .currency-pill:hover {
        border-color: var(--gold-primary);
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 0 15px rgba(212, 175, 55, 0.1);
    }

    .coin-icon {
        width: 20px;
        height: 20px;
        color: var(--gold-primary);
        filter: drop-shadow(0 0 2px var(--gold-dark));
    }

    .currency-amount {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.1rem;
        color: var(--gold-light);
        letter-spacing: 0.05em;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* --- Hero Section --- */
    .hero-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        padding-bottom: 2rem;
    }

    .game-title {
        font-family: var(--font-display);
        font-size: clamp(3rem, 6vw, 5.5rem);
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        margin-bottom: 0.5rem;
        background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-primary) 60%, var(--gold-dark) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 15px rgba(212, 175, 55, 0.25));
        position: relative;
        z-index: 10;
        line-height: 1;
    }

    .game-subtitle {
        font-family: var(--font-ui);
        font-size: 0.95rem;
        color: var(--magic-primary);
        letter-spacing: 0.8em;
        text-transform: uppercase;
        margin-bottom: 3rem;
        opacity: 0.9;
        text-shadow: 0 0 15px rgba(45, 212, 191, 0.4);
        text-indent: 0.8em; /* Align with letter-spacing */
    }

    /* --- The Orb --- */
    .orb-container {
        position: relative;
        width: 260px;
        height: 260px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: -2rem;
    }

    .orb-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        animation: orb-float 10s ease-in-out infinite;
    }

    /* --- Menu Grid --- */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        padding-bottom: 1rem;
    }

    .menu-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        backdrop-filter: blur(5px);
    }

    /* Shine effect */
    .menu-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
        transition: left 0.7s ease;
    }

    .menu-card:hover {
        transform: translateY(-5px);
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
        border-color: var(--card-hover-border);
        box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 15px rgba(45, 212, 191, 0.1);
    }

    .menu-card:hover::after {
        left: 100%;
    }

    .menu-card:hover .card-icon svg {
        fill: var(--magic-glow);
        filter: drop-shadow(0 0 8px var(--magic-primary));
        transform: scale(1.15);
    }

    .menu-card:hover .card-label {
        color: var(--text-main);
        text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .card-icon {
        width: 32px;
        height: 32px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card-icon svg {
        width: 100%;
        height: 100%;
        fill: var(--text-muted);
        transition: all 0.4s ease;
    }

    .card-label {
        font-family: var(--font-display);
        font-size: 1.1rem;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    /* --- Special Summon Card --- */
    .menu-card.summon {
        background: linear-gradient(180deg, rgba(40, 30, 10, 0.4) 0%, rgba(20, 15, 5, 0.6) 100%);
        border: 1px solid rgba(212, 175, 55, 0.3);
        box-shadow: 0 4px 15px rgba(0,0,0,0.3), 0 0 10px rgba(212, 175, 55, 0.05);
    }
    
    .menu-card.summon::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
        pointer-events: none;
    }

    .menu-card.summon .card-icon svg {
        fill: var(--gold-primary);
        filter: drop-shadow(0 0 5px var(--gold-dark));
    }

    .menu-card.summon .card-label {
        color: var(--gold-light);
    }

    .menu-card.summon:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 20px rgba(212, 175, 55, 0.15);
    }
    
    .menu-card.summon:hover .card-icon svg {
        fill: var(--gold-light);
        filter: drop-shadow(0 0 12px var(--gold-primary));
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.75rem;
        opacity: 0.4;
        padding-top: 1rem;
        letter-spacing: 0.1em;
    }

    /* --- Animations --- */
    @keyframes orb-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-10px) scale(1.01); }
    }

    /* --- Responsive --- */
    @media (max-width: 850px) {
        .app-container { padding: 1.5rem; }
        .game-title { font-size: 3rem; letter-spacing: 0.15em; }
        .game-subtitle { font-size: 0.8rem; letter-spacing: 0.4em; text-indent: 0.4em; }
        .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .orb-container { width: 180px; height: 180px; margin-top: 0; }
        .hero-section { margin-bottom: 1rem; }
    }

    @media (max-width: 480px) {
        .menu-grid { grid-template-columns: 1fr; }
        .menu-card { flex-direction: row; padding: 1rem; justify-content: flex-start; gap: 1.5rem; }
        .card-icon { width: 28px; height: 28px; }
    }
</style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="ambient-canvas"></canvas>
    <div class="atmosphere-overlay"></div>
    <div class="noise-overlay"></div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="currency-pill">
                <div class="coin-icon">
                    <!-- Detailed Gold Coin SVG -->
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 6V18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M8 10L12 6L16 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M8 14L12 18L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="currency-amount">12,450</span>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero-section">
            <h1 class="game-title">Aetherbound</h1>
            <p class="game-subtitle">Spirit Summoning</p>

            <div class="orb-container">
                <!-- Procedural Orb SVG -->
                <svg class="orb-svg" viewBox="0 0 100 100">
                    <defs>
                        <!-- Outer Glow -->
                        <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                            <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.8" />
                            <stop offset="40%" style="stop-color:#0f766e;stop-opacity:0.4" />
                            <stop offset="100%" style="stop-color:#020203;stop-opacity:0" />
                        </radialGradient>
                        <!-- Inner Core -->
                        <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
                            <stop offset="60%" style="stop-color:#5eead4;stop-opacity:0.4" />
                            <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:0" />
                        </radialGradient>
                        <!-- Filter for soft glow -->
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    
                    <!-- Ambient Aura -->
                    <circle cx="50" cy="50" r="40" fill="url(#orbGrad)" filter="url(#glow)">
                        <animate attributeName="r" values="38;42;38" dur="6s" repeatCount="indefinite" />
                        <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite" />
                    </circle>
                    
                    <!-- Intense Core -->
                    <circle cx="50" cy="50" r="12" fill="url(#innerGlow)" filter="url(#glow)">
                        <animate attributeName="r" values="10;14;10" dur="3s" repeatCount="indefinite" />
                    </circle>

                    <!-- Mystical Rings -->
                    <g stroke="rgba(45, 212, 191, 0.4)" stroke-width="0.5" fill="none">
                        <!-- Solid Ring -->
                        <circle cx="50" cy="50" r="45">
                            <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="50s" repeatCount="indefinite" />
                        </circle>
                        <!-- Dashed Ring -->
                        <circle cx="50" cy="50" r="48" stroke-dasharray="2 6" stroke="rgba(255,255,255,0.2)">
                            <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="70s" repeatCount="indefinite" />
                        </circle>
                    </g>
                </svg>
            </div>
        </section>

        <!-- Menu Grid -->
        <nav class="menu-grid">
            <!-- Summon -->
            <div class="menu-card summon" onclick="interact('Summon')">
                <div class="card-icon">
                    <!-- Gem Icon -->
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 12l10 10 10-10L12 2zm0 3.5L18.5 12 12 18.5 5.5 12 12 5.5z" /></svg>
                </div>
                <span class="card-label">Summon</span>
            </div>

            <!-- Roster -->
            <div class="menu-card" onclick="interact('Roster')">
                <div class="card-icon">
                    <!-- Spirit Group Icon -->
                    <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                </div>
                <span class="card-label">Roster</span>
            </div>

            <!-- Battle -->
            <div class="menu-card" onclick="interact('Battle')">
                <div class="card-icon">
                    <!-- Lightning Icon -->
                    <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
                </div>
                <span class="card-label">Battle</span>
            </div>

            <!-- Grind -->
            <div class="menu-card" onclick="interact('Grind')">
                <div class="card-icon">
                    <!-- Gear Icon -->
                    <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.35 0-.64.22-.7.55l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.06.33.35.55.7.55h4c.35 0 .64-.22.7-.55l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
                </div>
                <span class="card-label">Grind</span>
            </div>
        </nav>

        <footer>
            Aetherbound v1.0.4 • Offline Mode
        </footer>
    </div>

<script>
    // --- Advanced Background Particle System ---
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    let time = 0;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    class Particle {
        constructor() {
            this.reset();
            // Randomize initial Y so they don't all start at bottom
            this.y = Math.random() * height;
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            // Slower, more ethereal movement
            this.vx = (Math.random() - 0.5) * 0.15;
            this.vy = -(Math.random() * 0.3 + 0.05); 
            this.size = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.3;
            this.fadeSpeed = Math.random() * 0.001 + 0.0005;
            
            // Color Mix: Mostly Cyan/White, Rare Gold
            const isGold = Math.random() > 0.9;
            if (isGold) {
                this.color = `212, 175, 55`; // Gold
            } else {
                // Mix of white and teal
                const r = Math.random() > 0.5 ? 255 : 45;
                const g = Math.random() > 0.5 ? 255 : 212;
                const b = Math.random() > 0.5 ? 255 : 191;
                this.color = `${r}, ${g}, ${b}`;
            }
            this.baseAlpha = this.alpha;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            // Gentle pulsing
            this.alpha = this.baseAlpha + Math.sin(time * 0.02 + this.x) * 0.1;

            if (this.y < -10 || this.alpha <= 0) {
                this.reset();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${this.color}, ${Math.max(0, this.alpha)})`;
            // Only add shadow blur to a few particles for performance
            if (this.size > 1.2) {
                ctx.shadowBlur = 8;
                ctx.shadowColor = `rgba(${this.color}, ${Math.max(0, this.alpha)})`;
            } else {
                ctx.shadowBlur = 0;
            }
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        // Density calculation
        const count = Math.floor((width * height) / 10000); 
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        time++;
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }
        requestAnimationFrame(animate);
    }

    // --- Interactions ---
    window.addEventListener('resize', () => {
        resize();
        initParticles();
    });

    function interact(action) {
        const btn = event.currentTarget;
        // Subtle scale down
        btn.style.transform = 'scale(0.96)';
        // Add a quick flash effect
        const flash = document.createElement('div');
        flash.style.position = 'absolute';
        flash.style.inset = '0';
        flash.style.background = 'rgba(255,255,255,0.15)';
        flash.style.zIndex = '5';
        flash.style.pointerEvents = 'none';
        btn.appendChild(flash);
        
        setTimeout(() => {
            btn.style.transform = '';
            flash.remove();
        }, 150);
        
        console.log(`Action triggered: ${action}`);
    }

    // Initialize
    resize();
    initParticles();
    animate();

</script>
</body>
</html>
