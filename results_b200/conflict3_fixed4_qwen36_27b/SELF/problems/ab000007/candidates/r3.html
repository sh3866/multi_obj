<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AETHER: Bioluminescence</title>
<style>
  :root {
    --bg-deep: #020204;
    --bg-panel: rgba(10, 12, 20, 0.65);
    --border-panel: rgba(255, 255, 255, 0.08);
    --accent-cyan: #00f2ff;
    --accent-glow: rgba(0, 242, 255, 0.4);
    --text-main: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.4);
    --font-display: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Fira Code", "Roboto Mono", monospace;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-display);
    overflow: hidden;
    cursor: none; /* Custom cursor only */
  }

  /* --- Layout --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  /* Cinematic Grain & Vignette */
  .overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
    background: 
      radial-gradient(circle at center, transparent 0%, var(--bg-deep) 120%),
      linear-gradient(0deg, rgba(0,0,0,0.4) 0%, transparent 40%);
  }

  /* Noise Texture */
  .grain {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.07;
    pointer-events: none;
    z-index: 6;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Canvas */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(1.5rem, 4vw, 3rem);
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    mix-blend-mode: exclusion;
  }

  h1 {
    font-size: clamp(2.5rem, 5vw, 4rem);
    margin: 0;
    letter-spacing: 0.15em;
    font-weight: 900;
    color: white;
    text-transform: uppercase;
    line-height: 0.9;
    /* Subtle gradient text */
    background: linear-gradient(to bottom, #fff, #ccc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-family: var(--font-mono);
    font-size: clamp(0.6rem, 1.2vw, 0.8rem);
    color: var(--accent-cyan);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    opacity: 0.8;
    font-weight: 600;
    text-shadow: 0 0 15px var(--accent-glow);
  }

  /* HUD Panel */
  .hud-panel {
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-panel);
    border-top: 1px solid rgba(255,255,255,0.15);
    padding: 0.6rem 1.2rem;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    min-width: 140px;
    justify-content: space-between;
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  
  .hud-panel.pulse {
    transform: scale(1.08);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 30px var(--accent-glow);
  }

  .hud-icon {
    width: 20px; height: 20px;
    fill: var(--accent-cyan);
    filter: drop-shadow(0 0 4px var(--accent-cyan));
  }

  .stat-group {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .stat-value {
    font-family: var(--font-mono);
    font-size: 1.4rem;
    font-weight: 700;
    color: white;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .stat-label {
    font-family: var(--font-mono);
    font-size: 0.55rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-top: 4px;
  }

  /* Footer / Actions */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    margin-bottom: 1rem;
  }

  .btn-main {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-panel);
    color: rgba(255,255,255,0.7);
    font-family: var(--font-display);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 1rem 2.5rem;
    border-radius: 100px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-main:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255,255,255,0.3);
    color: #fff;
    box-shadow: 0 0 20px rgba(255,255,255,0.05);
  }
  
  .btn-main:active {
    transform: scale(0.95);
  }

  @media (max-width: 600px) {
    .ui-layer { padding: 1.2rem; }
    .btn-main { padding: 0.8rem 2rem; font-size: 0.65rem; width: 100%; max-width: 260px; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Overlays -->
  <div class="overlay"></div>
  <div class="grain"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Aether</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-panel" id="hudPanel">
        <svg class="hud-icon" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" />
        </svg>
        <div class="stat-group">
          <div class="stat-value" id="scoreDisplay">00</div>
          <div class="stat-label">Specimens</div>
        </div>
      </div>
    </header>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Aether Catcher - High Fidelity Canvas Rendering
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const hudPanel = document.getElementById('hudPanel');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let time = 0;

  // Configuration - Bioluminescent Palette
  const PALETTE = [
    { hex: '#00f0ff', name: 'Cyan' },   // Electric
    { hex: '#bd00ff', name: 'Violet' }, // Neon
    { hex: '#ff0055', name: 'Magenta'}, // Pulse
    { hex: '#ccff00', name: 'Lime' }    // Toxic
  ];
  const CREATURE_COUNT = 6;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.025 + 0.01;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.94; 
      this.vy *= 0.94;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset();
      // Scatter initial positions
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    }

    reset() {
      // Spawn off-screen or random
      const side = Math.random() > 0.5 ? -100 : width + 100;
      this.x = Math.random() > 0.5 ? side : Math.random() * width;
      this.y = Math.random() * height;
      
      // Movement physics
      this.vx = (Math.random() - 0.5) * 2;
      this.vy = (Math.random() - 0.5) * 2;
      
      this.radius = Math.random() * 8 + 12;
      this.colorObj = PALETTE[Math.floor(Math.random() * PALETTE.length)];
      
      // Animation props
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.03 + 0.01;
      this.isCaught = false;
      this.trail = [];
      this.angle = 0;
    }

    update() {
      if (this.isCaught) return;

      // Move
      this.x += this.vx;
      this.y += this.vy;
      this.wobble += this.wobbleSpeed;
      this.angle += 0.02;
      
      // Organic Sine drift
      this.x += Math.sin(this.wobble) * 0.2;

      // Wall Bounce
      if (this.x < -50) this.vx = Math.abs(this.vx);
      if (this.x > width + 50) this.vx = -Math.abs(this.vx);
      if (this.y < -50) this.vy = Math.abs(this.vy);
      if (this.y > height + 50) this.vy = -Math.abs(this.vy);

      // Mouse Interaction (Flee)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 250) {
        const force = (250 - dist) / 250;
        const angle = Math.atan2(dy, dx);
        // Smooth push
        this.vx += Math.cos(angle) * force * 0.2;
        this.vy += Math.sin(angle) * force * 0.2;
      }

      // Terminal velocity
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 4) {
        this.vx = (this.vx / speed) * 4;
        this.vy = (this.vy / speed) * 4;
      }

      // Trail
      if (time % 3 === 0) {
        this.trail.push({x: this.x, y: this.y, life: 1.0});
      }
      this.trail.forEach(t => t.life -= 0.02);
      this.trail = this.trail.filter(t => t.life > 0);
    }

    draw(ctx) {
      if (this.isCaught) return;

      // Draw Trail
      this.trail.forEach(t => {
        ctx.globalAlpha = t.life * 0.3;
        ctx.fillStyle = this.colorObj.hex;
        ctx.beginPath();
        ctx.arc(t.x, t.y, this.radius * 0.5, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Soft Glow
      ctx.shadowBlur = 30;
      ctx.shadowColor = this.colorObj.hex;
      
      // Body - Organic Blob
      ctx.fillStyle = this.colorObj.hex;
      ctx.beginPath();
      const r = this.radius;
      // Subtle breathing animation
      const breathe = Math.sin(time * 0.05) * 1.5;
      
      ctx.moveTo(r + breathe, 0);
      ctx.bezierCurveTo(r + 4, r + breathe, -r - 4, r + breathe, -r - breathe, 0);
      ctx.bezierCurveTo(-r - 4, -r - breathe, r + 4, -r - breathe, r + breathe, 0);
      ctx.fill();

      // Core - High brightness center
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(2, 2, r * 0.2, 0, Math.PI * 2);
      ctx.fill();

      // Eyes (Simple)
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath();
      ctx.arc(4, -2, r * 0.1, 0, Math.PI * 2);
      ctx.arc(-4, -2, r * 0.1, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    updateScoreUI();
  }

  function updateScoreUI() {
    scoreEl.innerText = score < 10 ? `0${score}` : score;
    
    // Pulse animation on HUD
    hudPanel.classList.add('pulse');
    setTimeout(() => hudPanel.classList.remove('pulse'), 200);
  }

  function checkCatch() {
    const catchRadius = 80; // Slightly larger hit area

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    updateScoreUI();
    
    // Explosion FX
    for(let i=0; i<40; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.colorObj.hex));
    }

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 2000);
  }

  function resetGame() {
    init();
  }

  function drawNet() {
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Outer Glow
    ctx.shadowBlur = 15;
    ctx.shadowColor = 'rgba(0, 242, 255, 0.3)';
    
    // Outer Ring
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(0, 242, 255, 0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, 60, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner Tech Ring
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.2)';
    ctx.setLineDash([2, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, 45, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Crosshair
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.8)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-12, 0); ctx.lineTo(12, 0);
    ctx.moveTo(0, -12); ctx.lineTo(0, 12);
    ctx.stroke();

    // Center Dot
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 2, 0, Math.PI * 2);
    ctx.fill();

    // "Sucking" visual when held
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.beginPath();
      ctx.arc(0, 0, 80, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function loop() {
    time++;
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
