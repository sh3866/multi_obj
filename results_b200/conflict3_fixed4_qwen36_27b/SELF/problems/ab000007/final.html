<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AETHER: Bioluminescence</title>
<style>
  :root {
    --bg-deep: #050508;
    --bg-panel: rgba(255, 255, 255, 0.03);
    --border-panel: rgba(255, 255, 255, 0.1);
    --accent-cyan: #00f2ff;
    --accent-glow: rgba(0, 242, 255, 0.6);
    --text-main: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.4);
    --font-display: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Fira Code", "Roboto Mono", "Courier New", monospace;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-display);
    overflow: hidden;
    cursor: none; /* Custom cursor only */
  }

  /* --- Layout --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  /* Cinematic Grain & Vignette */
  .overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
    background: 
      radial-gradient(circle at center, transparent 0%, var(--bg-deep) 100%),
      linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 30%);
    mix-blend-mode: multiply;
  }

  /* Noise Texture */
  .grain {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.07;
    pointer-events: none;
    z-index: 6;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  /* Canvas */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(1.5rem, 4vw, 3rem);
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  h1 {
    font-size: clamp(2.5rem, 7vw, 6rem);
    margin: 0;
    letter-spacing: 0.05em;
    font-weight: 800;
    color: white;
    text-transform: uppercase;
    line-height: 0.9;
    /* Subtle gradient text */
    background: linear-gradient(to bottom, #ffffff 30%, #888888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(255,255,255,0.1));
  }

  .subtitle {
    font-family: var(--font-mono);
    font-size: clamp(0.6rem, 1.2vw, 0.8rem);
    color: var(--accent-cyan);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    opacity: 0.8;
    font-weight: 600;
    text-shadow: 0 0 15px var(--accent-glow);
    margin-top: 5px;
  }

  /* HUD Panel - Redesigned */
  .hud-panel {
    background: var(--bg-panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-panel);
    padding: 1rem 1.8rem;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 1.2rem;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    min-width: 180px;
    justify-content: space-between;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
  }
  
  /* Decorative accent bar */
  .hud-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 3px; height: 100%;
    background: var(--accent-cyan);
    box-shadow: 0 0 15px var(--accent-cyan);
  }

  .hud-panel.pulse {
    transform: scale(1.05);
    border-color: rgba(0, 242, 255, 0.4);
    box-shadow: 0 0 30px rgba(0, 242, 255, 0.15);
  }

  .hud-icon {
    width: 28px; height: 28px;
    fill: var(--accent-cyan);
    filter: drop-shadow(0 0 8px var(--accent-cyan));
  }

  .stat-group {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .stat-value {
    font-family: var(--font-mono);
    font-size: 2rem;
    font-weight: 700;
    color: white;
    line-height: 1;
    letter-spacing: -0.03em;
  }

  .stat-label {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-top: 6px;
  }

  /* Footer / Actions */
  .footer {
    display: flex;
    justify-content: center;
    pointer-events: auto;
    margin-bottom: 1rem;
  }

  .btn-main {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(15px);
    border: 1px solid var(--border-panel);
    color: rgba(255,255,255,0.8);
    font-family: var(--font-display);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 1.2rem 3.5rem;
    border-radius: 100px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-main:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255,255,255,0.3);
    color: #fff;
    box-shadow: 0 0 30px rgba(255,255,255,0.05);
    transform: translateY(-2px);
  }
  
  .btn-main:active {
    transform: translateY(1px) scale(0.98);
  }

  /* Notification Toast */
  .toast {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border-panel);
    padding: 1rem 2rem;
    border-radius: 8px;
    color: var(--accent-cyan);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    z-index: 20;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 600px) {
    .ui-layer { padding: 1.2rem; }
    .btn-main { padding: 0.9rem 2.5rem; font-size: 0.6rem; width: 100%; max-width: 280px; }
    .hud-panel { min-width: 140px; padding: 0.8rem 1.2rem; }
    .stat-value { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <!-- Visual Overlays -->
  <div class="overlay"></div>
  <div class="grain"></div>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Aether</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-panel" id="hudPanel">
        <!-- Star Icon -->
        <svg class="hud-icon" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" />
        </svg>
        <div class="stat-group">
          <div class="stat-value" id="scoreDisplay">00</div>
          <div class="stat-label">Specimens</div>
        </div>
      </div>
    </header>

    <div class="toast" id="toast">Specimen Secured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">New Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Aether Catcher - High Fidelity Canvas Rendering
   */
  
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const hudPanel = document.getElementById('hudPanel');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  let mouse = { x: -1000, y: -1000 };
  let isMouseDown = false;
  let time = 0;

  // Configuration - Bioluminescent Palette
  const PALETTE = [
    { hex: '#00f0ff', name: 'Cyan' },   // Electric
    { hex: '#bd00ff', name: 'Violet' }, // Neon
    { hex: '#ff0055', name: 'Magenta'}, // Pulse
    { hex: '#ccff00', name: 'Lime' }    // Toxic
  ];
  const CREATURE_COUNT = 6;

  // Resize Handling
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  // Touch support
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 6 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.025 + 0.01;
      this.size = Math.random() * 3 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.94; 
      this.vy *= 0.94;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset();
      // Scatter initial positions
      this.x = Math.random() * width;
      this.y = Math.random() * height;
    }

    reset() {
      // Spawn off-screen or random
      const side = Math.random() > 0.5 ? -100 : width + 100;
      this.x = Math.random() > 0.5 ? side : Math.random() * width;
      this.y = Math.random() * height;
      
      // Movement physics
      this.vx = (Math.random() - 0.5) * 2;
      this.vy = (Math.random() - 0.5) * 2;
      
      this.radius = Math.random() * 8 + 12;
      this.colorObj = PALETTE[Math.floor(Math.random() * PALETTE.length)];
      
      // Animation props
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.03 + 0.01;
      this.isCaught = false;
      this.trail = [];
      this.angle = 0;
      // Shape variation
      this.points = Math.floor(Math.random() * 3) + 5; // 5 to 7 points for organic look
    }

    update() {
      if (this.isCaught) return;

      // Move
      this.x += this.vx;
      this.y += this.vy;
      this.wobble += this.wobbleSpeed;
      this.angle += 0.02;
      
      // Organic Sine drift
      this.x += Math.sin(this.wobble) * 0.3;

      // Wall Bounce
      if (this.x < -50) this.vx = Math.abs(this.vx);
      if (this.x > width + 50) this.vx = -Math.abs(this.vx);
      if (this.y < -50) this.vy = Math.abs(this.vy);
      if (this.y > height + 50) this.vy = -Math.abs(this.vy);

      // Mouse Interaction (Flee)
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 300) {
        const force = (300 - dist) / 300;
        const angle = Math.atan2(dy, dx);
        // Smooth push
        this.vx += Math.cos(angle) * force * 0.3;
        this.vy += Math.sin(angle) * force * 0.3;
      }

      // Terminal velocity
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 5) {
        this.vx = (this.vx / speed) * 5;
        this.vy = (this.vy / speed) * 5;
      }

      // Trail
      if (time % 4 === 0) {
        this.trail.push({x: this.x, y: this.y, life: 1.0});
      }
      this.trail.forEach(t => t.life -= 0.02);
      this.trail = this.trail.filter(t => t.life > 0);
    }

    draw(ctx) {
      if (this.isCaught) return;

      // Draw Trail
      this.trail.forEach(t => {
        ctx.globalAlpha = t.life * 0.2;
        ctx.fillStyle = this.colorObj.hex;
        ctx.beginPath();
        ctx.arc(t.x, t.y, this.radius * 0.6, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;

      ctx.save();
      ctx.translate(this.x, this.y);
      
      // Soft Glow
      ctx.shadowBlur = 40;
      ctx.shadowColor = this.colorObj.hex;
      
      // Body - Organic Blob
      ctx.fillStyle = this.colorObj.hex;
      ctx.beginPath();
      const r = this.radius;
      // Subtle breathing animation
      const breathe = Math.sin(time * 0.05) * 1.5;
      
      // Draw organic shape based on points
      for (let i = 0; i <= this.points; i++) {
        const theta = (i / this.points) * Math.PI * 2;
        // Add wobble to radius
        const currentR = r + breathe + Math.sin(theta * 3 + time * 0.05) * 2;
        const px = Math.cos(theta) * currentR;
        const py = Math.sin(theta) * currentR;
        if (i === 0) ctx.moveTo(px, py);
        else {
            // Curve to next point
            const nextTheta = ((i + 0.5) / this.points) * Math.PI * 2;
            const nextR = r + breathe + Math.sin(nextTheta * 3 + time * 0.05) * 2;
            const cpx = Math.cos(nextTheta) * (nextR * 1.2); // Control point slightly further out
            const cpy = Math.sin(nextTheta) * (nextR * 1.2);
            ctx.quadraticCurveTo(cpx, cpy, Math.cos(nextTheta * 2) * nextR, Math.sin(nextTheta * 2) * nextR);
        }
      }
      ctx.closePath();
      ctx.fill();

      // Core - High brightness center
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(2, 2, r * 0.25, 0, Math.PI * 2);
      ctx.fill();

      // Eyes (Simple)
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.beginPath();
      ctx.arc(4, -2, r * 0.12, 0, Math.PI * 2);
      ctx.arc(-4, -2, r * 0.12, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Game Functions ---

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    updateScoreUI();
  }

  function updateScoreUI() {
    scoreEl.innerText = score < 10 ? `0${score}` : score;
    
    // Pulse animation on HUD
    hudPanel.classList.add('pulse');
    setTimeout(() => hudPanel.classList.remove('pulse'), 300);
  }

  function showToast(text) {
    toastEl.innerText = text;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  function checkCatch() {
    const catchRadius = 90; // Slightly larger hit area

    let caughtCount = 0;
    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - mouse.x;
      const dy = c.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
        caughtCount++;
      }
    });
    
    if(caughtCount > 0) {
        showToast(`Captured ${caughtCount} Specimen${caughtCount > 1 ? 's' : ''}`);
    }
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    updateScoreUI();
    
    // Explosion FX
    for(let i=0; i<50; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.colorObj.hex));
    }

    // Respawn
    setTimeout(() => {
      creature.reset();
    }, 2000);
  }

  function resetGame() {
    init();
    showToast("Collection Reset");
  }

  function drawNet() {
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    
    // Net Outer Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = 'rgba(0, 242, 255, 0.4)';
    
    // Outer Ring
    ctx.strokeStyle = isMouseDown ? '#fff' : 'rgba(0, 242, 255, 0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 65, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner Tech Ring
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.3)';
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.arc(0, 0, 48, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Crosshair
    ctx.strokeStyle = 'rgba(0, 242, 255, 0.9)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-15, 0); ctx.lineTo(15, 0);
    ctx.moveTo(0, -15); ctx.lineTo(0, 15);
    ctx.stroke();

    // Center Dot
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    // "Sucking" visual when held
    if (isMouseDown) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 85, 0, Math.PI * 2);
      ctx.stroke();
      
      // Inner suction lines
      ctx.strokeStyle = 'rgba(0, 242, 255, 0.1)';
      for(let i=0; i<8; i++) {
          ctx.beginPath();
          ctx.moveTo(0,0);
          ctx.lineTo(Math.cos(i * Math.PI/4) * 65, Math.sin(i * Math.PI/4) * 65);
          ctx.stroke();
      }
    }

    ctx.restore();
  }

  function loop() {
    time++;
    ctx.clearRect(0, 0, width, height);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player Net
    drawNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
