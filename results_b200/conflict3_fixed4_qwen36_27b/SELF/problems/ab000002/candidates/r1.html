<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archon's Ascension</title>
<style>
    :root {
        --bg-dark: #05070a;
        --bg-panel: rgba(10, 12, 18, 0.7);
        --border-color: rgba(100, 116, 139, 0.2);
        --accent-primary: #f59e0b;
        --accent-secondary: #d97706;
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --node-passive: #1e293b;
        --node-active: #fbbf24;
        --node-glow: rgba(251, 191, 36, 0.6);
        --font-display: 'Cinzel', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-dark);
        background-image: 
            radial-gradient(circle at 50% 30%, #1e293b 0%, transparent 60%),
            url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Header --- */
    header {
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 10;
        background: linear-gradient(to bottom, rgba(5,7,10,0.9), transparent);
    }

    .title-container {
        text-align: center;
        position: relative;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 2.2rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        margin-bottom: 5px;
    }

    .subtitle {
        font-size: 0.9rem;
        color: var(--accent-primary);
        letter-spacing: 0.4em;
        text-transform: uppercase;
        position: relative;
        display: inline-block;
    }

    .subtitle::before, .subtitle::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 30px;
        height: 1px;
        background: var(--accent-primary);
        opacity: 0.5;
    }
    .subtitle::before { left: -40px; }
    .subtitle::after { right: -40px; }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
    }

    /* --- Sidebar --- */
    aside {
        width: 340px;
        background: linear-gradient(to right, rgba(10,12,18,0.95), rgba(10,12,18,0.4));
        border-right: 1px solid var(--border-color);
        padding: 40px 30px;
        display: flex;
        flex-direction: column;
        gap: 35px;
        z-index: 5;
        box-shadow: 5px 0 30px rgba(0,0,0,0.6);
    }

    .stat-block {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .level-display {
        display: flex;
        align-items: baseline;
        gap: 12px;
    }

    .level-num {
        font-family: var(--font-display);
        font-size: 4.5rem;
        line-height: 1;
        color: var(--text-main);
        font-weight: 700;
    }

    .level-label {
        font-size: 1.1rem;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.05em;
    }

    .xp-container {
        margin-top: 8px;
    }

    .xp-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 8px;
    }

    .xp-bar-bg {
        height: 10px;
        background: #1e293b;
        border-radius: 5px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }

    .xp-bar-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
        box-shadow: 0 0 12px var(--accent-primary);
        position: relative;
    }
    
    .xp-bar-fill::after {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
        width: 100%;
        transform: translateX(-100%);
        animation: shimmer 2.5s infinite;
    }

    .points-display {
        background: rgba(0,0,0,0.4);
        padding: 20px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    .points-display::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
    }

    .points-val {
        font-size: 3rem;
        font-family: var(--font-display);
        color: var(--accent-primary);
        display: block;
        text-shadow: 0 0 10px var(--node-glow);
    }

    .points-label {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-muted);
    }

    .character-details {
        margin-top: auto;
        border-top: 1px solid var(--border-color);
        padding-top: 25px;
    }
    
    .char-name {
        font-size: 1.6rem;
        font-family: var(--font-display);
        margin-bottom: 8px;
        color: var(--text-main);
    }
    
    .char-class {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-bottom: 20px;
        letter-spacing: 0.05em;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 0.95rem;
        padding: 4px 0;
        border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .stat-row span:first-child { color: var(--text-muted); }
    .stat-row span:last-child { font-weight: 600; color: var(--text-main); font-family: var(--font-display); }

    /* --- Skill Tree Area --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, rgba(30, 41, 59, 0.3) 0%, transparent 70%);
    }

    .tree-container:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1400px;
        height: 1200px;
        transform-origin: center center;
        transition: transform 0.1s linear;
    }

    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    .connection-line {
        stroke: var(--border-color);
        stroke-width: 2.5;
        fill: none;
        transition: stroke 0.3s ease, filter 0.3s ease;
    }

    .connection-line.active {
        stroke: var(--accent-primary);
        filter: drop-shadow(0 0 8px var(--accent-primary));
        stroke-width: 3;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        width: 70px;
        height: 70px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .node-shape {
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 30% 30%, #2d3748, #1a202c);
        border: 2px solid var(--node-passive);
        border-radius: 50%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.05);
    }

    .node-shape::after {
        content: '';
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.05);
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .node-icon {
        width: 28px;
        height: 28px;
        fill: var(--text-muted);
        opacity: 0.6;
        transition: all 0.3s ease;
    }

    /* States */
    .node.unlocked .node-shape {
        border-color: var(--node-active);
        background: radial-gradient(circle at 30% 30%, #451a03, #2d3748);
        box-shadow: 0 0 20px var(--node-glow), inset 0 0 10px var(--node-glow);
    }

    .node.unlocked .node-icon {
        fill: var(--node-active);
        opacity: 1;
        filter: drop-shadow(0 0 5px var(--accent-primary));
    }
    
    .node.available .node-shape {
        border-color: #64748b;
        background: radial-gradient(circle at 30% 30%, #334155, #1e293b);
    }

    .node.available:hover .node-shape {
        transform: scale(1.15);
        border-color: var(--text-main);
        background: #475569;
        box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }
    
    .node.available:hover .node-shape::after {
        opacity: 1;
        border-color: rgba(255,255,255,0.2);
    }

    .node:hover {
        z-index: 10;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(15, 23, 42, 0.98);
        border: 1px solid var(--accent-primary);
        padding: 18px;
        width: 300px;
        border-radius: 6px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 15px 35px rgba(0,0,0,0.9);
        backdrop-filter: blur(8px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tooltip h3 {
        color: var(--accent-primary);
        font-family: var(--font-display);
        margin-bottom: 6px;
        font-size: 1.2rem;
        letter-spacing: 0.05em;
    }

    .tooltip .type {
        font-size: 0.75rem;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 12px;
        letter-spacing: 0.1em;
        font-weight: 600;
    }

    .tooltip p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #cbd5e1;
    }

    .tooltip .req {
        margin-top: 12px;
        font-size: 0.8rem;
        color: #ef4444;
        display: none;
        font-style: italic;
    }

    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-muted); }
    .tooltip.locked { border-color: var(--border-color); }

    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

</style>
</head>
<body>

    <header>
        <div class="title-container">
            <h1>Archon's Ascension</h1>
            <div class="subtitle">Class: Void Walker</div>
        </div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="stat-block">
                <div class="level-display">
                    <span class="level-num">42</span>
                    <span class="level-label">Level</span>
                </div>
                <div class="xp-container">
                    <div class="xp-labels">
                        <span>XP Progress</span>
                        <span>12,450 / 20,000</span>
                    </div>
                    <div class="xp-bar-bg">
                        <div class="xp-bar-fill"></div>
                    </div>
                </div>
            </div>

            <div class="points-display">
                <span class="points-val">3</span>
                <span class="points-label">Skill Points Available</span>
            </div>

            <div class="character-details">
                <h2 class="char-name">Kaelen Thorne</h2>
                <div class="char-class">Duelist / Arcanist</div>
                <div class="stat-row"><span>Strength</span><span>14</span></div>
                <div class="stat-row"><span>Dexterity</span><span>28</span></div>
                <div class="stat-row"><span>Intelligence</span><span>35</span></div>
                <div class="stat-row"><span>Vitality</span><span>12</span></div>
            </div>
        </aside>

        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <!-- SVG Lines injected by JS -->
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected by JS -->
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data ---
    const skills = [
        { id: 'root', x: 700, y: 80, name: "Archon's Spark", type: "Passive", desc: "The origin of your power. Increases all damage by 5%.", unlocked: true, req: null },
        { id: 'str1', x: 500, y: 220, name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 4.", unlocked: true, req: 'root' },
        { id: 'dex1', x: 900, y: 220, name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 5%.", unlocked: true, req: 'root' },
        { id: 'int1', x: 700, y: 350, name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regeneration by 10%.", unlocked: false, req: 'root' },
        
        { id: 'str2', x: 350, y: 400, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str3', x: 200, y: 600, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back.", unlocked: false, req: 'str2' },
        
        { id: 'dex2', x: 1050, y: 400, name: "Evasion", type: "Passive", desc: "10% chance to dodge attacks.", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 1200, y: 600, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1000, y: 600, name: "Dual Wield", type: "Passive", desc: "Unlock ability to hold two weapons.", unlocked: false, req: 'dex2' },

        { id: 'int2', x: 550, y: 550, name: "Fireball", type: "Active", desc: "Launch a projectile of fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 850, y: 550, name: "Frost Nova", type: "Active", desc: "Freeze enemies in radius.", unlocked: false, req: 'int1' },
        
        { id: 'hybrid', x: 700, y: 800, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows.", unlocked: false, req: 'dex3' },
        { id: 'hybrid2', x: 350, y: 800, name: "Blood Pact", type: "Passive", desc: "Heal for 5% of damage dealt.", unlocked: false, req: 'str3' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        // Center the world initially
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const ww = 1400;
        const wh = 1200;
        
        // Initial center
        world.style.transform = `translate(${cw/2 - ww/2}px, ${ch/2 - wh/2}px)`;

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Determine Icon
            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        // Draw Lines
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        
        // Positioning
        const x = e.clientX;
        const y = e.clientY;
        tooltip.style.left = `${x + 25}px`;
        tooltip.style.top = `${y - 25}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        if (!skill.unlocked && !skill.req) { // Root node
            skill.unlocked = true;
            updateVisuals();
        } else if (!skill.unlocked) {
             // Check if parent is unlocked
             const parent = skills.find(s => s.id === skill.req);
             if (parent && parent.unlocked) {
                 skill.unlocked = true;
                 updateVisuals();
             }
        }
    }

    function updateVisuals() {
        // Update Nodes
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            if (s.unlocked) {
                el.classList.add('unlocked');
            } else {
                el.classList.remove('unlocked');
                // Check availability (parent unlocked)
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) el.classList.add('available');
                else el.classList.remove('available');
            }
        });

        // Re-draw lines
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    if (skill.unlocked) line.classList.add('active');
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = container.clientWidth/2 - 700;
    let panY = container.clientHeight/2 - 600;
    let scale = 1;

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        world.style.transform = `translate(${panX}px, ${panY}px)`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.5, scale + delta), 2);
        
        // Zoom towards mouse pointer
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    init();

</script>
</body>
</html>
