<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcane Ascension - Skill Tree</title>
<style>
    :root {
        --bg-deep: #030406;
        --bg-panel: rgba(10, 12, 18, 0.95);
        --bg-sidebar: linear-gradient(180deg, #080a0f 0%, #030406 100%);
        
        --gold-primary: #FFD700;
        --gold-secondary: #D4AF37;
        --gold-dim: #5c4d15;
        --gold-glow: rgba(255, 215, 0, 0.5);
        
        --silver-primary: #E2E8F0;
        --silver-dim: #475569;
        
        --text-white: #F8FAFC;
        --text-muted: #94A3B8;
        
        --border-light: rgba(255, 255, 255, 0.1);
        --border-gold: rgba(255, 215, 0, 0.4);
        
        --font-display: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
        --font-ui: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; outline: none; }

    body {
        background-color: var(--bg-deep);
        color: var(--text-white);
        font-family: var(--font-ui);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background & Atmosphere --- */
    .bg-layer {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: 
            radial-gradient(circle at 50% 0%, #1e293b 0%, #030406 60%),
            radial-gradient(circle at 80% 80%, #0f172a 0%, transparent 40%);
    }

    .grid-overlay {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: 
            linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
        background-size: 80px 80px;
        mask-image: radial-gradient(circle at center, black 20%, transparent 70%);
        -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 70%);
    }

    /* --- Header --- */
    header {
        height: 90px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(to bottom, rgba(3,4,6,1), rgba(3,4,6,0));
        z-index: 10;
        position: relative;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 2.2rem;
        font-weight: 400;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: var(--text-white);
        text-shadow: 0 0 20px rgba(255,255,255,0.1);
        margin-bottom: 4px;
    }

    .subtitle {
        font-size: 0.8rem;
        color: var(--gold-primary);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        font-weight: 700;
        opacity: 0.9;
    }

    /* --- Main Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
    }

    /* --- Sidebar --- */
    aside {
        width: 360px;
        height: 100%;
        background: var(--bg-sidebar);
        border-right: 1px solid var(--border-light);
        display: flex;
        flex-direction: column;
        padding: 40px 35px;
        z-index: 30;
        box-shadow: 30px 0 100px rgba(0,0,0,0.8);
        position: relative;
    }

    /* Profile Section */
    .profile-section {
        margin-bottom: 45px;
        border-bottom: 1px solid var(--border-light);
        padding-bottom: 30px;
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 2.4rem;
        color: #fff;
        margin-bottom: 10px;
        line-height: 1;
        font-weight: 600;
    }

    .char-class {
        color: var(--gold-primary);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0.9;
    }

    .class-icon {
        width: 10px;
        height: 10px;
        background: var(--gold-primary);
        clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        box-shadow: 0 0 8px var(--gold-glow);
    }

    /* Level & XP */
    .level-section {
        margin-bottom: 40px;
    }

    .level-display {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 15px;
    }

    .lvl-num {
        font-family: var(--font-display);
        font-size: 5.5rem;
        line-height: 0.8;
        color: #fff;
        font-weight: 600;
        text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    .lvl-label {
        font-size: 0.9rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 600;
    }

    .xp-container {
        position: relative;
    }

    .xp-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 10px;
        font-weight: 500;
    }

    .xp-track {
        height: 6px;
        background: #1e293b;
        border-radius: 3px;
        overflow: hidden;
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
        position: relative;
    }

    .xp-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--gold-secondary), var(--gold-primary));
        box-shadow: 0 0 15px var(--gold-glow);
        position: relative;
    }
    
    .xp-fill::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        transform: translateX(-100%);
        animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }

    /* Skill Points Box */
    .points-box {
        background: rgba(0,0,0,0.4);
        border: 1px solid var(--border-light);
        border-top: 2px solid var(--gold-primary);
        padding: 30px;
        text-align: center;
        margin-bottom: auto;
        position: relative;
        box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }

    .pts-val {
        font-family: var(--font-display);
        font-size: 3.5rem;
        color: var(--gold-primary);
        text-shadow: 0 0 25px var(--gold-glow);
        display: block;
        line-height: 1;
        margin-bottom: 8px;
        font-weight: 600;
    }

    .pts-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--text-muted);
        font-weight: 600;
    }

    /* Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px 20px;
        margin-top: 30px;
        padding-top: 25px;
        border-top: 1px solid var(--border-light);
    }

    .stat-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        font-size: 0.95rem;
        border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .stat-name { color: var(--text-muted); font-weight: 500; }
    .stat-val { color: #fff; font-weight: 700; font-family: var(--font-display); letter-spacing: 0.05em; }

    /* --- Tree Area --- */
    .tree-viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
        background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%);
    }

    .tree-viewport:active { cursor: grabbing; }

    .tree-world {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 2000px;
        height: 1600px;
        transform-origin: center center;
    }

    /* Connections */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        filter: drop-shadow(0 0 4px rgba(0,0,0,0.8));
    }

    .conn-line {
        stroke: rgba(255, 255, 255, 0.08);
        stroke-width: 6;
        fill: none;
        stroke-linecap: round;
        transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .conn-line.active {
        stroke: var(--gold-primary);
        stroke-width: 6;
        filter: drop-shadow(0 0 12px var(--gold-glow));
        stroke-dasharray: none;
    }

    .conn-line.locked {
        stroke-dasharray: 12 12;
        opacity: 0.4;
    }

    /* Nodes */
    .node {
        position: absolute;
        width: 120px;
        height: 120px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .node:hover {
        transform: translate(-50%, -50%) scale(1.15);
        z-index: 10;
    }

    /* Node Structure - Improved Design */
    .node-outer {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #0b0f16;
        border: 1px solid #334155;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.9);
        transition: all 0.4s ease;
    }
    
    .node-bezel {
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.05);
        pointer-events: none;
    }

    .node-inner {
        width: 75%;
        height: 75%;
        border-radius: 50%;
        background: #1e293b;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.4s ease;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
    }

    .node-icon {
        width: 36px;
        height: 36px;
        fill: #64748b;
        transition: all 0.4s ease;
    }

    /* Node States */
    .node.unlocked .node-outer {
        border-color: var(--gold-primary);
        background: #1a1500;
        box-shadow: 0 0 50px rgba(255, 215, 0, 0.2), inset 0 0 20px rgba(255, 215, 0, 0.1);
    }

    .node.unlocked .node-inner {
        background: radial-gradient(circle at 30% 30%, #fff, var(--gold-primary), var(--gold-secondary));
        box-shadow: 0 0 25px var(--gold-glow);
    }

    .node.unlocked .node-icon {
        fill: #000;
        filter: drop-shadow(0 2px 2px rgba(255,255,255,0.8));
    }

    .node.available .node-outer {
        border-color: #94a3b8;
        background: #1e293b;
    }
    
    .node.available:hover .node-outer {
        border-color: #fff;
        box-shadow: 0 0 30px rgba(255,255,255,0.3);
    }
    
    .node.available:hover .node-icon {
        fill: #fff;
    }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        width: 380px;
        background: rgba(10, 12, 16, 0.98);
        border: 1px solid var(--border-light);
        border-left: 4px solid var(--gold-primary);
        padding: 28px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 25px 60px rgba(0,0,0,0.9);
        backdrop-filter: blur(12px);
    }

    .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .tt-title {
        font-family: var(--font-display);
        color: #fff;
        font-size: 1.6rem;
        margin-bottom: 6px;
        letter-spacing: 0.05em;
        font-weight: 600;
    }

    .tt-type {
        color: var(--gold-primary);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 18px;
        display: block;
        font-weight: 700;
    }

    .tt-desc {
        color: #cbd5e1;
        font-size: 1rem;
        line-height: 1.6;
        font-weight: 400;
    }

    .tt-req {
        margin-top: 18px;
        padding-top: 12px;
        border-top: 1px solid rgba(255,255,255,0.05);
        font-size: 0.85rem;
        color: #ef4444;
        font-weight: 600;
        display: none;
    }

    .tooltip.locked {
        border-left-color: #475569;
    }
    .tooltip.locked .tt-title { color: #94a3b8; }
    .tooltip.locked .tt-type { color: #64748b; }
    .tooltip.locked .tt-req { display: block; }

    /* Animations */
    @keyframes pulse-gold {
        0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4); }
        70% { box-shadow: 0 0 0 25px rgba(255, 215, 0, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
    }

    .node.unlocked .node-outer {
        animation: pulse-gold 4s infinite;
    }

    /* Scrollbar hide */
    ::-webkit-scrollbar { display: none; }

</style>
</head>
<body>

    <div class="bg-layer"></div>
    <div class="grid-overlay"></div>

    <header>
        <h1>Arcane Ascension</h1>
        <div class="subtitle">Class: Void Walker</div>
    </header>

    <div class="main-layout">
        <aside>
            <div class="profile-section">
                <h2 class="char-name">Kaelen Thorne</h2>
                <div class="char-class">
                    <div class="class-icon"></div>
                    Duelist / Arcanist
                </div>
            </div>

            <div class="level-section">
                <div class="level-display">
                    <span class="lvl-num">42</span>
                    <span class="lvl-label">Level</span>
                </div>
                <div class="xp-container">
                    <div class="xp-labels">
                        <span>XP Progress</span>
                        <span>12,450 / 20,000</span>
                    </div>
                    <div class="xp-track">
                        <div class="xp-fill"></div>
                    </div>
                </div>
            </div>

            <div class="points-box">
                <span class="pts-val">3</span>
                <span class="pts-label">Skill Points Available</span>
            </div>

            <div class="stats-grid">
                <div class="stat-item"><span class="stat-name">Strength</span><span class="stat-val">14</span></div>
                <div class="stat-item"><span class="stat-name">Dexterity</span><span class="stat-val">28</span></div>
                <div class="stat-item"><span class="stat-name">Intelligence</span><span class="stat-val">35</span></div>
                <div class="stat-item"><span class="stat-name">Vitality</span><span class="stat-val">12</span></div>
                <div class="stat-item"><span class="stat-name">Endurance</span><span class="stat-val">19</span></div>
                <div class="stat-item"><span class="stat-name">Willpower</span><span class="stat-val">22</span></div>
            </div>
        </aside>

        <div class="tree-viewport" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected via JS -->
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <h3 class="tt-title" id="tt-title">Skill Name</h3>
        <span class="tt-type" id="tt-type">Passive</span>
        <p class="tt-desc" id="tt-desc">Description text goes here.</p>
        <div class="tt-req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data ---
    const skills = [
        { id: 'root', x: 1000, y: 150, name: "Archon's Spark", type: "Origin", desc: "The source of your lineage. Increases all damage by 5%.", unlocked: true, req: null },
        
        { id: 'str1', x: 550, y: 350, name: "Titan's Grip", type: "Passive", desc: "Mastery over heavy metals. +4 Strength.", unlocked: true, req: 'root' },
        { id: 'dex1', x: 1450, y: 350, name: "Swift Foot", type: "Passive", desc: "Move like the wind. +5% Movement Speed.", unlocked: true, req: 'root' },
        { id: 'int1', x: 1000, y: 450, name: "Arcane Mind", type: "Passive", desc: "Heightened perception. +10% Mana Regen.", unlocked: false, req: 'root' },
        
        { id: 'str2', x: 350, y: 600, name: "Heavy Strike", type: "Active", desc: "Slam weapon into ground dealing AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str3', x: 200, y: 800, name: "Unstoppable", type: "Passive", desc: "Cannot be knocked back or rooted.", unlocked: false, req: 'str2' },
        
        { id: 'dex2', x: 1600, y: 600, name: "Evasion", type: "Passive", desc: "Dodge incoming attacks (10% chance).", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 1750, y: 800, name: "Backstab", type: "Active", desc: "Deals 300% damage from behind.", unlocked: false, req: 'dex2' },
        { id: 'dex4', x: 1500, y: 800, name: "Dual Wield", type: "Passive", desc: "Unlock ability to hold two weapons.", unlocked: false, req: 'dex2' },

        { id: 'int2', x: 800, y: 700, name: "Fireball", type: "Active", desc: "Launch a projectile of concentrated fire.", unlocked: false, req: 'int1' },
        { id: 'int3', x: 1200, y: 700, name: "Frost Nova", type: "Active", desc: "Freeze enemies in a 10m radius.", unlocked: false, req: 'int1' },
        
        { id: 'hybrid', x: 1000, y: 1050, name: "Void Walker", type: "Ultimate", desc: "Teleport through shadows instantly.", unlocked: false, req: 'dex3' },
        { id: 'hybrid2', x: 350, y: 1050, name: "Blood Pact", type: "Passive", desc: "Heal for 5% of damage dealt.", unlocked: false, req: 'str3' },
        { id: 'hybrid3', x: 1400, y: 1050, name: "Time Warp", type: "Ultimate", desc: "Rewind time for yourself by 3 seconds.", unlocked: false, req: 'int3' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        passive: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z",
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z",
        origin: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        // Center the world initially
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        const ww = 2000;
        const wh = 1600;
        
        // Initial center
        const initX = cw/2 - ww/2;
        const initY = ch/2 - wh/2;
        world.style.transform = `translate(${initX}px, ${initY}px)`;

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            node.className = `node ${skill.unlocked ? 'unlocked' : ''}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Determine Icon
            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.type === 'Origin') iconPath = icons.origin;

            node.innerHTML = `
                <div class="node-outer">
                    <div class="node-bezel"></div>
                    <div class="node-inner">
                        <svg class="node-icon" viewBox="0 0 24 24">
                            <path d="${iconPath}" />
                        </svg>
                    </div>
                </div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        // Draw Lines
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    if (skill.unlocked) {
                        line.classList.add('active');
                    } else {
                        line.classList.add('locked');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Logic ---
    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
        }

        tooltip.classList.add('visible');
        
        // Positioning
        const x = e.clientX;
        const y = e.clientY;
        
        // Keep tooltip on screen
        const rect = tooltip.getBoundingClientRect();
        let finalX = x + 25;
        let finalY = y - 25;

        if (finalX + 380 > window.innerWidth) finalX = x - 405;
        if (finalY + 200 > window.innerHeight) finalY = window.innerHeight - 210;

        tooltip.style.left = `${finalX}px`;
        tooltip.style.top = `${finalY}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        if (!skill.unlocked && !skill.req) { // Root node
            skill.unlocked = true;
            updateVisuals();
        } else if (!skill.unlocked) {
             // Check if parent is unlocked
             const parent = skills.find(s => s.id === skill.req);
             if (parent && parent.unlocked) {
                 skill.unlocked = true;
                 updateVisuals();
             }
        }
    }

    function updateVisuals() {
        // Update Nodes
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            if (s.unlocked) {
                el.classList.add('unlocked');
                el.classList.remove('available');
            } else {
                el.classList.remove('unlocked');
                // Check availability (parent unlocked)
                const parent = skills.find(sk => sk.id === s.req);
                if (parent && parent.unlocked) el.classList.add('available');
                else el.classList.remove('available');
            }
        });

        // Re-draw lines
        svg.innerHTML = '';
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    if (skill.unlocked) line.classList.add('active');
                    else line.classList.add('locked');
                    svg.appendChild(line);
                }
            }
        });
    }

    // --- Pan & Zoom Logic ---
    const container = document.getElementById('treeContainer');
    let isPanning = false;
    let startX, startY;
    let panX = container.clientWidth/2 - 1000;
    let panY = container.clientHeight/2 - 800;
    let scale = 1;

    container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        container.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        container.style.cursor = 'grab';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSensitivity = 0.001;
        const delta = -e.deltaY * zoomSensitivity;
        const newScale = Math.min(Math.max(0.4, scale + delta), 2.5);
        
        // Zoom towards mouse pointer
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        const scaleChange = newScale - scale;
        panX -= mouseX * scaleChange;
        panY -= mouseY * scaleChange;
        
        scale = newScale;
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    });

    init();

</script>
</body>
</html>
