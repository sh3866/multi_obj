<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina - Capture & Collection</title>
<style>
  :root {
    --bg-deep: #05050a;
    --bg-layer-1: #0a0a16;
    --accent-cyan: #00f0ff;
    --accent-magenta: #ff0055;
    --accent-lime: #ccff00;
    --accent-purple: #bd00ff;
    --glass-surface: rgba(10, 10, 20, 0.75);
    --glass-border: rgba(255, 255, 255, 0.1);
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Scene Container --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 100%, #1a1a3a 0%, var(--bg-deep) 70%);
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 100;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Header */
  .header {
    position: absolute;
    top: 28px;
    left: 32px;
    right: 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 3rem;
    margin: 0;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: linear-gradient(to bottom, #fff 40%, #888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 10px rgba(0, 240, 255, 0.3));
  }

  .subtitle {
    font-size: 0.8rem;
    color: var(--accent-cyan);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    font-weight: 700;
    opacity: 0.9;
  }

  /* HUD */
  .hud-panel {
    background: var(--glass-surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    padding: 0.6rem 2.5rem;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 1.2rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }

  .hud-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  }

  .stat-icon {
    width: 24px; height: 24px;
    fill: var(--accent-cyan);
    filter: drop-shadow(0 0 6px var(--accent-cyan));
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2.2rem;
    line-height: 1;
    color: white;
    letter-spacing: -0.02em;
  }

  .stat-label {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-top: 2px;
    font-weight: 600;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 32px;
    left: 32px;
    pointer-events: auto;
  }

  .btn-main {
    background: rgba(0, 240, 255, 0.05);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 240, 255, 0.4);
    color: var(--accent-cyan);
    font-family: var(--font-display);
    font-size: 1.3rem;
    padding: 0.9rem 3rem;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    transition: all 0.2s ease;
    position: relative;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.05);
    overflow: hidden;
  }

  .btn-main::after {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.2), transparent);
    transition: 0.5s;
  }

  .btn-main:hover {
    background: rgba(0, 240, 255, 0.15);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
    text-shadow: 0 0 8px var(--accent-cyan);
    transform: translateY(-1px);
  }
  
  .btn-main:hover::after { left: 100%; }

  /* Toast */
  .toast {
    position: absolute;
    top: 35%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(5, 5, 10, 0.9);
    border: 1px solid var(--accent-lime);
    color: var(--accent-lime);
    padding: 1rem 2.5rem;
    border-radius: 4px;
    font-family: var(--font-display);
    letter-spacing: 0.2em;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 200;
    text-transform: uppercase;
    box-shadow: 0 0 50px rgba(204, 255, 0, 0.15);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* --- Visual Elements (HTML/CSS/SVG) --- */

  /* Terrain */
  .terrain-layer {
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 40%;
    z-index: 5;
    pointer-events: none;
  }

  /* Creatures */
  .creature {
    position: absolute;
    z-index: 10;
    border-radius: 50%;
    opacity: 1;
    box-shadow: 0 0 30px currentColor;
    transition: transform 0.1s linear;
    animation: float 6s ease-in-out infinite;
  }
  
  /* Internal detail for creature */
  .creature::after {
    content: '';
    position: absolute;
    top: 20%; left: 20%;
    width: 60%; height: 60%;
    background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
    border-radius: 50%;
  }

  /* Player Container */
  .player-container {
    position: absolute;
    z-index: 20;
    pointer-events: none;
    left: 980px; 
    bottom: 100px;
    width: 60px;
    height: 160px;
  }

  /* Net */
  .net-container {
    position: absolute;
    z-index: 25;
    pointer-events: none;
    left: 850px;
    bottom: 200px;
    width: 140px; height: 140px;
    transform: translate(-50%, -50%);
    /* Center the SVG for rotation logic */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .net-svg {
    width: 100%; height: 100%;
    overflow: visible;
  }

  /* Animations */
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
  }

  @media (max-width: 768px) {
    h1 { font-size: 2.2rem; }
    .header { top: 24px; left: 24px; right: 24px; }
    .footer { bottom: 24px; left: 24px; }
    .btn-main { padding: 0.8rem 2rem; font-size: 1.1rem; }
    .hud-panel { padding: 0.5rem 1.2rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  
  <!-- Visual Backgrounds -->
  <div class="atmosphere"></div>

  <!-- Terrain SVG Layer -->
  <svg class="terrain-layer" preserveAspectRatio="none" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#0a0a16;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#050508;stop-opacity:1" />
      </linearGradient>
    </defs>
    <!-- Back Layer -->
    <path d="M0,400 L0,250 Q250,200 500,280 T1000,250 L1000,400 Z" fill="#0a0a16" opacity="0.8"/>
    <!-- Front Layer -->
    <path d="M0,400 L0,300 Q300,250 600,320 T1000,300 L1000,400 Z" fill="#050508" stroke="rgba(0,240,255,0.1)" stroke-width="2"/>
  </svg>

  <!-- Creatures (Explicit Divs) -->
  <!-- 1. Cyan Upper Left -->
  <div class="creature" id="c1" style="left: 150px; top: 180px; width: 60px; height: 60px; background: radial-gradient(circle, #fff 10%, #00f0ff 60%, transparent); color: #00f0ff; animation-delay: 0s;"></div>
  
  <!-- 2. Magenta Upper Left -->
  <div class="creature" id="c2" style="left: 280px; top: 150px; width: 50px; height: 50px; background: radial-gradient(circle, #fff 10%, #ff0055 60%, transparent); color: #ff0055; animation-delay: -1s;"></div>
  
  <!-- 3. Yellow Center-Left -->
  <div class="creature" id="c3" style="left: 400px; top: 300px; width: 70px; height: 70px; background: radial-gradient(circle, #fff 10%, #ccff00 60%, transparent); color: #ccff00; animation-delay: -2s;"></div>
  
  <!-- 4. Purple Mid-Right -->
  <div class="creature" id="c4" style="left: 700px; top: 250px; width: 55px; height: 55px; background: radial-gradient(circle, #fff 10%, #bd00ff 60%, transparent); color: #bd00ff; animation-delay: -3s;"></div>
  
  <!-- 5. Cyan Mid-Right -->
  <div class="creature" id="c5" style="left: 800px; top: 450px; width: 65px; height: 65px; background: radial-gradient(circle, #fff 10%, #00f0ff 60%, transparent); color: #00f0ff; animation-delay: -4s;"></div>

  <!-- Player: Constructed via SVG for precise anatomy and lighting -->
  <div class="player-container" id="player">
    <svg width="100%" height="100%" viewBox="0 0 60 160" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <!-- Legs -->
      <path d="M22,110 L20,155 M38,110 L40,155" stroke="#050508" stroke-width="8" stroke-linecap="round"/>
      <path d="M22,110 L20,155 M38,110 L40,155" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      
      <!-- Torso (Tapered) -->
      <path d="M20,65 L40,65 L45,110 L15,110 Z" fill="#050508"/>
      <path d="M20,65 L40,65 L45,110 L15,110 Z" stroke="#00f0ff" stroke-width="2" fill="none" filter="url(#glow)"/>
      
      <!-- Arm (Extended towards net) -->
      <path d="M35,75 L55,50" stroke="#050508" stroke-width="7" stroke-linecap="round"/>
      <path d="M35,75 L55,50" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
      
      <!-- Head -->
      <circle cx="30" cy="45" r="14" fill="#050508"/>
      <circle cx="30" cy="45" r="14" stroke="#00f0ff" stroke-width="2" fill="none" filter="url(#glow)"/>
    </svg>
  </div>

  <!-- Net: Improved with handle, mesh pattern and connection -->
  <div class="net-container" id="net">
    <svg class="net-svg" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="netGlow">
          <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <!-- Mesh Pattern -->
        <pattern id="meshPattern" width="10" height="10" patternUnits="userSpaceOnUse">
          <path d="M 10 0 L 0 10 M 0 0 L 10 10" stroke="#00f0ff" stroke-width="0.5" opacity="0.4"/>
        </pattern>
      </defs>

      <!-- Handle (5px Cyan-Dark) -->
      <!-- Connects Hand (approx 10,130) to Ring (approx 70,70) -->
      <line x1="10" y1="130" x2="70" y2="70" stroke="#003333" stroke-width="5" stroke-linecap="round"/>
      <line x1="10" y1="130" x2="70" y2="70" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" filter="url(#netGlow)"/>

      <!-- Net Ring -->
      <circle cx="70" cy="70" r="50" fill="url(#meshPattern)" stroke="#00f0ff" stroke-width="3" filter="url(#netGlow)"/>
      
      <!-- Mesh Grid Overlay for detail -->
      <circle cx="70" cy="70" r="50" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.8"/>
      <path d="M70,20 L70,120 M20,70 L120,70 M32,32 L108,108 M108,32 L32,108" stroke="#00f0ff" stroke-width="1" opacity="0.5"/>
    </svg>
  </div>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Lumina</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-panel">
        <svg class="stat-icon" viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L6.82 21.02L8 14.14L3 9.27L9.91 8.26L12 2Z" />
        </svg>
        <div>
          <div class="stat-value" id="scoreDisplay">0</div>
          <div class="stat-label">Collected</div>
        </div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Captured!</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   */
  
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');
  const playerEl = document.getElementById('player');
  const netEl = document.getElementById('net');
  
  // State
  let score = 0;
  let creatures = [];
  let particles = [];
  
  // Initial Positions (Safe)
  let playerPos = { x: 980, y: window.innerHeight - 100 };
  let mouse = { x: 850, y: window.innerHeight - 200 };
  let isMouseDown = false;

  // DOM Elements for Creatures
  const creatureEls = [
    document.getElementById('c1'),
    document.getElementById('c2'),
    document.getElementById('c3'),
    document.getElementById('c4'),
    document.getElementById('c5')
  ];

  // Initialize Creature Objects mapping to DOM
  function initCreatures() {
    creatures = creatureEls.map((el, index) => {
      // Extract initial CSS positions
      const left = parseInt(el.style.left);
      const top = parseInt(el.style.top);
      const width = parseInt(el.style.width);
      
      return {
        el: el,
        x: left + width/2,
        y: top + width/2,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5,
        radius: width/2,
        isCaught: false,
        wobble: Math.random() * Math.PI * 2
      };
    });
  }

  function resize() {
    // Ensure elements stay on screen on resize
    playerPos.x = Math.min(playerPos.x, window.innerWidth - 40);
    mouse.x = Math.min(mouse.x, window.innerWidth - 40);
  }
  window.addEventListener('resize', resize);

  // Input Handling
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => isMouseDown = true);
  window.addEventListener('mouseup', () => {
    isMouseDown = false;
    checkCatch();
  });
  window.addEventListener('touchmove', e => {
    e.preventDefault(); 
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    isMouseDown = true;
  });
  window.addEventListener('touchend', () => {
    isMouseDown = false;
    checkCatch();
  });

  // Particle System (Canvas Overlay for effects only)
  const canvas = document.createElement('canvas');
  canvas.style.position = 'absolute';
  canvas.style.top = '0';
  canvas.style.left = '0';
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.zIndex = '90';
  canvas.style.pointerEvents = 'none';
  document.querySelector('.scene-container').appendChild(canvas);
  const ctx = canvas.getContext('2d');
  
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  class Particle {
    constructor(x, y, color) {
      this.x = x; this.y = y; this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.02 + 0.01;
      this.size = Math.random() * 4 + 2;
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      this.life -= this.decay; this.size *= 0.96;
    }
    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  // Game Loop
  function update() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    // Update Player Position
    playerEl.style.left = (playerPos.x - 30) + 'px'; // Center align
    playerEl.style.bottom = (h - playerPos.y) + 'px';

    // Update Net Position
    netEl.style.left = mouse.x + 'px';
    netEl.style.top = mouse.y + 'px';
    
    // Net Rotation logic
    // The handle is at 10,130 and ring center is 70,70 in SVG coords (offset -60, -60 from center)
    // We want to rotate the net so the handle points to the player.
    const dx = playerPos.x - mouse.x;
    const dy = playerPos.y - mouse.y;
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    
    // Adjust angle: The handle in SVG points roughly South-West (-135deg) relative to ring center
    // We want to align that vector with the player vector.
    netEl.style.transform = `translate(-50%, -50%) rotate(${angle + 135}deg)`;

    // Update Creatures
    creatures.forEach(c => {
      if (c.isCaught) return;

      // Movement
      c.x += c.vx;
      c.y += c.vy;
      c.wobble += 0.05;

      // Bounce off walls
      if (c.x < c.radius || c.x > w - c.radius) c.vx *= -1;
      if (c.y < c.radius || c.y > h - c.radius) c.vy *= -1;

      // Avoid Net
      const distNet = Math.hypot(c.x - mouse.x, c.y - mouse.y);
      if (distNet < 150) {
        const force = (150 - distNet) / 150;
        c.vx += (c.x - mouse.x) / distNet * force * 0.5;
        c.vy += (c.y - mouse.y) / distNet * force * 0.5;
      }

      // Limit Speed
      const speed = Math.hypot(c.vx, c.vy);
      if (speed > 4) {
        c.vx = (c.vx / speed) * 4;
        c.vy = (c.vy / speed) * 4;
      }

      // Apply to DOM
      c.el.style.transform = `translate(${c.x - c.radius}px, ${c.y - c.radius}px)`;
    });

    // Update Particles
    ctx.clearRect(0, 0, w, h);
    particles.forEach((p, i) => {
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    });

    requestAnimationFrame(update);
  }

  function checkCatch() {
    const catchRadius = 80;
    let caughtSomething = false;
    creatures.forEach(c => {
      if (c.isCaught) return;
      const dist = Math.hypot(c.x - mouse.x, c.y - mouse.y);
      if (dist < catchRadius) {
        catchCreature(c);
        caughtSomething = true;
      }
    });
    if (!caughtSomething) {
        // Swipe effect
        for(let i=0; i<5; i++) particles.push(new Particle(mouse.x, mouse.y, 'rgba(255,255,255,0.5)'));
    }
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    // Visual feedback
    creature.el.style.transition = 'transform 0.3s, opacity 0.3s';
    creature.el.style.transform = `translate(${mouse.x - 20}px, ${mouse.y - 20}px) scale(0)`;
    creature.el.style.opacity = '0';
    
    // Particles
    for(let i=0; i<25; i++) particles.push(new Particle(creature.x, creature.y, '#fff'));
    
    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1200);

    // Respawn
    setTimeout(() => {
      creature.isCaught = false;
      creature.el.style.transition = 'none';
      creature.el.style.opacity = '1';
      // Random safe spot
      creature.x = 100 + Math.random() * (window.innerWidth - 200);
      creature.y = 100 + Math.random() * (window.innerHeight - 200);
      creature.el.style.transform = `translate(${creature.x - creature.radius}px, ${creature.y - creature.radius}px)`;
    }, 3000);
  }

  function resetGame() {
    score = 0;
    scoreEl.innerText = '0';
    creatures.forEach((c, i) => {
      c.isCaught = false;
      c.el.style.opacity = '1';
      // Reset to original CSS positions
      const el = creatureEls[i];
      const left = parseInt(el.style.left);
      const top = parseInt(el.style.top);
      const width = parseInt(el.style.width);
      c.x = left + width/2;
      c.y = top + width/2;
    });
  }

  // Start
  initCreatures();
  update();

</script>
</body>
</html>
