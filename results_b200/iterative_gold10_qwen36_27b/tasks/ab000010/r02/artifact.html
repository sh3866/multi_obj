<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Life Simulation</title>
<style>
  :root {
    --bg-color: #050508;
    --panel-bg: rgba(12, 14, 22, 0.65);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text-main: #ffffff;
    --text-muted: #8b9bb4;
    --accent-cyan: #00f0ff;
    --accent-magenta: #ff00ff;
    --accent-amber: #ffaa00;
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-color);
    background-image: radial-gradient(circle at 50% 40%, #161824 0%, #050508 70%);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Canvas Container */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Overlay */
  #ui-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2rem;
  }

  /* Header */
  .header {
    position: absolute;
    top: 3rem;
    left: 3rem;
    pointer-events: auto;
    z-index: 20;
  }

  h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 0.5rem;
    line-height: 1;
    text-transform: uppercase;
    background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(165, 180, 252, 0.1);
  }

  .subtitle {
    font-size: 0.85rem; /* Slightly larger */
    color: var(--text-muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  
  .subtitle::before {
    content: '';
    display: block;
    width: 24px;
    height: 1px;
    background: var(--text-muted);
  }

  /* Control Panel */
  .panel {
    pointer-events: auto;
    width: 340px;
    background: var(--panel-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--panel-border);
    border-radius: 24px;
    padding: 2rem;
    box-shadow: 
      0 25px 60px rgba(0,0,0,0.6), 
      inset 0 1px 0 rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    margin-top: -2vh;
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .panel-label {
    font-size: 0.75rem; /* Larger */
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 0.25rem;
  }

  /* Stats */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding-bottom: 0.75rem;
    margin-bottom: 0.5rem;
  }
  
  .stat-info {
    display: flex;
    flex-direction: column;
  }
  
  .stat-name {
    font-size: 0.8rem; /* Larger */
    color: var(--text-muted);
    margin-bottom: 0.3rem;
  }

  .stat-value {
    font-size: 1.4rem; /* Larger */
    font-weight: 600;
    color: #fff;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  /* Sliders */
  .slider-container {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  
  .slider-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem; /* Larger */
    color: var(--text-muted);
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }
  
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    border: 2px solid var(--bg-color);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.1);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
  }

  /* Buttons */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  
  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main);
    padding: 1.1rem;
    border-radius: 14px;
    font-size: 0.95rem; /* Larger */
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.3);
    transform: translateY(-1px);
  }
  
  button:active {
    transform: translateY(1px);
  }

  button.primary {
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 240, 255, 0.05));
    border: 1px solid rgba(0, 240, 255, 0.3);
    color: var(--accent-cyan);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
  }
  
  button.primary:hover {
    background: rgba(0, 240, 255, 0.2);
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
    border-color: var(--accent-cyan);
  }

  button.secondary {
    color: var(--text-muted);
  }
  
  button.secondary:hover {
    color: #fff;
    border-color: rgba(255,255,255,0.4);
  }
  
  button.full-width {
    grid-column: span 2;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 2rem;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 0.8rem; /* Larger */
    color: var(--text-muted);
    opacity: 0.5;
    letter-spacing: 0.1em;
    pointer-events: none;
  }

</style>
</head>
<body>

  <!-- Canvas for the Sphere -->
  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <!-- UI Overlay -->
  <div id="ui-layer">
    
    <!-- Header -->
    <div class="header">
      <h1>Conway Sphere</h1>
      <div class="subtitle">Algorithmic Life Simulation</div>
    </div>

    <!-- Control Panel -->
    <div class="panel">
      
      <!-- Stats Section -->
      <div class="panel-section">
        <div class="panel-label">Telemetry</div>
        <div class="stat-row">
          <div class="stat-info">
            <span class="stat-name">Generation</span>
            <span class="stat-value" id="gen-count">0</span>
          </div>
          <div class="stat-info" style="text-align: right;">
            <span class="stat-name">Population</span>
            <span class="stat-value" id="pop-count">0</span>
          </div>
        </div>
      </div>

      <!-- Controls Section -->
      <div class="panel-section">
        <div class="panel-label">Simulation Controls</div>
        <div class="btn-group">
          <button id="btn-pause" class="primary">Pause</button>
          <button id="btn-reset" class="secondary">Reset</button>
        </div>
        <button id="btn-step" class="full-width">Step Once</button>
      </div>

      <!-- Settings Section -->
      <div class="panel-section">
        <div class="slider-container">
          <div class="panel-label">Evolution Speed</div>
          <input type="range" id="speed-slider" min="1" max="60" value="20">
          <div class="slider-labels">
            <span>Slow</span>
            <span>Fast</span>
          </div>
        </div>
      </div>

    </div>

    <div class="footer">
      DRAG TO ROTATE &bull; SCROLL TO ZOOM
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life - Visual Revision
 * 
 * Design Goals:
 * 1. High Density: 6500 cells for a rich texture.
 * 2. Multicolor: Explicit mapping of age to Cyan, Blue, Violet, Magenta, Amber.
 * 3. Depth: Strong Z-shading to create 3D volume.
 * 4. Clusters: Initialization logic to spawn dense clusters rather than static noise.
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 6500, // High density
  sphereRadius: 240,
  cellSize: 2.8, // Small cells to fit density
  rotationSpeed: 0.001,
  // Palette mapping for age-based coloring
  // 0-10: Cyan, 10-20: Electric Blue, 20-40: Violet, 40-60: Magenta, 60+: Amber
  palette: [
    { stop: 0, hue: 190 },   // Cyan
    { stop: 10, hue: 210 },  // Electric Blue
    { stop: 25, hue: 270 },  // Violet
    { stop: 50, hue: 310 },  // Magenta
    { stop: 100, hue: 35 },  // Amber
    { stop: 200, hue: 30 }   // Deep Amber
  ]
};

// --- State ---
let state = {
  cells: [],
  generation: 0,
  isRunning: true,
  speed: 20,
  lastFrameTime: 0,
  rotation: { x: 0.2, y: 0.5 },
  zoom: 1.2,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---

const Vec3 = {
  distSq: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return dx*dx + dy*dy + dz*dz;
  }
};

// Fibonacci Lattice Sphere Generation
function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5)); 
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2; 
    const radiusAtY = Math.sqrt(1 - y * y); 
    const theta = goldenAngle * i; 
    
    const x = Math.cos(theta) * radiusAtY;
    const z = Math.sin(theta) * radiusAtY;
    
    points.push({
      x: x * radius,
      y: y * radius,
      z: z * radius,
      idx: i
    });
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Calculate neighbor threshold
  const avgDist = (2 * Math.PI * CONFIG.sphereRadius) / Math.sqrt(CONFIG.cellCount) * 0.9;
  const thresholdSq = avgDist * avgDist;

  state.cells = points.map((p, i) => {
    const neighbors = [];
    
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      // Optimization: Y-axis rejection
      if (Math.abs(p.y - points[j].y) > avgDist) continue;
      
      const dSq = Vec3.distSq(p, points[j]);
      if (dSq < thresholdSq) { 
        neighbors.push(j);
      }
    }
    
    // Initialize with clusters: 
    // Randomly select 8 "seeds" on the sphere. 
    // Any cell within a certain distance of a seed is alive.
    // This ensures dense clusters rather than sparse noise.
    const seeds = [];
    for(let s=0; s<12; s++) {
        seeds.push(points[Math.floor(Math.random() * points.length)]);
    }
    
    let isAlive = false;
    // Check distance to seeds
    for(let s of seeds) {
        if(Vec3.distSq(p, s) < (avgDist * avgDist * 15)) { // Large cluster radius
            isAlive = true;
            break;
        }
    }
    
    return {
      pos: p,
      idx: i,
      neighbors: neighbors,
      alive: isAlive, 
      age: 0,
      colorHue: 0 // Cached for performance if needed, but we calc on fly
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  const nextStates = state.cells.map(cell => {
    // Count alive neighbors
    let neighborCount = 0;
    for (let k = 0; k < cell.neighbors.length; k++) {
      if (state.cells[cell.neighbors[k]].alive) neighborCount++;
    }
    
    let nextAlive = false;

    // Conway Rules
    if (cell.alive) {
      if (neighborCount === 2 || neighborCount === 3) nextAlive = true;
    } else {
      if (neighborCount === 3) {
        nextAlive = true;
      }
    }
    
    return {
      alive: nextAlive,
      age: nextAlive ? (cell.alive ? cell.age + 1 : 0) : 0
    };
  });

  state.cells.forEach((cell, i) => {
    cell.alive = nextStates[i].alive;
    cell.age = nextStates[i].age;
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 900 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal
  };
}

function getCellColor(age, zDepth) {
  // 1. Determine Hue based on Age
  let hue = CONFIG.palette[0].hue;
  for (let i = 1; i < CONFIG.palette.length; i++) {
    if (age >= CONFIG.palette[i].stop) {
      hue = CONFIG.palette[i].hue;
    } else {
      break;
    }
  }

  // 2. Lighting / Depth Shading
  // zDepth is positive behind, negative in front.
  // Normalize to -1..1
  const depthFactor = zDepth / CONFIG.sphereRadius; 
  
  // Lightness: Front (-1) -> 60%, Back (1) -> 10%
  // Saturation: Front -> 90%, Back -> 60%
  const lightness = 60 - (depthFactor * 25); 
  const saturation = 90 - (depthFactor * 15);

  return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
}

function draw() {
  // Clear background
  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, width, height);

  // Draw Halo behind sphere
  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;
  
  // Halo Gradient - subtle cyan/purple mix
  const haloGrad = ctx.createRadialGradient(cx, cy, r * 0.8, cx, cy, r * 1.6);
  haloGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  haloGrad.addColorStop(0.6, 'rgba(50, 50, 100, 0.05)'); 
  haloGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  
  ctx.fillStyle = haloGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.8, 0, Math.PI * 2);
  ctx.fill();

  // Project Cells
  const projectedCells = state.cells.map(cell => {
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    return { cell, proj };
  });
  
  // Sort back-to-front (Painter's Algorithm)
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  // Draw Cells
  projectedCells.forEach(({ cell, proj }) => {
    const size = CONFIG.cellSize * proj.scale;
    
    if (cell.alive) {
      const color = getCellColor(cell.age, proj.z);
      ctx.fillStyle = color;
      
      // Add glow to front-facing alive cells
      // Only apply shadow blur to front cells to save performance
      if (proj.z < 0 && size > 2) {
        ctx.shadowBlur = 8 * proj.scale;
        ctx.shadowColor = color;
      } else {
        ctx.shadowBlur = 0;
      }
      
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Dead cells: faint grid
      // Only draw if somewhat visible to save perf
      if (proj.z < CONFIG.sphereRadius * 0.5) {
        const alpha = 0.12 - (proj.z / CONFIG.sphereRadius) * 0.06;
        if (alpha > 0.01) {
          ctx.fillStyle = `rgba(100, 110, 130, ${alpha})`;
          ctx.shadowBlur = 0;
          ctx.beginPath();
          ctx.arc(proj.x, proj.y, size * 0.7, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  });
  
  ctx.shadowBlur = 0; // Reset
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    // Auto rotation
    state.rotation.y += CONFIG.rotationSpeed;
    
    // Update Logic based on speed
    const interval = 1000 / state.speed;
    
    if (timestamp - state.lastFrameTime > interval) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation;
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop;
}

// Controls
document.getElementById('btn-pause').addEventListener('click', (e) => {
  state.isRunning = !state.isRunning;
  e.target.innerText = state.isRunning ? "Pause" : "Resume";
  e.target.classList.toggle('primary');
  e.target.classList.toggle('secondary');
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  const btn = document.getElementById('btn-pause');
  btn.innerText = "Resume";
  btn.classList.remove('primary');
  btn.classList.add('secondary');
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
});

// Mouse Drag Rotation
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.6, Math.min(2.5, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
