<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Life Simulation</title>
<style>
  :root {
    --bg-color: #050508;
    --panel-bg: rgba(16, 20, 28, 0.75);
    --panel-border: rgba(255, 255, 255, 0.08);
    --accent-cyan: #00f0ff;
    --accent-violet: #b060ff;
    --accent-magenta: #ff007f;
    --accent-amber: #ffaa00;
    --text-main: #f0f6fc;
    --text-muted: #8b949e;
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    background-color: var(--bg-color);
    /* Deep, subtle radial gradient */
    background-image: radial-gradient(ellipse at 50% 50%, #161b22 0%, #050508 80%);
    color: var(--text-main);
    font-family: var(--font-stack);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Canvas Container */
  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }

  /* UI Overlay */
  #ui-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    pointer-events: none; 
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2rem;
  }

  /* Header */
  .header {
    position: absolute;
    top: 2.5rem;
    left: 2.5rem;
    pointer-events: auto;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    margin-bottom: 0.25rem;
    color: var(--text-main);
    text-shadow: 0 0 30px rgba(255,255,255,0.1);
  }

  .subtitle {
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 600;
    opacity: 0.8;
  }

  /* Control Panel */
  .panel {
    pointer-events: auto;
    width: 260px;
    background: var(--panel-bg);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border: 1px solid var(--panel-border);
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    padding: 1.25rem;
    box-shadow: 
      0 25px 50px -12px rgba(0, 0, 0, 0.7),
      inset 0 1px 0 rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    gap: 1rem;
    position: relative;
    margin-right: 1rem;
    transform: translateX(-5%);
  }

  /* Decorative top accent */
  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 40px; right: 40px;
    height: 1px;
    background: linear-gradient(90deg, var(--accent-cyan), var(--accent-violet), var(--accent-magenta), var(--accent-amber));
    opacity: 0.8;
    box-shadow: 0 0 8px rgba(255,255,255,0.2);
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .panel-label {
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 2px;
  }

  /* Stats */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-variant-numeric: tabular-nums;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    padding-bottom: 4px;
  }
  .stat-value {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-main);
    text-shadow: 0 0 10px rgba(255,255,255,0.15);
  }

  /* Sliders */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
    margin-top: 6px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text-main);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
    transition: transform 0.1s, background 0.2s;
    border: 2px solid var(--bg-color);
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.3);
    background: var(--accent-cyan);
  }

  /* Legend */
  .legend-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
    background: rgba(0,0,0,0.25);
    padding: 8px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.03);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.6rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  .legend-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    box-shadow: 0 0 5px currentColor;
    flex-shrink: 0;
  }

  /* Buttons */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
  }
  
  button {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-muted);
    padding: 0.6rem;
    border-radius: 6px;
    font-size: 0.6rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  button:hover {
    background: rgba(255,255,255,0.08);
    color: var(--text-main);
    border-color: rgba(255,255,255,0.2);
    transform: translateY(-1px);
  }
  
  button:active {
    transform: translateY(0);
  }

  button.primary {
    background: rgba(0, 240, 255, 0.08);
    border: 1px solid rgba(0, 240, 255, 0.3);
    color: var(--accent-cyan);
  }
  button.primary:hover {
    background: rgba(0, 240, 255, 0.2);
    color: #fff;
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    border-color: var(--accent-cyan);
  }
  
  button.secondary {
    border-color: rgba(255, 255, 255, 0.08);
  }
  button.secondary:hover {
    border-color: var(--accent-magenta);
    color: var(--accent-magenta);
    background: rgba(255, 0, 85, 0.1);
  }
  
  button.full-width {
    grid-column: span 2;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 1.5rem;
    left: 2.5rem;
    font-size: 0.6rem;
    color: var(--text-muted);
    opacity: 0.5;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

</style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="sphereCanvas"></canvas>
  </div>

  <div id="ui-layer">
    
    <div class="header">
      <h1>Spherical Life</h1>
      <div class="subtitle">Algorithmic Ecosystem</div>
    </div>

    <div class="panel">
      <div class="panel-section">
        <div class="panel-label">Simulation Status</div>
        <div class="stat-row">
          <span>Generation</span>
          <span class="stat-value" id="gen-count">0</span>
        </div>
        <div class="stat-row">
          <span>Population</span>
          <span class="stat-value" id="pop-count">0</span>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-label">Cell States</div>
        <div class="legend-grid">
          <div class="legend-item">
            <div class="legend-dot" style="background: var(--accent-cyan); color: var(--accent-cyan);"></div>
            <span>New Born</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background: var(--accent-violet); color: var(--accent-violet);"></div>
            <span>Stable</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background: var(--accent-magenta); color: var(--accent-magenta);"></div>
            <span>Aging</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background: var(--accent-amber); color: var(--accent-amber);"></div>
            <span>Dying</span>
          </div>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-label">Simulation Speed</div>
        <input type="range" id="speed-slider" min="1" max="60" value="40">
      </div>

      <div class="panel-section">
        <div class="panel-label">Controls</div>
        <div class="btn-group">
          <button id="btn-pause" class="primary">Pause</button>
          <button id="btn-reset" class="secondary">Randomize</button>
          <button id="btn-step" class="full-width">Step Once</button>
        </div>
      </div>
    </div>

    <div class="footer">
      Drag to Rotate &bull; Scroll to Zoom
    </div>

  </div>

<script>
/**
 * Spherical Conway's Game of Life - Design Revision 2
 * 
 * Changes:
 * 1. Increased Cell Density: 6000 cells for a dense field.
 * 2. Brightness Boost: Front hemisphere cells are significantly brighter.
 * 3. Color Clusters: Initialization logic creates specific geographic zones of colors.
 * 4. Visual Polish: Enhanced lighting model, fresnel rim, and cleaner UI.
 */

// --- Configuration ---
const CONFIG = {
  cellCount: 6000, // Increased density
  sphereRadius: 240,
  cellSize: 2.2,   // Slightly smaller to fit density
  rotationSpeed: 0.0003,
  colors: {
    cyan: { h: 185, s: 100, l: 65 },   
    violet: { h: 270, s: 90, l: 70 },  
    magenta: { h: 330, s: 100, l: 65 },
    amber: { h: 35, s: 100, l: 60 },   
  }
};

// --- State ---
let state = {
  cells: [], 
  generation: 0,
  isRunning: true,
  speed: 40, 
  lastFrameTime: 0,
  rotation: { x: 0.6, y: 0.8 }, 
  zoom: 1,
  isDragging: false,
  lastMouse: { x: 0, y: 0 }
};

// --- Canvas Setup ---
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const Vec3 = {
  distSq: (v1, v2) => {
    const dx = v1.x - v2.x;
    const dy = v1.y - v2.y;
    const dz = v1.z - v2.z;
    return dx*dx + dy*dy + dz*dz;
  }
};

// Fibonacci Lattice for even distribution
function createSpherePoints(count, radius) {
  const points = [];
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  
  for (let i = 0; i < count; i++) {
    const y = 1 - (i / (count - 1)) * 2;
    const radiusAtY = Math.sqrt(1 - y * y);
    const theta = goldenAngle * i;
    
    points.push({
      x: Math.cos(theta) * radiusAtY * radius,
      y: y * radius,
      z: Math.sin(theta) * radiusAtY * radius
    });
  }
  return points;
}

// --- Game Logic ---

function initGame() {
  const points = createSpherePoints(CONFIG.cellCount, CONFIG.sphereRadius);
  
  // Calculate neighbor threshold based on radius and density
  // Heuristic: Distance that captures ~6 neighbors
  const thresholdSq = Math.pow(CONFIG.sphereRadius * 0.065, 2);

  state.cells = points.map((p, i) => {
    const neighbors = [];
    // Optimization: Only check a subset or use a grid in a real engine, 
    // but for 6000 points O(N^2) is approx 36M ops, manageable for init.
    for (let j = 0; j < points.length; j++) {
      if (i === j) continue;
      if (Vec3.distSq(p, points[j]) < thresholdSq) { 
        neighbors.push(j);
      }
    }
    
    // --- VISUAL DESIGN INITIALIZATION ---
    // Create geographic clusters to ensure color diversity immediately
    
    let isAlive = Math.random() > 0.35; // High density (65%)
    let age = Math.floor(Math.random() * 20);
    let deathTimer = 0;

    const yNorm = p.y / CONFIG.sphereRadius; // -1 to 1
    const xNorm = p.x / CONFIG.sphereRadius;
    const zNorm = p.z / CONFIG.sphereRadius;

    // 1. Cyan Storms (Equatorial bands)
    if (Math.abs(yNorm) < 0.15 && Math.random() > 0.4) {
      isAlive = true;
      age = 0; // Cyan
    }
    // 2. Violet/Magenta (Mid-latitudes)
    else if (Math.abs(yNorm) > 0.2 && Math.abs(yNorm) < 0.7) {
      age = Math.floor(Math.random() * 25); // Mix of Violet and Magenta
    }
    // 3. Amber Dying (Polar caps)
    else if (Math.abs(yNorm) > 0.85) {
      isAlive = Math.random() > 0.3;
      if (!isAlive) deathTimer = 5;
      else age = 20; // Magenta (Aging)
    }

    return {
      pos: p,
      neighbors: neighbors,
      alive: isAlive,
      age: age, 
      deathTimer: deathTimer
    };
  });
  
  state.generation = 0;
  updateStats();
}

function stepGame() {
  const updates = [];
  
  state.cells.forEach((cell, i) => {
    const neighborCount = cell.neighbors.reduce((acc, idx) => acc + (state.cells[idx].alive ? 1 : 0), 0);
    
    let nextAlive = false;
    let isBorn = false;

    // Standard Conway Rules
    if (cell.alive) {
      if (neighborCount < 2 || neighborCount > 3) {
        nextAlive = false;
      } else {
        nextAlive = true;
      }
    } else {
      if (neighborCount === 3) {
        nextAlive = true;
        isBorn = true;
      }
    }

    updates.push({
      alive: nextAlive,
      isBorn: isBorn,
      dying: nextAlive === false && cell.alive === true
    });
  });

  // Apply updates
  state.cells.forEach((cell, i) => {
    const u = updates[i];
    
    if (u.isBorn) {
      cell.alive = true;
      cell.age = 0; // Cyan
      cell.deathTimer = 0;
    } else if (u.dying) {
      cell.alive = false;
      cell.deathTimer = 5; // Amber duration
      cell.age = 0;
    } else if (cell.alive) {
      cell.age++;
    } else if (cell.deathTimer > 0) {
      cell.deathTimer--;
    }
  });

  state.generation++;
  updateStats();
}

// --- Rendering ---

function project(p, rotX, rotY, zoom) {
  // Rotate Y
  let x = p.x * Math.cos(rotY) - p.z * Math.sin(rotY);
  let z = p.z * Math.cos(rotY) + p.x * Math.sin(rotY);
  
  // Rotate X
  let y = p.y * Math.cos(rotX) - z * Math.sin(rotX);
  let zFinal = z * Math.cos(rotX) + p.y * Math.sin(rotX);
  
  // Perspective
  const fov = 1200 * zoom;
  const scale = fov / (fov + zFinal);
  
  return {
    x: x * scale + width / 2,
    y: y * scale + height / 2,
    scale: scale,
    z: zFinal 
  };
}

function draw() {
  // Clear
  ctx.fillStyle = 'rgba(5, 5, 8, 1)'; 
  ctx.fillRect(0, 0, width, height);

  // Prepare projected cells
  const projectedCells = state.cells.map(cell => {
    const proj = project(cell.pos, state.rotation.x, state.rotation.y, state.zoom);
    return { cell, proj };
  });
  
  // Sort by Z (Painter's Algorithm)
  projectedCells.sort((a, b) => b.proj.z - a.proj.z);

  projectedCells.forEach(({ cell, proj }) => {
    // Cull strictly backface
    if (proj.z > CONFIG.sphereRadius * 0.8) return; 

    const size = CONFIG.cellSize * proj.scale;
    
    // --- REVISED LIGHTING MODEL ---
    
    // 1. Depth Ratio (0 = front, 1 = back)
    const depthRatio = (proj.z + CONFIG.sphereRadius) / (2 * CONFIG.sphereRadius);
    
    // 2. Lighting (Top-Left)
    // Calculate normalized light vector impact
    // Light is coming from (-x, -y, -z) roughly
    const lightFactor = 1 - ( (proj.x - width/2) * 0.0004 + (proj.y - height/2) * 0.0004 ); 
    
    // 3. Brightness & Alpha
    // Front is fully opaque and bright. Back fades.
    // CRITICAL CHANGE: Increased brightness for front hemisphere to meet critique.
    const alpha = Math.max(0.1, 1 - Math.pow(depthRatio, 1.5));
    
    // Lighting multiplier: Front is 1.0 (full), back drops to 0.3
    const brightness = Math.max(0.3, lightFactor * (1 - depthRatio * 0.7));
    
    let colorStr;
    let shadowColor = "transparent";
    let shadowBlur = 0;

    if (cell.alive) {
      let cBase;
      
      // Determine State Color
      if (cell.age < 3) {
        cBase = CONFIG.colors.cyan; 
      } else if (cell.age < 15) {
        cBase = CONFIG.colors.violet; 
      } else {
        cBase = CONFIG.colors.magenta; 
      }
      
      // Apply lighting to color
      const h = cBase.h;
      const s = cBase.s;
      // Lightness: Boost base lightness significantly for the front
      const l = Math.min(95, Math.max(15, cBase.l * brightness)); 
      
      colorStr = `hsla(${h}, ${s}%, ${l}%, ${alpha})`;
      
      // Glow effect for front, bright cells
      if (depthRatio < 0.4 && brightness > 0.6) {
        shadowColor = `hsla(${h}, ${s}%, 85%, ${alpha * 0.5})`;
        shadowBlur = 8 * proj.scale;
      }
    } else {
      // Dying State (Amber)
      if (cell.deathTimer > 0) {
        const cBase = CONFIG.colors.amber;
        // Dying cells glow
        const l = Math.min(90, cBase.l * (brightness * 1.3)); 
        colorStr = `hsla(${cBase.h}, ${cBase.s}%, ${l}%, ${alpha})`;
        shadowColor = `hsla(${cBase.h}, ${cBase.s}%, 80%, ${alpha * 0.4})`;
        shadowBlur = 6 * proj.scale;
      } else {
        // Dead - subtle grid points
        const deadAlpha = alpha * 0.2;
        const deadLight = 25 * brightness;
        colorStr = `rgba(${deadLight}, ${deadLight+2}, ${deadLight+5}, ${deadAlpha})`;
      }
    }
    
    ctx.fillStyle = colorStr;
    ctx.shadowColor = shadowColor;
    ctx.shadowBlur = shadowBlur;
    
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  ctx.shadowBlur = 0;
  
  // --- Atmospheric Sphere Shell ---
  const cx = width / 2;
  const cy = height / 2;
  const r = CONFIG.sphereRadius * state.zoom;
  
  // 1. Outer Glow / Rim Light (Fresnel effect)
  // Cyan-tinted rim to emphasize the spherical boundary
  const rimGrad = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r * 1.1);
  rimGrad.addColorStop(0, 'rgba(0,0,0,0)');
  rimGrad.addColorStop(0.5, 'rgba(0, 240, 255, 0.08)'); 
  rimGrad.addColorStop(1, 'rgba(0,0,0,0)');
  
  ctx.fillStyle = rimGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.1, 0, Math.PI * 2);
  ctx.fill();

  // 2. Inner Volume Shadow (creates the 3D sphere feel)
  // Offset to match lighting model
  const innerGrad = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, r*0.1, cx, cy, r);
  innerGrad.addColorStop(0, 'rgba(0,0,0,0)'); 
  innerGrad.addColorStop(0.5, 'rgba(0,0,0,0.1)');
  innerGrad.addColorStop(1, 'rgba(0,0,0,0.7)'); // Dark terminator
  
  ctx.fillStyle = innerGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
}

// --- Main Loop ---

function loop(timestamp) {
  if (state.isRunning) {
    // Auto rotation
    state.rotation.y += CONFIG.rotationSpeed;
    
    // Update Logic based on speed
    if (timestamp - state.lastFrameTime > (1000 / state.speed)) {
      stepGame();
      state.lastFrameTime = timestamp;
    }
  }
  
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---

function updateStats() {
  document.getElementById('gen-count').innerText = state.generation;
  const pop = state.cells.filter(c => c.alive).length;
  document.getElementById('pop-count').innerText = pop;
}

// Controls
const btnPause = document.getElementById('btn-pause');
btnPause.addEventListener('click', (e) => {
  state.isRunning = !state.isRunning;
  if (state.isRunning) {
    e.target.innerText = "Pause";
    e.target.classList.add('primary');
    e.target.classList.remove('secondary');
  } else {
    e.target.innerText = "Resume";
    e.target.classList.remove('primary');
    e.target.classList.add('secondary');
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initGame();
});

document.getElementById('btn-step').addEventListener('click', () => {
  state.isRunning = false;
  btnPause.innerText = "Resume";
  btnPause.classList.remove('primary');
  btnPause.classList.add('secondary');
  stepGame();
  draw();
});

document.getElementById('speed-slider').addEventListener('input', (e) => {
  state.speed = parseInt(e.target.value);
});

// Mouse Drag Rotation
const container = document.getElementById('canvas-container');

container.addEventListener('mousedown', (e) => {
  state.isDragging = true;
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
  if (!state.isDragging) return;
  const deltaX = e.clientX - state.lastMouse.x;
  const deltaY = e.clientY - state.lastMouse.y;
  
  state.rotation.y += deltaX * 0.005;
  state.rotation.x += deltaY * 0.005;
  
  state.lastMouse = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
});

// Zoom
container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSensitivity = 0.001;
  state.zoom -= e.deltaY * zoomSensitivity;
  state.zoom = Math.max(0.5, Math.min(3, state.zoom));
});

// --- Init ---
initGame();
requestAnimationFrame(loop);

</script>
</body>
</html>
