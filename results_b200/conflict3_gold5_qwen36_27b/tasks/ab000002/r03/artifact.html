<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archon's Ascension - Skill Matrix</title>
<style>
    :root {
        /* Palette - Deep Void Theme */
        --bg-dark: #05070a;
        --bg-panel: #0b111e;
        --bg-panel-gradient: linear-gradient(180deg, #0f172a 0%, #020617 100%);
        
        --border-color: #1e293b;
        --border-glow: rgba(251, 191, 36, 0.15);
        
        --accent-gold: #fbbf24;
        --accent-gold-dim: #78350f;
        --accent-gold-glow: rgba(251, 191, 36, 0.4);
        
        /* Branch Accents - Refined */
        --accent-red: #ef4444;
        --accent-red-dim: #7f1d1d;
        --accent-red-glow: rgba(239, 68, 68, 0.5);
        
        --accent-blue: #3b82f6;
        --accent-blue-dim: #1e3a8a;
        --accent-blue-glow: rgba(59, 130, 246, 0.5);
        
        --accent-green: #10b981;
        --accent-green-dim: #064e3b;
        --accent-green-glow: rgba(16, 185, 129, 0.5);

        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-dim: #475569;
        
        --font-display: 'Georgia', 'Times New Roman', serif;
        --font-body: 'Segoe UI', 'Roboto', Helvetica, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Background Texture --- */
    body::before {
        content: '';
        position: absolute;
        inset: 0;
        background: 
            radial-gradient(circle at 50% 30%, #1e293b 0%, transparent 60%),
            radial-gradient(circle at 50% 100%, #0f172a 0%, transparent 50%);
        z-index: -1;
        opacity: 0.6;
    }

    /* --- Header --- */
    header {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid var(--border-color);
        background: rgba(2, 4, 8, 0.85);
        backdrop-filter: blur(10px);
        z-index: 20;
        position: relative;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .title-container {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 1.4rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-main);
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        font-weight: 400;
        margin-bottom: 2px;
    }

    .subtitle {
        font-size: 0.7rem;
        color: var(--accent-gold);
        letter-spacing: 0.4em;
        text-transform: uppercase;
        opacity: 0.9;
        font-weight: 600;
        text-shadow: 0 0 8px var(--accent-gold-glow);
    }

    /* --- Layout --- */
    .main-layout {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
    }

    /* --- Sidebar --- */
    aside {
        width: 300px;
        background: var(--bg-panel-gradient);
        border-right: 1px solid var(--border-color);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        z-index: 10;
        box-shadow: 5px 0 30px rgba(0,0,0,0.5);
    }

    /* Character Card */
    .char-card {
        text-align: center;
        position: relative;
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    
    .char-avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 2px solid var(--accent-gold);
        margin: 0 auto 16px;
        background: radial-gradient(circle at 30% 30%, #1e293b, #0f172a);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(251, 191, 36, 0.1);
        position: relative;
    }

    .char-avatar::after {
        content: '';
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 1px dashed rgba(251, 191, 36, 0.3);
        animation: spin 20s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    .char-avatar svg {
        width: 44px;
        height: 44px;
        fill: var(--text-main);
        filter: drop-shadow(0 0 2px rgba(251, 191, 36, 0.5));
    }

    .char-name {
        font-family: var(--font-display);
        font-size: 1.4rem;
        margin-bottom: 4px;
        color: var(--text-main);
        letter-spacing: 0.05em;
    }
    
    .char-class {
        color: var(--accent-gold);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-weight: 700;
    }

    /* Stats */
    .stat-block {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .level-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 12px;
    }

    .level-num {
        font-family: var(--font-display);
        font-size: 3rem;
        color: var(--text-main);
        line-height: 1;
        letter-spacing: -0.02em;
    }

    .level-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.1em;
    }

    .xp-bar-container {
        margin-top: 8px;
    }

    .xp-info {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-bottom: 8px;
        font-variant-numeric: tabular-nums;
    }

    .xp-track {
        height: 8px;
        background: #1e293b;
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
    }

    .xp-fill {
        height: 100%;
        width: 65%;
        background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold));
        box-shadow: 0 0 10px var(--accent-gold);
        position: relative;
    }
    
    .xp-fill::after {
        content: '';
        position: absolute;
        right: 0; top: 0; bottom: 0; width: 2px;
        background: #fff;
        box-shadow: 0 0 8px #fff;
    }

    .points-box {
        background: rgba(251, 191, 36, 0.03);
        border: 1px solid rgba(251, 191, 36, 0.2);
        padding: 24px;
        border-radius: 6px;
        text-align: center;
        margin-top: 10px;
        position: relative;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    
    /* Decorative corners */
    .points-box::before, .points-box::after {
        content: '';
        position: absolute;
        width: 8px; height: 8px;
        border: 2px solid var(--accent-gold);
        transition: all 0.3s ease;
    }
    .points-box::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .points-box::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    .points-val {
        font-size: 2.8rem;
        font-family: var(--font-display);
        color: var(--accent-gold);
        display: block;
        line-height: 1;
        text-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
    }

    .points-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--text-muted);
        margin-top: 8px;
        display: block;
        font-weight: 700;
    }

    .main-stats {
        margin-top: auto;
        background: rgba(0,0,0,0.2);
        padding: 16px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.85rem;
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-row span:first-child { color: var(--text-muted); }
    .stat-row span:last-child { color: var(--text-main); font-weight: 500; font-variant-numeric: tabular-nums; }

    /* --- Skill Tree Canvas --- */
    .tree-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        background-color: var(--bg-dark);
        /* Subtle grid */
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 40px 40px;
        cursor: grab;
    }

    .tree-container:active { cursor: grabbing; }

    /* The "World" that moves */
    .tree-world {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        transform-origin: center center;
        transition: transform 0.1s linear;
    }

    /* SVG Connections */
    svg.connections {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    /* Branch Labels */
    .branch-label {
        position: absolute;
        font-family: var(--font-display);
        font-size: 1.1rem;
        color: var(--text-muted);
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.2em;
        pointer-events: none;
        transform: translate(-50%, -50%);
        white-space: nowrap;
        z-index: 0;
        opacity: 0.5;
        text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 6px;
    }

    /* Node Names */
    .node-name {
        position: absolute;
        width: 140px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        pointer-events: none;
        line-height: 1.3;
        text-shadow: 0 2px 4px rgba(0,0,0,1);
        transition: color 0.3s ease, opacity 0.3s ease;
        z-index: 1;
        font-weight: 600;
    }

    .node.scale-root .node-name { bottom: -35px; font-size: 0.9rem; color: var(--text-main); }
    .node.scale-capstone .node-name { top: -35px; font-size: 0.9rem; color: var(--text-main); }
    .node:not(.scale-root):not(.scale-capstone) .node-name { bottom: -32px; }

    /* --- Connection Lines --- */
    .connection-line {
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: stroke 0.3s ease, filter 0.3s ease;
    }

    .connection-line { stroke: #1e293b; }
    
    .connection-line.active {
        filter: drop-shadow(0 0 3px currentColor);
        stroke-width: 3;
    }

    /* --- Nodes --- */
    .node {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 2;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .node-shape {
        border-radius: 50%;
        background: #0f172a;
        border: 2px solid #334155;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        transition: all 0.3s ease;
    }

    /* Inner ring */
    .node-shape::after {
        content: '';
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.08);
        pointer-events: none;
    }

    .node-icon {
        fill: var(--text-muted);
        opacity: 0.4;
        transition: all 0.3s ease;
    }

    /* State: Locked */
    .node.locked { opacity: 0.6; }
    .node.locked .node-shape { background: #020617; border-color: #1e293b; }

    /* State: Available */
    .node.available .node-shape { border-color: #94a3b8; box-shadow: 0 0 15px rgba(148, 163, 184, 0.2); }
    .node.available:hover .node-shape { transform: scale(1.15); border-color: #fff; background: #1e293b; }
    .node.available .node-name { color: var(--text-main); }

    /* State: Unlocked */
    .node.unlocked .node-shape { background: radial-gradient(circle at 30% 30%, #1e293b, #0f172a); }
    .node.unlocked .node-icon { opacity: 1; }
    .node.unlocked .node-name { color: #fff; opacity: 1; text-shadow: 0 0 5px currentColor; }

    /* Scale Variants */
    .node.scale-root .node-shape { width: 84px; height: 84px; border-width: 3px; }
    .node.scale-root .node-icon { width: 36px; height: 36px; }
    
    .node.scale-capstone .node-shape { width: 96px; height: 96px; border-width: 3px; }
    .node.scale-capstone .node-icon { width: 40px; height: 40px; }
    
    .node:not(.scale-root):not(.scale-capstone) .node-shape { width: 60px; height: 60px; }
    .node:not(.scale-root):not(.scale-capstone) .node-icon { width: 28px; height: 28px; }

    /* --- Branch Specific Colors --- */
    /* Red - Strength/Physical */
    .branch-red.unlocked .node-shape { border-color: var(--accent-red); box-shadow: 0 0 25px var(--accent-red-glow); }
    .branch-red.unlocked .node-icon { fill: var(--accent-red); filter: drop-shadow(0 0 4px var(--accent-red)); }
    .branch-red.active-line { stroke: var(--accent-red); color: var(--accent-red); }

    /* Blue - Magic/Arcane */
    .branch-blue.unlocked .node-shape { border-color: var(--accent-blue); box-shadow: 0 0 25px var(--accent-blue-glow); }
    .branch-blue.unlocked .node-icon { fill: var(--accent-blue); filter: drop-shadow(0 0 4px var(--accent-blue)); }
    .branch-blue.active-line { stroke: var(--accent-blue); color: var(--accent-blue); }

    /* Green - Agility/Shadow */
    .branch-green.unlocked .node-shape { border-color: var(--accent-green); box-shadow: 0 0 25px var(--accent-green-glow); }
    .branch-green.unlocked .node-icon { fill: var(--accent-green); filter: drop-shadow(0 0 4px var(--accent-green)); }
    .branch-green.active-line { stroke: var(--accent-green); color: var(--accent-green); }

    /* Gold Override */
    .node.scale-root.unlocked .node-shape { border-color: var(--accent-gold); box-shadow: 0 0 30px var(--accent-gold-glow); }
    .node.scale-root.unlocked .node-icon { fill: var(--accent-gold); filter: drop-shadow(0 0 4px var(--accent-gold)); }
    
    .node.scale-capstone.unlocked .node-shape { border-color: var(--accent-gold); box-shadow: 0 0 35px var(--accent-gold-glow); }
    .node.scale-capstone.unlocked .node-icon { fill: var(--accent-gold); filter: drop-shadow(0 0 5px var(--accent-gold)); }

    /* --- Tooltip --- */
    .tooltip {
        position: fixed;
        background: rgba(15, 23, 42, 0.98);
        border: 1px solid var(--accent-gold-dim);
        padding: 18px;
        width: 280px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        backdrop-filter: blur(8px);
    }

    .tooltip.visible { opacity: 1; transform: translateY(0); }

    .tooltip h3 {
        color: var(--text-main);
        font-family: var(--font-display);
        margin-bottom: 6px;
        font-size: 1.2rem;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 8px;
    }

    .tooltip .type {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--accent-gold);
        margin-bottom: 12px;
        letter-spacing: 0.1em;
        font-weight: bold;
    }

    .tooltip p { font-size: 0.85rem; line-height: 1.5; color: #cbd5e1; }

    .tooltip .req {
        margin-top: 14px;
        font-size: 0.75rem;
        color: #ef4444;
        display: none;
        font-style: italic;
        background: rgba(239, 68, 68, 0.1);
        padding: 6px;
        border-radius: 3px;
    }

    .tooltip.locked .req { display: block; }
    .tooltip.locked h3 { color: var(--text-muted); }
    .tooltip.locked { border-color: #334155; }

</style>
</head>
<body>

    <header>
        <div class="title-container">
            <h1>Archon's Ascension</h1>
            <div class="subtitle">Class: Void Walker</div>
        </div>
    </header>

    <div class="main-layout">
        <!-- Sidebar -->
        <aside>
            <div class="char-card">
                <div class="char-avatar">
                    <!-- Hero Icon -->
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                </div>
                <div class="char-name">Kaelen Thorne</div>
                <div class="char-class">Duelist / Arcanist</div>
            </div>

            <div class="stat-block">
                <div class="level-row">
                    <span class="level-num">42</span>
                    <span class="level-label">Level</span>
                </div>
                <div class="xp-bar-container">
                    <div class="xp-info">
                        <span>XP</span>
                        <span>12,450 / 20,000</span>
                    </div>
                    <div class="xp-track">
                        <div class="xp-fill"></div>
                    </div>
                </div>
            </div>

            <div class="points-box">
                <span class="points-val">3</span>
                <span class="points-label">Available Points</span>
            </div>

            <div class="main-stats">
                <div class="stat-row"><span>Strength</span><span>14</span></div>
                <div class="stat-row"><span>Dexterity</span><span>28</span></div>
                <div class="stat-row"><span>Intelligence</span><span>35</span></div>
                <div class="stat-row"><span>Vitality</span><span>12</span></div>
                <div class="stat-row"><span>Crit Chance</span><span>18%</span></div>
            </div>
        </aside>

        <!-- Main Tree Canvas -->
        <div class="tree-container" id="treeContainer">
            <div class="tree-world" id="treeWorld">
                
                <!-- SVG Lines -->
                <svg class="connections" id="svgConnections"></svg>
                <!-- Nodes injected by JS -->
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
        <h3 id="tt-title">Skill Name</h3>
        <div class="type" id="tt-type">Passive</div>
        <p id="tt-desc">Description of the skill goes here.</p>
        <div class="req" id="tt-req">Requires: [Previous Skill]</div>
    </div>

<script>
    // --- Data: Layout adjusted for safe canvas area ---
    // World dimensions: 1200x800 (virtual)
    // Center is 600, 400.
    // We pull the outer nodes inward and raise the bottom capstone.
    
    const skills = [
        // Root (Top Center)
        { id: 'root', x: 600, y: 80, scale: 'scale-root', branch: 'gold', name: "Archon's Spark", type: "Origin", desc: "The genesis of your power. Unlocks the skill tree.", unlocked: true, req: null },
        
        // Tier 1
        { id: 'str1', x: 380, y: 220, scale: 'scale-tier2', branch: 'red', name: "Titan's Grip", type: "Passive", desc: "Increases Strength by 10%. Weapons weigh less.", unlocked: true, req: 'root' },
        { id: 'int1', x: 600, y: 220, scale: 'scale-tier2', branch: 'blue', name: "Arcane Mind", type: "Passive", desc: "Increases Mana Regen by 15%.", unlocked: true, req: 'root' },
        { id: 'dex1', x: 820, y: 220, scale: 'scale-tier2', branch: 'green', name: "Swift Foot", type: "Passive", desc: "Increases Movement Speed by 8%.", unlocked: true, req: 'root' },

        // Tier 2 (Outer nodes pulled in slightly)
        { id: 'str2', x: 260, y: 360, scale: 'scale-tier3', branch: 'red', name: "Heavy Strike", type: "Active", desc: "Slam weapon for AoE damage.", unlocked: true, req: 'str1' },
        { id: 'str3', x: 460, y: 360, scale: 'scale-tier3', branch: 'red', name: "Unstoppable", type: "Passive", desc: "Immunity to Knockback.", unlocked: false, req: 'str1' },
        
        { id: 'int2', x: 500, y: 360, scale: 'scale-tier3', branch: 'blue', name: "Fireball", type: "Active", desc: "Launch a projectile of pure fire.", unlocked: true, req: 'int1' },
        { id: 'int3', x: 700, y: 360, scale: 'scale-tier3', branch: 'blue', name: "Frost Nova", type: "Active", desc: "Freeze nearby enemies.", unlocked: true, req: 'int1' },

        { id: 'dex2', x: 740, y: 360, scale: 'scale-tier3', branch: 'green', name: "Evasion", type: "Passive", desc: "12% chance to dodge.", unlocked: true, req: 'dex1' },
        { id: 'dex3', x: 940, y: 360, scale: 'scale-tier3', branch: 'green', name: "Backstab", type: "Active", desc: "High damage from behind.", unlocked: false, req: 'dex1' },

        // Tier 3 (Converging)
        { id: 'hybrid1', x: 360, y: 500, scale: 'scale-tier2', branch: 'red', name: "Blood Pact", type: "Passive", desc: "Heal for 5% of damage dealt.", unlocked: false, req: 'str3' },
        { id: 'hybrid2', x: 600, y: 500, scale: 'scale-tier2', branch: 'blue', name: "Elemental Flux", type: "Passive", desc: "Spells cost 10% less mana.", unlocked: true, req: 'int3' },
        { id: 'hybrid3', x: 840, y: 500, scale: 'scale-tier2', branch: 'green', name: "Shadow Step", type: "Active", desc: "Teleport through shadows.", unlocked: false, req: 'dex3' },

        // Capstone (Raised from bottom boundary)
        { id: 'capstone', x: 600, y: 680, scale: 'scale-capstone', branch: 'gold', name: "Void Dominion", type: "Ultimate", desc: "Transcendence. All stats +20%. Unlocks Void Form.", unlocked: false, req: 'hybrid2' }
    ];

    // --- Icons (SVG Paths) ---
    const icons = {
        // Star for Root
        origin: "M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 6.82 21.02 8 14.14 3 9.27 9.91 8.26 12 2z", 
        // Shield for Passive
        passive: "M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z", 
        // Lightning for Active
        active: "M13 2L3 14h9l-1 8 10-12h-9l1-8z", 
        // Eye for Ultimate
        ultimate: "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z", 
    };

    // --- DOM Elements ---
    const world = document.getElementById('treeWorld');
    const svg = document.getElementById('svgConnections');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttType = document.getElementById('tt-type');
    const ttDesc = document.getElementById('tt-desc');
    const ttReq = document.getElementById('tt-req');

    // --- Initialization ---
    function init() {
        const container = document.getElementById('treeContainer');
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        
        // Virtual world dimensions
        const ww = 1200; 
        const wh = 800;
        
        // Center the world initially
        const worldCenterX = ww / 2;
        const worldCenterY = wh / 2;
        
        let panX = (cw / 2) - worldCenterX;
        let panY = (ch / 2) - worldCenterY;
        
        // Adjust panY slightly to ensure capstone is visible (push up)
        panY += 40; 

        world.style.transform = `translate(${panX}px, ${panY}px)`;

        // Draw Nodes
        skills.forEach(skill => {
            const node = document.createElement('div');
            
            // Classes: node, scale, state, branch color
            const state = getSkillState(skill);
            node.className = `node ${skill.scale} branch-${skill.branch} ${state}`;
            node.style.left = `${skill.x}px`;
            node.style.top = `${skill.y}px`;
            node.dataset.id = skill.id;

            // Icon Selection
            let iconPath = icons.passive;
            if(skill.type === 'Active') iconPath = icons.active;
            if(skill.type === 'Ultimate') iconPath = icons.ultimate;
            if(skill.type === 'Origin') iconPath = icons.origin;

            node.innerHTML = `
                <div class="node-shape">
                    <svg class="node-icon" viewBox="0 0 24 24">
                        <path d="${iconPath}" />
                    </svg>
                </div>
                <div class="node-name">${skill.name}</div>
            `;

            // Events
            node.addEventListener('mouseenter', (e) => showTooltip(e, skill));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => toggleSkill(skill.id));

            world.appendChild(node);
        });

        drawConnections();

        // --- Pan & Zoom Logic ---
        let isPanning = false;
        let startX, startY;
        let scale = 1;

        container.addEventListener('mousedown', (e) => {
            if (e.target.closest('.node')) return;
            isPanning = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
            container.style.cursor = 'grabbing';
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
            container.style.cursor = 'grab';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            e.preventDefault();
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        });

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomSensitivity = 0.001;
            const delta = -e.deltaY * zoomSensitivity;
            const newScale = Math.min(Math.max(0.5, scale + delta), 1.5);
            
            // Zoom towards mouse pointer
            const rect = container.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const scaleChange = newScale - scale;
            panX -= mouseX * scaleChange;
            panY -= mouseY * scaleChange;
            
            scale = newScale;
            world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        });
    }

    function getSkillState(skill) {
        if (skill.unlocked) return 'unlocked';
        const parent = skills.find(s => s.id === skill.req);
        if (parent && parent.unlocked) return 'available';
        return 'locked';
    }

    function drawConnections() {
        svg.innerHTML = ''; // Clear existing
        skills.forEach(skill => {
            if (skill.req) {
                const parent = skills.find(s => s.id === skill.req);
                if (parent) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parent.x);
                    line.setAttribute('y1', parent.y);
                    line.setAttribute('x2', skill.x);
                    line.setAttribute('y2', skill.y);
                    
                    // If the child is unlocked, the path to it is active
                    const branchClass = `branch-${skill.branch}`;
                    line.classList.add(branchClass);
                    
                    if (skill.unlocked) {
                        line.classList.add('active', 'active-line');
                    }
                    
                    svg.appendChild(line);
                }
            }
        });
    }

    function showTooltip(e, skill) {
        ttTitle.textContent = skill.name;
        ttType.textContent = skill.type;
        ttDesc.textContent = skill.desc;
        
        if (skill.unlocked) {
            tooltip.classList.remove('locked');
            ttReq.style.display = 'none';
            ttType.style.color = 'var(--accent-gold)';
        } else {
            tooltip.classList.add('locked');
            const reqSkill = skills.find(s => s.id === skill.req);
            ttReq.textContent = `Requires: ${reqSkill ? reqSkill.name : 'Unknown'}`;
            ttReq.style.display = 'block';
            ttType.style.color = 'var(--text-muted)';
        }

        tooltip.classList.add('visible');
        
        // Position logic to keep within viewport
        let x = e.clientX + 20;
        let y = e.clientY - 20;
        
        if (x + 280 > window.innerWidth) x = e.clientX - 300;
        if (y + 200 > window.innerHeight) y = e.clientY - 200;

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
    }

    function hideTooltip() {
        tooltip.classList.remove('visible');
    }

    function toggleSkill(id) {
        const skill = skills.find(s => s.id === id);
        
        // Logic: Only allow toggling if available (parent unlocked)
        const parent = skills.find(s => s.id === skill.req);
        const isAvailable = (!skill.req) || (parent && parent.unlocked);

        if (!skill.unlocked && isAvailable) {
            skill.unlocked = true;
            updateVisuals();
        } else if (skill.unlocked && skill.type !== 'Origin') {
            // Optional: Allow removing points
            skill.unlocked = false;
            updateVisuals();
        }
    }

    function updateVisuals() {
        // Update Nodes
        document.querySelectorAll('.node').forEach(el => {
            const s = skills.find(sk => sk.id === el.dataset.id);
            el.className = `node ${s.scale} branch-${s.branch} ${getSkillState(s)}`;
        });
        drawConnections();
    }

    // Run
    init();

</script>
</body>
</html>
