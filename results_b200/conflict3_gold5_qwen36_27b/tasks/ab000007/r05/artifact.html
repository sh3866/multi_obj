<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumina: Net & Collection</title>
<style>
  :root {
    --bg-deep: #03060a;
    --bg-panel: rgba(8, 12, 20, 0.75);
    --accent-cyan: #00f0ff;
    --accent-magenta: #ff0055;
    --accent-lime: #ccff00;
    --glass-border: rgba(0, 240, 255, 0.2);
    --font-display: 'Impact', 'Arial Black', system-ui, sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-deep);
    color: white;
    font-family: var(--font-ui);
    overflow: hidden;
  }

  /* --- Scene Container --- */
  .scene-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 60% 40%, #0d1420 0%, var(--bg-deep) 80%);
  }

  /* Perspective Grid Background - Subtle Depth */
  .grid-bg {
    position: absolute;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background-image: 
      linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
    background-size: 100px 100px;
    transform: perspective(600px) rotateX(60deg) translateY(-100px);
    animation: gridScroll 30s linear infinite;
    z-index: 0;
    pointer-events: none;
    mask-image: linear-gradient(to bottom, transparent 20%, black 60%, black 100%);
  }

  @keyframes gridScroll {
    0% { transform: perspective(600px) rotateX(60deg) translateY(-100px); }
    100% { transform: perspective(600px) rotateX(60deg) translateY(-40px); }
  }

  /* Vignette & Atmosphere */
  .vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 40%, transparent 30%, var(--bg-deep) 95%);
    z-index: 1;
    pointer-events: none;
  }

  /* Canvas Layer */
  #gameCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
  }

  /* --- UI Layer --- */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2rem;
  }

  /* Header & HUD */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: auto;
    width: 100%;
  }

  .brand {
    display: flex;
    flex-direction: column;
    text-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
  }

  h1 {
    font-family: var(--font-display);
    font-size: 2.8rem;
    margin: 0;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: white;
    line-height: 1;
    font-weight: 700;
    background: linear-gradient(to bottom, #fff, #aaccff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 0.7rem;
    color: var(--accent-cyan);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.8;
    font-weight: 600;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
  }

  /* HUD Panel - Compact & Tech */
  .hud-panel {
    background: var(--bg-panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-left: 3px solid var(--accent-cyan);
    padding: 0.8rem 1.8rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 100px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    position: relative;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 20px 100%, 0 calc(100% - 20px));
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 2.2rem;
    color: white;
    line-height: 1;
    letter-spacing: 0.05em;
  }

  .stat-label {
    font-size: 0.6rem;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-top: 6px;
  }

  /* Collection Button */
  .footer {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: auto;
    padding-bottom: 2rem;
  }

  .btn-main {
    background: rgba(0, 240, 255, 0.02);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(0, 240, 255, 0.2);
    color: var(--accent-cyan);
    font-family: var(--font-display);
    font-size: 1rem;
    padding: 1rem 3.5rem;
    border-radius: 0;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    box-shadow: 0 0 0 rgba(0, 240, 255, 0);
    position: relative;
    overflow: hidden;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }

  .btn-main::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,240,255,0.1), transparent);
    transform: translateX(-100%);
    transition: 0.5s;
  }

  .btn-main:hover {
    background: rgba(0, 240, 255, 0.08);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
    transform: translateY(-2px);
    color: white;
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
  }

  .btn-main:hover::before {
    transform: translateX(100%);
  }

  .btn-main:active {
    transform: translateY(1px);
    background: rgba(0, 240, 255, 0.15);
  }

  /* Toast */
  .toast {
    position: absolute;
    top: 35%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(0,0,0,0.9);
    border: 1px solid var(--accent-magenta);
    color: var(--accent-magenta);
    padding: 1rem 2.5rem;
    border-radius: 0;
    font-family: var(--font-display);
    letter-spacing: 0.3em;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
    text-transform: uppercase;
    box-shadow: 0 0 50px rgba(255, 0, 85, 0.25);
    text-align: center;
    clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
  }
  
  .toast.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.05);
  }

  @media (max-width: 600px) {
    h1 { font-size: 2rem; }
    .ui-layer { padding: 1.2rem; }
    .btn-main { padding: 0.8rem 2rem; font-size: 0.9rem; }
  }
</style>
</head>
<body>

<div class="scene-container">
  <div class="grid-bg"></div>
  <div class="vignette"></div>

  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    <header class="header">
      <div class="brand">
        <h1>Lumina</h1>
        <div class="subtitle">Capture & Collection</div>
      </div>
      <div class="hud-panel">
        <div class="stat-value" id="scoreDisplay">0</div>
        <div class="stat-label">Captured</div>
      </div>
    </header>

    <div id="toast" class="toast">Specimen Secured</div>

    <footer class="footer">
      <button class="btn-main" onclick="resetGame()">Collection</button>
    </footer>
  </div>
</div>

<script>
  /**
   * Game Logic & Rendering
   */
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const scoreEl = document.getElementById('scoreDisplay');
  const toastEl = document.getElementById('toast');

  let width, height;
  let score = 0;
  let particles = [];
  let creatures = [];
  
  // Mouse/Touch state (Controls the NET position)
  let input = { x: 0, y: 0, active: false };
  
  // Player Position (Fixed lower-left)
  let player = { x: 0, y: 0 };
  let frameCount = 0;

  const COLORS = {
    cyan: '#00f0ff',
    magenta: '#ff0055',
    lime: '#ccff00',
    deepPurple: '#8800ff'
  };
  const CREATURE_COUNT = 9;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    
    // Position player fixed at lower left
    player.x = width * 0.15; 
    player.y = height * 0.75;
    
    // Initialize input to a default "ready" position
    input.x = width * 0.45;
    input.y = height * 0.55;
  }
  window.addEventListener('resize', resize);
  resize();

  // Input Handling
  window.addEventListener('mousemove', e => {
    input.x = e.clientX;
    input.y = e.clientY;
  });
  window.addEventListener('mousedown', () => input.active = true);
  window.addEventListener('mouseup', () => {
    input.active = false;
    checkCatch();
  });
  
  window.addEventListener('touchmove', e => {
    e.preventDefault();
    input.x = e.touches[0].clientX;
    input.y = e.touches[0].clientY;
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    input.x = e.touches[0].clientX;
    input.y = e.touches[0].clientY;
    input.active = true;
  });
  window.addEventListener('touchend', () => {
    input.active = false;
    checkCatch();
  });

  // --- Classes ---

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 8 + 2;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1.0;
      this.decay = Math.random() * 0.025 + 0.02;
      this.size = Math.random() * 4 + 1;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.92;
      this.vy *= 0.92;
      this.life -= this.decay;
    }

    draw(ctx) {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  class Creature {
    constructor() {
      this.reset(true);
    }

    reset(initial = false) {
      // Spawn logic
      if (initial) {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
      } else {
        this.x = Math.random() < 0.5 ? -100 : width + 100;
        this.y = Math.random() * (height - 100);
      }
      
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      
      // Species & Depth
      const speciesRoll = Math.random();
      
      // Depth factor: 0.5 (far) to 1.0 (near)
      this.depth = 0.6 + Math.random() * 0.4; 
      this.size = (20 + Math.random() * 14) * this.depth;

      if (speciesRoll < 0.33) {
        this.species = 'jelly';
        this.color = COLORS.cyan;
      } else if (speciesRoll < 0.66) {
        this.species = 'fin';
        this.color = COLORS.magenta;
      } else {
        this.species = 'shard';
        this.color = COLORS.lime;
      }

      this.angle = Math.atan2(this.vy, this.vx);
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = 0.03 + (Math.random() * 0.02);
      this.isCaught = false;
    }

    update() {
      if (this.isCaught) return;

      this.wobble += this.wobbleSpeed;

      // Movement physics
      this.x += this.vx * this.depth;
      this.y += this.vy * this.depth;

      // Organic drift
      this.y += Math.sin(this.wobble) * 0.3 * this.depth;
      this.x += Math.cos(this.wobble * 0.5) * 0.3 * this.depth;

      // Boundary bounce (keep away from edges)
      if (this.x < 80) this.vx += 0.05;
      if (this.x > width - 80) this.vx -= 0.05;
      if (this.y < 80) this.vy += 0.05;
      if (this.y > height - 80) this.vy -= 0.05;

      // Flee from Net (Input Position)
      const dx = this.x - input.x;
      const dy = this.y - input.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 220 * this.depth) {
        const force = (220 - dist) / 220;
        this.vx += (dx / dist) * force * 0.6;
        this.vy += (dy / dist) * force * 0.6;
      }

      // Speed limiter
      const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 3.5) {
        this.vx = (this.vx / speed) * 3.5;
        this.vy = (this.vy / speed) * 3.5;
      }

      this.angle = Math.atan2(this.vy, this.vx);
    }

    draw(ctx) {
      if (this.isCaught) return;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      
      // Depth of Field Blur
      if (this.depth < 0.85) {
        ctx.filter = `blur(${(1 - this.depth) * 8}px)`;
        ctx.globalAlpha = 0.5 + (this.depth * 0.5);
      }

      // Glow
      ctx.shadowBlur = 15 * this.depth;
      ctx.shadowColor = this.color;
      ctx.fillStyle = this.color;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1.5;

      const s = this.size;

      // Draw Species
      if (this.species === 'jelly') {
        ctx.beginPath();
        ctx.arc(0, -s*0.2, s, Math.PI, 0);
        ctx.lineTo(s, s*0.4);
        ctx.bezierCurveTo(s/2, s*0.8, -s/2, s*0.8, -s, s*0.4);
        ctx.fill();
        ctx.stroke();
      } 
      else if (this.species === 'fin') {
        ctx.beginPath();
        ctx.ellipse(0, 0, s*1.2, s*0.5, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-s, 0);
        ctx.lineTo(-s*1.8, -s*0.6);
        ctx.lineTo(-s*1.8, s*0.6);
        ctx.fill();
      } 
      else if (this.species === 'shard') {
        const wobble = Math.sin(this.wobble * 5) * 2;
        ctx.beginPath();
        ctx.moveTo(s, 0);
        ctx.lineTo(0, -s + wobble);
        ctx.lineTo(-s, 0);
        ctx.lineTo(0, s - wobble);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      ctx.restore();
    }
  }

  function init() {
    creatures = [];
    for(let i=0; i<CREATURE_COUNT; i++) {
      creatures.push(new Creature());
    }
    score = 0;
    scoreEl.innerText = score;
    
    // CRITIQUE FIX: Ensure one creature is close to the net for the first frame
    // We spawn one creature specifically near the default input position
    const targetCreature = creatures[Math.floor(Math.random() * creatures.length)];
    targetCreature.x = input.x + (Math.random() * 60 - 30);
    targetCreature.y = input.y + (Math.random() * 60 - 30);
    targetCreature.vx = 0;
    targetCreature.vy = 0;
    targetCreature.depth = 0.9; // Bring it closer
    targetCreature.size = 25;
  }

  function checkCatch() {
    // Catch radius based on net size
    const catchRadius = 90; 

    creatures.forEach(c => {
      if (c.isCaught) return;
      
      const dx = c.x - input.x;
      const dy = c.y - input.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < catchRadius) {
        catchCreature(c);
      }
    });
  }

  function catchCreature(creature) {
    creature.isCaught = true;
    score++;
    scoreEl.innerText = score;
    
    for(let i=0; i<40; i++) {
      particles.push(new Particle(creature.x, creature.y, creature.color));
    }

    toastEl.classList.add('active');
    setTimeout(() => toastEl.classList.remove('active'), 1200);

    setTimeout(() => {
      creature.reset();
    }, 2500);
  }

  function resetGame() {
    init();
  }

  function drawPlayerAndNet() {
    // --- 1. Draw The Handle (Connection) ---
    // Line from Player (Fixed) to Net (Input)
    ctx.save();
    
    // Calculate angle for handle thickness
    const angle = Math.atan2(input.y - (player.y - 20), input.x - player.x);
    const perpAngle = angle + Math.PI / 2;
    const handleWidth = 5;

    // Draw thick handle line
    ctx.beginPath();
    ctx.moveTo(player.x + Math.cos(perpAngle) * handleWidth, (player.y - 20) + Math.sin(perpAngle) * handleWidth);
    ctx.lineTo(input.x + Math.cos(perpAngle) * handleWidth, input.y + Math.sin(perpAngle) * handleWidth);
    ctx.lineTo(input.x - Math.cos(perpAngle) * handleWidth, input.y - Math.sin(perpAngle) * handleWidth);
    ctx.lineTo(player.x - Math.cos(perpAngle) * handleWidth, (player.y - 20) - Math.sin(perpAngle) * handleWidth);
    ctx.closePath();
    
    // Handle body gradient (Metallic look)
    const grad = ctx.createLinearGradient(player.x, player.y, input.x, input.y);
    grad.addColorStop(0, '#2a2a3e');
    grad.addColorStop(0.5, '#11111e');
    grad.addColorStop(1, '#0a0a14');
    ctx.fillStyle = grad;
    ctx.fill();
    
    // Handle edge highlight
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    // --- 2. Draw The Net (Targeting Input Position) ---
    ctx.save();
    ctx.translate(input.x, input.y);
    
    // Calculate angle to player for rotation (tilt)
    // We want the net to face the player slightly
    const netAngle = Math.atan2(player.y - input.y, player.x - input.x);
    ctx.rotate(netAngle);

    // Net Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = input.active ? '#fff' : COLORS.cyan;
    
    // Net Shape (Oval Mesh)
    ctx.strokeStyle = input.active ? 'rgba(255,255,255,0.9)' : COLORS.cyan;
    ctx.lineWidth = 3;
    ctx.beginPath();
    // Draw an ellipse: rx=65, ry=40
    ctx.ellipse(0, 0, 65, 40, 0, 0, Math.PI * 2);
    ctx.stroke();
    
    // Inner Mesh (Crosshatch) - Simulated 3D curvature
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    
    const rx = 65;
    const ry = 40;
    
    // Vertical-ish lines
    for(let i = -50; i <= 50; i+=12) {
        ctx.moveTo(i, -Math.sqrt(1 - (i/rx)**2)*ry);
        ctx.lineTo(i, Math.sqrt(1 - (i/rx)**2)*ry);
    }
    // Horizontal-ish lines
    for(let i = -30; i <= 30; i+=12) {
        ctx.moveTo(-Math.sqrt(1 - (i/ry)**2)*rx, i);
        ctx.lineTo(Math.sqrt(1 - (i/ry)**2)*rx, i);
    }
    ctx.stroke();

    // Active State (Snap effect)
    if (input.active) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, 0, 45, 28, 0, 0, Math.PI * 2);
      ctx.stroke();
      
      // Inner flash
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.fill();
    }
    ctx.restore();

    // --- 3. Draw The Player (Fixed Position) ---
    ctx.save();
    ctx.translate(player.x, player.y);
    
    // Player Glow
    ctx.shadowBlur = 25;
    ctx.shadowColor = COLORS.cyan;
    ctx.fillStyle = '#05080d'; // Darker than bg for silhouette
    ctx.strokeStyle = COLORS.cyan;
    ctx.lineWidth = 2.5;

    // Body (Compact Humanoid)
    ctx.beginPath();
    // Head
    ctx.arc(0, -50, 14, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();
    
    // Torso
    ctx.moveTo(-12, -36);
    ctx.lineTo(12, -36);
    ctx.lineTo(16, -15);
    ctx.lineTo(-16, -15);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Legs
    ctx.beginPath();
    ctx.moveTo(-12, -15);
    ctx.lineTo(-20, 25);
    ctx.lineTo(-10, 25);
    ctx.lineTo(0, 5);
    ctx.lineTo(10, 25);
    ctx.lineTo(20, 25);
    ctx.lineTo(12, -15);
    ctx.fill();
    ctx.stroke();

    // Arm (Reaching towards net)
    const angleToNet = Math.atan2(input.y - (player.y - 20), input.x - player.x);
    
    ctx.save();
    ctx.translate(0, -30); // Shoulder pivot
    ctx.rotate(angleToNet);
    
    // Draw Arm segment
    ctx.beginPath();
    ctx.rect(0, -5, 38, 10); 
    ctx.fill();
    ctx.stroke();
    
    // Draw Hand (simple oval)
    ctx.beginPath();
    ctx.ellipse(42, 0, 7, 5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();
    
    ctx.restore(); // Restore arm context

    ctx.restore(); // Restore player context
  }

  function loop() {
    frameCount++;
    ctx.clearRect(0, 0, width, height);

    // Sort creatures by depth for correct overlap
    creatures.sort((a, b) => a.depth - b.depth);

    // Update & Draw Creatures
    creatures.forEach(c => {
      c.update();
      c.draw(ctx);
    });

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Player & Net (Always on top)
    drawPlayerAndNet();

    requestAnimationFrame(loop);
  }

  // Start
  init();
  loop();

</script>
</body>
</html>
