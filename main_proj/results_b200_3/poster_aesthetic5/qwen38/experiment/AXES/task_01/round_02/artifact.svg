<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1125"/>
      <stop offset="0.25" stop-color="#1a1530"/>
      <stop offset="0.5" stop-color="#3a2013"/>
      <stop offset="0.72" stop-color="#8a3f1e"/>
      <stop offset="0.88" stop-color="#d07a34"/>
      <stop offset="1" stop-color="#f4c46a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6dd" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ffce7d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffce7d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4a34"/>
      <stop offset="1" stop-color="#432a20"/>
    </linearGradient>
    <linearGradient id="mMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c2519"/>
      <stop offset="1" stop-color="#20130d"/>
    </linearGradient>
    <linearGradient id="mNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241409"/>
      <stop offset="1" stop-color="#0b0603"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5a1a"/>
      <stop offset="0.5" stop-color="#ff9d2e"/>
      <stop offset="1" stop-color="#ffe489"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a30" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#ff5a1a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="baseHaze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a30" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ff5a1a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="smoke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#40322a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#40322a" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="soft2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glowF" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="txt" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="fireNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.04 0.06" numOctaves="3" seed="2" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="smokeNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.02 0.03" numOctaves="2" seed="5" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="emberGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="800" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="640" cy="470" r="330" fill="url(#sun)"/>
  <circle cx="640" cy="470" r="52" fill="#fff2cf" opacity="0.9" filter="url(#soft2)"/>

  <!-- Far ridge -->
  <path d="M0,470 L150,430 L300,455 L450,420 L600,448 L760,418 L920,452 L1080,426 L1280,458 L1280,800 L0,800 Z" fill="url(#mFar)" opacity="0.92"/>

  <!-- Mid ridge with trees -->
  <path d="M0,545 L160,505 L330,540 L500,498 L640,535 L820,495 L1000,538 L1160,505 L1280,540 L1280,800 L0,800 Z" fill="url(#mMid)"/>
  <g fill="#1c1109">
    <path d="M250,540 L260,512 L270,540 Z"/>
    <path d="M380,540 L390,510 L400,540 Z"/>
    <path d="M470,540 L480,514 L490,540 Z"/>
    <path d="M560,540 L570,508 L580,540 Z"/>
    <path d="M700,540 L710,512 L720,540 Z"/>
    <path d="M790,540 L800,508 L810,540 Z"/>
    <path d="M900,540 L910,514 L920,540 Z"/>
    <path d="M1050,540 L1060,510 L1070,540 Z"/>
    <path d="M1150,540 L1160,512 L1170,540 Z"/>
  </g>

  <!-- Warm base haze -->
  <ellipse cx="550" cy="555" rx="420" ry="120" fill="url(#baseHaze)" filter="url(#soft)"/>

  <!-- Fire glow on the ridge -->
  <ellipse cx="550" cy="525" rx="300" ry="95" fill="url(#fireGlow)" filter="url(#soft)"/>

  <!-- Fire mass with jagged burn line (shifted right) -->
  <g filter="url(#fireNoise)">
    <path d="M340,555 L355,505 L365,530 L375,475 L385,510 L395,450 L405,490 L415,420 L425,465 L435,400 L445,445 L455,390 L465,430 L475,370 L485,415 L495,390 L505,430 L515,400 L525,445 L535,420 L545,460 L555,440 L565,475 L575,455 L585,490 L595,470 L605,505 L615,485 L625,515 L635,500 L645,530 L655,515 L665,540 L675,525 L685,545 L695,535 L705,550 L715,540 L725,552 L735,545 L745,553 L755,548 L765,553 L775,549 L785,553 L795,550 L805,553 L815,551 L825,553 L835,552 L845,555 L845,555 C825,560 785,562 745,562 C705,562 665,560 625,558 C585,556 545,556 505,558 C465,560 425,560 385,558 C355,556 340,556 340,555 Z" fill="url(#fire)"/>
    <!-- Inner core -->
    <path d="M400,555 L410,525 L420,540 L430,500 L440,525 L450,480 L460,510 L470,460 L480,495 L490,450 L500,480 L510,440 L520,470 L530,450 L540,485 L550,465 L560,500 L570,480 L580,510 L590,495 L600,520 L610,505 L620,530 L630,515 L640,540 L650,525 L660,545 L670,535 L680,550 L690,540 L700,552 L710,545 L720,553 L730,548 L740,553 L750,550 L760,553 L770,551 L780,553 L790,552 L800,553 L810,552 L820,555 C790,558 750,560 710,560 C670,560 630,558 590,558 C550,558 510,558 470,558 C430,558 400,558 400,555 Z" fill="#ffe9a0" opacity="0.8"/>
  </g>

  <!-- Smoke plume angled aggressively to the left (shifted right) -->
  <g filter="url(#smokeNoise)">
    <path d="M520,470 C480,400 560,360 520,300 C480,240 580,210 540,150 C620,190 580,260 620,320 C660,380 580,420 610,470 C590,440 550,440 520,470 Z" fill="url(#smoke)" opacity="0.5"/>
    <path d="M580,455 C550,390 620,350 590,290 C570,230 640,200 620,140 C690,180 650,250 680,310 C710,370 640,410 660,455 C630,430 610,430 580,455 Z" fill="url(#smoke)" opacity="0.42"/>
    <path d="M480,470 C460,410 520,380 500,330 C480,280 540,250 530,200 C580,240 550,300 575,350 C600,405 530,440 550,470 C525,450 505,450 480,470 Z" fill="url(#smoke)" opacity="0.35"/>
    <!-- Lighter wavy smoke wisps -->
    <path d="M540,440 C510,380 580,340 550,280 C530,220 600,190 580,130 C640,170 610,240 640,300 C670,360 600,400 620,440 C590,420 570,420 540,440 Z" fill="#8a7060" opacity="0.18" filter="url(#soft)"/>
    <path d="M600,430 C570,370 640,330 610,270 C590,210 660,180 640,120 C700,160 670,230 700,290 C730,350 660,390 680,430 C650,410 630,410 600,430 Z" fill="#9a8070" opacity="0.15" filter="url(#soft)"/>
  </g>

  <!-- Near ridge with darker trees -->
  <path d="M0,640 L180,595 L360,635 L560,590 L640,620 L820,588 L1020,632 L1200,592 L1280,620 L1280,800 L0,800 Z" fill="url(#mNear)"/>
  <g fill="#080402">
    <path d="M120,635 L134,598 L148,635 Z"/>
    <path d="M200,638 L214,600 L228,638 Z"/>
    <path d="M300,632 L314,596 L328,632 Z"/>
    <path d="M380,636 L394,598 L408,636 Z"/>
    <path d="M470,634 L484,596 L498,634 Z"/>
    <path d="M560,628 L574,592 L588,628 Z"/>
    <path d="M720,630 L734,592 L748,630 Z"/>
    <path d="M820,632 L834,594 L848,632 Z"/>
    <path d="M920,636 L934,598 L948,636 Z"/>
    <path d="M1020,632 L1034,596 L1048,632 Z"/>
    <path d="M1120,636 L1134,598 L1148,636 Z"/>
    <path d="M1200,632 L1214,596 L1228,632 Z"/>
  </g>

  <!-- THE SPARK (reduced, ember-like) -->
  <circle cx="640" cy="360" r="18" fill="#fff2b0" opacity="0.6" filter="url(#soft2)"/>
  <circle cx="640" cy="360" r="8" fill="#fff7d6" filter="url(#glowF)"/>

  <!-- Thin jagged line connecting spark to fire origin -->
  <polyline points="640,368 625,390 635,410 620,435 630,455 615,475 625,495 610,510 620,525" fill="none" stroke="#ffd27a" stroke-width="1.5" opacity="0.7" filter="url(#emberGlow)"/>
  <!-- Trail of embers along the path -->
  <g fill="#ffd27a" filter="url(#emberGlow)">
    <circle cx="625" cy="390" r="2.4"/>
    <circle cx="635" cy="410" r="2.2"/>
    <circle cx="620" cy="435" r="2"/>
    <circle cx="630" cy="455" r="1.8"/>
    <circle cx="615" cy="475" r="1.6"/>
    <circle cx="625" cy="495" r="1.4"/>
    <circle cx="610" cy="510" r="1.2"/>
  </g>

  <!-- Rising embers from fire (shifted right) -->
  <g fill="#ffd27a" filter="url(#emberGlow)">
    <circle cx="520" cy="320" r="3.5"/>
    <circle cx="560" cy="290" r="3"/>
    <circle cx="540" cy="260" r="2.6"/>
    <circle cx="580" cy="240" r="2.4"/>
    <circle cx="550" cy="215" r="2.2"/>
    <circle cx="570" cy="190" r="2"/>
    <circle cx="535" cy="170" r="1.8"/>
    <circle cx="560" cy="150" r="1.8"/>
    <circle cx="545" cy="130" r="1.6"/>
    <circle cx="565" cy="115" r="1.4"/>
    <circle cx="550" cy="100" r="1.2"/>
    <!-- Additional embers from right side of fire -->
    <circle cx="760" cy="340" r="3"/>
    <circle cx="790" cy="310" r="2.6"/>
    <circle cx="770" cy="280" r="2.4"/>
    <circle cx="800" cy="255" r="2.2"/>
    <circle cx="780" cy="230" r="2"/>
    <circle cx="810" cy="205" r="1.8"/>
    <circle cx="790" cy="180" r="1.6"/>
    <circle cx="815" cy="155" r="1.4"/>
    <circle cx="800" cy="135" r="1.2"/>
    <circle cx="820" cy="115" r="1"/>
  </g>

  <!-- Top text - bold, heavy weight, "SPARK" aligned above the spark element -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" filter="url(#txt)">
    <!-- "ONE" left of SPARK -->
    <text x="380" y="108" font-size="38" font-weight="900" letter-spacing="10" fill="#f2c98a">ONE</text>
    <!-- "SPARK" centered at x=640, directly above the spark at (640,360) -->
    <text x="640" y="108" font-size="38" font-weight="900" letter-spacing="10" fill="#f2c98a">SPARK</text>
    <!-- "IS ENOUGH" right of SPARK -->
    <text x="900" y="108" font-size="38" font-weight="900" letter-spacing="10" fill="#f2c98a">IS ENOUGH</text>
  </g>

  <!-- Bottom text -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" filter="url(#txt)">
    <text x="640" y="718" font-size="27" font-weight="600" letter-spacing="1" fill="#f4e4c4">Check conditions.  Extinguish completely.  Protect the wild.</text>
    <text x="640" y="758" font-size="18" font-weight="700" letter-spacing="7" fill="#e0904a">NATIONAL FOREST SAFETY INITIATIVE</text>
  </g>
</svg>