<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0611"/>
      <stop offset="0.5" stop-color="#120a1e"/>
      <stop offset="1" stop-color="#050308"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#1a3a9e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0b0611" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2f4f" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#a5122c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#050308" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlowSmall" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2f4f" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#a5122c" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#050308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d67"/>
      <stop offset="1" stop-color="#ff1e3c"/>
    </linearGradient>
    <linearGradient id="blueText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb6ff"/>
      <stop offset="1" stop-color="#4a7dff"/>
    </linearGradient>
    <linearGradient id="wireBlueRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a7dff"/>
      <stop offset="0.5" stop-color="#8050a0"/>
      <stop offset="1" stop-color="#ff2f4f"/>
    </linearGradient>
    <linearGradient id="wireRedBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2f4f"/>
      <stop offset="0.5" stop-color="#a04060"/>
      <stop offset="1" stop-color="#4a7dff"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <filter id="roughen" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="waveGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glitch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.08 0.02" numOctaves="2" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wireGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="waveClip">
      <rect x="0" y="0" width="1280" height="800"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Atmospheric glows -->
  <ellipse cx="360" cy="250" rx="380" ry="300" fill="url(#blueGlow)" filter="url(#soft)"/>
  <ellipse cx="580" cy="320" rx="280" ry="220" fill="url(#redGlowSmall)" filter="url(#soft)"/>
  <ellipse cx="200" cy="650" rx="220" ry="180" fill="url(#blueGlow)" opacity="0.25" filter="url(#soft)"/>
  <ellipse cx="1020" cy="580" rx="260" ry="200" fill="url(#redGlowSmall)" opacity="0.35" filter="url(#soft)"/>
  <ellipse cx="850" cy="550" rx="200" ry="160" fill="url(#blueGlow)" opacity="0.2" filter="url(#soft)"/>

  <!-- Rhythm grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="60" y1="120" x2="1220" y2="120"/>
    <line x1="60" y1="220" x2="1220" y2="220"/>
    <line x1="60" y1="320" x2="1220" y2="320"/>
    <line x1="60" y1="420" x2="1220" y2="420"/>
    <line x1="60" y1="520" x2="1220" y2="520"/>
    <line x1="60" y1="620" x2="1220" y2="620"/>
    <line x1="60" y1="720" x2="1220" y2="720"/>
  </g>

  <!-- Blue waveform - EXTENDED ACROSS FULL WIDTH with INCREASED AMPLITUDE -->
  <g filter="url(#waveGlow)">
    <path d="M 60 300
             L 80 300 L 90 260 L 100 340 L 110 270 L 120 330
             L 140 300 L 150 230 L 160 370 L 170 245 L 180 355
             L 200 300 L 210 190 L 220 410 L 230 215 L 240 385
             L 260 300 L 270 150 L 280 450 L 290 180 L 300 420
             L 320 300 L 330 120 L 340 480 L 350 150 L 360 450
             L 380 300 L 390 90 L 400 510 L 410 120 L 420 480
             L 440 300 L 450 60 L 460 540 L 470 90 L 480 510
             L 500 300 L 510 30 L 520 570 L 530 60 L 540 540
             L 560 300 L 570 10 L 580 590 L 590 40 L 600 560
             L 620 300 L 630 0 L 640 600 L 650 30 L 660 570
             L 680 300 L 690 20 L 700 580 L 710 50 L 720 550
             L 740 300 L 750 50 L 760 550 L 770 80 L 780 520
             L 800 300 L 810 90 L 820 510 L 830 120 L 840 480
             L 860 300 L 870 150 L 880 450 L 890 180 L 900 420
             L 920 300 L 930 210 L 940 390 L 950 240 L 960 360
             L 980 300 L 990 250 L 1000 350 L 1010 270 L 1020 330
             L 1040 300 L 1050 260 L 1060 340 L 1070 275 L 1080 325
             L 1100 300 L 1110 270 L 1120 330 L 1130 285 L 1140 315
             L 1160 300 L 1170 280 L 1180 320 L 1190 290 L 1200 300 L 1220 300"
          fill="none" stroke="#4a7dff" stroke-width="2.4" stroke-linejoin="round" filter="url(#roughen)"/>
  </g>

  <!-- Red waveform - EXTENDED ACROSS FULL WIDTH with INCREASED AMPLITUDE -->
  <g filter="url(#waveGlow)" opacity="0.9">
    <path d="M 60 330
             L 80 330 L 90 290 L 100 370 L 110 305 L 120 360
             L 140 330 L 150 260 L 160 400 L 170 275 L 180 390
             L 200 330 L 210 220 L 220 440 L 230 245 L 240 415
             L 260 330 L 270 180 L 280 480 L 290 210 L 300 450
             L 320 330 L 330 150 L 340 510 L 350 180 L 360 480
             L 380 330 L 390 120 L 400 540 L 410 150 L 420 510
             L 440 330 L 450 90 L 460 570 L 470 120 L 480 540
             L 500 330 L 510 60 L 520 600 L 530 90 L 540 570
             L 560 330 L 570 40 L 580 620 L 590 70 L 600 590
             L 620 330 L 630 30 L 640 630 L 650 60 L 660 600
             L 680 330 L 690 50 L 700 610 L 710 80 L 720 580
             L 740 330 L 750 80 L 760 580 L 770 110 L 780 550
             L 800 330 L 810 120 L 820 540 L 830 150 L 840 510
             L 860 330 L 870 180 L 880 480 L 890 210 L 900 450
             L 920 330 L 930 240 L 940 420 L 950 270 L 960 390
             L 980 330 L 990 280 L 1000 380 L 1010 295 L 1020 355
             L 1040 330 L 1050 290 L 1060 370 L 1070 305 L 1080 355
             L 1100 330 L 1110 300 L 1120 360 L 1130 315 L 1140 345
             L 1160 330 L 1170 310 L 1180 350 L 1190 320 L 1200 330 L 1220 330"
          fill="none" stroke="#ff2f4f" stroke-width="2.4" stroke-linejoin="round" filter="url(#roughen)"/>
  </g>

  <!-- Glitch/tear in waveform - jagged syncopated interruption lines -->
  <g filter="url(#glow)">
    <polyline points="560,250 575,120 590,480 605,100 620,500 635,140 650,460 665,110 680,440"
              fill="none" stroke="#ff1e3c" stroke-width="3.5" stroke-linejoin="miter" opacity="0.85"/>
    <polyline points="720,310 740,180 760,480 780,150 800,500 820,200 840,460 860,170 880,420"
              fill="none" stroke="#ff1e3c" stroke-width="3.5" stroke-linejoin="miter" opacity="0.75"/>
    <polyline points="480,290 495,150 510,450 525,130 540,470 555,180 570,420 585,150 600,330"
              fill="none" stroke="#ff1e3c" stroke-width="3" stroke-linejoin="miter" opacity="0.7"/>
  </g>

  <!-- Syncopation accent bars -->
  <g stroke="#ff2f4f" stroke-width="3" opacity="0.8">
    <line x1="580" y1="100" x2="580" y2="520"/>
    <line x1="660" y1="110" x2="660" y2="510"/>
    <line x1="740" y1="120" x2="740" y2="500"/>
  </g>
  <g stroke="#4a7dff" stroke-width="3" opacity="0.8">
    <line x1="520" y1="110" x2="520" y2="510"/>
    <line x1="700" y1="100" x2="700" y2="520"/>
    <line x1="800" y1="130" x2="800" y2="490"/>
  </g>

  <!-- Localized color blooms behind waveform peaks -->
  <ellipse cx="580" cy="310" rx="70" ry="100" fill="url(#redGlowSmall)" opacity="0.35" filter="url(#soft)"/>
  <ellipse cx="660" cy="320" rx="80" ry="110" fill="url(#redGlowSmall)" opacity="0.4" filter="url(#soft)"/>
  <ellipse cx="740" cy="310" rx="65" ry="95" fill="url(#redGlowSmall)" opacity="0.3" filter="url(#soft)"/>
  <ellipse cx="520" cy="300" rx="60" ry="90" fill="url(#blueGlow)" opacity="0.3" filter="url(#soft)"/>
  <ellipse cx="700" cy="320" rx="70" ry="100" fill="url(#blueGlow)" opacity="0.35" filter="url(#soft)"/>
  <ellipse cx="800" cy="310" rx="55" ry="85" fill="url(#blueGlow)" opacity="0.25" filter="url(#soft)"/>

  <!-- ===== WAVEFORM CASCADING INTO GEOMETRIC CLUSTER (VISUAL BRIDGE) ===== -->
  <!-- Blue cascade line from waveform to geometric cluster -->
  <g filter="url(#wireGlow)" opacity="0.75">
    <path d="M 960 315 L 980 350 L 1000 400 L 1020 460 L 1040 520 L 1050 570 L 1060 620"
          fill="none" stroke="url(#wireBlueRed)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 1020 330 L 1035 380 L 1050 440 L 1070 500 L 1085 560 L 1100 620"
          fill="none" stroke="url(#wireBlueRed)" stroke-width="1.8" stroke-linejoin="round" opacity="0.6"/>
  </g>
  <!-- Red cascade line from waveform to geometric cluster -->
  <g filter="url(#wireGlow)" opacity="0.75">
    <path d="M 980 345 L 1005 390 L 1030 450 L 1055 510 L 1075 570 L 1090 630"
          fill="none" stroke="url(#wireRedBlue)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 1040 355 L 1060 410 L 1080 470 L 1100 530 L 1115 590 L 1125 640"
          fill="none" stroke="url(#wireRedBlue)" stroke-width="1.8" stroke-linejoin="round" opacity="0.6"/>
  </g>
  <!-- Additional jagged cascade fragments -->
  <g filter="url(#wireGlow)" opacity="0.55">
    <polyline points="1000,380 1015,420 1030,460 1045,500 1060,540 1075,580"
              fill="none" stroke="#ff2f4f" stroke-width="1.5" stroke-linejoin="miter"/>
    <polyline points="1050,390 1065,430 1080,470 1095,510 1110,550 1120,590"
              fill="none" stroke="#4a7dff" stroke-width="1.5" stroke-linejoin="miter"/>
  </g>

  <!-- ===== GEOMETRIC WIREFRAME CLUSTER - SCALED UP 150% AND SHIFTED UP/LEFT ===== -->
  <!-- Original center was ~990,540. New center ~960,480. Scale factor 1.5x -->
  <g filter="url(#wireGlow)" opacity="0.65">
    <!-- Angular fragments suggesting a broken instrument or sound burst - 150% scale, shifted up-left -->
    <!-- Original: 920,520 960,480 980,530 950,560 -->
    <polygon points="855,440 915,380 945,455 892,505" fill="none" stroke="url(#wireRedBlue)" stroke-width="3" stroke-linejoin="miter"/>
    <!-- Original: 980,530 1020,490 1050,550 1010,580 -->
    <polygon points="945,455 1005,395 1050,485 990,535" fill="none" stroke="url(#wireBlueRed)" stroke-width="2.5" stroke-linejoin="miter" opacity="0.8"/>
    <!-- Original: 1050,550 1090,510 1110,570 1070,600 -->
    <polygon points="1050,485 1110,425 1140,515 1080,565" fill="none" stroke="url(#wireRedBlue)" stroke-width="2.2" stroke-linejoin="miter" opacity="0.6"/>
    <!-- Blue fragments for balance -->
    <!-- Original: 940,580 980,550 1000,600 960,630 -->
    <polygon points="880,545 940,505 970,580 910,620" fill="none" stroke="url(#wireBlueRed)" stroke-width="2.5" stroke-linejoin="miter" opacity="0.7"/>
    <!-- Original: 1000,600 1040,570 1060,620 1020,650 -->
    <polygon points="970,580 1030,540 1060,615 1000,655" fill="none" stroke="url(#wireBlueRed)" stroke-width="2.2" stroke-linejoin="miter" opacity="0.5"/>
    <!-- Additional geometric wireframe elements for complexity -->
    <polygon points="910,420 960,380 990,440 940,480" fill="none" stroke="url(#wireBlueRed)" stroke-width="2" stroke-linejoin="miter" opacity="0.55"/>
    <polygon points="1060,450 1100,410 1130,470 1090,510" fill="none" stroke="url(#wireRedBlue)" stroke-width="2" stroke-linejoin="miter" opacity="0.5"/>
    <!-- Connecting wireframe lines -->
    <line x1="892" y1="505" x2="990" y2="535" stroke="url(#wireBlueRed)" stroke-width="1.5" opacity="0.4"/>
    <line x1="990" y1="535" x2="1080" y2="565" stroke="url(#wireRedBlue)" stroke-width="1.5" opacity="0.35"/>
    <line x1="940" y1="480" x2="1000" y2="655" stroke="url(#wireBlueRed)" stroke-width="1.5" opacity="0.3"/>
    <line x1="945" y1="455" x2="970" y2="580" stroke="url(#wireRedBlue)" stroke-width="1.5" opacity="0.4"/>
    <!-- Radiating lines from burst center - adjusted for new position -->
    <line x1="960" y1="480" x2="1120" y2="420" stroke="#ff2f4f" stroke-width="1.5" opacity="0.35"/>
    <line x1="960" y1="480" x2="1130" y2="490" stroke="#ff4d67" stroke-width="1.5" opacity="0.3"/>
    <line x1="960" y1="480" x2="1120" y2="560" stroke="#ff2f4f" stroke-width="1.5" opacity="0.25"/>
    <line x1="960" y1="480" x2="1070" y2="620" stroke="#4a7dff" stroke-width="1.5" opacity="0.3"/>
    <line x1="960" y1="480" x2="1020" y2="660" stroke="#8fb6ff" stroke-width="1.5" opacity="0.25"/>
    <line x1="960" y1="480" x2="850" y2="400" stroke="#4a7dff" stroke-width="1.5" opacity="0.2"/>
    <line x1="960" y1="480" x2="870" y2="560" stroke="#8fb6ff" stroke-width="1.5" opacity="0.2"/>
  </g>

  <!-- Grain overlay -->
  <rect width="1280" height="800" filter="url(#grain)" opacity="0.06"/>

  <!-- Top label -->
  <text x="64" y="70" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="8" fill="#8fb6ff" font-weight="700">EXPERIMENTAL JAZZ</text>
  <text x="1216" y="70" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="8" fill="#ff4d67" font-weight="700">LATE-NIGHT SERIES</text>

  <!-- Main title - BLUE HOUR with syncopated tracking -->
  <text x="60" y="210" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" letter-spacing="4" fill="url(#blueText)" filter="url(#glow)">BLUE HOUR</text>

  <!-- Main title - RED NOISE with typographic syncopation -->
  <!-- Each letter gets slightly different y-position and tracking to mimic off-beat rhythm -->
  <text x="60" y="350" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glow)">R</text>
  <text x="148" y="336" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glow)">E</text>
  <text x="236" y="360" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glow)">D</text>
  <!-- Space -->
  <text x="330" y="342" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glow)"> </text>
  <!-- N, O, I, S, E - clean text, NO glitch filter (waveform emerges from E) -->
  <text x="400" y="365" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glow)">N</text>
  <text x="495" y="332" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glow)">O</text>
  <text x="590" y="358" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glow)">I</text>
  <text x="635" y="338" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glow)">S</text>
  <text x="710" y="362" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glow)">E</text>

  <!-- ===== WAVEFORM EMERGING FROM FINAL 'E' OF NOISE ===== -->
  <!-- The E ends around x=780, y~362. Waveform lines project outward from there -->
  <g filter="url(#waveGlow)">
    <!-- Blue projection from E -->
    <path d="M 780 355 L 800 320 L 820 380 L 840 300 L 860 400 L 880 280 L 900 420 L 920 260 L 940 440 L 960 240 L 980 460 L 1000 220 L 1020 480 L 1040 200 L 1060 500 L 1080 180 L 1100 520 L 1120 160 L 1140 540 L 1160 140 L 1180 560 L 1200 120 L 1220 580"
          fill="none" stroke="#4a7dff" stroke-width="2.2" stroke-linejoin="round" filter="url(#roughen)" opacity="0.9"/>
    <!-- Red projection from E -->
    <path d="M 780 370 L 800 340 L 820 400 L 840 320 L 860 420 L 880 300 L 900 440 L 920 280 L 940 460 L 960 260 L 980 480 L 1000 240 L 1020 500 L 1040 220 L 1060 520 L 1080 200 L 1100 540 L 1120 180 L 1140 560 L 1160 160 L 1180 580 L 1200 140 L 1220 600"
          fill="none" stroke="#ff2f4f" stroke-width="2.2" stroke-linejoin="round" filter="url(#roughen)" opacity="0.85"/>
    <!-- Additional jagged projection lines for energy -->
    <polyline points="780,360 810,280 840,440 870,250 900,470 930,220 960,500 990,190 1020,530 1050,160 1080,560 1110,130 1140,590 1170,100 1200,620"
              fill="none" stroke="#ff1e3c" stroke-width="1.8" stroke-linejoin="miter" opacity="0.6"/>
    <polyline points="780,365 815,310 850,410 885,290 920,430 955,270 990,450 1025,250 1060,470 1095,230 1130,490 1165,210 1200,510"
              fill="none" stroke="#4a7dff" stroke-width="1.8" stroke-linejoin="miter" opacity="0.55"/>
  </g>

  <!-- Subtitle -->
  <text x="64" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#e9e2f2">A night of improvised sound</text>

  <!-- Divider - staggered -->
  <line x1="64" y1="430" x2="280" y2="430" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="300" y1="430" x2="340" y2="430" stroke="#ff2f4f" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Info block - staggered for musical rhythm -->
  <text x="64" y="478" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#f2ecfa" letter-spacing="1">Friday, September 27  &#183;  Doors 7 PM</text>
  <text x="100" y="518" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c9bfe0">The Foundry  &#183;  East River District</text>

  <!-- Featuring - staggered -->
  <text x="64" y="572" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="6" fill="#ff4d67" font-weight="700">FEATURING</text>
  <text x="64" y="616" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Nia Cole Quartet</text>
  <text x="120" y="656" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#b7c6ff">Static Bloom</text>
  <text x="80" y="696" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#b7c6ff">Armand Vale</text>

  <!-- Bottom accent bar -->
  <rect x="64" y="744" width="1152" height="4" fill="url(#redText)"/>
  <rect x="64" y="744" width="576" height="4" fill="url(#blueText)"/>
</svg>