<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0611"/>
      <stop offset="0.5" stop-color="#120a1e"/>
      <stop offset="1" stop-color="#050308"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#1a3a9e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0b0611" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2f4f" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#a5122c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#050308" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlowSmall" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2f4f" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#a5122c" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#050308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d67"/>
      <stop offset="1" stop-color="#ff1e3c"/>
    </linearGradient>
    <linearGradient id="blueText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb6ff"/>
      <stop offset="1" stop-color="#4a7dff"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <filter id="roughen" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="waveGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glitch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.08 0.02" numOctaves="2" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="waveClip">
      <rect x="0" y="0" width="1280" height="800"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Atmospheric glows -->
  <ellipse cx="360" cy="250" rx="380" ry="300" fill="url(#blueGlow)" filter="url(#soft)"/>
  <ellipse cx="580" cy="320" rx="280" ry="220" fill="url(#redGlowSmall)" filter="url(#soft)"/>
  <!-- Stage light behind performer list bottom left -->
  <ellipse cx="200" cy="650" rx="220" ry="180" fill="url(#blueGlow)" opacity="0.25" filter="url(#soft)"/>
  <!-- Subtle red accent lower right -->
  <ellipse cx="950" cy="650" rx="200" ry="160" fill="url(#redGlowSmall)" opacity="0.4" filter="url(#soft)"/>

  <!-- Rhythm grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="60" y1="120" x2="1220" y2="120"/>
    <line x1="60" y1="220" x2="1220" y2="220"/>
    <line x1="60" y1="320" x2="1220" y2="320"/>
    <line x1="60" y1="420" x2="1220" y2="420"/>
    <line x1="60" y1="520" x2="1220" y2="520"/>
    <line x1="60" y1="620" x2="1220" y2="620"/>
    <line x1="60" y1="720" x2="1220" y2="720"/>
  </g>

  <!-- Blue waveform - modulated amplitude: low start, violent spike in center, taper off -->
  <g filter="url(#waveGlow)">
    <path d="M 60 300
             L 80 300 L 90 280 L 100 320 L 110 295 L 120 305
             L 140 300 L 150 285 L 160 315 L 170 290 L 180 310
             L 200 300 L 210 270 L 220 330 L 230 285 L 240 315
             L 260 300 L 270 260 L 280 340 L 290 275 L 300 325
             L 320 300 L 330 250 L 340 350 L 350 265 L 360 335
             L 380 300 L 390 240 L 400 360 L 410 255 L 420 345
             L 440 300 L 450 220 L 460 380 L 470 240 L 480 360
             L 500 300 L 510 200 L 520 400 L 530 220 L 540 380
             L 560 300 L 570 180 L 580 420 L 590 200 L 600 400
             L 620 300 L 630 160 L 640 440 L 650 180 L 660 420
             L 680 300 L 690 170 L 700 430 L 710 190 L 720 410
             L 740 300 L 750 200 L 760 400 L 770 220 L 780 380
             L 800 300 L 810 230 L 820 370 L 830 250 L 840 350
             L 860 300 L 870 250 L 880 350 L 890 265 L 900 335
             L 920 300 L 930 270 L 940 330 L 950 285 L 960 315
             L 980 300 L 990 280 L 1000 320 L 1010 290 L 1020 310
             L 1040 300 L 1050 285 L 1060 315 L 1070 295 L 1080 305
             L 1100 300 L 1110 290 L 1120 310 L 1130 295 L 1140 305
             L 1160 300 L 1170 295 L 1180 305 L 1190 300 L 1200 300 L 1220 300"
          fill="none" stroke="#4a7dff" stroke-width="2.4" stroke-linejoin="round" filter="url(#roughen)"/>
  </g>

  <!-- Red waveform - modulated amplitude: low start, violent spike in center, taper off -->
  <g filter="url(#waveGlow)" opacity="0.9">
    <path d="M 60 330
             L 80 330 L 90 310 L 100 350 L 110 325 L 120 335
             L 140 330 L 150 315 L 160 345 L 170 320 L 180 340
             L 200 330 L 210 300 L 220 360 L 230 315 L 240 345
             L 260 330 L 270 290 L 280 370 L 290 305 L 300 355
             L 320 330 L 330 280 L 340 380 L 350 295 L 360 365
             L 380 330 L 390 270 L 400 390 L 410 285 L 420 375
             L 440 330 L 450 250 L 460 410 L 470 270 L 480 390
             L 500 330 L 510 230 L 520 430 L 530 250 L 540 410
             L 560 330 L 570 210 L 580 450 L 590 230 L 600 430
             L 620 330 L 630 190 L 640 470 L 650 210 L 660 450
             L 680 330 L 690 200 L 700 460 L 710 220 L 720 440
             L 740 330 L 750 230 L 760 430 L 770 250 L 780 410
             L 800 330 L 810 260 L 820 400 L 830 280 L 840 380
             L 860 330 L 870 280 L 880 380 L 890 295 L 900 365
             L 920 330 L 930 300 L 940 360 L 950 315 L 960 345
             L 980 330 L 990 310 L 1000 350 L 1010 320 L 1020 340
             L 1040 330 L 1050 315 L 1060 345 L 1070 325 L 1080 335
             L 1100 330 L 1110 320 L 1120 340 L 1130 325 L 1140 335
             L 1160 330 L 1170 325 L 1180 335 L 1190 330 L 1200 330 L 1220 330"
          fill="none" stroke="#ff2f4f" stroke-width="2.4" stroke-linejoin="round" filter="url(#roughen)"/>
  </g>

  <!-- Glitch/tear in waveform - jagged syncopated interruption lines - positioned at spike center -->
  <g filter="url(#glow)">
    <!-- Jagged tear segment 1 - near the spike center -->
    <polyline points="560,280 575,180 590,420 605,160 620,440 635,200 650,400 665,170 680,380"
              fill="none" stroke="#ff1e3c" stroke-width="3.5" stroke-linejoin="miter" opacity="0.85"/>
    <!-- Jagged tear segment 2 - lower right of spike -->
    <polyline points="720,310 740,220 760,430 780,190 800,450 820,240 840,400 860,210 880,350"
              fill="none" stroke="#ff1e3c" stroke-width="3.5" stroke-linejoin="miter" opacity="0.75"/>
    <!-- Jagged tear segment 3 - mid area left of spike -->
    <polyline points="480,290 495,200 510,400 525,180 540,420 555,230 570,370 585,200 600,330"
              fill="none" stroke="#ff1e3c" stroke-width="3" stroke-linejoin="miter" opacity="0.7"/>
  </g>

  <!-- Syncopation accent bars - sharp vertical interruptions at spike locations -->
  <g stroke="#ff2f4f" stroke-width="3" opacity="0.8">
    <line x1="580" y1="160" x2="580" y2="460"/>
    <line x1="660" y1="170" x2="660" y2="450"/>
    <line x1="740" y1="180" x2="740" y2="440"/>
  </g>
  <g stroke="#4a7dff" stroke-width="3" opacity="0.8">
    <line x1="520" y1="170" x2="520" y2="450"/>
    <line x1="700" y1="160" x2="700" y2="460"/>
    <line x1="800" y1="190" x2="800" y2="430"/>
  </g>

  <!-- Localized color blooms behind waveform peaks at spike center -->
  <ellipse cx="580" cy="310" rx="70" ry="90" fill="url(#redGlowSmall)" opacity="0.35" filter="url(#soft)"/>
  <ellipse cx="660" cy="320" rx="80" ry="100" fill="url(#redGlowSmall)" opacity="0.4" filter="url(#soft)"/>
  <ellipse cx="740" cy="310" rx="65" ry="85" fill="url(#redGlowSmall)" opacity="0.3" filter="url(#soft)"/>
  <ellipse cx="520" cy="300" rx="60" ry="80" fill="url(#blueGlow)" opacity="0.3" filter="url(#soft)"/>
  <ellipse cx="700" cy="320" rx="70" ry="90" fill="url(#blueGlow)" opacity="0.35" filter="url(#soft)"/>
  <ellipse cx="800" cy="310" rx="55" ry="75" fill="url(#blueGlow)" opacity="0.25" filter="url(#soft)"/>

  <!-- Fragmented abstract burst element - lower right quadrant counter-weight -->
  <g filter="url(#glow)" opacity="0.7">
    <!-- Angular fragments suggesting a broken instrument or sound burst -->
    <polygon points="920,520 960,480 980,530 950,560" fill="none" stroke="#ff2f4f" stroke-width="2.5" stroke-linejoin="miter"/>
    <polygon points="980,530 1020,490 1050,550 1010,580" fill="none" stroke="#ff4d67" stroke-width="2" stroke-linejoin="miter" opacity="0.8"/>
    <polygon points="1050,550 1090,510 1110,570 1070,600" fill="none" stroke="#ff2f4f" stroke-width="1.8" stroke-linejoin="miter" opacity="0.6"/>
    <!-- Blue fragments for balance -->
    <polygon points="940,580 980,550 1000,600 960,630" fill="none" stroke="#4a7dff" stroke-width="2" stroke-linejoin="miter" opacity="0.7"/>
    <polygon points="1000,600 1040,570 1060,620 1020,650" fill="none" stroke="#8fb6ff" stroke-width="1.8" stroke-linejoin="miter" opacity="0.5"/>
    <!-- Radiating lines from burst center -->
    <line x1="990" y1="540" x2="1150" y2="480" stroke="#ff2f4f" stroke-width="1.5" opacity="0.4"/>
    <line x1="990" y1="540" x2="1160" y2="550" stroke="#ff4d67" stroke-width="1.5" opacity="0.35"/>
    <line x1="990" y1="540" x2="1150" y2="620" stroke="#ff2f4f" stroke-width="1.5" opacity="0.3"/>
    <line x1="990" y1="540" x2="1100" y2="680" stroke="#4a7dff" stroke-width="1.5" opacity="0.35"/>
    <line x1="990" y1="540" x2="1050" y2="720" stroke="#8fb6ff" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Grain overlay -->
  <rect width="1280" height="800" filter="url(#grain)" opacity="0.06"/>

  <!-- Top label -->
  <text x="64" y="70" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="8" fill="#8fb6ff" font-weight="700">EXPERIMENTAL JAZZ</text>
  <text x="1216" y="70" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="8" fill="#ff4d67" font-weight="700">LATE-NIGHT SERIES</text>

  <!-- Main title - BLUE HOUR -->
  <text x="60" y="210" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" letter-spacing="2" fill="url(#blueText)" filter="url(#glow)">BLUE HOUR</text>

  <!-- Main title - RED NOISE with syncopated vertical offsets and glitch effect at waveform intersection -->
  <!-- Each letter gets a slightly different y-position to mimic jagged waveform -->
  <!-- Letters near the waveform spike get glitch filter applied -->
  <text x="60" y="350" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glow)">R</text>
  <text x="145" y="338" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glow)">E</text>
  <text x="230" y="358" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glow)">D</text>
  <text x="320" y="342" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glow)"> </text>
  <!-- N, O, I, S, E - these intersect the waveform spike, apply glitch -->
  <text x="390" y="362" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glitch)">N</text>
  <text x="480" y="335" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glitch)">O</text>
  <text x="570" y="355" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glitch)">I</text>
  <text x="610" y="340" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glitch)">S</text>
  <text x="680" y="358" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)" filter="url(#glitch)">E</text>

  <!-- Subtitle -->
  <text x="64" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#e9e2f2">A night of improvised sound</text>

  <!-- Divider - staggered -->
  <line x1="64" y1="430" x2="280" y2="430" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="300" y1="430" x2="340" y2="430" stroke="#ff2f4f" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Info block - staggered for musical rhythm -->
  <text x="64" y="478" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#f2ecfa" letter-spacing="1">Friday, September 27  &#183;  Doors 7 PM</text>
  <text x="100" y="518" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c9bfe0">The Foundry  &#183;  East River District</text>

  <!-- Featuring - staggered -->
  <text x="64" y="572" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="6" fill="#ff4d67" font-weight="700">FEATURING</text>
  <text x="64" y="616" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Nia Cole Quartet</text>
  <text x="120" y="656" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#b7c6ff">Static Bloom</text>
  <text x="80" y="696" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#b7c6ff">Armand Vale</text>

  <!-- Bottom accent bar -->
  <rect x="64" y="744" width="1152" height="4" fill="url(#redText)"/>
  <rect x="64" y="744" width="576" height="4" fill="url(#blueText)"/>
</svg>