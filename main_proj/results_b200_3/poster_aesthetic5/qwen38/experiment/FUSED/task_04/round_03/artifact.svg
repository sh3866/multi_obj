<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0611"/>
      <stop offset="0.5" stop-color="#120a1e"/>
      <stop offset="1" stop-color="#050308"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#1a3a9e" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0b0611" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2f4f" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#a5122c" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#050308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d67"/>
      <stop offset="1" stop-color="#ff1e3c"/>
    </linearGradient>
    <linearGradient id="blueText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb6ff"/>
      <stop offset="1" stop-color="#4a7dff"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="linear" slope="0.18" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.012" numOctaves="2" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="blurHeavy" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="blurMed" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="distress" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="riso" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.15" numOctaves="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="risoHeavy" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="orbDistort" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="25" xChannelSelector="R" yChannelSelector="G"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0" result="mg"/>
      <feComponentTransfer in="mg">
        <feFuncA type="linear" slope="0.5" intercept="0"/>
      </feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="waveDistort" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="15" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="printTexture" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="linear" slope="0.08" intercept="0"/>
      </feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Grain texture overlay -->
  <rect width="1280" height="800" filter="url(#grain)" opacity="0.22"/>

  <!-- Atmospheric glow - reduced -->
  <ellipse cx="360" cy="250" rx="380" ry="300" fill="url(#blueGlow)" filter="url(#soft)"/>
  <ellipse cx="960" cy="560" rx="400" ry="320" fill="url(#redGlow)" filter="url(#soft)"/>

  <!-- Scattered abstract fragments - breaking the grid -->
  <g opacity="0.75">
    <!-- Blue fragments -->
    <rect x="820" y="180" width="120" height="8" fill="#4a7dff" transform="rotate(-12 880 184)" filter="url(#blurMed)" opacity="0.6"/>
    <rect x="200" y="520" width="80" height="14" fill="#4a7dff" transform="rotate(25 240 527)" filter="url(#blurMed)" opacity="0.5"/>
    <rect x="1050" y="320" width="150" height="6" fill="#4a7dff" transform="rotate(-8 1125 323)" filter="url(#blurMed)" opacity="0.55"/>
    <rect x="450" y="650" width="100" height="10" fill="#4a7dff" transform="rotate(15 500 655)" filter="url(#blurMed)" opacity="0.45"/>
    
    <!-- Red fragments -->
    <rect x="750" y="450" width="140" height="10" fill="#ff2f4f" transform="rotate(-20 820 455)" filter="url(#blurMed)" opacity="0.6"/>
    <rect x="350" y="150" width="90" height="12" fill="#ff2f4f" transform="rotate(30 395 156)" filter="url(#blurMed)" opacity="0.5"/>
    <rect x="1100" y="600" width="110" height="8" fill="#ff2f4f" transform="rotate(-15 1155 604)" filter="url(#blurMed)" opacity="0.55"/>
    <rect x="600" y="580" width="130" height="12" fill="#ff2f4f" transform="rotate(10 665 586)" filter="url(#blurMed)" opacity="0.5"/>
  </g>

  <!-- Distorted hand-drawn motion trail - blue (chaotic waveform) -->
  <g opacity="0.85">
    <path d="M 60 300 
             C 80 285, 95 310, 110 295
             C 125 280, 140 340, 155 320
             C 170 300, 185 260, 200 310
             C 215 360, 230 330, 245 280
             C 260 230, 275 380, 290 340
             C 305 300, 320 250, 335 320
             C 350 390, 365 350, 380 270
             C 395 190, 410 370, 425 330
             C 440 290, 455 240, 470 310
             C 485 380, 500 340, 515 260
             C 530 180, 545 360, 560 320
             C 575 280, 590 230, 605 300
             C 620 370, 635 330, 650 250
             C 665 170, 680 350, 695 310
             C 710 270, 725 220, 740 290
             C 755 360, 770 320, 785 240
             C 800 160, 815 340, 830 300
             C 845 260, 860 210, 875 280
             C 890 350, 905 310, 920 230
             C 935 150, 950 330, 965 290
             C 980 250, 995 200, 1010 270
             C 1025 340, 1040 300, 1055 220
             C 1070 140, 1085 320, 1100 280
             C 1115 240, 1130 190, 1145 260
             C 1160 330, 1175 290, 1190 210
             C 1205 130, 1215 310, 1220 270"
          fill="none" stroke="#4a7dff" stroke-width="3" stroke-linecap="round" filter="url(#waveDistort)" opacity="0.7"/>
    <path d="M 60 305
             C 85 290, 105 315, 125 300
             C 145 285, 165 335, 185 315
             C 205 295, 225 255, 245 305
             C 265 355, 285 325, 305 275
             C 325 225, 345 375, 365 335
             C 385 295, 405 245, 425 315
             C 445 385, 465 345, 485 265
             C 505 185, 525 365, 545 325
             C 565 285, 585 235, 605 305
             C 625 375, 645 335, 665 255
             C 685 175, 705 355, 725 315
             C 745 275, 765 225, 785 295
             C 805 365, 825 325, 845 245
             C 865 165, 885 345, 905 305
             C 925 265, 945 215, 965 285
             C 985 355, 1005 315, 1025 235
             C 1045 155, 1065 335, 1085 295
             C 1105 255, 1125 205, 1145 275
             C 1165 345, 1185 305, 1205 225
             C 1215 145, 1220 305, 1220 265"
          fill="none" stroke="#4a7dff" stroke-width="2" stroke-linecap="round" filter="url(#waveDistort)" opacity="0.5"/>
  </g>

  <!-- Distorted hand-drawn motion trail - red (chaotic waveform) -->
  <g opacity="0.75">
    <path d="M 60 340 
             C 80 355, 95 325, 110 345
             C 125 365, 140 310, 155 335
             C 170 360, 185 295, 200 325
             C 215 355, 230 300, 245 330
             C 260 360, 275 285, 290 315
             C 305 345, 320 270, 335 300
             C 350 375, 365 340, 380 260
             C 395 180, 410 360, 425 320
             C 440 280, 455 230, 470 300
             C 485 370, 500 330, 515 250
             C 530 170, 545 350, 560 310
             C 575 270, 590 220, 605 290
             C 620 360, 635 320, 650 240
             C 665 160, 680 340, 695 300
             C 710 260, 725 210, 740 280
             C 755 350, 770 310, 785 230
             C 800 150, 815 330, 830 290
             C 845 250, 860 200, 875 270
             C 890 340, 905 300, 920 220
             C 935 140, 950 320, 965 280
             C 980 240, 995 190, 1010 260
             C 1025 330, 1040 290, 1055 210
             C 1070 130, 1085 310, 1100 270
             C 1115 230, 1130 180, 1145 250
             C 1160 320, 1175 280, 1190 200
             C 1205 120, 1215 300, 1220 260"
          fill="none" stroke="#ff2f4f" stroke-width="3" stroke-linecap="round" filter="url(#waveDistort)" opacity="0.7"/>
    <path d="M 60 345
             C 85 360, 105 330, 125 350
             C 145 370, 165 315, 185 340
             C 205 365, 225 300, 245 330
             C 265 360, 285 290, 305 320
             C 325 350, 345 275, 365 305
             C 385 335, 405 260, 425 290
             C 445 360, 465 325, 485 245
             C 505 165, 525 345, 545 305
             C 565 265, 585 215, 605 285
             C 625 355, 645 315, 665 235
             C 685 155, 705 335, 725 295
             C 745 255, 765 205, 785 275
             C 805 345, 825 305, 845 225
             C 865 145, 885 325, 905 285
             C 925 245, 945 195, 965 265
             C 985 335, 1005 295, 1025 215
             C 1045 135, 1065 315, 1085 275
             C 1105 235, 1125 185, 1145 255
             C 1165 325, 1185 285, 1205 205
             C 1215 125, 1220 295, 1220 255"
          fill="none" stroke="#ff2f4f" stroke-width="2" stroke-linecap="round" filter="url(#waveDistort)" opacity="0.5"/>
  </g>

  <!-- Blurred motion echoes -->
  <g opacity="0.25" filter="url(#blurHeavy)">
    <path d="M 60 310 
             C 120 290, 180 330, 240 300
             C 300 270, 360 390, 420 350
             C 480 310, 540 210, 600 290
             C 660 370, 720 330, 780 260
             C 840 190, 900 410, 960 340
             C 1020 270, 1080 320, 1140 250
             C 1180 220, 1200 270, 1220 250"
          fill="none" stroke="#4a7dff" stroke-width="12"/>
    <path d="M 60 350 
             C 130 370, 190 310, 250 360
             C 310 410, 370 290, 430 340
             C 490 390, 550 230, 610 320
             C 670 410, 730 360, 790 290
             C 850 220, 910 440, 970 360
             C 1030 280, 1090 350, 1150 290
             C 1190 260, 1210 300, 1220 290"
          fill="none" stroke="#ff2f4f" stroke-width="12"/>
  </g>

  <!-- Syncopation accents: scattered sharp bars -->
  <g stroke="#ff2f4f" stroke-width="3" opacity="0.8">
    <line x1="340" y1="150" x2="340" y2="470"/>
    <line x1="720" y1="180" x2="720" y2="430"/>
    <line x1="1080" y1="190" x2="1080" y2="420"/>
  </g>
  <g stroke="#4a7dff" stroke-width="3" opacity="0.8">
    <line x1="540" y1="200" x2="540" y2="400"/>
    <line x1="900" y1="220" x2="900" y2="380"/>
  </g>

  <!-- Tension: broken diagonal slash - stronger structural element -->
  <g>
    <line x1="120" y1="680" x2="580" y2="120" stroke="#ff1e3c" stroke-width="8" stroke-linecap="round" opacity="0.9" filter="url(#riso)"/>
    <line x1="620" y1="100" x2="660" y2="60" stroke="#ff1e3c" stroke-width="8" stroke-linecap="round" opacity="0.85" filter="url(#riso)"/>
    <line x1="720" y1="50" x2="755" y2="15" stroke="#ff1e3c" stroke-width="8" stroke-linecap="round" opacity="0.8" filter="url(#riso)"/>
    <line x1="80" y1="700" x2="140" y2="640" stroke="#ff1e3c" stroke-width="8" stroke-linecap="round" opacity="0.85" filter="url(#riso)"/>
  </g>

  <!-- Red orb - distorted speaker cone / energy burst -->
  <g transform="translate(960, 560)" filter="url(#orbDistort)">
    <circle cx="0" cy="0" r="120" fill="#ff2f4f" opacity="0.3"/>
    <circle cx="0" cy="0" r="90" fill="#ff2f4f" opacity="0.5"/>
    <circle cx="0" cy="0" r="60" fill="#ff4d67" opacity="0.7"/>
    <circle cx="0" cy="0" r="35" fill="#ff6b82" opacity="0.8"/>
    <circle cx="0" cy="0" r="15" fill="#ffffff" opacity="0.9"/>
    <!-- Distorted rings -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#ff2f4f" stroke-width="4" opacity="0.4" stroke-dasharray="20 15 30 10"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#ff4d67" stroke-width="3" opacity="0.5" stroke-dasharray="15 20 25 12"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#ff6b82" stroke-width="2" opacity="0.6" stroke-dasharray="10 15 20 8"/>
    <!-- Radiating distortion lines -->
    <line x1="0" y1="-130" x2="0" y2="-180" stroke="#ff2f4f" stroke-width="3" opacity="0.4"/>
    <line x1="90" y1="-90" x2="130" y2="-130" stroke="#ff2f4f" stroke-width="3" opacity="0.35"/>
    <line x1="130" y1="0" x2="180" y2="0" stroke="#ff2f4f" stroke-width="3" opacity="0.4"/>
    <line x1="90" y1="90" x2="130" y2="130" stroke="#ff2f4f" stroke-width="3" opacity="0.35"/>
    <line x1="0" y1="130" x2="0" y2="180" stroke="#ff2f4f" stroke-width="3" opacity="0.4"/>
    <line x1="-90" y1="90" x2="-130" y2="130" stroke="#ff2f4f" stroke-width="3" opacity="0.35"/>
    <line x1="-130" y1="0" x2="-180" y2="0" stroke="#ff2f4f" stroke-width="3" opacity="0.4"/>
    <line x1="-90" y1="-90" x2="-130" y2="-130" stroke="#ff2f4f" stroke-width="3" opacity="0.35"/>
  </g>

  <!-- Top label -->
  <text x="64" y="70" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="8" fill="#8fb6ff" font-weight="700" filter="url(#riso)">EXPERIMENTAL JAZZ</text>
  <text x="1216" y="70" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="8" fill="#ff4d67" font-weight="700" filter="url(#riso)">LATE-NIGHT SERIES</text>

  <!-- Main title with riso texture (no glow) -->
  <text x="60" y="210" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" letter-spacing="2" fill="url(#blueText)" filter="url(#risoHeavy)">BLUE HOUR</text>
  <text x="60" y="350" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" letter-spacing="2" fill="url(#redText)" filter="url(#risoHeavy)">RED NOISE</text>

  <!-- Subtitle -->
  <text x="64" y="400" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#e9e2f2" filter="url(#riso)">A night of improvised sound</text>

  <!-- Divider -->
  <line x1="64" y1="430" x2="360" y2="430" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" filter="url(#riso)"/>

  <!-- Info block - disrupted layout with diagonal cutting through -->
  <text x="64" y="478" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#f2ecfa" letter-spacing="1" filter="url(#riso)">Friday, September 27  &#183;  Doors 7 PM</text>
  <text x="64" y="520" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c9bfe0" filter="url(#riso)">The Foundry  &#183;  East River District</text>

  <!-- Featuring - slightly offset for rhythm -->
  <text x="80" y="588" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="6" fill="#ff4d67" font-weight="700" filter="url(#riso)">FEATURING</text>
  <text x="64" y="632" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff" filter="url(#riso)">Nia Cole Quartet</text>
  <text x="100" y="672" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#b7c6ff" filter="url(#riso)">Static Bloom</text>
  <text x="64" y="708" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#b7c6ff" filter="url(#riso)">Armand Vale</text>

  <!-- Bottom accent bar - broken/irregular -->
  <rect x="64" y="744" width="400" height="4" fill="url(#blueText)" filter="url(#riso)"/>
  <rect x="480" y="744" width="350" height="4" fill="url(#redText)" filter="url(#riso)"/>
  <rect x="850" y="744" width="366" height="4" fill="url(#blueText)" filter="url(#riso)"/>

  <!-- Additional texture: scattered print artifacts -->
  <g opacity="0.15">
    <circle cx="200" cy="180" r="3" fill="#ffffff"/>
    <circle cx="450" cy="250" r="2" fill="#ffffff"/>
    <circle cx="700" cy="180" r="2.5" fill="#ffffff"/>
    <circle cx="950" cy="220" r="2" fill="#ffffff"/>
    <circle cx="1100" cy="180" r="3" fill="#ffffff"/>
    <circle cx="300" cy="600" r="2" fill="#ffffff"/>
    <circle cx="550" cy="650" r="2.5" fill="#ffffff"/>
    <circle cx="800" cy="680" r="2" fill="#ffffff"/>
    <circle cx="1050" cy="650" r="3" fill="#ffffff"/>
  </g>
</svg>