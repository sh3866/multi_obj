<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07060a"/>
      <stop offset="55%" stop-color="#12101a"/>
      <stop offset="100%" stop-color="#1c1626"/>
    </linearGradient>
    <radialGradient id="glow" cx="42%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#3a2a4a" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#241a30" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#07060a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe9dd"/>
      <stop offset="55%" stop-color="#c9beaf"/>
      <stop offset="100%" stop-color="#8a7d70"/>
    </linearGradient>
    <linearGradient id="fig2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b9b2c6"/>
      <stop offset="100%" stop-color="#6f6580"/>
    </linearGradient>
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#e7923a" stop-opacity="0"/>
      <stop offset="45%" stop-color="#e7923a" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#d44a35" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="softPurpleShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="28"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0 0.55  0 0 0 0.45 0"/>
    </filter>
    <filter id="grainFig" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0 0.72  0 0 0 0.45 0" result="colorNoise"/>
      <feComposite in="colorNoise" in2="SourceGraphic" operator="in" result="masked"/>
      <feBlend in="SourceGraphic" in2="masked" mode="multiply"/>
    </filter>
    <filter id="bgGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.78  0 0 0 0.06 0"/>
    </filter>
    <radialGradient id="vign" cx="50%" cy="46%" r="72%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>

  <!-- faint vertical axis / restraint line -->
  <line x1="560" y1="90" x2="560" y2="730" stroke="#5a4d68" stroke-opacity="0.15" stroke-width="1"/>

  <!-- soft purple ambient shadow -->
  <path d="M480 640 L660 615 L700 660 L600 695 L490 685 Z" fill="#6b4a9a" filter="url(#softPurpleShadow)"/>

  <!-- wireframe echoes: repetition / motion blur -->
  <g opacity="0.22" stroke="#b9b2c6" stroke-width="1.8" fill="none" transform="translate(-75,48) rotate(-6 560 420)">
    <path d="M535 250 L560 228 L595 240 L575 268 Z"/>
    <path d="M560 285 L530 335 L518 395 L535 455 L570 490 L605 465 L595 420"/>
    <path d="M545 340 L505 328 L465 310 L440 288"/>
    <path d="M590 335 L630 318 L670 295 L705 268"/>
  </g>
  <g opacity="0.14" stroke="#b9b2c6" stroke-width="1.8" fill="none" transform="translate(65,-35) rotate(7 560 420)">
    <path d="M535 250 L560 228 L595 240 L575 268 Z"/>
    <path d="M560 285 L530 335 L518 395 L535 455 L570 490 L605 465 L595 420"/>
    <path d="M545 340 L505 328 L465 310 L440 288"/>
    <path d="M590 335 L630 318 L670 295 L705 268"/>
  </g>

  <!-- main figure: scaled 45%, shifted right, frayed connections -->
  <g filter="url(#grainFig)" transform="translate(120,55) scale(1.45)">
    <!-- fragmented head/upper torso -->
    <path d="M455 270 L475 250 L505 258 L520 275 L500 295 L470 305 L450 290 Z" 
          fill="url(#fig)" stroke="#2a2233" stroke-width="1.5"/>
    <!-- frayed restraint strokes -->
    <path d="M460 285 L438 262" stroke="url(#fig)" stroke-width="2.8" fill="none" stroke-linecap="butt"/>
    <path d="M458 287 L445 272" stroke="url(#fig)" stroke-width="1.2" fill="none" stroke-linecap="butt"/>
    <path d="M455 295 L428 282" stroke="url(#fig)" stroke-width="1.4" fill="none" stroke-linecap="butt"/>
    <path d="M515 280 L542 253" stroke="url(#fig)" stroke-width="2.2" fill="none" stroke-linecap="butt"/>
    <path d="M525 290 L553 268" stroke="url(#fig)" stroke-width="0.9" fill="none" stroke-linecap="butt"/>
    
    <!-- main torso: broken continuity with gaps -->
    <path d="M480 310 L462 348" stroke="url(#fig)" stroke-width="22" fill="none" stroke-linecap="butt"/>
    <path d="M456 372 L446 418" stroke="url(#fig)" stroke-width="17" fill="none" stroke-linecap="butt"/>
    <path d="M442 442 L452 488 L478 518 L512 508" stroke="url(#fig)" stroke-width="19" fill="none" stroke-linecap="butt" stroke-linejoin="miter"/>
    <!-- grounded base -->
    <path d="M512 510 L532 542 L522 582 L492 602 L462 592 L452 562" 
          stroke="url(#fig)" stroke-width="23" fill="none" stroke-linecap="butt" stroke-linejoin="miter"/>
    
    <!-- extended limb left - frayed -->
    <path d="M470 370 L438 362 L402 348 L382 328" 
          stroke="url(#fig2)" stroke-width="9" fill="none" stroke-linecap="butt"/>
    <path d="M472 368 L455 365" stroke="url(#fig2)" stroke-width="3" fill="none" stroke-linecap="butt"/>
    <!-- reaching arm right - frayed -->
    <path d="M510 360 L548 342 L585 322 L615 298 L628 272" 
          stroke="url(#fig2)" stroke-width="8" fill="none" stroke-linecap="butt"/>
    <path d="M512 358 L530 350" stroke="url(#fig2)" stroke-width="3.5" fill="none" stroke-linecap="butt"/>
    
    <!-- additional fragmentation -->
    <path d="M490 340 L508 322" stroke="url(#fig)" stroke-width="1.4" fill="none" stroke-linecap="butt"/>
    <path d="M465 410 L482 392" stroke="url(#fig)" stroke-width="0.9" fill="none" stroke-linecap="butt"/>
  </g>

  <!-- warm rim light on figure edges -->
  <g transform="translate(120,55) scale(1.45)">
    <path d="M520 275 L500 295 L470 305" stroke="url(#rimLight)" stroke-width="2.5" fill="none" stroke-linecap="butt"/>
    <path d="M510 360 L548 342 L585 322 L615 298 L628 272" 
          stroke="url(#rimLight)" stroke-width="3.5" fill="none" stroke-linecap="butt" opacity="0.7"/>
    <path d="M512 510 L532 542 L522 582" 
          stroke="url(#rimLight)" stroke-width="3" fill="none" stroke-linecap="butt" opacity="0.5"/>
    <path d="M455 270 L475 250 L505 258" 
          stroke="url(#rimLight)" stroke-width="2" fill="none" stroke-linecap="butt" opacity="0.6"/>
  </g>

  <!-- energy / breath lines -->
  <g fill="none" stroke-linecap="butt">
    <path d="M385 330 L358 348" stroke="#e7b878" stroke-width="1.3" opacity="0.5"/>
    <path d="M395 315 L372 328" stroke="#e7b878" stroke-width="0.9" opacity="0.35"/>
    <path d="M620 280 L652 268" stroke="#e7b878" stroke-width="1.3" opacity="0.5"/>
    <path d="M610 265 L638 255" stroke="#e7b878" stroke-width="0.9" opacity="0.32"/>
  </g>

  <!-- suspended particles -->
  <g fill="#e7b878">
    <circle cx="360" cy="240" r="2.4" opacity="0.7"/>
    <circle cx="650" cy="290" r="2" opacity="0.55"/>
    <circle cx="340" cy="350" r="1.6" opacity="0.4"/>
    <circle cx="670" cy="350" r="1.6" opacity="0.4"/>
    <circle cx="420" cy="190" r="1.4" opacity="0.35"/>
    <circle cx="600" cy="195" r="1.4" opacity="0.35"/>
    <circle cx="320" cy="290" r="1.2" opacity="0.3"/>
    <circle cx="700" cy="290" r="1.2" opacity="0.3"/>
  </g>

  <!-- typography - dramatic weight contrast -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="85" y="155" font-size="58" letter-spacing="2" fill="#f1ece2" font-weight="300">THE</text>
    <text x="200" y="168" font-size="88" letter-spacing="3" fill="#f1ece2" font-weight="700">WEIGHT</text>
    <text x="85" y="238" font-size="62" letter-spacing="10" fill="#f1ece2" font-weight="300">OF</text>
    <text x="175" y="242" font-size="68" letter-spacing="16" fill="#f1ece2" font-weight="300">AIR</text>
    <text x="95" y="300" font-size="22" letter-spacing="2" font-style="italic" fill="#b8a98c">A contemporary movement performance</text>
  </g>

  <!-- bottom info -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="95" y="710" font-size="36" letter-spacing="3" fill="#f1ece2">OCTOBER 18&#8211;20 &#183; 8 PM</text>
    <text x="95" y="752" font-size="22" letter-spacing="5" fill="#c9beaf">MERIDIAN ARTS THEATRE</text>
  </g>

  <!-- fine frame -->
  <rect x="24" y="24" width="1232" height="752" fill="none" stroke="#4a3f56" stroke-opacity="0.4" stroke-width="1"/>

  <rect width="1280" height="800" fill="url(#vign)"/>
  <rect width="1280" height="800" filter="url(#bgGrain)" opacity="0.5"/>
</svg>