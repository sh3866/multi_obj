<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2740"/>
      <stop offset="0.28" stop-color="#071a2c"/>
      <stop offset="0.6" stop-color="#04101c"/>
      <stop offset="1" stop-color="#01060c"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9e2f2" stop-opacity="0.42"/>
      <stop offset="0.4" stop-color="#4a93b6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#123049" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Bioluminescent Glow Gradients -->
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9fbff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#4fe0f0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#4fe0f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfe4ff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#5a9dff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#5a9dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0c0ff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#9b59b6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#9b59b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <radialGradient id="lastLight" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#88d4f0" stop-opacity="0.15"/>
      <stop offset="0.4" stop-color="#4a93b6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#123049" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a7fb0" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="squid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17324e"/>
      <stop offset="1" stop-color="#0a1826"/>
    </linearGradient>

    <!-- Filters for Emissive / Submerged Effects -->
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="softBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <!-- Volumetric Text Glow: subtle cyan scatter -->
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#4fe0f0" flood-opacity="0.35" result="cyan"/>
      <feComposite in="cyan" in2="blur" operator="in" result="cyanBlur"/>
      <feMerge>
        <feMergeNode in="cyanBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="0" y="0" width="1280" height="800" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="800" fill="url(#light)"/>

  <!-- P2: Last Light Fading from Above -->
  <ellipse cx="640" cy="-50" rx="800" ry="450" fill="url(#lastLight)"/>
  <ellipse cx="640" cy="0" rx="600" ry="300" fill="#a9e2f2" opacity="0.06"/>
  <ellipse cx="400" cy="0" rx="300" ry="200" fill="#c3ecf7" opacity="0.04"/>
  <ellipse cx="880" cy="0" rx="300" ry="200" fill="#c3ecf7" opacity="0.04"/>

  <!-- Faint Marine Snow -->
  <g fill="#9fd0e6">
    <circle cx="180" cy="120" r="1.6" opacity="0.12"/>
    <circle cx="300" cy="200" r="1.2" opacity="0.1"/>
    <circle cx="420" cy="90" r="1.4" opacity="0.1"/>
    <circle cx="520" cy="260" r="1.8" opacity="0.12"/>
    <circle cx="640" cy="150" r="1.3" opacity="0.1"/>
    <circle cx="760" cy="230" r="1.5" opacity="0.1"/>
    <circle cx="880" cy="110" r="1.2" opacity="0.1"/>
    <circle cx="980" cy="300" r="1.7" opacity="0.12"/>
    <circle cx="1100" cy="180" r="1.4" opacity="0.1"/>
    <circle cx="240" cy="340" r="1.6" opacity="0.1"/>
    <circle cx="720" cy="380" r="1.5" opacity="0.1"/>
    <circle cx="1160" cy="360" r="1.3" opacity="0.1"/>
  </g>

  <!-- Drifting Marine Snow (Brighter) -->
  <g fill="#cfeaf5">
    <circle cx="200" cy="180" r="2.4" opacity="0.4"/>
    <circle cx="360" cy="240" r="2" opacity="0.35"/>
    <circle cx="480" cy="150" r="2.6" opacity="0.4"/>
    <circle cx="540" cy="320" r="2" opacity="0.35"/>
    <circle cx="600" cy="200" r="2.4" opacity="0.4"/>
    <circle cx="700" cy="280" r="2" opacity="0.35"/>
    <circle cx="820" cy="180" r="2.6" opacity="0.4"/>
    <circle cx="900" cy="340" r="2" opacity="0.35"/>
    <circle cx="1020" cy="240" r="2.4" opacity="0.4"/>
    <circle cx="1150" cy="150" r="2" opacity="0.35"/>
    <circle cx="260" cy="420" r="2.4" opacity="0.35"/>
    <circle cx="400" cy="470" r="2" opacity="0.3"/>
    <circle cx="520" cy="430" r="2.4" opacity="0.35"/>
    <circle cx="660" cy="420" r="2" opacity="0.3"/>
    <circle cx="860" cy="440" r="2.4" opacity="0.35"/>
    <circle cx="1080" cy="420" r="2" opacity="0.3"/>
  </g>

  <!-- P4: Extended Seabed Silhouette (Grounding Mid-Left) -->
  <g opacity="0.85">
    <path d="M0,480 C40,470 80,490 140,510 C200,530 280,560 380,590 C480,620 600,620 750,605 C900,590 1000,615 1100,600 C1200,585 1280,610 1280,620 L1280,800 L0,800 Z" fill="#01060c"/>
    <path d="M0,520 C60,510 120,530 200,550 C300,575 420,610 560,625 C700,635 840,620 940,645 C1060,630 1160,615 1280,650 L1280,800 L0,800 Z" fill="#020a12"/>
    <!-- Trench Texture Lines -->
    <path d="M100,560 C150,550 200,565 280,555" fill="none" stroke="#0a1a2b" stroke-width="2" opacity="0.5"/>
    <path d="M300,590 C380,578 460,595 550,585" fill="none" stroke="#0a1a2b" stroke-width="2" opacity="0.5"/>
    <path d="M700,620 C780,610 860,625 950,615" fill="none" stroke="#0a1a2b" stroke-width="2" opacity="0.5"/>
    <path d="M950,640 C1030,630 1110,645 1200,635" fill="none" stroke="#0a1a2b" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- P2: Extended Diagonal Particle Trail (Behind Creatures) -->
  <g>
    <!-- Originating from top edge -->
    <circle cx="350" cy="10" r="12" fill="url(#glowCyan)" opacity="0.35" filter="url(#soft)"/>
    <circle cx="350" cy="10" r="2" fill="#eaffff" opacity="0.6"/>
    
    <circle cx="380" cy="50" r="14" fill="url(#glowBlue)" opacity="0.4" filter="url(#soft)"/>
    <circle cx="380" cy="50" r="2" fill="#cfe4ff" opacity="0.7"/>
    
    <circle cx="410" cy="90" r="16" fill="url(#glowCyan)" opacity="0.45" filter="url(#soft)"/>
    <circle cx="410" cy="90" r="2.5" fill="#eaffff" opacity="0.75"/>
    
    <circle cx="440" cy="140" r="15" fill="url(#glowBlue)" opacity="0.45" filter="url(#soft)"/>
    <circle cx="440" cy="140" r="2" fill="#cfe4ff" opacity="0.7"/>
    
    <circle cx="470" cy="190" r="18" fill="url(#glowCyan)" opacity="0.5" filter="url(#soft)"/>
    <circle cx="470" cy="190" r="3" fill="#eaffff" opacity="0.8"/>
    
    <circle cx="500" cy="240" r="16" fill="url(#glowBlue)" opacity="0.5" filter="url(#soft)"/>
    <circle cx="500" cy="240" r="2.5" fill="#cfe4ff" opacity="0.75"/>
    
    <circle cx="530" cy="290" r="20" fill="url(#glowCyan)" opacity="0.55" filter="url(#soft)"/>
    <circle cx="530" cy="290" r="3" fill="#eaffff" opacity="0.85"/>
    
    <circle cx="560" cy="340" r="17" fill="url(#glowBlue)" opacity="0.55" filter="url(#soft)"/>
    <circle cx="560" cy="340" r="2.5" fill="#cfe4ff" opacity="0.8"/>
    
    <circle cx="600" cy="390" r="22" fill="url(#glowCyan)" opacity="0.6" filter="url(#soft)"/>
    <circle cx="600" cy="390" r="4" fill="#eaffff" opacity="0.9"/>
    
    <circle cx="650" cy="430" r="18" fill="url(#glowBlue)" opacity="0.6" filter="url(#soft)"/>
    <circle cx="650" cy="430" r="3" fill="#cfe4ff" opacity="0.85"/>
    
    <circle cx="700" cy="470" r="20" fill="url(#glowCyan)" opacity="0.65" filter="url(#soft)"/>
    <circle cx="700" cy="470" r="3.5" fill="#eaffff" opacity="0.9"/>
    
    <circle cx="750" cy="510" r="18" fill="url(#glowBlue)" opacity="0.6" filter="url(#soft)"/>
    <circle cx="750" cy="510" r="2.5" fill="#cfe4ff" opacity="0.8"/>
    
    <circle cx="800" cy="550" r="22" fill="url(#glowCyan)" opacity="0.65" filter="url(#soft)"/>
    <circle cx="800" cy="550" r="4" fill="#eaffff" opacity="0.95"/>
    
    <circle cx="850" cy="590" r="20" fill="url(#glowBlue)" opacity="0.65" filter="url(#soft)"/>
    <circle cx="850" cy="590" r="3" fill="#cfe4ff" opacity="0.9"/>
    
    <circle cx="900" cy="630" r="24" fill="url(#glowCyan)" opacity="0.7" filter="url(#soft)"/>
    <circle cx="900" cy="630" r="4.5" fill="#eaffff" opacity="1"/>
    
    <circle cx="950" cy="660" r="22" fill="url(#glowBlue)" opacity="0.7" filter="url(#soft)"/>
    <circle cx="950" cy="660" r="4" fill="#cfe4ff" opacity="0.95"/>
    
    <circle cx="1000" cy="690" r="24" fill="url(#glowCyan)" opacity="0.75" filter="url(#soft)"/>
    <circle cx="1000" cy="690" r="5" fill="#eaffff" opacity="1"/>
    
    <!-- Single Violet Accent -->
    <circle cx="780" cy="520" r="14" fill="url(#glowViolet)" opacity="0.55" filter="url(#soft)"/>
    <circle cx="780" cy="520" r="2" fill="#e0c0ff" opacity="0.75"/>
  </g>

  <!-- Jellyfish (Upper Left) -->
  <g>
    <!-- P1: Wide Volumetric Halo -->
    <ellipse cx="220" cy="150" rx="120" ry="80" fill="url(#glowCyan)" opacity="0.12" filter="url(#softBlur)"/>
    <ellipse cx="220" cy="150" rx="70" ry="46" fill="url(#glowCyan)" opacity="0.3" filter="url(#soft)"/>
    <!-- Body -->
    <path d="M150,150 C150,110 195,95 220,95 C245,95 290,110 290,150 C290,172 272,182 260,176 C250,186 235,186 225,176 C215,186 200,186 190,176 C178,182 150,172 150,150 Z" fill="url(#jelly)" opacity="0.65"/>
    <!-- Tentacles -->
    <g stroke="#8fe8ff" stroke-width="1.4" fill="none" opacity="0.5" stroke-linecap="round" filter="url(#soft)">
      <path d="M175,178 C172,220 182,255 174,300"/>
      <path d="M200,182 C198,225 208,265 200,315"/>
      <path d="M225,184 C224,230 232,270 226,320"/>
      <path d="M250,180 C252,225 244,265 252,312"/>
      <path d="M268,176 C272,215 264,250 270,295"/>
    </g>
  </g>

  <!-- Abstract Deep-Sea Creature / Anglerfish (Left Middle) -->
  <g>
    <!-- P1: Wide Volumetric Halo -->
    <ellipse cx="300" cy="400" rx="200" ry="130" fill="url(#glowBlue)" opacity="0.08" filter="url(#softBlur)"/>
    <ellipse cx="300" cy="400" rx="150" ry="90" fill="url(#glowBlue)" opacity="0.15" filter="url(#softBlur)"/>
    
    <!-- Abstract Organic Silhouette -->
    <path d="M210,405 C235,360 300,350 345,372 C380,390 385,430 350,452 C310,472 245,465 215,438 C200,428 200,415 210,405 Z" fill="#081420" stroke="#1c4a68" stroke-width="1.5" opacity="0.9"/>
    
    <!-- Internal Abstract Bioluminescent Structures -->
    <path d="M214,420 C236,388 300,380 340,398" fill="none" stroke="#4fe0f0" stroke-width="1.5" opacity="0.4" filter="url(#soft)"/>
    <path d="M300,372 C310,352 330,352 340,368" fill="none" stroke="#4fe0f0" stroke-width="2" opacity="0.5" filter="url(#soft)"/>
    <path d="M330,378 C338,360 356,362 362,376" fill="none" stroke="#4fe0f0" stroke-width="2" opacity="0.5" filter="url(#soft)"/>
    <path d="M250,398 C258,384 274,386 278,398" fill="none" stroke="#4fe0f0" stroke-width="1.8" opacity="0.5" filter="url(#soft)"/>
    
    <!-- Glowing Eye (Abstract) -->
    <circle cx="270" cy="412" r="18" fill="url(#glowCyan)" opacity="0.2" filter="url(#softBlur)"/>
    <circle cx="270" cy="412" r="12" fill="url(#glowCyan)" opacity="0.8" filter="url(#soft)"/>
    <circle cx="270" cy="412" r="4" fill="#eaffff"/>
    <circle cx="272" cy="410" r="1.4" fill="#ffffff"/>
    
    <!-- Abstract Lure -->
    <path d="M292,388 C262,346 236,330 214,332" fill="none" stroke="#4fe0f0" stroke-width="1.4" opacity="0.85" filter="url(#soft)"/>
    <circle cx="214" cy="332" r="35" fill="url(#glowCyan)" opacity="0.25" filter="url(#softBlur)"/>
    <circle cx="214" cy="332" r="24" fill="url(#glowCyan)" opacity="0.9" filter="url(#soft)"/>
    <circle cx="214" cy="332" r="5" fill="#eaffff"/>
  </g>

  <!-- Squid (Right Middle) -->
  <g>
    <!-- P1: Wide Volumetric Halo -->
    <ellipse cx="980" cy="400" rx="200" ry="140" fill="url(#glowBlue)" opacity="0.06" filter="url(#softBlur)"/>
    <ellipse cx="980" cy="400" rx="150" ry="100" fill="url(#glowBlue)" opacity="0.12" filter="url(#softBlur)"/>
    
    <!-- Mantle -->
    <path d="M980,290 C1020,290 1048,330 1050,385 C1052,430 1035,455 1015,462 C1005,466 995,466 985,462 C965,455 948,430 950,385 C952,330 940,290 980,290 Z" fill="url(#squid)"/>
    <path d="M980,300 C1012,300 1034,334 1036,382 C1037,420 1024,446 1008,452" fill="none" stroke="#4fe0f0" stroke-width="1.5" opacity="0.4" filter="url(#soft)"/>
    
    <!-- Tentacles -->
    <g stroke="#0b1c2e" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M960,455 C945,500 950,545 935,585"/>
      <path d="M975,458 C968,505 972,548 962,592"/>
      <path d="M990,460 C990,508 994,550 988,595"/>
      <path d="M1005,458 C1012,505 1008,548 1018,590"/>
      <path d="M1020,452 C1035,498 1030,540 1045,582"/>
    </g>
    <g stroke="#4fe0f0" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.5" filter="url(#soft)">
      <path d="M965,455 C950,505 955,550 940,590"/>
      <path d="M1015,452 C1030,500 1025,545 1040,588"/>
    </g>
    
    <!-- P1: Bioluminescent Spots with Wide Scatter -->
    <g fill="url(#glowCyan)" opacity="0.15" filter="url(#softBlur)">
      <circle cx="958" cy="345" r="15"/>
      <circle cx="975" cy="360" r="14"/>
      <circle cx="995" cy="350" r="15"/>
      <circle cx="1012" cy="365" r="14"/>
      <circle cx="1000" cy="385" r="15"/>
      <circle cx="968" cy="392" r="14"/>
      <circle cx="985" cy="405" r="15"/>
      <circle cx="1010" cy="398" r="12"/>
    </g>
    <g fill="#cfe4ff" filter="url(#soft)">
      <circle cx="958" cy="345" r="4"/>
      <circle cx="975" cy="360" r="3.5"/>
      <circle cx="995" cy="350" r="4"/>
      <circle cx="1012" cy="365" r="3.5"/>
      <circle cx="1000" cy="385" r="4"/>
      <circle cx="968" cy="392" r="3.5"/>
      <circle cx="985" cy="405" r="4"/>
      <circle cx="1010" cy="398" r="3"/>
    </g>
    
    <!-- Eyes -->
    <circle cx="972" cy="330" r="14" fill="url(#glowCyan)" opacity="0.15" filter="url(#softBlur)"/>
    <circle cx="972" cy="330" r="10" fill="#02070d"/>
    <circle cx="972" cy="330" r="4" fill="#8fe8ff" filter="url(#soft)"/>
    <circle cx="974" cy="328" r="1.3" fill="#ffffff"/>
    <circle cx="998" cy="330" r="14" fill="url(#glowCyan)" opacity="0.15" filter="url(#softBlur)"/>
    <circle cx="998" cy="330" r="10" fill="#02070d"/>
    <circle cx="998" cy="330" r="4" fill="#8fe8ff" filter="url(#soft)"/>
    <circle cx="1000" cy="328" r="1.3" fill="#ffffff"/>
  </g>

  <!-- P4: Massive Faint Squid Silhouette (Bottom-Right) -->
  <g opacity="0.35">
    <path d="M1050,780 C1080,720 1120,680 1160,660 C1200,640 1240,650 1260,680 C1280,710 1290,750 1280,790 L1280,800 L1050,800 Z" fill="#020a12"/>
    <path d="M1160,660 C1180,630 1210,610 1240,620 C1260,630 1270,650 1265,675" fill="none" stroke="#0a1a2b" stroke-width="3" opacity="0.5"/>
    <path d="M1100,760 C1090,720 1100,680 1120,650" fill="none" stroke="#0a1a2b" stroke-width="2" opacity="0.4"/>
    <path d="M1130,770 C1125,730 1135,690 1150,660" fill="none" stroke="#0a1a2b" stroke-width="2" opacity="0.4"/>
    <path d="M1160,775 C1160,735 1165,695 1175,665" fill="none" stroke="#0a1a2b" stroke-width="2" opacity="0.4"/>
    <path d="M1190,770 C1195,730 1200,690 1210,660" fill="none" stroke="#0a1a2b" stroke-width="2" opacity="0.4"/>
    <path d="M1220,760 C1230,720 1240,680 1250,650" fill="none" stroke="#0a1a2b" stroke-width="2" opacity="0.4"/>
    <!-- Faint bioluminescent trace on massive squid -->
    <circle cx="1200" cy="690" r="8" fill="url(#glowCyan)" opacity="0.2" filter="url(#soft)"/>
    <circle cx="1230" cy="710" r="6" fill="url(#glowBlue)" opacity="0.15" filter="url(#soft)"/>
  </g>

  <!-- Vignette -->
  <rect x="0" y="0" width="1280" height="800" fill="url(#vignette)"/>

  <!-- ===== TEXT ===== -->
  
  <!-- Museum Name -->
  <text x="640" y="108" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="6" fill="#7fb8d4">CALDER MUSEUM OF NATURAL HISTORY</text>
  <line x1="560" y1="124" x2="720" y2="124" stroke="#3a6f8f" stroke-width="1" opacity="0.6"/>

  <!-- P3: Headline - Bioluminescent Cyan with Tighter Spacing & Volumetric Glow -->
  <g filter="url(#textGlow)">
    <text x="640" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" letter-spacing="3" fill="#8ee4f0">BELOW THE</text>
    <text x="640" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" letter-spacing="3" fill="#8ee4f0">LAST LIGHT</text>
  </g>

  <!-- Divider -->
  <line x1="520" y1="332" x2="760" y2="332" stroke="#4fe0f0" stroke-width="1.4" opacity="0.7" filter="url(#soft)"/>
  <circle cx="640" cy="332" r="4" fill="#c9fbff" filter="url(#soft)"/>

  <!-- Subtitle -->
  <text x="640" y="368" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" letter-spacing="1" fill="#a9d6ec">Life at the edge of the known world</text>

  <!-- Exhibition Details -->
  <text x="640" y="700" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="4" fill="#cfe8f5">SPECIAL EXHIBITION</text>
  <text x="640" y="732" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="2" fill="#eaf6ff">November 2 – March 9</text>

</svg>