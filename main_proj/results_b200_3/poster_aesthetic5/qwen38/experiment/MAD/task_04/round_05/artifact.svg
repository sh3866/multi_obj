<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0611"/>
      <stop offset="0.5" stop-color="#120a1e"/>
      <stop offset="1" stop-color="#050308"/>
    </linearGradient>
    
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#1a3a9e" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0b0611" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="redText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d67"/>
      <stop offset="1" stop-color="#ff1e3c"/>
    </linearGradient>
    
    <linearGradient id="blueText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb6ff"/>
      <stop offset="1" stop-color="#4a7dff"/>
    </linearGradient>
    
    <linearGradient id="amberGrad" x1="0" y1="1" x2="0.5" y2="0.5">
      <stop offset="0" stop-color="#ff9500" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff9500" stop-opacity="0"/>
    </linearGradient>
    
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    
    <!-- Chromatic Aberration Filter: Separating Blue and Red channels for atmospheric tension -->
    <filter id="chromaAberration" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset in="SourceAlpha" dx="4" dy="0" result="offsetRed"/>
      <feFlood flood-color="#ff1e3c" flood-opacity="0.4" result="redColor"/>
      <feComposite in="redColor" in2="offsetRed" operator="in" result="redChannel"/>
      
      <feOffset in="SourceAlpha" dx="-4" dy="0" result="offsetBlue"/>
      <feFlood flood-color="#4a7dff" flood-opacity="0.4" result="blueColor"/>
      <feComposite in="blueColor" in2="offsetBlue" operator="in" result="blueChannel"/>
      
      <feMerge>
        <feMergeNode in="redChannel"/>
        <feMergeNode in="blueChannel"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Chromatic Aberration Filter for Red Text: Slightly tighter to maintain readability -->
    <filter id="chromaAberrationRed" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset in="SourceAlpha" dx="5" dy="0" result="offsetRed"/>
      <feFlood flood-color="#ff1e3c" flood-opacity="0.5" result="redColor"/>
      <feComposite in="redColor" in2="offsetRed" operator="in" result="redChannel"/>
      
      <feOffset in="SourceAlpha" dx="-5" dy="0" result="offsetBlue"/>
      <feFlood flood-color="#00ffff" flood-opacity="0.3" result="blueColor"/>
      <feComposite in="blueColor" in2="offsetBlue" operator="in" result="blueChannel"/>
      
      <feMerge>
        <feMergeNode in="redChannel"/>
        <feMergeNode in="blueChannel"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Atmospheric blue glow -->
  <ellipse cx="360" cy="250" rx="380" ry="300" fill="url(#blueGlow)"/>

  <!-- Warm amber gradient -->
  <rect x="0" y="400" width="640" height="400" fill="url(#amberGrad)"/>

  <!-- Grain texture overlay on background -->
  <rect width="1280" height="800" filter="url(#grain)" opacity="0.12" style="mix-blend-mode: overlay;"/>

  <!-- Syncopation Sequence: Red/Blue Squares with Rotational Jitter -->
  <g opacity="0.9">
    <!-- Jittered squares representing syncopation, scaling up -->
    <rect x="80" y="380" width="12" height="12" fill="#4a7dff" transform="rotate(15 86 386)" opacity="0.7"/>
    <rect x="110" y="395" width="14" height="14" fill="#ff2f4f" transform="rotate(-12 117 402)" opacity="0.8"/>
    <rect x="150" y="370" width="16" height="16" fill="#4a7dff" transform="rotate(25 158 378)" opacity="0.8"/>
    <rect x="190" y="410" width="18" height="18" fill="#ff2f4f" transform="rotate(-8 199 419)" opacity="0.85"/>
    <rect x="240" y="360" width="20" height="20" fill="#4a7dff" transform="rotate(35 250 370)" opacity="0.85"/>
    <rect x="290" y="420" width="22" height="22" fill="#ff2f4f" transform="rotate(-20 301 431)" opacity="0.9"/>
    <rect x="350" y="350" width="24" height="24" fill="#4a7dff" transform="rotate(45 362 362)" opacity="0.9"/>
    <rect x="410" y="430" width="26" height="26" fill="#ff2f4f" transform="rotate(-30 423 443)" opacity="0.9"/>
    <rect x="480" y="340" width="28" height="28" fill="#4a7dff" transform="rotate(60 494 354)" opacity="0.95"/>
    <rect x="550" y="440" width="30" height="30" fill="#ff2f4f" transform="rotate(-45 565 455)" opacity="0.95"/>
    <rect x="630" y="330" width="32" height="32" fill="#4a7dff" transform="rotate(75 646 346)" opacity="0.95"/>
    <rect x="710" y="450" width="34" height="34" fill="#ff2f4f" transform="rotate(-60 727 467)" opacity="0.95"/>
    <rect x="800" y="320" width="36" height="36" fill="#4a7dff" transform="rotate(90 818 338)" opacity="0.95"/>
    <rect x="890" y="460" width="38" height="38" fill="#ff2f4f" transform="rotate(-75 909 479)" opacity="0.95"/>
    <rect x="990" y="310" width="40" height="40" fill="#4a7dff" transform="rotate(110 1010 330)" opacity="0.95"/>
    <rect x="1090" y="470" width="42" height="42" fill="#ff2f4f" transform="rotate(-90 1111 491)" opacity="0.95"/>
    <rect x="1190" y="300" width="44" height="44" fill="#4a7dff" transform="rotate(135 1212 322)" opacity="0.95"/>
  </g>

  <!-- Fragmented Diagonal Vector: Broken Signal -->
  <!-- Replaces clean line with jagged, interrupted segments -->
  <g>
    <!-- Outer soft glow (continuous trajectory) -->
    <path d="M 1264,784 L 1100,600 L 950,450 L 800,300 L 650,150 L 400,160" 
          stroke="#ff1e3c" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.12"/>
    
    <!-- Blue chromatic offset (fragmented) -->
    <path d="M 1264,784 L 1120,620 L 1080,580 L 960,440 L 920,400 L 820,310 L 780,270 L 660,160 L 400,160" 
          stroke="#4a7dff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" 
          opacity="0.5" transform="translate(-4, 2)"/>
    
    <!-- Cyan chromatic offset (fragmented) -->
    <path d="M 1264,784 L 1110,610 L 1090,590 L 950,430 L 930,410 L 810,300 L 790,280 L 650,155 L 400,160" 
          stroke="#00ffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" 
          opacity="0.3" transform="translate(4, -2)"/>
    
    <!-- Core red line (fragmented, jagged) -->
    <path d="M 1264,784 L 1130,630 L 1070,570 L 940,420 L 910,390 L 800,290 L 770,260 L 640,150 L 400,160" 
          stroke="#ff1e3c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    
    <!-- Sharp white core (fragmented, jagged) -->
    <path d="M 1264,784 L 1130,630 L 1070,570 L 940,420 L 910,390 L 800,290 L 770,260 L 640,150 L 400,160" 
          stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    
    <!-- Light-blue highlight (fragmented, jagged) -->
    <path d="M 1264,784 L 1130,630 L 1070,570 L 940,420 L 910,390 L 800,290 L 770,260 L 640,150 L 400,160" 
          stroke="#8fb6ff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" 
          opacity="0.6" transform="translate(-2, -1)"/>
  </g>

  <!-- Top label -->
  <text x="64" y="70" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="8" fill="#8fb6ff" font-weight="700">EXPERIMENTAL JAZZ</text>
  <text x="1216" y="70" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="8" fill="#ff4d67" font-weight="700">LATE-NIGHT SERIES</text>

  <!-- Main title: Chromatic Aberration Effect -->
  <!-- BLUE HOUR -->
  <text x="60" y="210" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" letter-spacing="2" fill="url(#blueText)" filter="url(#chromaAberration)">BLUE HOUR</text>
  
  <!-- RED NOISE - Offset baseline for typographic syncopation -->
  <text x="74" y="345" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" letter-spacing="2" fill="url(#redText)" filter="url(#chromaAberrationRed)">RED NOISE</text>

  <!-- Subtitle -->
  <text x="64" y="400" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="300" letter-spacing="4" fill="#e9e2f2">A NIGHT OF IMPROVISED SOUND</text>

  <!-- Divider -->
  <line x1="64" y1="430" x2="360" y2="430" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Info block -->
  <text x="64" y="478" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#f2ecfa" letter-spacing="1">Friday, September 27  &#183;  Doors 7 PM</text>
  <text x="64" y="520" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c9bfe0">The Foundry  &#183;  East River District</text>

  <!-- Featuring Block: Repositioned to bottom-right, staggered vertically to follow diagonal slope -->
  <!-- Creates counter-weight to top-left title -->
  <text x="1216" y="580" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="6" fill="#ff4d67" font-weight="700">FEATURING</text>
  
  <!-- Artist names stepping down in a staircase pattern, right-aligned -->
  <text x="1216" y="625" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Nia Cole Quartet</text>
  <text x="1180" y="670" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#b7c6ff">Static Bloom</text>
  <text x="1140" y="710" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#b7c6ff">Armand Vale</text>

  <!-- Bottom accent bar -->
  <rect x="64" y="744" width="1152" height="4" fill="url(#redText)"/>
  <rect x="64" y="744" width="576" height="4" fill="url(#blueText)"/>
  
  <!-- Final grain overlay to unify production finish -->
  <rect width="1280" height="800" filter="url(#grain)" opacity="0.08" style="mix-blend-mode: overlay;"/>
</svg>