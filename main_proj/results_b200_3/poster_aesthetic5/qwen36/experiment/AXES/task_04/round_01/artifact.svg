<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff3300" />
    </linearGradient>

    <linearGradient id="chaosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff3300" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters -->
    <!-- High quality multi-layered glow -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="core" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="mid" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="25" result="outer" />
      <feMerge>
        <feMergeNode in="outer" />
        <feMergeNode in="mid" />
        <feMergeNode in="core" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Chaos blur for the abstract shapes -->
    <filter id="chaosBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <!-- Grain texture -->
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <!-- Distortion for text/interaction -->
    <filter id="warp" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.01 0.02" numOctaves="2" result="turb" />
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- 1. Visual Concept: Background & Atmosphere -->
  <rect width="1280" height="800" fill="#050505" />
  <!-- Grain Overlay -->
  <rect width="1280" height="800" fill="none" filter="url(#noiseFilter)" opacity="0.15" pointer-events="none" />
  
  <!-- Subtle geometric background lines (Atmosphere) -->
  <g opacity="0.2" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="800" stroke="#00ffff" stroke-dasharray="10,20" />
    <line x1="400" y1="0" x2="400" y2="800" stroke="#00ffff" stroke-dasharray="2,10" opacity="0.5" />
    <line x1="800" y1="0" x2="800" y2="800" stroke="#ff0055" stroke-dasharray="100,50" />
    <line x1="1000" y1="0" x2="1000" y2="800" stroke="#ff0055" stroke-dasharray="5,5" />
  </g>

  <!-- 2. Composition: Abstract Visual Elements -->
  <g opacity="0.9">
    <!-- "Blue Hour": Fluid, sweeping energy on the left -->
    <path d="M -50,150 C 200,150 250,400 100,500 S -50,600 -50,600" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#neonGlow)" stroke-linecap="round" />
    <circle cx="50" cy="150" r="50" fill="#00ffff" opacity="0.3" filter="url(#chaosBlur)" />

    <!-- "Red Noise": Chaotic, aggressive slash interacting with text -->
    <path d="M 600,100 L 650,350 L 550,450 L 850,550 L 1100,300 L 1050,150" 
          fill="none" stroke="url(#redGrad)" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter" filter="url(#chaosBlur)" opacity="0.8" />
    <path d="M 580,120 L 660,360 L 570,460 L 860,560 L 1080,320" 
          fill="none" stroke="#ffffff" stroke-width="2" filter="url(#chaosBlur)" opacity="0.5" />
  </g>

  <!-- 3. Typography: Main Title (Shifted Upper Right, Skewed, Interacting) -->
  <g transform="translate(450, 320)">
    <!-- Text Group with Interaction Filter -->
    <g filter="url(#warp)">
      <!-- BLUE HOUR -->
      <text x="350" y="0" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="110" text-anchor="end" letter-spacing="-2" fill="url(#cyanGrad)" filter="url(#neonGlow)" transform="skewX(-12)">BLUE HOUR</text>
      
      <!-- RED NOISE -->
      <text x="350" y="90" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="110" text-anchor="end" letter-spacing="-2" fill="url(#redGrad)" filter="url(#neonGlow)" transform="skewX(12)">RED NOISE</text>
    </g>
    
    <!-- Subtitle (Cleaner, readable) -->
    <text x="350" y="140" font-family="Courier New, monospace" font-weight="bold" font-size="20" text-anchor="end" fill="#ffffff" letter-spacing="3" opacity="0.9">A NIGHT OF IMPROVISED SOUND</text>
  </g>

  <!-- 4. Composition: Bottom Text Blocks (Ragged Column, Left Side) -->
  <g transform="translate(60, 650)" font-family="Helvetica, Arial, sans-serif" fill="#ffffff">
    
    <!-- Logistics -->
    <text x="0" y="0" font-size="28" font-weight="bold" letter-spacing="1" fill="#00ffff">FRIDAY, SEPTEMBER 27</text>
    <text x="0" y="35" font-size="24" font-weight="normal" fill="#cccccc">Doors 7 PM</text>
    
    <text x="0" y="90" font-size="22" font-weight="bold" fill="#ffffff">THE FOUNDRY</text>
    <text x="0" y="115" font-size="16" font-weight="normal" fill="#888888">EAST RIVER DISTRICT</text>

    <!-- Lineup (Staggered/Ragged flow) -->
    <text x="150" y="0" font-size="14" font-weight="bold" fill="#ff0055" letter-spacing="2">FEATURING</text>
    
    <text x="150" y="45" font-size="28" font-weight="900" fill="#ffffff" transform="skewX(-5)">NIA COLE QUARTET</text>
    <text x="150" y="85" font-size="28" font-weight="900" fill="#ffffff" transform="skewX(3)">STATIC BLOOM</text>
    <text x="150" y="125" font-size="28" font-weight="900" fill="#ffffff" transform="skewX(-2)">ARMAND VALE</text>
  </g>

  <!-- Final Vignette for focus -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
    <stop offset="50%" stop-color="#000000" stop-opacity="0" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
  </radialGradient>
  <rect width="1280" height="800" fill="url(#vignette)" pointer-events="none" />

</svg>