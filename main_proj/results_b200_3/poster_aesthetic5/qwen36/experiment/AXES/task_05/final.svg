<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Sky Gradient: Warm amber/sepia at horizon fading into cold slate blue -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c333e"/> <!-- Deep Cold Slate -->
      <stop offset="45%" stop-color="#4a5568"/> <!-- Transition -->
      <stop offset="100%" stop-color="#d6c8b3"/> <!-- Warm Amber/Desaturated Sepia -->
    </linearGradient>
    
    <!-- Ground Gradient: Cool foreground fading slightly warmer towards horizon -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1520"/> <!-- Deep Dark Blue/Black -->
      <stop offset="100%" stop-color="#3e4a5c"/> <!-- Slate Blue -->
    </linearGradient>

    <!-- Road Gradient: Textured Asphalt feel -->
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3e4a5c"/> <!-- Fades into horizon -->
      <stop offset="100%" stop-color="#05080c"/> <!-- Dark foreground -->
    </linearGradient>

    <!-- Horizon Glow: Warm sepia glow -->
    <radialGradient id="horizonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d6c8b3" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d6c8b3" stop-opacity="0"/>
    </radialGradient>

    <!-- House Fade Gradient: Dissolves into fog (lighter at top to match warm sky) -->
    <linearGradient id="houseFadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6c8b3" stop-opacity="0"/> <!-- Transparent at top -->
      <stop offset="50%" stop-color="#7a8491" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#232f3e" stop-opacity="0.95"/> <!-- Solid at bottom -->
    </linearGradient>

    <!-- Directional Film Grain Filter -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="2.0" intercept="-0.3"/>
        <feFuncG type="linear" slope="2.0" intercept="-0.3"/>
        <feFuncB type="linear" slope="2.0" intercept="-0.3"/>
      </feComponentTransfer>
      <feComponentTransfer>
         <feFuncA type="linear" slope="0.25"/> 
      </feComponentTransfer>
    </filter>

    <filter id="heavyBlur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    
    <!-- Vignette -->
    <radialGradient id="vignetteGrad" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Silhouette Pattern for "Photographic" feel -->
    <filter id="erodedEdge">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- New: Clip path to dissolve text into the landscape -->
    <linearGradient id="textDissolve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="maskTextFade">
      <rect x="0" y="0" width="1280" height="800" fill="url(#textDissolve)" />
    </mask>

  </defs>

  <!-- 1. Background Sky -->
  <rect width="1280" height="800" fill="url(#skyGrad)"/>

  <!-- Horizon Glow -->
  <rect x="200" y="250" width="880" height="350" fill="url(#horizonGlow)" filter="url(#heavyBlur)"/>

  <!-- 2. The Disappearing Town (Ghosts) -->
  <!-- Changed: More complex paths to resemble architectural silhouettes, eroded edges for charcoal look -->
  <g style="mix-blend-mode: multiply;" fill="url(#houseFadeGrad)" filter="url(#erodedEdge)">
    
    <!-- Left Side Ghosts -->
    <g opacity="0.85">
      <!-- Far Left: Broken wall / Chimney hint -->
      <g transform="translate(80, 450)">
        <path d="M0,180 L10,180 L10,100 L30,100 L30,150 L50,120 L70,150 L70,180 Z" />
        <rect x="35" y="60" width="10" height="40" /> 
      </g>
      <!-- Mid Left: Row of houses merging -->
      <g transform="translate(260, 480)">
        <path d="M0,140 L20,140 L20,80 L40,60 L60,90 L80,90 L80,140 Z" />
      </g>
      <!-- Near Left: Taller structure -->
      <g transform="translate(420, 520)">
        <rect width="110" height="160" />
        <polygon points="0,0 55,-60 110,0" />
        <rect x="20" y="40" width="30" height="50" fill="#fff" opacity="0.15"/> <!-- Window reflection -->
      </g>
    </g>

    <!-- Right Side Ghosts -->
    <g opacity="0.85">
       <!-- Far Right -->
       <g transform="translate(1020, 460)">
        <path d="M0,170 L20,170 L20,90 L40,110 L60,110 L60,170 Z" />
      </g>
      <!-- Mid Right -->
      <g transform="translate(860, 490)">
        <rect width="120" height="150" />
        <polygon points="0,0 60,-50 120,0" />
      </g>
      <!-- Near Right -->
      <g transform="translate(720, 530)">
        <rect width="100" height="140" />
        <polygon points="0,0 50,-40 100,0" />
      </g>
    </g>
  </g>

  <!-- 3. Ground / Landscape -->
  <path d="M0,500 Q640,485 1280,500 L1280,800 L0,800 Z" fill="url(#groundGrad)"/>

  <!-- 4. The Road (Leading line) -->
  <path d="M580,500 L700,500 L1150,800 L130,800 Z" fill="url(#roadGrad)"/>
  
  <!-- Road Texture (Using the new directional grain filter on a white overlay) -->
  <path d="M580,500 L700,500 L1150,800 L130,800 Z" fill="#ffffff" filter="url(#noise)" opacity="0.25"/>

  <!-- Road Center Line (Fading) -->
  <line x1="640" y1="500" x2="640" y2="800" stroke="#9ca3af" stroke-width="2" stroke-dasharray="15, 40" opacity="0.3"/>

  <!-- 5. Distant Human Presence -->
  <g transform="translate(640, 560)">
    <circle cx="0" cy="-8" r="2.5" fill="#111"/>
    <rect x="-2.5" y="-6" width="5" height="12" fill="#111"/>
  </g>

  <!-- 6. Typography & Message Integration -->
  <!-- Changed: Title is shifted left, intersects horizon, and fades. Tagline bottom right. -->
  
  <g font-family="Didot, 'Playfair Display', Georgia, serif" fill="#f8fafc">
      
      <!-- Main Title: Upper Left, Intersecting Horizon, Dissolving -->
      <!-- REPAIRED: Reduced font-size from 82 to 68 to fit within boundary rect=[99,331,1422,441] -->
      <text x="100" y="420" font-size="68" font-weight="700" letter-spacing="14" opacity="0.95" mask="url(#maskTextFade)">
        WHERE THE HOUSES END
      </text>
      
      <!-- Tagline: Bottom Right, balancing credits -->
      <text x="1160" y="720" font-size="24" font-style="italic" font-weight="300" letter-spacing="1" opacity="0.9" text-anchor="end">
        Some places disappear twice.
      </text>
      
  </g>

  <!-- Lower Credits: Bottom Left -->
  <g font-family="Georgia, serif" letter-spacing="2">
    <text x="100" y="720" font-size="18" fill="#cbd5e1" opacity="0.85">
      A film by Mara Venn
    </text>
    <text x="100" y="750" font-size="14" fill="#94a3b8" opacity="0.7">
      In selected theatres this winter
    </text>
  </g>

  <!-- 7. Atmospheric Overlays -->
  <!-- Fog/Mist layer to blend houses into sky -->
  <rect x="0" y="300" width="1280" height="300" fill="#94a3b8" opacity="0.15" filter="url(#heavyBlur)" pointer-events="none"/>

  <!-- Vignette -->
  <rect width="1280" height="800" fill="url(#vignetteGrad)" pointer-events="none"/>
  
  <!-- Directional Grain Overlay (applied to whole canvas for depth) -->
  <rect width="1280" height="800" fill="#000" filter="url(#noise)" opacity="0.5" pointer-events="none" style="mix-blend-mode: overlay"/>

</svg>