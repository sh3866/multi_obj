<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Smoke Gradient -->
    <linearGradient id="smokeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1c1917" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#3f3f46" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#78716c" stop-opacity="0" />
    </linearGradient>

    <!-- Fire Gradient -->
    <linearGradient id="fireGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="40%" stop-color="#c2410c" />
      <stop offset="80%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Spark Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="20%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>
    
    <!-- Filters -->
    <filter id="blurSmoke" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" />
    </filter>

    <filter id="glowText" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#skyGrad)" />

  <!-- Smoke Rising (Positioned to not obscure text) -->
  <g filter="url(#blurSmoke)">
    <path d="M 100 800 C 200 400, 1100 200, 1200 -50 C 1300 200, 1200 500, 900 800 Z" fill="url(#smokeGrad)" opacity="0.5" />
  </g>

  <!-- Mountain Silhouettes -->
  <!-- Back Mountain (Darker, more distant) -->
  <path d="M -50 800 L 650 250 L 1400 800 Z" fill="#020617" opacity="0.9" />
  <!-- Front Mountain (Pitch black) -->
  <path d="M 350 800 L 1050 300 L 1400 800 Z" fill="#000000" />

  <!-- The Forest Silhouette (Natural jagged edge) -->
  <path d="M 0 800 
    L 20 785 L 40 765 L 80 785 L 120 745 L 160 765 L 200 725 L 250 745 L 300 705 L 340 725 
    L 380 685 L 420 705 L 460 665 L 500 685 L 540 645 L 580 665 L 620 625 L 660 645 
    L 700 605 L 740 625 L 780 585 L 820 605 L 860 565 L 900 585 L 940 545 L 980 565 
    L 1020 525 L 1060 545 L 1100 505 L 1140 525 L 1180 485 L 1220 505 L 1280 465 
    L 1280 800 Z" fill="#000000" />

  <!-- The Fire Line (Tracing the forest edge) -->
  <g filter="url(#fireGlow)">
    <!-- Flame Body -->
    <path d="M 0 800 
      L 20 785 L 40 765 L 80 785 L 120 745 L 160 765 L 200 725 L 250 745 L 300 705 L 340 725 
      L 380 685 L 420 705 L 460 665 L 500 685 L 540 645 L 580 665 L 620 625 L 660 645 
      L 700 605 L 740 625 L 780 585 L 820 605 L 860 565 L 900 585 L 940 545 L 980 565 
      L 1020 525 L 1060 545 L 1100 505 L 1140 525 L 1180 485 L 1220 505 L 1280 465" 
      fill="none" stroke="url(#fireGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Flame Core -->
    <path d="M 0 800 
      L 20 785 L 40 765 L 80 785 L 120 745 L 160 765 L 200 725 L 250 745 L 300 705 L 340 725 
      L 380 685 L 420 705 L 460 665 L 500 685 L 540 645 L 580 665 L 620 625 L 660 645 
      L 700 605 L 740 625 L 780 585 L 820 605 L 860 565 L 900 585 L 940 545 L 980 565 
      L 1020 525 L 1060 545 L 1100 505 L 1140 525 L 1180 485 L 1220 505 L 1280 465" 
      fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>

  <!-- The Single Spark (Visual Anchor) -->
  <!-- Positioned directly on the fire line around middle-right to draw the eye to the fire -->
  <g transform="translate(820, 600)">
    <!-- Large ambient glow -->
    <circle cx="0" cy="0" r="100" fill="url(#sparkGlow)" opacity="0.8" />
    <!-- Core heat -->
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <circle cx="0" cy="0" r="2" fill="#fef08a" />
    
    <!-- Flying Embers (Directional) -->
    <path d="M 0 0 L 12 -20 Q 8 -25 3 -30 Q -2 -25 -7 -20 Z" fill="#fef08a" />
    <path d="M 0 0 L -20 8 Q -25 3 -30 -2 Q -25 -7 -20 -12 Z" fill="#fef08a" />
    <path d="M 0 0 L 20 12 Q 25 17 30 22 Q 25 27 20 32 Z" fill="#fef08a" />
  </g>

  <!-- Typography Group -->
  <!-- Centered, balanced hierarchy -->
  <g transform="translate(640, 120)">
    
    <!-- Main Headline -->
    <g text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" fill="#ffffff" filter="url(#glowText)">
      <text x="0" y="0" font-size="100" letter-spacing="2">ONE SPARK</text>
      <text x="0" y="100" font-size="100" letter-spacing="2">IS ENOUGH</text>
    </g>

    <!-- Subhead: Actions -->
    <g text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="30" fill="#f8fafc" letter-spacing="0.5" opacity="0.9">
      <text x="0" y="200">Check conditions.</text>
      <text x="0" y="250">Extinguish completely.</text>
      <text x="0" y="300">Protect the wild.</text>
    </g>

    <!-- Footer Area -->
    <g transform="translate(0, 380)">
        <!-- Separator Line -->
        <line x1="-120" y1="-30" x2="120" y2="-30" stroke="#f97316" stroke-width="4" stroke-linecap="round" />
        
        <!-- Footer Brand -->
        <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#94a3b8" text-anchor="middle" letter-spacing="6">
          NATIONAL FOREST SAFETY INITIATIVE
        </text>
    </g>
  </g>

</svg>