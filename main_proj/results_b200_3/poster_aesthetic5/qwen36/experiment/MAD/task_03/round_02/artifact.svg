<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Deep Abyssal Background Gradient: Dark center, slightly lighter periphery -->
    <radialGradient id="abyss-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="60%" stop-color="#020408" />
      <stop offset="100%" stop-color="#0a1224" />
    </radialGradient>

    <!-- Subtle Light Emission Gradient for Bioluminescence -->
    <radialGradient id="bio-glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#00ffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="bio-glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#8a2be2" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for Wireframe Specimen (Sharp, crisp lines) -->
    <filter id="specimen-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Filter for Organic Tendrils (Soft, glowing emission) -->
    <filter id="tendril-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Vignette Mask for Depth -->
    <radialGradient id="vignette-mask" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>
    <mask id="vignette">
      <rect width="100%" height="100%" fill="url(#vignette-mask)" />
    </mask>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="800" fill="url(#abyss-bg)" />

  <!-- Layer 1: Background Abyssal Flora (Faint, in the distance) -->
  <g fill="none" stroke="#00ffff" stroke-width="1" opacity="0.15">
    <path d="M100,800 Q150,600 120,400" />
    <path d="M1100,800 Q1050,600 1080,400" />
  </g>

  <!-- Layer 2: Organic Bioluminescent Tendrils (Behind Text) -->
  <!-- These replace the "red data bars" with organic forms interacting with the void -->
  <g filter="url(#tendril-glow)" opacity="0.7">
    <!-- Left side: Cyan/Teal Stalks -->
    <path d="M 50,800 C 150,650 80,500 200,350" stroke="#00ffff" stroke-width="3" fill="none" />
    <circle cx="200" cy="350" r="4" fill="#ffffff" />
    <circle cx="200" cy="350" r="20" fill="url(#bio-glow-cyan)" />
    
    <path d="M 150,800 C 200,700 250,550 180,450" stroke="#00ffff" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="180" cy="450" r="3" fill="#ffffff" />

    <!-- Right side: Purple/Blue Stalks -->
    <path d="M 1230,800 C 1150,650 1200,500 1080,300" stroke="#8a2be2" stroke-width="3" fill="none" />
    <circle cx="1080" cy="300" r="4" fill="#ffffff" />
    <circle cx="1080" cy="300" r="25" fill="url(#bio-glow-purple)" />
    
    <path d="M 1150,800 C 1100,700 1050,550 1120,450" stroke="#8a2be2" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="1120" cy="450" r="3" fill="#ffffff" />
  </g>

  <!-- Layer 3: Central Wireframe Specimen (The "Scientific Anchor") -->
  <!-- Placed behind the title but overlapping the tendrils to create depth -->
  <g transform="translate(640, 400)" filter="url(#specimen-glow)" opacity="0.6">
    <!-- Outer Contour -->
    <ellipse cx="0" cy="0" rx="180" ry="240" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 4" />
    <ellipse cx="0" cy="0" rx="160" ry="220" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.5" />
    
    <!-- Internal Grid / Anatomy -->
    <line x1="0" y1="-240" x2="0" y2="240" stroke="#ffffff" stroke-width="1" />
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#ffffff" stroke-width="1" />
    
    <path d="M 0,-240 Q -100,0 0,240" fill="none" stroke="#ffffff" stroke-width="0.5" />
    <path d="M 0,-240 Q 100,0 0,240" fill="none" stroke="#ffffff" stroke-width="0.5" />
    
    <!-- Radar Sweep Effect (Simulating scientific observation) -->
    <path d="M 0,0 L 0,-200 A 200 200 0 0 1 141 -141 Z" fill="url(#bio-glow-cyan)" opacity="0.3" />
    
    <!-- Tentacle Traces -->
    <path d="M -50,200 Q -100,300 -150,350" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 6" />
    <path d="M 50,200 Q 100,300 150,350" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 6" />
  </g>

  <!-- Layer 4: Typography (Emerging from the void) -->
  <g text-anchor="middle" font-family="Impact, 'Arial Narrow', Helvetica, sans-serif">
    
    <!-- Main Title: Tall, Condensed, High Contrast -->
    <g transform="translate(640, 260)">
      <text x="0" y="0" font-size="110" font-weight="900" letter-spacing="8" fill="#ffffff">BELOW THE</text>
      <text x="0" y="120" font-size="110" font-weight="900" letter-spacing="8" fill="#ffffff">LAST LIGHT</text>
    </g>

    <!-- Subtitle: Distinct, wider, thinner -->
    <g transform="translate(640, 440)" font-family="Helvetica, Arial, sans-serif">
      <text x="0" y="0" font-size="24" font-weight="300" letter-spacing="10" fill="#aaccff">Life at the edge of the known world</text>
    </g>

    <!-- Divider -->
    <line x1="540" y1="500" x2="740" y2="500" stroke="#ffffff" stroke-width="1" opacity="0.3" />

    <!-- Footer Info -->
    <g transform="translate(640, 580)" font-family="Helvetica, Arial, sans-serif">
      <text x="0" y="0" font-size="20" font-weight="600" letter-spacing="6" fill="#ffffff">SPECIAL EXHIBITION · NOVEMBER 2–MARCH 9</text>
    </g>

    <!-- Museum Name -->
    <g transform="translate(640, 640)" font-family="Helvetica, Arial, sans-serif">
      <text x="0" y="0" font-size="14" font-weight="400" letter-spacing="6" fill="#6699bb">CALDER MUSEUM OF NATURAL HISTORY</text>
    </g>
  </g>

  <!-- Layer 5: Foreground Particulates (Marine Snow) -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="150" cy="200" r="1.5" />
    <circle cx="850" cy="150" r="1" />
    <circle cx="1100" cy="350" r="2" />
    <circle cx="300" cy="650" r="1.5" />
    <circle cx="950" cy="750" r="1" />
    <circle cx="200" cy="700" r="2" />
    <circle cx="1200" cy="600" r="1" />
    <circle cx="640" cy="100" r="1" />
    <circle cx="640" cy="700" r="1.5" />
  </g>

  <!-- Final Vignette Overlay (Enhances the "dark center" effect) -->
  <rect width="1280" height="800" fill="none" stroke="#000" stroke-width="10" opacity="0.5" />
  <rect width="1280" height="800" fill="url(#abyss-bg)" opacity="0.4" pointer-events="none" />

</svg>