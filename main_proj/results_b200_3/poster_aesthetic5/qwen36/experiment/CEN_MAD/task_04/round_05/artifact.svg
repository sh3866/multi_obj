<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradient: Deep Midnight Blue -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0a1526" />
      <stop offset="100%" stop-color="#020205" />
    </radialGradient>

    <!-- Blue Hour Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <!-- Red Noise Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#cc0000" />
    </linearGradient>

    <!-- Filters -->
    <!-- Neon Glow: Soft Diffused Light -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Blue Glow for atmospheric background lines -->
    <filter id="blueSoftGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Noise Texture -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <!-- Distortion Filter for Typography (Signal Interference) -->
    <filter id="neonJitter">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.01" numOctaves="2" result="turbulence" />
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="6" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="800" fill="url(#bgGrad)" />
  
  <!-- Background Grain (Multiply Blend for grit) -->
  <rect width="1280" height="800" fill="#ffffff" filter="url(#grain)" opacity="0.07" style="mix-blend-mode: multiply;" pointer-events="none" />

  <!-- Abstract Visual Elements (Background Layer) - Mix Blend Mode Screen -->
  <g opacity="0.9" style="mix-blend-mode: screen;">
    <!-- Blue Hour: Deep Atmospheric Curves -->
    <path d="M-50,550 C200,450 350,700 600,600 C850,500 1000,800 1300,700" 
          fill="none" stroke="#0033ff" stroke-width="80" opacity="0.3" filter="url(#blueSoftGlow)" />
    
    <!-- Red Noise: Background Low-level interference -->
    <path d="M400,200 L450,400 L500,300 L550,500 L600,400 L650,200 L700,600 L750,300 L800,500 L850,100 L900,400 L950,200 L1000,500 L1050,100 L1100,300 L1150,100 L1200,400 L1280,200" 
          fill="none" stroke="#ff0055" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Main Visual Metaphor: The Collision - Mix Blend Mode Screen -->
  <g style="mix-blend-mode: screen;">
    <!-- The Blue Hour (Foreground Smooth Line) -->
    <path d="M50,450 C250,300 400,600 600,500 C800,400 950,700 1100,550 C1200,480 1280,550 1280,550" 
          fill="none" stroke="#00ffff" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" />
    <!-- Sharp Core -->
    <path d="M50,450 C250,300 400,600 600,500 C800,400 950,700 1100,550 C1200,480 1280,550 1280,550" 
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />

    <!-- The Red Noise (Foreground Aggressive Waveform) -->
    <!-- Warning: High amplitude to intersect typography -->
    <path d="M-20,400 
             L100,350 
             L150,450 
             L200,250 
             L260,550 
             L300,300 
             L380,650 
             L420,200 
             L480,500 
             L530,100 
             L580,400 
             L650,50 
             L700,450 
             L750,150 
             L800,350 
             L860,50 
             L920,250 
             L980,0 
             L1040,150 
             L1100,-50 
             L1160,200 
             L1220,50 
             L1280,250" 
          fill="none" stroke="url(#redGrad)" stroke-width="16" stroke-linejoin="miter" filter="url(#redGlow)" />
          
    <!-- Sharp White Core for Glitch -->
    <path d="M-20,400 L100,350 L150,450 L200,250 L260,550 L300,300 L380,650 L420,200 L480,500 L530,100 L580,400 L650,50 L700,450 L750,150 L800,350 L860,50 L920,250 L980,0 L1040,150 L1100,-50 L1160,200 L1220,50 L1280,250" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="miter" opacity="0.9" />
  </g>

  <!-- Typography: Main Title -->
  <g>
    <!-- BLUE HOUR -->
    <text x="80" y="180" 
          font-family="Impact, 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="140" 
          fill="url(#blueGrad)" 
          filter="url(#neonJitter) url(#neonGlow)" 
          transform="rotate(-3, 80, 180)">BLUE HOUR</text>
          
    <!-- Inner Core for BLUE HOUR -->
    <text x="80" y="180" 
          font-family="Impact, 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="140" 
          fill="#ffffff" 
          opacity="0.9"
          transform="rotate(-3, 80, 180)">BLUE HOUR</text>

    <!-- RED NOISE -->
    <text x="100" y="340" 
          font-family="Impact, 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="140" 
          fill="url(#redGrad)" 
          filter="url(#neonJitter) url(#redGlow)"
          transform="rotate(2, 100, 340)">RED NOISE</text>
          
    <!-- Inner Core for RED NOISE -->
    <text x="100" y="340" 
          font-family="Impact, 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="140" 
          fill="#ffffff" 
          opacity="0.9"
          transform="rotate(2, 100, 340)">RED NOISE</text>

    <!-- Subtitle (Clean Anchor amidst chaos) -->
    <text x="100" y="410" 
          font-family="Courier New, monospace" 
          font-weight="bold" 
          font-size="22" 
          fill="#ffffff" 
          letter-spacing="6"
          opacity="0.9">A NIGHT OF IMPROVISED SOUND</text>
  </g>

  <!-- Compositional Anchor: Unified Bottom Band -->
  <!-- Separation Line (Broken by rotation of elements) -->
  <line x1="60" y1="600" x2="1220" y2="600" stroke="#ffffff" stroke-width="1" opacity="0.2" />

  <g transform="translate(60, 640)" font-family="Arial, sans-serif">
    <!-- Left Column: Logistics -->
    <g>
      <text x="0" y="0" font-size="32" font-weight="900" fill="#00ffff" letter-spacing="1">FRIDAY, SEPTEMBER 27</text>
      <text x="0" y="35" font-size="24" font-weight="bold" fill="#cccccc" letter-spacing="1">Doors 7 PM</text>
      
      <text x="0" y="90" font-size="26" font-weight="bold" fill="#ffffff" letter-spacing="1">THE FOUNDRY</text>
      <text x="0" y="115" font-size="18" font-weight="normal" fill="#00ffff" opacity="0.7" letter-spacing="2">EAST RIVER DISTRICT</text>
    </g>

    <!-- Right Column: Lineup (Rotated and overlapping) -->
    <g transform="translate(800, 0) rotate(-10, 360, 0)">
      <text x="360" y="0" font-size="16" font-weight="bold" fill="#ff0055" text-anchor="end" letter-spacing="3">FEATURING</text>
      
      <text x="360" y="45" font-size="30" font-weight="900" fill="#ffffff" text-anchor="end">NIA COLE QUARTET</text>
      <text x="360" y="80" font-size="30" font-weight="900" fill="#ffffff" text-anchor="end">STATIC BLOOM</text>
      <text x="360" y="115" font-size="30" font-weight="900" fill="#ffffff" text-anchor="end">ARMAND VALE</text>
    </g>
  </g>

</svg>