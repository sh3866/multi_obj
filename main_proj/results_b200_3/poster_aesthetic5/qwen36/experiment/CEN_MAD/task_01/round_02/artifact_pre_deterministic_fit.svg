<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradient: Deep atmospheric night/char -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Mountain Silhouette Gradient -->
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Fire Gradient: White hot core fading to deep red -->
    <linearGradient id="fireGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="20%" stop-color="#b91c1c" />
      <stop offset="60%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Smoke Gradient -->
    <linearGradient id="smokeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#44403c" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#78716c" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a8a29e" stop-opacity="0" />
    </linearGradient>

    <!-- Noise Texture Filter (Charred/Smoky feel) -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15" />
      </feComponentTransfer>
    </filter>

    <!-- Fire Glow Filter -->
    <filter id="fireGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="1.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Text Drop Shadow -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Blur for Smoke -->
    <filter id="blurSmoke" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="800" fill="url(#bgGrad)" />
  
  <!-- Noise Texture Overlay -->
  <rect width="1280" height="800" filter="url(#noise)" opacity="0.5" pointer-events="none" />

  <!-- Mountain Landscape -->
  <g id="landscape">
    <!-- Main Mountain Peak (Background) -->
    <path d="M 0 800 L 450 300 L 750 800 Z" fill="url(#mountainGrad)" opacity="0.8" />
    
    <!-- Secondary Mountain (Foreground) -->
    <path d="M 600 800 L 950 350 L 1280 800 Z" fill="#020617" opacity="0.9" />

    <!-- Forest Ridge Silhouette (Dense Pine Texture) -->
    <!-- This path traces a jagged forest line from bottom-left to top-right, acting as the fire path -->
    <path d="M0 800 L0 750 
             L20 740 L30 755 L40 730 L60 745 L70 710 L90 725 L100 690 L120 705 L130 670 L150 685 L160 650 L180 665 L190 630 L210 645 L220 610 L240 625 L250 590 L270 605 L280 570 L300 585 L310 550 L330 565 L340 530 L360 545 L370 510 L390 525 L400 490 L420 505 L430 470 L450 485 L460 450 L480 465 L490 430 L510 445 L520 410 L540 425 L550 390 L570 405 L580 370 L600 385 L610 350 L630 365 L640 330 L660 345 L670 310 L690 325 L700 290 L720 305 L730 270 L750 285 L760 250 L780 265 L790 230 L810 245 L820 210 L840 225 L850 190 L870 205 L880 170 L900 185 L910 150 L930 165 L940 130 L960 145 L970 110 L990 125 L1000 90 L1020 105 L1030 70 L1050 85 L1060 50 L1080 65 L1090 30 L1110 45 L1120 10 L1140 25 L1150 -10 L1280 -10 L1280 800 Z" 
          fill="#020617" />
  </g>

  <!-- Smoke Rising from the Fire -->
  <g filter="url(#blurSmoke)">
    <!-- Main plume rising from the fire trail -->
    <path d="M 850 200 C 800 100, 950 50, 1000 -50 C 1050 -100, 1150 0, 1200 -50 C 1250 -150, 1200 0, 1100 100 C 1050 150, 950 150, 850 200 Z" fill="url(#smokeGrad)" opacity="0.6" />
    <!-- Secondary smaller plume -->
    <path d="M 600 400 C 550 300, 650 250, 700 150 C 750 50, 850 100, 900 0 L 900 200 Z" fill="url(#smokeGrad)" opacity="0.4" />
  </g>

  <!-- The Fire Line (Organic Ember Trail) -->
  <!-- The fire traces the forest ridge exactly -->
  <g filter="url(#fireGlow)">
    <!-- Outer Fire Layer (Red/Orange) -->
    <path d="M0 750 
             L20 740 L30 755 L40 730 L60 745 L70 710 L90 725 L100 690 L120 705 L130 670 L150 685 L160 650 L180 665 L190 630 L210 645 L220 610 L240 625 L250 590 L270 605 L280 570 L300 585 L310 550 L330 565 L340 530 L360 545 L370 510 L390 525 L400 490 L420 505 L430 470 L450 485 L460 450 L480 465 L490 430 L510 445 L520 410 L540 425 L550 390 L570 405 L580 370 L600 385 L610 350 L630 365 L640 330 L660 345 L670 310 L690 325 L700 290 L720 305 L730 270 L750 285 L760 250 L780 265 L790 230 L810 245 L820 210 L840 225 L850 190 L870 205 L880 170 L900 185 L910 150 L930 165 L940 130 L960 145 L970 110 L990 125 L1000 90 L1020 105 L1030 70 L1050 85 L1060 50 L1080 65 L1090 30 L1110 45 L1120 10 L1140 25 L1150 -10 L1280 -10" 
          fill="none" stroke="url(#fireGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Inner Fire Core (Yellow/White) -->
    <path d="M0 750 
             L20 740 L30 755 L40 730 L60 745 L70 710 L90 725 L100 690 L120 705 L130 670 L150 685 L160 650 L180 665 L190 630 L210 645 L220 610 L240 625 L250 590 L270 605 L280 570 L300 585 L310 550 L330 565 L340 530 L360 545 L370 510 L390 525 L400 490 L420 505 L430 470 L450 485 L460 450 L480 465 L490 430 L510 445 L520 410 L540 425 L550 390 L570 405 L580 370 L600 385 L610 350 L630 365 L640 330 L660 345 L670 310 L690 325 L700 290 L720 305 L730 270 L750 285 L760 250 L780 265 L790 230 L810 245 L820 210 L840 225 L850 190 L870 205 L880 170 L900 185 L910 150 L930 165 L940 130 L960 145 L970 110 L990 125 L1000 90 L1020 105 L1030 70 L1050 85 L1060 50 L1080 65 L1090 30 L1110 45 L1120 10 L1140 25 L1150 -10 L1280 -10" 
          fill="none" stroke="#fef08a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>

  <!-- The Single Spark (Visual Metaphor) -->
  <!-- Positioned at the start of the fire line (bottom left) -->
  <g transform="translate(100, 690)">
    <circle cx="0" cy="0" r="20" fill="#fef08a" filter="url(#fireGlow)" opacity="0.8" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
    <!-- Spark trail -->
    <path d="M0 0 Q -15 15 -30 10 Q -25 -5 0 0" fill="#fef08a" />
  </g>

  <!-- Typography Group (Diagonal Layout) -->
  <g filter="url(#textShadow)">
    
    <!-- Headline: Anchored Top Left -->
    <text x="64" y="160" font-family="Impact, 'Arial Black', Helvetica, sans-serif" font-weight="900" font-size="110" fill="#ffffff" letter-spacing="1" style="text-transform: uppercase;">
      <tspan x="0" dy="0">ONE SPARK</tspan>
      <tspan x="0" dy="100">IS ENOUGH</tspan>
    </text>

    <!-- Body Text: Anchored Lower Right (Counter-weight) -->
    <!-- Placed over the dark foreground mountain for maximum contrast -->
    <!-- REPAIRED: Adjusted x, y, and dy values to ensure all text fits within the 1264x boundary -->
    <text x="1248" y="645" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="32" fill="#f8fafc" text-anchor="end" letter-spacing="0.5">
      <tspan x="0" dy="0">Check conditions.</tspan>
      <tspan x="0" dy="45">Extinguish completely.</tspan>
      <tspan x="0" dy="45">Protect the wild.</tspan>
    </text>

    <!-- Branding: Bottom Right alignment -->
    <text x="1248" y="765" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#94a3b8" text-anchor="end" letter-spacing="4">
      NATIONAL FOREST SAFETY INITIATIVE
    </text>

    <!-- Decorative Element: Safety Separator under branding -->
    <line x1="1068" y1="781" x2="1248" y2="781" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />
  </g>

</svg>