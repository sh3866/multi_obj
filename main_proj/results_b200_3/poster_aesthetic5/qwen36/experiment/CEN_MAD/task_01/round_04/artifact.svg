<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradient: Deep atmospheric night/char -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"></stop>
      <stop offset="50%" stop-color="#0f172a"></stop>
      <stop offset="100%" stop-color="#020617"></stop>
    </linearGradient>

    <!-- Mountain Silhouette Gradient -->
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"></stop>
      <stop offset="100%" stop-color="#020617"></stop>
    </linearGradient>

    <!-- Fire Gradient: White hot core fading to deep red -->
    <linearGradient id="fireGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f1d1d"></stop>
      <stop offset="20%" stop-color="#b91c1c"></stop>
      <stop offset="60%" stop-color="#ea580c"></stop>
      <stop offset="100%" stop-color="#fef08a"></stop>
    </linearGradient>

    <!-- Smoke Gradient -->
    <linearGradient id="smokeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#44403c" stop-opacity="0.8"></stop>
      <stop offset="50%" stop-color="#78716c" stop-opacity="0.3"></stop>
      <stop offset="100%" stop-color="#a8a29e" stop-opacity="0"></stop>
    </linearGradient>

    <!-- Noise Texture Filter (Charred/Smoky feel) -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12"></feFuncA>
      </feComponentTransfer>
    </filter>

    <!-- Fire Glow Filter -->
    <filter id="fireGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"></feGaussianBlur>
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="1.5"></feFuncA>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <!-- Text Drop Shadow -->
    <filter id="textShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"></feDropShadow>
    </filter>

    <!-- Blur for Smoke -->
    <filter id="blurSmoke" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35"></feGaussianBlur>
    </filter>

    <!-- Clip path for the fire line to keep it within the tree texture -->
    <clipPath id="treeClip">
      <!-- The jagged forest line, extending slightly off canvas to catch the full stroke -->
      <path d="M-50 850 L-50 750 L20 740 L30 755 L40 730 L60 745 L70 710 L90 725 L100 690 L120 705 L130 670 L150 685 L160 650 L180 665 L190 630 L210 645 L220 610 L240 625 L250 590 L270 605 L280 570 L300 585 L310 550 L330 565 L340 530 L360 545 L370 510 L390 525 L400 490 L420 505 L430 470 L450 485 L460 450 L480 465 L490 430 L510 445 L520 410 L540 425 L550 390 L570 405 L580 370 L600 385 L610 350 L630 365 L640 330 L660 345 L670 310 L690 325 L700 290 L720 305 L730 270 L750 285 L760 250 L780 265 L790 230 L810 245 L820 210 L840 225 L850 190 L870 205 L880 170 L900 185 L910 150 L930 165 L940 130 L960 145 L970 110 L990 125 L1000 90 L1020 105 L1030 70 L1050 85 L1060 50 L1080 65 L1090 30 L1110 45 L1120 10 L1140 25 L1150 -10 L1280 -10 L1280 850 Z"></path>
    </clipPath>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="800" fill="url(#bgGrad)"></rect>
  
  <!-- Noise Texture Overlay -->
  <rect width="1280" height="800" filter="url(#noise)" opacity="0.6" pointer-events="none"></rect>

  <!-- Mountain Landscape -->
  <g id="landscape">
    <!-- Main Mountain Peak (Background) -->
    <path d="M -50 850 L 450 300 L 800 850 Z" fill="url(#mountainGrad)" opacity="0.6"></path>
    
    <!-- Secondary Mountain (Foreground - Darker, lower contrast) -->
    <path d="M 600 850 L 950 350 L 1350 850 Z" fill="#020617" opacity="0.8"></path>

    <!-- Forest Ridge Silhouette (Dense Pine Texture) - Acts as the mask for the fire -->
    <!-- Filled with slightly lighter charcoal to blend with bg, or pure dark if preferred -->
    <path d="M-50 850 L-50 750 L20 740 L30 755 L40 730 L60 745 L70 710 L90 725 L100 690 L120 705 L130 670 L150 685 L160 650 L180 665 L190 630 L210 645 L220 610 L240 625 L250 590 L270 605 L280 570 L300 585 L310 550 L330 565 L340 530 L360 545 L370 510 L390 525 L400 490 L420 505 L430 470 L450 485 L460 450 L480 465 L490 430 L510 445 L520 410 L540 425 L550 390 L570 405 L580 370 L600 385 L610 350 L630 365 L640 330 L660 345 L670 310 L690 325 L700 290 L720 305 L730 270 L750 285 L760 250 L780 265 L790 230 L810 245 L820 210 L840 225 L850 190 L870 205 L880 170 L900 185 L910 150 L930 165 L940 130 L960 145 L970 110 L990 125 L1000 90 L1020 105 L1030 70 L1050 85 L1060 50 L1080 65 L1090 30 L1110 45 L1120 10 L1140 25 L1150 -10 L1280 -10 L1280 850 Z" fill="#020617"></path>
  </g>

  <!-- Smoke Rising from the Fire -->
  <g filter="url(#blurSmoke)">
    <!-- Main plume rising from the fire trail -->
    <path d="M 850 200 C 800 100, 950 50, 1000 -50 C 1050 -100, 1150 0, 1200 -50 C 1250 -150, 1200 0, 1100 100 C 1050 150, 950 150, 850 200 Z" fill="url(#smokeGrad)" opacity="0.7"></path>
    <!-- Secondary smaller plume -->
    <path d="M 600 400 C 550 300, 650 250, 700 150 C 750 50, 850 100, 900 0 L 900 200 Z" fill="url(#smokeGrad)" opacity="0.5"></path>
  </g>

  <!-- The Fire Line (Organic Ember Trail) -->
  <!-- Clipped to fit perfectly inside the tree line shape -->
  <g clip-path="url(#treeClip)">
    <g filter="url(#fireGlow)">
      <!-- Outer Fire Layer (Red/Orange) -->
      <!-- Slightly wider to create a glow effect -->
      <path d="M-50 750 L20 740 L30 755 L40 730 L60 745 L70 710 L90 725 L100 690 L120 705 L130 670 L150 685 L160 650 L180 665 L190 630 L210 645 L220 610 L240 625 L250 590 L270 605 L280 570 L300 585 L310 550 L330 565 L340 530 L360 545 L370 510 L390 525 L400 490 L420 505 L430 470 L450 485 L460 450 L480 465 L490 430 L510 445 L520 410 L540 425 L550 390 L570 405 L580 370 L600 385 L610 350 L630 365 L640 330 L660 345 L670 310 L690 325 L700 290 L720 305 L730 270 L750 285 L760 250 L780 265 L790 230 L810 245 L820 210 L840 225 L850 190 L870 205 L880 170 L900 185 L910 150 L930 165 L940 130 L960 145 L970 110 L990 125 L1000 90 L1020 105 L1030 70 L1050 85 L1060 50 L1080 65 L1090 30 L1110 45 L1120 10 L1140 25 L1150 -10 L1280 -10" fill="none" stroke="url(#fireGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"></path>
      
      <!-- Inner Fire Core (Yellow/White) -->
      <path d="M-50 750 L20 740 L30 755 L40 730 L60 745 L70 710 L90 725 L100 690 L120 705 L130 670 L150 685 L160 650 L180 665 L190 630 L210 645 L220 610 L240 625 L250 590 L270 605 L280 570 L300 585 L310 550 L330 565 L340 530 L360 545 L370 510 L390 525 L400 490 L420 505 L430 470 L450 485 L460 450 L480 465 L490 430 L510 445 L520 410 L540 425 L550 390 L570 405 L580 370 L600 385 L610 350 L630 365 L640 330 L660 345 L670 310 L690 325 L700 290 L720 305 L730 270 L750 285 L760 250 L780 265 L790 230 L810 245 L820 210 L840 225 L850 190 L870 205 L880 170 L900 185 L910 150 L930 165 L940 130 L960 145 L970 110 L990 125 L1000 90 L1020 105 L1030 70 L1050 85 L1060 50 L1080 65 L1090 30 L1110 45 L1120 10 L1140 25 L1150 -10 L1280 -10" fill="none" stroke="#fef08a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"></path>
    </g>
  </g>

  <!-- The Single Spark (Visual Metaphor) -->
  <!-- Positioned at the start of the fire line (bottom left) -->
  <g transform="translate(100, 690)">
    <circle cx="0" cy="0" r="20" fill="#fef08a" filter="url(#fireGlow)" opacity="0.8"></circle>
    <circle cx="0" cy="0" r="5" fill="#ffffff"></circle>
    <!-- Spark trail -->
    <path d="M0 0 Q -15 15 -30 10 Q -25 -5 0 0" fill="#fef08a"></path>
  </g>

  <!-- Typography Group (Diagonal Layout) -->
  <g filter="url(#textShadow)">
    
    <!-- Headline: Anchored Top Left, Tall Condensed Style -->
    <g transform="translate(16 0)"><text x="64" y="190" font-family="Impact, 'Arial Black', Helvetica, sans-serif" font-weight="900" font-stretch="ultra-condensed" font-size="140" fill="#ffffff" letter-spacing="2" style="text-transform: uppercase;">
      <tspan x="0" dy="0">ONE SPARK</tspan>
      <tspan x="0" dy="120">IS ENOUGH</tspan>
    </text></g>

    <!-- Body Text: Anchored Lower Right (Counter-weight) -->
    <!-- Placed over the dark foreground mountain for maximum contrast -->
    <!-- Moved up by 15px (y=665) and reduced font size to 28 to fix bottom overflow -->
    <g transform="translate(338.15625 0)"><text x="1180" y="665" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="28" fill="#f8fafc" text-anchor="end" letter-spacing="0.5">
      <tspan x="0" dy="0">Check conditions.</tspan>
      <tspan x="0" dy="38">Extinguish completely.</tspan>
      <tspan x="0" dy="38">Protect the wild.</tspan>
    </text></g>

    <!-- Branding: Bottom Right alignment -->
    <!-- Moved up to y=765 to ensure it fits within the 784 boundary -->
    <text x="1180" y="765" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#94a3b8" text-anchor="end" letter-spacing="4">
      NATIONAL FOREST SAFETY INITIATIVE
    </text>

    <!-- Decorative Element: Safety Separator under branding -->
    <!-- Moved up to y=780 to match text alignment -->
    <line x1="1000" y1="780" x2="1180" y2="780" stroke="#ea580c" stroke-width="4" stroke-linecap="round"></line>
  </g>

</svg>