<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0611"/>
      <stop offset="0.5" stop-color="#120a1e"/>
      <stop offset="1" stop-color="#050308"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#1a3a9e" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0b0611" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2f4f" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#a5122c" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#050308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d67"/>
      <stop offset="1" stop-color="#ff1e3c"/>
    </linearGradient>
    <linearGradient id="blueText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb6ff"/>
      <stop offset="1" stop-color="#4a7dff"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="linear" slope="0.18" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.012" numOctaves="2" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="blurHeavy" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="blurMed" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="distress" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="riso" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.15" numOctaves="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="risoHeavy" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="orbDistort" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="25" xChannelSelector="R" yChannelSelector="G"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3" result="g"/>
      <feColorMatrix in="g" type="saturate" values="0" result="mg"/>
      <feComponentTransfer in="mg">
        <feFuncA type="linear" slope="0.5" intercept="0"/>
      </feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="waveDistort" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="15" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="printTexture" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="linear" slope="0.08" intercept="0"/>
      </feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="sharpDistort" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="20" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="halftone" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="discrete" tableValues="0 0 0 0 0 0 0 0.3"/>
      </feComponentTransfer>
    </filter>
    <filter id="textBreak" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Grain texture overlay -->
  <rect width="1280" height="800" filter="url(#grain)" opacity="0.25"/>

  <!-- Halftone pattern for late-night atmosphere -->
  <rect width="1280" height="800" filter="url(#halftone)" opacity="0.12"/>

  <!-- Atmospheric glow - sharp and deliberate -->
  <ellipse cx="320" cy="280" rx="350" ry="280" fill="url(#blueGlow)" filter="url(#soft)" opacity="0.8"/>
  <ellipse cx="980" cy="520" rx="380" ry="300" fill="url(#redGlow)" filter="url(#soft)" opacity="0.7"/>

  <!-- Abstract fragmented shapes - interruption and syncopation -->
  <g opacity="0.85">
    <!-- Sharp geometric fragments - blue -->
    <polygon points="180,120 220,140 200,180 160,160" fill="#4a7dff" opacity="0.7" filter="url(#sharpDistort)"/>
    <polygon points="420,80 480,100 460,150 400,130" fill="#4a7dff" opacity="0.6" filter="url(#sharpDistort)"/>
    <polygon points="780,60 850,90 820,140 750,110" fill="#4a7dff" opacity="0.65" filter="url(#sharpDistort)"/>
    <polygon points="1050,100 1120,130 1090,180 1020,150" fill="#4a7dff" opacity="0.7" filter="url(#sharpDistort)"/>
    
    <!-- Sharp geometric fragments - red -->
    <polygon points="250,650 310,680 280,730 220,700" fill="#ff2f4f" opacity="0.7" filter="url(#sharpDistort)"/>
    <polygon points="580,680 650,710 620,760 550,730" fill="#ff2f4f" opacity="0.65" filter="url(#sharpDistort)"/>
    <polygon points="900,650 970,680 940,730 870,700" fill="#ff2f4f" opacity="0.7" filter="url(#sharpDistort)"/>
    <polygon points="1150,700 1220,730 1190,780 1120,750" fill="#ff2f4f" opacity="0.6" filter="url(#sharpDistort)"/>
    
    <!-- Chaotic brushstroke-like shapes -->
    <path d="M 100 300 Q 200 250 300 320 Q 400 390 500 280 L 520 300 Q 420 410 320 340 Q 220 270 120 320 Z" fill="#4a7dff" opacity="0.5" filter="url(#sharpDistort)"/>
    <path d="M 700 550 Q 800 500 900 570 Q 1000 640 1100 530 L 1120 550 Q 1020 660 920 590 Q 820 520 720 570 Z" fill="#ff2f4f" opacity="0.5" filter="url(#sharpDistort)"/>
    
    <!-- Diagonal interruption lines -->
    <line x1="50" y1="400" x2="350" y2="350" stroke="#4a7dff" stroke-width="3" opacity="0.6" filter="url(#sharpDistort)"/>
    <line x1="900" y1="200" x2="1200" y2="250" stroke="#ff2f4f" stroke-width="3" opacity="0.6" filter="url(#sharpDistort)"/>
    <line x1="200" y1="700" x2="500" y2="650" stroke="#4a7dff" stroke-width="2" opacity="0.5" filter="url(#sharpDistort)"/>
    <line x1="700" y1="750" x2="1000" y2="700" stroke="#ff2f4f" stroke-width="2" opacity="0.5" filter="url(#sharpDistort)"/>
  </g>

  <!-- Top label -->
  <text x="64" y="70" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="8" fill="#8fb6ff" font-weight="700" filter="url(#riso)">EXPERIMENTAL JAZZ</text>
  <text x="1216" y="70" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="8" fill="#ff4d67" font-weight="700" filter="url(#riso)">LATE-NIGHT SERIES</text>

  <!-- Main title - asymmetric, expressive, overlapping -->
  <!-- BLUE HOUR - shifted left, larger, with break effect -->
  <text x="80" y="220" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="900" letter-spacing="-2" fill="url(#blueText)" filter="url(#textBreak)">BLUE</text>
  <text x="480" y="200" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="900" letter-spacing="-2" fill="url(#blueText)" filter="url(#textBreak)">HOUR</text>
  
  <!-- RED NOISE - shifted right, overlapping, with break effect -->
  <text x="350" y="380" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="900" letter-spacing="-2" fill="url(#redText)" filter="url(#textBreak)">RED</text>
  <text x="750" y="360" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="900" letter-spacing="-2" fill="url(#redText)" filter="url(#textBreak)">NOISE</text>
  
  <!-- Echo/ghost text for depth -->
  <text x="85" y="225" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="900" letter-spacing="-2" fill="#4a7dff" opacity="0.15" filter="url(#textBreak)">BLUE</text>
  <text x="485" y="205" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="900" letter-spacing="-2" fill="#4a7dff" opacity="0.15" filter="url(#textBreak)">HOUR</text>
  <text x="355" y="385" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="900" letter-spacing="-2" fill="#ff2f4f" opacity="0.15" filter="url(#textBreak)">RED</text>
  <text x="755" y="365" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="900" letter-spacing="-2" fill="#ff2f4f" opacity="0.15" filter="url(#textBreak)">NOISE</text>

  <!-- Subtitle - shifted, expressive -->
  <text x="200" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-style="italic" fill="#e9e2f2" filter="url(#riso)" transform="rotate(-2 200 450)">A night of improvised sound</text>

  <!-- Info block - asymmetric layout -->
  <text x="120" y="520" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#f2ecfa" letter-spacing="1" filter="url(#riso)">Friday, September 27</text>
  <text x="580" y="520" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#f2ecfa" letter-spacing="1" filter="url(#riso)">Doors 7 PM</text>
  <text x="120" y="560" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#c9bfe0" filter="url(#riso)">The Foundry</text>
  <text x="420" y="560" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#c9bfe0" filter="url(#riso)">East River District</text>

  <!-- Featuring - asymmetric, performers support the visual -->
  <text x="120" y="630" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="6" fill="#ff4d67" font-weight="700" filter="url(#riso)">FEATURING</text>
  
  <text x="120" y="680" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#ffffff" filter="url(#riso)">Nia Cole Quartet</text>
  <text x="580" y="680" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#b7c6ff" filter="url(#riso)">Static Bloom</text>
  <text x="900" y="680" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#b7c6ff" filter="url(#riso)">Armand Vale</text>

  <!-- Bottom accent bar - broken, irregular, asymmetric -->
  <rect x="100" y="750" width="180" height="5" fill="url(#blueText)" filter="url(#riso)" transform="rotate(-1 190 752)"/>
  <rect x="320" y="755" width="150" height="4" fill="url(#redText)" filter="url(#riso)" transform="rotate(1 395 757)"/>
  <rect x="510" y="748" width="200" height="6" fill="url(#blueText)" filter="url(#riso)" transform="rotate(-2 610 751)"/>
  <rect x="750" y="753" width="160" height="4" fill="url(#redText)" filter="url(#riso)" transform="rotate(1 830 755)"/>
  <rect x="950" y="749" width="180" height="5" fill="url(#blueText)" filter="url(#riso)" transform="rotate(-1 1040 751)"/>

  <!-- Additional texture: scattered print artifacts -->
  <g opacity="0.18">
    <circle cx="180" cy="180" r="3" fill="#ffffff"/>
    <circle cx="420" cy="250" r="2" fill="#ffffff"/>
    <circle cx="680" cy="180" r="2.5" fill="#ffffff"/>
    <circle cx="940" cy="220" r="2" fill="#ffffff"/>
    <circle cx="1100" cy="180" r="3" fill="#ffffff"/>
    <circle cx="280" cy="600" r="2" fill="#ffffff"/>
    <circle cx="540" cy="650" r="2.5" fill="#ffffff"/>
    <circle cx="800" cy="680" r="2" fill="#ffffff"/>
    <circle cx="1050" cy="650" r="3" fill="#ffffff"/>
    <circle cx="150" cy="450" r="2" fill="#ffffff"/>
    <circle cx="1150" cy="450" r="2" fill="#ffffff"/>
  </g>
</svg>