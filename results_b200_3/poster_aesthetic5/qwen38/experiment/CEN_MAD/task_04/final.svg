<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0611"/>
      <stop offset="0.5" stop-color="#120a1e"/>
      <stop offset="1" stop-color="#050308"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#1a3a9e" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0b0611" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2a45" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#c41e3a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#050308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d67"/>
      <stop offset="1" stop-color="#ff1e3c"/>
    </linearGradient>
    <linearGradient id="blueText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb6ff"/>
      <stop offset="1" stop-color="#4a7dff"/>
    </linearGradient>
    <linearGradient id="redWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a45"/>
      <stop offset="1" stop-color="#c41e3a"/>
    </linearGradient>
    <linearGradient id="blueWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a9aff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <linearGradient id="blueWaveBright" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9bbfff"/>
      <stop offset="0.5" stop-color="#4a7dff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <filter id="blueGrain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
      <feComponentTransfer in="grayNoise" result="alphaNoise">
        <feFuncA type="linear" slope="0.15" intercept="0"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="alphaNoise" operator="in" result="masked"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="masked"/>
      </feMerge>
    </filter>
    <filter id="blueSharp" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="redNoiseDistort" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.03 0.15" numOctaves="3" seed="42" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="18" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
    <filter id="waveDistort" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08 0.25" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="waveDistortStrong" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.04 0.12" numOctaves="3" seed="99" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="25" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="waveDistortExtreme" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="turbulence" baseFrequency="0.02 0.08" numOctaves="4" seed="13" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="35" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="breakGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .screen-blend { mix-blend-mode: screen; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Atmospheric glows - screen blend, enhanced red -->
  <ellipse class="screen-blend" cx="980" cy="580" rx="420" ry="340" fill="url(#redGlow)" filter="url(#soft)" opacity="0.85"/>
  <ellipse class="screen-blend" cx="340" cy="220" rx="360" ry="280" fill="url(#blueGlow)" filter="url(#soft)" opacity="0.75"/>

  <!-- Subtle rhythm grid -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <line x1="60" y1="120" x2="1220" y2="120"/>
    <line x1="60" y1="220" x2="1220" y2="220"/>
    <line x1="60" y1="320" x2="1220" y2="320"/>
    <line x1="60" y1="420" x2="1220" y2="420"/>
    <line x1="60" y1="520" x2="1220" y2="520"/>
    <line x1="60" y1="620" x2="1220" y2="620"/>
    <line x1="60" y1="720" x2="1220" y2="720"/>
  </g>

  <!-- Grain overlay -->
  <rect width="1280" height="800" filter="url(#grain)" opacity="0.04"/>

  <!-- Top labels -->
  <text x="64" y="70" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="8" fill="#8fb6ff" font-weight="700">EXPERIMENTAL JAZZ</text>
  <text x="1216" y="70" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="8" fill="#ff4d67" font-weight="700">LATE-NIGHT SERIES</text>

  <!-- LEFT VERTICAL SPINE -->
  <line x1="64" y1="100" x2="64" y2="740" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Main title: BLUE HOUR - clean, geometric, grain texture -->
  <g filter="url(#blueGrain)" transform="skewX(-2)">
    <text x="60" y="210" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#blueText)">B</text>
    <text x="155" y="195" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#blueText)">L</text>
    <text x="210" y="215" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#blueText)">U</text>
    <text x="310" y="200" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#blueText)">E</text>
    <text x="480" y="190" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#blueText)">H</text>
    <text x="580" y="220" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#blueText)">O</text>
    <text x="680" y="205" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#blueText)">U</text>
    <text x="780" y="195" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#blueText)">R</text>
  </g>

  <!-- Main title: RED NOISE - organic distortion -->
  <g filter="url(#redNoiseDistort)">
    <text x="60" y="350" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)">R</text>
    <text x="165" y="335" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)">E</text>
    <text x="265" y="355" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)">D</text>
    <text x="430" y="340" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)">N</text>
    <text x="545" y="365" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)">O</text>
    <text x="650" y="345" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)">I</text>
    <text x="700" y="358" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)">S</text>
    <text x="780" y="340" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="url(#redText)">E</text>
  </g>

  <!-- Subtitle -->
  <text x="80" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#e9e2f2">A night of improvised sound</text>

  <!-- Divider -->
  <line x1="100" y1="440" x2="380" y2="440" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Info block - syncopated jitter -->
  <text x="118" y="485" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#f2ecfa" letter-spacing="1">Friday, September 27 &#183; Doors 7 PM</text>
  <text x="142" y="530" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c9bfe0">The Foundry &#183; East River District</text>

  <!-- FEATURING - anchored to left spine -->
  <text x="64" y="580" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="6" fill="#ff4d67" font-weight="700">FEATURING</text>
  
  <!-- Performers - increased tracking for airy late-night feel -->
  <text x="64" y="625" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="3">Nia Cole Quartet</text>
  <text x="180" y="665" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#b7c6ff" letter-spacing="4">Static Bloom</text>
  <text x="120" y="705" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#b7c6ff" letter-spacing="4">Armand Vale</text>

  <!-- Bottom accent bar -->
  <rect x="64" y="744" width="1152" height="4" fill="url(#redText)"/>
  <rect x="64" y="744" width="576" height="4" fill="url(#blueText)"/>

  <!-- BACKGROUND WAVEFORMS - subtle texture -->
  <g class="screen-blend" filter="url(#waveDistort)" opacity="0.18">
    <path d="M 60 300 L 110 298 L 135 270 L 158 330 L 175 285 L 195 315 L 230 302 L 270 255 L 310 350 L 345 275 L 385 325 L 430 298 L 480 305 L 505 265 L 530 340 L 555 280 L 575 320 L 615 302 L 670 295 L 695 260 L 715 335 L 740 280 L 760 315 L 800 298 L 850 310 L 875 270 L 895 330 L 915 280 L 935 320 L 975 305 L 1020 290 L 1045 265 L 1065 335 L 1085 280 L 1105 320 L 1145 310 L 1180 280 L 1200 265 L 1220 310 L 1240 285 L 1260 320 L 1280 300" fill="none" stroke="#4a7dff" stroke-width="2" stroke-linejoin="miter" stroke-linecap="round"/>
  </g>
  <g class="screen-blend" filter="url(#waveDistort)" opacity="0.15">
    <path d="M 60 335 L 120 330 L 145 310 L 168 355 L 188 325 L 215 340 L 260 335 L 305 360 L 335 295 L 365 325 L 405 330 L 455 340 L 480 310 L 505 355 L 530 320 L 560 335 L 620 325 L 645 300 L 665 350 L 690 320 L 720 330 L 780 340 L 805 310 L 825 350 L 845 320 L 875 335 L 930 320 L 955 300 L 975 350 L 995 320 L 1025 335 L 1080 310 L 1105 295 L 1125 345 L 1145 315 L 1175 340 L 1210 360 L 1240 330 L 1260 350" fill="none" stroke="url(#redWave)" stroke-width="2" stroke-linejoin="miter" stroke-linecap="round"/>
  </g>

  <!-- FOREGROUND WAVEFORMS -->
  
  <!-- BLUE WAVE - thick, stable, dominant signal -->
  <g class="screen-blend" filter="url(#waveDistortStrong)" opacity="0.9">
    <path d="M 40 320 L 90 318 L 140 322 L 190 316 L 240 324 L 290 314 L 340 326 L 390 318 L 440 322 L 490 314 L 540 326 L 590 316 L 640 324 L 690 318 L 740 322 L 790 314 L 840 326 L 890 316 L 940 324 L 990 318 L 1040 322 L 1090 314 L 1140 326 L 1190 316 L 1240 324 L 1280 318" 
          fill="none" stroke="url(#blueWaveBright)" stroke-width="8" stroke-linejoin="miter" stroke-linecap="round"/>
  </g>
  
  <!-- RED WAVE - thin, erratic, high-frequency, wraps to bottom-right -->
  <g class="screen-blend" filter="url(#waveDistortExtreme)" opacity="0.8">
    <path d="M 40 360 L 65 340 L 90 385 L 115 320 L 140 410 L 165 280 L 190 450 L 215 260 L 240 480 L 265 240 L 290 510 L 315 220 L 340 540 L 365 200 L 390 570 L 415 180 L 440 600 L 465 160 L 490 630 L 515 140 L 540 660 L 565 120 L 590 690 L 615 100 L 640 720 L 665 80 L 690 750 L 715 60 L 740 780 L 765 40 L 790 800 L 815 20 L 840 816 L 865 0 L 890 816 L 915 20 L 940 800 L 965 40 L 990 780 L 1015 60 L 1040 750 L 1065 80 L 1090 720 L 1115 100 L 1140 690 L 1165 120 L 1190 660 L 1215 140 L 1240 630 L 1265 160 L 1280 600" 
          fill="none" stroke="url(#redWave)" stroke-width="3.5" stroke-linejoin="miter" stroke-linecap="round"/>
    <!-- Discontinuities for syncopation -->
    <path d="M 265 240 L 290 510" fill="none" stroke="url(#redWave)" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 515 140 L 540 660" fill="none" stroke="url(#redWave)" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 765 40 L 790 800" fill="none" stroke="url(#redWave)" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 1015 60 L 1040 750" fill="none" stroke="url(#redWave)" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- CENTRAL BREAK / SPIKE - focal anchor -->
  <g class="screen-blend" filter="url(#breakGlow)" opacity="0.95">
    <!-- Violent vertical spike at center -->
    <path d="M 640 180 L 635 220 L 645 260 L 630 300 L 650 340 L 625 380 L 655 420 L 620 460 L 660 500 L 615 540 L 665 580 L 610 620 L 670 660 L 605 700 L 675 740" 
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="miter"/>
    <!-- Blue spike extension -->
    <path d="M 640 180 L 620 150 L 600 120 L 580 90 L 560 60" 
          fill="none" stroke="url(#blueWaveBright)" stroke-width="5" stroke-linecap="round" stroke-linejoin="miter" opacity="0.8"/>
    <!-- Red spike extension -->
    <path d="M 640 180 L 660 150 L 680 120 L 700 90 L 720 60" 
          fill="none" stroke="url(#redWave)" stroke-width="5" stroke-linecap="round" stroke-linejoin="miter" opacity="0.8"/>
    <!-- Impact burst -->
    <circle cx="640" cy="320" r="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <circle cx="640" cy="320" r="30" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Additional aggressive red scratch cutting through -->
  <g class="screen-blend" filter="url(#waveDistortStrong)" opacity="0.5">
    <path d="M 180 650 L 280 520 L 340 480 L 420 380 L 480 340 L 560 250 L 640 180 L 720 120"
          fill="none" stroke="#c41e3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="miter"/>
    <path d="M 740 105 L 790 70 L 830 55"
          fill="none" stroke="#c41e3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="miter" opacity="0.7"/>
    <path d="M 860 45 L 900 25 L 930 18"
          fill="none" stroke="#c41e3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="miter" opacity="0.5"/>
  </g>
</svg>