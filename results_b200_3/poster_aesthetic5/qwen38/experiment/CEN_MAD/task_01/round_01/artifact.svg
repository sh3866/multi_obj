<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17100b"/>
      <stop offset="0.4" stop-color="#3a2013"/>
      <stop offset="0.66" stop-color="#8a3f1e"/>
      <stop offset="0.85" stop-color="#d07a34"/>
      <stop offset="1" stop-color="#f4c46a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6dd" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ffce7d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffce7d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4a34"/>
      <stop offset="1" stop-color="#432a20"/>
    </linearGradient>
    <linearGradient id="mMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c2519"/>
      <stop offset="1" stop-color="#20130d"/>
    </linearGradient>
    <linearGradient id="mNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241409"/>
      <stop offset="1" stop-color="#0b0603"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5a1a"/>
      <stop offset="0.5" stop-color="#ff9d2e"/>
      <stop offset="1" stop-color="#ffe489"/>
    </linearGradient>
    <linearGradient id="fireInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff9d2e"/>
      <stop offset="0.5" stop-color="#ffce7d"/>
      <stop offset="1" stop-color="#fff6dd"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a30" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#ff5a1a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="smoke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#40322a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#40322a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d2e" stop-opacity="0.6"/>
      <stop offset="0.3" stop-color="#ff9d2e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0603" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#0a0603" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#0a0603" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="soft2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glowF" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="txt" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="800" fill="url(#sky)"/>

  <!-- sun glow -->
  <circle cx="640" cy="470" r="330" fill="url(#sun)"/>
  <circle cx="640" cy="470" r="52" fill="#fff2cf" opacity="0.9" filter="url(#soft2)"/>

  <!-- far ridge -->
  <path d="M0,470 L150,430 L300,455 L450,420 L600,448 L760,418 L920,452 L1080,426 L1280,458 L1280,800 L0,800 Z" fill="url(#mFar)" opacity="0.92"/>

  <!-- mid ridge -->
  <path d="M0,545 L160,505 L330,540 L500,498 L640,535 L820,495 L1000,538 L1160,505 L1280,540 L1280,800 L0,800 Z" fill="url(#mMid)"/>
  <g fill="#1c1109">
    <path d="M250,540 L260,512 L270,540 Z"/><path d="M380,540 L390,510 L400,540 Z"/>
    <path d="M470,540 L480,514 L490,540 Z"/><path d="M560,540 L570,508 L580,540 Z"/>
    <path d="M700,540 L710,512 L720,540 Z"/><path d="M790,540 L800,508 L810,540 Z"/>
    <path d="M900,540 L910,514 L920,540 Z"/><path d="M1050,540 L1060,510 L1070,540 Z"/>
    <path d="M1150,540 L1160,512 L1170,540 Z"/>
  </g>

  <!-- fire glow on the ridge -->
  <ellipse cx="640" cy="525" rx="330" ry="95" fill="url(#fireGlow)" filter="url(#soft)"/>

  <!-- THE SINGLE LARGE FLAME -->
  <g filter="url(#soft2)">
    <!-- Main flame body -->
    <path d="M640,545 
             C620,510 580,490 575,450 
             C568,415 590,380 570,345 
             C555,310 580,280 565,250 
             C550,220 585,195 575,165 
             C565,140 595,120 585,95 
             C580,75 600,60 595,45
             L640,30
             L685,45
             C680,60 700,75 695,95
             C685,120 715,140 705,165
             C695,195 730,220 715,250
             C700,280 725,310 710,345
             C690,380 712,415 705,450
             C700,490 660,510 640,545 Z" 
          fill="url(#fire)" opacity="0.95"/>
    
    <!-- Inner flame core -->
    <path d="M640,540 
             C625,510 600,495 598,460 
             C594,430 612,405 600,375 
             C588,345 608,320 600,295 
             C592,270 615,250 608,225 
             C600,200 625,185 620,165 
             C615,145 632,130 630,115
             L640,100
             L650,115
             C648,130 665,145 660,165
             C655,185 680,200 672,225
             C665,250 688,270 680,295
             C672,320 692,345 680,375
             C668,405 686,430 682,460
             C680,495 655,510 640,540 Z" 
          fill="url(#fireInner)" opacity="0.9"/>
    
    <!-- Brightest inner core -->
    <path d="M640,535 
             C630,510 615,495 615,470 
             C613,445 628,425 620,400 
             C612,375 630,355 625,335 
             C620,315 638,300 635,280 
             C632,265 645,255 642,240
             L640,230
             L638,240
             C635,255 648,265 645,280
             C642,300 660,315 655,335
             C650,355 668,375 660,400
             C652,425 667,445 665,470
             C665,495 650,510 640,535 Z" 
          fill="#fff6dd" opacity="0.85"/>
  </g>

  <!-- Smoke rising -->
  <g fill="url(#smoke)" filter="url(#soft)">
    <path d="M600,470 C560,400 640,360 600,300 C560,240 660,210 620,150 C700,190 660,260 700,320 C740,380 660,420 690,470 C670,440 630,440 600,470 Z" opacity="0.5"/>
    <path d="M660,455 C630,390 700,350 670,290 C650,230 720,200 700,140 C770,180 730,250 760,310 C790,370 720,410 740,455 C710,430 690,430 660,455 Z" opacity="0.42"/>
    <path d="M560,470 C540,410 600,380 580,330 C560,280 620,250 610,200 C660,240 630,300 655,350 C680,405 610,440 630,470 C605,450 585,450 560,470 Z" opacity="0.35"/>
  </g>

  <!-- near ridge with darker trees -->
  <path d="M0,640 L180,595 L360,635 L560,590 L640,620 L820,588 L1020,632 L1200,592 L1280,620 L1280,800 L0,800 Z" fill="url(#mNear)"/>
  <g fill="#080402">
    <path d="M120,635 L134,598 L148,635 Z"/><path d="M200,638 L214,600 L228,638 Z"/>
    <path d="M300,632 L314,596 L328,632 Z"/><path d="M380,636 L394,598 L408,636 Z"/>
    <path d="M470,634 L484,596 L498,634 Z"/><path d="M560,628 L574,592 L588,628 Z"/>
    <path d="M720,630 L734,592 L748,630 Z"/><path d="M820,632 L834,594 L848,632 Z"/>
    <path d="M920,636 L934,598 L948,636 Z"/><path d="M1020,632 L1034,596 L1048,632 Z"/>
    <path d="M1120,636 L1134,598 L1148,636 Z"/><path d="M1200,632 L1214,596 L1228,632 Z"/>
  </g>

  <!-- Rim light on near trees -->
  <g fill="none" stroke="#ff9d2e" stroke-width="1.5" opacity="0.5">
    <path d="M120,635 L134,598 L148,635" stroke-linejoin="round"/>
    <path d="M200,638 L214,600 L228,638" stroke-linejoin="round"/>
    <path d="M300,632 L314,596 L328,632" stroke-linejoin="round"/>
    <path d="M380,636 L394,598 L408,636" stroke-linejoin="round"/>
    <path d="M470,634 L484,596 L498,634" stroke-linejoin="round"/>
    <path d="M560,628 L574,592 L588,628" stroke-linejoin="round"/>
    <path d="M720,630 L734,592 L748,630" stroke-linejoin="round"/>
    <path d="M820,632 L834,594 L848,632" stroke-linejoin="round"/>
    <path d="M920,636 L934,598 L948,636" stroke-linejoin="round"/>
    <path d="M1020,632 L1034,596 L1048,632" stroke-linejoin="round"/>
    <path d="M1120,636 L1134,598 L1148,636" stroke-linejoin="round"/>
    <path d="M1200,632 L1214,596 L1228,632" stroke-linejoin="round"/>
  </g>

  <!-- THE SPARK -->
  <circle cx="640" cy="290" r="45" fill="#fff2b0" opacity="0.5" filter="url(#soft)"/>
  <circle cx="640" cy="290" r="22" fill="#fff7d6" filter="url(#glowF)"/>
  
  <!-- Rising light trail from spark to flame -->
  <path d="M640,290 C635,320 645,350 640,380 C635,410 645,440 640,470" 
        fill="none" stroke="#fff2b0" stroke-width="2" opacity="0.4" filter="url(#soft2)"/>
  <path d="M640,290 C638,315 642,340 640,365 C638,390 642,415 640,440" 
        fill="none" stroke="#fff7d6" stroke-width="1" opacity="0.6" filter="url(#soft2)"/>

  <!-- rising embers -->
  <g fill="#ffd27a" filter="url(#soft2)">
    <circle cx="612" cy="320" r="3.5"/><circle cx="668" cy="300" r="3"/>
    <circle cx="640" cy="270" r="2.6"/><circle cx="600" cy="250" r="2.2"/>
    <circle cx="680" cy="235" r="2.4"/><circle cx="632" cy="210" r="2"/>
    <circle cx="660" cy="185" r="2.2"/><circle cx="618" cy="160" r="1.8"/>
    <circle cx="655" cy="135" r="1.8"/><circle cx="638" cy="110" r="1.6"/>
  </g>

  <!-- top text -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" filter="url(#txt)">
    <text x="640" y="112" font-size="34" font-weight="900" letter-spacing="10" fill="#f2c98a">ONE SPARK IS ENOUGH</text>
    <rect x="440" y="130" width="400" height="2" fill="#e0a25a" opacity="0.7"/>
  </g>

  <!-- Bottom scrim for text readability -->
  <rect x="0" y="600" width="1280" height="200" fill="url(#scrim)"/>
  
  <!-- Bottom text -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" filter="url(#txt)">
    <text x="640" y="712" font-size="28" font-weight="700" letter-spacing="1" fill="#f4e4c4">Check conditions.  Extinguish completely.  Protect the wild.</text>
    <text x="640" y="755" font-size="18" font-weight="700" letter-spacing="7" fill="#e0904a">NATIONAL FOREST SAFETY INITIATIVE</text>
  </g>
</svg>