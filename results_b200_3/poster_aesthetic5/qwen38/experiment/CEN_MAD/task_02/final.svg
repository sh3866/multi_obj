<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07060a"/>
      <stop offset="55%" stop-color="#12101a"/>
      <stop offset="100%" stop-color="#1c1626"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#3a2a4a" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#241a30" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#07060a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#b8a9c0"/>
      <stop offset="40%" stop-color="#8a7a92"/>
      <stop offset="100%" stop-color="#3a3248"/>
    </linearGradient>
    <linearGradient id="fig2" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#9a8aa2"/>
      <stop offset="50%" stop-color="#6a5a78"/>
      <stop offset="100%" stop-color="#2a2238"/>
    </linearGradient>
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#c48a8a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c48a8a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a87080" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="weightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e0d5"/>
      <stop offset="100%" stop-color="#8a7a6a"/>
    </linearGradient>
    <linearGradient id="airGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0ebe5"/>
      <stop offset="100%" stop-color="#c5b8a8"/>
    </linearGradient>
    <filter id="softPurpleShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="32"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0 0.55  0 0 0 0.5 0"/>
    </filter>
    <filter id="grainFig" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.75  0 0 0 0 0.7  0 0 0 0.4 0" result="colorNoise"/>
      <feComposite in="colorNoise" in2="SourceGraphic" operator="in" result="masked"/>
      <feBlend in="SourceGraphic" in2="masked" mode="multiply"/>
    </filter>
    <filter id="bgGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.78  0 0 0 0.1 0"/>
    </filter>
    <filter id="weightSkew" x="-20%" y="-20%" width="140%" height="140%">
      <feSkewX angle="4" result="sk"/>
      <feGaussianBlur in="sk" stdDeviation="0.3"/>
    </filter>
    <radialGradient id="vign" cx="50%" cy="46%" r="72%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>

  <!-- Subtle atmospheric lines -->
  <line x1="640" y1="60" x2="640" y2="740" stroke="#6a5d78" stroke-opacity="0.25" stroke-width="0.8"/>
  <line x1="350" y1="250" x2="950" y2="250" stroke="#5a4d68" stroke-opacity="0.12" stroke-width="0.6"/>
  <line x1="300" y1="450" x2="1000" y2="450" stroke="#5a4d68" stroke-opacity="0.1" stroke-width="0.6"/>
  <line x1="400" y1="620" x2="900" y2="620" stroke="#5a4d68" stroke-opacity="0.08" stroke-width="0.6"/>

  <!-- Purple shadow under figure -->
  <ellipse cx="780" cy="700" rx="180" ry="40" fill="#6b4a9a" opacity="0.4" filter="url(#softPurpleShadow)"/>

  <!-- Unified Figure: Wireframe (Control) + Solid Forms (Release) -->
  <!-- Wireframe skeleton - faint line art defining structure -->
  <g stroke="#b9b2c6" fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- Head/neck wireframe -->
    <path d="M720 220 L745 195 L775 200 L790 225 L770 250 L740 255 L718 245 Z" stroke-width="1.5" opacity="0.35"/>
    <path d="M725 240 L715 265" stroke-width="1.2" opacity="0.3"/>
    <!-- Torso wireframe -->
    <path d="M735 265 L710 320 L695 380 L705 440 L730 480 L765 460 L775 410 L760 350 L745 300" stroke-width="1.5" opacity="0.3"/>
    <!-- Left arm wireframe (extending toward text) -->
    <path d="M720 310 L670 295 L620 280 L580 265 L550 250" stroke-width="1.3" opacity="0.28"/>
    <path d="M718 308 L695 302" stroke-width="0.8" opacity="0.25"/>
    <!-- Right arm wireframe (extended outward) -->
    <path d="M755 305 L800 285 L845 265 L890 245 L920 230" stroke-width="1.3" opacity="0.28"/>
    <path d="M757 303 L780 294" stroke-width="0.8" opacity="0.25"/>
    <!-- Left leg wireframe -->
    <path d="M720 460 L700 520 L685 580 L690 630 L710 660" stroke-width="1.4" opacity="0.3"/>
    <!-- Right leg wireframe -->
    <path d="M755 465 L780 520 L795 580 L790 635 L775 670" stroke-width="1.4" opacity="0.3"/>
    <!-- Additional structural lines -->
    <path d="M735 265 L740 320 L735 380" stroke-width="0.8" opacity="0.2"/>
    <path d="M700 350 L680 340" stroke-width="0.7" opacity="0.2"/>
    <path d="M760 350 L780 340" stroke-width="0.7" opacity="0.2"/>
  </g>

  <!-- Solid geometric shards (Release) - integrated with wireframe -->
  <g filter="url(#grainFig)">
    <!-- Head solid form -->
    <path d="M722 222 L748 198 L778 203 L792 228 L772 252 L742 257 L720 247 Z" fill="url(#fig)" opacity="0.85"/>
    <!-- Torso mass -->
    <path d="M732 268 L712 325 L698 385 L708 445 L732 482 L768 462 L778 412 L762 352 L748 298" fill="url(#fig)" opacity="0.8" stroke="#2a2233" stroke-width="0.8"/>
    <!-- Left arm solid (reaching toward text) -->
    <path d="M718 312 L668 297 L618 282 L578 267 L548 252" stroke="url(#fig2)" stroke-width="12" fill="none" stroke-linecap="butt" opacity="0.75"/>
    <path d="M716 310 L692 304" stroke="url(#fig2)" stroke-width="4" fill="none" stroke-linecap="butt" opacity="0.7"/>
    <!-- Right arm solid (extended) -->
    <path d="M757 307 L802 287 L848 267 L892 247 L922 232" stroke="url(#fig2)" stroke-width="10" fill="none" stroke-linecap="butt" opacity="0.7"/>
    <path d="M759 305 L782 296" stroke="url(#fig2)" stroke-width="3.5" fill="none" stroke-linecap="butt" opacity="0.65"/>
    <!-- Left leg solid -->
    <path d="M718 462 L698 522 L683 582 L688 632 L708 662" stroke="url(#fig)" stroke-width="22" fill="none" stroke-linecap="butt" opacity="0.8"/>
    <!-- Right leg solid -->
    <path d="M757 467 L782 522 L797 582 L792 637 L777 672" stroke="url(#fig)" stroke-width="24" fill="none" stroke-linecap="butt" opacity="0.8"/>
    <!-- Hip/pelvis mass -->
    <path d="M715 455 L700 470 L710 490 L740 495 L765 485 L770 465 L755 450 Z" fill="url(#fig)" opacity="0.75"/>
    <!-- Shoulder mass -->
    <path d="M722 295 L705 305 L710 325 L740 330 L765 320 L768 300 L750 288 Z" fill="url(#fig)" opacity="0.7"/>
    <!-- Chest facet -->
    <path d="M730 330 L715 360 L720 400 L745 410 L760 385 L755 350 Z" fill="url(#fig)" opacity="0.65"/>
    <!-- Lower torso facet -->
    <path d="M720 405 L710 435 L718 465 L745 470 L760 445 L755 415 Z" fill="url(#fig2)" opacity="0.6"/>
    <!-- Upper thigh left -->
    <path d="M715 470 L700 510 L705 550 L725 555 L735 520 L730 480 Z" fill="url(#fig)" opacity="0.7"/>
    <!-- Upper thigh right -->
    <path d="M750 472 L770 515 L775 555 L755 560 L740 525 L745 485 Z" fill="url(#fig)" opacity="0.7"/>
    <!-- Forearm left -->
    <path d="M620 285 L590 275 L565 265" stroke="url(#fig2)" stroke-width="8" fill="none" stroke-linecap="butt" opacity="0.6"/>
    <!-- Forearm right -->
    <path d="M850 270 L895 250 L925 235" stroke="url(#fig2)" stroke-width="7" fill="none" stroke-linecap="butt" opacity="0.55"/>
    <!-- Lower leg left -->
    <path d="M688 585 L685 625 L695 655" stroke="url(#fig)" stroke-width="16" fill="none" stroke-linecap="butt" opacity="0.65"/>
    <!-- Lower leg right -->
    <path d="M795 585 L790 630 L780 665" stroke="url(#fig)" stroke-width="18" fill="none" stroke-linecap="butt" opacity="0.65"/>
  </g>

  <!-- Rim light on figure - dusty rose -->
  <g stroke-linecap="butt" fill="none">
    <path d="M778 203 L792 228 L772 252" stroke="url(#rimLight)" stroke-width="2" opacity="0.6"/>
    <path d="M757 307 L802 287 L848 267 L892 247" stroke="url(#rimLight)" stroke-width="2.5" opacity="0.5"/>
    <path d="M757 467 L782 522 L797 582" stroke="url(#rimLight)" stroke-width="2" opacity="0.4"/>
    <path d="M722 222 L748 198" stroke="url(#rimLight)" stroke-width="1.8" opacity="0.5"/>
    <path d="M768 462 L778 412" stroke="url(#rimLight)" stroke-width="1.5" opacity="0.35"/>
  </g>

  <!-- Floating particles - muted warm tones -->
  <g fill="none" stroke-linecap="butt">
    <path d="M560 240 L535 255" stroke="#c4a0a0" stroke-width="1.2" opacity="0.45"/>
    <path d="M570 228 L550 238" stroke="#c4a0a0" stroke-width="0.8" opacity="0.3"/>
    <path d="M930 210 L955 198" stroke="#c4a0a0" stroke-width="1.2" opacity="0.45"/>
    <path d="M920 195 L945 185" stroke="#c4a0a0" stroke-width="0.8" opacity="0.3"/>
    <path d="M650 500 L630 515" stroke="#a890a0" stroke-width="0.9" opacity="0.3"/>
  </g>
  <g fill="#c4a0a0">
    <circle cx="540" cy="180" r="2.2" opacity="0.6"/>
    <circle cx="950" cy="200" r="1.8" opacity="0.5"/>
    <circle cx="500" cy="280" r="1.5" opacity="0.35"/>
    <circle cx="970" cy="280" r="1.5" opacity="0.35"/>
    <circle cx="580" cy="140" r="1.3" opacity="0.3"/>
    <circle cx="900" cy="150" r="1.3" opacity="0.3"/>
    <circle cx="450" cy="350" r="1.1" opacity="0.25"/>
    <circle cx="1000" cy="350" r="1.1" opacity="0.25"/>
    <circle cx="700" cy="720" r="1.4" opacity="0.3"/>
    <circle cx="850" cy="710" r="1.2" opacity="0.25"/>
  </g>

  <!-- Expressive Typography -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <!-- THE - small, light, tracking out -->
    <text x="80" y="115" font-size="48" letter-spacing="8" fill="#e8e0d5" font-weight="300" opacity="0.85">THE</text>
    
    <!-- WEIGHT - heavy, compressed, bold weight -->
    <text x="75" y="210" font-size="95" letter-spacing="-3" fill="url(#weightGrad)" font-weight="900" filter="url(#weightSkew)">WEIGHT</text>
    
    <!-- OF - small, light -->
    <text x="105" y="270" font-size="44" letter-spacing="14" fill="#d5ccc0" font-weight="300" opacity="0.8">OF</text>
    
    <!-- AIR - light, expanded, drifting into figure space -->
    <text x="140" y="360" font-size="72" letter-spacing="28" fill="url(#airGrad)" font-weight="200" opacity="0.9">AIR</text>
    
    <!-- Subtitle - italic, smaller -->
    <text x="85" y="415" font-size="19" letter-spacing="2" font-style="italic" fill="#a89888" font-weight="300">A contemporary movement performance</text>
  </g>

  <!-- Bottom text - dates and venue -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="80" y="710" font-size="30" letter-spacing="3" fill="#e8e0d5" font-weight="400">OCTOBER 18&#8211;20 &#183; 8 PM</text>
    <text x="80" y="750" font-size="20" letter-spacing="6" fill="#b8a898" font-weight="300">MERIDIAN ARTS THEATRE</text>
  </g>

  <!-- Subtle border frame -->
  <rect x="20" y="20" width="1240" height="760" fill="none" stroke="#4a3f56" stroke-opacity="0.35" stroke-width="0.8"/>

  <!-- Vignette overlay -->
  <rect width="1280" height="800" fill="url(#vign)"/>
  
  <!-- Grain overlay -->
  <rect width="1280" height="800" filter="url(#bgGrain)" opacity="0.5"/>
</svg>