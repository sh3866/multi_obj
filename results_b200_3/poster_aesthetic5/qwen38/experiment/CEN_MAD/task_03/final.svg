<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2740"/>
      <stop offset="0.28" stop-color="#071a2c"/>
      <stop offset="0.6" stop-color="#04101c"/>
      <stop offset="1" stop-color="#01060c"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9e2f2" stop-opacity="0.42"/>
      <stop offset="0.4" stop-color="#4a93b6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#123049" stop-opacity="0"/>
    </linearGradient>
    
    <!-- P2: Vertical Gradient for Headline (Simulating Light Absorption) -->
    <linearGradient id="headlineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ee4f0"/>
      <stop offset="35%" stop-color="#4a93b6"/>
      <stop offset="70%" stop-color="#123049"/>
      <stop offset="100%" stop-color="#04101c"/>
    </linearGradient>

    <!-- Bioluminescent Glow Gradients -->
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9fbff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#4fe0f0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#4fe0f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfe4ff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#5a9dff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#5a9dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0c0ff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#9b59b6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#9b59b6" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Distant Background Light Sources -->
    <radialGradient id="deepLight1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6a8fb8" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#4a7fa0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3a6f90" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deepLight2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8a6fb8" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#6a5fa0" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#5a4f90" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deepLight3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5a9fb8" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#4a8fa0" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3a7f90" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <radialGradient id="lastLight" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#88d4f0" stop-opacity="0.15"/>
      <stop offset="0.4" stop-color="#4a93b6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#123049" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Creature Gradients -->
    <linearGradient id="creatureBody" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0a1e30"/>
      <stop offset="0.5" stop-color="#061520"/>
      <stop offset="1" stop-color="#020a12"/>
    </linearGradient>
    <linearGradient id="creatureFins" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2035" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#040e18" stop-opacity="0.1"/>
    </linearGradient>
    
    <!-- Filters for Emissive / Submerged Effects -->
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="softBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="medBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    
    <!-- P2: Layered Light-Scattering Filter for Text -->
    <filter id="textScatter" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Wide diffuse cool halo -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="wideBlur"/>
      <feFlood flood-color="#3a8fb8" flood-opacity="0.3" result="haloColor"/>
      <feComposite in="haloColor" in2="wideBlur" operator="in" result="halo"/>
      
      <!-- Tight bright core -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="tightBlur"/>
      <feFlood flood-color="#a9e2f2" flood-opacity="0.5" result="coreColor"/>
      <feComposite in="coreColor" in2="tightBlur" operator="in" result="core"/>
      
      <!-- Merge: halo behind, core on top, source graphic on very top -->
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="core"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- P4: Noise Texture Filter (Marine Snow / Pressure) -->
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="turb"/>
      <feColorMatrix type="saturate" values="0" in="turb" result="gray"/>
      <feComponentTransfer in="gray" result="faded">
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
      <feComposite in="faded" in2="SourceGraphic" operator="in"/>
    </filter>
    
    <!-- Creature Shadow Filter -->
    <filter id="creatureShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="shadow"/>
      <feOffset dx="10" dy="15" in="shadow" result="offsetShadow"/>
      <feFlood flood-color="#000000" flood-opacity="0.4" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetShadow" operator="in" result="finalShadow"/>
      <feMerge>
        <feMergeNode in="finalShadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="0" y="0" width="1280" height="800" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="800" fill="url(#light)"/>

  <!-- P4: Distant Background Light Sources (Geological Depth) -->
  <ellipse cx="280" cy="620" rx="180" ry="140" fill="url(#deepLight1)"/>
  <ellipse cx="1050" cy="580" rx="150" ry="120" fill="url(#deepLight2)"/>
  <ellipse cx="640" cy="700" rx="200" ry="100" fill="url(#deepLight3)"/>

  <!-- P2: Last Light Fading from Above -->
  <ellipse cx="640" cy="-50" rx="800" ry="450" fill="url(#lastLight)"/>
  <ellipse cx="640" cy="0" rx="600" ry="300" fill="#a9e2f2" opacity="0.06"/>
  <ellipse cx="400" cy="0" rx="300" ry="200" fill="#c3ecf7" opacity="0.04"/>
  <ellipse cx="880" cy="0" rx="300" ry="200" fill="#c3ecf7" opacity="0.04"/>

  <!-- Faint Marine Snow -->
  <g fill="#9fd0e6">
    <circle cx="180" cy="120" r="1.6" opacity="0.12"/>
    <circle cx="300" cy="200" r="1.2" opacity="0.1"/>
    <circle cx="420" cy="90" r="1.4" opacity="0.1"/>
    <circle cx="520" cy="260" r="1.8" opacity="0.12"/>
    <circle cx="640" cy="150" r="1.3" opacity="0.1"/>
    <circle cx="760" cy="230" r="1.5" opacity="0.1"/>
    <circle cx="880" cy="110" r="1.2" opacity="0.1"/>
    <circle cx="980" cy="300" r="1.7" opacity="0.12"/>
    <circle cx="1100" cy="180" r="1.4" opacity="0.1"/>
    <circle cx="240" cy="340" r="1.6" opacity="0.1"/>
    <circle cx="720" cy="380" r="1.5" opacity="0.1"/>
    <circle cx="1160" cy="360" r="1.3" opacity="0.1"/>
  </g>

  <!-- Drifting Marine Snow (Brighter) -->
  <g fill="#cfeaf5">
    <circle cx="200" cy="180" r="2.4" opacity="0.4"/>
    <circle cx="360" cy="240" r="2" opacity="0.35"/>
    <circle cx="480" cy="150" r="2.6" opacity="0.4"/>
    <circle cx="540" cy="320" r="2" opacity="0.35"/>
    <circle cx="600" cy="200" r="2.4" opacity="0.4"/>
    <circle cx="700" cy="280" r="2" opacity="0.35"/>
    <circle cx="820" cy="180" r="2.6" opacity="0.4"/>
    <circle cx="900" cy="340" r="2" opacity="0.35"/>
    <circle cx="1020" cy="240" r="2.4" opacity="0.4"/>
    <circle cx="1150" cy="150" r="2" opacity="0.35"/>
    <circle cx="260" cy="420" r="2.4" opacity="0.35"/>
    <circle cx="400" cy="470" r="2" opacity="0.3"/>
    <circle cx="520" cy="430" r="2.4" opacity="0.35"/>
    <circle cx="660" cy="420" r="2" opacity="0.3"/>
    <circle cx="860" cy="440" r="2.4" opacity="0.35"/>
    <circle cx="1080" cy="420" r="2" opacity="0.3"/>
  </g>

  <!-- P4: Seabed Silhouette (Grounding Mid-Left) -->
  <g opacity="0.85">
    <path d="M0,480 C40,470 80,490 140,510 C200,530 280,560 380,590 C480,620 600,620 750,605 C900,590 1000,615 1100,600 C1200,585 1280,610 1280,620 L1280,800 L0,800 Z" fill="#01060c"/>
    <path d="M0,520 C60,510 120,530 200,550 C300,575 420,610 560,625 C700,635 840,620 940,645 C1060,630 1160,615 1280,650 L1280,800 L0,800 Z" fill="#020a12"/>
    <!-- Trench Texture Lines -->
    <path d="M100,560 C150,550 200,565 280,555" fill="none" stroke="#0a1a2b" stroke-width="2" opacity="0.5"/>
    <path d="M300,590 C380,578 460,595 550,585" fill="none" stroke="#0a1a2b" stroke-width="2" opacity="0.5"/>
    <path d="M700,620 C780,610 860,625 950,615" fill="none" stroke="#0a1a2b" stroke-width="2" opacity="0.5"/>
    <path d="M950,640 C1030,630 1110,645 1200,635" fill="none" stroke="#0a1a2b" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- P1: DOMINANT ORGANISM - Giant Siphonophore Chain -->
  <!-- Replaces generic dots and isolated jellyfish, physically intersects the text block -->
  <g filter="url(#creatureShadow)">
    <!-- Ambient Glow for the Chain -->
    <path d="M100,150 C300,300 500,200 700,450 C850,600 1000,550 1180,750" fill="none" stroke="#4fe0f0" stroke-width="40" opacity="0.1" filter="url(#softBlur)"/>
    <path d="M100,150 C300,300 500,200 700,450 C850,600 1000,550 1180,750" fill="none" stroke="#9b59b6" stroke-width="20" opacity="0.08" filter="url(#softBlur)"/>
    
    <!-- Main Translucent Body Path -->
    <path d="M100,150 C300,300 500,200 700,450 C850,600 1000,550 1180,750" fill="none" stroke="#0c2035" stroke-width="12" opacity="0.6" filter="url(#soft)"/>
    <path d="M100,150 C300,300 500,200 700,450 C850,600 1000,550 1180,750" fill="none" stroke="#4fe0f0" stroke-width="4" opacity="0.4" filter="url(#soft)"/>

    <!-- Nectophores (Bioluminescent Nodes) -->
    <!-- Node 1 -->
    <g transform="translate(100, 150)">
      <circle r="25" fill="url(#glowCyan)" opacity="0.4" filter="url(#softBlur)"/>
      <circle r="14" fill="url(#glowCyan)" opacity="0.7" filter="url(#soft)"/>
      <circle r="6" fill="#eaffff" opacity="0.9"/>
    </g>
    <!-- Node 2 -->
    <g transform="translate(180, 210)">
      <circle r="30" fill="url(#glowCyan)" opacity="0.4" filter="url(#softBlur)"/>
      <circle r="16" fill="url(#glowCyan)" opacity="0.7" filter="url(#soft)"/>
      <circle r="7" fill="#eaffff" opacity="0.9"/>
    </g>
    <!-- Node 3 -->
    <g transform="translate(260, 250)">
      <circle r="35" fill="url(#glowCyan)" opacity="0.4" filter="url(#softBlur)"/>
      <circle r="18" fill="url(#glowCyan)" opacity="0.7" filter="url(#soft)"/>
      <circle r="8" fill="#eaffff" opacity="0.9"/>
    </g>
    <!-- Node 4 -->
    <g transform="translate(350, 260)">
      <circle r="32" fill="url(#glowCyan)" opacity="0.4" filter="url(#softBlur)"/>
      <circle r="17" fill="url(#glowCyan)" opacity="0.7" filter="url(#soft)"/>
      <circle r="7" fill="#eaffff" opacity="0.9"/>
    </g>
    <!-- Node 5 (Intersecting 'BELOW') -->
    <g transform="translate(440, 240)">
      <circle r="38" fill="url(#glowCyan)" opacity="0.5" filter="url(#softBlur)"/>
      <circle r="20" fill="url(#glowCyan)" opacity="0.8" filter="url(#soft)"/>
      <circle r="9" fill="#eaffff" opacity="1"/>
    </g>
    <!-- Node 6 -->
    <g transform="translate(530, 260)">
      <circle r="34" fill="url(#glowCyan)" opacity="0.4" filter="url(#softBlur)"/>
      <circle r="18" fill="url(#glowCyan)" opacity="0.7" filter="url(#soft)"/>
      <circle r="8" fill="#eaffff" opacity="0.9"/>
    </g>
    <!-- Node 7 (Intersecting 'LIGHT') -->
    <g transform="translate(620, 330)">
      <circle r="42" fill="url(#glowCyan)" opacity="0.5" filter="url(#softBlur)"/>
      <circle r="22" fill="url(#glowCyan)" opacity="0.8" filter="url(#soft)"/>
      <circle r="10" fill="#eaffff" opacity="1"/>
    </g>
    <!-- Node 8 -->
    <g transform="translate(700, 450)">
      <circle r="36" fill="url(#glowCyan)" opacity="0.4" filter="url(#softBlur)"/>
      <circle r="19" fill="url(#glowCyan)" opacity="0.7" filter="url(#soft)"/>
      <circle r="8" fill="#eaffff" opacity="0.9"/>
    </g>
    <!-- Node 9 -->
    <g transform="translate(820, 550)">
      <circle r="32" fill="url(#glowCyan)" opacity="0.4" filter="url(#softBlur)"/>
      <circle r="16" fill="url(#glowCyan)" opacity="0.7" filter="url(#soft)"/>
      <circle r="7" fill="#eaffff" opacity="0.9"/>
    </g>
    <!-- Node 10 (Intersecting 'SPECIAL EXHIBITION') -->
    <g transform="translate(950, 570)">
      <circle r="40" fill="url(#glowCyan)" opacity="0.5" filter="url(#softBlur)"/>
      <circle r="21" fill="url(#glowCyan)" opacity="0.8" filter="url(#soft)"/>
      <circle r="9" fill="#eaffff" opacity="1"/>
    </g>
    <!-- Node 11 -->
    <g transform="translate(1080, 650)">
      <circle r="34" fill="url(#glowCyan)" opacity="0.4" filter="url(#softBlur)"/>
      <circle r="17" fill="url(#glowCyan)" opacity="0.7" filter="url(#soft)"/>
      <circle r="8" fill="#eaffff" opacity="0.9"/>
    </g>
    <!-- Node 12 -->
    <g transform="translate(1180, 750)">
      <circle r="28" fill="url(#glowCyan)" opacity="0.4" filter="url(#softBlur)"/>
      <circle r="14" fill="url(#glowCyan)" opacity="0.7" filter="url(#soft)"/>
      <circle r="6" fill="#eaffff" opacity="0.9"/>
    </g>

    <!-- P4: Secondary Warm Hue (Violet) Accents on Specific Nodes -->
    <g transform="translate(350, 260)">
      <circle r="20" fill="url(#glowViolet)" opacity="0.6" filter="url(#soft)"/>
      <circle r="8" fill="#e0c0ff" opacity="0.9"/>
    </g>
    <g transform="translate(700, 450)">
      <circle r="24" fill="url(#glowViolet)" opacity="0.6" filter="url(#soft)"/>
      <circle r="10" fill="#e0c0ff" opacity="0.9"/>
    </g>
    <g transform="translate(1080, 650)">
      <circle r="18" fill="url(#glowViolet)" opacity="0.6" filter="url(#soft)"/>
      <circle r="7" fill="#e0c0ff" opacity="0.9"/>
    </g>

    <!-- Delicate Tentacles extending from the chain -->
    <g stroke="#4fe0f0" stroke-width="1.5" fill="none" opacity="0.5" filter="url(#soft)">
      <path d="M440,240 Q380,320 420,400" />
      <path d="M440,240 Q480,350 450,450" />
      <path d="M620,330 Q550,420 580,520" />
      <path d="M620,330 Q680,450 640,550" />
      <path d="M950,570 Q880,680 920,780" />
      <path d="M950,570 Q1020,680 980,780" />
    </g>
    <g stroke="#9b59b6" stroke-width="1" fill="none" opacity="0.4" filter="url(#soft)">
      <path d="M350,260 Q300,350 340,420" />
      <path d="M700,450 Q650,550 690,650" />
      <path d="M1080,650 Q1030,750 1070,790" />
    </g>
  </g>

  <!-- Vignette -->
  <rect x="0" y="0" width="1280" height="800" fill="url(#vignette)"/>

  <!-- P4: Subtle Low-Opacity Grain Texture Overlay (Marine Snow / Pressure) -->
  <rect x="0" y="0" width="1280" height="800" fill="url(#bg)" filter="url(#noise)" opacity="0.35" pointer-events="none"/>

  <!-- ===== TEXT ===== -->
  
  <!-- Museum Name - Pushed into background -->
  <text x="640" y="108" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="6" fill="#5a8fa0" opacity="0.45">CALDER MUSEUM OF NATURAL HISTORY</text>
  <line x1="560" y1="124" x2="720" y2="124" stroke="#3a6f8f" stroke-width="1" opacity="0.4"/>

  <!-- P3: Headline - Offset slightly to the left (x=560) to align with the start of the Siphonophore chain, creating an 'L' shape -->
  <g filter="url(#textScatter)">
    <text x="560" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" letter-spacing="3" fill="url(#headlineGrad)">BELOW THE</text>
    <text x="560" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" letter-spacing="3" fill="url(#headlineGrad)">LAST LIGHT</text>
  </g>

  <!-- Divider -->
  <line x1="440" y1="332" x2="680" y2="332" stroke="#4fe0f0" stroke-width="1.4" opacity="0.7" filter="url(#soft)"/>
  <circle cx="560" cy="332" r="4" fill="#c9fbff" filter="url(#soft)"/>

  <!-- Subtitle -->
  <text x="560" y="368" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" letter-spacing="1" fill="#a9d6ec">Life at the edge of the known world</text>

  <!-- Exhibition Details -->
  <text x="640" y="700" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="4" fill="#cfe8f5">SPECIAL EXHIBITION</text>
  <text x="640" y="732" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="2" fill="#eaf6ff">November 2 – March 9</text>

</svg>