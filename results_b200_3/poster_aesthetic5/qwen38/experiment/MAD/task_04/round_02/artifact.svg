<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0611"/>
      <stop offset="0.5" stop-color="#120a1e"/>
      <stop offset="1" stop-color="#050308"/>
    </linearGradient>
    
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#1a3a9e" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0b0611" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="redText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d67"/>
      <stop offset="1" stop-color="#ff1e3c"/>
    </linearGradient>
    
    <linearGradient id="blueText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb6ff"/>
      <stop offset="1" stop-color="#4a7dff"/>
    </linearGradient>
    
    <linearGradient id="amberGrad" x1="0" y1="1" x2="0.5" y2="0.5">
      <stop offset="0" stop-color="#ff9500" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff9500" stop-opacity="0"/>
    </linearGradient>
    
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Atmospheric blue glow (top-left, reduced) -->
  <ellipse cx="360" cy="250" rx="380" ry="300" fill="url(#blueGlow)"/>

  <!-- Warm amber gradient (bottom-left) -->
  <rect x="0" y="400" width="640" height="400" fill="url(#amberGrad)"/>

  <!-- Rhythm grid (syncopation / interruption) -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="60" y1="120" x2="1220" y2="120"/>
    <line x1="60" y1="220" x2="1220" y2="220"/>
    <line x1="60" y1="320" x2="1220" y2="320"/>
    <line x1="60" y1="420" x2="1220" y2="420"/>
    <line x1="60" y1="520" x2="1220" y2="520"/>
    <line x1="60" y1="620" x2="1220" y2="620"/>
    <line x1="60" y1="720" x2="1220" y2="720"/>
  </g>

  <!-- Sound wave / unified waveform (blue) - low amplitude left, high amplitude right -->
  <g filter="url(#glow)" opacity="0.95">
    <path d="M 40 400
             L 80 398 L 90 402 L 100 399 L 110 401 L 120 400 L 130 399 L 140 401 L 150 400
             L 160 398 L 170 402 L 180 400 L 190 399 L 200 401 L 210 400 L 220 399 L 230 401 L 240 400
             L 250 398 L 260 402 L 270 400 L 280 399 L 290 401 L 300 400 L 310 399 L 320 401 L 330 400
             L 340 398 L 350 402 L 360 400 L 370 399 L 380 401 L 390 400 L 400 399 L 410 401 L 420 400
             L 430 398 L 440 402 L 450 400 L 460 399 L 470 401 L 480 400 L 490 399 L 500 401 L 510 400
             L 520 398 L 530 402 L 540 400 L 550 399 L 560 401 L 570 400 L 580 399 L 590 401 L 600 400
             L 610 398 L 620 402 L 630 400 L 640 399 L 650 401 L 660 400 L 670 399 L 680 401 L 690 400
             L 700 398 L 710 402 L 720 400 L 730 399 L 740 401 L 750 400 L 760 399 L 770 401 L 780 400
             L 790 398 L 800 402 L 810 400 L 820 399 L 830 401 L 840 400 L 850 399 L 860 401 L 870 400
             L 880 398 L 890 402 L 900 400 L 910 399 L 920 401 L 930 400 L 940 399 L 950 401 L 960 400
             L 970 398 L 980 402 L 990 400 L 1000 399 L 1010 401 L 1020 400 L 1030 399 L 1040 401 L 1050 400
             L 1060 398 L 1070 402 L 1080 400 L 1090 399 L 1100 401 L 1110 400 L 1120 399 L 1130 401 L 1140 400
             L 1150 398 L 1160 402 L 1170 400 L 1180 399 L 1190 401 L 1200 400 L 1210 399 L 1220 401 L 1240 400"
          fill="none" stroke="#4a7dff" stroke-width="2.8" stroke-linejoin="round"/>
  </g>

  <!-- Sound wave / red interruption line (offset) - low amplitude left, high amplitude right -->
  <g filter="url(#glow)" opacity="0.9">
    <path d="M 40 430
             L 80 428 L 90 432 L 100 429 L 110 431 L 120 430 L 130 429 L 140 431 L 150 430
             L 160 428 L 170 432 L 180 430 L 190 429 L 200 431 L 210 430 L 220 429 L 230 431 L 240 430
             L 250 428 L 260 432 L 270 430 L 280 429 L 290 431 L 300 430 L 310 429 L 320 431 L 330 430
             L 340 428 L 350 432 L 360 430 L 370 429 L 380 431 L 390 430 L 400 429 L 410 431 L 420 430
             L 430 428 L 440 432 L 450 430 L 460 429 L 470 431 L 480 430 L 490 429 L 500 431 L 510 430
             L 520 428 L 530 432 L 540 430 L 550 429 L 560 431 L 570 430 L 580 429 L 590 431 L 600 430
             L 610 428 L 620 432 L 630 430 L 640 429 L 650 431 L 660 430 L 670 429 L 680 431 L 690 430
             L 700 428 L 710 432 L 720 430 L 730 429 L 740 431 L 750 430 L 760 429 L 770 431 L 780 430
             L 790 428 L 800 432 L 810 430 L 820 429 L 830 431 L 840 430 L 850 429 L 860 431 L 870 430
             L 880 428 L 890 432 L 900 430 L 910 429 L 920 431 L 930 430 L 940 429 L 950 431 L 960 430
             L 970 428 L 980 432 L 990 430 L 1000 429 L 1010 431 L 1020 430 L 1030 429 L 1040 431 L 1050 430
             L 1060 428 L 1070 432 L 1080 430 L 1090 429 L 1100 431 L 1110 430 L 1120 429 L 1130 431 L 1140 430
             L 1150 428 L 1160 432 L 1170 430 L 1180 429 L 1190 431 L 1200 430 L 1210 429 L 1220 431 L 1240 430"
          fill="none" stroke="#ff2f4f" stroke-width="2.8" stroke-linejoin="round"/>
  </g>

  <!-- Syncopation accents: scattered sharp bars -->
  <g stroke="#ff2f4f" stroke-width="3" opacity="0.85">
    <line x1="340" y1="120" x2="340" y2="480"/>
    <line x1="720" y1="140" x2="720" y2="460"/>
    <line x1="1080" y1="150" x2="1080" y2="450"/>
  </g>
  <g stroke="#4a7dff" stroke-width="3" opacity="0.85">
    <line x1="540" y1="140" x2="540" y2="460"/>
    <line x1="900" y1="160" x2="900" y2="440"/>
  </g>

  <!-- Tension: broken diagonal slash (glitch effect) -->
  <g>
    <line x1="150" y1="640" x2="560" y2="150" stroke="#ff1e3c" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <line x1="585" y1="120" x2="625" y2="80" stroke="#ff1e3c" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <line x1="660" y1="50" x2="690" y2="20" stroke="#ff1e3c" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Grain overlay -->
  <rect width="1280" height="800" filter="url(#grain)" opacity="0.06"/>

  <!-- Top label -->
  <text x="64" y="70" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="8" fill="#8fb6ff" font-weight="700">EXPERIMENTAL JAZZ</text>
  <text x="1216" y="70" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="8" fill="#ff4d67" font-weight="700">LATE-NIGHT SERIES</text>

  <!-- Main title -->
  <text x="60" y="210" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" letter-spacing="2" fill="url(#blueText)" filter="url(#glow)">BLUE HOUR</text>
  <text x="60" y="350" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" letter-spacing="2" fill="url(#redText)" filter="url(#glow)">RED NOISE</text>

  <!-- Subtitle -->
  <text x="64" y="400" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#e9e2f2">A night of improvised sound</text>

  <!-- Divider -->
  <line x1="64" y1="430" x2="360" y2="430" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Info block -->
  <text x="64" y="478" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#f2ecfa" letter-spacing="1">Friday, September 27  &#183;  Doors 7 PM</text>
  <text x="64" y="520" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c9bfe0">The Foundry  &#183;  East River District</text>

  <!-- Featuring -->
  <text x="64" y="588" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="6" fill="#ff4d67" font-weight="700">FEATURING</text>
  <text x="64" y="632" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Nia Cole Quartet</text>
  <text x="110" y="672" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#b7c6ff">Static Bloom</text>
  <text x="64" y="708" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#b7c6ff">Armand Vale</text>

  <!-- Bottom accent bar -->
  <rect x="64" y="744" width="1152" height="4" fill="url(#redText)"/>
  <rect x="64" y="744" width="576" height="4" fill="url(#blueText)"/>
</svg>