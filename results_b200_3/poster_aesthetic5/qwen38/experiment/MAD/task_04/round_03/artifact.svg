<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0611"/>
      <stop offset="0.5" stop-color="#120a1e"/>
      <stop offset="1" stop-color="#050308"/>
    </linearGradient>
    
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#1a3a9e" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0b0611" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="redText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d67"/>
      <stop offset="1" stop-color="#ff1e3c"/>
    </linearGradient>
    
    <linearGradient id="blueText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb6ff"/>
      <stop offset="1" stop-color="#4a7dff"/>
    </linearGradient>
    
    <linearGradient id="amberGrad" x1="0" y1="1" x2="0.5" y2="0.5">
      <stop offset="0" stop-color="#ff9500" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff9500" stop-opacity="0"/>
    </linearGradient>
    
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    
    <!-- Chromatic aberration filter for the red diagonal line -->
    <filter id="chroma" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Atmospheric blue glow (top-left, reduced) -->
  <ellipse cx="360" cy="250" rx="380" ry="300" fill="url(#blueGlow)"/>

  <!-- Warm amber gradient (bottom-left) -->
  <rect x="0" y="400" width="640" height="400" fill="url(#amberGrad)"/>

  <!-- High-frequency grain texture (replacing grid) -->
  <rect width="1280" height="800" filter="url(#grain)" opacity="0.08"/>

  <!-- Abstract Sound Shards: Blue -->
  <g filter="url(#glow)" opacity="0.9">
    <polygon points="40,390 80,410 90,395 60,380" fill="#4a7dff" opacity="0.8"/>
    <polygon points="120,420 160,380 180,400 140,430" fill="#4a7dff" opacity="0.6"/>
    <polygon points="220,370 260,430 280,390 240,360" fill="#4a7dff" opacity="0.7"/>
    <polygon points="320,400 350,380 370,420 340,440" fill="#4a7dff" opacity="0.9"/>
    <polygon points="420,350 480,450 500,390 450,340" fill="#4a7dff" opacity="0.85"/>
    <polygon points="520,410 560,380 580,420 540,440" fill="#4a7dff" opacity="0.7"/>
    <polygon points="620,360 680,440 700,400 650,350" fill="#4a7dff" opacity="0.9"/>
    <polygon points="720,420 760,380 780,410 740,440" fill="#4a7dff" opacity="0.6"/>
    <polygon points="820,340 880,460 900,390 850,330" fill="#4a7dff" opacity="0.8"/>
    <polygon points="920,400 960,370 980,420 940,440" fill="#4a7dff" opacity="0.75"/>
    <polygon points="1020,350 1080,450 1100,380 1050,340" fill="#4a7dff" opacity="0.9"/>
    <polygon points="1120,410 1160,380 1180,430 1140,440" fill="#4a7dff" opacity="0.65"/>
    <polygon points="1200,360 1240,420 1260,390 1220,350" fill="#4a7dff" opacity="0.85"/>
  </g>

  <!-- Abstract Sound Shards: Red -->
  <g filter="url(#glow)" opacity="0.9">
    <polygon points="50,430 90,450 100,420 70,410" fill="#ff2f4f" opacity="0.7"/>
    <polygon points="130,380 170,440 190,400 150,370" fill="#ff2f4f" opacity="0.8"/>
    <polygon points="230,410 270,370 290,410 250,430" fill="#ff2f4f" opacity="0.6"/>
    <polygon points="330,360 360,420 380,380 350,350" fill="#ff2f4f" opacity="0.85"/>
    <polygon points="430,420 490,360 510,410 460,440" fill="#ff2f4f" opacity="0.75"/>
    <polygon points="530,380 570,430 590,390 550,370" fill="#ff2f4f" opacity="0.9"/>
    <polygon points="630,440 690,350 710,410 660,450" fill="#ff2f4f" opacity="0.8"/>
    <polygon points="730,370 770,430 790,390 750,360" fill="#ff2f4f" opacity="0.65"/>
    <polygon points="830,410 890,350 910,400 860,430" fill="#ff2f4f" opacity="0.9"/>
    <polygon points="930,360 970,420 990,380 950,350" fill="#ff2f4f" opacity="0.7"/>
    <polygon points="1030,430 1090,360 1110,410 1060,440" fill="#ff2f4f" opacity="0.85"/>
    <polygon points="1130,380 1170,440 1190,400 1150,370" fill="#ff2f4f" opacity="0.6"/>
    <polygon points="1210,420 1250,370 1270,410 1230,430" fill="#ff2f4f" opacity="0.8"/>
  </g>

  <!-- The Red Diagonal Slash (Chromatic Aberration / Lens Flare) -->
  <!-- This sits BEHIND the text layer -->
  <g filter="url(#chroma)">
    <!-- Soft outer glow -->
    <line x1="1264" y1="784" x2="400" y2="160" stroke="#ff1e3c" stroke-width="24" stroke-linecap="round" opacity="0.15"/>
    <!-- Chromatic aberration offset (blue) -->
    <line x1="1264" y1="784" x2="400" y2="160" stroke="#4a7dff" stroke-width="8" stroke-linecap="round" opacity="0.5" transform="translate(-4, 2)"/>
    <!-- Chromatic aberration offset (cyan) -->
    <line x1="1264" y1="784" x2="400" y2="160" stroke="#00ffff" stroke-width="4" stroke-linecap="round" opacity="0.3" transform="translate(4, -2)"/>
    <!-- Core red line -->
    <line x1="1264" y1="784" x2="400" y2="160" stroke="#ff1e3c" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <!-- Bright core -->
    <line x1="1264" y1="784" x2="400" y2="160" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Top label -->
  <text x="64" y="70" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="8" fill="#8fb6ff" font-weight="700">EXPERIMENTAL JAZZ</text>
  <text x="1216" y="70" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="8" fill="#ff4d67" font-weight="700">LATE-NIGHT SERIES</text>

  <!-- Main title -->
  <!-- BLUE HOUR: x=60 -->
  <text x="60" y="210" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" letter-spacing="2" fill="url(#blueText)" filter="url(#glow)">BLUE HOUR</text>
  
  <!-- RED NOISE: x=74 (subtle horizontal glitch/displacement) -->
  <text x="74" y="350" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" letter-spacing="2" fill="url(#redText)" filter="url(#glow)">RED NOISE</text>

  <!-- Subtitle -->
  <text x="64" y="400" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#e9e2f2">A night of improvised sound</text>

  <!-- Divider -->
  <line x1="64" y1="430" x2="360" y2="430" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Info block -->
  <text x="64" y="478" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#f2ecfa" letter-spacing="1">Friday, September 27  &#183;  Doors 7 PM</text>
  <text x="64" y="520" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c9bfe0">The Foundry  &#183;  East River District</text>

  <!-- Featuring -->
  <text x="64" y="588" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="6" fill="#ff4d67" font-weight="700">FEATURING</text>
  
  <!-- Stutter offsets on artist names -->
  <text x="64" y="632" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Nia Cole Quartet</text>
  <text x="118" y="672" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#b7c6ff">Static Bloom</text>
  <text x="82" y="708" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#b7c6ff">Armand Vale</text>

  <!-- Bottom accent bar -->
  <rect x="64" y="744" width="1152" height="4" fill="url(#redText)"/>
  <rect x="64" y="744" width="576" height="4" fill="url(#blueText)"/>

</svg>