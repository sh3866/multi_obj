<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17100b"/>
      <stop offset="0.4" stop-color="#3a2013"/>
      <stop offset="0.66" stop-color="#8a3f1e"/>
      <stop offset="0.85" stop-color="#d07a34"/>
      <stop offset="1" stop-color="#f4c46a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6dd" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ffce7d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffce7d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4a34"/>
      <stop offset="1" stop-color="#432a20"/>
    </linearGradient>
    <linearGradient id="mMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c2519"/>
      <stop offset="1" stop-color="#20130d"/>
    </linearGradient>
    <linearGradient id="mNear" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0b0603"/>
      <stop offset="0.5" stop-color="#1a0f08"/>
      <stop offset="1" stop-color="#2e1808"/>
    </linearGradient>
    <linearGradient id="mNearLeft" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#080402"/>
      <stop offset="0.5" stop-color="#140a05"/>
      <stop offset="1" stop-color="#241206"/>
    </linearGradient>
    <linearGradient id="mNearRight" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#100a05"/>
      <stop offset="0.5" stop-color="#201409"/>
      <stop offset="1" stop-color="#351e0e"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5a1a"/>
      <stop offset="0.5" stop-color="#ff9d2e"/>
      <stop offset="1" stop-color="#ffe489"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a30" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ff5a1a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="smoke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#40322a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#40322a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="heatHaze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a2e" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ff5a1a" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatHazeTop" cx="0.5" cy="1" r="0.5">
      <stop offset="0" stop-color="#ff7a2e" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ff5a1a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ignitionTrail" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6a20" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#ff9d2e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="soft2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glowF" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="txt" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="soft4" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="800" fill="url(#sky)"/>

  <!-- sun glow -->
  <circle cx="640" cy="470" r="330" fill="url(#sun)"/>
  <circle cx="640" cy="470" r="52" fill="#fff2cf" opacity="0.9" filter="url(#soft2)"/>

  <!-- far ridge -->
  <path d="M0,470 L150,430 L300,455 L450,420 L600,448 L760,418 L920,452 L1080,426 L1280,458 L1280,800 L0,800 Z" fill="url(#mFar)" opacity="0.92"/>

  <!-- mid ridge with trees -->
  <path d="M0,545 L160,505 L330,540 L500,498 L640,535 L820,495 L1000,538 L1160,505 L1280,540 L1280,800 L0,800 Z" fill="url(#mMid)"/>
  <g fill="#1c1109">
    <path d="M250,540 L260,512 L270,540 Z"/><path d="M380,540 L390,510 L400,540 Z"/>
    <path d="M470,540 L480,514 L490,540 Z"/><path d="M560,540 L570,508 L580,540 Z"/>
    <path d="M700,540 L710,512 L720,540 Z"/><path d="M790,540 L800,508 L810,540 Z"/>
    <path d="M900,540 L910,514 L920,540 Z"/><path d="M1050,540 L1060,510 L1070,540 Z"/>
    <path d="M1150,540 L1160,512 L1170,540 Z"/>
  </g>

  <!-- ENHANCED fire glow - larger, more opaque -->
  <ellipse cx="640" cy="530" rx="420" ry="130" fill="url(#fireGlow)" filter="url(#soft)"/>
  <ellipse cx="640" cy="520" rx="280" ry="80" fill="url(#fireGlow)" filter="url(#soft2)" opacity="0.8"/>

  <!-- REDRAWN fire with sharper, more irregular peaks -->
  <g filter="url(#soft2)">
    <path d="M598,548 C588,510 604,475 594,440 L602,452 C598,430 608,405 600,385 L612,400 C606,375 616,350 610,330 C622,365 618,390 624,415 C630,395 638,375 634,355 C646,385 640,410 644,435 C650,415 658,395 654,375 C666,405 660,430 664,455 C670,435 678,415 674,395 C686,425 680,450 684,475 C690,455 698,435 694,415 C706,445 700,470 704,495 C710,475 718,455 714,435 C726,465 720,490 724,515 L730,500 C736,520 732,540 728,548 Z" fill="url(#fire)" opacity="0.9"/>
    <path d="M610,548 C600,505 620,470 614,435 L622,448 C618,420 628,395 622,370 C634,400 628,425 632,450 C638,430 646,410 642,388 C654,418 648,440 652,462 C658,442 666,422 662,400 C674,430 668,455 672,478 C678,458 686,438 682,418 C694,448 688,472 692,498 L698,485 C704,505 700,525 696,548 Z" fill="url(#fire)"/>
    <path d="M624,548 C616,510 632,480 628,450 C636,465 640,480 644,495 C650,475 658,458 654,438 C666,465 660,488 664,508 C670,490 678,472 674,452 C686,478 680,500 684,520 L688,510 C694,528 690,540 686,548 Z" fill="#ffe9a0" opacity="0.85" filter="url(#soft4)"/>
  </g>
  <!-- bright inner core -->
  <g fill="#fff2c0" opacity="0.7" filter="url(#soft4)">
    <path d="M632,545 C626,500 640,465 636,430 C648,460 644,495 648,520 L652,505 C658,525 654,540 650,545 Z"/>
    <path d="M656,545 C650,505 664,470 660,440 C672,468 668,498 672,525 L676,512 C682,530 678,542 674,545 Z"/>
  </g>

  <!-- JAGGED IGNITION TRAIL connecting ember to flame -->
  <g>
    <path d="M640,520 L636,490 L644,460 L638,430 L646,400 L640,370 L648,340 L642,310 L646,280 L640,250 L644,220 L640,190" fill="none" stroke="url(#ignitionTrail)" stroke-width="5" stroke-linecap="round" stroke-linejoin="miter" opacity="0.65" filter="url(#soft4)"/>
    <path d="M640,520 L636,490 L644,460 L638,430 L646,400 L640,370 L648,340 L642,310 L646,280 L640,250 L644,220 L640,190" fill="none" stroke="#ff9d2e" stroke-width="14" stroke-linecap="round" stroke-linejoin="miter" opacity="0.12" filter="url(#soft)"/>
    <path d="M634,515 L630,485 L638,455 L632,425 L640,395 L634,365 L642,335 L636,305 L640,275 L634,245 L638,215 L634,195" fill="none" stroke="#ff6a20" stroke-width="3" stroke-linecap="round" stroke-linejoin="miter" opacity="0.3" filter="url(#soft4)"/>
    <path d="M648,518 L652,488 L644,458 L650,428 L642,398 L648,368 L640,338 L646,308 L642,278 L648,248 L644,218 L648,198" fill="none" stroke="#ff6a20" stroke-width="3" stroke-linecap="round" stroke-linejoin="miter" opacity="0.3" filter="url(#soft4)"/>
  </g>

  <!-- SMOKE PLUME -->
  <g fill="url(#smoke)" filter="url(#soft)">
    <path d="M600,420 C560,350 640,300 600,230 C560,170 660,130 620,80 C700,120 660,190 700,250 C740,310 660,350 690,420 C670,390 630,390 600,420 Z" opacity="0.45"/>
    <path d="M650,410 C620,340 700,290 670,220 C650,160 720,120 700,70 C770,110 730,180 760,240 C790,300 720,340 740,410 C710,380 690,380 650,410 Z" opacity="0.38"/>
    <path d="M570,420 C550,360 610,330 590,280 C570,230 630,200 620,150 C670,190 640,250 665,300 C690,355 620,390 640,420 C615,400 595,400 570,420 Z" opacity="0.32"/>
  </g>

  <!-- ASYMMETRIC NEAR RIDGE: left significantly larger and darker -->
  <!-- Left ridge (dominant, darker) -->
  <path d="M0,600 L100,560 L220,585 L340,550 L460,580 L560,555 L640,590 L640,800 L0,800 Z" fill="url(#mNearLeft)"/>
  <!-- Right ridge (smaller, lighter) -->
  <path d="M640,590 L720,570 L840,595 L960,575 L1080,600 L1200,580 L1280,605 L1280,800 L640,800 Z" fill="url(#mNearRight)"/>
  
  <!-- Trees on left ridge (darker) -->
  <g fill="#060302">
    <path d="M80,595 L94,558 L108,595 Z"/><path d="M160,588 L174,550 L188,588 Z"/>
    <path d="M240,582 L254,544 L268,582 Z"/><path d="M320,575 L334,537 L348,575 Z"/>
    <path d="M400,578 L414,540 L428,578 Z"/><path d="M480,572 L494,534 L508,572 Z"/>
    <path d="M540,575 L554,537 L568,575 Z"/><path d="M590,580 L604,542 L618,580 Z"/>
  </g>
  <!-- Trees on right ridge (slightly lighter) -->
  <g fill="#0c0704">
    <path d="M700,585 L714,547 L728,585 Z"/><path d="M780,588 L794,550 L808,588 Z"/>
    <path d="M860,592 L874,554 L888,592 Z"/><path d="M940,585 L954,547 L968,585 Z"/>
    <path d="M1020,595 L1034,557 L1048,595 Z"/><path d="M1100,590 L1114,552 L1128,590 Z"/>
    <path d="M1180,595 L1194,557 L1208,595 Z"/>
  </g>

  <!-- HEAT HAZE / GLOW BLEED -->
  <g>
    <ellipse cx="640" cy="590" rx="450" ry="55" fill="url(#heatHaze)" opacity="0.55" filter="url(#soft)"/>
    <ellipse cx="640" cy="530" rx="380" ry="45" fill="url(#heatHaze)" opacity="0.4" filter="url(#soft)"/>
    <path d="M0,600 L100,560 L220,585 L340,550 L460,580 L560,555 L640,590 L720,570 L840,595 L960,575 L1080,600 L1200,580 L1280,605 L1280,625 L1200,600 L1080,620 L960,595 L840,615 L720,590 L640,610 L560,575 L460,600 L340,570 L220,605 L100,580 L0,620 Z" fill="url(#heatHazeTop)" opacity="0.5" filter="url(#soft4)"/>
  </g>

  <!-- JAGGED IRREGULAR EMBER (replaces circular spark) -->
  <g filter="url(#glowF)">
    <path d="M640,175 L648,185 L656,178 L652,192 L662,198 L650,204 L658,215 L644,210 L640,222 L634,210 L622,215 L630,204 L618,198 L628,192 L624,178 L632,185 Z" fill="#fff2b0" opacity="0.9"/>
    <path d="M640,180 L645,187 L652,183 L648,194 L656,198 L646,202 L652,210 L642,206 L640,216 L636,206 L628,210 L634,202 L624,198 L632,194 L628,183 L635,187 Z" fill="#fff7d6"/>
  </g>
  <!-- ember glow -->
  <circle cx="640" cy="198" r="22" fill="#fff2b0" opacity="0.4" filter="url(#soft2)"/>

  <!-- rising embers -->
  <g fill="#ffd27a" filter="url(#soft2)">
    <circle cx="612" cy="320" r="3.5"/><circle cx="668" cy="300" r="3"/>
    <circle cx="640" cy="270" r="2.6"/><circle cx="600" cy="250" r="2.2"/>
    <circle cx="680" cy="235" r="2.4"/><circle cx="632" cy="210" r="2"/>
    <circle cx="660" cy="185" r="2.2"/><circle cx="618" cy="160" r="1.8"/>
    <circle cx="655" cy="135" r="1.8"/><circle cx="638" cy="110" r="1.6"/>
  </g>

  <!-- HEADLINE - tightened tracking, condensed humanist sans-serif -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" filter="url(#txt)">
    <text x="640" y="120" font-size="58" font-weight="900" letter-spacing="1" fill="#f4e4c4">ONE SPARK</text>
    <text x="640" y="175" font-size="58" font-weight="900" letter-spacing="1" fill="#f4e4c4">IS ENOUGH</text>
  </g>

  <!-- FOOTER TEXT - three distinct lines with bolded verbs -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" filter="url(#txt)">
    <text x="640" y="710" font-size="26" fill="#f4e4c4"><tspan font-weight="800">Check</tspan><tspan font-weight="400"> conditions.</tspan></text>
    <text x="640" y="745" font-size="26" fill="#f4e4c4"><tspan font-weight="800">Extinguish</tspan><tspan font-weight="400"> completely.</tspan></text>
    <text x="640" y="780" font-size="26" fill="#f4e4c4"><tspan font-weight="800">Protect</tspan><tspan font-weight="400"> the wild.</tspan></text>
  </g>
  
  <!-- Campaign name -->
  <text x="640" y="795" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="5" fill="#c07030" filter="url(#txt)">NATIONAL FOREST SAFETY INITIATIVE</text>
</svg>