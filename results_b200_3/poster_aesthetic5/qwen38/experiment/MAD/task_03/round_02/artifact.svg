<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2740"/>
      <stop offset="0.28" stop-color="#071a2c"/>
      <stop offset="0.6" stop-color="#04101c"/>
      <stop offset="1" stop-color="#01060c"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9e2f2" stop-opacity="0.42"/>
      <stop offset="0.4" stop-color="#4a93b6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#123049" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3ecf7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c3ecf7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.2" stop-color="#c9fbff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#4fe0f0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#4fe0f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.2" stop-color="#cfe4ff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#5a9dff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#5a9dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.2" stop-color="#ffe0f0" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ff6fb5" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff6fb5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.2" stop-color="#e2ffe4" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#5affa8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#5affa8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="jelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a7fb0" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="squid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17324e"/>
      <stop offset="1" stop-color="#0a1826"/>
    </linearGradient>
    <linearGradient id="headlineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#e8f4fa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8aacc0" stop-opacity="0.6"/>
    </linearGradient>
    
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="heavyBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="mediumBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="lightBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="extremeBlur" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
      <feComponentTransfer in="mono" result="opacityNoise">
        <feFuncA type="linear" slope="0.18" intercept="0"/>
      </feComponentTransfer>
      <feComposite operator="in" in="opacityNoise" in2="SourceGraphic" result="clipped"/>
      <feBlend in="SourceGraphic" in2="clipped" mode="screen"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="800" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="800" fill="url(#light)"/>

  <!-- Diffuse diagonal light beams (soft, fading) -->
  <g filter="url(#extremeBlur)">
    <polygon points="300,0 400,0 280,380 160,380" fill="#c3ecf7" opacity="0.18"/>
    <polygon points="620,0 720,0 580,420 480,420" fill="#a9d8ee" opacity="0.14"/>
    <polygon points="920,0 1020,0 860,360 760,360" fill="#c3ecf7" opacity="0.16"/>
    <polygon points="480,0 540,0 440,320 360,320" fill="#8fc4dd" opacity="0.12"/>
  </g>

  <!-- Grain/texture overlay for marine snow feel -->
  <rect x="0" y="0" width="1280" height="800" fill="#ffffff" opacity="0.03" filter="url(#grain)"/>

  <!-- Faint marine snow particles -->
  <g fill="#9fd0e6" opacity="0.8">
    <circle cx="180" cy="120" r="1.6" opacity="0.12"/>
    <circle cx="300" cy="200" r="1.2" opacity="0.1"/>
    <circle cx="420" cy="90" r="1.4" opacity="0.1"/>
    <circle cx="520" cy="260" r="1.8" opacity="0.12"/>
    <circle cx="640" cy="150" r="1.3" opacity="0.1"/>
    <circle cx="760" cy="230" r="1.5" opacity="0.1"/>
    <circle cx="880" cy="110" r="1.2" opacity="0.1"/>
    <circle cx="980" cy="300" r="1.7" opacity="0.12"/>
    <circle cx="1100" cy="180" r="1.4" opacity="0.1"/>
    <circle cx="240" cy="340" r="1.6" opacity="0.1"/>
    <circle cx="720" cy="380" r="1.5" opacity="0.1"/>
    <circle cx="1160" cy="360" r="1.3" opacity="0.1"/>
    <circle cx="350" cy="500" r="1.4" opacity="0.1"/>
    <circle cx="500" cy="580" r="1.2" opacity="0.08"/>
    <circle cx="800" cy="550" r="1.5" opacity="0.1"/>
    <circle cx="1050" cy="520" r="1.3" opacity="0.09"/>
  </g>

  <!-- ============ SHARP DEEP-SEA ORGANISMS ============ -->

  <!-- Siphonophore - left-center, sharp, with hot-core bioluminescence -->
  <g transform="translate(350, 350)">
    <!-- Faint ambient glow -->
    <ellipse cx="0" cy="0" rx="35" ry="140" fill="#ff6fb5" opacity="0.12" filter="url(#heavyBlur)"/>
    
    <!-- Main body - sharp dark silhouette -->
    <path d="M0,-120 C12,-100 18,-60 15,-20 C18,20 12,60 0,120 C-12,60 -18,20 -15,-20 C-18,-60 -12,-100 0,-120 Z" fill="#0a1520" opacity="0.9"/>
    
    <!-- Segments - slightly lighter -->
    <g fill="#122535" opacity="0.8">
      <ellipse cx="0" cy="-100" rx="8" ry="15"/>
      <ellipse cx="10" cy="-70" rx="7" ry="14"/>
      <ellipse cx="-8" cy="-40" rx="7" ry="14"/>
      <ellipse cx="12" cy="-10" rx="8" ry="15"/>
      <ellipse cx="-10" cy="20" rx="7" ry="14"/>
      <ellipse cx="8" cy="50" rx="7" ry="14"/>
      <ellipse cx="-5" cy="80" rx="8" ry="15"/>
      <ellipse cx="3" cy="110" rx="6" ry="12"/>
    </g>
    
    <!-- Hot-core bioluminescent nodes - sharp white/cyan centers -->
    <g>
      <circle cx="0" cy="-100" r="12" fill="url(#glowPink)" opacity="0.7"/>
      <circle cx="0" cy="-100" r="4" fill="#ffffff" opacity="0.95"/>
      
      <circle cx="10" cy="-70" r="10" fill="url(#glowPink)" opacity="0.65"/>
      <circle cx="10" cy="-70" r="3.5" fill="#ffffff" opacity="0.9"/>
      
      <circle cx="-8" cy="-40" r="11" fill="url(#glowPink)" opacity="0.7"/>
      <circle cx="-8" cy="-40" r="4" fill="#ffffff" opacity="0.95"/>
      
      <circle cx="12" cy="-10" r="12" fill="url(#glowPink)" opacity="0.75"/>
      <circle cx="12" cy="-10" r="4.5" fill="#ffffff" opacity="0.95"/>
      
      <circle cx="-10" cy="20" r="10" fill="url(#glowPink)" opacity="0.65"/>
      <circle cx="-10" cy="20" r="3.5" fill="#ffffff" opacity="0.9"/>
      
      <circle cx="8" cy="50" r="11" fill="url(#glowPink)" opacity="0.7"/>
      <circle cx="8" cy="50" r="4" fill="#ffffff" opacity="0.95"/>
      
      <circle cx="-5" cy="80" r="12" fill="url(#glowPink)" opacity="0.7"/>
      <circle cx="-5" cy="80" r="4" fill="#ffffff" opacity="0.95"/>
      
      <circle cx="3" cy="110" r="9" fill="url(#glowPink)" opacity="0.6"/>
      <circle cx="3" cy="110" r="3" fill="#ffffff" opacity="0.9"/>
    </g>
    
    <!-- Flowing tendrils - sharp -->
    <g stroke="#ff9fd0" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round">
      <path d="M0,-100 C20,-90 35,-70 28,-45"/>
      <path d="M10,-70 C28,-60 40,-40 32,-15"/>
      <path d="M-8,-40 C-25,-30 -35,-10 -28,15"/>
      <path d="M12,-10 C32,0 42,20 35,45"/>
      <path d="M-10,20 C-28,30 -38,50 -30,75"/>
      <path d="M8,50 C25,60 35,80 28,100"/>
      <path d="M-5,80 C-20,90 -30,110 -25,130"/>
    </g>
    
    <!-- Rim light on left edge -->
    <path d="M-15,-20 C-18,-60 -12,-100 0,-120" fill="none" stroke="#4fe0f0" stroke-width="1.2" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Anglerfish - center-right, larger, sharp focal point with rim light -->
  <g transform="translate(720, 450)">
    <!-- Ambient glow -->
    <ellipse cx="0" cy="0" rx="150" ry="90" fill="#5a9dff" opacity="0.15" filter="url(#extremeBlur)"/>
    
    <!-- Body - sharp dark silhouette -->
    <path d="M-85,5 C-115,-20 -110,35 -80,28 C-100,45 -85,58 -68,42 Z" fill="#0a1520" opacity="0.95"/>
    <path d="M-80,0 C-55,-55 18,-65 65,-42 C100,-22 105,22 70,45 C30,65 -45,58 -75,30 C-90,20 -90,8 -80,0 Z" fill="#0d1a28" opacity="0.95"/>
    <path d="M-75,8 C-52,-35 15,-45 58,-25 C88,-8 93,24 65,42 C30,60 -38,54 -70,28 C-83,18 -83,6 -75,8 Z" fill="#122235" opacity="0.9"/>
    
    <!-- Rim light - subtle cyan edge on top -->
    <path d="M-75,0 C-55,-55 18,-65 65,-42" fill="none" stroke="#4fe0f0" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
    <path d="M-65,-20 C-40,-45 15,-55 50,-40" fill="none" stroke="#c9fbff" stroke-width="0.8" opacity="0.35" stroke-linecap="round"/>
    
    <!-- Teeth - sharp -->
    <g>
      <path d="M-58,32 C-38,48 -12,48 5,32" fill="none" stroke="#050a12" stroke-width="3" opacity="0.8"/>
      <g stroke="#c9fbff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
        <path d="M-53,31 L-53,24"/>
        <path d="M-43,35 L-43,27"/>
        <path d="M-33,37 L-33,29"/>
        <path d="M-23,37 L-23,29"/>
        <path d="M-13,36 L-13,28"/>
        <path d="M-3,35 L-3,27"/>
        <path d="M7,33 L7,25"/>
      </g>
    </g>
    
    <!-- Eye - sharp, prominent -->
    <g>
      <circle cx="-28" cy="10" r="14" fill="#02050a" opacity="0.95"/>
      <circle cx="-28" cy="10" r="6" fill="#4fe0f0" opacity="0.85"/>
      <circle cx="-28" cy="10" r="2.5" fill="#ffffff" opacity="0.95"/>
      <circle cx="-26" cy="8" r="1" fill="#ffffff" opacity="1"/>
    </g>
    
    <!-- Lure/antenna - bioluminescent with hot core -->
    <g>
      <path d="M-58,-18 C-90,-60 -118,-78 -145,-75" fill="none" stroke="#4fe0f0" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
      <circle cx="-145" cy="-75" r="25" fill="url(#glowCyan)" opacity="0.8"/>
      <circle cx="-145" cy="-75" r="10" fill="#c9fbff" opacity="0.95"/>
      <circle cx="-145" cy="-75" r="4" fill="#ffffff" opacity="1"/>
    </g>
    
    <!-- Gill slits -->
    <g stroke="#2a5a7a" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round">
      <path d="M-22,-28 C-14,-44 4,-46 14,-32"/>
      <path d="M8,-20 C16,-38 36,-40 44,-25"/>
    </g>
    
    <!-- Pectoral fin -->
    <path d="M-30,25 C-45,35 -55,45 -65,40 C-55,50 -40,48 -28,38 Z" fill="#0d1a28" opacity="0.8"/>
  </g>

  <!-- Jellyfish - bottom-right, counter-weight, sharp with hot core -->
  <g transform="translate(950, 600)">
    <!-- Ambient glow -->
    <ellipse cx="0" cy="0" rx="110" ry="85" fill="#7fe6ff" opacity="0.2" filter="url(#extremeBlur)"/>
    
    <!-- Bell - sharp, translucent -->
    <path d="M-75,-12 C-75,-60 -32,-78 0,-78 C32,-78 75,-60 75,-12 C75,15 55,28 40,20 C28,32 12,32 0,20 C-12,32 -28,32 -40,20 C-55,28 -75,15 -75,-12 Z" fill="#0d2030" opacity="0.85"/>
    
    <!-- Bell inner glow structure - hot core -->
    <ellipse cx="0" cy="-35" rx="42" ry="28" fill="url(#glowCyan)" opacity="0.6"/>
    <ellipse cx="0" cy="-35" rx="20" ry="14" fill="#c9fbff" opacity="0.5"/>
    <ellipse cx="0" cy="-35" rx="8" ry="6" fill="#ffffff" opacity="0.7"/>
    
    <!-- Bell rim light -->
    <path d="M-75,-12 C-75,-60 -32,-78 0,-78 C32,-78 75,-60 75,-12" fill="none" stroke="#4fe0f0" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
    
    <!-- Tentacles - sharp, flowing -->
    <g stroke="#8fe8ff" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round">
      <path d="M-48,20 C-52,75 -42,135 -55,200 C-60,240 -50,270 -60,305"/>
      <path d="M-18,26 C-22,85 -12,150 -25,215 C-28,255 -18,285 -26,320"/>
      <path d="M12,28 C12,90 20,155 15,220 C12,260 20,290 16,325"/>
      <path d="M42,23 C46,80 36,145 48,205 C52,245 42,275 50,310"/>
      <path d="M-62,16 C-68,70 -62,130 -75,190 C-80,230 -70,260 -78,295"/>
      <path d="M55,18 C62,75 55,135 68,195 C72,235 62,265 70,300"/>
    </g>
    
    <!-- Thinner delicate strands -->
    <g stroke="#c9fbff" stroke-width="0.8" fill="none" opacity="0.4" stroke-linecap="round">
      <path d="M-38,22 C-42,85 -32,155 -48,220"/>
      <path d="M-8,28 C-10,90 -2,160 -14,225"/>
      <path d="M22,26 C24,88 34,158 27,223"/>
      <path d="M48,21 C53,83 43,153 56,218"/>
    </g>
    
    <!-- Oral arms - thicker, bioluminescent -->
    <g>
      <path d="M-14,23 C-18,75 -8,135 -18,195 C-23,235 -13,265 -20,295" fill="none" stroke="#5affa8" stroke-width="2.5" opacity="0.45" stroke-linecap="round"/>
      <path d="M14,23 C18,75 8,135 18,195 C23,235 13,265 20,295" fill="none" stroke="#5affa8" stroke-width="2.5" opacity="0.45" stroke-linecap="round"/>
      <!-- Hot core spots on oral arms -->
      <circle cx="-18" cy="100" r="6" fill="url(#glowGreen)" opacity="0.5"/>
      <circle cx="-18" cy="100" r="2" fill="#ffffff" opacity="0.8"/>
      <circle cx="18" cy="100" r="6" fill="url(#glowGreen)" opacity="0.5"/>
      <circle cx="18" cy="100" r="2" fill="#ffffff" opacity="0.8"/>
      <circle cx="-18" cy="200" r="5" fill="url(#glowGreen)" opacity="0.45"/>
      <circle cx="-18" cy="200" r="1.8" fill="#ffffff" opacity="0.75"/>
      <circle cx="18" cy="200" r="5" fill="url(#glowGreen)" opacity="0.45"/>
      <circle cx="18" cy="200" r="1.8" fill="#ffffff" opacity="0.75"/>
    </g>
  </g>

  <!-- Distant bioluminescent organisms - scattered, with hot cores -->
  <g>
    <g>
      <circle cx="450" cy="350" r="22" fill="url(#glowPink)" opacity="0.5"/>
      <circle cx="450" cy="350" r="3" fill="#ffffff" opacity="0.85"/>
      
      <circle cx="720" cy="320" r="18" fill="url(#glowGreen)" opacity="0.5"/>
      <circle cx="720" cy="320" r="2.5" fill="#ffffff" opacity="0.8"/>
      
      <circle cx="1050" cy="280" r="20" fill="url(#glowCyan)" opacity="0.45"/>
      <circle cx="1050" cy="280" r="3" fill="#ffffff" opacity="0.8"/>
      
      <circle cx="150" cy="450" r="16" fill="url(#glowBlue)" opacity="0.45"/>
      <circle cx="150" cy="450" r="2.5" fill="#ffffff" opacity="0.8"/>
      
      <circle cx="1150" cy="550" r="19" fill="url(#glowPink)" opacity="0.4"/>
      <circle cx="1150" cy="550" r="2.5" fill="#ffffff" opacity="0.75"/>
    </g>
    
    <!-- Tiny plankton glows -->
    <g>
      <circle cx="380" cy="480" r="12" fill="url(#glowCyan)" opacity="0.45"/>
      <circle cx="380" cy="480" r="2" fill="#ffffff" opacity="0.75"/>
      
      <circle cx="550" cy="550" r="14" fill="url(#glowBlue)" opacity="0.5"/>
      <circle cx="550" cy="550" r="2.5" fill="#ffffff" opacity="0.75"/>
      
      <circle cx="680" cy="620" r="16" fill="url(#glowPink)" opacity="0.45"/>
      <circle cx="680" cy="620" r="2.5" fill="#ffffff" opacity="0.7"/>
      
      <circle cx="820" cy="680" r="13" fill="url(#glowGreen)" opacity="0.5"/>
      <circle cx="820" cy="680" r="2" fill="#ffffff" opacity="0.75"/>
      
      <circle cx="950" cy="520" r="11" fill="url(#glowCyan)" opacity="0.4"/>
      <circle cx="950" cy="520" r="1.8" fill="#ffffff" opacity="0.7"/>
    </g>
  </g>

  <!-- Drifting marine snow - brighter, closer -->
  <g fill="#cfeaf5">
    <circle cx="200" cy="180" r="2.4" opacity="0.35"/>
    <circle cx="360" cy="240" r="2" opacity="0.3"/>
    <circle cx="480" cy="150" r="2.6" opacity="0.35"/>
    <circle cx="540" cy="320" r="2" opacity="0.3"/>
    <circle cx="600" cy="200" r="2.4" opacity="0.35"/>
    <circle cx="700" cy="280" r="2" opacity="0.3"/>
    <circle cx="820" cy="180" r="2.6" opacity="0.35"/>
    <circle cx="900" cy="340" r="2" opacity="0.3"/>
    <circle cx="1020" cy="240" r="2.4" opacity="0.35"/>
    <circle cx="1150" cy="150" r="2" opacity="0.3"/>
    <circle cx="260" cy="420" r="2.4" opacity="0.3"/>
    <circle cx="400" cy="470" r="2" opacity="0.25"/>
    <circle cx="520" cy="430" r="2.4" opacity="0.3"/>
    <circle cx="660" cy="420" r="2" opacity="0.25"/>
    <circle cx="860" cy="440" r="2.4" opacity="0.3"/>
    <circle cx="1080" cy="420" r="2" opacity="0.25"/>
    <circle cx="300" cy="600" r="2.2" opacity="0.25"/>
    <circle cx="500" cy="650" r="2" opacity="0.2"/>
    <circle cx="700" cy="600" r="2.4" opacity="0.25"/>
    <circle cx="900" cy="650" r="2" opacity="0.2"/>
  </g>

  <!-- Vignette -->
  <rect x="0" y="0" width="1280" height="800" fill="url(#vignette)"/>

  <!-- ============ TEXT BLOCK (shifted ~12% left for descent path) ============ -->
  
  <!-- Faint cyan glow behind text block -->
  <g filter="url(#heavyBlur)" opacity="0.15">
    <rect x="180" y="60" width="520" height="380" fill="#4fe0f0"/>
  </g>
  
  <!-- Museum name - top -->
  <text x="440" y="108" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="6" fill="#8fc4dd">CALDER MUSEUM OF NATURAL HISTORY</text>
  <line x1="360" y1="124" x2="520" y2="124" stroke="#4a8aaa" stroke-width="1" opacity="0.7"/>

  <!-- Headline - medium weight serif, 90% white, sharp, with faint cyan glow -->
  <g>
    <!-- Subtle cyan glow behind headline -->
    <g filter="url(#mediumBlur)" opacity="0.2">
      <text x="440" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="500" letter-spacing="10" fill="#4fe0f0">BELOW THE</text>
      <text x="440" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="500" letter-spacing="10" fill="#4fe0f0">LAST LIGHT</text>
    </g>
    <!-- Sharp headline text -->
    <text x="440" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="500" letter-spacing="10" fill="#f0f8fc">BELOW THE</text>
    <text x="440" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="500" letter-spacing="10" fill="#f0f8fc">LAST LIGHT</text>
  </g>

  <!-- Divider line -->
  <line x1="320" y1="332" x2="560" y2="332" stroke="#4fe0f0" stroke-width="1.4" opacity="0.7"/>
  <circle cx="440" cy="332" r="3" fill="#c9fbff"/>

  <!-- Subtitle -->
  <text x="440" y="368" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" letter-spacing="1" fill="#b8dcee">Life at the edge of the known world</text>

  <!-- Bottom date block -->
  <text x="440" y="700" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="5" fill="#d8ecf5">SPECIAL EXHIBITION</text>
  <text x="440" y="732" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="3" fill="#eaf6ff">November 2 – March 9</text>

