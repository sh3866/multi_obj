<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2740"/>
      <stop offset="0.28" stop-color="#071a2c"/>
      <stop offset="0.6" stop-color="#04101c"/>
      <stop offset="1" stop-color="#01060c"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9e2f2" stop-opacity="0.42"/>
      <stop offset="0.4" stop-color="#4a93b6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#123049" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3ecf7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c3ecf7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9fbff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#4fe0f0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#4fe0f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfe4ff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#5a9dff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#5a9dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe0f0" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#ff6fb5" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff6fb5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e2ffe4" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#5affa8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5affa8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="jelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a7fb0" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="squid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17324e"/>
      <stop offset="1" stop-color="#0a1826"/>
    </linearGradient>
    <linearGradient id="headlineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#d8ecf5" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7a9ab0" stop-opacity="0.55"/>
    </linearGradient>
    
    <!-- Filters for ethereal effect -->
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="heavyBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="mediumBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="lightBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="extremeBlur" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
      <feComponentTransfer in="mono" result="opacityNoise">
        <feFuncA type="linear" slope="0.18" intercept="0"/>
      </feComponentTransfer>
      <feComposite operator="in" in="opacityNoise" in2="SourceGraphic" result="clipped"/>
      <feBlend in="SourceGraphic" in2="clipped" mode="screen"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="800" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="800" fill="url(#light)"/>

  <!-- Diffuse diagonal light beams (soft, fading) -->
  <g filter="url(#extremeBlur)">
    <polygon points="300,0 400,0 280,380 160,380" fill="#c3ecf7" opacity="0.18"/>
    <polygon points="620,0 720,0 580,420 480,420" fill="#a9d8ee" opacity="0.14"/>
    <polygon points="920,0 1020,0 860,360 760,360" fill="#c3ecf7" opacity="0.16"/>
    <polygon points="480,0 540,0 440,320 360,320" fill="#8fc4dd" opacity="0.12"/>
  </g>

  <!-- Grain/texture overlay for marine snow feel -->
  <rect x="0" y="0" width="1280" height="800" fill="#ffffff" opacity="0.03" filter="url(#grain)"/>

  <!-- Faint marine snow particles -->
  <g fill="#9fd0e6" opacity="0.8">
    <circle cx="180" cy="120" r="1.6" opacity="0.12"/>
    <circle cx="300" cy="200" r="1.2" opacity="0.1"/>
    <circle cx="420" cy="90" r="1.4" opacity="0.1"/>
    <circle cx="520" cy="260" r="1.8" opacity="0.12"/>
    <circle cx="640" cy="150" r="1.3" opacity="0.1"/>
    <circle cx="760" cy="230" r="1.5" opacity="0.1"/>
    <circle cx="880" cy="110" r="1.2" opacity="0.1"/>
    <circle cx="980" cy="300" r="1.7" opacity="0.12"/>
    <circle cx="1100" cy="180" r="1.4" opacity="0.1"/>
    <circle cx="240" cy="340" r="1.6" opacity="0.1"/>
    <circle cx="720" cy="380" r="1.5" opacity="0.1"/>
    <circle cx="1160" cy="360" r="1.3" opacity="0.1"/>
    <circle cx="350" cy="500" r="1.4" opacity="0.1"/>
    <circle cx="500" cy="580" r="1.2" opacity="0.08"/>
    <circle cx="800" cy="550" r="1.5" opacity="0.1"/>
    <circle cx="1050" cy="520" r="1.3" opacity="0.09"/>
  </g>

  <!-- ============ ETHEREAL CREATURES (diagonal drift, top-left to bottom-right) ============ -->

  <!-- Small jellyfish - top-left, faint, small scale -->
  <g transform="translate(180, 130) scale(0.55)" opacity="0.4">
    <g filter="url(#heavyBlur)">
      <ellipse cx="0" cy="0" rx="80" ry="55" fill="#7fe6ff" opacity="0.3"/>
    </g>
    <g filter="url(#mediumBlur)">
      <path d="M-60,-10 C-60,-45 -25,-58 0,-58 C25,-58 60,-45 60,-10 C60,15 45,25 30,18 C20,28 5,28 -5,18 C-15,28 -30,28 -45,18 C-55,25 -60,15 -60,-10 Z" fill="#7fe6ff" opacity="0.45"/>
      <g stroke="#a8f0ff" stroke-width="1.8" fill="none" opacity="0.5" stroke-linecap="round">
        <path d="M-40,20 C-42,65 -35,100 -45,145"/>
        <path d="M-15,25 C-17,70 -8,110 -15,160"/>
        <path d="M10,27 C10,75 18,115 12,165"/>
        <path d="M35,22 C38,68 30,108 38,152"/>
      </g>
    </g>
  </g>

  <!-- Siphonophore - mid-left, medium, flowing -->
  <g transform="translate(320, 280) scale(0.7)" opacity="0.5">
    <g filter="url(#heavyBlur)">
      <ellipse cx="0" cy="0" rx="40" ry="120" fill="#ff6fb5" opacity="0.25"/>
    </g>
    <g filter="url(#mediumBlur)">
      <path d="M0,-100 C15,-80 20,-40 15,0 C18,40 10,80 0,100 C-10,80 -18,40 -15,0 C-20,-40 -15,-80 0,-100 Z" fill="#ff6fb5" opacity="0.35"/>
      <g fill="#ffe0f0" opacity="0.6">
        <circle cx="0" cy="-80" r="4"/>
        <circle cx="8" cy="-55" r="3"/>
        <circle cx="-8" cy="-30" r="3.5"/>
        <circle cx="5" cy="0" r="4"/>
        <circle cx="-6" cy="30" r="3"/>
        <circle cx="7" cy="55" r="3.5"/>
        <circle cx="0" cy="80" r="4"/>
      </g>
      <g stroke="#ff9fd0" stroke-width="1.2" fill="none" opacity="0.4" stroke-linecap="round">
        <path d="M0,-80 C15,-70 25,-50 20,-30"/>
        <path d="M8,-55 C20,-45 28,-25 22,-5"/>
        <path d="M-8,-30 C-20,-20 -28,0 -22,20"/>
        <path d="M5,0 C18,10 25,30 18,50"/>
        <path d="M-6,30 C-18,40 -25,60 -18,80"/>
      </g>
    </g>
  </g>

  <!-- Anglerfish - mid-center, larger, more detailed -->
  <g transform="translate(580, 420) scale(0.85)" opacity="0.65">
    <!-- Ambient glow -->
    <g filter="url(#extremeBlur)">
      <ellipse cx="0" cy="0" rx="160" ry="100" fill="#5a9dff" opacity="0.2"/>
    </g>
    <!-- Body - soft, blurred -->
    <g filter="url(#mediumBlur)">
      <path d="M-80,10 C-110,-15 -105,30 -75,25 C-95,40 -80,55 -65,40 Z" fill="#1a3550" opacity="0.7"/>
      <path d="M-75,0 C-50,-50 15,-60 60,-38 C95,-20 100,20 65,42 C25,62 -40,55 -70,28 C-85,18 -85,5 -75,0 Z" fill="#152d42" opacity="0.8"/>
      <path d="M-70,8 C-48,-32 12,-42 55,-22 C85,-6 90,22 62,40 C28,58 -35,52 -65,25 C-78,15 -78,5 -70,8 Z" fill="#1c3a55" opacity="0.7"/>
    </g>
    <!-- Teeth - subtle -->
    <g filter="url(#lightBlur)">
      <path d="M-55,35 C-35,50 -10,50 8,35" fill="none" stroke="#0a1a2b" stroke-width="4" opacity="0.6"/>
      <g stroke="#c9fbff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5">
        <path d="M-50,34 L-50,27"/>
        <path d="M-40,38 L-40,30"/>
        <path d="M-30,40 L-30,32"/>
        <path d="M-20,40 L-20,32"/>
        <path d="M-10,39 L-10,31"/>
        <path d="M0,38 L0,30"/>
        <path d="M10,36 L10,29"/>
      </g>
    </g>
    <!-- Eye -->
    <g filter="url(#lightBlur)">
      <circle cx="-25" cy="12" r="12" fill="#02070d" opacity="0.8"/>
      <circle cx="-25" cy="12" r="5" fill="#8fe8ff" opacity="0.7"/>
      <circle cx="-23" cy="10" r="1.8" fill="#ffffff" opacity="0.9"/>
    </g>
    <!-- Lure/antenna - bioluminescent -->
    <g filter="url(#mediumBlur)">
      <path d="M-55,-15 C-85,-55 -110,-70 -135,-68" fill="none" stroke="#4fe0f0" stroke-width="2" opacity="0.5"/>
      <circle cx="-135" cy="-68" r="22" fill="#4fe0f0" opacity="0.5"/>
      <circle cx="-135" cy="-68" r="8" fill="#c9fbff" opacity="0.8"/>
      <circle cx="-135" cy="-68" r="3" fill="#ffffff"/>
    </g>
    <!-- Gill slits -->
    <g filter="url(#lightBlur)">
      <path d="M-20,-25 C-12,-40 5,-42 15,-28" fill="none" stroke="#2a5a7a" stroke-width="2.5" opacity="0.4"/>
      <path d="M10,-18 C18,-35 38,-37 45,-22" fill="none" stroke="#2a5a7a" stroke-width="2" opacity="0.35"/>
    </g>
  </g>

  <!-- Jellyfish - bottom-right, largest, most detailed -->
  <g transform="translate(880, 580) scale(1.1)" opacity="0.75">
    <!-- Ambient glow -->
    <g filter="url(#extremeBlur)">
      <ellipse cx="0" cy="0" rx="120" ry="90" fill="#7fe6ff" opacity="0.3"/>
    </g>
    <!-- Bell - soft, dissolving -->
    <g filter="url(#heavyBlur)">
      <path d="M-80,-15 C-80,-65 -35,-82 0,-82 C35,-82 80,-65 80,-15 C80,18 58,30 42,22 C30,34 12,34 0,22 C-12,34 -30,34 -42,22 C-58,30 -80,18 -80,-15 Z" fill="#7fe6ff" opacity="0.5"/>
    </g>
    <g filter="url(#mediumBlur)">
      <path d="M-70,-12 C-70,-55 -30,-70 0,-70 C30,-70 70,-55 70,-12 C70,15 50,25 35,18 C25,28 10,28 0,18 C-10,28 -25,28 -35,18 C-50,25 -70,15 -70,-12 Z" fill="#a8f0ff" opacity="0.4"/>
      <!-- Inner glow structure -->
      <ellipse cx="0" cy="-35" rx="45" ry="30" fill="#c9fbff" opacity="0.25"/>
    </g>
    <!-- Tentacles - flowing, dissolving -->
    <g filter="url(#mediumBlur)">
      <g stroke="#8fe8ff" stroke-width="2.2" fill="none" opacity="0.55" stroke-linecap="round">
        <path d="M-50,22 C-55,80 -45,140 -60,210 C-65,250 -55,280 -65,320"/>
        <path d="M-20,28 C-25,90 -15,155 -28,225 C-32,265 -22,295 -30,340"/>
        <path d="M10,30 C10,95 20,160 15,230 C12,270 22,300 18,345"/>
        <path d="M40,25 C45,85 35,150 48,215 C52,255 42,285 50,325"/>
        <path d="M-65,18 C-72,75 -65,135 -80,200 C-85,240 -75,270 -85,310"/>
        <path d="M55,20 C62,78 55,140 68,205 C72,245 62,275 70,315"/>
      </g>
      <!-- Thinner, more delicate strands -->
      <g stroke="#c9fbff" stroke-width="1" fill="none" opacity="0.3" stroke-linecap="round">
        <path d="M-40,25 C-45,90 -35,160 -50,230"/>
        <path d="M-10,30 C-12,95 -2,165 -15,235"/>
        <path d="M20,28 C22,92 32,162 25,232"/>
        <path d="M50,23 C55,88 45,158 58,228"/>
      </g>
    </g>
    <!-- Oral arms - thicker, more central -->
    <g filter="url(#lightBlur)">
      <path d="M-15,25 C-20,80 -10,140 -20,200 C-25,240 -15,270 -22,300" fill="none" stroke="#5affa8" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
      <path d="M15,25 C20,80 10,140 20,200 C25,240 15,270 22,300" fill="none" stroke="#5affa8" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Distant bioluminescent organisms - scattered -->
  <g>
    <!-- Small glowing spots - like distant creatures -->
    <g filter="url(#mediumBlur)">
      <circle cx="450" cy="350" r="28" fill="#ff6fb5" opacity="0.4"/>
      <circle cx="450" cy="350" r="4" fill="#ffe0f0" opacity="0.7"/>
      
      <circle cx="720" cy="320" r="22" fill="#5affa8" opacity="0.45"/>
      <circle cx="720" cy="320" r="3" fill="#e2ffe4" opacity="0.7"/>
      
      <circle cx="1050" cy="280" r="25" fill="#4fe0f0" opacity="0.4"/>
      <circle cx="1050" cy="280" r="3.5" fill="#c9fbff" opacity="0.7"/>
      
      <circle cx="150" cy="450" r="20" fill="#5a9dff" opacity="0.4"/>
      <circle cx="150" cy="450" r="3" fill="#cfe4ff" opacity="0.7"/>
      
      <circle cx="1150" cy="550" r="24" fill="#ff6fb5" opacity="0.35"/>
      <circle cx="1150" cy="550" r="3" fill="#ffe0f0" opacity="0.6"/>
    </g>
    
    <!-- Tiny plankton glows -->
    <g filter="url(#lightBlur)">
      <circle cx="380" cy="480" r="15" fill="#4fe0f0" opacity="0.4"/>
      <circle cx="380" cy="480" r="2.5" fill="#c9fbff" opacity="0.6"/>
      
      <circle cx="550" cy="550" r="18" fill="#5a9dff" opacity="0.45"/>
      <circle cx="550" cy="550" r="3" fill="#cfe4ff" opacity="0.65"/>
      
      <circle cx="680" cy="620" r="20" fill="#ff6fb5" opacity="0.4"/>
      <circle cx="680" cy="620" r="3" fill="#ffe0f0" opacity="0.6"/>
      
      <circle cx="820" cy="680" r="16" fill="#5affa8" opacity="0.45"/>
      <circle cx="820" cy="680" r="2.5" fill="#e2ffe4" opacity="0.65"/>
      
      <circle cx="950" cy="520" r="14" fill="#4fe0f0" opacity="0.4"/>
      <circle cx="950" cy="520" r="2" fill="#c9fbff" opacity="0.6"/>
    </g>
  </g>

  <!-- Drifting marine snow - brighter, closer -->
  <g fill="#cfeaf5">
    <circle cx="200" cy="180" r="2.4" opacity="0.35"/>
    <circle cx="360" cy="240" r="2" opacity="0.3"/>
    <circle cx="480" cy="150" r="2.6" opacity="0.35"/>
    <circle cx="540" cy="320" r="2" opacity="0.3"/>
    <circle cx="600" cy="200" r="2.4" opacity="0.35"/>
    <circle cx="700" cy="280" r="2" opacity="0.3"/>
    <circle cx="820" cy="180" r="2.6" opacity="0.35"/>
    <circle cx="900" cy="340" r="2" opacity="0.3"/>
    <circle cx="1020" cy="240" r="2.4" opacity="0.35"/>
    <circle cx="1150" cy="150" r="2" opacity="0.3"/>
    <circle cx="260" cy="420" r="2.4" opacity="0.3"/>
    <circle cx="400" cy="470" r="2" opacity="0.25"/>
    <circle cx="520" cy="430" r="2.4" opacity="0.3"/>
    <circle cx="660" cy="420" r="2" opacity="0.25"/>
    <circle cx="860" cy="440" r="2.4" opacity="0.3"/>
    <circle cx="1080" cy="420" r="2" opacity="0.25"/>
    <circle cx="300" cy="600" r="2.2" opacity="0.25"/>
    <circle cx="500" cy="650" r="2" opacity="0.2"/>
    <circle cx="700" cy="600" r="2.4" opacity="0.25"/>
    <circle cx="900" cy="650" r="2" opacity="0.2"/>
  </g>

  <!-- Vignette -->
  <rect x="0" y="0" width="1280" height="800" fill="url(#vignette)"/>

  <!-- ============ TEXT BLOCK (centered) ============ -->
  
  <!-- Museum name - top -->
  <text x="640" y="108" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="6" fill="#7fb8d4">CALDER MUSEUM OF NATURAL HISTORY</text>
  <line x1="560" y1="124" x2="720" y2="124" stroke="#3a6f8f" stroke-width="1" opacity="0.6"/>

  <!-- Headline with vertical gradient and subtle vertical scale distortion -->
  <g transform="translate(640, 255) scale(1, 0.97)">
    <text x="0" y="-45" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" letter-spacing="10" fill="url(#headlineGrad)">BELOW THE</text>
    <text x="0" y="45" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" letter-spacing="10" fill="url(#headlineGrad)">LAST LIGHT</text>
  </g>

  <!-- Divider line -->
  <line x1="520" y1="332" x2="760" y2="332" stroke="#4fe0f0" stroke-width="1.4" opacity="0.7"/>
  <circle cx="640" cy="332" r="3" fill="#c9fbff"/>

  <!-- Subtitle -->
  <text x="640" y="368" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" letter-spacing="1" fill="#a9d6ec">Life at the edge of the known world</text>

  <!-- Bottom date block - aligned with headline width, increased tracking -->
  <text x="640" y="700" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="5" fill="#cfe8f5">SPECIAL EXHIBITION</text>
  <text x="640" y="732" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="3" fill="#eaf6ff">November 2 – March 9</text>

</svg>