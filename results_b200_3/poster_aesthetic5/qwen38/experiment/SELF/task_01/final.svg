<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0604"/>
      <stop offset="0.40" stop-color="#1c0f07"/>
      <stop offset="0.65" stop-color="#4a2212"/>
      <stop offset="0.85" stop-color="#8a3a18"/>
      <stop offset="1" stop-color="#c46a28"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6dd" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#ffce7d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffce7d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b3d28"/>
      <stop offset="1" stop-color="#4a2a1a"/>
    </linearGradient>
    <linearGradient id="mMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#352015"/>
      <stop offset="1" stop-color="#1a0e08"/>
    </linearGradient>
    <linearGradient id="mNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a04"/>
      <stop offset="1" stop-color="#050201"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff4a10"/>
      <stop offset="0.45" stop-color="#ff8c20"/>
      <stop offset="0.8" stop-color="#ffc850"/>
      <stop offset="1" stop-color="#fff0a0"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a30" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ff5a1a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="smoke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4a3828" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#3a2c20" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2a2018" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="soft2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glowF" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="txt" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="1280" height="800" fill="url(#sky)"/>

  <!-- Sun glow behind ridge -->
  <circle cx="640" cy="460" r="300" fill="url(#sun)"/>
  <circle cx="640" cy="460" r="45" fill="#fff2cf" opacity="0.7" filter="url(#soft2)"/>

  <!-- Far ridge -->
  <path d="M0,460 L140,425 L290,448 L440,415 L580,442 L740,412 L900,445 L1060,418 L1280,448 L1280,800 L0,800 Z" fill="url(#mFar)" opacity="0.9"/>

  <!-- Mid ridge -->
  <path d="M0,530 L150,495 L320,528 L490,488 L630,522 L810,485 L990,525 L1150,492 L1280,525 L1280,800 L0,800 Z" fill="url(#mMid)"/>

  <!-- Mid ridge trees -->
  <g fill="#1a0e07">
    <path d="M220,528 L232,498 L244,528 Z"/>
    <path d="M350,528 L362,496 L374,528 Z"/>
    <path d="M440,528 L452,500 L464,528 Z"/>
    <path d="M530,528 L542,494 L554,528 Z"/>
    <path d="M680,528 L692,498 L704,528 Z"/>
    <path d="M770,528 L782,494 L794,528 Z"/>
    <path d="M870,528 L882,500 L894,528 Z"/>
    <path d="M960,528 L972,496 L984,528 Z"/>
    <path d="M1080,528 L1092,498 L1104,528 Z"/>
    <path d="M1180,528 L1192,494 L1204,528 Z"/>
  </g>

  <!-- Fire glow on ridge -->
  <ellipse cx="640" cy="510" rx="320" ry="90" fill="url(#fireGlow)" filter="url(#soft)"/>

  <!-- Flame tongues -->
  <g filter="url(#soft2)">
    <path d="M455,535 C446,488 470,455 464,412 C484,455 490,492 484,535 Z" fill="url(#fire)" opacity="0.8"/>
    <path d="M510,538 C500,482 530,448 524,400 C546,448 552,488 546,538 Z" fill="url(#fire)" opacity="0.88"/>
    <path d="M572,540 C560,478 594,440 588,390 C612,440 618,485 610,540 Z" fill="url(#fire)" opacity="0.95"/>
    <path d="M638,542 C626,475 662,438 656,385 C680,438 686,482 678,542 Z" fill="url(#fire)"/>
    <path d="M704,540 C692,478 726,442 720,395 C744,442 750,485 742,540 Z" fill="url(#fire)" opacity="0.95"/>
    <path d="M768,538 C758,482 788,450 782,405 C804,450 810,488 804,538 Z" fill="url(#fire)" opacity="0.88"/>
    <path d="M824,535 C816,490 840,458 834,415 C854,458 860,492 854,535 Z" fill="url(#fire)" opacity="0.8"/>
  </g>

  <!-- Inner flame cores -->
  <g fill="#fff0a8" opacity="0.85" filter="url(#soft2)">
    <path d="M575,540 C569,498 585,475 581,445 C595,475 599,505 593,540 Z"/>
    <path d="M640,542 C634,495 652,472 648,438 C664,472 668,502 662,542 Z"/>
    <path d="M706,540 C700,498 718,476 714,448 C728,476 732,505 726,540 Z"/>
  </g>

  <!-- Smoke rising -->
  <g fill="url(#smoke)" filter="url(#soft)">
    <path d="M580,455 C540,385 620,345 580,280 C545,220 640,185 600,125 C680,165 640,235 680,295 C720,355 640,400 670,455 C645,425 610,425 580,455 Z" opacity="0.48"/>
    <path d="M640,440 C610,375 680,335 650,270 C630,210 700,178 680,115 C750,155 710,225 740,285 C770,345 700,390 720,440 C690,415 670,415 640,440 Z" opacity="0.4"/>
    <path d="M540,455 C520,395 580,365 560,315 C540,265 600,235 590,185 C640,225 610,285 635,335 C660,390 590,425 610,455 C585,435 565,435 540,455 Z" opacity="0.32"/>
  </g>

  <!-- Near ridge -->
  <path d="M0,625 L170,585 L350,622 L540,580 L640,608 L830,578 L1030,618 L1200,582 L1280,608 L1280,800 L0,800 Z" fill="url(#mNear)"/>

  <!-- Near ridge trees -->
  <g fill="#060301">
    <path d="M100,622 L116,582 L132,622 Z"/>
    <path d="M190,625 L206,585 L222,625 Z"/>
    <path d="M290,620 L306,582 L322,620 Z"/>
    <path d="M390,624 L406,584 L422,624 Z"/>
    <path d="M480,622 L496,582 L512,622 Z"/>
    <path d="M580,616 L596,578 L612,616 Z"/>
    <path d="M680,614 L696,576 L712,614 Z"/>
    <path d="M790,616 L806,578 L822,616 Z"/>
    <path d="M890,620 L906,582 L922,620 Z"/>
    <path d="M990,624 L1006,584 L1022,624 Z"/>
    <path d="M1090,622 L1106,582 L1122,622 Z"/>
    <path d="M1180,625 L1196,585 L1212,625 Z"/>
  </g>

  <!-- THE SPARK - the single point of origin -->
  <circle cx="640" cy="340" r="40" fill="#fff2b0" opacity="0.5" filter="url(#soft2)"/>
  <circle cx="640" cy="340" r="18" fill="#fff8e0" filter="url(#glowF)"/>

  <!-- Rising embers - tracing path from spark to flame -->
  <g fill="#ffd27a" filter="url(#soft2)">
    <circle cx="620" cy="305" r="3.5"/>
    <circle cx="660" cy="285" r="3"/>
    <circle cx="640" cy="258" r="2.8"/>
    <circle cx="610" cy="235" r="2.4"/>
    <circle cx="670" cy="218" r="2.4"/>
    <circle cx="635" cy="195" r="2.2"/>
    <circle cx="660" cy="172" r="2"/>
    <circle cx="622" cy="150" r="1.8"/>
    <circle cx="648" cy="128" r="1.8"/>
    <circle cx="638" cy="108" r="1.5"/>
  </g>

  <!-- Top headline -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" filter="url(#txt)">
    <text x="640" y="82" font-size="56" font-weight="800" letter-spacing="12" fill="#f5d090">ONE SPARK IS ENOUGH</text>
    <rect x="400" y="102" width="480" height="3" fill="#d4944a" opacity="0.75"/>
  </g>

  <!-- Bottom panel -->
  <rect x="0" y="660" width="1280" height="140" fill="#080402" opacity="0.96"/>
  <rect x="0" y="658" width="1280" height="3" fill="#ff7a2e" opacity="0.9"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="640" y="710" font-size="26" font-weight="600" letter-spacing="1" fill="#f4e4c4">Check conditions.  Extinguish completely.  Protect the wild.</text>
    <text x="640" y="752" font-size="18" font-weight="700" letter-spacing="6" fill="#d48840">NATIONAL FOREST SAFETY INITIATIVE</text>
  </g>
</svg>