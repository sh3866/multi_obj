<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Sky Gradient: Deep Night Blue to Midnight -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Mountain Gradient: Textured Silhouette -->
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>

    <!-- Fire Line Gradient: Ember Core -->
    <linearGradient id="fireGradCore" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Fire Line Gradient: Outer Glow -->
    <linearGradient id="fireGradGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <!-- Smoke Gradient: Atmospheric Haze -->
    <linearGradient id="smokeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.15" />
      <stop offset="30%" stop-color="#57534e" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="heavyBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="fireGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="2.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="1"/>
    </filter>

    <!-- Tree Pattern for Forest Ridge -->
    <g id="pineTree">
      <path d="M0,0 L-6,18 L-12,18 L-5,30 L-14,30 L0,60 L14,30 L5,30 L12,18 L6,18 Z" fill="#000000" />
    </g>
  </defs>

  <!-- Background Sky -->
  <rect width="1280" height="800" fill="url(#skyGrad)" />

  <!-- Distant Smoke Clouds -->
  <g filter="url(#heavyBlur)">
    <path d="M 0 400 C 300 200, 600 500, 900 300 C 1100 100, 1280 200, 1280 200 L 1280 -100 L 0 -100 Z" fill="url(#smokeGrad)" opacity="0.8" />
    <path d="M 200 500 C 500 300, 800 600, 1280 400 L 1280 -100 L 200 -100 Z" fill="url(#smokeGrad)" opacity="0.6" />
  </g>

  <!-- The Mountain (Centerpiece) -->
  <g id="mountain">
    <!-- Main Peak -->
    <path d="M -50 800 L 450 280 L 650 180 L 850 240 L 1330 800 Z" fill="url(#mountainGrad)" />
    <!-- Secondary Peaks for depth -->
    <path d="M -100 800 L 250 550 L 450 280 Z" fill="#020617" />
    <path d="M 850 240 L 1050 400 L 1400 800 Z" fill="#0c0a09" opacity="0.8" />
  </g>

  <!-- The Forest Silhouette (Foreground Ridge) -->
  <!-- A jagged, menacing ridge line -->
  <path d="M0 800 L0 730 L20 710 L40 740 L60 720 L80 750 L100 730 L120 760 L140 740 L160 770 L180 750 L200 780 L220 760 L240 790 L260 770 L280 800 L300 780 L320 810 L340 790 L360 820 L380 800 L400 830 L420 810 L440 840 L460 820 L480 850 L500 830 L520 860 L540 840 L560 870 L580 850 L600 880 L620 860 L640 890 L660 870 L680 900 L700 880 L720 910 L740 890 L760 920 L780 900 L800 930 L820 910 L840 940 L860 920 L880 950 L900 930 L920 960 L940 940 L960 970 L980 950 L1000 980 L1020 960 L1040 990 L1060 970 L1080 1000 L1100 980 L1120 1010 L1140 990 L1160 1020 L1180 1000 L1200 1030 L1220 1010 L1240 1040 L1260 1020 L1280 1050 L1280 800 Z" fill="#050505" />
  
  <!-- Individual Trees (Semi-realistic texture) -->
  <g opacity="0.9">
    <use href="#pineTree" x="30" y="730" transform="scale(1.2)" />
    <use href="#pineTree" x="80" y="750" transform="scale(1.5)" />
    <use href="#pineTree" x="130" y="720" transform="scale(1.1)" />
    <use href="#pineTree" x="180" y="760" transform="scale(1.4)" />
    <use href="#pineTree" x="230" y="710" transform="scale(1.3)" />
    <use href="#pineTree" x="280" y="770" transform="scale(1.6)" />
    <use href="#pineTree" x="330" y="740" transform="scale(1.2)" />
    <use href="#pineTree" x="380" y="780" transform="scale(1.5)" />
    <use href="#pineTree" x="430" y="750" transform="scale(1.1)" />
    <use href="#pineTree" x="480" y="790" transform="scale(1.4)" />
    <use href="#pineTree" x="530" y="760" transform="scale(1.3)" />
    <use href="#pineTree" x="580" y="800" transform="scale(1.6)" />
    <use href="#pineTree" x="630" y="770" transform="scale(1.2)" />
    <use href="#pineTree" x="680" y="810" transform="scale(1.5)" />
    <use href="#pineTree" x="730" y="780" transform="scale(1.1)" />
    <use href="#pineTree" x="780" y="820" transform="scale(1.4)" />
    <use href="#pineTree" x="830" y="790" transform="scale(1.3)" />
    <use href="#pineTree" x="880" y="830" transform="scale(1.6)" />
    <use href="#pineTree" x="930" y="800" transform="scale(1.2)" />
    <use href="#pineTree" x="980" y="840" transform="scale(1.5)" />
    <use href="#pineTree" x="1030" y="810" transform="scale(1.1)" />
    <use href="#pineTree" x="1080" y="850" transform="scale(1.4)" />
    <use href="#pineTree" x="1130" y="820" transform="scale(1.3)" />
    <use href="#pineTree" x="1180" y="860" transform="scale(1.6)" />
    <use href="#pineTree" x="1230" y="830" transform="scale(1.2)" />
    <use href="#pineTree" x="1280" y="870" transform="scale(1.5)" />
  </g>

  <!-- The Fire Line (The Threat) -->
  <!-- Sweeping up from the spark towards the right -->
  <g filter="url(#fireGlow)">
    <!-- Outer Flame Body -->
    <path d="M 120 720 
             C 250 710, 400 680, 600 600 
             C 800 520, 950 420, 1100 320 
             C 1180 270, 1250 220, 1300 150" 
          fill="none" stroke="url(#fireGradGlow)" stroke-width="45" stroke-linecap="round" opacity="0.8" />
    
    <!-- Inner Bright Core -->
    <path d="M 120 720 
             C 250 710, 400 680, 600 600 
             C 800 520, 950 420, 1100 320 
             C 1180 270, 1250 220, 1300 150" 
          fill="none" stroke="url(#fireGradCore)" stroke-width="12" stroke-linecap="round" opacity="0.95" />
  </g>

  <!-- The Single Spark (Visual Anchor - Cigarette Butt) -->
  <!-- Positioned at the bottom left foreground -->
  <g transform="translate(120, 720)">
    <!-- Massive Glow Aura -->
    <circle cx="0" cy="0" r="100" fill="#ea580c" opacity="0.3" filter="url(#heavyBlur)" />
    
    <!-- The Glowing Ember (Cigarette Butt style shape) -->
    <!-- Rotated to angle slightly upwards -->
    <g transform="rotate(-15)">
      <!-- The Stick -->
      <path d="M-4 -25 L4 -25 L5 25 L-5 25 Z" fill="#e5e5e5" />
      <!-- The Filter -->
      <path d="M-5 25 L5 25 L6 35 L-6 35 Z" fill="#d97706" />
      <!-- The Burning Tip -->
      <rect x="-4" y="-25" width="8" height="5" fill="#ea580c" />
      <rect x="-3" y="-28" width="6" height="3" fill="#fef08a" />
      
      <!-- Smoke wisps from the butt -->
      <path d="M0 -30 C 10 -40, -5 -50, 5 -60 C 15 -70, 0 -80, 10 -90" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4" />
      <path d="M2 -32 C 12 -42, -3 -52, 7 -62 C 17 -72, 2 -82, 12 -92" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2" />

      <!-- Radiating Sparks -->
      <g fill="#fef08a">
        <path d="M3 -25 L15 -35 Q12 -40 8 -45 Q4 -40 2 -35 Z" />
        <path d="M-3 -25 L-15 -35 Q-18 -40 -22 -45 Q-18 -40 -12 -35 Z" />
      </g>
      
      <!-- Small floating particles -->
      <circle cx="15" cy="-40" r="2" fill="#ffffff" opacity="0.8" />
      <circle cx="-20" cy="-30" r="1.5" fill="#fef08a" opacity="0.6" />
      <circle cx="25" cy="0" r="2.5" fill="#ea580c" opacity="0.9" />
    </g>
  </g>

  <!-- Typography Group -->
  <g transform="translate(80, 160)">
    
    <!-- Main Headline: ONE SPARK IS ENOUGH -->
    <!-- Positioned top center/left to balance the fire line -->
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="120" fill="#ffffff" letter-spacing="4" filter="url(#textShadow)">
      <tspan x="0" dy="0">ONE SPARK</tspan>
      <tspan x="0" dy="110">IS ENOUGH</tspan>
    </text>

    <!-- Subhead: Check conditions. Extinguish completely. -->
    <!-- Anchored bottom left, legible against dark forest -->
    <text x="0" y="300" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="44" fill="#fef08a" letter-spacing="1" filter="url(#textShadow)">
      <tspan x="0" dy="0">Check conditions.</tspan>
      <tspan x="0" dy="60">Extinguish completely.</tspan>
      <tspan x="0" dy="60">Protect the wild.</tspan>
    </text>

    <!-- Footer Brand -->
    <text x="0" y="510" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" fill="#94a3b8" letter-spacing="8" filter="url(#textShadow)">
      NATIONAL FOREST SAFETY INITIATIVE
    </text>
    
    <!-- Decorative Separator -->
    <line x1="0" y1="540" x2="250" y2="540" stroke="#ea580c" stroke-width="6" stroke-linecap="round" />
  </g>

</svg>