<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Sky Gradient: Deep night fading to smoky amber -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Mountain Gradient: Deep shadows -->
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    
    <!-- Forest Gradient: Silhouette -->
    <linearGradient id="forestGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>

    <!-- Fire Line Gradient: Outer glow -->
    <linearGradient id="fireGradOuter" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Fire Line Gradient: Inner bright core -->
    <linearGradient id="fireGradInner" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Smoke Gradient -->
    <linearGradient id="smokeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3f3f46" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>

    <!-- Spark Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="15%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blurSmoke" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>

    <filter id="fireGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="1.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="textShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="1280" height="800" fill="url(#skyGrad)" />

  <!-- The Mountain (Centerpiece) -->
  <g id="mountain">
    <!-- Main Peak -->
    <path d="M 100 800 L 450 280 L 650 150 L 850 220 L 1180 800 Z" fill="url(#mountainGrad)" />
    <!-- Secondary Peaks for depth -->
    <path d="M -50 800 L 250 450 L 450 280 Z" fill="#020617" />
    <path d="M 850 220 L 1050 380 L 1350 800 Z" fill="#0f172a" opacity="0.9" />
  </g>

  <!-- Smoke Plumes (Behind Fire) -->
  <g filter="url(#blurSmoke)">
    <path d="M 200 600 C 250 400, 150 200, 250 0 C 350 100, 450 250, 500 50 C 600 50, 700 200, 800 100 C 750 300, 650 400, 700 600 Z" fill="url(#smokeGrad)" opacity="0.8" />
    <path d="M 600 500 C 550 300, 700 150, 650 0 C 750 100, 850 200, 950 50 C 900 250, 800 350, 850 600 Z" fill="url(#smokeGrad)" opacity="0.6" />
  </g>

  <!-- The Forest Silhouette (Base) -->
  <!-- Detailed jagged path representing dense pine forest -->
  <path d="M0 800 L0 650 L15 660 L30 640 L45 670 L60 630 L80 665 L100 620 L120 655 L140 610 L160 645 L180 600 L200 635 L220 590 L240 625 L260 580 L280 615 L300 570 L320 605 L340 560 L360 595 L380 550 L400 585 L420 540 L440 575 L460 530 L480 565 L500 520 L520 555 L540 510 L560 545 L580 500 L600 535 L620 490 L640 525 L660 480 L680 515 L700 470 L720 505 L740 460 L760 495 L780 450 L800 485 L820 440 L840 475 L860 430 L880 465 L900 420 L920 455 L940 410 L960 445 L980 400 L1000 435 L1020 390 L1040 425 L1060 380 L1080 415 L1100 370 L1120 405 L1140 360 L1160 395 L1180 350 L1200 385 L1220 340 L1240 375 L1260 330 L1280 360 L1280 800 Z" fill="url(#forestGrad)" />

  <!-- The Fire Line (Creeping Organic Flame) -->
  <!-- Tracing the ridge of the forest -->
  <g filter="url(#fireGlow)">
    <!-- Outer Flame Body -->
    <path d="M 0 680 
             C 50 670, 100 660, 150 650 
             C 200 640, 250 620, 300 610 
             C 350 600, 400 580, 450 570 
             C 500 560, 550 540, 600 530 
             C 650 520, 700 500, 750 490 
             C 800 480, 850 460, 900 450 
             C 950 440, 1000 420, 1050 410 
             C 1100 400, 1150 380, 1200 370 
             C 1230 365, 1250 355, 1280 350" 
          fill="none" stroke="url(#fireGradOuter)" stroke-width="45" stroke-linecap="round" />
    
    <!-- Inner Bright Core -->
    <path d="M 0 680 
             C 50 670, 100 660, 150 650 
             C 200 640, 250 620, 300 610 
             C 350 600, 400 580, 450 570 
             C 500 560, 550 540, 600 530 
             C 650 520, 700 500, 750 490 
             C 800 480, 850 460, 900 450 
             C 950 440, 1000 420, 1050 410 
             C 1100 400, 1150 380, 1200 370 
             C 1230 365, 1250 355, 1280 350" 
          fill="none" stroke="url(#fireGradInner)" stroke-width="12" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- The Single Spark (Visual Anchor) -->
  <!-- Positioned at the start of the fire line to imply origin -->
  <g transform="translate(150, 650)">
    <!-- Glow Aura -->
    <circle cx="0" cy="0" r="60" fill="url(#sparkGlow)" />
    
    <!-- The Ember Body -->
    <path d="M0 -12 Q8 -4 12 0 Q8 4 0 12 Q-8 4 -12 0 Q-8 -4 0 -12 Z" fill="#ffffff" />
    
    <!-- Radiating Sparks -->
    <g fill="#fef08a">
      <path d="M0 0 L10 -15 Q6 -20 2 -25 Q-2 -20 -6 -15 Z" />
      <path d="M0 0 L-15 10 Q-20 6 -25 2 Q-20 -2 -15 -6 Z" />
      <path d="M0 0 L15 10 Q20 6 25 2 Q20 -2 15 -6 Z" />
      <path d="M0 0 L0 15 Q4 20 0 25 Q-4 20 0 15 Z" />
    </g>
    
    <!-- Small floating particles -->
    <circle cx="25" cy="-25" r="2" fill="#ffffff" opacity="0.8" />
    <circle cx="-20" cy="20" r="1.5" fill="#fef08a" opacity="0.6" />
    <circle cx="35" cy="5" r="2.5" fill="#ea580c" opacity="0.9" />
  </g>

  <!-- Typography Group -->
  <g transform="translate(80, 140)">
    
    <!-- Main Headline: ONE SPARK IS ENOUGH -->
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="100" fill="#ffffff" letter-spacing="2" filter="url(#textShadow)">
      <tspan x="0" dy="0">ONE SPARK</tspan>
      <tspan x="0" dy="100">IS ENOUGH</tspan>
    </text>

    <!-- Subhead: Check conditions. Extinguish completely. -->
    <text x="0" y="240" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="38" fill="#fef08a" letter-spacing="1" filter="url(#textShadow)">
      <tspan x="0" dy="0">Check conditions.</tspan>
      <tspan x="0" dy="50">Extinguish completely.</tspan>
      <tspan x="0" dy="50">Protect the wild.</tspan>
    </text>

    <!-- Footer Brand -->
    <text x="0" y="380" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" fill="#94a3b8" letter-spacing="8" filter="url(#textShadow)">
      NATIONAL FOREST SAFETY INITIATIVE
    </text>
    
    <!-- Decorative Separator -->
    <line x1="0" y1="410" x2="220" y2="410" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />
  </g>

</svg>