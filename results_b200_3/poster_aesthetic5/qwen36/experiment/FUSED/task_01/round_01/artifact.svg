<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Sky Gradient: Smoky, ominous atmosphere -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Mountain Gradient: Dark, looming -->
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Forest Gradient: Silhouette -->
    <linearGradient id="forestGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>

    <!-- Fire Gradient: Realistic flame colors -->
    <linearGradient id="fireGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="30%" stop-color="#ea580c" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Smoke Gradient: Rising plumes -->
    <linearGradient id="smokeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#44403c" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0" />
    </linearGradient>

    <!-- Spark Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="20%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blurSmoke" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" />
    </filter>

    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="1280" height="800" fill="url(#skyGrad)" />

  <!-- The Mountain (Centerpiece) -->
  <g id="mountain">
    <!-- Main Peak -->
    <path d="M 200 800 L 550 250 L 750 180 L 950 320 L 1280 800 Z" fill="url(#mountainGrad)" />
    <!-- Secondary Peaks -->
    <path d="M 50 800 L 300 400 L 550 250 Z" fill="#020617" />
    <path d="M 950 320 L 1150 450 L 1350 800 Z" fill="#0f172a" opacity="0.8" />
  </g>

  <!-- Smoke Plumes (Behind Fire) -->
  <g filter="url(#blurSmoke)">
    <path d="M 200 600 C 150 400, 300 200, 250 0 C 350 100, 450 250, 500 50 C 600 50, 700 200, 800 100 C 750 300, 650 400, 700 600 Z" fill="url(#smokeGrad)" opacity="0.6" />
    <path d="M 600 500 C 550 300, 700 150, 650 0 C 750 100, 850 200, 950 50 C 900 250, 800 350, 850 600 Z" fill="url(#smokeGrad)" opacity="0.4" />
  </g>

  <!-- The Forest Silhouette (Base) -->
  <!-- A jagged, organic pine tree line -->
  <path d="M0 800 L0 650 L15 660 L30 640 L45 670 L60 630 L80 665 L100 620 L120 655 L140 610 L160 645 L180 600 L200 635 L220 590 L240 625 L260 580 L280 615 L300 570 L320 605 L340 560 L360 595 L380 550 L400 585 L420 540 L440 575 L460 530 L480 565 L500 520 L520 555 L540 510 L560 545 L580 500 L600 535 L620 490 L640 525 L660 480 L680 515 L700 470 L720 505 L740 460 L760 495 L780 450 L800 485 L820 440 L840 475 L860 430 L880 465 L900 420 L920 455 L940 410 L960 445 L980 400 L1000 435 L1020 390 L1040 425 L1060 380 L1080 415 L1100 370 L1120 405 L1140 360 L1160 395 L1180 350 L1200 385 L1220 340 L1240 375 L1260 330 L1280 360 L1280 800 Z" fill="url(#forestGrad)" />

  <!-- The Fire Line (Dynamic Diagonal) -->
  <g filter="url(#fireGlow)">
    <!-- Outer Flames -->
    <path d="M0 650 L15 640 L30 650 L45 630 L60 645 L80 620 L100 635 L120 610 L140 625 L160 600 L180 615 L200 590 L220 605 L240 580 L260 595 L280 570 L300 585 L320 560 L340 575 L360 550 L380 565 L400 540 L420 555 L440 530 L460 545 L480 520 L500 535 L520 510 L540 525 L560 500 L580 515 L600 490 L620 505 L640 480 L660 495 L680 470 L700 485 L720 460 L740 475 L760 450 L780 465 L800 440 L820 455 L840 430 L860 445 L880 420 L900 435 L920 410 L940 425 L960 400 L980 415 L1000 390 L1020 405 L1040 380 L1060 395 L1080 370 L1100 385 L1120 360 L1140 375 L1160 350 L1180 365 L1200 340 L1220 355 L1240 330 L1260 345 L1280 360" 
          fill="none" stroke="url(#fireGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
    
    <!-- Inner Bright Core -->
    <path d="M0 650 L15 640 L30 650 L45 630 L60 645 L80 620 L100 635 L120 610 L140 625 L160 600 L180 615 L200 590 L220 605 L240 580 L260 595 L280 570 L300 585 L320 560 L340 575 L360 550 L380 565 L400 540 L420 555 L440 530 L460 545 L480 520 L500 535 L520 510 L540 525 L560 500 L580 515 L600 490 L620 505 L640 480 L660 495 L680 470 L700 485 L720 460 L740 475 L760 450 L780 465 L800 440 L820 455 L840 430 L860 445 L880 420 L900 435 L920 410 L940 425 L960 400 L980 415 L1000 390 L1020 405 L1040 380 L1060 395 L1080 370 L1100 385 L1120 360 L1140 375 L1160 350 L1180 365 L1200 340 L1220 355 L1240 330 L1260 345 L1280 360" 
          fill="none" stroke="#fef08a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>

  <!-- The Single Spark (Visual Anchor) -->
  <g transform="translate(250, 585)">
    <circle cx="0" cy="0" r="60" fill="url(#sparkGlow)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <!-- Radiating sparks -->
    <path d="M0 0 L15 -20 Q10 -25 5 -30 Q0 -25 -5 -20 Z" fill="#fef08a" />
    <path d="M0 0 L-20 10 Q-25 5 -30 0 Q-25 -5 -20 -10 Z" fill="#fef08a" />
    <path d="M0 0 L20 10 Q25 5 30 0 Q25 -5 20 -10 Z" fill="#fef08a" />
    <path d="M0 0 L0 20 Q5 25 0 30 Q-5 25 0 20 Z" fill="#fef08a" />
  </g>

  <!-- Typography Group -->
  <g transform="translate(80, 120)">
    
    <!-- Main Headline: ONE SPARK IS ENOUGH -->
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="90" fill="#ffffff" letter-spacing="2" filter="url(#textShadow)">
      <tspan x="0" dy="0">ONE SPARK</tspan>
      <tspan x="0" dy="90">IS ENOUGH</tspan>
    </text>

    <!-- Subhead: Check conditions. Extinguish completely. -->
    <text x="0" y="200" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="36" fill="#fef08a" letter-spacing="1" filter="url(#textShadow)">
      <tspan x="0" dy="0">Check conditions.</tspan>
      <tspan x="0" dy="45">Extinguish completely.</tspan>
      <tspan x="0" dy="45">Protect the wild.</tspan>
    </text>

    <!-- Footer Brand -->
    <text x="0" y="350" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" fill="#94a3b8" letter-spacing="8" filter="url(#textShadow)">
      NATIONAL FOREST SAFETY INITIATIVE
    </text>
    
    <!-- Decorative Separator -->
    <line x1="0" y1="380" x2="200" y2="380" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />
  </g>

</svg>