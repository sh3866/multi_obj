<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Color Palette -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0044" />
      <stop offset="100%" stop-color="#cc2200" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030303" />
      <stop offset="100%" stop-color="#0a0002" />
    </linearGradient>

    <!-- Filters -->
    <!-- Analog Noise for texture -->
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>

    <!-- Subtle Glow for the Red Noise elements -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Clip Path for canvas boundaries -->
    <clipPath id="canvasClip">
      <rect width="1280" height="800" />
    </clipPath>
  </defs>

  <!-- 1. Background -->
  <rect width="1280" height="800" fill="url(#bgGrad)" />
  
  <!-- Analog Grid Lines (Vertical flow, subtle) -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="800" y1="0" x2="800" y2="800" />
    <line x1="1000" y1="0" x2="1000" y2="800" />
  </g>

  <!-- 2. Abstract Visual Elements (Analog Interference) -->
  <g clip-path="url(#canvasClip)">
    <!-- Cyan Wave (The Flow - Smooth, atmospheric) -->
    <path d="M-50,450 C 200,450 300,250 600,300 S 1000,600 1350,400" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.6" />
          
    <!-- Red Noise (The Interruption - Jagged, needle-like, bold) -->
    <!-- Replaced dashed path with erratic, sweeping angular path -->
    <path d="M-50,450 L 100,420 L 150,480 L 300,350 L 450,500 L 600,300 L 800,380 L 1350,400" 
          fill="none" stroke="url(#redGrad)" stroke-width="6" opacity="0.9" filter="url(#glow)" />
          
    <!-- Vertical Data Bleed (Thicker, analog tape feel) -->
    <rect x="650" y="0" width="40" height="800" fill="url(#cyanGrad)" opacity="0.05" />
    <rect x="652" y="0" width="2" height="800" fill="url(#redGrad)" opacity="0.3" />
  </g>

  <!-- 3. Typography: Headline (Integrated Movement) -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="-10">
    
    <!-- Layer 1: Blue Hour (Cyan Base - Background layer) -->
    <!-- Moved higher up to create tension in the middle space -->
    <text x="120" y="250" font-size="220" fill="url(#cyanGrad)" transform="skewX(-10)">BLUE HOUR</text>
    
    <!-- Layer 2: Red Noise (Red Disruption - Foreground layer, offset) -->
    <!-- This creates the depth and layering requested -->
    <text x="135" y="265" font-size="220" fill="url(#redGrad)" transform="skewX(-10) translate(15, -5)" opacity="0.95">BLUE HOUR</text>

    <!-- Visual Slices (Interruption bands moving through text) -->
    <!-- These cut the text to allow the graphical lines to weave through -->
    <rect x="50" y="170" width="1200" height="15" fill="#030303" />
    <rect x="50" y="230" width="1200" height="5" fill="#030303" />
    <rect x="50" y="300" width="1200" height="25" fill="#030303" />
    
    <!-- Re-drawing parts of text over the slices at different X positions (The Interference Effect) -->
    <!-- "HOUR" shifted right with blue -->
    <text x="750" y="265" font-size="220" fill="url(#cyanGrad)" transform="skewX(-10)" clip-path="url(#canvasClip)">HOUR</text>
    <!-- "BLUE" shifted left with red -->
    <text x="90" y="250" font-size="220" fill="url(#redGrad)" transform="skewX(-10) translate(-20, 5)" clip-path="url(#canvasClip)">BLUE</text>

    <!-- Floating Artifacts -->
    <rect x="1100" y="200" width="100" height="80" fill="url(#redGrad)" opacity="0.8" />
    <rect x="50" y="100" width="200" height="10" fill="url(#cyanGrad)" opacity="0.5" />
  </g>

  <!-- 4. Typography: Subtitle -->
  <!-- Moved closer to the bottom grid to balance the space -->
  <text x="640" y="420" font-family="Courier New, monospace" font-weight="bold" font-size="16" text-anchor="middle" fill="#ffffff" letter-spacing="6" opacity="0.8">A NIGHT OF IMPROVISED SOUND</text>

  <!-- 5. Bottom Grid: Logistics (Left) -->
  <!-- Moved down to anchor the bottom left corner -->
  <g transform="translate(80, 700)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="0" font-size="32" font-weight="bold" fill="#ffffff" letter-spacing="-1">FRIDAY, SEPTEMBER 27</text>
    <text x="0" y="35" font-size="20" font-weight="bold" fill="#00f0ff" letter-spacing="1">Doors 7 PM</text>
    
    <text x="0" y="85" font-size="24" font-weight="bold" fill="#ffffff" opacity="0.8">THE FOUNDRY</text>
    <text x="0" y="110" font-size="16" font-weight="normal" fill="#888888" letter-spacing="2">EAST RIVER DISTRICT</text>
  </g>

  <!-- 6. Bottom Grid: Performers (Right) -->
  <!-- Moved down to align with logistics, creating a tight bottom tension -->
  <g transform="translate(980, 670)" font-family="Courier New, monospace">
    
    <!-- Label -->
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#ff0055" letter-spacing="2">FEATURING</text>
    
    <!-- Performer 1 -->
    <text x="0" y="50" font-size="36" font-weight="bold" fill="#ffffff" letter-spacing="-1">NIA COLE QUARTET</text>
    
    <!-- Performer 2 -->
    <text x="0" y="100" font-size="36" font-weight="bold" fill="#bbbbbb" letter-spacing="-1">STATIC BLOOM</text>
    
    <!-- Performer 3 -->
    <text x="0" y="150" font-size="36" font-weight="bold" fill="#ffffff" letter-spacing="-1">ARMAND VALE</text>
  </g>

  <!-- 7. Final Vignette & Noise -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
  </radialGradient>
  <rect width="1280" height="800" fill="url(#vignette)" pointer-events="none" />
  
  <!-- Grain Overlay -->
  <rect width="1280" height="800" filter="url(#noiseFilter)" opacity="0.08" pointer-events="none" style="mix-blend-mode: overlay;" />

</svg>