<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="ocean-depth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06101e" />
      <stop offset="50%" stop-color="#0a1a30" />
      <stop offset="100%" stop-color="#01050a" />
    </linearGradient>

    <!-- Vignette Mask -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="30%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>
    
    <mask id="vignette-mask">
      <rect width="100%" height="100%" fill="url(#vignette)" />
    </mask>

    <!-- Tube Worm Gradient -->
    <linearGradient id="tube-worm-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a0202" />
      <stop offset="50%" stop-color="#8a1515" />
      <stop offset="100%" stop-color="#3a0202" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="40" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Ocean Background -->
  <rect width="1280" height="800" fill="url(#ocean-depth)" />

  <!-- Ambient Light Shafts (God Rays) - Cleaner -->
  <g opacity="0.03" fill="#ffffff">
    <polygon points="200,-50 500,-50 650,800 50,800" />
    <polygon points="800,-50 1100,-50 1250,800 600,800" />
  </g>

  <!-- Background Particulates / Snow -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="150" cy="120" r="1.5" />
    <circle cx="850" cy="250" r="1" />
    <circle cx="1100" cy="300" r="2" />
    <circle cx="300" cy="450" r="1" />
    <circle cx="950" cy="600" r="1.5" />
    <circle cx="200" cy="750" r="2" />
    <circle cx="1200" cy="700" r="1" />
    <circle cx="600" cy="100" r="1" />
    <circle cx="400" cy="200" r="1.5" />
    <circle cx="750" cy="150" r="1" />
    <circle cx="150" cy="600" r="1" />
    <circle cx="1150" cy="400" r="1.5" />
  </g>

  <!-- Deep Sea Elements Layer -->
  <g id="marine-life">
    
    <!-- Anglerfish (Top Right) - More menacing, better detail -->
    <g transform="translate(1050, 180) rotate(15)">
      <!-- Body -->
      <path d="M0,0 C-40,-60 -100,-50 -110,10 C-120,70 -70,100 -20,90 C30,80 60,40 0,0" fill="#030810" stroke="#1a2b4c" stroke-width="2" />
      <!-- Mouth -->
      <path d="M-15,45 Q-40,90 25,55" fill="none" stroke="#0a1526" stroke-width="2" />
      <!-- Teeth -->
      <g stroke="#eef" stroke-width="1.5" opacity="0.8">
        <path d="M-10,50 L-15,65 M5,55 L0,70 M20,55 L15,68" />
      </g>
      <!-- Eye -->
      <circle cx="-50" cy="15" r="10" fill="#000" />
      <circle cx="-50" cy="15" r="4" fill="#4ff" filter="url(#glow)" opacity="0.9"/>
      <!-- Lure -->
      <path d="M-20,-15 Q-40,-90 20,-140" fill="none" stroke="#2a3b5c" stroke-width="2" />
      <!-- Lure Glow -->
      <circle cx="20" cy="-140" r="8" fill="#4ff" filter="url(#glow-strong)" />
      <circle cx="20" cy="-140" r="3" fill="#fff" />
    </g>

    <!-- Giant Ctenophore / Jelly (Center Floating) - More ethereal, positioned slightly lower to balance text -->
    <g transform="translate(640, 500)" opacity="0.85">
      <!-- Translucent Body -->
      <ellipse cx="0" cy="0" rx="80" ry="120" fill="#020813" fill-opacity="0.4" stroke="#aaffcc" stroke-width="2" filter="url(#soft-glow)" />
      <!-- Internal Bioluminescent Lines -->
      <path d="M0,-110 Q-60,0 0,110" fill="none" stroke="#00ffff" stroke-width="1.5" opacity="0.6" />
      <path d="M0,-110 Q60,0 0,110" fill="none" stroke="#00ffff" stroke-width="1.5" opacity="0.6" />
      <path d="M-60,-60 Q0,-40 60,-60" fill="none" stroke="#aaffee" stroke-width="1" opacity="0.5" />
      <path d="M-60,60 Q0,80 60,60" fill="none" stroke="#aaffee" stroke-width="1" opacity="0.5" />
      <!-- Tentacles -->
      <path d="M-50,100 Q-80,200 -50,280" fill="none" stroke="#88ffdd" stroke-width="2" opacity="0.7" filter="url(#glow)"/>
      <path d="M0,120 Q20,220 -10,290" fill="none" stroke="#88ffdd" stroke-width="2" opacity="0.7" filter="url(#glow)"/>
      <path d="M50,100 Q80,200 50,280" fill="none" stroke="#88ffdd" stroke-width="2" opacity="0.7" filter="url(#glow)"/>
    </g>

    <!-- Tube Worms (Bottom Left) - More grounded, moved slightly up -->
    <g transform="translate(180, 820)">
      <!-- Rocks/Base -->
      <path d="M-120,0 L-60,-50 L0,-15 L60,-60 L120,0 Z" fill="#000" opacity="0.9" />
      <!-- Worm 1 -->
      <rect x="-70" y="-160" width="16" height="160" fill="url(#tube-worm-grad)" rx="5" />
      <circle cx="-62" cy="-160" r="14" fill="#ff1a1a" filter="url(#glow)" />
      
      <!-- Worm 2 -->
      <rect x="-30" y="-190" width="22" height="190" fill="url(#tube-worm-grad)" rx="5" />
      <circle cx="-19" cy="-190" r="16" fill="#ff1a1a" filter="url(#glow)" />
      
      <!-- Worm 3 -->
      <rect x="35" y="-140" width="14" height="140" fill="url(#tube-worm-grad)" rx="4" />
      <circle cx="42" cy="-140" r="11" fill="#ff1a1a" filter="url(#glow)" />
    </g>

    <!-- Distant Jellyfish (Mid Right) -->
    <g transform="translate(1050, 650) scale(0.7)" opacity="0.5">
      <path d="M-40,0 Q0,-70 40,0" fill="rgba(100, 255, 255, 0.15)" stroke="#00ffff" stroke-width="1.5" filter="url(#soft-glow)"/>
      <line x1="-20" y1="0" x2="-30" y2="90" stroke="#00ffff" stroke-width="0.8" opacity="0.6"/>
      <line x1="20" y1="0" x2="30" y2="90" stroke="#00ffff" stroke-width="0.8" opacity="0.6"/>
      <line x1="0" y1="-15" x2="0" y2="100" stroke="#00ffff" stroke-width="0.8" opacity="0.6"/>
    </g>
  </g>

  <!-- Text Overlay Layer -->
  <g mask="url(#vignette-mask)">
    
    <!-- Main Title - Improved Typography & Hierarchy -->
    <g transform="translate(640, 260)" text-anchor="middle">
      <!-- Main Text with Glow -->
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="900" letter-spacing="16" fill="#ffffff" filter="url(#text-glow)">BELOW THE</text>
      <text x="0" y="115" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="900" letter-spacing="16" fill="#ffffff" filter="url(#text-glow)">LAST LIGHT</text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(640, 405)" text-anchor="middle">
      <text x="0" y="0" font-family="Georgia, serif" font-size="32" font-style="italic" fill="#bceeff" letter-spacing="1" filter="url(#soft-glow)">Life at the edge of the known world</text>
    </g>

    <!-- Divider Line -->
    <line x1="520" y1="460" x2="760" y2="460" stroke="#4488aa" stroke-width="2" opacity="0.8" filter="url(#soft-glow)" />

    <!-- Footer Info -->
    <g transform="translate(640, 600)" text-anchor="middle">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="6" fill="#ffffff">SPECIAL EXHIBITION · NOVEMBER 2–MARCH 9</text>
    </g>

    <!-- Museum Name -->
    <g transform="translate(640, 670)" text-anchor="middle">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" letter-spacing="8" fill="#8abccc">CALDER MUSEUM OF NATURAL HISTORY</text>
    </g>
    
  </g>

  <!-- Foreground Particles / Depth -->
  <g fill="#88eeff" opacity="0.4" filter="url(#glow)">
    <circle cx="250" cy="350" r="2.5" />
    <circle cx="1150" cy="200" r="2" />
    <circle cx="350" cy="650" r="3" />
    <circle cx="950" cy="750" r="1.5" />
    <circle cx="100" cy="500" r="2" />
  </g>

  <!-- Final Vignette Overlay for Focus -->
  <rect width="1280" height="800" fill="none" stroke="#000" stroke-width="32" opacity="0.95" />
  <rect width="1280" height="800" fill="url(#vignette)" opacity="0.8" pointer-events="none" />

</svg>