<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradient: Deep abyssal blue-black -->
    <linearGradient id="abyssal-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#010205" />
      <stop offset="50%" stop-color="#060f1a" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Spotlight: Soft blue glow behind typography -->
    <radialGradient id="text-spotlight" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1e3c72" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0a1526" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Vignette: Strong focus on center -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="85%">
      <stop offset="30%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95" />
    </radialGradient>

    <!-- Tube Worm Gradient -->
    <linearGradient id="tube-worm-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0505" />
      <stop offset="50%" stop-color="#6b1a1a" />
      <stop offset="100%" stop-color="#1a0505" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-wide" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-medium" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Ocean Background -->
  <rect width="1280" height="800" fill="url(#abyssal-gradient)" />

  <!-- Background Particulates -->
  <g fill="#ffffff" opacity="0.1">
    <circle cx="150" cy="120" r="1.5" />
    <circle cx="850" cy="250" r="1" />
    <circle cx="1100" cy="300" r="2" />
    <circle cx="300" cy="450" r="1" />
    <circle cx="950" cy="600" r="1.5" />
    <circle cx="200" cy="750" r="2" />
  </g>

  <!-- Marine Life Layer -->
  <g id="marine-life">
    
    <!-- Anglerfish (Top Right) - Adjusted position to clear title -->
    <g transform="translate(1050, 120) rotate(15)">
      <!-- Body -->
      <path d="M0,0 C-40,-60 -100,-50 -110,10 C-120,70 -70,100 -20,90 C30,80 60,40 0,0" fill="#050a10" stroke="#1a2b4c" stroke-width="2" />
      <!-- Eyes -->
      <circle cx="-50" cy="15" r="10" fill="#000" />
      <circle cx="-50" cy="15" r="4" fill="#4ff" filter="url(#glow-medium)" opacity="0.9"/>
      <!-- Lure -->
      <path d="M-20,-15 Q-40,-90 20,-140" fill="none" stroke="#2a3b5c" stroke-width="2" />
      <!-- Lure Glow -->
      <circle cx="20" cy="-140" r="8" fill="#4ff" filter="url(#glow-wide)" />
      <circle cx="20" cy="-140" r="3" fill="#fff" />
    </g>

    <!-- Giant Ctenophore / Jelly (Center) - Positioned below subtitle -->
    <g transform="translate(640, 580)" opacity="0.8">
      <!-- Translucent Body -->
      <ellipse cx="0" cy="0" rx="80" ry="120" fill="#020813" fill-opacity="0.4" stroke="#aaffcc" stroke-width="1.5" filter="url(#glow-subtle)" />
      <!-- Internal Lines -->
      <path d="M0,-100 Q-50,0 0,100" fill="none" stroke="#00ffff" stroke-width="1.5" opacity="0.6" />
      <path d="M0,-100 Q50,0 0,100" fill="none" stroke="#00ffff" stroke-width="1.5" opacity="0.6" />
      <!-- Tentacles - Sweeping down -->
      <path d="M-40,90 Q-70,220 -40,320" fill="none" stroke="#88ffdd" stroke-width="2" opacity="0.7" filter="url(#glow-medium)"/>
      <path d="M0,110 Q20,240 -10,330" fill="none" stroke="#88ffdd" stroke-width="2" opacity="0.7" filter="url(#glow-medium)"/>
      <path d="M40,90 Q70,220 40,320" fill="none" stroke="#88ffdd" stroke-width="2" opacity="0.7" filter="url(#glow-medium)"/>
    </g>

    <!-- Tube Worms (Bottom Left) -->
    <g transform="translate(150, 850)">
      <!-- Base -->
      <path d="M-100,0 L-40,-40 L0,-10 L60,-50 L100,0 Z" fill="#000" opacity="0.9" />
      <!-- Worm 1 -->
      <rect x="-60" y="-140" width="16" height="140" fill="url(#tube-worm-body)" rx="5" />
      <circle cx="-52" cy="-140" r="14" fill="#ff1a1a" filter="url(#glow-wide)" />
      
      <!-- Worm 2 -->
      <rect x="-20" y="-170" width="22" height="170" fill="url(#tube-worm-body)" rx="5" />
      <circle cx="-9" cy="-170" r="16" fill="#ff1a1a" filter="url(#glow-wide)" />
      
      <!-- Worm 3 -->
      <rect x="40" y="-120" width="14" height="120" fill="url(#tube-worm-body)" rx="4" />
      <circle cx="47" cy="-120" r="11" fill="#ff1a1a" filter="url(#glow-wide)" />
    </g>

    <!-- Distant Jellyfish (Mid Right) -->
    <g transform="translate(1000, 680) scale(0.6)" opacity="0.5">
      <path d="M-40,0 Q0,-70 40,0" fill="rgba(100, 255, 255, 0.1)" stroke="#00ffff" stroke-width="1.5" filter="url(#glow-subtle)"/>
      <line x1="-20" y1="0" x2="-30" y2="90" stroke="#00ffff" stroke-width="0.8" opacity="0.6"/>
      <line x1="20" y1="0" x2="30" y2="90" stroke="#00ffff" stroke-width="0.8" opacity="0.6"/>
    </g>
  </g>

  <!-- Text Overlay Layer -->
  <g>
    <!-- Title: BELOW THE LAST LIGHT -->
    <g transform="translate(640, 220)" text-anchor="middle">
      <!-- Outline for readability -->
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" letter-spacing="10" fill="#000000" stroke="#000000" stroke-width="1">BELOW THE</text>
      <text x="0" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" letter-spacing="10" fill="#000000" stroke="#000000" stroke-width="1">LAST LIGHT</text>
      
      <!-- Main Text with Glow -->
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" letter-spacing="10" fill="#ffffff" filter="url(#glow-wide)">BELOW THE</text>
      <text x="0" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" letter-spacing="10" fill="#ffffff" filter="url(#glow-wide)">LAST LIGHT</text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(640, 375)" text-anchor="middle">
      <text x="0" y="0" font-family="Georgia, serif" font-size="32" font-style="italic" fill="#e0f7fa" letter-spacing="1" filter="url(#glow-subtle)">Life at the edge of the known world</text>
    </g>

    <!-- Divider Line -->
    <line x1="580" y1="440" x2="700" y2="440" stroke="#4488aa" stroke-width="1" opacity="0.6" />

    <!-- Exhibition Info -->
    <g transform="translate(640, 620)" text-anchor="middle">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="8" fill="#ffffff">SPECIAL EXHIBITION · NOVEMBER 2–MARCH 9</text>
    </g>

    <!-- Museum Name -->
    <g transform="translate(640, 670)" text-anchor="middle">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="12" fill="#8abccc">CALDER MUSEUM OF NATURAL HISTORY</text>
    </g>
  </g>

  <!-- Lighting & Depth Overlays -->
  <rect width="1280" height="800" fill="url(#text-spotlight)" pointer-events="none" />
  
  <!-- Foreground Particles -->
  <g fill="#88eeff" opacity="0.6" filter="url(#glow-subtle)">
    <circle cx="250" cy="350" r="2.5" />
    <circle cx="1150" cy="280" r="2" />
    <circle cx="350" cy="650" r="3" />
    <circle cx="950" cy="750" r="1.5" />
  </g>

  <!-- Final Vignette Overlay -->
  <rect width="1280" height="800" fill="url(#vignette)" opacity="1" pointer-events="none" />

</svg>