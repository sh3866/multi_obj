<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Smoke Gradient -->
    <linearGradient id="smokeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#52525b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a1a1aa" stop-opacity="0" />
    </linearGradient>

    <!-- Fire Gradient -->
    <linearGradient id="fireGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="50%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Spark Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="20%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>
    
    <!-- Filters -->
    <filter id="blurSmoke" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="glowText" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#skyGrad)" />

  <!-- Smoke Rising -->
  <g filter="url(#blurSmoke)">
    <path d="M 100 800 C 300 500, 1100 200, 1200 -50 C 1350 200, 1250 500, 900 800 Z" fill="url(#smokeGrad)" opacity="0.6" />
  </g>

  <!-- Mountain Silhouettes -->
  <!-- Back Mountain -->
  <path d="M -100 800 L 500 350 L 1400 800 Z" fill="#020617" opacity="0.95" />
  <!-- Front Mountain -->
  <path d="M 250 800 L 1000 350 L 1400 800 Z" fill="#000000" />

  <!-- The Forest Silhouette (Natural jagged edge) -->
  <path d="M 0 800 
    L 20 785 L 40 765 L 80 785 L 120 745 L 160 765 L 200 725 L 250 745 L 300 705 L 340 725 
    L 380 685 L 420 705 L 460 665 L 500 685 L 540 645 L 580 665 L 620 625 L 660 645 
    L 700 605 L 740 625 L 780 585 L 820 605 L 860 565 L 900 585 L 940 545 L 980 565 
    L 1020 525 L 1060 545 L 1100 505 L 1140 525 L 1180 485 L 1220 505 L 1280 465 
    L 1280 800 Z" fill="#000000" />

  <!-- The Fire Line (Tracing the forest edge) -->
  <g filter="url(#fireGlow)">
    <!-- Flame Body -->
    <path d="M 0 800 
      L 20 785 L 40 765 L 80 785 L 120 745 L 160 765 L 200 725 L 250 745 L 300 705 L 340 725 
      L 380 685 L 420 705 L 460 665 L 500 685 L 540 645 L 580 665 L 620 625 L 660 645 
      L 700 605 L 740 625 L 780 585 L 820 605 L 860 565 L 900 585 L 940 545 L 980 565 
      L 1020 525 L 1060 545 L 1100 505 L 1140 525 L 1180 485 L 1220 505 L 1280 465" 
      fill="none" stroke="url(#fireGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Flame Core -->
    <path d="M 0 800 
      L 20 785 L 40 765 L 80 785 L 120 745 L 160 765 L 200 725 L 250 745 L 300 705 L 340 725 
      L 380 685 L 420 705 L 460 665 L 500 685 L 540 645 L 580 665 L 620 625 L 660 645 
      L 700 605 L 740 625 L 780 585 L 820 605 L 860 565 L 900 585 L 940 545 L 980 565 
      L 1020 525 L 1060 545 L 1100 505 L 1140 525 L 1180 485 L 1220 505 L 1280 465" 
      fill="none" stroke="#fff7ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
  </g>

  <!-- The Single Spark (Visual Anchor) -->
  <g transform="translate(820, 595)">
    <!-- Large ambient glow -->
    <circle cx="0" cy="0" r="110" fill="url(#sparkGlow)" opacity="0.9" />
    <!-- Core heat -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
    
    <!-- Flying Embers (Directional) -->
    <path d="M 0 0 L 15 -25 Q 10 -30 5 -35 Q -5 -30 -10 -25 Z" fill="#fef08a" stroke="#fef08a" stroke-width="1"/>
    <path d="M 0 0 L -25 10 Q -30 5 -35 0 Q -30 -10 -25 -15 Z" fill="#fef08a" stroke="#fef08a" stroke-width="1"/>
    <path d="M 0 0 L 25 15 Q 30 20 35 25 Q 30 30 25 35 Z" fill="#fef08a" stroke="#fef08a" stroke-width="1"/>
    <path d="M 0 0 L 5 -30 Q 2 -35 -2 -40 Q -6 -35 -8 -30 Z" fill="#fef08a" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- Typography Group -->
  <!-- Centered, balanced hierarchy -->
  <g transform="translate(640, 120)">
    
    <!-- Main Headline -->
    <g text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" fill="#ffffff" filter="url(#glowText)">
      <text x="0" y="0" font-size="110" letter-spacing="1">ONE SPARK</text>
      <text x="0" y="115" font-size="110" letter-spacing="1">IS ENOUGH</text>
    </g>

    <!-- Subhead: Actions -->
    <g text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="32" fill="#f8fafc" letter-spacing="0.2" opacity="0.95">
      <text x="0" y="220">Check conditions.</text>
      <text x="0" y="275">Extinguish completely.</text>
      <text x="0" y="330">Protect the wild.</text>
    </g>

    <!-- Footer Area -->
    <g transform="translate(0, 420)">
        <!-- Separator Line -->
        <line x1="-140" y1="-40" x2="140" y2="-40" stroke="#f97316" stroke-width="5" stroke-linecap="round" />
        
        <!-- Footer Brand -->
        <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" fill="#cbd5e1" text-anchor="middle" letter-spacing="8">
          NATIONAL FOREST SAFETY INITIATIVE
        </text>
    </g>
  </g>

</svg>