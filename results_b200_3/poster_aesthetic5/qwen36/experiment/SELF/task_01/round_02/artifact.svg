<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Sky Gradient: Dusk, high contrast -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Fire Gradient: Hot, intense -->
    <linearGradient id="fireGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="25%" stop-color="#c2410c" />
      <stop offset="75%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Smoke Gradient: Atmospheric -->
    <linearGradient id="smokeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1c1917" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#44403c" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#78716c" stop-opacity="0" />
    </linearGradient>

    <!-- Spark Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="20%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blurSmoke" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    
    <filter id="glowText" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="fireGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#skyGrad)" />

  <!-- Smoke Rising -->
  <g filter="url(#blurSmoke)">
    <path d="M 300 800 C 200 400, 600 100, 500 -100 C 750 50, 900 200, 1000 100 C 950 300, 800 600, 800 800 Z" fill="url(#smokeGrad)" opacity="0.7" />
  </g>

  <!-- Mountain Background (Subtle) -->
  <path d="M -50 800 L 640 250 L 1350 800 Z" fill="#0f172a" opacity="0.6" />

  <!-- The Forest Silhouette (Simplified, dramatic) -->
  <path d="M 0 800 
    L 40 760 L 80 780 L 120 740 L 160 760 L 200 720 L 240 740 L 280 700 L 320 720 
    L 360 680 L 400 700 L 440 660 L 480 680 L 520 640 L 560 660 L 600 620 L 640 640 
    L 680 600 L 720 620 L 760 580 L 800 600 L 840 560 L 880 580 L 920 540 L 960 560 
    L 1000 520 L 1040 540 L 1080 500 L 1120 520 L 1160 480 L 1200 500 L 1240 460 
    L 1280 480 L 1280 800 Z" fill="#000000" />

  <!-- The Fire Line (Running exactly along the forest edge) -->
  <g filter="url(#fireGlow)">
    <!-- Outer Glow / Flame -->
    <path d="M 0 760 L 40 760 L 80 780 L 120 740 L 160 760 L 200 720 L 240 740 L 280 700 L 320 720 
      L 360 680 L 400 700 L 440 660 L 480 680 L 520 640 L 560 660 L 600 620 L 640 640 
      L 680 600 L 720 620 L 760 580 L 800 600 L 840 560 L 880 580 L 920 540 L 960 560 
      L 1000 520 L 1040 540 L 1080 500 L 1120 520 L 1160 480 L 1200 500 L 1240 460 
      L 1280 480" 
      fill="none" stroke="url(#fireGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Inner Hot Core -->
    <path d="M 0 760 L 40 760 L 80 780 L 120 740 L 160 760 L 200 720 L 240 740 L 280 700 L 320 720 
      L 360 680 L 400 700 L 440 660 L 480 680 L 520 640 L 560 660 L 600 620 L 640 640 
      L 680 600 L 720 620 L 760 580 L 800 600 L 840 560 L 880 580 L 920 540 L 960 560 
      L 1000 520 L 1040 540 L 1080 500 L 1120 520 L 1160 480 L 1200 500 L 1240 460 
      L 1280 480" 
      fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>

  <!-- The Single Spark (Integrated into the fire line - center) -->
  <g transform="translate(640, 640)">
    <circle cx="0" cy="0" r="50" fill="url(#sparkGlow)" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
    <!-- Sparks flying -->
    <path d="M 0 0 L 15 -20 Q 10 -25 5 -30 Q 0 -25 -5 -20 Z" fill="#fef08a" />
    <path d="M 0 0 L -20 10 Q -25 5 -30 0 Q -25 -5 -20 -10 Z" fill="#fef08a" />
    <path d="M 0 0 L 20 10 Q 25 15 30 20 Q 25 25 20 30 Z" fill="#fef08a" />
  </g>

  <!-- Typography Group -->
  <g transform="translate(640, 120)">
    
    <!-- Main Headline: ONE SPARK IS ENOUGH -->
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="96" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#glowText)">
      ONE SPARK
    </text>
    <text x="0" y="100" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="96" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#glowText)">
      IS ENOUGH
    </text>

    <!-- Subhead: Check conditions. Extinguish completely. -->
    <text x="0" y="200" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="36" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
      Check conditions.
    </text>
    <text x="0" y="250" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="36" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
      Extinguish completely.
    </text>
    <text x="0" y="300" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="36" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
      Protect the wild.
    </text>

    <!-- Footer Area -->
    <g transform="translate(0, 390)">
        <!-- Separator Line -->
        <line x1="-120" y1="-20" x2="120" y2="-20" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />
        
        <!-- Footer Brand -->
        <text x="0" y="30" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="22" fill="#94a3b8" text-anchor="middle" letter-spacing="8">
          NATIONAL FOREST SAFETY INITIATIVE
        </text>
    </g>
  </g>

</svg>