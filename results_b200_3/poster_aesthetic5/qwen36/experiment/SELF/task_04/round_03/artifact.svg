<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ff5e62" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#333" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff0844" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="jitter">
      <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" result="turb" />
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="6" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bgGrad)" />
  <rect width="1280" height="800" fill="none" filter="url(#noiseFilter)" opacity="0.05" pointer-events="none" />

  <!-- Visual Metaphor: The Conductor / Sound Wave -->
  <g opacity="0.85">
    <!-- The Body (Torso) -->
    <path d="M620,220 Q640,240 660,220 L680,650 L600,650 Z" fill="#080808" stroke="#222" stroke-width="1" />
    
    <!-- Abstract Head -->
    <circle cx="640" cy="160" r="35" fill="#050505" stroke="#00f2fe" stroke-width="1.5" opacity="0.5"/>
    <circle cx="640" cy="160" r="25" fill="#000" stroke="#ff0844" stroke-width="1.5" opacity="0.5" transform="translate(8, 4)"/>
    
    <!-- Left Arm: Fluid Blue Hour Wave -->
    <path d="M610,230 
             Q480,260 420,210 
             T280,260 
             T150,180" 
          fill="none" stroke="url(#blueGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glowBlue)" />
    <circle cx="150" cy="180" r="6" fill="#00f2fe" filter="url(#glowBlue)" />

    <!-- Right Arm: Sharp Red Noise Glitch -->
    <path d="M670,230 
             L740,190 
             L710,110 
             L840,80 
             L810,10" 
          fill="none" stroke="url(#redGrad)" stroke-width="5" stroke-linejoin="miter" filter="url(#jitter)" stroke-linecap="square" />
    <g transform="translate(810, 10)">
      <path d="M0,0 L-12,-15 L4,-4 Z" fill="#ff0844" filter="url(#glowRed)"/>
      <path d="M0,0 L16,-25 L4,-12 Z" fill="#ff0844" filter="url(#glowRed)"/>
    </g>
  </g>

  <!-- Ambient Field: Sound Waves -->
  <g opacity="0.2">
    <!-- Blue waves (Left focus) -->
    <circle cx="400" cy="250" r="300" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4,12" />
    <circle cx="400" cy="250" r="450" fill="none" stroke="#4facfe" stroke-width="0.5" stroke-dasharray="2,25" />
    
    <!-- Red waves (Right focus) -->
    <circle cx="900" cy="150" r="250" fill="none" stroke="#ff0844" stroke-width="1.5" stroke-dasharray="1,6" />
  </g>

  <!-- Typography: Title -->
  <g transform="translate(640, 140)">
    <!-- BLUE HOUR -->
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="140" text-anchor="middle" letter-spacing="-3" fill="url(#blueGrad)" filter="url(#glowBlue)" transform="skewX(-10)">BLUE HOUR</text>
    
    <!-- RED NOISE -->
    <text x="0" y="100" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="140" text-anchor="middle" letter-spacing="-3" fill="url(#redGrad)" filter="url(#glowRed)" transform="skewX(10)">RED NOISE</text>
    
    <!-- Subtitle -->
    <text x="0" y="150" font-family="Courier New, monospace" font-weight="bold" font-size="18" text-anchor="middle" fill="#ffffff" letter-spacing="4" opacity="0.9">A NIGHT OF IMPROVISED SOUND</text>
  </g>

  <!-- Separation Lines -->
  <line x1="40" y1="360" x2="1240" y2="360" stroke="url(#lineGrad)" stroke-width="1" />
  <line x1="40" y1="360" x2="1240" y2="360" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4,4" opacity="0.5" />

  <!-- Typography: Logistics (Bottom Left) -->
  <g transform="translate(40, 410)" font-family="Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="0" y="0" font-size="36" font-weight="bold" letter-spacing="0.5" fill="#00f2fe">FRIDAY, SEPTEMBER 27</text>
    <text x="0" y="45" font-size="24" font-weight="normal" fill="#cccccc">Doors 7 PM</text>
    
    <text x="0" y="120" font-size="24" font-weight="bold" fill="#ffffff">THE FOUNDRY</text>
    <text x="0" y="150" font-size="18" font-weight="normal" fill="#888888">EAST RIVER DISTRICT</text>
  </g>

  <!-- Typography: Lineup (Bottom Right) -->
  <!-- Shifted group left by 40px and reduced font size to fix boundary overflow -->
  <g transform="translate(920, 410)" font-family="Helvetica, Arial, sans-serif">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#ff0844" letter-spacing="2" font-family="Courier New, monospace">FEATURING</text>
    
    <text x="0" y="60" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="0.5">NIA COLE QUARTET</text>
    <text x="0" y="105" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="0.5">STATIC BLOOM</text>
    <text x="0" y="150" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="0.5">ARMAND VALE</text>
  </g>

  <!-- Final Vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
    <stop offset="50%" stop-color="#000000" stop-opacity="0" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.85" />
  </radialGradient>
  <rect width="1280" height="800" fill="url(#vignette)" pointer-events="none" />

</svg>