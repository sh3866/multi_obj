<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ff5e62" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff0844" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="jitter">
      <feTurbulence type="turbulence" baseFrequency="0.15" numOctaves="2" result="turb" />
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    
    <filter id="blurBg">
      <feGaussianBlur stdDeviation="80" />
    </filter>

    <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bgGrad)" />
  <rect width="1280" height="800" fill="none" filter="url(#noiseFilter)" opacity="0.06" pointer-events="none" />

  <!-- Ambient Background Light -->
  <circle cx="350" cy="250" r="350" fill="#00f2fe" opacity="0.08" filter="url(#blurBg)" />
  <circle cx="950" cy="250" r="350" fill="#ff0844" opacity="0.08" filter="url(#blurBg)" />

  <!-- Visual Metaphor: The Conductor / Sound Wave -->
  <g opacity="0.85">
    <!-- Abstract Head / Source -->
    <circle cx="640" cy="200" r="35" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.5"/>
    <circle cx="640" cy="200" r="20" fill="none" stroke="#ff0844" stroke-width="1.5" opacity="0.5" transform="translate(10, 5)"/>
    
    <!-- Left Arm: Fluid Blue Hour Wave -->
    <path d="M610,200 
             C450,200 450,80 300,80 
             C150,80 150,330 80,330" 
          fill="none" stroke="url(#blueGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glowBlue)" />
      
      <!-- Echo of the blue wave -->
      <path d="M610,200 
             C450,200 450,80 300,80 
             C150,80 150,330 80,330" 
          fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.3" transform="translate(0, 20)" />

    <!-- Right Arm: Sharp Red Noise Glitch -->
    <path d="M670,200 
             L720,160 
             L690,100 
             L800,60 
             L780,0" 
          fill="none" stroke="url(#redGrad)" stroke-width="5" stroke-linejoin="miter" filter="url(#jitter)" stroke-linecap="square" />
          
    <!-- Glitch spikes -->
    <g transform="translate(780, 0)">
      <path d="M0,0 L-20,-20 L5,-5 Z" fill="#ff0844" filter="url(#glowRed)" opacity="0.8"/>
      <path d="M0,0 L20,-30 L5,-10 Z" fill="#ff0844" filter="url(#glowRed)" opacity="0.8"/>
      <rect x="-5" y="-40" width="2" height="40" fill="#ff0844" opacity="0.5" />
    </g>
  </g>

  <!-- Ambient Field: Sound Waves -->
  <g opacity="0.2">
    <!-- Blue waves (Left focus) -->
    <circle cx="300" cy="200" r="250" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="2,10" opacity="0.5" />
    
    <!-- Red waves (Right focus) -->
    <circle cx="850" cy="150" r="200" fill="none" stroke="#ff0844" stroke-width="2" stroke-dasharray="1,4" opacity="0.4" />
  </g>

  <!-- Typography: Title -->
  <!-- FIX: Moved down by 50px (110 -> 160) to ensure top fits within y=16 -->
  <g transform="translate(640, 160)">
    <!-- BLUE HOUR -->
    <text x="0" y="0" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="140" text-anchor="middle" letter-spacing="-2" fill="url(#blueGrad)" filter="url(#glowBlue)" transform="skewX(-10)">BLUE HOUR</text>
    
    <!-- RED NOISE -->
    <text x="0" y="100" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="140" text-anchor="middle" letter-spacing="-2" fill="url(#redGrad)" filter="url(#glowRed)" transform="skewX(10)">RED NOISE</text>
    
    <!-- Subtitle -->
    <text x="0" y="155" font-family="Courier New, monospace" font-weight="bold" font-size="18" text-anchor="middle" fill="#ffffff" letter-spacing="6" opacity="0.9">A NIGHT OF IMPROVISED SOUND</text>
  </g>

  <!-- Separation Lines -->
  <g transform="translate(0, 380)">
    <line x1="40" y1="0" x2="1240" y2="0" stroke="url(#lineGrad)" stroke-width="1" />
    <line x1="40" y1="0" x2="1240" y2="0" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2,8" opacity="0.2" />
  </g>

  <!-- Typography: Logistics (Bottom Left) -->
  <g transform="translate(60, 440)" font-family="Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="0" y="0" font-size="38" font-weight="900" letter-spacing="0" fill="#00f2fe">FRIDAY, SEPTEMBER 27</text>
    <text x="0" y="45" font-size="24" font-weight="400" fill="#cccccc">Doors 7 PM</text>
    
    <text x="0" y="135" font-size="26" font-weight="700" fill="#ffffff">THE FOUNDRY</text>
    <text x="0" y="165" font-size="18" font-weight="400" fill="#888888" letter-spacing="1">EAST RIVER DISTRICT</text>
  </g>

  <!-- Typography: Lineup (Bottom Right) -->
  <!-- FIX: Moved left by 40px (940 -> 900) to ensure right edge fits within x=1264 -->
  <g transform="translate(900, 440)" font-family="Helvetica, Arial, sans-serif">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#ff0844" letter-spacing="3" font-family="Courier New, monospace">FEATURING</text>
    
    <text x="0" y="60" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="0.5">NIA COLE QUARTET</text>
    <text x="0" y="105" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="0.5">STATIC BLOOM</text>
    <text x="0" y="150" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="0.5">ARMAND VALE</text>
  </g>

  <!-- Final Vignette -->
  <rect width="1280" height="800" fill="url(#vignette)" pointer-events="none" />

</svg>