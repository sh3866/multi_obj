<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    
    <!-- Waveform Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#0044ff" />
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff4400" />
    </linearGradient>

    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .headline { font-family: 'Inter', Arial, sans-serif; font-weight: 900; text-transform: uppercase; }
      .info-text { font-family: 'Inter', Arial, sans-serif; font-weight: 700; }
      .mono-text { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    </style>

    <!-- Filters -->
    <!-- Analog Film Grain -->
    <filter id="grainFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend mode="multiply" in="SourceGraphic" in2="grayNoise" result="grainyImage" />
    </filter>

    <!-- Directional Drop Shadow (Light Bleed) -->
    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="6" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- Waveform Glow (Reduced/Softer) -->
    <filter id="waveGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Chaos/Noise Filter for Red Wave -->
    <filter id="chaos" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" result="turb" />
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="15" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Clip Paths for Safe Rendering -->
    <clipPath id="canvasClip">
      <rect x="16" y="16" width="1248" height="768" />
    </clipPath>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1280" height="800" fill="url(#bgGrad)" />

  <!-- VISUAL ANCHOR: The Waveform -->
  <g clip-path="url(#canvasClip)">
    
    <!-- BLUE SIDE: Smooth, Liquid, Ghosted -->
    <g filter="url(#waveGlow)">
      <!-- Ghost Wave (Double Exposure) -->
      <path d="M-20,620 C150,620 280,380 480,420 C680,460 750,650 900,550" 
            stroke="#00ffff" stroke-width="2" fill="none" opacity="0.3" transform="translate(10, 10)" />
      <!-- Main Blue Wave -->
      <path d="M-20,620 C150,620 280,380 480,420 C680,460 750,650 900,550" 
            stroke="url(#blueGrad)" stroke-width="8" fill="none" stroke-linecap="round" />
    </g>

    <!-- RED SIDE: Jagged, Aggressive, Thick -->
    <!-- The path starts smoothly to transition from blue, then explodes into noise -->
    <path d="M900,550 L910,540 L915,580 L925,520 L935,590 L945,510 L955,570 L965,480 L975,560 L985,490 L995,580 L1005,450 L1015,540 L1025,420 L1035,510 L1045,400 L1055,480 L1065,380 L1075,450 L1085,350 L1095,420 L1105,300 L1115,380 L1125,280 L1135,350 L1145,250 L1155,320 L1165,200 L1175,280 L1185,180 L1195,250 L1205,150 L1215,220 L1225,120 L1235,180 L1245,100 L1255,160 L1265,80 L1275,140 L1300,100" 
          stroke="url(#redGrad)" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#chaos)" />
  </g>

  <!-- TYPOGRAPHY: HEADLINE STACK -->
  <!-- Sheared to create kinetic energy, moved to center-right -->
  <g transform="translate(450, 220) skewX(-8)" filter="url(#dropShadow)">
    <!-- BLUE HOUR (Clear) -->
    <text x="0" y="0" class="headline" font-size="110" letter-spacing="-4" fill="url(#blueGrad)">BLUE HOUR</text>
    
    <!-- RED NOISE (Intersected) -->
    <!-- We apply the red gradient, but the visual intersection is handled by the waveform being "on top" in the z-index of the SVG -->
    <text x="0" y="90" class="headline" font-size="110" letter-spacing="-4" fill="url(#redGrad)">RED NOISE</text>
  </g>

  <!-- SUBTITLE -->
  <text x="770" y="340" class="mono-text" font-size="18" fill="#ffffff" letter-spacing="2" opacity="0.8">A NIGHT OF IMPROVISED SOUND</text>

  <!-- TYPOGRAPHY: SECONDARY INFO COLUMN -->
  <!-- Tightly packed on the left, monospaced list -->
  <!-- Shifted up by 40px (600 -> 560) to prevent overflow at y=800 -->
  <g transform="translate(40, 560)">
    
    <!-- Date & Venue -->
    <text x="0" y="0" class="info-text" font-size="32" fill="#00ffff" letter-spacing="1">FRIDAY, SEPTEMBER 27</text>
    <text x="0" y="40" class="info-text" font-size="28" fill="#cccccc">Doors 7 PM</text>
    
    <text x="0" y="100" class="info-text" font-size="24" fill="#ffffff">THE FOUNDRY</text>
    <text x="0" y="130" class="info-text" font-size="18" fill="#888888">EAST RIVER DISTRICT</text>

    <!-- Performers (Monospaced, Static feel) -->
    <!-- Moved upward by 20px and reduced font-size from 18 to 16 to ensure bottom boundary compliance -->
    <text x="0" y="190" class="mono-text" font-size="14" fill="#ff0055" font-weight="bold" letter-spacing="2">FEATURING</text>
    
    <text x="0" y="230" class="mono-text" font-size="16" fill="#ffffff">NIA COLE QUARTET</text>
    <text x="0" y="265" class="mono-text" font-size="16" fill="#ffffff">STATIC BLOOM</text>
    <text x="0" y="300" class="mono-text" font-size="16" fill="#ffffff">ARMAND VALE</text>
  </g>

  <!-- GLOBAL TEXTURE: Analog Grain -->
  <!-- Applied over the entire composition to unify digital elements -->
  <rect width="1280" height="800" fill="none" filter="url(#grainFilter)" opacity="0.15" pointer-events="none" />

</svg>