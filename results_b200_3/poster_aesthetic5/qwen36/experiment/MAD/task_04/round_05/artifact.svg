<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="60%" cy="30%" r="95%">
      <stop offset="0%" stop-color="#1a1a20" />
      <stop offset="100%" stop-color="#030305" />
    </radialGradient>
    
    <!-- Waveform Gradients -->
    <!-- Blue: Fluid, Cyan to Deep Blue -->
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <!-- Red: Tension, Magenta to Red -->
    <linearGradient id="redGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff3300" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="textBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <linearGradient id="textRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0066" />
      <stop offset="100%" stop-color="#ff4400" />
    </linearGradient>

    <!-- FILTERS -->
    
    <!-- High-Fidelity Neon Bloom (Blue) -->
    <filter id="blueBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blurTight" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blurWide" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blurHalo" />
      <feMerge>
        <feMergeNode in="blurHalo" />
        <feMergeNode in="blurWide" />
        <feMergeNode in="blurTight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- High-Fidelity Neon Bloom (Red - slightly sharper for "noise") -->
    <filter id="redBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blurTight" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blurWide" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blurHalo" />
      <feMerge>
        <feMergeNode in="blurHalo" />
        <feMergeNode in="blurWide" />
        <feMergeNode in="blurTight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Text Shadow for Legibility -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Grain Texture -->
    <filter id="grainFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
    </filter>

    <style>
      .headline { font-family: 'Arial Black', Impact, sans-serif; font-weight: 900; }
      .body-text { font-family: 'Arial', Helvetica, sans-serif; font-weight: 700; }
      .thin-text { font-family: 'Arial', Helvetica, sans-serif; font-weight: 300; }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1280" height="800" fill="url(#bgGrad)" />

  <!-- VISUAL ANCHOR: The Signal Path -->
  <!-- This group sits behind text to avoid glow clipping, but text is positioned carefully -->
  <g>
    <!-- BLUE SIDE: The "Blue Hour" Flow -->
    <!-- Starts bottom left, smooth syncopated curve -->
    <path d="M 40 700 
             C 200 700, 350 650, 500 600
             C 650 550, 700 620, 850 520
             C 900 480, 950 450, 1000 380" 
          stroke="url(#blueGrad)" stroke-width="14" fill="none" stroke-linecap="round" filter="url(#blueBloom)" />

    <!-- RED SIDE: The "Red Noise" Tension -->
    <!-- Starts where blue ends, jagged, erratic, high frequency -->
    <path d="M 1000 380 
             L 1005 350 L 1012 390 L 1020 320 L 1028 370 L 1035 330 L 1042 380 
             L 1050 310 L 1058 360 L 1065 320 L 1075 390 L 1082 330 
             L 1090 400 L 1098 350 L 1105 410 L 1115 340 
             L 1122 380 L 1130 320 L 1138 360 L 1145 310 
             L 1155 350 L 1162 300 L 1170 320 L 1178 280 
             L 1185 310 L 1192 270 L 1200 290 L 1208 250 
             L 1215 280 L 1222 240 L 1230 260 L 1238 230 
             L 1245 250 L 1252 220 L 1260 240 L 1270 210 
             L 1278 230 L 1280 220" 
          stroke="url(#redGrad)" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="miter" filter="url(#redBloom)" />
  </g>

  <!-- TYPOGRAPHY: HEADLINE (Top Right) -->
  <!-- Structural distortion: Staggered and tilted characters to mimic syncopation -->
  <g transform="translate(850, 220)">
    
    <!-- BLUE HOUR -->
    <!-- Syncopated positioning -->
    <text x="-250" y="0" class="headline" font-size="100" fill="url(#textBlueGrad)">
      <tspan x="-250" y="0" transform="rotate(-2, -250, 0)">B</tspan>
      <tspan x="-155" y="0" transform="translate(0, -8)">L</tspan>
      <tspan x="-110" y="0" transform="translate(0, 4)">U</tspan>
      <tspan x="-55" y="0" transform="rotate(1, -55, 0)">E</tspan>
      
      <tspan x="10" y="0" transform="translate(0, 6)">H</tspan>
      <tspan x="65" y="0" transform="translate(0, -4)">O</tspan>
      <tspan x="120" y="0" transform="rotate(-1, 120, 0)">U</tspan>
      <tspan x="175" y="0" transform="translate(0, -2)">R</tspan>
    </text>
    
    <!-- RED NOISE -->
    <!-- More aggressive distortion to match "noise" -->
    <text x="-200" y="110" class="headline" font-size="100" fill="url(#textRedGrad)">
      <tspan x="-200" y="110" transform="translate(0, -10)">R</tspan>
      <tspan x="-145" y="110" transform="rotate(3, -145, 110)">E</tspan>
      <tspan x="-100" y="110" transform="translate(0, 8)">D</tspan>
      
      <tspan x="40" y="110" transform="translate(0, 12)">N</tspan>
      <tspan x="95" y="110" transform="rotate(-4, 95, 110)">O</tspan>
      <tspan x="145" y="110" transform="translate(0, -6)">I</tspan>
      <tspan x="170" y="110" transform="rotate(2, 170, 110)">S</tspan>
      <tspan x="210" y="110" transform="translate(0, 4)">E</tspan>
    </text>

    <!-- SUBTITLE -->
    <text x="-150" y="160" class="thin-text" font-size="16" fill="#ffffff" letter-spacing="6" text-anchor="start" opacity="0.8">A NIGHT OF IMPROVISED SOUND</text>
    
  </g>

  <!-- TYPOGRAPHY: DETAILS (Bottom Left) -->
  <!-- Anchored to the start of the blue signal path -->
  <g transform="translate(40, 480)">
    
    <!-- Date -->
    <text x="0" y="0" class="headline" font-size="32" fill="#00ffff" letter-spacing="1">FRIDAY, SEPTEMBER 27</text>
    <text x="0" y="30" class="body-text" font-size="20" fill="#ffffff" opacity="0.8">Doors 7 PM</text>
    
    <!-- Venue -->
    <text x="0" y="90" class="headline" font-size="28" fill="#ffffff" letter-spacing="1">THE FOUNDRY</text>
    <text x="0" y="115" class="body-text" font-size="16" fill="#888888" letter-spacing="2">EAST RIVER DISTRICT</text>

    <!-- Performers -->
    <text x="0" y="175" class="body-text" font-size="14" fill="#ff0055" font-weight="bold" letter-spacing="4">FEATURING</text>
    
    <text x="0" y="215" class="headline" font-size="22" fill="#ffffff" opacity="0.9">NIA COLE QUARTET</text>
    <text x="0" y="250" class="headline" font-size="22" fill="#ffffff" opacity="0.9">STATIC BLOOM</text>
    <text x="0" y="285" class="headline" font-size="22" fill="#ffffff" opacity="0.9">ARMAND VALE</text>
  </g>

  <!-- GLOBAL TEXTURE: Analog Grain Overlay -->
  <!-- Multiplied to darken slightly and add texture -->
  <rect width="1280" height="800" fill="none" filter="url(#grainFilter)" opacity="0.2" pointer-events="none" style="mix-blend-mode: overlay;" />

</svg>