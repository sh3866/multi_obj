<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>
    
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff3300" />
    </linearGradient>

    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0055ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="jitter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.1" numOctaves="2" result="turb" />
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="8" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Multi-layered Glow -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Wide soft outer glow -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="outerGlow" />
      <feComponentTransfer in="outerGlow" result="glowDim">
        <feFuncA type="linear" slope="0.6" />
      </feComponentTransfer>
      
      <!-- Tight inner glow -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="innerGlow" />
      
      <!-- Merge -->
      <feMerge>
        <feMergeNode in="glowDim" />
        <feMergeNode in="innerGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </radialGradient>

    <!-- Clip Path for the Waveform Split -->
    <clipPath id="leftClip">
      <rect x="0" y="0" width="640" height="800" />
    </clipPath>
    <clipPath id="rightClip">
      <rect x="640" y="0" width="640" height="800" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bgGrad)" />
  
  <!-- Ambient Background Glows -->
  <circle cx="400" cy="400" r="500" fill="url(#blueGlow)" pointer-events="none" />
  <circle cx="900" cy="400" r="500" fill="url(#redGlow)" pointer-events="none" />

  <!-- Subtle Grain Overlay -->
  <rect width="1280" height="800" fill="none" filter="url(#noiseFilter)" opacity="0.07" pointer-events="none" />

  <!-- DIVIDER LINE -->
  <line x1="640" y1="0" x2="640" y2="800" stroke="#333" stroke-width="1" opacity="0.5" />
  <!-- Glitch on divider -->
  <line x1="640" y1="100" x2="640" y2="150" stroke="#ff0055" stroke-width="2" opacity="0.8" />
  <line x1="640" y1="650" x2="640" y2="700" stroke="#00ffff" stroke-width="2" opacity="0.8" />

  <!-- VISUAL ANCHOR: The Hybrid Waveform -->
  <g stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- LEFT SIDE: Smooth, Liquid Blue Hour -->
    <g clip-path="url(#leftClip)">
      <!-- Main Wave -->
      <path d="M0,550 C150,550 200,350 350,400 C500,450 550,600 640,500" 
            stroke="url(#blueGrad)" filter="url(#neonGlow)" />
      <!-- Echo Wave -->
      <path d="M0,560 C150,560 200,360 350,410 C500,460 550,610 640,510" 
            stroke="#00ffff" stroke-width="1" opacity="0.4" />
    </g>

    <!-- RIGHT SIDE: Jagged, High-Freq Red Noise -->
    <g clip-path="url(#rightClip)">
      <!-- Main Glitch Wave -->
      <path d="M640,500 L660,480 L670,520 L690,450 L710,550 L730,480 L750,600 L780,450 L810,580 L850,420 L880,500 L920,350 L950,480 L990,300 L1020,400 L1060,250 L1090,320 L1130,200 L1160,280 L1200,150 L1280,200" 
            stroke="url(#redGrad)" filter="url(#jitter)" />
            <!-- Note: Filter url(#jitter) applied to path for organic glitch feel, but keeping stroke-width crisp -->
            
      <!-- Echo Chaos -->
      <path d="M640,510 L665,490 L675,530 L695,460 L715,560 L735,490 L755,610 L785,460 L815,590 L855,430 L885,510 L925,360 L955,490 L995,310 L1025,410 L1065,260 L1095,330 L1135,210 L1165,290 L1205,160 L1280,210" 
            stroke="#ff0055" stroke-width="1" opacity="0.5" filter="url(#jitter)" />
    </g>
  </g>

  <!-- TYPOGRAPHY: HEADLINE -->
  <g transform="translate(640, 260)" text-anchor="middle">
    <!-- BLUE HOUR -->
    <!-- Using mix-blend-mode via CSS for optical integration -->
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="130" letter-spacing="-4" fill="url(#blueGrad)" filter="url(#neonGlow)" style="mix-blend-mode: screen;">BLUE HOUR</text>
    
    <!-- RED NOISE -->
    <text x="0" y="100" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="130" letter-spacing="-4" fill="url(#redGrad)" filter="url(#neonGlow)" style="mix-blend-mode: screen;">RED NOISE</text>
    
    <!-- Subtitle -->
    <text x="0" y="145" font-family="Courier New, monospace" font-weight="bold" font-size="20" text-anchor="middle" fill="#ffffff" letter-spacing="3" opacity="0.9">A NIGHT OF IMPROVISED SOUND</text>
  </g>

  <!-- TYPOGRAPHY: SYNCOPATED INFO BLOCKS -->
  
  <!-- LEFT: Logistics (Blue Side) -->
  <!-- Aligned strictly to left, creating order -->
  <g transform="translate(60, 580)" font-family="Helvetica, Arial, sans-serif">
    <text x="0" y="0" font-size="32" font-weight="bold" letter-spacing="1" fill="#00ffff">FRIDAY, SEPTEMBER 27</text>
    <text x="0" y="40" font-size="28" font-weight="normal" fill="#cccccc">Doors 7 PM</text>
    
    <text x="0" y="100" font-size="24" font-weight="bold" fill="#ffffff">THE FOUNDRY</text>
    <text x="0" y="130" font-size="18" font-weight="normal" fill="#888888">EAST RIVER DISTRICT</text>
  </g>

  <!-- RIGHT: Performers (Red Side) -->
  <!-- Staggered X-coordinates to create visual rhythm/interruption -->
  <g transform="translate(850, 620)" font-family="Helvetica, Arial, sans-serif">
    
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#ff0055" letter-spacing="2">FEATURING</text>
    
    <!-- Performer 1: Aligned Left -->
    <text x="0" y="50" font-size="34" font-weight="900" fill="#ffffff" style="mix-blend-mode: screen;">NIA COLE QUARTET</text>
    
    <!-- Performer 2: Shifted Right (Syncopation) -->
    <text x="60" y="95" font-size="34" font-weight="900" fill="#ffffff" style="mix-blend-mode: screen;">STATIC BLOOM</text>
    
    <!-- Performer 3: Shifted Left (Syncopation) -->
    <text x="-20" y="140" font-size="34" font-weight="900" fill="#ffffff" style="mix-blend-mode: screen;">ARMAND VALE</text>
  </g>

  <!-- Final Vignette -->
  <rect width="1280" height="800" fill="url(#vignette)" pointer-events="none" />

</svg>