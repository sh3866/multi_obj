<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#161920" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Title Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff4400" />
    </linearGradient>

    <!-- Filters -->
    <!-- Intense Glow for Titles -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Glow for Body Text -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Noise Texture -->
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <!-- Waveform Displacement (Glitchy Wave) -->
    <filter id="waveDisplace">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.1" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1280" height="800" fill="url(#bgGrad)" />
  
  <!-- Grain Overlay -->
  <rect width="1280" height="800" fill="#ffffff" filter="url(#noiseFilter)" opacity="0.08" style="mix-blend-mode: overlay;" pointer-events="none" />

  <!-- 2. Visual Elements: Colliding Waveforms -->
  <g opacity="0.85">
    <!-- Blue Hour: Deep, smooth, organic curve -->
    <path d="M -50,250 Q 200,250 150,600 T -50,850" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="5" filter="url(#neonGlow)" opacity="0.6" />
          
    <!-- Red Noise: Sharp, jagged, aggressive spikes using displacement filter -->
    <path d="M 1280,100 L 900,100 L 800,400 L 600,350 L 400,600 L 200,550" 
          fill="none" stroke="url(#redGrad)" stroke-width="8" filter="url(#waveDisplace)" stroke-linejoin="miter" />

    <!-- "Red Noise" Bleed / Secondary Wave -->
    <path d="M 1280,200 L 950,200 L 850,450 L 650,400 L 450,650" 
          fill="none" stroke="#ff0055" stroke-width="2" filter="url(#waveDisplace)" stroke-dasharray="20, 10" opacity="0.7" />
  </g>

  <!-- 3. Typography: Main Title -->
  <g transform="translate(0, 0)">
    <!-- BLUE HOUR: Centered, Slight Skew -->
    <text x="640" y="340" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="130" text-anchor="middle" letter-spacing="-5" fill="url(#cyanGrad)" filter="url(#neonGlow)" transform="skewX(-6)">BLUE HOUR</text>
    
    <!-- RED NOISE: Glitch Effect via Duplicate Layers -->
    <!-- Layer 1: Cyan Shift Left -->
    <text x="630" y="460" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="130" text-anchor="middle" letter-spacing="-5" fill="#00ffff" opacity="0.8" transform="skewX(-6)">RED NOISE</text>
    <!-- Layer 2: Red Shift Right -->
    <text x="650" y="460" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="130" text-anchor="middle" letter-spacing="-5" fill="#ff0055" opacity="0.8" transform="skewX(-6)">RED NOISE</text>
    <!-- Layer 3: White Core (Slightly rotated for tension) -->
    <text x="640" y="458" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="130" text-anchor="middle" letter-spacing="-5" fill="#ffffff" filter="url(#neonGlow)" transform="skewX(-6) rotate(-1, 640, 458)">RED NOISE</text>

    <!-- Subtitle -->
    <text x="640" y="530" font-family="Courier New, monospace" font-weight="bold" font-size="22" text-anchor="middle" fill="#cccccc" letter-spacing="8" filter="url(#textGlow)">A NIGHT OF IMPROVISED SOUND</text>
  </g>

  <!-- 4. Composition: Bottom Diagonal Tension -->
  <g font-family="Helvetica, Arial, sans-serif">
    
    <!-- LEFT QUADRANT: Information (Cyan Accent) -->
    <g transform="translate(60, 630)">
      <text x="0" y="0" font-size="28" font-weight="bold" fill="#00ffff" letter-spacing="1">FRIDAY, SEPTEMBER 27</text>
      <text x="0" y="40" font-size="22" font-weight="normal" fill="#8899aa">Doors 7 PM</text>
      
      <text x="0" y="90" font-size="24" font-weight="bold" fill="#ffffff">THE FOUNDRY</text>
      <text x="0" y="115" font-size="18" font-weight="normal" fill="#667788">EAST RIVER DISTRICT</text>
    </g>

    <!-- RIGHT QUADRANT: Lineup (Red Accent) -->
    <g transform="translate(950, 630)">
      <text x="160" y="0" font-size="20" font-weight="bold" fill="#ff0055" text-anchor="end" letter-spacing="6">FEATURING</text>
      
      <!-- Staggered, high-impact list -->
      <text x="160" y="50" font-size="36" font-weight="900" fill="#ffffff" text-anchor="end" letter-spacing="1">NIA COLE QUARTET</text>
      <text x="160" y="95" font-size="36" font-weight="900" fill="#ffffff" text-anchor="end" letter-spacing="1">STATIC BLOOM</text>
      <text x="160" y="140" font-size="36" font-weight="900" fill="#ffffff" text-anchor="end" letter-spacing="1">ARMAND VALE</text>
    </g>

  </g>

  <!-- Decorative "Glitch" Rectangles overlaying elements slightly -->
  <rect x="400" y="360" width="80" height="4" fill="#00ffff" opacity="0.6" />
  <rect x="800" y="480" width="120" height="4" fill="#ff0055" opacity="0.6" />

</svg>