<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Sky Gradient: Deep dark blue to slate -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Mountain Gradient: Deep charcoal/forest tones instead of flat black -->
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1917" /> <!-- Stone-900 -->
      <stop offset="100%" stop-color="#0c0a09" /> <!-- Stone-950 -->
    </linearGradient>

    <!-- Forest Gradient: Rich dark forest green -->
    <linearGradient id="forestGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b" /> <!-- Emerald-900 -->
      <stop offset="100%" stop-color="#022c22" /> <!-- Emerald-950 -->
    </linearGradient>

    <!-- Fire Gradient: Multi-stop heat variation -->
    <linearGradient id="fireGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7f1d1d" /> <!-- Deep Red -->
      <stop offset="30%" stop-color="#ea580c" /> <!-- Burnt Orange -->
      <stop offset="70%" stop-color="#fbbf24" /> <!-- Bright Yellow -->
      <stop offset="100%" stop-color="#fef08a" /> <!-- White Hot -->
    </linearGradient>

    <!-- Text Gradient: Illuminated by fire -->
    <linearGradient id="textGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fca5a5" /> <!-- Red-300 glow -->
      <stop offset="50%" stop-color="#ffffff" /> <!-- White -->
      <stop offset="100%" stop-color="#fef08a" /> <!-- Yellow-200 highlight -->
    </linearGradient>

    <!-- Smoke Gradient: Subtle semi-transparent dark grey -->
    <linearGradient id="smokeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#475569" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0" />
    </linearGradient>

    <!-- Spark Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="20%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <!-- Blur for smoke -->
    <filter id="blurSmoke" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    
    <!-- Fire Glow / Heat Haze -->
    <filter id="fireGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Roughness Filter for Burn Scar -->
    <filter id="roughEdge">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="15" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Directional Shadow for Text -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="1280" height="800" fill="url(#skyGrad)" />

  <!-- The Mountain (Centerpiece) -->
  <g id="mountain">
    <!-- Main Peak -->
    <path d="M 100 800 L 450 250 L 640 180 L 850 320 L 1180 800 Z" fill="url(#mountainGrad)" />
    <!-- Secondary Peaks -->
    <path d="M -50 800 L 200 400 L 450 250 Z" fill="#1c1917" opacity="0.9"/>
    <path d="M 850 320 L 1050 450 L 1350 800 Z" fill="#292524" opacity="0.8" />
  </g>

  <!-- The Forest Silhouette (Base) -->
  <!-- Jagged path representing a dense pine forest line -->
  <path d="M0 800 L0 650 L15 660 L30 640 L45 670 L60 630 L80 665 L100 620 L120 655 L140 610 L160 645 L180 600 L200 635 L220 590 L240 625 L260 580 L280 615 L300 570 L320 605 L340 560 L360 595 L380 550 L400 585 L420 540 L440 575 L460 530 L480 565 L500 520 L520 555 L540 510 L560 545 L580 500 L600 535 L620 490 L640 525 L660 480 L680 515 L700 470 L720 505 L740 460 L760 495 L780 450 L800 485 L820 440 L840 475 L860 430 L880 465 L900 420 L920 455 L940 410 L960 445 L980 400 L1000 435 L1020 390 L1040 425 L1060 380 L1080 415 L1100 370 L1120 405 L1140 360 L1160 395 L1180 350 L1200 385 L1220 340 L1240 375 L1260 330 L1280 360 L1280 800 Z" fill="url(#forestGrad)" />

  <!-- The Organic Fire Trail -->
  <!-- Replaced continuous line with a trail that fades out at the top right -->
  <g filter="url(#fireGlow)">
    <!-- Outer Fire Layer (Thick, textured) -->
    <!-- Path starts at bottom left (spark) and trails up -->
    <path d="M 100 670 C 150 660, 200 650, 250 630 C 300 610, 350 600, 400 570 C 450 540, 500 550, 550 510 C 600 470, 650 500, 700 470 C 750 440, 800 460, 850 420 C 900 380, 950 400, 1000 370 C 1050 340, 1100 360, 1150 320 C 1200 280, 1250 300, 1280 260" 
          fill="none" stroke="url(#fireGrad)" stroke-width="35" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#roughEdge)" />
    
    <!-- Inner Fire Core (Thinner, brighter) -->
    <path d="M 100 670 C 150 660, 200 650, 250 630 C 300 610, 350 600, 400 570 C 450 540, 500 550, 550 510 C 600 470, 650 500, 700 470 C 750 440, 800 460, 850 420 C 900 380, 950 400, 1000 370 C 1050 340, 1100 360, 1150 320 C 1200 280, 1250 300, 1280 260" 
          fill="none" stroke="#fef08a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#roughEdge)" />
  </g>

  <!-- The Single Spark (The cause) -->
  <!-- Positioned at the start of the fire line (bottom left) -->
  <g transform="translate(100, 670)">
    <circle cx="0" cy="0" r="80" fill="url(#sparkGlow)" opacity="0.9"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
    <!-- Spark flare rays -->
    <path d="M0 0 L12 -18 Q6 -24 0 -30 Q-6 -24 -12 -18 Z" fill="#fef08a" />
    <path d="M0 0 L-18 12 Q-24 6 -30 0 Q-24 -6 -18 -12 Z" fill="#fef08a" />
    <path d="M0 0 L18 12 Q24 6 30 0 Q24 -6 18 -12 Z" fill="#fef08a" />
    <path d="M0 0 L0 18 Q6 24 0 30 Q-6 24 0 18 Z" fill="#fef08a" />
  </g>

  <!-- Smoke Rising (Atmospheric context) -->
  <g filter="url(#blurSmoke)">
    <path d="M 100 600 C 50 400, 200 300, 150 100 C 250 200, 350 300, 400 150 C 500 50, 600 200, 650 100 C 600 300, 500 400, 550 600 L 50 600 Z" fill="url(#smokeGrad)" opacity="0.6" />
    <path d="M 300 550 C 250 350, 400 250, 350 50 C 450 150, 550 250, 600 100 C 550 300, 450 400, 500 600 L 200 600 Z" fill="url(#smokeGrad)" opacity="0.5" />
  </g>

  <!-- Typography Group -->
  <g>
    
    <!-- Main Headline: ONE SPARK IS ENOUGH -->
    <!-- Anchored to the top right (end of the fire trail), following diagonal energy -->
    <!-- The text is visually connected to the flame end -->
    <g transform="translate(1260, 180) rotate(0)">
      <!-- Text is right aligned to the end of the fire trail -->
      <text x="0" y="0" text-anchor="end" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="110" fill="url(#textGrad)" letter-spacing="2" filter="url(#textShadow)">
        <tspan x="0" dy="0">ONE SPARK</tspan>
        <tspan x="0" dy="110">IS ENOUGH</tspan>
      </text>
    </g>

    <!-- Secondary Text: Check conditions... -->
    <!-- Shifted to darker negative space (bottom left), offset from the spark -->
    <g transform="translate(40, 600)">
      <text x="0" y="0" font-family="Verdana, Geneva, sans-serif" font-weight="700" font-size="34" fill="#f8fafc" letter-spacing="1" style="font-style: italic;" filter="url(#textShadow)">
        <tspan x="0" dy="0">Check conditions.</tspan>
        <tspan x="0" dy="48">Extinguish completely.</tspan>
        <tspan x="0" dy="48">Protect the wild.</tspan>
      </text>
      
      <!-- Footer Brand (REPAIRED) -->
      <!-- 
         BOUNDARY REPAIR:
         1. Moved group up by 20px (translate 180 instead of 200) to fix bottom overflow (y=784).
         2. Reduced font-size from 18 to 16 to fix right overflow (width=512).
         3. Reduced letter-spacing from 4 to 2 to assist width reduction.
      -->
      <g transform="translate(0, 180)">
        <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#94a3b8" letter-spacing="2">
          NATIONAL FOREST SAFETY INITIATIVE
        </text>
        <!-- Separator Line -->
        <line x1="0" y1="25" x2="200" y2="25" stroke="#ea580c" stroke-width="5" stroke-linecap="round" />
      </g>
    </g>
  </g>

</svg>