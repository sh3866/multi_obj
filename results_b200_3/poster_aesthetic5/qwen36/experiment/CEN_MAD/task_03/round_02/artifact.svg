<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Deep Sea Background Gradient -->
    <radialGradient id="abyss-bg" cx="75%" cy="40%" r="100%">
      <stop offset="0%" stop-color="#061424" />
      <stop offset="30%" stop-color="#020812" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Text Gradient for Depth Integration -->
    <linearGradient id="text-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#aaddff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#061424" stop-opacity="0.1" />
    </linearGradient>
    
    <!-- Secondary Text Gradient for closer integration -->
    <linearGradient id="text-fade-sub" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#88ccff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#061424" stop-opacity="0.1" />
    </linearGradient>

    <!-- Intense Bioluminescent Glow -->
    <filter id="glow-intense" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur3" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur4" />
      <feMerge>
        <feMergeNode in="blur4" />
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Glow for Ethereal Elements -->
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Tube Worm Gradient -->
    <linearGradient id="tube-worm-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#300000" />
      <stop offset="50%" stop-color="#aa0000" />
      <stop offset="100%" stop-color="#300000" />
    </linearGradient>

    <!-- Atmosphere Overlay Gradient -->
    <radialGradient id="atmosphere" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85" />
    </radialGradient>

    <!-- Typography Mask to allow light sources to pass behind text -->
    <mask id="text-mask">
      <rect width="1280" height="800" fill="black" />
      <g transform="translate(80, 140)" fill="white">
        <text x="0" y="0" font-family="Georgia, serif" font-size="100" font-weight="bold" letter-spacing="4">BELOW</text>
        <text x="0" y="115" font-family="Georgia, serif" font-size="100" font-weight="bold" letter-spacing="4">THE LAST</text>
        <text x="0" y="230" font-family="Georgia, serif" font-size="100" font-weight="bold" letter-spacing="4">LIGHT</text>
      </g>
    </mask>
  </defs>

  <!-- 1. Deep Textured Radial Background -->
  <rect width="1280" height="800" fill="url(#abyss-bg)" />

  <!-- Faint Light Shafts -->
  <g opacity="0.02" fill="#ffffff">
    <polygon points="400,-50 600,-50 850,800 200,800" />
  </g>

  <!-- Background Particulates (Marine Snow) -->
  <g fill="#ffffff" opacity="0.15">
    <circle cx="150" cy="120" r="1" />
    <circle cx="850" cy="250" r="1.5" />
    <circle cx="1100" cy="300" r="2" />
    <circle cx="300" cy="450" r="1" />
    <circle cx="950" cy="600" r="1.5" />
    <circle cx="200" cy="750" r="2" />
    <circle cx="1200" cy="700" r="1" />
    <circle cx="600" cy="100" r="1" />
  </g>

  <!-- 2. Central Visual Anchor: Complex Radiolarian / Siphonophore -->
  <!-- Placed on the right to balance the left-aligned text, reaching towards the center -->
  <g id="siphonophore-anchor">
    <!-- Main glowing body cluster -->
    <g transform="translate(850, 350)">
      <!-- Translucent organic shapes -->
      <path d="M0,-150 Q80,-50 0,150 Q-80,-50 0,-150" fill="rgba(0, 255, 255, 0.03)" stroke="#00ffff" stroke-width="1" filter="url(#soft-glow)" opacity="0.4"/>
      <path d="M0,-250 Q150,-100 0,250 Q-150,-100 0,-250" fill="rgba(0, 255, 255, 0.02)" stroke="#00ffff" stroke-width="0.5" filter="url(#soft-glow)" opacity="0.3"/>
      
      <!-- Connecting filaments -->
      <path d="M0,-150 L0,250" stroke="#4488aa" fill="none" opacity="0.4" stroke-dasharray="4 8" />
      
      <!-- Intricate web-like structures -->
      <g stroke="#88ffdd" stroke-width="0.5" opacity="0.6">
        <line x1="0" y1="-150" x2="60" y2="-100" />
        <line x1="60" y1="-100" x2="0" y2="-50" />
        <line x1="0" y1="-50" x2="-60" y2="-100" />
        <line x1="-60" y1="-100" x2="0" y2="-150" />
        
        <line x1="0" y1="-50" x2="80" y2="0" />
        <line x1="80" y1="0" x2="0" y2="50" />
        <line x1="0" y1="50" x2="-80" y2="0" />
        <line x1="-80" y1="0" x2="0" y2="-50" />
      </g>

      <!-- Bioluminescent Nodes (Cyan) -->
      <g filter="url(#glow-intense)">
        <circle cx="60" cy="-100" r="3" fill="#00ffff" />
        <circle cx="-60" cy="-100" r="3" fill="#00ffff" />
        <circle cx="0" cy="-150" r="4" fill="#00ffff" />
        <circle cx="80" cy="0" r="5" fill="#00ffff" />
        <circle cx="-80" cy="0" r="5" fill="#00ffff" />
        <circle cx="0" cy="50" r="6" fill="#00ffff" />
      </g>

      <!-- Bioluminescent Nodes (Red/Orange - predatory lure or depth contrast) -->
      <g filter="url(#glow-intense)">
        <circle cx="40" cy="120" r="2" fill="#ff3333" />
        <circle cx="-40" cy="120" r="2" fill="#ff3333" />
        <circle cx="0" cy="200" r="3" fill="#ff3333" />
      </g>
      
      <!-- Trailing tentacles (fading away) -->
      <path d="M0,200 Q50,300 20,450" fill="none" stroke="#4488aa" stroke-width="1" opacity="0.3" filter="url(#soft-glow)" />
      <path d="M0,200 Q-50,300 -20,450" fill="none" stroke="#4488aa" stroke-width="1" opacity="0.3" filter="url(#soft-glow)" />
    </g>
  </g>

  <!-- Deep Sea Elements: Tube Worms (Bottom Left - partially obscured by text/depth) -->
  <g transform="translate(120, 850)" opacity="0.8">
    <!-- Base -->
    <path d="M-80,0 L-20,-40 L40,-20 L100,0 Z" fill="#000000" />
    <!-- Worms -->
    <rect x="-40" y="-140" width="12" height="140" fill="url(#tube-worm-grad)" rx="6" />
    <circle cx="-34" cy="-140" r="10" fill="#ff0000" filter="url(#glow-intense)" />
    
    <rect x="10" y="-180" width="16" height="180" fill="url(#tube-worm-grad)" rx="8" />
    <circle cx="18" cy="-180" r="14" fill="#ff0000" filter="url(#glow-intense)" />
    
    <rect x="60" y="-110" width="10" height="110" fill="url(#tube-worm-grad)" rx="5" />
    <circle cx="65" cy="-110" r="8" fill="#ff0000" filter="url(#glow-intense)" />
  </g>

  <!-- Deep Sea Elements: Distant Jellyfish (Mid Right background) -->
  <g transform="translate(1050, 550)" opacity="0.4">
    <path d="M-40,0 Q0,-60 40,0" fill="rgba(100, 255, 255, 0.05)" stroke="#00ffff" stroke-width="1" filter="url(#soft-glow)"/>
    <line x1="-20" y1="0" x2="-30" y2="80" stroke="#00ffff" stroke-width="0.5" opacity="0.5"/>
    <line x1="20" y1="0" x2="30" y2="80" stroke="#00ffff" stroke-width="0.5" opacity="0.5"/>
    <line x1="0" y1="-10" x2="0" y2="90" stroke="#00ffff" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- 3 & 4. Typography Layer: Integrated into Atmosphere -->
  <!-- Text is split: The black shadow layer is masked by the organism, creating interplay -->
  <g>
    <!-- Main Title: Tall, Condensed Serif, Left-Shifted -->
    <!-- Shadow Layer (Masked to allow organism to pass "behind" text vis-a-vis the glow, but actually sits on top of background) -->
    <g transform="translate(80, 140)" mask="url(#text-mask)">
       <!-- This trick creates the illusion that the text is cut out of the background slightly, or that the lights behind are blocked -->
       <rect width="1280" height="800" fill="#000000" opacity="0.4" />
    </g>

    <g transform="translate(80, 140)">
      <!-- Text Fill with Gradient -->
      <text x="0" y="0" font-family="Georgia, serif" font-size="100" font-weight="bold" letter-spacing="4" fill="url(#text-fade)">BELOW</text>
      <text x="0" y="115" font-family="Georgia, serif" font-size="100" font-weight="bold" letter-spacing="4" fill="url(#text-fade)">THE LAST</text>
      <text x="0" y="230" font-family="Georgia, serif" font-size="100" font-weight="bold" letter-spacing="4" fill="url(#text-fade)">LIGHT</text>
      
      <!-- Subtle Volumetric Glow on Text (Blue) -->
      <g filter="url(#glow-intense)" opacity="0.3">
        <text x="0" y="0" font-family="Georgia, serif" font-size="100" font-weight="bold" letter-spacing="4" fill="#4ff">BELOW</text>
        <text x="0" y="115" font-family="Georgia, serif" font-size="100" font-weight="bold" letter-spacing="4" fill="#4ff">THE LAST</text>
        <text x="0" y="230" font-family="Georgia, serif" font-size="100" font-weight="bold" letter-spacing="4" fill="#4ff">LIGHT</text>
      </g>
    </g>

    <!-- Subtitle (Aligned with Title Text Block) -->
    <g transform="translate(85, 415)">
      <text x="0" y="0" font-family="Georgia, serif" font-size="26" font-style="italic" fill="url(#text-fade-sub)" letter-spacing="1" opacity="0.8">Life at the edge of the known world</text>
    </g>
  </g>

  <!-- 5. Anchored Secondary Information (Bottom Corners) -->
  <!-- Right Side Anchor -->
  <g transform="translate(1120, 720)" text-anchor="end">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#ffffff" opacity="0.7">SPECIAL EXHIBITION</text>
    <text x="0" y="28" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="3" fill="#ffffff" opacity="0.7">NOVEMBER 2–MARCH 9</text>
  </g>

  <!-- Left Side Anchor -->
  <g transform="translate(80, 720)" text-anchor="start">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="4" fill="#6699bb" opacity="0.8">CALDER MUSEUM OF NATURAL HISTORY</text>
  </g>

  <!-- Foreground Particles & Depth -->
  <g fill="#00ffff" opacity="0.4" filter="url(#glow-intense)">
    <circle cx="200" cy="300" r="2" />
    <circle cx="1100" cy="150" r="1.5" />
    <circle cx="300" cy="600" r="2.5" />
    <circle cx="900" cy="700" r="1" />
    <circle cx="500" cy="200" r="1.5" />
  </g>

  <!-- Final Vignette Overlay for Focus and Pressure -->
  <rect width="1280" height="800" fill="url(#atmosphere)" pointer-events="none" />
  
  <!-- Border for Framing -->
  <rect x="16" y="16" width="1248" height="768" fill="none" stroke="#000000" stroke-width="2" opacity="0.6" />

</svg>