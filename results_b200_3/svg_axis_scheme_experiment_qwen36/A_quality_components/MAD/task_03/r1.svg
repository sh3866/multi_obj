<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="tempLineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="rainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="alertGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Patterns -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="1280" height="800" fill="url(#skyGrad)" />
  <rect width="1280" height="800" fill="url(#grid)" />

  <!-- Subtle Coastal Motif (Topographic/Wave) -->
  <g transform="translate(500, 150)" opacity="0.04">
    <path d="M0,0 C 300,-100 600,100 900,0 S 1200,-100 1400,0 L 1400,800 L 0,800 Z" fill="#f8fafc" />
    <path d="M0,50 C 300,-50 600,150 900,50 S 1200,-50 1400,50 L 1400,800 L 0,800 Z" fill="#f8fafc" />
    <path d="M0,100 C 300,0 600,200 900,100 S 1200,0 1400,100 L 1400,800 L 0,800 Z" fill="#f8fafc" />
  </g>

  <!-- Header Line -->
  <line x1="60" y1="140" x2="1220" y2="140" stroke="#334155" stroke-width="1" />

  <!-- ================= HEADER ================= -->
  <g transform="translate(60, 60)">
    <text x="0" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="2">ANNUAL ENVIRONMENTAL REPORT</text>
    <text x="0" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="42" font-weight="800" letter-spacing="-1">City Climate Brief <tspan fill="#38bdf8">2035</tspan></text>
    <text x="0" y="75" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="18" font-weight="300">Port Aurora: Coastal Resilience &amp; Thermal Shift Analysis</text>
  </g>

  <!-- ================= LEFT COLUMN: NARRATIVE & CONTEXT ================= -->
  <g transform="translate(60, 160)">
    
    <!-- Executive Summary -->
    <g transform="translate(0, 0)">
      <rect width="580" height="100" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <line x1="0" y1="0" x2="580" y2="0" stroke="#38bdf8" stroke-width="3" />
      <text x="20" y="28" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1">EXECUTIVE SUMMARY</text>
      <text x="20" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="400">
        <tspan x="20" dy="0">Port Aurora is experiencing a 1.4°C baseline temperature rise, with</tspan>
        <tspan x="20" dy="20">precipitation becoming increasingly concentrated and flash floods</tspan>
        <tspan x="20" dy="20">threatening the historic districts. Immediate adaptation is required.</tspan>
      </text>
    </g>

    <!-- Chart 1: Temperature Trend -->
    <g transform="translate(0, 130)">
      <text x="0" y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Monthly Temperature Trend</text>
      <text x="0" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Averaged anomaly over last 10 years</text>
      
      <!-- Chart Grid -->
      <g transform="translate(0, 50)">
        <!-- Y Axis Lines -->
        <path d="M0 100 L580 100" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" />
        <path d="M0 200 L580 200" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" />
        <path d="M0 300 L580 300" stroke="#334155" stroke-width="1" />
        
        <!-- Y Labels -->
        <text x="-10" y="105" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">+2.0°</text>
        <text x="-10" y="205" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">+1.0°</text>
        <text x="-10" y="305" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">0.0°</text>

        <!-- Area Fill -->
        <path d="M0 300 L40 280 L80 260 L120 220 L160 180 L200 140 L240 110 L280 90 L320 90 L360 120 L400 180 L440 240 L480 260 L520 290 L560 300 L560 300 L0 300 Z" fill="url(#alertGrad)" />
        
        <!-- Line -->
        <path d="M0 300 L40 280 L80 260 L120 220 L160 180 L200 140 L240 110 L280 90 L320 90 L360 120 L400 180 L440 240 L480 260 L520 290 L560 300" fill="none" stroke="url(#tempLineGrad)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
        
        <!-- Data Points (Selected) -->
        <circle cx="280" cy="90" r="4" fill="#ef4444" stroke="#fff" stroke-width="2" />
        <text x="280" y="75" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">Peak: +2.1°</text>

        <!-- X Labels -->
        <text x="0" y="330" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">J</text>
        <text x="40" y="330" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">F</text>
        <text x="80" y="330" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">M</text>
        <text x="120" y="330" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">A</text>
        <text x="160" y="330" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">M</text>
        <text x="200" y="330" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">J</text>
        <text x="240" y="330" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">J</text>
        <text x="280" y="330" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="bold">A</text>
        <text x="320" y="330" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">S</text>
        <text x="360" y="330" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">O</text>
        <text x="400" y="330" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">N</text>
        <text x="440" y="330" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">D</text>
      </g>
    </g>

    <!-- High-Risk Districts -->
    <g transform="translate(0, 510)">
      <text x="0" y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="600">High-Risk Districts</text>
      
      <!-- District 1 -->
      <g transform="translate(0, 20)">
        <rect width="340" height="36" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="20" cy="18" r="4" fill="#ef4444" />
        <text x="35" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Old Port Warehouse</text>
        <text x="320" y="23" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">Critical</text>
      </g>
      
      <!-- District 2 -->
      <g transform="translate(0, 62)">
        <rect width="340" height="36" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="20" cy="18" r="4" fill="#f97316" />
        <text x="35" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="500">North Bay Residential</text>
        <text x="320" y="23" fill="#fdba74" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">High</text>
      </g>

      <!-- District 3 -->
      <g transform="translate(0, 104)">
        <rect width="340" height="36" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="20" cy="18" r="4" fill="#eab308" />
        <text x="35" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Sunset Marina</text>
        <text x="320" y="23" fill="#fde047" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">Moderate</text>
      </g>
    </g>

  </g>

  <!-- ================= RIGHT COLUMN: DATA VISUALIZATION ================= -->
  <g transform="translate(680, 160)">
    
    <!-- Headline Indicators -->
    <g transform="translate(0, 0)">
      <!-- Card 1: Temp -->
      <g transform="translate(0, 0)">
        <rect width="160" height="90" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="24" cy="20" r="12" fill="#ef4444" opacity="0.2" />
        <path d="M24 14 L24 20 L29 20" stroke="#ef4444" stroke-width="2" fill="none" />
        <text x="44" y="24" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AVG TEMP RISE</text>
        <text x="24" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="32" font-weight="800">+1.4<tspan font-size="18" fill="#ef4444">°C</tspan></text>
        <text x="24" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">vs. 2020 Baseline</text>
      </g>

      <!-- Card 2: Rain -->
      <g transform="translate(180, 0)">
        <rect width="160" height="90" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="24" cy="20" r="12" fill="#3b82f6" opacity="0.2" />
        <path d="M24 14 L24 26 M20 20 L28 20" stroke="#3b82f6" stroke-width="2" fill="none" />
        <text x="44" y="24" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ANNUAL RAINFALL</text>
        <text x="24" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="32" font-weight="800">+12<tspan font-size="18" fill="#3b82f6">%</tspan></text>
        <text x="24" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Higher intensity</text>
      </g>

      <!-- Card 3: Sea Level -->
      <g transform="translate(360, 0)">
        <rect width="160" height="90" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="24" cy="20" r="12" fill="#06b6d4" opacity="0.2" />
        <path d="M18 20 Q 24 12 30 20" stroke="#06b6d4" stroke-width="2" fill="none" />
        <text x="44" y="24" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SEA LEVEL RISE</text>
        <text x="24" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="32" font-weight="800">+8<tspan font-size="18" fill="#06b6d4">cm</tspan></text>
        <text x="24" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Accelerating trend</text>
      </g>
    </g>

    <!-- Chart 2: Rainfall / Flood Risk -->
    <g transform="translate(0, 120)">
      <text x="0" y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Precipitation Intensity</text>
      <text x="0" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Shift towards concentrated flood events</text>
      
      <g transform="translate(20, 50)">
        <!-- Bars -->
        <!-- Jan -->
        <rect x="0" y="120" width="24" height="80" fill="url(#rainGrad)" />
        <text x="12" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">J</text>
        <!-- Feb -->
        <rect x="32" y="140" width="24" height="60" fill="url(#rainGrad)" />
        <text x="44" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">F</text>
        <!-- Mar -->
        <rect x="64" y="160" width="24" height="40" fill="url(#rainGrad)" />
        <text x="76" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">M</text>
        <!-- Apr -->
        <rect x="96" y="180" width="24" height="20" fill="url(#rainGrad)" />
        <text x="108" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">A</text>
        <!-- May -->
        <rect x="128" y="190" width="24" height="10" fill="url(#rainGrad)" />
        <text x="140" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">M</text>
        <!-- Jun -->
        <rect x="160" y="195" width="24" height="5" fill="url(#rainGrad)" />
        <text x="172" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">J</text>
        <!-- Jul -->
        <rect x="192" y="198" width="24" height="2" fill="url(#rainGrad)" />
        <text x="204" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">J</text>
        <!-- Aug (High Risk) -->
        <rect x="224" y="80" width="24" height="120" fill="#ef4444" opacity="0.8" />
        <text x="236" y="215" fill="#f87171" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" font-weight="bold">A</text>
        <!-- Sep -->
        <rect x="256" y="150" width="24" height="50" fill="url(#rainGrad)" />
        <text x="268" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">S</text>
        <!-- Oct -->
        <rect x="288" y="110" width="24" height="90" fill="url(#rainGrad)" />
        <text x="300" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">O</text>
        <!-- Nov -->
        <rect x="320" y="100" width="24" height="100" fill="url(#rainGrad)" />
        <text x="332" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">N</text>
        <!-- Dec -->
        <rect x="352" y="130" width="24" height="70" fill="url(#rainGrad)" />
        <text x="364" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">D</text>

        <!-- Axis Line -->
        <line x1="0" y1="200" x2="380" y2="200" stroke="#334155" stroke-width="1" />
        
        <!-- Callout for Aug -->
        <path d="M236 70 L236 80" stroke="#94a3b8" stroke-width="1" />
        <text x="236" y="60" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Storm Surge Event</text>
      </g>
    </g>

    <!-- Bottom Right: Recommended Actions -->
    <g transform="translate(0, 400)">
       <rect width="440" height="260" fill="#1e293b" stroke="#334155" stroke-width="1" />
       
       <g transform="translate(20, 20)">
         <text x="0" y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Recommended Actions</text>
         <line x1="0" y1="10" x2="400" y2="10" stroke="#334155" stroke-width="1" />
         
         <!-- List Item 1 -->
         <g transform="translate(0, 30)">
           <rect x="0" y="0" width="8" height="8" fill="#38bdf8" />
           <text x="16" y="8" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Upgrade drainage infrastructure</text>
         </g>
         
         <!-- List Item 2 -->
         <g transform="translate(0, 60)">
           <rect x="0" y="0" width="8" height="8" fill="#38bdf8" />
           <text x="16" y="8" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Install sea walls in Old Port</text>
         </g>

         <!-- List Item 3 -->
         <g transform="translate(0, 90)">
           <rect x="0" y="0" width="8" height="8" fill="#38bdf8" />
           <text x="16" y="8" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Enforce stricter building codes</text>
         </g>

         <!-- List Item 4 -->
         <g transform="translate(0, 120)">
           <rect x="0" y="0" width="8" height="8" fill="#38bdf8" />
           <text x="16" y="8" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Expand urban green spaces</text>
         </g>
         
         <!-- List Item 5 -->
         <g transform="translate(0, 150)">
           <rect x="0" y="0" width="8" height="8" fill="#38bdf8" />
           <text x="16" y="8" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Relocate critical infrastructure</text>
         </g>
         
         <!-- List Item 6 -->
         <g transform="translate(0, 180)">
           <rect x="0" y="0" width="8" height="8" fill="#38bdf8" />
           <text x="16" y="8" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Implement early warning system</text>
         </g>
       </g>
    </g>

  </g>

  <!-- ================= FOOTER / SOURCE ================= -->
  <g transform="translate(60, 760)">
    <text x="0" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Data Source: Port Aurora Climate Observatory, Regional Hydrological Survey 2034-2035. Visualization by Editorial Design Team.</text>
    <text x="1220" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">CONFIDENTIAL DRAFT</text>
  </g>

</svg>