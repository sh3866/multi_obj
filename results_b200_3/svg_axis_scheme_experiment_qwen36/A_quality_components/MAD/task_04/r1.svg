<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0c15"/>
      <stop offset="100%" stop-color="#1a1625"/>
    </linearGradient>
    
    <!-- Product Color Palettes -->
    <linearGradient id="air-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#80deea"/>
    </linearGradient>
    <radialGradient id="air-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80deea" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#80deea" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="studio-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
    <radialGradient id="studio-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb74d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffb74d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nocturne-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e1bee7"/>
      <stop offset="100%" stop-color="#9c27b0"/>
    </linearGradient>
    <radialGradient id="nocturne-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9c27b0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9c27b0" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow-text">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Distinct Headphone SVGs -->
    
    <!-- AIR: Thin, Lightweight -->
    <g id="headphone-air">
      <path d="M30 60 C30 10, 90 10, 90 60" fill="none" stroke-width="4" stroke-linecap="round"/>
      <rect x="24" y="50" width="12" height="26" rx="4" fill-opacity="0.9"/>
      <rect x="84" y="50" width="12" height="26" rx="4" fill-opacity="0.9"/>
      <path d="M36 55 L42 55" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
      <path d="M78 55 L84 55" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- STUDIO: Robust, Technical -->
    <g id="headphone-studio">
      <path d="M30 60 C30 10, 90 10, 90 60" fill="none" stroke-width="8" stroke-linecap="round"/>
      <path d="M30 60 C30 10, 90 10, 90 60" fill="none" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
      <rect x="20" y="50" width="16" height="30" rx="2" fill-opacity="0.9"/>
      <rect x="84" y="50" width="16" height="30" rx="2" fill-opacity="0.9"/>
      <line x1="20" y1="55" x2="36" y2="55" stroke-width="1" opacity="0.3"/>
      <line x1="20" y1="60" x2="36" y2="60" stroke-width="1" opacity="0.3"/>
      <line x1="84" y1="55" x2="100" y2="55" stroke-width="1" opacity="0.3"/>
      <line x1="84" y1="60" x2="100" y2="60" stroke-width="1" opacity="0.3"/>
    </g>

    <!-- NOCTURNE: Large, Cushioned -->
    <g id="headphone-nocturne">
      <path d="M30 60 C30 10, 90 10, 90 60" fill="none" stroke-width="6" stroke-linecap="round"/>
      <rect x="18" y="45" width="20" height="36" rx="8" fill-opacity="0.9"/>
      <rect x="82" y="45" width="20" height="36" rx="8" fill-opacity="0.9"/>
      <rect x="22" y="50" width="12" height="26" rx="4" opacity="0.3"/>
      <rect x="86" y="50" width="12" height="26" rx="4" opacity="0.3"/>
    </g>
  </defs>

  <style>
    /* Native SVG Fonts - No External Imports */
    text {
      font-family: system-ui, -apple-system, sans-serif;
    }
    
    .brand-text {
      font-weight: 700;
      letter-spacing: 2px;
    }
    
    .section-header {
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #6c757d;
      text-anchor: end;
      text-transform: uppercase;
    }

    .product-name {
      font-size: 28px;
      font-weight: 700;
      text-anchor: middle;
      fill: #ffffff;
    }

    .price {
      font-size: 24px;
      font-weight: 300;
      text-anchor: middle;
      fill: #e9ecef;
    }

    .feature-text {
      font-size: 13px;
      fill: #adb5bd;
    }

    .spec-value {
      font-size: 14px;
      text-anchor: middle;
      fill: #e9ecef;
      font-weight: 500;
    }

    .btn-text {
      font-size: 14px;
      font-weight: 600;
      text-anchor: middle;
      fill: #ffffff;
      pointer-events: none;
    }

    .recommended-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-anchor: middle;
      fill: #ffffff;
    }
  </style>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg-gradient)"/>
  
  <!-- Subtle Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
  </pattern>
  <rect width="1280" height="800" fill="url(#grid)"/>

  <!-- Header Section -->
  <g transform="translate(0, 60)">
    <text x="640" y="0" class="brand-text" font-size="24" fill="#ffffff" text-anchor="middle">AURALITH</text>
    <text x="640" y="30" font-size="16" fill="#adb5bd" text-anchor="middle" font-weight="300">Engineered Silence. Pure Sound.</text>
  </g>

  <!-- Comparison Columns Container -->
  <g transform="translate(0, 140)">
    
    <!-- Vertical Dividers (1px, 20% opacity) -->
    <line x1="432" y1="0" x2="432" y2="600" stroke="#ffffff" stroke-opacity="0.15"/>
    <line x1="748" y1="0" x2="748" y2="600" stroke="#ffffff" stroke-opacity="0.15"/>

    <!-- Horizontal Dividers (Spec Rows) -->
    <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.15">
      <line x1="150" y1="380" x2="1130" y2="380" /> <!-- Top of Data Row -->
      <line x1="150" y1="430" x2="1130" y2="430" /> <!-- Between Specs -->
      <line x1="150" y1="480" x2="1130" y2="480" /> <!-- Bottom of Data Row -->
    </g>

    <!-- Shared Specification Labels (Left Aligned) -->
    <g transform="translate(100, 0)">
      <!-- Battery Label -->
      <text x="0" y="406" class="section-header">BATTERY</text>
      <!-- Drivers Label -->
      <text x="0" y="456" class="section-header">DRIVERS</text>
    </g>

    <!-- ========================================== -->
    <!-- PRODUCT 1: AIR -->
    <!-- ========================================== -->
    <g id="product-air" transform="translate(150, 0)">
      <!-- Card Background -->
      <rect x="0" y="0" width="280" height="600" rx="16" fill="#1e1b24" fill-opacity="0.6"/>
      
      <!-- Visual Area -->
      <circle cx="140" cy="120" r="80" fill="url(#air-glow)"/>
      <g transform="translate(90, 70) scale(1.4)">
        <use href="#headphone-air" stroke="#80deea" fill="#e0f7fa"/>
      </g>

      <!-- Name & Price -->
      <text x="140" y="220" class="product-name">Air</text>
      <text x="140" y="250" class="price">$249</text>
      
      <!-- Description -->
      <text x="140" y="280" font-size="12" fill="#adb5bd" text-anchor="middle">Lightweight everyday listening.</text>

      <!-- Colors -->
      <g transform="translate(120, 310)">
        <circle cx="0" cy="0" r="6" fill="#ffffff"/>
        <circle cx="20" cy="0" r="6" fill="#80deea"/>
        <circle cx="40" cy="0" r="6" fill="#263238"/>
        <text x="60" y="4" font-size="10" fill="#6c757d">3 Colors</text>
      </g>

      <!-- Features (3 Concise) -->
      <g transform="translate(20, 350)">
        <text x="0" y="0" class="feature-text">• Ultra-light 220g chassis</text>
        <text x="0" y="20" class="feature-text">• Seamless multipoint</text>
        <text x="0" y="40" class="feature-text">• Quick charge capable</text>
      </g>

      <!-- Rigid Data Rows -->
      <g transform="translate(140, 0)">
        <!-- Battery -->
        <text x="0" y="406" class="spec-value">30 Hours</text>
        <!-- Drivers -->
        <text x="0" y="456" class="spec-value">30mm Planar</text>
      </g>

      <!-- CTA -->
      <rect x="20" y="520" width="240" height="44" rx="22" fill="#2c2f33" stroke="#495057"/>
      <text x="140" y="547" class="btn-text" fill="#e9ecef">Shop Air</text>
    </g>

    <!-- ========================================== -->
    <!-- PRODUCT 2: STUDIO (RECOMMENDED) -->
    <!-- ========================================== -->
    <g id="product-studio" transform="translate(466, -20)">
      <!-- Card Background (Larger, Elevated) -->
      <rect x="0" y="0" width="282" height="640" rx="16" fill="#25212e" fill-opacity="0.8" stroke="#ffb74d" stroke-width="2" filter="url(#shadow-lg)"/>
      
      <!-- Recommended Badge -->
      <rect x="81" y="-15" width="120" height="30" rx="15" fill="#ffb74d" filter="url(#shadow-sm)"/>
      <text x="141" y="2" class="recommended-badge">RECOMMENDED</text>

      <!-- Visual Area -->
      <circle cx="141" cy="140" r="90" fill="url(#studio-glow)"/>
      <g transform="translate(91, 85) scale(1.5)">
        <use href="#headphone-studio" stroke="#ffb74d" fill="#ffe0b2"/>
      </g>

      <!-- Name & Price -->
      <text x="141" y="250" class="product-name" fill="#ffffff">Studio</text>
      <text x="141" y="280" class="price">$399</text>
      
      <!-- Description -->
      <text x="141" y="310" font-size="12" fill="#adb5bd" text-anchor="middle">Accurate sound for creative work.</text>

      <!-- Colors -->
      <g transform="translate(121, 340)">
        <circle cx="0" cy="0" r="6" fill="#fff3e0"/>
        <circle cx="20" cy="0" r="6" fill="#ffb74d"/>
        <circle cx="40" cy="0" r="6" fill="#424242"/>
        <circle cx="60" cy="0" r="6" fill="#263238"/>
        <text x="80" y="4" font-size="10" fill="#6c757d">4 Colors</text>
      </g>

      <!-- Features (3 Concise) -->
      <g transform="translate(20, 380)">
        <text x="0" y="0" class="feature-text" font-weight="600" fill="#e9ecef">• Reference grade monitoring</text>
        <text x="0" y="20" class="feature-text">• Open-back architecture</text>
        <text x="0" y="40" class="feature-text">• Detachable cables</text>
      </g>

      <!-- Rigid Data Rows -->
      <g transform="translate(141, 0)">
        <!-- Battery -->
        <text x="0" y="426" class="spec-value" fill="#ffb74d">40 Hours</text>
        <!-- Drivers -->
        <text x="0" y="476" class="spec-value" fill="#ffb74d">40mm Dynamic</text>
      </g>

      <!-- CTA -->
      <rect x="20" y="540" width="242" height="44" rx="22" fill="#ffb74d" filter="url(#shadow-sm)"/>
      <text x="141" y="567" class="btn-text" fill="#2d1b06">Shop Studio</text>
    </g>

    <!-- ========================================== -->
    <!-- PRODUCT 3: NOCTURNE -->
    <!-- ========================================== -->
    <g id="product-nocturne" transform="translate(782, 0)">
      <!-- Card Background -->
      <rect x="0" y="0" width="280" height="600" rx="16" fill="#1e1b24" fill-opacity="0.6"/>
      
      <!-- Visual Area -->
      <circle cx="140" cy="120" r="80" fill="url(#nocturne-glow)"/>
      <g transform="translate(90, 70) scale(1.4)">
        <use href="#headphone-nocturne" stroke="#9c27b0" fill="#e1bee7"/>
      </g>

      <!-- Name & Price -->
      <text x="140" y="220" class="product-name">Nocturne</text>
      <text x="140" y="250" class="price">$549</text>
      
      <!-- Description -->
      <text x="140" y="280" font-size="12" fill="#adb5bd" text-anchor="middle">Flagship immersive listening.</text>

      <!-- Colors -->
      <g transform="translate(120, 310)">
        <circle cx="0" cy="0" r="6" fill="#4a148c"/>
        <circle cx="20" cy="0" r="6" fill="#9c27b0"/>
        <circle cx="40" cy="0" r="6" fill="#212121"/>
        <text x="60" y="4" font-size="10" fill="#6c757d">3 Colors</text>
      </g>

      <!-- Features (3 Concise) -->
      <g transform="translate(20, 350)">
        <text x="0" y="0" class="feature-text">• Hybrid ANC Pro</text>
        <text x="0" y="20" class="feature-text">• Spatial Audio Engine</text>
        <text x="0" y="40" class="feature-text">• Transparency mode</text>
      </g>

      <!-- Rigid Data Rows -->
      <g transform="translate(140, 0)">
        <!-- Battery -->
        <text x="0" y="406" class="spec-value">50 Hours</text>
        <!-- Drivers -->
        <text x="0" y="456" class="spec-value">40mm Hybrid</text>
      </g>

      <!-- CTA -->
      <rect x="20" y="520" width="240" height="44" rx="22" fill="#2c2f33" stroke="#495057"/>
      <text x="140" y="547" class="btn-text" fill="#e9ecef">Shop Nocturne</text>
    </g>

  </g>

  <!-- Footer -->
  <text x="640" y="770" font-size="12" fill="#6c757d" text-anchor="middle">© 2024 Auralith Audio Systems. All specifications subject to change.</text>

</svg>