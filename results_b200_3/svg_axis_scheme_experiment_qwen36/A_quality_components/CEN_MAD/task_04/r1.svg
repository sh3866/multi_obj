<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0c15"/>
      <stop offset="100%" stop-color="#1a1625"/>
    </linearGradient>
    
    <!-- Studio Card Internal Gradient -->
    <linearGradient id="studio-card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2736"/>
      <stop offset="100%" stop-color="#201b26"/>
    </linearGradient>

    <!-- Product Color Palettes -->
    <linearGradient id="air-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#80deea"/>
    </linearGradient>
    <radialGradient id="air-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80deea" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#80deea" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="studio-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
    <radialGradient id="studio-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb74d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffb74d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nocturne-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e1bee7"/>
      <stop offset="100%" stop-color="#9c27b0"/>
    </linearGradient>
    <radialGradient id="nocturne-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9c27b0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9c27b0" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- Distinct Headphone Geometries -->
    
    <!-- AIR: Thin, Open, Lightweight -->
    <g id="icon-air">
      <!-- Thin Headband -->
      <path d="M30 65 C30 15, 90 15, 90 65" fill="none" stroke="url(#air-grad)" stroke-width="4" stroke-linecap="round"/>
      <!-- Small, separated Earcups -->
      <rect x="22" y="55" width="14" height="24" rx="4" fill="#e0f7fa"/>
      <rect x="84" y="55" width="14" height="24" rx="4" fill="#e0f7fa"/>
      <!-- Minimal detail -->
      <line x1="36" y1="65" x2="42" y2="65" stroke="#80deea" stroke-width="2" stroke-linecap="round"/>
      <line x1="68" y1="65" x2="74" y2="65" stroke="#80deea" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- STUDIO: Solid, Angular, Precision -->
    <g id="icon-studio">
      <!-- Thick, sturdy Headband -->
      <path d="M25 65 C25 5, 95 5, 95 65" fill="none" stroke="url(#studio-grad)" stroke-width="8" stroke-linecap="square"/>
      <!-- Solid, Square-ish Earcups -->
      <rect x="15" y="50" width="20" height="34" rx="3" fill="#ffe0b2"/>
      <rect x="85" y="50" width="20" height="34" rx="3" fill="#ffe0b2"/>
      <!-- Precision detail lines -->
      <line x1="22" y1="65" x2="30" y2="65" stroke="#ffb74d" stroke-width="2" stroke-linecap="square"/>
      <line x1="70" y1="65" x2="78" y2="65" stroke="#ffb74d" stroke-width="2" stroke-linecap="square"/>
    </g>

    <!-- NOCTURNE: Large, Soft, Immersive -->
    <g id="icon-nocturne">
      <!-- Soft, thick Headband -->
      <path d="M25 65 C25 10, 95 10, 95 65" fill="none" stroke="url(#nocturne-grad)" stroke-width="6" stroke-linecap="round"/>
      <!-- Large, plush Earcups -->
      <rect x="15" y="45" width="24" height="40" rx="12" fill="#e1bee7"/>
      <rect x="81" y="45" width="24" height="40" rx="12" fill="#e1bee7"/>
      <!-- Soft detail -->
      <path d="M25 65 Q37 75 49 65" fill="none" stroke="#9c27b0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <path d="M71 65 Q83 75 95 65" fill="none" stroke="#9c27b0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    </g>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;display=swap');
    
    text {
      font-family: 'Inter', -apple-system, sans-serif;
    }
    
    .brand-text {
      font-weight: 700;
      letter-spacing: 2px;
    }
    
    .section-header {
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #6c757d;
      text-anchor: end;
      text-transform: uppercase;
    }

    .product-name {
      font-size: 28px;
      font-weight: 700;
      text-anchor: middle;
      fill: #ffffff;
    }

    .price {
      font-size: 24px;
      font-weight: 300;
      text-anchor: middle;
      fill: #e9ecef;
    }

    .feature-text {
      font-size: 14px;
      fill: #adb5bd;
    }

    .btn-text {
      font-size: 14px;
      font-weight: 600;
      text-anchor: middle;
      fill: #ffffff;
      pointer-events: none;
    }

    .recommended-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-anchor: middle;
      fill: #ffffff;
    }
  </style>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg-gradient)"/>
  
  <!-- Subtle Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
  </pattern>
  <rect width="1280" height="800" fill="url(#grid)"/>

  <!-- Header Section -->
  <g transform="translate(0, 60)">
    <text x="640" y="0" class="brand-text" font-size="24" fill="#ffffff" text-anchor="middle">AURALITH</text>
    <text x="640" y="30" font-size="16" fill="#adb5bd" text-anchor="middle" font-weight="300">Engineered Silence. Pure Sound.</text>
  </g>

  <!-- Comparison Columns Container -->
  <g transform="translate(80, 140)">
    
    <!-- Connection Lines (Spec Rows) -->
    <!-- Revised: Continuous lines spanning all cards for comparison -->
    <g stroke="#2c2f33" stroke-width="1" stroke-dasharray="4 6">
      <line x1="150" y1="320" x2="950" y2="320" /> <!-- Battery Row -->
      <line x1="150" y1="380" x2="950" y2="380" /> <!-- Drivers Row -->
    </g>

    <!-- ========================================== -->
    <!-- PRODUCT 1: AIR -->
    <!-- ========================================== -->
    <g id="product-air" transform="translate(150, 0)">
      <!-- Card Background -->
      <rect x="0" y="0" width="240" height="580" rx="16" fill="#1e1b24" stroke="#2c2f33" stroke-width="1"/>
      
      <!-- Visual Area -->
      <circle cx="120" cy="110" r="80" fill="url(#air-glow)"/>
      <!-- Using specific Air geometry -->
      <g transform="translate(70, 60) scale(1.2)">
        <use href="#icon-air"/>
      </g>

      <!-- Name & Price -->
      <text x="120" y="220" class="product-name">Air</text>
      <text x="120" y="250" class="price">$249</text>
      
      <!-- Description -->
      <text x="120" y="280" font-size="12" fill="#adb5bd" text-anchor="middle">Lightweight everyday listening.</text>

      <!-- Colors -->
      <g transform="translate(100, 310)">
        <circle cx="0" cy="0" r="6" fill="#ffffff"/>
        <circle cx="20" cy="0" r="6" fill="#80deea"/>
        <circle cx="40" cy="0" r="6" fill="#263238"/>
        <text x="60" y="4" font-size="10" fill="#6c757d">3 Colors</text>
      </g>

      <!-- Features -->
      <g transform="translate(20, 360)">
        <text x="0" y="0" class="feature-text">• Ultra-light 220g chassis</text>
        <text x="0" y="25" class="feature-text">• Seamless multipoint</text>
        <text x="0" y="50" class="feature-text">• 30h Battery Life</text>
      </g>

      <!-- CTA -->
      <rect x="20" y="480" width="200" height="44" rx="22" fill="#2c2f33" stroke="#495057"/>
      <text x="120" y="507" class="btn-text" fill="#e9ecef">Shop Air</text>
    </g>

    <!-- ========================================== -->
    <!-- PRODUCT 2: STUDIO (RECOMMENDED) -->
    <!-- ========================================== -->
    <g id="product-studio" transform="translate(520, -20)">
      <!-- Card Background (Larger, Elevated, Gradient) -->
      <rect x="0" y="0" width="280" height="620" rx="16" fill="url(#studio-card-bg)" stroke="#ffb74d" stroke-width="1.5" filter="url(#shadow-lg)"/>
      
      <!-- Recommended Badge -->
      <rect x="80" y="-15" width="120" height="30" rx="15" fill="#ffb74d" filter="url(#shadow-sm)"/>
      <text x="140" y="2" class="recommended-badge">RECOMMENDED</text>

      <!-- Visual Area -->
      <circle cx="140" cy="130" r="90" fill="url(#studio-glow)"/>
      <!-- Using specific Studio geometry -->
      <g transform="translate(80, 75) scale(1.3)">
        <use href="#icon-studio"/>
      </g>

      <!-- Name & Price -->
      <text x="140" y="230" class="product-name" fill="#ffffff">Studio</text>
      <text x="140" y="260" class="price">$399</text>
      
      <!-- Description -->
      <text x="140" y="290" font-size="12" fill="#adb5bd" text-anchor="middle">Accurate sound for creative work.</text>

      <!-- Colors -->
      <g transform="translate(120, 320)">
        <circle cx="0" cy="0" r="6" fill="#fff3e0"/>
        <circle cx="20" cy="0" r="6" fill="#ffb74d"/>
        <circle cx="40" cy="0" r="6" fill="#424242"/>
        <circle cx="60" cy="0" r="6" fill="#263238"/>
        <text x="80" y="4" font-size="10" fill="#6c757d">4 Colors</text>
      </g>

      <!-- Features -->
      <g transform="translate(20, 370)">
        <text x="0" y="0" class="feature-text" font-weight="600" fill="#e9ecef">• Flat-response 40mm drivers</text>
        <text x="0" y="25" class="feature-text">• Reference grade monitoring</text>
        <text x="0" y="50" class="feature-text">• 40h Battery Life</text>
      </g>

      <!-- CTA -->
      <rect x="20" y="500" width="240" height="44" rx="22" fill="#ffb74d" filter="url(#shadow-sm)"/>
      <text x="140" y="527" class="btn-text" fill="#2d1b06">Shop Studio</text>
    </g>

    <!-- ========================================== -->
    <!-- PRODUCT 3: NOCTURNE -->
    <!-- ========================================== -->
    <g id="product-nocturne" transform="translate(890, 0)">
      <!-- Card Background -->
      <rect x="0" y="0" width="240" height="580" rx="16" fill="#1e1b24" stroke="#2c2f33" stroke-width="1"/>
      
      <!-- Visual Area -->
      <circle cx="120" cy="110" r="80" fill="url(#nocturne-glow)"/>
      <!-- Using specific Nocturne geometry -->
      <g transform="translate(70, 60) scale(1.2)">
        <use href="#icon-nocturne"/>
      </g>

      <!-- Name & Price -->
      <text x="120" y="220" class="product-name">Nocturne</text>
      <text x="120" y="250" class="price">$549</text>
      
      <!-- Description -->
      <text x="120" y="280" font-size="12" fill="#adb5bd" text-anchor="middle">Flagship immersive listening.</text>

      <!-- Colors -->
      <g transform="translate(100, 310)">
        <circle cx="0" cy="0" r="6" fill="#4a148c"/>
        <circle cx="20" cy="0" r="6" fill="#9c27b0"/>
        <circle cx="40" cy="0" r="6" fill="#212121"/>
        <text x="60" y="4" font-size="10" fill="#6c757d">3 Colors</text>
      </g>

      <!-- Features -->
      <g transform="translate(20, 360)">
        <text x="0" y="0" class="feature-text">• Hybrid ANC Pro</text>
        <text x="0" y="25" class="feature-text">• Spatial Audio Engine</text>
        <text x="0" y="50" class="feature-text">• 50h Battery Life</text>
      </g>

      <!-- CTA -->
      <rect x="20" y="480" width="200" height="44" rx="22" fill="#2c2f33" stroke="#495057"/>
      <text x="120" y="507" class="btn-text" fill="#e9ecef">Shop Nocturne</text>
    </g>

  </g>

  <!-- Shared Specification Labels (Left Aligned) -->
  <!-- Shifted from x=40 to x=100 to ensure text fits within 16px safe area -->
  <g transform="translate(100, 0)">
    <!-- Battery Line -->
    <text x="0" y="460" class="section-header" text-anchor="end">BATTERY</text>
    <rect x="0" y="460" width="2" height="40" fill="#495057"/>

    <!-- Weight Line (Derived from features) -->
    <text x="0" y="520" class="section-header" text-anchor="end">DRIVERS</text>
    <rect x="0" y="520" width="2" height="40" fill="#495057"/>
  </g>

  <!-- Footer -->
  <text x="640" y="750" font-size="12" fill="#6c757d" text-anchor="middle">© 2024 Auralith Audio Systems. All specifications subject to change.</text>

</svg>