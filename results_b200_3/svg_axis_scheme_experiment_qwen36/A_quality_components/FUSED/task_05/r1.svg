<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5F0" />
      <stop offset="100%" stop-color="#EBE6DE" />
    </linearGradient>
    
    <linearGradient id="feature-img-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E4DB" />
      <stop offset="100%" stop-color="#D1CBC0" />
    </linearGradient>

    <!-- Patterns -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A3B4C" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg-grad)" />
  <rect width="1280" height="800" fill="url(#dot-grid)" />

  <!-- Abstract Visual Elements (Theme: Distance/Perspective) -->
  <g opacity="0.4">
    <!-- Large Perspective Arc -->
    <path d="M1280 -50 Q 900 100 1280 500" fill="none" stroke="#2A3B4C" stroke-width="1" stroke-dasharray="4 6" opacity="0.6" />
    <path d="M1280 -50 Q 1050 100 1280 500" fill="none" stroke="#2A3B4C" stroke-width="0.5" opacity="0.3" />
    <!-- Diagonal Horizon Line -->
    <line x1="0" y1="750" x2="1280" y2="450" stroke="#2A3B4C" stroke-width="0.5" opacity="0.2" />
    <line x1="0" y1="750" x2="1280" y2="450" stroke="#2A3B4C" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.1" transform="translate(0, -10)" />
  </g>

  <!-- Header Section -->
  <g transform="translate(40, 40)">
    <!-- Logo / Magazine Name -->
    <text x="0" y="0" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#2A3B4C" letter-spacing="2">MARGIN <tspan fill="#B53F3F">&amp;</tspan> FIELD</text>
    
    <!-- Issue Info -->
    <text x="1200" y="0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2A3B4C" text-anchor="end" letter-spacing="1">NO. 12</text>
    <text x="1200" y="20" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">THE SHAPE OF DISTANCE</text>
    
    <!-- Navigation -->
    <g transform="translate(0, 40)">
      <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666" letter-spacing="1">ESSAYS</text>
      <text x="60" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666" letter-spacing="1">FICTION</text>
      <text x="120" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666" letter-spacing="1">VISUAL ART</text>
      <text x="190" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666" letter-spacing="1">ARCHIVE</text>
    </g>

    <!-- Divider Line -->
    <rect x="0" y="70" width="1200" height="1" fill="#2A3B4C" opacity="0.1" />
  </g>

  <!-- Main Content Grid -->
  <g transform="translate(40, 140)">
    
    <!-- LEFT COLUMN: Feature Story -->
    <g id="feature-story">
      <!-- Abstract Image / Visual Container -->
      <rect x="0" y="0" width="540" height="380" fill="url(#feature-img-grad)" rx="4" />
      <!-- Abstract Graphic: Perspective/Distance -->
      <g transform="translate(270, 190)">
        <circle cx="0" cy="0" r="120" fill="none" stroke="#2A3B4C" stroke-width="2" opacity="0.3" />
        <circle cx="0" cy="0" r="80" fill="none" stroke="#B53F3F" stroke-width="1" opacity="0.5" />
        <line x1="-120" y1="0" x2="120" y2="0" stroke="#2A3B4C" stroke-width="1" opacity="0.2" />
        <line x1="0" y1="-120" x2="0" y2="120" stroke="#2A3B4C" stroke-width="1" opacity="0.2" />
        <text x="0" y="4" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2A3B4C" text-anchor="middle" letter-spacing="4">HORIZON</text>
      </g>

      <!-- Feature Content -->
      <g transform="translate(0, 420)">
        <!-- Category -->
        <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#B53F3F" letter-spacing="2">FEATURE ESSAY</text>
        
        <!-- Title -->
        <text x="0" y="30" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#2A3B4C">
          <tspan x="0" dy="0">The Geometry of</tspan>
          <tspan x="0" dy="45">Separation</tspan>
        </text>

        <!-- Author -->
        <text x="0" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2A3B4C" letter-spacing="1">BY ELENA VORTEX</text>
        
        <!-- Excerpt -->
        <text x="0" y="140" font-family="Georgia, serif" font-size="16" fill="#444">
          <tspan x="0" dy="0">Distance is not merely a measurement of space, but a</tspan>
          <tspan x="0" dy="24">topology of emotion. In the quiet spaces between</tspan>
          <tspan x="0" dy="24">letters, we find the true architecture of longing...</tspan>
        </text>

        <!-- Read More Link (Visual) -->
        <g transform="translate(0, 220)">
          <line x1="0" y1="0" x2="40" y2="0" stroke="#B53F3F" stroke-width="2" />
          <text x="50" y="4" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#B53F3F" letter-spacing="1">READ THE FULL STORY →</text>
        </g>
      </g>
    </g>

    <!-- RIGHT COLUMN: Secondary Articles (2x2 Grid) -->
    <g transform="translate(600, 0)">
      
      <!-- Article 1: Fiction -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#B53F3F" letter-spacing="2">FICTION</text>
        <text x="0" y="25" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#2A3B4C">Echoes in the Signal</text>
        <text x="0" y="45" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">By Marcus Thorne</text>
        <text x="0" y="70" font-family="Georgia, serif" font-size="14" fill="#555">
          <tspan x="0" dy="0">A short story about a radio operator on a</tspan>
          <tspan x="0" dy="20">moon base waiting for a signal that never comes.</tspan>
        </text>
      </g>

      <!-- Separator -->
      <rect x="0" y="140" width="580" height="1" fill="#2A3B4C" opacity="0.1" />

      <!-- Article 2: Culture -->
      <g transform="translate(0, 170)">
        <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#B53F3F" letter-spacing="2">CULTURE</text>
        <text x="0" y="25" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#2A3B4C">Architectures of Silence</text>
        <text x="0" y="45" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">By Sarah Jenkins</text>
        <text x="0" y="70" font-family="Georgia, serif" font-size="14" fill="#555">
          <tspan x="0" dy="0">Exploring the brutalist structures of Eastern Europe</tspan>
          <tspan x="0" dy="20">and the psychological weight of empty spaces.</tspan>
        </text>
      </g>

      <!-- Separator -->
      <rect x="0" y="330" width="580" height="1" fill="#2A3B4C" opacity="0.1" />

      <!-- Article 3: Visual Art -->
      <g transform="translate(0, 360)">
        <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#B53F3F" letter-spacing="2">VISUAL ART</text>
        <text x="0" y="25" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#2A3B4C">Chromatic Decay</text>
        <text x="0" y="45" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">By Julian Vane</text>
        <text x="0" y="70" font-family="Georgia, serif" font-size="14" fill="#555">
          <tspan x="0" dy="0">Photography series capturing the fading</tspan>
          <tspan x="0" dy="20">neon lights of 1990s Berlin.</tspan>
        </text>
      </g>

      <!-- Separator -->
      <rect x="0" y="520" width="580" height="1" fill="#2A3B4C" opacity="0.1" />

      <!-- Article 4: Poetry -->
      <g transform="translate(0, 550)">
        <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#B53F3F" letter-spacing="2">POETRY</text>
        <text x="0" y="25" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#2A3B4C">The Long Way Home</text>
        <text x="0" y="45" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">By A. K. Patel</text>
        <text x="0" y="70" font-family="Georgia, serif" font-size="14" fill="#555">
          <tspan x="0" dy="0">A collection of sonnets mapping the journey</tspan>
          <tspan x="0" dy="20">from childhood to exile.</tspan>
        </text>
      </g>

    </g>
  </g>

  <!-- Footer / Action Bar -->
  <g transform="translate(40, 750)">
    <!-- Compact Issue Summary / Contents -->
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#888" letter-spacing="1">ISSUE 12 • 24 PAGES • OCTOBER 2023 • EDITED BY J. DOE</text>

    <!-- Primary Action: Read Issue (Moved to top right of content area visually, but functionally here for footer balance or per brief "top right header" - Let's place it in the footer as a strong anchor) -->
    <!-- Actually, brief says "Move 'Read the Issue' button to the top right of the header". Let's adjust that. -->
  </g>

  <!-- Revised Header Action Placement -->
  <g transform="translate(1100, 25)">
    <rect x="0" y="0" width="120" height="36" rx="18" fill="#2A3B4C" />
    <text x="60" y="22" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle" letter-spacing="1">READ ISSUE</text>
  </g>

  <!-- Revised Footer Action Placement -->
  <g transform="translate(1100, 750)">
     <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2A3B4C" text-anchor="end" letter-spacing="1">SUBSCRIBE TO THE MAGAZINE</text>
    <text x="0" y="18" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#666" text-anchor="end">Monthly dispatches from the periphery.</text>
  </g>

</svg>