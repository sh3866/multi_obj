<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <linearGradient id="grad-art-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blur-large" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="100" />
    </filter>

    <filter id="blur-medium" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <filter id="blur-small" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <filter id="noise" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="screen" />
    </filter>

    <filter id="glass-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1280" height="800" fill="url(#grad-bg)" />

  <!-- Immersive Background Art Layer -->
  <g id="background-art">
    <!-- Deep Purple Echo -->
    <circle cx="15%" cy="30%" r="450" fill="#2a1b3d" filter="url(#blur-large)" opacity="0.4" />
    <!-- Deep Blue Echo -->
    <circle cx="85%" cy="70%" r="500" fill="#162b3a" filter="url(#blur-large)" opacity="0.4" />
    <!-- Central Connection -->
    <circle cx="90%" cy="40%" r="300" fill="#1f1f1f" filter="url(#blur-medium)" opacity="0.8" />
  </g>

  <!-- Full Screen Noise Texture -->
  <rect width="1280" height="800" filter="url(#noise)" pointer-events="none" />

  <!-- Structural Margins (Faint) -->
  <line x1="80" y1="0" x2="80" y2="800" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <line x1="1200" y1="0" x2="1200" y2="800" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- HEADER -->
  <g id="header" transform="translate(80, 60)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#666666">
      THE VOID INSTITUTE OF CONTEMPORARY ART
    </text>
    <text x="1120" y="0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="1" fill="#666666" text-anchor="end">
      2024 SEASON
    </text>
  </g>

  <!-- VISUAL ARTWORK (Floating Card) -->
  <g id="artwork-card" transform="translate(680, 140)">
    <!-- Card Background -->
    <rect x="0" y="0" width="480" height="600" fill="#030303" stroke="#222222" stroke-width="1" opacity="0.95" />
    
    <!-- Inner Art Composition -->
    <g clip-path="url(#art-clip)">
      <defs>
        <clipPath id="art-clip">
          <rect x="0" y="0" width="480" height="600" />
        </clipPath>
      </defs>

      <!-- Abstract Lines -->
      <path d="M-50,150 Q240,250 550,100" fill="none" stroke="#333333" stroke-width="1" />
      <path d="M-50,170 Q240,270 550,120" fill="none" stroke="#1a1a1a" stroke-width="1" />
      
      <!-- Central Fading Circle -->
      <circle cx="240" cy="300" r="160" fill="#111111" filter="url(#blur-small)" />
      <circle cx="240" cy="300" r="160" fill="none" stroke="#d4af37" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.6" />
      
      <!-- Corrupted Data Text -->
      <text x="240" y="300" font-family="monospace" font-size="10" fill="#555555" text-anchor="middle" transform="rotate(-15 240 300)" letter-spacing="1">
        MEMORY DATA CORRUPTED
      </text>

      <!-- Glitch Elements -->
      <rect x="80" y="280" width="320" height="1" fill="#ffffff" opacity="0.1" />
      <rect x="150" y="320" width="180" height="2" fill="#ffffff" opacity="0.05" />
      <circle cx="350" cy="200" r="2" fill="#d4af37" />
      <circle cx="130" cy="400" r="2" fill="#d4af37" />

      <!-- Diagonal Cut -->
      <path d="M0,0 L480,600" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
    </g>
  </g>

  <!-- MAIN TYPOGRAPHY (Overlapping & Large) -->
  <g id="main-title" transform="translate(80, 160)">
    <!-- Artist Name: Fading effect -->
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="4" fill="#d4af37" opacity="0.8">
      ELARA VANCE
    </text>

    <!-- Title Block -->
    <g transform="translate(0, 30)">
      <!-- ECHOES -->
      <text x="0" y="0" font-family="'Times New Roman', Times, serif" font-size="80" font-weight="400" fill="#ffffff" opacity="0.95">
        ECHOES
      </text>
      <!-- of the -->
      <text x="0" y="65" font-family="'Times New Roman', Times, serif" font-size="80" font-weight="400" fill="#cccccc" font-style="italic" opacity="0.8">
        of the
      </text>
      <!-- UNSEEN -->
      <text x="0" y="130" font-family="'Times New Roman', Times, serif" font-size="80" font-weight="400" fill="#ffffff" opacity="1">
        UNSEEN
      </text>
    </g>
  </g>

  <!-- CURATORIAL STATEMENT -->
  <g id="curatorial" transform="translate(80, 400)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#d4af37" stroke-width="2" />
    <text x="0" y="30" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#999999">
      <tspan x="0" dy="0">An immersive exploration of memory’s fragility.</tspan>
      <tspan x="0" dy="22">Vance fragments perception, inviting viewers to navigate</tspan>
      <tspan x="0" dy="22">the liminal spaces between what is remembered</tspan>
      <tspan x="0" dy="22">and what has been lost to time.</tspan>
    </text>
  </g>

  <!-- LOGISTICS BLOCK (High Contrast) -->
  <g id="logistics" transform="translate(80, 570)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0">
      OCT 15 — DEC 30, 2024
    </text>
    <text x="0" y="24" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#888888" letter-spacing="1">
      THE GRAND HALL, 4TH FLOOR
    </text>
  </g>

  <!-- BOTTOM ACTION AREA -->
  <g id="action-area" transform="translate(680, 760)">
    <!-- Reserve Button -->
    <g transform="translate(0, -60)">
      <rect x="0" y="0" width="260" height="50" fill="#ffffff" />
      <text x="130" y="31" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="1.5">
        RESERVE TICKETS
      </text>
      
      <!-- Accent Line -->
      <rect x="0" y="42" width="260" height="2" fill="#d4af37" />
      
      <!-- Arrow -->
      <path d="M280,15 L300,25 L280,35" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <!-- Secondary Info -->
    <text x="320" y="-15" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" letter-spacing="1">
      OPEN DAILY 11AM — 7PM
    </text>
  </g>

  <!-- FOOTER -->
  <g id="footer" transform="translate(80, 760)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444444">
      THE VOID INSTITUTE • 1000 ART DISTRICT BLVD • NEW YORK, NY 10013
    </text>
  </g>

  <!-- Floating Art Elements -->
  <circle cx="650" cy="400" r="1.5" fill="#ffffff" opacity="0.3" />
  <rect x="660" y="399" width="15" height="1" fill="#ffffff" opacity="0.2" />

</svg>