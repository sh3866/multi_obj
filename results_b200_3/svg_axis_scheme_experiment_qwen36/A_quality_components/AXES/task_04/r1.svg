<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0c15"/>
      <stop offset="100%" stop-color="#1a1625"/>
    </linearGradient>
    
    <!-- Product Color Palettes -->
    <linearGradient id="air-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#80deea"/>
    </linearGradient>
    <radialGradient id="air-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80deea" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#80deea" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="studio-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
    <radialGradient id="studio-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb74d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffb74d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nocturne-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e1bee7"/>
      <stop offset="100%" stop-color="#9c27b0"/>
    </linearGradient>
    <radialGradient id="nocturne-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9c27b0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9c27b0" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Patterns -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
    
    <!-- Studio Mesh Pattern -->
    <pattern id="mesh-pattern" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#d97706" opacity="0.3"/>
    </pattern>

    <!-- Product 1: Air (Lightweight, Rounded) -->
    <g id="icon-air">
      <g transform="translate(0, 10)">
        <!-- Thin Headband -->
        <path d="M35 45 C35 5, 85 5, 85 45" fill="none" stroke="url(#air-grad)" stroke-width="4" stroke-linecap="round"/>
        <!-- Floating Rounded Earcups -->
        <rect x="25" y="40" width="18" height="28" rx="8" fill="url(#air-grad)"/>
        <rect x="77" y="40" width="18" height="28" rx="8" fill="url(#air-grad)"/>
        <!-- Cushion detail -->
        <line x1="43" y1="50" x2="55" y2="50" stroke="#80deea" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        <line x1="65" y1="50" x2="77" y2="50" stroke="#80deea" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      </g>
    </g>

    <!-- Product 2: Studio (Technical, Angular, Mesh) -->
    <g id="icon-studio">
      <g transform="translate(0, 5)">
        <!-- Sturdy Headband -->
        <path d="M30 50 C30 10, 90 10, 90 50" fill="none" stroke="url(#studio-grad)" stroke-width="6" stroke-linecap="round"/>
        <!-- Angular Earcups -->
        <rect x="20" y="45" width="22" height="36" rx="4" fill="url(#studio-grad)"/>
        <rect x="78" y="45" width="22" height="36" rx="4" fill="url(#studio-grad)"/>
        <!-- Driver Mesh Detail -->
        <rect x="24" y="50" width="14" height="26" rx="2" fill="url(#mesh-pattern)"/>
        <rect x="82" y="50" width="14" height="26" rx="2" fill="url(#mesh-pattern)"/>
        <!-- Technical Accents -->
        <line x1="22" y1="45" x2="22" y2="81" stroke="#d97706" stroke-width="2" opacity="0.5"/>
        <line x1="80" y1="45" x2="80" y2="81" stroke="#d97706" stroke-width="2" opacity="0.5"/>
      </g>
    </g>

    <!-- Product 3: Nocturne (Immersive, Bold) -->
    <g id="icon-nocturne">
      <g transform="translate(0, 10)">
        <!-- Deep Band -->
        <path d="M30 50 C30 15, 90 15, 90 50" fill="none" stroke="url(#nocturne-grad)" stroke-width="7" stroke-linecap="round"/>
        <!-- Large Earcups -->
        <rect x="18" y="45" width="24" height="34" rx="6" fill="url(#nocturne-grad)"/>
        <rect x="78" y="45" width="24" height="34" rx="6" fill="url(#nocturne-grad)"/>
        <!-- Active Noise Cancelling Mic Dot -->
        <circle cx="30" cy="45" r="2" fill="#4a148c"/>
        <circle cx="90" cy="45" r="2" fill="#4a148c"/>
      </g>
    </g>
  </defs>

  <style>
    text {
      font-family: system-ui, -apple-system, sans-serif;
    }
    
    .brand-text {
      font-weight: 700;
      letter-spacing: 3px;
    }
    
    .section-header {
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #4b5563;
      text-anchor: middle;
      text-transform: uppercase;
    }

    .product-name {
      font-size: 32px;
      font-weight: 700;
      text-anchor: middle;
      fill: #ffffff;
    }

    .price {
      font-size: 24px;
      font-weight: 400;
      text-anchor: middle;
      fill: #e9ecef;
    }

    .feature-text {
      font-size: 14px;
      fill: #9ca3af;
    }

    .feature-highlight {
      font-size: 14px;
      font-weight: 500;
      fill: #e5e7eb;
    }

    .spec-label {
      font-size: 11px;
      font-weight: 700;
      fill: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .spec-value {
      font-size: 14px;
      font-weight: 600;
      fill: #ffffff;
    }

    .btn-text {
      font-size: 14px;
      font-weight: 600;
      text-anchor: middle;
      fill: #ffffff;
      pointer-events: none;
      letter-spacing: 0.5px;
    }

    .recommended-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-anchor: middle;
      fill: #ffffff;
    }
  </style>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg-gradient)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>

  <!-- Header Section -->
  <g transform="translate(0, 70)">
    <text x="640" y="0" class="brand-text" font-size="26" fill="#ffffff" text-anchor="middle">AURALITH</text>
    <text x="640" y="30" font-size="16" fill="#9ca3af" text-anchor="middle" font-weight="300">Engineered Silence. Pure Sound.</text>
  </g>

  <!-- Comparison Columns Container -->
  <!-- Started at y=150 to allow room for Studio elevation -->
  <g transform="translate(80, 150)">
    
    <!-- Internal Grid Lines (Connecting Cards) -->
    <!-- These lines run behind the cards to unify the table visually -->
    <g stroke="#ffffff" stroke-opacity="0.05">
      <!-- Battery Row -->
      <line x1="0" y1="390" x2="1120" y2="390" />
      <!-- Drivers Row -->
      <line x1="0" y1="430" x2="1120" y2="430" />
    </g>

    <!-- ========================================== -->
    <!-- PRODUCT 1: AIR -->
    <!-- ========================================== -->
    <g id="product-air" transform="translate(150, 0)">
      <!-- Card Background -->
      <rect x="0" y="0" width="260" height="600" rx="16" fill="#18151f" stroke="#2d2a35" stroke-width="1"/>
      
      <!-- Visual Area -->
      <circle cx="130" cy="100" r="80" fill="url(#air-glow)"/>
      <g transform="translate(85, 50)">
        <use href="#icon-air"/>
      </g>

      <!-- Name & Price -->
      <text x="130" y="210" class="product-name">Air</text>
      <text x="130" y="240" class="price">$249</text>
      
      <!-- Description -->
      <text x="130" y="265" font-size="13" fill="#9ca3af" text-anchor="middle">Lightweight everyday listening.</text>

      <!-- Colors (Aligned vertically across all cards) -->
      <g transform="translate(130, 300)">
        <circle cx="-40" cy="0" r="5" fill="#ffffff"/>
        <circle cx="-20" cy="0" r="5" fill="#80deea"/>
        <circle cx="0" cy="0" r="5" fill="#263238"/>
        <text x="20" y="4" font-size="11" fill="#6b7280">3 Colors</text>
      </g>

      <!-- Feature List -->
      <g transform="translate(25, 340)">
        <text x="0" y="0" class="feature-text">• Ultra-light 220g chassis</text>
        <text x="0" y="25" class="feature-text">• Seamless multipoint</text>
      </g>

      <!-- SPEC ROWS (Strict Grid Alignment) -->
      <!-- Battery Row (y=390) -->
      <g transform="translate(25, 390)">
        <text x="0" y="0" class="spec-label">Battery</text>
        <text x="120" y="0" class="spec-value">30h</text>
      </g>
      
      <!-- Drivers Row (y=430) -->
      <g transform="translate(25, 430)">
        <text x="0" y="0" class="spec-label">Drivers</text>
        <text x="120" y="0" class="spec-value">30mm</text>
      </g>

      <!-- CTA -->
      <rect x="25" y="520" width="210" height="48" rx="24" fill="#2d2a35" stroke="#4b5563"/>
      <text x="130" y="548" class="btn-text" fill="#e5e7eb">Shop Air</text>
    </g>

    <!-- ========================================== -->
    <!-- PRODUCT 2: STUDIO (RECOMMENDED) -->
    <!-- ========================================== -->
    <g id="product-studio" transform="translate(520, -20)">
      <!-- Card Background (Larger, Elevated) -->
      <rect x="0" y="0" width="280" height="640" rx="16" fill="#24202b" stroke="#ffb74d" stroke-width="2" filter="url(#shadow-lg)"/>
      
      <!-- Recommended Badge -->
      <rect x="80" y="-15" width="120" height="30" rx="15" fill="#ffb74d" filter="url(#shadow-sm)"/>
      <text x="140" y="2" class="recommended-badge">RECOMMENDED</text>

      <!-- Visual Area (Focal Glow) -->
      <circle cx="140" cy="130" r="100" fill="url(#studio-glow)"/>
      <g transform="translate(85, 75)">
        <use href="#icon-studio"/>
      </g>

      <!-- Name & Price -->
      <text x="140" y="230" class="product-name">Studio</text>
      <text x="140" y="260" class="price">$399</text>
      
      <!-- Description -->
      <text x="140" y="285" font-size="13" fill="#9ca3af" text-anchor="middle">Accurate sound for creative work.</text>

      <!-- Colors (Aligned vertically) -->
      <g transform="translate(140, 320)">
        <circle cx="-40" cy="0" r="5" fill="#fff3e0"/>
        <circle cx="-20" cy="0" r="5" fill="#ffb74d"/>
        <circle cx="0" cy="0" r="5" fill="#424242"/>
        <circle cx="20" cy="0" r="5" fill="#263238"/>
        <text x="40" y="4" font-size="11" fill="#6b7280">4 Colors</text>
      </g>

      <!-- Feature List -->
      <g transform="translate(25, 360)">
        <text x="0" y="0" class="feature-highlight">• Flat-response 40mm drivers</text>
        <text x="0" y="25" class="feature-text">• Reference grade monitoring</text>
      </g>

      <!-- SPEC ROWS (Strict Grid Alignment) -->
      <!-- Battery Row (y=390) -->
      <g transform="translate(25, 390)">
        <text x="0" y="0" class="spec-label">Battery</text>
        <text x="140" y="0" class="spec-value">40h</text>
      </g>
      
      <!-- Drivers Row (y=430) -->
      <g transform="translate(25, 430)">
        <text x="0" y="0" class="spec-label">Drivers</text>
        <text x="140" y="0" class="spec-value">40mm</text>
      </g>

      <!-- CTA -->
      <rect x="25" y="540" width="230" height="48" rx="24" fill="#ffb74d" filter="url(#shadow-sm)"/>
      <text x="140" y="568" class="btn-text" fill="#2d1b06">Shop Studio</text>
    </g>

    <!-- ========================================== -->
    <!-- PRODUCT 3: NOCTURNE -->
    <!-- ========================================== -->
    <g id="product-nocturne" transform="translate(890, 0)">
      <!-- Card Background -->
      <rect x="0" y="0" width="260" height="600" rx="16" fill="#18151f" stroke="#2d2a35" stroke-width="1"/>
      
      <!-- Visual Area -->
      <circle cx="130" cy="100" r="80" fill="url(#nocturne-glow)"/>
      <g transform="translate(85, 50)">
        <use href="#icon-nocturne"/>
      </g>

      <!-- Name & Price -->
      <text x="130" y="210" class="product-name">Nocturne</text>
      <text x="130" y="240" class="price">$549</text>
      
      <!-- Description -->
      <text x="130" y="265" font-size="13" fill="#9ca3af" text-anchor="middle">Flagship immersive listening.</text>

      <!-- Colors (Aligned vertically) -->
      <g transform="translate(130, 300)">
        <circle cx="-40" cy="0" r="5" fill="#4a148c"/>
        <circle cx="-20" cy="0" r="5" fill="#9c27b0"/>
        <circle cx="0" cy="0" r="5" fill="#212121"/>
        <text x="20" y="4" font-size="11" fill="#6b7280">3 Colors</text>
      </g>

      <!-- Feature List -->
      <g transform="translate(25, 340)">
        <text x="0" y="0" class="feature-text">• Hybrid ANC Pro</text>
        <text x="0" y="25" class="feature-text">• Spatial Audio Engine</text>
      </g>

      <!-- SPEC ROWS (Strict Grid Alignment) -->
      <!-- Battery Row (y=390) -->
      <g transform="translate(25, 390)">
        <text x="0" y="0" class="spec-label">Battery</text>
        <text x="120" y="0" class="spec-value">50h</text>
      </g>
      
      <!-- Drivers Row (y=430) -->
      <g transform="translate(25, 430)">
        <text x="0" y="0" class="spec-label">Drivers</text>
        <text x="120" y="0" class="spec-value">50mm</text>
      </g>

      <!-- CTA -->
      <rect x="25" y="520" width="210" height="48" rx="24" fill="#2d2a35" stroke="#4b5563"/>
      <text x="130" y="548" class="btn-text" fill="#e5e7eb">Shop Nocturne</text>
    </g>

  </g>

  <!-- Footer -->
  <text x="640" y="760" font-size="12" fill="#6b7280" text-anchor="middle">© 2024 Auralith Audio Systems. All specifications subject to change.</text>

</svg>