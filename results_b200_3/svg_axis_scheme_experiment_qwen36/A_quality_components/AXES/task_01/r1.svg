<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="50%" stop-color="#302b63" />
      <stop offset="100%" stop-color="#24243e" />
    </linearGradient>
    
    <!-- Stage Gradients -->
    <linearGradient id="stage-sunset" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7e5f" />
      <stop offset="100%" stop-color="#feb47b" />
    </linearGradient>
    
    <linearGradient id="stage-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f260" />
      <stop offset="100%" stop-color="#0575e6" />
    </linearGradient>
    
    <linearGradient id="stage-moon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Headliner Gradient -->
    <linearGradient id="headliner-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f857a6" />
      <stop offset="100%" stop-color="#ff5858" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btn-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#EE0979" />
    </linearGradient>

    <!-- Card Tints (Genre Specific) -->
    <linearGradient id="tint-indie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a8b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ff9a8b" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="tint-synth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66e0ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#66e0ff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="tint-lofi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a0c4ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#a0c4ff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="text-shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.8"/>
    </filter>

    <!-- Patterns -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255, 255, 255, 0.04)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg-gradient)" />
  <rect width="1280" height="800" fill="url(#dot-grid)" />

  <!-- Header Section -->
  <g transform="translate(60, 60)">
    <text x="0" y="0" font-family="sans-serif" font-weight="900" font-size="64" fill="#fff" letter-spacing="2" filter="url(#shadow)">AFTERGLOW</text>
    <text x="380" y="0" font-family="sans-serif" font-weight="300" font-size="64" fill="url(#stage-sunset)" letter-spacing="2" filter="url(#shadow)">FESTIVAL</text>
    
    <line x1="0" y1="15" x2="1160" y2="15" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="0" y="45" font-family="sans-serif" font-weight="700" font-size="18" fill="#e0e0e0" letter-spacing="4">OCTOBER 21 • COASTAL AMPHITHEATER • MIAMI</text>
  </g>

  <!-- Get Tickets Button -->
  <g transform="translate(1030, 50)">
    <rect width="190" height="56" rx="28" fill="url(#btn-gradient)" filter="url(#glow)" />
    <text x="95" y="35" font-family="sans-serif" font-weight="800" font-size="18" fill="#fff" text-anchor="middle" letter-spacing="1">GET TICKETS</text>
  </g>

  <!-- Grid Infrastructure (Lines & Backgrounds) -->
  <g>
    <!-- Vertical Dividers (Subtle) -->
    <line x1="430" y1="220" x2="430" y2="760" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="840" y1="220" x2="840" y2="760" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4" />
    
    <!-- Horizontal Row Connectors (Subtle) -->
    <line x1="40" y1="265" x2="1240" y2="265" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <line x1="40" y1="405" x2="1240" y2="405" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <line x1="40" y1="545" x2="1240" y2="545" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <line x1="40" y1="685" x2="1240" y2="685" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  </g>

  <!-- Stage Headers -->
  <!-- 1: Sunset -->
  <g transform="translate(60, 180)">
    <rect width="340" height="40" rx="4" fill="url(#stage-sunset)" opacity="0.95" filter="url(#shadow)" />
    <text x="20" y="27" font-family="sans-serif" font-weight="800" font-size="20" fill="#fff">SUNSET STAGE</text>
  </g>
  <!-- 2: Neon -->
  <g transform="translate(470, 180)">
    <rect width="340" height="40" rx="4" fill="url(#stage-neon)" opacity="0.95" filter="url(#shadow)" />
    <text x="20" y="27" font-family="sans-serif" font-weight="800" font-size="20" fill="#fff">NEON STAGE</text>
  </g>
  <!-- 3: Moonlight -->
  <g transform="translate(880, 180)">
    <rect width="340" height="40" rx="4" fill="url(#stage-moon)" opacity="0.95" filter="url(#shadow)" />
    <text x="20" y="27" font-family="sans-serif" font-weight="800" font-size="20" fill="#fff">MOONLIGHT STAGE</text>
  </g>

  <!-- Time Markers -->
  <g font-family="sans-serif" font-weight="800" font-size="16" fill="#a0a0c0" letter-spacing="1">
    <text x="20" y="268">12:00 PM</text>
    <text x="20" y="408">2:00 PM</text>
    <text x="20" y="548">4:00 PM</text>
    <text x="20" y="688">7:00 PM</text>
  </g>

  <!-- ========================================== -->
  <!-- SCHEDULE ITEMS (Grid System)               -->
  <!-- ========================================== -->

  <!-- ROW 1: 12:00 PM -->
  <!-- Card 1: Sunset -->
  <g transform="translate(90, 235)">
    <rect width="280" height="60" rx="6" fill="rgba(255,255,255,0.03)" stroke="url(#stage-sunset)" stroke-width="1" />
    <rect width="280" height="60" rx="6" fill="url(#tint-indie)" />
    <text x="15" y="25" font-family="sans-serif" font-weight="700" font-size="16" fill="#fff">SOLAR FLARES</text>
    <text x="15" y="45" font-family="sans-serif" font-weight="500" font-size="12" fill="#ff9a8b">Indie Rock</text>
  </g>
  <!-- Card 2: Neon -->
  <g transform="translate(500, 235)">
    <rect width="280" height="60" rx="6" fill="rgba(255,255,255,0.03)" stroke="url(#stage-neon)" stroke-width="1" />
    <rect width="280" height="60" rx="6" fill="url(#tint-synth)" />
    <text x="15" y="25" font-family="sans-serif" font-weight="700" font-size="16" fill="#fff">CYBER PULSE</text>
    <text x="15" y="45" font-family="sans-serif" font-weight="500" font-size="12" fill="#66e0ff">Synthwave</text>
  </g>
  <!-- Card 3: Moonlight -->
  <g transform="translate(910, 235)">
    <rect width="280" height="60" rx="6" fill="rgba(255,255,255,0.03)" stroke="url(#stage-moon)" stroke-width="1" />
    <rect width="280" height="60" rx="6" fill="url(#tint-lofi)" />
    <text x="15" y="25" font-family="sans-serif" font-weight="700" font-size="16" fill="#fff">VELVET MIST</text>
    <text x="15" y="45" font-family="sans-serif" font-weight="500" font-size="12" fill="#a0c4ff">Lo-Fi Chill</text>
  </g>

  <!-- ROW 2: 2:00 PM -->
  <!-- Card 4: Sunset -->
  <g transform="translate(90, 375)">
    <rect width="280" height="60" rx="6" fill="rgba(255,255,255,0.03)" stroke="url(#stage-sunset)" stroke-width="1" />
    <rect width="280" height="60" rx="6" fill="url(#tint-indie)" />
    <text x="15" y="25" font-family="sans-serif" font-weight="700" font-size="16" fill="#fff">THE DRIFT</text>
    <text x="15" y="45" font-family="sans-serif" font-weight="500" font-size="12" fill="#ff9a8b">Alternative</text>
  </g>
  <!-- Card 5: Neon -->
  <g transform="translate(500, 375)">
    <rect width="280" height="60" rx="6" fill="rgba(255,255,255,0.03)" stroke="url(#stage-neon)" stroke-width="1" />
    <rect width="280" height="60" rx="6" fill="url(#tint-synth)" />
    <text x="15" y="25" font-family="sans-serif" font-weight="700" font-size="16" fill="#fff">BASS THEORY</text>
    <text x="15" y="45" font-family="sans-serif" font-weight="500" font-size="12" fill="#66e0ff">Techno</text>
  </g>
  <!-- Card 6: Moonlight -->
  <g transform="translate(910, 375)">
    <rect width="280" height="60" rx="6" fill="rgba(255,255,255,0.03)" stroke="url(#stage-moon)" stroke-width="1" />
    <rect width="280" height="60" rx="6" fill="url(#tint-lofi)" />
    <text x="15" y="25" font-family="sans-serif" font-weight="700" font-size="16" fill="#fff">ACOUSTIC SKIES</text>
    <text x="15" y="45" font-family="sans-serif" font-weight="500" font-size="12" fill="#a0c4ff">Folk / Unplugged</text>
  </g>

  <!-- ROW 3: 4:00 PM -->
  <!-- Card 7: Sunset -->
  <g transform="translate(90, 515)">
    <rect width="280" height="60" rx="6" fill="rgba(255,255,255,0.03)" stroke="url(#stage-sunset)" stroke-width="1" />
    <rect width="280" height="60" rx="6" fill="url(#tint-indie)" />
    <text x="15" y="25" font-family="sans-serif" font-weight="700" font-size="16" fill="#fff">RHYTHM CORP</text>
    <text x="15" y="45" font-family="sans-serif" font-weight="500" font-size="12" fill="#ff9a8b">Funk / Disco</text>
  </g>
  <!-- Card 8: Neon -->
  <g transform="translate(500, 515)">
    <rect width="280" height="60" rx="6" fill="rgba(255,255,255,0.03)" stroke="url(#stage-neon)" stroke-width="1" />
    <rect width="280" height="60" rx="6" fill="url(#tint-synth)" />
    <text x="15" y="25" font-family="sans-serif" font-weight="700" font-size="16" fill="#fff">NEON NOVA</text>
    <text x="15" y="45" font-family="sans-serif" font-weight="500" font-size="12" fill="#66e0ff">House</text>
  </g>
  <!-- Card 9: Moonlight -->
  <g transform="translate(910, 515)">
    <rect width="280" height="60" rx="6" fill="rgba(255,255,255,0.03)" stroke="url(#stage-moon)" stroke-width="1" />
    <rect width="280" height="60" rx="6" fill="url(#tint-lofi)" />
    <text x="15" y="25" font-family="sans-serif" font-weight="700" font-size="16" fill="#fff">DEEP ECHO</text>
    <text x="15" y="45" font-family="sans-serif" font-weight="500" font-size="12" fill="#a0c4ff">Ambient</text>
  </g>

  <!-- ROW 4: 7:00 PM (HEADLINER) -->
  <!-- Spanning Card Background -->
  <g transform="translate(60, 650)">
    <!-- Main Card -->
    <rect width="1160" height="100" rx="12" fill="url(#headliner-gradient)" filter="url(#shadow)" />
    
    <!-- Decorative Elements inside Headliner -->
    <circle cx="1100" cy="50" r="80" fill="rgba(255,255,255,0.15)" />
    <circle cx="100" cy="50" r="40" fill="rgba(255,255,255,0.15)" />
    
    <!-- Time Block -->
    <rect x="0" y="0" width="180" height="100" rx="12" fill="rgba(0,0,0,0.2)" />
    <text x="90" y="55" font-family="sans-serif" font-weight="900" font-size="24" fill="#fff" text-anchor="middle">7:00 PM</text>
    
    <!-- Artist Info -->
    <text x="220" y="45" font-family="sans-serif" font-weight="900" font-size="42" fill="#fff" letter-spacing="1" filter="url(#text-shadow)">ECLIPSE ARCHITECTS</text>
    <text x="220" y="75" font-family="sans-serif" font-weight="600" font-size="18" fill="rgba(255,255,255,0.9)" letter-spacing="2">PROGRESSIVE METAL / SYNTH</text>
    
    <!-- Special Badge -->
    <g transform="translate(980, 25)">
      <rect width="120" height="50" rx="25" fill="#fff" filter="url(#shadow)" />
      <text x="60" y="31" font-family="sans-serif" font-weight="800" font-size="14" fill="#ff5858" text-anchor="middle">HEADLINER</text>
    </g>
  </g>

  <!-- Footer / Venue Info -->
  <g transform="translate(60, 780)">
    <text x="0" y="0" font-family="sans-serif" font-weight="400" font-size="14" fill="#888">Parking available on-site. Re-entry permitted with wristband.</text>
  </g>
  <g transform="translate(1220, 780)">
    <text x="0" y="0" font-family="sans-serif" font-weight="400" font-size="14" fill="#888" text-anchor="end">www.afterglowfest.com</text>
  </g>

</svg>