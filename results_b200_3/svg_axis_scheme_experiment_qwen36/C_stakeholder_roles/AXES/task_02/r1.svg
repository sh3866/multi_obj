<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#141418" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <linearGradient id="grad-texture" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="grad-light" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blur-large" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>

    <filter id="blur-medium" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" />
    </filter>

    <!-- Turbulence Filter for "Dissolving" Texture -->
    <filter id="glitch-displacement" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Noise Filter -->
    <filter id="noise" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="screen" />
    </filter>

    <!-- Patterns -->
    <pattern id="grid-pattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>

    <clipPath id="clip-art">
      <rect x="0" y="0" width="440" height="520" />
    </clipPath>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="800" fill="url(#grad-bg)" />
  <rect width="1280" height="800" fill="url(#grid-pattern)" />

  <!-- Abstract Artwork / Atmospheric Background -->
  <g id="artwork-layer">
    <!-- Large Blurred Orbs -->
    <circle cx="200" cy="200" r="300" fill="#2a1b3d" filter="url(#blur-large)" opacity="0.6" />
    <circle cx="1000" cy="600" r="400" fill="#162b3a" filter="url(#blur-large)" opacity="0.5" />
    <circle cx="640" cy="400" r="250" fill="#3d1b1b" filter="url(#blur-large)" opacity="0.3" />
    
    <!-- Light Overlay -->
    <rect width="1280" height="800" fill="url(#grad-light)" />
    
    <!-- Texture Noise -->
    <rect width="1280" height="800" filter="url(#noise)" pointer-events="none" />
  </g>

  <!-- Main Layout Grid Lines (Subtle) -->
  <line x1="80" y1="0" x2="80" y2="800" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
  <line x1="1200" y1="0" x2="1200" y2="800" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

  <!-- HEADER -->
  <g id="header" transform="translate(80, 60)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#888888">
      THE VOID INSTITUTE OF CONTEMPORARY ART
    </text>
    <text x="1120" y="0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="1" fill="#aaaaaa" text-anchor="end">
      2024 SEASON
    </text>
  </g>

  <!-- LEFT COLUMN: Exhibition Identity & Curatorial -->
  <g id="left-content" transform="translate(80, 180)">
    
    <!-- Artist Name -->
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#d4af37">
      ELARA VANCE
    </text>

    <!-- Main Title -->
    <g transform="translate(0, 60)">
      <text x="0" y="0" font-family="'Times New Roman', Times, serif" font-size="72" font-weight="400" fill="#f0f0f0">
        ECHOES
      </text>
      <text x="0" y="75" font-family="'Times New Roman', Times, serif" font-size="72" font-weight="400" fill="#f0f0f0" font-style="italic">
        of the
      </text>
      <text x="0" y="150" font-family="'Times New Roman', Times, serif" font-size="72" font-weight="400" fill="#f0f0f0">
        UNSEEN
      </text>
    </g>

    <!-- Curatorial Statement -->
    <g transform="translate(0, 340)">
      <line x1="0" y1="-10" x2="40" y2="-10" stroke="#d4af37" stroke-width="2" />
      <text x="0" y="20" font-family="Helvetica, Arial, sans-serif" font-size="13" line-height="1.6" fill="#b0b0b0">
        <tspan x="0" dy="0">An immersive exploration of memory’s fragility.</tspan>
        <tspan x="0" dy="24">Vance fragments perception, inviting viewers to navigate</tspan>
        <tspan x="0" dy="24">the liminal spaces between what is remembered</tspan>
        <tspan x="0" dy="24">and what has been lost to time.</tspan>
      </text>
    </g>

    <!-- Dates & Location -->
    <g transform="translate(0, 480)">
      <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">
        OCT 15 — DEC 30, 2024
      </text>
      <text x="0" y="20" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#888888">
        THE GRAND HALL, 4TH FLOOR
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Visual Art & Action -->
  <g id="right-content" transform="translate(720, 140)">
    
    <!-- Decorative Frame / Art Container -->
    <g transform="translate(0, 0)">
      <!-- Outer Frame -->
      <rect x="0" y="0" width="440" height="520" fill="#000000" stroke="#333333" stroke-width="1" />
      
      <!-- Inner Abstract Art -->
      <g clip-path="url(#clip-art)">
        
        <!-- Art Background -->
        <rect x="0" y="0" width="440" height="520" fill="#0d0d0d" />
        
        <!-- Abstract Shapes with Glitch Filter -->
        <g filter="url(#glitch-displacement)">
            <!-- Dynamic Animation Group -->
            <g>
                <animateTransform attributeName="transform" type="scale" values="1; 1.02; 0.98; 1" dur="8s" repeatCount="indefinite" additive="sum" />
                <animate attributeName="opacity" values="0.8; 1; 0.8" dur="4s" repeatCount="indefinite" />
                
                <path d="M-50,100 Q150,250 450,50" fill="none" stroke="#2a2a2a" stroke-width="2" />
                <path d="M-50,120 Q150,270 450,70" fill="none" stroke="#1a1a1a" stroke-width="1" />
                
                <circle cx="220" cy="260" r="140" fill="none" stroke="#d4af37" stroke-width="0.5" stroke-dasharray="4 4" />
                <circle cx="220" cy="260" r="100" fill="#1a1a1a" filter="url(#blur-medium)" opacity="0.8" />
            </g>
            
            <!-- Glitch Elements -->
            <rect x="100" y="200" width="240" height="2" fill="#ffffff" opacity="0.2" />
            <rect x="120" y="320" width="200" height="1" fill="#ffffff" opacity="0.3" />
            <circle cx="300" cy="150" r="2" fill="#d4af37" />
            <circle cx="140" cy="380" r="3" fill="#d4af37" />
            
            <!-- Text inside Art (Abstract) -->
            <text x="220" y="260" font-family="monospace" font-size="10" fill="#444444" text-anchor="middle" transform="rotate(-15 220 260)">
              MEMORY DATA CORRUPTED
            </text>
        </g>
      </g>
      
      <!-- Overlay Grid on Art -->
      <path d="M0,0 L440,520 M440,0 L0,520" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </g>

    <!-- Action Button: Reserve Tickets -->
    <g transform="translate(0, 580)">
      <rect x="0" y="0" width="240" height="60" fill="#ffffff" />
      <text x="120" y="36" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="1">
        RESERVE TICKETS
      </text>
      
      <!-- Hover State Hint (Visual only) -->
      <rect x="0" y="60" width="240" height="2" fill="#d4af37" />
      
      <!-- Arrow -->
      <path d="M250,20 L270,30 L250,40" fill="none" stroke="#d4af37" stroke-width="2" />
    </g>

    <!-- Small Info Block near Art -->
    <g transform="translate(0, 460)">
      <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" letter-spacing="1">
        FREE ADMISSION FOR MEMBERS
      </text>
    </g>
  </g>

  <!-- FOOTER -->
  <g id="footer" transform="translate(80, 740)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555">
      THE VOID INSTITUTE • 1000 ART DISTRICT BLVD • NEW YORK, NY 10013
    </text>
    <text x="1120" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="end">
      OPEN DAILY 11AM — 7PM
    </text>
  </g>

  <!-- Floating Decorative Elements -->
  <circle cx="680" cy="400" r="1" fill="#ffffff" opacity="0.5" />
  <rect x="690" y="400" width="20" height="1" fill="#ffffff" opacity="0.3" />
</svg>