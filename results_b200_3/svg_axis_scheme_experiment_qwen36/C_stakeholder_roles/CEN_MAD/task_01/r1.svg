<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="50%" stop-color="#302b63" />
      <stop offset="100%" stop-color="#24243e" />
    </linearGradient>
    
    <!-- Stage Gradients (Vibrant & Glowing) -->
    <linearGradient id="stage-sunset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8008" />
      <stop offset="100%" stop-color="#ffc837" />
    </linearGradient>
    
    <linearGradient id="stage-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>
    
    <linearGradient id="stage-moon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2193b0" />
      <stop offset="100%" stop-color="#6dd5ed" />
    </linearGradient>

    <!-- Headliner Gradient (High Contrast) -->
    <linearGradient id="headliner-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#FF4B2B" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btn-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#EE0979" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="heavy-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="text-shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Patterns -->
    <pattern id="dot-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255, 255, 255, 0.03)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg-gradient)" />
  <rect width="1280" height="800" fill="url(#dot-grid)" />

  <!-- Header Section -->
  <!-- Shifted down by 40px (y=90) to fix top boundary issue -->
  <g transform="translate(60, 90)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="72" fill="#fff" letter-spacing="2" filter="url(#text-shadow)">AFTERGLOW</text>
    <text x="450" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="300" font-size="72" fill="url(#stage-sunset)" letter-spacing="2" filter="url(#text-shadow)">FESTIVAL</text>
    
    <!-- Subtitle Line -->
    <line x1="0" y1="15" x2="1160" y2="15" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round" />
    
    <text x="0" y="45" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#e0e0e0" letter-spacing="4">OCTOBER 21 • COASTAL AMPHITHEATER • MIAMI</text>
  </g>

  <!-- Get Tickets Action -->
  <!-- Shifted down by 40px (y=95) -->
  <g transform="translate(1030, 95)">
    <rect width="190" height="56" rx="28" fill="url(#btn-gradient)" filter="url(#glow)" />
    <text x="95" y="36" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#fff" text-anchor="middle" letter-spacing="1">GET TICKETS</text>
  </g>

  <!-- Stage Headers -->
  <!-- Shifted down by 40px (y=180) -->
  <!-- Stage 1: Sunset Stage -->
  <g transform="translate(60, 180)">
    <rect width="380" height="50" rx="4" fill="url(#stage-sunset)" filter="url(#heavy-glow)" />
    <text x="25" y="33" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#fff" letter-spacing="1">SUNSET STAGE</text>
  </g>

  <!-- Stage 2: Neon Stage -->
  <g transform="translate(500, 180)">
    <rect width="380" height="50" rx="4" fill="url(#stage-neon)" filter="url(#heavy-glow)" />
    <text x="25" y="33" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#fff" letter-spacing="1">NEON STAGE</text>
  </g>

  <!-- Stage 3: Moonlight Stage -->
  <g transform="translate(940, 180)">
    <rect width="280" height="50" rx="4" fill="url(#stage-moon)" filter="url(#heavy-glow)" />
    <text x="25" y="33" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#fff" letter-spacing="1">MOONLIGHT STAGE</text>
  </g>

  <!-- Schedule Grid System (Lines & Time) -->
  <g stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4 4">
    <!-- Vertical Dividers (Full Height) -->
    <line x1="440" y1="240" x2="440" y2="720" stroke-dasharray="none" stroke="rgba(255,255,255,0.15)" />
    <line x1="880" y1="240" x2="880" y2="720" stroke-dasharray="none" stroke="rgba(255,255,255,0.15)" />
  </g>

  <!-- Time Markers (Aligned to Grid) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#fff">
    <!-- 12:00 PM -->
    <text x="30" y="310">12:00 PM</text>
    <line x1="0" y1="305" x2="1280" y2="305" stroke="rgba(255,255,255,0.2)" />
    
    <!-- 2:00 PM -->
    <text x="30" y="430">2:00 PM</text>
    <line x1="0" y1="425" x2="1280" y2="425" stroke="rgba(255,255,255,0.2)" />
    
    <!-- 4:00 PM -->
    <text x="30" y="550">4:00 PM</text>
    <line x1="0" y1="545" x2="1280" y2="545" stroke="rgba(255,255,255,0.2)" />
    
    <!-- 7:00 PM -->
    <text x="30" y="670">7:00 PM</text>
    <line x1="0" y1="665" x2="1280" y2="665" stroke="rgba(255,255,255,0.2)" />
  </g>

  <!-- ========================================== -->
  <!-- SCHEDULE ITEMS                             -->
  <!-- ========================================== -->

  <!-- ROW 1: 12:00 PM -->
  <!-- Sunset Stage -->
  <g transform="translate(60, 310)">
    <rect width="380" height="80" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" />
    <text x="20" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#fff">SOLAR FLARES</text>
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#ff9a8b">Indie Rock</text>
  </g>

  <!-- Neon Stage -->
  <g transform="translate(500, 310)">
    <rect width="380" height="80" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" />
    <text x="20" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#fff">CYBER PULSE</text>
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#66e0ff">Synthwave</text>
  </g>

  <!-- Moonlight Stage -->
  <g transform="translate(940, 310)">
    <rect width="280" height="80" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" />
    <text x="20" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#fff">VELVET MIST</text>
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#a0c4ff">Lo-Fi Chill</text>
  </g>

  <!-- ROW 2: 2:00 PM -->
  <!-- Sunset Stage -->
  <g transform="translate(60, 430)">
    <rect width="380" height="80" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" />
    <text x="20" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#fff">THE DRIFT</text>
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#ff9a8b">Alternative</text>
  </g>

  <!-- Neon Stage -->
  <g transform="translate(500, 430)">
    <rect width="380" height="80" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" />
    <text x="20" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#fff">BASS THEORY</text>
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#66e0ff">Techno</text>
  </g>

  <!-- Moonlight Stage -->
  <g transform="translate(940, 430)">
    <rect width="280" height="80" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" />
    <text x="20" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#fff">ACOUSTIC SKIES</text>
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#a0c4ff">Folk / Unplugged</text>
  </g>

  <!-- ROW 3: 4:00 PM -->
  <!-- Sunset Stage -->
  <g transform="translate(60, 550)">
    <rect width="380" height="80" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" />
    <text x="20" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#fff">RHYTHM CORP</text>
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#ff9a8b">Funk / Disco</text>
  </g>

  <!-- Neon Stage -->
  <g transform="translate(500, 550)">
    <rect width="380" height="80" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" />
    <text x="20" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#fff">NEON NOVA</text>
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#66e0ff">House</text>
  </g>

  <!-- Moonlight Stage -->
  <g transform="translate(940, 550)">
    <rect width="280" height="80" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" />
    <text x="20" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#fff">DEEP ECHO</text>
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#a0c4ff">Ambient</text>
  </g>

  <!-- ========================================== -->
  <!-- HEADLINER SECTION (7:00 PM) - IN COLUMN    -->
  <!-- ========================================== -->
  
  <!-- Placed within Sunset Stage column but visually dominant -->
  <g transform="translate(60, 670)">
    <!-- Main Glowing Card -->
    <rect width="380" height="100" rx="12" fill="url(#headliner-gradient)" filter="url(#glow)" />
    
    <!-- Internal decorative elements -->
    <circle cx="340" cy="10" r="50" fill="rgba(255,255,255,0.15)" />
    <circle cx="20" cy="90" r="30" fill="rgba(255,255,255,0.1)" />
    
    <!-- Time Badge -->
    <rect x="0" y="0" width="100" height="100" rx="12" fill="rgba(0,0,0,0.2)" />
    <text x="50" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#fff" text-anchor="middle">7:00 PM</text>
    
    <!-- Artist Info -->
    <text x="120" y="45" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" fill="#fff" letter-spacing="1" filter="url(#text-shadow)">ECLIPSE</text>
    <text x="120" y="75" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" fill="#fff" letter-spacing="1" filter="url(#text-shadow)">ARCHITECTS</text>
    
    <!-- Genre -->
    <text x="120" y="95" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="rgba(255,255,255,0.9)" letter-spacing="1">PROGRESSIVE METAL / SYNTH</text>
    
    <!-- Headliner Badge -->
    <g transform="translate(250, 25)">
      <rect width="100" height="50" rx="25" fill="#fff" />
      <text x="50" y="31" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#FF416C" text-anchor="middle">HEADLINER</text>
    </g>
  </g>

  <!-- Footer / Venue Info -->
  <g transform="translate(60, 760)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#888">Parking available on-site. Re-entry permitted with wristband.</text>
  </g>
  <g transform="translate(1220, 760)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14" fill="#888" text-anchor="end">www.afterglowfest.com</text>
  </g>

</svg>