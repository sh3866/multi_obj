<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0c15"/>
      <stop offset="100%" stop-color="#1a1625"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>

    <!-- Product Gradients -->
    <linearGradient id="air-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#80deea"/>
    </linearGradient>
    <linearGradient id="studio-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
    <linearGradient id="nocturne-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e1bee7"/>
      <stop offset="100%" stop-color="#9c27b0"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-bg">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Product Visuals (Distinct Geometries) -->
    <!-- Air: Thin, airy strokes -->
    <g id="vis-air">
      <path d="M20 70 C20 20, 80 20, 80 70" fill="none" stroke="#80deea" stroke-width="2" stroke-linecap="round"/>
      <rect x="12" y="60" width="12" height="24" rx="4" fill="#e0f7fa" opacity="0.9"/>
      <rect x="76" y="60" width="12" height="24" rx="4" fill="#e0f7fa" opacity="0.9"/>
    </g>

    <!-- Studio: Precise, technical angles -->
    <g id="vis-studio">
      <path d="M20 70 C20 20, 80 20, 80 70" fill="none" stroke="#ffb74d" stroke-width="4" stroke-linecap="square"/>
      <rect x="10" y="55" width="16" height="30" rx="2" fill="#ffe0b2"/>
      <rect x="74" y="55" width="16" height="30" rx="2" fill="#ffe0b2"/>
      <path d="M10 60 L26 60" stroke="#d84315" stroke-width="1" opacity="0.5"/>
      <path d="M74 60 L90 60" stroke="#d84315" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- Nocturne: Thick, substantial forms -->
    <g id="vis-nocturne">
      <path d="M15 75 C15 10, 85 10, 85 75" fill="none" stroke="#9c27b0" stroke-width="8" stroke-linecap="round"/>
      <rect x="5" y="50" width="24" height="36" rx="8" fill="#e1bee7"/>
      <rect x="71" y="50" width="24" height="36" rx="8" fill="#e1bee7"/>
      <rect x="8" y="55" width="18" height="26" rx="4" fill="#4a148c" opacity="0.3"/>
      <rect x="74" y="55" width="18" height="26" rx="4" fill="#4a148c" opacity="0.3"/>
    </g>

    <!-- Data Icons -->
    <g id="icon-battery">
      <rect x="-6" y="-3" width="10" height="6" rx="1" fill="none" stroke="#6c757d" stroke-width="1"/>
      <rect x="-4" y="-1" width="5" height="2" fill="#6c757d"/>
      <path d="M4 0 L5 -1 L5 1 Z" fill="#6c757d"/>
    </g>
    <g id="icon-driver">
      <circle cx="0" cy="0" r="5" fill="none" stroke="#6c757d" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="#6c757d"/>
      <line x1="0" y1="-5" x2="0" y2="-7" stroke="#6c757d" stroke-width="1"/>
      <line x1="0" y1="5" x2="0" y2="7" stroke="#6c757d" stroke-width="1"/>
    </g>
    <g id="icon-weight">
      <path d="M-4 4 C-4 0, 4 0, 4 4 L4 6 L-4 6 Z" fill="none" stroke="#6c757d" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="#6c757d"/>
    </g>

  </defs>

  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .brand-text { font-weight: 700; letter-spacing: 2px; fill: #ffffff; }
    .section-header { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; fill: #6c757d; text-transform: uppercase; }
    .product-name { font-size: 26px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .price { font-size: 22px; font-weight: 300; fill: #e9ecef; text-anchor: middle; }
    .feature-text { font-size: 13px; fill: #adb5bd; }
    .spec-label { font-size: 12px; fill: #6c757d; text-anchor: middle; }
    .spec-value { font-size: 14px; font-weight: 500; fill: #e9ecef; text-anchor: middle; }
    .btn-text { font-size: 14px; font-weight: 600; text-anchor: middle; fill: #ffffff; pointer-events: none; }
    .recommended-badge { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-anchor: middle; fill: #2d1b06; }
  </style>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg-gradient)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>

  <!-- Header Section -->
  <g transform="translate(640, 60)">
    <text x="0" y="0" class="brand-text" font-size="24">AURALITH</text>
    <text x="0" y="30" font-size="16" fill="#adb5bd" text-anchor="middle" font-weight="300">Engineered Silence. Pure Sound.</text>
  </g>

  <!-- Comparison Matrix Container -->
  <g transform="translate(80, 120)">
    
    <!-- Horizontal Alignment Lines (Visual Grid) -->
    <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.05" stroke-dasharray="4 4">
      <!-- Row 1: Battery -->
      <line x1="50" y1="360" x2="1130" y2="360" />
      <!-- Row 2: Drivers -->
      <line x1="50" y1="410" x2="1130" y2="410" />
      <!-- Row 3: Weight -->
      <line x1="50" y1="460" x2="1130" y2="460" />
    </g>

    <!-- Left Column: Labels -->
    <g transform="translate(0, 0)">
      <text x="0" y="364" class="section-header" text-anchor="end">BATTERY</text>
      <text x="0" y="414" class="section-header" text-anchor="end">DRIVERS</text>
      <text x="0" y="464" class="section-header" text-anchor="end">WEIGHT</text>
    </g>

    <!-- ========================================== -->
    <!-- PRODUCT 1: AIR -->
    <!-- ========================================== -->
    <g id="product-air" transform="translate(160, 0)">
      <!-- Card Background -->
      <rect x="0" y="0" width="260" height="640" rx="12" fill="#1e1b24" stroke="#2c2f33" stroke-width="1"/>
      
      <!-- Visual Area -->
      <circle cx="130" cy="100" r="70" fill="#80deea" opacity="0.05"/>
      <use href="#vis-air" x="80" y="50"/>

      <!-- Name & Price -->
      <text x="130" y="200" class="product-name">Air</text>
      <text x="130" y="230" class="price">$249</text>
      <text x="130" y="255" font-size="12" fill="#adb5bd" text-anchor="middle">Lightweight everyday.</text>

      <!-- Colors -->
      <g transform="translate(130, 285)">
        <circle cx="-30" cy="0" r="5" fill="#ffffff"/>
        <circle cx="-10" cy="0" r="5" fill="#80deea"/>
        <circle cx="10" cy="0" r="5" fill="#37474f"/>
        <text x="30" y="4" font-size="10" fill="#6c757d">3 Colors</text>
      </g>

      <!-- Feature List (Narrative) -->
      <g transform="translate(30, 320)">
        <text x="0" y="0" class="feature-text">• Seamless multipoint</text>
        <text x="0" y="20" class="feature-text">• Breathable mesh</text>
        <text x="0" y="40" class="feature-text">• Quick charge</text>
      </g>

      <!-- Matrix Data Points -->
      <g transform="translate(130, 0)">
        <!-- Battery -->
        <use href="#icon-battery" x="-60" y="360"/>
        <text x="10" y="364" class="spec-value">30 Hours</text>
        <!-- Drivers -->
        <use href="#icon-driver" x="-60" y="410"/>
        <text x="10" y="414" class="spec-value">32mm Balanced</text>
        <!-- Weight -->
        <use href="#icon-weight" x="-60" y="460"/>
        <text x="10" y="464" class="spec-value">220g</text>
      </g>

      <!-- CTA -->
      <rect x="30" y="580" width="200" height="44" rx="22" fill="#2c2f33" stroke="#495057"/>
      <text x="130" y="607" class="btn-text">Shop Air</text>
    </g>

    <!-- ========================================== -->
    <!-- PRODUCT 2: STUDIO (RECOMMENDED) -->
    <!-- ========================================== -->
    <g id="product-studio" transform="translate(500, -20)">
      <!-- Premium Lighting Background -->
      <circle cx="140" cy="300" r="180" fill="#ffb74d" opacity="0.05" filter="url(#glow-bg)"/>
      
      <!-- Card Background (Larger, Elevated) -->
      <rect x="0" y="0" width="300" height="680" rx="16" fill="#25212e" stroke="#ffb74d" stroke-width="1.5" filter="url(#shadow-lg)"/>
      
      <!-- Recommended Badge -->
      <rect x="90" y="-15" width="120" height="30" rx="15" fill="#ffb74d" filter="url(#shadow-sm)"/>
      <text x="150" y="1" class="recommended-badge">RECOMMENDED</text>

      <!-- Visual Area -->
      <circle cx="150" cy="120" r="80" fill="#ffb74d" opacity="0.1"/>
      <use href="#vis-studio" x="90" y="60"/>

      <!-- Name & Price -->
      <text x="150" y="210" class="product-name" fill="#ffffff">Studio</text>
      <text x="150" y="240" class="price">$399</text>
      <text x="150" y="265" font-size="12" fill="#adb5bd" text-anchor="middle">Accurate creative work.</text>

      <!-- Colors -->
      <g transform="translate(150, 295)">
        <circle cx="-35" cy="0" r="5" fill="#fff3e0"/>
        <circle cx="-15" cy="0" r="5" fill="#ffb74d"/>
        <circle cx="5" cy="0" r="5" fill="#424242"/>
        <circle cx="25" cy="0" r="5" fill="#263238"/>
        <text x="45" y="4" font-size="10" fill="#6c757d">4 Colors</text>
      </g>

      <!-- Feature List (Narrative) -->
      <g transform="translate(30, 330)">
        <text x="0" y="0" class="feature-text" font-weight="600" fill="#e9ecef">• Reference monitoring</text>
        <text x="0" y="20" class="feature-text">• Low latency mode</text>
        <text x="0" y="40" class="feature-text">• Detachable cable</text>
      </g>

      <!-- Matrix Data Points -->
      <g transform="translate(150, 0)">
        <!-- Battery -->
        <use href="#icon-battery" x="-60" y="380"/>
        <text x="10" y="384" class="spec-value" fill="#ffb74d">40 Hours</text>
        <!-- Drivers -->
        <use href="#icon-driver" x="-60" y="430"/>
        <text x="10" y="434" class="spec-value" fill="#ffb74d">40mm Flat-Resp</text>
        <!-- Weight -->
        <use href="#icon-weight" x="-60" y="480"/>
        <text x="10" y="484" class="spec-value" fill="#ffb74d">280g</text>
      </g>

      <!-- CTA -->
      <rect x="30" y="600" width="240" height="44" rx="22" fill="#ffb74d" filter="url(#shadow-sm)"/>
      <text x="150" y="627" class="btn-text" fill="#2d1b06">Shop Studio</text>
    </g>

    <!-- ========================================== -->
    <!-- PRODUCT 3: NOCTURNE -->
    <!-- ========================================== -->
    <g id="product-nocturne" transform="translate(880, 0)">
      <!-- Card Background -->
      <rect x="0" y="0" width="260" height="640" rx="12" fill="#1e1b24" stroke="#2c2f33" stroke-width="1"/>
      
      <!-- Visual Area -->
      <circle cx="130" cy="100" r="70" fill="#9c27b0" opacity="0.1"/>
      <use href="#vis-nocturne" x="80" y="50"/>

      <!-- Name & Price -->
      <text x="130" y="200" class="product-name">Nocturne</text>
      <text x="130" y="230" class="price">$549</text>
      <text x="130" y="255" font-size="12" fill="#adb5bd" text-anchor="middle">Flagship immersive.</text>

      <!-- Colors -->
      <g transform="translate(130, 285)">
        <circle cx="-25" cy="0" r="5" fill="#4a148c"/>
        <circle cx="-5" cy="0" r="5" fill="#9c27b0"/>
        <circle cx="15" cy="0" r="5" fill="#212121"/>
        <text x="35" y="4" font-size="10" fill="#6c757d">3 Colors</text>
      </g>

      <!-- Feature List (Narrative) -->
      <g transform="translate(30, 320)">
        <text x="0" y="0" class="feature-text">• Hybrid ANC Pro</text>
        <text x="0" y="20" class="feature-text">• Spatial Audio Engine</text>
        <text x="0" y="40" class="feature-text">• Leather cushions</text>
      </g>

      <!-- Matrix Data Points -->
      <g transform="translate(130, 0)">
        <!-- Battery -->
        <use href="#icon-battery" x="-60" y="360"/>
        <text x="10" y="364" class="spec-value">50 Hours</text>
        <!-- Drivers -->
        <use href="#icon-driver" x="-60" y="410"/>
        <text x="10" y="414" class="spec-value">50mm Custom</text>
        <!-- Weight -->
        <use href="#icon-weight" x="-60" y="460"/>
        <text x="10" y="464" class="spec-value">310g</text>
      </g>

      <!-- CTA -->
      <rect x="30" y="580" width="200" height="44" rx="22" fill="#2c2f33" stroke="#495057"/>
      <text x="130" y="607" class="btn-text">Shop Nocturne</text>
    </g>

  </g>

  <!-- Footer -->
  <text x="640" y="760" font-size="12" fill="#6c757d" text-anchor="middle">© 2024 Auralith Audio Systems. All specifications subject to change.</text>

</svg>