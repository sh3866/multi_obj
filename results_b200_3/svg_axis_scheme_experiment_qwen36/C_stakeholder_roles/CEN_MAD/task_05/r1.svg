<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5F0" />
      <stop offset="100%" stop-color="#EBE6DE" />
    </linearGradient>
    
    <linearGradient id="feature-img-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3DFD6" />
      <stop offset="100%" stop-color="#D1CBC0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.05" />
    </filter>
    
    <!-- Patterns -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A3B4C" opacity="0.12" />
    </pattern>
    
    <!-- Clip Paths -->
    <clipPath id="feature-clip">
      <rect x="0" y="0" width="580" height="400" rx="3" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg-grad)" />
  <rect width="1280" height="800" fill="url(#dot-grid)" />

  <!-- Abstract Background Elements (Theme: Distance) -->
  <g opacity="0.5">
    <!-- Large sweeping arc -->
    <path d="M 1400 -100 Q 1000 800 0 600" fill="none" stroke="#2A3B4C" stroke-width="1" stroke-dasharray="6 6" opacity="0.3" />
    <path d="M 1400 -50 Q 950 850 -50 650" fill="none" stroke="#2A3B4C" stroke-width="0.5" opacity="0.2" />
  </g>

  <!-- Header Section -->
  <g transform="translate(40, 40)">
    <!-- Magazine Name -->
    <text x="0" y="0" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#2A3B4C" letter-spacing="2">MARGIN <tspan fill="#B53F3F">&amp;</tspan> FIELD</text>
    
    <!-- Issue Info -->
    <text x="1200" y="0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2A3B4C" text-anchor="end" letter-spacing="1">NO. 12</text>
    <text x="1200" y="20" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">THE SHAPE OF DISTANCE</text>
    
    <!-- Navigation -->
    <g transform="translate(0, 40)">
      <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666" letter-spacing="1.5">ESSAYS</text>
      <text x="60" y="0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666" letter-spacing="1.5">FICTION</text>
      <text x="130" y="0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666" letter-spacing="1.5">VISUAL ART</text>
      <text x="220" y="0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666" letter-spacing="1.5">ARCHIVE</text>
    </g>
    
    <line x1="0" y1="70" x2="1200" y2="70" stroke="#2A3B4C" stroke-width="1" opacity="0.1" />
  </g>

  <!-- Main Content: Asymmetric Grid -->
  <g transform="translate(40, 140)">
    
    <!-- LEFT COLUMN: Feature Story -->
    <g id="feature-story">
      <!-- Abstract Image / Graphic -->
      <g filter="url(#shadow-sm)">
        <rect x="0" y="0" width="580" height="400" fill="url(#feature-img-grad)" rx="3" />
        
        <g clip-path="url(#feature-clip)">
          <!-- Geometric representation of distance/horizon -->
          <g transform="translate(290, 200)">
            <circle cx="0" cy="0" r="110" fill="none" stroke="#2A3B4C" stroke-width="2" opacity="0.3" />
            <circle cx="0" cy="0" r="70" fill="none" stroke="#B53F3F" stroke-width="1.5" opacity="0.6" />
            <!-- Crosshairs -->
            <line x1="-130" y1="0" x2="130" y2="0" stroke="#2A3B4C" stroke-width="1" opacity="0.2" />
            <line x1="0" y1="-130" x2="0" y2="130" stroke="#2A3B4C" stroke-width="1" opacity="0.2" />
            
            <!-- Text inside graphic -->
            <text x="0" y="4" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2A3B4C" text-anchor="middle" letter-spacing="6" font-weight="600">HORIZON</text>
          </g>
        </g>
      </g>

      <!-- Feature Content -->
      <g transform="translate(0, 430)">
        <!-- Category -->
        <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#B53F3F" letter-spacing="2">FEATURE ESSAY</text>
        
        <!-- Title -->
        <text x="0" y="35" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#2A3B4C">
          <tspan x="0" dy="0">The Geometry of</tspan>
          <tspan x="0" dy="48">Separation</tspan>
        </text>

        <!-- Author -->
        <text x="0" y="115" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2A3B4C" letter-spacing="1">BY ELENA VORTEX</text>
        
        <!-- Excerpt -->
        <text x="0" y="145" font-family="Georgia, serif" font-size="16" fill="#444">
          <tspan x="0" dy="0">Distance is not merely a measurement of space, but a</tspan>
          <tspan x="0" dy="24">topology of emotion. In the quiet spaces between</tspan>
          <tspan x="0" dy="24">letters, we find the true architecture of longing...</tspan>
        </text>

        <!-- Link -->
        <g transform="translate(0, 215)">
          <line x1="0" y1="0" x2="30" y2="0" stroke="#B53F3F" stroke-width="2" />
          <text x="45" y="4" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#B53F3F" letter-spacing="1">READ THE FULL STORY →</text>
        </g>
      </g>
    </g>

    <!-- RIGHT COLUMN: 2x2 Grid of Secondary Articles -->
    <g transform="translate(640, 0)">
      
      <!-- Article 1: Top Left -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#B53F3F" letter-spacing="2">FICTION</text>
        <text x="0" y="25" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2A3B4C">Echoes in the Signal</text>
        <text x="0" y="45" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">By Marcus Thorne</text>
        <text x="0" y="70" font-family="Georgia, serif" font-size="14" fill="#555">
          <tspan x="0" dy="0">A short story about a radio operator on a</tspan>
          <tspan x="0" dy="20">moon base waiting for a signal that never comes.</tspan>
        </text>
      </g>

      <!-- Article 2: Top Right -->
      <g transform="translate(300, 0)">
        <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#B53F3F" letter-spacing="2">CULTURE</text>
        <text x="0" y="25" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2A3B4C">Architectures of Silence</text>
        <text x="0" y="45" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">By Sarah Jenkins</text>
        <text x="0" y="70" font-family="Georgia, serif" font-size="14" fill="#555">
          <tspan x="0" dy="0">Exploring the brutalist structures of Eastern Europe</tspan>
          <tspan x="0" dy="20">and the psychological weight of empty spaces.</tspan>
        </text>
      </g>

      <!-- Separator Line between rows -->
      <line x1="0" y1="130" x2="580" y2="130" stroke="#2A3B4C" stroke-width="1" opacity="0.1" stroke-dasharray="2 4" />

      <!-- Article 3: Bottom Left -->
      <g transform="translate(0, 180)">
        <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#B53F3F" letter-spacing="2">VISUAL ART</text>
        <text x="0" y="25" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2A3B4C">Chromatic Decay</text>
        <text x="0" y="45" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">By Julian Vane</text>
        <text x="0" y="70" font-family="Georgia, serif" font-size="14" fill="#555">
          <tspan x="0" dy="0">Photography series capturing the fading</tspan>
          <tspan x="0" dy="20">neon lights of 1990s Berlin.</tspan>
        </text>
      </g>

      <!-- Article 4: Bottom Right -->
      <g transform="translate(300, 180)">
        <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#B53F3F" letter-spacing="2">POETRY</text>
        <text x="0" y="25" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2A3B4C">The Long Way Home</text>
        <text x="0" y="45" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">By A. K. Patel</text>
        <text x="0" y="70" font-family="Georgia, serif" font-size="14" fill="#555">
          <tspan x="0" dy="0">A collection of sonnets mapping the journey</tspan>
          <tspan x="0" dy="20">from childhood to exile.</tspan>
        </text>
      </g>

    </g>
  </g>

  <!-- Footer / Action Bar -->
  <g transform="translate(40, 730)">
    <!-- Issue Metadata -->
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#888" letter-spacing="1">ISSUE 12 • 24 PAGES • OCTOBER 2023 • EDITED BY J. DOE</text>

    <!-- Primary Action: Read Issue -->
    <g transform="translate(380, -20)">
      <rect x="0" y="0" width="140" height="40" rx="20" fill="#2A3B4C" filter="url(#shadow-sm)" />
      <text x="70" y="24" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle" letter-spacing="1">READ THE ISSUE</text>
    </g>

    <!-- Secondary Action: Subscribe -->
    <g transform="translate(950, -20)">
       <!-- Matching Pill Shape for Subscribe -->
      <rect x="0" y="0" width="210" height="40" rx="20" fill="none" stroke="#2A3B4C" stroke-width="1.5" />
      <text x="105" y="24" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#2A3B4C" text-anchor="middle" letter-spacing="1">SUBSCRIBE TO THE MAGAZINE</text>
    </g>
  </g>

</svg>