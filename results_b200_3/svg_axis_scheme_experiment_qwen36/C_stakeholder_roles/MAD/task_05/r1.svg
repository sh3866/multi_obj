<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5F0" />
      <stop offset="100%" stop-color="#EBE6DE" />
    </linearGradient>

    <!-- Feature Area Background -->
    <linearGradient id="feature-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBE6DE" />
      <stop offset="100%" stop-color="#D1CBC0" />
    </linearGradient>

    <!-- Feature Graphic Gradient -->
    <linearGradient id="graphic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A3B4C" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8C98A6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.04" />
    </filter>

    <!-- Patterns -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A3B4C" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Main Background -->
  <rect width="1280" height="800" fill="url(#bg-grad)" />
  <rect width="1280" height="800" fill="url(#dot-grid)" />

  <!-- Large Abstract Background Theme Elements (Distance/Topology) -->
  <g opacity="0.4">
    <!-- Large sweeping curve -->
    <path d="M-50 650 Q 600 750 1350 350" fill="none" stroke="#2A3B4C" stroke-width="1" opacity="0.15" />
    <!-- Concentric circles indicating distance/focus -->
    <circle cx="1250" cy="150" r="350" fill="none" stroke="#2A3B4C" stroke-width="1" stroke-dasharray="4 6" opacity="0.2" />
    <circle cx="1250" cy="150" r="330" fill="none" stroke="#2A3B4C" stroke-width="0.5" opacity="0.1" />
  </g>

  <!-- HEADER SECTION -->
  <g transform="translate(40, 40)">
    <!-- Masthead -->
    <text x="0" y="0" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#2A3B4C" letter-spacing="3">MARGIN <tspan fill="#B53F3F">&amp;</tspan> FIELD</text>
    
    <!-- Issue Meta -->
    <text x="1200" y="0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2A3B4C" text-anchor="end" letter-spacing="1">NO. 12</text>
    <text x="1200" y="24" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666" text-anchor="end" letter-spacing="0.5">THE SHAPE OF DISTANCE</text>
    
    <!-- Navigation -->
    <g transform="translate(0, 50)">
      <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666" letter-spacing="1">ESSAYS</text>
      <text x="65" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666" letter-spacing="1">FICTION</text>
      <text x="130" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666" letter-spacing="1">VISUAL ART</text>
      <text x="210" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666" letter-spacing="1">ARCHIVE</text>
    </g>

    <!-- Top Divider -->
    <rect x="0" y="80" width="1200" height="1" fill="#2A3B4C" opacity="0.1" />
  </g>

  <!-- MAIN CONTENT GRID (Z-Pattern Layout) -->
  <g transform="translate(40, 140)">
    
    <!-- LEFT COLUMN: Feature Story (Hero) -->
    <g id="feature-story" transform="translate(0, 0)">
      
      <!-- Feature Graphic Area -->
      <g transform="translate(0, 0)">
        <!-- Abstract Background for Graphic -->
        <rect x="0" y="0" width="560" height="400" fill="url(#feature-bg)" rx="4" filter="url(#shadow-sm)" />
        
        <!-- Inner Graphic: Abstract Topology -->
        <g transform="translate(280, 200)">
           <!-- Outer ring -->
           <circle cx="0" cy="0" r="140" fill="none" stroke="#2A3B4C" stroke-width="1" opacity="0.3" />
           <!-- Inner ring -->
           <circle cx="0" cy="0" r="90" fill="none" stroke="#B53F3F" stroke-width="1" opacity="0.6" />
           <!-- Crosshairs -->
           <line x1="-150" y1="0" x2="150" y2="0" stroke="#2A3B4C" stroke-width="1" opacity="0.2" />
           <line x1="0" y1="-150" x2="0" y2="150" stroke="#2A3B4C" stroke-width="1" opacity="0.2" />
           <!-- Dashed distance markers -->
           <path d="M-100 -100 L 100 100" stroke="#2A3B4C" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.5" />
           <text x="0" y="5" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#2A3B4C" text-anchor="middle" letter-spacing="6">HORIZON</text>
        </g>
      </g>

      <!-- Feature Text Content -->
      <g transform="translate(0, 440)">
        <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#B53F3F" letter-spacing="2">FEATURE ESSAY</text>
        <text x="0" y="35" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#2A3B4C">
          <tspan x="0" dy="0">The Geometry of</tspan>
          <tspan x="0" dy="42">Separation</tspan>
        </text>
        <text x="0" y="105" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2A3B4C" letter-spacing="1">BY ELENA VORTEX</text>
        <text x="0" y="135" font-family="Georgia, serif" font-size="16" fill="#444">
          <tspan x="0" dy="0">Distance is not merely a measurement of space, but a</tspan>
          <tspan x="0" dy="24">topology of emotion. In the quiet spaces between</tspan>
          <tspan x="0" dy="24">letters, we find the true architecture of longing...</tspan>
        </text>
        
        <!-- Feature Read More -->
        <g transform="translate(0, 210)">
          <line x1="0" y1="0" x2="30" y2="0" stroke="#B53F3F" stroke-width="2" />
          <text x="45" y="4" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#B53F3F" letter-spacing="1">READ THE FULL STORY →</text>
        </g>
      </g>
    </g>

    <!-- RIGHT COLUMN: Secondary Articles (2x2 Grid) -->
    <g transform="translate(620, 0)">
      
      <!-- Secondary Article 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#B53F3F" letter-spacing="2">FICTION</text>
        <text x="0" y="25" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2A3B4C">Echoes in the Signal</text>
        <text x="0" y="45" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">By Marcus Thorne</text>
        <text x="0" y="70" font-family="Georgia, serif" font-size="14" fill="#555">
          <tspan x="0" dy="0">A short story about a radio operator on a</tspan>
          <tspan x="0" dy="20">moon base waiting for a signal that never comes.</tspan>
        </text>
        <!-- Whitespace spacer instead of line -->
        <rect x="0" y="110" width="600" height="1" fill="#2A3B4C" opacity="0.05" />
      </g>

      <!-- Secondary Article 2 -->
      <g transform="translate(0, 180)">
        <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#B53F3F" letter-spacing="2">CULTURE</text>
        <text x="0" y="25" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2A3B4C">Architectures of Silence</text>
        <text x="0" y="45" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">By Sarah Jenkins</text>
        <text x="0" y="70" font-family="Georgia, serif" font-size="14" fill="#555">
          <tspan x="0" dy="0">Exploring the brutalist structures of Eastern Europe</tspan>
          <tspan x="0" dy="20">and the psychological weight of empty spaces.</tspan>
        </text>
        <!-- Whitespace spacer -->
        <rect x="0" y="110" width="600" height="1" fill="#2A3B4C" opacity="0.05" />
      </g>

      <!-- Secondary Article 3 -->
      <g transform="translate(0, 360)">
        <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#B53F3F" letter-spacing="2">VISUAL ART</text>
        <text x="0" y="25" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2A3B4C">Chromatic Decay</text>
        <text x="0" y="45" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">By Julian Vane</text>
        <text x="0" y="70" font-family="Georgia, serif" font-size="14" fill="#555">
          <tspan x="0" dy="0">Photography series capturing the fading</tspan>
          <tspan x="0" dy="20">neon lights of 1990s Berlin.</tspan>
        </text>
        <!-- Whitespace spacer -->
        <rect x="0" y="110" width="600" height="1" fill="#2A3B4C" opacity="0.05" />
      </g>

      <!-- Secondary Article 4 -->
      <g transform="translate(0, 540)">
        <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#B53F3F" letter-spacing="2">POETRY</text>
        <text x="0" y="25" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2A3B4C">The Long Way Home</text>
        <text x="0" y="45" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">By A. K. Patel</text>
        <text x="0" y="70" font-family="Georgia, serif" font-size="14" fill="#555">
          <tspan x="0" dy="0">A collection of sonnets mapping the journey</tspan>
          <tspan x="0" dy="20">from childhood to exile.</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- FOOTER / ACTION BAR -->
  <g transform="translate(40, 720)">
    <!-- Issue Summary -->
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#888" letter-spacing="1">ISSUE 12 • 24 PAGES • OCTOBER 2023 • EDITED BY J. DOE</text>

    <!-- Subscribe Action (Left/Center) -->
    <text x="160" y="-2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2A3B4C" letter-spacing="1">SUBSCRIBE TO THE MAGAZINE</text>
    <text x="160" y="16" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#666">Monthly dispatches from the periphery.</text>

    <!-- Primary CTA: Read Issue (Right Aligned, Outlined) -->
    <g transform="translate(1050, -30)">
      <rect x="0" y="0" width="140" height="44" rx="22" fill="none" stroke="#2A3B4C" stroke-width="1.5" />
      <text x="70" y="26" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#2A3B4C" text-anchor="middle" letter-spacing="1">READ THE ISSUE</text>
    </g>
  </g>

</svg>