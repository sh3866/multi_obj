<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0d0d10" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>

    <radialGradient id="grad-light" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blur-large" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="blur-medium" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" />
    </filter>

    <filter id="noise" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="screen" />
    </filter>

    <filter id="glitch-displacement" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.2" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Clip Path for Artwork Box -->
    <clipPath id="art-clip">
      <rect x="640" y="140" width="520" height="520" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#grad-bg)" />
  <rect width="1280" height="800" fill="url(#grad-light)" />
  <rect width="1280" height="800" filter="url(#noise)" pointer-events="none" />

  <!-- Structural Grid Lines (Subtle Anchors) -->
  <line x1="80" y1="0" x2="80" y2="800" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <line x1="640" y1="0" x2="640" y2="800" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <line x1="1200" y1="0" x2="1200" y2="800" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  
  <!-- Bottom Anchor Line for Footer -->
  <line x1="80" y1="720" x2="1200" y2="720" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Top Header -->
  <g id="header" transform="translate(80, 60)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#888888">
      THE VOID INSTITUTE OF CONTEMPORARY ART
    </text>
    <text x="1120" y="0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="1" fill="#aaaaaa" text-anchor="end">
      2024 SEASON
    </text>
  </g>

  <!-- LEFT COLUMN: Exhibition Identity -->
  <g id="left-content" transform="translate(80, 200)">
    
    <!-- Artist Name (High Contrast, Distinct) -->
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#d4af37">
      ELARA VANCE
    </text>

    <!-- Main Title -->
    <g transform="translate(0, 30)">
      <text x="0" y="0" font-family="'Times New Roman', Times, serif" font-size="88" font-weight="400" fill="#f0f0f0" letter-spacing="-1">
        ECHOES
      </text>
      <text x="0" y="78" font-family="'Times New Roman', Times, serif" font-size="88" font-weight="400" fill="#f0f0f0" font-style="italic" letter-spacing="-1">
        of the
      </text>
      <text x="0" y="156" font-family="'Times New Roman', Times, serif" font-size="88" font-weight="400" fill="#f0f0f0" letter-spacing="-1">
        UNSEEN
      </text>
    </g>

    <!-- Curatorial Statement -->
    <g transform="translate(0, 300)">
      <line x1="0" y1="-15" x2="40" y2="-15" stroke="#d4af37" stroke-width="2" />
      <text x="0" y="15" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#b0b0b0">
        <tspan x="0" dy="0">An immersive exploration of memory’s fragility.</tspan>
        <tspan x="0" dy="26">Vance fragments perception, inviting viewers to navigate</tspan>
        <tspan x="0" dy="26">the liminal spaces between what is remembered</tspan>
        <tspan x="0" dy="26">and what has been lost to time.</tspan>
      </text>
    </g>

    <!-- Dates & Location -->
    <g transform="translate(0, 460)">
      <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
        OCT 15 — DEC 30, 2024
      </text>
      <text x="0" y="24" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#888888" letter-spacing="1">
        THE GRAND HALL, 4TH FLOOR
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Visual Art & CTA -->
  <g id="right-content">
    
    <!-- Artwork Container -->
    <g transform="translate(640, 140)">
      <!-- Frame -->
      <rect x="0" y="0" width="520" height="520" fill="#080808" stroke="#222222" stroke-width="1" />
      
      <!-- Art Content (Clipped) -->
      <g clip-path="url(#art-clip)">
        <!-- Abstract Background Shapes -->
        <path d="M-100,200 Q200,50 600,250 T800,100" fill="none" stroke="#1a1a1a" stroke-width="2" filter="url(#glitch-displacement)" />
        <path d="M-100,220 Q200,70 600,270 T800,120" fill="none" stroke="#2a1b3d" stroke-width="1" opacity="0.5" />
        
        <!-- Central Orb -->
        <circle cx="260" cy="260" r="160" fill="#000000" />
        <circle cx="260" cy="260" r="150" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 8" opacity="0.6" />
        <circle cx="260" cy="260" r="100" fill="#111111" filter="url(#blur-medium)" />
        
        <!-- Glitch Text -->
        <text x="260" y="260" font-family="monospace" font-size="16" fill="#d4af37" text-anchor="middle" transform="rotate(-12 260 260)" letter-spacing="2" font-weight="bold" opacity="0.9">
          MEMORY DATA CORRUPTED
        </text>
        
        <!-- Decorative Glitch Lines -->
        <rect x="100" y="150" width="320" height="2" fill="#ffffff" opacity="0.1" />
        <rect x="120" y="350" width="280" height="1" fill="#ffffff" opacity="0.2" />
        
        <!-- Corner Accents -->
        <circle cx="180" cy="180" r="3" fill="#d4af37" />
        <circle cx="340" cy="340" r="3" fill="#d4af37" />
      </g>
      
      <!-- Frame Overlay Grid -->
      <path d="M0,0 L520,520 M520,0 L0,520" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </g>

    <!-- Visual Connector Dashed Line -->
    <path d="M580,400 L630,400" stroke="#d4af37" stroke-width="1" stroke-dasharray="2 4" opacity="0.5" />
    <circle cx="580" cy="400" r="2" fill="#d4af37" opacity="0.5" />

    <!-- Small Info Block near Art -->
    <g transform="translate(640, 680)">
      <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" letter-spacing="1">
        FREE ADMISSION FOR MEMBERS
      </text>
    </g>

    <!-- Action Button: Reserve Tickets (Anchored Bottom Right of Art Area, but aligned with grid) -->
    <g transform="translate(860, 680)">
      <!-- Button Base -->
      <rect x="0" y="0" width="280" height="60" fill="#ffffff" />
      <!-- Button Text -->
      <text x="140" y="36" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="1.5">
        RESERVE TICKETS
      </text>
      <!-- Hover State Hint / Gold Accent -->
      <line x1="0" y1="60" x2="280" y2="60" stroke="#d4af37" stroke-width="2" />
      
      <!-- Arrow -->
      <path d="M295,25 L310,30 L295,35" fill="none" stroke="#d4af37" stroke-width="1.5" />
    </g>
  </g>

  <!-- FOOTER (Rigid Bottom Margin) -->
  <g id="footer" transform="translate(80, 740)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555">
      THE VOID INSTITUTE • 1000 ART DISTRICT BLVD • NEW YORK, NY 10013
    </text>
    <text x="1200" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="end">
      OPEN DAILY 11AM — 7PM
    </text>
  </g>

</svg>