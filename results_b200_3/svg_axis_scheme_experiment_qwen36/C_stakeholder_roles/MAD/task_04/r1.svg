<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0c15"/>
      <stop offset="100%" stop-color="#1a1625"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>

    <!-- Product Color Palettes -->
    <linearGradient id="air-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#80deea"/>
    </linearGradient>
    <radialGradient id="air-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80deea" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#80deea" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="studio-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
    <radialGradient id="studio-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb74d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffb74d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nocturne-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e1bee7"/>
      <stop offset="100%" stop-color="#9c27b0"/>
    </linearGradient>
    <radialGradient id="nocturne-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9c27b0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9c27b0" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow-text">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- DISTINCT HEADPHONE GRAPHICS -->
    
    <!-- 1. AIR: Thin, matte strokes, minimal geometry -->
    <g id="art-air" transform="translate(0, 0)">
      <!-- Thin Headband -->
      <path d="M30 60 C30 15, 90 15, 90 60" fill="none" stroke="#80deea" stroke-width="4" stroke-linecap="round"/>
      <!-- Minimal Earcups -->
      <rect x="22" y="55" width="12" height="25" rx="4" fill="#e0f7fa" opacity="0.9"/>
      <rect x="86" y="55" width="12" height="25" rx="4" fill="#e0f7fa" opacity="0.9"/>
      <!-- Detail lines -->
      <path d="M34 60 L34 70" stroke="#80deea" stroke-width="1" opacity="0.5"/>
      <path d="M94 60 L94 70" stroke="#80deea" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- 2. STUDIO: Solid, structural silhouettes, metallic feel -->
    <g id="art-studio" transform="translate(0, 0)">
      <!-- Thick Structural Headband -->
      <path d="M30 60 C30 10, 90 10, 90 60" fill="none" stroke="#ffb74d" stroke-width="8" stroke-linecap="round"/>
      <!-- Rigid Earcups -->
      <rect x="20" y="50" width="16" height="32" rx="6" fill="#ffe0b2"/>
      <rect x="84" y="50" width="16" height="32" rx="6" fill="#ffe0b2"/>
      <!-- Technical detail -->
      <line x1="28" y1="58" x2="36" y2="58" stroke="#ffb74d" stroke-width="2"/>
      <line x1="88" y1="58" x2="96" y2="58" stroke="#ffb74d" stroke-width="2"/>
    </g>

    <!-- 3. NOCTURNE: Plush, larger, soft shadows -->
    <g id="art-nocturne" transform="translate(0, 0)">
      <!-- Plush Headband -->
      <path d="M30 60 C30 10, 90 10, 90 60" fill="none" stroke="#9c27b0" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
      <path d="M30 60 C30 10, 90 10, 90 60" fill="none" stroke="#e1bee7" stroke-width="4" stroke-linecap="round"/>
      <!-- Large, Soft Earcups -->
      <rect x="18" y="45" width="20" height="40" rx="10" fill="#e1bee7"/>
      <rect x="82" y="45" width="20" height="40" rx="10" fill="#e1bee7"/>
      <!-- Cushion Depth -->
      <path d="M38 50 Q45 55 38 80" stroke="#9c27b0" stroke-width="1" fill="none" opacity="0.3"/>
      <path d="M82 50 Q75 55 82 80" stroke="#9c27b0" stroke-width="1" fill="none" opacity="0.3"/>
    </g>

  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;display=swap');
    
    text {
      font-family: 'Inter', -apple-system, sans-serif;
    }
    
    .brand-text {
      font-weight: 700;
      letter-spacing: 2px;
    }
    
    .section-header {
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 1.5px;
      fill: #6c757d;
      text-anchor: end;
      text-transform: uppercase;
    }

    .product-name {
      font-size: 28px;
      font-weight: 700;
      text-anchor: middle;
      fill: #ffffff;
    }

    .price {
      font-size: 24px;
      font-weight: 300;
      text-anchor: middle;
      fill: #e9ecef;
    }

    .feature-text {
      font-size: 14px;
      fill: #adb5bd;
    }

    .feature-text-bold {
      font-size: 14px;
      fill: #e9ecef;
      font-weight: 600;
    }

    .btn-text {
      font-size: 14px;
      font-weight: 600;
      text-anchor: middle;
      fill: #ffffff;
      pointer-events: none;
    }

    .recommended-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-anchor: middle;
      fill: #ffffff;
    }
  </style>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg-gradient)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>

  <!-- Header Section -->
  <g transform="translate(0, 60)">
    <text x="640" y="0" class="brand-text" font-size="24" fill="#ffffff" text-anchor="middle">AURALITH</text>
    <text x="640" y="30" font-size="16" fill="#adb5bd" text-anchor="middle" font-weight="300">Engineered Silence. Pure Sound.</text>
  </g>

  <!-- Horizontal Comparison Lines (Visual Grid) -->
  <g stroke="#2c2f33" stroke-width="1" stroke-dasharray="4 4" opacity="0.5">
    <!-- Alignment for Color Row -->
    <line x1="100" y1="465" x2="1180" y2="465" /> 
    <!-- Alignment for Battery Row -->
    <line x1="100" y1="555" x2="1180" y2="555" /> 
  </g>

  <!-- Shared Specification Labels (Left Aligned) -->
  <g transform="translate(80, 0)">
    <!-- Color Label -->
    <text x="0" y="469" class="section-header">COLORS</text>
    <!-- Battery Label -->
    <text x="0" y="559" class="section-header">BATTERY</text>
  </g>

  <!-- Comparison Columns Container -->
  <!-- 
    Rigid Grid: 
    All cards aligned to Y=180.
    Heights: 600px (ending at Y=780).
    Widths: Air(280), Studio(280), Nocturne(280).
    X positions calculated for centering: 180, 500, 820.
  -->
  <g transform="translate(0, 180)">
    
    <!-- ========================================== -->
    <!-- PRODUCT 1: AIR -->
    <!-- ========================================== -->
    <g id="product-air" transform="translate(180, 0)">
      <!-- Glassmorphism Card Background -->
      <rect x="0" y="0" width="280" height="600" rx="20" fill="#1e1b24" fill-opacity="0.7" stroke="#2c2f33" stroke-width="1" backdrop-filter="blur(10px)"/>
      
      <!-- Visual Area -->
      <circle cx="140" cy="110" r="80" fill="url(#air-glow)"/>
      <!-- Distinct Art: Thin, minimal -->
      <g transform="translate(90, 60) scale(1.2)">
        <use href="#art-air"/>
      </g>

      <!-- Name & Price -->
      <text x="140" y="220" class="product-name">Air</text>
      <text x="140" y="250" class="price">$249</text>
      
      <!-- Description -->
      <text x="140" y="280" font-size="12" fill="#adb5bd" text-anchor="middle">Lightweight everyday listening.</text>

      <!-- Colors (Aligned to Y=285 relative to card, 465 global) -->
      <g transform="translate(140, 285)">
        <circle cx="-40" cy="0" r="6" fill="#ffffff"/>
        <circle cx="-20" cy="0" r="6" fill="#80deea"/>
        <circle cx="0" cy="0" r="6" fill="#263238"/>
        <text x="20" y="4" font-size="10" fill="#6c757d">3 Colors</text>
      </g>

      <!-- Features -->
      <g transform="translate(30, 370)">
        <text x="0" y="0" class="feature-text">• Ultra-light 220g chassis</text>
        <text x="0" y="25" class="feature-text">• Seamless multipoint</text>
        <text x="0" y="50" class="feature-text">• 30h Battery Life</text>
      </g>

      <!-- CTA (Bottom Anchored) -->
      <rect x="30" y="520" width="220" height="48" rx="24" fill="#2c2f33" stroke="#495057"/>
      <text x="140" y="549" class="btn-text" fill="#e9ecef">Shop Air</text>
    </g>

    <!-- ========================================== -->
    <!-- PRODUCT 2: STUDIO (RECOMMENDED) -->
    <!-- ========================================== -->
    <g id="product-studio" transform="translate(500, 0)">
      <!-- Glassmorphism Card Background (Highlighted) -->
      <rect x="0" y="0" width="280" height="600" rx="20" fill="#25212e" fill-opacity="0.85" stroke="#ffb74d" stroke-width="1.5" backdrop-filter="blur(10px)"/>
      
      <!-- Recommended Badge (High Opacity, Top-Left) -->
      <rect x="20" y="20" width="100" height="24" rx="12" fill="#ffb74d" filter="url(#shadow-sm)"/>
      <text x="70" y="36" class="recommended-badge">RECOMMENDED</text>

      <!-- Visual Area -->
      <circle cx="140" cy="110" r="80" fill="url(#studio-glow)"/>
      <!-- Distinct Art: Solid, structural -->
      <g transform="translate(90, 60) scale(1.2)">
        <use href="#art-studio"/>
      </g>

      <!-- Name & Price -->
      <text x="140" y="220" class="product-name" fill="#ffffff">Studio</text>
      <text x="140" y="250" class="price">$399</text>
      
      <!-- Description -->
      <text x="140" y="280" font-size="12" fill="#adb5bd" text-anchor="middle">Accurate sound for creative work.</text>

      <!-- Colors (Aligned to Y=285 relative to card, 465 global) -->
      <g transform="translate(140, 285)">
        <circle cx="-40" cy="0" r="6" fill="#fff3e0"/>
        <circle cx="-20" cy="0" r="6" fill="#ffb74d"/>
        <circle cx="0" cy="0" r="6" fill="#424242"/>
        <circle cx="20" cy="0" r="6" fill="#263238"/>
        <text x="40" y="4" font-size="10" fill="#6c757d">4 Colors</text>
      </g>

      <!-- Features -->
      <g transform="translate(30, 370)">
        <text x="0" y="0" class="feature-text-bold">• Flat-response 40mm drivers</text>
        <text x="0" y="25" class="feature-text">• Reference grade monitoring</text>
        <text x="0" y="50" class="feature-text">• 40h Battery Life</text>
      </g>

      <!-- CTA (Increased Weight) -->
      <rect x="30" y="520" width="220" height="48" rx="24" fill="#ffb74d" filter="url(#shadow-sm)"/>
      <text x="140" y="549" class="btn-text" fill="#2d1b06">Shop Studio</text>
    </g>

    <!-- ========================================== -->
    <!-- PRODUCT 3: NOCTURNE -->
    <!-- ========================================== -->
    <g id="product-nocturne" transform="translate(820, 0)">
      <!-- Glassmorphism Card Background -->
      <rect x="0" y="0" width="280" height="600" rx="20" fill="#1e1b24" fill-opacity="0.7" stroke="#2c2f33" stroke-width="1" backdrop-filter="blur(10px)"/>
      
      <!-- Visual Area -->
      <circle cx="140" cy="110" r="80" fill="url(#nocturne-glow)"/>
      <!-- Distinct Art: Plush, soft -->
      <g transform="translate(90, 60) scale(1.2)">
        <use href="#art-nocturne"/>
      </g>

      <!-- Name & Price -->
      <text x="140" y="220" class="product-name">Nocturne</text>
      <text x="140" y="250" class="price">$549</text>
      
      <!-- Description -->
      <text x="140" y="280" font-size="12" fill="#adb5bd" text-anchor="middle">Flagship immersive listening.</text>

      <!-- Colors (Aligned to Y=285 relative to card, 465 global) -->
      <g transform="translate(140, 285)">
        <circle cx="-40" cy="0" r="6" fill="#4a148c"/>
        <circle cx="-20" cy="0" r="6" fill="#9c27b0"/>
        <circle cx="0" cy="0" r="6" fill="#212121"/>
        <text x="20" y="4" font-size="10" fill="#6c757d">3 Colors</text>
      </g>

      <!-- Features -->
      <g transform="translate(30, 370)">
        <text x="0" y="0" class="feature-text">• Hybrid ANC Pro</text>
        <text x="0" y="25" class="feature-text">• Spatial Audio Engine</text>
        <text x="0" y="50" class="feature-text">• 50h Battery Life</text>
      </g>

      <!-- CTA (Bottom Anchored) -->
      <rect x="30" y="520" width="220" height="48" rx="24" fill="#2c2f33" stroke="#495057"/>
      <text x="140" y="549" class="btn-text" fill="#e9ecef">Shop Nocturne</text>
    </g>

  </g>

  <!-- Footer -->
  <text x="640" y="760" font-size="12" fill="#6c757d" text-anchor="middle">© 2024 Auralith Audio Systems. All specifications subject to change.</text>

</svg>