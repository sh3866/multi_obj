<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700&amp;display=swap');
      text { font-family: 'Manrope', sans-serif; }
      
      /* Typography */
      .brand { font-size: 28px; font-weight: 800; letter-spacing: 6px; fill: #ffffff; }
      .tagline { font-size: 14px; font-weight: 500; letter-spacing: 1px; fill: #8b9bb4; }
      .product-name { font-size: 32px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .product-price { font-size: 24px; font-weight: 300; fill: #ffffff; text-anchor: middle; }
      .product-desc { font-size: 13px; font-weight: 400; fill: #94a3b8; text-anchor: middle; }
      .feature { font-size: 14px; font-weight: 400; fill: #cbd5e1; }
      .spec-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #475569; }
      
      /* UI Elements */
      .btn-text { font-size: 14px; font-weight: 700; letter-spacing: 0.5px; text-anchor: middle; pointer-events: none; }
      .badge-text { font-size: 10px; font-weight: 800; letter-spacing: 1px; text-anchor: middle; fill: #1a1625; }
      .color-text { font-size: 10px; font-weight: 500; fill: #64748b; }
    </style>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0c15"/>
      <stop offset="100%" stop-color="#16121e"/>
    </linearGradient>
    
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b24"/>
      <stop offset="100%" stop-color="#15121a"/>
    </linearGradient>

    <linearGradient id="card-grad-highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2535"/>
      <stop offset="100%" stop-color="#1f1b28"/>
    </linearGradient>

    <!-- Product Glows -->
    <radialGradient id="glow-air" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fd1c5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-studio" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6ad55" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f6ad55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-nocturne" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d53f8c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d53f8c" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Patterns -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.02"/>
    </pattern>

    <!-- Headphone Graphic (Refined) -->
    <g id="hp-visual">
      <!-- Headband -->
      <path d="M25 45 C25 5, 75 5, 75 45" fill="none" stroke-width="6" stroke-linecap="round"/>
      <!-- Left Earcup -->
      <rect x="18" y="40" width="14" height="28" rx="7" fill-opacity="1"/>
      <!-- Right Earcup -->
      <rect x="68" y="40" width="14" height="28" rx="7" fill-opacity="1"/>
      <!-- Cushion details -->
      <path d="M32 45 L32 63" stroke="#000" stroke-opacity="0.1" stroke-width="1"/>
      <path d="M68 45 L68 63" stroke="#000" stroke-opacity="0.1" stroke-width="1"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg-grad)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>

  <!-- ================= HEADER ================= -->
  <g transform="translate(640, 70)">
    <text x="0" y="0" class="brand" text-anchor="middle">AURALITH</text>
    <text x="0" y="30" class="tagline" text-anchor="middle">ENGINEERED SILENCE. PURE SOUND.</text>
  </g>

  <!-- ================= MAIN CONTAINER ================= -->
  <g transform="translate(0, 130)">
    
    <!-- Alignment Connectors (Visual Guide) -->
    <g stroke="#334155" stroke-width="1" stroke-dasharray="2 4" opacity="0.5">
      <!-- Battery Line -->
      <line x1="220" y1="340" x2="1060" y2="340" />
      <!-- Weight Line -->
      <line x1="220" y1="580" x2="1060" y2="580" />
    </g>

    <!-- Left Axis Labels -->
    <g transform="translate(160, 0)">
      <text x="0" y="345" class="spec-label" text-anchor="end">BATTERY</text>
      <text x="0" y="585" class="spec-label" text-anchor="end">WEIGHT</text>
      <!-- Axis line -->
      <line x1="15" y1="310" x2="15" y2="610" stroke="#334155" stroke-width="1"/>
    </g>

    <!-- ================= PRODUCT 1: AIR ================= -->
    <g transform="translate(220, 0)">
      <!-- Card -->
      <rect x="0" y="0" width="240" height="640" rx="20" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
      
      <!-- Visual -->
      <circle cx="120" cy="90" r="70" fill="url(#glow-air)"/>
      <g transform="translate(75, 45) scale(1.1)">
        <use href="#hp-visual" stroke="#4fd1c5" fill="#b2f5ea"/>
      </g>

      <!-- Info -->
      <text x="120" y="200" class="product-name">Air</text>
      <text x="120" y="230" class="product-price">$249</text>
      <text x="120" y="260" class="product-desc">Lightweight everyday listening.</text>

      <!-- Colors -->
      <g transform="translate(85, 290)">
        <circle cx="0" cy="0" r="6" fill="#ffffff"/>
        <circle cx="16" cy="0" r="6" fill="#4fd1c5"/>
        <circle cx="32" cy="0" r="6" fill="#2d3748"/>
        <text x="48" y="4" class="color-text">3 Colors</text>
      </g>

      <!-- Features List -->
      <g transform="translate(30, 360)">
        <text x="0" y="0" class="feature">• 30 Hours Battery</text>
        <text x="0" y="24" class="feature">• Ultra-light 220g chassis</text>
        <text x="0" y="48" class="feature">• Seamless multipoint</text>
      </g>

      <!-- Button -->
      <rect x="30" y="520" width="180" height="48" rx="24" fill="#1e293b" stroke="#334155"/>
      <text x="120" y="548" class="btn-text" fill="#e2e8f0">Shop Air</text>
    </g>


    <!-- ================= PRODUCT 2: STUDIO (RECOMMENDED) ================= -->
    <g transform="translate(520, -30)">
      <!-- Card (Elevated) -->
      <rect x="0" y="0" width="280" height="700" rx="20" fill="url(#card-grad-highlight)" stroke="#f6ad55" stroke-width="1.5" filter="url(#shadow-lg)"/>
      
      <!-- Badge -->
      <rect x="80" y="-20" width="120" height="28" rx="14" fill="#f6ad55" filter="url(#shadow-sm)"/>
      <text x="140" y="-2" class="badge-text">RECOMMENDED</text>

      <!-- Visual -->
      <circle cx="140" cy="110" r="80" fill="url(#glow-studio)"/>
      <g transform="translate(85, 60) scale(1.2)">
        <use href="#hp-visual" stroke="#f6ad55" fill="#fefcbf"/>
      </g>

      <!-- Info -->
      <text x="140" y="220" class="product-name">Studio</text>
      <text x="140" y="250" class="product-price">$399</text>
      <text x="140" y="280" class="product-desc">Accurate sound for creative work.</text>

      <!-- Colors -->
      <g transform="translate(105, 310)">
        <circle cx="0" cy="0" r="6" fill="#fff3e0"/>
        <circle cx="16" cy="0" r="6" fill="#f6ad55"/>
        <circle cx="32" cy="0" r="6" fill="#4a5568"/>
        <circle cx="48" cy="0" r="6" fill="#1a202c"/>
        <text x="64" y="4" class="color-text">4 Colors</text>
      </g>

      <!-- Features List -->
      <g transform="translate(30, 380)">
        <text x="0" y="0" class="feature" font-weight="600" fill="#fff">• 40 Hours Battery</text>
        <text x="0" y="24" class="feature">• Flat-response 40mm drivers</text>
        <text x="0" y="48" class="feature">• Reference grade monitoring</text>
      </g>

      <!-- Button -->
      <rect x="30" y="560" width="220" height="48" rx="24" fill="#f6ad55" filter="url(#shadow-sm)"/>
      <text x="140" y="588" class="btn-text" fill="#1a1625">Shop Studio</text>
    </g>


    <!-- ================= PRODUCT 3: NOCTURNE ================= -->
    <g transform="translate(860, 0)">
      <!-- Card -->
      <rect x="0" y="0" width="240" height="640" rx="20" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
      
      <!-- Visual -->
      <circle cx="120" cy="90" r="70" fill="url(#glow-nocturne)"/>
      <g transform="translate(75, 45) scale(1.1)">
        <use href="#hp-visual" stroke="#d53f8c" fill="#fed7e2"/>
      </g>

      <!-- Info -->
      <text x="120" y="200" class="product-name">Nocturne</text>
      <text x="120" y="230" class="product-price">$549</text>
      <text x="120" y="260" class="product-desc">Flagship immersive listening.</text>

      <!-- Colors -->
      <g transform="translate(85, 290)">
        <circle cx="0" cy="0" r="6" fill="#4a148c"/>
        <circle cx="16" cy="0" r="6" fill="#d53f8c"/>
        <circle cx="32" cy="0" r="6" fill="#1a202c"/>
        <text x="48" y="4" class="color-text">3 Colors</text>
      </g>

      <!-- Features List -->
      <g transform="translate(30, 360)">
        <text x="0" y="0" class="feature">• 50 Hours Battery</text>
        <text x="0" y="24" class="feature">• Hybrid ANC Pro</text>
        <text x="0" y="48" class="feature">• Spatial Audio Engine</text>
      </g>

      <!-- Button -->
      <rect x="30" y="520" width="180" height="48" rx="24" fill="#1e293b" stroke="#334155"/>
      <text x="120" y="548" class="btn-text" fill="#e2e8f0">Shop Nocturne</text>
    </g>

  </g>

  <!-- Footer -->
  <text x="640" y="760" font-size="11" fill="#475569" text-anchor="middle" letter-spacing="0.5">© 2024 Auralith Audio Systems. Specifications subject to change.</text>

</svg>