<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#141418" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <radialGradient id="grad-light" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="grad-art-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1b3d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#162b3a" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="blur-large" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>

    <filter id="blur-med" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" />
    </filter>

    <filter id="noise" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="screen" />
    </filter>

    <!-- Patterns -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="800" fill="url(#grad-bg)" />
  <rect width="1280" height="800" fill="url(#grid-pattern)" />

  <!-- Abstract Artwork / Atmospheric Background (Fixed Positioning) -->
  <g id="artwork-layer">
    <!-- Large Blurred Orbs -->
    <circle cx="150" cy="150" r="300" fill="#2a1b3d" filter="url(#blur-large)" opacity="0.5" />
    <circle cx="1100" cy="650" r="400" fill="#162b3a" filter="url(#blur-large)" opacity="0.4" />
    <circle cx="500" cy="300" r="250" fill="#3d1b1b" filter="url(#blur-large)" opacity="0.2" />
    
    <!-- Light Overlay -->
    <rect width="1280" height="800" fill="url(#grad-light)" />
    
    <!-- Texture Noise -->
    <rect width="1280" height="800" filter="url(#noise)" pointer-events="none" />
  </g>

  <!-- Main Layout Grid Lines (Subtle) -->
  <line x1="80" y1="0" x2="80" y2="800" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <line x1="1200" y1="0" x2="1200" y2="800" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- HEADER -->
  <g id="header" transform="translate(80, 60)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#888888">
      THE VOID INSTITUTE OF CONTEMPORARY ART
    </text>
    <text x="1120" y="0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="1" fill="#aaaaaa" text-anchor="end">
      2024 SEASON
    </text>
  </g>

  <!-- LEFT COLUMN: Exhibition Identity & Curatorial -->
  <g id="left-content" transform="translate(80, 160)">
    
    <!-- Artist Name -->
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="4" fill="#d4af37">
      ELARA VANCE
    </text>

    <!-- Main Title -->
    <g transform="translate(0, 30)">
      <text x="0" y="0" font-family="'Times New Roman', Times, serif" font-size="84" font-weight="400" fill="#ffffff">
        ECHOES
      </text>
      <text x="0" y="70" font-family="'Times New Roman', Times, serif" font-size="84" font-weight="400" fill="#e0e0e0" font-style="italic">
        of the
      </text>
      <text x="0" y="140" font-family="'Times New Roman', Times, serif" font-size="84" font-weight="400" fill="#ffffff">
        UNSEEN
      </text>
    </g>

    <!-- Curatorial Statement -->
    <g transform="translate(0, 310)">
      <line x1="0" y1="-10" x2="40" y2="-10" stroke="#d4af37" stroke-width="2" />
      <text x="0" y="20" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c0c0c0">
        <tspan x="0" dy="0">An immersive exploration of memory’s fragility.</tspan>
        <tspan x="0" dy="26">Vance fragments perception, inviting viewers to navigate</tspan>
        <tspan x="0" dy="26">the liminal spaces between what is remembered</tspan>
        <tspan x="0" dy="26">and what has been lost to time.</tspan>
      </text>
    </g>

    <!-- Dates & Location -->
    <g transform="translate(0, 460)">
      <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">
        OCT 15 — DEC 30, 2024
      </text>
      <text x="0" y="24" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#999999">
        THE GRAND HALL, 4TH FLOOR
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Visual Art & Action -->
  <g id="right-content" transform="translate(720, 120)">
    
    <!-- Decorative Frame / Art Container -->
    <g transform="translate(0, 0)">
      <!-- Outer Frame -->
      <rect x="0" y="0" width="440" height="520" fill="#000000" stroke="#333333" stroke-width="1" />
      
      <!-- Inner Abstract Art -->
      <g clip-path="url(#clip-art)">
        <defs>
          <clipPath id="clip-art">
            <rect x="0" y="0" width="440" height="520" />
          </clipPath>
        </defs>
        
        <!-- Art Background -->
        <rect x="0" y="0" width="440" height="520" fill="#080808" />
        
        <!-- Abstract Shapes -->
        <path d="M-50,100 Q150,250 450,50" fill="none" stroke="#444444" stroke-width="1.5" />
        <path d="M-50,120 Q150,270 450,70" fill="none" stroke="#333333" stroke-width="1" />
        
        <circle cx="220" cy="260" r="140" fill="none" stroke="#d4af37" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.6"/>
        <circle cx="220" cy="260" r="100" fill="#1a1a1a" filter="url(#blur-med)" opacity="0.8" />
        
        <!-- Glitch Elements -->
        <rect x="100" y="200" width="240" height="2" fill="#ffffff" opacity="0.1" />
        <rect x="120" y="320" width="200" height="1" fill="#ffffff" opacity="0.15" />
        <circle cx="300" cy="150" r="2" fill="#d4af37" />
        <circle cx="140" cy="380" r="3" fill="#d4af37" />
        
        <!-- Text inside Art (Abstract) -->
        <text x="220" y="260" font-family="monospace" font-size="10" fill="#555555" text-anchor="middle" transform="rotate(-15 220 260)">
          MEMORY DATA CORRUPTED
        </text>
      </g>
      
      <!-- Overlay Grid on Art -->
      <path d="M0,0 L440,520 M440,0 L0,520" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </g>

    <!-- Info Block near Art -->
    <g transform="translate(0, 540)">
      <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#888888" letter-spacing="1">
        FREE ADMISSION FOR MEMBERS
      </text>
    </g>

    <!-- Action Button: Reserve Tickets -->
    <g transform="translate(0, 580)">
      <rect x="0" y="0" width="280" height="60" fill="#ffffff" />
      <text x="140" y="36" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="1.5">
        RESERVE TICKETS
      </text>
      
      <!-- Hover State Hint (Visual only) -->
      <rect x="0" y="58" width="280" height="2" fill="#d4af37" />
      
      <!-- Arrow -->
      <path d="M290,20 L310,30 L290,40" fill="none" stroke="#d4af37" stroke-width="2" />
    </g>
  </g>

  <!-- FOOTER -->
  <g id="footer" transform="translate(80, 740)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666">
      THE VOID INSTITUTE • 1000 ART DISTRICT BLVD • NEW YORK, NY 10013
    </text>
    <text x="1120" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="end">
      OPEN DAILY 11AM — 7PM
    </text>
  </g>

  <!-- Floating Decorative Elements -->
  <circle cx="680" cy="400" r="1" fill="#ffffff" opacity="0.5" />
  <rect x="690" y="400" width="20" height="1" fill="#ffffff" opacity="0.3" />
</svg>