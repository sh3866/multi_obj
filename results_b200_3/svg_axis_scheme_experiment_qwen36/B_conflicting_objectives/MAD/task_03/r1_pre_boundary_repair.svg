<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="tempLineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="rainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="alertGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Patterns -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="1280" height="800" fill="url(#skyGrad)" />
  <rect width="1280" height="800" fill="url(#grid)" />

  <!-- Decorative Map Background Faint -->
  <g transform="translate(850, 250) scale(1.2)" opacity="0.08">
     <path d="M0,0 Q100,-50 200,0 T400,0 L350,200 Q200,250 50,200 Z" fill="#e2e8f0" />
     <path d="M50,200 Q100,250 150,200 L150,350 L50,350 Z" fill="#e2e8f0" />
  </g>

  <!-- ================= HEADER ================= -->
  <g transform="translate(60, 60)">
    <text x="0" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="2">ANNUAL ENVIRONMENTAL REPORT</text>
    <text x="0" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="42" font-weight="800" letter-spacing="-1">City Climate Brief <tspan fill="#38bdf8">2035</tspan></text>
    <text x="0" y="75" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="18" font-weight="300">Port Aurora: Coastal Resilience &amp; Thermal Shift Analysis</text>
    
    <!-- Summary Box -->
    <g transform="translate(0, 100)">
      <rect width="580" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="20" y="28" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="14" font-weight="500">
        <tspan x="20" dy="0">EXECUTIVE SUMMARY</tspan>
      </text>
      <text x="20" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="400">
        <tspan x="20" dy="0">Port Aurora is experiencing a 1.4°C baseline temperature rise, with</tspan>
        <tspan x="20" dy="16">precipitation becoming increasingly concentrated and flash floods</tspan>
      </text>
      <text x="20" y="84" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="400">
        <tspan x="20" dy="0">threatening the historic districts. Immediate adaptation is required.</tspan>
      </text>
    </g>
  </g>

  <!-- ================= HEADLINE INDICATORS ================= -->
  <g transform="translate(720, 60)">
    <!-- Card 1: Temp -->
    <g transform="translate(0, 0)">
      <rect width="160" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="24" r="12" fill="#ef4444" opacity="0.2" />
      <path d="M24 16 L24 24 L30 24" stroke="#ef4444" stroke-width="2" fill="none" />
      <text x="48" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AVG TEMP RISE</text>
      <text x="24" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="36" font-weight="800">+1.4<tspan font-size="20" fill="#ef4444">°C</tspan></text>
      <text x="24" y="95" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">vs. 2020 Baseline</text>
    </g>

    <!-- Card 2: Rain -->
    <g transform="translate(180, 0)">
      <rect width="160" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="24" r="12" fill="#3b82f6" opacity="0.2" />
      <path d="M24 18 L24 26 M20 22 L28 22" stroke="#3b82f6" stroke-width="2" fill="none" />
      <text x="48" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ANNUAL RAINFALL</text>
      <text x="24" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="36" font-weight="800">+12<tspan font-size="20" fill="#3b82f6">%</tspan></text>
      <text x="24" y="95" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Higher intensity</text>
    </g>

    <!-- Card 3: Sea Level -->
    <g transform="translate(360, 0)">
      <rect width="160" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="24" r="12" fill="#06b6d4" opacity="0.2" />
      <path d="M18 24 Q 24 16 30 24" stroke="#06b6d4" stroke-width="2" fill="none" />
      <text x="48" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SEA LEVEL RISE</text>
      <text x="24" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="36" font-weight="800">+8<tspan font-size="20" fill="#06b6d4">cm</tspan></text>
      <text x="24" y="95" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Accelerating trend</text>
    </g>
  </g>

  <!-- ================= CHART 1: TEMPERATURE TREND ================= -->
  <g transform="translate(60, 280)">
    <text x="0" y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Monthly Temperature Trend</text>
    <text x="0" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Averaged anomaly over last 10 years</text>
    
    <!-- Chart Grid -->
    <g transform="translate(0, 50)">
      <!-- Y Axis Lines -->
      <path d="M0 100 L580 100" stroke="#334155" stroke-width="1" />
      <path d="M0 200 L580 200" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
      <path d="M0 300 L580 300" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
      
      <!-- Y Labels -->
      <text x="-10" y="105" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">+2.0°</text>
      <text x="-10" y="205" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">+1.0°</text>
      <text x="-10" y="305" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">0.0°</text>

      <!-- Area Fill -->
      <path d="M0 300 L40 280 L80 260 L120 220 L160 180 L200 140 L240 110 L280 90 L320 90 L360 120 L400 180 L440 240 L480 260 L520 290 L560 300 L560 300 L0 300 Z" fill="url(#alertGrad)" />
      
      <!-- Line -->
      <path d="M0 300 L40 280 L80 260 L120 220 L160 180 L200 140 L240 110 L280 90 L320 90 L360 120 L400 180 L440 240 L480 260 L520 290 L560 300" fill="none" stroke="url(#tempLineGrad)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
      
      <!-- Data Points (Selected) -->
      <circle cx="280" cy="90" r="4" fill="#ef4444" stroke="#fff" stroke-width="2" />
      <text x="280" y="75" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">Peak: +2.1°</text>

      <!-- X Labels (Opacity set to 100% white) -->
      <text x="0" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">J</text>
      <text x="40" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">F</text>
      <text x="80" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">M</text>
      <text x="120" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">A</text>
      <text x="160" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">M</text>
      <text x="200" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">J</text>
      <text x="240" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">J</text>
      <text x="280" y="330" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="bold">A</text>
      <text x="320" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">S</text>
      <text x="360" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">O</text>
      <text x="400" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">N</text>
      <text x="440" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">D</text>
    </g>
  </g>

  <!-- ================= CHART 2: RAINFALL / FLOOD RISK ================= -->
  <!-- Resized to full width -->
  <g transform="translate(660, 280)">
    <text x="0" y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Precipitation Intensity</text>
    <text x="0" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Shift towards concentrated flood events</text>
    
    <g transform="translate(20, 50)">
      <!-- Bars resized -->
      <!-- Jan -->
      <rect x="0" y="120" width="32" height="80" fill="url(#rainGrad)" rx="2" />
      <text x="16" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">J</text>
      <!-- Feb -->
      <rect x="40" y="140" width="32" height="60" fill="url(#rainGrad)" rx="2" />
      <text x="56" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">F</text>
      <!-- Mar -->
      <rect x="80" y="160" width="32" height="40" fill="url(#rainGrad)" rx="2" />
      <text x="96" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">M</text>
      <!-- Apr -->
      <rect x="120" y="180" width="32" height="20" fill="url(#rainGrad)" rx="2" />
      <text x="136" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">A</text>
      <!-- May -->
      <rect x="160" y="190" width="32" height="10" fill="url(#rainGrad)" rx="2" />
      <text x="176" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">M</text>
      <!-- Jun -->
      <rect x="200" y="195" width="32" height="5" fill="url(#rainGrad)" rx="2" />
      <text x="216" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">J</text>
      <!-- Jul -->
      <rect x="240" y="198" width="32" height="2" fill="url(#rainGrad)" rx="2" />
      <text x="256" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">J</text>
      <!-- Aug (High Risk) -->
      <rect x="280" y="90" width="32" height="110" fill="url(#rainGrad)" rx="2" filter="url(#glow)" />
      <text x="296" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">A</text>
      <!-- Sep -->
      <rect x="320" y="150" width="32" height="50" fill="url(#rainGrad)" rx="2" />
      <text x="336" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">S</text>
      <!-- Oct -->
      <rect x="360" y="110" width="32" height="90" fill="url(#rainGrad)" rx="2" />
      <text x="376" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">O</text>
      <!-- Nov -->
      <rect x="400" y="100" width="32" height="100" fill="url(#rainGrad)" rx="2" />
      <text x="416" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">N</text>
      <!-- Dec -->
      <rect x="440" y="130" width="32" height="70" fill="url(#rainGrad)" rx="2" />
      <text x="456" y="215" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">D</text>

      <!-- Axis Line -->
      <line x1="0" y1="200" x2="480" y2="200" stroke="#334155" stroke-width="1" />
      
      <!-- Callout for Aug -->
      <path d="M296 80 L296 90" stroke="#94a3b8" stroke-width="1" />
      <text x="296" y="70" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Storm Surge Event</text>
    </g>
  </g>

  <!-- ================= RISK DISTRICTS ================= -->
  <g transform="translate(60, 650)">
    <text x="0" y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="600">High-Risk Districts</text>
    
    <!-- District 1 -->
    <g transform="translate(0, 20)">
      <rect width="340" height="40" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="20" cy="20" r="4" fill="#ef4444" />
      <text x="35" y="25" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Old Port Warehouse</text>
      <text x="320" y="25" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">Critical</text>
    </g>
    
    <!-- District 2 -->
    <g transform="translate(0, 65)">
      <rect width="340" height="40" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="20" cy="20" r="4" fill="#f97316" />
      <text x="35" y="25" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="500">North Bay Residential</text>
      <text x="320" y="25" fill="#fdba74" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">High</text>
    </g>

    <!-- District 3 -->
    <g transform="translate(0, 110)">
      <rect width="340" height="40" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="20" cy="20" r="4" fill="#eab308" />
      <text x="35" y="25" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Sunset Marina</text>
      <text x="320" y="25" fill="#fde047" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">Moderate</text>
    </g>
  </g>

  <!-- ================= ACTION PLAN ================= -->
  <!-- Relocated to bottom right, moved shadow/fill, added icons -->
  <g transform="translate(440, 650)">
     <!-- Removed shadow and solid fill to unify aesthetic -->
     <g transform="translate(0, 0)">
       <text x="0" y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Recommended Actions</text>
       
       <!-- Subtle vertical rule instead of border -->
       <line x1="200" y1="-15" x2="200" y2="160" stroke="#334155" stroke-width="1" />
       
       <!-- List Item 1: Infrastructure -->
       <g transform="translate(0, 25)">
         <!-- Icon: Gear -->
         <path d="M12 15.4A3.7 3.7 0 0 1 8.6 12 3.7 3.7 0 0 1 12 8.6a3.7 3.7 0 0 1 3.4 3.4 3.7 3.7 0 0 1-3.4 3.4zm0-9.3A5.7 5.7 0 0 0 6.3 12a5.7 5.7 0 0 0 5.7 5.7 5.7 5.7 0 0 0 5.7-5.7A5.7 5.7 0 0 0 12 6.1z" fill="#38bdf8" transform="translate(-4, -4) scale(0.8)" />
         <text x="16" y="8" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Upgrade drainage infrastructure</text>
       </g>
       
       <!-- List Item 2: Sea Walls -->
       <g transform="translate(0, 55)">
         <!-- Icon: Shield -->
         <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" fill="#38bdf8" transform="translate(-4, -4) scale(0.8)" />
         <text x="16" y="8" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Install sea walls in Old Port</text>
       </g>

       <!-- List Item 3: Building Codes -->
       <g transform="translate(0, 85)">
         <!-- Icon: Building -->
         <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" fill="#38bdf8" transform="translate(-4, -4) scale(0.8)" />
         <text x="16" y="8" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Enforce stricter building codes</text>
       </g>

       <!-- List Item 4: Green Spaces -->
       <g transform="translate(0, 115)">
         <!-- Icon: Leaf -->
         <path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z" fill="#38bdf8" transform="translate(-4, -4) scale(0.8)" />
         <text x="16" y="8" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Expand urban green spaces</text>
       </g>
       
       <!-- List Item 5: Relocate -->
       <g transform="translate(0, 145)">
         <!-- Icon: Move -->
         <path d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z" fill="#38bdf8" transform="translate(-4, -4) scale(0.8)" />
         <text x="16" y="8" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Relocate critical infrastructure</text>
       </g>
       
       <!-- List Item 6: Warning System -->
       <g transform="translate(0, 175)">
         <!-- Icon: Alert -->
         <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z" fill="#38bdf8" transform="translate(-4, -4) scale(0.8)" />
         <text x="16" y="8" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Implement early warning system</text>
       </g>
     </g>
  </g>

  <!-- ================= FOOTER / SOURCE ================= -->
  <g transform="translate(60, 760)">
    <text x="0" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Data Source: Port Aurora Climate Observatory, Regional Hydrological Survey 2034-2035. Visualization by Editorial Design Team.</text>
    <text x="1220" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">CONFIDENTIAL DRAFT</text>
  </g>

</svg>