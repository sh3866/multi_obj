<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0c15"/>
      <stop offset="100%" stop-color="#1a1625"/>
    </linearGradient>
    
    <!-- Card Background Gradients (Thematic) -->
    <!-- Air: Cool, light gradient (Lightweight) -->
    <linearGradient id="card-air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2326"/>
      <stop offset="100%" stop-color="#15181a"/>
    </linearGradient>
    
    <!-- Studio: Clean, subtle warm tint (Precision) -->
    <linearGradient id="card-studio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2430"/>
      <stop offset="100%" stop-color="#1f1a24"/>
    </linearGradient>
    
    <!-- Nocturne: Deep, dark tone (Immersion) -->
    <linearGradient id="card-nocturne" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1a26"/>
      <stop offset="100%" stop-color="#0f0c15"/>
    </linearGradient>

    <!-- Product Glow Effects -->
    <radialGradient id="air-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80deea" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#80deea" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="studio-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb74d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffb74d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nocturne-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9c27b0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9c27b0" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <!-- Studio Lift Shadow -->
    <filter id="shadow-lg" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    
    <!-- General Card Shadow -->
    <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Button/Icon Shadow -->
    <filter id="shadow-xs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Reusable Headphone Graphic (Abstract) -->
    <g id="headphone-shape">
      <!-- Headband -->
      <path d="M30 60 C30 10, 90 10, 90 60" fill="none" stroke-width="6" stroke-linecap="round"/>
      <!-- Earcups -->
      <rect x="20" y="50" width="16" height="30" rx="6" fill-opacity="0.9"/>
      <rect x="84" y="50" width="16" height="30" rx="6" fill-opacity="0.9"/>
      <!-- Cushion detail -->
      <path d="M36 55 L44 55" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <path d="M66 55 L74 55" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    </g>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;display=swap');
    
    text {
      font-family: 'Inter', -apple-system, sans-serif;
    }
    
    .brand-text {
      font-weight: 700;
      letter-spacing: 2px;
    }
    
    .section-header {
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #5c636e;
      text-anchor: start;
      text-transform: uppercase;
    }

    .product-name {
      font-size: 28px;
      font-weight: 700;
      text-anchor: middle;
      fill: #ffffff;
    }

    .price {
      font-size: 24px;
      font-weight: 300;
      text-anchor: middle;
      fill: #e9ecef;
    }

    .feature-text {
      font-size: 14px;
      fill: #adb5bd;
    }
    
    .feature-text-bold {
      font-size: 14px;
      font-weight: 600;
      fill: #e9ecef;
    }

    .color-label {
      font-size: 10px;
      fill: #6c757d;
    }

    .btn-text {
      font-size: 14px;
      font-weight: 600;
      text-anchor: middle;
      fill: #ffffff;
      pointer-events: none;
    }

    .recommended-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-anchor: middle;
      fill: #ffffff;
    }
  </style>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg-gradient)"/>
  
  <!-- Subtle Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
  </pattern>
  <rect width="1280" height="800" fill="url(#grid)"/>

  <!-- Header Section -->
  <g transform="translate(0, 60)">
    <text x="640" y="0" class="brand-text" font-size="24" fill="#ffffff" text-anchor="middle">AURALITH</text>
    <text x="640" y="30" font-size="16" fill="#adb5bd" text-anchor="middle" font-weight="300">Engineered Silence. Pure Sound.</text>
  </g>

  <!-- Comparison Columns Container -->
  <!-- Centered horizontally: 1280 width. Cards at 300px width. Spacing 40px. -->
  <g transform="translate(200, 140)">
    
    <!-- ========================================== -->
    <!-- PRODUCT 1: AIR -->
    <!-- ========================================== -->
    <g id="product-air" transform="translate(0, 0)">
      <!-- Card Background -->
      <rect x="0" y="0" width="260" height="600" rx="16" fill="url(#card-air)" stroke="#2c3034" stroke-width="1" filter="url(#shadow-sm)"/>
      
      <!-- Visual Area -->
      <circle cx="130" cy="100" r="80" fill="url(#air-glow)"/>
      <g transform="translate(80, 50) scale(1.2)">
        <use href="#headphone-shape" stroke="#80deea" fill="#e0f7fa"/>
      </g>

      <!-- Name & Price -->
      <text x="130" y="210" class="product-name">Air</text>
      <text x="130" y="240" class="price">$249</text>
      
      <!-- Description -->
      <text x="130" y="270" font-size="12" fill="#adb5bd" text-anchor="middle">Lightweight everyday listening.</text>

      <!-- Colors (Added to match Studio/Nocturne) -->
      <g transform="translate(110, 300)">
        <circle cx="0" cy="0" r="6" fill="#ffffff"/>
        <circle cx="20" cy="0" r="6" fill="#80deea"/>
        <circle cx="40" cy="0" r="6" fill="#263238"/>
        <text x="60" y="4" class="color-label">3 Colors</text>
      </g>

      <!-- Features (Aligned vertically) -->
      <g transform="translate(20, 370)">
        <text x="0" y="0" class="feature-text">• Ultra-light 220g chassis</text>
        <text x="0" y="25" class="feature-text">• Seamless multipoint</text>
        <text x="0" y="50" class="feature-text">• 30h Battery Life</text>
      </g>

      <!-- CTA -->
      <rect x="20" y="500" width="220" height="44" rx="22" fill="#2c2f33" stroke="#495057"/>
      <text x="130" y="527" class="btn-text" fill="#e9ecef">Shop Air</text>
    </g>

    <!-- ========================================== -->
    <!-- PRODUCT 2: STUDIO (RECOMMENDED) -->
    <!-- ========================================== -->
    <g id="product-studio" transform="translate(300, -15)">
      <!-- Card Background (Larger, Elevated) -->
      <rect x="0" y="0" width="260" height="630" rx="16" fill="url(#card-studio)" stroke="#ffb74d" stroke-width="1.5" filter="url(#shadow-lg)"/>
      
      <!-- Recommended Badge -->
      <rect x="70" y="-15" width="120" height="30" rx="15" fill="#ffb74d" filter="url(#shadow-xs)"/>
      <text x="130" y="2" class="recommended-badge">RECOMMENDED</text>

      <!-- Visual Area -->
      <circle cx="130" cy="115" r="80" fill="url(#studio-glow)"/>
      <g transform="translate(80, 65) scale(1.2)">
        <use href="#headphone-shape" stroke="#ffb74d" fill="#ffe0b2"/>
      </g>

      <!-- Name & Price -->
      <text x="130" y="230" class="product-name" fill="#ffffff">Studio</text>
      <text x="130" y="260" class="price">$399</text>
      
      <!-- Description -->
      <text x="130" y="290" font-size="12" fill="#adb5bd" text-anchor="middle">Accurate sound for creative work.</text>

      <!-- Colors -->
      <g transform="translate(100, 320)">
        <circle cx="0" cy="0" r="6" fill="#fff3e0"/>
        <circle cx="20" cy="0" r="6" fill="#ffb74d"/>
        <circle cx="40" cy="0" r="6" fill="#424242"/>
        <circle cx="60" cy="0" r="6" fill="#263238"/>
        <text x="80" y="4" class="color-label">4 Colors</text>
      </g>

      <!-- Features (Aligned vertically with others) -->
      <g transform="translate(20, 390)">
        <text x="0" y="0" class="feature-text-bold">• Flat-response 40mm drivers</text>
        <text x="0" y="25" class="feature-text">• Reference grade monitoring</text>
        <text x="0" y="50" class="feature-text">• 40h Battery Life</text>
      </g>

      <!-- CTA -->
      <rect x="20" y="530" width="220" height="44" rx="22" fill="#ffb74d" filter="url(#shadow-xs)"/>
      <text x="130" y="557" class="btn-text" fill="#2d1b06">Shop Studio</text>
    </g>

    <!-- ========================================== -->
    <!-- PRODUCT 3: NOCTURNE -->
    <!-- ========================================== -->
    <g id="product-nocturne" transform="translate(600, 0)">
      <!-- Card Background -->
      <rect x="0" y="0" width="260" height="600" rx="16" fill="url(#card-nocturne)" stroke="#2c2f33" stroke-width="1" filter="url(#shadow-sm)"/>
      
      <!-- Visual Area -->
      <circle cx="130" cy="100" r="80" fill="url(#nocturne-glow)"/>
      <g transform="translate(80, 50) scale(1.2)">
        <use href="#headphone-shape" stroke="#9c27b0" fill="#e1bee7"/>
      </g>

      <!-- Name & Price -->
      <text x="130" y="210" class="product-name">Nocturne</text>
      <text x="130" y="240" class="price">$549</text>
      
      <!-- Description -->
      <text x="130" y="270" font-size="12" fill="#adb5bd" text-anchor="middle">Flagship immersive listening.</text>

      <!-- Colors -->
      <g transform="translate(110, 300)">
        <circle cx="0" cy="0" r="6" fill="#4a148c"/>
        <circle cx="20" cy="0" r="6" fill="#9c27b0"/>
        <circle cx="40" cy="0" r="6" fill="#212121"/>
        <text x="60" y="4" class="color-label">3 Colors</text>
      </g>

      <!-- Features (Aligned vertically) -->
      <g transform="translate(20, 370)">
        <text x="0" y="0" class="feature-text">• Hybrid ANC Pro</text>
        <text x="0" y="25" class="feature-text">• Spatial Audio Engine</text>
        <text x="0" y="50" class="feature-text">• 50h Battery Life</text>
      </g>

      <!-- CTA -->
      <rect x="20" y="500" width="220" height="44" rx="22" fill="#2c2f33" stroke="#495057"/>
      <text x="130" y="527" class="btn-text" fill="#e9ecef">Shop Nocturne</text>
    </g>

  </g>

  <!-- Shared Specification Labels (Left Axis) -->
  <!-- Positioned to align exactly with the internal rows of the cards -->
  <g transform="translate(110, 0)">
    <!-- Battery Label (Aligns with 30h/40h/50h text) -->
    <text x="0" y="510" class="section-header">BATTERY</text>
    <!-- Visual Indicator Bar -->
    <rect x="0" y="508" width="3" height="20" fill="#495057" rx="1.5"/>

    <!-- Drivers Label (Aligns with chassis/drivers text) -->
    <text x="0" y="460" class="section-header">DRIVERS</text>
    <rect x="0" y="458" width="3" height="20" fill="#495057" rx="1.5"/>
  </g>

  <!-- Footer -->
  <text x="640" y="760" font-size="12" fill="#6c757d" text-anchor="middle">© 2024 Auralith Audio Systems. All specifications subject to change.</text>

</svg>