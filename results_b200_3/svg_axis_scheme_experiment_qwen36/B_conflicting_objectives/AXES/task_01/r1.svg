<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="50%" stop-color="#302b63" />
      <stop offset="100%" stop-color="#24243e" />
    </linearGradient>

    <!-- Stage Gradients -->
    <linearGradient id="sun-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7e5f" />
      <stop offset="100%" stop-color="#feb47b" />
    </linearGradient>
    <linearGradient id="neon-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f260" />
      <stop offset="100%" stop-color="#0575e6" />
    </linearGradient>
    <linearGradient id="moon-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Headliner Gradient -->
    <linearGradient id="headliner-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f857a6" />
      <stop offset="100%" stop-color="#ff5858" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btn-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#EE0979" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Patterns -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.08)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg-gradient)" />
  <rect width="1280" height="800" fill="url(#dot-grid)" />

  <!-- HEADER SECTION -->
  <g transform="translate(60, 60)">
    <text x="0" y="0" font-family="sans-serif" font-weight="900" font-size="64" fill="#fff" letter-spacing="2">AFTERGLOW</text>
    <text x="355" y="0" font-family="sans-serif" font-weight="300" font-size="64" fill="#ff9a8b" letter-spacing="2">FESTIVAL</text>
    
    <!-- Sub-header -->
    <line x1="0" y1="15" x2="1160" y2="15" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="0" y="45" font-family="sans-serif" font-weight="700" font-size="16" fill="#ccc" letter-spacing="4">OCTOBER 21 • COASTAL AMPHITHEATER • MIAMI</text>
  </g>

  <!-- TICKET BUTTON -->
  <g transform="translate(1000, 50)">
    <rect width="200" height="56" rx="28" fill="url(#btn-gradient)" filter="url(#glow)" />
    <text x="100" y="36" font-family="sans-serif" font-weight="800" font-size="18" fill="#fff" text-anchor="middle" letter-spacing="1">GET TICKETS</text>
  </g>

  <!-- STAGE HEADERS (Rows 0) -->
  <!-- Sun Stage -->
  <g transform="translate(60, 160)">
    <rect width="330" height="44" rx="4" fill="url(#sun-gradient)" opacity="0.95" />
    <text x="20" y="29" font-family="sans-serif" font-weight="800" font-size="20" fill="#fff">SUNSET STAGE</text>
  </g>
  <!-- Neon Stage -->
  <g transform="translate(445, 160)">
    <rect width="330" height="44" rx="4" fill="url(#neon-gradient)" opacity="0.95" />
    <text x="20" y="29" font-family="sans-serif" font-weight="800" font-size="20" fill="#fff">NEON STAGE</text>
  </g>
  <!-- Moon Stage -->
  <g transform="translate(830, 160)">
    <rect width="330" height="44" rx="4" fill="url(#moon-gradient)" opacity="0.95" />
    <text x="20" y="29" font-family="sans-serif" font-weight="800" font-size="20" fill="#fff">MOONLIGHT STAGE</text>
  </g>

  <!-- GRID LINES (Vertical & Horizontal) -->
  <!-- Verticals (Brighter for definition) -->
  <line x1="445" y1="204" x2="445" y2="760" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <line x1="830" y1="204" x2="830" y2="760" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  
  <!-- Horizontals (Time Band Separators) -->
  <line x1="100" y1="260" x2="1160" y2="260" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  <line x1="100" y1="350" x2="1160" y2="350" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  <line x1="100" y1="440" x2="1160" y2="440" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  <line x1="100" y1="530" x2="1160" y2="530" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  <line x1="100" y1="620" x2="1160" y2="620" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

  <!-- TIME MARKERS -->
  <g font-family="sans-serif" font-weight="800" font-size="14" fill="#888" text-anchor="end">
    <text x="90" y="295">12:00 PM</text>
    <text x="90" y="385">1:00 PM</text>
    <text x="90" y="475">3:00 PM</text>
    <text x="90" y="565">4:00 PM</text>
    <text x="90" y="695">7:00 PM</text>
  </g>

  <!-- ========================================== -->
  <!-- SCHEDULE ROWS (Unified Grid System)        -->
  <!-- ========================================== -->

  <!-- ROW 1: 12:00 PM -->
  <!-- Sun Card -->
  <g transform="translate(110, 215)">
    <rect width="310" height="70" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <!-- Left Accent -->
    <path d="M 0 6 Q 0 0 6 0 L 6 70 Q 6 76 0 76 Z" fill="#ff7e5f" />
    <text x="24" y="30" font-family="sans-serif" font-weight="700" font-size="18" fill="#fff">SOLAR FLARES</text>
    <text x="24" y="52" font-family="sans-serif" font-weight="500" font-size="14" fill="#ff9a8b">Indie Rock</text>
  </g>
  <!-- Neon Card -->
  <g transform="translate(460, 215)">
    <rect width="310" height="70" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <path d="M 0 6 Q 0 0 6 0 L 6 70 Q 6 76 0 76 Z" fill="#0575e6" />
    <text x="24" y="30" font-family="sans-serif" font-weight="700" font-size="18" fill="#fff">CYBER PULSE</text>
    <text x="24" y="52" font-family="sans-serif" font-weight="500" font-size="14" fill="#66e0ff">Synthwave</text>
  </g>
  <!-- Moon Card -->
  <g transform="translate(845, 215)">
    <rect width="310" height="70" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <path d="M 0 6 Q 0 0 6 0 L 6 70 Q 6 76 0 76 Z" fill="#4facfe" />
    <text x="24" y="30" font-family="sans-serif" font-weight="700" font-size="18" fill="#fff">VELVET MIST</text>
    <text x="24" y="52" font-family="sans-serif" font-weight="500" font-size="14" fill="#a0c4ff">Lo-Fi Chill</text>
  </g>

  <!-- ROW 2: 1:00 PM (New) -->
  <!-- Sun Card -->
  <g transform="translate(110, 305)">
    <rect width="310" height="70" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <path d="M 0 6 Q 0 0 6 0 L 6 70 Q 6 76 0 76 Z" fill="#ff7e5f" />
    <text x="24" y="30" font-family="sans-serif" font-weight="700" font-size="18" fill="#fff">COASTAL KIDS</text>
    <text x="24" y="52" font-family="sans-serif" font-weight="500" font-size="14" fill="#ff9a8b">Surf Rock</text>
  </g>
  <!-- Neon Card -->
  <g transform="translate(460, 305)">
    <rect width="310" height="70" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <path d="M 0 6 Q 0 0 6 0 L 6 70 Q 6 76 0 76 Z" fill="#0575e6" />
    <text x="24" y="30" font-family="sans-serif" font-weight="700" font-size="18" fill="#fff">PIXEL DUST</text>
    <text x="24" y="52" font-family="sans-serif" font-weight="500" font-size="14" fill="#66e0ff">Chiptune</text>
  </g>
  <!-- Moon Card -->
  <g transform="translate(845, 305)">
    <rect width="310" height="70" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <path d="M 0 6 Q 0 0 6 0 L 6 70 Q 6 76 0 76 Z" fill="#4facfe" />
    <text x="24" y="30" font-family="sans-serif" font-weight="700" font-size="18" fill="#fff">LUNA TIDES</text>
    <text x="24" y="52" font-family="sans-serif" font-weight="500" font-size="14" fill="#a0c4ff">Dream Pop</text>
  </g>

  <!-- ROW 3: 3:00 PM (New) -->
  <!-- Sun Card -->
  <g transform="translate(110, 395)">
    <rect width="310" height="70" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <path d="M 0 6 Q 0 0 6 0 L 6 70 Q 6 76 0 76 Z" fill="#ff7e5f" />
    <text x="24" y="30" font-family="sans-serif" font-weight="700" font-size="18" fill="#fff">THE DRIFT</text>
    <text x="24" y="52" font-family="sans-serif" font-weight="500" font-size="14" fill="#ff9a8b">Alternative</text>
  </g>
  <!-- Neon Card -->
  <g transform="translate(460, 395)">
    <rect width="310" height="70" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <path d="M 0 6 Q 0 0 6 0 L 6 70 Q 6 76 0 76 Z" fill="#0575e6" />
    <text x="24" y="30" font-family="sans-serif" font-weight="700" font-size="18" fill="#fff">BASS THEORY</text>
    <text x="24" y="52" font-family="sans-serif" font-weight="500" font-size="14" fill="#66e0ff">Techno</text>
  </g>
  <!-- Moon Card -->
  <g transform="translate(845, 395)">
    <rect width="310" height="70" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <path d="M 0 6 Q 0 0 6 0 L 6 70 Q 6 76 0 76 Z" fill="#4facfe" />
    <text x="24" y="30" font-family="sans-serif" font-weight="700" font-size="18" fill="#fff">ACOUSTIC SKIES</text>
    <text x="24" y="52" font-family="sans-serif" font-weight="500" font-size="14" fill="#a0c4ff">Folk / Unplugged</text>
  </g>

  <!-- ROW 4: 4:00 PM -->
  <!-- Sun Card -->
  <g transform="translate(110, 485)">
    <rect width="310" height="70" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <path d="M 0 6 Q 0 0 6 0 L 6 70 Q 6 76 0 76 Z" fill="#ff7e5f" />
    <text x="24" y="30" font-family="sans-serif" font-weight="700" font-size="18" fill="#fff">RHYTHM CORP</text>
    <text x="24" y="52" font-family="sans-serif" font-weight="500" font-size="14" fill="#ff9a8b">Funk / Disco</text>
  </g>
  <!-- Neon Card -->
  <g transform="translate(460, 485)">
    <rect width="310" height="70" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <path d="M 0 6 Q 0 0 6 0 L 6 70 Q 6 76 0 76 Z" fill="#0575e6" />
    <text x="24" y="30" font-family="sans-serif" font-weight="700" font-size="18" fill="#fff">NEON NOVA</text>
    <text x="24" y="52" font-family="sans-serif" font-weight="500" font-size="14" fill="#66e0ff">House</text>
  </g>
  <!-- Moon Card -->
  <g transform="translate(845, 485)">
    <rect width="310" height="70" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <path d="M 0 6 Q 0 0 6 0 L 6 70 Q 6 76 0 76 Z" fill="#4facfe" />
    <text x="24" y="30" font-family="sans-serif" font-weight="700" font-size="18" fill="#fff">DEEP ECHO</text>
    <text x="24" y="52" font-family="sans-serif" font-weight="500" font-size="14" fill="#a0c4ff">Ambient</text>
  </g>

  <!-- ROW 5: 7:00 PM HEADLINER -->
  <!-- Spanning Background -->
  <g transform="translate(60, 640)">
    <rect width="1100" height="120" rx="12" fill="url(#headliner-gradient)" filter="url(#shadow)" />
    
    <!-- Decorative Elements -->
    <circle cx="1050" cy="60" r="90" fill="rgba(255,255,255,0.1)" />
    <circle cx="100" cy="60" r="50" fill="rgba(255,255,255,0.1)" />
    
    <!-- Time Badge (Integrated) -->
    <rect x="0" y="10" width="160" height="100" rx="10" fill="rgba(0,0,0,0.15)" />
    <text x="80" y="70" font-family="sans-serif" font-weight="800" font-size="28" fill="#fff" text-anchor="middle">7:00 PM</text>
    
    <!-- Artist Info -->
    <text x="190" y="55" font-family="sans-serif" font-weight="900" font-size="48" fill="#fff" letter-spacing="1">ECLIPSE ARCHITECTS</text>
    <text x="190" y="85" font-family="sans-serif" font-weight="600" font-size="20" fill="rgba(255,255,255,0.9)" letter-spacing="2">PROGRESSIVE METAL / SYNTH</text>
    
    <!-- Headliner Badge -->
    <g transform="translate(900, 35)">
      <rect width="130" height="50" rx="25" fill="#fff" />
      <text x="65" y="32" font-family="sans-serif" font-weight="800" font-size="15" fill="#ff5858" text-anchor="middle">HEADLINER</text>
    </g>
  </g>

  <!-- FOOTER -->
  <g transform="translate(60, 780)">
    <text x="0" y="0" font-family="sans-serif" font-weight="400" font-size="14" fill="#777">Parking available on-site. Re-entry permitted with wristband.</text>
  </g>
  <g transform="translate(1220, 780)">
    <text x="0" y="0" font-family="sans-serif" font-weight="400" font-size="14" fill="#777" text-anchor="end">www.afterglowfest.com</text>
  </g>

</svg>