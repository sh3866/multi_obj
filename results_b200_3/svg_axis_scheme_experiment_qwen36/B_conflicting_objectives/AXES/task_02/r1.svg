<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#141418" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <radialGradient id="grad-light" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blur-large" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>

    <filter id="blur-medium" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" />
    </filter>

    <filter id="noise" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="screen" />
    </filter>
    
    <!-- Glitch Filter for Artwork -->
    <filter id="glitch-displacement" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.005" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    
    <!-- Clip Path for Artwork -->
    <clipPath id="clip-art">
      <rect x="0" y="0" width="460" height="540" />
    </clipPath>

    <!-- Patterns -->
    <pattern id="grid-pattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="800" fill="url(#grad-bg)" />
  <rect width="1280" height="800" fill="url(#grid-pattern)" />

  <!-- Abstract Artwork / Atmospheric Background -->
  <g id="artwork-layer">
    <!-- Large Blurred Orbs -->
    <circle cx="200" cy="200" r="300" fill="#2a1b3d" filter="url(#blur-large)" opacity="0.5" />
    <circle cx="1000" cy="600" r="400" fill="#162b3a" filter="url(#blur-large)" opacity="0.4" />
    <circle cx="640" cy="400" r="250" fill="#3d1b1b" filter="url(#blur-large)" opacity="0.2" />
    
    <!-- Light Overlay -->
    <rect width="1280" height="800" fill="url(#grad-light)" />
    
    <!-- Texture Noise -->
    <rect width="1280" height="800" filter="url(#noise)" pointer-events="none" />
  </g>

  <!-- Main Layout Grid Lines (Subtle) -->
  <line x1="80" y1="0" x2="80" y2="800" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
  <line x1="1200" y1="0" x2="1200" y2="800" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

  <!-- HEADER -->
  <g id="header" transform="translate(80, 60)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#888888">
      THE VOID INSTITUTE OF CONTEMPORARY ART
    </text>
    <text x="1120" y="0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="1" fill="#aaaaaa" text-anchor="end">
      2024 SEASON
    </text>
  </g>

  <!-- LEFT COLUMN: Exhibition Identity & Curatorial -->
  <g id="left-content" transform="translate(80, 160)">
    
    <!-- Artist Name (Revised: Bigger, Monospace, High Opacity, Separate Line) -->
    <text x="0" y="0" font-family="monospace" font-size="16" font-weight="700" letter-spacing="4" fill="#d4af37" opacity="1">
      ELARA VANCE
    </text>

    <!-- Main Title -->
    <g transform="translate(0, 30)">
      <text x="0" y="0" font-family="'Times New Roman', Times, serif" font-size="72" font-weight="400" fill="#f0f0f0">
        ECHOES
      </text>
      <text x="0" y="75" font-family="'Times New Roman', Times, serif" font-size="72" font-weight="400" fill="#f0f0f0" font-style="italic">
        of the
      </text>
      <text x="0" y="150" font-family="'Times New Roman', Times, serif" font-size="72" font-weight="400" fill="#f0f0f0">
        UNSEEN
      </text>
    </g>

    <!-- Curatorial Statement (Revised: Lighter Text Color) -->
    <g transform="translate(0, 320)">
      <!-- Accent Line (Revised: Matches Artwork Stroke) -->
      <line x1="0" y1="-10" x2="40" y2="-10" stroke="#d4af37" stroke-width="1" />
      
      <text x="0" y="20" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#E0E0E0">
        <tspan x="0" dy="0">An immersive exploration of memory’s fragility.</tspan>
        <tspan x="0" dy="24">Vance fragments perception, inviting viewers to navigate</tspan>
        <tspan x="0" dy="24">the liminal spaces between what is remembered</tspan>
        <tspan x="0" dy="24">and what has been lost to time.</tspan>
      </text>
    </g>

    <!-- Dates & Location -->
    <g transform="translate(0, 460)">
      <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">
        OCT 15 — DEC 30, 2024
      </text>
      <text x="0" y="20" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#888888">
        THE GRAND HALL, 4TH FLOOR
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Visual Art & Action -->
  <!-- Shifted slightly to create spatial tension -->
  <g id="right-content" transform="translate(700, 140)">
    
    <!-- Decorative Frame / Art Container (Revised: Larger, Asymmetric) -->
    <g transform="translate(0, 0)">
      <!-- Outer Frame -->
      <rect x="0" y="0" width="460" height="540" fill="#000000" stroke="#222222" stroke-width="1" />
      
      <!-- Inner Abstract Art -->
      <g clip-path="url(#clip-art)">
        
        <!-- Art Background -->
        <rect x="0" y="0" width="460" height="540" fill="#0d0d0d" />
        
        <!-- Abstract Shapes (Revised: Brighter contrast, glitch filter) -->
        <g filter="url(#glitch-displacement)">
            <path d="M-50,100 Q150,250 450,50" fill="none" stroke="#444444" stroke-width="2" />
            <path d="M-50,120 Q150,270 450,70" fill="none" stroke="#222222" stroke-width="1" />
            
            <!-- Accent Circle (Revised: Thicker stroke) -->
            <circle cx="230" cy="270" r="140" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="4 4" />
            <circle cx="230" cy="270" r="100" fill="#1a1a1a" filter="url(#blur-medium)" opacity="0.8" />
            
            <!-- Glitch Elements (Revised: More prominent) -->
            <rect x="80" y="200" width="300" height="2" fill="#ffffff" opacity="0.4" />
            <rect x="100" y="340" width="250" height="1" fill="#ffffff" opacity="0.5" />
            <circle cx="320" cy="160" r="3" fill="#d4af37" />
            <circle cx="150" cy="390" r="4" fill="#d4af37" />
            
            <!-- Text inside Art (Abstract) -->
            <text x="230" y="270" font-family="monospace" font-size="10" fill="#666666" text-anchor="middle" transform="rotate(-15 230 270)">
              MEMORY DATA CORRUPTED
            </text>
        </g>
      </g>
      
      <!-- Overlay Grid on Art -->
      <path d="M0,0 L460,540 M460,0 L0,540" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </g>

    <!-- Small Info Block near Art -->
    <g transform="translate(0, 560)">
      <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#666666" letter-spacing="1">
        FREE ADMISSION FOR MEMBERS
      </text>
    </g>
    
    <!-- Action Button: Reserve Tickets (Revised: Transparent BG, Border) -->
    <g transform="translate(0, 610)">
      <rect x="0" y="0" width="260" height="60" fill="transparent" stroke="#ffffff" stroke-width="1" />
      <text x="130" y="36" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        RESERVE TICKETS
      </text>
      
      <!-- Hover State Hint (Visual only) -->
      <rect x="0" y="59" width="260" height="1" fill="#d4af37" />
      
      <!-- Arrow -->
      <path d="M270,20 L290,30 L270,40" fill="none" stroke="#d4af37" stroke-width="2" />
    </g>

  </g>

  <!-- FOOTER -->
  <g id="footer" transform="translate(80, 740)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555">
      THE VOID INSTITUTE • 1000 ART DISTRICT BLVD • NEW YORK, NY 10013
    </text>
    <text x="1120" y="0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="end">
      OPEN DAILY 11AM — 7PM
    </text>
  </g>

  <!-- Floating Decorative Elements -->
  <circle cx="660" cy="380" r="1" fill="#ffffff" opacity="0.5" />
  <rect x="670" y="380" width="20" height="1" fill="#ffffff" opacity="0.3" />
</svg>