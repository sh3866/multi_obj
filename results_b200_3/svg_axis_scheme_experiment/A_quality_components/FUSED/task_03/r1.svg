<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f1e6"/>
      <stop offset="1" stop-color="#ece4d3"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbf8f1"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4a259"/>
      <stop offset="0.5" stop-color="#e76f51"/>
      <stop offset="1" stop-color="#c1121f"/>
    </linearGradient>
    <linearGradient id="tempArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e76f51" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e76f51" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="rainBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a9d8f"/>
      <stop offset="1" stop-color="#1d7d74"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a86ff"/>
      <stop offset="1" stop-color="#1d3557"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#3a2f1e" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Georgia, "Times New Roman", serif; }
      .sans { font-family: "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="800" fill="url(#bg)"/>
  <g stroke="#d8cdb6" stroke-width="1" fill="none" opacity="0.5">
    <path d="M0 120 Q 320 90 640 120 T 1280 120"/>
    <path d="M0 700 Q 320 730 640 700 T 1280 700"/>
  </g>
  <rect x="0" y="0" width="1280" height="8" fill="#c1121f"/>

  <!-- ============ HEADER ============ -->
  <text x="48" y="52" class="sans" font-size="12" letter-spacing="4" fill="#8a7a5c">CITY CLIMATE BRIEF · 2035</text>
  <text x="48" y="98" font-size="40" font-weight="bold" fill="#2b2417">Port Aurora — a coast under pressure</text>
  <text x="48" y="128" class="sans" font-size="15" fill="#5a5142">Hotter summers, heavier downpours and a rising sea are converging on our shoreline.</text>
  <text x="48" y="148" class="sans" font-size="15" fill="#5a5142">By 2035, Port Aurora is hotter, wetter in bursts, and exposed to coastal flood risk.</text>

  <!-- ============ INDICATOR 1 : TEMPERATURE ============ -->
  <g filter="url(#softShadow)">
    <rect x="48" y="172" width="384" height="168" rx="12" fill="url(#card)" stroke="#e6ddc9"/>
  </g>
  <rect x="48" y="172" width="384" height="6" rx="3" fill="url(#heat)"/>
  <text x="72" y="204" class="sans" font-size="13" letter-spacing="2" fill="#8a7a5c">TEMPERATURE INCREASE</text>
  <text x="72" y="262" font-size="46" font-weight="bold" fill="#c1121f">+1.8°C</text>
  <text x="72" y="288" class="sans" font-size="13" fill="#5a5142">warmer than the 1990–2010 average</text>
  <g transform="translate(352,220)">
    <path d="M0 44 L14 12 L22 26 L30 0 L38 30 L46 18 L54 44 Z" fill="url(#heat)" opacity="0.85"/>
    <line x1="0" y1="44" x2="54" y2="44" stroke="#c1121f" stroke-width="1.5"/>
  </g>

  <!-- ============ INDICATOR 2 : RAINFALL ============ -->
  <g filter="url(#softShadow)">
    <rect x="448" y="172" width="384" height="168" rx="12" fill="url(#card)" stroke="#e6ddc9"/>
  </g>
  <rect x="448" y="172" width="384" height="6" rx="3" fill="url(#rainBar)"/>
  <text x="472" y="204" class="sans" font-size="13" letter-spacing="2" fill="#8a7a5c">RAINFALL CHANGE</text>
  <text x="472" y="262" font-size="46" font-weight="bold" fill="#1d7d74">+30%</text>
  <text x="472" y="288" class="sans" font-size="13" fill="#5a5142">more rain in fewer, heavier events</text>
  <g transform="translate(752,214)">
    <g fill="#2a9d8f">
      <circle cx="10" cy="6" r="5"/><circle cx="26" cy="14" r="4"/><circle cx="6" cy="22" r="4"/>
      <circle cx="24" cy="30" r="5"/><circle cx="12" cy="40" r="4"/><circle cx="30" cy="46" r="3"/>
    </g>
  </g>

  <!-- ============ INDICATOR 3 : SEA LEVEL ============ -->
  <g filter="url(#softShadow)">
    <rect x="848" y="172" width="384" height="168" rx="12" fill="url(#card)" stroke="#e6ddc9"/>
  </g>
  <rect x="848" y="172" width="384" height="6" rx="3" fill="url(#sea)"/>
  <text x="872" y="204" class="sans" font-size="13" letter-spacing="2" fill="#8a7a5c">SEA-LEVEL RISE</text>
  <text x="872" y="262" font-size="46" font-weight="bold" fill="#1d3557">+0.45 m</text>
  <text x="872" y="288" class="sans" font-size="13" fill="#5a5142">projected coastal rise by 2035</text>
  <g transform="translate(1148,214)">
    <path d="M0 34 Q 12 24 24 34 T 48 34 T 72 34" fill="none" stroke="#3a86ff" stroke-width="3"/>
    <path d="M0 44 Q 12 34 24 44 T 48 44 T 72 44" fill="none" stroke="#1d3557" stroke-width="3"/>
    <path d="M40 8 L40 26 M33 20 L40 27 L47 20" fill="none" stroke="#1d3557" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ============ CHART 1 : MONTHLY TEMPERATURE ============ -->
  <g filter="url(#softShadow)">
    <rect x="48" y="356" width="584" height="268" rx="12" fill="url(#card)" stroke="#e6ddc9"/>
  </g>
  <text x="72" y="388" font-size="20" font-weight="bold" fill="#2b2417">Monthly temperature trend</text>
  <text x="72" y="410" class="sans" font-size="12" fill="#8a7a5c">Mean °C · 1990–2010 (dashed) vs 2035 (solid)</text>

  <!-- chart area: x 100..600, y 425..605 -->
  <g stroke="#e3dac6" stroke-width="1">
    <line x1="100" y1="425" x2="600" y2="425"/>
    <line x1="100" y1="465" x2="600" y2="465"/>
    <line x1="100" y1="505" x2="600" y2="505"/>
    <line x1="100" y1="545" x2="600" y2="545"/>
    <line x1="100" y1="585" x2="600" y2="585"/>
  </g>
  <g class="sans" font-size="11" fill="#8a7a5c" text-anchor="end">
    <text x="92" y="429">30</text>
    <text x="92" y="469">25</text>
    <text x="92" y="509">20</text>
    <text x="92" y="549">15</text>
    <text x="92" y="589">10</text>
  </g>

  <!-- area under 2035 -->
  <path d="M100 545 L150 531.4 L200 517.8 L250 490.6 L300 458.4 L350 431.3 L400 425 L450 431.3 L500 458.4 L550 490.6 L600 517.8 L600 585 L100 585 Z" fill="url(#tempArea)"/>
  <!-- 1990-2010 dashed -->
  <polyline points="100,567.5 150,558.4 200,545 250,523.4 300,501.7 350,480.1 400,458.4 450,480.1 500,501.7 550,523.4 600,545" fill="none" stroke="#b7a98a" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- 2035 solid -->
  <polyline points="100,545 150,531.4 200,517.8 250,490.6 300,458.4 350,431.3 400,425 450,431.3 500,458.4 550,490.6 600,517.8" fill="none" stroke="#e76f51" stroke-width="3"/>
  <g fill="#e76f51">
    <circle cx="100" cy="545" r="3.5"/><circle cx="150" cy="531.4" r="3.5"/><circle cx="200" cy="517.8" r="3.5"/>
    <circle cx="250" cy="490.6" r="3.5"/><circle cx="300" cy="458.4" r="3.5"/><circle cx="350" cy="431.3" r="3.5"/>
    <circle cx="400" cy="425" r="3.5"/><circle cx="450" cy="431.3" r="3.5"/><circle cx="500" cy="458.4" r="3.5"/>
    <circle cx="550" cy="490.6" r="3.5"/><circle cx="600" cy="517.8" r="3.5"/>
  </g>
  <!-- x labels -->
  <g class="sans" font-size="11" fill="#8a7a5c" text-anchor="middle">
    <text x="100" y="604">Jan</text><text x="150" y="604">Feb</text><text x="200" y="604">Mar</text>
    <text x="250" y="604">Apr</text><text x="300" y="604">May</text><text x="350" y="604">Jun</text>
    <text x="400" y="604">Jul</text><text x="450" y="604">Aug</text><text x="500" y="604">Sep</text>
    <text x="550" y="604">Oct</text><text x="600" y="604">Nov</text>
  </g>
  <!-- legend -->
  <g class="sans" font-size="12" fill="#5a5142">
    <line x1="100" y1="618" x2="126" y2="618" stroke="#e76f51" stroke-width="3"/>
    <text x="132" y="622">2035</text>
    <line x1="180" y1="618" x2="206" y2="618" stroke="#b7a98a" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="212" y="622">1990–2010</text>
  </g>

  <!-- ============ CHART 2 : RAINFALL / FLOOD RISK ============ -->
  <g filter="url(#softShadow)">
    <rect x="648" y="356" width="584" height="268" rx="12" fill="url(#card)" stroke="#e6ddc9"/>
  </g>
  <text x="672" y="388" font-size="20" font-weight="bold" fill="#2b2417">Monthly rainfall &amp; flood risk</text>
  <text x="672" y="410" class="sans" font-size="12" fill="#8a7a5c">Rainfall (mm) by month · darker = higher flood risk</text>

  <!-- chart area: x 700..1180, y 425..585 -->
  <g stroke="#e3dac6" stroke-width="1">
    <line x1="700" y1="425" x2="1180" y2="425"/>
    <line x1="700" y1="465" x2="1180" y2="465"/>
    <line x1="700" y1="505" x2="1180" y2="505"/>
    <line x1="700" y1="545" x2="1180" y2="545"/>
    <line x1="700" y1="585" x2="1180" y2="585"/>
  </g>
  <g class="sans" font-size="11" fill="#8a7a5c" text-anchor="end">
    <text x="692" y="429">300</text><text x="692" y="469">225</text>
    <text x="692" y="509">150</text><text x="692" y="549">75</text><text x="692" y="589">0</text>
  </g>

  <!-- flood risk band -->
  <rect x="850" y="425" width="250" height="160" fill="#e76f51" opacity="0.10"/>
  <text x="975" y="440" class="sans" font-size="11" fill="#c1121f" text-anchor="middle" letter-spacing="1">HIGH FLOOD-RISK WINDOW</text>

  <!-- bars -->
  <g>
    <rect x="712" y="525.4" width="26" height="59.6" rx="3" fill="#2a9d8f"/>
    <rect x="762" y="517.0" width="26" height="68.0" rx="3" fill="#2a9d8f"/>
    <rect x="812" y="497.5" width="26" height="87.5" rx="3" fill="#2a9d8f"/>
    <rect x="862" y="467.5" width="26" height="117.5" rx="3" fill="#23857a"/>
    <rect x="912" y="438.9" width="26" height="146.1" rx="3" fill="#1d7d74"/>
    <rect x="962" y="427.5" width="26" height="157.5" rx="3" fill="#166058"/>
    <rect x="1012" y="434.6" width="26" height="150.4" rx="3" fill="#166058"/>
    <rect x="1062" y="451.0" width="26" height="134.0" rx="3" fill="#1d7d74"/>
    <rect x="1112" y="480.1" width="26" height="104.9" rx="3" fill="#23857a"/>
    <rect x="1162" y="505" width="26" height="80" rx="3" fill="#2a9d8f"/>
  </g>
  <!-- value labels on peak bars -->
  <g class="sans" font-size="10" fill="#1d3557" text-anchor="middle">
    <text x="975" y="424">290</text>
    <text x="1025" y="431">277</text>
  </g>
  <!-- x labels -->
  <g class="sans" font-size="11" fill="#8a7a5c" text-anchor="middle">
    <text x="725" y="604">Jan</text><text x="775" y="604">Feb</text><text x="825" y="604">Mar</text>
    <text x="875" y="604">Apr</text><text x="925" y="604">May</text><text x="975" y="604">Jun</text>
    <text x="1025" y="604">Jul</text><text x="1075" y="604">Aug</text><text x="1125" y="604">Sep</text>
    <text x="1175" y="604">Oct</text>
  </g>
  <!-- legend -->
  <g class="sans" font-size="12" fill="#5a5142">
    <rect x="700" y="614" width="14" height="14" rx="2" fill="#2a9d8f"/>
    <text x="720" y="626">Lower risk</text>
    <rect x="812" y="614" width="14" height="14" rx="2" fill="#166058"/>
    <text x="832" y="626">Higher risk</text>
    <rect x="930" y="614" width="14" height="14" rx="2" fill="#e76f51" opacity="0.25"/>
    <text x="950" y="626">Flood window</text>
  </g>

  <!-- ============ DISTRICTS ============ -->
  <g filter="url(#softShadow)">
    <rect x="48" y="640" width="384" height="128" rx="12" fill="url(#card)" stroke="#e6ddc9"/>
  </g>
  <text x="72" y="666" class="sans" font-size="12" letter-spacing="2" fill="#8a7a5c">HIGH-RISK DISTRICTS</text>
  <!-- Stylized map inset -->
  <g transform="translate(72, 680)">
    <!-- Coastline -->
    <path d="M0 40 Q 20 30 40 40 T 80 40 T 120 40 L120 60 L0 60 Z" fill="#3a86ff" opacity="0.15"/>
    <path d="M0 40 Q 20 30 40 40 T 80 40 T 120 40" fill="none" stroke="#3a86ff" stroke-width="1.5"/>
    <!-- District 1: Old Harbor -->
    <circle cx="20" cy="40" r="6" fill="#c1121f" opacity="0.2"/>
    <circle cx="20" cy="40" r="3" fill="#c1121f"/>
    <text x="32" y="44" class="sans" font-size="11" fill="#2b2417">Old Harbor</text>
    <!-- District 2: Millbrook -->
    <circle cx="60" cy="25" r="6" fill="#e76f51" opacity="0.2"/>
    <circle cx="60" cy="25" r="3" fill="#e76f51"/>
    <text x="72" y="29" class="sans" font-size="11" fill="#2b2417">Millbrook</text>
    <!-- District 3: South Pier -->
    <circle cx="100" cy="45" r="6" fill="#1d3557" opacity="0.2"/>
    <circle cx="100" cy="45" r="3" fill="#1d3557"/>
    <text x="112" y="49" class="sans" font-size="11" fill="#2b2417">South Pier</text>
  </g>
  <!-- District details -->
  <g class="sans" font-size="11" fill="#8a7a5c">
    <text x="72" y="752">• Old Harbor: Sea-level rise &amp; tidal surge</text>
    <text x="72" y="766">• Millbrook: Flash flooding &amp; drainage failure</text>
    <text x="72" y="780">• South Pier: Coastal erosion &amp; wave overtopping</text>
  </g>

  <!-- ============ ACTIONS ============ -->
  <g filter="url(#softShadow)">
    <rect x="448" y="640" width="384" height="128" rx="12" fill="url(#card)" stroke="#e6ddc9"/>
  </g>
  <text x="472" y="666" class="sans" font-size="12" letter-spacing="2" fill="#8a7a5c">RECOMMENDED ACTIONS</text>
  <g class="sans" font-size="12" fill="#2b2417">
    <text x="472" y="690">1 · Expand green infrastructure (parks, wetlands)</text>
    <text x="472" y="710">2 · Upgrade drainage &amp; coastal defenses</text>
    <text x="472" y="730">3 · Enforce flood-zone building codes</text>
    <text x="472" y="750">4 · Develop community early-warning system</text>
    <text x="472" y="770">5 · Integrate climate data into urban planning</text>
  </g>

  <!-- ============ SOURCE / CONCLUSION ============ -->
  <g filter="url(#softShadow)">
    <rect x="848" y="640" width="384" height="128" rx="12" fill="url(#card)" stroke="#e6ddc9"/>
  </g>
  <text x="872" y="666" class="sans" font-size="12" letter-spacing="2" fill="#8a7a5c">CONCLUSION &amp; SOURCE</text>
  <text x="872" y="690" class="sans" font-size="13" fill="#2b2417">Port Aurora is becoming hotter, experiencing</text>
  <text x="872" y="708" class="sans" font-size="13" fill="#2b2417">concentrated rainfall, and facing coastal flood</text>
  <text x="872" y="726" class="sans" font-size="13" fill="#2b2417">risk. Urgent adaptation is required.</text>
  <line x1="872" y1="740" x2="1208" y2="740" stroke="#e6ddc9" stroke-width="1"/>
  <text x="872" y="758" class="sans" font-size="11" fill="#8a7a5c">Source: Port Aurora Climate Office, 2035 projection</text>
  <text x="872" y="772" class="sans" font-size="11" fill="#8a7a5c">model. Data: CMIP6 ensemble, regional downscaling.</text>
</svg>