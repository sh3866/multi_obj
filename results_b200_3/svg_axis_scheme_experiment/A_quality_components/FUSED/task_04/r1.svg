<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14171f"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#2a2f3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0b0d12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6e9ff"/>
      <stop offset="1" stop-color="#4aa8de"/>
    </linearGradient>
    <linearGradient id="studio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd6a2"/>
      <stop offset="1" stop-color="#d98324"/>
    </linearGradient>
    <linearGradient id="noct" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6d3ff"/>
      <stop offset="1" stop-color="#7a4fd0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4c"/>
      <stop offset="1" stop-color="#1a1d25"/>
    </linearGradient>
    <linearGradient id="metalHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5060"/>
      <stop offset="1" stop-color="#242833"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f2f7"/>
      <stop offset="1" stop-color="#cfd3de"/>
    </linearGradient>
    <linearGradient id="btnRec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98cff"/>
      <stop offset="1" stop-color="#7a4fd0"/>
    </linearGradient>
    
    <!-- Card Background Gradients -->
    <linearGradient id="cardAirBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15181f"/>
      <stop offset="1" stop-color="#11131a"/>
    </linearGradient>
    <linearGradient id="cardStudioBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b29"/>
      <stop offset="1" stop-color="#15131c"/>
    </linearGradient>
    <linearGradient id="cardNoctBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18161f"/>
      <stop offset="1" stop-color="#111016"/>
    </linearGradient>

    <!-- Texture Patterns -->
    <pattern id="dots" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#ffffff" opacity="0.03"/>
    </pattern>
    <pattern id="lines" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="6" x2="12" y2="6" stroke="#ffffff" stroke-width="0.5" opacity="0.02"/>
    </pattern>
    <pattern id="grid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="none"/>
      <line x1="16" y1="0" x2="16" y2="16" stroke="#ffffff" stroke-width="0.5" opacity="0.015"/>
      <line x1="0" y1="16" x2="16" y2="16" stroke="#ffffff" stroke-width="0.5" opacity="0.015"/>
    </pattern>

    <!-- Filters -->
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowP" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glowRec" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#b98cff" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>

  <!-- ===================== HEADER ===================== -->
  <text x="64" y="62" font-family="'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="7" fill="#f2f3f7">AURALITH</text>
  <text x="64" y="92" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" letter-spacing="1" fill="#9aa1b2">Premium wireless sound, tuned for the way you listen.</text>
  <text x="64" y="124" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="2.5" fill="#6b7280">WIRELESS HEADPHONES · COMPARE THE COLLECTION</text>
  <line x1="64" y1="140" x2="1216" y2="140" stroke="#2a2f3d" stroke-width="1"/>

  <!-- ===================== CARD 1 : AIR ===================== -->
  <g>
    <!-- Base Card -->
    <rect x="64" y="158" width="360" height="572" rx="22" fill="url(#cardAirBg)" stroke="#2c3140" stroke-width="1.5" filter="url(#soft)"/>
    <!-- Texture Overlay -->
    <rect x="64" y="158" width="360" height="572" rx="22" fill="url(#dots)"/>
    <!-- Ambient Glow -->
    <circle cx="244" cy="298" r="92" fill="#4aa8de" opacity="0.12" filter="url(#glowP)"/>
    
    <!-- Distinct Visual: Slim, Minimal, Airy -->
    <g transform="translate(244,298)">
      <!-- Slim Headband -->
      <path d="M -42 -42 Q -42 -76 0 -76 Q 42 -76 42 -42" fill="none" stroke="#4a5060" stroke-width="6" stroke-linecap="round"/>
      <!-- Minimal Connectors -->
      <rect x="-44" y="-44" width="6" height="24" fill="#3a3f4c"/>
      <rect x="38" y="-44" width="6" height="24" fill="#3a3f4c"/>
      <!-- Slim Cups -->
      <rect x="-52" y="-26" width="14" height="52" rx="7" fill="url(#air)"/>
      <rect x="38" y="-26" width="14" height="52" rx="7" fill="url(#air)"/>
      <!-- Subtle Highlights -->
      <rect x="-50" y="-24" width="4" height="48" rx="2" fill="#ffffff" opacity="0.25"/>
      <rect x="40" y="-24" width="4" height="48" rx="2" fill="#ffffff" opacity="0.25"/>
    </g>
    
    <text x="244" y="424" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="2" fill="#eef1f7">AURALITH AIR</text>
    <text x="244" y="448" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="1" fill="#8f96a6">Lightweight everyday listening</text>
    <text x="244" y="490" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#eef1f7">$249</text>
    <line x1="88" y1="510" x2="400" y2="510" stroke="#262b37" stroke-width="1"/>
    
    <!-- Refined Features: Icon + Text -->
    <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#c3c8d4">
      <!-- Feather Icon -->
      <path d="M 94 532 Q 98 528 102 532 L 98 536 Z" fill="#4aa8de"/>
      <line x1="98" y1="536" x2="98" y2="542" stroke="#4aa8de" stroke-width="1"/>
      <text x="112" y="539">Featherlight 210 g all-day fit</text>
      
      <!-- Waveform Icon -->
      <path d="M 92 562 Q 95 558 98 562 T 104 562" fill="none" stroke="#4aa8de" stroke-width="1.5" stroke-linecap="round"/>
      <text x="112" y="567">Balanced, natural sound signature</text>
      
      <!-- Link Icon -->
      <circle cx="96" cy="590" r="2" fill="none" stroke="#4aa8de" stroke-width="1.5"/>
      <circle cx="102" cy="590" r="2" fill="none" stroke="#4aa8de" stroke-width="1.5"/>
      <line x1="97" y1="590" x2="101" y2="590" stroke="#4aa8de" stroke-width="1.5"/>
      <text x="112" y="595">Multipoint · quick pairing</text>
    </g>
    
    <!-- Colors -->
    <text x="88" y="626" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" letter-spacing="2" fill="#6b7280">COLORS</text>
    <circle cx="98" cy="646" r="9" fill="#eef1f7" stroke="#3a3f4c" stroke-width="1"/>
    <circle cx="124" cy="646" r="9" fill="#4aa8de" stroke="#3a3f4c" stroke-width="1"/>
    <circle cx="150" cy="646" r="9" fill="#1c1f27" stroke="#3a3f4c" stroke-width="1"/>
    
    <!-- Battery -->
    <text x="88" y="680" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" letter-spacing="2" fill="#6b7280">BATTERY</text>
    <text x="88" y="702" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#eef1f7">30 hrs</text>
    <text x="150" y="702" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8f96a6">· USB-C fast charge</text>
    
    <!-- Button -->
    <rect x="88" y="716" width="312" height="44" rx="22" fill="url(#btn)"/>
    <text x="244" y="744" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#15181f">Buy · $249</text>
  </g>

  <!-- ===================== CARD 2 : STUDIO (RECOMMENDED) ===================== -->
  <g>
    <!-- Base Card with Glow -->
    <rect x="460" y="146" width="360" height="596" rx="22" fill="url(#cardStudioBg)" stroke="#b98cff" stroke-width="2.5" filter="url(#glowRec)"/>
    <!-- Texture Overlay -->
    <rect x="460" y="146" width="360" height="596" rx="22" fill="url(#lines)"/>
    <!-- Ambient Glow -->
    <circle cx="640" cy="298" r="98" fill="#b98cff" opacity="0.15" filter="url(#glowP)"/>
    
