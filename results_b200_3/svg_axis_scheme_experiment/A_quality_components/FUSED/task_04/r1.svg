      <path d="M 94 538 A 4 4 0 0 1 102 538" fill="none" stroke="#7a4fd0" stroke-width="1.5"/>
      <circle cx="98" cy="542" r="1.5" fill="#7a4fd0"/>
      <text x="112" y="539">Adaptive spatial audio engine</text>
      
      <!-- ANC Icon -->
