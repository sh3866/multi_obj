    <text x="640" y="424" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="2" fill="#ffffff">AURALITH STUDIO</text>
    <text x="640" y="448" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="1" fill="#b8a6d8">Accurate sound &amp; creative work</text>
    <text x="640" y="490" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">$399</text>
    <line x1="484" y1="510" x2="796" y2="510" stroke="#332a44" stroke-width="1"/>
    
    <!-- Refined Features -->
    <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#d8d3e6">
      <!-- Driver Icon -->
      <circle cx="98" cy="534" r="4" fill="none" stroke="#d98324" stroke-width="1.5"/>
      <circle cx="98" cy="534" r="1.5" fill="#d98324"/>
      <text x="112" y="539">Reference-tuned 40 mm drivers</text>
      
      <!-- Flat Line Icon -->
      <line x1="92" y1="562" x2="104" y2="562" stroke="#d98324" stroke-width="2" stroke-linecap="round"/>
      <text x="112" y="567">Flat, honest frequency response</text>
      
      <!-- Hi-Res Icon -->
      <path d="M 92 594 L 96 586 L 100 590 L 104 586 L 104 594 Z" fill="none" stroke="#d98324" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="112" y="595">Hi-Res LDAC · studio mics</text>
    </g>
    
    <!-- Colors -->
    <text x="484" y="626" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" letter-spacing="2" fill="#7a6f92">COLORS</text>
    <circle cx="494" cy="646" r="9" fill="#1c1f27" stroke="#3a3f4c" stroke-width="1"/>
    <circle cx="520" cy="646" r="9" fill="#d98324" stroke="#3a3f4c" stroke-width="1"/>
    <circle cx="546" cy="646" r="9" fill="#eef1f7" stroke="#3a3f4c" stroke-width="1"/>
    
    <!-- Battery -->
    <text x="484" y="680" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" letter-spacing="2" fill="#7a6f92">BATTERY</text>
    <text x="484" y="702" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">40 hrs</text>
    <text x="552" y="702" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#b8a6d8">· USB-C fast charge</text>
    
    <!-- Button -->
    <rect x="484" y="716" width="312" height="44" rx="22" fill="url(#btnRec)"/>
    <text x="640" y="744" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#ffffff">Buy · $399</text>
  </g>

  <!-- ===================== CARD 3 : NOCTURNE ===================== -->
  <g>
    <!-- Base Card -->
    <rect x="856" y="158" width="360" height="572" rx="22" fill="url(#cardNoctBg)" stroke="#2c3140" stroke-width="1.5" filter="url(#soft)"/>
    <!-- Texture Overlay -->
