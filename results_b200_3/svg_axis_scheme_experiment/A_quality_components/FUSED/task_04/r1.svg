    <circle cx="890" cy="646" r="9" fill="#1c1f27" stroke="#3a3f4c" stroke-width="1"/>
    <circle cx="916" cy="646" r="9" fill="#7a4fd0" stroke="#3a3f4c" stroke-width="1"/>
    <circle cx="942" cy="646" r="9" fill="#eef1f7" stroke="#3a3f4c" stroke-width="1"/>
    
    <!-- Battery -->
    <text x="880" y="680" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" letter-spacing="2" fill="#6b7280">BATTERY</text>
    <text x="880" y="702" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#eef1f7">50 hrs</text>
