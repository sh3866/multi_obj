      <circle cx="-62" cy="10" r="2" fill="#e6d3ff" opacity="0.8"/>
      <circle cx="62" cy="10" r="2" fill="#e6d3ff" opacity="0.8"/>
    </g>
    
    <text x="1036" y="424" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="2" fill="#eef1f7">AURALITH NOCTURNE</text>
    <text x="1036" y="448" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="1" fill="#8f96a6">Flagship immersive listening</text>
    <text x="1036" y="490" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#eef1f7">$549</text>
