      <circle cx="-57" cy="8" r="6" fill="#1a110a" stroke="#ffcc88" stroke-width="0.5" opacity="0.6"/>
      <!-- Driver Details: Right -->
      <circle cx="57" cy="8" r="12" fill="#2a1a0a" stroke="#ffcc88" stroke-width="1"/>
      <circle cx="57" cy="8" r="6" fill="#1a110a" stroke="#ffcc88" stroke-width="0.5" opacity="0.6"/>
      <!-- Highlights -->
