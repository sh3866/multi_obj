    <!-- Ambient Glow -->
    <circle cx="1036" cy="298" r="92" fill="#7a4fd0" opacity="0.15" filter="url(#glowP)"/>
    
    <!-- Distinct Visual: Large, Luxurious, Textured -->
    <g transform="translate(1036,298)">
      <!-- Wide Headband -->
      <path d="M -64 -46 Q -64 -92 0 -92 Q 64 -92 64 -46" fill="none" stroke="url(#metalHi)" stroke-width="16" stroke-linecap="round"/>
      <!-- Thick Connectors -->
      <rect x="-72" y="-48" width="16" height="34" rx="4" fill="url(#metalHi)"/>
      <rect x="56" y="-48" width="16" height="34" rx="4" fill="url(#metalHi)"/>
      <!-- Oversized Cups -->
      <rect x="-84" y="-28" width="44" height="76" rx="16" fill="url(#noct)"/>
      <rect x="40" y="-28" width="44" height="76" rx="16" fill="url(#noct)"/>
      <!-- Luxurious Inner Cushion/Texture -->
      <rect x="-76" y="-20" width="28" height="60" rx="10" fill="#2a1a3a" opacity="0.6"/>
      <rect x="48" y="-20" width="28" height="60" rx="10" fill="#2a1a3a" opacity="0.6"/>
      <!-- Premium Highlights -->
