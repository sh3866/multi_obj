      <path d="M 92 556 Q 98 552 104 556" fill="none" stroke="#7a4fd0" stroke-width="1.5" opacity="0.5"/>
      <text x="112" y="567">Flagship adaptive noise cancelling</text>
      
      <!-- Foam Icon -->
      <path d="M 94 594 Q 96 590 98 594 Q 100 590 102 594 Q 104 590 104 594" fill="none" stroke="#7a4fd0" stroke-width="1.5" stroke-linecap="round"/>
      <text x="112" y="595">Memory-foam · premium build</text>
    </g>
    
    <!-- Colors -->
