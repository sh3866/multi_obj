<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14121e"/>
      <stop offset="0.5" stop-color="#0f0e17"/>
      <stop offset="1" stop-color="#0a0910"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#e9e0cf" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#e9e0cf" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#e9e0cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0d8c8"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e0cf" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#e9e0cf" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#e9e0cf" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1826"/>
      <stop offset="1" stop-color="#0d0b13"/>
    </linearGradient>
    <linearGradient id="artglow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e0cf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e9e0cf" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 H0 V44" fill="none" stroke="#e9e0cf" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="artclip"><rect x="640" y="188" width="592" height="424" rx="4"/></clipPath>
  </defs>

  <!-- base -->
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <ellipse cx="860" cy="380" rx="560" ry="470" fill="url(#glow)"/>

  <!-- top bar -->
  <text x="64" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="6" fill="#e9e0cf">MUSEUM OF ABSENT FORM</text>
  <text x="1216" y="58" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#e9e0cf" fill-opacity="0.6">CONTEMPORARY ART · 2024</text>
  <line x1="64" y1="74" x2="1216" y2="74" stroke="#e9e0cf" stroke-opacity="0.14" stroke-width="1"/>

  <!-- left content -->
  <text x="64" y="176" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="5" fill="#c9bfa8">A SOLO EXHIBITION</text>
  <text x="64" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="82" fill="#efe7d6">Echoes of</text>
  <text x="64" y="336" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-style="italic" fill="#efe7d6">the Unseen</text>
  <rect x="64" y="362" width="60" height="3" fill="#c9bfa8"/>
  <text x="64" y="404" font-family="Helvetica, Arial, sans-serif" font-size="21" letter-spacing="1" fill="#e9e0cf">Mara Voss</text>
  <text x="64" y="432" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#e9e0cf" fill-opacity="0.6">WORKS ON PAPER · SOUND · LIGHT</text>

  <!-- dates -->
  <line x1="64" y1="470" x2="180" y2="470" stroke="#e9e0cf" stroke-opacity="0.3" stroke-width="1"/>
  <text x="64" y="498" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4" fill="#c9bfa8">EXHIBITION DATES</text>
  <text x="64" y="528" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#e9e0cf">14 June — 28 September 2024</text>

  <!-- curatorial statement -->
  <text x="64" y="566" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#c9bfa8">CURATORIAL STATEMENT</text>
  <text x="64" y="594" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e9e0cf" fill-opacity="0.82">Voss composes from the residue of memory —</text>
  <text x="64" y="616" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e9e0cf" fill-opacity="0.82">the silences that remain after a presence leaves.</text>
  <text x="64" y="638" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e9e0cf" fill-opacity="0.82">Across layered paper, sound and light, her work</text>
  <text x="64" y="660" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e9e0cf" fill-opacity="0.82">holds absence at a distance close enough to touch.</text>

  <!-- CTA -->
  <rect x="64" y="678" width="260" height="62" rx="4" fill="url(#cta)"/>
  <text x="194" y="716" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#14121e">RESERVE TICKETS</text>
  <text x="346" y="715" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1" fill="#e9e0cf" fill-opacity="0.55">Free entry with timed booking</text>

  <!-- artwork area -->
  <rect x="640" y="188" width="592" height="424" rx="4" fill="url(#art)"/>
  <g clip-path="url(#artclip)">
    <ellipse cx="960" cy="360" rx="180" ry="150" fill="url(#artglow)"/>
    
    <!-- Fragmented Echo Form -->
    <g filter="url(#soft2)" opacity="0.6">
      <circle cx="930" cy="380" r="85" fill="#e9e0cf"/>
      <circle cx="965" cy="380" r="85" fill="#8a86a0" opacity="0.5"/>
    </g>
    
    <!-- Disjointed Arcs -->
    <g fill="none" stroke="#e9e0cf" opacity="0.85">
      <path d="M 860 380 A 70 70 0 0 1 930 310" stroke-width="1.5"/>
      <path d="M 930 450 A 70 70 0 0 1 1000 380" stroke-width="1.5"/>
      <path d="M 930 380 A 70 70 0 0 1 860 380" stroke-width="1.5" stroke-dasharray="10 4"/>
      <path d="M 940 315 A 85 85 0 0 1 1015 385" stroke-width="0.8" stroke-opacity="0.5"/>
      <path d="M 920 445 A 85 85 0 0 1 845 375" stroke-width="0.8" stroke-opacity="0.5"/>
      <path d="M 970 310 A 85 85 0 0 1 1040 380" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="2 6"/>
    </g>

    <!-- Sharp Intersecting Lines (Scratches) -->
    <g stroke="#e9e0cf" stroke-width="0.75" opacity="0.7">
      <line x1="720" y1="220" x2="1180" y2="560" />
      <line x1="850" y1="180" x2="850" y2="620" stroke-dasharray="2 8" opacity="0.4"/>
      <line x1="650" y1="450" x2="1220" y2="320" />
      <line x1="900" y1="250" x2="1050" y2="500" stroke-width="0.5" opacity="0.5"/>
      <line x1="1080" y1="200" x2="950" y2="580" stroke-width="0.5" opacity="0.5"/>
    </g>

    <!-- Background Particles -->
    <g opacity="0.6">
      <circle cx="700" cy="240" r="2.4" fill="#e9e0cf"/>
      <circle cx="742" cy="214" r="1.6" fill="#e9e0cf"/>
      <circle cx="772" cy="268" r="2" fill="#e9e0cf"/>
      <circle cx="820" cy="232" r="1.4" fill="#e9e0cf"/>
      <circle cx="912" cy="246" r="1.6" fill="#e9e0cf"/>
      <circle cx="1002" cy="262" r="1.4" fill="#e9e0cf"/>
      <circle cx="1046" cy="316" r="2.4" fill="#e9e0cf"/>
      <circle cx="1092" cy="276" r="1.6" fill="#e9e0cf"/>
      <circle cx="1136" cy="330" r="2" fill="#e9e0cf"/>
      <circle cx="716" cy="404" r="2" fill="#e9e0cf"/>
      <circle cx="768" cy="432" r="1.4" fill="#e9e0cf"/>
      <circle cx="824" cy="392" r="2.4" fill="#e9e0cf"/>
      <circle cx="880" cy="448" r="1.6" fill="#e9e0cf"/>
      <circle cx="936" cy="408" r="2" fill="#e9e0cf"/>
      <circle cx="992" cy="462" r="1.4" fill="#e9e0cf"/>
      <circle cx="1048" cy="422" r="2.4" fill="#e9e0cf"/>
      <circle cx="1104" cy="472" r="1.6" fill="#e9e0cf"/>
      <circle cx="1150" cy="432" r="2" fill="#e9e0cf"/>
      <circle cx="730" cy="522" r="1.6" fill="#e9e0cf"/>
      <circle cx="786" cy="556" r="2.2" fill="#e9e0cf"/>
      <circle cx="842" cy="516" r="1.4" fill="#e9e0cf"/>
      <circle cx="900" cy="560" r="2" fill="#e9e0cf"/>
      <circle cx="958" cy="522" r="1.6" fill="#e9e0cf"/>
      <circle cx="1014" cy="566" r="2.4" fill="#e9e0cf"/>
      <circle cx="1070" cy="526" r="1.4" fill="#e9e0cf"/>
      <circle cx="1124" cy="560" r="2" fill="#e9e0cf"/>
    </g>
    
    <rect x="640" y="188" width="592" height="424" fill="url(#vign)"/>
  </g>
  <rect x="640" y="188" width="592" height="424" rx="4" fill="none" stroke="url(#frame)" stroke-width="1.4"/>
  <text x="1216" y="642" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#e9e0cf" fill-opacity="0.5">Mara Voss, Untitled, 2024 · mixed media on paper</text>

  <!-- Extended Atmosphere: Bottom-Right Quadrant -->
  <g opacity="0.4">
    <!-- Faint Horizon Lines -->
    <line x1="640" y1="700" x2="1216" y2="700" stroke="#e9e0cf" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="640" y1="730" x2="1216" y2="730" stroke="#e9e0cf" stroke-width="0.5" stroke-opacity="0.15"/>
    
    <!-- Scattered Particles -->
    <circle cx="720" cy="680" r="1.5" fill="#e9e0cf" opacity="0.5"/>
    <circle cx="780" cy="710" r="2" fill="#e9e0cf" opacity="0.3"/>
    <circle cx="850" cy="675" r="1" fill="#e9e0cf" opacity="0.6"/>
    <circle cx="920" cy="720" r="1.5" fill="#e9e0cf" opacity="0.4"/>
    <circle cx="980" cy="685" r="2.5" fill="#e9e0cf" opacity="0.2"/>
    <circle cx="1050" cy="715" r="1" fill="#e9e0cf" opacity="0.5"/>
    <circle cx="1120" cy="670" r="1.5" fill="#e9e0cf" opacity="0.4"/>
    <circle cx="1180" cy="725" r="2" fill="#e9e0cf" opacity="0.3"/>
    
    <!-- Abstract Geometric Fragment -->
    <path d="M 1080 660 L 1150 690 L 1110 730 Z" fill="none" stroke="#e9e0cf" stroke-width="0.5" stroke-opacity="0.4"/>
    <line x1="1080" y1="660" x2="1110" y2="730" stroke="#e9e0cf" stroke-width="0.5" stroke-opacity="0.2"/>
  </g>

  <!-- footer info -->
  <line x1="64" y1="748" x2="1216" y2="748" stroke="#e9e0cf" stroke-opacity="0.14" stroke-width="1"/>
  <text x="64" y="776" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1" fill="#e9e0cf" fill-opacity="0.85">14 Meridian Street, Riverside District</text>
  <text x="640" y="776" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1" fill="#e9e0cf" fill-opacity="0.85">Tue–Sun · 10:00–18:00 · Closed Mondays</text>
  <text x="1216" y="776" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1" fill="#e9e0cf" fill-opacity="0.85">echoesoftheunseen.art</text>

  <!-- grain overlay -->
  <rect width="1280" height="800" fill="#000000" filter="url(#grain)" opacity="0.06"/>
</svg>