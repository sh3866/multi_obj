  <!-- FEATURE TEXT (Change 1: High-contrast off-white) -->
  <rect x="64" y="224" width="5" height="26" fill="#BC4A24"/>
  <text x="80" y="244" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#BC4A24">FEATURE</text>
  <text x="80" y="286" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#F5F5F0">The Cartography of Leaving</text>
  <text x="80" y="316" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#C9BFA8">By <tspan font-family="Georgia, serif" font-style="italic" fill="#F5F5F0">Amara Osei</tspan>  ·  Essay</text>
  <text x="80" y="352" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#F5F5F0">When a country becomes a sentence you can no longer</text>
  <text x="80" y="378" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#F5F5F0">finish, what does it mean to carry its punctuation</text>
  <text x="80" y="404" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#F5F5F0">across the water? On exile, maps, and the slow</text>
  <text x="80" y="430" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#F5F5F0">grief of a distance that never closes.</text>
  <text x="80" y="470" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#C9BFA8">18 min read · 4,200 words</text>
  <text x="80" y="520" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#BC4A24">Read the feature →</text>

