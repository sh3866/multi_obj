  <text x="64" y="184" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="2" fill="#6E6452">ESSAYS · FICTION · POETRY · CRITICISM — ON GAPS, HORIZONS &amp; THE SPACE BETWEEN</text>
  <text x="1216" y="160" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#6E6452">Twelve stories, one horizon</text>
