  <text x="948" y="712" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#22302F">The Long Way Home</text>
  <text x="948" y="744" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5A5142">Cultural essays on return and belonging.</text>
  <text x="948" y="762" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#5A5142">By <tspan font-family="Georgia, serif" font-style="italic">Samuel Adebayo</tspan></text>

