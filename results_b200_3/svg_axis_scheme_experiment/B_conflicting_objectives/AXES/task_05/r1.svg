  <rect x="64" y="112" width="1152" height="1" fill="#2A4A47" opacity="0.25"/>
  <text x="64" y="156" font-family="Georgia, serif" font-size="32" font-style="italic" fill="#22302F">The Shape of Distance</text>
  <text x="64" y="178" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="2" fill="#6E6452">ESSAYS · FICTION · POETRY · CRITICISM — ON GAPS, HORIZONS &amp; THE SPACE BETWEEN</text>
  <text x="1216" y="156" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#6E6452">Twelve stories, one horizon</text>
