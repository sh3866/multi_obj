  <text x="200" y="225" font-family="Georgia, serif" font-size="12" fill="#22302F">The Cartography of Leaving</text>
  <text x="400" y="225" font-family="Georgia, serif" font-size="12" fill="#3A352C">Letters to a Vanishing Shore</text>
  <text x="630" y="225" font-family="Georgia, serif" font-size="12" fill="#3A352C">The Meridian Sequence</text>
  <text x="840" y="225" font-family="Georgia, serif" font-size="12" fill="#3A352C">Reading the Horizon</text>
  <text x="1040" y="225" font-family="Georgia, serif" font-size="12" fill="#3A352C">The Long Way Home</text>

