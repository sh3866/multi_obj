  <!-- FEATURE TEXT -->
  <rect x="64" y="244" width="5" height="26" fill="#BC4A24"/>
  <text x="80" y="264" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#F5F5DC">FEATURE</text>
  <text x="80" y="306" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#F5F5DC">The Cartography of Leaving</text>
  <text x="80" y="336" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E8DFC8">By <tspan font-family="Georgia, serif" font-style="italic">Amara Osei</tspan>  ·  Essay</text>
  <text x="80" y="372" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#E8DFC8">When a country becomes a sentence you can no longer</text>
  <text x="80" y="398" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#E8DFC8">finish, what does it mean to carry its punctuation</text>
  <text x="80" y="424" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#E8DFC8">across the water? On exile, maps, and the slow</text>
  <text x="80" y="450" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#E8DFC8">grief of a distance that never closes.</text>
  <text x="80" y="490" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#C9BFA8">18 min read · 4,200 words</text>
  <text x="80" y="530" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#E7B45C">Read the feature →</text>

