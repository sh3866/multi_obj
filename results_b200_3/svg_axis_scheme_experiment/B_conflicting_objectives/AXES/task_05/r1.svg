  <text x="84" y="730" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#22302F">Vanishing Shore</text>
  <text x="84" y="756" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#5A5142">By <tspan font-family="Georgia, serif" font-style="italic">Dmitri Vane</tspan></text>

