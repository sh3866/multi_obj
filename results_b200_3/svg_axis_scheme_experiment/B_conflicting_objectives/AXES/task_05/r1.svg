  <text x="884" y="494" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#C9BFA8">No. 11 — The Weight of Names</text>
  <text x="884" y="514" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#C9BFA8">No. 10 — Cartographies of Self</text>
  <text x="884" y="534" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#C9BFA8">No. 9 — The Grammar of Grief</text>
  <text x="884" y="554" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#C9BFA8">No. 8 — Fields of Silence</text>
  
  <line x1="884" y1="578" x2="1192" y2="578" stroke="#F1E9D6" stroke-opacity="0.15" stroke-width="1"/>
  <text x="884" y="604" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#F1E9D6">About the Review</text>
  <text x="884" y="628" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#C9BFA8">An independent literary journal exploring</text>
  <text x="884" y="646" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#C9BFA8">the intersections of literature, culture, and</text>
  <text x="884" y="664" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#C9BFA8">the spaces between.</text>

