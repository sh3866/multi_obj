<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14121e"/>
      <stop offset="0.5" stop-color="#0f0e17"/>
      <stop offset="1" stop-color="#0a0910"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#e9e0cf" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#e9e0cf" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#e9e0cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e9dc"/>
      <stop offset="1" stop-color="#d8cdb8"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1826"/>
      <stop offset="1" stop-color="#0d0b13"/>
    </linearGradient>
    <linearGradient id="artglow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e0cf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e9e0cf" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 H0 V44" fill="none" stroke="#e9e0cf" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="artclip"><rect x="640" y="188" width="592" height="424" rx="4"/></clipPath>
  </defs>

  <!-- base -->
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <ellipse cx="860" cy="380" rx="560" ry="470" fill="url(#glow)"/>

  <!-- top bar -->
  <text x="64" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="6" fill="#e9e0cf">MUSEUM OF ABSENT FORM</text>
  <text x="1216" y="58" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#e9e0cf" fill-opacity="0.6">CONTEMPORARY ART · 2024</text>
  <line x1="64" y1="74" x2="1216" y2="74" stroke="#e9e0cf" stroke-opacity="0.14" stroke-width="1"/>

  <!-- left content -->
  <text x="64" y="176" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="5" fill="#c9bfa8">A SOLO EXHIBITION</text>
  <text x="64" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="82" fill="#efe7d6">Echoes of</text>
  <text x="64" y="336" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-style="italic" fill="#efe7d6">the Unseen</text>
  <rect x="64" y="362" width="120" height="1" fill="#c9bfa8"/>
  <text x="64" y="404" font-family="Helvetica, Arial, sans-serif" font-size="21" letter-spacing="1" fill="#e9e0cf">Mara Voss</text>
  <text x="64" y="432" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#e9e0cf" fill-opacity="0.6">WORKS ON PAPER · SOUND · LIGHT</text>

  <!-- dates -->
  <line x1="64" y1="470" x2="180" y2="470" stroke="#e9e0cf" stroke-opacity="0.3" stroke-width="1"/>
  <text x="64" y="498" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4" fill="#c9bfa8">EXHIBITION DATES</text>
  <text x="64" y="532" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#e9e0cf">14 June — 28 September 2024</text>

  <!-- curatorial statement -->
  <text x="64" y="570" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#c9bfa8">CURATORIAL STATEMENT</text>
  <text x="64" y="598" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e9e0cf" fill-opacity="0.82">Voss composes from the residue of memory —</text>
  <text x="64" y="620" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e9e0cf" fill-opacity="0.82">the silences that remain after a presence leaves.</text>
  <text x="64" y="642" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e9e0cf" fill-opacity="0.82">Across layered paper, sound and light, her work</text>
  <text x="64" y="664" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e9e0cf" fill-opacity="0.82">holds absence at a distance close enough to touch.</text>

  <!-- CTA -->
  <rect x="58" y="688" width="248" height="66" rx="4" fill="none" stroke="#e9e0cf" stroke-opacity="0.4" stroke-width="1.5" filter="url(#glowBlur)"/>
  <rect x="64" y="692" width="236" height="58" rx="3" fill="url(#cta)"/>
  <text x="182" y="720" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#14121e">RESERVE TICKETS</text>
  <text x="182" y="738" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1" fill="#14121e" fill-opacity="0.75">Free entry with timed booking</text>

  <!-- artwork area -->
  <rect x="640" y="188" width="592" height="424" rx="4" fill="url(#art)" filter="url(#shadowBlur)"/>
  <g clip-path="url(#artclip)">
    <ellipse cx="960" cy="360" rx="180" ry="150" fill="url(#artglow)"/>
    <g filter="url(#soft)" opacity="0.55">
      <circle cx="860" cy="330" r="70" fill="#e9e0cf"/>
      <circle cx="1080" cy="470" r="55" fill="#8a86a0"/>
      <circle cx="760" cy="500" r="40" fill="#e9e0cf"/>
    </g>
    <g opacity="0.7" stroke="#e9e0cf" fill="none">
      <path d="M700 250 C 820 230, 900 300, 1020 280" stroke-width="1" stroke-opacity="0.5"/>
      <path d="M720 360 C 860 340, 960 420, 1150 380" stroke-width="1" stroke-opacity="0.35"/>
      <path d="M760 540 C 900 560, 1000 470, 1180 500" stroke-width="1" stroke-opacity="0.4"/>
    </g>
    <!-- fragmented geometric shapes / glitch lines -->
    <g opacity="0.85">
      <!-- sharp angular fragments -->
      <polygon points="880,280 920,310 890,340 850,320" fill="#e9e0cf" fill-opacity="0.15"/>
      <polygon points="1020,400 1060,430 1030,460 990,440" fill="#8a86a0" fill-opacity="0.2"/>
      <polygon points="780,450 810,480 780,510 750,490" fill="#e9e0cf" fill-opacity="0.12"/>
      <!-- glitch lines - high contrast horizontal breaks -->
      <line x1="820" y1="320" x2="980" y2="320" stroke="#e9e0cf" stroke-width="2" stroke-opacity="0.6"/>
      <line x1="840" y1="325" x2="960" y2="325" stroke="#8a86a0" stroke-width="1.5" stroke-opacity="0.5"/>
      <line x1="900" y1="420" x2="1080" y2="420" stroke="#e9e0cf" stroke-width="2" stroke-opacity="0.5"/>
      <line x1="920" y1="425" x2="1060" y2="425" stroke="#8a86a0" stroke-width="1" stroke-opacity="0.4"/>
      <line x1="750" y1="480" x2="880" y2="480" stroke="#e9e0cf" stroke-width="1.5" stroke-opacity="0.45"/>
      <!-- sharp diagonal cuts -->
      <line x1="860" y1="250" x2="920" y2="350" stroke="#e9e0cf" stroke-width="1" stroke-opacity="0.35"/>
      <line x1="1000" y1="380" x2="1060" y2="480" stroke="#8a86a0" stroke-width="1" stroke-opacity="0.3"/>
      <line x1="780" y1="420" x2="840" y2="520" stroke="#e9e0cf" stroke-width="1" stroke-opacity="0.3"/>
      <!-- fragmented triangles -->
      <polygon points="940,260 970,290 930,300" fill="none" stroke="#e9e0cf" stroke-width="1" stroke-opacity="0.4"/>
      <polygon points="1050,450 1080,480 1040,490" fill="none" stroke="#8a86a0" stroke-width="1" stroke-opacity="0.35"/>
      <polygon points="760,380 790,410 750,420" fill="none" stroke="#e9e0cf" stroke-width="1" stroke-opacity="0.35"/>
    </g>
    <g opacity="0.85">
      <circle cx="700" cy="240" r="2.4" fill="#e9e0cf"/>
      <circle cx="742" cy="214" r="1.6" fill="#e9e0cf"/>
      <circle cx="772" cy="268" r="2" fill="#e9e0cf"/>
      <circle cx="820" cy="232" r="1.4" fill="#e9e0cf"/>
      <circle cx="866" cy="286" r="2.6" fill="#e9e0cf"/>
      <circle cx="912" cy="246" r="1.6" fill="#e9e0cf"/>
      <circle cx="956" cy="300" r="2" fill="#e9e0cf"/>
      <circle cx="1002" cy="262" r="1.4" fill="#e9e0cf"/>
      <circle cx="1046" cy="316" r="2.4" fill="#e9e0cf"/>
      <circle cx="1092" cy="276" r="1.6" fill="#e9e0cf"/>
      <circle cx="1136" cy="330" r="2" fill="#e9e0cf"/>
      <circle cx="716" cy="404" r="2" fill="#e9e0cf"/>
      <circle cx="768" cy="432" r="1.4" fill="#e9e0cf"/>
      <circle cx="824" cy="392" r="2.4" fill="#e9e0cf"/>
      <circle cx="880" cy="448" r="1.6" fill="#e9e0cf"/>
      <circle cx="936" cy="408" r="2" fill="#e9e0cf"/>
      <circle cx="992" cy="462" r="1.4" fill="#e9e0cf"/>
      <circle cx="1048" cy="422" r="2.4" fill="#e9e0cf"/>
      <circle cx="1104" cy="472" r="1.6" fill="#e9e0cf"/>
      <circle cx="1150" cy="432" r="2" fill="#e9e0cf"/>
      <circle cx="730" cy="522" r="1.6" fill="#e9e0cf"/>
      <circle cx="786" cy="556" r="2.2" fill="#e9e0cf"/>
      <circle cx="842" cy="516" r="1.4" fill="#e9e0cf"/>
      <circle cx="900" cy="560" r="2" fill="#e9e0cf"/>
      <circle cx="958" cy="522" r="1.6" fill="#e9e0cf"/>
      <circle cx="1014" cy="566" r="2.4" fill="#e9e0cf"/>
      <circle cx="1070" cy="526" r="1.4" fill="#e9e0cf"/>
      <circle cx="1124" cy="560" r="2" fill="#e9e0cf"/>
    </g>
    <rect x="640" y="188" width="592" height="424" fill="url(#vign)"/>
  </g>
  <text x="1216" y="642" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#e9e0cf" fill-opacity="0.5">Mara Voss, Untitled, 2024 · mixed media on paper</text>

  <!-- footer info -->
  <line x1="64" y1="748" x2="1216" y2="748" stroke="#e9e0cf" stroke-opacity="0.14" stroke-width="1"/>
  <text x="64" y="776" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="1" fill="#e9e0cf">14 Meridian Street, Riverside District</text>
  <text x="640" y="776" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="1" fill="#e9e0cf">Tue–Sun · 10:00–18:00 · Closed Mondays</text>
  <text x="1216" y="776" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1" fill="#e9e0cf" fill-opacity="0.6">echoesoftheunseen.art</text>

  <!-- grain overlay -->
  <rect width="1280" height="800" fill="#000000" filter="url(#grain)" opacity="0.06"/>
</svg>