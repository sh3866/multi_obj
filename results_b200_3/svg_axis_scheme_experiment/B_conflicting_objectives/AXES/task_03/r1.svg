<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f1e6"/>
      <stop offset="1" stop-color="#ece4d3"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbf8f1"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4a259"/>
      <stop offset="0.5" stop-color="#e76f51"/>
      <stop offset="1" stop-color="#c1121f"/>
    </linearGradient>
    <linearGradient id="tempArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e76f51" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e76f51" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="rainBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a9d8f"/>
      <stop offset="1" stop-color="#1d7d74"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a86ff"/>
      <stop offset="1" stop-color="#1d3557"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#3a2f1e" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Georgia, "Times New Roman", serif; }
      .sans { font-family: "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="800" fill="url(#bg)"/>
  <g stroke="#d8cdb6" stroke-width="1" fill="none" opacity="0.5">
    <path d="M0 120 Q 320 90 640 120 T 1280 120"/>
    <path d="M0 700 Q 320 730 640 700 T 1280 700"/>
  </g>
  <rect x="0" y="0" width="1280" height="8" fill="#c1121f"/>

  <!-- ============ HEADER ============ -->
  <text x="48" y="52" class="sans" font-size="12" letter-spacing="4" fill="#8a7a5c">CITY CLIMATE BRIEF · 2035</text>
  <text x="48" y="98" font-size="40" font-weight="bold" fill="#2b2417">Port Aurora — a coast under pressure</text>
  <text x="48" y="128" class="sans" font-size="15" fill="#5a5142">Hotter summers, heavier downpours and a rising sea are converging on our shoreline.</text>
  <text x="48" y="148" class="sans" font-size="15" fill="#5a5142">By 2035, Port Aurora is hotter, wetter in bursts, and exposed to coastal flood risk.</text>

  <!-- ============ INDICATOR 1 : TEMPERATURE ============ -->
  <g filter="url(#softShadow)">
    <rect x="48" y="172" width="384" height="168" rx="12" fill="#fdf5f3" stroke="#e6ddc9"/>
  </g>
  <rect x="48" y="172" width="384" height="6" rx="3" fill="url(#heat)"/>
  <text x="72" y="204" class="sans" font-size="13" letter-spacing="2" fill="#8a7a5c">TEMPERATURE INCREASE</text>
  <text x="72" y="262" font-size="46" font-weight="bold" fill="#c1121f">+1.8°C</text>
  <text x="72" y="288" class="sans" font-size="13" fill="#5a5142">warmer than the 1990–2010 average</text>
  <g transform="translate(352,220)">
    <path d="M0 44 L14 12 L22 26 L30 0 L38 30 L46 18 L54 44 Z" fill="url(#heat)" opacity="0.85"/>
    <line x1="0" y1="44" x2="54" y2="44" stroke="#c1121f" stroke-width="1.5"/>
  </g>

  <!-- ============ INDICATOR 2 : RAINFALL ============ -->
  <g filter="url(#softShadow)">
    <rect x="448" y="172" width="384" height="168" rx="12" fill="#f0f8f7" stroke="#e6ddc9"/>
  </g>
  <rect x="448" y="172" width="384" height="6" rx="3" fill="url(#rainBar)"/>
  <text x="472" y="204" class="sans" font-size="13" letter-spacing="2" fill="#8a7a5c">RAINFALL CHANGE</text>
  <text x="472" y="262" font-size="46" font-weight="bold" fill="#1d7d74">+30%</text>
  <text x="472" y="288" class="sans" font-size="13" fill="#5a5142">more rain in fewer, heavier events</text>
  <g transform="translate(752,214)">
    <g fill="#2a9d8f">
      <circle cx="10" cy="6" r="5"/><circle cx="26" cy="14" r="4"/><circle cx="6" cy="22" r="4"/>
      <circle cx="24" cy="30" r="5"/><circle cx="12" cy="40" r="4"/><circle cx="30" cy="46" r="3"/>
    </g>
  </g>

  <!-- ============ INDICATOR 3 : SEA LEVEL ============ -->
  <g filter="url(#softShadow)">
    <rect x="848" y="172" width="384" height="168" rx="12" fill="#f0f5fa" stroke="#e6ddc9"/>
  </g>
  <rect x="848" y="172" width="384" height="6" rx="3" fill="url(#sea)"/>
  <text x="872" y="204" class="sans" font-size="13" letter-spacing="2" fill="#8a7a5c">SEA-LEVEL RISE</text>
  <text x="872" y="262" font-size="46" font-weight="bold" fill="#1d3557">+0.45 m</text>
  <text x="872" y="288" class="sans" font-size="13" fill="#5a5142">projected coastal rise by 2035</text>
  <g transform="translate(1148,214)">
    <path d="M0 34 Q 12 24 24 34 T 48 34 T 72 34" fill="none" stroke="#3a86ff" stroke-width="3"/>
    <path d="M0 44 Q 12 34 24 44 T 48 44 T 72 44" fill="none" stroke="#1d3557" stroke-width="3"/>
    <path d="M40 8 L40 26 M33 20 L40 27 L47 20" fill="none" stroke="#1d3557" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ============ CHART 1 : MONTHLY TEMPERATURE ============ -->
  <g filter="url(#softShadow)">
    <rect x="48" y="356" width="584" height="320" rx="12" fill="url(#card)" stroke="#e6ddc9"/>
  </g>
  <text x="72" y="388" font-size="20" font-weight="bold" fill="#2b2417">Monthly temperature trend</text>
  <text x="72" y="410" class="sans" font-size="12" fill="#8a7a5c">Mean °C · 1990–2010 (dashed) vs 2035 (solid)</text>

  <!-- chart area: x 100..600 (500), y 430..640 (210) -->
  <g stroke="#e3dac6" stroke-width="1">
    <line x1="100" y1="430" x2="600" y2="430"/>
    <line x1="100" y1="482.5" x2="600" y2="482.5"/>
    <line x1="100" y1="535" x2="600" y2="535"/>
    <line x1="100" y1="587.5" x2="600" y2="587.5"/>
    <line x1="100" y1="640" x2="600" y2="640"/>
  </g>
  <g class="sans" font-size="11" fill="#8a7a5c" text-anchor="end">
    <text x="92" y="434">30</text>
    <text x="92" y="486.5">25</text>
    <text x="92" y="539">20</text>
    <text x="92" y="591.5">15</text>
    <text x="92" y="644">10</text>
  </g>

  <path d="M100 587.5 L145.5 571.7 L191 555.8 L236.4 524.2 L281.8 487.5 L327.3 455.8 L372.7 430 L418.2 455.8 L463.6 487.5 L509.1 524.2 L554.5 555.8 L600 571.7 L600 640 L100 640 Z" fill="url(#tempArea)"/>
  <polyline points="100,613.3 145.5,602.5 191,587.5 236.4,561.7 281.8,535 327.3,509.2 372.7,487.5 418.2,509.2 463.6,535 509.1,561.7 554.5,587.5 600,602.5" fill="none" stroke="#b7a98a" stroke-width="2" stroke-dasharray="5 4"/>
  <polyline points="100,587.5 145.5,571.7 191,555.8 236.4,524.2 281.8,487.5 327.3,455.8 372.7,430 418.2,455.8 463.6,487.5 509.1,524.2 554.5,555.8 600,571.7" fill="none" stroke="#e76f51" stroke-width="3"/>
  <g fill="#e76f51">
    <circle cx="100" cy="587.5" r="3.5"/><circle cx="145.5" cy="571.7" r="3.5"/><circle cx="191" cy="555.8" r="3.5"/>
    <circle cx="236.4" cy="524.2" r="3.5"/><circle cx="281.8" cy="487.5" r="3.5"/><circle cx="327.3" cy="455.8" r="3.5"/>
    <circle cx="372.7" cy="430" r="3.5"/><circle cx="418.2" cy="455.8" r="3.5"/><circle cx="463.6" cy="487.5" r="3.5"/>
    <circle cx="509.1" cy="524.2" r="3.5"/><circle cx="554.5" cy="555.8" r="3.5"/><circle cx="600" cy="571.7" r="3.5"/>
  </g>
  <g class="sans" font-size="10" fill="#8a7a5c" text-anchor="middle">
    <text x="100" y="660">Jan</text><text x="145.5" y="660">Feb</text><text x="191" y="660">Mar</text>
    <text x="236.4" y="660">Apr</text><text x="281.8" y="660">May</text><text x="327.3" y="660">Jun</text>
    <text x="372.7" y="660">Jul</text><text x="418.2" y="660">Aug</text><text x="463.6" y="660">Sep</text>
    <text x="509.1" y="660">Oct</text><text x="554.5" y="660">Nov</text><text x="600" y="660">Dec</text>
  </g>
  <g class="sans" font-size="12" fill="#5a5142">
    <line x1="100" y1="686" x2="126" y2="686" stroke="#e76f51" stroke-width="3"/>
    <text x="132" y="690">2035</text>
    <line x1="180" y1="686" x2="206" y2="686" stroke="#b7a98a" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="212" y="690">1990–2010</text>
  </g>

  <!-- ============ CHART 2 : RAINFALL / FLOOD RISK ============ -->
  <g filter="url(#softShadow)">
    <rect x="648" y="356" width="584" height="320" rx="12" fill="url(#card)" stroke="#e6ddc9"/>
  </g>
  <text x="672" y="388" font-size="20" font-weight="bold" fill="#2b2417">Monthly rainfall &amp; flood risk</text>
  <text x="672" y="410" class="sans" font-size="12" fill="#8a7a5c">Rainfall (mm) by month · red outline = flood-risk months</text>

  <g stroke="#e3dac6" stroke-width="1">
    <line x1="700" y1="430" x2="1180" y2="430"/>
    <line x1="700" y1="482.5" x2="1180" y2="482.5"/>
    <line x1="700" y1="535" x2="1180" y2="535"/>
    <line x1="700" y1="587.5" x2="1180" y2="587.5"/>
    <line x1="700" y1="640" x2="1180" y2="640"/>
  </g>
  <g class="sans" font-size="11" fill="#8a7a5c" text-anchor="end">
    <text x="692" y="434">300</text><text x="692" y="486.5">225</text>
    <text x="692" y="539">150</text><text x="692" y="591.5">75</text><text x="692" y="644">0</text>
  </g>

  <!-- flood risk band (high-risk months May–Sep) -->
  <rect x="847" y="430" width="245" height="210" fill="#c1121f" opacity="0.06"/>
  <!-- HIGH FLOOD RISK WINDOW label moved to top-right corner of chart card -->
  <text x="1216" y="376" class="sans" font-size="11" fill="#c1121f" text-anchor="end" letter-spacing="1">HIGH FLOOD-RISK WINDOW</text>

  <!-- bars (center x, width 26) - unified teal, red outline for risk months -->
  <g>
    <rect x="706" y="561.7" width="26" height="78.3" rx="3" fill="#2a9d8f"/>
    <rect x="746.5" y="550.8" width="26" height="89.2" rx="3" fill="#2a9d8f"/>
    <rect x="787" y="525" width="26" height="115" rx="3" fill="#2a9d8f"/>
    <rect x="827.5" y="487.5" width="26" height="152.5" rx="3" fill="#2a9d8f"/>
    <rect x="868" y="450.8" width="26" height="189.2" rx="3" fill="#2a9d8f" stroke="#c1121f" stroke-width="2"/>
    <rect x="908.5" y="435" width="26" height="205" rx="3" fill="#2a9d8f" stroke="#c1121f" stroke-width="2"/>
    <rect x="949" y="444.2" width="26" height="195.8" rx="3" fill="#2a9d8f" stroke="#c1121f" stroke-width="2"/>
    <rect x="989.5" y="465.8" width="26" height="174.2" rx="3" fill="#2a9d8f" stroke="#c1121f" stroke-width="2"/>
    <rect x="1030" y="503.3" width="26" height="136.7" rx="3" fill="#2a9d8f"/>
    <rect x="1070.5" y="535" width="26" height="105" rx="3" fill="#2a9d8f"/>
    <rect x="1111" y="561.7" width="26" height="78.3" rx="3" fill="#2a9d8f"/>
    <rect x="1151.5" y="571.7" width="26" height="68.3" rx="3" fill="#2a9d8f"/>
  </g>
  <!-- value labels on peak bars -->
  <g class="sans" font-size="10" fill="#1d3557" text-anchor="middle">
    <text x="921.5" y="428">290</text>
    <text x="962" y="437">277</text>
  </g>
  <g class="sans" font-size="10" fill="#8a7a5c" text-anchor="middle">
    <text x="719" y="660">Jan</text><text x="759.5" y="660">Feb</text><text x="800" y="660">Mar</text>
    <text x="840.5" y="660">Apr</text><text x="881" y="660">May</text><text x="921.5" y="660">Jun</text>
    <text x="962" y="660">Jul</text><text x="1002.5" y="660">Aug</text><text x="1043" y="660">Sep</text>
    <text x="1083.5" y="660">Oct</text><text x="1124" y="660">Nov</text><text x="1164.5" y="660">Dec</text>
  </g>
  <g class="sans" font-size="12" fill="#5a5142">
    <rect x="700" y="678" width="14" height="14" rx="2" fill="#2a9d8f"/>
    <text x="720" y="690">Rainfall</text>
    <rect x="800" y="678" width="14" height="14" rx="2" fill="#2a9d8f" stroke="#c1121f" stroke-width="2"/>
    <text x="820" y="690">Flood-risk month</text>
    <rect x="950" y="678" width="14" height="14" rx="2" fill="#c1121f" opacity="0.15"/>
    <text x="970" y="690">Risk window</text>
  </g>

  <!-- ============ DISTRICTS ============ -->
  <g filter="url(#softShadow)">
    <rect x="48" y="692" width="384" height="84" rx="12" fill="url(#card)" stroke="#e6ddc9"/>
  </g>
  <text x="72" y="718" class="sans" font-size="12" letter-spacing="2" fill="#8a7a5c">HIGH-RISK DISTRICTS</text>
  <!-- location badges -->
  <g class="sans">
    <!-- Old Harbor -->
    <circle cx="80" cy="736" r="5" fill="#c1121f"/>
    <circle cx="80" cy="736" r="8" fill="none" stroke="#c1121f" stroke-width="1" opacity="0.3"/>
    <text x="96" y="740" font-size="13" fill="#2b2417">Old Harbor</text>
    <text x="96" y="756" font-size="11" fill="#8a7a5c">Sea-level · tidal surge</text>
    <!-- Millbrook -->
    <circle cx="220" cy="736" r="5" fill="#e76f51"/>
    <circle cx="220" cy="736" r="8" fill="none" stroke="#e76f51" stroke-width="1" opacity="0.3"/>
    <text x="236" y="740" font-size="13" fill="#2b2417">Millbrook</text>
    <text x="236" y="756" font-size="11" fill="#8a7a5c">Flash flooding</text>
    <!-- South Pier -->
    <circle cx="350" cy="736" r="5" fill="#1d3557"/>
    <circle cx="350" cy="736" r="8" fill="none" stroke="#1d3557" stroke-width="1" opacity="0.3"/>
    <text x="366" y="740" font-size="13" fill="#2b2417">South Pier</text>
    <text x="366" y="756" font-size="11" fill="#8a7a5c">Coastal erosion</text>
  </g>

  <!-- ============ ACTIONS ============ -->
  <g filter="url(#softShadow)">
    <rect x="448" y="692" width="384" height="84" rx="12" fill="url(#card)" stroke="#e6ddc9"/>
  </g>
  <text x="472" y="718" class="sans" font-size="12" letter-spacing="2" fill="#8a7a5c">RECOMMENDED ACTIONS</text>
  <g class="sans" font-size="12" fill="#2b2417">
    <text x="472" y="740">1 · Expand green infrastructure</text>
    <text x="472" y="758">2 · Upgrade drainage &amp; coastal defenses</text>
  </g>

  <!-- ============ SOURCE / CONCLUSION ============ -->
  <g filter="url(#softShadow)">
    <rect x="848" y="692" width="384" height="84" rx="12" fill="url(#card)" stroke="#e6ddc9"/>
  </g>
  <text x="872" y="718" class="sans" font-size="12" letter-spacing="2" fill="#8a7a5c">CONCLUSION &amp; SOURCE</text>
  <text x="872" y="740" class="sans" font-size="12" fill="#2b2417">Port Aurora is becoming hotter, wetter in bursts,</text>
  <text x="872" y="756" class="sans" font-size="12" fill="#2b2417">and exposed to coastal flood risk.</text>
  <text x="872" y="772" class="sans" font-size="10" fill="#8a7a5c">Source: Port Aurora Climate Office, 2035 projection model.</text>
</svg>