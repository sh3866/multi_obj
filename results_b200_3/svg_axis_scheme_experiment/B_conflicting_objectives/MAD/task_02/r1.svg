<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14121e"/>
      <stop offset="0.5" stop-color="#0f0e17"/>
      <stop offset="1" stop-color="#0a0910"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#e9e0cf" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#e9e0cf" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#e9e0cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e9dc"/>
      <stop offset="1" stop-color="#d8cdb8"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e0cf" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#e9e0cf" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#e9e0cf" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1826"/>
      <stop offset="1" stop-color="#0d0b13"/>
    </linearGradient>
    <linearGradient id="artglow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e0cf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e9e0cf" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 H0 V44" fill="none" stroke="#e9e0cf" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="artclip"><rect x="640" y="188" width="592" height="424" rx="4"/></clipPath>
  </defs>

  <!-- base -->
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <ellipse cx="860" cy="380" rx="560" ry="470" fill="url(#glow)"/>

  <!-- top bar -->
  <text x="64" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="6" fill="#e9e0cf">MUSEUM OF ABSENT FORM</text>
  <text x="1216" y="58" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#e9e0cf" fill-opacity="0.6">CONTEMPORARY ART · 2024</text>
  <line x1="64" y1="74" x2="1216" y2="74" stroke="#e9e0cf" stroke-opacity="0.14" stroke-width="1"/>

  <!-- left content -->
  <text x="64" y="176" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="5" fill="#c9bfa8">A SOLO EXHIBITION</text>
  <text x="64" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="82" fill="#efe7d6">Echoes of</text>
  <text x="64" y="336" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-style="italic" fill="#efe7d6">the Unseen</text>
  <rect x="64" y="362" width="60" height="3" fill="#c9bfa8"/>
  <text x="64" y="404" font-family="Helvetica, Arial, sans-serif" font-size="21" letter-spacing="1" fill="#e9e0cf">Mara Voss</text>
  <text x="64" y="432" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#e9e0cf" fill-opacity="0.6">WORKS ON PAPER · SOUND · LIGHT</text>

  <!-- dates -->
  <line x1="64" y1="470" x2="180" y2="470" stroke="#e9e0cf" stroke-opacity="0.3" stroke-width="1"/>
  <text x="64" y="498" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4" fill="#c9bfa8">EXHIBITION DATES</text>
  <text x="64" y="532" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#e9e0cf">14 June — 28 September 2024</text>

  <!-- curatorial statement -->
  <text x="64" y="570" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#c9bfa8">CURATORIAL STATEMENT</text>
  <text x="64" y="598" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e9e0cf" fill-opacity="0.82">Voss composes from the residue of memory —</text>
  <text x="64" y="620" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e9e0cf" fill-opacity="0.82">the silences that remain after a presence leaves.</text>
  <text x="64" y="642" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e9e0cf" fill-opacity="0.82">Across layered paper, sound and light, her work</text>
  <text x="64" y="664" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#e9e0cf" fill-opacity="0.82">holds absence at a distance close enough to touch.</text>

  <!-- CTA -->
  <rect x="64" y="682" width="236" height="54" rx="3" fill="url(#cta)"/>
  <text x="182" y="716" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#14121e">RESERVE TICKETS</text>
  <text x="322" y="715" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1" fill="#e9e0cf" fill-opacity="0.55">Free entry with timed booking</text>

  <!-- artwork area -->
  <rect x="640" y="188" width="592" height="424" rx="4" fill="url(#art)"/>
  <g clip-path="url(#artclip)">
    <ellipse cx="960" cy="360" rx="180" ry="150" fill="url(#artglow)"/>
    <g filter="url(#soft)" opacity="0.4">
      <circle cx="860" cy="330" r="70" fill="#e9e0cf"/>
      <circle cx="1080" cy="470" r="55" fill="#8a86a0"/>
      <circle cx="760" cy="500" r="40" fill="#e9e0cf"/>
    </g>
    <!-- Concentric offset rings -->
    <g opacity="0.85" stroke="#e9e0cf" fill="none">
      <circle cx="936" cy="400" r="90" stroke-width="2" stroke-opacity="0.9"/>
      <circle cx="960" cy="400" r="130" stroke-width="1.2" stroke-opacity="0.5"/>
      <circle cx="912" cy="400" r="170" stroke-width="0.8" stroke-opacity="0.3"/>
    </g>
    <!-- Core geometric debris -->
    <g opacity="0.9">
      <circle cx="880" cy="320" r="2.4" fill="#e9e0cf"/>
      <circle cx="980" cy="340" r="1.8" fill="#e9e0cf"/>
      <circle cx="860" cy="440" r="2.2" fill="#e9e0cf"/>
      <circle cx="1020" cy="460" r="1.6" fill="#e9e0cf"/>
      <circle cx="920" cy="260" r="2.0" fill="#e9e0cf"/>
      <circle cx="1040" cy="380" r="2.4" fill="#e9e0cf"/>
      <circle cx="840" cy="380" r="1.8" fill="#e9e0cf"/>
      <circle cx="960" cy="500" r="2.0" fill="#e9e0cf"/>
      <circle cx="890" cy="280" r="1.4" fill="#e9e0cf"/>
      <circle cx="1010" cy="480" r="1.8" fill="#e9e0cf"/>
      <circle cx="850" cy="480" r="1.6" fill="#e9e0cf"/>
      <circle cx="1030" cy="300" r="1.4" fill="#e9e0cf"/>
    </g>
    <rect x="640" y="188" width="592" height="424" fill="url(#vign)"/>
  </g>
  <rect x="640" y="188" width="592" height="424" rx="4" fill="none" stroke="url(#frame)" stroke-width="1.4"/>
  
  <!-- Bleeding Debris (Spatial Tension - strictly outside text column and art box) -->
  <g opacity="0.85">
    <circle cx="620" cy="280" r="2.2" fill="#e9e0cf"/>
    <circle cx="610" cy="320" r="1.6" fill="#e9e0cf"/>
    <circle cx="625" cy="360" r="1.8" fill="#e9e0cf"/>
    <circle cx="615" cy="440" r="2.4" fill="#e9e0cf"/>
    <circle cx="605" cy="480" r="1.4" fill="#e9e0cf"/>
    <circle cx="1240" cy="340" r="2.0" fill="#e9e0cf"/>
    <circle cx="1250" cy="380" r="1.6" fill="#e9e0cf"/>
    <circle cx="1235" cy="420" r="2.2" fill="#e9e0cf"/>
    <circle cx="1245" cy="460" r="1.8" fill="#e9e0cf"/>
    <circle cx="1230" cy="500" r="1.4" fill="#e9e0cf"/>
  </g>

  <text x="1216" y="642" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#e9e0cf" fill-opacity="0.5">Mara Voss, Untitled, 2024 · mixed media on paper</text>

  <!-- footer info -->
  <line x1="64" y1="748" x2="1216" y2="748" stroke="#e9e0cf" stroke-opacity="0.14" stroke-width="1"/>
  <text x="64" y="776" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1" fill="#e9e0cf" fill-opacity="0.6">14 Meridian Street, Riverside District</text>
  <text x="640" y="776" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1" fill="#e9e0cf" fill-opacity="0.6">Tue–Sun · 10:00–18:00 · Closed Mondays</text>
  <text x="1216" y="776" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1" fill="#e9e0cf" fill-opacity="0.6">echoesoftheunseen.art</text>

  <!-- grain overlay -->
  <rect width="1280" height="800" fill="#000000" filter="url(#grain)" opacity="0.06"/>
</svg>